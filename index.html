     글자는 감청, 포인트 마크만 마젠타. 그래서 맨 위 줄은 감청이고

  :root {

    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;

    --cat-5: #8A5A2B;
    --kiwoom-deep: #1A399E;
    --kiwoom-point: #EC008C;

    --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',

    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {

      --surface: #151D2B;

      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 감청 원색은 어두운 종이에서 1.9:1까지 떨어져 줄이 보이지 않는다.
         마젠타도 한 단계 올려 짝을 맞춘다. 각각 6.2:1, 6.6:1. */

      --kiwoom-point: #FF5FB4;

  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야
     구분선이 아니라 종이의 테두리로 읽힌다. */
  .topline { height: 4px; background: var(--kiwoom-deep); }

  /* 수집이 멈춰도 index.html은 그대로 남아 아무 일 없어 보인다. 그래서
     보는 사람의 시계와 비교해 묵은 정도를 화면에서 직접 말한다.

    padding: 10px 20px;
    background: var(--hot);
    color: var(--paper);
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
  }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {

    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;

    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom-point);

    font-weight: 400;

    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;

  }

    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */
  .group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;

  .rail button {

    display: block;
    padding: 12px 4px 0;

    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;

    font-family: var(--font-mono);

    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);

  .filters button {

    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */

    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

    grid-template-columns: 48px 1fr;

    padding: 26px 0;
    border-bottom: 1px solid var(--rule);

    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;

    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;

    display: flex;
    align-items: center;

  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

    .page { padding: 28px 16px 60px; }

    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

rticle/20261020500333"}, {"id": "6006be01159b", "title": "내 퇴직연금, 국민연금이 굴릴까…기금형 도입에 갈리는 운용 방식", "summary": "당정은 국정감사 이후 정부안과 여당 의원 법안을 통합해 기금형 퇴직연금 입법 논의를 본격화할 예정이나 운용 주체와 적용 범위는 아직 확정되지 않았다. 한정애 의원안은 적립금 3000억원 이상 또는 가입자 3만명 이상 사업장에 노사 공동 수탁법인을, 안도걸 의원안은 민간 전문운용사 간 경쟁을, 박홍배·안호영 의원안은 퇴직연금공단 설립을 담았다. 이용우 의원안은 국민연금공단 등 공적연금기관이 사업자로 참여하도록 하되 시장점유율을 시행 후 3년까지 10%, 4년째 20%, 5년째 30%로 제한했다. 공공기관 개방형 기금의 도입·운영 비용은 국가가 부담하도록 했다.", "category": "제도·규제", "importance": 4, "source": "데일리팝", "published": "2026-10-21", "url": "http://www.dailypop.kr/news/articleView.html?idxno=103463"}, {"id": "11d18d6258e3", "title": "주식·채권 동반 급락에… ‘알아서 굴려준다’던 TDF의 배신", "summary": "에프엔가이드에 따르면 설정액 10억원 이상 TDF의 최근 3개월 수익률은 -7.07%, 6개월 수익률은 -2.88%로 국내 혼합형 펀드(-5.01%, -2.00%)보다 부진했다. 최근 5년 수익률도 TDF는 28.07%로 국내 주식형 펀드(86.70%)와 혼합형 펀드(29.70%)에 못 미쳤다. 주식과 채권 가격이 동반 하락하면서 채권이 주식 하락을 방어하는 기능이 작동하지 않은 탓이다. TDF 순자산은 2020년 말 5조원 수준에서 10월 20일 기준 32조7000억원으로 늘었고 올해 증가분만 7조2000억원이 넘는다.", "category": "운용·상품", "importance": 4, "source": "조선비즈", "published": "2026-10-21", "url": "https://biz.chosun.com/stock/stock_general/2026/10/21/IQNNSP3Z2NHLJFSXM7CGVI2PDQ/"}, {"id": "b4b11f82c66f", "title": "[단독]'2兆 규모' 中企퇴직연기금…운용기관 차등배분 2년째 0%대", "summary": "2022년 도입된 공적 기금형 퇴직연금인 중소기업퇴직연금기금(푸른씨앗) 적립금이 지난달 기준 1조9524억원으로, 이달 2조원을 넘길 전망이다. 김위상 의원실이 받은 근로복지공단 자료에 따르면 올해 2분기부터 내년 1분기까지 전담운용기관별 자금 배분 비율은 삼성자산운용 50.72%, 미래에셋증권 49.28%다. 공단은 실적 평가에 따라 배분을 차등화해 경쟁 효과를 높이겠다고 했지만 차등 폭은 작년 0.52%에 이어 올해도 1% 미만에 그쳤다. 내년에는 가입 대상이 50인 미만에서 100인 미만 사업장으로 확대된다.", "category": "법인·자금운용", "importance": 4, "source": "아시아경제", "published": "2026-10-21", "url": "https://www.asiae.co.kr/article/2026102110102108016"}, {"id": "1291a113f263", "title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "summary": "3분기 말 15개 증권사의 퇴직연금 적립금은 160조2935억원으로 2분기 말보다 4조7533억원(2.88%) 감소해, 전체 43개 사업자 감소율 2.12%보다 가팔랐다. 키움증권(649억원→1882억원)을 제외한 14곳이 모두 줄었고, 미래에셋증권은 2조1176억원(4.1%) 감소해 가장 큰 폭을 기록했다. 유형별로는 IRP가 2조9143억원(4.44%) 줄어 증권업 전체 감소액의 61.3%를 차지했고, DB형은 1조2560억원, DC형은 5830억원 감소했다. 다만 지난해 3분기 말(119조7275억원) 대비로는 1년 새 40조5660억원(33.9%) 늘었다.", "category": "운용·상품", "importance": 3, "source": "대한경제", "published": "2026-10-21", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}, {"id": "6bd039969b62", "title": "미래에셋증권·삼성증권 퇴직연금 질주…대형 3사가 증가분 82% 차지", "summary": "2025년 4분기 말과 2026년 3분기 말을 비교하면 증권업 퇴직연금 적립금은 131조5026억원에서 160조2935억원으로 28조7909억원(21.9%) 늘었다. 미래에셋증권(11조8049억원), 삼성증권(6조6121억원), 한국투자증권(5조1385억원) 3사의 증가액 합계가 전체 증가분의 81.8%였고, 3사 합산 점유율은 60.8%에서 64.5%로 높아졌다. KB증권(16.3%)과 NH투자증권(14.9%)은 업계 평균을 밑돌았고 현대차증권은 1.3% 줄어 유일하게 역성장했다. 증권업 전체 가중수익률은 9.72%에서 8.85%로 하락했다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스퀘스트", "published": "2026-10-21", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=303045"}, {"id": "bd5031c9e5c4", "title": "\"청년 연금 혜택?… 결국 미래세대 부담\"", "summary": "이재명 대통령은 20일 국무회의에서 18세가 되는 모든 국민에게 국민연금 추후납부 기회를 주는 방안을 고민하라고 정은경 보건복지부 장관에게 지시했다. 국민연금은 내년 1월1일부터 18세 청년의 첫 1개월분 연금보험료 4만1000원을 국가가 지원하는 신청제를 시작하지만, 추납으로 발생하는 재정부담은 국고가 책임지지 않는 구조다. 내년부터 둘째 자녀 출산 크레딧은 12개월에서 15개월로, 군복무 크레딧은 복무기간 전체로 확대되지만 재정투입은 연금수급 시점에 이뤄진다. 연금 전문가들은 이 같은 정책비용이 미래세대 부담으로 넘어간다고 지적했다.", "category": "가입자·사회", "importance": 3, "source": "머니투데이", "published": "2026-10-21", "url": "https://www.mt.co.kr/policy/2026/10/21/2026102019561242083"}, {"id": "473e78320044", "title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "summary": "삼성생명은 3분기 말 퇴직연금 적립금 57조5천486억원으로 2위 신한은행(57조2천252억원)을 3천234억원 앞서 6개월 만에 1위를 되찾았다. 삼성생명 적립금은 2분기 말보다 1천523억원 늘었지만 신한은행은 1조6천636억원 줄었고, 2분기 말 기준 삼성생명 적립금 가운데 DB형이 43조6천억원으로 4분의 3을 넘었다. 3분기 계열사 DB형 적립금은 7천74억원 늘고 비계열사 DB형·DC형은 각각 3천586억원, 2천473억원 줄어, 1분기 말부터 3분기 말까지 순증액의 99%가 계열사에서 나왔다. 8월 1일부터 모든 IRP 계좌의 관리 수수료를 면제했으나 3분기 IRP 적립금 증가액은 46억원에 그쳤다.", "category": "업계·경쟁사", "importance": 3, "source": "글로벌에픽", "published": "2026-10-21", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}, {"id": "b38cebe8fd32", "title": "퇴직연금 2위 경쟁 격화…하나은행·국민은행 적립금 격차 672억원", "summary": "9월 말 4대 은행(KB국민·신한·우리·하나)의 퇴직연금 적립금은 194조6275억원으로 전년 동기 대비 16.2% 증가했다. 하나은행은 52조1554억원으로 전년 동기 대비 18.2% 늘어 4대 은행 중 성장률이 가장 높았고, 2위 KB국민은행(52조2226억원)과의 격차는 672억원으로 좁혀졌다. 신한은행은 57조2252억원으로 은행권 1위를 유지했다. 4대 은행의 IRP와 DC형 적립금은 각각 77조9354억원, 57조30억원으로 2023년 9월 말보다 101.0%, 54.9% 늘었지만 DB형은 25.8% 증가에 그쳤다.", "category": "업계·경쟁사", "importance": 3, "source": "CEO스코어데일리", "published": "2026-10-21", "url": "https://www.ceoscoredaily.com/page/view/2026102015471625110"}, {"id": "05bcf8ecd999", "title": "[국정감사] 중진공, 퇴직연금 과태료 내고도 연말까지 83억원 더 채워야", "summary": "중소벤처기업진흥공단이 임직원 퇴직연금 적립금 부족으로 과태료 처분을 받고도 올해 해소해야 할 부족분을 채우지 못한 것으로 나타났다. 고용노동부의 부족분 63억3천만원 시정지시에 중진공은 기한 마지막 날 45억2천만원만 납입해 18억1천만원이 모자랐고, 올해 1월 과태료 80만원을 납부했다. 2025년 말 기준 최소적립금 996억7천만원 대비 평가적립금은 639억7천만원으로 부족액이 357억원이며, 올해 말까지 그 3분의 1인 119억원을 추가 적립해야 한다. 10월 현재 평가적립금은 675억6천만원으로 연말까지 약 83억원을 더 채워야 한다고 권향엽 의원이 지적했다.", "category": "법인·자금운용", "importance": 3, "source": "더쎈뉴스", "published": "2026-10-21", "url": "https://www.mhns.co.kr/news/articleView.html?idxno=765210"}, {"id": "83878720a871", "title": "[스트레이트뉴스 여론조사] 퇴직연금 선호도 은행 강세 속 증권사 약진", "summary": "스트레이트뉴스 의뢰로 조원씨앤아이가 10월 17~19일 전국 만 18세 이상 2000명에게 물은 결과, 가장 선호하는 퇴직연금 운영사는 NH농협은행 17.0%, KB국민은행 16.6%, 신한은행 9.0% 순이었다. 지난해 10월 조사와 비교해 농협은행은 19.1%에서 17.0%로 2.1%p, 국민은행과 신한은행은 각각 0.5%p 낮아졌다. 반면 미래에셋증권은 5.5%에서 6.8%로, 삼성증권은 5.5%에서 6.7%로 높아져 삼성생명(6.5%)을 수치상 앞섰다. 업계는 가입자가 ETF 등 투자 상품을 직접 고르려는 흐름과 실물이전 제도가 사업자 간 이동을 촉진하는 변수라고 분석했다.", "category": "업계·경쟁사", "importance": 3, "source": "스트레이트뉴스", "published": "2026-10-21", "url": "https://www.straightnews.co.kr/news/articleView.html?idxno=313571"}, {"id": "b41d83b91129", "title": "\"국민연금 240조 날렸다\" 발칵…'주식 매도 금지' 진실은", "summary": "국민연금이 정부 방침으로 국내주식을 팔지 못해 240조원을 잃었다는 온라인 주장은 공식 통계로 확인되지 않는다. 기금운용위원회는 1월 국내주식 리밸런싱 의무 조정을 6월 말까지 유예했고, 5월에는 국내주식 목표 비중을 14.9%에서 20.8%로 높였으며 7월부터 리밸런싱을 재개했다. 유예 기간에도 연기금등은 5~6월 약 4조5000억원을 순매도했다. 7월 말 기금 적립금은 1684조2000억원으로 한 달 전보다 181조4000억원 줄었다.", "category": "가입자·사회", "importance": 3, "source": "한국경제", "published": "2026-10-21", "url": "https://www.hankyung.com/article/202610204162r"}, {"id": "947e49b79c19", "title": "\"금리 내려가면 연금도 준다\"…연금저축보험 '예상 수령액' 유의사항?", "summary": "금융감독원은 21일 주요 분쟁 사례를 바탕으로 연금저축 가입부터 수령까지의 유의사항을 안내했다. 올해 2분기 말 연금저축 적립금은 224조8000억원으로 지난해 말보다 13.4% 늘었다. 연금저축보험의 가입설계서 연금액은 가입 당시 금리가 유지된다고 가정한 예상치여서 금리가 내려가면 실제 연금이 줄 수 있고, 중도해지·인출 시에는 기타소득세 16.5%가 부과된다. 사망이나 장기 치료 등 불가피한 사유는 6개월 이내 증빙을 내면 3.3~5.5%의 연금소득세를 적용받을 수 있다.", "category": "가입자·사회", "importance": 3, "source": "뉴스웍스", "published": "2026-10-21", "url": "https://www.newsworks.co.kr/news/articleView.html?idxno=900151"}, {"id": "fd1dd0e8635a", "title": "증시 후퇴에 퇴직연금 적립금 21조원 감소…삼성생명만 상위권서 증가", "summary": "금융감독원 통합연금포털에 따르면 3분기 말 은행·보험·증권업권의 퇴직연금 적립금은 542조1214억원으로 2분기 말(563조9784억원) 대비 3.9%(21조8570억원) 감소했다. 보험업권은 106조3419억원으로 9.4%(11조792억원) 줄어 감소 폭이 가장 컸고, 은행업권과 증권업권은 각각 2.1%, 2.9% 줄었다. 보험사 가운데 흥국생명은 비계열사 적립금 증가로 1조4296억원을 기록해 3.0% 늘었다. 코스피 지수는 2분기 말 8476.48에서 3분기 말 6838.04로 19.3% 떨어졌다.", "category": "운용·상품", "importance": 2, "source": "CEO스코어데일리", "published": "2026-10-21", "url": "https://www.ceoscoredaily.com/page/view/2026102015520682682"}, {"id": "f81adfddb4e4", "title": "[헤럴드광장] 연말 연금 납입, 노후 준비 앞당기는 가속페달", "summary": "연금저축은 연 600만원, IRP를 합치면 연 900만원까지 세액공제를 받을 수 있고 공제율은 총급여 5500만원 이하 16.5%, 초과 13.2%다. 기고자는 연금저축 600만원, IRP 300만원으로 공제 한도를 채우는 배분을 기본 전략으로 제시했다. 은퇴가 가까운 경우 연간 납입 한도 1800만원까지 채워 과세이연과 저율 연금소득세 혜택을 누리라고 권했다. 연 4% 수익률 가정 시 10년간 900만원씩 넣으면 약 1억800만원, 1800만원씩 넣으면 약 2억1600만원이 쌓인다.", "category": "가입자·사회", "importance": 2, "source": "헤럴드경제", "published": "2026-10-21", "url": "https://biz.heraldcorp.com/article/10909782"}, {"id": "78693231ce4d", "title": "\"원칙도, 반성도 없다\" … 권력 눈치보기에 나라 '곳간' 거덜난다", "summary": "국민연금이 석 달 반 만에 182조 원이 넘는 평가손실을 기록했다. 기금운용위원회는 연초 국내 주식 목표 비중을 늘리고 기계적 매도를 6개월간 묶는 '리밸런싱 유예'를 단행했다. 3분기 손실액 중 71.8%인 131조 원이 삼성전자와 SK하이닉스 두 종목에 집중됐다. 정은경 보건복지부 장관은 국회 연금개혁특별위원회에서 리밸런싱 유예 결정을 \"후회하지 않는다\"고 답했다.", "category": "가입자·사회", "importance": 2, "source": "뉴데일리", "published": "2026-10-21", "url": "https://biz.newdaily.co.kr/site/data/html/2026/10/21/2026102100098.html"}, {"id": "3133fa0b4bc2", "title": "50대 노후자금 체크리스트 ①", "summary": "권도형 한국은퇴설계연구소 대표는 50대부터 자산총액보다 매달 생활비로 쓸 수 있는 현금흐름을 따져야 한다고 조언했다. 국민연금은 최소 가입기간 10년 충족 여부와 납부 공백을 확인하고, 조기 노령연금은 1년마다 6%씩, 연기연금은 1년마다 7.2%씩 금액이 달라지는 점을 고려해 수령 시점을 정해야 한다. 퇴직연금은 DB형인지 DC형인지부터 확인하고, 임금피크제를 앞뒀더라도 DC형 전환이 무조건 유리한 것은 아니라고 했다. 퇴직금은 일시금 대신 IRP에 남겨 연금으로 나눠 받으면 세금 부담을 줄일 수 있다고 설명했다.", "category": "가입자·사회", "importance": 1, "source": "여성조선", "published": "2026-10-21", "url": "http://woman.chosun.com/news/articleView.html?idxno=126713"}, {"id": "8d42adfd9cda", "title": "[사설] AI가 일자리를 없애면, 국민연금은 누가 책임지나", "summary": "AI가 노동을 대체하면 근로소득에 기반한 세금과 국민연금·건강보험료 재원이 약해질 수 있다고 사설은 지적했다. 정부와 국회는 지난해 국민연금 보험료율을 9%에서 2033년까지 13%로 높이고 소득대체율을 43%로 조정했지만, 이 개혁만으로는 기금 소진 예상 시점이 2056년에서 2064년으로 늦춰지는 데 그친다. 장기 투자수익률을 연 5.5%로 높이는 가정까지 적용해야 2071년으로 연장된다. 사설은 AI 이익과 자본소득 과세, 고용 형태와 무관한 사회보장 참여 구조 등 근로소득 중심 조세·사회보험 체계의 재검토를 주문했다.", "category": "가입자·사회", "importance": 1, "source": "토큰포스트", "published": "2026-10-21", "url": "https://www.tokenpost.kr/news/insights/425236"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-10-14 ~ 2026-10-20", "generated_at": "2026-10-21T12:02:57+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "62883781d2f8", "title": "\"남들 벌 때 왜 바꿨을까\"...퇴직연금 갈아탄 15만 명의 눈물, 왜?", "summary": "박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 전년 동기(5만3242명) 대비 181.2% 늘었고, 미래에셋증권과 한국투자증권에서 4~6월 전환한 가입자의 7~8월 기간수익률은 각각 -10.7%, -10.2%였다. 한국퇴직연금데이터(글라이드)에 따르면 지난 9월 국내 197개 TDF 중 93.9%인 185개가 손실을 기록했고, TDF2025(-0.97%)의 평균 손실률이 TDF2060(-0.80%)보다 높았다. 김위상 의원실 자료에서는 올해 8월 기준 DB형을 도입한 공공기관 214곳 중 46곳(21.5%)이 법정 최소 적립 비율 100%를 충족하지 못했고, 태권도진흥재단이 39.17%로 가장 낮았다. 박 의원은 가입자 대상 위험 고지와 투자 교육 의무화, 숙려 절차 마련을 요구했다.", "category": "운용·상품", "importance": 4, "source": "파이낸셜뉴스", "published": "2026-10-15", "url": "https://www.fnnews.com/news/202610141514428250", "related": []}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}]}, {"id": "41e36c992847", "title": "[증권사 WM 딜레마 ①] 증시 훈풍에 커진 증권사 WM…대형사 쏠림도 심화", "summary": "올해 2분기 기준 증권업권 퇴직연금 적립금은 165조468억원으로 전년 동기(112조6121억원)보다 46.6% 증가했다. 증권사별로는 미래에셋증권 52조210억원, 삼성증권 28조919억원, 한국투자증권 26조4044억원, 현대차증권 19조1353억원 순이었다. 상위 4개사 적립금 합계는 125조6526억원으로 증권업권 전체의 76.1%를 차지했다. 올해 상반기 중소형 증권사 10곳의 WM 수수료 수익 합계는 약 2598억원으로, 미래에셋증권 한 곳의 2435억원과 큰 차이가 없었다.", "category": "업계·경쟁사", "importance": 3, "source": "THE Biz(더비즈)", "published": "2026-10-15", "url": "http://www.the-biz.co.kr/news/articleView.html?idxno=729227", "related": []}, {"id": "0dbdadec9016", "title": "[비바100] 퇴직연금에 담는 개인투자용 국채…금리보다 만기부터 따져라", "summary": "지난 9월부터 확정기여형(DC)·개인형퇴직연금(IRP) 계좌에서도 개인투자용 국채 10년물과 20년물을 청약할 수 있게 됐다. NH투자증권 100세시대연구소는 보고서에서 노후자금 사용 시점에 맞춰 만기를 분산하는 활용법을 제시했다. 2026년 9월 발행분 적용금리는 만기보유 시 10년물 연 4.765%, 20년물 연 4.920%이며, 100만원 투자 시 세전 수령액은 각각 약 159만3000원, 약 261만3000원이다. 퇴직연금에서 매입한 국채는 분리과세 대신 연금계좌 세제를 적용받고, 중도 환매 시 복리 혜택이 축소된다.", "category": "운용·상품", "importance": 3, "source": "브릿지경제", "published": "2026-10-15", "url": "https://www.viva100.com/article/20261013500585", "related": []}, {"id": "3f5d0c04af90", "title": "[2026국감] 퇴직연금 500조 시대의 그늘…연금 수령은 16.5%에 불과", "summary": "권칠승 더불어민주당 의원이 국민연금공단에서 받은 자료에 따르면 지난해 퇴직연금 적립금은 500조원을 넘었지만 최근 5년 평균 수익률은 3.29%, 연금 형태 수령 비율은 16.5%였다. 권 의원은 기금형 퇴직연금 운영에 국민연금이 경험이나 규모 면에서 적격이라며 참여 가능성을 질의했다. 김성주 국민연금공단 이사장은 관련 법률 개정을 전제로 국민연금이 참여하면 상대적으로 낮은 수수료와 높은 수익률을 기대할 수 있다고 답하면서도 민간 금융기관의 반대 등 현실적 제약을 언급했다. 권 의원은 공공기관 개방형 기금 등 현실적인 방법부터 찾아 제도가 연착륙하도록 해야 한다고 말했다.", "category": "제도·규제", "importance": 3, "source": "스트레이트뉴스", "published": "2026-10-15", "url": "https://www.straightnews.co.kr/news/articleView.html?idxno=313183", "related": []}, {"id": "376019080150", "title": "빼앗고 빼앗기는 증권사 연금 쟁탈전…대기업 거점 열고 MTS도 고친다", "summary": "NH투자증권은 경기도 화성시 삼성전자 사업장 인근에 연금 전문 상담 공간 '연금솔루션Lab 화성캠퍼스'를 열었고, 한국투자증권은 기업 인사·재무 담당자 대상 '퇴직연금 아카데미'를, 신한투자증권은 사내 '연금고객관리팀'을 신설했다. 한국투자증권·KB증권·미래에셋증권은 MTS 연금 화면 개편과 세금 시뮬레이션 기능 강화 등으로 가입자 락인에 나섰다. 금융감독원 통합연금포털에 따르면 2분기 말 전체 퇴직연금 적립금은 553조8779억원으로 전년 동기 대비 24.3% 늘었다. 같은 기간 15개 증권사 적립금은 112조6121억원에서 165조468억원으로 46.6% 급증해 비중이 25.3%에서 29.8%로 확대됐다.", "category": "업계·경쟁사", "importance": 3, "source": "대한경제", "published": "2026-10-14", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610131404539990372", "related": []}, {"id": "2e786d0d4177", "title": "김성주 국민연금 이사장 \"복지투자 1%도 못채워...노후 실버주택 필요\" [2026 국감]", "summary": "김성주 국민연금공단 이사장은 14일 국회 복지위 국정감사에서 국민연금의 복지투자가 허용 한도 1%도 채우지 못하고 있다고 밝혔다. 김 이사장은 56조원 정도 중 1%면 5600억원이지만 실제 투자는 2200억원이고 그중 노후긴급자금 1600억원이 대부분이라고 설명했다. 그는 노후 실버주택, 벤처 등 다양한 실험적 복지투자가 필요하다고 말했다. 또 국민연금이 기금형 퇴직연금 사업에 참여하려면 국민연금법 개정이 필요하다고 덧붙였다.", "category": "제도·규제", "importance": 3, "source": "파이낸셜뉴스", "published": "2026-10-14", "url": "https://www.fnnews.com/news/202610141058038307", "related": []}, {"id": "37d1aeda67cc", "title": "정년연장 \"연내 처리\" 속도 내지만…청년 채용·임금 개편 '난제'", "summary": "김영훈 고용노동부 장관은 지난 13일 국정감사에서 \"정년연장은 연내에 꼭 처리돼야 한다고 본다\"고 말했으나 정부안의 제출 시점이나 적용 일정은 확정하지 않았다. 노동부는 사회적 논의를 기반으로 단계적 법정 정년연장을 추진하고 올해 하반기 '세대 상생형 정년 법제화'를 지원하겠다고 밝혔다. 경총은 재고용 중심의 단계적 접근을, 노동계는 퇴직과 연금 수급 사이의 소득 공백을 줄이기 위한 법정 정년 65세 연장을 요구하고 있다. 8월 15~29세 고용률은 44.1%로 28개월째 전년 동월 대비 하락했다.", "category": "제도·규제", "importance": 2, "source": "뉴스1", "published": "2026-10-15", "url": "https://www.news1.kr/economy/employment-labor/6320252", "related": []}, {"id": "997e69fe4e5a", "title": "노후 연금 수령에도 순서가 있다, 무시하면 자칫 세금 폭탄", "summary": "안명희 우리은행 과장은 IRP 자금을 세법상 연금 수령 한도 내에서 인출해야 저율 과세와 퇴직소득세 30% 감면 혜택을 받을 수 있고, 한도는 이듬해로 이월되지 않는다고 설명했다. 연금 수령 한도는 '연금계좌 평가액 ÷ (11-연금수령연차) × 120%'로 계산하며, 2013년 3월 1일 이전 가입자는 연차가 6년 차부터 시작돼 1억원 기준 첫해 한도가 2400만원이 된다. 세액공제를 받은 개인 부담금과 운용 수익에서 인출한 금액이 연 1500만원을 넘으면 종합과세와 16.5% 분리과세 중 선택해야 한다. 안 과장은 퇴직금용 IRP와 개인 부담금용 IRP를 별도 계좌로 운용하는 방법을 제안했다.", "category": "가입자·사회", "importance": 2, "source": "조선일보", "published": "2026-10-15", "url": "https://www.chosun.com/economy/money/2026/10/15/GFIUQSY37FFBTDRPZWH4SBODK4/", "related": []}, {"id": "a8a4082e61cf", "title": "\"국민 노후자금 증시 부양 동원\" \"자기 사람 챙기기 위해 정책기획팀장 부활\" \"미래세대 위해 물러나 달라\"...국민연금공단 국감서 '혼쭐', 왜?", "summary": "14일 국회 보건복지위원회 국민연금 국정감사에서 국내 주식 리밸런싱 유예 결정과 기금운용의 정치적 독립성이 핵심 쟁점으로 다뤄졌다. 기금운용위원회는 지난 1월 국내 주식 목표 비중을 14.4%에서 14.9%로 올리고 6월 말까지 리밸런싱을 유예했으며, 5월에는 목표 비중을 20.8%로 높였다. 김성주 이사장은 유예하지 않았다면 하루 8000억원 정도를 매도해야 했을 것이라고 해명하고, 기금운용위원회의 정부 측 비중을 줄이고 가입자 대표를 확대할 필요가 있다고 밝혔다. 국민의힘 의원들은 김 이사장 복귀 직후 월 보수 700만원의 정책기획팀장 직책이 부활한 점도 문제 삼았다.", "category": "가입자·사회", "importance": 2, "source": "전북의소리", "published": "2026-10-15", "url": "http://www.jbsori.com/news/articleView.html?idxno=18038", "related": []}, {"id": "71c1eade3748", "title": "기금형 퇴직연금의 도전, '계약형DC'의 반격 카드는", "summary": "확정기여형(DC) 퇴직연금에 기금형이 도입되면서 기금형에 진출하지 않는 사업자는 계약형 DC로 경쟁해야 한다는 칼럼이다. 2025년 말 디폴트옵션 적립금은 약 53조3000억원이지만 85.4%가 안정형에 몰려 전체 수익률은 3.7% 수준에 머물렀다. 필자는 현재 IRP에 한정된 로보어드바이저 일임서비스를 DC형으로 확대하고 외부 일임업자와의 제휴 기준을 마련해야 한다고 제언했다. 또 AI를 활용해 개인별 자산배분·인출 설계와 연금·세금 상담을 상시화하고 수수료를 낮춰야 한다고 주장했다.", "category": "제도·규제", "importance": 2, "source": "뉴스퀘스트", "published": "2026-10-15", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=302661", "related": []}, {"id": "3b6e8132a34c", "title": "주식거래에서 자산관리로… 증권사, '하이브리드 WM' 힘준다", "summary": "금융감독원에 따르면 올해 상반기 국내 증권사의 WM 부문 수수료 수익은 1조7252억원으로 전년 동기(1조263억원)보다 68.1% 증가했다. 증권사들은 디지털 플랫폼과 PB 상담을 결합한 하이브리드 WM으로 주식 거래 고객을 연금 등 장기 자산관리 고객으로 전환하는 데 주력하고 있다. NH투자증권은 지난해 6월 퇴직연금 PB팀과 AI 로보어드바이저, 전문 상담인력을 결합한 하이브리드 연금 자산관리 서비스를 선보였다. KB증권은 방문형 WM 영업으로 금융투자상품 거래 규모를 월평균 1조원 수준까지 늘렸고, 삼성증권은 디지털 자산관리 서비스 에스라운지로 투자 정보와 전문가 상담을 연결하고 있다.", "category": "업계·경쟁사", "importance": 2, "source": "IT조선", "published": "2026-10-15", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092172019", "related": []}, {"id": "ffe37570d7bf", "title": "한투운용, TDF 시리즈 설정액 2조원⋯연금계좌 자금 유입 확대", "summary": "한국투자신탁운용은 한국투자TDF알아서펀드 시리즈의 설정액이 2조원을 돌파했다고 15일 밝혔다. 에프앤가이드에 따르면 14일 종가 기준 시리즈 합산 설정액은 2조138억원이며, 연초 이후 시리즈 내 퇴직연금 클래스 설정액은 1800억원 이상 증가했다. 한국투자TDF알아서장기자산배분펀드의 최근 2년 수익률은 46.97~48.21%였고, 한국투자TDF알아서ETF포커스펀드의 최근 3년 평균 샤프지수는 1.29였다. 한투운용은 퇴직연금과 개인연금 시장 성장에 따라 연금계좌 중심의 장기 투자 수요가 확대되면서 자금 유입이 이어졌다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이투데이", "published": "2026-10-15", "url": "https://www.etoday.co.kr/news/view/2635971", "related": []}, {"id": "e511fd7a7e9a", "title": "허종식 \"인천 조기연금 수도권 1위…노후빈곤 경고\"", "summary": "국회 보건복지위원회 허종식 의원이 국민연금공단에서 받은 자료에 따르면 2026년 6월 기준 인천의 노령연금 수급자 37만776명 가운데 조기노령연금 수급자는 6만2257명(16.8%)으로 서울(10.9%)과 경기(14.1%)보다 높아 수도권에서 가장 높았다. 연기연금 수급자는 8746명(2.36%)으로 수도권 최저였고, 조기 수령자가 연기 수령자의 7.1배에 달했다. 인천 군·구 중에서는 동구의 조기 수령 비율이 19.9%로 가장 높았고, 연수구는 연기연금 비율이 4.45%로 가장 높았다. 허 의원은 주된 일자리 퇴직 평균 49.3세와 국민연금 지급 개시 63세 사이 약 13년의 소득 공백을 해소할 고용·복지 대책을 촉구했다.", "category": "가입자·사회", "importance": 2, "source": "이뉴스투데이", "published": "2026-10-15", "url": "http://www.enewstoday.co.kr/news/articleView.html?idxno=2480332", "related": []}, {"id": "b75a3ab91fc1", "title": "한 달 새 181조 증발한 국민연금…\"받을 세대도, 낼 세대도 불안\"", "summary": "국민연금기금 적립금은 7월 말 기준 1684조원으로 전월 말보다 9.7% 줄었고, 7월 증시 급락으로 국내주식 평가액만 약 125조원 감소했다. 최보윤 국민의힘 수석대변인은 15일 논평에서 1월 리밸런싱 유예와 5월 28일 국내주식 목표비중 14.9%→20.8% 상향을 비판하며 회의록이 공개되지 않으면 국정조사와 특검으로 진상을 가리겠다고 했다. 적립금 약 60조원당 1년이라는 정부 공식을 단순 적용하면 7월 한 달 손실만으로 기금 소진 시점이 약 3년 앞당겨지는 셈이다. 경총의 지난해 조사에서 국민연금 신뢰 응답은 20대 30.8%, 30대 25.3%로 50대 이상(62.9%)의 절반 수준이었다.", "category": "가입자·사회", "importance": 2, "source": "뉴스웍스", "published": "2026-10-15", "url": "https://www.newsworks.co.kr/news/articleView.html?idxno=856545", "related": []}, {"id": "fff96b2f9d85", "title": "외국인 떠날 때 못 판 국민연금…리밸런싱 유예로 원칙론 '재부상'", "summary": "국회 보건복지위원회의 14일 국민연금공단 국정감사에서는 올해 1월 국내 주식 리밸런싱 유예 결정을 둘러싼 질의가 집중됐다. 이달희 국민의힘 의원은 국민연금이 외국인 투자자의 'ATM' 노릇을 했다고 지적했고, 백종헌 의원 자료에 따르면 국민연금의 국내 주식 누적 운용익은 6월 말 283조1천억원에서 7월 말 158조7천억원으로 줄었다. 김성주 이사장은 규칙대로 리밸런싱했다면 매 거래일 8천억원 규모의 기계적 매도가 불가피했다며 장기 투자자로서의 판단이었다고 반박했다. 운용업계에서는 수익률과 별개로 운용 원칙을 바꾼 것이 안 좋은 선례가 될 수 있다는 평가가 나왔다.", "category": "가입자·사회", "importance": 2, "source": "연합인포맥스", "published": "2026-10-15", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4439375", "related": []}, {"id": "f44569f07fa9", "title": "첫 국민연금 보험료 지원금 받는 것도 정보전?…강남·학군지 신청 몰렸다", "summary": "전진숙 더불어민주당 의원실이 국민연금공단에서 받은 자료에 따르면 10월 7일 기준 '청년 생애 첫 연금보험료 지원' 사전 신청은 총 2287건이며 이 중 부모가 대신 신청한 건이 1607건(70.3%)이었다. 서울 신청 358건 가운데 강남 3구가 92건(25.7%)을 차지했고, 경북 8개 시군 등 다수 농어촌 지역은 신청이 0건이었다. 이 제도는 2027년 1월 1일부터 시행되며 2009년생 약 45만 명에게 첫 1개월분 연금보험료 4만1000원을 국비로 지원한다. 국민연금공단은 신청 절차를 간소화하고 학교 방문 등 맞춤형 홍보를 확대할 계획이다.", "category": "가입자·사회", "importance": 2, "source": "서울경제", "published": "2026-10-15", "url": "https://www.sedaily.com/article/20101891", "related": []}, {"id": "8e43f4e6ea3c", "title": "주택연금 가입률 첫 2% 돌파…월 수령액 올리자 신규 가입 탄력", "summary": "한민수 더불어민주당 의원이 한국주택금융공사에서 받은 자료에 따르면 올해 8월 말 기준 주택연금 누적 가입자는 16만2498명으로 가입률이 약 2.1%다. 올해 1~8월 신규 가입자는 1만2427명으로 지난해 연간 가입자 1만3925명의 약 89%에 달했다. 금융당국은 3월 1일 이후 신규 신청자부터 월 수령액을 평균 3.1% 올리고 초기보증료율을 주택가격의 1.5%에서 1.0%로 낮췄으며, 연보증료율은 0.75%에서 0.95%로 높였다. 미국의 2024년 말 가입률 3.8%와 비교하면 절반을 조금 웃도는 수준이다.", "category": "가입자·사회", "importance": 2, "source": "헤럴드경제", "published": "2026-10-15", "url": "https://biz.heraldcorp.com/article/10903442", "related": []}, {"id": "fdc5574646aa", "title": "노란우산 깼더니 건강보험료 또 부과…공단, 얼마 걷었는지도 몰라", "summary": "허종식 더불어민주당 의원이 받은 자료에 따르면 2021년부터 지난해까지 노란우산공제 임의해약은 27만 8409건, 1조 8989억 원에 달했다. 임의해지 시 소득공제를 받은 납입액과 이자가 기타소득으로 분류돼 건강보험료가 부과되지만, 연금저축과 개 03820502", "related": [{"title": "대유위니아 가전 3사, 퇴직연금 법정 적립금 3년 연속 미달", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5070068"}]}, {"id": "fcba047b4874", "title": "머니무브 주춤, 더 치열해진 증권사 퇴직연금 경쟁", "summary": "올해 2분기말 기준 퇴직연금 시장은 553조8949억원이며 증권사 비중은 지난해말 26.47%에서 2분기 29.8%로 늘었다. 증권업종 적립금 165조원 중 미래에셋증권이 52조원(31.5%)을 차지하고 삼성증권 28조원, 한국투자증권 26조원이 뒤를 잇는다. 3분기 증시 조정으로 4~6월 DB형에서 DC형으로 전환한 증권사 가입자의 7월·8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 한국투자증권의 MTS 연금서비스 전면개편, 신한투자증권의 연금고객관리팀 신설, NH투자증권의 법인고객 관리시스템(CIS) 구축 등 증권사들이 타사 고객 유치 경쟁에 나서고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "비즈워치", "published": "2026-10-09", "url": "https://news.bizwatch.co.kr/article/market/2026/10/08/0005", "related": [{"title": "퇴직연금 165조 잡은 증권사…다음 승부처는 '고객관리'", "source": "뉴스웨이", "url": "https://www.newsway.co.kr/news/view?ud=2026100713530728574"}]}, {"id": "c4dab2068ab2", "title": "복지부 국감 개막⋯기초연금 '반쪽 개편'·국민연금 손실 추궁 [국감]", "summary": "국회 보건복지위원회가 7일 보건복지부와 질병관리청을 시작으로 이틀간 국정감사에 들어갔다. 핵심 쟁점은 연금제도 개편안으로, 복지부가 추진해 온 저소득층 노인 중심 '하후상박' 기초연금 개편이 사회적 논의 부족을 이유로 1년짜리 단기 계획에 그친 점이 '반쪽 개편'이라는 지적을 받을 전망이다. 국민연금은 기금 재정 안정성과 함께 자산배분 리밸런싱 한시 유예, 국내 주식 목표 비중 상향(14.9%→20.8%)에 따른 증시 급락 손실 문제가 검증대에 오른다. 복지위 국감은 14일 국민연금공단, 16일 국민건강보험공단·건강보험심사평가원을 거쳐 27일 종합감사로 마무리된다.", "category": "제도·규제", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2633071", "related": [{"title": "기초연금 '반쪽' 개편·국립대병원 첫 등판…복지부 국감 쟁점은", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261003_0003813472"}]}, {"id": "3222e4df0aa6", "title": "[연금개혁] '골든타임' 놓치면 무용지물…국고 GDP 1% 지금 투입 땐 31년 연장, 고갈 후엔 1년뿐", "summary": "국회예산정책처 분석에 따르면 현행 제도가 유지될 경우 국민연금 기금은 2069년에 소진된다. 정부가 지금부터 매년 GDP의 1%를 투입하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥난 2069년부터 투입하면 1년만 연장된다. 기금 수익률을 2%포인트 높이면 2120년까지 흑자를 유지할 수 있다.", "category": "제도·규제", "importance": 3, "source": "CBC뉴스", "published": "2026-10-01", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=611066", "related": [{"title": "\"국민연금 수익률 2%p 높이면 2120년까지 기금 고갈 없어\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260929100600530?input=1195m"}]}, {"id": "dd4beb88ba61", "title": "“4조 8천억 몰렸다”…S&P500으로 노후 준비? 이렇게 하세요 [잇슈 머니]", "summary": "국내에 상장된 S&P500 지수 상품 하나에 올해 들어 9월 28일까지 개인 자금 4조8611억원이 들어와 국내 ETF 가운데 1위를 기록했다. 연금저축과 개인형퇴직연금(IRP)은 둘을 합쳐 연 900만원까지 세액공제를 받고, 총급여 5500만원 이하 근로자는 공제율 16.5%가 적용돼 900만원을 넣으면 최대 148만5000원을 돌려받는다. 운용수익에는 세금을 바로 떼지 않고 55세 이후 연금으로 받을 때 3.3~5.5%의 연금소득세만 내지만, 연금 수령액이 연 1500만원을 넘으면 종합과세와 16.5% 분리과세 가운데 하나를 골라야 한다. 원·달러 환율이 7월 1일 장중 1550.85원에서 10월 2일 1350.6원으로 내려오면서 같은 S&P500 지수를 따르는 국내 상장 ETF의 최근 석 달 수익률은 환헤지형 2.19% 상승, 환노출형 6.23% 하락으로 갈렸다.", "category": "운용·상품", "importance": 2, "source": "KBS", "published": "2026-10-05", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8677562&ref=A", "related": [{"title": "한국증시 뛰었는데…개인 4.9조는 美 S&P500 ETF로", "source": "매일일보", "url": "https://www.m-i.kr/news/articleView.html?idxno=2002553"}, {"title": "개미 자금 4.9조 몰렸다…미래에셋 S&P500 ETF 1위·삼성 고배당도 성장세", "source": "더구루", "url": "https://www.theguru.co.kr/news/article.html?no=107765"}]}, {"id": "d86212c7d0db", "title": "신한투자증권, 연금고객관리팀 신설…생애주기별 관리 체계 구축", "summary": "신한투자증권이 퇴직연금 시장 성장에 맞춰 연금고객관리팀을 신설하고 고객 생애주기별 연금관리 체계를 구축했다. 신규 DC·IRP 가입 고객에게 계좌 개설 후 3일 이내 제도를 안내하는 웰컴콜, 우수 연금PB와 고객을 1대1로 매칭하는 연금스타, 퇴직소득세 절세 전략 시뮬레이션과 연금 수령 계획을 담은 신한 Premier 연금컨설팅을 운영한다. 법인 CEO와 고위 임원을 대상으로 한 C-Level 컨설팅과 8월 도입한 모바일 상담도 함께 제공한다. 연금고객관리팀은 신설 이후 신한 Premier 연금컨설팅을 약 200건 제공했다.", "category": "업계·경쟁사", "importance": 2, "source": "더퍼블릭", "published": "2026-10-07", "url": "https://www.thepublic.kr/news/articleView.html?idxno=321337", "related": [{"title": "신한투자증권, 연금고객관리팀 신설…맞춤형 연금관리 강화", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2632658"}]}, {"id": "8886365e07f8", "title": "국민연금, 삼성전자 팔고 하이닉스 1.6조 매수", "summary": "국민연금이 7월 이후 SK하이닉스를 1조5988억원 순매수하고 SK스퀘어 1조3531억원, 삼성전자 7937억원을 순매도했다. SK이노베이션 3535억원, 삼성SDI 3305억원, S-Oil 2635억원, DB손해보험 2546억원도 순매수 상위에 올랐다. 기금 규 : "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "f14fcbcde9b5", "title": "550조 퇴직연금 판 흔든다…국민연금 참여 '기금형 퇴직연금' 법안 발의", "summary": "더불어민주당 이용우 의원이 공동발의 12인과 함께 10월 2일 근로자퇴직급여 보장법 일부개정법률안을 발의했다. 개정안은 국민연금공단 등 공적연금관리기관이 기금형 퇴직연금 사업에 참여할 수 있도록 하고, 시장점유율 상한을 3년차 10%, 4년차 20%, 5년차 30%로 두었다. 2025년 말 퇴직연금 적립금은 501조4000억원이고 2024년 수익률은 4.77%로 같은 해 국민연금 수익률 15.0%를 밑돌았으며, 수수료는 2018년 8956억원에서 2025년 1조7748억원으로 98% 늘었다. 중소기업퇴직연금기금 가입 대상은 현재 100명 미만에서 2028년까지 300명 이하로 확대되고, 법안은 공포 후 1년이 지나 본격 시행된다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-10-07", "url": "http://www.globalepic.co.kr/view.php?ud=2026100708100769037cc35ccc5c_29", "related": [{"title": "'기금형 퇴직연금' 정기국회 논의 본격화 할 듯", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237123"}, {"title": "\"저조한 수익률, 높은 수수료\" 구조인 현행 계약형 퇴직연금 보완하는 기금형 퇴직연금 병행도입 필요", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=493587"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "6c986a5b1bb4", "title": "한국투자증권, 기업 대상 ‘퇴직연금 아카데미’ 개최…제도 변화 대응 전략 제시", "summary": "한국투자증권은 지난 8일 서울 여의도 TP타워 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}]}}}</script>

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로
     그보다 넉넉히 잡아야 매일 아침 헛경보가 뜨지 않는다. */
  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
         + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

  function buildStaleNotice() {
    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
