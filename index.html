  /* ── 팔레트 ───────────────────────────────────────────────

     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나.

     키움 두 색은 kiwoomam.com 로고의 구조를 그대로 옮긴 것이다.
     글자는 감청, 포인트 마크만 마젠타. 그래서 맨 위 줄은 감청이고
     마젠타는 슬로건 한 줄에만 쓴다. 둘을 같은 넓이로 쓰면 서로 죽는다. */
  :root {
    --ink: #101C33;
    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom-deep: #1A399E;
    --kiwoom-point: #EC008C;

    --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',
               'Malgun Gothic', system-ui, sans-serif;
    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #DCE2EC;
      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 감청 원색은 어두운 종이에서 1.9:1까지 떨어져 줄이 보이지 않는다.
         마젠타도 한 단계 올려 짝을 맞춘다. 각각 6.2:1, 6.6:1. */
      --kiwoom-deep: #6E92F5;
      --kiwoom-point: #FF5FB4;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야
     구분선이 아니라 종이의 테두리로 읽힌다. */
  .topline { height: 4px; background: var(--kiwoom-deep); }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;
  }

  .slogan {
    margin: 0 0 0 auto;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom-point);
    white-space: nowrap;
  }

  .hero-date {
    font-family: var(--font-num);
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .search input {
    width: 230px;
    max-width: 44vw;
    padding: 4px 0;
    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */
  .group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;
  }

  .rail button {
    flex: 1 1 0;
    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .range {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  /* ── 분야 필터 ─────────────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
  }

  .filters button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */
  .notice {
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */
  .list { margin: 8px 0 0; }

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);
  }

  article[data-cat="2"] .badge { color: var(--cat-2); }
  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

  details summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

m/article/20261013500585"}, {"id": "3f5d0c04af90", "title": "[2026국감] 퇴직연금 500조 시대의 그늘…연금 수령은 16.5%에 불과", "summary": "권칠승 더불어민주당 의원이 국민연금공단에서 받은 자료에 따르면 지난해 퇴직연금 적립금은 500조원을 넘었지만 최근 5년 평균 수익률은 3.29%, 연금 형태 수령 비율은 16.5%였다. 권 의원은 기금형 퇴직연금 운영에 국민연금이 경험이나 규모 면에서 적격이라며 참여 가능성을 질의했다. 김성주 국민연금공단 이사장은 관련 법률 개정을 전제로 국민연금이 참여하면 상대적으로 낮은 수수료와 높은 수익률을 기대할 수 있다고 답하면서도 민간 금융기관의 반대 등 현실적 제약을 언급했다. 권 의원은 공공기관 개방형 기금 등 현실적인 방법부터 찾아 제도가 연착륙하도록 해야 한다고 말했다.", "category": "제도·규제", "importance": 3, "source": "스트레이트뉴스", "published": "2026-10-15", "url": "https://www.straightnews.co.kr/news/articleView.html?idxno=313183"}, {"id": "37d1aeda67cc", "title": "정년연장 \"연내 처리\" 속도 내지만…청년 채용·임금 개편 '난제'", "summary": "김영훈 고용노동부 장관은 지난 13일 국정감사에서 \"정년연장은 연내에 꼭 처리돼야 한다고 본다\"고 말했으나 정부안의 제출 시점이나 적용 일정은 확정하지 않았다. 노동부는 사회적 논의를 기반으로 단계적 법정 정년연장을 추진하고 올해 하반기 '세대 상생형 정년 법제화'를 지원하겠다고 밝혔다. 경총은 재고용 중심의 단계적 접근을, 노동계는 퇴직과 연금 수급 사이의 소득 공백을 줄이기 위한 법정 정년 65세 연장을 요구하고 있다. 8월 15~29세 고용률은 44.1%로 28개월째 전년 동월 대비 하락했다.", "category": "제도·규제", "importance": 2, "source": "뉴스1", "published": "2026-10-15", "url": "https://www.news1.kr/economy/employment-labor/6320252"}, {"id": "997e69fe4e5a", "title": "노후 연금 수령에도 순서가 있다, 무시하면 자칫 세금 폭탄", "summary": "안명희 우리은행 과장은 IRP 자금을 세법상 연금 수령 한도 내에서 인출해야 저율 과세와 퇴직소득세 30% 감면 혜택을 받을 수 있고, 한도는 이듬해로 이월되지 않는다고 설명했다. 연금 수령 한도는 '연금계좌 평가액 ÷ (11-연금수령연차) × 120%'로 계산하며, 2013년 3월 1일 이전 가입자는 연차가 6년 차부터 시작돼 1억원 기준 첫해 한도가 2400만원이 된다. 세액공제를 받은 개인 부담금과 운용 수익에서 인출한 금액이 연 1500만원을 넘으면 종합과세와 16.5% 분리과세 중 선택해야 한다. 안 과장은 퇴직금용 IRP와 개인 부담금용 IRP를 별도 계좌로 운용하는 방법을 제안했다.", "category": "가입자·사회", "importance": 2, "source": "조선일보", "published": "2026-10-15", "url": "https://www.chosun.com/economy/money/2026/10/15/GFIUQSY37FFBTDRPZWH4SBODK4/"}, {"id": "a8a4082e61cf", "title": "\"국민 노후자금 증시 부양 동원\" \"자기 사람 챙기기 위해 정책기획팀장 부활\" \"미래세대 위해 물러나 달라\"...국민연금공단 국감서 '혼쭐', 왜?", "summary": "14일 국회 보건복지위원회 국민연금 국정감사에서 국내 주식 리밸런싱 유예 결정과 기금운용의 정치적 독립성이 핵심 쟁점으로 다뤄졌다. 기금운용위원회는 지난 1월 국내 주식 목표 비중을 14.4%에서 14.9%로 올리고 6월 말까지 리밸런싱을 유예했으며, 5월에는 목표 비중을 20.8%로 높였다. 김성주 이사장은 유예하지 않았다면 하루 8000억원 정도를 매도해야 했을 것이라고 해명하고, 기금운용위원회의 정부 측 비중을 줄이고 가입자 대표를 확대할 필요가 있다고 밝혔다. 국민의힘 의원들은 김 이사장 복귀 직후 월 보수 700만원의 정책기획팀장 직책이 부활한 점도 문제 삼았다.", "category": "가입자·사회", "importance": 2, "source": "전북의소리", "published": "2026-10-15", "url": "http://www.jbsori.com/news/articleView.html?idxno=18038"}, {"id": "71c1eade3748", "title": "기금형 퇴직연금의 도전, '계약형DC'의 반격 카드는", "summary": "확정기여형(DC) 퇴직연금에 기금형이 도입되면서 기금형에 진출하지 않는 사업자는 계약형 DC로 경쟁해야 한다는 칼럼이다. 2025년 말 디폴트옵션 적립금은 약 53조3000억원이지만 85.4%가 안정형에 몰려 전체 수익률은 3.7% 수준에 머물렀다. 필자는 현재 IRP에 한정된 로보어드바이저 일임서비스를 DC형으로 확대하고 외부 일임업자와의 제휴 기준을 마련해야 한다고 제언했다. 또 AI를 활용해 개인별 자산배분·인출 설계와 연금·세금 상담을 상시화하고 수수료를 낮춰야 한다고 주장했다.", "category": "제도·규제", "importance": 2, "source": "뉴스퀘스트", "published": "2026-10-15", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=302661"}, {"id": "935ff7b5e200", "title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "summary": "최보윤 국민의힘 의원이 국민연금공단 자료를 분석한 결과 1000만원 이하 납부자 75만8893명 가운데 1만9972명(2.6%)이 1억원 이상을 받았다. 이들의 평균 납부액은 833만원, 평균 누적 수령액은 1억1190만원으로 납부액 대비 13.4배였다. 1988년 도입 당시 보험료율 3%에 소득대체율 70%였던 구조와 특례노령연금이 원인으로 꼽혔다. 반면 보험료율은 올해 9.5%에서 2033년 13%로 오르고, 국회예산정책처는 현행 제도 유지 시 2069년 기금 소진을 전망했다.", "category": "가입자·사회", "importance": 2, "source": "직썰", "published": "2026-10-15", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"id": "3b6e8132a34c", "title": "주식거래에서 자산관리로… 증권사, '하이브리드 WM' 힘준다", "summary": "금융감독원에 따르면 올해 상반기 국내 증권사의 WM 부문 수수료 수익은 1조7252억원으로 전년 동기(1조263억원)보다 68.1% 증가했다. 증권사들은 디지털 플랫폼과 PB 상담을 결합한 하이브리드 WM으로 주식 거래 고객을 연금 등 장기 자산관리 고객으로 전환하는 데 주력하고 있다. NH투자증권은 지난해 6월 퇴직연금 PB팀과 AI 로보어드바이저, 전문 상담인력을 결합한 하이브리드 연금 자산관리 서비스를 선보였다. KB증권은 방문형 WM 영업으로 금융투자상품 거래 규모를 월평균 1조원 수준까지 늘렸고, 삼성증권은 디지털 자산관리 서비스 에스라운지로 투자 정보와 전문가 상담을 연결하고 있다.", "category": "업계·경쟁사", "importance": 2, "source": "IT조선", "published": "2026-10-15", "url": "https://it.chosun.com/news/articleView.html?idxno=2023092172019"}, {"id": "ffe37570d7bf", "title": "한투운용, TDF 시리즈 설정액 2조원⋯연금계좌 자금 유입 확대", "summary": "한국투자신탁운용은 한국투자TDF알아서펀드 시리즈의 설정액이 2조원을 돌파했다고 15일 밝혔다. 에프앤가이드에 따르면 14일 종가 기준 시리즈 합산 설정액은 2조138억원이며, 연초 이후 시리즈 내 퇴직연금 클래스 설정액은 1800억원 이상 증가했다. 한국투자TDF알아서장기자산배분펀드의 최근 2년 수익률은 46.97~48.21%였고, 한국투자TDF알아서ETF포커스펀드의 최근 3년 평균 샤프지수는 1.29였다. 한투운용은 퇴직연금과 개인연금 시장 성장에 따라 연금계좌 중심의 장기 투자 수요가 확대되면서 자금 유입이 이어졌다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이투데이", "published": "2026-10-15", "url": "https://www.etoday.co.kr/news/view/2635971"}, {"id": "e511fd7a7e9a", "title": "허종식 \"인천 조기연금 수도권 1위…노후빈곤 경고\"", "summary": "국회 보건복지위원회 허종식 의원이 국민연금공단에서 받은 자료에 따르면 2026년 6월 기준 인천의 노령연금 수급자 37만776명 가운데 조기노령연금 수급자는 6만2257명(16.8%)으로 서울(10.9%)과 경기(14.1%)보다 높아 수도권에서 가장 높았다. 연기연금 수급자는 8746명(2.36%)으로 수도권 최저였고, 조기 수령자가 연기 수령자의 7.1배에 달했다. 인천 군·구 중에서는 동구의 조기 수령 비율이 19.9%로 가장 높았고, 연수구는 연기연금 비율이 4.45%로 가장 높았다. 허 의원은 주된 일자리 퇴직 평균 49.3세와 국민연금 지급 개시 63세 사이 약 13년의 소득 공백을 해소할 고용·복지 대책을 촉구했다.", "category": "가입자·사회", "importance": 2, "source": "이뉴스투데이", "published": "2026-10-15", "url": "http://www.enewstoday.co.kr/news/articleView.html?idxno=2480332"}, {"id": "b75a3ab91fc1", "title": "한 달 새 181조 증발한 국민연금…\"받을 세대도, 낼 세대도 불안\"", "summary": "국민연금기금 적립금은 7월 말 기준 1684조원으로 전월 말보다 9.7% 줄었고, 7월 증시 급락으로 국내주식 평가액만 약 125조원 감소했다. 최보윤 국민의힘 수석대변인은 15일 논평에서 1월 리밸런싱 유예와 5월 28일 국내주식 목표비중 14.9%→20.8% 상향을 비판하며 회의록이 공개되지 않으면 국정조사와 특검으로 진상을 가리겠다고 했다. 적립금 약 60조원당 1년이라는 정부 공식을 단순 적용하면 7월 한 달 손실만으로 기금 소진 시점이 약 3년 앞당겨지는 셈이다. 경총의 지난해 조사에서 국민연금 신뢰 응답은 20대 30.8%, 30대 25.3%로 50대 이상(62.9%)의 절반 수준이었다.", "category": "가입자·사회", "importance": 2, "source": "뉴스웍스", "published": "2026-10-15", "url": "https://www.newsworks.co.kr/news/articleView.html?idxno=856545"}, {"id": "91638baf4a71", "title": "[반퇴시대 재산리모델링] ISA·IRP 꽉 채워라…고소득 2주택자 '징검다리' 자산전략", "summary": "2주택을 보유한 40대 A씨 가족의 수도권 이주 상담 사례로, 조정대상지역에서 두 번째 집을 사면 취득세율이 8%로 올라 당분간 전월세 거주가 현실적이라고 조언했다. 노후 연금 준비가 부족한 만큼 남편은 IRP에 가입해 연 900만원까지 세액공제를 챙기고, 부부 모두 ISA를 개설해 매달 150만원씩 넣을 것을 권했다. ISA 만기자금을 IRP로 옮기면 이전금액의 10%, 최대 300만원까지 추가 세액공제를 받을 수 있다고 설명했다. 납입을 중단한 국민연금은 추후납부 제도로 채우는 방안도 제시했다.", "category": "가입자·사회", "importance": 1, "source": "중앙일보", "published": "2026-10-15", "url": "https://www.joongang.co.kr/article/25469799"}, {"id": "9adb54a47eec", "title": "\"연금은 내 돈, 생활비 각자 하자\"...35년 살림 아내에 '졸혼' 통보한 남편 [어떻게 생각하세요]", "summary": "정년퇴직한 교사 남편이 35년간 전업주부였던 아내에게 졸혼을 통보하고 연금은 줄 수 없다며 생활비 지급을 끊은 사연이 YTN 라디오에서 다뤄졌다. 곽동주 변호사는 졸혼은 법률상 제도가 아니어서 부양 의무가 유지되며, 가정법원에 부양료를 청구하고 연금 수급 계좌에 강제집행도 할 수 있다고 설명했다. 이혼 시 남편의 공무원연금도 분할 대상이 되며, 판례상 이미 수령 중인 퇴직연금도 장래 수령액에 대해 재산분할 청구가 가능하다고 했다.", "category": "가입자·사회", "importance": 1, "source": "파이낸셜뉴스", "published": "2026-10-15", "url": "https://www.fnnews.com/news/202610141955460441"}, {"id": "1e34485eaf29", "title": "NH투자증권, 연금자산 관리 전략 담은 'THE100리포트' 발간", "summary": "NH투자증권 100세시대연구소는 '연금자산 관리의 새로운 방법, 솔루션 펀드 TRF·TIF'를 주제로 한 'THE100리포트' 135호를 발간했다고 15일 밝혔다. TRF는 투자자의 위험 성향에 맞춰 주식과 채권 등 자산 비중을 관리하는 펀드이고, TIF는 은퇴 이후 정기적인 현금흐름 확보를 목표로 운용하는 상품이다. 보고서는 두 상품을 TDF와 함께 연금자산 관리에 활용할 수 있지만 투자 목적과 운용 방식에 차이가 있어 개인별 은퇴 시점과 위험 감수 능력을 고려해야 한다고 설명했다. 김동익 소장은 연금자산 관리는 높은 수익률뿐 아니라 개인의 위험 성향과 적정 수준의 현금흐름을 함께 고려해야 한다고 말했다.", "category": "운용·상품", "importance": 1, "source": "SR타임스", "published": "2026-10-15", "url": "http://www.srtimes.kr/news/articleView.html?idxno=214808"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-10-08 ~ 2026-10-14", "generated_at": "2026-10-15T10:32:24+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "eba21a56e556", "title": "\"도입 4년 中企 퇴직연금 '푸른씨앗' 중도해지 급증\"", "summary": "국민의힘 김기현 의원이 근로복지공단에서 받은 자료에 따르면 올해 8월 기준 30인 미만 사업장의 푸른씨앗 가입률은 사업장 기준 12.2%(4만4천123개소), 근로자 기준 11.2%(19만4천441명)였다. 근로복지공단은 2022년 도입 이후 사용자 지원금 316억원, 가입자 지원금 277억원 등 총 594억원의 재정지원금을 집행했다. 가입 후 1년 내 중도 해지한 사업장은 2023년 890개소, 2024년 619개소, 2025년 550개소, 올해 8월까지 462개소였고, 근로자의 퇴직금 중도인출 승인 건수는 2023년 122건에서 2025년 495건, 올해 8월까지 489건으로 늘었다. 김 의원은 푸른씨앗이 단순한 목돈 마련 수단으로 전락하지 않도록 근본적인 대책을 마련해야 한다고 주장했다.", "category": "제도·규제", "importance": 4, "source": "연합뉴스", "published": "2026-10-12", "url": "https:/ 0-12", "url": "https://www.yna.co.kr/view/AKR20261012029400530", "related": []}, {"id": "6c986a5b1bb4", "title": "한국투자증권, 기업 대상 ‘퇴직연금 아카데미’ 개최…제도 변화 대응 전략 제시", "summary": "한국투자증권은 지난 8일 서울 여의도 TP타워에서 기업 인사·재무 담당자 등 퇴직연금 실무자를 대상으로 ‘퇴직연금 아카데미’를 개최했다. 행사는 근로자퇴직급여 보장법 개정 추진에 맞춰 기금형 퇴직연금 도입과 퇴직급여 사외적립 의무화 등 현안을 중심으로 3개 세션으로 진행됐다. 기금형 도입에 따른 운용 효율성 제고 방안과 사외적립 의무화 대비 실무 가이드라인, 정년연장·임금피크제 운영 전략, 전담 RM 활용 방안 등이 소개됐다. 김도현 개인고객그룹장은 기업들이 제도 변화에 선제적으로 대응할 수 있도록 맞춤형 컨설팅과 실무 지원을 강화하겠다고 말했다.", "category": "법인·자금운용", "importance": 3, "source": "비즈월드", "published": "2026-10-13", "url": "http://www.bizwnews.com/news/articleView.html?idxno=148655", "related": [{"title": "한국투자증권, 퇴직연금 500조 기업시장 공략…인사·재무 담당자 접점 확대", "source": "토요경제", "url": "https://sateconomy.co.kr/news/view/1065574639722076"}, {"title": "한국투자증권, 기업 실무진 대상 '퇴직연금 아카데미' 개최", "source": "뉴스드림", "url": "http://www.newsdream.kr/news/articleView.html?idxno=119732"}, {"title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "source": "아시아경제", "url": "https://view.asiae.co.kr/article/2026101209461462366"}, {"title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "source": "머니투데이", "url": "https://www.mt.co.kr/stock/2026/10/12/2026101210195750915"}]}, {"id": "6c7edca81fd2", "title": "퇴직연금 들어온 개인투자용 국채…금리보다 먼저 볼 '만기'", "summary": "10월 개인투자용 국채 청약 기간은 8~15일이며 퇴직연금계좌에서는 10년물과 20년물만 투자할 수 있다. 10년물 발행 규모는 지난달 1100억원에서 1500억원으로 늘고 20년물은 650억원에서 450억원으로 줄었으며, 만기보유 적용금리는 각각 연 4.790%, 4.950%다. 퇴직연금계좌 청약이 처음 허용된 지난달 청약률은 112%를 기록했다. NH투자증권 100세시대연구소는 만기 사다리 구성과 과세 이연 효과를 장점으로, 1년 경과 후에만 가능한 중도 환매와 장기 금리 고정에 따른 기회비용을 유의점으로 꼽았다.", "category": "운용·상품", "importance": 3, "source": "이투데이", "published": "2026-10-09", "url": "https://www.etoday.co.kr/news/view/2633616", "related": [{"title": "1000만원 넣으면 10년 뒤 1597만원…국채 사볼까", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311873"}, {"title": "'20년 묻어두면 2.6배'…개인투자용 국채에 2.4조 몰렸다", "source": "테크M", "url": "https://www.techm.kr/news/articleView.html?idxno=155929"}, {"title": "미래에셋증권, 개인투자용 국채 10년물 확대..퇴직연금 청약 두 달째", "source": "포쓰저널", "url": "http://www.4th.kr/news/articleView.html?idxno=2119412"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "6da1ff9b2cf1", "title": "'2164억 체불' 대유위니아…3년 연속 퇴직연금 적립 미달", "summary": "대유위니아 계열 가전 3사(위니아·위니아전자·위니아전자MF)가 2022년부터 2024년까지 3년 연속 DB형 퇴직연금 법정 최소적립금을 채우지 못한 것으로 김주영 의원이 고용노동부에서 받은 자료에서 나타났다. 위니아전자의 최소적립금 대비 실제 적립 비율은 2022년 5.86%, 2023년 5.88%, 2024년 5.68%였고 위니아전자MF는 같은 기간 14.11%에서 9.45%로 떨어졌다. 2022년부터 지난달 3일까지 3사의 전체 체불액은 2164억원이며 이 중 체불 퇴직금은 858억원이다. 고용노동부가 이들 계열사에 관련 과태료를 부과한 사례는 없었다.", "category": "법인·자금운용", "importance": 3, "source": "뉴시스", "published": "2026-10-10", "url": "https://www.newsis.com/view/NISX20261010_0003820502", "related": [{"title": "대유위니아 가전 3사, 퇴직연금 법정 적립금 3년 연속 미달", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5070068"}]}, {"id": "fcba047b4874", "title": "머니무브 주춤, 더 치열해진 증권사 퇴직연금 경쟁", "summary": "올해 2분기말 기준 퇴직연금 시장은 553조8949억원이며 증권사 비중은 지난해말 26.47%에서 2분기 29.8%로 늘었다. 증권업종 적립금 165조원 중 미래에셋증권이 52조원(31.5%)을 차지하고 삼성증권 28조원, 한국투자증권 26조원이 뒤를 잇는다. 3분기 증시 조정으로 4~6월 DB형에서 DC형으로 전환한 증권사 가입자의 7월·8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 한국투자증권의 MTS 연금서비스 전면개편, 신한투자증권의 연금고객관리팀 신설, NH투자증권의 법인고객 관리시스템(CIS) 구축 등 증권사들이 타사 고객 유치 경쟁에 나서고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "비즈워치", "published": "2026-10-09", "url": "https://news.bizwatch.co.kr/article/market/2026/10/08/0005", "related": [{"title": "퇴직연금 165조 잡은 증권사…다음 승부처는 '고객관리'", "source": "뉴스웨이", "url": "https://www.newsway.co.kr/news/view?ud=2026100713530728574"}]}, {"id": "376019080150", "title": "빼앗고 빼앗기는 증권사 연금 쟁탈전…대기업 거점 열고 MTS도 고친다", "summary": "NH투자증권은 경기도 화성시 삼성전자 사업장 인근에 연금 전문 상담 공간 '연금솔루션Lab 화성캠퍼스'를 열었고, 한국투자증권은 기업 인사·재무 담당자 대상 '퇴직연금 아카데미'를, 신한투자증권은 사내 '연금고객관리팀'을 신설했다. 한국투자증권·KB증권·미래에셋증권은 MTS 연금 화면 개편과 세금 시뮬레이션 기능 강화 등으로 가입자 락인에 나섰다. 금융감독원 통합연금포털에 따르면 2분기 말 전체 퇴직연금 적립금은 553조8779억원으로 전년 동기 대비 24.3% 늘었다. 같은 기간 15개 증권사 적립금은 112조6121억원에서 165조468억원으로 46.6% 급증해 비중이 25.3%에서 29.8%로 확대됐다.", "category": "업계·경쟁사", "importance": 3, "source": "대한경제", "published": "2026-10-14", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610131404539990372", "related": []}, {"id": "2e786d0d4177", "title": "김성주 국민연금 이사장 \"복지투자 1%도 못채워...노후 실버주택 필요\" [2026 국감]", "summary": "김성주 국민연금공단 이사장은 14일 국회 복지위 국정감사에서 국민연금의 복지투자가 허용 한도 1%도 채우지 못하고 있다고 밝혔다. 김 이사장은 56조원 정도 중 1%면 5600억원이지만 실제 투자는 2200억원이고 그중 노후긴급자금 1600억원이 대부분이라고 설명했다. 그는 노후 실버주택, 벤처 등 다양한 실험적 복지투자가 필요하다고 말했다. 또 국민연금이 기금형 퇴직연금 사업에 참여하려면 국민연금법 개정이 필요하다고 덧붙였다.", "category": "제도·규제", "importance": 3, "source": "파이낸셜뉴스", "published": "2026-10-14", "url": "https://www.fnnews.com/news/202610141058038307", "related": []}, {"id": "73ba4580ec4f", "title": "주식에 몰린 돈, 노후 연금 괜찮을까", "summary": "보험연구원의 '투자자산과 노후자산의 조화를 위한 연금세제 개편' 보고서에 따르면 가계·비영리단체 금융자산 중 주식·펀드 비중은 2018년 18.6%에서 2025년 26.5%로 높아졌고 보험·연금 비중은 32.9%에서 26.6%로 낮아졌다. 연금저축 안에서도 펀드 비중은 약 8%에서 30.9%로 커진 반면 보험 비중은 약 74%에서 57.6%로 줄었다. 연구진은 세제혜택의 크기를 일률적으로 조정하기보다 유지 기간이나 연금 수령 시점·기간에 혜택을 연계하고 세제 지원 한도를 물가와 노후소득 수준에 맞춰 주기적으로 점검해야 한다고 제언했다. 계좌 안에서 자산을 바꾸는 과정의 세금 부담을 줄이는 방안도 제시됐다.", "category": "제도·규제", "importance": 3, "source": "브라보마이라이프", "published": "2026-10-13", "url": "https://bravo.etoday.co.kr/view/atc_view/20235", "related": []}, {"id": "85b80368ee35", "title": "디폴트옵션에 국채까지…보험사 퇴직연금 경쟁력 시험대", "summary": "개인투자용 국채는 지난달부터 DC와 IRP 계좌에서도 10년물과 20년물을 매입할 수 있게 됐지만, 퇴직연금형 초기 판매기관은 은행 3곳과 증권사 5곳 등 8곳으로 보험사는 빠졌다. 이달 청약 금리는 10년물 연 4.79%, 20년물 연 4.95%이며 전체 발행 규모는 2,300억원이다. 2024년 권역별 퇴직연금 수익률은 증권업 6.33%, 생보 4.43%, 손보 3.93%였고, 보험업권의 적립금 비중은 지난해 말 20.9%에서 올해 상반기 19.4%로 낮아졌다. 업계는 국채를 취급하지 못하는 보험사가 신규 고객 유치와 기존 적립금 이탈 측면에서 불리해질 수 있다고 우려한다.", "category": "업계·경쟁사", "importance": 3, "source": "보험매일", "published": "2026-10-12", "url": "http://www.fins.co.kr/news/articleView.html?idxno=110194", "related": []}, {"id": "456b8e8847f8", "title": "한투증권, “36세 연금 고객 은퇴까지 책임진다”…초개인화 자산관리 승부수", "summary": "한국투자증권이 MTS 연금 서비스를 개편해 DC, IRP, 연금저축 계좌의 자산을 한 화면에서 보는 '연금 홈'을 신설하고 계좌 상태에 맞춘 행동 제안 기능을 넣었다. 회사의 신규 DC 가입자 평균 연령은 2015년 40세에서 지난해 36세로 낮아졌고, 퇴직 후 IRP를 거쳐 연금으로 수령하는 비중은 85%에 달한다. 지난해 말 퇴직연금과 개인연금 적립금은 각각 501조원, 198조원이며, 이 중 개인이 운용에 직접 관여하는 DC·IRP·개인연금 비중은 67.3%다. 회사는 모델포트폴리오 제안, AI 시황 분석, 고객별 인출 전략 제시 등으로 서비스를 넓힐 계획이다.", "category": "업계·경쟁사", "importance": 3, "source": "스포츠서울", "published": "2026-10-12", "url": "https://www.sportsseoul.com/news/read/1639735", "related": []}, {"id": "e6b3c61aef09", "title": "퇴직연금 실물이전 1년 8개월 16조…은행서 증권사로 5조 옮겨갔다", "summary": "2024년 10월 시작한 퇴직연금 실물이전으로 올해 6월 말까지 금융사를 갈아탄 퇴직연금은 15조8699억원이며, 이 중 은행에서 증권사로 넘어간 돈이 5조2225억원으로 전체 이전액의 3분의 1이다. 올해 상반기 이전액은 6조9000억원으로 지난해 같은 기간의 두 배가 넘었고, 제도별로는 IRP 이전액이 6조7695억원으로 가장 많았다. 받는 금융사가 같은 상품을 취급하지 않으면 매도해야 하고, 디폴트옵션 운용 자산과 보험계약 형태 적립금은 이전 대상이 아니다. 금융감독원과 예탁결제원 등 17개 기관의 TF는 이달 DC형에서 타사 IRP로 직행하는 전산 개발을 시작해 연말 도입을 목표로 한다.", "category": "운용·상품", "importance": 3, "source": "매일신문", "published": "2026-10-11", "url": "https://www.imaeil.com/page/view/2026101018515378392", "related": []}, {"id": "e0734bab8e9b", "title": "\"방치 계좌 해소 핵심 과제...위험자산 투자한도 현 70%보다 늘려야\"", "summary": "송상은 KB증권 연금그룹장은 11일 이데일리 인터뷰에서 고객의 무관심이 퇴직연금 저수익률의 가장 큰 원인이라며 방치된 계좌 해소를 핵심 과제로 집중 추진하고 있다고 밝혔다. KB증권은 고객 행동 데이터를 기반으로 현금성 자산 비중이 높거나 수익률이 낮은 고객에게 유형별 맞춤 콘텐츠와 안내 문자를 보내 리밸런싱을 유도하고 있으며, 금융감독원 공시 기준 올해 2분기 DC형과 IRP의 원리금비보장 수익률은 각각 60.13%, 52.98%였다. 연금본부 조직은 60여명에서 100명까지 늘었고 디폴트옵션 사전등록, ETF 적립식 매수, 로보투자일임 등 자동투자 서비스를 지원한다. 송 전무는 현 70%인 위험자산 투자한도를 늘려야 하며 발행어음과 IMA 상품 투자 허용도 긍정적 효과를 가져온다고 말했다.", "category": "업계·경쟁사", "importance": 3, "source": "이데일리", "published": "2026-10-11", "url": "https://www.edaily.co.kr/News/Read?newsId=01321846645611936&mediaCodeNo=257", "related": []}, {"id": "cbbb7085e290", "title": "퇴직급여 '일시금'…은퇴, 사라지는 '노후 안전판'", "summary": "퇴직연금 적립금은 2025년 말 501조4000억원에서 올해 6월 553조8779억원으로 늘어 연말 600조원을 넘어설 것으로 추산된다. 그러나 2025년 기준 퇴직급여 수급 계좌의 83.5%가 일시금을 택했고, 연금 수령 계좌 비중은 16.5%에 그쳤다. 금액 기준 연금 수령 비중은 61.6%였으며, 연금 선택 계좌의 평균 적립금은 1억4900만원인 반면 일시금 선택 계좌는 1833만원에 불과했다. 한국노동연구원 김동진 부연구위원은 퇴직소득세 과세체계를 연금 수급 전제로 개편하고 중도인출 요건 강화, 이직 시 IRP 해지 제한 등이 필요하다고 제언했다.", "category": "가입자·사회", "importance": 3, "source": "뉴스토마토", "published": "2026-10-11", "url": "http://www.newstomato.com/ReadNews.aspx?no=1316124&inflow=N", "related": []}, {"id": "610dc1a71d7a", "title": "700조 연금시장 쟁탈전…증권사로 '머니무브'", "summary": "지난해 말 퇴직연금과 개인연금을 합친 국내 연금시장 규모는 약 700조 원으로 1년 전보다 90조 원 가까이 불어났고, 가입자가 직접 운용하는 DC형·IRP·개인연금 비중이 67.3%에 달한다. 지난 6월 퇴직연금 시장에 뛰어든 키움증권은 ETF 실시간 거래와 적립식 투자 등을 앞세워 넉 달 만에 적립금 1,900억 원가량을 모았다. 한국투자증권도 MTS를 전면 개편해 흩어진 연금 자산을 한눈에 보여주고 자산 진단에서 투자까지 바로 이어지도록 했다. 퇴직연금 실물 이전 제도 시행 이후 은행에서 증권사로 옮겨간 퇴직연금은 5조 원을 넘어섰다.", "category": "업계·경쟁사", "importance": 3, "source": "연합뉴스TV", "published": "2026-10-10", "url": "http://www.yonhapnewstv.co.kr/news/MYH20261010095123B1O", "related": []}, {"id": "0caba587f9cc", "title": "“국민연금 19% 벌 때, 29개 기금은 2%대”…수익률 최대 8배 격차 왜?", "summary": "정부가 운용하는 68개 기금의 지난해 여유자금 운용수익률이 최고 18.97%에서 최저 2.27%까지 8배 넘게 차이 난 것으로 나타났다. 국민연금기금이 18.97%로 가장 높았고 사립학교교직원연금기금(18.93%)이 뒤를 이었으며, 공공자금관리기금은 2.27%로 가장 낮았다. 연기금투자풀에 여유자금을 전액 맡긴 42개 기금 중 27개는 수익률이 3%에 못 미쳤고, 투자풀 상품별 수익률은 주식형 38.34%, 채권형 2.63%였다. 정성호 의원은 수익률을 1%포인트만 높여도 8000억원의 국부를 창출할 수 있다며 기획예산처의 관리를 촉구했다.", "category": "법인·자금운용", "importance": 3, "source": "매일경제", "published": "2026-10-10", "url": "https://www.mk.co.kr/article/12172697", "related": []}, {"id": "abbeee11066a", "title": "노후자금 환율 방어 동원 논란에도…국민연금 “외환 관련 공개 불가”", "summary": "서영석 더불어민주당 의원이 국민연금으로부터 제출받은 자료에 따르면 국민연금은 환헤지 규모, 비용, 환차손익 공개를 요청받았으나 시장 교란과 기금 불이익이 예상된다며 공개를 거부했다. 국민연금은 원·달러 환율이 1500원을 넘자 올해부터 전략적 환헤지를 가동했고, 4월에는 전략적 환헤지 비율을 10%에서 15%로 상향했다. 환율이 1550원선을 돌파했던 6월에는 선물환 매도에 나서 환율이 1510원대 초반으로 하락했다. 14일 국민연금 국정감사에서는 환율 방어 동원과 리밸런싱 유예 여부를 두고 공방이 예상된다.", "category": "가입자·사회", "importance": 3, "source": "서울경제", "published": "2026-10-09", "url": "https://www.sedaily.com/article/20099720", "related": []}]}, "monthly": {"period": "monthly", "key": "current", "label": "2026-09-15 ~ 2026-10-14", "generated_at": "2026-10-15T10:32:30+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "5e67ec767c57", "title": "퇴직연금 문 열린 개인용 국채…첫 선택은 10년물에 쏠렸다", "summary": "재정경제부에 따르면 9월 9~15일 진행된 개인투자용 국채 청약에 총 2585억원이 접수돼 발행 예정액 2300억원을 웃돌았다. 이달부터 퇴직연금 계좌를 통한 투자가 허용되면서 청약액이 지난 5월 이후 처음으로 2000억원대로 올라섰다. 9월 청약액 가운데 연금계좌 청약액은 1433억원으로 절반을 넘었고 실제 배정액은 1271억원이다. 연금계좌 청약 대상인 10년물과 20년물 중 10년물에 1168억원이 몰려 전체의 74.1%를 차지했고, 10년물 발행한도는 1100억원에서 1356억원으로 늘었다.", "category": "운용·상품", "importance": 4, "source": "연합인포맥스", "published": "2026-09-25", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436449", "related": [{"title": "개인 퇴직연금 계좌 통해 장기국채 투자 길 열렸다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712685/2"}, {"title": "개인 국채투자, '퇴직연금서 투자'에 흥행…9월 청약서 초과 수요", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260917099600008"}, {"title": "\"1억 넣어두면 20년 뒤 2.6억\"…연금개미들 외면한 이유", "source": "한국경제", "url": "https://www.hankyung.com/article/202609168563i"}, {"title": "퇴직연금 들어온 개인투자용 국채…금리보다 먼저 볼 '만기'", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2633616"}, {"title": "[개인국채 시대] 삼성·한투·KB·NH證 합류…경쟁 본격화", "source": "딜사이트경제TV", "url": "https://news.dealsitetv.com/articles/176341"}, {"title": "[개인국채 시대] 미래에셋 선구안 빛났다…선점효과 기대 다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "f14fcbcde9b5", "title": "550조 퇴직연금 판 흔든다…국민연금 참여 '기금형 퇴직연금' 법안 발의", "summary": "더불어민주당 이용우 의원이 공동발의 12인과 함께 10월 2일 근로자퇴직급여 보장법 일부개정법률안을 발의했다. 개정안은 국민연금공단 등 공적연금관리기관이 기금형 퇴직연금 사업에 참여할 수 있도록 하고, 시장점유율 상한을 3년차 10%, 4년차 20%, 5년차 30%로 두었다. 2025년 말 퇴직연금 적립금은 501조4000억원이고 2024년 수익률은 4.77%로 같은 해 국민연금 수익률 15.0%를 밑돌았으며, 수수료는 2018년 8956억원에서 2025년 1조7748억원으로 98% 늘었다. 중소기업퇴직연금기금 가입 대상은 현재 100명 미만에서 2028년까지 300명 이하로 확대되고, 법안은 공포 후 1년이 지나 본격 시행된다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-10-07", "url": "http://www.globalepic.co.kr/view.php?ud=2026100708100769037cc35ccc5c_29", "related": [{"title": "'기금형 퇴직연금' 정기국회 논의 본격화 할 듯", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237123"}, {"title": "\"저조한 수익률, 높은 수수료\" 구조인 현행 계약형 퇴직연금 보완하는 기금형 퇴직연금 병행도입 필요", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=493587"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", : "6c986a5b1bb4", "title": "한국투자증권, 기업 대상 ‘퇴직연금 아카데미’ 개최…제도 변화 대응 전략 제시", "summary": "한국투자증권은 지난 8일 서울 여의도 TP타워에서 기업 인사·재무 담당자 등 퇴직연금 실무자를 대상으로 ‘퇴직연금 아카데미’를 개최했다. 행사는 근로자퇴직급여 보장법 개정 추진에 맞춰 기금형 퇴직연금 도입과 퇴직급여 사외적립 의무화 등 현안을 중심으로 3개 세션으로 진행됐다. 기금형 도입에 따른 운용 효율성 제고 방안과 사외적립 의무화 대비 실무 가이드라인, 정년연장·임금피크제 운영 전략, 전담 RM 활용 방안 등이 소개됐다. 김도현 개인고객그룹장은 기업들이 제도 변화에 선제적으로 대응할 수 있도록 맞춤형 컨설팅과 실무 지원을 강화하겠다고 말했다.", "category": "법인·자금운용", "importance": 3, "source": "비즈월드", "published": "2026-10-13", "url": "http://www.bizwnews.com/news/articleView.html?idxno=148655", "related": [{"title": "한국투자증권, 퇴직연금 500조 기업시장 공략…인사·재무 담당자 접점 확대", "source": "토요경제", "url": "https://sateconomy.co.kr/news/view/1065574639722076"}, {"title": "한국투자증권, 기업 실무진 대상 '퇴직연금 아카데미' 개최", "source": "뉴스드림", "url": "http://www.newsdream.kr/news/articleView.html?idxno=119732"}, {"title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "source": "아시아경제", "url": "https://view.asiae.co.kr/article/2026101209461462366"}, {"title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "source": "머니투데이", "url": "https://www.mt.co.kr/stock/2026/10/12/2026101210195750915"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "7ef94cfb1aa4", "title": "[경제 트렌드] 증권사, 퇴직연금 규모 급증...한국투자증권, 연금 적립·운용·수령까지 은퇴 준비 전 과정 밀착 지원", "summary": "퇴직연금 적립금은 지난 8월 기준 550조원을 웃돌았고 실적배당형 비중은 35%를 기록했으며, 증권사 퇴직연금 규모는 2025년 말 141조6797억원으로 전 금융권 적립금의 29.3%를 차지했다. 증권사 적립금 순위는 미래에셋증권, 삼성증권, 한국투자증권, 현대차증권, NH투자증권 순이다. 한국투자증권은 연금 MTS를 개편해 '나의 총 연금자산'과 개인화 맞춤 알림 기능을 도입했고, 신규 DC 가입자 평균 연령이 2015년 40세에서 2025년 36세로 낮아졌다고 밝혔다. 신한투자증권은 올해 연금고객관리팀을 신설해 신규 DC·IRP 가입 고객 대상 웰컴콜과 연금PB 1대1 매칭, 'Premier 연금컨설팅'을 운영하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "시사캐스트", "published": "2026-10-08", "url": "http://www.sisacast.kr/news/articleView.html?idxno=100731", "related": [{"title": "한국투자증권, 연금 MTS 개편…“적립·운용·수령까지 밀착 지원”", "source": "더퍼블릭", "url": "https://www.thepublic.kr/news/articleView.html?idxno=321335"}, {"title": "한국투자증권, 연금 MTS 개편 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31774"}]}, {"id": "6da1ff9b2cf1", "title": "'2164억 체불' 대유위니아…3년 연속 퇴직연금 적립 미달", "summary": "대유위니아 계열 가전 3사(위니아·위니아전자·위니아전자MF)가 2022년부터 2024년까지 3년 연속 DB형 퇴직연금 법정 최소적립금을 채우지 못한 것으로 김주영 의원이 고용노동부에서 받은 자료에서 나타났다. 위니아전자의 최소적립금 대비 실제 적립 비율은 2022년 5.86%, 2023년 5.88%, 2024년 5.68%였고 위니아전자MF는 같은 기간 14.11%에서 9.45%로 떨어졌다. 2022년부터 지난달 3일까지 3사의 전체 체불액은 2164억원이며 이 중 체불 퇴직금은 858억원이다. 고용노동부가 이들 계열사에 관련 과태료를 부과한 사례는 없었다.", "category": "법인·자금운용", "importance": 3, "source": "뉴시스", "published": "2026-10-10", "url": "https://www.newsis.com/view/NISX20261010_0003820502", "related": [{"title": "대유위니아 가전 3사, 퇴직연금 법정 적립금 3년 연속 미달", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5070068"}]}, {"id": "fcba047b4874", "title": "머니무브 주춤, 더 치열해진 증권사 퇴직연금 경쟁", "summary": "올해 2분기말 기준 퇴직연금 시장은 553조8949억원이며 증권사 비중은 지난해말 26.47%에서 2분기 29.8%로 늘었다. 증권업종 적립금 165조원 중 미래에셋증권이 52조원(31.5%)을 차지하고 삼성증권 28조원, 한국투자증권 26조원이 뒤를 잇는다. 3분기 증시 조정으로 4~6월 DB형에서 DC형으로 전환한 증권사 가입자의 7월·8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 한국투자증권의 MTS 연금서비스 전면개편, 신한투자증권의 연금고객관리팀 신설, NH투자증권의 법인고객 관리시스템(CIS) 구축 등 증권사들이 타사 고객 유치 경쟁에 나서고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "비즈워치", "published": "2026-10-09", "url": "https://news.bizwatch.co.kr/article/market/2026/10/08/0005", "related": [{"title": "퇴직연금 165조 잡은 증권사…다음 승부처는 '고객관리'", "source": "뉴스웨이", "url": "https://www.newsway.co.kr/news/view?ud=2026100713530728574"}]}, {"id": "c4dab2068ab2", "title": "복지부 국감 개막⋯기초연금 '반쪽 개편'·국민연금 손실 추궁 [국감]", "summary": "국회 보건복지위원회가 7일 보건복지부와 질병관리청을 시작으로 이틀간 국정감사에 들어갔다. 핵심 쟁점은 연금제도 개편안으로, 복지부가 추진해 온 저소득층 노인 중심 '하후상박' 기초연금 개편이 사회적 논의 부족을 이유로 1년짜리 단기 계획에 그친 점이 '반쪽 개편'이라는 지적을 받을 전망이다. 국민연금은 기금 재정 안정성과 함께 자산배분 리밸런싱 한시 유예, 국내 주식 목표 비중 상향(14.9%→20.8%)에 따른 증시 급락 손실 문제가 검증대에 오른다. 복지위 국감은 14일 국민연금공단, 16일 국민건강보험공단·건강보험심사평가원을 거쳐 27일 종합감사로 마무리된다.", "category": "제도·규제", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2633071", "related": [{"title": "기초연금 '반쪽' 개편·국립대병원 첫 등판…복지부 국감 쟁점은", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261003_0003813472"}]}, {"id": "3222e4df0aa6", "title": "[연금개혁] '골든타임' 놓치면 무용지물…국고 GDP 1% 지금 투입 땐 31년 연장, 고갈 후엔 1년뿐", "summary": "국회예산정책처 분석에 따르면 현행 제도가 유지될 경우 국민연금 기금은 2069년에 소진된다. 정부가 지금부터 매년 GDP의 1%를 투입하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥난 2069년부터 투입하면 1년만 연장된다. 기금 수익률을 2%포인트 높이면 2120년까지 흑자를 유지할 수 있다.", "category": "제도·규제", "importance": 3, "source": "CBC뉴스", "published": "2026-10-01", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=611066", "related": [{"title": "\"국민연금 수익률 2%p 높이면 2120년까지 기금 고갈 없어\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260929100600530?input=1195m"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": "2026-09-20", "url": "http://www.smarttimes.co.kr title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "1fc91cd9d139", "title": "리스크 관리·노후수입 한번에…주목받는 보증형 실적 배당보험", "summary": "미래에셋생명의 개인형 퇴직연금(IRP) 보증형 실적배당보험이 출시 후 717억원을 모집했다고 전했다. 이 상품은 IRP를 통해서만 가입할 수 있는 거치형으로, 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 연금 개시가 가능하다. 이미 만 55세를 넘긴 가입자는 가입과 동시에 연금을 받을 수 있고, 적립금이 소진될 때까지 20년 이상 연금을 수령할 수 있다. 적립금은 미래에셋생명의 일임형 자산배분펀드 MVP펀드를 통해 글로벌 자산에 분산투자된다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645584384&mediaCodeNo=257", "related": [{"title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024"}, {"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "f14fcbcde9b5", "title": "550조 퇴직연금 판 흔든다…국민연금 참여 '기금형 퇴직연금' 법안 발의", "summary": "더불어민주당 이용우 의원이 공동발의 12인과 함께 10월 2일 근로자퇴직급여 보장법 일부개정법률안을 발의했다. 개정안은 국민연금공단 등 공적연금관리기관이 기금형 퇴직연금 사업에 참여할 수 있도록 하고, 시장점유율 상한을 3년차 10%, 4년차 20%, 5년차 30%로 두었다. 2025년 말 퇴직연금 적립금은 501조4000억원이고 2024년 수익률은 4.77%로 같은 해 국민연금 수익률 15.0%를 밑돌았으며, 수수료는 2018년 8956억원에서 2025년 1조7748억원으로 98% 늘었다. 중소기업퇴직연금기금 가입 대상은 현재 100명 미만에서 2028년까지 300명 이하로 확대되고, 법안은 공포 후 1년이 지나 본격 시행된다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-10-07", "url": "http://www.globalepic.co.kr/view.php?ud=2026100708100769037cc35ccc5c_29", "related": [{"title": "'기금형 퇴직연금' 정기국회 논의 본격화 할 듯", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237123"}, {"title": "\"저조한 수익률, 높은 수수료\" 구조인 현행 계약형 퇴직연금 보완하는 기금형 퇴직연금 병행도입 필요", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=493587"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "6c986a5b1bb4", "title": "한국투자증권, 기업 대상 ‘퇴직연금 아카데미’ 개최…제도 변화 대응 전략 제시", "summary": "한국투자증권은 지난 8일 서울 여의도 TP타워에서 기업 인사·재무 담당자 등 퇴직연금 실무자를 대상으로 ‘퇴직연금 아카데미’를 개최했다. 행사는 근로자퇴직급여 보장법 개정 추진에 맞춰 기금형 퇴직연금 도입과 퇴직급여 사외적립 의무화 등 현안을 중심으로 3개 세션으로 진행됐다. 기금형 도입에 따른 운용 효율성 제고 방안과 사외적립 의무화 대비 실무 가이드라인, 정년연장·임금피크제 운영 전략, 전담 RM 활용 방안 등이 소개됐다. 김도현 개인고객그룹장은 기업들이 제도 변화에 선제적으로 대응할 수 있도록 맞춤형 컨설팅과 실무 지원을 강화하겠다고 말했다.", "category": "법인·자금운용", "importance": 3, "source": "비즈월드", "published": "2026-10-13", "url": "http://www.bizwnews.com/news/articleView.html?idxno=148655", "related": [{"title": "한국투자증권, 퇴직연금 500조 기업시장 공략…인사·재무 담당자 접점 확대", "source": "토요경제", "url": "https://sateconomy.co.kr/news/view/1065574639722076"}, {"title": "한국투자증권, 기업 실무진 대상 '퇴직연금 아카데미' 개최", "source": "뉴스드림", "url": "http://www.newsdream.kr/news/articleView.html?idxno=119732"}, {"title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "source": "아시아경제", "url": "https://view.asiae.co.kr/article/2026101209461462366"}, {"title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "source": "머니투데이", "url": "https://www.mt.co.kr/stock/2026/10/12/2026101210195750915"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "publish 석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },

  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =

    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(

      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
