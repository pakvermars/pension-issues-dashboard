  * { box-sizing: border-box; }

  body {

    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야
     구분선이 아니라 종이의 테두리로 읽힌다. */
  .topline { height: 4px; background: var(--kiwoom-deep); }

  /* 수집이 멈춰도 index.html은 그대로 남아 아무 일 없어 보인다. 그래서

  .masthead {

    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;

  .search input::placeholder { color: var(--rule); }

    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {

    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;

    color: var(--ink-soft);

    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);

  .filters button {

    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {

    font-size: 2rem;
    line-height: 1.1;

    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;

    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;

    text-decoration: none;
    border-bottom: 1px solid transparent;

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {

    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;

    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

퇴직급여 보장법 개정안이 발의됐다. 지난해 말 퇴직연금 적립금은 501조4000억원, 연 수익률은 6.47%였으나 10년 연환산 수익률은 2.64%에 그쳤고 디폴트옵션 적립금 53조3000억원의 85.4%가 안정형에 몰렸다. 국민연금기금의 지난해 수익률은 18.82%(잠정)였고, 김성주 이사장은 공단 참여 시 수수료를 기존의 3분의 1 수준으로 낮출 수 있다고 밝힌 바 있다. 금융권은 적립금이 공단으로 쏠릴 수 있다고 우려한다.", "category": "제도·규제", "importance": 3, "source": "세계일보", "published": "2026-11-20", "url": "https://www.segye.com/newsView/20261120501311?OutUrl=naver"}, {"id": "a350f9e0c1d6", "title": "개인투자용 국채 퇴직연금 청약액 한 달 새 21%↓…일반계좌는 15%↑", "summary": "재정경제부 발행 결과에 따르면 퇴직연금 계좌(DC·IRP)를 통한 개인투자용 국채 10년물·20년물 청약액은 9월 1433억원에서 10월 1137억원으로 20.7% 감소했다. 같은 기간 일반 전용계좌 청약액은 540억원에서 620억원으로 14.8% 늘었다. 10년물·20년물 전체 청약액에서 퇴직연금 계좌 비중은 72.6%에서 64.7%로 7.9%포인트 낮아졌다. 미래에셋증권 분석에서는 자사 청약 고객의 64.4%가 두 달 이상 반복 청약했다.", "category": "운용·상품", "importance": 3, "source": "이지경제", "published": "2026-11-20", "url": "https://www.ezyeconomy.com/news/articleView.html?idxno=242028"}, {"id": "348e8a741d11", "title": "발행어음·연금으로 판 넓힌 키움증권…엄주성, 연임 문턱 넘을까", "summary": "엄주성 키움증권 대표의 사내이사 임기가 내년 3월 28일 만료되면서 연임 여부에 관심이 쏠린다. 엄 대표는 영풍제지 미수금 사태 이후 위험관리 조직을 정비하고, 발행어음과 퇴직연금으로 주식 중개 중심의 사업 범위를 넓혔다. 올해 6월 시작한 퇴직연금 적립금은 6월 말 649억원에서 9월 말 1882억원으로 늘었고, 이 가운데 IRP가 1626억원으로 86.4%를 차지하며 IRP 적립금의 약 75%는 타 금융회사에서 이전해 온 자금이다. 반면 국내주식 리테일 점유율은 지난해 3분기 27%에서 올해 3분기 25%로 하락했고 전산장애로 온라인 거래 안정성도 도마에 올랐다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스웨이", "published": "2026-11-20", "url": "https://www.newsway.co.kr/news/view?ud=2026111915253277631"}, {"id": "89c5f6bb026b", "title": "퇴직금까지 합치면…퇴직급여 규모, 이르면 2039년 국민연금 기금 추월", "summary": "국회예산정책처 분석에 따르면 사내 퇴직금 추정액을 퇴직연금 적립금에 더하면 국내 퇴직급여 규모가 이르면 2039년 국민연금 기금을 넘어서며, 이는 퇴직연금 적립금만 비교한 2050년보다 11년 빠르다. 지난해 퇴직금 제도를 적용받는 18~59세 근로자는 459만명으로 추산됐고, 2024년 퇴직연금 도입률은 26.5%, 5인 미만 사업장은 10.6%였다. 정부는 근로자퇴직급여보장법 개정안이 연내 통과되면 2028년 100인 이상, 2029년 10~99인, 2030년 10인 미만 사업장 순으로 사외적립을 의무화하며, 의무는 시행 이후 근속분부터 적용된다. 내년 예산안에는 사외적립 조기 도입 사업장 부담금 지원 60억원과 신규 도입 중소기업 융자비용 보전 62억원이 반영됐다.", "category": "제도·규제", "importance": 3, "source": "헤럴드경제", "published": "2026-11-20", "url": "https://biz.heraldcorp.com/article/10943400?ref=naver"}, {"id": "ce8090bd48be", "title": "[500조 연금 새 판]④ 우리금융, 푸른씨앗 4년 노하우…운용력 주목", "summary": "우리금융그룹은 지주·은행·증권·보험·자산운용이 참여하는 워킹그룹을 기반으로 정부의 기금형 퇴직연금 도입 방안에 대한 대응을 논의하고 있다. 우리은행은 2022년 출범한 공적 기금형 퇴직연금 푸른씨앗의 주거래은행을 맡아왔고 8월 제2기 주거래은행으로 재선정됐다. 3분기 말 우리은행 퇴직연금 적립금은 33조243억원으로 2분기 말 34조271억원보다 줄었고, 원리금비보장형 1년 수익률은 DC 18.40%, IRP 18.30%다. 정부는 금융기관 개방형 수탁법인에 최소자본금 120억원과 필수 전문인력·내부통제 체계를 요구하는 방안을 제시했다.", "category": "업계·경쟁사", "importance": 3, "source": "블로터", "published": "2026-11-20", "url": "https://www.bloter.net/news/articleView.html?idxno=679216"}, {"id": "90a2e9b1489a", "title": "NH농협은행, IRP 수익률 21.1% 기록…스타트업 협업 성과도 공개", "summary": "금융감독원 통합연금포털의 2026년 3분기 공시에 따르면 NH농협은행의 DB형 원리금비보장상품 1년 운용수익률은 14.89%, 개인형IRP는 21.1%로 적립금 상위 10개사 중 1위를 기록했다. 제도별 적립금 규모를 반영한 종합(가중평균) 1년 수익률도 19.3%로 상위 10개사 중 1위에 올랐고, 5대 은행 기준 1년 종합수익률 1위를 6분기 연속 유지했다. 농협은행은 ETF 상품 88종을 신규 출시하고 개인투자용 국채를 도입해 투자 선택권을 넓혔다. 같은 기사에서 18일 열린 2026 NH오픈비즈니스데이와 스타트업 협업 성과도 소개했다.", "category": "업계·경쟁사", "importance": 3, "source": "데일리팝", "published": "2026-11-20", "url": "http://www.dailypop.kr/news/articleView.html?idxno=104793"}, {"id": "36bbc52902da", "title": "\"변동성 큰 시장… 퇴직연금, 국채 밑바탕 ETF 비중 30% 이하로\"", "summary": "정환 NH투자증권 연금자산관리본부장은 변동성 장세에서 퇴직연금 계좌에 국채 등 안정 상품을 깔고 변동성이 큰 ETF 비중은 30% 이하로 유지하라고 조언했다. 증권사 13곳 DC형 원리금비보장 상품 평균 수익률은 6월 말 연 54.7%에서 9월 말 연 16.2%로 떨어졌다. 대안으로 개인 투자용 국채와 원금 99% 지급형 퇴직연금 전용 ELS를 제시했다. NH투자증권 DC·IRP 합산 적립금은 지난해 12월 말 6조1700억원에서 올 9월 말 8조2800억원으로 늘었다.", "category": "운용·상품", "importance": 2, "source": "동아일보", "published": "2026-11-20", "url": "https://www.donga.com/news/Economy/article/all/20261119/135056614/2"}, {"id": "b6afa9533b25", "title": "\"국민연금, 국내 주식 매각 국면에 대비한 로드맵 정비해야\"", "summary": "재정경제부 공공기관 경영평가단은 2025년도 경영실적 평가에서 국민연금공단에 기금 소진 국면에 대비한 국내 주식 매각 충격 대응체계 로드맵을 보완하라고 주문했다. 평가단은 대응 수단별 발동 조건과 시행 일정, 시나리오별 갱신 주기를 담은 단계별 이행 로드맵과 사전 모의점검 체계를 요구했다. 자본시장연구원은 국내 주식 보유액이 2040년 242조2000억원으로 정점을 찍은 뒤 연평균 16조6000억원을 순매도해야 할 것으로 전망했다.", "category": "가입자·사회", "importance": 2, "source": "조선일보", "published": "2026-11-20", "url": "https://www.chosun.com/economy/stock-finance/2026/11/20/ZQSJ4JHCDVG7NL4VPVARKZYOH4/"}, {"id": "d8d2afc23fed", "title": "[월드 투데이] \"사회보장제도는 합법적 폰지사기?\"…美 의회 보고서, 사회보장기금 고갈 경고", "summary": "미국 공화당 소속 론 존슨 상원 예산위원장이 보고서에서 사회보장제도를 '합법적 폰지사기'에 비유하며 현행 제도가 지속 불가능한 구조라고 주장했다. 보고서는 2032년 약 5,110억 달러 규모의 기금 적자가 발생해 같은 해 연방정부 재정적자의 약 21%에 해당할 것으로 전망했다. 미국 근로자는 급여의 6.2%를 사회보장세로 내고 고용주도 같은 금액을 부담하지만, 납부액은 개인 계좌에 쌓이지 않고 현재 수급자 지급에 쓰이는 부과 방식이다. 민주당은 고소득층 과세 확대를, 공화당 재정보수파는 수급 연령 상향과 급여 조정을 개혁안으로 제시하고 있다.", "category": "가입자·사회", "importance": 2, "source": "위키리크스한국", "published": "2026-11-20", "url": "https://www.wikileaks-kr.org/news/articleView.html?idxno=194883"}, {"id": "958919d32d14", "title": "미래에셋증권 AWS 기반 지식그래프로 '진일보'", "summary": "미래에셋증권이 20일 아마존웹서비스(AWS) 기반으로 구축한 생성형 AI 서비스 '상품 지식 AI 검색'을 임직원 업무에 본격 적용했다고 밝혔다. 약 1만3000건의 문서를 상품 기준정보와 연결한 지식그래프를 구축해 직원 질문에 출처와 기준일을 담아 답변한다. 회사는 2027년 상반기 고객 대상 서비스를 선보이고, 2027년 중 AWS와 협력해 연금 업무 에이전트를 내놓을 계획이다. 증권업계에서 가장 많은 퇴직연금 적립금을 운용하는 만큼 연금 고객 응대의 정확도와 일관성을 높일 수 있을 것으로 기대하고 있다.", "category": "업계·경쟁사", "importance": 2, "source": "이코노믹리뷰", "published": "2026-11-20", "url": "https://www.econovill.com/news/articleView.html?idxno=757976"}, {"id": "7d0629216997", "title": "[시론] 퇴직 뒤에도 이어지는 '푸른씨앗'", "summary": "박승흡 근로복지공단 이사장은 올해 9월까지 푸른씨앗 인출액이 2871억원, 가입 해지자가 약 5만1130명으로 모두 지난해 연간 규모를 넘었다고 밝혔다. 같은 기간 적립금은 1조4900억원에서 1조9500억원으로 31.0% 늘었고, 수익률은 2025년 8.67%였다. 공단은 인출·해지 사유를 분석하고, 7월 출범한 푸른씨앗 IRP로 계좌 이전을 안내하는 등 퇴직 전후 상담 체계를 보완하겠다고 밝혔다.", "category": "가입자·사회", "importance": 1, "source": "서울경제", "published": "2026-11-20", "url": "https://www.sedaily.com/article/20116420?ref=naver"}, {"id": "257a9c9e354f", "title": "지수에도 못 미친 로보어드바이저, DC 확대는 신뢰부터 세워야", "summary": "장선필 연금연구소 대표는 코스콤 테스트베드센터가 11월 18일 공시한 퇴직연금형 RA 포트폴리오 447개를 집계한 결과 1년 단순평균 수익률이 0.1%였고 195개(43.6%)가 손실을 기록했다고 밝혔다. 같은 기간 코스피는 약 28% 올랐으며, 최근 3개월 코스피가 26% 가까이 하락하는 동안 RA 평균 손실은 8.1%였다. 필자는 RA의 DC 허용 시점을 기금형 도입 일정보다 검증 결과에 맞춰 결정해야 한다고 주장했다.", "category": "운용·상품", "importance": 1, "source": "뉴스퀘스트", "published": "2026-11-20", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=305417"}, {"id": "ddbd02105b53", "title": "81개 기업 담당자 한자리에…미래에셋생명, '2026 퇴직연금 마스터코스' 성료", "summary": "미래에셋생명은 지난달 23일 서울 포시즌스호텔에서 기업 퇴직연금 담당자 대상 '2026 퇴직연금 마스터코스'를 열었고 81개 기업에서 129명이 참석했다. 퇴직연금 입법 동향, DB형 자산운용 전략, IRP 보증형 실적배당보험 등을 다뤘다. 설문 응답자 122명 중 107명(88%)이 후속 상담이나 자료 제공을 희망했다.", "category": "법인·자금운용", "importance": 1, "source": "신아일보", "published": "2026-11-20", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5085045"}, {"id": "297f98faf2b3", "title": "퇴직연금으로 美 증시 투자, 환율이 연금 수익률 가른다 [이병희의 연금술사]", "summary": "같은 S&P500 지수를 추종하는 ETF라도 10월 27일 기준 3개월 수익률은 환헤지형 TIGER 미국S&P500(H)가 2.37%, 환노출형이 -7.86%로 10%포인트 가까이 벌어졌다. 원·달러 환율이 7월 초 1560원선에서 10월 26일 1323.1원으로 15%가량 떨어진 영향이며, 환헤지에는 한미 금리 차에 따른 비용과 더 높은 총보수가 따른다. 한국은행에 따르면 2월 말 기준 개인의 해외 주식형 ETF 중 환헤지 상품 비중은 2.5%에 그친다. 기사는 연금계좌에서 적립기에는 환노출, 수령기에는 헤지 비중을 높이는 전략을 제시한다.", "category": "운용·상품", "importance": 1, "source": "이코노미스트", "published": "2026-11-20", "url": "https://economist.co.kr/article/view/ecn202611190036"}, {"id": "aa0386f91a2e", "title": "[韓경제 아킬레스건](58) 노인 빈곤율 OECD 1위: 준비되지 않은 은퇴의 슬픈 초상", "summary": "한국 65세 이상 노인의 상대적 빈곤율은 40% 안팎으로 OECD 평균(약 14%)의 세 배에 달한다. 기고는 자녀에 대한 과도한 재정 지원, 주택 한 채에 쏠린 자산 구조, 낮은 공적연금 소득대체율과 미성숙한 사적연금 시장을 원인으로 꼽는다. 해법으로 은퇴자 재고용과 정년 연장 논의, 기초연금의 실질적 인상과 주택연금 활성화, 노후 재무 설계 인프라 확충을 제시한다.", "category": "가입자·사회", "importance": 1, "source": "금융소비자뉴스", "published": "2026-11-20", "url": "http://www.newsfc.co.kr/news/articleView.html?idxno=82471"}, {"id": "8ffbf2d00586", "title": "한국투자증권, 퇴직연금 유튜브 '한국인의 연금'서 매주 화요일 라이브 시황 세미나 진행", "summary": "한국투자증권이 퇴직연금 유튜브 채널 '한국인의 연금'에서 매주 화요일 오후 5시 정기 라이브 시황 세미나를 진행한다고 20일 밝혔다. 방송은 퇴직연금(DC·IRP)과 개인연금 계좌 특성을 고려한 장기 자산배분 전략에 초점을 맞추며, 위험자산 편입 한도(70%)에 따른 포트폴리오 조정법과 TDF·채권·배당형 자산 리밸런싱 방안을 소개한다. 실시간 채팅으로 연금 제도, 절세 혜택, 수령·인출 전략 관련 질의응답 코너도 운영한다. 최종진 연금혁신본부장은 연간 900만원 세액공제 한도를 활용한 장기 운용을 강조했다.", "category": "업계·경쟁사", "importance": 1, "source": "한국경제", "published": "2026-11-20", "url": "https://www.hankyung.com/article/202611185427O"}, {"id": "b1a622c9b818", "title": "\"노후 준비 없이 자녀 지원? 둘 다 죽는 방법\"…전문가가 꼽은 노후 준비 3원칙", "summary": "김경필 머니트레이닝랩 대표는 유튜브 채널 신사임당에 출연해 노후 준비를 위해 돈의 비용·소유·용도를 구분해야 한다고 조언했다. 굴릴 돈은 소득이 없어진 뒤 쓸 돈인 만큼 적은 돈이라도 오래 투자하면 된다며 국민연금과 퇴직연금을 예로 들었다. 자녀 지원은 부모의 노후 준비를 마친 뒤에 해야 한다는 우선순위를 강조했다. 노후 준비 상태는 집값이 아니라 현금흐름과 유동성으로 판단해야 하며 다운사이징과 주택연금 활용을 방법으로 제시했다.", "category": "가입자·사회", "importance": 1, "source": "파이낸셜뉴스", "published": "2026-11-20", "url": "https://www.fnnews.com/news/202611201056380656"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-11-13 ~ 2026-11-19", "generated_at": "2026-11-20T12:31:13+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "df6d8c8ff511", "title": "증시 급락에 퇴직연금 수익률 급감…적립금 11조7천억원 감소", "summary": "올해 3분기 말 퇴직연금 적립금은 542조1214억원으로 6월 말 553조8779억원보다 11조7565억원(2.1%) 줄었으며, 분기 적립금 감소는 2020년 1분기 이후 처음이다. 유형별 감소액은 IRP 5조129억원, DC형 3조8374억원, DB형 2조9062억원으로 IRP와 DC형이 전체 감소액의 약 75%를 차지했다. 증권사 11곳의 DC형 원금비보장상품 연간 누적 수익률은 2분기 말 52.85%에서 14.46%로, IRP는 46.97%에서 14.19%로 떨어졌다. DB형 수익률은 11.35%에서 3.86%로 낮아졌다.", "category": "운용·상품", "importance": 4, "source": "광주매일신문", "published": "2026-11-16", "url": "http://www.kjdaily.com/article.php?aid=1794759721692238276", "related": [{"title": "[퇴직연금 긴급점검] 6년 반 만에 적립금 감소…9월말 기준 3개월만에 11.7조 줄어", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202611181327078600627"}]}, {"id": "47078a2852d9", "title": "퇴직연금 ‘장기 성적표 1위’ 하나증권⋯AI·연금닥터의 맞춤 처방 [퇴직연금 542조 대격변 4-①]", "summary": "금융감독원 퇴직연금 공시에 따르면 3분기 말 하나증권의 DC형 원리금 비보장상품 수익률은 5년 연 8.03%, 7년 연 8.88%, 10년 연 7.21%로 세 구간 모두 증권업계 1위다. 하나증권의 DC형 적립금은 지난해 말 2805억원에서 3분기 말 3828억원으로, IRP 적립금은 6429억원에서 8926억원으로 늘어 합산 1조2754억원으로 38.1% 증가했다. 하나증권은 9월 차세대 MTS '하나증권V'를 출시하고 AI 기반 'AI 연금프로' 서비스를 운영하고 있다. 전국 영업점에는 연금 전문 PB인 '연금닥터'를 배치해 고액자산가와 은퇴 예정 고객에게 컨설팅을 제공한다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-19", "url": "https://www.etoday.co.kr/news/view/2649799", "related": []}, {"id": "41cb778f8d14", "title": "증권가 연말 稅테크...절세계좌 황금률은?", "summary": "연말정산을 앞두고 연금저축·IRP·ISA를 정해진 순서대로 채우는 '절세계좌 황금률'이 세후 수익을 가른다는 조언이 나왔다. 키움증권은 계좌별 세금 비교에서 연 수익 약 833만원까지는 해외 직접투자, 833만~2000만원은 일반계좌 ETF, 2000만원 초과는 연금저축이 유리하다고 분석했다. 상의민 키움증권 연금플랫폼본부 과장은 2030세대에는 ISA를 먼저 채우고, 50대 이상에는 중개형 ISA를 먼저 채운 뒤 연금저축을 과세이연 계좌로 쓰라고 권했다. 다만 건보공단이 연 1500만원 이하 사적연금(연금저축·IRP) 등 분리과세 소득에 건보료를 부과하는 방안을 국감 업무자료에 과제로 올려 절세 효과가 줄 수 있다는 관측도 제기된다.", "category": "가입자·사회", "importance": 4, "source": "주간한국", "published": "2026-11-19", "url": "https://weekly.hankooki.com/news/articleView.html?idxno=7193728", "related": []}, {"id": "e78fa29534f1", "title": "‘국민연금, 기금형 퇴직연금 진출’ 제동", "summary": "국민의힘 김위상 의원이 16일 국민연금 등 공적연금 관리·운용기관이 퇴직연금제도를 설정·운영할 수 없도록 하는 근로자퇴직급여 보장법 개정안을 대표 발의했다. 국민연금의 기금형 퇴직연금 참여를 막는 법안이 국회에서 발의된 것은 처음이다. 김 의원은 공적연금이 장기 기금 고갈 위험을 안고 있고 사회보장적 성격과 재정 운영 원리가 퇴직연금과 근본적으로 달라 두 제도를 엄격히 분리해야 한다고 밝혔다. 고용노동부는 지난달 퇴직연금 기능 강화 방안에서 국민연금공단 참여를 보류하고 참여 방식과 범위는 국회 논의에 맡긴 상태다.", "category": "제도·규제", "importance": 4, "source": "세계일보", "published": "2026-11-18", "url": "https://www.segye.com/newsView/20261117515456?OutUrl=naver", "related": []}, {"id": "059d4973c5c1", "title": "디폴트옵션 1위 NH투자증권…장기수익률 앞세워 연금자산 20조 돌파 [퇴직연금 542조 대격변 3-①]", "summary": "NH투자증권의 퇴직연금 적립금은 2026년 9월 말 약 11조8000억원으로 2022년 말 약 5조원에서 최근 3년간 연평균 약 25% 성장했고, 6월에는 연금저축을 합친 연금자산이 20조원을 넘었다. DC·IRP 적립금은 9월 말 기준 전년 말 대비 2조1000억원(34%) 늘어 증가액 기준 전체 사업자 중 8위다. 9월 말 원리금비보장형 최근 3년 연환산 수익률은 DC 16.3%, IRP 15.1%이고, IRP 10년 수익률은 전체 사업자 중 1위다. 디폴트옵션 중립투자형 2호는 최근 1년과 3년 누적 수익률 모두 증권업권 1위이며 적극투자형 2호는 3년 누적 71%를 기록했다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-18", "url": "https://www.etoday.co.kr/news/view/2649332", "related": []}, {"id": "9a0c71d9781b", "title": "금감원, 과당경쟁 경고 열흘 만에 DB손보 퇴직연금 들여다본다", "summary": "금융감독원이 퇴직연금 과당경쟁 자제를 요청한 지 열흘 만에 DB손해보험에 대한 퇴직연금 수시검사를 16일부터 2주간 진행하고 있다. 검사는 디폴트옵션, DC형 사용자 부담금, DB형 재정검증 결과 통보 등 관리업무 전반을 대상으로 한다. DB손보는 2024년 가입자 3명의 퇴직급여 2,520만원을 잘못된 계좌로 지급하고 계약이전 요청 47건을 기한 내 처리하지 않아 과태료 7,400만원을 받은 바 있다. 실물이전 제도 시행 후 2026년 6월 말까지 15조8,699억원이 다른 사업자로 이동했고, 이 중 은행에서 증권사로 옮겨간 자금은 5조2,225억원(33%)이다.", "category": "제도·규제", "importance": 4, "source": "글로벌에픽", "published": "2026-11-18", "url": "https://www.globalepic.co.kr/view.php?ud=2026111808433519687cc35ccc5c_29", "related": []}, {"id": "96986c106e5f", "title": "‘투자하는 연금’ 이끄는 미래에셋證…적립금 압도적 1위·ETF 25조원 [퇴직연금 542조 대격변 2-①]", "summary": "미래에셋증권의 올해 3분기 말 퇴직연금 적립금은 49조9034억원으로 증권업계 1위이며 2위 회사의 약 1.8배 규모다. DC형 23조3696억원과 IRP형 21조3498억원이 성장을 이끌었고, DB형 적립금은 5조1840억원으로 13% 줄었다. DC·IRP 계좌의 ETF 잔고는 9월 말 24조6700억원으로 2023년 말보다 6.3배 늘었고, 원리금비보장상품 비중은 DC형 76.6%, IRP형 76.2%다. 적립금 1조원 이상 증권사 기준 10년 연환산 수익률은 DC형 6.11%, IRP형 5.90%로 1위이며, 올해 1~10월 타 금융기관에서 이전된 적립금은 2조8000억원이다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-17", "url": "https://www.etoday.co.kr/news/view/2648643", "related": []}, {"id": "8a6ff2b99e7c", "title": "노사정, 퇴직연금 기능강화 입법 협력…영세사업장 연착륙 지원", "summary": "고용노동부는 16일 퇴직연금 노사정TF 간담회를 열어 퇴직연금 기능강화 방안의 입법 추진 과정에서 고려할 사항을 논의했다. 기능강화 방안은 퇴직급여 사외적립을 2028년 100인 이상, 2029년 10~99인, 2030년 10인 미만 사업장 순으로 의무화하고 기금형 퇴직연금을 활성화하는 것이 핵심이다. 참석자들은 영세 사업장의 어려움을 살피고 기금형이 유형별 장점을 살려 균형 있게 발전하도록 지원해야 한다고 밝혔다. 노사정은 대부분의 과제가 법률 개정을 수반하는 만큼 근로자퇴직급여보장법 개정까지 협력하기로 했다.", "category": "제도·규제", "importance": 4, "source": "연합뉴스", "published": "2026-11-16", "url": "https://www.yna.co.kr/view/AKR20261113167000530", "related": []}, {"id": "8cdc5764c17b", "title": "'체불 방지'서 '기금형·자동연금'으로…20년 대수술 속 증권사 파이 30% 육박", "summary": "금융감독원 통합연금포털에 따르면 올해 3분기 말 전체 퇴직연금 적립금은 542조1214억원이다. 지난해 3분기 대비 전체 적립금이 17.99% 늘어나는 동안 증권업권은 119조7275억원에서 160조2935억원으로 33.88% 급증해 은행권 순증액 34조4442억원을 추월했다. 같은 기간 은행 점유율은 52.46%에서 50.82%로 낮아졌다. 정부는 지난달 29일 발표한 기능강화 방안에서 IRP 위험자산 투자 한도를 70%보다 단계적으로 높이고 IMA와 발행어음의 DC·IRP 편입을 허용하기로 했다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-16", "url": "https://www.etoday.co.kr/news/view/2647920", "related": []}, {"id": "133e90c36463", "title": "“원리금 보장만” “위험자산 반 이상”…퇴직연금 가입자 돈 굴리기 양극화", "summary": "금융감독원에 따르면 퇴직연금 적립금은 2023년 말 382조원에서 올해 6월 말 558조원으로 늘었다. 가입자의 64.5%는 적립금 전액을 원리금 보장형에 두고 있고, 33.9%는 절반 이상을 위험자산에 투자했으며, 분산 투자로 균형을 맞춘 경우는 1.6%에 그쳤다. 실적배당형 비중은 2023년 12.8%에서 올해 6월 말 35.5%로 약 2.8배 늘었고 그중 50.4%가 ETF에 투자됐다. 금감원은 11월 3일 장기·분산 투자를 돕는 '퇴직연금 가이드북'을 발간했으며, 디폴트옵션도 대부분 원리금 보장형에 머물러 있다고 밝혔다.", "category": "운용·상품", "importance": 3, "source": "서울신문", "published": "2026-11-17", "url": "https://www.seoul.co.kr/news/economy/finance/2026/11/17/20261117031002", "related": [{"title": "같은 퇴직금, 20년 뒤엔 1억6천 차이…50대 여유 있다면 ‘보증형 보험’이 대안", "source": "경향신문", "url": "https://www.khan.co.kr/article/202611170600051"}, {"title": "김 과장·박 과장, 연금 똑같이 1000만 원씩 냈는데...20년 뒤 계좌 잔고 '충격'", "source": "파이낸셜뉴스", "url": "https://www.fnnews.com/news/202611161529480756"}, {"title": "퇴직연금 적립금 558조 넘겨…DC 전환 1년만 118% 증가", "source": "SBS Biz", "url": "https://biz.sbs.co.kr/article_hub/20000346629"}]}, {"id": "1cbb84fc63e3", "title": "디폴트옵션 수익률·적립금 성장 ‘압도적 1위’", "summary": "고용노동부의 2026년 3분기 디폴트옵션 현황에서 한국투자증권 '디폴트옵션 적극투자형 BF1'의 3년 누적 수익률은 100.97%로 전체 퇴직연금 사업자 포트폴리오 중 1위를 기록했다. 이는 전체 사업자 적극투자형 평균 수익률 57.58%를 웃도는 수치다. 3분기 말 한국투자증권의 DC·IRP 적립금 합산액은 18조5160억원으로 지난해 말 12조7868억원 대비 44.8% 증가했다. 한국투자증권은 MTS에 '총 연금자산 실시간 평가' 기능을 도입했다.", "category": "업계·경쟁사", "importance": 3, "source": "서울신문", "published": "2026-11-19", "url": "https://www.seoul.co.kr/news/economy/finance/2026/11/19/20261119023004", "related": []}, {"id": "a13c6305d83e", "title": "김승균 하나증권 연금단장 “장기 수익률 1위 이어 ‘하이테크·하이터치’로 승부” [퇴직연금 542조 대격변 4-②]", "summary": "김승균 하나증권 연금사업단장은 인터뷰에서 외형 확대보다 고객 노후자산을 안정적으로 불리는 데 집중해 왔다고 밝혔다. 하나증권은 3분기 기준 DC형 원리금비보장상품의 5년·7년·10년 수익률에서 모두 증권업계 1위를 기록했다. 김 단장은 퇴직연금 시장의 중심축이 DB형에서 DC형·IRP로, 저축에서 투자로, 적립에서 인출로 이동하고 있으며 계약형 제도도 기금형으로 변화하는 흐름에 주목한다고 말했다. 전체 퇴직연금에서 DC형·IRP 적립금은 2020년 말 100조원에서 올해 3분기 321조원으로 늘었다.", "category": "업계·경쟁사", "importance": 3, "source": "이투데이", "published": "2026-11-19", "url": "https://www.etoday.co.kr/news/view/2649924", "related": []}, {"id": "d28bb68de197", "title": "日전문가가 짚은 퇴직연금 개혁 방향…“과감히 대수술하고 단순화해야”", "summary": "오에 카요 일본 확정거출연금교육협회 이사는 복잡한 절차와 규칙이 연금 확산을 가로막고 있다며 제도를 과감히 손보고 단순화해야 한다고 말했다. 그는 중소기업 근로자의 가입을 늘리고 적립금을 은퇴 후 안정적 생활비로 연결하는 데 제도 개선의 초점을 맞춰야 한다고 강조했다. 일본은 다음 달부터 iDeCo 가입 가능 연령을 65세 미만에서 70세 미만으로 넓히고, 기업연금이 없는 회사원의 월 납입 한도를 2만3000엔에서 6만2000엔으로 올린다. 오에 이사는 한국이 사업주에게 퇴직연금제도 도입 책임을 부여한 점을 눈여겨봤다고 밝혔다.", "category": "제도·규제", "importance": 3, "source": "서울경제", "published": "2026-11-19", "url": "https://www.sedaily.com/article/20116017", "related": []}, {"id": "bbc3464e1c1d", "title": "[퇴직연금 긴급점검] 증시 급락에 DC형 전환가입자 울상…석 달 새 수익률 38%p 뚝", "summary": "올해 1~7월 DB형에서 DC형으로 전환한 가입자는 34만156명으로 전년 동기 대비 118.1% 늘었고, 6~7월에만 14만9710명이 전환했다. 코스피가 6월 22일 고점 대비 45.48% 급락하면서 3분기 DC형 원리금비보장 평균 수익률은 전 분기 55.47%에서 19.97%로 축소됐다. 증권사 11곳의 DC형 원리금비보장 누적 수익률은 52.85%에서 14.46%로 38.39%p 내렸고, 한국투자증권 13.59%, 미래에셋증권 13.88%, 삼성증권 14.72% 등 대형 증권사가 10%대로 내려앉았다. DB형 수익률은 11.35%에서 3.86%로 7.49%p 내리는 데 그쳤다.", "category": "운용·상품", "importance": 3, "source": "대한경제", "published": "2026-11-19", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202611181333322330630", "related": []}, {"id": "f90cfa9541cf", "title": "[퇴직연금 긴급점검] 은행·보험 ‘장기 안정자산 목적’ vs 증권 ‘적극 투자 운용’", "summary": "금감원 연금종합포털에 따르면 3분기 말 업권별 퇴직연금 적립금 비중은 은행 50.8%(275조4860억원), 증권 29.6%(160조2935억원), 보험 19.6%(106조3419억원)다. 전년 동기 대비 증권은 3.5%p 늘었고 은행과 보험은 각각 1.6%p, 1.9%p 줄었다. DC형 원리금비보장 수익률 평균은 증권이 17.60%에서 14.47%로 떨어진 반면 은행은 17.16%, 보험은 19.57%로 올랐다. 증권은 연금 전문 PB와 AI 투자자문으로, 은행은 4대 시중은행 모두 ETF 당일매매 서비스 도입으로 고객 유치전을 벌이고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "대한경제", "published": "2026-11-19", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202611181534369070671", "related": []}, {"id": "e3c686ccb925", "title": "500조원 쌓인 퇴직연금…여전히 노후자금보다 퇴직 목돈", "summary": "국회입법조사처에 따르면 지난해 말 퇴직연금 적립금은 잠정 501조원으로 전년보다 약 70조원(16.1%) 증가했다. 전체 수령계좌에서 일시금 비중은 83.5%에 달했고, 연금 수령을 선택한 경우에도 약 82%가 수령 기간을 10년 이하로 설정했다. 2024년 퇴직급여 중도 활용액 약 18조원 가운데 55세 이전 IRP 해지액이 15조원으로 83.3%를 차지했다. 지난해 연간 수익률은 6.47%였으나 10년 평균 수익률은 2.31%에 그쳤고, 5인 미만 사업장 가입률은 11.9%에 불과했다.", "category": "가입자·사회", "importance": 3, "source": "데일리안", "published": "2026-11-19", "url": "https://www.dailian.co.kr/news/view/1716905/?sc=Naver", "related": []}, {"id": "f28f27169b38", "title": "정환 연금자산관리본부장 \"퇴직연금 승부처는 지속적인 맞춤형 자산관리\" [퇴직연금 542조 대격변 3-②]", "summary": "정환 NH투자증권 연금자산관리본부장은 퇴직연금 경쟁의 최종 승자는 일시적 적립금 규모가 아니라 지속적인 맞춤형 자산관리로 갈린다고 밝혔다. 일회성 상품 권유에서 벗어나 데이터와 오프라인 전문 인력을 결합해 생애주기 전반의 포트폴리오를 점검하는 체제로 전환하겠다는 구상이다. 연금자산관리센터에서 연금 상담 인력과 PB가 1대1 진단을 제공하고 카카오톡 친구톡으로 연금 정보를 제공한다. 연말 점검 수칙으로 흩어진 연금계좌 파악, 방치된 상품과 현금성 자금 점검, 연금저축·IRP 합산 연 900만원 세액공제 한도 확인을 제시했다.", "category": "업계·경쟁사", "importance": 3, "source": "이투데이", "published": "2026-11-18", "url": "https://www.etoday.co.kr/news/view/2649323", "related": []}, {"id": "452cd7d32d66", "title": "미래에셋생명 해킹 피해 1만명 넘어…금융권 한달새 개인정보 47만건 유출", "summary": "지난달 24일 해킹 사고를 당한 미래에셋생명의 개인신용정보 유출 인원이 당초 약 6800명에서 5일 기준 1만418명으로 53.2% 늘었다. 금융당국 현장 점검에서 추가 피해가 확인됐으며, 이름·주민등록번호·CI와 함께 퇴직소득원천징수영수증, 지급명세서, 퇴직연금 현황 등도 유출된 것으로 확인됐다. 유출 규모가 1만명을 넘어 신용정보법상 72시간 내 금융당국 신고와 정보주체 통지 의무가 생겼고, 미래에셋생명은 신고 절차를 진행했다. 금융당국 집계로 최근 한 달간 금융권 37개사에서 약 47만3000건이 유출됐고 자금 탈취 피해는 약 10억원이다.", "category": "업계·경쟁사", "importance": 3, "source": "포쓰저널", "published": "2026-11-18", "url": "http://www.4th.kr/news/articleView.html?idxno=2122080", "related": []}, {"id": "ec53e7ac8727", "title": "[모닝 리포트] 연말 퇴직연금 금리 경쟁 심화…여전채·회사채 매수 확대 전망", "summary": "한국투자증권은 연말 퇴직연금 금리 경쟁이 심화되면서 은행보다 높은 금리를 제시하는 보험사와 증권사로 자금이 유입될 것으로 전망했다. 이달 퇴직연금 전용 1년 만기 상품 금리는 은행 정기예금 3.7%, 보험사 GIC 3.9%, 증권사 ELB 4.2%로 집계됐다. 지난해 말 DB형 적립금의 91.9%가 원리금보장형으로 운용됐고, 은행 예적금은 9.7% 감소한 반면 보험상품과 ELB는 각각 12.4%, 10.1% 증가했다. ELB 발행잔액의 60~70%가 12월 만기를 앞두고 있어 조달금리가 연 4% 초중반까지 오르고, 증권사 채권 매수 수요는 잔존만기 2~3년 우량 여전채·회사채에 집중될 것으로 예상됐다.", "category": "운용·상품", "importance": 3, "source": "뉴스핌" 029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "540조 퇴직연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936461/2"}, {"title": "퇴직연금, 전문가가 대신 굴린다…'기금형' 도입, 국민연금 참여는 미정", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6335473"}, {"title": "정부, 퇴직연금 기금형 활성화…IRP 위험자산 투자한도 상향 추진", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4441777"}, {"title": "\"퇴직금 못 받는 일 줄인다\", 사외적립 전 사업장 확대 추진", "source": "데일리환경", "url": "https://www.dailyt.co.kr/newsView/dlt202611040003"}, {"title": "기업 퇴직연금 모아 전문기관이 굴려… ‘쥐꼬리 수익’ 개선 기대", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936451/2"}, {"title": "국민연금, 기금형 퇴직연금 참여 미정···‘시장 개입 우려’에 국회로 공 넘긴 정부", "source": "경향신문", "url": "https://www.khan.co.kr/article/202610300600041"}, {"title": "[퇴직연금 개편] 퇴직연금도 국민연금처럼…정부, 장기 연금 수령 유도 방안 발표", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=620807"}, {"title": "퇴직연금 사외적립 2030년까지 전 사업장 의무화", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237470"}, {"title": "당정, ‘퇴직연금 강화·고용부 예산’ 살핀다…초광역특구법 논의 가능성", "source": "디지털타임스", "url": "https://www.dt.co.kr/article/12091950"}]}, {"id": "fd9e49abb205", "title": "한국투자증권, 퇴직연금 운용의 우위를 실증하다... 3년간 수익률 100% 돌파", "summary": "고용노동부의 9월 말 기준 공시에서 한국투자증권 디폴트옵션 적극투자형 BF1의 3년 누적 수익률이 100.97%로 전체 퇴직연금사업자 포트폴리오 가운데 가장 높았다. 이는 적극투자형 평균 57.58%를 43.39%포인트 웃돌며, 업권별 평균은 증권 61.45%, 은행 55.76%, 보험 55.03%였다. 핵심 전략은 한국투자신탁운용과 협업한 MySuper 알아서 성장형 펀드로 글로벌 우량주와 부동산·인프라·물가연동채권 등 대체자산에 분산투자한다. 3분기 말 DC·IRP 합산 적립금은 18조5160억원으로 지난해 말보다 5조7292억원(44.8%) 늘었다.", "category": "업계·경쟁사", "importance": 4, "source": "리버티코리아포스트", "published": "2026-11-05", "url": "http://www.lkp.news/news/articleView.html?idxno=85780", "related": [{"title": "한투증권, 디폴트옵션 3년 누적 수익률 100.97%…전 사업자 1위", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261104_0003853884"}, {"title": "퇴직연금 3년 새 '두 배' 불렸다…한국투자증권, 디폴트옵션 수익률 전체 1위 달성", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "5dd7e8508fc5", "title": "하나은행, 호남권 첫 시니어 특화 금융라운지 광주에 개점", "summary": "하나은행은 지난 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 금융공간인 '하나더넥스트 광주금융 라운지'를 개점했다. 라운지는 은퇴설계, 상속·증여, 유언대용신탁 상담과 건강관리·문화·주거 등 라이프케어 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산, 예상 지출을 분석하는 '평생소득설계' 상담을 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "545a1b2bec51", "title": "기금형 연금 도입에…금융지주 계열사 합종연횡 채비", "summary": "기금형 퇴직연금 추진이 공식화되면서 주요 금융지주들이 은행을 중심으로 계열사를 동원한 수탁법인 컨소시엄 설립 준비에 돌입했다. 고용노동부는 오는 6일 주요 은행장들을 소집해 기금형 퇴직연금 간담회를 열며, 법 개정 과정에서 금융지주 자회사 공동출자를 허용하는 예외를 마련할 계획이다. NH농협금융은 퇴직연금 제도 개편 대응 TF를, KB금융과 우리금융은 계열사 워킹그룹을 운영하고 있으며 신한금융도 정식 TF를 발족할 예정이다. 5대 금융지주 DC·IRP 적립액은 174조1435억원으로 작년말 대비 15.5% 늘었고, 증권 계열사 비중은 11.2%에서 13.2%로 상승했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-11-03", "url": "https://www.mt.co.kr/finance/2026/11/03/2026110216011686926", "related": [{"title": "기금형 퇴직연금 도입 초읽기… 원팀 꾸리는 금융지주 계열사", "source": "머니투데이", "url": "https://www.mt.co.kr/finance/2026/11/04/2026110319393765961"}]}, {"id": "113078a9f394", "title": "퇴직연금 ‘100% 투자 가능’의 함정…원금까지 보장하진 않아", "summary": "금융감독원은 내년 1월부터 퇴직연금 매매화면과 상품검색 화면에 투자한도와 위험등급을 함께 표시하도록 개선한다고 27일 밝혔으며, 상품제안서와 적립금운용현황보고서에도 위험등급을 병기한다. 일부 사업자가 원금손실 가능성이 있는 상품도 '투자한도 100%'로만 안내해 가입자가 원리금보장형으로 오인할 수 있다는 판단에서다. 올해 상반기 말 퇴직연금 적립금 558조3000억원 가운데 실적배당형은 198조원이고, 이 중 ETF 투자 규모는 99조8000억원으로 50.4%를 차지했다. 일부 사업자는 전산개발 일정에 따라 내년 상반기 중 시행한다.", "category": "제도·규제", "importance": 4, "source": "메트로신문", "published": "2026-10-27", "url": "https://www.metroseoul.co.kr/article/20261027500104", "related": [{"title": "“퇴직연금 다 날릴 수도”…ETF 투자한도 100%의 함정 [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8699397&ref=A"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "133e90c36463", "title": "“원리금 보장만” “위험자산 반 이상”…퇴직연금 가입자 돈 굴리기 양극화", "summary": "금융감독원에 따르면 퇴직연금 적립금은 2023년 말 382조원에서 올해 6월 말 558조원으로 늘었다. 가입자의 64.5%는 적립금 전액을 원리금 보장형에 두고 있고, 33.9%는 절반 이상을 위험자산에 투자했으며, 분산 투자로 균형을 맞춘 경우는 1.6%에 그쳤다. 실적배당형 비중은 2023년 12.8%에서 올해 6월 말 35.5%로 약 2.8배 늘었고 그중 50.4%가 ETF에 투자됐다. 금감원은 11월 3일 장기·분산 투자를 돕는 '퇴직연금 가이드북'을 발간했으며, 디폴트옵션도 대부분 원리금 보장형에 머물러 있다고 밝혔다.", "category": "운용·상품", "importance": 3, "source": "서울신문", "published": "2026-11-17", "url": "https://www.seoul.co.kr/news/economy/finance/2026/11/17/20261117031002", "related": [{"title": "같은 퇴직금, 20년 뒤엔 1억6천 차이…50대 여유 있다면 ‘보증형 보험’이 대안", "source": "경향신문", "url": "https://www.khan.co.kr/article/202611170600051"}, {"title": "김 과장·박 과장, 연금 똑같이 1000만 원씩 냈는데...20년 뒤 계좌 잔고 '충격'", "source": "파이낸셜뉴스", "url": "https://www.fnnews.com/news/202611161529480756"}, {"title": "퇴직연금 적립금 558조 넘겨…DC 전환 1년만 118% 증가", "source": "SBS Biz", "url": "https://biz.sbs.co.kr/article_hub/20000346629"}]}, {"id": "b1c24b848e68", "title": "줄어든 거래대금에 증권가는 ‘MTS’ 전쟁…AI·배당·연금으로 고객 자산 잡는다", "summary": "증시 조정으로 거래가 위축되자 증권사들이 MTS에 AI 투자정보, 배당 정보, 퇴직연금 ETF 적립식 매수 기능 등을 더하고 있다. 하나증권은 이달부터 DC·IRP 계좌에서 ETF·ETN·리츠를 정기 매수하는 서비스를 개시하며, 3분기 기준 DC·IRP 시장점유율 1위를 달성했다. 3분기 국내 주식시장 일평균 거래대금은 52조4000억원으로 전 분기 대비 41.7% 감소해 증권사 위탁수수료 수익이 크게 줄었다.", "category": "업계·경쟁사", "importance": 3, "source": "조선비즈", "published": "2026-11-09", "url": "https://biz.chosun.com/stock/stock_general/2026/11/09/FUNYZOZV2JH4FLZ7BJYY4STMYI/", "related": [{"title": "줄어든 증시 거래대금에 증권가는 ‘MTS 전쟁’", "source": "조선일보", "url": "https://www.chosun.com/economy/stock-finance/2026/11/10/IKPQK3UVDJG2HEUOQJK5EO4OFM/"}]}, {"id": "ea0a4daeeaf0", "title": "소득 여유 있는 가구가 연금도 먼저 받는다…취약가구와 수급 격차", "summary": "한국보건사회연구원 보고서에 따르면 정년 이후 공적연금 수급 전까지의 소득공백기에 경제적 여력이 있는 가구일수록 연금 수급률이 높았다. 정년 전 중위소득 100% 이상을 유지하거나 늘린 가구의 공적연금 조기 수급률은 26.5%, 소득이 절반 미만으로 줄어든 취약가구는 18.1%였다. 월평균 공적연금 수급액은 소득 유지 가구가 191만8000원, 취약가구가 52만7000원으로 3.6배 이상 차이가 났다. 보고서는 필요한 금액만큼 연금을 나눠 받는 '부분연금제' 도입과 건강보험료·기초연금 등과의 연계 구조 정비를 제언했다.", "category": "가입자·사회", "importance": 3, "source": "메디컬투데이", "published": "2026-11-10", "url": "https://www.mdtoday.co.kr/news/articleView.html?idxno=623884", "related": [{"title": "“노후 소득공백 버티려 연금 당겼는데”…취약층보다 여유 있는 가구가 더 받았다", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10929855?ref=naver"}]}, {"id": "52bb3ea27011", "title": "국민연금 10년 부은 평균소득자, 기초연금보다 덜 받는다…‘급여 역전’", "summary": "국민연금연구원 김형수 부연구위원의 보고서에 따르면 소득대체율 43%를 적용할 때 평균소득자가 최소가입기간 10년을 채운 월 연금액은 A값의 10.75%로, 올해 기초연금 기준연금액(A값의 약 10.95%)보다 낮다. 올해 A값 319만3511원을 넣으면 국민연금은 월 약 34만3300원으로 기준연금액 34만9700원보다 6400원가량 적다. 보고서는 국민연금 최소가입기간을 상향하거나 기초연금 기준연금액 수준을 조정하는 방향이 필요하다고 제시했다. 최소가입기간을 15년으로 높여도 59세 말 기준 미달 비율은 1.6%로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-04", "url": "https://www.segye.com/newsView/20261103517557", "related": [{"title": "국민연금 10년 부었는데 기초연금보다 적다…월 6400원 역전", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=500742"}]}, {"id": "f82595e9660f", "title": "\"1년 미만·초단기 근로자도 퇴직금\"…정부 실태조사 착수", "summary": "정부가 1년 미만 근속자와 주 15시간 미만 초단시간 근로자에게도 퇴직급여를 지급하는 방안을 검토한다. 29일 발표된 퇴직연금 기능강화 방안에 따라 한국노동연구원이 이들의 퇴직급여 운영 실태와 의무화에 따른 사용자 부담·노동시장 영향을 분석한다. 지난해 주 1~14시간 일한 취업자는 177만9000명으로 전체 취업자의 6.2%였고 관련 통계 작성 이후 가장 많았다. DC형 법정 최소 사용자 부담금이 연간 임금총액의 12분의 1인 만큼 영세 사업장의 채용 위축 우려도 제기된다.", "category": "제도·규제", "importance": 3, "source": "한국경제", "published": "2026-10-30", "url": "https://www.hankyung.com/article/202610294697i", "related": [{"title": "퇴직연금 의무화에도…1년 미만·초단시간 노동자 사각지대 남아", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261029010010231"}]}, {"id": "fa231637c697", "title": "KB자산운용, 美 초대형주·만기매칭형 회사채 ETF 동시 상장", "summary": "KB자산운용이 18일 RISE 미국초대형주TOP10 ETF와 RISE 27-11 회사채(AA-이상)액티브 ETF를 동시에 상장한다. 미국초대형주TOP10은 NYSE·나스닥 상장 시가총액 상위 10개 종목에 투자하며 총보수는 연 0.30%다. 27-11 회사채 ETF는 2027년 10~12월 만기 AA- 이상 회사채에 투자하는 만기매칭형으로 예상 만기수익률은 세전 연 4.13%, 총보수는 연 0.05%다. 회사채 ETF는 DC·IRP 계좌에서 적립금의 100%까지 편입할 수 있다.", "category": "운용·상품", "importance": 2, "source": "파이낸셜포스트", "published": "2026-11-18", "url": "https://www.financialpost.co.kr/news/articleView.html?idxno=301568", "related": [{"title": "KB운용, 美 초대형주 ETF·우량 회사채 ETF 동시 상장", "source": "글로벌이코노믹", "url": "https://www.g-enews.com/view.php?ud=202611170832545593153ddfb15a_1"}]}, {"id": "c2ef78aa9c37", "title": "삼성생명, 퇴직연금 부가서비스 앱 'SSUM 라운지' 개편", "summary": "삼성생명이 퇴직연금 가입자 전용 부가서비스 앱 'SSUM 라운지'를 전면 개편했다고 24일 밝혔다. 새로 마련된 '퇴직연금정보'에는 시장 지표를 보여주는 '투데이브리핑'과 '연금 첫걸음', '투자 인사이트', '투자 가이드북', '연금 클래스' 등 콘텐츠가 담겼다. '연금 클래스'는 매월 한 차례 온라인 세미나로 삼성생명 퇴직연금 전문가와 삼성자산운용이 제도·상품과 시장 전망을 소개한다. 서비스는 삼성생명 퇴직연금(DB·DC·IRP) 가입자라면 누구나 무료로 이용할 수 있다.", "category": "업계·경쟁사", "importance": 2, "source": "비즈월드", "published": "2026-10-25", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149782", "related": [{"title": "삼성생명, 퇴직연금 앱 ‘SSUM 라운지’ 개편…투자정보 강화", "source": "메가경제", "url": "https://www.megaeconomy.co.kr/news/newsview.php?ncode=1065569724632297"}]}, {"id": "79701632bbb8", "title": "하나금융, 3분기 누적 순익 3조6243억원…9490억원 자사주 매입·소각 '역대 최대'", "summary": "하나금융그룹의 올해 3분기 누적 연결당기순이익은 3조6243억원으로 전년 동기 대비 5.6% 증가했고, 누적 수수료이익은 2조1428억원으로 29.8% 늘었다. 하나은행의 3분기 누적 수수료이익은 8740억원으로 전년 동기 대비 11.5% 늘며 3분기 누적 기준 역대 최대치를 기록했다. 퇴직연금과 방카슈랑스 등 수수료 수익 확대와 외환 관련 이익 증가가 은행 실적을 뒷받침했다. 하나금융은 연간 자사주 매입·소각 규모를 역대 최대인 9490억원으로 확대하기로 했다.", "category": "업계·경쟁사", "importance": 2, "source": "메트로신문", "published": "2026-10-25", "url": "http://www.metroseoul.co.kr/article/20261023500216", "related": [{"title": "하나금융, 3분기 누적 순이익 3조6243억원…자사주 매입·소각 역대 최대", "source": "월요신문", "url": "https://www.wolyo.co.kr/news/articleView.html?idxno=319524"}]}, {"id": "b563037cbe03", "title": "보험산업 성장률 내년 3.5%로 ‘반토막’…수익·자본의 질도 경고등", "summary": "보험연구원이 22일 '2027년 보험산업 전망과 과제' 세미나에서 내년 보험산업 전체 수입·원수보험료 증가율을 3.5%로 전망했다. 올해 예상 증가율 8.0%보다 4.5%p 낮은 수준이며, 전체 보험료 규모는 올해 289조원에서 내년 299조원으로 늘어날 것으로 예상됐다. 생명보험 수입보험료 증가율은 올해 8.8%에서 내년 2.3%로 하락하고, 퇴직연금도 올해 급증에 따른 기저효과로 3.6% 줄어들 것으로 예상됐다. 퇴직연금을 제외하면 생명보험과 손해보험의 성장률은 각각 4.0%, 5.0%로 전망된다.", "category": "업계·경쟁사", " icleView.html?idxno=813516"}]}, {"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "sou 연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936461/2"}, {"title": "퇴직연금, 전문가가 대신 굴린다…'기금형' 도입, 국민연금 참여는 미정", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6335473"}, {"title": "정부, 퇴직연금 기금형 활성화…IRP 위험자산 투자한도 상향 추진", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4441777"}, {"title": "\"퇴직금 못 받는 일 줄인다\", 사외적립 전 사업장 확대 추진", "source": "데일리환경", "url": "https://www.dailyt.co.kr/newsView/dlt202611040003"}, {"title": "기업 퇴직연금 모아 전문기관이 굴려… ‘쥐꼬리 수익’ 개선 기대", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936451/2"}, {"title": "국민연금, 기금형 퇴직연금 참여 미정···‘시장 개입 우려’에 국회로 공 넘긴 정부", "source": "경향신문", "url": "https://www.khan.co.kr/article/202610300600041"}, {"title": "[퇴직연금 개편] 퇴직연금도 국민연금처럼…정부, 장기 연금 수령 유도 방안 발표", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=620807"}, {"title": "퇴직연금 사외적립 2030년까지 전 사업장 의무화", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237470"}, {"title": "당정, ‘퇴직연금 강화·고용부 예산’ 살핀다…초광역특구법 논의 가능성", "source": "디지털타임스", "url": "https://www.dt.co.kr/article/12091950"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "fd9e49abb205", "title": "한국투자증권, 퇴직연금 운용의 우위를 실증하다... 3년간 수익률 100% 돌파", "summary": "고용노동부의 9월 말 기준 공시에서 한국투자증권 디폴트옵션 적극투자형 BF1의 3년 누적 수익률이 100.97%로 전체 퇴직연금사업자 포트폴리오 가운데 가장 높았다. 이는 적극투자형 평균 57.58%를 43.39%포인트 웃돌며, 업권별 평균은 증권 61.45%, 은행 55.76%, 보험 55.03%였다. 핵심 전략은 한국투자신탁운용과 협업한 MySuper 알아서 성장형 펀드로 글로벌 우량주와 부동산·인프라·물가연동채권 등 대체자산에 분산투자한다. 3분기 말 DC·IRP 합산 적립금은 18조5160억원으로 지난해 말보다 5조7292억원(44.8%) 늘었다.", "category": "업계·경쟁사", "importance": 4, "source": "리버티코리아포스트", "published": "2026-11-05", "url": "http://www.lkp.news/news/articleView.html?idxno=85780", "related": [{"title": "한투증권, 디폴트옵션 3년 누적 수익률 100.97%…전 사업자 1위", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261104_0003853884"}, {"title": "퇴직연금 3년 새 '두 배' 불렸다…한국투자증권, 디폴트옵션 수익률 전체 1위 달성", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "5dd7e8508fc5", "title": "하나은행, 호남권 첫 시니어 특화 금융라운지 광주에 개점", "summary": "하나은행은 지난 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 금융공간인 '하나더넥스트 광주금융 라운지'를 개점했다. 라운지는 은퇴설계, 상속·증여, 유언대용신탁 상담과 건강관리·문화·주거 등 라이프케어 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산, 예상 지출을 분석하는 '평생소득설계' 상담을 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}]}}}</script>

  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로
     그보다 넉넉히 잡아야 매일 아침 헛경보가 뜨지 않는다. */
  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
         + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

  function buildStaleNotice() {
    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
