  }

퇴직급여 사외적립 단계적 의무화 추진, 영세 사업장 지원 구체화", "summary": "고용노동부와 금융감독원은 11월 6일 근로복지공단과 주요 은행·보험·증권사가 참석한 퇴직연금사업자 간담회를 열어 지난달 29일 발표한 퇴직연금 기능강화 방안을 공유했다. 정부는 관련 법 개정안의 올해 국회 통과를 전제로 2028년 100인 이상, 2029년 10∼99인, 2030년 10인 미만 사업장으로 퇴직급여 사외적립 의무를 확대할 계획이다. 2027년도 예산안에는 자율 도입 사업장 적립금 매칭지원 60억원과 경영자금 융자비용 보전 62억원이 신규 편성됐고, DC·IRP에 적용되는 기금형 퇴직연금은 수탁법인 인가체계와 가입자 이익 우선 의무를 법률에 담는다. 사업자들은 영세 사업장 지원 민관 협력체계와 기금형 인가 준비기간을 건의했으며, 노동부는 11월 중 법 개정안 발의를 추진한다.", "category": "제도·규제", "importance": 3, "source": "데일리환경", "published": "2026-11-10", "url": "https://www.dailyt.co.kr/newsView/dlt202611100003"}, {"id": "68b0982c4949", "title": "연말정산 앞두고 연금 고객 잡아라..은행권, 절세·투자 마케팅 강화", "summary": "연말정산 시즌을 앞두고 주요 시중은행들이 IRP 세액공제 혜택을 앞세운 신규 가입·추가 납입 이벤트와 ETF·TDF 투자 유도, 맞춤형 연금 컨설팅으로 연금 고객 확보에 나서고 있다. 신한은행은 DC·IRP 가입자 대상 퇴직연금 ETF 투자 이벤트를 진행하고 ETF 라인업을 300개로 늘렸으며, 사업장을 방문하는 1대1 맞춤형 연금컨설팅을 CEO·임원 퇴직금 관리와 경영성과급 DC형 적립 자문까지 넓혔다. 하나은행은 은행권 최초로 하나 MP 구독서비스에 ETF 포트폴리오를 추가했고, 우리은행은 연말까지 DC·IRP 신규 가입과 추가 납입 고객에게 배달의민족 쿠폰을 주는 이벤트와 비대면 IRP 수수료 평생 면제를 운영한다. KB국민은행은 광고를 통한 브랜드 홍보에, NH농협은행은 고객 세미나와 기업 실무자 안내 책자 발간에 무게를 두고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "한국정경신문", "published": "2026-11-10", "url": "https://kpenews.com/View.aspx?No=4304847"}, {"id": "0682b5e7e71e", "title": "반도체 호황 끝나면 한국도 안심 못 해…빨라진 기초연금 30조원 시대, 佛 닮아가나", "summary": "프랑스에서 국가채무 위기로 교육예산 등이 삭감되면서 대규모 시위가 50일 넘게 이어지고 있다. 프랑스 정부부채는 올해 2분기 기준 GDP의 119%로 사상 최고치를 기록했고, 지출 대부분은 연금을 비롯한 사회복지에서 비롯된다. 마크롱 정부의 연금 수급 개시 연령 상향 개혁은 반대에 막혀 2028년 1월까지 유예됐다. 기사는 한국의 GDP 대비 사회복지지출 비율이 15.3%로 프랑스의 절반 수준이지만 고령화 속도가 OECD 회원국 중 가장 빨라 연금 부담이 급증하고 있다고 전했다.", "category": "가입자·사회", "importance": 2, "source": "한국일보", "published": "2026-11-10", "url": "https://www.hankookilbo.com/news/article/A2026110618000004556"}, {"id": "6473653ae9a6", "title": "삼성자산운용, 미국 나스닥100·단기국채 혼합 ETF 10일 상장", "summary": "삼성자산운용의 ‘KODEX 미국나스닥100미국채혼합50’ ETF가 10일 유가증권시장에 신규 상장된다. 자산의 절반은 잔존만기 1~3개월 미국 단기국채에, 나머지 50%는 나스닥100지수에 투자하며 비중을 매일 50대50으로 조정한다. 분배금은 매월 15일을 기준일로 지급한다. 주식 비중이 50% 미만인 채권혼합형이라 퇴직연금 위험자산 투자한도 70%의 적용을 받지 않아 DC·IRP 계좌에서 투자금의 최대 100%까지 편입할 수 있다.", "category": "운용·상품", "importance": 2, "source": "광주매일신문", "published": "2026-11-10", "url": "http://www.kjdaily.com/article.php?aid=1794239336691634276"}, {"id": "bf4464cbe8ce", "title": "줄어든 증시 거래대금에 증권가는 ‘MTS 전쟁’", "summary": "증시 조정으로 주식 거래가 위축되자 증권사들이 MTS를 AI 투자 정보, 배당 조회, 퇴직연금 ETF 적립식 매수 기능 등을 갖춘 자산관리 플랫폼으로 키우고 있다. 하나증권은 이달부터 MTS에서 DC·IRP 계좌로 ETF·ETN·리츠를 정기 매수하는 서비스를 시작한다. 올해 3분기 국내 주식시장 일평균 거래대금은 52조4000억원으로 전 분기 대비 41.7% 감소했다. 위탁매매 수수료 수익은 신한투자증권 47.2%, NH투자증권 45.6%, 키움증권 42.9% 줄었다.", "category": "업계·경쟁사", "importance": 2, "source": "조선일보", "published": "2026-11-10", "url": "https://www.chosun.com/economy/stock-finance/2026/11/10/IKPQK3UVDJG2HEUOQJK5EO4OFM/"}, {"id": "0c8ee94d8c78", "title": "비트코인 ETF, 규제 풀리면 곧바로 나올 수 있을까", "summary": "국내 가상자산 ETF 도입 논의와 출시 가능성을 다룬 기사다. 가상자산 ETF는 그동안 접근이 어려웠던 제도권 자금에 새로운 투자 경로를 제공할 수 있다고 기사는 전했다. 퇴직연금과 연금저축 계좌는 일반 증권 계좌보다 엄격한 투자 기준이 적용돼 가상자산 직접 보유와 해외 상장 ETF 투자가 제한된다. 국내 가상자산 ETF가 출시되더라도 연금 계좌 편입에는 별도 제도 정비가 필요하다.", "category": "운용·상품", "importance": 2, "source": "한경머니", "published": "2026-11-10", "url": "https://magazine.hankyung.com/money/article/202610126760c"}, {"id": "05af3ee67b3a", "title": "[BS모닝] 계속되는 증시 변동성에 ‘채권혼합형 ETF’ 부상", "summary": "증시 변동성이 확대되면서 주식과 채권을 함께 담는 채권혼합형 ETF로 투자자 관심이 쏠리고 있다. 한국거래소에 따르면 국내혼합형 ETF 순자산총액은 15조4650억원으로 전체 시장 내 비중이 6월 말 3.25%에서 3.53%로 0.28%포인트 상승했다. 개인형퇴직연금(IRP) 위험자산 한도 완화와 투자 대상 확대 논의가 이어지면서 혼합형 ETF 수요도 늘고 있다. 주식 비중이 50% 미만인 채권혼합형 ETF는 퇴직연금(DC·IRP) 계좌에서 위험자산 투자한도(70%)를 적용받지 않아 100%까지 투자할 수 있다.", "category": "운용·상품", "importance": 2, "source": "세계비즈", "published": "2026-11-10", "url": "http://www.segyebiz.com/newsView/20261110502136"}, {"id": "15abf9d3289e", "title": "신한자산운용, ‘SOL 200커버드콜액티브’ ETF 상장…격주 배당 체계 구축", "summary": "신한자산운용이 코스피200 주식 포트폴리오와 콜옵션 매도 비중을 시장 국면에 따라 능동적으로 조절하는 ‘SOL 200커버드콜액티브’ ETF를 10일 유가증권시장에 상장했다. 매월 16일 분배금을 지급하며 첫 분배금 지급 예정일은 2026년 12월 16일이고, 월초에 분배하는 기존 ‘SOL 200타겟위클리커버드콜’과 함께 담으면 월 2회 격주 분배 포트폴리오를 구성할 수 있다. 확정기여형(DC)·개인형퇴직연금(IRP)·연금저축 계좌에서도 투자할 수 있으며 퇴직연금 계좌에서는 위험자산 한도 규정에 따라 적립금의 70% 이내에서 편입할 수 있다.", "category": "운용·상품", "importance": 2, "source": "메가경제", "published": "2026-11-10", "url": "https://www.megaeconomy.co.kr/news/newsview.php?ncode=1065569455876142"}, {"id": "d26fe9b617df", "title": "[민주영의 마켓 나우] 기금형 퇴직연금의 성공 조건", "summary": "민주영 신영증권 연금사업부 상무가 기금형 퇴직연금 도입을 앞두고 쓴 칼럼이다. 필자는 정부가 기금 난립을 막고 규모의 경제를 살리겠다고 밝혔지만 ‘큰 기금’이 성공 기준으로 굳어지는 것을 우려했다. 그동안 퇴직연금은 적립금과 점유율 등 외형 성장에 치중해 연금으로서 제 기능을 하지 못했다고 지적했다. 기금형의 성패는 기금 규모가 아니라 은퇴 후 매달 쓸 돈을 얼마나 늘렸는지로 따져야 한다고 주장했다.", "category": "제도·규제", "importance": 1, "source": "중앙일보", "published": "2026-11-10", "url": "https://www.joongang.co.kr/article/25477116"}, {"id": "fe942947d278", "title": "[목멱칼럼]열여덟 살의 첫 국민연금, 평생월급의 시작", "summary": "내년 1월부터 시행되는 청년 생애 첫 연금보험료 지원제도를 다룬 칼럼이다. 내년 만 18세가 되는 2009년생부터 첫 1개월 보험료 4만1000원을 국가가 전액 지원한다. 국민연금공단은 지난달 28일 사전신청자가 접수 시작 27일 만에 1만 명을 넘었으며 신청자의 60.4%가 부모를 통한 신청이었다고 밝혔다. 필자는 첫 가입이 장기 가입으로 이어지도록 교육과 맞춤형 안내, 자동지원 방안 등 제도적 뒷받침이 필요하다고 주장했다.", "category": "가입자·사회", "importance": 1, "source": "이데일리", "published": "2026-11-10", "url": "https://www.edaily.co.kr/News/Read?newsId=01623606645644408&mediaCodeNo=257"}, {"id": "3f3e6c737153", "title": "삼성증권, 금·은·구리 선물 ETN 6종 신규 상장 外", "summary": "증권·운용업계 소식을 묶은 단신 기사로, 한국투자증권의 기업 실무자 대상 ‘퇴직연금 아카데미’ 개최 소식이 포함됐다. 아카데미는 하반기 발의 예정인 근로자퇴직급여보장법 개정안에 따른 제도 변화를 미리 살펴보기 위해 마련됐다. 자본시장연구원 남재우 박사가 사외적립 의무화와 기금형 퇴직연금제도를, 한국투자증권 연금컨설팅부가 근퇴법 개정안 실무 쟁점과 사외적립 의무화 시대의 도입·운영 전략을 소개했다. 최종진 한국투자증권 연금혁신본부장은 밀착형 연금 컨설팅과 지원을 이어가겠다고 말했다.", "category": "법인·자금운용", "importance": 1, "source": "리얼캐스트", "published": "2026-11-10", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=32023"}, {"id": "0abb3b254c13", "title": "같은 유족연금인데 배우자 연금 따라 월 지급금 30%, 100% 갈려", "summary": "부부가 모두 국민연금을 받다가 한 명이 사망하면 남은 배우자는 국민연금법 제56조에 따라 본인 노령연금에 유족연금의 30%만 더해 받거나 유족연금만 선택해야 한다. 부부가 같은 직역연금을 받으면 유족연금의 50%만 지급되지만, 국민연금과 직역연금이 섞이면 유족연금을 감액 없이 100% 받아 형평성 문제가 생긴다. 남편이 추납으로 연금을 월 10만 원 늘려도 아내가 추가로 받는 유족연금은 월 1만8000원에 그치는 반면, 연금저축·IRP는 사망 시 남은 잔액이 상속되고 배우자가 계좌를 승계할 수 있다. 글은 각자의 국민연금 수급권과 함께 잔액을 상속할 수 있는 개인연금을 마련하는 편이 안전하다고 제언한다.", "category": "가입자·사회", "importance": 1, "source": "주간동아", "published": "2026-11-10", "url": "https://weekly.donga.com/economy/article/all/11/6452293/1"}, {"id": "6e787f7e485a", "title": "[핀테크핫이슈] 증시 급락·해킹 확산...금융당국 '전전긍긍'", "summary": "금융권 주간 동향을 묶은 기사로, 은행권 서비스 확대가 자산관리와 생활밀착형 금융으로 이어지고 있다고 전한다. 신한은행은 삼성자산운용과 업무협약을 맺고 퇴직연금 고객에게 시장 전망과 자산배분 등 투자정보를 공동 제공하고 온·오프라인 세미나와 영업점 직원 교육을 강화하기로 했다. 전자결제 업계에서는 KG파이낸셜이 3분기 매출 711억원, 영업이익 104억원을, 카카오페이가 3분기 매출 3021억원, 영업이익 325억원을 기록했다.", "category": "업계·경쟁사", "importance": 1, "source": "디지털투데이", "published": "2026-11-10", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=713899"}, {"id": "41692ff1cac8", "title": "[이윤구의 프리킥스] 퇴직연금, 저수익 해법부터 풀어야", "summary": "기금형 퇴직연금 도입 논의에서 국민연금을 운용 주체로 투입하자는 주장에 대해, 운용기관을 바꾸는 것만으로는 저수익 문제를 개선하기 어렵다고 지적하는 칼럼이다. 퇴직연금 적립금은 올해 6월 말 558조3천억원이지만 약 75%가 원리금보장형 상품에 묶여 있고, 지난해 실적배당형 수익률은 16.80%, 원리금보장형은 3.09%였다. 지난해 전체 연간 수익률은 6.47%로 제도 도입 이후 최고였으나 장기 수익률은 2%대에 머물러 있다. 필자는 디폴트옵션·TDF·ETF 등 기존 제도 안의 개선과 사업자 간 수익률 경쟁을 유도하는 보완책이 먼저라고 주장한다.", "category": "제도·규제", "importance": 1, "source": "연합인포맥스", "published": "2026-11-10", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4443868"}, {"id": "bfbb0047c81c", "title": "우리은행, 퇴직연금 신규·추가 납입 고객에 쿠폰 제공", "summary": "우리은행은 11월 9일부터 12월 31일까지 DC·IRP 신규 가입 및 추가 납입 고객을 대상으로 '키우자, 굴리자 퇴직연금' 이벤트를 진행한다고 10일 밝혔다. 신규 가입 후 12월 31일 기준 잔액이 10만원 이상이면 배달의민족 1만5000원 쿠폰을, 기존 가입자는 추가 납입 순증액이 100만원 이상이면 1만원 쿠폰을 준다. 우리은행은 연금자산·예상 수령액 조회, ETF 실시간 시세 조회와 당일 매매, DB·DC 비대면 신규 가입 기능을 담은 시스템 개편도 진행했다. 비대면 IRP 가입 고객에게는 운용관리·자산관리 수수료를 평생 면제하고 있다.", "category": "업계·경쟁사", "importance": 1, "source": "글로벌이코노믹", "published": "2026-11-10", "url": "https://www.g-enews.com/view.php?ud=202611100847472903cd0bfacc1c_1"}, {"id": "cc2ea2e95dd9", "title": "프랑스발 위기, 남의 일인가? [특별기고]", "summary": "프랑스는 국가채무가 국내총생산을 웃돌고 고령화로 연금·의료·노인 돌봄 비용이 계속 늘고 있다. 연금수급연령을 높이는 개혁은 거센 국민적 반발과 정치적 갈등에 부딪혔다. 필자는 이번 국민연금개혁으로 보험료율이 9%에서 13%로 오르고 소득대체율이 43%로 높아졌지만 기금 소진 시점이 8년 늦춰졌을 뿐 근본적 해결은 아니라고 지적한다. 세대 간 부담을 공평하게 나누고 청년 연금 가입 지원, 의무 가입연령 상향, 정년 연장이 필요하다고 주장한다.", "category": "가입자·사회", "importance": 1, "source": "시사오늘", "published": "2026-11-10", "url": "https://www.sisaon.co.kr/news/articleView.html?idxno=205929"}, {"id": "714be867fed4", "title": "8년간 치매 시모 간병한 아내에게 이혼 통보한 남편, 퇴직금·국민연금 재산분할 가능할까", "summary": "32년 혼인 기간 가사·육아·간병을 전담한 59세 A씨가 황혼이혼을 앞두고 남편의 퇴직금과 국민연금 분할 가능 여부를 물은 사연이 YTN 라디오에서 다뤄졌다. 이나용 변호사는 아직 받지 않은 퇴직금도 현시점에 퇴직한다고 가정한 예상 퇴직금이 분할 대상이 된다고 설명했다. 예상 퇴직금 액수는 소송 중 회사에 대한 사실조회 신청으로 확인할 수 있다. 국민연금은 혼인기간 중 가입기간이 5년 이상이고 배우자가 노령연금 수급권자인 경우 등 요건을 갖추면 국민연금법상 분할연금을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "로톡뉴스", "published": "2026-11-10", "url": "https://lawtalknews.co.kr/article/6GICDKIIMRJ8"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-11-03 ~ 2026-11-09", "generated_at": "2026-11-10T13:16:06+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "fd9e49abb205", "title": "한국투자증권, 퇴직연금 운용의 우위를 실증하다... 3년간 수익률 100% 돌파", "summary": "고용노동부의 9월 말 기준 공시에서 한국투자증권 디폴트옵션 적극투자형 BF1의 3년 누적 수익률이 100.97%로 전체 퇴직연금사업자 포트폴리오 가운데 가장 높았다. 이는 적극투자형 평균 57.58%를 43.39%포인트 웃돌며, 업권별 평균은 증권 61.45%, 은행 55.76%, 보험 55.03%였다. 핵심 전략은 한국투자신탁운용과 협업한 MySuper 알아서 성장형 펀드로 글로벌 우량주와 부동산·인프라·물가연동채권 등 대체자산에 분산투자한다. 3분기 말 DC·IRP 합산 적립금은 18조5160억원으로 지난해 말보다 5조7292억원(44.8%) 늘었다.", "category": "업계·경쟁사", "importance": 4, "source": "리버티코리아포스트", "published": "2026-11-05", "url": "http://www.lkp.news/news/articleView.html?idxno=85780", "related": [{"title": "한투증권, 디폴트옵션 3년 누적 수익률 100.97%…전 사업자 1위", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261104_0003853884"}, {"title": "퇴직연금 3년 새 '두 배' 불렸다…한국투자증권, 디폴트옵션 수익률 전체 1위 달성", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "545a1b2bec51", "title": "기금형 연금 도입에…금융지주 계열사 합종연횡 채비", "summary": "기금형 퇴직연금 추진이 공식화되면서 주요 금융지주들이 은행을 중심으로 계열사를 동원한 수탁법인 컨소시엄 설립 준비에 돌입했다. 고용노동부는 오는 6일 주요 은행장들을 소집해 기금형 퇴직연금 간담회를 열며, 법 개정 과정에서 금융지주 자회사 공동출자를 허용하는 예외를 마련할 계획이다. NH농협금융은 퇴직연금 제도 개편 대응 TF를, KB금융과 우리금융은 계열사 워킹그룹을 운영하고 있으며 신한금융도 정식 TF를 발족할 예정이다. 5대 금융지주 DC·IRP 적립액은 174조1435억원으로 작년말 대비 15.5% 늘었고, 증권 계열사 비중은 11.2%에서 13.2%로 상승했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-11-03", "url": "https://www.mt.co.kr/finance/2026/11/03/2026110216011686926", "related": [{"title": "기금형 퇴직연금 도입 초읽기… 원팀 꾸리는 금융지주 계열사", "source": "머니투데이", "url": "https://www.mt.co.kr/finance/2026/11/04/2026110319393765961"}]}, {"id": "2fe6ca10b844", "title": "‘퇴직연금 수익률 우위’ 증권사, 시장 절반 장악한 은행에 도전장", "summary": "금융감독원에 따르면 9월 말 기준 금융권 전체 퇴직연금 적립금은 542조1000억 원으로 작년 12월 말(501조4000억 원) 대비 8.1% 늘었다. 은행권 적립금은 275조5000억 원으로 전체의 50.8%, 증권업계는 29.6%(160조3000억 원)를 차지했다. 지난해 증권사의 퇴직연금 연간 수익률은 9.79%로 은행(5.70%)보다 4.09%포인트 높았고, 증권사 비대면 IRP는 수수료가 대부분 면제된다. 은행들은 장기계약 수수료 할인율 확대(우리은행 최대 25%, 신한은행 최대 20%)와 KB국민은행의 당일 ETF 재매수 서비스 등으로 대응하고 있다.", "category": "업계·경쟁사", "importance": 4, "source": "동아일보", "published": "2026-11-09", "url": "https://www.donga.com/news/Economy/article/all/20261109/134988547/2", "related": []}, {"id": "38994a32152d", "title": "[DQN] 주식시장 약세에 삼성생명 적립금 규모 1위 재탈환…DC형 비보장 수익률 반토막 [2026년 3분기 퇴직연금 랭킹]", "summary": "금감원 통합연금포털 3분기 공시 분석 결과 삼성생명의 퇴직연금 적립금이 57조5486억원으로 2분기 1위였던 신한은행을 추월했다. 계열사 DB형 적립금이 7074억원 늘어난 반면 비계열사 DB형은 3586억원 감소했으며, 주식시장 하락으로 원리금보장형 선호가 커진 점도 영향을 미쳤다. 신한라이프 DC형 원리금비보장 수익률은 2분기 111.17%에서 3분기 59.71%로 떨어지는 등 DC·IRP 비보장형 수익률이 절반 가량 하락했다. IRP 원리금비보장 적립금은 94조6349억원에서 87조6398억원으로 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-11-08", "url": "https://www.fntimes.com/html/view.php?ud=2026110716081563428a55064dd1_18", "related": []}, {"id": "d6a53703477c", "title": "증권사 디폴트옵션 TDF 적립금 양극화…장기 수익률은 iM증권 선두", "summary": "고용노동부의 3분기 디폴트옵션 공시를 보면 15개 증권사 중 TDF를 명시한 상품을 운용하는 곳은 5개사이고, 13개 상품의 적립금은 2189억원이다. 이 중 미래에셋증권 적극투자형 TDF1이 1958억원으로 89.5%를 차지했고, 디폴트옵션 적립금 중 TDF 비중은 우리투자증권이 67.1%로 가장 높았다. 고위험 상품 비중은 키움증권이 42.2%로 가장 높았고 우리투자증권 33.1%, 한국투자증권 31.3%가 뒤를 이었다. 3년 누적 수익률은 iM증권 TDF3호가 70.4%로 가장 높았지만, 최근 3개월 수익률은 TDF 13개 상품이 모두 마이너스였다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-11-07", "url": "https://www.ceoscoredaily.com/page/view/2026110515512989192", "related": []}, {"id": "8f289343566b", "title": "기금형 퇴직연금 시대 열린다…노사정 합의 안착 위한 민관 머리 맞대", "summary": "고용노동부와 금융감독원이 6일 하나은행·신한은행·삼성생명·미래에셋증권 등 주요 9개 퇴직연금사업자 대표와 간담회를 열고 지난달 29일 발표된 퇴직연금 기능강화 방안의 현장 안착을 논의했다. 김영훈 고용노동부 장관은 이번 방안이 퇴직급여 사외적립 전면 의무화와 기금형 퇴직연금 도입을 뼈대로 한다며 영세 사업장 안내와 가입자 이익 최우선의 거버넌스 구축을 주문했다. 이찬진 금융감독원장은 수탁자 책임에 부합하는 내부통제 시스템 구축을 기금형 제도 정착의 전제 조건으로 지목했다. 사업자들은 기금형 인가 준비 시간 보장과 연금상품 규제 완화를 건의했고, 고용노동부는 이달 내 국회 제출을 목표로 근로자퇴직급여 보장법 개정안 입법을 추진하겠다고 밝혔다.", "category": "제도·규제", "importance": 4, "source": "포인트경제", "published": "2026-11-07", "url": "https://www.pointe.co.kr/news/articleView.html?idxno=87330", "related": []}, {"id": "76a2423a270f", "title": "[N2 포커스] 키움증권, 리테일서 다진 신뢰로 승부…발행어음·연금·IB 성장 가속", "summary": "키움증권 퇴직연금 사업은 지난 6월 출범 후 약 5개월 만에 적립금 2000억원을 돌파했다. 개인형퇴직연금(IRP) 적립금의 약 75%는 다른 금융회사에서 이전한 자금이다. 키움증권은 ETF 중심의 운용 편의성을 경쟁력으로 내세우고, 전문상담 인력과 세무·노무·계리 전문가로 구성된 연금컨설팅 조직을 운영하고 있다. 3분기 말 고객계좌 수는 1820만개, 발행어음 잔액은 2조2000억원이다.", "category": "업계·경쟁사", "importance": 4, "source": "뉴스투데이", "published": "2026-11-05", "url": "https://www.news2day.co.kr/article/20261105500004", "related": []}, {"id": "38d9da68ee5b", "title": "신한, '은행→증권' 퇴직연금 소개 1년새 2.3배···비결은 협업", "summary": "신한은행이 신한투자증권에 소개한 퇴직연금 규모가 올해 상반기 488억6,000만 원으로 전년 동기(209억9,000만 원)보다 2.3배 늘었고, 개인 고객 소개 건수도 69건에서 180건으로 늘었다. 2024년 10월 실물이전제도 시행 이후 올 6월 말까지 옮겨간 퇴직연금 15조9,000억 원 중 5조2,000억 원이 은행에서 증권사로 이동했다. 신한은행은 3분기 말 IRP 적립금 22조8,540억 원으로 1위이고, 신한투자증권의 퇴직연금 적립금은 8조3,317억 원으로 전년 동기보다 31.8% 늘었다. 신한은행은 외부 연금 자금 유치와 은행·증권 간 고객 소개를 영업점 평가에 반영했고, 신한투자증권은 6월 퇴직연금 이·수관 전담팀을 신설했다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌E", "published": "2026-11-05", "url": "https://www.globale.co.kr/news/articleView.html?idxno=41428", "related": []}, {"id": "426d2945e793", "title": "디폴트옵션 성과평가 강화 앞두고…삼성·NH 수익률, 미래에셋 적립금 선두", "summary": "고용노동부의 2026년 3분기 디폴트옵션 비교공시에서 증권사 15곳 116개 상품을 분석한 결과, 최근 1년 수익률은 적극투자형에서 삼성증권(23.12%), 중립투자형에서 NH투자증권(13.82%)이 가장 높았다. 안정투자형은 iM·우리·유안타증권이 17.74%로 공동 선두였고, 3년 누적 기준으로는 한국투자증권 적극투자형BF1이 100.97%로 전체 사업자 1위였다. 증권사 디폴트옵션 적립금 3조6319억원 가운데 미래에셋(1조2798억원)·삼성(8584억원)·한국투자(6183억원) 3사가 75.9%를 차지했다. 정부는 10월 29일 퇴직연금 기능강화 방안에서 디폴트옵션을 수익률·위험조정성과 중심으로 재편하고 성과평가에 따른 가입중지·퇴출 불이익을 검토하겠다고 밝혔다.", "category": "업계·경쟁사", "importance": 4, "source": "더밸류뉴스", "published": "2026-11-05", "url": "http://www.thevaluenews.co.kr/news/view.php?idx=202994", "related": []}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "52bb3ea27011", "title": "국민연금 10년 부은 평균소득자, 기초연금보다 덜 받는다…‘급여 역전’", "summary": "국민연금연구원 김형수 부연구위원의 보고서에 따르면 소득대체율 43%를 적용할 때 평균소득자가 최소가입기간 10년을 채운 월 연금액은 A값의 10.75%로, 올해 기초연금 기준연금액(A값의 약 10.95%)보다 낮다. 올해 A값 319만3511원을 넣으면 국민연금은 월 약 34만3300원으로 기준연금액 34만9700원보다 6400원가량 적다. 보고서는 국민연금 최소가입기간을 상향하거나 기초연금 기준연금액 수준을 조정하는 방향이 필요하다고 제시했다. 최소가입기간을 15년으로 높여도 59세 말 기준 미달 비율은 1.6%로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-04", "url": "https://www.segye.com/newsView/20261103517557", "related": [{"title": "국민연금 10년 부었는데 기초연금보다 적다…월 6400원 역전", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=500742"}]}, {"id": "de799a1425f9", "title": "수익률 높인다는 기금형 퇴직연금…'계열사 금고' 되나", "summary": "정부의 퇴직연금 개편안은 회사가 직원 대표 동의를 받아 특정 기금을 기본 상품으로 정할 수 있게 했지만, 같은 그룹 금융사 기금으로 퇴직금이 몰리는 것을 점검할 장치는 없다. 금융감독원 통합연금포털에 따르면 9월 말 삼성생명이 관리하는 퇴직연금 57조5486억원 중 54.5%가 삼성 계열사 자금이었고, 현대차증권은 75.9%가 현대차그룹 계열사 자금이었다. 정부 방안의 안전장치는 계열사 투자 한도 등 자금이 기금에 들어온 뒤에만 작동하며, 계열 기금 선정 절차나 계열사 자금 비중 공개 규정은 없다. 이찬진 금감원장은 6일 간담회에서 기금 선정 절차를 투명하게 해 달라고 당부했고, 고용노동부는 이달 중 근퇴법 개정안을 국회에 낼 계획이다.", "category": "제도·규제", "importance": 3, "source": "동행미디어 시대", "published": "2026-11-09", "url": "https://www.sidae.com/article/2026110717112654333", "related": []}, {"id": "feebf7a7cafe", "title": "판 커지는 542조 퇴직연금 시장… 수익률 평균 5.4배差", "summary": "이르면 2028년 상반기부터 기금형 퇴직연금이 시행되며 542조 원 규모 퇴직연금의 수익률 경쟁이 본격화된다. 금융감독원에 따르면 지난해 말 퇴직연금 운용사 43곳의 실적배당형 수익률은 연 16.8%, 원리금 보장형은 연 3.1%로 격차가 5.4배였다. 2030년부터는 회사들이 퇴직금을 의무적으로 사외 금융기관에 적립하게 돼 금융사 간 수익 경쟁이 더 격화할 것으로 예상된다.", "category": "운용·상품", "importance": 3, "source": "동아일보", "published": "2026-11-09", "url": "https://www.donga.com/news/Economy/article/all/20261109/134988530/2", "related": []}, {"id": "68bd48d9b2f8", "title": "20년 모은 퇴직금 2억, 예적금 굴리면 2.7억-ETF 등 분산땐 4.3억", "summary": "금융감독원 추산에 따르면 2006년부터 20년간 연 1000만 원씩 IRP에 적립했을 때 국민연금 자산배분대로 운용하면 4억2948만 원, 전액 예·적금에 두면 2억7220만 원으로 1억5728만 원 차이가 났다. 지난해 퇴직연금 수익률 상위 10%는 적립금의 약 84%를 실적배당형에 투자해 연 19.5%를, 하위 10%는 원리금 보장형 비중이 약 74%로 연 0.5%를 기록했다. 지난해 퇴직연금 수익률은 연 6.5%로 제도 도입 이후 가장 높았으며, 기금 운용기관의 위험관리 역량 검증이 필요하다는 지적이 나왔다.", "category": "운용·상품", "importance": 3, "source": "동아일보", "published": "2026-11-09", "url": "https://www.donga.com/news/Economy/article/all/20261109/134988549/2", "related": []}, {"id": "b1995457e69d", "title": "[연중기획-새로운 리스크, 새로운 규제 ⑨-2] 퇴직연금 기금형 키우고 계약형 손질… 금융권 채비", "summary": "정부의 퇴직연금 기능강화 방안은 퇴직급여 사외적립을 2030년까지 단계적으로 의무화하고 기금형을 금융기관 개방형·연합형·공공기관 개방형으로 활성화하 ce": "이투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "5dd7e8508fc5", "title": "하나은행, 호남권 첫 시니어 특화 금융라운지 광주에 개점", "summary": "하나은행은 지난 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 금융공간인 '하나더넥스트 광주금융 라운지'를 개점했다. 라운지는 은퇴설계, 상속·증여, 유언대용신탁 상담과 건강관리·문화·주거 등 라이프케어 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산, 예상 지출을 분석하는 '평생소득설계' 상담을 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "545a1b2bec51", "title": "기금형 연금 도입에…금융지주 계열사 합종연횡 채비", "summary": "기금형 퇴직연금 추진이 공식화되면서 주요 금융지주들이 은행을 중심으로 계열사를 동원한 수탁법인 컨소시엄 설립 준비에 돌입했다. 고용노동부는 오는 6일 주요 은행장들을 소집해 기금형 퇴직연금 간담회를 열며, 법 개정 과정에서 금융지주 자회사 공동출자를 허용하는 예외를 마련할 계획이다. NH농협금융은 퇴직연금 제도 개편 대응 TF를, KB금융과 우리금융은 계열사 워킹그룹을 운영하고 있으며 신한금융도 정식 TF를 발족할 예정이다. 5대 금융지주 DC·IRP 적립액은 174조1435억원으로 작년말 대비 15.5% 늘었고, 증권 계열사 비중은 11.2%에서 13.2%로 상승했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-11-03", "url": "https://www.mt.co.kr/finance/2026/11/03/2026110216011686926", "related": [{"title": "기금형 퇴직연금 도입 초읽기… 원팀 꾸리는 금융지주 계열사", "source": "머니투데이", "url": "https://www.mt.co.kr/finance/2026/11/04/2026110319393765961"}]}, {"id": "113078a9f394", "title": "퇴직연금 ‘100% 투자 가능’의 함정…원금까지 보장하진 않아", "summary": "금융감독원은 내년 1월부터 퇴직연금 매매화면과 상품검색 화면에 투자한도와 위험등급을 함께 표시하도록 개선한다고 27일 밝혔으며, 상품제안서와 적립금운용현황보고서에도 위험등급을 병기한다. 일부 사업자가 원금손실 가능성이 있는 상품도 '투자한도 100%'로만 안내해 가입자가 원리금보장형으로 오인할 수 있다는 판단에서다. 올해 상반기 말 퇴직연금 적립금 558조3000억원 가운데 실적배당형은 198조원이고, 이 중 ETF 투자 규모는 99조8000억원으로 50.4%를 차지했다. 일부 사업자는 전산개발 일정에 따라 내년 상반기 중 시행한다.", "category": "제도·규제", "importance": 4, "source": "메트로신문", "published": "2026-10-27", "url": "https://www.metroseoul.co.kr/article/20261027500104", "related": [{"title": "“퇴직연금 다 날릴 수도”…ETF 투자한도 100%의 함정 [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8699397&ref=A"}]}, {"id": "ad939b3f2b2a", "title": "공공기관 5곳 중 1곳, 퇴직연금 법정 기준 미달…최저 39%", "summary": "올해 8월 기준 DB형 퇴직연금을 도입한 공공기관 214곳 중 46곳(21.5%)의 적립률이 법정 최저 기준인 100%에 미달했다. 태권도진흥재단이 39.17%로 가장 낮았고 분당서울대병원 43.61%, 한국교통안전공단 46.35%, 한국도로교통공단 49.57%로 법정 기준의 절반에도 못 미쳤다. 근로자퇴직급여 보장법상 적립률이 95% 미만이면 사업주는 다음 회계연도까지 부족분의 3분의 1 이상을 메워야 하며, 이를 방치하면 최대 1천만원의 과태료가 부과될 수 있다. 김위상 의원은 공공기관이 체계적인 적립 계획을 조속히 마련해야 한다고 강조했다.", "category": "법인·자금운용", "importance": 4, "source": "연합뉴스", "published": "2026-10-12", "url": "https://www.yna.co.kr/view/AKR20261012029400530", "related": [{"title": "공공기관 5곳 중 1곳, 퇴직연금 적립금 법정 기준 못 채웠다", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10912175?ref=naver"}]}, {"id": "0369d6c3118c", "title": "퇴직연금 223조원 쌓인 5대은행…국민·하나 2위 각축전", "summary": "5대 시중은행의 3분기 말 퇴직연금 적립금은 222조9427억원으로 집계됐다. 신한은행이 57조2252억원으로 1위이고 KB국민은행 52조2226억원, 하나은행 52조1554억원, 우리은행 33조243억원, NH농협은행 28조3152억원 순이다. KB국민은행과 하나은행의 격차는 672억원으로, 2분기 말 3152억원에서 크게 좁혀져 지난해 말 725억원 수준으로 돌아왔다. 올해 누적 증가액은 하나은행 3조7741억원, KB국민은행 3조7688억원으로 53억원 차이다.", "category": "업계·경쟁사", "importance": 4, "source": "이데일리", "published": "2026-10-19", "url": "https://www.edaily.co.kr/News/Read?newsId=03496486645614560&mediaCodeNo=257", "related": [{"title": "퇴직연금 2위 경쟁 격화…하나은행·국민은행 적립금 격차 672억원", "source": "CEO스코어데일리", "url": "https://www.ceoscoredaily.com/page/view/2026102015471625110"}]}, {"id": "6c986a5b1bb4", "title": "한국투자증권, 기업 대상 ‘퇴직연금 아카데미’ 개최…제도 변화 대응 전략 제시", "summary": "한국투자증권은 지난 8일 서울 여의도 TP타워에서 기업 인사·재무 담당자 등 퇴직연금 실무자를 대상으로 ‘퇴직연금 아카데미’를 개최했다. 행사는 근로자퇴직급여 보장법 개정 추진에 맞춰 기금형 퇴직연금 도입과 퇴직급여 사외적립 의무화 등 현안을 중심으로 3개 세션으로 진행됐다. 기금형 도입에 따른 운용 효율성 제고 방안과 사외적립 의무화 대비 실무 가이드라인, 정년연장·임금피크제 운영 전략, 전담 RM 활용 방안 등이 소개됐다. 김도현 개인고객그룹장은 기업들이 제도 변화에 선제적으로 대응할 수 있도록 맞춤형 컨설팅과 실무 지원을 강화하겠다고 말했다.", "category": "법인·자금운용", "importance": 3, "source": "비즈월드", "published": "2026-10-13", "url": "http://www.bizwnews.com/news/articleView.html?idxno=148655", "related": [{"title": "한국투자증권, 퇴직연금 500조 기업시장 공략…인사·재무 담당자 접점 확대", "source": "토요경제", "url": "https://sateconomy.co.kr/news/view/1065574639722076"}, {"title": "한국투자증권, 기업 실무진 대상 '퇴직연금 아카데미' 개최", "source": "뉴스드림", "url": "http://www.newsdream.kr/news/articleView.html?idxno=119732"}, {"title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "source": "아시아경제", "url": "https://view.asiae.co.kr/article/2026101209461462366"}, {"title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "source": "머니투데이", "url": "https://www.mt.co.kr/stock/2026/10/12/2026101210195750915"}]}, {"id": "52bb3ea27011", "title": "국민연금 10년 부은 평균소득자, 기초연금보다 덜 받는다…‘급여 역전’", "summary": "국민연금연구원 김형수 부연구위원의 보고서에 따르면 소득대체율 43%를 적용할 때 평균소득자가 최소가입기간 10년을 채운 월 연금액은 A값의 10.75%로, 올해 기초연금 기준연금액(A값의 약 10.95%)보다 낮다. 올해 A값 319만3511원을 넣으면 국민연금은 월 약 34만3300원으로 기준연금액 34만9700원보다 6400원가량 적다. 보고서는 국민연금 최소가입기간을 상향하거나 기초연금 기준연금액 수준을 조정하는 방향이 필요하다고 제시했다. 최소가입기간을 15년으로 높여도 59세 말 기준 미달 비율은 1.6%로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-04", "url": "https://www.segye.com/newsView/20261103517557", "related": [{"title": "국민연금 10년 부었는데 기초연금보다 적다…월 6400원 역전", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=500742"}]}, {"id": "f82595e9660f", "title": "\"1년 미만·초단기 근로자도 퇴직금\"…정부 실태조사 착수", "summary": "정부가 1년 미만 근속자와 주 15시간 미만 초단시간 근로자에게도 퇴직급여를 지급하는 방안을 검토한다. 29일 발표된 퇴직연금 기능강화 방안에 따라 한국노동연구원이 이들의 퇴직급여 운영 실태와 의무화에 따른 사용자 부담·노동시장 영향을 분석한다. 지난해 주 1~14시간 일한 취업자는 177만9000명으로 전체 취업자의 6.2%였고 관련 통계 작성 이후 가장 많았다. DC형 법정 최소 사용자 부담금이 연간 임금총액의 12분의 1인 만큼 영세 사업장의 채용 위축 우려도 제기된다.", "category": "제도·규제", "importance": 3, "source": "한국경제", "published": "2026-10-30", "url": "https://www.hankyung.com/article/202610294697i", "related": [{"title": "퇴직연금 의무화에도…1년 미만·초단시간 노동자 사각지대 남아", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261029010010231"}]}, {"id": "0dbdadec9016", "title": "[비바100] 퇴직연금에 담는 개인투자용 국채…금리보다 만기부터 따져라", "summary": "지난 9월부터 확정기여형(DC)·개인형퇴직연금(IRP) 계좌에서도 개인투자용 국채 10년물과 20년물을 청약할 수 있게 됐다. NH투자증권 100세시대연구소는 보고서에서 노후자금 사용 시점에 맞춰 만기를 분산하는 활용법을 제시했다. 2026년 9월 발행분 적용금리는 만기보유 시 10년물 연 4.765%, 20년물 연 4.920%이며, 100만원 투자 시 세전 수령액은 각각 약 159만3000원, 약 261만3000원이다. 퇴직연금에서 매입한 국채는 분리과세 대신 연금계좌 세제를 적용받고, 중도 환매 시 복리 혜택이 축소된다.", "category": "운용·상품", "importance": 3, "source": "브릿지경제", "published": "2026-10-15", "url": "https://www.viva100.com/article/20261013500585", "related": [{"title": "1000만원 넣으면 10년 뒤 1597만원…국채 사볼까", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311873"}]}, {"id": "1816a74c1ddd", "title": "다음주 금융당국 일정", "summary": "다음주 금융당국 주간 일정이 공개됐다. 11월 3일 금감원장이 FKI타워에서 열리는 제1회 퇴직연금 오래오래 캠페인 출범식에 참석한다. 11월 6일에는 금감원장이 서울 로얄호텔에서 2026 퇴직연금사업자 간담회를 연다. 4일에는 금융위원회 정례회의가 정부서울청사에서 열린다.", "category": "제도·규제", "importance": 2, "source": "이데일리", "published": "2026-10-31", "url": "https://www.edaily.co.kr/News/Read?newsId=01111926645618496&mediaCodeNo=257", "related": [{"title": "다음주 금융당국 일정", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=01626886645616200&mediaCodeNo=257"}]}, {"id": "c2ef78aa9c37", "title": "삼성생명, 퇴직연금 부가서비스 앱 'SSUM 라운지' 개편", "summary": "삼성생명이 퇴직연금 가입자 전용 부가서비스 앱 'SSUM 라운지'를 전면 개편했다고 24일 밝혔다. 새로 마련된 '퇴직연금정보'에는 시장 지표를 보여주는 '투데이브리핑'과 '연금 첫걸음', '투자 인사이트', '투자 가이드북', '연금 클래스' 등 콘텐츠가 담겼다. '연금 클래스'는 매월 한 차례 온라인 세미나로 삼성생명 퇴직연금 전문가와 삼성자산운용이 제도·상품과 시장 전망을 소개한다. 서비스는 삼성생명 퇴직연금(DB·DC·IRP) 가입자라면 누구나 무료로 이용할 수 있다.", "category": "업계·경쟁사", "importance": 2, "source": "비즈월드", "published": "2026-10-25", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149782", "related": [{"title": "삼성생명, 퇴직연금 앱 ‘SSUM 라운지’ 개편…투자정보 강화", "source": "메가경제", "url": "https://www.megaeconomy.co.kr/news/newsview.php?ncode=1065569724632297"}]}, {"id": "79701632bbb8", "title": "하나금융, 3분기 누적 순익 3조6243억원…9490억원 자사주 매입·소각 '역대 최대'", "summary": "하나금융그룹의 올해 3분기 누적 연결당기순이익은 3조6243억원으로 전년 동기 대비 5.6% 증가했고, 누적 수수료이익은 2조1428억원으로 29.8% 늘었다. 하나은행의 3분기 누적 수수료이익은 8740억원으로 전년 동기 대비 11.5% 늘며 3분기 누적 기준 역대 최대치를 기록했다. 퇴직연금과 방카슈랑스 등 수수료 수익 확대와 외환 관련 이익 증가가 은행 실적을 뒷받침했다. 하나금융은 연간 자사주 매입·소각 규모를 역대 최대인 9490억원으로 확대하기로 했다.", "category": "업계·경쟁사", "importance": 2, "source": "메트로신문", "published": "2026-10-25", "url": "http://www.metroseoul.co.kr/article/20261023500216", "related": [{"title": "하나금융, 3분기 누적 순이익 3조6243억원…자사주 매입·소각 역대 최대", "source": "월요신문", "url": "https://www.wolyo.co.kr/news/articleView.html?idxno=319524"}]}]}, "yearly": {"period": "yearly", "key": "current", "label": "2025-11-10 ~ 2026-11-09", "generated_at": "2026-11-10T13:16:59+09:0 : "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "38994a32152d", "title": "[DQN] 주식시장 약세에 삼성생명 적립금 규모 1위 재탈환…DC형 비보장 수익률 반토막 [2026년 3분기 퇴직연금 랭킹]", "summary": "금감원 통합연금포털 3분기 공시 분석 결과 삼성생명의 퇴직연금 적립금이 57조5486억원으로 2분기 1위였던 신한은행을 추월했다. 계열사 DB형 적립금이 7074억원 늘어난 반면 비계열사 DB형은 3586억원 감소했으며, 주식시장 하락으로 원리금보장형 선호가 커진 점도 영향을 미쳤다. 신한라이프 DC형 원리금비보장 수익률은 2분기 111.17%에서 3분기 59.71%로 떨어지는 등 DC·IRP 비보장형 수익률이 절반 가량 하락했다. IRP 원리금비보장 적립금은 94조6349억원에서 87조6398억원으로 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-11-08", "url": "https://www.fntimes.com/html/view.php?ud=2026110716081563428a55064dd1_18", "related": [{"title": "퇴직연금 판도 재역전…삼성생명 반년 만에 선두 탈환", "source": "아시아타임즈", "url": "https://www.asiatime.co.kr/article/20261020500369"}, {"title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "source": "세이프타임즈", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652"}, {"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "b7e8a161b6af", "title": "2028년부터 퇴직급여 사외적립 의무화… 체불 막는다", "summary": "근로자의 퇴직금 체불을 막기 위해 내후년부터 100인 이상 사업장을 대상으로 퇴직급여 사외 적립을 단계적으로 의무화하는 방안이 추진된다. 이형일 부총리 겸 재정경제부 장관과 배경훈 부총리 겸 과학기술정보통신부 장관은 28일 경제관계장관회의·과학기술관계장관회의 첫 연석회의에서 이 방안을 논의했으며, 기금형 퇴직연금의 구체적 도입 방안도 마련해 전문적인 자산 운용과 엄격한 수탁자 책임을 부과하기로 했다. 퇴직연금 사업자 평가 기준은 연금 성과 수익률 중심으로 개편하고, 디폴트옵션 적용 예정 통보 시점은 만기 후 4주에서 만기 전 2주로 앞당긴다. 구체적인 퇴직연금 기능 강화 방안은 29일 국회 기후에너지환경노동위원회 여당 위원과의 당정협의를 거쳐 발표된다.", "category": "제도·규제", "importance": 5, "source": "서울신문", "published": "2026-10-29", "url": "https://www.seoul.co.kr/news/economy/2026/10/29/20261029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "540조 퇴직연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아 ": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "fd9e49abb205", "title": "한국투자증권, 퇴직연금 운용의 우위를 실증하다... 3년간 수익률 100% 돌파", "summary": "고용노동부의 9월 말 기준 공시에서 한국투자증권 디폴트옵션 적극투자형 BF1의 3년 누적 수익률이 100.97%로 전체 퇴직연금사업자 포트폴리오 가운데 가장 높았다. 이는 적극투자형 평균 57.58%를 43.39%포인트 웃돌며, 업권별 평균은 증권 61.45%, 은행 55.76%, 보험 55.03%였다. 핵심 전략은 한국투자신탁운용과 협업한 MySuper 알아서 성장형 펀드로 글로벌 우량주와 부동산·인프라·물가연동채권 등 대체자산에 분산투자한다. 3분기 말 DC·IRP 합산 적립금은 18조5160억원으로 지난해 말보다 5조7292억원(44.8%) 늘었다.", "category": "업계·경쟁사", "importance": 4, "source": "리버티코리아포스트", "published": "2026-11-05", "url": "http://www.lkp.news/news/articleView.html?idxno=85780", "related": [{"title": "한투증권, 디폴트옵션 3년 누적 수익률 100.97%…전 사업자 1위", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261104_0003853884"}, {"title": "퇴직연금 3년 새 '두 배' 불렸다…한국투자증권, 디폴트옵션 수익률 전체 1위 달성", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "5dd7e8508fc5", "title": "하나은행, 호남권 첫 시니어 특화 금융라운지 광주에 개점", "summary": "하나은행은 지난 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 금융공간인 '하나더넥스트 광주금융 라운지'를 개점했다. 라운지는 은퇴설계, 상속·증여, 유언대용신탁 상담과 건강관리·문화·주거 등 라이프케어 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산, 예상 지출을 분석하는 '평생소득설계' 상담을 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서   }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로
     그보다 넉넉히 잡아야 매일 아침 헛경보가 뜨지 않는다. */
  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
         + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

  function buildStaleNotice() {
    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
