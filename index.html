  /* ── 팔레트 ───────────────────────────────────────────────

  :root {

    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;

    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {

      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;

      --kiwoom: #FF7A63;

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;

  a { color: inherit; }

  .masthead {

    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;

    letter-spacing: 0.22em;

    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom);

    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .search input {
    width: 230px;
    max-width: 44vw;

    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;

  .search input::placeholder { color: var(--rule); }

  .range .clear {

    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;

    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);

    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;

  .filters button[aria-pressed="true"] {

    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;

    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;

    text-decoration: none;

    cursor: pointer;
    color: var(--ink-soft);

  }

45582416&mediaCodeNo=257"}, {"id": "427ba4ce9282", "title": "[김준영 칼럼] 퇴직금 산식을 둘러싼 사업주의 억울함, 사회적 합의가 필요한 때", "summary": "근로감독관이 사업장의 퇴직금 산정 내역을 점검하면서 1일 통상임금이 1일 평균임금보다 크면 차액을 지급하라는 시정지시를 내리는 사례가 늘고 있다. 근로기준법 제2조 제2항이 평균임금이 통상임금보다 적으면 통상임금을 평균임금으로 본다고 정하고 있어 감독관은 법대로 집행하지만, 기한 내 미지급 시 사용자는 형사 입건돼 검찰에 송치될 수 있다. 월 300만원 고정급 근로자의 경우 평균임금 기준 퇴직금은 300만원이지만 209시간으로 나눈 통상임금 기준으로는 약 344만원이 돼 약 44만원 차이가 난다. 대구지방법원은 2025년 8월 21일 선고한 2024나318050 판결에서 제2조 제2항을 하한 규정으로 보아 추가 퇴직금 청구를 받아들이지 않았고 이 판결은 확정됐으나, 대법원이 쟁점을 정리한 판례는 아직 없다.", "category": "제도·규제", "importance": 3, "source": "파이낸셜리뷰", "published": "2026-09-21", "url": "http://www.financialreview.co.kr/news/articleView.html?idxno=44982"}, {"id": "3795fb0c088c", "title": "퇴직연금 제도의 법적 구조와 실무상 쟁점", "summary": "법무법인 율사서재 김한나 변호사가 퇴직연금 제도의 법적 구조와 실무 쟁점을 정리했다. 퇴직금은 사용자가 산정해 직접 지급하는 반면 퇴직연금은 사외 금융기관에 적립한 재원을 퇴직연금사업자가 지급하는 구조여서, 퇴직금 법리를 그대로 적용할 수 없다고 설명했다. 대법원은 DC형에서 사용자가 납입한 부담금이 정당한 금액에 미치지 못한 경우 근로자가 평균임금 재산정이 아니라 정당 부담금액과 납입액의 차액 및 지연이자만 청구할 수 있다고 판시했다(2020다207444). 소멸시효는 고용노동부가 10년으로 해석한 사례가 있으나 판례는 3년을 전제로 판단해 왔고 기산점은 퇴직일이라고 정리했다.", "category": "제도·규제", "importance": 3, "source": "월간노동법률", "published": "2026-09-21", "url": "http://www.worklaw.co.kr/view/view.asp?accessSite=Naver&accessMethod=Search&accessMenu=News&in_cate=106&in_cate2=0&gopage=1&bi_pidx=39555"}, {"id": "8c2b86c6d933", "title": "\"어디 투자하든 AI 리스크 떠안는다\"…연기금 분산투자도 무력화", "summary": "AI 관련 자산이 주요 자산군 전반으로 퍼지면서 기관투자자의 분산투자 전략이 힘을 잃고 있다는 진단이 나왔다. S&P500 시가총액의 약 40%가 AI 인프라 기업이고, 투자적격 등급 회사채 발행의 49%와 벤처캐피털 투자의 87%가 AI와 관련돼 있다. 940억달러를 굴리는 LA카운티 공무원퇴직연금(LACERA)은 전체 자산의 8~19%가 AI에 노출된 것으로 분석됐다. 3270억달러를 운용하는 뉴욕시 퇴직연금(NYCRS)의 최고투자책임자는 앞으로 투자하는 거의 모든 펀드가 결국 AI 노출을 더 늘릴 것이라고 말했다.", "category": "운용·상품", "importance": 3, "source": "이데일리", "published": "2026-09-21", "url": "https://www.edaily.co.kr/News/Read?newsId=02437046645582416&mediaCodeNo=257"}, {"id": "31937fac1fd1", "title": "[브랜드평판] 미래에셋자산운용, 연금 9월 1위... 하나은행, 신한은행 뒤쫓아", "summary": "한국기업평판연구소가 30개 연금 브랜드를 대상으로 분석한 결과 미래에셋자산운용이 브랜드평판지수 4,127,004로 1위를 지켰다. 하나은행이 3,990,869로 2위, 신한은행이 3,015,575로 3위를 기록했으며 1위와 2위의 격차는 13만 6,135점으로 전월 29만 2,571점보다 크게 좁혀졌다. 이번 조사는 2026년 8월 21일부터 9월 21일까지 수집된 연금 브랜드 빅데이터 4,371만 2,490건을 분석한 것으로, 전월 2,427만 5,977건 대비 80.06% 늘었다. 4위는 KB국민은행, 5위는 삼성생명보험이었다.", "category": "업계·경쟁사", "importance": 2, "source": "이넷뉴스", "published": "2026-09-21", "url": "https://www.enetnews.co.kr/news/articleView.html?idxno=54606"}, {"id": "4959003f8338", "title": "[K-기업 족쇄를 풀어라③] 호황 땐 '현금 쟁탈전', 불황 땐 '적자 충격'… '동행'의 성과급으로", "summary": "반도체 등 시클리컬 산업에서 실적에 연동한 현금 성과급이 기업의 자본과 유동성을 압박한다며 주식 기반 장기 보상(RSU)으로의 전환이 필요하다는 지적이 제기됐다. 기사는 이와 함께 기존 퇴직연금 모델에서 401(k)로의 전환과 성과급 연계가 필요하다는 시선도 소개했다. 임직원 퇴직금이 매년 측정돼 재무상 부채로 계상되는 확정급여 형태와 달리, 401(k)는 기업과 임직원이 매달 급여 일정 부분을 임직원 전용계좌에 입금하고 임직원이 직접 자산운용을 하는 방식이다. 기업은 퇴직금 부채 증가 부담을 덜고 임직원은 운용을 통해 퇴직금 자산을 늘릴 수 있다고 봤다.", "category": "법인·자금운용", "importance": 2, "source": "굿모닝경제", "published": "2026-09-21", "url": "https://www.goodkyung.com/news/articleView.html?idxno=291549"}, {"id": "761a42fb0a45", "title": "[국민연금 노후설계⑬] \"내 연금 얼마지?\" 스마트폰으로 조회부터 상담 예약까지", "summary": "국민연금공단 공식 앱 '내 곁에 국민연금'에서 가입 기간과 납부 보험료, 예상연금액을 조회하고 증명서 발급과 연금 관련 신고·신청을 처리할 수 있다. 중앙노후준비지원센터 홈페이지에서는 재무·건강·여가·대인관계 등 4대 영역의 노후준비 수준을 진단하고 국민·개인·퇴직·주택연금 정보를 한곳에서 확인할 수 있다. 홈페이지 재무진단 메뉴는 간단재무설계와 노후준비자금설계, 목적자금설계를 제공하며 예·적금과 대출 상환액, 퇴직금을 계산하는 재무계산기도 있다. 결과 해석이 어려우면 가까운 국민연금공단 지사의 노후준비 상담을 예약할 수 있다.", "category": "가입자·사회", "importance": 2, "source": "브라보마이라이프", "published": "2026-09-21", "url": "https://bravo.etoday.co.kr/view/atc_view/20062"}, {"id": "75abae8e6120", "title": "[2026 추석] 부모님과 함께 점검하는 '은퇴 이후 금융생활'", "summary": "국민연금연구원의 제10차 국민노후보장패널조사 부가조사에서 중고령자가 생각하는 월 적정 노후생활비는 개인 197만6000원, 부부 298만1000원으로 나타났다. 은퇴 후 현금흐름은 국민연금을 기본으로 퇴직연금과 개인연금을 함께 활용해 보완할 수 있다. 개인형 퇴직연금(IRP)에 퇴직급여나 추가 자금을 납입하거나 개인종합자산관리계좌(ISA) 만기자금을 IRP·연금저축으로 이전하는 방법도 제시됐다. 일정 요건을 갖춘 만 55세 이상 종신보험 계약자는 사망보험금의 최대 90% 범위에서 일부를 생전에 연금 형태로 받을 수 있다.", "category": "가입자·사회", "importance": 2, "source": "한국보험신문", "published": "2026-09-21", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=92861"}, {"id": "4ec240f77a9c", "title": "[머니 멘토링] \"30억 집 있어도 현금 없으면 불안… 은퇴 설계 핵심은 '월 부족액'\"", "summary": "은퇴 설계의 핵심은 보유 자산 규모가 아니라 매달 모자라는 금액인 '월 부족액'을 파악하는 데 있다는 조언이 제시됐다. 1965~1968년생의 국민연금 정상 수령 연령은 64세이고 1969년 이후 출생자는 65세다. 조기노령연금은 최대 5년 먼저 받을 수 있지만 1년당 6%씩 평생 감액되고, 수령을 연기하면 1년당 7.2%씩 최대 5년까지 증액된다. 2026년부터는 퇴직금을 연금으로 받을 때 연금수령연차 10년 이하는 퇴직소득세의 70%, 10년 초과 20년 이하는 60%, 20년 초과는 50%만 부담한다.", "category": "가입자·사회", "importance": 2, "source": "더비즈", "published": "2026-09-21", "url": "http://www.the-biz.co.kr/news/articleView.html?idxno=728058"}, {"id": "059e63346c6c", "title": "[인터뷰] \"원하는 기능, 빠르게 찾을 수 있어야\"…영웅문S# 개편한 키움증권", "summary": "키움증권이 MTS '영웅문S#'의 홈 화면을 개편해 앱을 실행하면 바로 잔고를 확인할 수 있도록 바꿨다. 이준국 플랫폼본부장은 개편 한 달 뒤 홈 이용 횟수가 20% 늘었고 국내 주식 순방문자는 30%, 금융상품 관련 이용은 15% 증가했다고 밝혔다. 연말까지 메뉴 개편과 'My 자산' 화면을 준비하고 있으며 인공지능을 활용한 '개인 PB' 기능도 도입할 계획이다. 이 본부장은 간편 모드로 시작해 퇴직연금까지 이어지는 플랫폼으로 장기적으로 진화시키겠다고 말했다.", "category": "업계·경쟁사", "importance": 2, "source": "아시아경제", "published": "2026-09-21", "url": "https://view.asiae.co.kr/article/2026091711244718947"}, {"id": "ec999a4f8db4", "title": "\"年900만원 넣었더니…65세부터 月430만원 따박따박\" …'3층 연금'의 힘", "summary": "40세부터 60세까지 매년 900만원을 연금계좌에 납입하면 원금은 1억8000만원이 된다. 연평균 수익률 3%를 가정하면 60세 시점 자산은 약 2억4623만원, 5%면 약 3억828만원, 7%면 약 3억9069만원으로 불어난다. 이 자산을 65세부터 연금으로 받으면 월 수령액은 각각 약 159만원, 261만원, 429만원이다. 국민연금은 수령을 1년 연기할 때마다 연금액이 7.2%씩 늘어 최대 5년 연기하면 약 36% 많아진다.", "category": "가입자·사회", "importance": 2, "source": "아시아경제", "published": "2026-09-21", "url": "https://view.asiae.co.kr/article/2026092108373983794"}, {"id": "73a701060490", "title": "AI 시대 노동룰 새로 짠다…李정부, '新사회적 대화 시대' 열까", "summary": "민주노총이 메가특구특별법 노동 특례를 논의하는 원포인트 사회적 대화에 참여하기로 한 데 이어 경제사회노동위원회 참여 여부를 결정할 대의원대회를 내달 7일 개최할 것으로 알려졌다. 참여가 결정되면 1999년 노사정위원회 탈퇴 이후 27년 만의 공식 복귀가 된다. 이재명 정부 들어 실노동시간 단축과 퇴직연금 개편 등에서 양대 노총과 경영계가 참여하는 논의가 이어지고 있다. 민주노총은 합의제 운영과 산별 참여 보장, 명칭 변경 등 세 가지 원칙을 내걸었고 노동부도 개선 방향에 공감한다는 뜻을 전한 상태다.", "category": "제도·규제", "importance": 2, "source": "노컷뉴스", "published": "2026-09-21", "url": "https://www.nocutnews.co.kr/news/6580982"}, {"id": "451759178797", "title": "[머니 컨설팅] 퇴직연금 굴리는 법, 나이대별 전략과 세제 혜택", "summary": "퇴직연금 적립금이 400조 원을 넘어선 가운데 표영대 키움증권 연금플랫폼본부장이 연령대별 운용 전략을 제시했다. 2030세대는 위험자산 한도 70% 안에서 투자성 자산 비중을 최대한 높이고, 재직 중인 4050세대도 위험자산 비중을 높이되 은퇴가 임박한 55세 전후부터는 안전자산과 배당·인컴형 상품으로 리밸런싱하라고 조언했다. 연금저축과 IRP를 합쳐 연 900만 원까지 세액공제를 받을 수 있고, 초과분은 연 1800만 원 한도까지 납입하면 인출 시 비과세가 적용된다고 설명했다. 연금소득세는 55~70세 5%, 70~80세 4%, 80세 이후 3%로 낮아지며, 사업자별로 7~8개인 디폴트옵션 라인업을 3~4개로 단순화하는 제도 개선도 추진되고 있다.", "category": "가입자·사회", "importance": 2, "source": "동아일보", "published": "2026-09-21", "url": "https://www.donga.com/news/Economy/article/all/20260921/134702177/1"}, {"id": "62316105ddec", "title": "연금·ETF 투자전략 한 눈에…'원스톱 투자상담' 열린다", "summary": "한국거래소는 30일 서울사옥에서 개인투자자를 위한 금융상품 홍보부스를 운영한다고 21일 밝혔다. '연금·절세투자존'에는 교보증권, 대신증권, 미래에셋증권, 유진투자증권, 한국투자증권, 현대차증권, KB증권, NH투자증권 등 8개 증권사가 참여해 ISA와 퇴직연금 활용법부터 세제 혜택까지 맞춤형 컨설팅을 제공한다. 'ETF투자존'에는 미래에셋자산운용, 삼성자산운용 등 10개 자산운용사가 참여해 섹터·테마별 ETF 상품 정보를 비교 제공한다. 이 행사는 금융위원회와 한국거래소가 공동주관해 9월 28일부터 10월 16일까지 3주간 열리는 '코리아 프리미엄 위크 2026'의 일환으로, 참가비는 무료다.", "category": "운용·상품", "importance": 2, "source": "헤럴드경제", "published": "2026-09-21", "url": "https://biz.heraldcorp.com/article/10880433"}, {"id": "e816ae942c9d", "title": "[2026 추석] 연휴 시작 전 미리 확인해야 할 금융거래 정보", "summary": "9월 24일부터 27일까지 추석 연휴 동안 금융회사 영업점이 쉬면서 대출 상환과 카드대금·보험료 납부일은 28일로 자동 연기된다. 퇴직연금은 통상 청구 후 2~3영업일 안에 지급돼 18일에 신청하면 23일 이전에 받을 수 있으나 상품과 금융회사에 따라 차이가 있다. 연휴 중 지급일이 돌아오는 주택연금은 23일 앞당겨 지급되며, 개별 인출금이 필요한 가입자는 22일까지 주택금융공사를 방문해 신청해야 한다. 주식과 ETF 매도대금은 매매일부터 2영업일 뒤 결제돼 23일 매도분은 29일에 지급된다.", "category": "가입자·사회", "importance": 1, "source": "한국보험신문", "published": "2026-09-21", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=92849"}, {"id": "250531171948", "title": "중장년 인생2막 필수 코스, 생애전환설계 [신철호의 실전 인생2막]", "summary": "중장년 일자리 사업을 해온 신철호 필자가 인생 2막 준비에서 일자리 정보만으로는 풀리지 않는 막막함을 짚었다. 퇴직 후 연금과 생활비를 맞추는 문제, 갑자기 늘어난 시간, 회사 밖 관계 등 재무·여가·관계 전반에서 준비가 필요하다고 진단했다. 기존 생애설계 교육은 5대·7대 영역의 정보 전달에 머물러 실천으로 이어지는 경우가 드물었다고 지적했다. 경기도 중장년 행복캠퍼스의 앙코르 입문학교가 제시한 자기이해·사회활동·삶의 활력 세 가지를 생애전환설계의 핵심으로 소개했다.", "category": "가입자·사회", "importance": 1, "source": "매일경제", "published": "2026-09-21", "url": "https://www.mk.co.kr/article/12157793"}, {"id": "eaf2f1897b61", "title": "[자산관리와 절세] 3040 싱글의 시대, 준비 없는 미래는 없다", "summary": "최지웅 핀사이트랩스 PB는 미혼 1인 가구의 핵심 재무 과제가 증여가 아니라 본인을 위한 절세와 노후 준비라고 짚었다. 기혼자는 자녀 교육비와 주택 마련처럼 목표가 뚜렷해 저축 구조가 자연스럽게 만들어지지만, 미혼은 장기 목표가 흐릿해 소비로 기울기 쉽다고 지적했다. 통계청 조사에서 1인 가구의 저축률은 다인 가구보다 낮고 소비 지출은 상대적으로 높게 나타났다. 활용할 수단으로는 세액공제를 받으면서 노후 자금을 쌓는 연금저축과 개인형 퇴직연금(IRP), 비과세와 분리과세가 적용되는 ISA, 주택청약, 보장성보험을 제시했다.", "category": "가입자·사회", "importance": 1, "source": "뷰어스", "published": "2026-09-21", "url": "https://theviewers.co.kr/View.aspx?No=4235609"}, {"id": "a27549eaa512", "title": "교보생명, 퇴직연금·신탁·펀드·여신 정보보호 강화", "summary": "교보생명이 퇴직연금과 신탁, 펀드, 여신 등 금융서비스 전반을 대상으로 ISMS-P(정보보호 및 개인정보보호 관리체계) 인증을 획득했다. 2023년 보험업무와 홈페이지를 대상으로 인증을 받은 데 이어 적용 범위를 확대한 것이다. 교보생명은 금융업무 전반에 걸쳐 ISMS-P 인증을 받은 국내 금융회사는 이번이 처음이라고 밝혔다. 인공지능 활용 확대에 대응해 AI 보안 위험평가 기준과 보안 가이드라인도 마련했다.", "category": "업계·경쟁사", "importance": 1, "source": "아주경제", "published": "2026-09-21", "url": "https://www.ajunews.com/view/20260921100110186"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-09-14 ~ 2026-09-20", "generated_at": "2026-09-21T18:15:22+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "26bad6a1c84a", "title": "이형일 \"500조 규모 퇴직연금, 수익률 저조…법안 준비 중\"", "summary": "이형일 부총리 겸 재정경제부 장관 후보자가 9월 15일 국회 재정경제기획위원회 인사청문회에서 퇴직연금 제도 개선과 관련해 노사정이 합의한 사항을 바탕으로 법안을 준비하고 있다고 밝혔다. 이 후보자는 퇴직연금 적립금이 500조원까지 올라갔는데 수익률이 저조하다며 노후소득 보장 기능이 제대로 작동하고 있느냐는 논의가 많다고 말했다. 노사정은 지난 2월 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화에 합의했고, 정부는 이를 바탕으로 연내 근로자퇴직급여보장법 개정을 추진하고 있다. 이광재 의원이 미국 401(k)를 거론하며 국가적 시스템이 필요하다고 지적한 데 대한 답변이다.", "category": "제도·규제", "importance": 5, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/economy/trend/6290971", "related": []}, {"id": "8977649855f9", "title": "표류하는 기금형 퇴직연금…간담회 또 연기", "summary": "고용노동부와 금융감독원이 공동 주재하는 퇴직연금사업자 간담회가 9월 2일에서 10월 2일로 재차 연기됐다. 한 달 새 두 번째 순연으로, 간담회는 10월 2일 오후 2시부터 3시 30분까지 서울 로얄호텔에서 김영훈 고용노동부 장관과 이찬진 금융감독원장이 함께 주재한다. 국민연금공단의 기금형 퇴직연금 참여 여부, 수탁법인 인가 대상을 5~8개로 제한하는 방안을 둘러싼 독점 우려, 손해배상 책임 강화 방침이 쟁점으로 남아 있다. 연내 근로자퇴직급여보장법 개정안 통과 목표의 재조정이 불가피하다는 관측이 나온다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-09-14", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": []}, {"id": "ffde5c86587a", "title": "'공시 넘어 사후관리'…디폴트옵션 3년, 최초 평가 시동", "summary": "고용노동부가 올해 디폴트옵션 승인 상품에 대한 첫 정기 평가를 실시한다. 2023년 7월 본격 시행된 디폴트옵션은 올해 3월 기준 41개 금융기관이 324개 상품을 승인받아 운용 중이며, 최초 승인 이후 3년이 지난 상품이 평가 대상으로 장기 성과 수익률과 위험 관리 등을 본다. 고용노동부는 첫 평가인 만큼 성과 저조 사유를 파악하고 개선 방안을 마련하는 데 핵심 의의를 두되, 문제가 지속되는 상품에는 불이익을 부여할 계획이다. 5월에 선정한 정책연구용역은 내년 2월까지 진행된다.", "category": "제도·규제", "importance": 5, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140567806179ad43907_18", "related": []}, {"id": "504d525f7a1e", "title": "개인 국채투자, '퇴직연금서 투자'에 흥행…9월 청약서 초과 수요", "summary": "이달 개인투자용 국채 청약에서 확정기여형(DC) 퇴직연금과 개인형퇴직연금(IRP) 계좌를 통한 청약액이 1천435억원으로 집계됐다. 퇴직연금 청약에 일반투자 창구 청약까지 더해지면서 9월 전체 청약액은 재정경제부가 공고한 모집예정액 2천300억원을 넘어섰고, 지난 5월 이후 처음으로 2천억원을 돌파했다. 청약은 9월 9일부터 15일까지 신한은행·하나은행·NH농협은행 등 3개 은행과 미래에셋증권·삼성증권·한국투자증권·KB증권·NH투자증권 등 5개 증권사를 통해 이뤄졌으며, 대상 채권은 10년물과 20년물이다. 10년물 표면금리는 연 4.415%, 20년물은 연 4.57%이고 두 상품 모두 연 0.35%포인트의 가산금리가 적용된다.", "category": "운용·상품", "importance": 4, "source": "연합뉴스", "published": "2026-09-17", "url": "https://www.yna.co.kr/view/AKR20260917099600008", "related": [{"title": "\"1억 넣어두면 20년 뒤 2.6억\"…연금개미들 외면한 이유", "source": "한국경제", "url": "https://www.hankyung.com/article/202609168563i"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 확정 수익 60%\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/14/2026091490036.html"}, {"title": "\"원리금보장이라고 다 같은 예금 아닙니다\"…퇴직연금, 국채 갈아타기 전 따져볼 것은", "source": "경인방송", "url": "https://news.ifm.kr/news/articleView.html?idxno=479849"}, {"title": "퇴직연금, 주식이 엔진이면 채권은 닻", "source": "중앙SUNDAY", "url": "https://www.joongang.co.kr/article/25463197"}, {"title": "퇴직연금으로 산 개인투자용 국채, 10년 뒤 수익률은?", "source": "브라보마이라이프", "url": "https://bravo.etoday.co.kr/view/atc_view/20072"}, {"title": "퇴직연금으로 국채 투자…첫 청약부터 흥행", "source": "SBS", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008759230"}, {"title": "[흔들리는 국채 공식④] 퇴직연금에 국채 담을까…개인투자자의 새 셈법", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4435180"}, {"title": "[필드뒷얘기] 퇴직연금 국채로 고객 묶는 증권사", "source": "대한금융신문", "url": "https://www.kbanker.co.kr/news/articleView.html?idxno=225952"}, {"title": "퇴직연금에 들어온 ‘개인투자용 국채’…롯데손해보험 매각, 어려운 이유 [머니카운터 방송 예고]", "source": "경인방송", "url": "https://news.ifm.kr/news/articleView.html?idxno=479676"}, {"title": "퇴직연금 계좌로 국채 투자하면 포인트 제공", "source": "서울신문", "url": "https://www.seoul.co.kr/news/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "f9f26933154f", "title": "[이슈체크] 퇴직연금까지 개선 요구…흥국생명, 반복된 감독지적 뒤 '사후관리' 시험대", "summary": "금융감독원 연금감독실은 지난달 31일 흥국생명에 퇴직연금 운영과 관련한 개선 요구 5건을 통보했다. 현물이전 안내가 미흡해 가입자가 제도를 충분히 인지하지 못한 채 불필요하게 매도하거나 운용하지 못할 수 있다는 점, 보너스보험 중도해지이율과 이율보증형2 보험의 금리보증 비용을 산정하면서 시장금리 변동 등 객관적 자료를 충분히 반영하지 않은 점이 지적됐다. 디폴트옵션 성과수수료는 계약일 기준으로 할인 대상을 정해 장기 보유자도 제외되는 구조라는 점, 연금전환특약의 차순위 보험수익자 지정 절차와 배우자 계좌 승계 안내가 부족하다는 점도 함께 지적됐다. 부담금 미납 시 벌칙과 지연이자 관련 안내가 누락된 점도 개선 요구에 포함됐다.", "category": "제도·규제", "importance": 4, "source": "더퍼블릭", "published": "2026-09-18", "url": "https://www.thepublic.kr/news/articleView.html?idxno=318506", "related": []}, {"id": "a6e5af30d59e", "title": "[단독] 5인 미만 사업장 퇴직연금 도입률 10%에 그쳐", "summary": "퇴직연금 미도입 사업장이 121만218곳으로 집계됐고, 이 가운데 30인 미만 사업장이 119만1811곳으로 98.5%를 차지했다. 사업장 규모별 도입률은 5인 미만 10.6%, 5~9인 32.7%, 10~29인 57.3%, 30~49인 74.2%, 50~99인 82.2%, 100인 이상 89.6%로 나타났다. 전체 도입률은 26.5%로 5년째 26%대에 머물렀고, 업종별로는 숙박·음식점업의 93.8%, 부동산업의 89.7%, 농림어업의 89.0%가 퇴직연금을 도입하지 않았다. 가입 대상 근로자 1308만5000명 가운데 697만2000명(53.3%)이 퇴직연금에 가입했다.", "category": "제도·규제", "importance": 4, "source": "한국경제", "published": "2026-09-17", "url": "https://www.hankyung.com/article/202609169177i", "related": []}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": []}, {"id": "507cff298ac3", "title": "미래에셋증권, 5대 시중은행 압도한 '리딩 증권사'…2분기 순이익 1.9조", "summary": "미래에셋증권이 2026년 2분기 순이익 1조9052억원을 기록해 신한은행(1조3015억원), KB국민은행(1조1240억원) 등 5대 시중은행을 모두 앞섰다. 영업이익은 2조4899억원으로 397.5% 늘었고, 세전이익 2조5287억원 가운데 1조6242억원은 스페이스X 평가이익에서 나왔다. 퇴직연금 적립금은 6월 말 80조원에 이르렀고 연간 증가율은 60%를 넘어 시장 평균의 약 2.5배였다. 개인형 퇴직연금에 로보WRAP 서비스를 도입하는 등 연금 자산관리 서비스를 넓혔다.", "category": "업계·경쟁사", "importance": 4, "source": "스포츠서울", "published": "2026-09-15", "url": "https://www.sportsseoul.com/news/read/1634922", "related": []}, {"id": "37880c4dd1e3", "title": "'퇴직연금 인기상품' 채권혼합ETF...미국 금리 상승에 수익률 '흔들'", "summary": "퇴직연금 수요를 타고 성장한 채권혼합형 ETF의 수익률이 금리 상승과 증시 조정으로 흔들리고 있다. 최근 1개월간 'ACE 미국S&P500미국채혼합50액티브'는 6.03%, 'KODEX 200미국채혼합50'은 5.8%, 'TIGER 미국나스닥100채권혼합50'은 4.59% 하락해 각각 기초지수보다 낙폭이 컸다. 타깃데이트펀드(TDF) ETF를 제외한 채권혼합형 ETF는 9월 11일 기준 66개이며 순자산총액은 18조5501억원으로 연초 6조8926억원에서 12조원 가까이 늘었다. 확정기여형(DC)·개인형퇴직연금(IRP)의 위험자산 투자 한도가 70%로 제한돼, 주식 편입 비중 50% 이하인 적격 혼합형 상품이 안전자산으로 분류되면서 자금이 몰렸다.", "category": "운용·상품", "importance": 4, "source": "헤럴드경제", "published": "2026-09-15", "url": "https://biz.heraldcorp.com/article/10873869", "related": []}, {"id": "07602bd7cfce", "title": "[시론] 기금형 제도 도입 이후, 이제 풀어야 할 퇴직연금의 과제", "summary": "박준범 성균관대 겸임교수는 기금형 퇴직연금 도입보다 연금화 부진 해소가 더 시급하다고 지적했다. 계좌 기준 연금 수령 비율은 16.5%에 그치고 평균 근속연수가 7.1년이어서 퇴직급여가 축적되지 않으며, 2022~2024년 3년간 IRP 이전금액 63.8조 원 대비 해지금액이 43.4조 원으로 해지율이 68.1%에 달한다고 밝혔다. 2024년 중도인출의 81.9%는 주택 관 ource": "서울파이낸스", "url": "https://www.seoulfn.com/news/articleView.html?idxno=637698"}, {"title": "퇴직연금에 들어온 ‘개인투자용 국채’…롯데손해보험 매각, 어려운 이유 [머니카운터 방송 예고]", "source": "경인방송", "url": "https://news.ifm.kr/news/articleView.html?idxno=479676"}, {"title": "퇴직연금 계좌로 국채 투자하면 포인트 제공", "source": "서울신문", "url": "https://www.seoul.co.kr/news/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}, {"title": "[금상소] IRP·DC에 들어온 개인투자용 국채…10년·20년물 뭐가 나을까", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2624549"}]}, {"id": "8bb193e0ea59", "title": "“정부 기초연금개편안, 겉으로는 하후상박 실제는 재정 절감안”", "summary": "정부가 노인 하위 70%를 세 집단으로 나눠 차등 지급하는 하후상박 방식을 내놨다. 하위 30%에 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원(동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": [{"title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "source": "슬로우뉴스", "url": "https://slownews.kr/166386"}, {"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "8977649855f9", "title": "표류하는 기금형 퇴직연금…간담회 또 연기", "summary": "고용노동부와 금융감독원이 공동 주재하는 퇴직연금사업자 간담회가 9월 2일에서 10월 2일로 재차 연기됐다. 한 달 새 두 번째 순연으로, 간담회는 10월 2일 오후 2시부터 3시 30분까지 서울 로얄호텔에서 김영훈 고용노동부 장관과 이찬진 금융감독원장이 함께 주재한다. 국민연금공단의 기금형 퇴직연금 참여 여부, 수탁법인 인가 대상을 5~8개로 제한하는 방안을 둘러싼 독점 우려, 손해배상 책임 강화 방침이 쟁점으로 남아 있다. 연내 근로자퇴직급여보장법 개정안 통과 목표의 재조정이 불가피하다는 관측이 나온다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-09-14", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": [{"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "4811f65ec7cf", "title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "summary": "한국보건사회연구원은 노후소득보장제도의 분절성과 비효율성 탓에 노인빈곤 문제가 해소되지 않고 있다고 지적했다. 2024년 노인빈곤율은 35.9%이며, 빈곤 노인의 약 80%는 생계급여 대상이 아니다. 연구진은 기초연금 지급 범위를 좁히는 대신 지급액을 높이는 하후상박형 개편과 사회서비스형 노인일자리 확대를 제안했다. 중위소득 40~50% 구간 노인은 기초연금과 일자리를 조합하면 빈곤선을 벗어날 수 있다고 분석했다.", "category": "가입자·사회", "importance": 3, "source": "이투데이", "published": "2026-09-20", "url": "https://www.etoday.co.kr/news/view/2627301", "related": [{"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": "2026-09-20", "url": "http://www.smarttimes.co.kr/news/articleView.html?idxno=49113", "related": [{"title": "잦은 이직에 끊기는 퇴직자산…사회복지인 전용 퇴직연금 논의 본격화", "source": "라이브뉴스", "url": "https://www.livesnews.com/news/article.html?no=64332"}]}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발생했으나 회수된 금액은 없다.", "category": "법인·자금운용", "importance": 3, "source": "시장경제신문", "published": "2026-09-16", "url": "https://www.meconomynews.com/news/articleView.html?idxno=201626", "related": [{"title": "홈플러스, 9개월간 임금체불 3871억…퇴직금도 미지급", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1690418/"}]}, {"id": "8250641ede45", "title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "summary": "미래에셋생명이 개인형 IRP 계좌를 통해 가입하는 보증형실적배당보험을 운영하고 있다. 만 50세부터 적립금을 예치하고 만 55세 이후 연금 수령을 시작하는 구조이며, MVP펀드를 통해 글로벌 분산투자를 한다. 보험업계에서 처음 출시된 퇴직연금 보증형 실적배당보험으로, 가입자가 직접 투자 상품을 고르는 부담을 줄이도록 설계됐다. 8월 말 기준 모집액은 717억원을 넘어섰다.", "category": "운용·상품", "importance": 2, "source": "신아일보", "published": "2026-09-17", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132", "related": [{"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "f22427d51808", "title": "NH농협은행, 2026년 제2차 투자상품 완전판매 대토론회 개최", "summary": "NH농협은행은 17일 서울 중구 본사에서 2026년 제2차 투자상품 완전판매 대토론회를 열었다. 투자상품 미스터리쇼핑 만점자와 영업본부 완전판매 TOP리더 등 약 40명이 참석해 펀드·방카슈랑스·신탁·퇴직연금 부문의 상담 준비, 상품 설명, 적합성·적정성 원칙 준수 사례를 공유했다. NH농협은행은 토론회 내용을 영상으로 제작해 영업점 교육자료로 활용할 계획이다. 박현동 투자상품부문 부행장은 완전판매가 절차 준수에 그치지 않고 고객 입장에서 충분히 설명하고 신뢰를 쌓는 과정이라고 강조했다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스퀘스트", "published": "2026-09-17", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=301184", "related": [{"title": "농협은행, 투자상품 완전판매 대토론회 개최…미스터리쇼핑 만점자 우수사례 공유", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146703"}]}, {"id": "ab894d0c4867", "title": "[금융 HOT 뉴스] KB자산운용, 골드 특별자산 펀드 눈길", "summary": "KB자산운용이 골드 특별자산 펀드의 운용 구조를 파생상품 중심에서 국내외 금 ETF 활용 방식으로 바꿨다. 파생상품 위험평가액을 40% 이하로 낮춰 퇴직연금 적격 요건을 충족했고 운용보수는 기존 대비 약 40% 인하했다. 비교지수는 LBMA Gold PM Price로 변경했고 환매대금은 4영업일 내에 지급한다. 현재 국민은행과 신한투자증권의 퇴직연금 계좌에서 매매할 수 있다.", "category": "운용·상품", "importance": 2, "source": "비즈월드", "published": "2026-09-16", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146330", "related": [{"title": "KB자산운용, 18년 된 금 펀드 손질…퇴직연금서도 투자", "source": "AP신문", "url": "https://www.apnews.kr/news/articleView.html?idxno=3051270"}]}, {"id": "26bad6a1c84a", "title": "이형일 \"500조 규모 퇴직연금, 수익률 저조…법안 준비 중\"", "summary": "이형일 부총리 겸 재정경제부 장관 후보자가 9월 15일 국회 재정경제기획위원회 인사청문회에서 퇴직연금 제도 개선과 관련해 노사정이 합의한 사항을 바탕으로 법안을 준비하고 있다고 밝혔다. 이 후보자는 퇴직연금 적립금이 500조원까지 올라갔는데 수익률이 저조하다며 노후소득 보장 기능이 제대로 작동하고 있느냐는 논의가 많다고 말했다. 노사정은 지난 2월 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화에 합의했고, 정부는 이를 바탕으로 연내 근로자퇴직급여보장법 개정을 추진하고 있다. 이광재 의원이 미국 401(k)를 거론하며 국가적 시스템이 필요하다고 지적한 데 대한 답변이다.", "category": "제도·규제", "importance": 5, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/economy/trend/6290971", "related": []}, {"id": "69dd458f15f4", "title": "퇴직연금 550조 커졌는데…보험사 점유율 20% 무너졌다", "summary": "퇴직연금 시장이 553조원대로 커지는 사이 보험업계 점유율이 20% 아래로 떨어졌다. 상반기 증권사는 4조1000억원 순유입을 기록한 반면 보험사는 1799억원 순유출을 냈다. 실물이전 확대로 가입자가 금융사를 옮기기 쉬워지면서 사업자 간 경쟁이 격화된 결과다. DB형에 집중된 포트폴리오가 약점으로 지목되자 삼성·한화·교보생명 등이 DC형·IRP 강화와 ETF 상품 확대로 대응하고 있다.", "category": "업계·경쟁사", "importance": 5, "source": "뉴데일리", "published": "2026-09-10", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/10/2026091000173.html", "related": []}, {"id": "de4a8500263d", "title": "수익률 32%에도 돈이 안 온다…디폴트옵션의 역설", "summary": "디폴트옵션 시행 3년 차 데이터에서 적극투자형 1년 수익률이 32.66%를 기록했으나 자금의 82.5%는 여전히 안정형에 머물러 있다. 은행권은 고객 자금 대부분을 안정형에 두는 반면 증권사 고객은 위험자산에 투자해 업권별로 뚜렷이 갈렸다. 제도의 병목은 상품 품질이 아니라 자금이 좋은 상품에 도달하는 경로에 있다는 지적이다.", "category": "운용·상품", "importance": 5, "source": "한경머니", "published": "2026-09-10", "url": "https://magazine.hankyung.com/money/article/202608199155c", "related": []}, {"id": "937d44176934", "title": "퇴직연금 6.9조 이동…은행서 증권사로 자금 쏠림, 국채로 2차 경쟁", "summary": "올해 상반기 퇴직연금 실물이전 규모가 약 6조9000억원으로 전년 동기 약 3조2000억원의 2.2배에 달해 2024년 제도 시행 이후 반기 기준 최대를 기록했다. 업권별로는 증권사가 4조1513억원 순유입, 은행이 3조9714억원 순유출, 보험이 1799억원 순유출이었고, 증권사 적립금은 2분기 말 165조468억원으로 1분기 대비 16.5% 늘어 은행권 증가율 6.6%를 크게 앞섰다. 실물이전 규모는 가입자가 직접 상품을 고르는 IRP에서 6조8000억원으로 가장 컸다. 9월부터 개인투자용 국채가 DC·IRP 계좌에 편입되면서 증권사는 안정형 상품까지 더해 고객 확보에 나서고, 은행권은 ETF 거래 편의성 개선으로 맞서고 있다.", "category": "운용·상품", "importance": 5, "source": "더트래커", "published": "2026-09-10", "url": "https://thetracker.co.kr/View.aspx?No=4221950", "related": []}, {"id": "6dd0fa0960d5", "title": "퇴직연금 디폴트옵션 첫 순유출…2분기 1조4000억 감소", "summary": "디폴트옵션 운용자금이 2023년 제도 도입 후 처음으로 순유출을 기록해 2분기에 약 1조4000억원이 줄었다. 안정형에서만 1조4891억원이 빠져나갔고, 증시 호황으로 위험자산 투자가 늘면서 자금이 대거 이동했다. 평가액 기준 적립액 증가는 117억원에 그쳐 시장 전체 증가분 45조2000억원에 비하면 미미한 수준이다.", "category": "운용·상품", "importance": 5, "source": "한국경제", "published": "2026-09-08", "url": "https://www.hankyung.com/article/202609081009i", "related": []}, {"id": "362d60df2f63", "title": "퇴직연금도 자산배분 시대…NH투자증권, DB 적립금 컨설팅 강화", "summary": "NH투자증권이 연금자산관리본부 산하 DB적립금 운용 협의체를 통해 기업별 맞춤형 IPS(적립금운용계획서) 컨설팅을 확대한다. DB형은 적립금 수익률이 임금상승률에 못 미치면 기업이 추가 적립을 부담해야 해 자산배분 전략의 필요성이 커지고 있다. 전담 계리사와 자산배분·포트폴리오 전문가로 구성된 협의체가 부채 분석부터 리밸런싱까지 5단계로 지원한다. 고객사 한국선급은 IPS 개정 후 DB 적립금 1년 수익률이 5월 말 기준 20%를 넘어 고용노동부·금융감독원 모범사례로 선정됐다.", "category": "법인·자금운용", "importance": 5, "source": "매일경제", "published": "2026-09-08", "url": "https://www.mk.co.kr/news/stock/12147172", "related": []}, {"id": "f7cf0468c30c", "title": "정부, 올 하반기 퇴직연금 디폴트옵션 손질", "summary": "고용노동부가 올해 하반기 기금형 퇴직연금 도입과 함께 디폴트옵션(사전지정운용제도)도 개편하겠다고 밝혔다. 대기기간과 디폴트옵션 상품 평가체계를 명확히 하고, 현재 제도가 적용되지 않는 자금까지 적용 범위를 넓히는 것이 핵심이다. 현재 디폴트옵션 자금의 82.5%가 안정형에 쏠려 있는 점도 개선 대상으로 지목됐다. 정부는 퇴직연금 의무화와 사외적립 의무화를 함께 추진하며 올 하반기를 퇴직연금 대격변기로 보고 있다.", "category": "제도·규제", "importance": 5, "source": "파이낸셜뉴스", "published": "2026-09-07", "url": "https://www.fnnews.com/news/202609071643275392", "related": []}]}, "yearly": {"period": "yearly", "key": "current", "label": "2025-09-21 ~ 2026-09-20", "generated_at": "2026-09-21T18:15:24+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": [{"title": "개인 국채투자, '퇴직연금서 투자'에 흥행…9월 청약서 초과 수요", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260917099600008"}, {"title": "\"1억 넣어두면 20년 뒤 2.6억\"…연금개미들 외면한 이유", "source": "한국경제", "url": "https://www.hankyung.com/article/202609168563i"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 확정 수익 60%\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/14/2026091490036.html"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 60% 확정 수익\"", "source": "TV조선", "url": 동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": [{"title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "source": "슬로우뉴스", "url": "https://slownews.kr/166386"}, {"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "8977649855f9", "title": "표류하는 기금형 퇴직연금…간담회 또 연기", "summary": "고용노동부와 금융감독원이 공동 주재하는 퇴직연금사업자 간담회가 9월 2일에서 10월 2일로 재차 연기됐다. 한 달 새 두 번째 순연으로, 간담회는 10월 2일 오후 2시부터 3시 30분까지 서울 로얄호텔에서 김영훈 고용노동부 장관과 이찬진 금융감독원장이 함께 주재한다. 국민연금공단의 기금형 퇴직연금 참여 여부, 수탁법인 인가 대상을 5~8개로 제한하는 방안을 둘러싼 독점 우려, 손해배상 책임 강화 방침이 쟁점으로 남아 있다. 연내 근로자퇴직급여보장법 개정안 통과 목표의 재조정이 불가피하다는 관측이 나온다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-09-14", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": [{"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "4811f65ec7cf", "title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "summary": "한국보건사회연구원은 노후소득보장제도의 분절성과 비효율성 탓에 노인빈곤 문제가 해소되지 않고 있다고 지적했다. 2024년 노인빈곤율은 35.9%이며, 빈곤 노인의 약 80%는 생계급여 대상이 아니다. 연구진은 기초연금 지급 범위를 좁히는 대신 지급액을 높이는 하후상박형 개편과 사회서비스형 노인일자리 확대를 제안했다. 중위소득 40~50% 구간 노인은 기초연금과 일자리를 조합하면 빈곤선을 벗어날 수 있다고 분석했다.", "category": "가입자·사회", "importance": 3, "source": "이투데이", "published": "2026-09-20", "url": "https://www.etoday.co.kr/news/view/2627301", "related": [{"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": "2026-09-20", "url": "http://www.smarttimes.co.kr/news/articleView.html?idxno=49113", "related": [{"title": "잦은 이직에 끊기는 퇴직자산…사회복지인 전용 퇴직연금 논의 본격화", "source": "라이브뉴스", "url": "https://www.livesnews.com/news/article.html?no=64332"}]}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발생했으나 회수된 금액은 없다.", "category": "법인·자금운용", "importance": 3, "source": "시장경제신문", "published": "2026-09-16", "url": "https://www.meconomynews.com/news/articleView.html?idxno=201626", "related": [{"title": "홈플러스, 9개월간 임금체불 3871억…퇴직금도 미지급", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1690418/"}]}, {"id": "8250641ede45", "title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "summary": "미래에셋생명이 개인형 IRP 계좌를 통해 가입하는 보증형실적배당보험을 운영하고 있다. 만 50세부터 적립금을 예치하고 만 55세 이후 연금 수령을 시작하는 구조이며, MVP펀드를 통해 글로벌 분산투자를 한다. 보험업계에서 처음 출시된 퇴직연금 보증형 실적배당보험으로, 가입자가 직접 투자 상품을 고르는 부담을 줄이도록 설계됐다. 8월 말 기준 모집액은 717억원을 넘어섰다.", "category": "운용·상품", "importance": 2, "source": "신아일보", "published": "2026-09-17", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132", "related": [{"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}, {"id": "354ed5723a15", "title": "삼성자산운용·미래에셋증권, 푸른씨앗 OCIO 수성", "summary": "국내 최초 기금형 퇴직연금인 푸른씨앗(중소기업퇴직연금기금) 자금을 굴릴 OCIO 전담운용기관에 삼성자산운용과 미래에셋증권이 재선정됐다. 삼성자산운용이 종합평점 92.915점, 미래에셋증권이 90.761점으로 우선협상대상자에 올랐다. 2022년 9월 첫 사업자 선정 이후 4년 만의 재선정이다. 2기 운용 기간은 2026년 9월 1일부터 2030년 8월 31일까지다.", "category": "법인·자금운용", "importance": 4, "source": "한국금융신문", "published": "2026-06-09", "url": "https://www.fntimes.com/html/view.php?ud=202606091842068772179ad43907_18", "related": []}, {"id": "5895ec3e71a7", "title": "20년 만에 퇴직연금 제도 대대적 개편…모든 사업장 의무화 추진", "summary": "정부가 2월 노사정 공동선언을 바탕으로 퇴직연금 제도를 대폭 개편한다. 7월까지 구체적 방안을 확정한 뒤 연내 관련 법 개정을 추진하고, 모든 사업장에 퇴직연금을 단계적으로 의무화할 방침이다. 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화가 핵심 축이다. 1년 미만 근로자 등 사각지대 해소도 함께 추진된다.", "category": "제도·규제", "importance": 4, "source": "대한민국 정책브리핑", "published": "2026-03-11", "url": "https://www.korea.kr/news/policyNewsView.do?newsId=148960665", "related": []}, {"id": "6e2fe502ecb5", "title": "미래에셋증권, 퇴직연금 로보Wrap 출시…AI가 자산배분·매매 맡는다", "summary": "미래에셋증권이 IRP 계좌용 로보어드바이저 일임 서비스 퇴직연금 로보Wrap을 출시했다. 알고리즘이 글로벌 자산배분 포트폴리오를 구성하고 시장 상황에 맞춰 리밸런싱과 매매까지 수행한다. 7월 말 기준 누적 가입 계좌는 14만좌, 누적 가입금액은 8조3000억원이다.", "category": "운용·상품", "importance": 3, "source": "뉴스핌", "published": "2026-08-05", "url": "https://www.newspim.com/news/view/20260805001063", "related": []}, {"id": "676b0ae84927", "title": "신한 적립액 54조 독주…국민·하나, IRP 중심 2위 경쟁", "summary": "2026년 1분기 퇴직연금 랭킹에서 신한이 적립액 54조원으로 선두를 지켰다. 국민은행과 하나은행이 IRP를 중심으로 2위 자리를 놓고 다투고 있다. 은행권 IRP 적립금은 83조7000억원으로 전체 시장의 31.7%를 차지했다.", "category": "업계·경쟁사", "importance": 3, "source": "한국금융신문", "published": "2026-04-21", "url": "https://www.fntimes.com/html/view.php?ud=2026042117435794185e6e69892f_18", "related": []}, {"id": "ecca1d1f70f8", "title": "기금형 퇴직연금은 결과 아닌 과정 책임으로…사외적립의무는 속도조절 요구", "summary": "노사정과 전문가가 참여한 정책 토론회에서 기금형 퇴직연금 도입 방향이 논의됐다. 전문가들은 운용 주체의 책임을 결과가 아닌 과정, 즉 의사결정 절차의 적정성으로 전환해야 한다고 주장했다. 경영계는 중소기업 부담을 이유로 사외적립 의무화의 단계적 시행을 요구했다. 한국노총과 한국경영자총협회, 고용노동부, 한국투자증권 관계자가 참석했다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-04-08", "url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=04598566645414152", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
