  /* ── 팔레트 ───────────────────────────────────────────────

     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나.

     키움 두 색은 kiwoomam.com 로고의 구조를 그대로 옮긴 것이다.
     글자는 감청, 포인트 마크만 마젠타. 그래서 맨 위 줄은 감청이고
     마젠타는 슬로건 한 줄에만 쓴다. 둘을 같은 넓이로 쓰면 서로 죽는다. */
  :root {

    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom-deep: #1A399E;
    --kiwoom-point: #EC008C;

    --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',
               'Malgun Gothic', system-ui, sans-serif;
    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {

      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 감청 원색은 어두운 종이에서 1.9:1까지 떨어져 줄이 보이지 않는다.
         마젠타도 한 단계 올려 짝을 맞춘다. 각각 6.2:1, 6.6:1. */
      --kiwoom-deep: #6E92F5;
      --kiwoom-point: #FF5FB4;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야
     구분선이 아니라 종이의 테두리로 읽힌다. */
  .topline { height: 4px; background: var(--kiwoom-deep); }

  /* 수집이 멈춰도 index.html은 그대로 남아 아무 일 없어 보인다. 그래서
     보는 사람의 시계와 비교해 묵은 정도를 화면에서 직접 말한다.
     2026-10-15에 엿새를 멈췄는데 아무도 몰랐던 것이 이 띠를 만든 이유다. */
  .stale {
    padding: 10px 20px;
    background: var(--hot);
    color: var(--paper);
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
  }

  .stale[hidden] { display: none; }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;
  }

  .slogan {
    margin: 0 0 0 auto;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom-point);
    white-space: nowrap;
  }

  .hero-date {
    font-family: var(--font-num);
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .search input {
    width: 230px;
    max-width: 44vw;
    padding: 4px 0;
    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */
  .group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;
  }

  .rail button {
    flex: 1 1 0;
    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .range {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);

  /* ── 분야 필터 ─────────────────────────────────────────── */

    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
  }

  .filters button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */
  .notice {
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */
  .list { margin: 8px 0 0; }

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);

  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

  details summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

ps://www.nocutnews.co.kr/news/6613401"}, {"id": "b43d39044ce5", "title": "AI 담고 채권 섞고...급락장에 혼합형 ETF 잇따라", "summary": "하반기 들어 AI·반도체 주식과 채권을 함께 담는 혼합형 ETF가 잇따라 출시되고 있다. 한국거래소에 따르면 상반기 신규 상장 ETF 99개 중 혼합형(TDF 제외)은 11개(11.1%)였으나 하반기에는 지난 10일까지 64개 중 14개(21.9%)로 이미 상반기 규모를 넘어섰다. DC형 퇴직연금과 IRP는 위험자산 투자 비중이 원칙적으로 70%로 제한되지만 요건을 충족한 채권혼합형 ETF는 100%까지 투자할 수 있어, 퇴직연금 시장 선점 경쟁이 출시 확대의 배경으로 꼽힌다. 다만 올해 상장한 AI·반도체 관련 채권혼합형 ETF 9개의 최근 3개월 단순평균 수익률은 -17.61%로 집계됐다.", "category": "운용·상품", "importance": 3, "source": "디지털투데이", "published": "2026-11-27", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=718492"}, {"id": "e39bdcc8016b", "title": "“내 월급서 떼갔는데”…사업주 연금 체납에 13만 명 노후 위협", "summary": "국민연금공단이 소병훈 의원실에 제출한 자료에 따르면 올해 9월 기준 사업주 체납으로 가입 기간을 인정받지 못해 최소 가입 기간(120개월)을 채우지 못한 근로자는 13만4616명이다. 이 가운데 이미 수급 연령에 도달한 가입자는 1만5050명(11.18%)이다. 국민연금 13개월 이상 장기 체납액은 2024년 말 4888억원에서 지난해 6월 기준 5031억원으로 다시 늘었다. 건강·고용·산재보험과 달리 국민연금은 사업주 미납 시 해당 기간이 가입 기간에서 빠지고, 근로자가 개별 납부해야 나머지 절반을 인정받는 구조다.", "category": "가입자·사회", "importance": 3, "source": "서울경제TV", "published": "2026-11-27", "url": "https://www.sentv.co.kr/article/view/sentv202611270031"}, {"id": "7691a49fdb79", "title": "미래에셋자산운용, 디폴트옵션 전용 펀드 ‘부동의 1위’", "summary": "미래에셋자산운용의 디폴트옵션 전용 펀드(O클래스) 설정액은 2026년 10월 30일 기준 1조 3,756억원으로 업계 1위를 기록했으며, 2위 운용사의 약 2.5배 규모다. 국내 디폴트옵션 전용 펀드 시장 설정액은 지난해 말 3조 7,009억원에서 4조 6,911억원으로 26.8% 증가했다. 설정액 상위 5개 가운데 3개가 미래에셋전략배분적격TDF 시리즈(2035·2045·2050)다. 채권혼합형 미래에셋밸런스알파플러스는 O클래스 기준 연초 이후 수익률 10.31%, 최근 1년 수익률 12.84%로 동종 15개 펀드 중 1위를 기록했다.", "category": "업계·경쟁사", "importance": 3, "source": "프레스나인", "published": "2026-11-27", "url": "http://www.press9.kr/news/articleView.html?idxno=87142"}, {"id": "7da9c9904b58", "title": "\"잘나가는 종목만 모았다더니\"…개미들 울린 ETF의 함정 [분석+]", "summary": "소수 종목에 집중 투자하는 ETF가 하반기 급락장에서 큰 손실을 냈다. 'SOL AI반도체TOP2플러스'는 하반기 들어 59.24% 하락했고, 4개 종목 비중이 82.22%에 달한다. 'KODEX 방산TOP10'(-42.77%), 'KODEX 조선TOP10'(-49.54%) 등 다른 업종 집중형 상품도 부진했다. 위험자산 투자 한도가 70%로 제한되는 DC·IRP 계좌의 주식 비중을 높이려는 수요를 겨냥한 채권혼합형 상품도 있어 퇴직연금 계좌에서도 특정 업종 쏠림이 심화할 수 있다는 조언이 나왔다.", "category": "운용·상품", "importance": 2, "source": "한국경제", "published": "2026-11-27", "url": "https://www.hankyung.com/article/2026112627236"}, {"id": "11bf40dfd79a", "title": "실적 날개 단 박종문 삼성증권 대표 사실상 유임…새 임기 '내부통제·보안 강화' 숙제", "summary": "내년 3월 임기 만료를 앞둔 박종문 삼성증권 대표가 사실상 유임된 것으로 알려졌다. 삼성증권의 3분기 누적 순이익은 1조2919억원으로 전년 동기 대비 63.1% 증가했다. 퇴직연금 사업에서도 3분기 누적 적립금이 27조7000억원으로 전년 동기 대비 46.6% 늘어 증권업계 2위를 기록했다. 반면 금융당국 제재와 해킹 사고에 따른 내부통제 개선은 과제로 남았다.", "category": "업계·경쟁사", "importance": 2, "source": "소비자가 만드는 신문", "published": "2026-11-27", "url": "http://www.consumernews.co.kr/news/articleView.html?idxno=769110"}, {"id": "9a6bf32fe507", "title": "이호성 행장, 순익 3.3조 '최대'…3연속 단임 흐름 깰까 [함영주號 하나금융 인사]", "summary": "이호성 하나은행장이 3분기 누적 순이익 3조3157억원으로 역대 최대 실적을 내며 첫 연임 시험대에 올랐다. 3분기 누적 수수료이익은 전년 동기보다 11.5% 증가한 8740억원으로, 퇴직연금·방카슈랑스·외환수수료 등에서 성과를 거뒀다. 3분기 말 하나은행의 퇴직연금 적립금은 52조1554억원으로 5대 은행 중 증가율이 가장 높았고 DB·DC·IRP 제도별 증가율도 모두 선두였다. 하나금융은 12월 초 최종 후보자를 선정할 예정이다.", "category": "업계·경쟁사", "importance": 2, "source": "한국금융신문", "published": "2026-11-27", "url": "https://www.fntimes.com/html/view.php?ud=2026112618411377811b5a221379_18"}, {"id": "473369d61af3", "title": "삭발에 단식까지, 공무원도 \"정년연장\"", "summary": "공노총이 26일 국회 본관 앞에서 조합원 300여명이 참석한 기자회견을 열고 공무원 정년연장과 소득공백 해소 입법을 촉구했으며, 공주석 위원장은 삭발 후 단식농성에 들어갔다. 공무원 법적 정년은 60세지만 연금 지급 개시 연령은 2015년 공무원연금 개혁으로 2033년까지 65세로 늦춰져 최대 5년간 소득이 끊길 수 있다. 소득공백을 겪는 공무원은 2022년 1691명에서 올해 4095명으로 늘었고 2032년에는 2만명을 넘을 전망이다. 공노총은 재임용 제도 확대와 조기 수령 시 최대 25%까지 감액되는 제도의 완화도 요구했다.", "category": "가입자·사회", "importance": 2, "source": "매일노동뉴스", "published": "2026-11-27", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237955"}, {"id": "1d22e0dcceb6", "title": "ETF 시장 10년 새 23배 성장…“장기 자산관리 전환 필요”", "summary": "자본시장연구원 김재칠 선임연구위원은 'ETF 시대 자산운용시장의 과제' 보고서에서 자산운용업이 장기 자산관리 중심으로 사업 구조를 전환해야 한다고 제언했다. 국내 ETF 순자산총액은 2015년 말 이후 약 23배 늘어 올해 6월 말 512조원에 달했고, 공모 주식형펀드의 액티브 운용 비중은 2007년 97.3%에서 18.5%로 급감했다. 보고서는 액티브 ETF 상관계수 요건 완화와 상장클래스 확대를 제안했다. 확정기여형(DC) 퇴직연금에서 공모펀드를 장기 자산배분 수단으로 활용하는 방안도 제시했다.", "category": "운용·상품", "importance": 2, "source": "광주매일신문", "published": "2026-11-27", "url": "http://www.kjdaily.com/article.php?aid=1795705755693615276"}, {"id": "427f5180b842", "title": "신한자산운용 ‘SOL 머니마켓액티브 ETF’ 순자산 1000억원 돌파…연초 대비 10배 성장", "summary": "신한자산운용의 SOL 머니마켓액티브 ETF 순자산이 연초 100억원 수준에서 10배 이상 늘어 1000억원을 넘어섰다. 11월 26일 기준 연초 이후 수익률은 2.57%, 최근 1개월 연환산 수익률은 3.83%이고, 만기수익률은 연 3.93%로 CD 91일물 금리(3.40%)를 0.53%p 웃돌았다. 우량 단기채권과 기업어음에 분산투자하며 개인연금과 퇴직연금 계좌에서도 투자할 수 있다. 한국은행이 11월 26일 기준금리를 연 3.00%에서 3.25%로 인상한 가운데 단기금리형 ETF로 대기 자금이 유입되고 있다.", "category": "운용·상품", "importance": 2, "source": "메가경제", "published": "2026-11-27", "url": "https://www.megaeconomy.co.kr/news/newsview.php?ncode=1065569694823542"}, {"id": "95ce12380df0", "title": "일자리 없거나 나쁘거나‥연내 입법 가능할까?", "summary": "60세 정년퇴직 후 국민연금을 받기까지 최대 5년간 고령층이 열악하고 불안정한 일자리로 내몰리는 경우가 많다. 앞으로 5년간 정년 60세에 도달하는 인구는 약 446만 명이며, 올해 취업자 4명 중 1명이 60세 이상이다. 노동계는 소득 공백을 근거로 65세 정년 연장의 연내 입법을 요구하고 있다. 양대노총은 특위에서 실질적 입법안이 나오지 않으면 강력히 투쟁하겠다고 밝혔다.", "category": "가입자·사회", "importance": 2, "source": "MBC", "published": "2026-11-27", "url": "https://imnews.imbc.com/replay/2026/nwtoday/article/6868959_37012.html"}, {"id": "652a541442fe", "title": "생보사 실적 뒷걸음질…보험손익·투자손익 ‘이중고’", "summary": "금융감독원에 따르면 올해 3분기 누적 생명보험사 22곳의 당기순이익은 3조8879억원으로 전년 동기 대비 9421억원(19.5%) 감소했다. 수입보험료는 105조8953억원으로 18.4% 늘었고 퇴직연금 등과 저축성보험 수입보험료가 각각 35.9%, 34.0% 증가했다. 다만 투자손익이 1조3187억원으로 52.4% 급감하고 보험손익도 8.4% 줄었다. 기사는 저축성보험과 퇴직연금 판매가 늘수록 적정한 운용수익률을 지속적으로 확보하는 것이 관건이라고 짚었다.", "category": "업계·경쟁사", "importance": 2, "source": "이코노미스트", "published": "2026-11-27", "url": "https://economist.co.kr/article/view/ecn202611260034"}, {"id": "e7d1f43af0f0", "title": "미래에셋생명 '퇴직연금 마스터코스' 개최…81개 기업 담당자 참석", "summary": "미래에셋생명이 23일 서울 포시즌스호텔에서 전국 81개 기업 퇴직연금 담당자 129명이 참석한 '2026 퇴직연금 마스터코스'를 개최했다. 행사에서는 근로자퇴직급여보장법 입법 동향과 DB형 자산운용 전략, 상품 동향을 다뤘다. NH-Amundi자산운용과 KB자산운용이 DB형 운용 전략을 소개했고, 미래에셋생명은 IRP 보증형 실적배당보험을 중심으로 연금 운용 방안을 발표했다.", "category": "법인·자금운용", "importance": 1, "source": "뉴스핌", "published": "2026-11-27", "url": "https://www.newspim.com/news/view/20261125000338"}, {"id": "212e25d6faf4", "title": "노후 안전망에 필요한 투명성[우보세]", "summary": "국민연금 수급자는 7월 말 기준 794만명이며 이 중 44.8%가 월 40만원도 받지 못한다. 국민연금이 지분 5% 이상을 가진 상장사의 주식 평가액은 6월 말부터 지난달 15일까지 182조3963억원 줄었다. 이름을 가린 사모펀드 출자액은 지난해 말 기준 23조7468억원으로 전체 출자액의 33.1%에 이른다. 칼럼은 국민연금이 기금 운용 의사결정과 성과를 투명하게 공개해야 한다고 주장했다.", "category": "가입자·사회", "importance": 1, "source": "머니투데이", "published": "2026-11-27", "url": "https://www.mt.co.kr/opinion/2026/11/27/2026112513014980444"}, {"id": "d6e034d9af8d", "title": "[사설] 연금 수급 68세? 미래 세대 가슴 또 철렁한다", "summary": "국민연금 수급 개시 연령은 2026년 63세에서 2028년 64세, 2033년 65세로 높아진다. 9월 국회 연금개혁특별위원회 주관 토론회에서 2046년까지 68세로 올리자는 제안이 나오면서 '68세 연장설'이 확산됐다. 정은경 보건복지부 장관은 검토하지 않았고 법 개정이 필요한 사안이라고 선을 그었다. 사설은 수급 연령 추가 상향을 꺼내서는 안 된다고 주장했다.", "category": "가입자·사회", "importance": 1, "source": "경기일보", "published": "2026-11-27", "url": "https://www.kyeonggi.com/article/20261126580542"}, {"id": "d1876cd9063b", "title": "선택지 넓어지는 퇴직연금…기업 역량은 제자리", "summary": "장선필 연금연구소 대표는 사외적립 의무화와 기금형 도입으로 퇴직연금 선택지가 넓어지지만 기업 담당자와 노조 간부의 역량 기준은 사실상 없다고 지적했다. 법 개정안이 통과되면 사외적립 의무화는 2028년 100인 이상 사업장부터 2030년 10인 미만 사업장까지 단계적으로 확대되며, 현재 전체 사업장의 퇴직연금 도입률은 26.5%다. 300인 이상 DB형 사업장에는 적립금운용위원회 설치와 IPS 작성이 요구되지만 담당자 교육 기준이 없어 가입자교육과 사업자 선정을 금융회사에 의존하는 관행이 굳어졌다고 봤다. 필자는 고용노동부가 표준 교육 기준을 정하고, 회사와 근로자대표에 교육 이수자를 한 명 이상 두며, 신규 도입 사업장에 담당자 교육을 지원해야 한다고 제안했다.", "category": "법인·자금운용", "importance": 1, "source": "뉴스퀘스트", "published": "2026-11-27", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=305939"}, {"id": "7083142708ca", "title": "[박곰희 칼럼] TDF, 가입 후 신경 안 써도 되는 상품 고르는 법", "summary": "필자는 TDF가 은퇴 시점에 맞춰 주식 비중을 줄이고 채권을 늘리는 글라이드 패스와 리밸런싱을 운용사가 대신 해주는 상품이라고 설명했다. 국내 TDF 설정액은 에프앤가이드 기준 9월 7일 18조원을 넘었고 1년 만에 41% 늘었다. 고를 때는 빈티지, 운용사, 규모, 펀드·ETF 형태, 담을 계좌 다섯 가지를 확인하면 된다고 했다. 빈티지는 출생연도에 60을 더한 숫자와 가까운 것을 고르라고 제시했다.", "category": "운용·상품", "importance": 1, "source": "여성경제신문", "published": "2026-11-27", "url": "https://www.womaneconomy.co.kr/news/articleView.html?idxno=261492"}, {"id": "aecfa4a024cd", "title": "한국투자증권, 기업 임원 맞춤형 절세 콘텐츠 공개", "summary": "한국투자증권은 기업 임원을 위한 세무 숏폼 영상 시리즈 '리더를 위한 절세전집'을 공개했다고 27일 밝혔다. 콘텐츠는 MTS '한국투자'와 퇴직연금 유튜브 채널 '한국인의 연금', 인스타그램 등을 통해 제공한다. 영상은 재직 중, 퇴직 전, 인출(수령) 등 3단계로 구성돼 연금 활용 세액공제, DC형 퇴직연금 운용, 퇴직소득세 계산법 등을 다룬다. 인출 단계에서는 일시금 수령 대비 퇴직소득세 부담을 30~50% 줄일 수 있는 연금 수령 방법 등을 안내한다.", "category": "업계·경쟁사", "importance": 1, "source": "디지털투데이", "published": "2026-11-27", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=718624"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-11-20 ~ 2026-11-26", "generated_at": "2026-11-27T14:16:07+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "e349bf3a7d98", "title": "한투증권, 디폴트옵션 3년 누적수익률 100.97%… 전체 1위", "summary": "25일 고용노동부가 발표한 2026년 3분기 디폴트옵션 현황에서 한국투자증권의 '디폴트옵션 적극투자형 BF1'이 3년 누적 수익률 100.97%로 전체 퇴직연금사업자 포트폴리오 중 가장 높았다. 전체 적극투자형 평균 수익률은 57.58%였고 업권별로는 증권 61.45%, 은행 55.76%, 보험 55.03%였다. 한국투자증권의 3분기 말 DC형·IRP 적립금 합산액은 18조5160억원으로 지난해 말 12조7868억원보다 44.8% 늘어 전체 사업자 중 가장 높은 증가율을 기록했다. 회사는 업계 최초로 연금 계좌의 현금성 자산 잔고 변동까지 실시간으로 보여주는 '총 연금자산 실시간 평가' 기능도 도입했다.", "category": "업계·경쟁사", "importance": 4, "source": "아시아경제", "published": "2026-11-25", "url": "https://view.asiae.co.kr/article/2026112408305607557", "related": [{"title": "디폴트옵션 3년 수익률 100.97%… 퇴직연금으로 ‘뭉칫돈’ 몰린다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261125/135083294/2"}]}, {"id": "3e0664580259", "title": "환매 중단 펀드 담긴 퇴직연금도 ‘갈아타기’ 허용", "summary": "금융감독원은 25일 내년 1월 18일부터 환매 중단 펀드가 담긴 퇴직연금 계좌도 같은 펀드를 판매했던 금융회사로 옮길 수 있도록 하는 개선안을 발표했다. 그동안 러시아 펀드 12개 등 환매가 막힌 펀드를 조금이라도 보유하면 나머지 적립금까지 실물이전이 제한됐다. 9월 말 기준 해당 가입자는 5092명, 적립금은 7835억원이며 문제 펀드 평가액은 128억원으로 전체의 1.6%다. 금감원은 내년 3월부터 개인투자용 국채도 실물이전 대상에 넣고, 상반기 중 DC에서 IRP로 옮길 때도 기존 상품을 그대로 가져갈 수 있게 할 방침이다.", "category": "제도·규제", "importance": 4, "source": "조선일보", "published": "2026-11-26", "url": "https://www.chosun.com/economy/economy_general/2026/11/26/M5B6AZBCD5DFZAR4JQFSFM4ZSA/", "related": [{"title": "\"환매중단펀드도 갈아탄다\"…실물이전 확대에 '사각지대' 계좌도 움직인다", "source": "매일일보", "url": "https://www.m-i.kr/news/articleView.html?idxno=2023677"}]}, {"id": "81bc674fd165", "title": "\"증시 호황 땐 잘나갔는데\"…증권사 퇴직연금 석달 새 4.8조 증발", "summary": "금융감독원 통합연금포털에 따르면 3분기 말 증권사 15곳의 퇴직연금 적립금은 160조2935억원으로 2분기 말보다 4조7533억원(2.88%) 감소했다. 은행(-2.14%), 손해보험(-1.93%), 생명보험(-0.73%)보다 감소율이 높았고 전체 금융권 감소액 11조7565억원의 약 40%가 증권사에서 발생했다. 증권사 IRP 적립금은 65조6262억원에서 62조7119억원으로 2조9143억원(4.44%) 줄었으며, IRP 내 실적배당형은 3조3899억원 감소한 반면 원리금보장형은 4755억원 늘었다. 코스피가 3분기에만 19.33% 하락한 영향으로 풀이되며 4분기에도 추가 감소 가능성이 거론된다.", "category": "업계·경쟁사", "importance": 4, "source": "데일리안", "published": "2026-11-26", "url": "https://www.dailian.co.kr/news/view/1719646/", "related": []}, {"id": "7b0e43c939f4", "title": "KB국민은행, 기업 퇴직연금 수수료 최대 0.20%p 인하", "summary": "KB국민은행이 27일부터 확정급여형(DB)과 표준형 확정기여형(DC), 기업형 개인형퇴직연금(IRP)의 수수료 체계를 개편해 수수료율을 최대 0.20%p 인하한다. 표준형 DC의 적립금 50억원 미만 구간 운용관리수수료율은 연 0.14~0.19%에서 연 0.10%로, DB형 500억원 이상 1000억원 미만 구간은 연 0.18%에서 0.07%로 낮춘다. 우대 대상에 신협·새마을금고 등 조합법인과 노인장기요양기관, 장애인활동지원기관, 아이돌봄서비스 제공기관을 추가하고 공공기관 대상 10% 할인 제도를 신설한다. DB형 집합투자증권(ETF 제외) 자산관리수수료 면제 기준도 전체 평균잔액의 70% 이상에서 50% 이상으로 완화한다.", "category": "업계·경쟁사", "importance": 4, "source": "프레스나인", "published": "2026-11-24", "url": "http://www.press9.kr/news/articleView.html?idxno=86883", "related": []}, {"id": "934ed8562ba9", "title": "키움證의 퇴직연금 “고객이 먼저 신청해요”", "summary": "키움증권이 올해 6월 퇴직연금 사업을 시작하며 선보인 ‘퇴직연금 도입요청’ 서비스에 680개 기업이 신청했다. 기업 담당자나 근로자가 MTS 영웅문S#으로 도입 상담을 요청하면 키움증권 담당자가 DB형·DC형·IRP 등 퇴직연금 전반을 안내하는 방식이다. 부산의 중소 물류업체가 임직원 신청을 계기로 사업자를 변경하는 등 영업망과 연고가 없는 지방 중소기업까지 고객으로 확보했다. 금감원 통합연금포털 기준 3분기 키움증권 퇴직연금 적립금은 DB형 150억 원, DC형 106억 원, IRP 1626억 원 등 총 1882억 원이다.", "category": "업계·경쟁사", "importance": 4, "source": "서울경제", "published": "2026-11-22", "url": "https://www.sedaily.com/article/20117431", "related": []}, {"id": "f39e4c1aef15", "title": "금감원 \"퇴직연금 단기실적 경쟁안돼…변칙 고금리 등 엄정대응\"", "summary": "서재완 금융감독원 부원장보는 19일 4대 금융협회와 퇴직연금 사업자 담당 임원 간담회에서 연말 변칙적 고금리와 이벤트성 특별이익 제공 등 불건전 영업행위에 엄정 대응하겠다고 밝혔다. DB형 원리금보장상품의 연말 만기 집중을 틈탄 특정 가입자 고금리 제공, 고수익 상품을 대기업 위주로 제시해 영세기업 가입비율이 10%를 밑돈 사례 등이 지적됐다. 금감원은 최근 5년간 통합연금포털 공시오류가 302건 발생했다며 내부 검증 체계 강화를 주문했다. 불건전 영업행위 모니터링을 강화하고 공시 제도 개선을 추진할 계획이다.", "category": "제도·규제", "importance": 4, "source": "보험매일", "published": "2026-11-20", "url": "http://www.fins.co.kr/news/articleView.html?idxno=110641", "related": []}, {"id": "b45aff8da79f", "title": "키움증권, 퇴직연금 5개월 만에 2000억 돌파…영웅문 고객이 이끈 IRP 성장 [퇴직연금 542조 대격변 5-①]", "summary": "키움증권의 퇴직연금 적립금이 올해 6월 사업 개시 후 약 5개월 만인 11월 2000억원을 넘어섰다. 적립금은 6월 말 649억원에서 9월 말 1882억원으로 약 2.9배가 됐고, 같은 기간 증권업권 전체 적립금은 전 분기 대비 2.88% 줄었다. 9월 말 IRP 적립금은 약 1626억원으로 전체의 86%가량이며, IRP 적립금의 약 75%가 타사 이전 자금이고 7월 기준 IRP 가입자의 96%가 기존 키움증권 고객이었다. 키움증권은 영웅문S#에서 ETF 실시간 매매·적립식 자동매수와 통합연금개시 서비스를 제공한다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-20", "url": "https://www.etoday.co.kr/news/view/2650202", "related": []}, {"id": "68273cee30dc", "title": "표영대 키움증권 연금플랫폼본부장 \"증권업권 퇴직연금 적립금 5위 진입 목표\" [퇴직연금 542조 대격변 5-②]", "summary": "표영대 키움증권 연금플랫폼본부장은 중장기적으로 증권업권 퇴직연금 적립금 기준 5위 진입을 목표로 한다고 밝혔다. IRP로 출발한 사업을 DB·DC 기업 퇴직연금으로 넓히는 것이 다음 과제이며, 근로자가 영웅문S#에서 키움증권을 사업자로 회사에 요청하는 '퇴직연금 도입요청'을 비대면 영업 통로로 활용한다. 기업 비용 부담을 낮추기 위해 DB와 DC 모두 첫해 운용관리·자산관리 수수료 전액을 면제하고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-20", "url": "https://www.etoday.co.kr/news/view/2650211", "related": []}, {"id": "058f4d4a721b", "title": "사별하면 유족연금 70% 깎이는데…연금공단은 지급률 상향엔 ‘신중’ 왜?", "summary": "국민연금공단은 본인 연금을 고를 때 얹어 주는 유족연금 비율을 30%에서 50%로 높이는 방안에 대해 심도 있는 검토와 사회적 합의가 먼저라는 입장을 국회에 냈다. 본인 연금과 유족연금 수급권이 겹친 사람은 2021년 12만3994명에서 지난해 20만8242명으로 67.9% 늘었다. 지난해 이들 중 82%는 본인 연금을, 18%는 유족연금을 택했다. 공단은 지급률 상향 시 재정 영향 분석 자료가 없으며 내년 국민연금연구원을 통해 재정추계 연구를 할 계획이다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-26", "url": "https://www.segye.com/newsView/20261125516561", "related": [{"title": "부부가 함께 부은 연금, 사별하면 유족연금 70% 깎인다", "source": "세계일보", "url": "https://www.segye.com/newsView/20261123510564"}, {"title": "내 연금·유족연금 겹친 20.8만명…3.7만명은 내 연금 '0원'", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20261122031500530"}, {"title": "“부부가 평생 꼬박꼬박 냈는데 0원”…배우자 떠나자 연금 ‘뚝’, 중복지급 상향은", "source": "매일경제", "url": "https://www.mk.co.kr/article/12217731"}]}, {"id": "ba2a9bfbd61a", "title": "국민연금 68세로 늦춘다?…장관까지 나서 해명", "summary": "9월 말 국회 국민연금 구조개혁 토론회에서 한 교수가 수급 개시 연령을 2046년까지 68세로 올리는 방안을 제시한 뒤 SNS에서 연금 수급이 68세로 늦춰진다는 콘텐츠가 확산됐다. 정은경 복지부 장관은 SNS에서 사실이 아니며 수급개시연령 조정을 검토하고 있지 않다고 밝혔다. 현재 수급 개시 연령은 63세로 2028년 64세, 2033년 65세로 오르도록 돼 있다. 국회 연금개혁특위는 구조개혁 합의안을 내지 못한 채 올해 말 활동 종료를 앞두고 있다.", "category": "가입자·사회", "importance": 3, "source": "SBS", "published": "2026-11-26", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008863894", "related": [{"title": "'국민연금 수급개시연령 68세로 상향' 관련 정은경 보건복지부 장관 직접 해명", "source": "매일신문", "url": "https://www.imaeil.com/page/view/2026112416560744576"}]}, {"id": "b479ce15b6d3", "title": "반도체 폭락에도 퇴직연금은 '사자'···은행권, 223조원 사수 총력전", "summary": "3분기 말 5대 은행의 퇴직연금 적립금은 222조9427억원으로 2019년 집계 이후 처음 감소했고, 2024년 10월 실물이전 시행 이후 올해 6월 말까지 은행에서 증권사로 옮겨간 적립금은 5조2000억원이었다. 은행들은 자금 이탈을 막기 위해 ETF 매도 대금으로 같은 날 재투자할 수 있는 당일매매 서비스를 잇달아 도입하고 있다. 국민은행이 8월 20일 시중은행 최초로 도입했고 신한은행이 9월, 우리·하나은행이 이달 합류했으며 농협은행은 다음 달, IBK기업은행은 내년 1분기 시작할 예정이다. 국민은행은 시행 후 한 달간 증권사로 이동한 적립금이 지난해 12월 한 달보다 약 50% 줄었다고 밝혔으나, 은행은 여전히 실시간 거래가 안 되고 취급 상품도 약 300개로 증권사(약 900개)보다 적다.", "category": "업계·경쟁사", "importance": 3, "source": "스마트비즈", "published": "2026-11-23", "url": "https://www.smartbizn.com/news/articleView.html?idxno=160195", "related": [{"title": "은행 퇴직연금, '증권사 속도'로 바뀐다…ETF 당일매매 전산 개편 확산", "source": "전자신문", "url": "https://www.etnews.com/20261120000226"}]}, {"id": "20d8d5152758", "title": "퇴직연금 수익률 동반 1위… 단기에도 장기에도 강했다", "summary": "신한투자증권은 9월 말 통합연금포털 비교공시 기준 적립금 1조원 이상 증권사 가운데 원리금비보장형 최근 1년 수익률이 DC형 17.22%, IRP 15.43%로 모두 1위였다고 밝혔다. IRP 원리금비보장형 3년 연 환산 수익률은 16.03%로 증권사 중 1위, DC형은 15.93%로 2위였다. 회사는 2024년 4월부터 IRP 운용·자산관리 수수료를 조건 없이 0%로 적용하고 있다. 올해 연금 고객관리팀을 신설해 전담 직원 17명을 두고 9월 말까지 연금 세무 컨설팅 380회를 제공했다.", "category": "업계·경쟁사", "importance": 3, "source": "동아일보", "published": "2026-11-26", "url": "https://www.donga.com/news/Economy/article/all/20261125/135083298/2", "related": []}, {"id": "f816627dc2c9", "title": "거래대금 65% 줄어도 성장판 넓힌다…증권사, 연금·WM·기업금융으로 체질 개선", "summary": "국내 증시 일평균 거래대금이 5월 65조7822억원에서 이달 24일까지 23조2605억원으로 64.6% 줄자 증권사들이 퇴직연금·WM·기업금융으로 수익 기반을 넓히고 있다. 한국투자증권의 8월 말 IRP 계좌는 56만7463개로 작년 말보다 9만4727개 늘었고, 하나증권의 9월 말 DC·IRP 적립금은 작년 말보다 각각 36.5%, 38.8% 증가했다. 6월 퇴직연금 사업을 시작한 키움증권은 약 5개월 만에 적립금 2000억원을 넘었고 9월 말 IRP 적립금의 약 75%가 타 금융사 이전 자금이다. 신한투자증권은 연금고객관리팀 17명을 두고 IRP 수수료 전액 면제를 시행하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "이투데이", "published": "2026-11-26", "url": "https://www.etoday.co.kr/news/view/2652877", "related": []}, {"id": "6569397ec8ba", "title": "[비바100] 500조 퇴직연금, 금리만 쫓다 낭패…'만기 분산·보호 한도' 따져라", "summary": "NH투자증권 100세시대연구소 THE100리포트 137호에 따르면 지난해 말 퇴직연금 적립금은 501조4000억원이며 이 가운데 원리금보장형이 378조1000억원으로 75.4%를 차지했다. DB형은 적립금의 91.9%를 원리금보장형으로 운용하는 반면 DC형과 IRP는 각각 67.0%, 55.7%였다. 원리금보장형은 보험상품 38.0%, 은행·우체국 예·적금 33.7%, ELB 9.8%, 저축은행 예·적금 5.4%로 구성됐다. 기사는 ELB와 RP가 예금자보호 대상이 아니라는 점 등 상품별 지급주체와 중도해지 조건이 달라 만기 분산과 안전장치를 따져야 한다고 전했다.", "category": "운용·상품", "importance": 3, "source": "브릿지경제", "published": "2026-11-26", "url": "https://www.viva100.com/article/20261123500403", "related": []}, {"id": "675f8ee312b4", "title": "수익은 높이고 세부담은 덜고…똑똑한 연말정산 ‘주목’", "summary": "NH농협은행이 올해 3분기 퇴직연금 DB형과 IRP의 원리금비보장상품 1년 운용수익률에서 적립금 상위 10개사 가운데 1위를 기록했다. 금융감독원 통합연금포털 공시에 따르면 농협은행의 DB형과 IRP 수익률은 각각 14.89%, 21.1%였고, 종합(가중평균) 수익률은 19.3%로 상위 10개사 중 가장 높았다. 농협은행은 5대 은행 기준 6분기 연속 종합수익률 1위를 유지하고 있으며, 퇴직연금 ETF 상품 88종을 신규 출시했다. 연금저축과 IRP를 합산하면 최대 900만원까지 납입액의 13.2∼16.5% 세액공제를 받을 수 있다.", "category": "업계·경쟁사", "importance": 3, "source": "농민신문", "published": "2026-11-25", "url": "https://www.nongmin.com/article/20261123500583", "related": []}, {"id": "f80c8db9c57d", "title": "\"연금 개시할 때 상품 싹 팔아야 했던 불편 없앴다\"… 한화생명, 굴리면서 타 먹는 'IRP 분할연금' 출시", "summary": "한화생명이 만 55세 이상 IRP 가입 고객이 기존 상품 운용을 이어가면서 연금을 받을 수 있는 분할연금 ‘라이프핏 연금’을 출시했다. 수령 방식은 금액확정형과 기간확정형 중 선택할 수 있고, 연간 수령액은 분할연금 전환 금액의 5분의 1 이내로 최소 5년에 걸쳐 수령한다. 분할연금 이용 중 종신연금으로 전환할 수도 있다. 한화생명은 이달 2일부터 개인형 IRP 실적배당형 상품의 운용관리·자산관리 수수료도 면제했다.", "category": "업계·경쟁사", "importance": 3, "source": "한국목재신문", "published": "2026-11-25", "url": "https://www.woodkorea.co.kr/news/articleView.html?idxno=92792", "related": []}, {"id": "e1f56ebac4a8", "title": "삼성의료재단, 삼성증권과 385억 규모 DC 퇴직연금 거래", "summary": "의료법인 삼성의료재단은 계열회사인 삼성증권과 385억원 규모의 확정기여형(DC) 퇴직연금 보험거래를 진행한다고 25일 공시했다. 거래 목적은 임직원 퇴직급여의 자율적 운용과 수익성 제고다. 385억원은 2027년 회계연도 중 불입할 것으로 예상되는 금액으로, 기존 확정급여형(DB)에서 삼성증권 DC로 전환될 예상 금액과 기존 DC 가입 임직원의 부담금 불입 예정액이 포함됐다. 이사회 의결일은 23일이다.", "category": "법인·자금운용", "importance": 3, "source": "한스경제", "published": "2026-11-25", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=886953", "related": []}, {"id": "1508f37d1a4c", "title": "같은 IRP인데… 가입방식 따라 10년 수수료 820만원 차이난다", "summary": "금융감독원이 '퇴직연금 가이드북'을 발간해 IRP 수수료 절감, 적립금 운용, 퇴직금 수령 방식에 따른 절세 사례를 소개했다. 2억6000만 원을 넣은 IRP 가입자가 대면으로 가입하면 10년간 수수료 820만 원을 냈지만 비대면 가입자는 수수료를 내지 않았다. 매년 1000만 원씩 20년간 납입한 두 사람의 최종 수령액은 운용 방식에 따라 4억2948만 원과 2억7220만 원으로 갈렸다. 퇴직금 5억 원을 일시금으로 받으면 실수령액이 4억5500만 원이지만 연금으로 받으면 수령액 합계가 6억4142만 원이 된다.", "category": "가입자·사회", "importance": 3, "source": "동아일보", "published": "2026-11-24", "url": "https://www.donga.com/news/Economy/article/all/20261123/135075673/2", "related": []}, {"id": "483ad73d84f6", "title": "규제가 바꾼 TDF…국내 자산·AI 테마로 투자전략 다변화", "summary": "금융당국은 지난 4월 퇴직연금감독규정 시행세칙을 개정해 적격 TDF가 현금성 자산과 채무증권을 목표시점 이전 20% 이상, 이후 60% 이상 보유하도록 하고 특정 국가 주식·채권 투자를 각각 80% 이내로 제한했다. 지난해 말 TDF 순자산은 25조6000억원으로 95.3%가 연금 자금이었고, 미국 투자 비중은 평균 43.0%, 한국은 4.4%였다. 이후 KB자산운용 'KB 코리아포커스 적격TDF', 삼성자산운용 'KODEX 코리아TDF2065액티브 적격' 등 국내 자산 중심 상품이 나왔다. 한국투자 투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "058f4d4a721b", "title": "사별하면 유족연금 70% 깎이는데…연금공단은 지급률 상향엔 ‘신중’ 왜?", "summary": "국민연금공단은 본인 연금을 고를 때 얹어 주는 유족연금 비율을 30%에서 50%로 높이는 방안에 대해 심도 있는 검토와 사회적 합의가 먼저라는 입장을 국회에 냈다. 본인 연금과 유족연금 수급권이 겹친 사람은 2021년 12만3994명에서 지난해 20만8242명으로 67.9% 늘었다. 지난해 이들 중 82%는 본인 연금을, 18%는 유족연금을 택했다. 공단은 지급률 상향 시 재정 영향 분석 자료가 없으며 내년 국민연금연구원을 통해 재정추계 연구를 할 계획이다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-26", "url": "https://www.segye.com/newsView/20261125516561", "related": [{"title": "부부가 함께 부은 연금, 사별하면 유족연금 70% 깎인다", "source": "세계일보", "url": "https://www.segye.com/newsView/20261123510564"}, {"title": "내 연금·유족연금 겹친 20.8만명…3.7만명은 내 연금 '0원'", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20261122031500530"}, {"title": "“부부가 평생 꼬박꼬박 냈는데 0원”…배우자 떠나자 연금 ‘뚝’, 중복지급 상향은", "source": "매일경제", "url": "https://www.mk.co.kr/article/12217731"}]}, {"id": "b7e8a161b6af", "title": "2028년부터 퇴직급여 사외적립 의무화… 체불 막는다", "summary": "근로자의 퇴직금 체불을 막기 위해 내후년부터 100인 이상 사업장을 대상으로 퇴직급여 사외 적립을 단계적으로 의무화하는 방안이 추진된다. 이형일 부총리 겸 재정경제부 장관과 배경훈 부총리 겸 과학기술정보통신부 장관은 28일 경제관계장관회의·과학기술관계장관회의 첫 연석회의에서 이 방안을 논의했으며, 기금형 퇴직연금의 구체적 도입 방안도 마련해 전문적인 자산 운용과 엄격한 수탁자 책임을 부과하기로 했다. 퇴직연금 사업자 평가 기준은 연금 성과 수익률 중심으로 개편하고, 디폴트옵션 적용 예정 통보 시점은 만기 후 4주에서 만기 전 2주로 앞당긴다. 구체적인 퇴직연금 기능 강화 방안은 29일 국회 기후에너지환경노동위원회 여당 위원과의 당정협의를 거쳐 발표된다.", "category": "제도·규제", "importance": 5, "source": "서울신문", "published": "2026-10-29", "url": "https://www.seoul.co.kr/news/economy/2026/10/29/20261029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "540조 퇴직연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936461/2"}, {"title": "퇴직연금, 전문가가 대신 굴린다…'기금형' 도입, 국민연금 참여는 미정", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6335473"}, {"title": "정부, 퇴직연금 기금 없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "df6d8c8ff511", "title": "증시 급락에 퇴직연금 수익률 급감…적립금 11조7천억원 감소", "summary": "올해 3분기 말 퇴직연금 적립금은 542조1214억원으로 6월 말 553조8779억원보다 11조7565억원(2.1%) 줄었으며, 분기 적립금 감소는 2020년 1분기 이후 처음이다. 유형별 감소액은 IRP 5조129억원, DC형 3조8374억원, DB형 2조9062억원으로 IRP와 DC형이 전체 감소액의 약 75%를 차지했다. 증권사 11곳의 DC형 원금비보장상품 연간 누적 수익률은 2분기 말 52.85%에서 14.46%로, IRP는 46.97%에서 14.19%로 떨어졌다. DB형 수익률은 11.35%에서 3.86%로 낮아졌다.", "category": "운용·상품", "importance": 4, "source": "광주매일신문", "published": "2026-11-16", "url": "http://www.kjdaily.com/article.php?aid=1794759721692238276", "related": [{"title": "[퇴직연금 긴급점검] 6년 반 만에 적립금 감소…9월말 기준 3개월만에 11.7조 줄어", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202611181327078600627"}]}, {"id": "545a1b2bec51", "title": "기금형 연금 도입에…금융지주 계열사 합종연횡 채비", "summary": "기금형 퇴직연금 추진이 공식화되면서 주요 금융지주들이 은행을 중심으로 계열사를 동원한 수탁법인 컨소시엄 설립 준비에 돌입했다. 고용노동부는 오는 6일 주요 은행장들을 소집해 기금형 퇴직연금 간담회를 열며, 법 개정 과정에서 금융지주 자회사 공동출자를 허용하는 예외를 마련할 계획이다. NH농협금융은 퇴직연금 제도 개편 대응 TF를, KB금융과 우리금융은 계열사 워킹그룹을 운영하고 있으며 신한금융도 정식 TF를 발족할 예정이다. 5대 금융지주 DC·IRP 적립액은 174조1435억원으로 작년말 대비 15.5% 늘었고, 증권 계열사 비중은 11.2%에서 13.2%로 상승했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-11-03", "url": "https://www.mt.co.kr/finance/2026/11/03/2026110216011686926", "related": [{"title": "기금형 퇴직연금 도입 초읽기… 원팀 꾸리는 금융지주 계열사", "source": "머니투데이", "url": "https://www.mt.co.kr/finance/2026/11/04/2026110319393765961"}]}, {"id": "113078a9f394", "title": "퇴직연금 ‘100% 투자 가능’의 함정…원금까지 보장하진 않아", "summary": "금융감독원은 내년 1월부터 퇴직연금 매매화면과 상품검색 화면에 투자한도와 위험등급을 함께 표시하도록 개선한다고 27일 밝혔으며, 상품제안서와 적립금운용현황보고서에도 위험등급을 병기한다. 일부 사업자가 원금손실 가능성이 있는 상품도 '투자한도 100%'로만 안내해 가입자가 원리금보장형으로 오인할 수 있다는 판단에서다. 올해 상반기 말 퇴직연금 적립금 558조3000억원 가운데 실적배당형은 198조원이고, 이 중 ETF 투자 규모는 99조8000억원으로 50.4%를 차지했다. 일부 사업자는 전산개발 일정에 따라 내년 상반기 중 시행한다.", "category": "제도·규제", "importance": 4, "source": "메트로신문", "published": "2026-10-27", "url": "https://www.metroseoul.co.kr/article/20261027500104", "related": [{"title": "“퇴직연금 다 날릴 수도”…ETF 투자한도 100%의 함정 [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8699397&ref=A"}]}, {"id": "133e90c36463", "title": "“원리금 보장만” “위험자산 반 이상”…퇴직연금 가입자 돈 굴리기 양극화", "summary": "금융감독원에 따르면 퇴직연금 적립금은 2023년 말 382조원에서 올해 6월 말 558조원으로 늘었다. 가입자의 64.5%는 적립금 전액을 원리금 보장형에 두고 있고, 33.9%는 절반 이상을 위험자산에 투자했으며, 분산 투자로 균형을 맞춘 경우는 1.6%에 그쳤다. 실적배당형 비중은 2023년 12.8%에서 올해 6월 말 35.5%로 약 2.8배 늘었고 그중 50.4%가 ETF에 투자됐다. 금감원은 11월 3일 장기·분산 투자를 돕는 '퇴직연금 가이드북'을 발간했으며, 디폴트옵션도 대부분 원리금 보장형에 머물러 있다고 밝혔다.", "category": "운용·상품", "importance": 3, "source": "서울신문", "published": "2026-11-17", "url": "https://www.seoul.co.kr/news/economy/finance/2026/11/17/20261117031002", "related": [{"title": "같은 퇴직금, 20년 뒤엔 1억6천 차이…50대 여유 있다면 ‘보증형 보험’이 대안", "source": "경향신문", "url": "https://www.khan.co.kr/article/202611170600051"}, {"title": "김 과장·박 과장, 연금 똑같이 1000만 원씩 냈는데...20년 뒤 계좌 잔고 '충격'", "source": "파이낸셜뉴스", "url": "https://www.fnnews.com/news/202611161529480756"}, {"title": "퇴직연금 적립금 558조 넘겨…DC 전환 1년만 118% 증가", "source": "SBS Biz", "url": "https://biz.sbs.co.kr/article_hub/20000346629"}]}, {"id": "ba2a9bfbd61a", "title": "국민연금 68세로 늦춘다?…장관까지 나서 해명", "summary": "9월 말 국회 국민연금 구조개혁 토론회에서 한 교수가 수급 개시 연령을 2046년까지 68세로 올리는 방안을 제시한 뒤 SNS에서 연금 수급이 68세로 늦춰진다는 콘텐츠가 확산됐다. 정은경 복지부 장관은 SNS에서 사실이 아니며 수급개시연령 조정을 검토하고 있지 않다고 밝혔다. 현재 수급 개시 연령은 63세로 2028년 64세, 2033년 65세로 오르도록 돼 있다. 국회 연금개혁특위는 구조개혁 합의안을 내지 못한 채 올해 말 활동 종료를 앞두고 있다.", "category": "가입자·사회", "importance": 3, "source": "SBS", "published": "2026-11-26", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008863894", "related": [{"title": "'국민연금 수급개시연령 68세로 상향' 관련 정은경 보건복지부 장관 직접 해명", "source": "매일신문", "url": "https://www.imaeil.com/page/view/2026112416560744576"}]}, {"id": "b479ce15b6d3", "title": "반도체 폭락에도 퇴직연금은 '사자'···은행권, 223조원 사수 총력전", "summary": "3분기 말 5대 은행의 퇴직연금 적립금은 222조9427억원으로 2019년 집계 이후 처음 감소했고, 2024년 10월 실물이전 시행 이후 올해 6월 말까지 은행에서 증권사로 옮겨간 적립금은 5조2000억원이었다. 은행들은 자금 이탈을 막기 위해 ETF 매도 대금으로 같은 날 재투자할 수 있는 당일매매 서비스를 잇달아 도입하고 있다. 국민은행이 8월 20일 시중은행 최초로 도입했고 신한은행이 9월, 우리·하나은행이 이달 합류했으며 농협은행은 다음 달, IBK기업은행은 내년 1분기 시작할 예정이다. 국민은행은 시행 후 한 달간 증권사로 이동한 적립금이 지난해 12월 한 달보다 약 50% 줄었다고 밝혔으나, 은행은 여전히 실시간 거래가 안 되고 취급 상품도 약 300개로 증권사(약 900개)보다 적다.", "category": "업계·경쟁사", "importance": 3, "source": "스마트비즈", "published": "2026-11-23", "url": "https://www.smartbizn.com/news/articleView.html?idxno=160195", "related": [{"title": "은행 퇴직연금, '증권사 속도'로 바뀐다…ETF 당일매매 전산 개편 확산", "source": "전자신문", "url": "https://www.etnews.com/20261120000226"}]}, {"id": "b1c24b848e68", "title": "줄어든 거래대금에 증권가는 ‘MTS’ 전쟁…AI·배당·연금으로 고객 자산 잡는다", "summary": "증시 조정으로 거래가 위축되자 증권사들이 MTS에 AI 투자정보, 배당 정보, 퇴직연금 ETF 적립식 매수 기능 등을 더하고 있다. 하나증권은 이달부터 DC·IRP 계좌에서 ETF·ETN·리츠를 정기 매수하는 서비스를 개시하며, 3분기 기준 DC·IRP 시장점유율 1위를 달성했다. 3분기 국내 주식시장 일평균 거래대금은 52조4000억원으로 전 분기 대비 41.7% 감소해 증권사 위탁수수료 수익이 크게 줄었다.", "category": "업계·경쟁사", "importance": 3, "source": "조선비즈", "published": "2026-11-09", "url": "https://biz.chosun.com/stock/stock_general/2026/11/09/FUNYZOZV2JH4FLZ7BJYY4STMYI/", "related": [{"title": "줄어든 증시 거래대금에 증권가는 ‘MTS 전쟁’", "source": "조선일보", "url": "https://www.chosun.com/economy/stock-finance/2026/11/10/IKPQK3UVDJG2HEUOQJK5EO4OFM/"}]}, {"id": "ea0a4daeeaf0", "title": "소득 여유 있는 가구가 연금도 먼저 받는다…취약가구와 수급 격차", "summary": "한국보건사회연구원 보고서에 따르면 정년 이후 공적연금 수급 전까지의 소득공백기에 경제적 여력이 있는 가구일수록 연금 수급률이 높았다. 정년 전 중위소득 100% 이상을 유지하거나 늘린 가구의 공적연금 조기 수급률은 26.5%, 소득이 절반 미만으로 줄어든 취약가구는 18.1%였다. 월평균 공적연금 수급액은 소득 유지 가구가 191만8000원, 취약가구가 52만7000원으로 3.6배 이상 차이가 났다. 보고서는 필요한 금액만큼 연금을 나눠 받는 '부분연금제' 도입과 건강보험료·기초연금 등과의 연계 구조 정비를 제언했다." ·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민 ": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

    { key: 'monthly', name: '월간', span: '1개월' },

  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로
     그보다 넉넉히 잡아야 매일 아침 헛경보가 뜨지 않는다. */
  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
         + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

  function buildStaleNotice() {
    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
