<html lang="ko">
<head>

<title>퇴직연금 주요 이슈</title>
<style>
  /* ── 팔레트 ───────────────────────────────────────────────
     잉크 네이비 위에 차가운 석재 종이. 강조색은 적립·성장을 뜻하는
     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나.

     키움 두 색은 kiwoomam.com 로고의 구조를 그대로 옮긴 것이다.
     글자는 감청, 포인트 마크만 마젠타. 그래서 맨 위 줄은 감청이고
     마젠타는 슬로건 한 줄에만 쓴다. 둘을 같은 넓이로 쓰면 서로 죽는다. */
  :root {
    --ink: #101C33;
    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom-deep: #1A399E;
    --kiwoom-point: #EC008C;

    --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',
               'Malgun Gothic', system-ui, sans-serif;
    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #DCE2EC;
      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 감청 원색은 어두운 종이에서 1.9:1까지 떨어져 줄이 보이지 않는다.
         마젠타도 한 단계 올려 짝을 맞춘다. 각각 6.2:1, 6.6:1. */
      --kiwoom-deep: #6E92F5;
      --kiwoom-point: #FF5FB4;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야
     구분선이 아니라 종이의 테두리로 읽힌다. */
  .topline { height: 4px; background: var(--kiwoom-deep); }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;
  }

  .slogan {
    margin: 0 0 0 auto;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom-point);
    white-space: nowrap;
  }

  .hero-date {
    font-family: var(--font-num);
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .search input {
    width: 230px;
    max-width: 44vw;
    padding: 4px 0;
    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */
  .group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;
  }

  .rail button {
    flex: 1 1 0;
    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .range {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  /* ── 분야 필터 ─────────────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
  }

  .filters button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */
  .notice {
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */
  .list { margin: 8px 0 0; }

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);
  }

  article[data-cat="2"] .badge { color: var(--cat-2); }
  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

  details summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<div class="topline"></div>

 "기초연금 '소득 하위 70%' 기준 바꾼다…중위소득 연계 재추진", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6308073"}]}, {"id": "c4dab2068ab2", "title": "복지부 국감 개막⋯기초연금 '반쪽 개편'·국민연금 손실 추궁 [국감]", "summary": "국회 보건복지위원회가 7일 보건복지부와 질병관리청을 시작으로 이틀간 국정감사에 들어갔다. 핵심 쟁점은 연금제도 개편안으로, 복지부가 추진해 온 저소득층 노인 중심 '하후상박' 기초연금 개편이 사회적 논의 부족을 이유로 1년짜리 단기 계획에 그친 점이 '반쪽 개편'이라는 지적을 받을 전망이다. 국민연금은 기금 재정 안정성과 함께 자산배분 리밸런싱 한시 유예, 국내 주식 목표 비중 상향(14.9%→20.8%)에 따른 증시 급락 손실 문제가 검증대에 오른다. 복지위 국감은 14일 국민연금공단, 16일 국민건강보험공단·건강보험심사평가원을 거쳐 27일 종합감사로 마무리된다.", "category": "제도·규제", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2633071", "related": [{"title": "기초연금 '반쪽' 개편·국립대병원 첫 등판…복지부 국감 쟁점은", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261003_0003813472"}]}, {"id": "83b8b035dfc8", "title": "7월 폭락장, 국민연금도 못 피했다…국민 노후자금 10% 증발에 '부글부글'", "summary": "국민연금 적립금이 6월 1866조원에서 7월 1684조원으로 한 달 만에 9.7% 줄어 181조4030억원의 손실이 났다. 국내주식 평가액은 543조2040억원에서 418조5580억원으로 22.9% 감소했고, 국내주식 누적 수익률은 107.37%에서 60.11%로 축소됐다. 같은 기간 코스피 지수가 8470선에서 6590선으로 22.2% 급락한 영향이다. 연초 이후 국민연금 수익률도 6월 27.22%에서 7월 14.84%로 내려앉았다.", "category": "운용·상품", "importance": 3, "source": "뉴시스", "published": "2026-10-04", "url": "https://www.newsis.com/view/NISX20261002_0003813049", "related": [{"title": "역대급 폭락에 국민연금도 울상...'롤러코스피' 리스크", "source": "YTN", "url": "https://www.ytn.co.kr/_ln/0103_202610040524028320"}]}, {"id": "65997f6263af", "title": "연금통장에 금리·현금 얹는다⋯은행권 '은퇴고객' 쟁탈전", "summary": "은행권이 연금 수령 고객을 끌어오기 위해 금리와 현금 혜택을 내걸고 있다. KB국민은행은 기본금리 연 0.1%에 최고 연 3.1%를 주는 'KB골든라이프연금통장'을 내놓고 'KB골든라이프연금예금'을 5000억원 한도로 재판매하며, 12개월 기준 연 3.50~3.70% 금리를 적용한다. 하나은행은 모바일 앱에 '공적연금 라운지' 전용 멤버십 서비스를 열고 신규 고객에게 최대 5만원 캐시백과 보험 무료 가입을 제공한다. Sh수협은행은 12월 31일까지 '4대 연금 환승' 이벤트로 최대 5만원 캐시백을 주고, 'Sh골든데이 연금통장'에 최고 연 3.2% 금리를 적용한다.", "category": "업계·경쟁사", "importance": 3, "source": "아이뉴스24", "published": "2026-10-04", "url": "http://www.inews24.com/view/2011611", "related": [{"title": "“최고 연 3.7%에 현금 5만원”⋯시중은행, 공적연금 유치전 후끈", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=148274"}]}, {"id": "982494ef6f73", "title": "퇴직연금 165조 잡은 증권사…다음 승부처는 '고객관리'", "summary": "금융감독원 통합연금포털에 따르면 올해 2분기 전체 퇴직연금 적립금은 553조8779억원이며 증권업권은 약 165조원으로 29.8%를 차지했다. 증권업권 적립금은 1년 새 52조4347억원(46.6%) 늘었고 같은 기간 DC는 81.0%, 개인IRP는 71.8% 증가했다. 신한투자증권은 연금고객관리팀을 신설했고, 한국투자증권은 지난 6일 연금 MTS를 개편했으며, KB증권은 'My연금'을 전면 개편했다. NH투자증권은 지난달 28일 퇴직연금 법인고객 통합관리시스템(CIS)을 구축했다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스웨이", "published": "2026-10-08", "url": "https://www.newsway.co.kr/news/view?ud=2026100713530728574", "related": []}, {"id": "07a9e437bd0c", "title": "내년 1분기 기초연금 물가인상분 소급 지급…李대통령 “양극화 완화에 필요”", "summary": "정부가 내년 1분기 기초연금에 반영하지 않기로 했던 물가인상분을 소득 하위 45% 노인에게 4월 개편 시 소급 지급하기로 했다. 당초 예산안은 내년 1~3월 기준연금액을 올해와 같은 월 34만 9700원으로 묶어, 하위 45% 516만 8000명이 석 달간 2만 7270원을 덜 받는 구조였다. 이재명 대통령도 정은경 복지부 장관의 게시물을 공유하며 저소득층 추가 지원은 양극화 완화를 위해 필요한 조치라고 밝혔다. 내년 4월부터 하위 30%는 월 최대 38만 원, 30~45%는 월 35만 8790원을 받고 45~70%는 월 34만 9700원으로 동결된다.", "category": "가입자·사회", "importance": 3, "source": "서울경제", "published": "2026-10-08", "url": "https://www.sedaily.com/article/20099327", "related": []}, {"id": "dffb22a243d1", "title": "국민연금 크레딧 '사전 지원'하면 수십조 아낀다? \"재정 안정·미래 세대 부담 줄이는 방안 모색해야\"", "summary": "국민연금 크레딧은 출산·군 복무 시점이 아니라 노령연금 수령 시점에 가입 기간을 합산하는 사후 지원 방식이라 시간이 갈수록 지출이 불어난다. 국민연금연구원은 사유 발생 시점에 보험료를 대납하는 사전 지원으로 바꾸면 2093년까지 약 87조8000억원의 크레딧 지출을 줄일 수 있다고 분석한 바 있다. 지난 6월 기준 출산 크레딧 누적 수급자 1만2052명 중 여성은 385명(3.2%)에 그쳤다. 보건복지부는 사전 지원 전환을 검토 중이나 기획예산처는 단기 지출 급증을 이유로 신중한 입장이다.", "category": "가입자·사회", "importance": 3, "source": "아시아경제", "published": "2026-10-08", "url": "https://view.asiae.co.kr/article/2026100809461398787", "related": []}, {"id": "7af9d30a6229", "title": "퇴직연금 1000억 돌파한 키움증권…표영대 본부장 \"AI PB로 차별화\"[SS인터뷰]", "summary": "지난 6월 퇴직연금 사업을 시작한 키움증권은 첫 달 IRP 적립금 649억 원을 확보한 뒤 7월 24일 전체 적립금 1000억 원을 넘어섰다. 표영대 연금플랫폼본부장은 개인 IRP를 시작으로 기업형 DC·DB까지 영역을 넓혀 2035년 퇴직연금 시장점유율 10%, 적립금 기준 업계 톱5 진입을 목표로 제시했다. 키움증권은 MTS '영웅문S#'에서 ETF 실시간 거래와 적립식 투자, 자동감시주문을 제공하고 원리금보장상품과 실적배당상품의 96% 이상을 상품군으로 갖춰 실물이전 수요를 노린다. 오프라인 지점이 없는 한계는 로보어드바이저 도입과 가칭 'AI PB' 개발로 보완할 계획이다.", "category": "업계·경쟁사", "importance": 3, "source": "스포츠서울", "published": "2026-10-07", "url": "https://www.sportsseoul.com/news/read/1639392", "related": []}, {"id": "f732754d6138", "title": "테마 쪼개고 채권 섞고…ETF 신상품 설계 다변화 [ETF 지형도 변화]②", "summary": "한국거래소 신규 상장 ETF를 집계한 결과 올해 상반기 상장 99개 중 주식·채권 혼합형은 11개(11.1%)였으나, 3분기(9월 22일까지)에는 41개 중 11개로 비중이 26.8%까지 높아졌다. 주식 편입 비중이 50% 미만인 채권혼합형은 적립금의 100%까지 투자할 수 있는 '투자위험을 낮춘 상품'에 속해 퇴직연금 계좌에서 쓰임새가 크다. 금융위원회는 2023년 11월 퇴직연금감독규정을 개정해 이들 상품의 주식 편입 한도를 40% 이내에서 50% 미만으로 높였고, DC형·IRP 투자자는 위험자산 한도 70%를 주식형 ETF로 채운 뒤 나머지 30%를 채권혼합형에 배분할 수 있다. 한수진 삼성증권 선임연구원은 퇴직연금계좌를 통한 ETF 투자금액이 3년 연속 100%대 증가율을 보이고 있다고 분석했다.", "category": "운용·상품", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2632913", "related": []}, {"id": "00377454cb04", "title": "1억 넣으면 매달 167만원?…'월배당 ETF' 숫자의 함정", "summary": "국민연금연구원 제10차 국민노후보장패널조사에서 부부 기준 최소 노후 생활비는 월 217만원, 적정 노후 생활비는 월 297만원으로 조사됐다. 국민연금 수급자의 평균 수령액은 월 60만원 수준으로 부부가 함께 받아도 합산 120만~140만원에 그친다. 코스콤 ETF체크 기준 TIGER 배당커버드콜액티브의 연간 분배율은 20.88%, PLUS 고배당주위클리커버드콜은 24.13%로 시중은행 예금 금리의 4~7배 수준이다. 다만 기초지수가 20% 하락하면 분배율을 유지하더라도 주당 분배금이 줄어 원금과 분배금이 동시에 감소하는 위험이 있다.", "category": "운용·상품", "importance": 3, "source": "이코노미스트", "published": "2026-10-05", "url": "https://economist.co.kr/article/view/ecn202609290049", "related": []}, {"id": "99b7786d66ca", "title": "채권 믿다 발등 찍힌 글로벌 연기금, 금고에 금 5% 채워 방어선 쳤다", "summary": "세계금위원회가 2026년 10월 발표한 보고서에서 네덜란드·미국·영국·호주 연기금이 2020년부터 금 편입을 시작해 5년 이상 비중을 유지하고 있다고 밝혔다. 네덜란드 연기금 펜시온펀즈 피디엔은 운용자산 77억 유로 가운데 5%를 금에 배분했고, 미국 버지니아주 페어팩스 카운티 퇴직연금은 62억 달러 규모 자산의 약 3%를 금 선물로 채웠다. 영국 나우 펜션스 마스터 트러스트는 106억 달러 중 약 2%, 호주 엔지에스 슈퍼는 약 3%를 금에 배분했다. 국민연금은 기금 적립금의 80% 안팎을 국내외 주식과 채권에 집중 배치해 두고 있어 대체 자산 완충재가 부족하다는 지적이 제기된다.", "category": "법인·자금운용", "importance": 3, "source": "글로벌이코노믹", "published": "2026-10-05", "url": "https://www.g-enews.com/view.php?ud=202610041819317672fbbec65dfb_1", "related": []}, {"id": "cdc582858a12", "title": "당신도 노인 된다…韓고령자, OECD 상대빈곤율 '최고'", "summary": "국가데이터처가 1일 발표한 '2026 고령자 통계'에서 66세 이상 은퇴 연령층의 상대적 빈곤율은 2024년 기준 37.7%로 2.1%포인트 하락했지만, 2023년 기준 39.8%로 OECD 회원국 가운데 여전히 가장 높았다. 가구주가 65세 이상인 고령자 가구의 지난해 순자산액은 4억9279만원으로 2685만원 늘었다. 본인이나 배우자가 직접 생활비를 마련하는 고령자는 74.7%로 지난 10년간 16.2%포인트 늘었고, 자녀·친척 지원은 13.1%로 15.5%포인트 줄었다. 노후를 준비하는 고령자는 64.4%였고 준비 방법은 국민연금 53.2%, 예·적금 20.1%, 직역연금 10.2% 순이었다.", "category": "가입자·사회", "importance": 3, "source": "SBS Biz", "published": "2026-10-05", "url": "https://biz.sbs.co.kr/article_hub/20000338144?division=NAVER", "related": []}, {"id": "a7033061751d", "title": "디폴트옵션, 투자형 상품이 '기본' 원리금 보장은 '선택' 돼야", "summary": "삼성증권 안윤철 연금본부장은 이데일리 '퇴직연금 리더를 만나다' 인터뷰에서 원리금보장 상품에 쏠린 현행 디폴트옵션이 제도 도입 취지를 훼손했다고 평가했다. 그는 투자형 상품을 기본 디폴트로 두고 가입자의 선택으로 원리금보장 상품을 편입하게 하는 방식이 맞다고 제안했다. 손실 회피 성향의 가입자가 있을 수 있으므로 원리금보장은 선택지로 남겨두되 기본값은 바꿔야 한다는 취지다. 상품 정보 제공과 가입 절차 간소화, 글로벌 분산투자와 정기 적립식 투자, 연금 수령 단계의 세제 혜택 강화와 인센티브 확대도 함께 제시했다.", "category": "업계·경쟁사", "importance": 3, "source": "이데일리", "published": "2026-10-05", "url": "https://www.edaily.co.kr/News/Read?newsId=02017206645609968&mediaCodeNo=257", "related": []}]}, "monthly": {"period": "monthly", "key": "current", "label": "2026-09-09 ~ 2026-10-08", "generated_at": "2026-10-09T08:32:19+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": [{"title": "퇴직연금 문 열린 개인용 국채…첫 선택은 10년물에 쏠렸다", "source": "연합인포맥스", "url": "https://ne tle": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}, {"title": "기초연금 '소득 하위 70%' 기준 바꾼다…중위소득 연계 재추진", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6308073"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "1fc91cd9d139", "title": "리스크 관리·노후수입 한번에…주목받는 보증형 실적 배당보험", "summary": "미래에셋생명의 개인형 퇴직연금(IRP) 보증형 실적배당보험이 출시 후 717억원을 모집했다고 전했다. 이 상품은 IRP를 통해서만 가입할 수 있는 거치형으로, 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 연금 개시가 가능하다. 이미 만 55세를 넘긴 가입자는 가입과 동시에 연금을 받을 수 있고, 적립금이 소진될 때까지 20년 이상 연금을 수령할 수 있다. 적립금은 미래에셋생명의 일임형 자산배분펀드 MVP펀드를 통해 글로벌 자산에 분산투자된다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645584384&mediaCodeNo=257", "related": [{"title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024"}, {"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "f14fcbcde9b5", "title": "550조 퇴직연금 판 흔든다…국민연금 참여 '기금형 퇴직연금' 법안 발의", "summary": "더불어민주당 이용우 의원이 공동발의 12인과 함께 10월 2일 근로자퇴직급여 보장법 일부개정법률안을 발의했다. 개정안은 국민연금공단 등 공적연금관리기관이 기금형 퇴직연금 사업에 참여할 수 있도록 하고, 시장점유율 상한을 3년차 10%, 4년차 20%, 5년차 30%로 두었다. 2025년 말 퇴직연금 적립금은 501조4000억원이고 2024년 수익률은 4.77%로 같은 해 국민연금 수익률 15.0%를 밑돌았으며, 수수료는 2018년 8956억원에서 2025년 1조7748억원으로 98% 늘었다. 중소기업퇴직연금기금 가입 대상은 현재 100명 미만에서 2028년까지 300명 이하로 확대되고, 법안은 공포 후 1년이 지나 본격 시행된다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-10-07", "url": "http://www.globalepic.co.kr/view.php?ud=2026100708100769037cc35ccc5c_29", "related": [{"title": "'기금형 퇴직연금' 정기국회 논의 본격화 할 듯", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237123"}, {"title": "\"저조한 수익률, 높은 수수료\" 구조인 현행 계약형 퇴직연금 보완하는 기금형 퇴직연금 병행도입 필요", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=493587"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {" 1080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "1fc91cd9d139", "title": "리스크 관리·노후수입 한번에…주목받는 보증형 실적 배당보험", "summary": "미래에셋생명의 개인형 퇴직연금(IRP) 보증형 실적배당보험이 출시 후 717억원을 모집했다고 전했다. 이 상품은 IRP를 통해서만 가입할 수 있는 거치형으로, 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 연금 개시가 가능하다. 이미 만 55세를 넘긴 가입자는 가입과 동시에 연금을 받을 수 있고, 적립금이 소진될 때까지 20년 이상 연금을 수령할 수 있다. 적립금은 미래에셋생명의 일임형 자산배분펀드 MVP펀드를 통해 글로벌 자산에 분산투자된다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645584384&mediaCodeNo=257", "related": [{"title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024"}, {"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "f14fcbcde9b5", "title": "550조 퇴직연금 판 흔든다…국민연금 참여 '기금형 퇴직연금' 법안 발의", "summary": "더불어민주당 이용우 의원이 공동발의 12인과 함께 10월 2일 근로자퇴직급여 보장법 일부개정법률안을 발의했다. 개정안은 국민연금공단 등 공적연금관리기관이 기금형 퇴직연금 사업에 참여할 수 있도록 하고, 시장점유율 상한을 3년차 10%, 4년차 20%, 5년차 30%로 두었다. 2025년 말 퇴직연금 적립금은 501조4000억원이고 2024년 수익률은 4.77%로 같은 해 국민연금 수익률 15.0%를 밑돌았으며, 수수료는 2018년 8956억원에서 2025년 1조7748억원으로 98% 늘었다. 중소기업퇴직연금기금 가입 대상은 현재 100명 미만에서 2028년까지 300명 이하로 확대되고, 법안은 공포 후 1년이 지나 본격 시행된다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-10-07", "url": "http://www.globalepic.co.kr/view.php?ud=2026100708100769037cc35ccc5c_29", "related": [{"title": "'기금형 퇴직연금' 정기국회 논의 본격화 할 듯", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237123"}, {"title": "\"저조한 수익률, 높은 수수료\" 구조인 현행 계약형 퇴직연금 보완하는 기금형 퇴직연금 병행도입 필요", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=493587"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "7ef94cfb1aa4", "title": "[경제 트렌드] 증권사, 퇴직연금 규모 급증...한국투자증권, 연금 적립·운용·수령까지 은퇴 준비 전 과정 밀착 지원", "summary": "퇴직연금 적립금은 지난 8월 기준 550조원을 웃돌았고 실적배당형 비중은 35%를 기록했으며, 증권사 퇴직연금 규모는 2025년 말 141조6797억원으로 전 금융권 적립금의 29.3%를 차지했다. 증권사 적립금 순위는 미래에셋증권, 삼성증권, 한국투자증권, 현대차증권, NH투자증권 순이다. 한국투자증권은 연금 MTS를 개편해 '나의 총 연금자산'과 개인화 맞춤 알림 기능을 도입했고, 신규 DC 가입자 평균 연령이 2015년 40세에서 2025년 36세로 낮아졌다고 밝혔다. 신한투자증권은 올해 연금고객관리팀을 신설해 신규 DC·IRP 가입 고객 대상 웰컴콜과 연금PB 1대1 매칭, 'Premier 연금컨설팅'을 운영하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "시사캐스트", "published": "2026-10-08", "url": "http://www.sisacast.kr/news/articleView.html?idxno=100731", "related": [{"title": "한국투자증권, 연금 MTS 개편…“적립·운용·수령까지 밀착 지원”", "source": "더퍼블릭", "url": "https://www.thepublic.kr/news/articleView.html?idxno=321335"}, {"title": "한국투자증권, 연금 MTS 개편 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31774"}]}, {"id": "c4dab2068ab2", "title": "복지부 국감 개막⋯기초연금 '반쪽 개편'·국민연금 손실 추궁 [국감]", "summary": "국회 보건복지위원회가 7일 보건복지부와 질병관리청을 시작으로 이틀간 국정감사에 들어갔다. 핵심 쟁점은 연금제도 개편안으로, 복지부가 추진해 온 저소득층 노인 중심 '하후상박' 기초연금 개편이 사회적 논의 부족을 이유로 1년짜리 단기 계획에 그친 점이 '반쪽 개편'이라는 지적을 받을 전망이다. 국민연금은 기금 재정 안정성과 함께 자산배분 리밸런싱 한시 유예, 국내 주식 목표 비중 상향(14.9%→20.8%)에 따른 증시 급락 손실 문제가 검증대에 오른다. 복지위 국감은 14일 국민연금공단, 16일 국민건강보험공단·건강보험심사평가원을 거쳐 27일 종합감사로 마무리된다.", "category": "제도·규제", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2633071", "related": [{"title": "기초연금 '반쪽' 개편·국립대병원 첫 등판…복지부 국감 쟁점은", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261003_0003813472"}]}, {"id": "3222e4df0aa6", "title": "[연금개혁] '골든타임' 놓치면 무용지물…국고 GDP 1% 지금 투입 땐 31년 연장, 고갈 후엔 1년뿐", "summary": "국회예산정책처 분석에 따르면 현행 제도가 유지될 경우 국민연금 기금은 2069년에 소진된다. 정부가 지금부터 매년 GDP의 1%를 투입하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥난 2069년부터 투입하면 1년만 연장된다. 기금 수익률을 2%포인트 높이면 2120년까지 흑자를 유지할 수 있다.", "category": "제도·규제", "importance": 3, "source": "CBC뉴스", "published": "2026-10-01", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=611066", "related": [{"title": "\"국민연금 수익률 2%p 높이면 2120년까지 기금 고갈 없어\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260929100600530?input=1195m"}]}, {"id": "dd4beb88ba61", "title": "“4조 8천억 몰렸다”…S&P500으로 노후 준비? 이렇게 하세요 [잇슈 머니]", "summary": "국내에 상장된 S&P500 지수 상품 하나에 올해 들어 9월 28일까지 개인 자금 4조8611억원이 들어와 국내 ETF 가운데 1위를 기록했다. 연금저축과 개인형퇴직연금(IRP)은 둘을 합쳐 연 900만원까지 세액공제를 받고, 총급여 5500만원 이하 근로자는 공제율 16.5%가 적용돼 900만원을 넣으면 최대 148만5000원을 돌려받는다. 운용수익에는 세금을 바로 떼지 않고 55세 이후 연금으로 받을 때 3.3~5.5%의 연금소득세만 내지만, 연금 수령액이 연 1500만원을 넘으면 종합과세와 16.5% 분리과세 가운데 하나를 골라야 한다. 원·달러 환율이 7월 1일 장중 1550.85원에서 10월 2일 1350.6원으로 내려오면서 같은 S&P500 지수를 따르는 국내 상장 ETF의 최근 석 달 수익률은 환헤지형 2.19% 상승, 환노출형 6.23% 하락으로 갈렸다.", "category": "운용·상품", "importance": 2, "source": "KBS", "published": "2026-10-05", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8677562&ref=A", "related": [{"title": "한국증시 뛰었는데…개인 4.9조는 美 S&P500 ETF로", "source": "매일일보", "url": "https://www.m-i.kr/news/articleView.html?idxno=2002553"}, {"title": "개미 자금 4.9조 몰렸다…미래에셋 S&P500 ETF 1위·삼성 고배당도 성장세", "source": "더구루", "url": "https://www.theguru.co.kr/news/article.html?no=107765"}]}, {"id": "bc72fd92b712", "titl <script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
