      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;

      --cat-4: #D28FB0;
      --cat-5: #C79A63;

      --kiwoom-point: #FF5FB4;

  * { box-sizing: border-box; }

  body {

    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;

    font-size: 0.85rem;

    transition: border-color 0.18s;

  .search input::placeholder { color: var(--rule); }

  .range .clear {

    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);

    font-weight: 700;
    letter-spacing: 0.14em;

    font-size: 0.7rem;

    letter-spacing: 0.02em;

    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;

  details a { color: var(--ink); }

  .footer {

    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;

    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

 제시했다. 키움증권은 MTS '영웅문S#'에서 ETF 실시간 거래와 적립식 투자, 자동감시주문을 제공하고 원리금보장상품과 실적배당상품의 96% 이상을 상품군으로 갖춰 실물이전 수요를 노린다. 오프라인 지점이 없는 한계는 로보어드바이저 도입과 가칭 'AI PB' 개발로 보완할 계획이다.", "category": "업계·경쟁사", "importance": 3, "source": "스포츠서울", "published": "2026-10-07", "url": "https://www.sportsseoul.com/news/read/1639392"}, {"id": "f732754d6138", "title": "테마 쪼개고 채권 섞고…ETF 신상품 설계 다변화 [ETF 지형도 변화]②", "summary": "한국거래소 신규 상장 ETF를 집계한 결과 올해 상반기 상장 99개 중 주식·채권 혼합형은 11개(11.1%)였으나, 3분기(9월 22일까지)에는 41개 중 11개로 비중이 26.8%까지 높아졌다. 주식 편입 비중이 50% 미만인 채권혼합형은 적립금의 100%까지 투자할 수 있는 '투자위험을 낮춘 상품'에 속해 퇴직연금 계좌에서 쓰임새가 크다. 금융위원회는 2023년 11월 퇴직연금감독규정을 개정해 이들 상품의 주식 편입 한도를 40% 이내에서 50% 미만으로 높였고, DC형·IRP 투자자는 위험자산 한도 70%를 주식형 ETF로 채운 뒤 나머지 30%를 채권혼합형에 배분할 수 있다. 한수진 삼성증권 선임연구원은 퇴직연금계좌를 통한 ETF 투자금액이 3년 연속 100%대 증가율을 보이고 있다고 분석했다.", "category": "운용·상품", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2632913"}, {"id": "c4dab2068ab2", "title": "복지부 국감 개막⋯기초연금 '반쪽 개편'·국민연금 손실 추궁 [국감]", "summary": "국회 보건복지위원회가 7일 보건복지부와 질병관리청을 시작으로 이틀간 국정감사에 들어갔다. 핵심 쟁점은 연금제도 개편안으로, 복지부가 추진해 온 저소득층 노인 중심 '하후상박' 기초연금 개편이 사회적 논의 부족을 이유로 1년짜리 단기 계획에 그친 점이 '반쪽 개편'이라는 지적을 받을 전망이다. 국민연금은 기금 재정 안정성과 함께 자산배분 리밸런싱 한시 유예, 국내 주식 목표 비중 상향(14.9%→20.8%)에 따른 증시 급락 손실 문제가 검증대에 오른다. 복지위 국감은 14일 국민연금공단, 16일 국민건강보험공단·건강보험심사평가원을 거쳐 27일 종합감사로 마무리된다.", "category": "제도·규제", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2633071"}, {"id": "fbe262da79ae", "title": "美국채 5% 시대…\"장기채 몰빵보다 이렇게 나눠 담아라\"", "summary": "미국 10년물 국채 금리가 5%를 돌파해 2007년 이후 최고 수준에 근접하면서 퇴직연금 투자자의 채권형 ETF 활용법에도 변화가 필요하다는 분석이 나왔다. 현수진 삼성증권 연구원은 금리 방향성이 불확실한 상황에서 장기채 한쪽으로만 집중하면 가격 변동 위험이 커진다며 퇴직연금처럼 투자 기간이 긴 자금일수록 듀레이션을 나누는 접근이 필요하다고 설명했다. 삼성증권은 단기 국채 ETF는 파킹형 대기자금, 중기 국채 ETF는 이자수익과 자본차익 동시 추구, 장기 국채 ETF는 금리 하락 시 자본차익용으로 구분해 활용하라고 제안했다. 인컴을 중시하면 국채 커버드콜 ETF, 은퇴 시점이 가까우면 만기매칭형 ETF의 활용도가 높다고 봤다.", "category": "운용·상품", "importance": 2, "source": "EBN", "published": "2026-10-07", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1726835"}, {"id": "fd87dec91245", "title": "\"주식 상담부터 주문까지 AI가 척척\"…미래에셋·메리츠·키움증권 등 'AI MTS' 무한 경쟁", "summary": "증권사들이 MTS에 AI 기술을 결합한 서비스를 잇달아 내놓고 있다. 미래에셋증권은 1일 'M-STOCK'을 'MAPS'로 전면 개편해 '마켓Now'와 'AI 이슈체크' 등을 제공하고, 메리츠증권은 지난달 금융특화 AI와 투자자 커뮤니티를 묶은 'MOUM'을 출시했으며, 키움증권은 '영웅문S#'에 대화형 AI 검색을 추가했다. 신한투자증권은 IRP 고객을 겨냥한 AI 로보어드바이저 '신한 SOL 로보 연금'을 선보였고, 하나증권은 'ETF MBTI' 등을 탑재했다. 금융투자협회 집계로 일평균 거래대금이 2분기 118조 원에서 56조 원으로 절반 가량 줄어든 가운데 수익구조 전환 시도로 해석된다.", "category": "업계·경쟁사", "importance": 2, "source": "소비자가 만드는 신문", "published": "2026-10-07", "url": "http://www.consumernews.co.kr/news/articleView.html?idxno=765203"}, {"id": "770d3f43724c", "title": "[전문가 기고] 삼성전자·하이닉스 호황에도…개인투자자는 왜 힘든가", "summary": "황지용 신한은행 PWM일산센터 PB팀장은 지난해 한국 주식시장 회전율이 201%로 미국의 약 3배, 일본의 1.7배에 달하고 평균 보유기간은 코스피 2.7개월, 코스닥 1.1개월까지 짧아졌다고 지적했다. 개인투자자의 단기·집중 투자 성향이 거래비용 누적과 복리 효과 상실로 성과를 떨어뜨린다고 분석했다. 해법으로 금융기관이 제공하는 디폴트옵션 포트폴리오 활성화와 기금형 퇴직연금 도입을 통해 직접투자보다 간접투자로 전문적인 운용이 이뤄지도록 제도를 개선해야 한다고 제언했다. 장기투자에 대한 거래비용·세제 인센티브와 신규·저연령 투자자 교육 강화도 함께 제시했다.", "category": "제도·규제", "importance": 2, "source": "아주경제", "published": "2026-10-07", "url": "https://www.ajunews.com/view/20261006080537417"}, {"id": "d340502626d5", "title": "[세무, 톡!] 금융소득 절세, '분산'이 핵심", "summary": "금융소득종합과세는 연간 이자·배당소득 합계가 2000만 원을 넘을 때 적용되며, 초과분은 다른 소득과 합산돼 최대 45%의 누진세율로 과세된다. 금융소득이 연간 1000만 원을 넘으면 전체 금융소득이 건강보험료 산정 소득에 합산돼, 피부양자였던 은퇴자가 지역가입자로 전환될 수 있다. 해외주식 매매차익은 양도소득세 대상이라 2000만 원 집계에서 빠지지만 해외주식 배당금과 해외 ETF 분배금은 배당소득으로 합산된다. 소지훈 세무법인 제이앤 대표세무사는 상품 만기 시점을 연도별로 나누고 ISA와 연금저축·IRP 같은 절세 계좌를 적극 활용하라고 조언했다.", "category": "가입자·사회", "importance": 1, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2633031"}, {"id": "0ad2e6163ae7", "title": "[60+ 궁금증] 자녀 결혼 1억 지원? 얼마까지 도와줘야 할까", "summary": "결혼정보회사 듀오의 '2026 결혼비용 보고서'에 따르면 최근 2년 내 결혼한 신혼부부의 총 결혼비용은 평균 3억 8113만 원이고 이 중 신혼집 마련 비용이 3억 2201만 원으로 84.5%를 차지했다. 보험연구원 분석으로 65세 이상 가구 자산의 부동산 비중은 81.3%, 저축은 12.9%여서 보유 자산이 많아 보여도 쓸 수 있는 돈은 적을 수 있다. 기사는 지원액을 정할 때 국민연금과 퇴직연금 등 매달 들어올 노후소득과 금융자산을 먼저 확인하고, 생활비와 의료·간병비를 뺀 여유자금 안에서 결정하라고 조언했다. 혼인신고일 전후 2년 이내면 혼인·출산 증여재산공제로 기본공제 5000만 원에 1억 원을 더해 최대 1억 5000만 원까지 공제받을 수 있지만, 이 한도를 지원액 기준으로 삼아서는 안 된다고 짚었다.", "category": "가입자·사회", "importance": 1, "source": "브라보마이라이프", "published": "2026-10-07", "url": "https://bravo.etoday.co.kr/view/atc_view/20156"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-09-30 ~ 2026-10-06", "generated_at": "2026-10-07T07:18:25+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "393d12b4dd32", "title": "퇴직연금 가입 대상 611만명 미가입...\"기금형 도입해 사각지대 줄여야\"", "summary": "국회 토론회에서 퇴직연금 가입 대상 1308만명 가운데 611만명이 미가입 상태이고, 전체 사업장 164만개 중 도입 사업장은 44만개(26.5%)에 그친다는 점이 지적됐다. 이재진 전국사무금융서비스노동조합 위원장은 계약형 구조 때문에 사각지대가 방치돼 왔다고 말했다. 기금형 퇴직연금을 금융기관형·연합형·공공형으로 나누는 방안이 논의되는 가운데 오건호 내가만드는복지국가 공동대표와 오종헌 국민연금지부 위원장은 국민연금공단의 참여 가능성과 전국적 인프라 활용을 제시했다. 남성욱 고용노동부 퇴직연금복지과장은 제도개편 대책을 곧 발표할 예정이라고 밝혔다.", "category": "제도·규제", "importance": 5, "source": "월요신문", "published": "2026-10-02", "url": "https://www.wolyo.co.kr/news/articleView.html?idxno=318567", "related": [{"title": "611만명 퇴직연금 사각지대 \"푸른씨앗 키워 포괄하자\"", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237050"}]}, {"id": "93a3950c099e", "title": "\"반도체만 믿다간 큰일\" 직장인들 돌변하더니…'대이동' [김연지의 연금빌드업]", "summary": "미래에셋증권 집계로 올해 3분기 확정기여(DC)형·개인형퇴직연금(IRP) 계좌에서 순매수액이 가장 많았던 ETF는 'TIGER 미국S&P500'이었고 'TIGER 미국나스닥100'과 'KODEX 미국나스닥100', 'KODEX 미국S&P500'이 뒤를 이어 순매수 상위 1~4위가 모두 미국 대표지수 추종 상품으로 채워졌다. 2분기 순매수 1·2위는 'RISE 삼성전자SK하이닉스채권혼합50'과 'KODEX 삼성전자SK하이닉스채권혼합50'이었고 'SOL AI반도체TOP2플러스'와 'KODEX AI반도체TOP2플러스'가 3·4위에 올라 반도체 상품이 최상위권을 차지했다. 코스피는 3분기 첫 거래일인 7월 1일 8303.41에서 9월 30일 6838.04로 17.6% 하락했고, 3분기 일평균 거래대금은 34조6620억원으로 2분기 55조9269억원보다 38.0% 줄었다. 미국 대표지수 외에 'TIGER 미국배당다우존스'가 순매수 6위, 'TIGER TDF2045 적격'이 7위, 'KODEX 머니마켓액티브'가 8위, 'TIGER 배당커버드콜액티브'가 10위에 새로 진입했다.", "category": "운용·상품", "importance": 4, "source": "한국경제", "published": "2026-10-04", "url": "https://www.hankyung.com/article/2026100204986", "related": []}, {"id": "12a423aa5284", "title": "550조 퇴직연금, DC·IRP 시장 확대… 개인 자금 증권사 머니무브", "summary": "국내 퇴직연금 적립금이 550조원을 넘어선 가운데 보험업계의 성장세가 둔화된 것으로 나타났다. 2024년 10월 실물이전 서비스 시행 이후 올해 6월까지 약 15조8699억원이 이전되는 과정에서 보험업권은 1799억원이 순유출됐고 증권업권으로는 4조1513억원이 유입됐다. 보험업계 시장점유율은 지난해 말 21.1%에서 올해 상반기 19.4%로 내려가 처음으로 20%를 밑돌았다. 시장 구조가 확정급여형(DB)에서 확정기여형(DC)과 개인형퇴직연금(IRP) 중심으로 이동하고 있다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌이코노믹", "published": "2026-10-01", "url": "https://www.g-enews.com/view.php?ud=202609301417579233a6e8311f64_1", "related": []}, {"id": "ee6cf0e31b06", "title": "“부유한 노인도 받는다”…기초연금 ‘하위 70%’ 기준 개편 추진", "summary": "정부가 기초연금 수급 대상을 현행 노인 소득 하위 70% 방식에서 기준중위소득과 연계하는 방식으로 개편할 계획이다. 내년에는 소득 하위 30%의 기준연금액을 월 35만원에서 38만원으로 올리고 차등 지급을 적용한다. 다만 이 조치의 노인빈곤율 개선 효과는 0.3%포인트에 그친다. 정부는 저소득 노인의 급여 인상에 집중하기 위해 장기적으로 수급 구조를 개편할 방침이다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-03", "url": "https://www.segye.com/newsView/20261002510945?OutUrl=naver", "related": [{"title": "이재명 정부, 기초연금 개혁 회피해선 안 된다", "source": "시사IN", "url": "https://www.sisain.co.kr/news/articleView.html?idxno=58534"}, {"title": "기초연금 '소득 하위 70%' 기준 바꾼다…중위소득 연계 재추진", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6308073"}]}, {"id": "b14a9dff32a8", "title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "summary": "국회 토론회에서 국민연금 수급 개시 연령을 2046년까지 68세로 점진적으로 높이는 방안이 제안됐다. 현행법상 1969년생부터는 65세에 노령연금을 받기 시작하는데, 정년 60세 퇴직 후 68세 수급이 되면 소득 공백이 약 8년으로 늘어난다. 조기노령연금은 60세부터 신청할 수 있으나 1년 앞당길 때마다 연금액이 6%씩 줄어 최대 30% 감액된다. 보험료율은 2025년 9%에서 9.5%로 올랐고 매년 0.5%포인트씩 높아져 2033년 13%에 도달하며, 68세 수급안은 아직 정부안이나 국회 합의안이 아니다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-02", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver", "related": [{"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}]}, {"id": "83b8b035dfc8", "title": "7월 폭락장, 국민연금도 못 피했다…국민 노후자금 10% 증발에 '부글부글'", "summary": "국민연금 적립금이 6월 1866조원에서 7월 1684조원으로 한 달 만에 9.7% 줄어 181조4030억원의 손실이 났다. 국내주식 평가액은 543조2040억원에서 418조5580억원으로 22.9% 감소했고, 국내주식 누적 수익률은 107.37%에서 60.11%로 축소됐다. 같은 기간 코스피 지수가 8470선에서 6590선으로 22.2% 급락한 영향이다. 연초 이후 국민연금 수익률도 6월 27.22%에서 7월 14.84%로 내려앉았다.", "category": "운용·상품", "importance": 3, "source": "뉴시스", "published": "2026-10-04", "url": "https://www.newsis.com/view/NISX20261002_0003813049", "related": [{"title": "역대급 폭락에 국민연금도 울상...'롤러코스피' 리스크", "source": "YTN", "url": "https://www.ytn.co.kr/_ln/0103_202610040524028320"}]}, {"id": "65997f6263af", "title": "연금통장에 금리·현금 얹는다⋯은행권 '은퇴고객' 쟁탈전", "summary": "은행권이 연금 수령 고객을 끌어오기 위해 금리와 현금 혜택을 내걸고 있다. KB국민은행은 기본금리 연 0.1%에 최고 연 3.1%를 주는 'KB골든라이프연금통장'을 내놓고 'KB골든라이프연금예금'을 5000억원 한도로 재판매하며, 12개월 기준 연 3.50~3.70% 금리를 적용한다. 하나은행은 모바일 앱에 '공적연금 라운지' 전용 멤버십 서비스를 열고 신규 고객에게 최대 5만원 캐시백과 보험 무료 가입을 제공한다. Sh수협은행은 12월 31일까지 '4대 연금 환승' 이벤트로 최대 5만원 캐시백을 주고, 'Sh골든데이 연금통장'에 최고 연 3.2% 금리를 적용한다.", "category": "업계·경쟁사", "importance": 3, "source": "아이뉴스24", "published": "2026-10-04", "url": "http://www.inews24.com/view/2011611", "related": [{"title": "“최고 연 3.7%에 현금 5만원”⋯시중은행, 공적연금 유치전 후끈", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=148274"}]}, {"id": "3222e4df0aa6", "title": "[연금개혁] '골든타임' 놓치면 무용지물…국고 GDP 1% 지금 투입 땐 31년 연장, 고갈 후엔 1년뿐", "summary": "국회예산정책처 분석에 따르면 현행 제도가 유지될 경우 국민연금 기금은 2069년에 소진된다. 정부가 지금부터 매년 GDP의 1%를 투입하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥난 2069년부터 투입하면 1년만 연장된다. 기금 수익률을 2%포인트 높이면 2120년까지 흑자를 유지할 수 있다.", "category": "제도·규제", "importance": 3, "source": "CBC뉴스", "published": "2026-10-01", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=611066", "related": [{"title": "\"국민연금 수익률 2%p 높이면 2120년까지 기금 고갈 없어\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260929100600530?input=1195m"}]}, {"id": "b27545f630cf", "title": "퇴직연금 ETF 상품 108종 추가… 284종 라인업", "summary": "KB국민은행이 '2026 한국산업의 고객만족도(KCSI)' 퇴직연금(IRP) 부문에서 종합점수 84.2점으로 조사 대상 금융사 중 1위에 올랐다. 업계 평균 82.1점보다 2.1점, 2위 83.0점보다 1.2점 높은 점수다. 지난해 말 176종이던 퇴직연금 ETF 상품에 국내외 주식형·채권형·배당형·테마형 등 108종을 추가해 8월 기준 284종의 라인업을 갖췄고, 시중은행 최초로 'ETF 당일 매수·매도 시스템'을 신설했다. 금융감독원 통합연금포털 공시 기준 2026년 2분기 말 KB국민은행의 개인형 IRP 비원리금보장상품 1년 수익률은 52.96%를 기록했다.", "category": "업계·경쟁사", "importance": 3, "source": "동아일보", "published": "2026-09-30", "url": "https://www.donga.com/news/Economy/article/all/20260929/134750216/2", "related": [{"title": "KB국민은행, \"퇴직금 어디 맡길까\"…고객만족도 1위 비결은", "source": "매일경제", "url": "https://www.mk.co.kr/article/12163801"}]}, {"id": "00377454cb04", "title": "1억 넣으면 매달 167만원?…'월배당 ETF' 숫자의 함정", "summary": "국민연금연구원 제10차 국민노후보장패널조사에서 부부 기준 최소 노후 생활비는 월 217만원, 적정 노후 생활비는 월 297만원으로 조사됐다. 국민연금 수급자의 평균 수령액은 월 60만원 수준으로 부부가 함께 받아도 합산 120만~140만원에 그친다. 코스콤 ETF체크 기준 TIGER 배당커버드콜액티브의 연간 분배율은 20.88%, PLUS 고배당주위클리커버드콜은 24.13%로 시중은행 예금 금리의 4~7배 수준이다. 다만 기초지수가 20% 하락하면 분배율을 유지하더라도 주당 분배금이 줄어 원금과 분배금이 동시에 감소하는 위험이 있다.", "category": "운용·상품", "importance": 3, "source": "이코노미스트", "published": "2026-10-05", "url": "https://economist.co.kr/article/view/ecn202609290049", "related": []}, {"id": "99b7786d66ca", "title": "채권 믿다 발등 찍힌 글로벌 연기금, 금고에 금 5% 채워 방어선 쳤다", "summary": "세계금위원회가 2026년 10월 발표한 보고서에서 네덜란드·미국·영국·호주 연기금이 2020년부터 금 편입을 시작해 5년 이상 비중을 유지하고 있다고 밝혔다. 네덜란드 연기금 펜시온펀즈 피디엔은 운용자산 77억 유로 가운데 5%를 금에 배분했고, 미국 버지니아주 페어팩스 카운티 퇴직연금은 62억 달러 규모 자산의 약 3%를 금 선물로 채웠다. 영국 나우 펜션스 마스터 트러스트는 106억 달러 중 약 2%, 호주 엔지에스 슈퍼는 약 3%를 금에 배분했다. 국민연금은 기금 적립금의 80% 안팎을 국내외 주식과 채권에 집중 배치해 두고 있어 대체 자산 완충재가 부족하다는 지적이 제기된다.", "category": "법인·자금운용", "importance": 3, "source": "글로벌이코노믹", "published": "2026-10-05", "url": "https://www.g-enews.com/view.php?ud=202610041819317672fbbec65dfb_1", "related": []}, {"id": "cdc582858a12", "title": "당신도 노인 된다…韓고령자, OECD 상대빈곤율 '최고'", "summary": "국가데이터처가 1일 발표한 '2026 고령자 통계'에서 66세 이상 은퇴 연령층의 상대적 빈곤율은 2024년 기준 37.7%로 2.1%포인트 하락했지만, 2023년 기준 39.8%로 OECD 회원국 가운데 여전히 가장 높았다. 가구주가 65세 이상인 고령자 가구의 지난해 순자산액은 4억9279만원으로 2685만원 늘었다. 본인이나 배우자가 직접 생활비를 마련하는 고령자는 74.7%로 지난 10년간 16.2%포인트 늘었고, 자녀·친척 지원은 13.1%로 15.5%포인트 줄었다. 노후를 준비하는 고령자는 64.4%였고 준비 방법은 국민연금 53.2%, 예·적금 20.1%, 직역연금 10.2% 순이었다.", "category": "가입자·사회", "importance": 3, "source": "SBS Biz", "published": "2026-10-05", "url": "https://biz.sbs.co.kr/article_hub/20000338144?division=NAVER", "related": []}, {"id": "a7033061751d", "title": "디폴트옵션, 투자형 상품이 '기본' 원리금 보장은 '선택' 돼야", "summary": "삼성증권 안윤철 연금본부장은 이데일리 '퇴직연금 리더를 만나다' 인터뷰에서 원리금보장 상품에 쏠린 현행 디폴트옵션이 제도 도입 취지를 훼손했다고 평가했다. 그는 투자형 상품을 기본 디폴트로 두고 가입자의 선택으로 원리금보장 상품을 편입하게 하는 방식이 맞다고 제안했다. 손실 회피 성향의 가입자가 있을 수 있으므로 원리금보장은 선택지로 남겨두되 기본값은 바꿔야 한다는 취지다. 상품 정보 제공과 가입 절차 간소화, 글로벌 분산투자와 정기 적립식 투자, 연금 수령 단계의 세제 혜택 강화와 인센티브 확대도 함께 제시했다.", "category": "업계·경쟁사", "importance": 3, "source": "이데일리", "published": "2026-10-05", "url": "https://www.edaily.co.kr/News/Read?newsId=02017206645609968&mediaCodeNo=257", "related": []}, {"id": "84cb4f70a69c", "title": "고령화에 연금 가입 늘린다는 인도… 현실은 “생활비도 빠듯”", "summary": "인도 정부가 고령화에 대비해 국민연금제도(NPS) 가입을 독려하며 전국 설명회를 100회 넘게 열고 13개 언어로 광고를 내보내고 있다. 은퇴 시 인출할 수 있는 적립금 비율도 기존 60%에서 80%로 높이고, 현재 약 2300만명인 가입자를 5년 안에 2억5000만명으로 늘리겠다는 목표를 세웠다. 그러나 퇴직연금 계좌를 이용할 수 있는 사람은 전체의 30%에 못 미치고, 노동자 10명 중 9명은 농업·일용직·플랫폼 노동 등 비공식 부문에 종사해 사업장이 납입액을 보태주는 혜택을 받기 어렵다. 지난해 마시·CFA협회 글로벌 연금지수에서 인도는 평가 대상 52개국 중 최하위권에 머물렀다.", "category": "가입자·사회", "importance": 3, "source": "조선비즈", "published": "2026-10-04", "url": "https://biz.chosun.com/international/international_general/2026/10/04/Q5S6GXKIGZGIROBKEJETWMJPSM/", "related": []}, {"id": "6c4fa345478b", "title": "국민연금, 코스닥 투자 100조 넘어…다른 공적연금은 '미미'", "summary": "더불어민주당 박민규 의원이 4대 공적연금 기관에서 받은 자료에 따르면 지난해 말 국민연금의 코스닥 투자액은 106조2164억원으로 집계됐다. 코스피 투자액 155조4204억원을 합친 두 시장 투자액 중 코스닥 비중은 40.6%로, 2021년 3.9%에서 크게 높아졌다. 반면 공무원연금의 코스닥 투자액은 310억원(비중 1.8%), 사학연금은 1604억원(2.9%), 군인연금은 14억원(2.5%)으로 투자액과 비중이 모두 2021년보다 줄었다. 박 의원은 연기금의 장기·안정 자금 유입으로 코스닥 시장 활성화에 기여할 필요가 있다고 말했다.", "category": "법인·자금운용", "importance": 3, "source": "연합뉴스", "published": "2026-10-04", "url": "https://www.yna.co.kr/view/AKR20261002179500008?input=1195m", "related": []}, {"id": "93d1cd0d36bc", "title": "기초연금 '반쪽' 개편·국립대병원 첫 등판…복지부 국감 쟁점은", "summary": "국회 보건복지위원회는 7일과 8일 보건복지부와 질병관리청을 대상으로 국정감사를 실시하고, 14일 국민연금공단, 16일 국민건강보험공단과 건강보험심사평가원 국감을 거쳐 27일 종합감사로 마무리한다. 복지부가 지난달 내년도 예산안과 함께 내놓은 기초연금 개편안은 소득을 세 구간으로 나눠 소득 하위 30% 이하에 월 3만원을 더 주는 하후 차등 지급 방식인데, 수급 대상 기준을 손대는 상박이 빠져 반쪽짜리라는 지적을 받고 있다. 정은경 복지부 장관은 지난달 29일 연금개혁특별위원회에서 사회적 합의와 논의 시간이 부족해 기초연금 선정기준 개편까지 담기엔 한계가 있었다고 답했다. 국민연금 기금 고갈 전망에 따른 재정 안정성과 미래 세대 부담, 리밸런싱 유예 조치도 쟁점으로 거론된다.", "category": "제도·규제", "importance": 3, "source": "뉴시스", "published": "2026-10-04", "url": "https://www.newsis.com/view/NISX20261003_0003813472", "related": []}, {"id": "d278a746e7c8", "title": "'노인의 날' 이재명 대통령, 기초연금 확대·노인일자리 118만 개 추진", "summary": "이재명 대통령이 제30회 노인의 날 기념식에서 저소득층 어르신을 위한 기초연금 확대를 약속했다. 노인일자리는 118만 개를 새로 추진한다고 밝혔다. 간병비 건강보험 적용과 지역 돌봄망 9-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "1fc91cd9d139", "title": "리스크 관리·노후수입 한번에…주목받는 보증형 실적 배당보험", "summary": "미래에셋생명의 개인형 퇴직연금(IRP) 보증형 실적배당보험이 출시 후 717억원을 모집했다고 전했다. 이 상품은 IRP를 통해서만 가입할 수 있는 거치형으로, 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 연금 개시가 가능하다. 이미 만 55세를 넘긴 가입자는 가입과 동시에 연금을 받을 수 있고, 적립금이 소진될 때까지 20년 이상 연금을 수령할 수 있다. 적립금은 미래에셋생명의 일임형 자산배분펀드 MVP펀드를 통해 글로벌 자산에 분산투자된다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645584384&mediaCodeNo=257", "related": [{"title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024"}, {"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "3222e4df0aa6", "title": "[연금개혁] '골든타임' 놓치면 무용지물…국고 GDP 1% 지금 투입 땐 31년 연장, 고갈 후엔 1년뿐", "summary": "국회예산정책처 분석에 따르면 현행 제도가 유지될 경우 국민연금 기금은 2069년에 소진된다. 정부가 지금부터 매년 GDP의 1%를 투입하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥난 2069년부터 투입하면 1년만 연장된다. 기금 수익률을 2%포인트 높이면 2120년까지 흑자를 유지할 수 있다.", "category": "제도·규제", "importance": 3, "source": "CBC뉴스", "published": "2026-10-01", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=611066", "related": [{"title": "\"국민연금 수익률 2%p 높이면 2120년까지 기금 고갈 없어\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260929100600530?input=1195m"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": "2026-09-20", "url": "http://www.smarttimes.co.kr/news/articleView.html?idxno=49113", "related": [{"title": "잦은 이직에 끊기는 퇴직자산…사회복지인 전용 퇴직연금 논의 본격화", "source": "라이브뉴스", "url": "https://www.livesnews.com/news/article.html?no=64332"}]}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발생했으나 회수된 금액은 없다.", "category": "법인·자금운용", "importance": 3, "source": "시장경제신문", "published": "2026-09-16", "url": "https://www.meconomynews.com/news/articleView.html?idxno=201626", "related": [{"title": "홈플러스, 9개월간 임금체불 3871억…퇴직금도 미지급", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1690418/"}]}, {"id": "dd4beb88ba61", "title": "“4조 8천억 몰렸다”…S&P500으로 노후 준비? 이렇게 하세요 [잇슈 머니]", "summary": "국내에 상장된 S&P500 지수 상품 하나에 올해 들어 9월 28일까지 개인 자금 4조8611억원이 들어와 국내 ETF 가운데 1위를 기록했다. 연금저축과 개인형퇴직연금(IRP)은 둘을 합쳐 연 900만원까지 세액공제를 받고, 총급여 5500만원 이하 근로자는 공제율 16.5%가 적용돼 900만원을 넣으면 최대 148만5000원을 돌려받는다. 운용수익에는 세금을 바로 떼지 않고 55세 이후 연금으로 받을 때 3.3~5.5%의 연금소득세만 내지만, 연금 수령액이 연 1500만원을 넘으면 종합과세와 16.5% 분리과세 가운데 하나를 골라야 한다. 원·달러 환율이 7월 1일 장중 1550.85원에서 10월 2일 1350.6원으로 내려오면서 같은 S&P500 지수를 따르는 국내 상장 ETF의 최근 석 달 수익률은 환헤지형 2.19% 상승, 환노출형 6.23% 하락으로 갈렸다.", "category": "운용·상품", "importance": 2, "source": "KBS", "published": "2026-10-05", "url": "https://news.kbs.co.kr/news/p id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "1fc91cd9d139", "title": "리스크 관리·노후수입 한번에…주목받는 보증형 실적 배당보험", "summary": "미래에셋생명의 개인형 퇴직연금(IRP) 보증형 실적배당보험이 출시 후 717억원을 모집했다고 전했다. 이 상품은 IRP를 통해서만 가입할 수 있는 거치형으로, 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 연금 개시가 가능하다. 이미 만 55세를 넘긴 가입자는 가입과 동시에 연금을 받을 수 있고, 적립금이 소진될 때까지 20년 이상 연금을 수령할 수 있다. 적립금은 미래에셋생명의 일임형 자산배분펀드 MVP펀드를 통해 글로벌 자산에 분산투자된다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645584384&mediaCodeNo=257", "related": [{"title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024"}, {"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "3222e4df0aa6", "title": "[연금개혁] '골든타임' 놓치면 무용지물…국고 GDP 1% 지금 투입 땐 31년 연장, 고갈 후엔 1년뿐", "summary": "국회예산정책처 분석에 따르면 현행 제도가 유지될 경우 국민연금 기금은 2069년에 소진된다. 정부가 지금부터 매년 GDP의 1%를 투입하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥난 2069년부터 투입하면 1년만 연장된다. 기금 수익률을 2%포인트 높이면 2120년까지 흑자를 유지할 수 있다.", "category": "제도·규제", "importance": 3, "source": "CBC뉴스", "published": "2026-10-01", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=611066", "related": [{"title": "\"국민연금 수익률 2%p 높이면 2120년까지 기금 고갈 없어\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260929100600530?input=1195m"}]}, {"id": "dd4beb88ba61", "title": "“4조 8천억 몰렸다”…S&P500으로 노후 준비? 이렇게 하세요 [잇슈 머니]", "summary": "국내에 상장된 S&P500 지수 상품 하나에 올해 들어 9월 28일까지 개인 자금 4조8611억원이 들어와 국내 ETF 가운데 1위를 기록했다. 연금저축과 개인형퇴직연금(IRP)은 둘을 합쳐 연 900만원까지 세액공제를 받고, 총급여 5500만원 이하 근로자는 공제율 16.5%가 적용돼 900만원을 넣으면 최대 148만5000원을 돌려받는다. 운용수익에는 세금을 바로 떼지 않고 55세 이후 연금으로 받을 때 3.3~5.5%의 연금소득세만 내지만, 연금 수령액이 연 1500만원을 넘으면 종합과세와 16.5% 분리과세 가운데 하나를 골라야 한다. 원·달러 환율이 7월 1일 장중 1550.85원에서 10월 2일 1350.6원으로 내려오면서 같은 S&P500 지수를 따르는 국내 상장 ETF의 최근 석 달 수익률은 환헤지형 2.19% 상승, 환노출형 6.23% 하락으로 갈렸다.", "category": "운용·상품", "importance": 2, "source": "KBS", "published": "2026-10-05", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8677562&ref=A", "related": [{"title": "한국증시 뛰었는데…개인 4.9조는 美 S&P500 ETF로", "source": "매일일보", "url": "https://www.m-i.kr/news/articleView.html?idxno=2002553"}, {"title": "개미 자금 4.9조 몰렸다…미래에셋 S&P500 ETF 1위·삼성 고배당도 성장세", "source": "더구루", "url": "https://www.theguru.co.kr/news/article.html?no=107765"}]}, {"id": "8886365e07f8", "title": "국민연금, 삼성전자 팔고 하이닉스 1.6조 매수", "summary": "국민연금이 7월 이후 SK하이닉스를 1조5988억원 순매수하고 SK스퀘어 1조3531억원, 삼성전자 7937억원을 순매도했다. SK이노베이션 3535억원, 삼성SDI 3305억원, S-Oil 2635억원, DB손해보험 2546억원도 순매수 상위에 올랐다. 기금 규모는 6월 말 1865조5760억원에서 7월 말 1684조1730억원으로 181조4030억원(9.7%) 줄었다. 같은 기간 국내주식 평가액은 543조2040억원에서 418조5580억원으로 124조6460억원 감소했다.", "category": "운용·상품", "importance": 2, "source": "메디컬투데이", "published": "2026-10-06", "url": "https://www.mdtoday.co.kr/news/articleView.html?idxno=617415", "related": [{"title": "삼전 8000억 팔고 하닉 1.6조 샀다…국민연금 선택은", "source": "머니투데이", "url": "https://www.mt.co.kr/stock/2026/10/05/2026100217232429211"}]}, {"id": "393d12b4dd32", "title": "퇴직연금 가입 대상 611만명 미가입...\"기금형 도입해 사각지대 줄여야\"", "summary": "국회 토론회에서 퇴직연금 가입 대상 1308만명 가운데 611만명이 미가입 상태이고, 전체 사업장 164만개 중 도입 사업장은 44만개(26.5%)에 그친다는 점이 지적됐다. 이재진 전국사무금융서비스노동조합 위원장은 계약형 구조 때문에 사각지대가 방치돼 왔다고 말했다. 기금형 퇴직연금을 금융기관형·연합형·공공형으로 나누는 방안이 논의되는 가운데 오건호 내가만드는복지국가 공동대표와 오종헌 국민연금지부 위원장은 국민연금공단의 참여 가능성과 전국적 인프라 활용을 제시했다. 남성욱 고용노동부 퇴직연금복지과장은 제도개편 대책을 곧 발표할 예정이라고 밝혔다.", "category": "제도·규제", "importance": 5, "source": "월요신문", "published": "2026-10-02", "url": "https://www.wolyo.co.kr/news/articleView.html?idxno=318567", "related": [{"title": "611만명 퇴직연금 사각지대 \"푸른씨앗 키워 포괄하자\"", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237050"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "93a3950c099e", "title": "\"반도체만 믿다간 큰일\" 직장인들 돌변하더니…'대이동' [김연지의 연금빌드업]", "summary": "미래에셋증권 집계로 올해 3분기 확정기여(DC)형·개인형퇴직연금(IRP) 계좌에서 순매수액이 가장 많았던 ETF는 'TIGER 미국S&P500'이었고 'TIGER 미국나스닥100'과 'KODEX 미국나스닥100', 'KODEX 미국S&P500'이 뒤를 이어 순매수 상위 1~4위가 모두 미국 대표지수 추종 상품으로 채워졌다. 2분기 순매수 1·2위는 'RISE 삼성전자SK하이닉스채권혼합50'과 'KODEX 삼성전자SK하이닉스채권혼합50'이었고 'SOL AI반도체TOP2플러스'와 'KODEX AI반도체TOP2플러스'가 3·4위에 올라 반도체 상품이 최상위권을 차지했다. 코스피는 3분기 첫 거래일인 7월 1일 8303.41에서 9월 30일 6838.04로 17.6% 하락했고, 3분기 일평균 거래대금은 34조6620억원으로 2분기 55조9269억원보다 38.0% 줄었다. 미국 대표지수 외에 'TIGER 미국배당다우존스'가 순매수 6위, 'TIGER TDF2045 적격'이 7위, 'KODEX 머니마켓액티브'가 8위, 'TIGER 배당커버드콜액티브'가 10위에 새로 진입했다.", "category": "운용·상품", "importance": 4, "source": "한국경제", "published": "2026-10-04", "url": "https://www.hankyung.com/article/2026100204986", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠 <script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
