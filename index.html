": "안명희 우리은행 연금사업부 과장은 만 55세 미만 퇴직자는 퇴직금 300만원 미만 등 예외를 빼면 IRP 계좌로 퇴직금을 받아야 과세 이연과 현물 이전 혜택을 누릴 수 있다고 설명했다. 55세에 퇴직금 5억원을 받고 운용 수익 1000만원이 발생한 사례에서 일시금 인출 시 퇴직소득세 5000만원과 기타소득세 165만원을 합쳐 5165만원을 내지만, 연금으로 수령하면 퇴직소득세가 30% 감면돼 3500만원, 운용 수익에는 3.3~5.5% 연금소득세가 적용돼 55만원으로 총 3555만원이 된다. 2026년부터 연금 수령 10년 차까지는 퇴직소득세 30%, 11~20년 차는 40%, 21년 차 이상은 50%까지 감면율이 올라간다. 안 과장은 당장 목돈이 필요 없더라도 최소 금액으로 연금을 일찍 개시해 수령 연차를 쌓아두라고 조언했다.", "category": "가입자·사회", "importance": 3, "source": "조선일보", "published": "2026-09-17", "url": "https://www.chosun.com/economy/money/2026/09/17/OK3HMIJKRZG4LJCFPWYXVJP43I/"}, {"id": "d608efd7da41", "title": "월 631만원 벌어도 노후 준비 부실하면 탈락…'진짜 중산층'은 4가구 중 1가구", "summary": "NH투자증권이 2025년 가계금융복지조사 마이크로데이터를 분석한 결과 소득 기준 중산층은 52.9%였지만 소비·저축·자산·부채·노후준비까지 따진 '진짜 중산층'은 24.6%에 그쳤다. 진짜 중산층의 월 가처분소득 중앙값은 약 631만원, 순자산 중앙값은 4억1705만원, 금융자산 중앙값은 1억1230만원이었다. 미은퇴 가구 가운데 노후준비가 잘돼 있다고 답한 비율은 9.6%였고, 은퇴 가구 중 생활비가 부족하다고 답한 비율은 55.6%였다. 노후준비 기준을 엄격하게 적용하면 진짜 중산층 비중은 14.9%까지 내려간다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-09-17", "url": "https://www.segye.com/newsView/20260917501220"}, {"id": "618a368e8c44", "title": "조세연 '국내생산세액공제 신설, 품목 선정 주기적 재평가해야'", "summary": "한국조세재정연구원 고지현 연구위원이 2026년 세제개편안 평가 보고서를 내놨다. 보고서는 국내생산세액공제 신설과 미래형 에너지 기술 지원 확대의 실효성을 높이려면 대상 품목 선정을 주기적으로 재평가하고 제도를 보완해야 한다고 지적했다. 퇴직연금(IRP) 세액공제율 우대와 청년형 생산적금융 ISA 신설 등 청년 세제지원 확대에 대해서는 취지는 적절하나 한계가 있다고 평가했다. 실질적 혜택이 납부세액이 있거나 저축 여력이 있는 청년에게만 돌아가고, 지원이 더 필요한 저소득·면세점 이하 청년에게는 실효성이 떨어진다는 이유다.", "category": "제도·규제", "importance": 3, "source": "세정신문", "published": "2026-09-17", "url": "https://www.taxtimes.co.kr/news/article.html?no=276909"}, {"id": "0f01aed8c36b", "title": "삼성증권, 금융상품 자산 100조 돌파…증가분 절반은 퇴직연금", "summary": "삼성증권의 리테일 금융상품 예탁자산이 101조5000억원으로 집계돼 1년 새 20조5000억원 늘었다. 이 가운데 퇴직연금이 17조3000억원에서 28조1000억원으로 10조8000억원 증가해 전체 금융상품 자산 증가액의 52.7%를 차지했다. 2분기 기준 잔고는 채권 20조4000억원, 펀드 16조6000억원, RP 10조5000억원, 신탁 9조9000억원, 랩어카운트 8조6000억원 순이다. 금융상품 판매수익은 355억원에서 1154억원으로 늘었고, 이 가운데 랩어카운트 순수수료 495억원이 전체 금융상품 판매수익의 42.9%를 차지했다.", "category": "업계·경쟁사", "importance": 3, "source": "토요경제", "published": "2026-09-17", "url": "https://sateconomy.co.kr/news/view/1065591288010756"}, {"id": "d6bda1fbb78b", "title": "연금적립 넘어 '의료비·치매·상속'까지...은행권, 노후금융 영역 확장", "summary": "은행권이 퇴직연금 적립과 운용을 넘어 의료비, 생활비 관리, 치매 이후 자산관리, 상속까지 서비스 범위를 넓히고 있다. NH농협은행은 60개 영업점이 치매극복선도기업 인증을 받았고 5월 NH올원더풀 의료비치매안심신탁을 출시했다. 하나은행은 연금 더드림 라운지와 찾아가는 연금 컨설턴트 등 전문인력을 활용한 연금관리 서비스를 확대하고 있다. 65세 이상 치매 환자는 2025년 약 97만명에서 2026년 101만명으로 늘어날 것으로 전망된다.", "category": "업계·경쟁사", "importance": 3, "source": "데일리한국", "published": "2026-09-17", "url": "https://daily.hankooki.com/news/articleView.html?idxno=1407345"}, {"id": "8250641ede45", "title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "summary": "미래에셋생명이 개인형 IRP 계좌를 통해 가입하는 보증형실적배당보험을 운영하고 있다. 만 50세부터 적립금을 예치하고 만 55세 이후 연금 수령을 시작하는 구조이며, MVP펀드를 통해 글로벌 분산투자를 한다. 보험업계에서 처음 출시된 퇴직연금 보증형 실적배당보험으로, 가입자가 직접 투자 상품을 고르는 부담을 줄이도록 설계됐다. 8월 말 기준 모집액은 717억원을 넘어섰다.", "category": "운용·상품", "importance": 2, "source": "신아일보", "published": "2026-09-17", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"id": "b9c805eff2dd", "title": "디셈버 핀트, AI 투자 '한국ETF 국면대응' 솔루션 출시", "summary": "디셈버앤컴퍼니가 AI 투자 솔루션 '한국ETF 국면대응'을 출시했다. 자체 AI 엔진 아이작(ISAAC)이 국내 증시의 상승·하락 국면을 판단해 섹터ETF와 채권ETF의 비중을 자동으로 조절하는 자문형 서비스다. 최소 운용 금액은 100만원, 월 수수료는 0.064% 수준이다. 회사는 개인형퇴직연금(IRP)과 연금저축, 중개형 ISA 등 핵심 금융투자계좌 전반에서 AI 기반 자산관리 솔루션을 제공한다고 밝혔다.", "category": "운용·상품", "importance": 2, "source": "스포츠경향", "published": "2026-09-17", "url": "https://sports.khan.co.kr/article/202609170241003"}, {"id": "ed2889974101", "title": "푸본현대생명, 보장성 신계약 역대 최대…체질 개선 박차", "summary": "푸본현대생명의 상반기 보장성보험 신계약액은 6961억원으로 전년 동기 5973억원보다 988억원(16.5%) 늘어 IFRS17 시행 이후 상반기 기준 역대 최대를 기록했다. 상반기 신계약 CSM은 703억원으로 전년 동기 512억원 대비 191억원(37.3%) 증가했고, 당기순손익은 1586억원 이익으로 돌아섰다. 회사는 CSM 확보를 위해 퇴직연금 중심 영업에서 벗어나 건강보험을 비롯한 보장성보험 판매를 확대해 왔다.", "category": "업계·경쟁사", "importance": 2, "source": "FETV", "published": "2026-09-17", "url": "https://www.fetv.co.kr/news/articleView.html?idxno=310327"}, {"id": "5268de30e3f2", "title": "[IB탈탈털기] 한국투자금융, 카디프생명 800억 인수 막바지…싼 라이선스 뒤 적자 부담", "summary": "한국투자금융지주가 BNP파리바카디프생명을 800억원에 인수하는 협상을 마무리 단계에 두고 있다. 이는 7월 시장에서 거론되던 1500억~2000억원보다 46.7~60% 낮은 가격이다. 한국투자증권의 자산관리 고객과 한국투자신탁운용의 ETF 상품, 퇴직연금 사업을 보험상품과 연결할 수 있다는 점이 인수 명분으로 꼽힌다. 다만 카디프생명이 2025년 248억원의 순손실을 낸 점과 판매채널 재편 비용은 과제로 남았다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스워커", "published": "2026-09-17", "url": "https://www.newsworker.co.kr/news/articleView.html?idxno=504774"}, {"id": "9a3ede9bfaea", "title": "日은 개혁·대만은 TSMC, 한국은…'코리아 프리미엄' 뛰어든 머니 전쟁", "summary": "금융위원회와 한국거래소가 오는 28일부터 다음 달 16일까지 '코리아 프리미엄 위크 2026'을 개최한다. 42개 기관과 55개 상장사가 참여해 25개 안팎의 행사를 열며, 그간 거래소와 금융투자협회, 증권사, 자산운용사가 따로 열던 행사를 한 기간에 모으는 첫 시도다. 첫날인 28일 정부가 자본시장·기업지배구조·외환시장 개혁을 설명하고 이튿날 국내 상장기업들이 글로벌 기관투자자를 만난다. 개인투자자를 대상으로 한 프로그램에는 퇴직연금과 개인종합자산관리계좌(ISA), 상장지수펀드(ETF), 2030세대 자산형성이 포함됐다.", "category": "제도·규제", "importance": 2, "source": "연합인포맥스", "published": "2026-09-17", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4435311"}, {"id": "f3b5b6c63a8e", "title": "미래에셋자산운용, 美 대표지수 '타겟데일리 커버드콜 ETF' 합산 순자산 3조원 돌파", "summary": "미래에셋자산운용의 미국 대표지수 연계 커버드콜 ETF 2종의 합산 순자산이 16일 기준 3조942억원을 기록했다. 나스닥100 상품이 2조4441억원, S&P500 상품이 6501억원이며, 개인 누적 순매수는 나스닥100이 1조5176억원, S&P500이 3787억원이다. 두 상품은 기초지수 상승분의 약 90% 수준까지 주가 수익률을 따라가면서 나머지 옵션 프리미엄으로 월 단위 배당 재원을 만드는 구조이고, 함께 보유하면 2주 간격으로 분배금을 받을 수 있다. 회사는 이들 상품이 개인연금 및 퇴직연금(DC·IRP) 계좌 내 장기 유동성을 결집하는 지렛대로 작동한다고 설명했다.", "category": "운용·상품", "importance": 2, "source": "메가경제", "published": "2026-09-17", "url": "https://www.megaeconomy.co.kr/news/newsview.php?ncode=1065572163997578"}, {"id": "b0ab80213fbe", "title": "IRP에 600만원 넣으면 79만원 세액공제…연봉별 절세 효과는 [1인가구 재테크]", "summary": "연금저축과 IRP를 합산해 연 최대 900만원까지 세액공제 대상이 된다. 총급여 5,500만원 이하 근로자는 납입액에 16.5%, 5,500만원을 넘으면 13.2%의 공제율이 적용된다. 총급여 7,000만원 근로자가 IRP에 600만원을 납입하면 약 79만2,000원의 세액공제 효과가 발생한다. 총급여 5,000만원 이하 근로자가 같은 금액을 납입하면 99만원의 세액공제가 예상된다.", "category": "가입자·사회", "importance": 2, "source": "데일리팝", "published": "2026-09-17", "url": "http://www.dailypop.kr/news/articleView.html?idxno=99953"}, {"id": "f22427d51808", "title": "NH농협은행, 2026년 제2차 투자상품 완전판매 대토론회 개최", "summary": "NH농협은행은 17일 서울 중구 본사에서 2026년 제2차 투자상품 완전판매 대토론회를 열었다. 투자상품 미스터리쇼핑 만점자와 영업본부 완전판매 TOP리더 등 약 40명이 참석해 펀드·방카슈랑스·신탁·퇴직연금 부문의 상담 준비, 상품 설명, 적합성·적정성 원칙 준수 사례를 공유했다. NH농협은행은 토론회 내용을 영상으로 제작해 영업점 교육자료로 활용할 계획이다. 박현동 투자상품부문 부행장은 완전판매가 절차 준수에 그치지 않고 고객 입장에서 충분히 설명하고 신뢰를 쌓는 과정이라고 강조했다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스퀘스트", "published": "2026-09-17", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=301184"}, {"id": "cab10ccbb8df", "title": "금융권, '포용'과 '고객 맞춤'으로 판 바꾼다…비대면 주담대·외국인 서비스·특화상품 속속 출시", "summary": "국내 주요 금융회사들이 고객층을 세분화한 맞춤형 솔루션을 잇달아 내놓고 있다. 시중은행은 자산관리 분야에서 휴먼터치 서비스를 결합하고 있으며, 하나은행은 명동사옥에서 퇴직연금 손님을 위한 '맞춤형 퇴직연금 세미나'를 열었다. 강연 중심의 기존 방식에 더해 연금전문가가 참여하는 '1:1 맞춤 상담부스'를 함께 운영해 절세 전략, 국민연금 활용법, 시장 전망 등을 안내했다. 하나은행은 '연금 더드림 라운지'와 '찾아가는 연금 컨설턴트' 등 전문인력 중심의 손님 관리 프로그램을 계속 늘려갈 방침이다.", "category": "업계·경쟁사", "importance": 1, "source": "데일리팝", "published": "2026-09-17", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102638"}, {"id": "3881c183cea1", "title": "'불장' 주춤하자 줄어든 거래대금… 증권사 실적 '먹구름'", "summary": "증권사 주가가 올해 최고가 대비 35~62% 하락했고 미래에셋증권은 62%, 키움증권은 46% 내렸다. 지난달 일평균 거래대금은 67조2000억원으로 전월 99조5000억원보다 32% 줄었다. 3분기 지배주주순이익은 1조5000억원으로 기대치를 29% 밑돌 것으로 전망됐다. 다만 증권사들이 WM·퇴직연금·디지털자산 사업 등 질적 변화와 주주환원 움직임을 보이며 퇴직연금 중심의 장기 고객 자산 유입을 통한 사업구조 전환을 가속화하고 있다는 분석이 나왔다.", "category": "업계·경쟁사", "importance": 1, "source": "머니투데이", "published": "2026-09-17", "url": "https://www.mt.co.kr/stock/2026/09/17/2026091619585543643"}, {"id": "2fdcba9c2237", "title": "김성주 이사장, 국민연금공단 창립 39주년 맞아 책임·전문성 갖춰 더 신뢰받는 공단 강조", "summary": "국민연금공단이 16일 전북 전주시 본부에서 창립 39주년 기념식을 열었다. 김성주 이사장은 혁신과 책임을 바탕으로 국민의 노후를 든든히 지키는 국민연금을 만들어가겠다고 밝혔다. 기념식과 함께 열린 시민참여 특강에는 임직원과 시민 200여명이 참석했다. 공단은 내년 창립 40주년을 맞는다.", "category": "가입자·사회", "importance": 1, "source": "브릿지경제", "published": "2026-09-17", "url": "https://www.viva100.com/article/20260917500003"}, {"id": "785f1044dbc4", "title": "日 100세 인구 10만 돌파…1963년 이후 700배 증가", "summary": "일본의 100세 이상 인구가 9월 1일 기준 10만7677명으로 집계돼 사상 처음 10만명을 넘어섰다. 1963년 첫 집계 당시 153명과 비교하면 약 700배 늘어난 수치이며, 여성이 전체의 88%를 차지한다. 2025년 합계출산율은 역대 최저인 1.14명으로 인구 유지에 필요한 2.1명을 크게 밑돌았다. 일본 총인구는 2070년 약 8700만명으로 2008년 정점(약 1억2800만명) 대비 30%가량 줄어들 전망이다.", "category": "가입자·사회", "importance": 1, "source": "글로벌이코노믹", "published": "2026-09-17", "url": "https://www.g-enews.com/view.php?ud=202609170033098408fda4f5ab74_1"}]}, "weekly": {"period": "weekly", "key": "2026-W38", "label": "2026-W38 (2026-09-14 ~ 2026-09-20)", "generated_at": "2026-09-17T18:00:24+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "26bad6a1c84a", "title": "이형일 \"500조 규모 퇴직연금, 수익률 저조…법안 준비 중\"", "summary": "이형일 부총리 겸 재정경제부 장관 후보자가 9월 15일 국회 재정경제기획위원회 인사청문회에서 퇴직연금 제도 개선과 관련해 노사정이 합의한 사항을 바탕으로 법안을 준비하고 있다고 밝혔다. 이 후보자는 퇴직연금 적립금이 500조원까지 올라갔는데 수익률이 저조하다며 노후소득 보장 기능이 제대로 작동하고 있느냐는 논의가 많다고 말했다. 노사정은 지난 2월 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화에 합의했고, 정부는 이를 바탕으로 연내 근로자퇴직급여보장법 개정을 추진하고 있다. 이광재 의원이 미국 401(k)를 거론하며 국가적 시스템이 필요하다고 지적한 데 대한 답변이다.", "category": "제도·규제", "importance": 5, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/economy/trend/6290971", "related": []}, {"id": "8977649855f9", "title": "표류하는 기금형 퇴직연금…간담회 또 연기", "summary": "고용노동부와 금융감독원이 공동 주재하는 퇴직연금사업자 간담회가 9월 2일에서 10월 2일로 재차 연기됐다. 한 달 새 두 번째 순연으로, 간담회는 10월 2일 오후 2시부터 3시 30분까지 서울 로얄호텔에서 김영훈 고용노동부 장관과 이찬진 금융감독원장이 함께 주재한다. 국민연금공단의 기금형 퇴직연금 참여 여부, 수탁법인 인가 대상을 5~8개로 제한하는 방안을 둘러싼 독점 우려, 손해배상 책임 강화 방침이 쟁점으로 남아 있다. 연내 근로자퇴직급여보장법 개정안 통과 목표의 재조정이 불가피하다는 관측이 나온다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-09-14", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": []}, {"id": "ffde5c86587a", "title": "'공시 넘어 사후관리'…디폴트옵션 3년, 최초 평가 시동", "summary": "고용노동부가 올해 디폴트옵션 승인 상품에 대한 첫 정기 평가를 실시한다. 2023년 7월 본격 시행된 디폴트옵션은 올해 3월 기준 41개 금융기관이 324개 상품을 승인받아 운용 중이며, 최초 승인 이후 3년이 지난 상품이 평가 대상으로 장기 성과 수익률과 위험 관리 등을 본다. 고용노동부는 첫 평가인 만큼 성과 저조 사유를 파악하고 개선 방안을 마련하는 데 핵심 의의를 두되, 문제가 지속되는 상품에는 불이익을 부여할 계획이다. 5월에 선정한 정책연구용역은 내년 2월까지 진행된다.", "category": "제도·규제", "importance": 5, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140567806179ad43907_18", "related": []}, {"id": "504d525f7a1e", "title": "개인 국채투자, '퇴직연금서 투자'에 흥행…9월 청약서 초과 수요", "summary": "이달 개인투자용 국채 청약에서 확정기여형(DC) 퇴직연금과 개인형퇴직연금(IRP) 계좌를 통한 청약액이 1천435억원으로 집계됐다. 퇴직연금 청약에 일반투자 창구 청약까지 더해지면서 9월 전체 청약액은 재정경제부가 공고한 모집예정액 2천300억원을 넘어섰고, 지난 5월 이후 처음으로 2천억원을 돌파했다. 청약은 9월 9일부터 15일까지 신한은행·하나은행·NH농협은행 등 3개 은행과 미래에셋증권·삼성증권·한국투자증권·KB증권·NH투자증권 등 5개 증권사를 통해 이뤄졌으며, 대상 채권은 10년물과 20년물이다. 10년물 표면금리는 연 4.415%, 20년물은 연 4.57%이고 두 상품 모두 연 0.35%포인트의 가산금리가 적용된다.", "category": "운용·상품", "importance": 4, "source": "연합뉴스", "published": "2026-09-17", "url": "https://www.yna.co.kr/view/AKR20260917099600008", "related": [{"title": "\"1억 넣어두면 20년 뒤 2.6억\"…연금개미들 외면한 이유", "source": "한국경제", "url": "https://www.hankyung.com/article/202609168563i"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 확정 수익 60%\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/14/2026091490036.html"}, {"title": "[흔들리는 국채 공식④] 퇴직연금에 국채 담을까…개인투자자의 새 셈법", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4435180"}, {"title": "[필드뒷얘기] 퇴직연금 국채로 고객 묶는 증권사", "source": "대한금융신문", "url": "https://www.kbanker.co.kr/news/articleView.html?idxno=225952"}, {"title": "퇴직연금 계좌로 국채 투자하면 포인트 제공", "source": "서울신문", "url": "https://www.seoul.co.kr/news/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 ", "published": "2026-09-15", "url": "https://www.sportsseoul.com/news/read/1634922", "related": []}, {"id": "37880c4dd1e3", "title": "'퇴직연금 인기상품' 채권혼합ETF...미국 금리 상승에 수익률 '흔들'", "summary": "퇴직연금 수요를 타고 성장한 채권혼합형 ETF의 수익률이 금리 상승과 증시 조정으로 흔들리고 있다. 최근 1개월간 'ACE 미국S&P500미국채혼합50액티브'는 6.03%, 'KODEX 200미국채혼합50'은 5.8%, 'TIGER 미국나스닥100채권혼합50'은 4.59% 하락해 각각 기초지수보다 낙폭이 컸다. 타깃데이트펀드(TDF) ETF를 제외한 채권혼합형 ETF는 9월 11일 기준 66개이며 순자산총액은 18조5501억원으로 연초 6조8926억원에서 12조원 가까이 늘었다. 확정기여형(DC)·개인형퇴직연금(IRP)의 위험자산 투자 한도가 70%로 제한돼, 주식 편입 비중 50% 이하인 적격 혼합형 상품이 안전자산으로 분류되면서 자금이 몰렸다.", "category": "운용·상품", "importance": 4, "source": "헤럴드경제", "published": "2026-09-15", "url": "https://biz.heraldcorp.com/article/10873869", "related": []}, {"id": "07602bd7cfce", "title": "[시론] 기금형 제도 도입 이후, 이제 풀어야 할 퇴직연금의 과제", "summary": "박준범 성균관대 겸임교수는 기금형 퇴직연금 도입보다 연금화 부진 해소가 더 시급하다고 지적했다. 계좌 기준 연금 수령 비율은 16.5%에 그치고 평균 근속연수가 7.1년이어서 퇴직급여가 축적되지 않으며, 2022~2024년 3년간 IRP 이전금액 63.8조 원 대비 해지금액이 43.4조 원으로 해지율이 68.1%에 달한다고 밝혔다. 2024년 중도인출의 81.9%는 주택 관련 사유였고, 5인 미만 사업장의 퇴직연금 도입률은 10%대에 머물러 있다. 기금형 도입을 넘어 연금화를 중심으로 제도 개혁을 진행해야 한다고 주장했다.", "category": "제도·규제", "importance": 4, "source": "한국보험신문", "published": "2026-09-14", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=92713", "related": []}, {"id": "e38f37f63d51", "title": "'주식·金 연금까지' 카카오뱅크, 종합금융플랫폼 도약", "summary": "카카오뱅크가 비은행 포트폴리오를 넓히며 퇴직연금 시장 진출을 준비하고 있다. 지난해부터 관련 인력을 채용해 왔고 삼정KPMG의 컨설팅을 마무리했다. 퇴직연금 적립금은 지난해 말 501조 4000억 원으로 500조 원을 처음 넘어섰고 올해 2분기 말 기준 553조 8779억 원에 이른다. 카카오뱅크의 2026년 상반기 당기순이익은 3280억 원으로 전년 동기 대비 24.4% 늘었으며, 주식투자·자동차금융 비교·금 거래 서비스를 차례로 내놓은 데 이어 내년 상반기 캐피탈 사업을 본격화할 계획이다.", "category": "업계·경쟁사", "importance": 4, "source": "한스경제", "published": "2026-09-14", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=864386", "related": []}, {"id": "a5e7a7fba12f", "title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "summary": "NH농협은행이 퇴직연금 계좌에 개인투자용국채를 도입하고 ETF 라인업을 확대한다고 밝혔다. 7월에 22종을 내놓은 데 이어 10월에 36개를 추가한다. 전문가 포트폴리오 서비스의 2026년 상반기 수익률은 공격투자형 기준 40.11%를 기록했  예외를 빼면 IRP 계좌로 퇴직금을 받아야 과세 이연과 현물 이전 혜택을 누릴 수 있다고 설명했다. 55세에 퇴직금 5억원을 받고 운용 수익 1000만원이 발생한 사례에서 일시금 인출 시 퇴직소득세 5000만원과 기타소득세 165만원을 합쳐 5165만원을 내지만, 연금으로 수령하면 퇴직소득세가 30% 감면돼 3500만원, 운용 수익에는 3.3~5.5% 연금소득세가 적용돼 55만원으로 총 3555만원이 된다. 2026년부터 연금 수령 10년 차까지는 퇴직소득세 30%, 11~20년 차는 40%, 21년 차 이상은 50%까지 감면율이 올라간다. 안 과장은 당장 목돈이 필요 없더라도 최소 금액으로 연금을 일찍 개시해 수령 연차를 쌓아두라고 조언했다.", "category": "가입자·사회", "importance": 3, "source": "조선일보", "published": "2026-09-17", "url": "https://www.chosun.com/economy/money/2026/09/17/OK3HMIJKRZG4LJCFPWYXVJP43I/", "related": []}, {"id": "d608efd7da41", "title": "월 631만원 벌어도 노후 준비 부실하면 탈락…'진짜 중산층'은 4가구 중 1가구", "summary": "NH투자증권이 2025년 가계금융복지조사 마이크로데이터를 분석한 결과 소득 기준 중산층은 52.9%였지만 소비·저축·자산·부채·노후준비까지 따진 '진짜 중산층'은 24.6%에 그쳤다. 진짜 중산층의 월 가처분소득 중앙값은 약 631만원, 순자산 중앙값은 4억1705만원, 금융자산 중앙값은 1억1230만원이었다. 미은퇴 가구 가운데 노후준비가 잘돼 있다고 답한 비율은 9.6%였고, 은퇴 가구 중 생활비가 부족하다고 답한 비율은 55.6%였다. 노후준비 기준을 엄격하게 적용하면 진짜 중산층 비중은 14.9%까지 내려간다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-09-17", "url": "https://www.segye.com/newsView/20260917501220", "related": []}, {"id": "618a368e8c44", "title": "조세연 '국내생산세액공제 신설, 품목 선정 주기적 재평가해야'", "summary": "한국조세재정연구원 고지현 연구위원이 2026년 세제개편안 평가 보고서를 내놨다. 보고서는 국내생산세액공제 신설과 미래형 에너지 기술 지원 확대의 실효성을 높이려면 대상 품목 선정을 주기적으로 재평가하고 제도를 보완해야 한다고 지적했다. 퇴직연금(IRP) 세액공제율 우대와 청년형 생산적금융 ISA 신설 등 청년 세제지원 확대에 대해서는 취지는 적절하나 한계가 있다고 평가했다. 실질적 혜택이 납부세액이 있거나 저축 여력이 있는 청년에게만 돌아가고, 지원이 더 필요한 저소득·면세점 이하 청년에게는 실효성이 떨어진다는 이유다.", "category": "제도·규제", "importance": 3, "source": "세정신문", "published": "2026-09-17", "url": "https://www.taxtimes.co.kr/news/article.html?no=276909", "related": []}, {"id": "0f01aed8c36b", "title": "삼성증권, 금융상품 자산 100조 돌파…증가분 절반은 퇴직연금", "summary": "삼성증권의 리테일 금융상품 예탁자산이 101조5000억원으로 집계돼 1년 새 20조5000억원 늘었다. 이 가운데 퇴직연금이 17조3000억원에서 28조1000억원으로 10조8000억원 증가해 전체 금융상품 자산 증가액의 52.7%를 차지했다. 2분기 기준 잔고는 채권 20조4000억원, 펀드 16조6000억원, RP 10조5000억원, 신탁 9조9000억원, 랩어카운트 8조6000억원 순이다. 금융상품 판매수익은 355억원에서 1154억원으로 늘었고, 이 가운데 랩어카운트 순수수료 495억원 ://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": [{"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. y": "KB자산운용이 골드 특별자산 펀드의 운용 구조를 파생상품 중심에서 국내외 금 ETF 활용 방식으로 바꿨다. 파생상품 위험평가액을 40% 이하로 낮춰 퇴직연금 적격 요건을 충족했고 운용보수는 기존 대비 약 40% 인하했다. 비교지수는 LBMA Gold PM Price로 변경했고 환매대금은 4영업일 내에 지급한다. 현재 국민은행과 신한투자증권의 퇴직연금 계좌에서 매매할 수 있다.", "category": "운용·상품", "importance": 2, "source": "비즈월드", "published": "2026-09-16", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146330", "related": [{"title": "KB자산운용, 18년 된 금 펀드 손질…퇴직연금서도 투자", "source": "AP신문", "url": "https://www.apnews.kr/news/articleView.html?idxno=3051270"}]}, {"id": "26bad6a1c84a", "title": "이형일 \"500조 규모 퇴직연금, 수익률 저조…법안 준비 중\"", "summary": "이형일 부총리 겸 재정경제부 장관 후보자가 9월 15일 국회 재정경제기획위원회 인사청문회에서 퇴직연금 제도 개선과 관련해 노사정이 합의한 사항을 바탕으로 법안을 준비하고 있다고 밝혔다. 이 후보자는 퇴직연금 적립금이 500조원까지 올라갔는데 수익률이 저조하다며 노후소득 보장 기능이 제대로 작동하고 있느냐는 논의가 많다고 말했다. 노사정은 지난 2월 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화에 합의했고, 정부는 이를 바탕으로 연내 근로자퇴직급여보장법 개정을 추진하고 있다. 이광재 의원이 미국 401(k)를 거론하며 국가적 시스템이 필요하다고 지적한 데 대한 답변이다.", "category": "제도·규제", "importance": 5, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/economy/trend/6290971", "related": []}, {"id": "ffde5c86587a", "title": "'공시 넘어 사후관리'…디폴트옵션 3년, 최초 평가 시동", "summary": "고용노동부가 올해 디폴트옵션 승인 상품에 대한 첫 정기 평가를 실시한다. 2023년 7월 본격 시행된 디폴트옵션은 올해 3월 기준 41개 금융기관이 324개 상품을 승인받아 운용 중이며, 최초 승인 이후 3년이 지난 상품이 평가 대상으로 장기 성과 수익률과 위험 관리 등을 본다. 고용노동부는 첫 평가인 만큼 성과 저조 사유를 파악하고 개선 방안을 마련하는 데 핵심 의의를 두되, 문제가 지속되는 상품에는 불이익을 부여할 계획이다. 5월에 선정한 정책연구용역은 내년 2월까지 진행된다.", "category": "제도·규제", "importance": 5, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140567806179ad43907_18", "related": []}, {"id": "69dd458f15f4", "title": "퇴직연금 550조 커졌는데…보험사 점유율 20% 무너졌다", "summary": "퇴직연금 시장이 553조원대로 커지는 사이 보험업계 점유율이 20% 아래로 떨어졌다. 상반기 증권사는 4조1000억원 순유입을 기록한 반면 보험사는 1799억원 순유출을 냈다. 실물이전 확대로 가입자가 금융사를 옮기기 쉬워지면서 사업자 간 경쟁이 격화된 결과다. DB형에 집중된 포트폴리오가 약점으로 지목되자 삼성·한화·교보생명 등이 DC형·IRP 강화와 ETF 상품 확대로 대응하고 있다.", "category": "업계·경쟁사", "importance": 5, "source": "뉴데일리", "published": "2026-09-10", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/10/2026091000173.html", "related": []}, {"id": "de4a8500263d", "title": "수익률 32%에도 돈이 안 온다…디폴트옵션의 역설", "summary": "디폴트옵션 시행 3년 차 데이터에서 적극투자형 1년 수익률이 32.66%를 기록했으나 자금의 82.5%는 여전히 안정형에 머물러 있다. 은행권은 고객 자금 대부분을 안정형에 두는 반면 증권사 고객은 위험자산에 투자해 업권별로 뚜렷이 갈렸다. 제도의 병목은 상품 품질이 아니라 자금이 좋은 상품에 도달하는 경로에 있다는 지적이다.", "category": "운용·상품", "importance": 5, "source": "한경머니", "published": "2026-09-10", "url": "https://magazine.hankyung.com/money/article/202608199155c", "related": []}, {"id": "937d44176934", "title": "퇴직연금 6.9조 이동…은행서 증권사로 자금 쏠림, 국채로 2차 경쟁", "summary": "올해 상반기 퇴직연금 실물이전 규모가 약 6조9000억원으로 전년 동기 약 3조2000억원의 2.2배에 달해 2024년 제도 시행 이후 반기 기준 최대를 기록했다. 업권별로는 증권사가 4조1513억원 순유입, 은행이 3조9714억원 순유출, 보험이 1799억원 순유출이었고, 증권사 적립금은 2분기 말 165조468억원으로 1분기 대비 16.5% 늘어 은행권 증가율 6.6%를 크게 앞섰다. 실물이전 규모는 가입자가 직접 상품을 고르는 IRP에서 6조8000억원으로 가장 컸다. 9월부터 개인투자용 국채가 DC·IRP 계좌에 편입되면서 증권사는 안정형 상품까지 더해 고객 확보에 나서고, 은행권은 ETF 거래 편의성 개선으로 맞서고 있다.", "category": "운용·상품", "importance": 5, "source": "더트래커", "published": "2026-09-10", "url": "https://thetracker.co.kr/View.aspx?No=4221950", "related": []}, {"id": "6dd0fa0960d5", "title": "퇴직연금 디폴트옵션 첫 순유출…2분기 1조4000억 감소", "summary": "디폴트옵션 운용자금이 2023년 제도 도입 후 처음으로 순유출을 기록해 2분기에 약 1조4000억원이 줄었다. 안정형에서만 1조4891억원이 빠져나갔고, 증시 호황으로 위험자산 투자가 늘면서 자금이 대거 이동했다. 평가액 기준 적립액 증가는 117억원에 그쳐 시장 전체 증가분 45조2000억원에 비하면 미미한 수준이다.", "category": "운용·상품", "importance": 5, "source": "한국경제", "published": "2026-09-08", "url": "https://www.hankyung.com/article/202609081009i", "related": []}, {"id": "362d60df2f63", "title": "퇴직연금도 자산배분 시대…NH투자증권, DB 적립금 컨설팅 강화", "summary": "NH투자증권이 연금자산관리본부 산하 DB적립금 운용 협의체를 통해 기업별 맞춤형 IPS(적립금운용계획서) 컨설팅을 확대한다. DB형은 적립금 수익률이 임금상승률에 못 미치면 기업이 추가 적립을 부담해야 해 자산배분 전략의 필요성이 커지고 있다. 전담 계리사와 자산배분·포트폴리오 전문가로 구성된 협의체가 부채 분석부터 리밸런싱까지 5단계로 지원한다. 고객사 한국선급은 IPS 개정 후 DB 적립금 1년 수익률이 5월 말 기준 20%를 넘어 고용노동부·금융감독원 모범사례로 선정됐다.", "category": "법인·자금운용", "importance": 5, "source": "매일경제", "published": "2026-09-08", "url": "https://www.mk.co.kr/news/stock/12147172", "related": []}, {"id": "f7cf0468c30c", "title": "정부, 올 하반기 퇴직연금 디폴트옵션 손질", "summary": "고용노동부가 올해 하반기 기금형 퇴직연금 도입과 함께 디폴트옵션(사전지정운용제도)도 개편하겠다고 밝혔다. 대기기간과 디폴트옵션 상품 평가체계를 명확히 하고, 현재 제도가 적용되지 않는 자금까지 적용 범위를 넓히는 것이 핵심이다. 현재 디폴트옵션 자금의 82.5%가 안정형에 쏠려 있는 점도 개선 대상으로 지목됐다. 정부는 퇴직연금 의무화와 사외적립 의무화를 함께 추진하며 올 하반기를 퇴직연금 대격변기로 보고 있다.", "category": "제도·규제", "importance": 5, "source": "파이낸셜뉴스", "published": "2026-09-07", "url": "https://www.fnnews.com/news/202609071643275392", "related": []}, {"id": "a6e5af30d59e", "title": "[단독] 5인 미만 사업장 퇴직연금 도입률 10%에 그쳐", "summary": "퇴직연금 미도입 사업장이 121만218곳으로 집계됐고, 이 가운데 30인 미만 사업장이 119만1811곳으로 98.5%를 차지했다. 사업장 규모별 도입률은 5인 미만 10.6%, 5~9인 32.7%, 10~29인 57.3%, 30~49인 74.2%, 50~99인 82.2%, 100인 이상 89.6%로 나타났다. 전체 도입률은 26.5%로 5년째 26%대에 머물렀고, 업종별로는 숙박·음식점업의 93.8%, 부동산업의 89.7%, 농림어업의 89.0%가 퇴직연금을 도입하지 않았다. 가입 대상 근로자 1308만5000명 가운데 697만2000명(53.3%)이 퇴직연금에 가입했다.", "category": "제도·규제", "importance": 4, "source": "한국경제", "published": "2026-09-17", "url": "https://www.hankyung.com/article/202609169177i", "related": []}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": []}, {"id": "507cff298ac3", "title": "미래에셋증권, 5대 시중은행 압도한 '리딩 증권사'…2분기 순이익 1.9조", "summary": "미래에셋증권이 2026년 2분기 순이익 1조9052억원을 기록해 신한은행(1조3015억원), KB국민은행(1조1240억원) 등 5대 시중은행을 모두 앞섰다. 영업이익은 2조4899억원으로 397.5% 늘었고, 세전이익 2조5287억원 가운데 1조6242억원은 스페이스X 평가이익에서 나왔다. 퇴직연금 적립금은 6월 말 80조원에 이르렀고 연간 증가율은 60%를 넘어 시장 평균의 약 2.5배였다. 개인 384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "a5e7a7fba12f", "title": "NH농협은행, 자", "source": "AP신문", "url": "https://www.apnews.kr/news/articleView.html?idxno=3051270"}]}, {"id": "26bad6a1c84a", "title": "이형일 \"500조 규모 퇴직연금, 수익률 저조…법안 준비 중\"", "summary": "이형일 부총리 겸 재정경제부 장관 후보자가 9월 15일 국회 재정경제기획위원회 인사청문회에서 퇴직연금 제도 개선과 관련해 노사정이 합의한 사항을 바탕으로 법안을 준비하고 있다고 밝혔다. 이 후보자는 퇴직연금 적립금이 500조원까지 올라갔는데 수익률이 저조하다며 노후소득 보장 기능이 제대로 작동하고 있느냐는 논의가 많다고 말했다. 노사정은 지난 2월 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화에 합의했고, 정부는 이를 바탕으로 연내 근로자퇴직급여보장법 개정을 추진하고 있다. 이광재 의원이 미국 401(k)를 거론하며 국가적 시스템이 필요하다고 지적한 데 대한 답변이다.", "category": "제도·규제", "importance": 5, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/economy/trend/6290971", "related": []}, {"id": "ffde5c86587a", "title": "'공시 넘어 사후관리'…디폴트옵션 3년, 최초 평가 시동", "summary": "고용노동부가 올해 디폴트옵션 승인 상품에 대한 첫 정기 평가를 실시한다. 2023년 7월 본격 시행된 디폴트옵션은 올해 3월 기준 41개 금융기관이 324개 상품을 승인받아 운용 중이며, 최초 승인 이후 3년이 지난 상품이 평가 대상으로 장기 성과 수익률과 위험 관리 등을 본다. 고용노동부는 첫 평가인 만큼 성과 저조 사유를 파악하고 개선 방안을 마련하는 데 핵심 의의를 두되, 문제가 지속되는 상품에는 불이익을 부여할 계획이다. 5월에 선정한 정책연구용역은 내년 2월까지 진행된다.", "category": "제도·규제", "importance": 5, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140567806179ad43907_18", "related": []}, {"id": "69dd458f15f4", "title": "퇴직연금 550조 커졌는데…보험사 점유율 20% 무너졌다", "summary": "퇴직연금 시장이 553조원대로 커지는 사이 보험업계 점유율이 20% 아래로 떨어졌다. 상반기 증권사는 4조1000억원 순유입을 기록한 반면 보험사는 1799억원 순유출을 냈다. 실물이전 확대로 가입자가 금융사를 옮기기 쉬워지면서 사업자 간 경쟁이 격화된 결과다. DB형에 집중된 포트폴리오가 약점으로 지목되자 삼성·한화·교보생명 등이 DC형·IRP 강화와 ETF 상품 확대로 대응하고 있다.", "category": "업계·경쟁사", "importance": 5, "source": "뉴데일리", "published": "2026-09-10", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/10/2026091000173.html", "related": []}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}, {"id": "354ed5723a15", "title": "삼성자산운용·미래에셋증권, 푸른씨앗 OCIO 수성", "summary": "국내 최초 기금형 퇴직연금인 푸른씨앗(중소기업퇴직연금기금) 자금을 굴릴 OCIO 전담운용기관에 삼성자산운용과 미래에셋증권이 재선정됐다. 삼성자산운용이 종합평점 92.915점, 미래에셋증권이 90.761점으로 우선협상대상자에 올랐다. 2022년 9월 첫 사업자 선정 이후 4년 만의 재선정이다. 2기 운용 기간은 2026년 9월 1일부터 2030년 8월 31일까지다.", "category": "법인·자금운용", "importance": 4, "source": "한국금융신문", "published": "2026-06-09", "url": "https://www.fntimes.com/html/view.php?ud=202606091842068772179ad43907_18", "related": []}, {"id": "5895ec3e71a7", "title": "20년 만에 퇴직연금 제도 대대적 개편…모든 사업장 의무화 추진", "summary": "정부가 2월 노사정 공동선언을 바탕으로 퇴직연금 제도를 대폭 개편한다. 7월까지 구체적 방안을 확정한 뒤 연내 관련 법 개정을 추진하고, 모든 사업장에 퇴직연금을 단계적으로 의무화할 방침이다. 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화가 핵심 축이다. 1년 미만 근로자 등 사각지대 해소도 함께 추진된다.", "category": "제도·규제", "importance": 4, "source": "대한민국 정책브리핑", "published": "2026-03-11", "url": "https://www.korea.kr/news/policyNewsView.do?newsId=148960665", "related": []}, {"id": "6e2fe502ecb5", "title": "미래에셋증권, 퇴직연금 로보Wrap 출시…AI가 자산배분·매매 맡는다", "summary": "미래에셋증권이 IRP 계좌용 로보어드바이저 일임 서비스 퇴직연금 로보Wrap을 출시했다. 알고리즘이 글로벌 자산배분 포트폴리오를 구성하고 시장 상황에 맞춰 리밸런싱과 매매까지 수행한다. 7월 말 기준 누적 가입 계좌는 14만좌, 누적 가입금액은 8조3000억원이다.", "category": "운용·상품", "importance": 3, "source": "뉴스핌", "published": "2026-08-05", "url": "https://www.newspim.com/news/view/20260805001063", "related": []}, {"id": "676b0ae84927", "title": "신한 적립액 54조 독주…국민·하나, IRP 중심 2위 경쟁", "summary": "2026년 1분기 퇴직연금 랭킹에서 신한이 적립액 54조원으로 선두를 지켰다. 국민은행과 하나은행이 IRP를 중심으로 2위 자리를 놓고 다투고 있다. 은행권 IRP 적립금은 83조7000억원으로 전체 시장의 31.7%를 차지했다.", "category": "업계·경쟁사", "importance": 3, "source": "한국금융신문", "published": "2026-04-21", "url": "https://www.fntimes.com/html/view.php?ud=2026042117435794185e6e69892f_18", "related": []}, {"id": "ecca1d1f70f8", "title": "기금형 퇴직연금은 결과 아닌 과정 책임으로…사외적립의무는 속도조절 요구", "summary": "노사정과 전문가가 참여한 정책 토론회에서 기금형 퇴직연금 도입 방향이 논의됐다. 전문가들은 운용 주체의 책임을 결과가 아닌 과정, 즉 의사결정 절차의 적정성으로 전환해야 한다고 주장했다. 경영계는 중소기업 부담을 이유로 사외적립 의무화의 단계적 시행을 요구했다. 한국노총과 한국경영자총협회, 고용노동부, 한국투자증권 관계자가 참석했다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-04-08", "url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=04598566645414152", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  function render() {
    var doc = DATA.periods[currentPeriod];

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      button.setAttribute('aria-selected', String(PERIODS[index].key === currentPeriod));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    listEl.textContent = '';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
