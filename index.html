  /* ── 팔레트 ───────────────────────────────────────────────

     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나.

     키움 두 색은 kiwoomam.com 로고의 구조를 그대로 옮긴 것이다.
     글자는 감청, 포인트 마크만 마젠타. 그래서 맨 위 줄은 감청이고
     마젠타는 슬로건 한 줄에만 쓴다. 둘을 같은 넓이로 쓰면 서로 죽는다. */
  :root {
    --ink: #101C33;
    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom-deep: #1A399E;
    --kiwoom-point: #EC008C;

    --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',
               'Malgun Gothic', system-ui, sans-serif;
    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #DCE2EC;
      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 감청 원색은 어두운 종이에서 1.9:1까지 떨어져 줄이 보이지 않는다.
         마젠타도 한 단계 올려 짝을 맞춘다. 각각 6.2:1, 6.6:1. */
      --kiwoom-deep: #6E92F5;
      --kiwoom-point: #FF5FB4;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야
     구분선이 아니라 종이의 테두리로 읽힌다. */
  .topline { height: 4px; background: var(--kiwoom-deep); }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;
  }

  .slogan {
    margin: 0 0 0 auto;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom-point);
    white-space: nowrap;
  }

  .hero-date {
    font-family: var(--font-num);
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .search input {
    width: 230px;
    max-width: 44vw;
    padding: 4px 0;
    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */
  .group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;
  }

  .rail button {
    flex: 1 1 0;
    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .range {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
  }

  .filters button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */
  .notice {
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */
  .list { margin: 8px 0 0; }

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);
  }

  article[data-cat="2"] .badge { color: var(--cat-2); }
  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

  details summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

8", "title": "한투증권, “36세 연금 고객 은퇴까지 책임진다”…초개인화 자산관리 승부수", "summary": "한국투자증권이 MTS 연금 서비스를 개편해 DC, IRP, 연금저축 계좌의 자산을 한 화면에서 보는 '연금 홈'을 신설하고 계좌 상태에 맞춘 행동 제안 기능을 넣었다. 회사의 신규 DC 가입자 평균 연령은 2015년 40세에서 지난해 36세로 낮아졌고, 퇴직 후 IRP를 거쳐 연금으로 수령하는 비중은 85%에 달한다. 지난해 말 퇴직연금과 개인연금 적립금은 각각 501조원, 198조원이며, 이 중 개인이 운용에 직접 관여하는 DC·IRP·개인연금 비중은 67.3%다. 회사는 모델포트폴리오 제안, AI 시황 분석, 고객별 인출 전략 제시 등으로 서비스를 넓힐 계획이다.", "category": "업계·경쟁사", "importance": 3, "source": "스포츠서울", "published": "2026-10-12", "url": "https://www.sportsseoul.com/news/read/1639735"}, {"id": "dff7852a8ba3", "title": "푸른씨앗 가입률 12% 그쳐…재정지원 594억원에도 실효성 논란", "summary": "올해 8월 기준 30인 미만 사업장의 푸른씨앗 가입률은 사업장 기준 12.2%(4만4123개소), 근로자 기준 11.2%(19만4441명)에 그쳤다. 근로복지공단은 사용자 지원금 316억원, 가입자 지원금 277억원 등 총 594억원을 집행했다. 가입 후 1년 이내 중도 해지한 사업장은 올해 8월까지 462개소였고, 근로자 중도인출 승인 건수는 2023년 122건에서 2025년 495건으로 늘었으며 올해는 8월까지 489건이다. 김기현 의원은 푸른씨앗이 단순한 목돈 마련 수단으로 전락하지 않도록 근본적인 대책을 마련해야 한다고 강조했다.", "category": "제도·규제", "importance": 3, "source": "핀포인트뉴스", "published": "2026-10-12", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=494235"}, {"id": "b8dfc5effe72", "title": "한국투자증권, 퇴직연금 500조 기업시장 공략…인사·재무 담당자 접점 확대", "summary": "한국투자증권은 지난 8일 서울 여의도 TP타워에서 기업 인사·재무 담당자를 대상으로 '퇴직연금 아카데미'를 열고 기금형 퇴직연금과 사외적립 의무화 등 제도 변화와 경영성과급·정년연장·임금피크제 등 인사·재무 현안을 다뤘다. 고용노동부에 따르면 지난해 말 퇴직연금 적립금은 501조4000억원이며 이 중 DB형은 228조9000억원으로 91.9%가 원리금보장형 상품에 집중돼 있고, 지난해 DB형 수익률은 3.5%로 DC형 8.5%, IRP 9.4%보다 낮았다. 한국투자증권의 지난해 말 퇴직연금 적립금은 20조900억원으로 전년 말보다 27% 증가했다. 회사는 전담 RM을 통한 퇴직연금 관리와 기업금융 서비스를 함께 제공해 기업 고객과의 접점을 넓힐 계획이다.", "category": "법인·자금운용", "importance": 3, "source": "토요경제", "published": "2026-10-12", "url": "https://sateconomy.co.kr/news/view/1065574639722076"}, {"id": "4a6c72a9a56b", "title": "[파워인터뷰] ‘고객동맹’ 앞세운 상품 공급 철학", "summary": "박희찬 미래에셋증권 상품지원부문 대표는 목표전환형 랩어카운트가 고객의 추세적 수익 기회를 가로막는다며 랩은 아예 만들지 않는다고 밝혔다. 그는 커버드콜 ETF가 원금이 보장되지 않는 상품이며 기초자산 급락 시 원금 손실을 피할 수 없다고 경고했다. 퇴직연금 실물이전으로 본격화된 머니무브에 대해서는 자산배분 모델과 디지털 편의성을 핵심 경쟁력으로 꼽았다. 이달 초 출시한 MTS '맵스(MAPS)'로 AI 기반 에이전틱 WM을 구현해 포트폴리오 진단과 관리를 지원한다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "대한경제", "published": "2026-10-12", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610082359331290977"}, {"id": "ddb435b8137a", "title": "[국민논단] 연금개혁, 재정장치보다 사회적 합의가 먼저", "summary": "석재은 한림대 교수는 국회 정책토론회에서 제시된 국고 선투입과 자동조정장치 도입이 모두 현재 한국 연금의 해법으로 적절하지 않다고 주장했다. 국고 선투입은 보험료와 급여의 불균형 비용을 일반재정으로 옮길 뿐이고, 자동조정장치는 이를 연금 삭감으로 메울 위험이 크다는 것이다. 그는 현행 소득대체율 43% 유지와 세대수익비 1.0 이상 보장, 미래세대 보험료율 상한 설정에 먼저 합의해야 한다고 밝혔다. 노후소득체계는 국민연금이 기여 비례 소득보장, 기초연금이 최저소득 바닥, 퇴직연금이 실질적 2층 연금을 맡도록 재설계해야 한다고 제언했다.", "category": "가입자·사회", "importance": 2, "source": "국민일보", "published": "2026-10-12", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000021611&cp=nv"}, {"id": "15ca8797ac08", "title": "한국투자증권, 기업 실무진 대상 '퇴직연금 아카데미' 개최", "summary": "한국투자증권은 지난 8일 서울 여의도 TP타워에서 법인 고객의 인사·재무 실무진을 초청해 '퇴직연금 아카데미'를 열었다고 12일 밝혔다. 첫 세션에서는 기금형 퇴직연금 도입과 퇴직급여 사외적립 의무화에 따른 실무 가이드라인이 소개됐다. 이어 경영성과급 관련 노무 현안과 정년연장 논의에 맞춘 임금피크제 운영 전략, 법인 전담 RM을 활용한 퇴직연금·기업금융 종합 컨설팅 활용 방안이 다뤄졌다.", "category": "법인·자금운용", "importance": 2, "source": "뉴스드림", "published": "2026-10-12", "url": "http://www.newsdream.kr/news/articleView.html?idxno=119732"}, {"id": "4a49a55e21b8", "title": "홍원학 삼성생명 대표, 노블카운티 품고 시니어시장 노린다 [보험사 시니어 전략]", "summary": "삼성생명은 시니어 사업 자회사 삼성노블라이프를 통해 신규 시니어리빙시설 확대를 추진하고 있으며, 지난해 310억원 유상증자와 약 4225억원 규모의 노블카운티 토지·건물 현물출자를 결정했다. 삼성생명의 올해 6월 말 퇴직연금 적립금은 57조3963억원이며 이 중 확정급여형(DB)이 약 43조6000억원으로 전체의 약 76%를 차지한다. 개인 고객 접점 확대를 위해 지난 8월 1일부터 모든 IRP 계좌의 운용관리·자산관리 수수료를 면제했다. 보험금청구권 신탁의 8월 중순 기준 누적 계약금액은 약 8000억원이다.", "category": "업계·경쟁사", "importance": 2, "source": "한국금융신문", "published": "2026-10-12", "url": "https://www.fntimes.com/html/view.php?ud=202610090031387486dd55077bc2_18"}, {"id": "1c839ec41115", "title": "같은 MTS도 사람마다 다르게…증권사, '초개인화' 경쟁", "summary": "증권사 디지털 플랫폼 경쟁이 고객 투자 성향과 보유자산, 생애주기에 따라 다른 정보와 서비스를 제공하는 '초개인화'로 옮겨가고 있다. 한국투자증권은 DB형·DC형·IRP를 각각 관리하던 방식에서 벗어나 고객의 전체 연금자산을 한눈에 관리하는 종합 플랫폼으로 연금 서비스를 개편한다. 미래에셋증권은 'M-STOCK'을 'MAPS'로 전환했고 하나증권은 'ETF MBTI' 등 개인화 기능을 전면에 배치했다. 업계는 연금이 개인화 경쟁이 가장 치열해질 분야로 보고 있다.", "category": "업계·경쟁사", "importance": 2, "source": "비즈월드", "published": "2026-10-12", "url": "http://www.bizwnews.com/news/articleView.html?idxno=148340"}, {"id": "a0a0abab3f0f", "title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "summary": "한국투자증권은 기업 인사·재무 담당자 등 퇴직연금 실무자를 대상으로 지난 8일 서울 여의도 TP타워에서 '퇴직연금 아카데미'를 개최했다고 12일 밝혔다. 행사는 근로자퇴직급여 보장법 개정 추진과 노동정책 변화에 따른 기업 대응 전략을 공유하기 위해 총 3개 세션으로 진행됐다. 첫 세션에서는 기금형 퇴직연금 도입에 따른 운용 효율성 제고 방안과 퇴직급여 사외적립 의무화 대비 실무 가이드라인을 소개했고, 이어 임금피크제 등 노동정책 변화 대응과 '한투 연금 200% 활용법'을 다뤘다. 김도현 개인고객그룹장은 기업들이 제도 변화에 선제적으로 대응할 수 있도록 맞춤형 컨설팅과 실무 지원을 강화하겠다고 말했다.", "category": "법인·자금운용", "importance": 2, "source": "아시아경제", "published": "2026-10-12", "url": "https://view.asiae.co.kr/article/2026101209461462366"}, {"id": "b3e409e359e0", "title": "[만나보니] 한화자산운용 차덕영 본부장 \"연금 다음 승부처는 IRP…인출 솔루션 필요\"", "summary": "차덕영 한화자산운용 퇴직연금사업본부장은 연금 투자에는 단일 자산 집중이 아닌 장기 자산배분이 적합하며 운용사는 수익률 외의 솔루션으로 경쟁해야 한다고 말했다. 그는 국내 디폴트옵션은 가입자가 여러 절차를 거쳐 직접 선택해야 해 '넛지' 효과가 약하다며 제도 개선이 필요하다고 진단했다. 은퇴자 증가로 DB·DC 적립금이 IRP로 이동하고 장기간 연금으로 수령하려는 수요가 커질 것이라며 IRP에서의 인출 솔루션 필요성을 강조했다. 또 ETF와 TDF 등 자산배분형 상품은 서로 다른 수요를 기반으로 공존하며 함께 성장할 것으로 내다봤다.", "category": "업계·경쟁사", "importance": 2, "source": "딜사이트경제TV", "published": "2026-10-12", "url": "https://news.dealsitetv.com/articles/176799"}, {"id": "b40444084890", "title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "summary": "한국투자증권은 지난 8일 서울 여의도 TP타워에서 기업 인사·재무 담당자 등 퇴직연금 실무자를 대상으로 '퇴직연금 아카데미'를 개최했다고 12일 밝혔다. 첫 세션은 '근로자퇴직급여 보장법 전면 개정'을 주제로 기금형 퇴직연금 도입에 따른 운용 효율성 제고 방안과 퇴직급여 사외적립 의무화에 대비한 실무 가이드라인을 소개했다. 두 번째 세션은 경영성과급 등 노동쟁의 대상 확대에 따른 임금 관리와 65세 시대에 대비한 임금피크제 운영 전략을 다뤘고, 마지막 세션에서는 '한투 연금 200% 활용법'과 전담 RM 활용 방안을 안내했다. 김도현 개인고객그룹장은 기업들이 제도 변화에 선제적으로 대응할 수 있도록 맞춤형 컨설팅과 실무 지원을 강화하겠다고 말했다.", "category": "법인·자금운용", "importance": 2, "source": "머니투데이", "published": "2026-10-12", "url": "https://www.mt.co.kr/stock/2026/10/12/2026101210195750915"}, {"id": "9a1cd86c1517", "title": "[生기업TALK] 미래에셋증권, 연금 80조 기반 '통합 투자 플랫폼' 속도", "summary": "미래에셋증권은 퇴직연금과 개인연금을 합친 연금자산이 올해 80조원을 넘어섰다. 회사는 지난 10월 국내 MTS 명칭을 M-STOCK에서 'MAPS(Mirae Asset Portfolio Service)'로 바꾸고 ETF·연금·ISA 등을 한곳에서 확인하는 포트폴리오 관리 기능을 강화했다. 퇴직연금 적립금 증가 규모도 업계 상위권을 유지하고 있다. 회사는 브로커리지 중심 구조에서 벗어나 연금 등 장기 고객자산이 플랫폼 안에 오래 머물도록 하는 전략을 추진하고 있다.", "category": "업계·경쟁사", "importance": 2, "source": "시사캐스트", "published": "2026-10-12", "url": "http://www.sisacast.kr/news/articleView.html?idxno=100892"}, {"id": "ad2ac9107b61", "title": "로보어드바이저 운용자산 2조달러 눈앞…증권사 자산관리 경쟁", "summary": "글로벌 로보어드바이저 운용자산은 약 1조8000억달러로 2028년 약 2조3300억달러에 달할 전망이다. 미래에셋증권의 로보어드바이저 가입금액은 8월 말 기준 8조6323억원이며, 8월 IRP에서 알고리즘이 실제 매매까지 수행하는 '퇴직연금 로보Wrap'을 출시했다. 삼성증권과 한국투자증권도 외부 알고리즘 업체와 협업해 퇴직연금 일임 서비스를 운영하고 있다. 올해 1분기 국내 RA 알고리즘 3개월 평균 수익률은 적극투자형 4.78%로 코스피 상승률 19.89%에 못 미쳤다.", "category": "업계·경쟁사", "importance": 2, "source": "EBN", "published": "2026-10-12", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1727409"}, {"id": "760b3bed1dbe", "title": "700종신 퇴장에 연금보험 부상… 생명보험사, ‘노후소득’ 경쟁", "summary": "단기간 원금도달형 '700종신보험' 판매가 중단되면서 생명보험업계의 상품 경쟁 무게중심이 연금보험으로 이동하고 있다. 삼성생명은 장기 확정이율과 장기 유지보너스를 적용한 '삼성 굴려받는연금보험'을 출시했고, 한화생명은 확정금리와 금리연동형을 결합한 하이브리드연금보험 등 상품군을 운영한다. 교보생명은 일정 기간 금리를 확정한 뒤 금리연동형으로 전환하는 '교보하이브리드연금보험'을 중심으로 대응하고 있다. 업계는 1200%룰과 분급 확대로 GA 영업환경이 바뀌면서 '장기유지·고객관리'로의 전환이 본격화될 가능성이 있다고 본다.", "category": "업계·경쟁사", "importance": 1, "source": "한국보험신문", "published": "2026-10-12", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=93175"}, {"id": "9db13e2c4e3d", "title": "4년 새 118% 뛴 美증시…수익률 5%대 국채가 새 경쟁자", "summary": "S&P500지수는 약세장 저점인 2022년 10월12일 이후 118.4% 상승해 지난 9일 7811.54로 마감했다. 같은 날 미국 10년물 국채 금리는 약 5.24%, 30년물은 약 5.60%로 20여년 만의 높은 수준을 기록했다. 조던 리주토 감마로드캐피털파트너스 CIO는 채권에서 비슷한 수익을 낮은 변동성으로 기대할 수 있다면 연기금과 퇴직연금 운용자들이 주식에서 채권으로 자금을 옮길 유인이 커질 수 있다고 말했다. 카슨투자리서치 집계로는 1950년 이후 4년을 버틴 강세장이 5년차에 평균 약 19% 상승했다.", "category": "운용·상품", "importance": 1, "source": "뉴시스", "published": "2026-10-12", "url": "https://www.newsis.com/view/NISX20261012_0003821989"}, {"id": "fd350091ce6c", "title": "노란우산·탈탄소·계속고용제 입법시 中企 맞춤형 설계 필수", "summary": "중소기업중앙회는 노란우산 해지일시금에 건강보험료를 다시 부과하는 것은 이중부과라며 국민건강보험법 개정을 22대 후반기 국회 입법과제로 요구했다. 2024년 노란우산 해약일시금 중 건보료 부과 대상은 6만8805건으로 건강보험료와 장기요양보험료가 총 314억9000만원에 달했다. 연금저축이나 개인형퇴직연금(IRP)은 중도 해지로 기타소득이 발생해도 건강보험료를 부과하지 않아 형평성 문제가 제기됐다. 중기중앙회는 법정 정년을 일률적으로 연장하면 중소기업 부담이 크다며 중소기업 86%가 선별 재고용을 희망한다고 밝혔다.", "category": "제도·규제", "importance": 1, "source": "중소기업뉴스", "published": "2026-10-12", "url": "http://www.kbiznews.co.kr/news/articleView.html?idxno=114971"}, {"id": "30279972ef3d", "title": "[자산관리와 절세] 은퇴 후 월 현금흐름은 원활하신가요", "summary": "월 300만원을 배당금과 분배금으로 받으면 연간 금융소득이 3600만원이 돼 2000만원 초과분은 금융소득종합과세 대상이 될 수 있다. 은퇴 후 지역가입자로 전환하면 소득뿐 아니라 재산도 건강보험료 산정에 영향을 줄 수 있다. 필자는 월 생활비와 국민연금·퇴직연금·개인연금 수령액을 비교해 부족분을 먼저 파악하라고 제시했다. 월배당 ETF나 고배당주는 표시 분배율보다 세후 현금흐름과 분배금 지속 가능성을 따져봐야 한다고 했다.", "category": "가입자·사회", "importance": 1, "source": "뷰어스", "published": "2026-10-12", "url": "https://theviewers.co.kr/View.aspx?No=4259199"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-10-05 ~ 2026-10-11", "generated_at": "2026-10-12T18:31:07+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "f14fcbcde9b5", "title": "550조 퇴직연금 판 흔든다…국민연금 참여 '기금형 퇴직연금' 법안 발의", "summary": "더불어민주당 이용우 의원이 공동발의 12인과 함께 10월 2일 근로자퇴직급여 보장법 일부개정법률안을 발의했다. 개정안은 국민연금공단 등 공적연금관리기관이 기금형 퇴직연금 사업에 참여할 수 있도록 하고, 시장점유율 상한을 3년차 10%, 4년차 20%, 5년차 30%로 두었다. 2025년 말 퇴직연금 적립금은 501조4000억원이고 2024년 수익률은 4.77%로 같은 해 국민연금 수익률 15.0%를 밑돌았으며, 수수료는 2018년 8956억원에서 2025년 1조7748억원으로 98% 늘었다. 중소기업퇴직연금기금 가입 대상은 현재 100명 미만에서 2028년까지 300명 이하로 확대되고, 법안은 공포 후 1년이 지나 본격 시행된다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-10-07", "url": "http://www.globalepic.co.kr/view.php?ud=2026100708100769037cc35ccc5c_29", "related": [{"title": "'기금형 퇴직연금' 정기국회 논의 본격화 할 듯", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237123"}, {"title": "\"저조한 수익률, 높은 수수료\" 구조인 현행 계약형 퇴직연금 보완하는 기금형 퇴직연금 병행도입 필요", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=493587"}]}, {"id": "e2715a68b129", "title": "[BS모닝] '퇴직연금 500조' 은행 과점 속 수익률 2%대…\"기금형 도입·디폴트 개편 시급\"", "summary": "자본시장연구원이 6일 발표한 '초고령사회 다층노후소득을 위한 퇴직연금제도 개편' 보고서에 따르면 2025년 말 국내 퇴직연금 적립금은 501조4000억 원으로 최근 5년간 2배 가까이 늘었고 업권별 점유율은 은행 52.0%, 증권 26.2%였다. 적립금의 75.4%가 원리금보장상품에 묶여 있고 DB형은 그 비중이 91.9%에 달해 10년 연평균 수익률이 2.64%에 그쳤으며, 디폴트옵션 적립금 53.3조 원도 85.4%가 안정형에 편중돼 연간 수익률이 3.69%였다. 남재우 선임연구위원은 근로자 중심의 독립 수탁법인이 운용하는 기금형 퇴직연금 도입이 필수적이며 비영리 연합형·금융기관 개방형·공공형 3개 유형을 제도 목적에 맞게 설계해야 한다고 제언했고, 국민연금공단의 퇴직연금 위탁운용 참여는 민간 시장 구축 부작용을 이유로 엄격히 배제해야 한다고 밝혔다. 계약형에 대해서는 DB형의 적립금운용계획서(IPS) 실질화와 일임형 OCIO 허용, DC형의 100% 원리금보장형 적격상품 배제와 옵트아웃 방식 전면 개편을 주문하며, 운용체계 개편과 중도 누수 차단이 병행되면 13% 수준인 소득대체율을 20~30%대로 끌어올릴 수 있다고 했다.", "category": "제도·규제", "importance": 4, "source": "세계비즈", "published": "2026-10-07", "url": "http://www.segyebiz.com/newsView/20261006519590", "related": []}, {"id": "08de4b3168d0", "title": "\"안전하다더니 줄줄이 마이너스\"…퇴직 코앞인데 '날벼락'", "summary": "퇴직연금 분석업체 글라이드리서치 집계로 지난달 국내 TDF 197개 가운데 185개가 보수 차감 전 기준 손실을 냈다. 빈티지별 평균 손실률은 TDF2035가 1.10%로 가장 높고 TDF2060이 0.80%로 가장 낮아 차이가 0.30%포인트에 불과했으며, 은퇴가 가장 가까운 TDF2025도 -0.97%로 장기 빈티지보다 손실을 줄이지 못했다. 성과를 가른 것은 환헤지 여부로, 같은 상품의 환헤지형과 환노출형 19쌍을 비교한 결과 환헤지형 수익률이 평균 0.61%포인트 높았다. 미국 10년 만기 국채 금리가 8월 말 연 4.75%에서 지난달 말 연 5.29%로 뛴 영향이며, 연초 이후 누적으로는 197개 중 187개가 여전히 수익을 내고 있다.", "category": "운용·상품", "importance": 4, "source": "한국경제", "published": "2026-10-07", "url": "https://www.hankyung.com/article/2026100663321", "related": []}, {"id": "6c7edca81fd2", "title": "퇴직연금 들어온 개인투자용 국채…금리보다 먼저 볼 '만기'", "summary": "10월 개인투자용 국채 청약 기간은 8~15일이며 퇴직연금계좌에서는 10년물과 20년물만 투자할 수 있다. 10년물 발행 규모는 지난달 1100억원에서 1500억원으로 늘고 20년물은 650억원에서 450억원으로 줄었으며, 만기보유 적용금리는 각각 연 4.790%, 4.950%다. 퇴직연금계좌 청약이 처음 허용된 지난달 청약률은 112%를 기록했다. NH투자증권 100세시대연구소는 만기 사다리 구성과 과세 이연 효과를 장점으로, 1년 경과 후에만 가능한 중도 환매와 장기 금리 고정에 따른 기회비용을 유의점으로 꼽았다.", "category": "운용·상품", "importance": 3, "source": "이투데이", "published": "2026-10-09", "url": "https://www.etoday.co.kr/news/view/2633616", "related": [{"title": "1000만원 넣으면 10년 뒤 1597만원…국채 사볼까", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311873"}, {"title": "'20년 묻어두면 2.6배'…개인투자용 국채에 2.4조 몰렸다", "source": "테크M", "url": "https://www.techm.kr/news/articleView.html?idxno=155929"}, {"title": "미래에셋증권, 개인투자용 국채 10년물 확대..퇴직연금 청약 두 달째", "source": "포쓰저널", "url": "http://www.4th.kr/news/articleView.html?idxno=2119412"}]}, {"id": "7ef94cfb1aa4", "title": "[경제 트렌드] 증권사, 퇴직연금 규모 급증...한국투자증권, 연금 적립·운용·수령까지 은퇴 준비 전 과정 밀착 지원", "summary": "퇴직연금 적립금은 지난 8월 기준 550조원을 웃돌았고 실적배당형 비중은 35%를 기록했으며, 증권사 퇴직연금 규모는 2025년 말 141조6797억원으로 전 금융권 적립금의 29.3%를 차지했다. 증권사 적립금 순위는 미래에셋증권, 삼성증권, 한국투자증권, 현대차증권, NH투자증권 순이다. 한국투자증권은 연금 MTS를 개편해 '나의 총 연금자산'과 개인화 맞춤 알림 기능을 도입했고, 신규 DC 가입자 평균 연령이 2015년 40세에서 2025년 36세로 낮아졌다고 밝혔다. 신한투자증권은 올해 연금고객관리팀을 신설해 신규 DC·IRP 가입 고객 대상 웰컴콜과 연금PB 1대1 매칭, 'Premier 연금컨설팅'을 운영하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "시사캐스트", "published": "2026-10-08", "url": "http://www.sisacast.kr/news/articleView.html?idxno=100731", "related": [{"title": "한국투자증권, 연금 MTS 개편…“적립·운용·수령까지 밀착 지원”", "source": "더퍼블릭", "url": "https://www.thepublic.kr/news/articleView.html?idxno=321335"}, {"title": "한국투자증권, 연금 MTS 개편 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31774"}]}, {"id": "6da1ff9b2cf1", "title": "'2164억 체불' 대유위니아…3년 연속 퇴직연금 적립 미달", "summary": "대유위니아 계열 가전 3사(위니아·위니아전자·위니아전자MF)가 2022년부터 2024년까지 3년 연속 DB형 퇴직연금 법정 최소적립금을 채우지 못한 것으로 김주영 의원이 고용노동부에서 받은 자료에서 나타났다. 위니아전자의 최소적립금 대비 실제 적립 비율은 2022년 5.86%, 2023년 5.88%, 2024년 5.68%였고 위니아전자MF는 같은 기간 14.11%에서 9.45%로 떨어졌다. 2022년부터 지난달 3일까지 3사의 전체 체불액은 2164억원이며 이 중 체불 퇴직금은 858억원이다. 고용노동부가 이들 계열사에 관련 과태료를 부과한 사례는 없었다.", "category": "법인·자금운용", "importance": 3, "source": "뉴시스", "published": "2026-10-10", "url": "https://www.newsis.com/view/NISX20261010_0003820502", "related": [{"title": "대유위니아 가전 3사, 퇴직연금 법정 적립금 3년 연속 미달", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5070068"}]}, {"id": "fcba047b4874", "title": "머니무브 주춤, 더 치열해진 증권사 퇴직연금 경쟁", "summary": "올해 2분기말 기준 퇴직연금 시장은 553조8949억원이며 증권사 비중은 지난해말 26.47%에서 2분기 29.8%로 늘었다. 증권업종 적립금 165조원 중 미래에셋증권이 52조원(31.5%)을 차지하고 삼성증권 28조원, 한국투자증권 26조원이 뒤를 잇는다. 3분기 증시 조정으로 4~6월 DB형에서 DC형으로 전환한 증권사 가입자의 7월·8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 한국투자증권의 MTS 연금서비스 전면개편, 신한투자증권의 연금고객관리팀 신설, NH투자증권의 법인고객 관리시스템(CIS) 구축 등 증권사들이 타사 고객 유치 경쟁에 나서고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "비즈워치", "published": "2026-10-09", "url": "https://news.bizwatch.co.kr/article/market/2026/10/08/0005", "related": [{"title": "퇴직연금 165조 잡은 증권사…다음 승부처는 '고객관리'", "source": "뉴스웨이", "url": "https://www.newsway.co.kr/news/view?ud=2026100713530728574"}]}, {"id": "e6b3c61aef09", "title": "퇴직연금 실물이전 1년 8개월 16조…은행서 증권사로 5조 옮겨갔다", "summary": "2024년 10월 시작한 퇴직연금 실물이전으로 올해 6월 말까지 금융사를 갈아탄 퇴직연금은 15조8699억원이며, 이 중 은행에서 증권사로 넘어간 돈이 5조2225억원으로 전체 이전액의 3분의 1이다. 올해 상반기 이전액은 6조9000억원으로 지난해 같은 기간의 두 배가 넘었고, 제도별로는 IRP 이전액이 6조7695억원으로 가장 많았다. 받는 금융사가 같은 상품을 취급하지 않으면 매도해야 하고, 디폴트옵션 운용 자산과 보험계약 형태 적립금은 이전 대상이 아니다. 금융감독원과 예탁결제원 등 17개 기관의 TF는 이달 DC형에서 타사 IRP로 직행하는 전산 개발을 시작해 연말 도입을 목표로 한다.", "category": "운용·상품", "importance": 3, "source": "매일신문", "published": "2026-10-11", "url": "https://www.imaeil.com/page/view/2026101018515378392", "related": []}, {"id": "e0734bab8e9b", "title": "\"방치 계좌 해소 핵심 과제...위험자산 투자한도 현 70%보다 늘려야\"", "summary": "송상은 KB증권 연금그룹장은 11일 이데일리 인터뷰에서 고객의 무관심이 퇴직연금 저수익률의 가장 큰 원인이라며 방치된 계좌 해소를 핵심 과제로 집중 추진하고 있다고 밝혔다. KB증권은 고객 행동 데이터를 기반으로 현금성 자산 비중이 높거나 수익률이 낮은 고객에게 유형별 맞춤 콘텐츠와 안내 문자를 보내 리밸런싱을 유도하고 있으며, 금융감독원 공시 기준 올해 2분기 DC형과 IRP의 원리금비보장 수익률은 각각 60.13%, 52.98%였다. 연금본부 조직은 60여명에서 100명까지 늘었고 디폴트옵션 사전등록, ETF 적립식 매수, 로보투자일임 등 자동투자 서비스를 지원한다. 송 전무는 현 70%인 위험자산 투자한도를 늘려야 하며 발행어음과 IMA 상품 투자 허용도 긍정적 효과를 가져온다고 말했다.", "category": "업계·경쟁사", "importance": 3, "source": "이데일리", "published": "2026-10-11", "url": "https://www.edaily.co.kr/News/Read?newsId=01321846645611936&mediaCodeNo=257", "related": []}, {"id": "cbbb7085e290", "title": "퇴직급여 '일시금'…은퇴, 사라지는 '노후 안전판'", "summary": "퇴직연금 적립금은 2025년 말 501조4000억원에서 올해 6월 553조8779억원으로 늘어 연말 600조원을 넘어설 것으로 추산된다. 그러나 2025년 기준 퇴직급여 수급 계좌의 83.5%가 일시금을 택했고, 연금 수령 계좌 비중은 16.5%에 그쳤다. 금액 기준 연금 수령 비중은 61.6%였으며, 연금 선택 계좌의 평균 적립금은 1억4900만원인 반면 일시금 선택 계좌는 1833만원에 불과했다. 한국노동연구원 김동진 부연구위원은 퇴직소득세 과세체계를 연금 수급 전제로 개편하고 중도인출 요건 강화, 이직 시 IRP 해지 제한 등이 필요하다고 제언했다.", "category": "가입자·사회", "importance": 3, "source": "뉴스토마토", "published": "2026-10-11", "url": "http://www.newstomato.com/ReadNews.aspx?no=1316124&inflow=N", "related": []}, {"id": "610dc1a71d7a", "title": "700조 연금시장 쟁탈전…증권사로 '머니무브'", "summary": "지난해 말 퇴직연금과 개인연금을 합친 국내 연금시장 규모는 약 700조 원으로 1년 전보다 90조 원 가까이 불어났고, 가입자가 직접 운용하는 DC형·IRP·개인연금 비중이 67.3%에 달한다. 지난 6월 퇴직연금 시장에 뛰어든 키움증권은 ETF 실시간 거래와 적립식 투자 등을 앞세워 넉 달 만에 적립금 1,900억 원가량을 모았다. 한국투자증권도 MTS를 전면 개편해 흩어진 연금 자산을 한눈에 보여주고 자산 진단에서 투자까지 바로 이어지도록 했다. 퇴직연금 실물 이전 제도 시행 이후 은행에서 증권사로 옮겨간 퇴직연금은 5조 원을 넘어섰다.", "category": "업계·경쟁사", "importance": 3, "source": "연합뉴스TV", "published": "2026-10-10", "url": "http://www.yonhapnewstv.co.kr/news/MYH20261010095123B1O", "related": []}, {"id": "0caba587f9cc", "title": "“국민연금 19% 벌 때, 29개 기금은 2%대”…수익률 최대 8배 격차 왜?", "summary": "정부가 운용하는 68개 기금의 지난해 여유자금 운용수익률이 최고 18.97%에서 최저 2.27%까지 8배 넘게 차이 난 것으로 나타났다. 국민연금기금이 18.97%로 가장 높았고 사립학교교직원연금기금(18.93%)이 뒤를 이었으며, 공공자금관리기금은 2.27%로 가장 낮았다. 연기금투자풀에 여유자금을 전액 맡긴 42개 기금 중 27개는 수익률이 3%에 못 미쳤고, 투자풀 상품별 수익률은 주식형 38.34%, 채권형 2.63%였다. 정성호 의원은 수익률을 1%포인트만 높여도 8000억원의 국부를 창출할 수 있다며 기획예산처의 관리를 촉구했다.", "category": "법인·자금운용", "importance": 3, "source": "매일경제", "published": "2026-10-10", "url": "https://www.mk.co.kr/article/12172697", "related": []}, {"id": "abbeee11066a", "title": "노후자금 환율 방어 동원 논란에도…국민연금 “외환 관련 공개 불가”", "summary": "서영석 더불어민주당 의원이 국민연금으로부터 제출받은 자료에 따르면 국민연금은 환헤지 규모, 비용, 환차손익 공개를 요청받았으나 시장 교란과 기금 불이익이 예상된다며 공개를 거부했다. 국민연금은 원·달러 환율이 1500원을 넘자 올해부터 전략적 환헤지를 가동했고, 4월에는 전략적 환헤지 비율을 10%에서 15%로 상향했다. 환율이 1550원선을 돌파했던 6월에는 선물환 매도에 나서 환율이 1510원대 초반으로 하락했다. 14일 국민연금 국정감사에서는 환율 방어 동원과 리밸런싱 유예 여부를 두고 공방이 예상된다.", "category": "가입자·사회", "importance": 3, "source": "서울경제", "published": "2026-10-09", "url": "https://www.sedaily.com/article/20099720", "related": []}, {"id": "07a9e437bd0c", "title": "내년 1분기 기초연금 물가인상분 소급 지급…李대통령 “양극화 완화에 필요”", "summary": "정부가 내년 1분기 기초연금에 반영하지 않기로 했던 물가인상분을 소득 하위 45% 노인에게 4월 개편 시 소급 지급하기로 했다. 당초 예산안은 내년 1~3월 기준연금액을 올해와 같은 월 34만 9700원으로 묶어, 하위 45% 516만 8000명이 석 달간 2만 7270원을 덜 받는 구조였다. 이재명 대통령도 정은경 복지부 장관의 게시물을 공유하며 저소득층 추가 지원은 양극화 완화를 위해 필요한 조치라고 밝혔다. 내년 4월부터 하위 30%는 월 최대 38만 원, 30~45%는 월 35만 8790원을 받고 45~70%는 월 34만 9700원으로 동결된다.", "category": "가입자·사회", "importance": 3, "source": "서울경제", "published": "2026-10-08", "url": "https://www.sedaily.com/article/20099327", "related": []}, {"id": "dffb22a243d1", "title": "국민연금 크레딧 '사전 지원'하면 수십조 아낀다? \"재정 안정·미래 세대 부담 줄이는 방안 모색해야\"", "summary": "국민연금 크레딧은 출산·군 복무 시점이 아니라 노령연금 수령 시점에 가입 기간을 합산하는 사후 지원 방식이라 시간이 갈수록 지출이 불어난다. 국민연금연구원은 사유 발생 시점에 보험료를 대납하는 사전 지원으로 바꾸면 2093년까지 약 87조8000억원의 크레딧 지출을 줄일 수 있다고 분석한 바 있다. 지난 6월 기준 출산 크레딧 누적 수급자 1만2052명 중 여성은 385명(3.2%)에 그쳤다. 보건복지부는 사전 지원 전환을 검토 중이나 기획예산처는 단기 지출 급증을 이유로 신중한 입장이다.", "category": "가입자·사회", "importance": 3, "source": "아시아경제", "published": "2026-10-08", "url": "https://view.asiae.co.kr/article/2026100809461398787", "related": []}, {"id": "7af9d30a6229", "title": "퇴직연금 1000억 돌파한 키움증권…표영대 본부장 \"AI PB로 차별화\"[SS인터뷰]", "summary": "지난 6월 퇴직연금 사업을 시작한 키움증권은 첫 달 IRP 적립금 649억 원을 확보한 뒤 7월 24일 전체 적립금 1000억 원을 넘어섰다. 표영대 연금플랫폼본부장은 개인 IRP를 시작으로 기업형 DC·DB까지 영역을 넓혀 2035년 퇴직연금 시장점유율 10%, 적립금 기준 업계 톱5 진입을 목표로 제시했다. 키움증권은 MTS '영웅문S#'에서 ETF 실시간 거래와 적립식 투자, 자동감시주문을 제공하고 원리금보장상품과 실적배당상품의 96% 이상을 상품군으로 갖춰 실물이전 수요를 노린다. 오프라인 지점이 없는 한계는 로보어드바이저 도입과 가칭 'AI PB' 개발로 보완할 계획이다.", "category": "업계·경쟁사", "importance": 3, "source": "스포츠서울", "published": "2026-10-07", "url": "https://www.sportsseoul.com/news/read/1639392", "related": []}, {"id": "f732754d6138", "title": "테마 쪼개고 채권 섞고…ETF 신상품 설계 다변화 [ETF 지형도 변화]②", "summary": "한국거래소 신규 상장 ETF를 집계한 결과 올해 상반기 상장 99개 중 주식·채권 혼합형은 11개(11.1%)였으나, 3분기(9월 22일까지)에는 41개 중 11개로 비중이 26.8%까지 높아졌다. 주식 편입 비중이 50% 미만인 채권혼합형은 적립금의 100%까지 투자할 수 있는 '투자위험을 낮춘 상품'에 속해 퇴직연금 계좌에서 쓰임새가 크다. 금융위원회는 2023년 11월 퇴직연금감독규정을 개정해 이들 상품의 주식 편입 한도를 40% 이내에서 50% 미만으로 높였고, DC형·IRP 투자자는 위험자산 한도 70%를 주식형 ETF로 채운 뒤 나머지 30%를 채권혼합형에 배분할 수 있다. 한수진 삼성증권 선임연구원은 퇴직연금계좌를 통한 ETF 투자금액이 3년 연속 100%대 증가율을 보이고 있다고 분석했다.", "category": "운용·상품", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2632913", "related": []}, {"id": "c4dab2068ab2", "title": "복지부 국감 개막⋯기초연금 '반쪽 개편'·국민연금 손실 추궁 [국감]", "summary": "국회 보건복지위원회가 7일 보건복지부와 질병관리청을 시작으로 이틀간 국정감사에 들어갔다. 핵심 쟁점은 연금제도 개편안으로, 복지부가 추진해 온 저소득층 노인 중심 '하후상박' 기초연금 개편이 사회적 논의 부족을 이유로 1년짜리 단기 계획에 그친 점이 '반쪽 개편'이라는 지적을 받을 전망이다. 국민연금은 기금 재정 안정성과 함께 자산배분 리밸런싱 한시 유예, 국내 주식 목표 비중 상향(14.9%→20.8%)에 따른 증시 급락 손실 문제가 검증대에 오른다. 복지위 국감은 14일 국민연금공단, 16일 국민건강보험공단·건강보험심사평가원을 거쳐 27일 종합감사로 마무리된다.", "category": "제 l?idxno=813516"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "f14fcbcde9b5", "title": "550조 퇴직연금 판 흔든다…국민연금 참여 '기금형 퇴직연금' 법안 발의", "summary": "더불어민주당 이용우 의원이 공동발의 12인과 함께 10월 2일 근로자퇴직급여 보장법 일부개정법률안을 발의했다. 개정안은 국민연금공단 등 공적연금관리기관이 기금형 퇴직연금 사업에 참여할 수 있도록 하고, 시장점유율 상한을 3년차 10%, 4년차 20%, 5년차 30%로 두었다. 2025년 말 퇴직연금 적립금은 501조4000억원이고 2024년 수익률은 4.77%로 같은 해 국민연금 수익률 15.0%를 밑돌았으며, 수수료는 2018년 8956억원에서 2025년 1조7748억원으로 98% 늘었다. 중소기업퇴직연금기금 가입 대상은 현재 100명 미만에서 2028년까지 300명 이하로 확대되고, 법안은 공포 후 1년이 지나 본격 시행된다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-10-07", "url": "http://www.globalepic.co.kr/view.php?ud=2026100708100769037cc35ccc5c_29", "related": [{"title": "'기금형 퇴직연금' 정기국회 논의 본격화 할 듯", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237123"}, {"title": "\"저조한 수익률, 높은 수수료\" 구조인 현행 계약형 퇴직연금 보완하는 기금형 퇴직연금 병행도입 필요", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=493587"}]}, {"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "7ef94cfb1aa4", "title": "[경제 트 , "source": "비즈워치", "published": "2026-10-09", "url": "https://news.bizwatch.co.kr/article/market/2026/10/08/0005", "related": [{"title": "퇴직연금 165조 잡은 증권사…다음 승부처는 '고객관리'", "source": "뉴스웨이", "url": "https://www.newsway.co.kr/news/view?ud=2026100713530728574"}]}, {"id": "c4dab2068ab2", "title": "복지부 국감 개막⋯기초연금 '반쪽 개편'·국민연금 손실 추궁 [국감]", "summary": "국회 보건복지위원회가 7일 보건복지부와 질병관리청을 시작으로 이틀간 국정감사에 들어갔다. 핵심 쟁점은 연금제도 개편안으로, 복지부가 추진해 온 저소득층 노인 중심 '하후상박' 기초연금 개편이 사회적 논의 부족을 이유로 1년짜리 단기 계획에 그친 점이 '반쪽 개편'이라는 지적을 받을 전망이다. 국민연금은 기금 재정 안정성과 함께 자산배분 리밸런싱 한시 유예, 국내 주식 목표 비중 상향(14.9%→20.8%)에 따른 증시 급락 손실 문제가 검증대에 오른다. 복지위 국감은 14일 국민연금공단, 16일 국민건강보험공단·건강보험심사평가원을 거쳐 27일 종합감사로 마무리된다.", "category": "제도·규제", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2633071", "related": [{"title": "기초연금 '반쪽' 개편·국립대병원 첫 등판…복지부 국감 쟁점은", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261003_0003813472"}]}, {"id": "3222e4df0aa6", "title": "[연금개혁] '골든타임' 놓치면 무용지물…국고 GDP 1% 지금 투입 땐 31년 연장, 고갈 후엔 1년뿐", "summary": "국회예산정책처 분석에 따르면 현행 제도가 유지될 경우 국민연금 기금은 2069년에 소진된다. 정부가 지금부터 매년 GDP의 1%를 투입하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥난 2069년부터 투입하면 1년만 연장된다. 기금 수익률을 2%포인트 높이면 2120년까지 흑자를 유지할 수 있다.", "category": "제도·규제", "importance": 3, "source": "CBC뉴스", "published": "2026-10-01", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=611066", "related": [{"title": "\"국민연금 수익률 2%p 높이면 2120년까지 기금 고갈 없어\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260929100600530?input=1195m"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": "2026-09-20", "url": "http://www.smarttimes.co.kr/news/articleView.html?idxno=49113", "related": [{"title": "잦은 이직에 끊기는 퇴직자산…사회복지인 전용 퇴직연금 논의 본격화", "source": "라이브뉴스", "url": "https://www.livesnews.com/news/article.html?no=64332"}]}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발생했으나 회수된 금액은 없다.", "category": "법인·자금운용", "importance": 3, "source": "시장경제신문", "published": "2026-09-16", "url": "https://www.meconomynews.com/news/articleView.html?idxno=201626", "related": [{"title": "홈플러스, 9개월간 임금체불 3871억…퇴직금도 미지급", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1690418/"}]}]}, "yearly": {"period": "yearly", "key": "current", "label": "2025-10-12 ~ 2026-10-11", "generated_at": "2026-10-12T18:31:21+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": [{"title": "퇴직연금 문 열린 개인용 국채…첫 선택은 10년물에 쏠렸다", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436449"}, {"title": "개인 퇴직연금 계좌 통해 장기국채 투자 길 열렸다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712685/2"}, {"title": "개인 국채투자, '퇴직연금서 투자'에 흥행…9월 청약서 초과 수요", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260917099600008"}, {"title": "\"1억 넣어두면 20년 뒤 2.6억\" 468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "f14fcbcde9b5", "title": "550조 퇴직연금 판 흔든다…국민연금 참여 '기금형 퇴직연금' 법안 발의", "summary": "더불어민주당 이용우 의원이 공동발의 12인과 함께 10월 2일 근로자퇴직급여 보장법 일부개정법률안을 발의했다. 개정안은 국민연금공단 등 공적연금관리기관이 기금형 퇴직연금 사업에 참여할 수 있도록 하고, 시장점유율 상한을 3년차 10%, 4년차 20%, 5년차 30%로 두었다. 2025년 말 퇴직연금 적립금은 501조4000억원이고 2024년 수익률은 4.77%로 같은 해 국민연금 수익률 15.0%를 밑돌았으며, 수수료는 2018년 8956억원에서 2025년 1조7748억원으로 98% 늘었다. 중소기업퇴직연금기금 가입 대상은 현재 100명 미만에서 2028년까지 300명 이하로 확대되고, 법안은 공포 후 1년이 지나 본격 시행된다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-10-07", "url": "http://www.globalepic.co.kr/view.php?ud=2026100708100769037cc35ccc5c_29", "related": [{"title": "'기금형 퇴직연금' 정기국회 논의 본격화 할 듯", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237123"}, {"title": "\"저조한 수익률, 높은 수수료\" 구조인 현행 계약형 퇴직연금 보완하는 기금형 퇴직연금 병행도입 필요", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=493587"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "7ef94cfb1aa4", "title": "[경제 트렌드] 증권사, 퇴직연금 규모 급증...한국투자증권, 연금 적립·운용·수령까지 은퇴 준비 전 과정 밀착 지원", "summary": "퇴직연금 적립금은 지난 8월 기준 550조원을 웃돌았고 실적배당형 비중은 35%를 기록했으며, 증권사 퇴직연금 규모는 2025년 말 141조6797억원으로 전 금융권 적립금의 29.3%를 차지했다. 증권사 적립금 순위는 미래에셋증권, 삼성증권, 한국투자증권, 현대차증권, NH투자증권 순이다. 한국투자증권은 연금 MTS를 개편해 '나의 총 연금자산'과 개인화 맞춤 알림 기능을 도입했고, 신규 DC 가입자 평균 연령이 2015년 40세에서 2025년 36세로 낮아졌다고 밝혔다. 신한투자증권은 올해 연금고객관리팀을 신설해 신규 DC·IRP 가입 고객 대상 웰컴콜과 연금PB 1대1 매칭, 'Premier 연금컨설팅'을 운영하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "시사캐스트", "published": "2026-10-08", "url": "http://www.sisacast.kr/news/articleView.html?idxno=100731", "related": [{"title": "한국투자증권, 연금 MTS 개편…“적립·운용·수령까지 밀착 지원”", "source": "더퍼블릭", "url": "https://www.thepublic.kr/news/articleView.html?idxno=321335"}, {"title": "한국투자증권, 연금 MTS 개편 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31774"}]}, {"id": "6da1ff9b2cf1", "title": "'2164억 체불' 대유위니아…3년 연속 퇴직연금 적립 미달", "summary": "대유위니아 계열 가전 3사(위니아·위니아전자·위니아전자MF)가 2022년부터 2024년까지 3년 연속 DB형 퇴직연금 법정 최소적립금을 채우지 못한 것으로 김주영 의원이 고용노동부에서 받은 자료에서 나타났다. 위니아전자의 최소적립금 대비 실제 적립 비율은 2022년 5.86%, 2023년 5.88%, 2024년 5.68%였고 위니아전자MF는 같은 기간 14.11%에서 9.45%로 떨어졌다. 2022년부터 지난달 3일까지 3사의 전체 체불액은 2164억원이며 이 중 체불 퇴직금은 858억원이다. 고용노동부가 이들 계열사에 관련 과태료를 부과한 사례는 없었다.", "category": "법인·자금운용", "importance": 3, "source": "뉴시스", "published": "2026-10-10", "url": "https://www.newsis.com/view/NISX20261010_0003820502", "related": [{"title": "대유위니아 가전 3사, 퇴직연금 법정 적립금 3년 연속 미달", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5070068"}]}, {"id": "fcba047b4874", "title": "머니무브 주춤, 더 치열해진 증권사 퇴직연금 경쟁", "summary": "올해 2분기말 기준 퇴직연금 시장은 553조8949억원이며 증권사 비중은 지난해말 26.47%에서 2분기 29.8%로 늘었다. 증권업종 적립금 165조원 중 미래에셋증권이 52조원(31.5%)을 차지하고 삼성증권 28조원, 한국투자증권 26조원이 뒤를 잇는다. 3분기 증시 조정으로 4~6월 DB형에서 DC형으로 전환한 증권사 가입자의 7월·8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 한국투자증권의 MTS 연금서비스 전면개편, 신한투자증권의 연금고객관리팀 신설, NH투자증권의 법인고객 관리시스템(CIS) 구축 등 증권사들이 타사 고객 유치 경쟁에 나서고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "비즈워치", "published": "2026-10-09", "url": "https://news.bizwatch.co.kr/article/market/2026/10/08/0005", "related": [{"title": "퇴직연금 165조 잡은 증권사…다음 승부처는 '고객관리'", "source": "뉴스웨이", "url": "https://www.newsway.co.kr/news/view?ud=2026100713530728574"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}]}}}</script>

    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
