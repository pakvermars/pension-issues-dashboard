    --rule: #C9CEDA;

    --hot: #B23A2E;

    --cat-2: #1F5C4E;

    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;

      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;

  * { box-sizing: border-box; }

    color: var(--ink);
    font-family: var(--font-ui);

  a { color: inherit; }

    margin: 0 0 14px;

    font-weight: 400;

    margin: 0;

  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero {

    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

    padding-bottom: 8px;
  }

    letter-spacing: 0.22em;

    font-size: 0.85rem;

    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;

    font-weight: 700;
    letter-spacing: 0.14em;

    letter-spacing: 0.02em;

    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;

의 못 푼 숙제", "summary": "키움증권의 올해 상반기 자산관리(WM) 관련 수수료가 86억4000만원으로 전년 동기 대비 0.2% 늘어 약 5년간 정체 상태라고 보도했다. 같은 기간 10대 증권사의 평균 WM 수수료는 164.7% 증가했다. 키움증권은 장기자금을 확보할 수 있는 퇴직연금 시장에 지난 6월에서야 진입했다. 기사는 퇴직연금이 자금이 장기간 유지되고 펀드·ETF·채권 판매로 이어질 수 있어 WM의 핵심 기반으로 꼽힌다고 전했으며, 회사는 퇴직연금 진출을 계기로 자산관리 수수료가 회복될 것으로 기대한다고 밝혔다.", "category": "업계·경쟁사", "importance": 3, "source": "대한금융신문", "published": "2026-09-23", "url": "https://www.kbanker.co.kr/news/articleView.html?idxno=226003"}, {"id": "50f1ea766e5f", "title": "은행 자산관리센터 늘어나는데 영업점은 준다", "summary": "금융감독원 금융통계정보시스템 기준 올해 6월말 일반은행 국내 지점은 2932개로 1년 전보다 92개(3.0%) 줄었고, 2018년 6월말 4109개와 비교하면 8년새 1177개(28.6%)가 사라졌다. 같은 기간 출장소는 698개로 74개(11.9%) 늘어 전체 점포는 3648개에서 3630개로 18개 줄어드는 데 그쳤다. 은행들은 줄인 지점 자리를 NH농협은행 'NH All100종합자산관리센터' 100개 확대, 우리은행 '투체어스 W 잠실', 신한은행 '신한 Premier PWM 센트럴용산센터' 같은 자산관리 특화점포로 채우고 있다. 손재성 숭실대 교수는 대출업무가 AI로 본점에 집중되면서 영업점에는 예금·펀드·방카슈랑스·퇴직연금으로 고객 포트폴리오를 관리하는 자산관리 업무가 남을 것으로 전망했다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스프리존", "published": "2026-09-23", "url": "https://www.newsfreezone.co.kr/news/articleView.html?idxno=710850"}, {"id": "0fb6c0d86e93", "title": "[이슈프리즘] 국내 주식 역차별하는 연금", "summary": "조재길 한국경제 편집국 부국장이 연금계좌에서 국내 주식형 ETF가 역차별을 받는 과세 구조를 지적했다. 국내 주식을 60% 이상 담은 주식형 ETF는 일반계좌에서 매매 차익에 세금을 내지 않지만, 같은 상품을 개인·퇴직연금에 담으면 연금을 수령할 때마다 3.3~5.5%의 소득세를 부담해야 한다. 반면 해외 주식형 ETF는 일반계좌에서 배당소득세 15.4% 또는 양도소득세 22%를 내는 데 비해 연금계좌에서는 과세이연과 최고 5.5% 저율과세를 적용받아 유리하다. 퇴직연금 내 국내 주식형 ETF 비중은 전체의 2%에도 미치지 못하는 것으로 추정되며, 필자는 연금에 담는 국내 주식형 ETF를 일반계좌와 똑같이 과세 대상에서 제외해야 한다고 주장했다.", "category": "제도·규제", "importance": 3, "source": "한국경제", "published": "2026-09-23", "url": "https://www.hankyung.com/article/2026092218091"}, {"id": "2b542eaa1497", "title": "교보자산운용, 사명 변경 완료…교보생명 100% 자회사로 새출발", "summary": "교보악사자산운용이 22일 임시주주총회에서 사명을 교보자산운용으로 바꾸는 안건을 의결했다. 교보생명이 지난달 BNP파리바자산운용홀딩스가 보유한 지분 50%(300만주)를 1075억원에 인수하면서 2008년부터 18년간 이어진 합작체제가 끝났다. 회사는 ETF와 퇴직연금, 기관 고객 솔루션 부문을 중심으로 조직을 재편해 퇴직연금 위주의 개인 고객 기반을 확대한다는 계획이다. 퇴직연금 부문에서는 파워 인덱스 펀드를 활용하면서 타깃데이트펀드(TDF)와 글로벌 주식·채권으로 상품군을 넓힌다.", "category": "업계·경쟁사", "importance": 3, "source": "머니투데이", "published": "2026-09-23", "url": "https://www.mt.co.kr/finance/2026/09/23/2026092309342871226"}, {"id": "d7494cd066db", "title": "메리츠證도 발행어음 인가 '초읽기'…'60조원' 시장 경쟁 불붙는다", "summary": "금융위원회가 23일 오후 정례회의에서 메리츠증권의 종합금융투자사업자 지정과 단기금융업 인가안을 심의·의결할 예정이다. 인가가 나면 메리츠증권은 한국투자증권·미래에셋증권·NH투자증권·KB증권·키움증권·하나증권·신한투자증권·삼성증권에 이어 국내 9번째 발행어음 사업자가 된다. 발행어음 사업자는 자기자본 4조원 이상 종합금융투자사업자로, 자기자본의 최대 200%까지 자금을 조달할 수 있다. 6월 말 기준 발행어음 잔액은 55조9291억원으로, 메리츠증권이 가세하면 60조원대 시장 진입도 가시권이라는 평가가 나온다.", "category": "업계·경쟁사", "importance": 3, "source": "매일신문", "published": "2026-09-23", "url": "https://www.imaeil.com/page/view/2026092309590351579"}, {"id": "14fb5cec88a4", "title": "\"시장 변동성에 흔들리면 안 돼…장기 수익률로 증명할 것\"", "summary": "정환 NH투자증권 연금자산관리본부 본부장은 퇴직연금이 투자기간이 긴 자산이어서 단기적 시장 충격을 회복할 시간을 갖는다고 말했다. NH투자증권의 2분기 기준 5년 수익률은 DC형 연 12.57%, IRP형 연 11.83%였고 IRP 10년 수익률은 연 10.35%였다. 올해 상반기 DC·IRP의 실적배당형 비중은 70%를 넘었다. 정 본부장은 변동성이 클수록 시장의 단기 방향을 맞히는 능력이 아니라 충분한 투자기간 확보와 포트폴리오 분산이 필요하다고 밝혔다.", "category": "업계·경쟁사", "importance": 3, "source": "이데일리", "published": "2026-09-23", "url": "https://www.edaily.co.kr/News/Read?newsId=03014326645583072&mediaCodeNo=257"}, {"id": "b416c110b081", "title": "주식모으기 2주년… 91% \"계속 이용\"", "summary": "삼성증권이 적립식 투자 서비스 '주식 모으기' 출시 2주년을 맞아 이용 현황을 분석한 결과 가입 기간이 6개월 이상인 고객 중 91%가 서비스를 계속 이용하고 있었다. 서비스 경험 고객의 67%는 2건 이상을 복수로 운용했다. 전체 모으기 주문 금액의 약 3분의 2와 이용 계좌 수의 약 70%가 중개형 ISA, 개인연금, 퇴직연금에 집중됐다. 중개형 ISA와 연금 계좌에서는 지수 추종 및 배당·금 상품 선호가 뚜렷했고, 연령대와 무관하게 미국 대표 지수 ETF 수요가 높게 나타났다.", "category": "운용·상품", "importance": 2, "source": "동아일보", "published": "2026-09-23", "url": "https://www.donga.com/news/Economy/article/all/20260922/134714021/2"}, {"id": "b7e3aff56341", "title": "[기고] 캐나다 연금개혁 이야기", "summary": "장재혁 전 국민연금공단 기획이사가 캐나다 연금개혁 사례를 소개했다. 캐나다는 1995년 연금 고갈 위기에 직면해 보험료 인상, 연금투자기관 설립, 소득대체율 인상이라는 세 가지 전략을 함께 추진했다. 1997년 개혁 이후 캐나다 연금투자기관이 20년간 연평균 10%에 이르는 운용성과를 내면서 소득대체율을 25%에서 33.3%로 올릴 수 있었다. 필자는 한국 국민연금도 국고 보조금에 의존하지 않는 자립형 방식으로 '더 내고 더 받는' 모델을 운영하고 있으며 작년 개혁이 시의적절했다고 평가했다.", "category": "제도·규제", "importance": 2, "source": "뉴스핌", "published": "2026-09-23", "url": "https://www.newspim.com/news/view/20260922001087"}, {"id": "c391f101ab4f", "title": "[국민연금 노후설계⑭] 국민연금 수급액 높이는 7가지 방법", "summary": "국민연금 수급액을 늘리는 방법 일곱 가지를 정리했다. 가입기간은 최소 10년을 채워야 하고 60세 이후에도 65세까지 임의계속가입이 가능하며, 추후납부는 최대 119개월까지 할 수 있다. 2026년부터 출산크레딧은 첫째 자녀부터 12개월을 인정하고 군복무크레딧은 최대 12개월을 인정하며, 청년 생애 첫 연금보험료 지원은 2027년부터 1개월분이 시행된다. 연기연금은 최대 5년까지 늦출 수 있어 1년마다 7.2%, 5년을 모두 연기하면 36% 연금액이 늘어난다.", "category": "가입자·사회", "importance": 2, "source": "브라보마이라이프", "published": "2026-09-23", "url": "https://bravo.etoday.co.kr/view/atc_view/20077"}, {"id": "c1b9ddccd41b", "title": "[열린세상] 기초연금만이라도 청년 부담 덜어야", "summary": "윤석명 한국보건사회연구원 명예연구위원은 2007년 도입된 기초노령연금이 하위 45% 노인을 대상으로 한 정부안에서 국회 논의를 거쳐 노인 70%로 확대됐고 2014년 5월 기초연금으로 이름이 바뀌었다고 짚었다. 재정 여건에 따라 수급 대상을 조정할 수 있었던 기초노령연금과 달리 현행 기초연금은 전체 노인의 70%에게 지급하도록 정해져 있다고 지적했다. OECD는 2014년 보고서에서 기초연금 수급자의 3분의 1이 빈곤하지 않은 노인이고 절대빈곤 노인도 같은 금액을 받아 비용 대비 빈곤 완화 효과가 낮다고 평가했다. 필자는 2025년 3월 국민연금 개정으로 50세 이상의 급여는 확정된 반면 청년과 미래세대의 부담은 늘었다며 기초연금만이라도 청년 부담을 덜어야 한다고 주장했다.", "category": "가입자·사회", "importance": 2, "source": "서울신문", "published": "2026-09-23", "url": "https://www.seoul.co.kr/news/editOpinion/world-stories/2026/09/23/20260923027003"}, {"id": "9655c2a74927", "title": "[KB 이재근號 출범②]세대교체 택한 KB, 성장축 전환", "summary": "KB금융지주가 차기 회장으로 이재근 글로벌사업부문장을 내정하면서 자본시장·자산관리(WM)·글로벌·인공지능으로 사업영역을 넓히는 전략 변화가 예상된다. KB금융의 올해 상반기 당기순이익은 3조8846억원으로 지난해 같은 기간보다 13.1% 늘었고, 비은행 계열사의 이익 기여도는 44%까지 확대됐다. KB국민은행의 WM 수수료이익은 지난해 상반기 2560억원에서 올해 상반기 4460억원으로 증가했다. 고령화에 대응해 퇴직연금·개인연금·보험을 묶은 생애주기별 자산관리 체계가 주요 과제로 부상할 전망이다.", "category": "업계·경쟁사", "importance": 2, "source": "한스경제", "published": "2026-09-23", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=867392"}, {"id": "ed0ef2b18e18", "title": "불장 멈추자 증권株도 브레이크…이젠 '옥석 가리기'", "summary": "KRX 증권지수는 22일 1809.41을 기록해 올해 최고점이었던 5월 6일 3362.84 대비 46% 하락했고, 미래에셋증권(-61%)과 키움증권(-46%), 삼성증권(-40%) 등 주요 증권주도 큰 폭으로 떨어졌다. 국내 주식시장 일평균 거래대금이 6월 약 136조원에서 9월 56조원으로 줄면서 3분기 실적 전망치도 낮아졌다. 신한투자증권은 미래에셋증권 목표주가를 5만원에서 3만7000원으로 26% 낮추는 등 주요 증권사 목표주가를 일제히 내렸다. 다만 증권사 사업 영역이 브로커리지를 넘어 자산관리(WM)와 퇴직연금, 디지털자산으로 확대되고 있어 회사별 리테일 역량에 따라 이익 기여도와 수익성이 차별화될 것이라는 평가가 나왔다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스1", "published": "2026-09-23", "url": "https://www.news1.kr/finance/general-stock/6299595"}, {"id": "439f1e3c14ff", "title": "“수익에 눈 멀어 위험한 레버리지 ETF 판매… 韓 ‘금융문맹’ 증거”", "summary": "존리 존리의부자학교 대표가 단일종목 레버리지 ETF 출시를 두고 고객의 돈이 회사 돈보다 중요하다는 철학이 있어야 한다고 비판했다. 그는 한국의 퇴직연금 수백조 원이 원금보장형 은행 예금에 잠들어 있다며, 인플레이션을 감안하면 가장 위험한 것이 원금보장형이라고 말했다. 미국 401K가 직장인 월급의 10%를 주식시장에 투자하도록 만든 점을 벤치마킹해야 한다고 강조했다. 투자 성공 요건으로는 일찍 시작할 것, 시장을 예측하지 말 것, 장기 투자할 것 세 가지를 제시했다.", "category": "운용·상품", "importance": 2, "source": "문화일보", "published": "2026-09-23", "url": "https://www.munhwa.com/article/11619132"}, {"id": "ed0cd625efec", "title": "[금진호의 AI, 사람을 향하다] 정년이 사라지는 시대, AI는 어떻게 생각하고 있을까?", "summary": "금진호 목원대 겸임교수가 법정 정년을 현행 60세에서 65세로 높이는 문제를 놓고 벌어지는 논의를 짚었다. 노동계는 국민연금 수급 시기와 퇴직 시점 사이의 소득 공백을 줄이기 위해 법정 정년 연장을 요구하고, 경영계는 인건비 부담과 청년 일자리 감소를 우려해 재고용 등 다양한 방식을 검토해야 한다는 입장이라고 전했다. 필자는 AI 시대에는 정년이라는 개념 자체가 약해지고 노동 형태가 다양해질 것으로 내다봤다. 정년은 퇴출이 아니라 전환이어야 하며, 나이가 아니라 역량으로 계속 참여할 것인가가 기준이 돼야 한다고 주장했다.", "category": "가입자·사회", "importance": 2, "source": "쿠키뉴스", "published": "2026-09-23", "url": "https://www.kukinews.com/article/view/kuk202609220190"}, {"id": "0a9a359658c9", "title": "[여의도단신]KB자산운용·한국투자신탁운용·타임폴리오자산운용", "summary": "KB자산운용은 대표 타깃데이트펀드인 'KB온국민적격TDF2055(UH)'가 5년 수익률 88.57%로 동일 기간 운용된 115개 TDF 가운데 1위를 기록했다고 23일 밝혔다. KB자산운용 TDF에는 올해 들어서만 5000억원이 넘는 자금이 유입됐고 전체 TDF 수탁고는 2조6000억원을 넘어섰다. 한국투자신탁운용은 한가위를 맞아 AI반도체·주주가치 액티브·미국나스닥100·미국S&P500미국채혼합형 ACE ETF 4종을 '홍동백서' 콘셉트로 제안했다. 타임폴리오자산운용은 'TIME 액티브 ETF' 공식 유튜브 채널을 개설했다.", "category": "운용·상품", "importance": 2, "source": "매일신문", "published": "2026-09-23", "url": "https://www.imaeil.com/page/view/2026092310193652831"}, {"id": "eebc9a9784e2", "title": "소셜연금, 급여세로 수혈하면 수천불 추가 부담", "summary": "미국 소셜연금의 재정 부족분을 급여세 인상만으로 충당할 경우 연 소득 6만1583달러인 중간소득 풀타임 근로자의 연간 추가 부담이 2617~3024달러에 이를 것으로 케이토연구소는 추산했다. 현재 급여세율은 임금의 12.4%로 근로자와 고용주가 각각 6.2%씩 부담하며 2026년에는 연 소득 18만4500달러까지 적용된다. 2026년 신탁기금 이사회 보고서는 노령·유족보험(OASI) 신탁기금 준비금이 2032년 4분기에 고갈돼 예정 급여의 약 78%만 지급할 수 있을 것으로 전망했다. 과세소득 상한선 인상·폐지와 정년 연장, 생활비조정 방식 변경 등이 대안으로 거론되고 있다.", "category": "가입자·사회", "importance": 2, "source": "미주중앙일보", "published": "2026-09-23", "url": "https://www.koreadaily.com/article/20260922180346090"}, {"id": "96e8cc9d0e71", "title": "'한국 증시' 세일즈… 코리아 프리미엄 위크 28일 개막", "summary": "금융위원회와 한국거래소가 국내 최대 규모 자본시장 기업설명회인 '코리아 프리미엄 위크 2026'을 28일부터 3주간 처음 개최한다. 증시 관계기관과 금융투자업계 등 42개 기관, 상장기업 55개사가 참여해 3주 동안 25여 개 행사가 열리며 28일 개막식에서는 자본시장 개혁 방안과 기업지배구조 개선, 외환시장 개혁 방안이 논의된다. 30일에는 개인투자자를 위한 프로그램으로 생애주기 자산관리 방법과 연금 투자 실전 가이드를 다루는 열린 세미나가 열리고 김동엽 미래에셋 투자와연금센터 상무 등이 참여한다. 행사 기간에는 퇴직연금과 개인종합자산관리계좌, 상장지수펀드 등 금융상품 홍보 부스도 운영된다.", "category": "제도·규제", "importance": 1, "source": "동아일보", "published": "2026-09-23", "url": "https://www.donga.com/news/Economy/article/all/20260922/134714215/2"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-09-16 ~ 2026-09-22", "generated_at": "2026-09-23T14:00:34+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": []}, {"id": "06ab9cf0a02f", "title": "개인 퇴직연금 계좌 통해 장기국채 투자 길 열렸다", "summary": "정부가 이달부터 개인 투자용 국채 청약에 확정기여형(DC) 퇴직연금과 개인형퇴직연금(IRP) 계좌를 통한 참여를 허용했다. 기존에는 특정 증권사의 전용 계좌가 필요했으나 이제 8개 은행·증권사의 퇴직연금 계좌로 10·20년 만기 국채에 최소 10만 원부터 투자할 수 있으며, 확정급여형(DB) 가입자는 청약에 참여할 수 없다. 지난달 기준 만기 적용 금리는 10년물 연 4.765%, 20년물 연 4.920%이고 다음 달 청약은 8∼15일 접수한다. 퇴직연금 계좌로 투자하면 연금 수령 시점까지 과세가 미뤄지고 연간 최대 900만 원의 연말정산 세액공제를 받을 수 있다.", "category": "제도·규제", "importance": 4, "source": "동아일보", "published": "2026-09-22", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712685/2", "related": [{"title": "개인 국채투자, '퇴직연금서 투자'에 흥행…9월 청약서 초과 수요", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260917099600008"}, {"title": "\"1억 넣어두면 20년 뒤 2.6억\"…연금개미들 외면한 이유", "source": "한국경제", "url": "https://www.hankyung.com/article/202609168563i"}, {"title": "\"원리금보장이라고 다 같은 예금 아닙니다\"…퇴직연금, 국채 갈아타기 전 따져볼 것은", "source": "경인방송", "url": "https://news.ifm.kr/news/articleView.html?idxno=479849"}, {"title": "퇴직연금, 주식이 엔진이면 채권은 닻", "source": "중앙SUNDAY", "url": "https://www.joongang.co.kr/article/25463197"}, {"title": "퇴직연금으로 산 개인투자용 국채, 10년 뒤 수익률은?", "source": "브라보마이라이프", "url": "https://bravo.etoday.co.kr/view/atc_view/20072"}, {"title": "퇴직연금으로 국채 투자…첫 청약부터 흥행", "source": "SBS", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008759230"}, {"title": "[흔들리는 국채 공식④] 퇴직연금에 국채 담을까…개인투자자의 새 셈법", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4435180"}, {"title": "[필드뒷얘기] 퇴직연금 국채로 고객 묶는 증권사", "source": "대한금융신문", "url": "https://www.kbanker.co.kr/news/articleView.html?idxno=225952"}, {"title": "퇴직연금에 들어온 ‘개인투자용 국채’…롯데손해보험 매각, 어려운 이유 [머니카운터 방송 예고]", "source": "경인방송", "url": "https://news.ifm.kr/news/articleView.html?idxno=479676"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "f9f26933154f", "title": "[이슈체크] 퇴직연금까지 개선 요구…흥국생명, 반복된 감독지적 뒤 '사후관리' 시험대", "summary": "금융감독원 연금감독실은 지난달 31일 흥국생명에 퇴직연금 운영과 관련한 개선 요구 5건을 통보했다. 현물이전 안내가 미흡해 가입자가 제도를 충분히 인지하지 못한 채 불필요하게 매도하거나 운용하지 못할 수 있다는 점, 보너스보험 중도해지이율과 이율보증형2 보험의 금리보증 비용을 산정하면서 시장금리 변동 등 객관적 자료를 충분히 반영하지 않은 점이 지적됐다. 디폴트옵션 성과수수료는 계약일 기준으로 할인 대상을 정해 장기 보유자도 제외되는 구조라는 점, 연금전환특약의 차순위 보험수익자 지정 절차와 배우자 계좌 승계 안내가 부족하다는 점도 함께 지적됐다. 부담금 미납 시 벌칙과 지연이자 관련 안내가 누락된 점도 개선 요구에 포함됐다.", "category": "제도·규제", "importance": 4, "source": "더퍼블릭", "published": "2026-09-18", "url": "https://www.thepublic.kr/news/articleView.html?idxno=318506", "related": []}, {"id": "a6e5af30d59e", "title": "[단독] 5인 미만 사업장 퇴직연금 도입률 10%에 그쳐", "summary": "퇴직연금 미도입 사업장이 121만218곳으로 집계됐고, 이 가운데 30인 미만 사업장이 119만1811곳으로 98.5%를 차지했다. 사업장 규모별 도입률은 5인 미만 10.6%, 5~9인 32.7%, 10~29인 57.3%, 30~49인 74.2%, 50~99인 82.2%, 100인 이상 89.6%로 나타났다. 전체 도입률은 26.5%로 5년째 26%대에 머물렀고, 업종별로는 숙박·음식점업의 93.8%, 부동산업의 89.7%, 농림어업의 89.0%가 퇴직연금을 도입하지 않았다. 가입 대상 근로자 1308만5000명 가운데 697만2000명(53.3%)이 퇴직연금에 가입했다.", "category": "제도·규제", "importance": 4, "source": "한국경제", "published": "2026-09-17", "url": "https://www.hankyung.com/article/202609169177i", "related": []}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "853028981d69", "title": "“믿고 맡길 환경 안 되면 증시로 ‘머니무브’ 없어… 장기 투자할 수 있도록 대안 제대로 만들어야”", "summary": "홍춘욱 프리즘투자자문 대표는 21일 서울 여의도에서 열린 ‘2026 국민금융포럼’ 주제발표에서 투자자가 믿고 맡길 수 있는 환경이 조성되지 않으면 부동산에서 증시로의 머니무브는 없다고 말했다. 그는 국민연금이 증시 급등으로 국내주식 보유비중이 목표를 웃돌았는데도 올해 6월 말까지 리밸런싱을 유예하고 목표비중을 14.9%에서 20.8%로 높인 것을 ‘무너진 외양간’의 사례로 지목했다. 6월 말 기준 1866조원대 기금을 운용하는 국민연금에 정책적 자율권과 독립성을 보장해야 한다고 강조했다. 장기투자를 유도할 방안으로는 3년 이상 주식 보유자에 대한 배당소득세 분리과세와 인센티브를 제시했다.", "category": "운용·상품", "importance": 3, "source": "국민일보", "published": "2026-09-22", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000014162", "related": [{"title": "“자산 50%는 ‘코어자산’으로 두고 유동성 비중 20%는 지켜라”", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000014262"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": "2026-09-20", "url": "http://www.smarttimes.co.kr/news/articleView.html?idxno=49113", "related": [{"title": "잦은 이직에 끊기는 퇴직자산…사회복지인 전용 퇴직연금 논의 본격화", "source": "라이브뉴스", "url": "https://www.livesnews.com/news/article.html?no=64332"}]}, {"id": "e8a6030d9b80", "title": "국민연금 추납 2년새 2.8배…보험료율 9.5% 오르기 전 '막차'", "summary": "국민연금 추후납부 신청이 지난해 24만4329건으로 2023년 8만7644건 대비 2.8배 늘었다. 올해 상반기에만 10만6838건이 접수됐다. 연금개혁으로 보험료율이 해마다 0.5%포인트씩 올라 13%까지 인상되는데, 추납보험료는 신청 시점의 보험료율이 적용되기 때문에 인상 전 신청이 몰리고 있다. 국회입법조사처는 최대 허용 기간인 108~119개월 구간에 신청이 집중돼 형평성 문제가 있다고 지적했다.", "category": "가입자·사회", "importance": 3, "source": "매일신문", "published": "2026-09-20", "url": "https://www.imaeil.com/page/view/2026092007310108169", "related": [{"title": "\"한달 내고 평생 따박따박\"...'중국인 국민연금 추납'이 불러온 나비효과", "source": "한국경제TV", "url": "http://www.wowtv.co.kr/NewsCenter/News/Read?articleId=A202609200033&t=NN"}]}, {"id": "ffa2d67f4b53", "title": "기초연금 1인 84만원 내야…13년새 부담액 4배 급증", "summary": "2027년 생산가능인구(15~64세) 1인이 기초연금 재원으로 부담할 세금이 84만4000원으로 집계됐다. 제도가 도입된 2014년의 18만2000원과 비교하면 360% 늘어난 금액이다. 2027년 기초연금 총지출은 29조7000억원으로, 국비 25조6000억원과 지방비 4조1000억원으로 구성된다. 1986년생이 40~44세 5년간 부담하는 금액은 약 434만9000원, 2026년생이 같은 나이대에 부담할 금액은 1230만6000원으로 추산됐다.", "category": "가입자·사회", "importance": 3, "source": "한국경제", "published": "2026-09-20", "url": "https://www.hankyung.com/article/2026092063311", "related": [{"title": "[단독] 나는 435만원, 우리 애는 1230만원…미래세대 '폭탄' 온다", "source": "한국경제", "url": "https://www.hankyung.com/article/2026092063181"}]}, {"id": "fc214e251d69", "title": "10년간 120개월 못 채운 137만명…연금 청구권 소멸도 증가세", "summary": "백선희 조국혁신당 의원이 국민연금공단에서 받은 자료에 따르면 2016년부터 올해 6월까지 반환일시금 수급권이 발생한 인원은 199만3111명이고, 이 가운데 137만4898명이 가입 기간 10년을 채우지 못한 채 수급 연령에 도달한 사례다. 반환일시금 수급자는 2023년 11만8216명에서 2025년 14만2313명으로 매년 늘었고 지급 규모도 2023년 7140억 원에서 2029년 9969억 원까지 증가할 전망이다. 소멸시효가 찬 건수는 2024년 764건, 2025년 946건, 2026년 6월 기준 646건이다. 백 의원은 반환일시금 지급에 그치지 말고 더 많은 국민이 연금수급권자로 전환될 수 있도록 청구 절차와 소멸시효 제도를 함께 점검해야 한다고 밝혔다.", "category": "가입자·사회", "importance": 3, "source": "뉴시스", "published": "2026-09-22", "url": "https://www.newsis.com/view/NISX20260921_0003798967", "related": []}, {"id": "7919b7c26bdc", "title": "'13월의 월급' 키울 IRP-연금저축, '세액공제' 황금비율 찾아라", "summary": "개인형퇴직연금(IRP)과 연금저축은 합산해 연간 최대 900만 원까지 세액공제를 받을 수 있으나, 연금저축은 단독으로 최대 600만 원까지만 가능하고 IRP는 단독으로 900만 원 한도를 채울 수 있다. 총급여 5500만 원 이하 근로자는 16.5% 공제율이 적용돼 900만 원 납부 시 최대 148만5000원을 돌려받고, 이를 초과하면 13.2%가 적용돼 최대 118만8000원을 환급받는다. IRP는 위험자산 투자 비중이 70%로 제한되는 반면 연금저축은 주식형 ETF로 100%까지 채울 수 있다. 연금저축은 중도 인출이 자유롭지만 IRP는 무주택자 주택 구매, 6개월 이상 장기 요양, 파산 선고 등 법정 사유가 아니면 부분 인출이 불가능하다.", "category": "가입자·사회", "importance": 3, "source": "동아일보", "published": "2026-09-22", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712683/2", "related": []}, {"id": "c19b8c4da0dd", "title": "\"은퇴 임박한 55세 전후, 현금흐름 만들어야\"[머니 컨설팅]", "summary": "표영대 키움증권 연금플랫폼본부장은 동아일보 인터뷰에서 퇴직연금 운용의 원칙으로 장기·적립식·분산 투자를 제시하고, 일시적인 시장 변동성에 흔들려 상품을 샀다 팔았다 해서는 안 된다고 말했다. 그는 2030세대는 위험자산 한도 70% 안에서 투자성 자산 비중을 높이고, 은퇴가 임박한 55세 전후부터는 배당형·인컴형 상품으로 리밸런싱해 현금 흐름을 만들어야 한다고 조언했다. 디폴트옵션은 사업자별 라인업이 7, 8개에 달해 선택이 어렵다는 지적이 많았으나 최근 3, 4개로 단순화하는 제도 개선이 추진되고 있다고 덧붙였다. 표 본부장은 확정기여형(DC) 가입자가 원하는 사업자를 직접 선택할 수 있도록 선택권을 넓힐 필요가 있다고 지적했다.", "category": "업계·경쟁사", "importance": 3, "source": "동아일보", "published": "2026-09-22", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712523/2", "related": []}, {"id": "454602bdfe7e", "title": "[Invest]\"고액자산가 60%는 기업에\"…'법인 개척'으로 WM-IB 선순환 추구", "summary": "이재열 NH투자증권 WM사업부 대표는 브로커리지 수익성의 한계가 뚜렷해졌다며 기업금융(IB)과 연계한 법인 개척을 돌파구로 제시했다. 10억원 이상 고액자산가가 WM 전체 성과의 60% 이상을 견인하는데 이들이 가장 밀집한 거점이 기업이라는 판단이다. 이 대표는 법인을 개척해야 운용자금과 퇴직연금은 물론 그 뒤에 있는 오너 일가의 개인 자산까지 흡수할 수 있다고 말했다. 반도체·AI, 방산, 조선, 자동차 등 수출 수혜 업종의 우량 1차 협력사와 중견·중소 외감기업을 중심으로 잠재 고객을 확보한다는 전략이다.", "category": "법인·자금운용", "importance": 3, "source": "인베스트조선 (유료)", "published": "2026-09-22", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/21/2026092180117.html", "related": []}, {"id": "4ef195012faf", "title": "증시 조정이 남긴 숙제[금융시장 돋보기]", "summary": "송홍선 자본시장연구원 선임연구위원은 최근 증시 조정이 지속적 시장개혁과 쏠림·변동성 관리라는 과제를 드러냈다고 진단했다. 쏠림 대책으로 대표 투자지수에 편입 한도(cap)를 두는 방안을 거론하며, 단일종목캡 24%와 종목합산캡을 운용하는 나스닥 100 사례를 들었다. 근본 대책으로는 장기투자 기관투자자 육성을 꼽으면서, 적립금 500조원의 퇴직연금과 준비금 1000조원의 보험회사가 무늬만 기관투자자에 머물러 있다고 지적했다. 기금형 퇴직연금을 제대로 도입하고 보험사의 자본규제·운용규제를 혁신해야 자본시장이 기관투자자 중심으로 도약할 수 있다고 제언했다.", "category": "운용·상품", "importance": 3, "source": "이데일리", "published": "2026-09-21", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645582416&mediaCodeNo=257", "related": []}, {"id": "427ba4ce9282", "title": "[김준영 칼럼] 퇴직금 산식을 둘러싼 사업주의 억울함, 사회적 합의가 필요한 때", "summary": "근로감독관이 사업장의 퇴직금 산정 내역을 점검하면서 1일 통상임금이 1일 평균임금보다 크면 차액을 지급하라는 시정지시를 내리는 사례가 늘고 있다. 근로기준법 제2조 제2항이 평균임금이 통상임금보다 적으면 통상임금을 평균임금으로 본다고 정하고 있어 감독관은 법대로 집행하지만, 기한 내 미지급 시 사용자는 형사 입건돼 검찰에 송치될 수 있다. 월 300만원 고정급 근로자의 경우 평균임금 기준 퇴직금은 300만원이지만 209시간으로 나눈 통상임금 기준으로는 약 344만원이 돼 약 44만원 차이가 난다. 대구지방법원은 2025년 8월 21일 선고한 2024나318050 판결에서 제2조 제2항을 하한 규정으로 보아 추가 퇴직금 청구를 받아들이지 않았고 이 판결은 확정됐으나, 대법원이 쟁점을 정리한 판례는 아직 없다.", "category": "제도·규제", "importance": 3, "source": "파이낸셜리뷰", "published": "2026-09-21", "url": "http://www.financialreview.co.kr/news/articleView.html?idxno=44982", "related": []}, {"id": "3795fb0c088c", "title": "퇴직연금 제도의 법적 구조와 실무상 쟁점", "summary": "법무법인 율사서재 김한나 변호사가 퇴직연금 제도의 법적 구조와 실무 쟁점을 정리했다. 퇴직금은 사용자가 산정해 직접 지급하는 반면 퇴직연금은 사외 금융기관에 적립한 재원을 퇴직연금사업자가 지급하는 구조여서, 퇴직금 법리를 그대로 적용할 수 없다고 설명했다. 대법원은 DC형에서 사용자가 납입한 부담금이 정당한 금액에 미치지 못한 경우 근로자가 평균임금 재산정이 아니라 정당 부담금액과 납입액의 차액 및 지연이자만 청구할 수 있다고 판시했다(2020다207444). 소멸시효는 고용노동부가 10년으로 해석한 사례가 있으나 판례는 3년을 전제로 판단해 왔고 기산점은 퇴직일이라고 정리했다.", "category": "제도·규제", "importance": 3, "source": "월간노동법률", "published": "2026-09-21", "url": "http://www.worklaw.co.kr/view/view.asp?accessSite=Naver&accessMethod=Search&accessMenu=News&in_cate=106&in_cate2=0&gopage=1&bi_pidx=39555", "related": []}, {"id": "8c2b86c6d933", "title": "\"어디 투자하든 AI 리스크 떠안는다\"…연기금 분산투자도 무력화", "summary": "AI 관련 자산이 주요 자산군 전반으로 퍼지면서 기관투자자의 분산투자 전략이 힘을 잃고 있다는 진단이 나왔다. S&P500 시가총액의 약 40%가 AI 인프라 기업이고, 투자적격 등급 회사채 발행의 49%와 벤처캐피털 투자의 87%가 AI와 관련돼 있다. 940억달러를 굴리는 LA카운티 공무원퇴직연금(LACERA)은 전체 자산의 8~19%가 AI에 노출된 것으로 분석됐다. 3270억달러를 운용하는 뉴욕시 퇴직연금(NYCRS)의 최고투자책임자는 앞으로 투자하는 거의 모든 펀드가 결국 AI 노출을 더 늘릴 것이라고 말했다.", "category": "운용·상품", "importance": 3, "source": "이데일리", "published": "2026-09-21", "url": "https://www.edaily.co.kr/News/Read?newsId=02437046645582416&mediaCodeNo=257", "related": []}]}, "monthly": {"period": "monthly", "key": "current", "label": "2026-08-23 ~ 2026-09-22", "generated_at": "2026-09-23T14:00:34+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": [{"title": "개인 퇴직연금 계좌 통해 장기국채 투자 길 열렸다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712685/2"}, {"title": "개인 국채투자, '퇴직연금서 투자'에 흥행…9월 청약서 초과 수요", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260917099600008"}, {"title": "\"1억 넣어두면 20년 뒤 2.6억\"…연금개미들 외면한 이유", "source": "한국경제", "url": "https://www.hankyung.com/article/202609168563i"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 확정 수익 60%\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/14/2026091490036.html"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 60% 확정 수익\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/13/2026091390109.html"}, {"title": "“20년 묻어두면 수익률 161%”…퇴직연금 국채, 증권사 유치전 불붙었다", "source": "디지털데일리", "url": "https://www.ddaily.co.kr/page/view/2026091010295983047"}, {"title": "“예금 이자론 성 안 차”…은행 퇴직연금, 국채 품고 반격할까", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1688375/"}, {"title": "\"원리금보장이라고 다 같은 예금 아닙니다\"…퇴직연금, 국채 갈아타기 전 따져볼 것은", "source": "경인방송", "url": "https://news.ifm.kr/news/articleView.html?idxno=479849"}, {"title": "퇴직연금, 주식이 엔진이면 채권은 닻", "source": "중앙SUNDAY", "url": "https://www.joongang.co.kr/article/25463197"}, {"title": "퇴직연금으로 산 개인 에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "8bb193e0ea59", "title": "“정부 기초연금개편안, 겉으로는 하후상박 실제는 재정 절감안”", "summary": "정부가 노인 하위 70%를 세 집단으로 나눠 차등 지급하는 하후상박 방식을 내놨다. 하위 30%에 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원(동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": [{"title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "source": "슬로우뉴스", "url": "https://slownews.kr/166386"}, {"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "aea0c5c117f7", "title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "summary": "미래에셋생명은 22일 퇴직연금 보증형 실적배당보험이 출시 이후 지난달 말까지 717억원의 모집 성과를 기록했다고 밝혔다. 이 상품은 개인형퇴직연금(IRP) 계좌를 통해서만 가입할 수 있는 거치형 상품으로, 만 50세부터 적립금을 일시에 예치해 가입할 수 있다. 만 55세부터는 원하는 시점에 연금을 개시할 수 있고, 만 55세를 넘긴 가입자는 가입과 동시에 연금 수령도 가능하다. 일임형 자산배분펀드와 연계해 보장된 인출 구조와 글로벌 분산투자를 함께 추구하는 구조다.", "category": "업계·경쟁사", "importance": 2, "source": "연합인포맥스", "published": "2026-09-22", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024", "related": [{"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": "2026-09-20", "url": "http://www.smarttimes.co.kr/news/articleView.html?idxno=49113", "related": [{"title": "잦은 이직에 끊기는 퇴직자산…사회복지인 전용 퇴직연금 논의 본격화", "source": "라이브뉴스", "url": "https://www.livesnews.com/news/article.html?no=64332"}]}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발생했으나 회수된 금액은 없다.", "category": "법인·자금운용", "importance": 3, "source": "시장경제신문", "published": "2026-09-16", "url": "https://www.meconomynews.com/news/articleView.html?idxno=201626", "related": [{"title": "홈플러스, 9개월간 임금체불 3871억…퇴직금도 미지급", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1690418/"}]}, {"id": "f22427d51808", "title": "NH농협은행, 2026년 제2차 투자상품 완전판매 대토론회 개최", "summary": "NH농협은행은 17일 서울 중구 본사에서 2026년 제2차 투자상품 완전판매 대토론회를 열었다. 투자상품 미스터리쇼핑 만점자와 영업본부 완전판매 TOP리더 등 약 40명이 참석해 펀드·방카슈랑스·신탁·퇴직연금 부문의 상담 준비, 상품 설명, 적합성·적정성 원칙 준수 사례를 공유했다. NH농협은행은 토론회 내용을 영상으로 제작해 영업점 교육자료로 활용할 계획이다. 박현동 투자상품부문 부행장은 완전판매가 절차 준수에 그치지 않고 고객 입장에서 충분히 설명하고 신뢰를 쌓는 과정이라고 강조했다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스퀘스트", "published": "2026-09-17", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=301184", "related": [{"title": "농협은행, 투자상품 완전판매 대토론회 개최…미스터리쇼핑 만점자 우수사례 공유", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146703"}]}, {"id": "ab894d0c4867", "title": "[금융 HOT 뉴스] KB자산운용, 골드 특별자산 펀드 눈길", "summary": "KB자산운용이 골드 특별자산 펀드의 운용 구조를 파생상품 중심에서 국내외 금 ETF 활 /09/10/2026091000173.html", "related": []}, {"id": "de4a8500263d", "title": "수익률 32%에도 돈이 안 온다…디폴트옵션의 역설", "summary": "디폴트옵션 시행 3년 차 데이터에서 적극투자형 1년 수익률이 32.66%를 기록했으나 자금의 82.5%는 여전히 안정형에 머물러 있다. 은행권은 고객 자금 대부분을 안정형에 두는 반면 증권사 고객은 위험자산에 투자해 업권별로 뚜렷이 갈렸다. 제도의 병목은 상품 품질이 아니라 자금이 좋은 상품에 도달하는 경로에 있다는 지적이다.", "category": "운용·상품", "importance": 5, "source": "한경머니", "published": "2026-09-10", "url": "https://magazine.hankyung.com/money/article/202608199155c", "related": []}, {"id": "937d44176934", "title": "퇴직연금 6.9조 이동…은행서 증권사로 자금 쏠림, 국채로 2차 경쟁", "summary": "올해 상반기 퇴직연금 실물이전 규모가 약 6조9000억원으로 전년 동기 약 3조2000억원의 2.2배에 달해 2024년 제도 시행 이후 반기 기준 최대를 기록했다. 업권별로는 증권사가 4조1513억원 순유입, 은행이 3조9714억원 순유출, 보험이 1799억원 순유출이었고, 증권사 적립금은 2분기 말 165조468억원으로 1분기 대비 16.5% 늘어 은행권 증가율 6.6%를 크게 앞섰다. 실물이전 규모는 가입자가 직접 상품을 고르는 IRP에서 6조8000억원으로 가장 컸다. 9월부터 개인투자용 국채가 DC·IRP 계좌에 편입되면서 증권사는 안정형 상품까지 더해 고객 확보에 나서고, 은행권은 ETF 거래 편의성 개선으로 맞서고 있다.", "category": "운용·상품", "importance": 5, "source": "더트래커", "published": "2026-09-10", "url": "https://thetracker.co.kr/View.aspx?No=4221950", "related": []}]}, "yearly": {"period": "yearly", "key": "current", "label": "2025-09-23 ~ 2026-09-22", "generated_at": "2026-09-23T14:00:35+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": [{"title": "개인 퇴직연금 계좌 통해 장기국채 투자 길 열렸다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712685/2"}, {"title": "개인 국채투자, '퇴직연금서 투자'에 흥행…9월 청약서 초과 수요", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260917099600008"}, {"titl s/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}, {"title": "[금상소] IRP·DC에 들어온 개인투자용 국채…10년·20년물 뭐가 나을까", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2624549"}]}, {"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "8bb193e0ea59", "title": "“정부 기초연금개편안, 겉으로는 하후상박 실제는 재정 절감안”", "summary": "정부가 노인 하위 70%를 세 집단으로 나눠 차등 지급하는 하후상박 방식을 내놨다. 하위 30%에 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원(동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": [{"title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "source": "슬로우뉴스", "url": "https://slownews.kr/166386"}, {"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "aea0c5c117f7", "title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "summary": "미래에셋생명은 22일 퇴직연금 보증형 실적배당보험이 출시 이후 지난달 말까지 717억원의 모집 성과를 기록했다고 밝혔다. 이 상품은 개인형퇴직연금(IRP) 계좌를 통해서만 가입할 수 있는 거치형 상품으로, 만 50세부터 적립금을 일시에 예치해 가입할 수 있다. 만 55세부터는 원하는 시점에 연금을 개시할 수 있고, 만 55세를 넘긴 가입자는 가입과 동시에 연금 수령도 가능하다. 일임형 자산배분펀드와 연계해 보장된 인출 구조와 글로벌 분산투자를 함께 추구하는 구조다.", "category": "업계·경쟁사", "importance": 2, "source": "연합인포맥스", "published": "2026-09-22", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024", "related": [{"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}, {"id": "354ed5723a15", "title": "삼성자산운용·미래에셋증권, 푸른씨앗 OCIO 수성", "summary": "국내 최초 기금형 퇴직연금인 푸른씨앗(중소기업퇴직연금기금) 자금을 굴릴 OCIO 전담운용기관에 삼성자산운용과 미래에셋증권이 재선정됐다. 삼성자산운용이 종합평점 92.915점, 미래에셋증권이 90.761점으로 우선협상대상자에 올랐다. 2022년 9월 첫 사업자 선정 이후 4년 만의 재선정이다. 2기 운용 기간은 2026년 9월 1일부터 2030년 8월 31일까지다.", "category": "법인·자금운용", "importance": 4, "source": "한국금융신문", "published": "2026-06-09", "url": "https://www.fntimes.com/html/view.php?ud=202606091842068772179ad43907_18", "related": []}, {"id": "5895ec3e71a7", "title": "20년 만에 퇴직연금 제도 대대적 개편…모든 사업장 의무화 추진", "summary": "정부가 2월 노사정 공동선언을 바탕으로 퇴직연금 제도를 대폭 개편한다. 7월까지 구체적 방안을 확정한 뒤 연내 관련 법 개정을 추진하고, 모든 사업장에 퇴직연금을 단계적으로 의무화할 방침이다. 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화가 핵심 축이다. 1년 미만 근로자 등 사각지대 해소도 함께 추진된다.", "category": "제도·규제", "importance": 4, "source": "대한민국 정책브리핑", "published": "2026-03-11", "url": "https://www.korea.kr/news/policyNewsView.do?newsId=148960665", "related": []}, {"id": "6e2fe502ecb5", "title": "미래에셋증권, 퇴직연금 로보Wrap 출시…AI가 자산배분·매매 맡는다", "summary": "미래에셋증권이 IRP 계좌용 로보어드바이저 일임 서비스 퇴직연금 로보Wrap을 출시했다. 알고리즘이 글로벌 자산배분 포트폴리오를 구성하고 시장 상황에 맞춰 리밸런싱과 매매까지 수행한다. 7월 말 기준 누적 가입 계좌는 14만좌, 누적 가입금액은 8조3000억원이다.", "category": "운용·상품", "importance": 3, "source": "뉴스핌", "published": "2026-08-05", "url": "https://www.newspim.com/news/view/20260805001063", "related": []}, {"id": "676b0ae84927", "title": "신한 적립액 54조 독주…국민·하나, IRP 중심 2위 경쟁", "summary": "2026년 1분기 퇴직연금 랭킹에서 신한이 적립액 54조원으로 선두를 지켰다. 국민은행과 하나은행이 IRP를 중심으로 2위 자리를 놓고 다투고 있다. 은행권 IRP 적립금은 83조7000억원으로 전체 시장의 31.7%를 차지했다.", "category": "업계·경쟁사", "importance": 3, "source": "한국금융신문", "published": "2026-04-21", "url": "https://www.fntimes.com/html/view.php?ud=2026042117435794185e6e69892f_18", "related": []}, {"id": "ecca1d1f70f8", "title": "기금형 퇴직연금은 결과 아닌 과정 책임으로…사외적립의무는 속도조절 요구", "summary": "노사정과 전문가가 참여한 정책 토론회에서 기금형 퇴직연금 도입 방향이 논의됐다. 전문가들은 운용 주체의 책임을 결과가 아닌 과정, 즉 의사결정 절차의 적정성으로 전환해야 한다고 주장했다. 경영계는 중소기업 부담을 이유로 사외적립 의무화의 단계적 시행을 요구했다. 한국노총과 한국경영자총협회, 고용노동부, 한국투자증권 관계자가 참석했다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-04-08", "url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=04598566645414152", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
