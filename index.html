<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퇴직연금 주요 이슈</title>
<style>
  /* ── 팔레트 ───────────────────────────────────────────────
     잉크 네이비 위에 차가운 석재 종이. 강조색은 적립·성장을 뜻하는
     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나. */
  :root {
    --ink: #101C33;
    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom: #D6341F;

    --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',
               'Malgun Gothic', system-ui, sans-serif;
    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #DCE2EC;
      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 어두운 바탕에서는 다홍이 탁해 보여 한 단계 밝게 쓴다. */
      --kiwoom: #FF7A63;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;
  }

  .slogan {
    margin: 0 0 0 auto;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom);
    white-space: nowrap;
  }

  .hero-date {
    font-family: var(--font-num);
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .search input {
    width: 230px;
    max-width: 44vw;
    padding: 4px 0;
    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */
  .group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;
  }

  .rail button {
    flex: 1 1 0;
    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .range {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  /* ── 분야 필터 ─────────────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
  }

  .filters button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */
  .notice {
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */
  .list { margin: 8px 0 0; }

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);
  }

  article[data-cat="2"] .badge { color: var(--cat-2); }
  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

  details summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

  <div class="masthead">

  <main class="list" id="list"></main>

  <p class="footer" id="footer"></p>

"source": "이데일리", "published": "2026-09-26", "url": "https://www.edaily.co.kr/News/Read?newsId=01781046645584056&mediaCodeNo=257"}, {"id": "53dd24a728e6", "title": "[만나보니] [신한자산운용] 천기훈 ETF컨설팅팀장 \"연금 ETF, '왜'보다 '어떻게'가 중요\"", "summary": "천기훈 신한자산운용 ETF컨설팅팀장은 연금계좌가 ETF 시장의 중요한 투자 창구 중 하나가 됐고, 투자자의 질문이 '왜 연금계좌에서 ETF에 투자해야 하나'에서 '나에게 어떤 ETF가 맞느냐'로 옮겨갔다고 밝혔다. 2019년 연금계좌에서 ETF에 투자하는 금액은 5000억원 수준이었으나 현재는 연금저축과 퇴직연금을 합쳐 100조원 시대가 됐다고 말했다. 자산형성기인 2030세대는 배당형보다 S&P500 같은 자본수익 추구형 ETF로 연금자산 규모를 키우고, 은퇴 시점이 가까워지면 배당이나 커버드콜을 활용해 현금흐름을 확보하는 전략으로 전환할 수 있다고 조언했다. 신한자산운용은 ISA·연금저축·퇴직연금에서 SOL ETF만으로 포트폴리오를 구성할 수 있는 라인업을 갖췄다고 설명하며, 지난 18일 'SOL 글로벌DRAM반도체플러스 ETF'가 효력발생됐다고 밝혔다.", "category": "업계·경쟁사", "importance": 3, "source": "딜사이트경제TV", "published": "2026-09-26", "url": "https://news.dealsitetv.com/articles/176295"}, {"id": "ea58c332c02d", "title": "[개인국채 시대] 미래에셋 선구안 빛났다…선점효과 기대", "summary": "개인투자용 국채를 퇴직연금 계좌에서 매수할 수 있게 되면서 미래에셋증권의 선점 효과가 주목받고 있다. 미래에셋증권은 2024년부터 약 2년간 개인투자용 국채 단독 판매대행기관을 맡아 왔다. 올해부터 확정기여형(DC)과 개인형퇴직연금(IRP)에서도 10년물·20년물 국채를 사들일 수 있다. 미래에셋증권의 2분기 말 퇴직연금 적립금은 52조210억원으로, 이 가운데 DC가 23조8488억원, IRP가 22조5418억원이다.", "category": "업계·경쟁사", "importance": 3, "source": "딜사이트경제TV", "published": "2026-09-26", "url": "https://news.dealsitetv.com/articles/176340"}, {"id": "bdb2f0cac3d9", "title": "퇴직연금 제도가 한국인의 연금복권이 된다면", "summary": "퇴직연금 세미나에서 한 연구자는 중도 인출은 법적 강제 차단 외에는 답이 없고, 누수를 막고 수익률을 높여 최소 1억원 이상 적립금이 쌓여야 연금화를 말할 수 있다고 지적했다. 칼럼은 퇴직금 중도인출 방지를 법으로 강제할 수 없는 만큼 빼기에 부담될 정도로 적립금 규모가 커져야 하고, 그러려면 수익률에 대한 강한 압박이 필요하다고 짚었다. 자산운용을 맡을 퇴직연금 사업자의 책임이 무거워지지만, 투자가 본업인 사업자에게는 역량을 보일 기회라고 평가했다. 제도화에 그치지 않고 한국 퇴직연금이 노후를 실제로 보장하는 제도로 안착하기를 바란다고 밝혔다.", "category": "제도·규제", "importance": 2, "source": "뉴스프리존", "published": "2026-09-26", "url": "https://www.newsfreezone.co.kr/news/articleView.html?idxno=710909"}, {"id": "3b4a66f8cadd", "title": "'선택 아닌 필수'...방치된 연금 살리는 4가지 비법[증권맨 Talk]", "summary": "최종진 한국투자증권 연금혁신본부장은 기고에서 연금 가입자가 지켜야 할 네 가지 원칙을 제시했다. 소액이라도 일찍 시작해 매월 정기적으로 적립하는 코스트 에버리징 전략으로 평균 매입 단가를 낮추고 복리 효과를 키워야 한다고 밝혔다. 원리금보장 상품에 연금 자산을 방치하면 복리의 기회비용을 잃고 물가상승률에 실질 구매력이 깎이므로, 글로벌 자산배분 펀드와 ETF, TDF, 디폴트옵션 등으로 균형을 갖춰야 한다고 조언했다. 또 특정 국가나 섹터에 편중된 포트폴리오를 피하고 선진국·신흥국 주식과 채권, 대체자산으로 분산한 뒤 정기적으로 리밸런싱할 것을 권했다.", "category": "운용·상품", "importance": 2, "source": "이데일리", "published": "2026-09-26", "url": "https://www.edaily.co.kr/News/Read?newsId=01551446645584056&mediaCodeNo=257"}, {"id": "909ff09403cf", "title": "중기대출 '꺾기' 의심거래 14조원… 7년 새 50% 늘고 건당 규모 2.4배", "summary": "박준태 국민의힘 의원이 금융감독원에서 받은 자료에 따르면 중소기업 관련 대출 꺾기 의심거래는 2018년 16만268건(9조3227억원)에서 지난해 9만9136건(14조210억원)으로 건수는 38.1% 줄고 금액은 50.4% 늘었다. 건당 의심거래 금액은 2018년 약 5800만원에서 지난해 약 1억4100만원, 올해 상반기 약 1억6100만원으로 커졌다. 올해 상반기 중소기업 대출금액 대비 의심거래 비중은 우리은행이 8.07%로 가장 높고 기업은행 7.86%, SC제일은행 5.06%, 국민은행 4.02% 순이었다. 우리은행은 여신 실행일 전월 동일일부터 익월 동일일까지 예금·적금·펀드·보험·신탁·ISA·퇴직연금·상품권 판매를 제한하는 구속성 점검 절차를 전산화해 운영한다고 설명했다.", "category": "제도·규제", "importance": 2, "source": "머니투데이", "published": "2026-09-26", "url": "https://www.mt.co.kr/finance/2026/09/26/2026092311455138835"}, {"id": "6df85f14088f", "title": "ETF 대부 \"AI 거품 터져도 돼\"…1000만원→108억 키울 종목", "summary": "2002년 국내 첫 ETF 도입을 주도한 배재규 한국투자신탁운용 대표는 S&P500 대신 다른 ETF를 사라며 해당 ETF가 30년간 14.1% 올라 S&P500의 10.9%를 앞섰다고 밝혔다. 그는 2023년 3월 개인형퇴직연금(IRP) 계좌를 새로 만든 뒤 현재까지 12개 ETF에 투자하고 있으며, 그중 4개를 장기 연평균 15% 이상 상승할 상품으로 추천했다. 회사원이라면 매월 정해진 날에 월급의 30% 이상을 같은 비율로 4개 ETF에 넣고 10년 이상 보유하라고 권했다. 1000만원을 연 15% 수익률로 50년 굴리면 108억원, 55년으로 늘리면 218억원이 된다며 복리 효과를 강조했다.", "category": "운용·상품", "importance": 2, "source": "중앙일보 (유료)", "published": "2026-09-26", "url": "https://www.joongang.co.kr/article/25464829"}, {"id": "177220e125c4", "title": "추석 상여금 굴려볼까…예금·파킹형·미국지수 ETF '선택지'", "summary": "시중은행 1년 만기 정기예금 금리는 연 3.4~3.55%, 저축은행 평균은 3.75%로 일부 상품은 4%를 넘는다. 단기 대기자금 수요로 머니마켓 ETF에는 한 달간 1조3000억원 이상이 들어왔다. 장기 자금 선택지로는 S&P500·나스닥100 등 미국 지수와 AI·반도체 ETF, TDF가 거론됐고 신한자산운용 TDF 설정액은 9월 17일 기준 2조874억원으로 집계됐다. 'RISE 글로벌AI낸드메모리반도체'는 퇴직연금 계좌에서 100% 투자할 수 있다고 소개됐다.", "category": "운용·상품", "importance": 2, "source": "뉴시안", "published": "2026-09-26", "url": "http://www.newsian.co.kr/news/articleView.html?idxno=96014"}, {"id": "880682c6d197", "title": "\"상속·증여도 걱정인데 노후 자금도 빠듯\" 시니어들 고민 많더니…2874건→7619건 1년새 상담 쇄도", "summary": "KB국민은행 KB골든라이프센터의 상담 건수가 전년 동기 2874건에서 올해 1~8월 7619건으로 약 2.7배 늘었다. 과거에는 연금과 절세 문의가 중심이었으나 최근에는 상속·증여와 자산 인출전략, 요양·돌봄으로 영역이 넓어져 연금·절세 이외 분야 상담 비중이 40%를 웃돈다. 금융권은 연금·자산관리를 넘어 상속·증여, 건강, 돌봄, 주거 등 노후생활 전반으로 서비스를 확대하고 있다. 5대 시중은행에서 50대 이상 고객이 차지하는 수신자산 비중은 평균 65.9%에 달한다.", "category": "가입자·사회", "importance": 2, "source": "헤럴드경제", "published": "2026-09-26", "url": "https://biz.heraldcorp.com/article/10884753"}, {"id": "dfd5d7e6a611", "title": "“1억 넣으면 평생 월급?”…즉시연금 제대로 고르는 법 [머니 트레이스]", "summary": "생명보험협회에 따르면 올해 1분기 저축성보험 초회보험료는 4조5469억원으로 전년 동기보다 13.6% 늘었다. 즉시연금은 목돈을 한 번에 맡기고 다음 달부터 연금을 받는 상품으로, 사망까지 받는 종신연금형, 10년·20년 등 정해진 기간에 원금과 이자를 나눠 받는 확정연금형, 운용 수익만 연금으로 받고 사망 시 남은 적립금을 상속하는 상속연금형으로 나뉜다. 보험업계에서는 즉시연금이 높은 수익률을 기대하는 상품이 아니라 목돈을 안정적인 현금흐름으로 바꾸는 상품이라고 설명한다. 가입 전에는 공시이율과 최저보증이율, 중도해지 조건, 비과세 요건, 예금자보호 범위를 비교해야 한다고 조언했다.", "category": "가입자·사회", "importance": 2, "source": "서울경제", "published": "2026-09-26", "url": "https://www.sedaily.com/article/20094997"}, {"id": "b6e2d0939d6c", "title": "상반기 웃었던 증권주, 3분기 17%↓…반등 가능할까", "summary": "한국거래소에 따르면 KRX 증권지수는 7월 1일부터 9월 23일까지 17.28% 하락해, 올해 상반기 42.73% 상승했던 흐름이 꺾였다. 신한투자증권 집계로 ETF를 포함한 국내 증시 일평균 거래대금은 6월 138조원에서 7월 100조원, 8월 67조원, 9월 56조원으로 줄었고 3분기 누적 일평균은 77조원으로 전분기보다 34% 감소했다. 신한투자증권은 미래에셋증권 목표주가를 26% 낮춘 것을 비롯해 한국금융지주 17%, NH투자증권 15%, 삼성증권 15%, 키움증권 14% 등 주요 증권사 5곳의 목표주가를 일제히 하향했다. 다만 3분기 일평균 거래대금이 지난해 같은 기간 27조원을 크게 웃도는 점과 증권사들이 자산관리(WM)와 퇴직연금 등으로 수익원을 다변화하고 있다는 점은 주가 하락을 일부 제한할 수 있는 요인으로 꼽혔다.", "category": "업계·경쟁사", "importance": 2, "source": "아시아투데이", "published": "2026-09-26", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20260926010009108"}, {"id": "fe3f1036371f", "title": "“집은 5억원인데 생활비가 없다고?”…부모님 주택연금 얼마 받을까", "summary": "주택연금은 부부 중 한 명이 55세 이상이고 주택 공시가격 합계가 12억원 이하면 살던 집을 담보로 맡기고 매달 연금을 받는 제도다. 올해 3월 이후 5억원짜리 주택으로 가입하면 70세 부부 기준 월 153만9000원을 받는다. 같은 5억원 기준으로 60세는 월 105만3000원, 65세는 월 126만4000원, 75세는 월 190만6000원, 80세는 월 241만6000원을 받아 가입 연령이 높을수록 지급액이 커진다. 올해 신규 가입자의 월지급금은 평균 3.13% 올랐고 초기보증료율은 1.5%에서 1.0%로 내린 대신 연보증료율은 0.75%에서 0.95%로 올랐다.", "category": "가입자·사회", "importance": 2, "source": "이데일리", "published": "2026-09-26", "url": "https://www.edaily.co.kr/News/Read?newsId=01853206645584056&mediaCodeNo=257"}, {"id": "00eb3ab8f1c1", "title": "국민연금, 70만원 받을까? 136만원 받을까?", "summary": "국민연금 노령연금은 가입 기간이 10년 이상이고 출생연도별 수급 연령을 충족해야 받을 수 있으며, 1961~1964년생은 63세, 1965~1968년생은 64세, 1969년생 이후는 65세부터다. 조기노령연금으로 최대 5년 앞당겨 받으면 1년마다 기본연금액이 6%씩 줄어 최대 30%가 깎이고, 월 100만원을 받을 사람은 월 70만원을 받는다. 연기연금으로 최대 5년 미루면 매월 0.6%씩 1년에 7.2%가 더해져 최대 36%가 가산되고, 같은 조건에서 월 136만원을 받는다. 조기노령연금 수급자는 2020년 약 67만명에서 2025년 7월 100만명을 넘어섰고 2026년 4월 말 기준 105만4616명으로 집계됐다.", "category": "가입자·사회", "importance": 2, "source": "SBS Biz", "published": "2026-09-26", "url": "https://biz.sbs.co.kr/article_hub/20000336729"}, {"id": "4dba5b752e29", "title": "평범한 70대 국민연금 얼마나 받을까, 73세 은퇴자 통장 열어 보니", "summary": "73세 오천환 씨는 매달 국민연금 80만원을 받아 30만원은 개인 용돈으로 쓰고 나머지는 생활비로 쓴다. 주거비로만 한 달 약 130만원을 지출해 연금 수령액을 넘기 때문에 2~3일에 한 번씩 단기 일자리를 나가 부족분을 메운다. 그는 부부 기준으로 노후에 부족함 없이 지내려면 최소 월 300만원은 있어야 한다고 말했다. 1997년 외환위기 무렵 사업 부도로 노후 대비를 충분히 하지 못했다며, 청년들에게 국민연금 가입과 월 20만원 수준의 보험 가입을 당부했다.", "category": "가입자·사회", "importance": 1, "source": "조선일보", "published": "2026-09-26", "url": "https://www.chosun.com/economy/startup_story/2026/09/26/YDDNMTNAKZF5VDVKWNO5SHWZCY/"}, {"id": "08a25f1c0772", "title": "임금·퇴직금 2억4000만원 체불한 업체 대표, 징역 1년", "summary": "의정부지법 이용희 판사는 근로기준법 위반 혐의로 기소된 경기 양주시 제조업체 대표 60대 A씨에게 징역 1년을 선고했다. A씨는 퇴직 근로자 6명의 임금 1억2700여만원과 퇴직 근로자 3명의 퇴직금 9500여만원을 지급하지 않았고, 일부 근로자의 확정기여형(DC) 퇴직연금 미납 부담금과 지연이자 1000만원도 내지 않아 체불액이 2억4000만원에 달했다. 근로복지공단이 피해 근로자 5명에게 약 4400만원을 대지급했으나 강제집행으로 회수된 금액은 600만원에 그쳤다. 재판부는 A씨가 범행을 모두 인정하고 있고 추가적인 피해 회복의 기회를 주기 위해 법정구속은 하지 않는다고 밝혔다.", "category": "법인·자금운용", "importance": 1, "source": "뉴시스", "published": "2026-09-26", "url": "https://www.newsis.com/view/NISX20260922_0003800300"}, {"id": "af4ad4fc0b4f", "title": "퇴직연금 언제 받나…임용 시기·퇴직연도 따라 개시 시점 달라진다", "summary": "공무원이 퇴직한 뒤 연금을 받기 시작하는 나이는 최초 임용 시점과 퇴직연도에 따라 달라진다. 1996년 이후 임용자는 2016~2021년 퇴직자가 60세, 2022~2023년 퇴직자가 61세, 2024~2026년 퇴직자가 62세이며, 2027~2029년 퇴직자는 63세, 2030~2032년 퇴직자는 64세, 2033년 이후 퇴직자는 65세부터 연금이 개시된다. 정년이 60세보다 낮거나 계급정년에 도달한 경우, 직제·정원 변경이나 폐지로 퇴직한 경우에는 2024~2026년 퇴직자가 퇴직 후 2년, 2033년 이후 퇴직자가 퇴직 후 5년을 기다려야 하는 별도 기준이 적용된다. 2000년 12월 31일 기준 재직기간이 20년 이상인 공무원은 연령과 관계없이 퇴직 후 연금을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "CBC뉴스", "published": "2026-09-26", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=610008"}, {"id": "fb1a54d99b97", "title": "['재무설계의 시대'가 왔다(下)] 최문희 한국재무설계협회장의 '한국형 재무 설계 비법'", "summary": "최문희 한국재무설계협회(IFPK) 회장은 국제표준 절차 위에 한국의 제도와 생애주기, 가족 문화를 반영한 한국형 재무설계 모델을 구축하고 있다고 밝혔다. 협회는 올해 하반기 주요 사업으로 공공 상담 전문가 과정과 함께 퇴직연금 전문가 과정을 추진한다. 최 회장은 퇴직연금 전문가를 상품 설명 수준을 넘어 생애주기에 맞춘 적립·운용·인출 및 세금 문제까지 종합 컨설팅하는 전문가로 양성하겠다고 말했다. 협회는 이 밖에 현직 재무설계사를 위한 AI 활용·윤리 교육과정 개발과 대학생 대상 AI 활용 재무설계 콘테스트 개최도 계획하고 있다.", "category": "가입자·사회", "importance": 1, "source": "인더스트리뉴스", "published": "2026-09-26", "url": "https://www.industrynews.co.kr/news/articleView.html?idxno=86225"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-09-19 ~ 2026-09-25", "generated_at": "2026-09-26T15:17:10+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": []}, {"id": "5e67ec767c57", "title": "퇴직연금 문 열린 개인용 국채…첫 선택은 10년물에 쏠렸다", "summary": "재정경제부에 따르면 9월 9~15일 진행된 개인투자용 국채 청약에 총 2585억원이 접수돼 발행 예정액 2300억원을 웃돌았다. 이달부터 퇴직연금 계좌를 통한 투자가 허용되면서 청약액이 지난 5월 이후 처음으로 2000억원대로 올라섰다. 9월 청약액 가운데 연금계좌 청약액은 1433억원으로 절반을 넘었고 실제 배정액은 1271억원이다. 연금계좌 청약 대상인 10년물과 20년물 중 10년물에 1168억원이 몰려 전체의 74.1%를 차지했고, 10년물 발행한도는 1100억원에서 1356억원으로 늘었다.", "category": "운용·상품", "importance": 4, "source": "연합인포맥스", "published": "2026-09-25", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436449", "related": [{"title": "개인 퇴직연금 계좌 통해 장기국채 투자 길 열렸다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712685/2"}, {"title": "[개인국채 시대] 퇴직연금 '입성', 장기물 수요↑", "source": "딜사이트경제TV", "url": "https://news.dealsitetv.com/articles/176339"}, {"title": "삼전닉스 '몰빵' 대신 '개인투자용 국채' 사볼까", "source": "경향신문", "url": "https://www.khan.co.kr/article/202609240600021"}, {"title": "\"원리금보장이라고 다 같은 예금 아닙니다\"…퇴직연금, 국채 갈아타기 전 따져볼 것은", "source": "경인방송", "url": "https://news.ifm.kr/news/articleView.html?idxno=479849"}, {"title": "퇴직연금, 주식이 엔진이면 채권은 닻", "source": "중앙SUNDAY", "url": "https://www.joongang.co.kr/article/25463197"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "8a77650694b5", "title": "퇴직연금 '수익률 경쟁' 실종…상위 10개사 점유율은 75%", "summary": "자본시장연구원 보고서를 인용해 국내 퇴직연금 시장에서 사업자 간 수익률 경쟁이 제대로 작동하지 않는다고 보도했다. 지난해 말 적립금 501조4000억원 시장에서 상위 3개사 점유율은 31.3%, 상위 5개사는 48.5%, 상위 10개사는 74.8%였고, 시장집중도를 나타내는 HHI는 2011년 632.8에서 지난해 664.8로 큰 변화가 없었다. 보고서는 장기 운용성과와 시장점유율 사이에 뚜렷한 관계가 나타나지 않았다고 지적했다. 2025년 수익률은 DC형 8.47%, IRP 9.44%, 전체 평균 6.47%였으나 가입자의 67.7%는 평균 이하 수익률에 머물렀다.", "category": "업계·경쟁사", "importance": 4, "source": "EBN", "published": "2026-09-23", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1725356", "related": []}, {"id": "59195bdecf60", "title": "공언만 앞선 노동정책…9월 대책 밀리고 연말 과제만 6개", "summary": "고용노동부가 9월까지 마련하겠다고 밝힌 야간노동자 건강보호 방안의 발표 시점을 연내로 미뤘다. 5인 미만 사업장 근로기준법 적용 확대를 논의할 사회적 대화도 22일까지 논의기구와 참여 주체, 첫 회의 일정이 공개되지 않았다. 퇴직급여 사외적립·기금형 퇴직연금 활성화 방안은 K-노동복지회의소 설립 방안, 일하는 사람 기본법 입법 등과 함께 12월에 몰린 최소 6개 과제에 포함돼 있다. 노동부 내부에서는 9월 과제부터 정부안 마련과 노사 조율이 늦어지면서 연말 대책도 차례로 밀릴 가능성을 배제하기 어렵다는 말이 나온다.", "category": "제도·규제", "importance": 4, "source": "헤럴드경제", "published": "2026-09-23", "url": "https://biz.heraldcorp.com/article/10882794", "related": []}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": []}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "853028981d69", "title": "“믿고 맡길 환경 안 되면 증시로 ‘머니무브’ 없어… 장기 투자할 수 있도록 대안 제대로 만들어야”", "summary": "홍춘욱 프리즘투자자문 대표는 21일 서울 여의도에서 열린 ‘2026 국민금융포럼’ 주제발표에서 투자자가 믿고 맡길 수 있는 환경이 조성되지 않으면 부동산에서 증시로의 머니무브는 없다고 말했다. 그는 국민연금이 증시 급등으로 국내주식 보유비중이 목표를 웃돌았는데도 올해 6월 말까지 리밸런싱을 유예하고 목표비중을 14.9%에서 20.8%로 높인 것을 ‘무너진 외양간’의 사례로 지목했다. 6월 말 기준 1866조원대 기금을 운용하는 국민연금에 정책적 자율권과 독립성을 보장해야 한다고 강조했다. 장기투자를 유도할 방안으로는 3년 이상 주식 보유자에 대한 배당소득세 분리과세와 인센티브를 제시했다.", "category": "운용·상품", "importance": 3, "source": "국민일보", "published": "2026-09-22", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000014162", "related": [{"title": "“자산 50%는 ‘코어자산’으로 두고 유동성 비중 20%는 지켜라”", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000014262"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": "2026-09-20", "url": "http://www.smarttimes.co.kr/news/articleView.html?idxno=49113", "related": [{"title": "잦은 이직에 끊기는 퇴직자산…사회복지인 전용 퇴직연금 논의 본격화", "source": "라이브뉴스", "url": "https://www.livesnews.com/news/article.html?no=64332"}]}, {"id": "e8a6030d9b80", "title": "국민연금 추납 2년새 2.8배…보험료율 9.5% 오르기 전 '막차'", "summary": "국민연금 추후납부 신청이 지난해 24만4329건으로 2023년 8만7644건 대비 2.8배 늘었다. 올해 상반기에만 10만6838건이 접수됐다. 연금개혁으로 보험료율이 해마다 0.5%포인트씩 올라 13%까지 인상되는데, 추납보험료는 신청 시점의 보험료율이 적용되기 때문에 인상 전 신청이 몰리고 있다. 국회입법조사처는 최대 허용 기간인 108~119개월 구간에 신청이 집중돼 형평성 문제가 있다고 지적했다.", "category": "가입자·사회", "importance": 3, "source": "매일신문", "published": "2026-09-20", "url": "https://www.imaeil.com/page/view/2026092007310108169", "related": [{"title": "\"한달 내고 평생 따박따박\"...'중국인 국민연금 추납'이 불러온 나비효과", "source": "한국경제TV", "url": "http://www.wowtv.co.kr/NewsCenter/News/Read?articleId=A202609200033&t=NN"}]}, {"id": "ffa2d67f4b53", "title": "기초연금 1인 84만원 내야…13년새 부담액 4배 급증", "summary": "2027년 생산가능인구(15~64세) 1인이 기초연금 재원으로 부담할 세금이 84만4000원으로 집계됐다. 제도가 도입된 2014년의 18만2000원과 비교하면 360% 늘어난 금액이다. 2027년 기초연금 총지출은 29조7000억원으로, 국비 25조6000억원과 지방비 4조1000억원으로 구성된다. 1986년생이 40~44세 5년간 부담하는 금액은 약 434만9000원, 2026년생이 같은 나이대에 부담할 금액은 1230만6000원으로 추산됐다.", "category": "가입자·사회", "importance": 3, "source": "한국경제", "published": "2026-09-20", "url": "https://www.hankyung.com/article/2026092063311", "related": [{"title": "[단독] 나는 435만원, 우리 애는 1230만원…미래세대 '폭탄' 온다", "source": "한국경제", "url": "https://www.hankyung.com/article/2026092063181"}]}, {"id": "db33f8626c83", "title": "“회사에 맡겼다가 후회합니다”…내 퇴직연금 직접 굴리면 [이병희의 연금술사]", "summary": "2026년 6월 말 기준 전체 퇴직연금 적립금은 553조9000억원이며 이 가운데 64%가 원리금 보장 상품에 머물러 있다. 원리금 보장상품의 10년 평균 수익률은 연 2.64%에 그친다. 기사는 임금 상승이 정체된 직장인이나 이직이 잦은 근로자에게는 확정기여형(DC)으로 적립금을 직접 운용하는 선택지가 있다고 설명한다. DC형에서는 위험자산에 최대 70%까지 투자할 수 있고 최소 30%는 안전자산으로 채워야 한다.", "category": "운용·상품", "importance": 3, "source": "이코노미스트", "published": "2026-09-25", "url": "https://economist.co.kr/article/view/ecn202609230024", "related": []}, {"id": "fee8001d52ad", "title": "[뱅커스토리] 조윤환 NH농협은행 부장 \"퇴직연금, 수익률 다음은 '연금'\"", "summary": "조윤환 NH농협은행 연금사업부장은 뉴스핌 인터뷰에서 은행·증권·보험 등 47개 퇴직연금 사업자가 경쟁하는 가운데 시장의 승부처가 단기 수익률을 넘어 안정적인 연금 수령으로 옮겨갈 것이라고 말했다. 올해 1분기 연금포털공시 기준 농협은행의 원리금비보장상품 운용 수익률은 DB 16.32%, DC 24.92%, IRP 24.82%였다. 원리금비보장상품 전체 가중평균 수익률은 지난해 2분기부터 올해 1분기까지 4분기 연속 주요 은행 1위를 유지했다. 농협은행은 영업점 직원 300여 명을 대상으로 자산관리 역량 교육을 진행하고 개인형 IRP 수익률 경진대회도 운영하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스핌", "published": "2026-09-25", "url": "https://www.newspim.com/news/view/20260923000536", "related": []}, {"id": "d16260c780e2", "title": "[전문가 칼럼] 2026년 하반기 달라지는 노동관계법령 점검", "summary": "2026년 하반기 시행되는 노동관계법령 개정 사항으로 퇴직급여 체불 처벌이 9월 18일부터 5년 이하 징역 또는 5천만원 이하 벌금으로 상향됐다. 도산 사업장 체불근로자에게 지급하는 대지급금 범위는 8월 20일부터 최종 3개월분에서 최종 6개월분으로 확대됐다. 임금 체불 처벌도 10월 8일부터 5년 이하 징역 또는 5천만원 이하 벌금으로 강화된다. 이 밖에 단기 육아휴직 신설, 배우자 출산전후휴가 확대, 배우자 유산·사산휴가 5일 신설, 4시간 근무 시 휴게시간 면제 신청 제도(12월 10일) 등이 함께 시행된다.", "category": "제도·규제", "importance": 3, "source": "조세금융신문", "published": "2026-09-25", "url": "https://www.tfmedia.co.kr/news/article.html?no=207409", "related": []}, {"id": "9d993719715a", "title": "추석 전 임금 체불 105억, 2년 연속 2조원…내달부터 처벌 수위 더 높아진다", "summary": "고용노동부가 추석 전 집중 지도·점검을 통해 체불액 105억4000만원을 적발했다. 이달 18일부터 퇴직급여 미지급에 대한 형사처벌이 기존 3년 이하 징역 또는 3000만원 이하 벌금에서 5년 이하 징역 또는 5000만원 이하 벌금으로 상향됐고, 다음 달 8일부터는 일반 임금체불에도 같은 법정형이 적용된다. 올해 7월까지 누적 체불액은 1조814억원, 피해 노동자는 12만8048명으로 집계됐다. 상반기 체불액의 74.2%는 30인 미만 사업장에서 발생했다.", "category": "제도·규제", "importance": 3, "source": "뉴스1", "published": "2026-09-24", "url": "https://www.news1.kr/economy/employment-labor/6300736", "related": []}, {"id": "1ae063536da8", "title": "수탁자보고서 공개 의무화… 운용사 양과 질 모두 개선 [경제 레이더]", "summary": "10년 만에 개정된 스튜어드십 코드로 자산운용사의 수탁자책임활동 보고서 공개가 의무화되면서 보고서의 내용과 분량이 개선됐다. KB자산운용은 보고서 분량을 기존 17페이지에서 48페이지로 약 3배 늘렸고, NH아문디자산운용은 올해 7월 금융감독원 의결권 행사 모범사례로 선정됐다. 삼성자산운용과 한국투자신탁운용은 보고서 수정을 이유로 아직 외부에 공개하지 않았고, 미래에셋자산운용은 지난 6월 공개했으나 예년 대비 내용과 분량에 큰 변화가 없었다. 국민연금공단이 위탁운용사의 수탁자책임활동을 평가해 운용사 선정과 자금 배정·회수에 반영하기로 한 조치가 개선의 동력으로 작용했다.", "category": "법인·자금운용", "importance": 3, "source": "세계일보", "published": "2026-09-24", "url": "https://www.segye.com/newsView/20260923510904", "related": []}, {"id": "4fe8d9751f94", "title": "기초연금 반쪽개편·지역의사제 첫 선발…정책 실효성 점검 [미리보는 국감-보건복지]", "summary": "올해 보건복지위원회 국정감사에서 기초연금 개편안의 실효성이 쟁점으로 다뤄진다. 기초연금 예산은 올해 23조1000억원에서 내년 25조7000억원으로 11% 늘어나며, 소득 하위 30% 부부가구 수급액은 월 56만원에서 월 68만4000원으로 최대 12만4000원 오른다. 하위 30~45% 부부가구는 최대 8만6000원을 더 받고, 부부감액률은 현행 20%에서 10%로 낮아지며, 직역연금 수급자 중 저소득층 11만명이 새로 지원 대상에 포함된다. 당초 검토된 하후상박 구조 가운데 저소득층 지원만 반영돼 반쪽개편에 그쳤다는 지적이 나온다.", "category": "가입자·사회", "importance": 3, "source": "데일리안", "published": "2026-09-24", "url": "https://www.dailian.co.kr/news/view/1694286/?sc=Naver", "related": []}, {"id": "baadcd0bca6c", "title": "新리딩뱅크 경쟁, 본업은 기본…비이자 포트폴리오 강화 화두로", "summary": "은행권의 리딩뱅크 경쟁이 순이익과 대출 규모를 넘어 기업금융·자산관리(WM)·퇴직연금·외환·자본시장에서 안정적 수익원을 확보하는 포트폴리오 대결로 확장되고 있다. KB국민은행은 예대사업 경쟁력 강화와 함께 WM·CIB·자본시장 사업모델 고도화를 추진하고, 신한은행은 자산관리와 외환·신탁·퇴직연금을 결합한 종합 솔루션 제공을 전략으로 제시했다. 하나은행은 외환·무역금융 강점에 PB·퇴직연금·신탁을 결합해 상반기 연결기준 이자부문 이익 4조4645억원, 수수료부문 3982억원, 신탁부문 2160억원을 기록했다. 우리은행은 기업금융을 중심으로 자산관리·연금·트레이딩을 강화해 비이자수익 기반을 넓히고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "시사오늘", "published": "2026-09-24", "url": "https://www.sisaon.co.kr/news/articleView.html?idxno=204700", "related": []}, {"id": "c9986943854b", "title": "“이번 추석 부모님 용돈 얼마 드리지?” 고민하면서 매달 받는 연금 액수는 모른다는데", "summary": "국민연금공단의 2026년 5월 기준 공표통계에 따르면 5월 한 달간 노령연금을 받은 660만5623명 가운데 월 수령액이 60만원 미만인 사람이 412만3018명으로 전체의 62.4%였다. 월 100만원 미만은 546만4404명으로 82.7%에 달했고, 월 200만원 이상은 12만9265명으로 약 2.0%였다. 노령연금 월평균 수급액은 70만5370원이며, 가입 기간 20년 이상은 117만2536원, 10~19년은 45만2051원으로 차이가 컸다. 이 수령액에는 기초연금과 퇴직연금, 개인연금은 포함되지 않았다.", "category": "가입자·사회", "importance": 3, "source": "매일경제", "published": "2026-09-24", "url": "https://www.mk.co.kr/article/12160816", "related": []}, {"id": "61e43e37939d", "title": "[만나보니] [미래에셋자산운용] 여경진 팀장 \"연금도 개인화 시대…TDF·ETF·RA 잇는다\"", "summary": "여경진 미래에셋자산운용 연금플랫폼본부 팀장은 퇴직연금 시장이 '금리를 비교하는 시장'에서 '투자 방법을 선택하는 시장'으로 변화하고 있다고 진단했다. 확정기여형(DC)과 개인형퇴직연금(IRP)의 비중이 커지면서 가입자가 직접 퇴직연금을 운용하는 경우가 늘어난 영향이다. 미래에셋자산운용은 고객의 관여 수준에 따라 저관여 고객에게는 TDF와 타깃리스크펀드(TRF)를, 직접 운용을 원하는 고객에게는 ETF를, 그 사이의 중관여 고객에게는 로보어드바이저(RA)를 제공하는 전략을 펴고 있다. 올해 8월 말 기준 이 회사의 TDF 순자산은 약 9조8000억원, 시장점유율은 30.1%다.", "category": "업계·경쟁사", "importance": 3, "source": "딜사이트경제TV", "published": "2026-09-24", "url": "https://news.dealsitetv.com/articles/176262", "related": []}]}, "monthly": {"period": "monthly", "key": "current", "label": "2026-08-26 ~ 2026-09-25", "generated_at": "2026-09-26T15:17:11+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": [{"title": "퇴직연금 문 열린 개인용 국채…첫 선택은 10년물에 쏠렸다", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436449"}, {"title": "개인 퇴직연금 계좌 통해 장기국채 투자 길 열렸다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712685/2"}, {"title": "개인 국채투자, '퇴직연금서 투자'에 흥행…9월 청약서 초과 수요", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260917099600008"}, {"title": "\"1억 넣어두면 20년 뒤 2.6억\"…연금개미들 외면한 이유", "source": "한국경제", "url": "https://www.hankyung.com/article/202609168563i"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 확정 수익 60%\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/14/2026091490036.html"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 60% 확정 수익\"", "source": "TV조선", "url": 이", "url": "https://www.etoday.co.kr/news/view/2624549"}]}, {"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "8bb193e0ea59", "title": "“정부 기초연금개편안, 겉으로는 하후상박 실제는 재정 절감안”", "summary": "정부가 노인 하위 70%를 세 집단으로 나눠 차등 지급하는 하후상박 방식을 내놨다. 하위 30%에 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원(동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": [{"title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "source": "슬로우뉴스", "url": "https://slownews.kr/166386"}, {"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "aea0c5c117f7", "title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "summary": "미래에셋생명은 22일 퇴직연금 보증형 실적배당보험이 출시 이후 지난달 말까지 717억원의 모집 성과를 기록했다고 밝혔다. 이 상품은 개인형퇴직연금(IRP) 계좌를 통해서만 가입할 수 있는 거치형 상품으로, 만 50세부터 적립금을 일시에 예치해 가입할 수 있다. 만 55세부터는 원하는 시점에 연금을 개시할 수 있고, 만 55세를 넘긴 가입자는 가입과 동시에 연금 수령도 가능하다. 일임형 자산배분펀드와 연계해 보장된 인출 구조와 글로벌 분산투자를 함께 추구하는 구조다.", "category": "업계·경쟁사", "importance": 2, "source": "연합인포맥스", "published": "2026-09-22", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024", "related": [{"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": "2026-09-20", "url": "http://www.smarttimes.co.kr/news/articleView.html?idxno=49113", "related": [{"title": "잦은 이직에 끊기는 퇴직자산…사회복지인 전용 퇴직연금 논의 본격화", "source": "라이브뉴스", "url": "https://www.livesnews.com/news/article.html?no=64332"}]}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발생했으나 회수된 금액은 없다.", "category": "법인·자금운용", "importance": 3, "source": "시장경제신문", "published": "2026-09-16", "url": "https://www.meconomynews.com/news/articleView.html?idxno=201626", "related": [{"title": "홈플러스, 9개월간 임금체불 3871억…퇴직금도 미지급", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1690418/"}]}, {"id": "f22427d51808", "title": "NH농협은행, 2026년 제2차 투자상품 완전판매 대토론회 개최", "summary": "NH농협은행은 17일 서울 중구 본사에서 2026년 제2차 투자상품 완전판매 대토론회를 열었다. 투자상품 미스터리쇼핑 만점자와 영업본부 완전판매 TOP리더 등 약 40명이 참석해 펀드·방카슈랑스·신탁·퇴직연금 부문의 상담 준비, 상품 설명, 적합성·적정성 원칙 준수 사례를 공유했다. NH농협은행은 토론회 내용을 영상으로 제작해 영업점 교육자료로 활용할 계획이다. 박현동 투자상품부문 부행장은 완전판매가 절차 준수에 그치지 않고 고객 입장에서 충분히 설명하고 신뢰를 쌓는 과정이라고 강조했다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스퀘스트", "published": "2026-09-17", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=301184", "related": [{"title": "농협은행, 투자상품 완전판매 대토론회 개최…미스터리쇼핑 만점자 우수사례 공유", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146703"}]}, {"id": "ab894d0c4867", "title": "[금융 HOT 뉴스] KB자산운용, 골드 특별자산 펀드 눈길", "summary": "KB자산운용이 골드 특별자산 펀드의 운용 구조를 파생상품 중심에서 국내외 금 ETF 활용 방식으로 바꿨다. 파생상품 위험평가액을 40% 이하로 낮춰 퇴직연금 적격 요건을 충족했고 운용보수는 기존 대비 약 40% 인하했다. 비교지수는 LBMA Gold PM Price로 변경했고 환매대금은 4영업일 내에 지급한다. 현재 국민은행과 신한투자증권의 퇴직연금 계좌에서 매매할 수 있다.", "category": "운용·상품", "importance": 2, "source": "비즈월드", "published": "2026-09-16", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146330", "related": [{"title": "KB자산운용, 18년 된 금 펀드 손질…퇴직연금서도 투자", "source": "AP신문", "url": "https://www.apnews.kr/news/articleView.html?idxno=3051270"}]}, {"id": "26bad6a1c84a", "title": "이형일 \"500조 규모 퇴직연금, 수익률 저조…법안 준비 중\"", "summary": "이형일 부총리 겸 재정경제부 장관 후보자가 9월 15일 국회 재정경제기획위원회 인사청문회에서 퇴직연금 제도 개선과 관련해 노사정이 합의한 사항을 바탕으로 법안을 준비하고 있다고 밝혔다. 이 후보자는 퇴직연금 적립금이 500조원까지 올라갔는데 수익률이 저조하다며 노후소득 보장 기능이 제대로 작동하고 있느냐는 논의가 많다고 말했다. 노사정은 지난 2월 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화에 합의했고, 정부는 이를 바탕으로 연내 근로자퇴직급여보장법 개정을 추진하고 있다. 이광재 의원이 미국 401(k)를 거론하며 국가적 시스템이 필요하다고 지적한 데 대한 답변이다.", "category": "제도·규제", "importance": 5, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/economy/trend/6290971", "related": []}, {"id": "ffde5c86587a", "title": "'공시 넘어 사후관리'…디폴트옵션 3년, 최초 평가 시동", "summary": "고용노동부가 올해 디폴트옵션 승인 상품에 대한 첫 정기 평가를 실시한 : 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "aea0c5c117f7", "title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "summary": "미래에셋생명은 22일 퇴직연금 보증형 실적배당보험이 출시 이후 지난달 말까지 717억원의 모집 성과를 기록했다고 밝혔다. 이 상품은 개인형퇴직연금(IRP) 계좌를 통해서만 가입할 수 있는 거치형 상품으로, 만 50세부터 적립금을 일시에 예치해 가입할 수 있다. 만 55세부터는 원하는 시점에 연금을 개시할 수 있고, 만 55세를 넘긴 가입자는 가입과 동시에 연금 수령도 가능하다. 일임형 자산배분펀드와 연계해 보장된 인출 구조와 글로벌 분산투자를 함께 추구하는 구조다.", "category": "업계·경쟁사", "importance": 2, "source": "연합인포맥스", "published": "2026-09-22", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024", "related": [{"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}, {"id": "354ed5723a15", "title": "삼성자산운용·미래에셋증권, 푸른씨앗 OCIO 수성", "summary": "국내 최초 기금형 퇴직연금인 푸른씨앗(중소기업퇴직연금기금) 자금을 굴릴 OCIO 전담운용기관에 삼성자산운용과 미래에셋증권이 재선정됐다. 삼성자산운용이 종합평점 92.915점, 미래에셋증권이 90.761점으로 우선협상대상자에 올랐다. 2022년 9월 첫 사업자 선정 이후 4년 만의 재선정이다. 2기 운용 기간은 2026년 9월 1일부터 2030년 8월 31일까지다.", "category": "법인·자금운용", "importance": 4, "source": "한국금융신문", "published": "2026-06-09", "url": "https://www.fntimes.com/html/view.php?ud=202606091842068772179ad43907_18", "related": []}, {"id": "5895ec3e71a7", "title": "20년 만에 퇴직연금 제도 대대적 개편…모든 사업장 의무화 추진", "summary": "정부가 2월 노사정 공동선언을 바탕으로 퇴직연금 제도를 대폭 개편한다. 7월까지 구체적 방안을 확정한 뒤 연내 관련 법 개정을 추진하고, 모든 사업장에 퇴직연금을 단계적으로 의무화할 방침이다. 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화가 핵심 축이다. 1년 미만 근로자 등 사각지대 해소도 함께 추진된다.", "category": "제도·규제", "importance": 4, "source": "대한민국 정책브리핑", "published": "2026-03-11", "url": "https://www.korea.kr/news/policyNewsView.do?newsId=148960665", "related": []}, {"id": "6e2fe502ecb5", "title": "미래에셋증권, 퇴직연금 로보Wrap 출시…AI가 자산배분·매매 맡는다", "summary": "미래에셋증권이 IRP 계좌용 로보어드바이저 일임 서비스 퇴직연금 로보Wrap을 출시했다. 알고리즘이 글로벌 자산배분 포트폴리오를 구성하고 시장 상황에 맞춰 리밸런싱과 매매까지 수행한다. 7월 말 기준 누적 가입 계좌는 14만좌, 누적 가입금액은 8조3000억원이다.", "category": "운용·상품", "importance": 3, "source": "뉴스핌", "published": "2026-08-05", "url": "https://www.newspim.com/news/view/20260805001063", "related": []}, {"id": "676b0ae84927", "title": "신한 적립액 54조 독주…국민·하나, IRP 중심 2위 경쟁", "summary": "2026년 1분기 퇴직연금 랭킹에서 신한이 적립액 54조원으로 선두를 지켰다. 국민은행과 하나은행이 IRP를 중심으로 2위 자리를 놓고 다투고 있다. 은행권 IRP 적립금은 83조7000억원으로 전체 시장의 31.7%를 차지했다.", "category": "업계·경쟁사", "importance": 3, "source": "한국금융신문", "published": "2026-04-21", "url": "https://www.fntimes.com/html/view.php?ud=2026042117435794185e6e69892f_18", "related": []}, {"id": "ecca1d1f70f8", "title": "기금형 퇴직연금은 결과 아닌 과정 책임으로…사외적립의무는 속도조절 요구", "summary": "노사정과 전문가가 참여한 정책 토론회에서 기금형 퇴직연금 도입 방향이 논의됐다. 전문가들은 운용 주체의 책임을 결과가 아닌 과정, 즉 의사결정 절차의 적정성으로 전환해야 한다고 주장했다. 경영계는 중소기업 부담을 이유로 사외적립 의무화의 단계적 시행을 요구했다. 한국노총과 한국경영자총협회, 고용노동부, 한국투자증권 관계자가 참석했다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-04-08", "url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=04598566645414152", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
