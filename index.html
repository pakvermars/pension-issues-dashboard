  /* ── 팔레트 ───────────────────────────────────────────────
     잉크 네이비 위에 차가운 석재 종이. 강조색은 적립·성장을 뜻하는

  :root {

      --cat-1: #7E9BD4;

      --kiwoom: #FF7A63;

  * { box-sizing: border-box; }

  body {

    background: var(--paper);
    color: var(--ink);

  .rail {

  article[data-cat="4"] .badge { color: var(--cat-4); }

    letter-spacing: 0.02em;

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;

  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

경남도민연금은 가입자가 개인형퇴직연금(IRP)에 월 8만원을 납입하면 경상남도와 시·군이 월 2만원을 추가로 지원하는 제도다. 10년간 받을 수 있는 지원액은 최대 240만원이며, 납입액은 연금계좌 세액공제 대상이다. 국민연금을 받기 전 소득 공백기의 생활비를 보완하는 것이 제도의 목적이다. 서울시도 월 8만원을 납입하면 2만원을 지원하는 '서울형 낀세대 연금'을 추진하고 있다.", "category": "제도·규제", "importance": 3, "source": "그린포스트코리아", "published": "2026-09-12", "url": "https://www.greenpostkorea.co.kr/news/articleView.html?idxno=307446"}, {"id": "d072ff0c20ba", "title": "개인투자용 국채 품은 퇴직연금 계좌···증권사, 연금자금 유치전", "summary": "이달부터 DC·IRP 퇴직연금 계좌로 개인투자용 국채를 매수할 수 있게 되면서 증권사들이 연금 자금 유치에 나섰다. 9월 9일부터 15일까지 청약하는 10년물과 20년물의 표면금리는 각각 연 4.415%와 연 4.570%이고 가산금리는 두 상품 모두 0.35%포인트로, 세전 총수익률은 약 59.28%와 161.3%다. 판매사는 미래에셋증권·삼성증권·한국투자증권·KB증권·NH투자증권 5곳이며 이번 발행 규모는 1750억원으로 전체 적립금의 약 0.03% 수준이다. 2분기 말 퇴직연금 적립금 553조8779억원 가운데 증권사 몫은 165조468억원으로 1년 새 46.6% 늘어 은행권 증가율 19.5%를 앞섰고, 미래에셋증권·삼성증권·한국투자증권 세 곳은 평균 58% 증가했다.", "category": "업계·경쟁사", "importance": 3, "source": "서울파이낸스", "published": "2026-09-12", "url": "https://www.seoulfn.com/news/articleView.html?idxno=637698"}, {"id": "7e3199b91715", "title": "200조 투자액 절반인 정보공개 '깜깜이' [국민연금 대체투자 지도]③", "summary": "국민연금 기금운용본부가 공시한 종목별 투자 현황에 따르면 지난해 말 부동산·인프라·사모·멀티에셋 대체투자액은 195조1760억원이다. 이 가운데 투자처가 전부 또는 일부 비공개된 금액은 106조2697억원으로 전체의 54.5%를 차지했다. 2024년 말에는 172조6346억원 가운데 89조3533억원(51.8%)이 비공개였고, 1년 사이 비공개 금액이 16조9164억원 늘고 비중은 2.7%포인트 상승했다. 자산군별로는 인프라의 88.8%인 54조1239억원이 가려졌고 부동산은 48.4%, 사모투자는 33.1%였으며, 국민연금은 운용사의 정보공개 비동의나 민감한 투자정보를 이유로 종목명을 공개하지 않는다고 설명했다.", "category": "법인·자금운용", "importance": 3, "source": "이투데이", "published": "2026-09-12", "url": "https://www.etoday.co.kr/news/view/2622220"}, {"id": "34ed9637f680", "title": "[이법저법] 간호사 퇴직금·실장 인센티브 어떻게?…병원 노무관리 A to Z", "summary": "소규모 병원의 근로관계 분쟁을 예방하기 위한 노무관리 법률 조언을 다뤘다. 퇴직금 부담을 줄이려고 연봉에 퇴직금을 포함해 매달 나눠 지급하기로 한 약정은 근로자퇴직급여 보장법 위반으로 인정되기 어렵다고 짚었다. 이 경우 월급과 함께 지급한 퇴직금이 평균임금에 포함돼 오히려 예상보다 많은 퇴직금 부담이 발생할 수 있다. 법무법인 오라클 최형근 변호사는 퇴직 시 일괄 지급하거나 퇴직연금제도를 활용하라고 조언했다.", "category": "제도·규제", "importance": 2, "source": "이투데이", "published": "2026-09-12", "url": "https://www.etoday.co.kr/news/view/2624456"}, {"id": "16fcd9a710f9", "title": "['픽' ETF] 흔들리는 안전자산…美 '단기채 ETF' 부상", "summary": "장기채 가격 변동성이 커지면서 주식 60·채권 40이라는 전통적 자산배분 공식이 흔들리고, 금리 변동에 상대적으로 강한 미국 단기국채를 섞은 ETF로 수요가 옮겨가고 있다. 국내에는 삼성전자·SK하이닉스와 미국 단기국채를 50대 50으로 담은 상품들이 출시됐다. 이들 상품은 채권혼합형으로 분류돼 퇴직연금 계좌에서 100%까지 편입할 수 있다. 위험자산 70% 한도를 다른 주식형 ETF로 채우고 남은 30%를 이 상품에 배분하면 계좌 전체 기준 실질 주식 익스포저를 최대 85%까지 끌어올릴 수 있다는 설명이다.", "category": "운용·상품", "importance": 2, "source": "주간한국", "published": "2026-09-12", "url": "https://weekly.hankooki.com/news/articleView.html?idxno=7183731"}, {"id": "31211fd35333", "title": "[주末머니] \"성장·배당 모두 그립감 좋다\" 9년만에 숙원 푼 이 기업", "summary": "현대차증권이 삼성증권에 대해 투자의견 매수와 목표주가 14만6000원을 제시했다. 삼성증권이 9년 만에 금융당국으로부터 발행어음 인가를 받은 점을 근거로 들었다. 올해 연결지배순이익은 전년 대비 67.1% 늘어난 1조7000억원, ROE는 19.3%로 전망했다. 리테일 고객 예탁자산이 100조원을 넘고 고액자산가 고객이 57만2000명에 이르는 가운데 랩어카운트와 퇴직연금의 성장세가 두드러진다고 평가했다.", "category": "업계·경쟁사", "importance": 2, "source": "아시아경제", "published": "2026-09-12", "url": "https://view.asiae.co.kr/article/2026091109540549675"}, {"id": "3b41b890e25a", "title": "\"1000만원 넣으면 20년 뒤 2600만원\" 정부표 재테크 투자해도 될까", "summary": "정부가 세제 혜택과 기여금을 얹은 자산형성 상품을 잇따라 내놓고 있다. 9월 발행 개인투자용 국채 20년물은 적용금리가 연 4.920%로 1000만원을 넣고 20년을 보유하면 세전 약 2613만원을 받고, 10년물은 연 4.765%로 약 1593만원을 받는다. 개인투자용 국채는 이달부터 DC·IRP 퇴직연금 계좌를 통해서도 살 수 있다. 30일부터 15영업일간 6000억원 규모로 선착순 판매되는 2차 국민참여성장펀드는 최대 1800만원 소득공제를 받을 수 있지만 5년간 자금이 묶이고 원금손실 가능성이 있으며, 1차 펀드 수익률은 8월 초 -3.7%에서 최근 -1%대로 회복했다.", "category": "운용·상품", "importance": 2, "source": "헤럴드경제", "published": "2026-09-12", "url": "https://biz.heraldcorp.com/article/10871096"}, {"id": "9246f7a93259", "title": "LG AI연구원, 국민연금과 '기금운용 특화 AI' 만든다", "summary": "LG AI연구원과 국민연금공단이 11일 서울 강서구 마곡에서 기금운용 특화 AI를 공동 개발하는 업무협약을 체결했다. 첫 협력 과제는 글로벌 외환시장의 변동성을 분석하는 AI 기반 환율 분석 서비스다. LG의 금융 특화 AI '엑사원 BI'를 활용해 거시경제 지표와 시장 뉴스, 리서치 보고서를 통합 분석한다. 국민연금공단은 환율 분석 서비스의 성과를 검증한 뒤 자산배분과 투자 판단 등 기금운용 전반으로 AI 활용 범위를 단계적으로 확대할 계획이다.", "category": "법인·자금운용", "importance": 2, "source": "비즈월드", "published": "2026-09-12", "url": "https://www.bizwnews.com/news/articleView.html?idxno=146072"}, {"id": "7aa1016d77e3", "title": "[금상소] IRP·DC에 들어온 개인투자용 국채…10년·20년물 뭐가 나을까", "summary": "이달부터 신한·하나·NH농협은행과 미래에셋·삼성·한국투자·KB·NH투자증권 등 8개 금융사를 통해 DC형 퇴직연금과 IRP 계좌에서 개인투자용 국채 10년물과 20년물을 살 수 있다. 9월 발행분의 만기 보유 시 적용금리는 10년물 연 4.765%, 20년물 연 4.920%로, 각각 1000만원을 넣으면 만기에 약 1593만원과 약 2613만원이 된다. IRP와 DC형은 적립금의 30%를 안전자산으로 운용해야 해 연 3%대에서 4%대 초반인 정기예금의 대안이 될 수 있지만, 가입 1년 뒤 중도환매하면 가산금리와 연복리 혜택이 사라진다. 김동엽 미래에셋투자와연금센터 상무는 20·30대는 20년물, 40대 이후는 10년물 중심으로 가져가고 은퇴를 앞둔 가입자는 만기를 나눠 배치하는 '채권 사다리' 전략을 활용할 수 있다고 조언했다.", "category": "운용·상품", "importance": 2, "source": "이투데이", "published": "2026-09-12", "url": "https://www.etoday.co.kr/news/view/2624549"}, {"id": "fca3beff473f", "title": "퇴직연금 500조 시대…AI 시대의 연금 투자법에 답하다", "summary": "퇴직연금 적립금이 500조원대에 이른 상황에서 연금 계좌의 ETF 활용법을 다룬 신간 '처음 하는 ETF 연금 투자'를 소개했다. 책은 '2030부터 60대까지 AI ETF 세대별 연금 배분법'을 부제로 내걸고 세대별 자산배분 방법을 제시한다. AI 밸류체인 관련 종목과 국내상장 ETF를 연금 계좌에서 활용하는 방법을 함께 다룬다.", "category": "운용·상품", "importance": 1, "source": "뉴스1", "published": "2026-09-12", "url": "https://www.news1.kr/life-culture/book/6286920"}]}, "weekly": {"period": "weekly", "key": "2026-W37", "label": "2026-W37 (2026-09-07 ~ 2026-09-13)", "generated_at": "2026-09-12T19:39:14+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": [{"title": "“20년 묻어두면 수익률 161%”…퇴직연금 국채, 증권사 유치전 불붙었다", "source": "디지털데일리", "url": "https://www.ddaily.co.kr/page/view/2026091010295983047"}, {"title": "“예금 이자론 성 안 차”…은행 퇴직연금, 국채 품고 반격할까", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1688375/"}, {"title": "개인투자용 국채 품은 퇴직연금 계좌···증권사, 연금자금 유치전", "source": "서울파이낸스", "url": "https://www.seoulfn.com/news/articleView.html?idxno=637698"}, {"title": "[금상소] IRP·DC에 들어온 개인투자용 국채…10년·20년물 뭐가 나을까", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2624549"}]}, {"id": "989838fe6c31", "title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "summary": "550조원 규모 퇴직연금 시장을 바꿀 기금형 퇴직연금 가이드라인 발표가 계속 미뤄지고 있다. 오는 15일 열릴 예정이던 주요 퇴직연금 사업자 CEO 간담회는 추석 이후로 연기됐다. 국민연금은 \"수수료는 3분의 1, 수익률은 3배\"를 앞세워 공공기관 기금 수탁과 민간 연합형 기금의 OCIO 진출을 추진하고 있으나, 최상위 발주처가 민간 경쟁에 직접 뛰는 이해상충을 두고 업계 반발이 거세다. 당국은 신설 수탁법인이 기존 사업자의 계약형 인프라를 위탁할 수 있도록 가닥을 잡았고, 10곳 안팎의 사전인가제 도입 가능성이 거론된다.", "category": "제도·규제", "importance": 5, "source": "인베스트조선", "published": "2026-09-11", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html", "related": [{"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "69dd458f15f4", "title": "퇴직연금 550조 커졌는데…보험사 점유율 20% 무너졌다", "summary": "퇴직연금 시장이 553조원대로 커지는 사이 보험업계 점유율이 20% 아래로 떨어졌다. 상반기 증권사는 4조1000억원 순유입을 기록한 반면 보험사는 1799억원 순유출을 냈다. 실물이전 확대로 가입자가 금융사를 옮기기 쉬워지면서 사업자 간 경쟁이 격화된 결과다. DB형에 집중된 포트폴리오가 약점으로 지목되자 삼성·한화·교보생명 등이 DC형·IRP 강화와 ETF 상품 확대로 대응하고 있다.", "category": "업계·경쟁사", "importance": 5, "source": "뉴데일리", "published": "2026-09-10", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/10/2026091000173.html", "related": []}, {"id": "de4a8500263d", "title": "수익률 32%에도 돈이 안 온다…디폴트옵션의 역설", "summary": "디폴트옵션 시행 3년 차 데이터에서 적극투자형 1년 수익률이 32.66%를 기록했으나 자금의 82.5%는 여전히 안정형에 머물러 있다. 은행권은 고객 자금 대부분을 안정형에 두는 반면 증권사 고객은 위험자산에 투자해 업권별로 뚜렷이 갈렸다. 제도의 병목은 상품 품질이 아니라 자금이 좋은 상품에 도달하는 경로에 있다는 지적이다.", "category": "운용·상품", "importance": 5, "source": "한경머니", "published": "2026-09-10", "url": "https://magazine.hankyung.com/money/article/202608199155c", "related": []}, {"id": "937d44176934", "title": "퇴직연금 6.9조 이동…은행서 증권사로 자금 쏠림, 국채로 2차 경쟁", "summary": "올해 상반기 퇴직연금 실물이전 규모가 약 6조9000억원으로 전년 동기 약 3조2000억원의 2.2배에 달해 2024년 제도 시행 이후 반기 기준 최대를 기록했다. 업권별로는 증권사가 4조1513억원 순유입, 은행이 3조9714억원 순유출, 보험이 1799억원 순유출이었고, 증권사 적립금은 2분기 말 165조468억원으로 1분기 대비 16.5% 늘어 은행권 증가율 6.6%를 크게 앞섰다. 실물이전 규모는 가입자가 직접 상품을 고르는 IRP에서 6조8000억원으로 가장 컸다. 9월부터 개인투자용 국채가 DC·IRP 계좌에 편입되면서 증권사는 안정형 상품까지 더해 고객 확보에 나서고, 은행권은 ETF 거래 편의성 개선으로 맞서고 있다.", "category": "운용·상품", "importance": 5, "source": "더트래커", "published": "2026-09-10", "url": "https://thetracker.co.kr/View.aspx?No=4221950", "related": []}, {"id": "6dd0fa0960d5", "title": "퇴직연금 디폴트옵션 첫 순유출…2분기 1조4000억 감소", "summary": "디폴트옵션 운용자금이 2023년 제도 도입 후 처음으로 순유출을 기록해 2분기에 약 1조4000억원이 줄었다. 안정형에서만 1조4891억원이 빠져나갔고, 증시 호황으로 위험자산 투자가 늘면서 자금이 대거 이동했다. 평가액 기준 적립액 증가는 117억원에 그쳐 시장 전체 증가분 45조2000억원에 비하면 미미한 수준이다.", "category": "운용·상품", "importance": 5, "source": "한국경제", "published": "2026-09-08", "url": "https://www.hankyung.com/article/202609081009i", "related": []}, {"id": "362d60df2f63", "title": "퇴직연금도 자산배분 시대…NH투자증권, DB 적립금 컨설팅 강화", "summary": "NH투자증권이 연금자산관리본부 산하 DB적립금 운용 협의체를 통해 기업별 맞춤형 IPS(적립금운용계획서) 컨설팅을 확대한다. DB형은 적립금 수익률이 임금상승률에 못 미치면 기업이 추가 적립을 부담해야 해 자산배분 전략의 필요성이 커지고 있다. 전담 계리사와 자산배분·포트폴리오 전문가로 구성된 협의체가 부채 분석부터 리밸런싱까지 5단계로 지원한다. 고객사 한국선급은 IPS 개정 후 DB 적립금 1년 수익률이 5월 말 기준 20%를 넘어 고용노동부·금융감독원 모범사례로 선정됐다.", "category": "법인·자금운용", "importance": 5, "source": "매일경제", "published": "2026-09-08", "url": "https://www.mk.co.kr/news/stock/12147172", "related": []}, {"id": "f7cf0468c30c", "title": "정부, 올 하반기 퇴직연금 디폴트옵션 손질", "summary": "고용노동부가 올해 하반기 기금형 퇴직연금 도입과 함께 디폴트옵션(사전지정운용제도)도 개편하겠다고 밝혔다. 대기기간과 디폴트옵션 상품 평가체계를 명확히 하고, 현재 제도가 적용되지 않는 자금까지 적용 범위를 넓히는 것이 핵심이다. 현재 디폴트옵션 자금의 82.5%가 안정형에 쏠려 있는 점도 개선 대상으로 지목됐다. 정부는 퇴직연금 의무화와 사외적립 의무화를 함께 추진하며 올 하반기를 퇴직연금 대격변기로 보고 있다.", "category": "제도·규제", "importance": 5, "source": "파이낸셜뉴스", "published": "2026-09-07", "url": "https://www.fnnews.com/news/202609071643275392", "related": []}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "99fcd85edc4b", "title": "[내 퇴직연금 뜯어보니 ③] '선택과 책임은 노동자, 결정은 회사' 구조 바꾸려면?", "summary": "고용노동부가 내년 퇴직연금사업자 평가제도를 전면 개편한다. 정성평가 비중을 줄이고 수익률 등 정량평가를 강화해 전체 사업자의 순위를 공개하는 방안을 추진하며, 교육·정보제공 의무도 주기적으로 점검한다. 지난해 퇴직연금 수익률은 6.47%로 제도 도입 이후 최고치였지만, 적립금의 84%를 실적배당형에 넣은 상위 10%는 평균 19.5%, 원리금보장형에 74%를 둔 하위 10%는 0.5%에 그쳤다. 지난해 유형별 수익률은 DC형 8.47%, IRP 9.44%, DB형 3.53%였다.", "category": "제도·규제", "importance": 4, "source": "매일노동뉴스", "published": "2026-09-11", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236734", "related": []}, {"id": "d08069641dee", "title": "디폴트옵션 안정형 85% '쏠림'…위험회피 연금 가입자들 [디폴트옵션 작동 구조 (상)]", "summary": "2025년 말 기준 디폴트옵션 투자유형 가운데 안정형 적립금이 45조5000억원으로 전체 53조3000억원의 85.4%를 차지했다. 안정형을 지정한 가입자수도 583만명으로 전체 734만명의 79.4%에 달했다. 반대편인 적극투자형은 적립금 1조4000억원으로 전체의 2.6%, 가입자 39만명으로 5.3%에 그쳤다. 안정투자형 적립금은 3조9000억원(7.3%), 중립투자형은 2조5000억원이었다.", "category": "운용·상품", "importance": 4, "source": "한국금융신문", "published": "2026-09-11", "url": "https://www.fntimes.com/html/view.php?ud=202609102100372851179ad43907_18", "related": []}, {"id": "7280de2d77b4", "title": "국채 이어 IMA까지…퇴직연금 확대에 증권사 희비 엇갈릴까", "summary": "이달부터 확정기여형(DC)과 개인형퇴직연금(IRP) 계좌에서 개인투자용 국채 10년물과 20년물에 직접 투자할 수 있게 됐고 첫 청약은 지난 9일 시작됐다. 고용노동부와 금융감독원은 지난 3월 발행어음과 종합투자계좌(IMA)의 퇴직연금 투자 허용을 금융위원회에 건의할 예정이라고 밝혔다. 자본시장연구원에 따르면 2025년 말 기준 전체 퇴직연금 시장에서 증권업 점유율은 26.2%, IRP에서는 35.5%다. IMA는 자기자본 8조원 이상 종합금융투자사업자로 취급이 제한돼 현재 미래에셋증권·한국투자증권·NH투자증권 3개사만 가능한 만큼, 허용될 경우 증권사 간 상품 라인업 격차가 벌어질 수 있다는 우려가 나온다.", "category": "제도·규제", "importance": 4, "source": "뉴스웨이", "published": "2026-09-11", "url": "https://www.newsway.co.kr/news/view?ud=2026091114253182016", "related": []}, {"id": "868631f1c398", "title": "이찬진 금감원장, 영국 FCA와 기금형 퇴직연금 감독체계 논의", "summary": "이찬진 금융감독원장이 런던 방문 중 영국 금융행위감독청(FCA) 부청장과 만나 기금형 퇴직연금 도입에 대비한 감독체계를 놓고 의견을 교환했다. 양국 당국은 연금 성과평가와 가입자 보호 체계에 대한 감독 경험을 계속 공유하기로 했다. 구체적인 감독 방안이나 일정은 공개되지 않았다.", "category": "제도·규제", "importance": 4, "source": "뉴스핌", "published": "2026-09-10", "url": "https://www.newspim.com/news/view/20260910000409", "related": []}, {"id": "8bb193e0ea59", "title": "“정부 기초연금개편안, 겉으로는 하후상박 실제는 재정 절감안”", "summary": "정부가 노인 하위 70%를 세 집단으로 나눠 차등 지급하는 하후상박 방식을 내놨다. 하위 30%에 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원(동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": []}, {"id": "90c48aab5817", "title": "배광수 NH투자증권 대표, 210조 DB연금 승부…퇴직연금 '혁신'", "summary": "NH투자증권이 OCIO(외부위탁운용관리) 사업에서 쌓은 자산배분 역량을 DB형 퇴직연금에 적용하고 있다. 전체 퇴직연금 적립금 501조4000억원 가운데 DB형은 228조9000억원으로 45.7%를 차지하지만 이 중 91.9%가 원리금보장형에 머물러 있다. 2025년 DB형 연간 수익률은 3.5%로 DC형 8.5%, IRP 9.4%에 못 미쳤고, 최근 5년 누적 수익률 15.9%는 같은 기간 임금상승률 18.9%를 밑돌았다. 한국선급은 NH투자증권과 포트폴리오를 재편해 올해 5월 말 기준 DB 적립금 1년 수익률이 20%를 넘어섰다.", "category": "법인·자금운용", "importance": 4, "source": "인사이트코리아", "published": "2026-09-10", "url": "https://www.insightkorea.co.kr/news/articleView.html?idxno=254326", "related": []}, {"id": "ce3407d2cd88", "title": "기금형, 퇴직연금 시장 기폭제…국민연금 참여엔 '갑론을박'", "summary": "한국퇴직연금개발원과 이데일리가 서울 여의도에서 '기금형 퇴직연금 쟁점과 과제'를 주제로 제5차 퇴직연금 혁신포럼을 열었다. 김경선 한국퇴직연금개발원 회장은 기금형이 운영 거버넌스와 지급보장의 원칙·한계, 수탁자 책임범위에서 논란이 많은 만큼 꼼꼼히 점검하면서 법제화를 추진해야 한다고 말했다. 김병철 박사는 기금형이 활성화돼 시장 전체를 한 단계 도약시킬 것이라고 전망했다. 국민연금의 퇴직연금 사업 참여를 두고는 찬반이 갈렸고, 유호선 연구위원은 공공기관인 국민연금이 참여하면 수수료를 획기적으로 낮추는 효과를 가져올 수 있다고 밝혔다.", "category": "제도·규제", "importance": 4, "source": "이데일리", "published": "2026-09-10", "url": "https://www.edaily.co.kr/News/Read?newsId=04454246645578808&mediaCodeNo=257", "related": []}, {"id": "90897e3827bc", "title": "[퇴직연금 캡티브 시험대] 삼성생명 21년 1위 마감…신한은행, 연금 세 축 고른 성장", "summary": "올해 1분기 말 퇴직연금 1위 사업자가 삼성생명에서 신한은행으로 바뀌며 2005년 제도 도입 이후 21년 만에 선두가 교체됐다. 삼성생명은 1977년 종업원퇴직적립보험과 2009년 삼성전자의 단독 사업자 선정에 힘입어 2008년 초 시장의 31%를 차지했으나, 2019년 3분기부터 2026년 2분기까지 잔고가 24조8000억원에서 57조4000억원으로 늘어나는 동안 점유율은 12.72%까지 내려갔다. 신한은행은 DB·DC·IRP에 적립금이 고르게 분포하고 IRP는 23조원으로 업계 최대다. 시장 주도권이 DB형에서 DC형으로 옮겨가면서 ETF 실시간 거래가 가능한 증권업권이 부상하고 보험업권은 역성장이 뚜렷하다는 평가가 나온다.", "category": "업계·경쟁사", "importance": 4, "source": "더벨", "published": "2026-09-10", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081016506960103569", "related": []}, {"id": "6a7f6333b13c", "title": "삼성생명·화재 성과급 퇴직금서 제외…삼성전자와 엇갈린 1심", "summary": "서울중앙지법 민사41부는 지난달 27일 삼성생명·삼성화재 직원들이 낸 임금 청구소송에서 목표·성과 인센티브는 퇴직금과 퇴직연금 산정의 기초인 평균임금에 포함되지 않는다며 원고 청구를 모두 기각했다. 재판부는 두 회사의 인사규정·취업규칙에 성과급을 '지급할 수 있다'고만 규정돼 있어 지급 의무가 있다고 보기 어렵고, 경제적 부가가치(EVA) 기준 성과급은 직원이 통제하기 어려운 경영성과의 영향이 크다고 판단했다. 이는 지난 1월 대법원이 삼성전자의 목표 인센티브를 근로의 대가로 인정한 판단과 엇갈린 결론이다. 삼성화재 노조와 직원들은 항소할 방침이며, 항소심에서는 취업규칙의 적법성이 쟁점이 될 전망이다.", "category": "제도·규제", "importance": 4, "source": "세이프타임즈", "published": "2026-09-10", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=245616", "related": []}, {"id": "ff5d88df8bb4", "title": "[인터뷰] 하나은행 조영순 부행장 “기금형 시대, 포트폴리오로 승부”", "summary": "하나은행 퇴직연금 적립금이 2026년 6월 말 53조2000억원으로 반년 만에 4조8000억원 늘었다. 조영순 부행장은 그룹 차원의 조직 집중과 이른 사업 인프라 구축을 성장 배경으로 꼽았다. 개별 상품 선택이 아니라 장기·분산투자 원칙에 기반한 포트폴리오 중심 운용을 강조했다. 로보어드바이저 같은 디지털 서비스와 대면 상담 채널을 함께 활용한다는 방침이다.", "category": "업계·경쟁사", "importance": 4, "source": "블로터", "published": "2026-09-09", "url": "https://www.bloter.net/news/articleView.html?idxno=673128", "related": []}]}, "monthly": {"period": "monthly", "key": "2026-09", "label": "2026년 9월", "generated_at": "2026-09-12T19:39:14+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": [{"title": "“20년 묻어두면 수익률 161%”…퇴직연금 국채, 증권사 유치전 불붙었다", "source": "디지털데일리", "url": "https://www.ddaily.co.kr/page/view/2026091010295983047"}, {"title": "“예금 이자론 성 안 차”…은행 퇴직연금, 국채 품고 반격할까", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1688375/"}, {"title": "개인투자용 국채 품은 퇴직연금 계좌···증권사, 연금자금 유치전", "source": "서울파이낸스", "url": "https://www.seoulfn.com/news/articleView.html?idxno=637698"}, {"title": "[금상소] IRP·DC에 들어온 개인투자용 국채…10년·20년물 뭐가 나을까", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2624549"}]}, {"id": "989838fe6c31", "title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "summary": "550조원 규모 퇴직연금 시장을 바꿀 기금형 퇴직연금 가이드라인 발표가 계속 미뤄지고 있다. 오는 15일 열릴 예정이던 주요 퇴직연금 사업자 CEO 간담회는 추석 이후로 연기됐다. 국민연금은 \"수수료는 3분의 1, 수익률은 3배\"를 앞세워 공공기관 기금 수탁과 민간 연합형 기금의 OCIO 진출을 추진하고 있으나, 최상위 발주처가 민간 경쟁에 직접 뛰는 이해상충을 두고 업계 반발이 거세다. 당국은 신설 수탁법인이 기존 사업자의 계약형 인프라를 위탁할 수 있도록 가닥을 잡았고, 10곳 안팎의 사전인가제 도입 가능성이 거론된다.", "category": "제도·규제", "importance": 5, "source": "인베스트조선", "published": "2026-09-11", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html", "related": [{"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "69dd458f15f4", "title": "퇴직연금 550조 커졌는데…보험사 점유율 20% 무너졌다", "summary": "퇴직연금 시장이 553조원대로 커지는 사이 보험업계 점유율이 20% 아래로 떨어졌다. 상반기 증권사는 4조1000억원 순유입을 기록한 반면 보험사는 1799억원 순유출을 냈다. 실물이전 확대로 가입자가 금융사를 옮기기 쉬워지면서 사업자 간 경쟁이 격화된 결과다. DB형에 집중된 포트폴리오가 약점으로 지목되자 삼성·한화·교보생명 등이 DC형·IRP 강화와 ETF 상품 확대로 대응하고 있다.", "category": "업계·경쟁사", "importance": 5, "source": "뉴데일리", "published": "2026-09-10", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/10/2026091000173.html", "related": []}, {"id": "de4a8500263d", "title": "수익률 32%에도 돈이 안 온다…디폴트옵션의 역설", "summary": "디폴트옵션 시행 3년 차 데이터에서 적극투자형 1년 수익률이 32.66%를 기록했으나 자금의 82.5%는 여전히 안정형에 머물러 있다. 은행권은 고객 자금 대부분을 안정형에 두는 반면 증권사 고객은 위험자산에 투자해 업권별로 뚜렷이 갈렸다. 제도의 병목은 상품 품질이 아니라 자금이 좋은 상품에 도달하는 경로에 있다는 지적이다.", "category": "운용·상품", "importance": 5, "source": "한경머니", "published": "2026-09-10", "url": "https://magazine.hankyung.com/money/article/202608199155c", "related": []}, {"id": "937d44176934", "title": "퇴직연금 6.9조 이동…은행서 증권사로 자금 쏠림, 국채로 2차 경쟁", "summary": "올해 상반기 퇴직연금 실물이전 규모가 약 6조9000억원으로 전년 동기 약 3조2000억원의 2.2배에 달해 2024년 제도 시행 이후 반기 기준 최대를 기록했다. 업권별로는 증권사가 4조1513억원 순유입, 은행이 3조9714억원 순유출, 보험이 1799억원 순유출이었고, 증권사 적립금은 2분기 말 165조468억원으로 1분기 대비 16.5% 늘어 은행권 증가율 6.6%를 크게 앞섰다. 실물이전 규모는 가입자가 직접 상품을 고르는 IRP에서 6조8000억원으로 가장 컸다. 9월부터 개인투자용 국채가 DC·IRP 계좌에 편입되면서 증권사는 안정형 상품까지 더해 고객 확보에 나서고, 은행권은 ETF 거래 편의성 개선으로 맞서고 있다.", "category": "운용·상품", "importance": 5, "source": "더트래커", "published": "2026-09-10", "url": "https://thetracker.co.kr/View.aspx?No=4221950", "related": []}, {"id": "6dd0fa0960d5", "title": "퇴직연금 디폴트옵션 첫 순유출…2분기 1조4000억 감소", "summary": "디폴트옵션 운용자금이 2023년 제도 도입 후 처음으로 순유출을 기록해 2분기에 약 1조4000억원이 줄었다. 안정형에서만 1조4891억원이 빠져나갔고, 증시 호황으로 위험자산 투자가 늘면서 자금이 대거 이동했다. 평가액 기준 적립액 증가는 117억원에 그쳐 시장 전체 증가분 45조2000억원에 비하면 미미한 수준이다.", "category": "운용·상품", "importance": 5, "source": "한국경제", "published": "2026-09-08", "url": "https://www.hankyung.com/article/202609081009i", "related": []}, {"id": "362d60df2f63", "title": "퇴직연금도 자산배분 시대…NH투자증권, DB 적립금 컨설팅 강화", "summary": "NH투자증권이 연금자산관리본부 산하 DB적립금 운용 협의체를 통해 기업별 맞춤형 IPS(적립금운용계획서) 컨설팅을 확대한다. DB형은 적립금 수익률이 임금상승률에 못 미치면 기업이 추가 적립을 부담해야 해 자산배분 전략의 필요성이 커지고 있다. 전담 계리사와 자산배분·포트폴리오 전문가로 구성된 협의체가 부채 분석부터 리밸런싱까지 5단계로 지원한다. 고객사 한국선급은 IPS 개정 후 DB 적립금 1년 수익률이 5월 말 기준 20%를 넘어 고용노동부·금융감독원 모범사례로 선정됐다.", "category": "법인·자금운용", "importance": 5, "source": "매일경제", "published": "2026-09-08", "url": "https://www.mk.co.kr/news/stock/12147172", "related": []}, {"id": "f7cf0468c30c", "title": "정부, 올 하반기 퇴직연금 디폴트옵션 손질", "summary": "고용노동부가 올해 하반기 기금형 퇴직연금 도입과 함께 디폴트옵션(사전지정운용제도)도 개편하겠다고 밝혔다. 대기기간과 디폴트옵션 상품 평가체계를 명확히 하고, 현재 제도가 적용되지 않는 자금까지 적용 범위를 넓히는 것이 핵심이다. 현재 디폴트옵션 자금의 82.5%가 안정형에 쏠려 있는 점도 개선 대상으로 지목됐다. 정부는 퇴직연금 의무화와 사외적립 의무화를 함께 추진하며 올 하반기를 퇴직연금 대격변기로 보고 있다.", "category": "제도·규제", "importance": 5, "source": "파이낸셜뉴스", "published": "2026-09-07", "url": "https://www.fnnews.com/news/202609071643275392", "related": []}, {"id": "99fcd85edc4b", "title": "[내 퇴직연금 뜯어보니 ③] '선택과 책임은 노동자, 결정은 회사' 구조 바꾸려면?", "summary": "고용노동부가 내년 퇴직연금사업자 평가제도를 전면 개편한다. 정성평가 비중을 줄이고 수익률 등 정량평가를 강화해 전체 사업자의 순위를 공개하는 방안을 추진하며, 교육·정보제공 의무도 주기적으로 점검한다. 지난해 퇴직연금 수익률은 6.47%로 제도 도입 이후 최고치였지만, 적립금의 84%를 실적배당형에 넣은 상위 10%는 평균 19.5%, 원리금보장형에 74%를 둔 하위 10%는 0.5%에 그쳤다. 지난해 유형별 수익률은 DC형 8.47%, IRP 9.44%, DB형 3.53%였다.", "category": "제도·규제", "importance": 4, "source": "매일노동뉴스", "published": "2026-09-11", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236734", "related": []}, {"id": "d08069641dee", "title": "디폴트옵션 안정형 85% '쏠림'…위험회피 연금 가입자들 [디폴트옵션 작동 구조 (상)]", "summary": "2025년 말 기준 디폴트옵션 투자유형 가운데 안정형 적립금이 45조5000억원으로 전체 53조3000억원의 85.4%를 차지했다. 안정형을 지정한 가입자수도 583만명으로 전체 734만명의 79.4%에 달했다. 반대편인 적극투자형은 적립금 1조4000억원으로 전체의 2.6%, 가입자 39만명으로 5.3%에 그쳤다. 안정투자형 적립금은 3조9000억원(7.3%), 중립투자형은 2조5000억원이었다.", "category": "운용·상품", "importance": 4, "source": "한국금융신문", "published": "2026-09-11", "url": "https://www.fntimes.com/html/view.php?ud=202609102100372851179ad43907_18", "related": []}, {"id": "7280de2d77b4", "title": "국채 이어 IMA까지…퇴직연금 확대에 증권사 희비 엇갈릴까", "summary": "이달부터 확정기여형(DC)과 개인형퇴직연금(IRP) 계좌에서 개인투자용 국채 10년물과 20년물에 직접 투자할 수 있게 됐고 첫 청약은 지난 9일 시작됐다. 고용노동부와 금융감독원은 지난 3월 발행어음과 종합투자계좌(IMA)의 퇴직연금 투자 허용을 금융위원회에 건의할 예정이라고 밝혔다. 자본시장연구원에 따르면 2025년 말 기준 전체 퇴직연금 시장에서 증권업 점유율은 26.2%, IRP에서는 35.5%다. IMA는 자기자본 8조원 이상 종합금융투자사업자로 취급이 제한돼 현재 미래에셋증권·한국투자증권·NH투자증권 3개사만 가능한 만큼, 허용될 경우 증권사 간 상품 라인업 격차가 벌어질 수 있다는 우려가 나온다.", "category": "제도·규제", "importance": 4, "source": "뉴스웨이", "published": "2026-09-11", "url": "https://www.newsway.co.kr/news/view?ud=2026091114253182016", "related": []}, {"id": "868631f1c398", "title": "이찬진 금감원장, 영국 FCA와 기금형 퇴직연금 감독체계 논의", "summary": "이찬진 금융감독원장이 런던 방문 중 영국 금융행위감독청(FCA) 부청장과 만나 기금형 퇴직연금 도입에 대비한 감독체계를 놓고 의견을 교환했다. 양국 당국은 연금 성과평가와 가입자 보호 체계에 대한 감독 경험을 계속 공유하기로 했다. 구체적인 감독 방안이나 일정은 공개되지 않았다.", "category": "제도·규제", "importance": 4, "source": "뉴스핌", "published": "2026-09-10", "url": "https://www.newspim.com/news/view/20260910000409", "related": []}, {"id": "8bb193e0ea59", "title": "“정부 기초연금개편안, 겉으로는 하후상박 실제는 재정 절감안”", "summary": "정부가 노인 하위 70%를 세 집단으로 나눠 차등 지급하는 하후상박 방식을 내놨다. 하위 30%에 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원(동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": []}, {"id": "90c48aab5817", "title": "배광수 NH투자증권 대표, 210조 DB연금 승부…퇴직연금 '혁신'", "summary": "NH투자증권이 OCIO(외부위탁운용관리) 사업에서 쌓은 자산배분 역량을 DB형 퇴직연금에 적용하고 있다. 전체 퇴직연금 적립금 501조4000억원 가운데 DB형은 228조9000억원으로 45.7%를 차지하지만 이 중 91.9%가 원리금보장형에 머물러 있다. 2025년 DB형 연간 수익률은 3.5%로 DC형 8.5%, IRP 9.4%에 못 미쳤고, 최근 5년 누적 수익률 15.9%는 같은 기간 임금상승률 18.9%를 밑돌았다. 한국선급은 NH투자증권과 포트폴리오를 재편해 올해 5월 말 기준 DB 적립금 1년 수익률이 20%를 넘어섰다.", "category": "법인·자금운용", "importance": 4, "source": "인사이트코리아", "published": "2026-09-10", "url": "https://www.insightkorea.co.kr/news/articleView.html?idxno=254326", "related": []}, {"id": "f9a40df55bf5", "title": "무늬만 디폴트옵션, 수익률 2.6%…원금보장에 묶인 500조 퇴직연금", "summary": "501조원대로 불어난 퇴직연금 적립금 가운데 75%가 원리금보장상품에 집중돼 있다. 10년 평균 수익률은 2.64%에 그쳤다. 2023년 도입한 디폴트옵션도 85%가 안정형에 쏠려 제 역할을 못 하고 있다. 자본시장연구원은 옵트아웃 방식 도입과 기금형 퇴직연금 제도 개편을 제안했다.", "category": "운용·상품", "importance": 4, "source": "한국경제", "published": "2026-09-04", "url": "https://www.hankyung.com/article/202609044729i", "related": []}, {"id": "68d755a82ff5", "title": "500조 쌓였는데 노후 월급은 글쎄…몸집 두 배에도 지갑은 불안", "summary": "퇴직연금 적립금은 2020년 말 255조5000억원에서 2025년 말 501조4000억원으로 96.2% 늘었다. 그러나 전체 적립금의 75.4%가 여전히 원리금보장상품에 머물러 있다. 퇴직연금을 연금 형태로 받는 비율은 2023년 기준 10.4%에 불과하고 대부분 일시금으로 수령한다. 물가상승과 은퇴 후 장기 생활비를 감안하면 현행 저축 관행으로는 충분한 연금자산 축적이 어렵다는 지적이 나온다.", "category": "가입자·사회", "importance": 4, "source": "파이낸셜뉴스", "published": "2026-09-04", "url": "https://www.fnnews.com/news/202609041101420971", "related": []}, {"id": "f5ea3a852b40", "title": "퇴직연금, 저축 아닌 투자로 수익률 높여야…국민연금 참여는 반대", "summary": "자본시장연구원 남재우 선임연구위원이 초고령화 사회에서 퇴직연금 운용을 저축에서 투자로 전환해야 한다고 주장했다. 500조원 규모 퇴직연금이 원리금보장상품에 집중돼 노후를 보장하기엔 수익률이 낮다는 평가다. 기금형 제도로 전문적 자산배분을 하면 수익률을 7~8%로 높여 소득대체율 30%를 달성할 수 있다고 제언했다. 다만 기금형에 국민연금공단이 참여하는 데는 반대 입장을 냈다.", "category": "법인·자금운용", "importance": 4, "source": "머니투데이", "published": "2026-09-04", "url": "https://www.mt.co.kr/stock/2026/09/04/2026090416003220980", "related": []}, {"id": "340df4ab2571", "title": "한국퇴직연금개발원, 10일 제5차 퇴직연금 혁신포럼 개최", "summary": "한국퇴직연금개발원과 이데일리가 9월 10일 서울 여의도에서 기금형 퇴직연금 쟁점과 과제를 주제로 제5차 혁신포럼을 연다. 정부는 낮은 수익률을 개선하고 근로자 선택권을 넓히기 위해 기금형 제도 도입을 추진 중이다. 금융업계 인사와 정책담당자 200여 명이 참석해 제도 도입의 현실적 과제와 발전방안을 논의할 예정이다. 고용노동부와 한국금융투자협회도 함께한다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-09-03", "url": "https://www.edaily.co.kr/News/Read?newsId=04493606645576512", "related": []}]}, "yearly": {"period": "yearly", "key": "2026", "label": "2026년", "generated_at": "2026-09-12T19:39:14+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 6-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "69dd458f15f4", "title": "퇴직연금 550조 커졌는데…보험사 점유율 20% 무너졌다", "summary": "퇴직연금 시장이 553조원대로 커지는 사이 보험업계 점유율이 20% 아래로 떨어졌다. 상반기 증권사는 4조1000억원 순유입을 기록한 반면 보험사는 1799억원 순유출을 냈다. 실물이전 확대로 가입자가 금융사를 옮기기 쉬워지면서 사업자 간 경쟁이 격화된 결과다. DB형에 집중된 포트폴리오가 약점으로 지목되자 삼성·한화·교보생명 등이 DC형·IRP 강화와 ETF 상품 확대로 대응하고 있다.", "category": "업계·경쟁사", "importance": 5, "source": "뉴데일리", "published": "2026-09-10", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/10/2026091000173.html", "related": []}, {"id": "de4a8500263d", "title": "수익률 32%에도 돈이 안 온다…디폴트옵션의 역설", "summary": "디폴트옵션 시행 3년 차 데이터에서 적극투자형 1년 수익률이 32.66%를 기록했으나 자금의 82.5%는 여전히 안정형에 머물러 있다. 은행권은 고객 자금 대부분을 안정형에 두는 반면 증권사 고객은 위험자산에 투자해 업권별로 뚜렷이 갈렸다. 제도의 병목은 상품 품질이 아니라 자금이 좋은 상품에 도달하는 경로에 있다는 지적이다.", "category": "운용·상품", "importance": 5, "source": "한경머니", "published": "2026-09-10", "url": "https://magazine.hankyung.com/money/article/202608199155c", "related": []}, {"id": "937d44176934", "title": "퇴직연금 6.9조 이동…은행서 증권사로 자금 쏠림, 국채로 2차 경쟁", "summary": "올해 상반기 퇴직연금 실물이전 규모가 약 6조9000억원으로 전년 동기 약 3조2000억원의 2.2배에 달해 2024년 제도 시행 이후 반기 기준 최대를 기록했다. 업권별로는 증권사가 4조1513억원 순유입, 은행이 3조9714억원 순유출, 보험이 1799억원 순유출이었고, 증권사 적립금은 2분기 말 165조468억원으로 1분기 대비 16.5% 늘어 은행권 증가율 6.6%를 크게 앞섰다. 실물이전 규모는 가입자가 직접 상품을 고르는 IRP에서 6조8000억원으로 가장 컸다. 9월부터 개인투자용 국채가 DC·IRP 계좌에 편입되면서 증권사는 안정형 상품까지 더해 고객 확보에 나서고, 은행권은 ETF 거래 편의성 개선으로 맞서고 있다.", "category": "운용·상품", "importance": 5, "source": "더트래커", "published": "2026-09-10", "url": "https://thetracker.co.kr/View.aspx?No=4221950", "related": []}, {"id": "6dd0fa0960d5", "title": "퇴직연금 디폴트옵션 첫 순유출…2분기 1조4000억 감소", "summary": "디폴트옵션 운용자금이 2023년 제도 도입 후 처음으로 순유출을 기록해 2분기에 약 1조4000억원이 줄었다. 안정형에서만 1조4891억원이 빠져나갔고, 증시 호황으로 위험자산 투자가 늘면서 자금이 대거 이동했다. 평가액 기준 적립액 증가는 117억원에 그쳐 시장 전체 증가분 45조2000억원에 비하면 미미한 수준이다.", "category": "운용·상품", "importance": 5, "source": "한국경제", "published": "2026-09-08", "url": "https://www.hankyung.com/article/202609081009i", "related": []}, {"id": "362d60df2f63", "title": "퇴직연금도 자산배분 시대…NH투자증권, DB 적립금 컨설팅 강화", "summary": "NH투자증권이 연금자산관리본부 산하 DB적립금 운용 협의체를 통해 기업별 맞춤형 IPS(적립금운용계획서) 컨설팅을 확대한다. DB형은 적립금 수익률이 임금상승률에 못 미치면 기업이 추가 적립을 부담해야 해 자산배분 전략의 필요성이 커지고 있다. 전담 계리사와 자산배분·포트폴리오 전문가로 구성된 협의체가 부채 분석부터 리밸런싱까지 5단계로 지원한다. 고객사 한국선급은 IPS 개정 후 DB 적립금 1년 수익률이 5월 말 기준 20%를 넘어 고용노동부·금융감독원 모범사례로 선정됐다.", "category": "법인·자금운용", "importance": 5, "source": "매일경제", "published": "2026-09-08", "url": "https://www.mk.co.kr/news/stock/12147172", "related": []}, {"id": "f7cf0468c30c", "title": "정부, 올 하반기 퇴직연금 디폴트옵션 손질", "summary": "고용노동부가 올해 하반기 기금형 퇴직연금 도입과 함께 디폴트옵션(사전지정운용제도)도 개편하겠다고 밝혔다. 대기기간과 디폴트옵션 상품 평가체계를 명확히 하고, 현재 제도가 적용되지 않는 자금까지 적용 범위를 넓히는 것이 핵심이다. 현재 디폴트옵션 자금의 82.5%가 안정형에 쏠려 있는 점도 개선 대상으로 지목됐다. 정부는 퇴직연금 의무화와 사외적립 의무화를 함께 추진하며 올 하반기를 퇴직연금 대격변기로 보고 있다.", "category": "제도·규제", "importance": 5, "source": "파이낸셜뉴스", "published": "2026-09-07", "url": "https://www.fnnews.com/news/202609071643275392", "related": []}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "99fcd85edc4b", "title": "[내 퇴직연금 뜯어보니 ③] '선택과 책임은 노동자, 결정은 회사' 구조 바꾸려면?", "summary": "고용노동부가 내년 퇴직연금사업자 평가제도를 전면 개편한다. 정성평가 비중을 줄이고 수익률 등 정량평가를 강화해 전체 사업자의 순위를 공개하는 방안을 추진하며, 교육·정보제공 의무도 주기적으로 점검한다. 지난해 퇴직연금 수익률은 6.47%로 제도 도입 이후 최고치였지만, 적립금의 84%를 실적배당형에 넣은 상위 10%는 평균 19.5%, 원리금보장형에 74%를 둔 하위 10%는 0.5%에 그쳤다. 지난해 유형별 수익률은 DC형 8.47%, IRP 9.44%, DB형 3.53%였다.", "category": "제도·규제", "importance": 4, "source": "매일노동뉴스", "published": "2026-09-11", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236734", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}, {"id": "354ed5723a15", "title": "삼성자산운용·미래에셋증권, 푸른씨앗 OCIO 수성", "summary": "국내 최초 기금형 퇴직연금인 푸른씨앗(중소기업퇴직연금기금) 자금을 굴릴 OCIO 전담운용기관에 삼성자산운용과 미래에셋증권이 재선정됐다. 삼성자산운용이 종합평점 92.915점, 미래에셋증권이 90.761점으로 우선협상대상자에 올랐다. 2022년 9월 첫 사업자 선정 이후 4년 만의 재선정이다. 2기 운용 기간은 2026년 9월 1일부터 2030년 8월 31일까지다.", "category": "법인·자금운용", "importance": 4, "source": "한국금융신문", "published": "2026-06-09", "url": "https://www.fntimes.com/html/view.php?ud=202606091842068772179ad43907_18", "related": []}, {"id": "5895ec3e71a7", "title": "20년 만에 퇴직연금 제도 대대적 개편…모든 사업장 의무화 추진", "summary": "정부가 2월 노사정 공동선언을 바탕으로 퇴직연금 제도를 대폭 개편한다. 7월까지 구체적 방안을 확정한 뒤 연내 관련 법 개정을 추진하고, 모든 사업장에 퇴직연금을 단계적으로 의무화할 방침이다. 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화가 핵심 축이다. 1년 미만 근로자 등 사각지대 해소도 함께 추진된다.", "category": "제도·규제", "importance": 4, "source": "대한민국 정책브리핑", "published": "2026-03-11", "url": "https://www.korea.kr/news/policyNewsView.do?newsId=148960665", "related": []}, {"id": "6e2fe502ecb5", "title": "미래에셋증권, 퇴직연금 로보Wrap 출시…AI가 자산배분·매매 맡는다", "summary": "미래에셋증권이 IRP 계좌용 로보어드바이저 일임 서비스 퇴직연금 로보Wrap을 출시했다. 알고리즘이 글로벌 자산배분 포트폴리오를 구성하고 시장 상황에 맞춰 리밸런싱과 매매까지 수행한다. 7월 말 기준 누적 가입 계좌는 14만좌, 누적 가입금액은 8조3000억원이다.", "category": "운용·상품", "importance": 3, "source": "뉴스핌", "published": "2026-08-05", "url": "https://www.newspim.com/news/view/20260805001063", "related": []}, {"id": "676b0ae84927", "title": "신한 적립액 54조 독주…국민·하나, IRP 중심 2위 경쟁", "summary": "2026년 1분기 퇴직연금 랭킹에서 신한이 적립액 54조원으로 선두를 지켰다. 국민은행과 하나은행이 IRP를 중심으로 2위 자리를 놓고 다투고 있다. 은행권 IRP 적립금은 83조7000억원으로 전체 시장의 31.7%를 차지했다.", "category": "업계·경쟁사", "importance": 3, "source": "한국금융신문", "published": "2026-04-21", "url": "https://www.fntimes.com/html/view.php?ud=2026042117435794185e6e69892f_18", "related": []}, {"id": "ecca1d1f70f8", "title": "기금형 퇴직연금은 결과 아닌 과정 책임으로…사외적립의무는 속도조절 요구", "summary": "노사정과 전문가가 참여한 정책 토론회에서 기금형 퇴직연금 도입 방향이 논의됐다. 전문가들은 운용 주체의 책임을 결과가 아닌 과정, 즉 의사결정 절차의 적정성으로 전환해야 한다고 주장했다. 경영계는 중소기업 부담을 이유로 사외적립 의무화의 단계적 시행을 요구했다. 한국노총과 한국경영자총협회, 고용노동부, 한국투자증권 관계자가 참석했다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-04-08", "url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=04598566645414152", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  function render() {
    var doc = DATA.periods[currentPeriod];

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      button.setAttribute('aria-selected', String(PERIODS[index].key === currentPeriod));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    listEl.textContent = '';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
