     글자는 감청, 포인트 마크만 마젠타. 그래서 맨 위 줄은 감청이고

  :root {

    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom-deep: #1A399E;
    --kiwoom-point: #EC008C;

               'Malgun Gothic', system-ui, sans-serif;
    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;

  @media (prefers-color-scheme: dark) {

      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;

      --kiwoom-point: #FF5FB4;

  * { box-sizing: border-box; }

  body {

    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야
     구분선이 아니라 종이의 테두리로 읽힌다. */
  .topline { height: 4px; background: var(--kiwoom-deep); }

  /* 수집이 멈춰도 index.html은 그대로 남아 아무 일 없어 보인다. 그래서
     보는 사람의 시계와 비교해 묵은 정도를 화면에서 직접 말한다.

    padding: 10px 20px;

    font-weight: 600;
    text-align: center;

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);

  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {

    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;

  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;

  .search {

    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;

    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */

    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;

  .rail button {

    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;

    font-family: var(--font-mono);
    font-size: 0.74rem;

    margin: 28px 0 0;
    padding: 14px 0 0;

  .filters button {

    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */

    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);

    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;

    padding-top: 2px;

    gap: 10px;
    flex-wrap: wrap;

    font-size: 0.7rem;

    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;

    display: flex;
    align-items: center;
    gap: 12px;

  .source a {

    text-decoration: none;

    color: var(--ink-soft);

  details summary::before { content: '+ '; font-family: var(--font-mono); }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {

    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;

    .rank { font-size: 1.25rem; }

    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

le": "내 퇴직연금, 국민연금에 맡겨도 될까…기금운용 독립성 '시험대'", "summary": "국민연금의 국내주식 비중 확대와 리밸런싱 유예를 둘러싼 정치권 공방이 격화하면서 기금 운용의 독립성이 시험대에 올랐다. 국민연금은 지난 1월 리밸런싱을 6월 말까지 유예하고 5월에는 국내주식 목표 비중을 14.9%에서 20.8%로 높였으며, 야권은 182조원대 손실을 주장하며 국정조사와 특검을 요구했다. 보건복지부 장관이 기금운용위원장을 맡는 구조여서 실질적 독립성과 책임 소재를 명확히 해야 한다는 지적이 나온다. 기사는 이 문제가 국민연금의 퇴직연금 시장 참여 논의와 맞물려 있어 참여에 앞서 투자 결정 권한과 책임 구조부터 정비해야 한다는 지적을 전했다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-10-25", "url": "https://economist.co.kr/article/view/ecn202610250004"}, {"id": "ae6514407fee", "title": "출생아 26개월 연속 증가 '최장 기록' 쓸까…9월 세수·산업활동 주목[재경부·기획처 주간예고]", "summary": "이번 주(10월 26일~30일) 경제부처 일정 가운데 29일 고용노동부와 재정경제부가 '퇴직연금 기능 강화 방안'을 발표한다. 정부는 퇴직연금을 사업장 규모에 따라 단계적으로 전 사업장에 의무화하고, 전문 수탁법인이 여러 사업장의 적립금을 함께 굴리는 기금형 퇴직연금을 도입하는 방안을 추진해 왔다. 퇴직연금 적립금은 지난해 501조4000억원에 달했지만 30인 미만 사업장의 도입률은 23.2%에 그친다. 기사는 의무화 시기와 영세사업장 지원 규모가 관심이라고 전했다.", "category": "제도·규제", "importance": 3, "source": "이데일리", "published": "2026-10-25", "url": "https://www.edaily.co.kr/News/Read?newsId=01082406645616528&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article"}, {"id": "9ac65932140a", "title": "“퇴직연금도 반도체 ETF ‘몰빵’?…TDF로 모으고 RIF로 받아야”", "summary": "김성훈 신한자산운용 글로벌투자운용본부장은 이데일리 인터뷰에서 퇴직연금 자산의 최소 50%, 가능하면 70~80%를 TDF에 투자하고 나머지 20~30%를 개별 ETF 등에 배분하는 전략을 권했다. 신한운용의 TDF 시리즈 설정액은 올해 1월부터 8월 말까지 6893억원 늘어 국내 TDF 운용사 가운데 순증 규모 1위를 기록했고, 전체 설정액 2조568억원으로 시장점유율 약 11%, 업계 4위다. 김 본부장은 2년 안에 TDF 점유율을 20%까지 끌어올려 업계 2위 이상으로 도약하겠다고 밝혔다. 신한운용은 인출 기간과 잔존자산을 함께 고려한 은퇴자금인출펀드 '신한마음편한RIF'를 2040년형과 2050년형으로 출시했으며, 연 8% 수준의 분배금을 지급하도록 설계했다.", "category": "업계·경쟁사", "importance": 3, "source": "이데일리", "published": "2026-10-25", "url": "https://www.edaily.co.kr/News/Read?newsId=01384166645616528&mediaCodeNo=257&utm_source=naver&utm_medium=referral&utm_campaign=news_syndication&utm_content=original_article"}, {"id": "c2ef78aa9c37", "title": "삼성생명, 퇴직연금 부가서비스 앱 'SSUM 라운지' 개편", "summary": "삼성생명이 퇴직연금 가입자 전용 부가서비스 앱 'SSUM 라운지'를 전면 개편했다고 24일 밝혔다. 새로 마련된 '퇴직연금정보'에는 시장 지표를 보여주는 '투데이브리핑'과 '연금 첫걸음', '투자 인사이트', '투자 가이드북', '연금 클래스' 등 콘텐츠가 담겼다. '연금 클래스'는 매월 한 차례 온라인 세미나로 삼성생명 퇴직연금 전문가와 삼성자산운용이 제도·상품과 시장 전망을 소개한다. 서비스는 삼성생명 퇴직연금(DB·DC·IRP) 가입자라면 누구나 무료로 이용할 수 있다.", "category": "업계·경쟁사", "importance": 2, "source": "비즈월드", "published": "2026-10-25", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149782"}, {"id": "0e3b519a4b50", "title": "스페인에서 수만 명 연금 보장 요구 시위", "summary": "현지시간 24일 스페인 마드리드에서 약 2만5천 명이 국가 연금 보장과 공공부문 개선을 요구하며 행진했다. 국가 연금은 다음 달 29일 치러질 총선의 쟁점으로, 보수 야당 국민당은 현 제도가 붕괴 위기라며 개혁을 주장하고 집권 사회노동당은 우파가 물가 연동 연금 제도를 약화하려 한다고 맞섰다. 스페인 연금 체계는 현재의 기여금으로 연금을 지급하는 부과방식이다. 국가 연금 수급자는 680만 명이고 지난달 기준 1인당 월평균 수급액은 1,576유로다.", "category": "가입자·사회", "importance": 2, "source": "YTN", "published": "2026-10-25", "url": "https://www.ytn.co.kr/_ln/0104_202610250019462857"}, {"id": "26d3657d9773", "title": "[예탁금 51조 증발] 4개월 만에 51조 증발한 예탁금… 증시 '실탄' 말라간다", "summary": "투자자예탁금이 6월 4일 역대 최고치인 139조6천947억원에서 88조6천841억원으로 4개월여 만에 51조원 넘게 줄었고 감소율은 36.5%에 달했다. 같은 기간 10월 23일까지 개인 투자자는 유가증권시장에서 44조1천661억원, 코스닥에서 3조1천456억원을 순매수하고 ETF도 28조2천538억원어치 사들였다. ETF 매수에는 개인형퇴직연금(IRP)과 연금저축 계좌를 통한 매수도 포함된다. 기사는 예탁금 감소가 수급 부족으로 증시가 하방 압력에 노출될 수 있음을 시사한다고 전했다.", "category": "운용·상품", "importance": 2, "source": "CBC뉴스", "published": "2026-10-25", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=618891"}, {"id": "07fcc9e7ae38", "title": "\"돈 더 벌 줄 알았는데\"…5조 몰린 연금 갈아타기의 '반전' [김연지의 연금빌드업]", "summary": "금융감독원에 따르면 올해 상반기 퇴직연금 실물이전 금액은 6조9000억원으로 지난해 상반기 3조2000억원의 두 배를 웃돌았고, 2024년 10월 말 서비스 시작 이후 올해 6월 말까지 누적 이전 금액은 15조9000억원이다. 같은 기간 은행에서 증권사로 5조2000억원이 이동해 은행 간 이동액 4조5000억원보다 많았다. 그러나 통합연금포털 3분기 말 공시로 원리금비보장 상품 수익률을 단순평균하면 IRP는 은행 21.44%, 증권사 15.24%, DC형은 은행 18.46%, 증권사 16.22%로 은행이 높았다. 기사는 옮기기 전 투자 가능 상품과 수수료를 확인하고 장기·분산투자 원칙을 세워야 한다고 전했다.", "category": "운용·상품", "importance": 2, "source": "한국경제", "published": "2026-10-25", "url": "https://www.hankyung.com/article/2026102311016"}, {"id": "ac953605bb74", "title": "국장 부진에도 ETF 쓸어담은 개미와 외인…올해 90조원 넘게 샀다", "summary": "한국거래소에 따르면 올해 초부터 지난 23일까지 개인 투자자의 ETF 순매수 금액은 80조191억원으로 지난해 연간 순매수액 35조2125억원의 2배를 웃돌며 사상 최대를 기록했다. 외국인도 올해 ETF 시장에서 10조6808억원을 순매수해 지난해 연간 1조6622억원보다 9조원 넘게 더 사들였다. 개인이 가장 많이 사들인 종목은 'TIGER 미국S&P500'(5조2003억원)이었고, 외국인은 'TIGER MSCI Korea TR'(1조6284억원)을 가장 많이 담았다. 시장에서는 연금저축 및 개인형 퇴직연금(IRP) 계좌를 통한 중장기 적립식 매수 확대와 미국 시장 분산 투자 수요가 맞물린 결과로 풀이한다.", "category": "운용·상품", "importance": 2, "source": "디지털타임스", "published": "2026-10-25", "url": "https://www.dt.co.kr/article/12091007?ref=naver"}, {"id": "e9b1e71b4cbd", "title": "“그대로 옮긴다더니 강제 매도?”…퇴직연금 실물이전의 함정 [머니 트레이스]", "summary": "퇴직연금 실물이전은 같은 제도끼리만 가능해 DB형은 DB형으로, DC형은 DC형으로, IRP는 IRP로만 옮길 수 있고 DC형과 IRP는 적립금 전부를 이전해야 한다. 금융감독원에 따르면 2024년 10월 말부터 올해 6월 말까지 이전된 자금은 15조9000억원, 25만여 건이며 올해 상반기에만 6조9000억원이 이동했다. 디폴트옵션 상품과 옮겨갈 금융회사가 취급하지 않는 상품은 매도 후 현금으로 이전해야 하며, 해외주식형 펀드나 TDF는 환매에 최대 14영업일이 걸릴 수 있다. 금융당국은 DC형 적립금을 다른 금융회사의 IRP로도 실물이전할 수 있도록 전산 시스템 개편을 추진하고 있다.", "category": "가입자·사회", "importance": 2, "source": "서울경제", "published": "2026-10-25", "url": "https://www.sedaily.com/article/20105602?ref=naver"}, {"id": "79701632bbb8", "title": "하나금융, 3분기 누적 순익 3조6243억원…9490억원 자사주 매입·소각 '역대 최대'", "summary": "하나금융그룹의 올해 3분기 누적 연결당기순이익은 3조6243억원으로 전년 동기 대비 5.6% 증가했고, 누적 수수료이익은 2조1428억원으로 29.8% 늘었다. 하나은행의 3분기 누적 수수료이익은 8740억원으로 전년 동기 대비 11.5% 늘며 3분기 누적 기준 역대 최대치를 기록했다. 퇴직연금과 방카슈랑스 등 수수료 수익 확대와 외환 관련 이익 증가가 은행 실적을 뒷받침했다. 하나금융은 연간 자사주 매입·소각 규모를 역대 최대인 9490억원으로 확대하기로 했다.", "category": "업계·경쟁사", "importance": 2, "source": "메트로신문", "published": "2026-10-25", "url": "http://www.metroseoul.co.kr/article/20261023500216"}, {"id": "ca4fad8997b8", "title": "[위클리 생활금융] 보장만으론 부족하다… 생·손보, 예방·자산관리로 경쟁력 강화", "summary": "생명·손해보험사들이 보험금 지급 중심에서 벗어나 사이버위험 대응, AI 기반 민원 예방, 퇴직연금 정보 제공 등으로 서비스 영역을 넓히고 있다. DB손해보험은 지난 20일 이노비즈협회, SK쉴더스와 협약을 맺고 중소기업 대상 보안 컨설팅과 사이버보험을 연계하기로 했고, 신한라이프는 '민원 예방 AI 에이전트'를 도입했다. 삼성생명은 퇴직연금 가입자 전용 앱 'SSUM 라운지'를 개편해 DC·IRP 가입자 대상 '투자 인사이트' 등 연금·투자 정보를 통합 제공한다. 보험연구원은 올해 보험산업 전체 보험료 성장률을 2.3%로 전망했다.", "category": "업계·경쟁사", "importance": 2, "source": "THE Biz(더비즈)", "published": "2026-10-25", "url": "http://www.the-biz.co.kr/news/articleView.html?idxno=729827"}, {"id": "789b833ef494", "title": "美 가계 주식 비중 사상 최고…향후 10년 수익률에 경고등", "summary": "올해 2분기 미국 가계와 비영리단체의 금융자산에서 주식이 차지하는 비중이 48.2%로 1945년 집계 이후 최고치를 기록했다. 이 통계에는 개인 증권계좌의 직접 보유 주식뿐 아니라 투자펀드와 퇴직연금 등을 통한 간접 보유분도 포함되며, 보유 주식 가치는 약 74조달러에 달했다. 야후파이낸스 분석에 따르면 가계 주식 비중이 20% 미만이던 시기 이후 10년간 S&P500 연평균 상승률 중간값은 11.2%였으나 30% 이상일 때는 4.9%로 낮아졌다. 야후파이낸스는 이 분석이 장기 지표일 뿐 단기 매도 시점을 판단하는 수단은 아니라고 강조했다.", "category": "운용·상품", "importance": 2, "source": "글로벌이코노믹", "published": "2026-10-25", "url": "https://www.g-enews.com/view.php?ud=2026102421143766759a1f309431_1"}, {"id": "265622334677", "title": "[청년 머니센스] 자산 형성에 노후 준비 \"일석이조\"…사회초년생의 연금저축·IRP 활용백서", "summary": "사회초년생이 연금저축과 개인형퇴직연금(IRP)을 활용하는 방법을 정리한 연재 기사다. 20~30대부터 소액이라도 꾸준히 적립하면 장기 운용에 따른 복리 효과와 연말정산 세액공제 혜택을 함께 기대할 수 있다고 전했다. 연금저축의 세액공제 대상 납입한도는 연간 600만원이며 IRP 등 퇴직연금계좌 납입액을 합치면 연간 최대 900만원까지 공제받을 수 있고, 공제율은 총급여 5천500만원 이하 15%, 초과 12%다. 결혼·주거 등 목돈 수요를 고려해 무리한 납입은 피하고 중도인출·해지 시 세제 불이익이 있어 비상자금과 분리해야 한다고 조언했다.", "category": "가입자·사회", "importance": 1, "source": "청년일보", "published": "2026-10-25", "url": "https://www.youthdaily.co.kr/news/article.html?no=228785"}, {"id": "bc0725aed6c3", "title": "NH농협은행, 퇴직연금 고객 세미나 개최…운용 전략·노후 설계 공유", "summary": "NH농협은행은 지난 22일 서울 여의도 콘래드호텔에서 퇴직연금 고객을 초청해 '업위고(UP WE GO) 퇴직연금 끌어올려 세미나 2026'을 개최했다. 세미나에서는 안정형·투자형 퇴직연금 운용 전략과 변동성이 큰 금융시장에 대응하기 위한 자산관리 방안을 소개했고, 이호선 교수의 특강으로 노후 생활 전반에 관한 정보도 제공했다. 2015년 시작된 농협은행의 퇴직연금 고객 세미나는 올해로 11년째이며, 기업 담당자와 은행 실무자가 의견을 나누는 소통의 장으로 운영되고 있다.", "category": "업계·경쟁사", "importance": 1, "source": "더퍼블릭", "published": "2026-10-25", "url": "https://www.thepublic.kr/news/articleView.html?idxno=323571"}, {"id": "5e51d47afcd8", "title": "“강남 집 있어도 노후는 걱정되네요”…대기업 맞벌이 부부의 은퇴 고민 [퇴직금 들고 나왔습니다]", "summary": "대기업 부장인 52세 S씨는 2029년 정년퇴직을 앞두고 있고, 55세 배우자는 2026년 퇴직할 예정이다. 부부는 시가 약 27억원의 서울 잠원동 공동명의 아파트와 2030~2032년 입주 예정인 지역주택조합 아파트, 금 100돈과 예금, 개인형퇴직연금(IRP) 등을 보유하고 있지만 자산 대부분이 부동산에 묶여 있다. 두 아파트를 동시에 보유하면 재산세와 종합부동산세 부담이 커지고, 퇴직 후 지역가입자로 전환되면 재산도 건강보험료 산정에 반영된다. 기사는 퇴직 후 최대 36개월 동안 직장가입자 때와 비슷한 수준으로 보험료를 낼 수 있는 건강보험 임의계속가입제도를 비교해 보라고 조언한다.", "category": "가입자·사회", "importance": 1, "source": "매일경제", "published": "2026-10-25", "url": "https://www.mk.co.kr/news/economy/12184934"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-10-18 ~ 2026-10-24", "generated_at": "2026-10-25T12:16:54+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "829c3e49cc3f", "title": "흔들린 증시에 퇴직연금 적립금 6년여 만에 감소", "summary": "3분기 말 퇴직연금 적립금이 542조1214억원으로 전 분기보다 2.1% 줄었다. 코로나19 초기인 2020년 1분기 이후 6년여 만의 감소다. 업권별로는 증권 160조2935억원(2.9% 감소), 은행 275조4860억원(2.1% 감소), 보험 106조3419억원(0.9% 감소)이다. 실적배당형이 185조2078억원으로 6.3% 줄어든 반면 원리금보장형은 356조9051억원으로 0.2% 늘었다.", "category": "운용·상품", "importance": 5, "source": "머니투데이", "published": "2026-10-20", "url": "https://www.mt.co.kr/stock/2026/10/21/2026102016164749417", "related": [{"title": "\"노후자금 넣었는데\"…퇴직연금 12조 줄자 직장인들 '울상'", "source": "한국경제", "url": "https://www.hankyung.com/article/2026102167161"}, {"title": "5대 은행 퇴직연금 5조원 증발…7년 만에 첫 감소세", "source": "컨슈머타임스", "url": "https://www.cstimes.com/news/articleView.html?idxno=724898"}, {"title": "증시 시름에… 퇴직연금도 휘청", "source": "머니투데이", "url": "https://www.mt.co.kr/stock/2026/10/21/2026102019471522048"}, {"title": "증시 '휘청'에…5대銀 퇴직연금 적립금 7년 만에 첫 감소", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4440263"}]}, {"id": "536a738a394f", "title": "기금형 퇴직연금, 국민연금에 문 열어주나", "summary": "국민연금의 퇴직연금 시장 참여를 두고 여당·국민연금공단과 금융권이 맞서고 있다. 이용우 더불어민주당 의원은 10월 2일 공적연금기관이 기금 운용을 두고 경쟁하도록 하는 근로자퇴직급여보장법 개정안을 발의하면서 초기 3년 10%, 5년간 30% 이상 진출을 금지하는 상한을 뒀다. 김성주 국민연금공단 이사장은 법 개정으로 참여가 가능해지면 낮은 수수료를 실현할 수 있다고 했고, 금융감독원은 운용 손실 책임과 관치 가능성을 우려했다. 고용부는 7월까지 세부안을 확정할 예정이었으나 미뤄졌고 CEO 간담회도 9월 초부터 세 차례 연기됐으며, 6월 말 기준 퇴직연금 시장 규모는 553조8949억원이다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-10-20", "url": "https://www.globalepic.co.kr/view.php?ud=2026102009352813337cc35ccc5c_29", "related": []}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "0369d6c3118c", "title": "퇴직연금 223조원 쌓인 5대은행…국민·하나 2위 각축전", "summary": "5대 시중은행의 3분기 말 퇴직연금 적립금은 222조9427억원으로 집계됐다. 신한은행이 57조2252억원으로 1위이고 KB국민은행 52조2226억원, 하나은행 52조1554억원, 우리은행 33조243억원, NH농협은행 28조3152억원 순이다. KB국민은행과 하나은행의 격차는 672억원으로, 2분기 말 3152억원에서 크게 좁혀져 지난해 말 725억원 수준으로 돌아왔다. 올해 누적 증가액은 하나은행 3조7741억원, KB국민은행 3조7688억원으로 53억원 차이다.", "category": "업계·경쟁사", "importance": 4, "source": "이데일리", "published": "2026-10-19", "url": "https://www.edaily.co.kr/News/Read?newsId=03496486645614560&mediaCodeNo=257", "related": [{"title": "퇴직연금 2위 경쟁 격화…하나은행·국민은행 적립금 격차 672억원", "source": "CEO스코어데일리", "url": "https://www.ceoscoredaily.com/page/view/2026102015471625110"}]}, {"id": "340b2abcef04", "title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "summary": "삼성생명이 3분기 퇴직연금 적립금 57조5486억원으로 57조2252억원의 신한은행을 3234억원 차로 제치고 전체 1위를 되찾았다. 삼성생명은 전 분기보다 1523억원 늘었고 신한은행은 1조6636억원 줄었다. 3분기 삼성생명에서 계열사 DB형은 7074억원, 계열사 DC형은 461억원 늘어난 반면 비계열사 DB형은 3586억원, 비계열사 DC형은 2473억원 줄었다. 1분기 말부터 3분기 말까지 삼성생명 전체 적립금 순증액의 99%가 계열사에서 발생했다.", "category": "업계·경쟁사", "importance": 4, "source": "세이프타임즈", "published": "2026-10-20", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652", "related": [{"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "e63418b95bc2", "title": "퇴직연금 첫 분기 1882억 확보한 키움증권, IRP 쏠림 해소 과제 남겨", "summary": "키움증권의 3분기 퇴직연금 적립금은 1882억원으로 전 분기(649억원)보다 190% 증가했다. 적립금 확대는 IRP가 주도해 IRP 적립금이 1626억원, 전체 적립금 중 비중이 86.4%에 달했다. DB와 DC 적립금은 각각 150억원, 106억원으로 합산 256억원(13.6%)에 그쳤다. 연말 적립금 목표 5000억원 대비 3분기 말 달성률은 37.6%로, 목표를 달성하려면 4분기에 3118억원을 추가로 확보해야 한다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-10-23", "url": "https://www.ceoscoredaily.com/page/view/2026102215213434763", "related": []}, {"id": "dd6d3c9783e7", "title": "[퇴직연금 개편]與 기금형 퇴직연금 입법 속도…‘운용주체’ 쟁점", "summary": "이용우 더불어민주당 의원이 국민연금공단 등 공적연금관리기관의 퇴직연금 운용 참여를 허용하는 근로자퇴직급여 보장법 개정안을 대표발의했다. 개정안은 기금형을 금융기관개방형, 연합형, 공공기관개방형, 중소기업퇴직연금기금 등 4가지 유형으로 분류했다. 한정애 의원안은 노사가 참여하는 비영리 수탁법인을 중심으로 적립금 3000억원 이상 또는 가입자 3만명 이상 사업장 등에 기금형을 허용하는 모델이다. 안도걸 의원안은 민간 전문운용사 간 경쟁에 방점을 찍고 30인 이하 사업장 중심의 기금형을 전체 사업장으로 확대하며 가입자가 2년 단위로 기금을 옮길 수 있도록 했다.", "category": "제도·규제", "importance": 4, "source": "대한경제", "published": "2026-10-23", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610221712341290810", "related": []}, {"id": "b4cc17311e1b", "title": "[포커스] 신한銀, 투자형 퇴직연금 2.6배 성장…연금 우선순위 '자산관리'로", "summary": "금융감독원 통합연금포털 공시에 따르면 신한은행의 원리금비보장 퇴직연금 적립금은 2024년 말 7조 1462억 원에서 올해 3분기 말 18조 6740억 원으로 161.3% 증가했다. 전체 적립금 대비 투자형 비중은 15.6%에서 32.6%로 확대돼 5대 은행 중 가장 높았고, 하나은행 31.6%, KB국민은행 30.8%, 우리은행 28.4%, NH농협은행 19.9%가 뒤를 이었다. 투자형 적립금의 95.3%는 DC형과 개인형 IRP에 집중됐다. 다만 3분기 전체 적립금은 2분기 말 58조 8888억 원에서 57조 2252억 원으로 1조 6636억 원 줄었으며, 신한은행은 9월 퇴직연금 ETF 당일매매 서비스를 도입하는 등 운용 서비스를 강화하고 있다.", "category": "업계·경쟁사", "importance": 4, "source": "오늘경제", "published": "2026-10-22", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=816680", "related": []}, {"id": "6ad89726ed11", "title": "[단독]수익률 8%라던 중기 퇴직연금, 원금손실 1년간 급증", "summary": "이종배 의원실이 근로복지공단에서 받은 자료에 따르면 중소기업퇴직연금기금(푸른씨앗)에서 납입 원금보다 적게 받은 근로자는 지난해 177명에서 올해 8월까지 988명으로 늘었고 손실액은 600만원에서 9500만원으로 증가했다. 공단은 지난해 기금 운용수익률 8.67%를 기록했지만, 자산의 70% 내외를 채권 중심으로 운용해 올해 채권금리 상승과 환율 하락으로 손실이 발생했다고 설명했다. 노동부의 첫 종합평가에서는 전체 퇴직급여 지급 건수 중 7450건(12%)이 지급기한을 초과한 것으로 나타났다. 푸른씨앗 가입자는 올해 8월 말 20만1875명, 누적 적립금은 1조9203억원이다.", "category": "법인·자금운용", "importance": 4, "source": "뉴시스", "published": "2026-10-22", "url": "https://www.newsis.com/view/NISX20261021_0003834796", "related": []}, {"id": "dc3b72343c0f", "title": "퇴직연금 부문별 1위 갈렸다…하나은행, 전체 증가액·DB형 적립 '톱'", "summary": "9월 말 하나은행의 퇴직연금 적립금은 52조1554억원으로 작년 말보다 3조7741억원(7.8%) 늘어 주요 6개 은행 가운데 증가액이 가장 컸다. 하나은행의 DB 적립금은 18조2417억원으로 6개 은행 중 가장 많았고, DC·IRP 증가액 4조3927억원이 DB 감소액 6186억원을 상쇄했다. 전체 적립금은 신한은행이 57조2252억원으로 1위, 국민은행이 52조2226억원으로 2위였으며 하나은행은 672억원 차이로 뒤를 이었다. IRP 적립금은 신한은행이 22조8540억원으로 가장 컸고, DC 적립금은 국민은행이 17조1151억원으로 신한은행보다 4301억원 많았다.", "category": "업계·경쟁사", "importance": 4, "source": "블로터", "published": "2026-10-22", "url": "https://www.bloter.net/news/articleView.html?idxno=676368", "related": []}, {"id": "c993f9732198", "title": "[투데이 Pick] 퇴직연금 1위 내준 신한은행…국민·하나·우리·기업도 초접전", "summary": "3분기 말 삼성생명의 퇴직연금 적립금은 57조5486억원으로 신한은행(57조2252억원)을 3234억원 앞서 전체 사업자 1위에 올랐다. 국민은행(52조2226억원)과 하나은행(52조1554억원)의 격차는 2분기 말 3152억원에서 672억원으로, 우리은행(33조243억원)과 기업은행(32조9898억원)의 격차는 5813억원에서 345억원으로 줄었다. 올해 누적으로는 하나은행이 3조7741억원, 국민은행이 3조7688억원 늘어 주요 은행 모두 지난해 말보다 적립금이 증가했다. IRP에서는 신한은행이 22조8540억원으로 1위를 유지했으나 국민은행(22조6099억원)과의 격차가 2441억원으로 좁혀졌다.", "category": "업계·경쟁사", "importance": 4, "source": "뉴스투데이", "published": "2026-10-21", "url": "https://www.news2day.co.kr/article/20261020500333", "related": []}, {"id": "6006be01159b", "title": "내 퇴직연금, 국민연금이 굴릴까…기금형 도입에 갈리는 운용 방식", "summary": "당정은 국정감사 이후 정부안과 여당 의원 법안을 통합해 기금형 퇴직연금 입법 논의를 본격화할 예정이나 운용 주체와 적용 범위는 아직 확정되지 않았다. 한정애 의원안은 적립금 3000억원 이상 또는 가입자 3만명 이상 사업장에 노사 공동 수탁법인을, 안도걸 의원안은 민간 전문운용사 간 경쟁을, 박홍배·안호영 의원안은 퇴직연금공단 설립을 담았다. 이용우 의원안은 국민연금공단 등 공적연금기관이 사업자로 참여하도록 하되 시장점유율을 시행 후 3년까지 10%, 4년째 20%, 5년째 30%로 제한했다. 공공기관 개방형 기금의 도입·운영 비용은 국가가 부담하도록 했다.", "category": "제도·규제", "importance": 4, "source": "데일리팝", "published": "2026-10-21", "url": "http://www.dailypop.kr/news/articleView.html?idxno=103463", "related": []}, {"id": "11d18d6258e3", "title": "주식·채권 동반 급락에… ‘알아서 굴려준다’던 TDF의 배신", "summary": "에프엔가이드에 따르면 설정액 10억원 이상 TDF의 최근 3개월 수익률은 -7.07%, 6개월 수익률은 -2.88%로 국내 혼합형 펀드(-5.01%, -2.00%)보다 부진했다. 최근 5년 수익률도 TDF는 28.07%로 국내 주식형 펀드(86.70%)와 혼합형 펀드(29.70%)에 못 미쳤다. 주식과 채권 가격이 동반 하락하면서 채권이 주식 하락을 방어하는 기능이 작동하지 않은 탓이다. TDF 순자산은 2020년 말 5조원 수준에서 10월 20일 기준 32조7000억원으로 늘었고 올해 증가분만 7조2000억원이 넘는다.", "category": "운용·상품", "importance": 4, "source": "조선비즈", "published": "2026-10-21", "url": "https://biz.chosun.com/stock/stock_general/2026/10/21/IQNNSP3Z2NHLJFSXM7CGVI2PDQ/", "related": []}, {"id": "b4b11f82c66f", "title": "[단독]'2兆 규모' 中企퇴직연기금…운용기관 차등배분 2년째 0%대", "summary": "2022년 도입된 공적 기금형 퇴직연금인 중소기업퇴직연금기금(푸른씨앗) 적립금이 지난달 기준 1조9524억원으로, 이달 2조원을 넘길 전망이다. 김위상 의원실이 받은 근로복지공단 자료에 따르면 올해 2분기부터 내년 1분기까지 전담운용기관별 자금 배분 비율은 삼성자산운용 50.72%, 미래에셋증권 49.28%다. 공단은 실적 평가에 따라 배분을 차등화해 경쟁 효과를 높이겠다고 했지만 차등 폭은 작년 0.52%에 이어 올해도 1% 미만에 그쳤다. 내년에 26-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자 퇴직연금 223조원 쌓인 5대은행…국민·하나 2위 각축전", "summary": "5대 시중은행의 3분기 말 퇴직연금 적립금은 222조9427억원으로 집계됐다. 신한은행이 57조2252억원으로 1위이고 KB국민은행 52조2226억원, 하나은행 52조1554억원, 우리은행 33조243억원, NH농협은행 28조3152억원 순이다. KB국민은행과 하나은행의 격차는 672억원으로, 2분기 말 3152억원에서 크게 좁혀져 지난해 말 725억원 수준으로 돌아왔다. 올해 누적 증가액은 하나은행 3조7741억원, KB국민은행 3조7688억원으로 53억원 차이다.", "category": "업계·경쟁사", "importance": 4, "source": "이데일리", "published": "2026-10-19", "url": "https://www.edaily.co.kr/News/Read?newsId=03496486645614560&mediaCodeNo=257", "related": [{"title": "퇴직연금 2위 경쟁 격화…하나은행·국민은행 적립금 격차 672억원", "source": "CEO스코어데일리", "url": "https://www.ceoscoredaily.com/page/view/2026102015471625110"}]}, {"id": "340b2abcef04", "title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "summary": "삼성생명이 3분기 퇴직연금 적립금 57조5486억원으로 57조2252억원의 신한은행을 3234억원 차로 제치고 전체 1위를 되찾았다. 삼성생명은 전 분기보다 1523억원 늘었고 신한은행은 1조6636억원 줄었다. 3분기 삼성생명에서 계열사 DB형은 7074억원, 계열사 DC형은 461억원 늘어난 반면 비계열사 DB형은 3586억원, 비계열사 DC형은 2473억원 줄었다. 1분기 말부터 3분기 말까지 삼성생명 전체 적립금 순증액의 99%가 계열사에서 발생했다.", "category": "업계·경쟁사", "importance": 4, "source": "세이프타임즈", "published": "2026-10-20", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652", "related": [{"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "6c986a5b1bb4", "title": "한국투자증권, 기업 대상 ‘퇴직연금 아카데미’ 개최…제도 변화 대응 전략 제시", "summary": "한국투자증권은 지난 8일 서울 여의도 TP타워에서 기업 인사·재무 담당자 등 퇴직연금 실무자를 대상으로 ‘퇴직연금 아카데미’를 개최했다. 행사는 근로자퇴직급여 보장법 개정 추진에 맞춰 기금형 퇴직연금 도입과 퇴직급여 사외적립 의무화 등 현안을 중심으로 3개 세션으로 진행됐다. 기금형 도입에 따른 운용 효율성 제고 방안과 사외적립 의무화 대비 실무 가이드라인, 정년연장·임금피크제 운영 전략, 전담 RM 활용 방안 등이 소개됐다. 김도현 개인고객그룹장은 기업들이 제도 변화에 선제적으로 대응할 수 있도록 맞춤형 컨설팅과 실무 지원을 강화하겠다고 말했다.", "category": "법인·자금운용", "importance": 3, "source": "비즈월드", "published": "2026-10-13", "url": "http://www.bizwnews.com/news/articleView.html?idxno=148655", "related": [{"title": "한국투자증권, 퇴직연금 500조 기업시장 공략…인사·재무 담당자 접점 확대", "source": "토요경제", "url": "https://sateconomy.co.kr/news/view/1065574639722076"}, {"title": "한국투자증권, 기업 실무진 대상 '퇴직연금 아카데미' 개최", "source": "뉴스드림", "url": "http://www.newsdream.kr/news/articleView.html?idxno=119732"}, {"title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "source": "아시아경제", "url": "https://view.asiae.co.kr/article/2026101209461462366"}, {"title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "source": "머니투데이", "url": "https://www.mt.co.kr/stock/2026/10/12/2026101210195750915"}]}, {"id": "7ef94cfb1aa4", "title": "[경제 트렌드] 증권사, 퇴직연금 규모 급증...한국투자증권, 연금 적립·운용·수령까지 은퇴 준비 전 과정 밀착 지원", "summary": "퇴직연금 적립금은 지난 8월 기준 550조원을 웃돌았고 실적배당형 비중은 35%를 기록했으며, 증권사 퇴직연금 규모는 2025년 말 141조6797억원으로 전 금융권 적립금의 29.3%를 차지했다. 증권사 적립금 순위는 미래에셋증권, 삼성증권, 한국투자증권, 현대차증권, NH투자증권 순이다. 한국투자증권은 연금 MTS를 개편해 '나의 총 연금자산'과 개인화 맞춤 알림 기능을 도입했고, 신규 DC 가입자 평균 연령이 2015년 40세에서 2025년 36세로 낮아졌다고 밝혔다. 신한투자증권은 올해 연금고객관리팀을 신설해 신규 DC·IRP 가입 고객 대상 웰컴콜과 연금PB 1대1 매칭, 'Premier 연금컨설팅'을 운영하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "시사캐스트", "published": "2026-10-08", "url": "http://www.sisacast.kr/news/articleView.html?idxno=100731", "related": [{"title": "한국투자증권, 연금 MTS 개편…“적립·운용·수령까지 밀착 지원”", "source": "더퍼블릭", "url": "https://www.thepublic.kr/news/articleView.html?idxno=321335"}, {"title": "한국투자증권, 연금 MTS 개편 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31774"}]}, {"id": "ee6cf0e31b06", "title": "“부유한 노인도 받는다”…기초연금 ‘하위 70%’ 기준 개편 추진", "summary": "정부가 기초연금 수급 대상을 현행 노인 소득 하위 70% 방식에서 기준중위소득과 연계하는 방식으로 개편할 계획이다. 내년에는 소득 하위 30%의 기준연금액을 월 35만원에서 38만원으로 올리고 차등 지급을 적용한다. 다만 이 조치의 노인빈곤율 개선 효과는 0.3%포인트에 그친다. 정부는 저소득 노인의 급여 인상에 집중하기 위해 장기적으로 수급 구조를 개편할 방침이다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-03", "url": "https://www.segye.com/newsView/20261002510945?OutUrl=naver", "related": [{"title": "이재명 정부, 기초연금 개혁 회피해선 안 된다", "source": "시사IN", "url": "https://www.sisain.co.kr/news/articleView.html?idxno=58534"}, {"title": "기초연금 '소득 하위 70%' 기준 바꾼다…중위소득 연계 재추진", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6308073"}]}, {"id": "6da1ff9b2cf1", "title": "'2164억 체불' 대유위니아…3년 연속 퇴직연금 적립 미달", "summary": "대유위니아 계열 가전 3사(위니아·위니아전자·위니아전자MF)가 2022년부터 2024년까지 3년 연속 DB형 퇴직연금 법정 최소적립금을 채우지 못한 것으로 김주영 의원이 고용노동부에서 받은 자료에서 나타났다. 위니아전자의 최소적립금 대비 실제 적립 비율은 2022년 5.86%, 2023년 5.88%, 2024년 5.68%였고 위니아전자MF는 같은 기간 14.11%에서 9.45%로 떨어졌다. 2022년부터 지난달 3일까지 3사의 전체 체불액은 2164억원이며 이 중 체불 퇴직금은 858억원이다. 고용노동부가 이들 계열사에 관련 과태료를 부과한 사례는 없었다.", "category": "법인·자금운용", "importance": 3, "source": "뉴시스", "published": "2026-10-10", "url": "https://www.newsis.com/view/NISX20261010_0003820502", "related": [{"title": "대유위니아 가전 3사, 퇴직연금 법정 적립금 3년 연속 미달", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5070068"}]}, {"id": "fcba047b4874", "title": "머니무브 주춤, 더 치열해진 증권사 퇴직연금 경쟁", "summary": "올해 2분기말 기준 퇴직연금 시장은 553조8949억원이며 증권사 비중은 지난해말 26.47%에서 2분기 29.8%로 늘었다. 증권업종 적립금 165조원 중 미래에셋증권이 52조원(31.5%)을 차지하고 삼성증권 28조원, 한국투자증권 26조원이 뒤를 잇는다. 3분기 증시 조정으로 4~6월 DB형에서 DC형으로 전환한 증권사 가입자의 7월·8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 한국투자증권의 MTS 연금서비스 전면개편, 신한투자증권의 연금고객관리팀 신설, NH투자증권의 법인고객 관리시스템(CIS) 구축 등 증권사들이 타사 고객 유치 경쟁에 나서고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "비즈워치", "published": "2026-10-09", "url": "https://news.bizwatch.co.kr/article/market/2026/10/08/0005", "related": [{"title": "퇴직연금 165조 잡은 증권사…다음 승부처는 '고객관리'", "source": "뉴스웨이", "url": "https://www.newsway.co.kr/news/view?ud=2026100713530728574"}]}, {"id": "c4dab2068ab2", "title": "복지부 국감 개막⋯기초연금 '반쪽 개편'·국민연금 손실 추궁 [국감]", "summary": "국회 보건복지위원회가 7일 보건복지부와 질병관리청을 시작으로 이틀간 국정감사에 들어갔다. 핵심 쟁점은 연금제도 개편안으로, 복지부가 추진해 온 저소득층 노인 중심 '하후상박' 기초연금 개편이 사회적 논의 부족을 이유로 1년짜리 단기 계획에 그친 점이 '반쪽 개편'이라는 지적을 받을 전망이다. 국민연금은 기금 재정 안정성과 함께 자산배분 리밸런싱 한시 유예, 국내 주식 목표 비중 상향(14.9%→20.8%)에 따른 증시 급락 손실 문제가 검증대에 오른다. 복지위 국감은 14일 국민연금공단, 16일 국민건강보험공단·건강보험심사평가원을 거쳐 27일 종합감사로 마무리된다.", "category": "제도·규제", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2633071", "related": [{"title": "기초연금 '반쪽' 개편·국립대병원 첫 등판…복지부 국감 쟁점은", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261003_0003813472"}]}, {"id": "3222e4df0aa6", "title": "[연금개혁] '골든타임' 놓치면 무용지물…국고 GDP 1% 지금 투입 땐 31년 연장, 고갈 후엔 1년뿐", "summary": "국회예산정책처 분석에 따르면 현행 제도가 유지될 경우 국민연금 기금은 2069년에 소진된다. 정부가 지금부터 매년 GDP의 1%를 투입하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥난 2069년부터 투입하면 1년만 연장된다. 기금 수익률을 2%포인트 높이면 2120년까지 흑자를 유지할 수 있다.", "category": "제도·규제", "importance": 3, "source": "CBC뉴스", "published": "2026-10-01", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=611066", "related": [{"title": "\"국민연금 수익률 2%p 높이면 2120년까지 기금 고갈 없어\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260929100600530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}]}, {"id": "dd4beb88ba61", "title": "“4조 8천억 몰렸다”…S&P500으로 노후 준비? 이렇게 하세요 [잇슈 머니]", "summary": "국내에 상장된 S&P500 지수 상품 하나에 올해 들어 9월 28일까지 개인 자금 4조8611억원이 들어와 국내 ETF 가운데 1위를 기록했다. 연금저축과 개인형퇴직연금(IRP)은 둘을 합쳐 연 900만원까지 세액공제를 받고, 총급여 5500만원 이하 근로자는 공제율 16.5%가 적용돼 900만원을 넣으면 최대 148만5000원을 돌려받는다. 운용수익에는 세금을 바로 떼지 않고 55세 이후 연금으로 받을 때 3.3~5.5%의 연금소득세만 내지만, 연금 수령액이 연 1500만원을 넘으면 종합과세와 16.5% 분리과세 가운데 하나를 골라야 한다. 원·달러 환율이 7월 1일 장중 1550.85원에서 10월 2일 1350.6원으로 내려오면서 같은 S&P500 지수를 따르는 국내 상장 ETF의 최근 석 달 수익률은 환헤지형 2.19% 상승, 환노출형 6.23% 하락으로 갈렸다.", "category": "운용·상품", "importance": 2, "source": "KBS", "published": "2026-10-05", "ur  "5대 은행 퇴직연금 5조원 증발…7년 만에 첫 감소세", "source": "컨슈머타임스", "url": "https://www.cstimes.com/news/articleView.html?idxno=724898"}, {"title": "증시 시름에… 퇴직연금도 휘청", "source": "머니투데이", "url": "https://www.mt.co.kr/stock/2026/10/21/2026102019471522048"}, {"title": "증시 '휘청'에…5대銀 퇴직연금 적립금 7년 만에 첫 감소", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4440263"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로
     그보다 넉넉히 잡아야 매일 아침 헛경보가 뜨지 않는다. */
  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
         + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

  function buildStaleNotice() {
    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
