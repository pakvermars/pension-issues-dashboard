<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퇴직연금 주요 이슈</title>
<style>
  /* ── 팔레트 ───────────────────────────────────────────────
     잉크 네이비 위에 차가운 석재 종이. 강조색은 적립·성장을 뜻하는
     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나. */
  :root {
    --ink: #101C33;
    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom: #D6341F;

    --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',
               'Malgun Gothic', system-ui, sans-serif;
    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #DCE2EC;
      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 어두운 바탕에서는 다홍이 탁해 보여 한 단계 밝게 쓴다. */
      --kiwoom: #FF7A63;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;
  }

  .slogan {
    margin: 0 0 0 auto;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom);
    white-space: nowrap;
  }

  .hero-date {
    font-family: var(--font-num);
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 오른쪽으로 갈수록 구간이 넓어지는 축 자체가
     탭 역할을 한다. 시야를 넓힌다는 사실을 폭으로 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;
  }

  .rail button {
    flex: 1 1 0;
    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:nth-child(1) { flex-grow: 1; }
  .rail button:nth-child(2) { flex-grow: 1.7; }
  .rail button:nth-child(3) { flex-grow: 2.6; }
  .rail button:nth-child(4) { flex-grow: 3.7; }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .range {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  /* ── 분야 필터 ─────────────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
  }

  .filters button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */
  .notice {
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */
  .list { margin: 8px 0 0; }

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);
  }

  article[data-cat="2"] .badge { color: var(--cat-2); }
  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

  details summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

  <main class="list" id="list"></main>

  <p class="footer" id="footer"></p>

이직에 끊기는 퇴직자산…사회복지인 전용 퇴직연금 논의 본격화", "summary": "지난 18일 국회 의원회관에서 한국사회복지협의회·한국사회복지사협회·한국사회복지공제회와 이만희·서영석 등 의원 7명이 공동 주최한 사회복지인 퇴직연금 도입 정책토론회가 열렸다. 발제를 맡은 서정수 RNA애널리틱스 금융아카데미 원장은 전국 사회복지시설과 종사자를 하나의 직역 단위로 묶어 퇴직연금 기금을 운영하는 방안을 제안했으며, 토론회에서 제시된 사회복지 종사자의 평균 근속기간은 3.7년으로 나타났다. 남재우 한국연금학회장은 사업장 규모가 아닌 종사자 이동을 기준으로 삼는 비영리 연합형 기금 운영 방안을 제안했고, 김형철 과학기술인공제회 회원사업본부장은 가입자 자산을 보호할 운영·감독체계 마련을 제언했다. 김연숙 보건복지부 복지정책과장은 현장 의견을 수렴해 제도 마련을 지원하겠다는 입장을 밝혔고, 토론회에 앞서 3개 기관은 '사회복지인 퇴직연금 공동 추진 협약'을 체결했다.", "category": "제도·규제", "importance": 3, "source": "라이브뉴스", "published": "2026-09-19", "url": "https://www.livesnews.com/news/article.html?no=64332"}, {"id": "53cb05b7f05c", "title": "계좌 연속성: \"내 연금, 끝까지 나를 따라오라\"[김병철의 퇴직연금 개혁 시나리오]16", "summary": "김병철 한국퇴직연금개발원 대표는 퇴직할 때마다 IRP 계좌를 새로 만들어야 하는 한국 구조에서는 연금 계좌가 사람이 아니라 회사를 따라다녀 이직할 때마다 노후자산이 0원부터 다시 시작하는 '리셋'이 반복된다고 지적했다. 호주는 고용주가 정한 기금으로 적립금이 들어가는 구조 탓에 흩어진 계좌에서 관리 수수료와 보험료가 빠져나가는 '뱀파이어 계좌' 문제를 겪었다. 호주 정부는 2021년 근로자가 새 직장에서 다른 기금을 선택하지 않으면 기존 계좌가 그 사람을 따라가도록 연결하는 '스테이플링'을 도입했고, 호주국세청 전산망을 통해 개인의 전체 계좌를 확인한다. 한국 퇴직연금은 회사 명의 계좌 안에 근로자별 가상계좌를 두는 기업연금 구조여서 이직 시 퇴직소득세 계산에 필요한 재직기간과 세액 정보를 이어 붙이는 처리가 번거롭고, 그 결과 기존 계좌를 잇기보다 새 IRP를 여는 방식이 반복된다.", "category": "제도·규제", "importance": 3, "source": "이데일리", "published": "2026-09-19", "url": "https://www.edaily.co.kr/News/Read?newsId=01800726645581760&mediaCodeNo=257"}, {"id": "2dcc365aac2a", "title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "summary": "한국보건사회연구원 김태완 선임연구위원과 한수진 연구원은 '보건복지포럼' 2026년 9월호에 발표한 '노인 빈곤 개선을 위한 정책 연계 방안' 보고서에서 소득 하위 70%에 일률 지급하는 기초연금을 소득수준에 따라 차등 지원하는 '하후상박' 방식으로 개편해야 한다고 제안했다. 2024년 기준 65세 이상 노인의 상대 빈곤율은 35.9%로 전체 가구 평균 15.3%의 두 배를 넘었고, 중위소득 30% 이하가 14.2%, 30~40% 미만이 11.9%, 40~50% 미만이 9.8%였다. 연구진은 빈곤선(월 163만9천원)에 모자란 돈이 중간값 기준 월 17만7천원에 불과한 차상위 노인에게 개편된 기초연금 35만원과 공익형 일자리 월급 29만원, 근로장려금을 묶어주면 매달 75만원 안팎의 현금으로 빈곤선을 넘을 수 있다고 분석했다. 중산층 이상 노인에게는 주택연금과 국민연금, 민간 일자리를 활용해 스스로 노후를 꾸리도록 유도해야 한다고 덧붙였다.", "category": "가입자·사회", "importance": 3, "source": "연합뉴스", "published": "2026-09-19", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}, {"id": "c081e065575e", "title": "내 노후 어쩌나...'61세부터 마이너스 추락' 충격", "summary": "국가데이터처가 17일 발표한 '2024년 국민이전계정'에 따르면 한국인은 28세에 노동소득이 소비를 넘어서며 흑자로 전환한다. 흑자 규모는 45세에 1천932만원으로 정점을 찍고, 61세부터 다시 생애주기 적자로 돌아선다. 61세의 적자 규모는 76만원으로, 적자 전환 시점이 같았던 2023년의 214만원보다 크게 줄었다. 고령층의 노동 참여가 늘면서 노동소득 감소 폭이 완화된 것이 적자 축소에 영향을 준 것으로 분석됐다.", "category": "가입자·사회", "importance": 3, "source": "SBS Biz", "published": "2026-09-19", "url": "https://biz.sbs.co.kr/article/20000335594"}, {"id": "f99269387ab6", "title": "국민연금, 투자기업 점검 결과 투자에 반영…수탁자책임에 '무게'", "summary": "국민연금은 다음 달부터 11월까지 위탁운용사의 수탁자 책임 활동에 대한 서면심사와 현장실사를 진행할 계획이다. 점검은 스튜어드십 코드 7개 원칙에 따른 12개 세부 항목을 대상으로 하며 책임 활동 원칙 준수와 이해충돌 대처의 적절성 등 질적 평가를 포함한다. 국민연금은 평가 결과를 차기 위탁운용사 선정과 위탁운용사 자금 배정·회수 등에 반영해 실효성을 높일 방침이다. 스튜어드십 코드 도입 이후 약 8년간의 성과를 분석한 '국민연금 스튜어드십 코드 2.0'은 내년 상반기에 공개할 예정이다.", "category": "법인·자금운용", "importance": 3, "source": "머니투데이", "published": "2026-09-19", "url": "https://www.mt.co.kr/stock/2026/09/19/2026091816203180956"}, {"id": "cd9010e8851a", "title": "'청년자본 투자 촉진' 회의 소집하자 '레버리지 ETF' 답변왔다", "summary": "금융위원회가 1월 6일 부위원장 주재로 연 '청년자본 국내시장 투자촉진' 비공개 회의에서 금융투자협회가 발제한 첫 번째 안건은 레버리지 ETF 등 상품 다양화였다. 금투협은 이 자료에서 액티브 ETF 활성화, RIA 계좌 세제혜택 확대와 함께 국내주식 투자 확대를 위한 퇴직연금 제도 개선도 제시했다. 금투협은 해당 자료가 업계 의견을 수렴한 공식 제안문이 아니라 담당 직원이 하루 만에 작성한 발표용 메모라고 설명했다. 일주일 뒤인 1월 13일에는 김용범 전 청와대 정책실장 주재로 '자본시장 투자 매력도 제고' 회의가 비공개로 열렸다.", "category": "제도·규제", "importance": 2, "source": "노컷뉴스", "published": "2026-09-19", "url": "https://www.nocutnews.co.kr/news/6580724"}, {"id": "17228b619d59", "title": "연금 받기 전부터 사후 자산까지…길어진 금융사의 고객 관리", "summary": "금융사의 생애 후반 고객 관리 범위가 연금 수령과 자산운용을 넘어 상속·신탁과 사후 자산 활용까지 이어지고 있다. 하나은행은 지난 17일 대전에 시니어 특화 채널 '하나더넥스트 대전 라운지'를 열어 은퇴설계와 상속·증여, 유언대용신탁, 투자전략을 제공하고 국민연금·퇴직연금·개인연금·주택연금을 함께 점검하는 '평생소득설계' 상담을 상시 운영한다. 대전점 개점으로 하나더넥스트 라운지는 서울 4곳과 대구·대전 각 1곳 등 6곳으로 늘었고, 하나은행은 연내 주엽·부평대로·광주·야탑·서면에도 라운지를 추가할 계획이다. 하나은행은 'NEW 하나원큐'에서 공적연금 수급자 전용 멤버십 '공적연금 라운지'를 선보였고, 하나증권은 초록우산과 업무협약을 맺고 유언대용신탁을 활용한 기부 지원에 나섰다.", "category": "업계·경쟁사", "importance": 2, "source": "한국면세뉴스", "published": "2026-09-19", "url": "http://www.kdfnews.com/news/articleView.html?idxno=188239"}, {"id": "97c8366ede12", "title": "2천억 체불에도 피해회복 제자리…대유위니아 박영우 엄벌 촉구 확산", "summary": "대유위니아그룹의 임금·퇴직금 체불액이 2천억원 규모에 달하는 가운데 국회와 노동계가 박영우 회장에 대한 엄정한 사법 판단과 피해 노동자 변제 대책을 촉구했다. 김주영 의원은 18일 국회 소통관에서 한국노총, 금속노련, 금속노조 광주전남지부 등과 함께 엄벌 촉구 기자회견을 열었고 여야 의원 14명이 공동주최자로 참여했다. 박영우 회장은 관련 사건 1심에서 징역 4년을 선고받았으며, 노동계는 2심에서도 엄정한 판단이 필요하다고 주장했다. 노동계는 처벌에 더해 재산과 자금 흐름 확인, 구체적인 변제계획 제시를 요구했다.", "category": "가입자·사회", "importance": 2, "source": "데일리환경", "published": "2026-09-19", "url": "https://www.dailyt.co.kr/newsView/dlt202609190001"}, {"id": "15f38f0d878a", "title": "하나은행, 시니어 공략 강화…'공적연금 라운지' 출시", "summary": "하나은행이 공적연금 수급 고객을 대상으로 연금 수령 준비부터 실제 수령과 자산관리까지 필요한 금융상품과 혜택을 모은 멤버십 '공적연금 라운지'를 선보였다. 연 3.0% 파킹 금리를 제공하는 '하나더넥스트 연금 통장', 연금 이체 시 우대금리를 더하는 '연금하나 월복리 적금', 연 1.0% 고정금리의 소액 신용대출 '연금생활비대출'로 구성된다. 국민·공무원·사학·군인 등 4대 공적연금을 새로 수급하는 고객에게는 최대 5만원 캐시백을 제공한다. 하나손해보험과 연계한 '사이버금융범죄 보상보험' 무료 가입 혜택도 함께 제공한다.", "category": "업계·경쟁사", "importance": 2, "source": "아주경제", "published": "2026-09-19", "url": "https://www.ajunews.com/view/20260918161756099"}, {"id": "03fb6d3242d3", "title": "4층 연금·상속 '원스톱 진단'… 하나은행, 대전 시니어 라운지 개점", "summary": "하나은행이 대전 중구 대흥동에 충청권 첫 시니어 특화 점포인 '하나더넥스트 대전 라운지'를 열었다. 국민연금·퇴직연금·개인연금·주택연금의 4층 연금을 한 자리에서 점검해 매월 고정적인 현금흐름을 만드는 데 주력한다. 상속·증여 설계와 유언대용신탁, 치매안심 금융센터도 함께 운영한다. 서울 4곳, 대구 1곳에 이어 대전까지 6개 거점이 됐고 연내 광주·부산 등으로 넓힐 방침이다.", "category": "업계·경쟁사", "importance": 2, "source": "더퍼블릭", "published": "2026-09-19", "url": "https://www.thepublic.kr/news/articleView.html?idxno=319296"}, {"id": "b3f50b45293a", "title": "[금쪽상식] 퇴직연금 알아서 굴려준다는데···TDF 어떻게 고를까", "summary": "TDF 이름에 붙은 숫자는 수익률이 아니라 목표 은퇴연도를 뜻한다. 같은 2050 상품이라도 주식 비중이 54.3%에서 79.7%까지 벌어져 운용 전략이 제각각이다. 국내 TDF 순자산은 2020년 말 5조2000억원에서 2025년 말 25조5000억원으로 약 5배 늘었고, 2025년 연간 수익률은 13.7%로 전체 퇴직연금 수익률 6.5%를 웃돌았다. TDF는 실적배당형 상품이어서 시장 상황에 따라 손실이 날 수 있다.", "category": "운용·상품", "importance": 2, "source": "이뉴스투데이", "published": "2026-09-19", "url": "http://www.enewstoday.co.kr/news/articleView.html?idxno=2472348"}, {"id": "c7bf0bcc0498", "title": "[AI시대, 권력 대이동-우리은행] AI 에이전트로 업무 프로세스 혁신", "summary": "우리은행이 예·적금, 대출, 청약, 자산관리 등 8대 영역에서 약 200개의 AI 유스케이스를 발굴해 업무 프로세스에 적용하고 있다. 내부 생성형 AI 플랫폼 '우리GPT'는 월 9000명 이상의 직원이 이용하며 월 21만 건의 상담을 처리한다. 운영리스크와 외환, 퇴직연금 등 업무별 특화 GPT도 함께 운영한다. 우리은행은 AI 조직을 130명에서 150명으로 늘리고 디지털전략그룹을 AX혁신그룹으로 재편했다.", "category": "업계·경쟁사", "importance": 1, "source": "포인트데일리", "published": "2026-09-19", "url": "https://www.pointdaily.co.kr/news/articleView.html?idxno=319830"}, {"id": "7998725bb3ba", "title": "선우용여, 은행 갔다가 '400만원' 날린 이유…\"적금 들려고 했는데\"", "summary": "배우 선우용여가 자신의 채널 '순풍 선우용여'에서 은행 상품 가입으로 손해를 본 사연을 밝혔다. 선우용여는 매달 100만원씩 넣어 5년 뒤에 찾으려고 적금을 들려 했으나 은행에서 적금이 아니라 정년 퇴직금이라는 설명을 들었다고 말했다. 가입한 상품이 퇴직연금이어서 원하는 대로 돈을 찾을 수 없었고, 수수료를 물고 해지하면서 400만원을 손해 봤다고 밝혔다. 퇴직연금 계좌의 인출 제한을 모른 채 가입한 사례다.", "category": "가입자·사회", "importance": 1, "source": "MHN스포츠", "published": "2026-09-19", "url": "https://mhnse.com/news/articleView.html?idxno=1551145"}]}, "weekly": {"period": "weekly", "key": "2026-W38", "label": "2026-W38 (2026-09-14 ~ 2026-09-20)", "generated_at": "2026-09-19T10:16:32+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "26bad6a1c84a", "title": "이형일 \"500조 규모 퇴직연금, 수익률 저조…법안 준비 중\"", "summary": "이형일 부총리 겸 재정경제부 장관 후보자가 9월 15일 국회 재정경제기획위원회 인사청문회에서 퇴직연금 제도 개선과 관련해 노사정이 합의한 사항을 바탕으로 법안을 준비하고 있다고 밝혔다. 이 후보자는 퇴직연금 적립금이 500조원까지 올라갔는데 수익률이 저조하다며 노후소득 보장 기능이 제대로 작동하고 있느냐는 논의가 많다고 말했다. 노사정은 지난 2월 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화에 합의했고, 정부는 이를 바탕으로 연내 근로자퇴직급여보장법 개정을 추진하고 있다. 이광재 의원이 미국 401(k)를 거론하며 국가적 시스템이 필요하다고 지적한 데 대한 답변이다.", "category": "제도·규제", "importance": 5, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/economy/trend/6290971", "related": []}, {"id": "8977649855f9", "title": "표류하는 기금형 퇴직연금…간담회 또 연기", "summary": "고용노동부와 금융감독원이 공동 주재하는 퇴직연금사업자 간담회가 9월 2일에서 10월 2일로 재차 연기됐다. 한 달 새 두 번째 순연으로, 간담회는 10월 2일 오후 2시부터 3시 30분까지 서울 로얄호텔에서 김영훈 고용노동부 장관과 이찬진 금융감독원장이 함께 주재한다. 국민연금공단의 기금형 퇴직연금 참여 여부, 수탁법인 인가 대상을 5~8개로 제한하는 방안을 둘러싼 독점 우려, 손해배상 책임 강화 방침이 쟁점으로 남아 있다. 연내 근로자퇴직급여보장법 개정안 통과 목표의 재조정이 불가피하다는 관측이 나온다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-09-14", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": []}, {"id": "ffde5c86587a", "title": "'공시 넘어 사후관리'…디폴트옵션 3년, 최초 평가 시동", "summary": "고용노동부가 올해 디폴트옵션 승인 상품에 대한 첫 정기 평가를 실시한다. 2023년 7월 본격 시행된 디폴트옵션은 올해 3월 기준 41개 금융기관이 324개 상품을 승인받아 운용 중이며, 최초 승인 이후 3년이 지난 상품이 평가 대상으로 장기 성과 수익률과 위험 관리 등을 본다. 고용노동부는 첫 평가인 만큼 성과 저조 사유를 파악하고 개선 방안을 마련하는 데 핵심 의의를 두되, 문제가 지속되는 상품에는 불이익을 부여할 계획이다. 5월에 선정한 정책연구용역은 내년 2월까지 진행된다.", "category": "제도·규제", "importance": 5, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140567806179ad43907_18", "related": []}, {"id": "504d525f7a1e", "title": "개인 국채투자, '퇴직연금서 투자'에 흥행…9월 청약서 초과 수요", "summary": "이달 개인투자용 국채 청약에서 확정기여형(DC) 퇴직연금과 개인형퇴직연금(IRP) 계좌를 통한 청약액이 1천435억원으로 집계됐다. 퇴직연금 청약에 일반투자 창구 청약까지 더해지면서 9월 전체 청약액은 재정경제부가 공고한 모집예정액 2천300억원을 넘어섰고, 지난 5월 이후 처음으로 2천억원을 돌파했다. 청약은 9월 9일부터 15일까지 신한은행·하나은행·NH농협은행 등 3개 은행과 미래에셋증권·삼성증권·한국투자증권·KB증권·NH투자증권 등 5개 증권사를 통해 이뤄졌으며, 대상 채권은 10년물과 20년물이다. 10년물 표면금리는 연 4.415%, 20년물은 연 4.57%이고 두 상품 모두 연 0.35%포인트의 가산금리가 적용된다.", "category": "운용·상품", "importance": 4, "source": "연합뉴스", "published": "2026-09-17", "url": "https://www.yna.co.kr/view/AKR20260917099600008", "related": [{"title": "\"1억 넣어두면 20년 뒤 2.6억\"…연금개미들 외면한 이유", "source": "한국경제", "url": "https://www.hankyung.com/article/202609168563i"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 확정 수익 60%\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/14/2026091490036.html"}, {"title": "퇴직연금, 주식이 엔진이면 채권은 닻", "source": "중앙SUNDAY", "url": "https://www.joongang.co.kr/article/25463197"}, {"title": "퇴직연금으로 산 개인투자용 국채, 10년 뒤 수익률은?", "source": "브라보마이라이프", "url": "https://bravo.etoday.co.kr/view/atc_view/20072"}, {"title": "퇴직연금으로 국채 투자…첫 청약부터 흥행", "source": "SBS", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008759230"}, {"title": "[흔들리는 국채 공식④] 퇴직연금에 국채 담을까…개인투자자의 새 셈법", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4435180"}, {"title": "[필드뒷얘기] 퇴직연금 국채로 고객 묶는 증권사", "source": "대한금융신문", "url": "https://www.kbanker.co.kr/news/articleView.html?idxno=225952"}, {"title": "퇴직연금에 들어온 ‘개인투자용 국채’…롯데손해보험 매각, 어려운 이유 [머니카운터 방송 예고]", "source": "경인방송", "url": "https://news.ifm.kr/news/articleView.html?idxno=479676"}, {"title": "퇴직연금 계좌로 국채 투자하면 포인트 제공", "source": "서울신문", "url": "https://www.seoul.co.kr/news/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": []}, {"id": "f9f26933154f", "title": "[이슈체크] 퇴직연금까지 개선 요구…흥국생명, 반복된 감독지적 뒤 '사후관리' 시험대", "summary": "금융감독원 연금감독실은 지난달 31일 흥국생명에 퇴직연금 운영과 관련한 개선 요구 5건을 통보했다. 현물이전 안내가 미흡해 가입자가 제도를 충분히 인지하지 못한 채 불필요하게 매도하거나 운용하지 못할 수 있다는 점, 보너스보험 중도해지이율과 이율보증형2 보험의 금리보증 비용을 산정하면서 시장금리 변동 등 객관적 자료를 충분히 반영하지 않은 점이 지적됐다. 디폴트옵션 성과수수료는 계약일 기준으로 할인 대상을 정해 장기 보유자도 제외되는 구조라는 점, 연금전환특약의 차순위 보험수익자 지정 절차와 배우자 계좌 승계 안내가 부족하다는 점도 함께 지적됐다. 부담금 미납 시 벌칙과 지연이자 관련 안내가 누락된 점도 개선 요구에 포함됐다.", "category": "제도·규제", "importance": 4, "source": "더퍼블릭", "published": "2026-09-18", "url": "https://www.thepublic.kr/news/articleView.html?idxno=318506", "related": []}, {"id": "a6e5af30d59e", "title": "[단독] 5인 미만 사업장 퇴직연금 도입률 10%에 그쳐", "summary": "퇴직연금 미도입 사업장이 121만218곳으로 집계됐고, 이 가운데 30인 미만 사업장이 119만1811곳으로 98.5%를 차지했다. 사업장 규모별 도입률은 5인 미만 10.6%, 5~9인 32.7%, 10~29인 57.3%, 30~49인 74.2%, 50~99인 82.2%, 100인 이상 89.6%로 나타났다. 전체 도입률은 26.5%로 5년째 26%대에 머물렀고, 업종별로는 숙박·음식점업의 93.8%, 부동산업의 89.7%, 농림어업의 89.0%가 퇴직연금을 도입하지 않았다. 가입 대상 근로자 1308만5000명 가운데 697만2000명(53.3%)이 퇴직연금에 가입했다.", "category": "제도·규제", "importance": 4, "source": "한국경제", "published": "2026-09-17", "url": "https://www.hankyung.com/article/202609169177i", "related": []}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": []}, {"id": "507cff298ac3", "title": "미래에셋증권, 5대 시중은행 압도한 '리딩 증권사'…2분기 순이익 1.9조", "summary": "미래에셋증권이 2026년 2분기 순이익 1조9052억원을 기록해 신한은행(1조3015억원), KB국민은행(1조1240억원) 등 5대 시중은행을 모두 앞섰다. 영업이익은 2조4899억원으로 397.5% 늘었고, 세전이익 2조5287억원 가운데 1조6242억원은 스페이스X 평가이익에서 나왔다. 퇴직연금 적립금은 6월 말 80조원에 이르렀고 연간 증가율은 60%를 넘어 시장 평균의 약 2.5배였다. 개인형 퇴직연금에 로보WRAP 서비스를 도입하는 등 연금 자산관리 서비스를 넓혔다.", "category": "업계·경쟁사", "importance": 4, "source": "스포츠서울", "published": "2026-09-15", "url": "https://www.sportsseoul.com/news/read/1634922", "related": []}, {"id": "37880c4dd1e3", "title": "'퇴직연금 인기상품' 채권혼합ETF...미국 금리 상승에 수익률 '흔들'", "summary": "퇴직연금 수요를 타고 성장한 채권혼합형 ETF의 수익률이 금리 상승과 증시 조정으로 흔들리고 있다. 최근 1개월간 'ACE 미국S&P500미국채혼합50액티브'는 6.03%, 'KODEX 200미국채혼합50'은 5.8%, 'TIGER 미국나스닥100채권혼합50'은 4.59% 하락해 각각 기초지수보다 낙폭이 컸다. 타깃데이트펀드(TDF) ETF를 제외한 채권혼합형 ETF는 9월 11일 기준 66개이며 순자산총액은 18조5501억원으로 연초 6조8926억원에서 12조원 가까이 늘었다. 확정기여형(DC)·개인형퇴직연금(IRP)의 위험자산 투자 한도가 70%로 제한돼, 주식 편입 비중 50% 이하인 적격 혼합형 상품이 안전자산으로 분류되면서 자금이 몰렸다.", "category": "운용·상품", "importance": 4, "source": "헤럴드경제", "published": "2026-09-15", "url": "https://biz.heraldcorp.com/article/10873869", "related": []}, {"id": "07602bd7cfce", "title": "[시론] 기금형 제도 도입 이후, 이제 풀어야 할 퇴직연금의 과제", "summary": "박준범 성균관대 겸임교수는 기금형 퇴직연금 도입보다 연금화 부진 해소가 더 시급하다고 지적했다. 계좌 기준 연금 수령 비율은 16.5%에 그치고 평균 근속연수가 7.1년이어서 퇴직급여가 축적되지 않으며, 2022~2024년 3년간 IRP 이전금액 63.8조 원 대비 해지금액이 43.4조 원으로 해지율이 68.1%에 달한다고 밝혔다. 2024년 중도인출의 81.9%는 주택 관련 사유였고, 5인 미만 사업장의 퇴직연금 도입률은 10%대에 머물러 있다. 기금형 도입을 넘어 연금화를 중심으로 제도 개혁을 진행해야 한다고 주장했다.", "category": "제도·규제", "importance": 4, "source": "한국보험신문", "published": "2026-09-14", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=92713", "related": []}, {"id": "e38f37f63d51", "title": "'주식·金 연금까지' 카카오뱅크, 종합금융플랫폼 도약", "summary": "카카오뱅크가 비은행 포트폴리오를 넓히며 퇴직연금 시장 진출을 준비하고 있다. 지난해부터 관련 인력을 채용해 왔고 삼정KPMG의 컨설팅을 마무리했다. 퇴직연금 적립금은 지난해 말 501조 4000억 원으로 500조 원을 처음 넘어섰고 올해 2분기 말 기준 553조 8779억 원에 이른다. 카카오뱅크의 2026년 상반기 당기순이익은 3280억 원으로 전년 동기 대비 24.4% 늘었으며, 주식투자·자동차금융 비교·금 거래 서비스를 차례로 내놓은 데 이어 내년 상반기 캐피탈 사업을 본격화할 계획이다.", "category": "업계·경쟁사", "importance": 4, "source": "한스경제", "published": "2026-09-14", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=864386", "related": []}, {"id": "a5e7a7fba12f", "title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "summary": "NH농협은행이 퇴직연금 계좌에 개인투자용국채를 도입하고 ETF 라인업을 확대한다고 밝혔다. 7월에 22종을 내놓은 데 이어 10월에 36개를 추가한다. 전문가 포트폴리오 서비스의 2026년 상반기 수익률은 공격투자형 기준 40.11%를 기록했다. 금융감독원 통합연금포털 기준 원리금비보장형 수익률에서 3분기 연속 5대 시중은행 중 1위에 올랐다.", "category": "업계·경쟁사", "importance": 3, "source": "퍼블릭타임스", "published": "2026-09-16", "url": "https://www.public25.com/news/articleView.html?idxno=54796", "related": [{"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "f8e6de7fbf89", "title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "summary": "정부가 2026년 9월 1일 발표한 기초연금 개편안은 수급 대상인 소득 하위 70%를 셋으로 나눠 하위 30%는 월 38만원, 30~45%는 35만9000원으로 올리고 45~70%는 35만원으로 묶는 내용이다. 필자인 남찬섭 동아대 교수는 충분한 사회적 논의 없이 발표됐고 기초연금을 노인 70%의 빈곤 예방 장치가 아니라 빈곤 구제 수단으로 다뤘다고 비판했다. '하후상박'을 내세웠지만 실제로 인상 혜택을 보는 수급자는 약 40%에 그치고 하위 7%는 기초생활보장 급여가 깎여 상쇄된다고 지적했다. 대안으로는 모든 노인에게 지급하고 과세하는 노인 기본소득을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "슬로우뉴스", "published": "2026-09-15", "url": "https://slownews.kr/166386", "related": [{"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}]}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발  "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "a5e7a7fba12f", "title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "summary": "NH농협은행이 퇴직연금 계좌에 개인투자용국채를 도입하고 ETF 라인업을 확대한다고 밝혔다. 7월에 22종을 내놓은 데 이어 10월에 36개를 추가한다. 전문가 포트폴리오 서비스의 2026년 상반기 수익률은 공격투자형 기준 40.11%를 기록했다. 금융감독원 통합연금포털 기준 원리금비보장형 수익률에서 3분기 연속 5대 시중은행 중 1위에 올랐다.", "category": "업계·경쟁사", "importance": 3, "source": "퍼블릭타임스", "published": "2026-09-16", "url": "https://www.public25.com/news/articleView.html?idxno=54796", "related": [{"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "f8e6de7fbf89", "title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "summary": "정부가 2026년 9월 1일 발표한 기초연금 개편안은 수급 대상인 소득 하위 70%를 셋으로 나눠 하위 30%는 월 38만원, 30~45%는 35만9000원으로 올리고 45~70%는 35만원으로 묶는 내용이다. 필자인 남찬섭 동아대 교수는 충분한 사회적 논의 없이 발표됐고 기초연금을 노인 70%의 빈곤 예방 장치가 아니라 빈곤 구제 수단으로 다뤘다고 비판했다. '하후상박'을 내세웠지만 실제로 인상 혜택을 보는 수급자는 약 40%에 그치고 하위 7%는 기초생활보장 급여가 깎여 상쇄된다고 지적했다. 대안으로는 모든 노인에게 지급하고 과세하는 노인 기본소득을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "슬로우뉴스", "published": "2026-09-15", "url": "https://slownews.kr/166386", "related": [{"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 울신문", "url": "https://www.seoul.co.kr/news/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}, {"title": "[금상소] IRP·DC에 들어온 개인투자용 국채…10년·20년물 뭐가 나을까", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2624549"}]}, {"id": "8977649855f9", "title": "표류하는 기금형 퇴직연금…간담회 또 연기", "summary": "고용노동부와 금융감독원이 공동 주재하는 퇴직연금사업자 간담회가 9월 2일에서 10월 2일로 재차 연기됐다. 한 달 새 두 번째 순연으로, 간담회는 10월 2일 오후 2시부터 3시 30분까지 서울 로얄호텔에서 김영훈 고용노동부 장관과 이찬진 금융감독원장이 함께 주재한다. 국민연금공단의 기금형 퇴직연금 참여 여부, 수탁법인 인가 대상을 5~8개로 제한하는 방안을 둘러싼 독점 우려, 손해배상 책임 강화 방침이 쟁점으로 남아 있다. 연내 근로자퇴직급여보장법 개정안 통과 목표의 재조정이 불가피하다는 관측이 나온다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-09-14", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": [{"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "a5e7a7fba12f", "title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "summary": "NH농협은행이 퇴직연금 계좌에 개인투자용국채를 도입하고 ETF 라인업을 확대한다고 밝혔다. 7월에 22종을 내놓은 데 이어 10월에 36개를 추가한다. 전문가 포트폴리오 서비스의 2026년 상반기 수익률은 공격투자형 기준 40.11%를 기록했다. 금융감독원 통합연금포털 기준 원리금비보장형 수익률에서 3분기 연속 5대 시중은행 중 1위에 올랐다.", "category": "업계·경쟁사", "importance": 3, "source": "퍼블릭타임스", "published": "2026-09-16", "url": "https://www.public25.com/news/articleView.html?idxno=54796", "related": [{"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "f8e6de7fbf89", "title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "summary": "정부가 2026년 9월 1일 발표한 기초연금 개편안은 수급 대상인 소득 하위 70%를 셋으로 나눠 하위 30%는 월 38만원, 30~45%는 35만9000원으로 올리고 45~70%는 35만원으로 묶는 내용이다. 필자인 중구 본사에서 2026년 제2차 투자상품 완전판매 대토론회를 열었다. 투자상품 미스터리쇼핑 만점자와 영업본부 완전판매 TOP리더 등 약 40명이 참석해 펀드·방카슈랑스·신탁·퇴직연금 부문의 상담 준비, 상품 설명, 적합성·적정성 원칙 준수 사례를 공유했다. NH농협은행은 토론회 내용을 영상으로 제작해 영업점 교육자료로 활용할 계획이다. 박현동 투자상품부문 부행장은 완전판매가 절차 준수에 그치지 않고 고객 입장에서 충분히 설명하고 신뢰를 쌓는 과정이라고 강조했다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스퀘스트", "published": "2026-09-17", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=301184", "related": [{"title": "농협은행, 투자상품 완전판매 대토론회 개최…미스터리쇼핑 만점자 우수사례 공유", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146703"}]}, {"id": "ab894d0c4867", "title": "[금융 HOT 뉴스] KB자산운용, 골드 특별자산 펀드 눈길", "summary": "KB자산운용이 골드 특별자산 펀드의 운용 구조를 파생상품 중심에서 국내외 금 ETF 활용 방식으로 바꿨다. 파생상품 위험평가액을 40% 이하로 낮춰 퇴직연금 적격 요건을 충족했고 운용보수는 기존 대비 약 40% 인하했다. 비교지수는 LBMA Gold PM Price로 변경했고 환매대금은 4영업일 내에 지급한다. 현재 국민은행과 신한투자증권의 퇴직연금 계좌에서 매매할 수 있다.", "category": "운용·상품", "importance": 2, "source": "비즈월드", "published": "2026-09-16", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146330", "related": [{"title": "KB자산운용, 18년 된 금 펀드 손질…퇴직연금서도 투자", "source": "AP신문", "url": "https://www.apnews.kr/news/articleView.html?idxno=3051270"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}, {"id": "354ed5723a15", "title": "삼성자산운용·미래에셋증권, 푸른씨앗 OCIO 수성", "summary": "국내 최초 기금형 퇴직연금인 푸른씨앗(중소기업퇴직연금기금) 자금을 굴릴 OCIO 전담운용기관에 삼성자산운용과 미래에셋증권이 재선정됐다. 삼성자산운용이 종합평점 92.915점, 미래에셋증권이 90.761점으로 우선협상대상자에 올랐다. 2022년 9월 첫 사업자 선정 이후 4년 만의 재선정이다. 2기 운용 기간은 2026년 9월 1일부터 2030년 8월 31일까지다.", "category": "법인·자금운용", "importance": 4, "source": "한국금융신문", "published": "2026-06-09", "url": "https://www.fntimes.com/html/view.php?ud=202606091842068772179ad43907_18", "related": []}, {"id": "5895ec3e71a7", "title": "20년 만에 퇴직연금 제도 대대적 개편…모든 사업장 의무화 추진", "summary": "정부가 2월 노사정 공동선언을 바탕으로 퇴직연금 제도를 대폭 개편한다. 7월까지 구체적 방안을 확정한 뒤 연내 관련 법 개정을 추진하고, 모든 사업장에 퇴직연금을 단계적으로 의무화할 방침이다. 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화가 핵심 축이다. 1년 미만 근로자 등 사각지대 해소도 함께 추진된다.", "category": "제도·규제", "importance": 4, "source": "대한민국 정책브리핑", "published": "2026-03-11", "url": "https://www.korea.kr/news/policyNewsView.do?newsId=148960665", "related": []}, {"id": "6e2fe502ecb5", "title": "미래에셋증권, 퇴직연금 로보Wrap 출시…AI가 자산배분·매매 맡는다", "summary": "미래에셋증권이 IRP 계좌용 로보어드바이저 일임 서비스 퇴직연금 로보Wrap을 출시했다. 알고리즘이 글로벌 자산배분 포트폴리오를 구성하고 시장 상황에 맞춰 리밸런싱과 매매까지 수행한다. 7월 말 기준 누적 가입 계좌는 14만좌, 누적 가입금액은 8조3000억원이다.", "category": "운용·상품", "importance": 3, "source": "뉴스핌", "published": "2026-08-05", "url": "https://www.newspim.com/news/view/20260805001063", "related": []}, {"id": "676b0ae84927", "title": "신한 적립액 54조 독주…국민·하나, IRP 중심 2위 경쟁", "summary": "2026년 1분기 퇴직연금 랭킹에서 신한이 적립액 54조원으로 선두를 지켰다. 국민은행과 하나은행이 IRP를 중심으로 2위 자리를 놓고 다투고 있다. 은행권 IRP 적립금은 83조7000억원으로 전체 시장의 31.7%를 차지했다.", "category": "업계·경쟁사", "importance": 3, "source": "한국금융신문", "published": "2026-04-21", "url": "https://www.fntimes.com/html/view.php?ud=2026042117435794185e6e69892f_18", "related": []}, {"id": "ecca1d1f70f8", "title": "기금형 퇴직연금은 결과 아닌 과정 책임으로…사외적립의무는 속도조절 요구", "summary": "노사정과 전문가가 참여한 정책 토론회에서 기금형 퇴직연금 도입 방향이 논의됐다. 전문가들은 운용 주체의 책임을 결과가 아닌 과정, 즉 의사결정 절차의 적정성으로 전환해야 한다고 주장했다. 경영계는 중소기업 부담을 이유로 사외적립 의무화의 단계적 시행을 요구했다. 한국노총과 한국경영자총협회, 고용노동부, 한국투자증권 관계자가 참석했다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-04-08", "url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=04598566645414152", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  function render() {
    var doc = DATA.periods[currentPeriod];

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      button.setAttribute('aria-selected', String(PERIODS[index].key === currentPeriod));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    listEl.textContent = '';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
