    --hot: #B23A2E;
    --cat-1: #2A3F66;

    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;

      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;

      --kiwoom-point: #FF5FB4;
    }

  * { box-sizing: border-box; }

  body {

    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

    margin: 0 0 14px;

  .wordmark {

    letter-spacing: 0.22em;
    color: var(--ink-soft);

    font-weight: 400;

    margin: 0;
    font-variant-numeric: oldstyle-nums;

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

    justify-content: space-between;

    flex-wrap: wrap;

    align-items: baseline;

    padding-bottom: 8px;

    background: transparent;
    color: var(--ink);

    font-size: 0.85rem;

  .search input::placeholder { color: var(--rule); }

    background: transparent;
    color: var(--accent);

    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {

    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;

  /* ── 서명 요소: 기간 축 ────────────────────────────────────

    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;

    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;

  details a { color: var(--ink); }

    font-size: 0.7rem;
    color: var(--ink-soft);

    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

24920453840", "title": "KB국민은행, \"퇴직금 어디 맡길까\"…고객만족도 1위 비결은", "summary": "KB국민은행이 고객만족도(KCSI) 조사 퇴직연금(IRP) 부문에서 1위에 올랐다. 금융감독원 통합연금포털 공시에 따르면 올해 2분기 말 기준 KB국민은행의 IRP 비원리금보장상품 1년 수익률은 52.96%, 디폴트옵션 적극투자형 포트폴리오1의 3년 수익률은 92.63%로 집계됐다. 총 18개 세부 평가 항목 가운데 11개에서 단독 또는 공동 1위를 기록했고, 가입·계좌개설 절차 간편성이 94.3점으로 가장 높았다. 시중은행 최초로 ETF 당일 매수·매도 시스템을 도입해 당일 매매한 자금으로 같은 날 다른 ETF를 거래할 수 있게 했다.", "category": "업계·경쟁사", "importance": 3, "source": "매일경제", "published": "2026-09-30", "url": "https://www.mk.co.kr/article/12163801"}, {"id": "8905e27a0776", "title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "summary": "9월 28일 국회 의원회관에서 여야가 10년 만에 공동으로 연금 구조개혁 정책토론회를 열고 국민연금 수급 개시 연령을 68세로 올리는 방안이 제안됐다. 토론회 시뮬레이션에서는 수급 개시 연령을 68세로 올리고 기금 운용 수익률을 연 6%로 맞추면 70년 뒤 기금이 한 해 지출의 11.8배까지 쌓이고, 68세 상향과 GDP 0.33% 국고 투입을 조합하면 9.5배, 국고 투입만 GDP의 0.6%로 하면 8.6배가 되는 것으로 나타났다. 발제자들은 인구·경제 상황에 따라 연금액과 보험료가 자동으로 조정되는 한국형 자동조정장치와, 기초연금의 소득 하위 70% 기준을 없애고 기준중위소득 100% 이하로 대상을 좁히는 방안도 제시했다. 모두 제안 단계로 실제 시행에는 법 개정이 필요하다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-30", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"id": "dcb8b5fba512", "title": "국민연금 수익률 14.84%…주식·채권 성과 엇갈려 [fn마켓워치]", "summary": "국민연금 기금운용본부 공시에 따르면 7월 말 기준 연초 대비 기금운용 수익률은 14.84%로 27.22%에서 낮아졌다. 기금 규모는 6월 말 1866조원에서 한 달 새 1684조원으로 약 10% 감소했다. 자산군별로는 국내주식 60.11%, 해외주식 10.72%, 국내채권 -3.36%, 해외채권 0.72%, 대체투자 4.09%다. 기금운용본부는 국내채권이 금리 상승에 따른 평가 가치 하락으로 수익률이 내려갔다고 설명했다.", "category": "가입자·사회", "importance": 3, "source": "파이낸셜뉴스", "published": "2026-09-30", "url": "https://www.fnnews.com/news/202609291813518550"}, {"id": "f26a8d44d00a", "title": "기초연금 하후상박 개편안, 여야 “상박은 어디 있나” 한목소리 지적", "summary": "정부가 국회 연금개혁특위에 보고한 기초연금 개편안은 소득하위 30%에 월 3만원을 더 주고 30~45%는 물가상승률만큼 올리며 45% 초과 계층은 동결하는 내용이다. 여야 의원들은 빈곤율이 0.3%포인트, 빈곤갭이 1.57% 낮아지는 데 그친다며 효과가 미흡하다고 지적했다. 하후상박을 내세웠는데 상위 계층을 깎는 상박이 빠져 있고 수급 대상 70% 안에 형편이 나은 노인도 포함된다는 비판이 나왔다. 정부는 저소득 부부가구의 감액률은 완화하되 수급률 70%는 유지한다는 입장을 밝혔다.", "category": "제도·규제", "importance": 3, "source": "세계일보", "published": "2026-09-30", "url": "https://www.segye.com/newsView/20260930503511?OutUrl=naver"}, {"id": "ff3c94fd5924", "title": "“국민연금 넘어 기초·퇴직연금까지”", "summary": "국회 연금개혁특별위원회 윤영석 위원장과 여야 간사인 오기형·안상훈 의원이 지난 28일 국회 의원회관에서 ‘지속가능하고 공정한 연금제도를 위한 구조개혁’ 정책토론회를 공동 개최했다. 발제자인 양재진 연세대 교수는 현행 연금체계의 기본 틀을 유지하면서 사전 국고 투입과 기금운용 독립성·수익률 제고로 기금 고갈을 막고 기초·퇴직연금까지 함께 개편해야 한다고 제안했고, 김학주 동국대 교수는 기대여명과 재정상황을 반영하는 자동재정안정장치 도입과 연금별 역할 재정립을 주장했다. 오건호 내가만드는복지국가 공동대표는 퇴직연금의 사각지대를 줄이고 일시금 수령 대신 연금으로 받도록 하는 방안을 과제로 꼽았다. 보건복지부·재정경제부·기획예산처 관계자들은 국민연금뿐 아니라 기초·퇴직·개인연금까지 종합적으로 검토할 필요가 있다는 입장을 밝혔다.", "category": "제도·규제", "importance": 3, "source": "양산신문", "published": "2026-09-30", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"id": "283fb8e4b3b4", "title": "현대차 33회-에버랜드 32회 1위… 삼성전자 10개 산업 석권", "summary": "한국능률협회컨설팅은 30일 '2026년도 제35차 한국산업의 고객만족도(KCSI)' 조사 결과를 발표했다. 총 122개 산업, 455개 기업을 대상으로 조사했고 올해 새로 편입된 7개 산업에 퇴직연금(IRP)이 포함됐다. KB국민은행은 부동산 플랫폼에 이어 신설된 퇴직연금(IRP) 부문에서 첫 1위에 올라 복수 산업 1위 기업에 합류했다. 2026년 KCSI 국가지수는 81.8점으로 전년 대비 0.1점 올라 3년 만에 반등했고, 33개 산업에서 1위 기업이 교체돼 2년 연속 역대 최다를 기록했다.", "category": "업계·경쟁사", "importance": 2, "source": "동아일보", "published": "2026-09-30", "url": "https://www.donga.com/news/Economy/article/all/20260929/134750776/2"}, {"id": "5067d0be9407", "title": "반도체 ETF, 레버리지서 그룹주·세부테마로", "summary": "레버리지 규제 이후 삼성전자·SK하이닉스 단일종목 레버리지·인버스 ETF의 거래대금이 92% 급감했고, 운용사들은 그룹주·채권혼합형·세부 테마 상품으로 라인업을 넓히고 있다. 채권혼합형은 연금 계좌에서 반도체 대형주에 투자할 수 있는 수단으로 자리 잡고 있다. 'RISE 삼성전자SK하이닉스채권혼합50'은 두 대형주에 각각 25%씩, 나머지 50%를 채권에 투자해 퇴직연금 계좌에서 100% 투자할 수 있는 구조를 갖췄다.", "category": "운용·상품", "importance": 2, "source": "뉴스톱", "published": "2026-09-30", "url": "https://www.newstopkorea.com/news/articleView.html?idxno=47909"}, {"id": "0b0728b5f50c", "title": "박승흡 근로복지공단 이사장 30일 취임", "summary": "박승흡 전 전태일재단 이사장이 30일 근로복지공단 이사장으로 취임했다. 전교조 해직교사 출신으로 한국비정규노동센터 초대 소장, 매일노동뉴스 발행인·회장 등을 역임했다. 근로복지공단은 업무상 재해보상과 산재병원 운영, 산재·고용보험 가입 및 부과, 중소기업 퇴직연금 운영, 체불임금 보장 등의 업무를 맡고 있다.", "category": "업계·경쟁사", "importance": 2, "source": "매일노동뉴스", "published": "2026-09-30", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236993"}, {"id": "e20cda1e7301", "title": "[분배형 ETF 돋보기] 460조 ETF의 17.5%…커버드콜 상품이 3분의1", "summary": "국내 상장 ETF 시장은 1171종 460조7634억원 규모이며, 이 가운데 분배형 상품은 209종 80조4910억원으로 전체의 17.5%를 차지한다. 분배형 가운데 월분배형이 194종 79조8496억원으로 99.2%에 이르고, 유형별로는 커버드콜형이 62종 28조8203억원으로 가장 큰 비중을 차지한다. 연금저축과 개인형퇴직연금(IRP) 등 절세계좌에서 장기 적립에 활용하려는 수요가 분배형 ETF 확대를 뒷받침하고 있다. 은퇴 전후 세대가 보유 자산을 매도하지 않고도 정기적인 현금흐름을 받을 수 있다는 점이 수요 배경으로 꼽힌다.", "category": "운용·상품", "importance": 2, "source": "딜사이트", "published": "2026-09-30", "url": "https://dealsite.co.kr/articles/169672"}, {"id": "4d9032583942", "title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "summary": "국가데이터처 기준 2024년 65세 이상 인구의 연금 수급률은 52.1%이고 월평균 수급액은 49만 1천원, 중위수는 37만원이다. 70~74세 수급률은 53.6%, 75~79세는 55.0%이며 80세 이상은 월평균 수급액이 26만 5천원, 중위수가 19만 5천원으로 낮아진다. 건설 현장 일용직은 월 20일 이상 근무 요건 탓에 국민연금 사각지대에 있다가 2020년에야 월 8일 이상이면 가입할 수 있게 됐다. 당시 이미 60~70대였던 노동자들은 납부 기간을 채우지 못해 기초연금 30만원가량에 의존하며 은퇴 뒤에도 일자리를 찾고 있다.", "category": "가입자·사회", "importance": 2, "source": "KBS", "published": "2026-09-30", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"id": "9e7119f122db", "title": "일감 찾는 노인 늘었는데…65∼74세 임시·일용직 8년 새 7.3%p 증가", "summary": "65~74세 취업자 가운데 임시·일용근로 비중은 17.3%로 8년 전보다 7.3%포인트 높아졌고 75세 이상은 3배 수준으로 늘었다. 65세 이상 고용률은 38.2%로 전년보다 0.9%포인트 올랐으며, 올해 65세 이상 인구는 1051만 4천명으로 전체 인구의 20.3%다. 65세 이상 취업자의 직업은 단순노무 34.8%, 농림어업 21.8%, 서비스·판매 17.9% 순이다. 고령층이 일하는 이유로는 생활비에 보탬이 51.3%, 일하는 즐거움이 38.1%로 나타났다.", "category": "가입자·사회", "importance": 2, "source": "세계일보", "published": "2026-09-30", "url": "https://www.segye.com/newsView/20260930502651?OutUrl=naver"}, {"id": "25de45dd3e5e", "title": "퇴직연금 중 안전자산 몫은 국채 투자하고 경품 받으세요", "summary": "삼성증권이 퇴직연금(IRP·DC) 계좌 보유 고객을 대상으로 ‘퇴직연금 개인투자용 국채 이벤트’를 12월 31일까지 진행한다. 개인투자용 국채는 정부가 발행하고 국가가 원리금 지급을 보장하며 만기까지 보유하면 표면금리에 가산금리를 더한 이율로 연 복리가 적용된다. 퇴직연금은 위험자산 투자 한도가 전체 적립금의 70%로 제한돼 나머지는 예금 등 안전자산으로 운용해야 하는데, 개인투자용 국채가 퇴직연금 투자 대상에 포함되면서 장기 운용을 원하는 가입자의 안전자산 선택 폭이 넓어질 것으로 보인다. 청약기간은 10월 8~15일, 11월 11~17일, 12월 9~15일 각각 5영업일이다.", "category": "운용·상품", "importance": 2, "source": "한국일보", "published": "2026-09-30", "url": "https://www.hankookilbo.com/news/article/A2026092919440003191?did=NA"}, {"id": "9ebc6e518ea9", "title": "“미국 대표지수 추종하는 액티브형 ETF 장기적으로 모아가면 노후가 든든”", "summary": "주식 투자 전문가 박민수 작가는 연금저축계좌와 퇴직연금에서는 개별 종목 직접 주식 투자가 불가능해 퇴직연금을 DC형으로 전환하고 직접 ETF를 운용하는 경우가 많다고 설명했다. 그는 20대 초심자와 50대 이후 투자자는 개별 주식보다 ETF 중심 투자를 하라고 조언하며, 절세 계좌를 활용해 S&P 500과 나스닥 100 추종 ETF를 포트폴리오의 40% 정도 담는 방식을 추천했다. 남은 40%는 AI 반도체·로봇처럼 장기 성장 섹터에, 20%는 월 6~12% 배당을 받을 수 있는 월배당 커버드콜 ETF에 배분하라고 했다. 연금 계좌와 ISA 계좌는 해외 상장 주식 투자가 불가능하므로 국내 상장 해외 대표지수 ETF를 먼저 담고 연 3800만원을 넘는 자금은 해외 상장 ETF에 투자하는 순서를 제시했다.", "category": "가입자·사회", "importance": 1, "source": "여성동아", "published": "2026-09-30", "url": "https://woman.donga.com/3/all/12/6401620/1"}, {"id": "5c4a77e47553", "title": "김창수 제21대 사학연금공단 이사장 취임…\"안정적 연기금 운용·복지 고도화\"", "summary": "김창수 전 중앙대 총장이 제21대 사립학교교직원연금공단 이사장으로 취임했다. 임기는 2026년 9월 28일부터 2029년 9월 27일까지 3년이다. 김 이사장은 안정적인 연기금 운용과 가입자 중심 복지서비스로 지속가능성을 확보하겠다고 밝혔다. 사학연금공단은 1974년 설립돼 채권·주식·대체투자로 약 33조원의 기금을 운용하고 있다.", "category": "가입자·사회", "importance": 1, "source": "컨슈머타임스", "published": "2026-09-30", "url": "https://www.cstimes.com/news/articleView.html?idxno=722295"}, {"id": "16e6f6199e9a", "title": "개인이 호화 유람선에 투자를? ‘선박 조각투자’ 시범사업 본격", "summary": "한국해양진흥공사가 일반 투자자도 소액으로 선박에 투자할 수 있는 선박 조각투자 시범사업을 추진한다. 공사가 보유한 선박을 기초자산으로 투자상품을 만들어 연말까지 한국거래소 신종증권시장에 상장할 계획이며 메리츠증권이 참여한다. 상품은 지분형이 아니라 선박 용선료를 재원으로 하는 채권형 신탁수익증권으로 설계된다. 황현일 변호사는 조각투자가 단기 투기 수단으로 흐르지 않도록 ISA와 퇴직연금 계좌를 통한 장기투자를 허용해야 한다고 제언했다.", "category": "제도·규제", "importance": 1, "source": "데일리안", "published": "2026-09-30", "url": "https://www.dailian.co.kr/news/view/1695939/?sc=Naver"}, {"id": "db80a0db8b99", "title": "한투운용 'ACE 미국나스닥100', 개인 순매수 5000억원 넘어", "summary": "한국투자신탁운용의 ACE 미국나스닥100 ETF가 올해 개인투자자 순매수 5097억원을 기록했다. elated": [{"title": "사업 실패했는데 병원비까지… 빚더미 내몰린 고령층", "source": "조선일보", "url": "https://www.chosun.com/economy/economy_general/2026/09/29/YZHUM6YSXVBKLH6777RVVRAKDI/"}]}, {"id": "d26931fd6cb5", "title": "[연금 AI 성적표] 장기 수익률 웃었지만 단기 급락엔 '속수무책'", "summary": "코스콤 테스트베드에 등록된 로보어드바이저 포트폴리오 716개를 분석한 결과 1년 평균 수익률은 11.55%, 2년 평균은 28.34%였고 1년 이상 운용된 상품의 94.1%가 플러스를 냈다. 반면 최근 3개월에는 704개(98.3%)가 마이너스로 돌아서 평균 -7.57%를 기록했다. 연금 전용 포트폴리오 456개는 최대낙폭(MDD) -12.81%로 일반 상품의 -17.10%보다 방어력이 좋았고, 최근 3개월 수익률도 -7.16%로 일반(-8.27%)보다 나았으며 샤프지수는 0.97 대 0.62였다. 증권사 포트폴리오 232개는 1년 수익률 11.92%에 MDD -17.01%였고, 운용사 226개는 수익률 10.65%에 MDD -11.53%, 샤프지수 0.99로 위험관리에 무게를 뒀다.", "category": "운용·상품", "importance": 4, "source": "대한경제", "published": "2026-09-28", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202609271311024570435", "related": [{"title": "[연금 AI 성적표] '테스트베드 통과=품질 보증' 착각은 금물…투자 전 확인할 것", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202609271311596880436"}]}, {"id": "66fa13a160da", "title": "우리아이자립펀드, ISA, 퇴직연금, 국민연금…장기투자 라인업", "summary": "변제호 금융위원회 자본시장국장은 28일 '코리아 프리미엄 윅스 2026' 개막식 주제발표에서 아동기부터 노후까지 생애 전 단계를 잇는 장기 투자 기반 구축 방안을 제시했다. 금융위는 2027년 하반기 출시를 목표로 부모와 국가가 자녀 성인기까지 함께 납입하는 19년 장기 투자 모델 '우리아이자립펀드'를 도입하고, 이어 생산적 금융 ISA를 신설하며 퇴직연금도 보다 생산적인 분야에서 운용될 수 있도록 제도를 개편할 계획이다. 변 국장은 \"우리아이자립펀드와 ISA, 퇴직연금과 국민연금으로 이어지는 생애 전 단계의 장기 투자 라인업을 완성하게 됐다\"고 밝혔다. 생산적 금융 ISA는 2027년 말까지 도입을 추진하며 5년 합산 납입한도를 기존 1억원에서 2억원으로 확대한다.", "category": "제도·규제", "importance": 4, "source": "중기이코노미", "published": "2026-09-29", "url": "https://www.junggi.co.kr/news/articleView.html?idxno=37917", "related": []}, {"id": "6903269877b7", "title": "[단독] 은행 가계대출 한도 갉아먹는 주택연금...올 지급액 3조 넘을듯", "summary": "올해 7월까지 주택연금을 취급하는 은행 14곳의 대출 지급액이 1조8180억원으로 집계됐고, 지난해 연간 지급액 2조8129억원을 감안하면 올해 처음 3조원을 넘길 것으로 전망된다. 신규 가입 건수는 지난해 연간 1만3925건에서 올해 7월까지 1만798건으로 늘었으며, 금융위원회가 계리모형을 재설계해 3월부터 신규 가입자 수령액을 평균 약 3% 올리고 초기 보증료를 주택가격의 1.5%에서 1.0%로 내린 것이 영향을 미쳤다. 주택연금 지급액이 가계대출 총량 규제에 포함돼 은행이 다른 대출을 내줄 여력이 줄어든다는 우려가 은행권에서 나온다. 한민수 더불어민주당 의원은 금융당국이 주택연금 특성에 맞춰 총량 규제 인센티브나 예외 조치를 신속히 마련해야 한다고 밝혔다.", "category": "제도·규제", "importance": 4, "source": "매일경제", "published": "2026-09-27", "url": "https://www.mk.co.kr/article/12161819", "related": []}, {"id": "8a77650694b5", "title": "퇴직연금 '수익률 경쟁' 실종…상위 10개사 점유율은 75%", "summary": "자본시장연구원 보고서를 인용해 국내 퇴직연금 시장에서 사업자 간 수익률 경쟁이 제대로 작동하지 않는다고 보도했다. 지난해 말 적립금 501조4000억원 시장에서 상위 3개사 점유율은 31.3%, 상위 5개사는 48.5%, 상위 10개사는 74.8%였고, 시장집중도를 나타내는 HHI는 2011년 632.8에서 지난해 664.8로 큰 변화가 없었다. 보고서는 장기 운용성과와 시장점유율 사이에 뚜렷한 관계가 나타나지 않았다고 지적했다. 2025년 수익률은 DC형 8.47%, IRP 9.44%, 전체 평균 6.47%였으나 가입자의 67.7%는 평균 이하 수익률에 머물렀다.", "category": "업계·경쟁사", "importance": 4, "source": "EBN", "published": "2026-09-23", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1725356", "related": []}, {"id": "59195bdecf60", "title": "공언만 앞선 노동정책…9월 대책 밀리고 연말 과제만 6개", "summary": "고용노동부가 9월까지 마련하겠다고 밝힌 야간노동자 건강보호 방안의 발표 시점을 연내로 미뤘다. 5인 미만 사업장 근로기준법 적용 확대를 논의할 사회적 대화도 22일까지 논의기구와 참여 주체, 첫 회의 일정이 공개되지 않았다. 퇴직급여 사외적립·기금형 퇴직연금 활성화 방안은 K-노동복지회의소 설립 방안, 일하는 사람 기본법 입법 등과 함께 12월에 몰린 최소 6개 과제에 포함돼 있다. 노동부 내부에서는 9월 과제부터 정부안 마련과 노사 조율이 늦어지면서 연말 대책도 차례로 밀릴 가능성을 배제하기 어렵다는 말이 나온다.", "category": "제도·규제", "importance": 4, "source": "헤럴드경제", "published": "2026-09-23", "url": "https://biz.heraldcorp.com/article/10882794", "related": []}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "102d216548d8", "title": "세금의 마법: \"시간을 버티게 만드는 제도\"[김병철의 퇴직연금 개혁 시나리오]", "summary": "김병철 필자는 연금세제의 본질을 과세 이연(Tax Deferral)으로 규정하고, 1950년대 미국의 높은 초과 소득세율 아래 등장한 지연보상 개념이 현대 연금제도의 기초가 됐다고 설명했다. 고소득 재직기에는 세금을 미루고 은퇴 후 낮은 세율 시점에 연금으로 인출하면 세후 수익이 달라진다는 것이 제도의 작동 원리다. 필자는 국내 제도가 세액공제 방식이 복잡하고 중도인출 제약의 신호가 약해 혜택의 체감도가 낮으며, 재직기간을 추적하는 방식이 직업 이동이 많은 시대에 맞지 않는다고 지적했다. 회사 기준이 아닌 연금 계좌 내 보유 기간을 중심으로 세제를 재설계해야 장기 보유 유인이 강해진다고 제안했다.", "category": "제도·규제", "importance": 3, "source": "이데일리", "published": "2026-09-29", "url": "https://www.edaily.co.kr/News/Read?newsId=02177926645585040&mediaCodeNo=257", "related": []}, {"id": "05a79ad7212c", "title": "거래대금 줄자 증권사, MTS 고도화…종합 투자·자산관리 플랫폼으로", "summary": "증권사들이 모바일트레이딩시스템(MTS)을 잇달아 개편해 AI 투자정보와 연금·ETF·디지털자산까지 담는 종합 투자·자산관리 플랫폼으로 확장하고 있다. 한국투자증권은 연금 관련 서비스를 한곳에 모은 '연금 홈'을 신설하고 퇴직연금 계좌에서 종목과 주기를 설정해 자동 매수하는 'ETF 모으기' 기능을 강화했으며, 미래에셋증권은 다음 달 1일부터 MTS 명칭을 'M-STOCK'에서 'MAPS'로 변경한다. 배경은 거래대금 둔화로, 임희연 신한투자증권 연구원 분석에 따르면 ETF를 포함한 일평균 거래대금은 7월 100조원에서 8월 67조원, 9월 56조원으로 줄었다. 김성훈 현대차증권 연구원은 증권업의 중장기 성장동력으로 가계 금융자산의 증권업권 유입과 자산관리(WM), 퇴직연금 등 장기 고객자산 확대를 제시했다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스핌", "published": "2026-09-29", "url": "https://www.newspim.com/news/view/20260928000838", "related": []}, {"id": "1cdc3db5736a", "title": "전주 피했더니 다시 전주行?…KIC 이전론에 술렁이는 연기금 운용역들", "summary": "한국투자공사(KIC) 이전론이 다시 불거지면서 연기금 운용역들이 술렁이고 있다. 기사는 과거 국민연금 기금운용본부의 전주 이전을 전후해 일부 운용인력이 서울에 남기 위해 KIC나 민간 금융회사로 자리를 옮겼다고 설명했다. 국민연금 운용인력 퇴직은 2014년 9명, 2015년 10명에서 2016년 30명, 2017년 27명으로 늘었고, 2018년에는 운용인력 정원 대비 43명이 부족하다는 지적이 나왔다. 이전 직전인 2017년 초에는 해당 연도에만 20명 안팎이 추가로 기금운용본부를 떠날 것이라는 전망이 나온 바 있다.", "category": "법인·자금운용", "importance": 3, "source": "인베스트조선 (유료)", "published": "2026-09-29", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/28/2026092880177.html", "related": []}, {"id": "f6ade94069c4", "title": "[창간특집] 실적 좋아도 안심 못한다…5대 금융 CEO 54명 '연말 시험대'", "summary": "KB·신한·하나·우리·NH농협 5대 금융그룹의 계열사 CEO 54명이 올해 말 임기 종료를 앞두고 있으며, 5대 은행장은 모두 12월 31일 임기를 마친다. 평가 기준은 순이익 단독 평가에서 벗어나 자본효율성과 사업 다각화, 내부통제까지 함께 보는 방식으로 넓어졌다. 하나은행은 중소·대기업 대출을 고르게 확대하는 기업금융 전략과 함께 퇴직연금 적립금도 48조원을 넘어서며 은행권 1위를 유지하고 있다. 신한은행은 상반기 순이익 2조4585억원으로 5대 은행 중 가장 많았고, 우리은행은 기업대출이 189조2000억원으로 늘었지만 순이익은 1조3730억원으로 전년 동기보다 11.9% 줄었다.", "category": "업계·경쟁사", "importance": 3, "source": "이지경제", "published": "2026-09-29", "url": "https://www.ezyeconomy.com/news/articleView.html?idxno=240218", "related": []}, {"id": "41e5598c4ada", "title": "[국민을 향하는 보건복지] 18세 청년 생애 첫 연금보험료, 국가가 내준다", "summary": "국민연금공단은 2027년 1월 1일부터 '청년 생애 첫 연금보험료 지원' 제도를 시행한다. 지원 대상은 시행일 이후 18세가 되는 2009년생부터이며, 신청하면 국가가 생애 첫 1개월분 보험료를 대신 납부한다. 지원 금액은 기준소득월액 하한액에 해당하는 보험료 전액으로 2027년 상반기 기준 4만1000원이다. 신청은 18세 도래 3개월 전부터 27세 생일 전까지 가능해 2027년 초 18세가 되는 청년은 오는 10월부터 미리 신청할 수 있다.", "category": "가입자·사회", "importance": 3, "source": "중앙일보", "published": "2026-09-29", "url": "https://www.joongang.co.kr/article/25465476", "related": []}, {"id": "c9e4554d890c", "title": "\"절세하려면 퇴직금은 무조건 IRP 계좌로 수령해야\"", "summary": "안명희 우리은행 연금사업부 과장은 퇴직금을 IRP 계좌로 받으면 세금을 떼지 않은 원금 전체가 입금돼 과세 이연에 따른 복리 효과를 볼 수 있다고 설명했다. 55세에 퇴직금 5억원과 운용수익 1000만원이 발생한 경우 일시금으로 인출하면 퇴직소득세 5000만원과 기타소득세 165만원을 합쳐 5165만원을 내지만, 연금으로 받으면 퇴직소득세가 30% 감면돼 3500만원, 운용수익은 3.3~5.5% 저율과세로 55만원만 부담해 총 3555만원으로 줄어든다. 올해부터 연금 수령 10년차까지는 퇴직소득세 30%, 11~20년차는 40%, 21년차 이상은 50%까지 감면율이 올라간다. 확정기여형(DC) 가입자는 정기예금이나 장기 보유 ETF를 매도하지 않고 그대로 옮기는 현물이전 제도를 활용할 수 있다.", "category": "가입자·사회", "importance": 3, "source": "조선일보", "published": "2026-09-28", "url": "https://www.chosun.com/economy/money/2026/09/28/I7WBO2GJAJCAJP2JFJZSI3D6SQ/", "related": []}, {"id": "85d1a1d40530", "title": "삼성증권, '슈퍼리치' 1만명 시대 선도…발행어음 IB 확장 [빅7 증권사]", "summary": "삼성증권의 퇴직연금 적립금은 2026년 6월 말 28조1000억원으로 1년 전보다 63% 늘어 은행·증권·보험을 포함한 국내 퇴직연금 사업자 가운데 9위에 올랐다. 삼성증권의 2026년 상반기 영업수익은 1조8930억원으로 업계 4위였고, 2분기 영업수익은 1조394억원으로 '1조 클럽'에 진입했다. 금융자산 30억원 이상 고객이 1만명을 넘어 업계 처음으로 이 기록을 세웠고, 1억원 이상 고객은 6월 말 57만2000명으로 늘었다. 삼성증권은 2026년 9월 국내 8번째 발행어음 사업자로 인가를 받아 기업금융 확장에 나섰다.", "category": "업계·경쟁사", "importance": 3, "source": "한국금융신문", "published": "2026-09-28", "url": "https://www.fntimes.com/html/view.php?ud=202609231724432862dd55077bc2_18", "related": []}, {"id": "0018a7ccadf9", "title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "summary": "기금형 퇴직연금 도입을 담은 근로자퇴직급여보장법 개정안 논의가 늦어지면서 8월 초 나오기로 했던 세부안이 아직 공개되지 않았고, 금융사 CEO 간담회도 두 차례 연기됐다. 국민연금공단 이사장은 공단이 퇴직연금 운용에 참여하면 기존 대비 수수료는 3분의 1, 수익률은 3배 이상을 기대할 수 있다고 주장했다. 칼럼은 국민연금 기금 1866조원이 퇴직연금 시장 550조원의 3배가 넘는 규모여서 민간 금융사와 공정한 경쟁이 되기 어렵고, 공적 연금 기관의 본분에서도 벗어난다고 지적했다. 그러면서 주도권을 고용노동부가 되찾고 민간 금융사가 수수료를 낮추고 수익률을 높이는 방향으로 개혁이 이뤄져야 한다고 주장했다.", "category": "제도·규제", "importance": 3, "source": "글로벌에픽", "published": "2026-09-28", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29", "related": []}, {"id": "0185991f029d", "title": "국민연금 1점에 움직이는 운용사들…'전주 거점' 경쟁 본격화", "summary": "국민연금 기금운용본부가 있는 전주로 자산운용사들이 잇따라 사무소를 열고 있다고 전했다. 국민연금이 올해 6월부터 위탁운용사를 선정할 때 전주에 거점을 둔 운용사에 1점의 가점을 주기로 한 것이 계기다. 상반기 기준 국민연금의 위탁운용 규모는 972조4000억원이며, 가점 반영 대상은 국내주식·국내채권에서 국내인프라와 사모투자 위탁운용사 선정까지 넓어졌다. KB·한화·신한·삼성·미래에셋 등 15개가 넘는 운용사가 전주 사무소를 냈지만 운용역과 리서치 핵심 인력은 여전히 서울에 몰려 있어 서울 본사 인력이 정기적으로 순환 근무하는 방식으로 운영되는 곳이 많다고 짚었다.", "category": "업계·경쟁사", "importance": 3, "source": "메트로신문", "published": "2026-09-27", "url": "http://www.metroseoul.co.kr/article/20260927500001", "related": []}, {"id": "3e62e20494f9", "title": "65세로 정년연장? 퇴직은 53세…'백발성성' 인턴은 한국서 가능할까", "summary": "정년을 65세로 올리는 논의가 진행되지만 실제 평균 퇴직 연령은 52.9세이고 근로자가 일하고 싶어하는 나이는 73.4세라고 전했다. 퇴직 사유는 사업 부진·조업 중단이 24.9%, 건강 악화가 22.1%, 가족 돌봄이 15.2%였고 정년퇴직은 13.2%에 그쳐, 정년 이전에 회사를 떠나는 경우가 대부분이라고 짚었다. 정년제를 적용받지 않는 근로자 148만명 가운데 62만8000명(42%)이 정년제 밖에 있으며, 고령자 계속고용장려금은 분기 90만원(비수도권 120만원)을 최대 3년간 지원하지만 지원 사업장은 2022년 3028곳에서 2025년 2271곳으로 25% 줄었다고 보도했다. 일본은 65세까지 고용확보 조치를 99.9%의 기업이 시행하고 있다며, 정년 숫자만 올려서는 실제 고용기간을 늘리기 어렵고 퇴직 후 재고용을 강화하는 방안이 필요하다고 지적했다.", "category": "가입자·사회", "importance": 3, "source": "머니투데이", "published": "2026-09-27", "url": "https://www.mt.co.kr/living/2026/09/27/2026092622024336056", "related": []}]}, "monthly": {"period": "monthly", "key": "current", "label": "2026-08-30 ~ 2026-09-29", "generated_at": "2026-09-30T16:45:43+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": [{"title": "퇴직연금 문 열린 개인용 국채…첫 선택은 10년물에 쏠렸다", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436449"}, {"title": "개인 퇴직연금 계좌 통해 장기국채 투자 길 열렸다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712685/2"}, {"title": "개인 국채투자, '퇴직연금서 투자'에 흥행…9월 청약서 초과 수요", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260917099600008"}, {"title": "\"1억 넣어두면 20년 뒤 2.6억\"…연금개미들 외면한 이유", "source": "한국경제", "url": "https://www.hankyung.com/article/202609168563i"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 확정 수익 60%\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/14/2026091490036.html"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 60% 확정 수익\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/13/2026091390109.html"}, {"title": "“20년 묻어두면 수익률 161%”…퇴직연금 국채, 증권사 유치전 불붙었다", "source": "디지털데일리", "url": "https://www.ddaily.co.kr/page/view/2026091010295983047"}, {"title": "“예금 이자론 성 안 차”…은행 퇴직연금, 국채 품고 반격할까", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1688375/"}, {"title": "[개인국채 시대] 삼성·한투·KB·NH證 합류…경쟁 본격화", "source": "딜사이트경제TV", "url": "https://news.dealsitetv.com/articles/176341"}, {"title": "[개인국채 시대] 미래에셋 선구안 빛났다…선점효과 기대", "source": "딜사이트경 이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "8bb193e0ea59", "title": "“정부 기초연금개편안, 겉으로는 하후상박 실제는 재정 절감안”", "summary": "정부가 노인 하위 70%를 세 집단으로 나눠 차등 지급하는 하후상박 방식을 내놨다. 하위 30%에 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원(동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": [{"title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "source": "슬로우뉴스", "url": "https://slownews.kr/166386"}, {"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "1fc91cd9d139", "title": "리스크 관리·노후수입 한번에…주목받는 보증형 실적 배당보험", "summary": "미래에셋생명의 개인형 퇴직연금(IRP) 보증형 실적배당보험이 출시 후 717억원을 모집했다고 전했다. 이 상품은 IRP를 통해서만 가입할 수 있는 거치형으로, 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 연금 개시가 가능하다. 이미 만 55세를 넘긴 가입자는 가입과 동시에 연금을 받을 수 있고, 적립금이 소진될 때까지 20년 이상 연금을 수령할 수 있다. 적립금은 미래에셋생명의 일임형 자산배분펀드 MVP펀드를 통해 글로벌 자산에 분산투자된다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645584384&mediaCodeNo=257", "related": [{"title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024"}, {"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상 스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "1fc91cd9d139", "title": "리스크 관리·노후수입 한번에…주목받는 보증형 실적 배당보험", "summary": "미래에셋생명의 개인형 퇴직연금(IRP) 보증형 실적배당보험이 출시 후 717억원을 모집했다고 전했다. 이 상품은 IRP를 통해서만 가입할 수 있는 거치형으로, 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 연금 개시가 가능하다. 이미 만 55세를 넘긴 가입자는 가입과 동시에 연금을 받을 수 있고, 적립금이 소진될 때까지 20년 이상 연금을 수령할 수 있다. 적립금은 미래에셋생명의 일임형 자산배분펀드 MVP펀드를 통해 글로벌 자산에 분산투자된다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645584384&mediaCodeNo=257", "related": [{"title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024"}, {"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용 맡는다", "summary": "미래에셋증권이 IRP 계좌용 로보어드바이저 일임 서비스 퇴직연금 로보Wrap을 출시했다. 알고리즘이 글로벌 자산배분 포트폴리오를 구성하고 시장 상황에 맞춰 리밸런싱과 매매까지 수행한다. 7월 말 기준 누적 가입 계좌는 14만좌, 누적 가입금액은 8조3000억원이다.", "category": "운용·상품", "importance": 3, "source": "뉴스핌", "published": "2026-08-05", "url": "https://www.newspim.com/news/view/20260805001063", "related": []}, {"id": "676b0ae84927", "title": "신한 적립액 54조 독주…국민·하나, IRP 중심 2위 경쟁", "summary": "2026년 1분기 퇴직연금 랭킹에서 신한이 적립액 54조원으로 선두를 지켰다. 국민은행과 하나은행이 IRP를 중심으로 2위 자리를 놓고 다투고 있다. 은행권 IRP 적립금은 83조7000억원으로 전체 시장의 31.7%를 차지했다.", "category": "업계·경쟁사", "importance": 3, "source": "한국금융신문", "published": "2026-04-21", "url": "https://www.fntimes.com/html/view.php?ud=2026042117435794185e6e69892f_18", "related": []}, {"id": "ecca1d1f70f8", "title": "기금형 퇴직연금은 결과 아닌 과정 책임으로…사외적립의무는 속도조절 요구", "summary": "노사정과 전문가가 참여한 정책 토론회에서 기금형 퇴직연금 도입 방향이 논의됐다. 전문가들은 운용 주체의 책임을 결과가 아닌 과정, 즉 의사결정 절차의 적정성으로 전환해야 한다고 주장했다. 경영계는 중소기업 부담을 이유로 사외적립 의무화의 단계적 시행을 요구했다. 한국노총과 한국경영자총협회, 고용노동부, 한국투자증권 관계자가 참석했다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-04-08", "url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=04598566645414152", "related": []}]}}}</script>

  var currentPeriod = 'daily';

    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);

  }

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };

      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
