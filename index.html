  :root {

    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;

    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;

      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;

         마젠타도 한 단계 올려 짝을 맞춘다. 각각 6.2:1, 6.6:1. */

      --kiwoom-point: #FF5FB4;

  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야
     구분선이 아니라 종이의 테두리로 읽힌다. */
  .topline { height: 4px; background: var(--kiwoom-deep); }

  /* 수집이 멈춰도 index.html은 그대로 남아 아무 일 없어 보인다. 그래서
     보는 사람의 시계와 비교해 묵은 정도를 화면에서 직접 말한다.

    color: var(--paper);

    font-weight: 600;
    text-align: center;
  }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);

    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {

    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;

  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {

    align-items: baseline;

    padding-bottom: 8px;
  }

    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */

    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {

    align-items: stretch;

    background: transparent;
    color: var(--ink-soft);

    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);

  .filters button {

    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;

    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);

    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);

  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;

    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;

    .rank { font-size: 1.25rem; }

    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

"summary": "전용우 삼성자산운용 연금OCIO본부장은 인공지능(AI)이 퇴직연금 시장의 경쟁 구도를 바꿔 토스·네이버·구글이 자산운용사의 경쟁사가 될 수 있다고 말했다. 그는 앞으로 경쟁력이 개인별 맞춤형 자산관리와 리밸런싱 역량에 달려 있다고 봤다. 기금형 퇴직연금 도입은 전문 운용기관의 역할이 확대되는 계기로 꼽았으며, 삼성운용은 공적 기금과 DB형 퇴직연금 등 90조원 이상의 OCIO 관련 자산을 운용하고 있다고 밝혔다. 내부적으로 인출형 솔루션 출시를 검토 중이다.", "category": "업계·경쟁사", "importance": 3, "source": "이데일리", "published": "2026-11-22", "url": "https://www.edaily.co.kr/News/Read?newsId=01856486645648344&mediaCodeNo=257"}, {"id": "4df93ebbccdf", "title": "“13월의 월급 잡아라”…금융권, 연금 고객 유치전", "summary": "연말정산 시즌을 앞두고 보험사와 은행들이 연금저축과 IRP 신규 가입·추가 납입·타사 계좌 이전 고객에게 상품권과 포인트를 지급하는 행사를 잇달아 진행하고 있다. 한화생명은 연말까지 IRP 신규 가입 후 100만원 이상 입금, 월 10만원 이상 자동이체, 타사 연금계좌 300만원 이상 이전 고객에게 상품권 3만원을 지급한다. KB국민은행은 다음달 11일까지 '2026 연말 절세 페스티벌'을 열어 일임형 ISA 또는 연금저축펀드에 1000만원 이상 가입·이전한 고객 중 100명에게 100만원 상품권을 준다. 우리은행은 다음달 31일까지 DC형 퇴직연금이나 IRP 신규 가입 고객과 추가 납입 순증액 100만원 이상 고객에게 배달 쿠폰을 제공한다.", "category": "업계·경쟁사", "importance": 2, "source": "디지털타임스", "published": "2026-11-22", "url": "https://www.dt.co.kr/article/12096419"}, {"id": "68f480b169cb", "title": "노후자금 몰빵했는데 어쩌나…25% 추락한 ETF 정체 [김연지의 연금빌드업]", "summary": "금융감독원 퇴직연금 비교공시에 따르면 올해 3분기 말 퇴직연금 적립금은 542조1000억원으로 전 분기보다 11조8000억원 줄었다. 같은 기간 코스피가 19.3% 하락하면서 실적배당형 적립금은 197조7000억원에서 185조2000억원으로 줄었고 비중은 35.7%에서 34.2%로 낮아져 15분기 만에 감소했다. 삼성증권 분석 결과 삼성전자·SK하이닉스와 채권을 함께 담은 혼합형 ETF의 고점 대비 최대 하락률은 약 25%에 달했다. 기사는 계좌 내 종목 중복을 점검하고 배당·헬스케어·경기방어 업종 혼합형으로 분산하며, 은퇴가 가까울수록 단기·중기 채권 중심으로 방어하라는 조언을 전했다.", "category": "운용·상품", "importance": 2, "source": "한국경제", "published": "2026-11-22", "url": "https://www.hankyung.com/article/2026112099766"}, {"id": "585ad9668a22", "title": "보험사 M&A '마지막 선택지' 된 카디프생명… KDB생명은 '정상화 작업'", "summary": "KDB생명 인수에 실패한 한국투자금융지주가 BNP파리바카디프생명 최대주주인 BNP파리바카디프와 양해각서를 맺고 단독 협상을 진행하고 있다. 신한은행도 보유 지분 15%를 정리할 예정이며 금액은 약 850억원 수준이다. 인수가 성사되면 보험사의 장기 자산운용 경험을 퇴직연금 상품 개발과 운용 전략에 활용해 한국투자증권의 연금 사업 경쟁력을 높일 수 있을 것으로 전망된다. 산업은행은 지난 18일 한국금융지주와의 KDB생명 매각 협상 종료를 발표했다.", "category": "업계·경쟁사", "importance": 2, "source": "매일일보", "published": "2026-11-22", "url": "https://www.m-i.kr/news/articleView.html?idxno=2021662"}, {"id": "5a04a317e133", "title": "지주 계열 밀어낸 독립계…자산운용사, 자산총계 '지각변동'", "summary": "금융투자협회 전자공시서비스에 따르면 9월 말 기준 자산운용사 자산총계 톱10에서 신한자산운용과 하나대체투자자산운용 등 금융지주 계열사가 밀려나고 디에스자산운용(5030억 원)과 타임폴리오자산운용(4796억 원) 등 독립계가 진입했다. 한국투자밸류자산운용은 자산을 1조 2434억 원에서 1조 5695억 원으로 26.2% 불려 업계 2위에 올랐다. 다만 3분기 코스피가 19% 넘게 급락하면서 운용사 507곳의 당기순이익은 1768억 원으로 전 분기 대비 91.6% 급감했다. 업계 관계자는 퇴직연금(TDF)·ETF 등 안정적인 수수료 기반 확보가 운용사의 기초 체력을 가를 것이라고 말했다.", "category": "업계·경쟁사", "importance": 2, "source": "글로벌이코노믹", "published": "2026-11-22", "url": "https://www.g-enews.com/view.php?ud=202611201430484284923c501012_1"}, {"id": "84a9f1e39d5f", "title": "주민번호·계좌정보까지 털렸다?… 미래에셋생명 고객 1만여 명 개인정보 유출", "summary": "미래에셋생명에서 지난달 24일 발생한 해킹 사고로 고객 1만418명의 개인정보가 유출된 것으로 집계됐다. 유출 정보에는 주민등록번호·휴대전화번호 등과 함께 운전면허증 사본, 은행명, 계좌번호, 서명 등 퇴직연금 관련 금융거래정보도 포함됐다. 대신증권 3만8490명, 미래에셋자산운용 2281명 등 증권·전자금융·가상자산업계에서도 침해사고가 잇따랐다. 금융위원회는 금융회사 555곳 보안 점검에서 130곳의 미흡 사항을 확인하고 보완 조치를 진행했다.", "category": "업계·경쟁사", "importance": 2, "source": "금강일보", "published": "2026-11-22", "url": "https://www.ggilbo.com/news/articleView.html?idxno=1193920"}, {"id": "95447c246b8d", "title": "“애 낳는 게 세금 아끼는 비법?”…자녀 둘이면 카드공제 100만원 더 [머니뭐니]", "summary": "내년 초 2026년 귀속 연말정산부터 총급여 7000만원 이하 근로자의 신용카드 소득공제 기본한도가 자녀 1명이면 350만원, 2명 이상이면 400만원으로 늘어난다. 혼인 세액공제는 현행법상 올해 12월 31일 혼인신고분까지만 적용되고, 초등 2학년 이하 자녀의 예체능 학원비와 무주택 부부의 월세 공제는 확대된다. 연금저축은 연 600만원, 개인형 퇴직연금(IRP)을 합치면 최대 900만원까지 세액공제 대상이며 지방소득세를 포함해 최대 148만5000원의 세금을 줄일 수 있다.", "category": "가입자·사회", "importance": 2, "source": "헤럴드경제", "published": "2026-11-22", "url": "https://biz.heraldcorp.com/article/10945083"}, {"id": "44805a08b8f3", "title": "해외주식형 강자 입증…미래에셋운용 ‘TIGER’ 존재감 확대", "summary": "미래에셋자산운용의 TIGER 미국 대표지수 ETF 3종(미국S&P500·미국나스닥100·미국배당다우존스)의 연초 이후 개인 순매수 합계가 지난 18일 기준 9조2825억원으로 집계됐다. 이는 지난해 연간 개인 순매수 합계(5조1594억원)의 1.8배 수준이며, 3종의 순자산 합계는 연초 22조3075억원에서 35조8293억원으로 13조5218억원 늘었다. TIGER 미국S&P500 ETF는 5조4464억원의 개인 순매수로 국내 상장 ETF 전체 1위를 차지했다. 이들 상품은 연금저축·퇴직연금 계좌에서 매달 일정 금액을 적립하는 장기 투자 수단으로 활용되며 안정적인 수급 기반을 확보했다.", "category": "업계·경쟁사", "importance": 2, "source": "세계비즈", "published": "2026-11-22", "url": "http://www.segyebiz.com/newsView/20261122506967"}, {"id": "5e0ed26cde79", "title": "정년연장, 27일 노사 합의 불발 땐 정부안 발표", "summary": "김영훈 고용노동부 장관은 22일 KBS 일요진단에 출연해 27일 민주당 정년연장특별위원회 회의를 전후해 정부 입장을 발표할 시점이 다가오고 있다고 말했다. 특위에서 합의안이 나오지 않으면 정부가 직접 나서겠느냐는 질문에는 그렇다고 답했다. 현행 법정 정년은 60세지만 국민연금 수급 개시 연령은 1969년생 이후 65세여서 최대 5년의 소득 공백이 생길 수 있다. 경영계는 퇴직 후 재고용 방식을, 노동계는 법정 정년 65세 연장을 주장하며 이견을 좁히지 못하고 있다.", "category": "제도·규제", "importance": 2, "source": "동행미디어 시대", "published": "2026-11-22", "url": "https://www.sidae.com/article/2026112213550851728"}, {"id": "462ba5ae7411", "title": "국힘, AI 유급 일자리 2만개 마련 등 청년 정책 발표…“미래세대 영향평가 도입”", "summary": "국민의힘이 청년 일자리와 자산 형성, 주거 안정, 국민연금 개혁을 골자로 한 16개 청년 정책을 내놨다. 국민연금 분야에서는 기금운용 원칙을 변경할 때 예외 조건과 위험 분석을 의결 전에 공개하고 1년 뒤 사후 평가 결과를 국회에 보고하는 '기금운용 예외 규칙 사후검증제'를 제안했다. 기획단은 올해 국민연금의 국내 주식 목표 비중이 14.9%에서 20.8%로 상향됐지만 관련 회의록은 2030년에야 공개된다며 투명성 문제를 제기했고, 출생 연도별 보험료·급여 공시와 첫 연금보험료 자동지원도 제시했다. 금융 분야에서는 청년이 ISA에 매달 10만원씩 3년간 납입하면 최대 180만원을 추가 지원하는 방안을 제안했다.", "category": "가입자·사회", "importance": 2, "source": "이투데이", "published": "2026-11-22", "url": "https://www.etoday.co.kr/news/view/2651346"}, {"id": "a59a82d9d3e9", "title": "정년연장 ‘27일 합의’ 압박한 김영훈…불발 땐 정부 입장 발표 검토", "summary": "김영훈 고용노동부 장관은 22일 시사방송에 출연해 27일 예정된 더불어민주당 정년연장 특별위원회 소위원회에서 합의가 나오지 않으면 정부 입장 발표 등을 검토하겠다고 밝혔다. 민주당 특위는 당초 2025년 안에 정년연장 입법을 마무리할 계획이었으나 올해 1월 이후 약 10개월간 논의가 뚜렷한 진전을 보이지 못했다. 노동계는 퇴직 이후 국민연금을 받기 전까지의 소득 공백을 줄이려면 현행 60세인 법정 정년을 65세로 신속히 늘려야 한다고 주장하고, 경영계는 인건비 증가와 청년 채용 위축을 우려해 재고용 등 유연한 계속고용을 요구하고 있다. 한국경제인협회 조사에서는 대학생·졸업자 응답자의 61.9%가 법정 정년을 65세로 늘리면 청년 신규채용 기회가 줄어들 것으로 예상했다.", "category": "가입자·사회", "importance": 2, "source": "이투데이", "published": "2026-11-22", "url": "https://www.etoday.co.kr/news/view/2651337"}, {"id": "2794392be4c6", "title": "이번주 국내 주요 금융일정(11.23~11.27)", "summary": "11월 23일부터 27일까지 금융위원회·금융감독원·한국은행의 주요 일정을 정리했다. 금융감독원은 25일 환매중단펀드 보유 퇴직연금 계좌 실물이전 개선방안을 발표할 예정이다. 같은 날 금감원은 2026년 1~9월 보험회사 경영실적과 모험자본 활성화 추진 성과도 내놓는다. 24일에는 금융위원회가 보험업법 시행령 및 금융기관 검사·제재 규정 개정안을 입법예고하고 디지털자산법 입법 추진방안 논의를 위한 가상자산위원회를 연다.", "category": "제도·규제", "importance": 2, "source": "뉴스핌", "published": "2026-11-22", "url": "https://www.newspim.com/news/view/20261122000083"}, {"id": "b43d7d460014", "title": "증시 급락에 증안펀드 가동 준비…자사주 매수한도 완화", "summary": "정부는 22일 긴급 시장상황점검회의(F4)를 열고 증권시장안정펀드를 즉시 가동할 수 있도록 준비에 착수하기로 했다. 상장기업의 자사주 매수주문 수량한도를 24일부터 3개월간 완화하고, 불법공매도에 대해 3개월간 특별 집중감시를 실시한다. 자본시장 개혁 추진 TF를 조속히 출범시키고 생산적금융 ISA 신설, 우리아이자립펀드 도입, 퇴직연금 기능 강화도 추진한다.", "category": "제도·규제", "importance": 2, "source": "디지털타임스", "published": "2026-11-22", "url": "https://www.dt.co.kr/article/12096567"}, {"id": "6029cd65ea65", "title": "\"내 노후자금이 AI에 몰빵?\"…美 401k 가입자들 '벌벌'", "summary": "AI주 폭락으로 S&P500지수 시가총액이 이번주에만 5조6000억달러 증발하면서 미국 퇴직연금(401k) 가입자들의 노후자금이 AI 대형 기술주에 쏠려 있다는 문제가 드러났다. S&P500 상위 10개 종목 비중은 약 40%로 닷컴버블 정점 때의 29%보다 높다. 전문가들은 여러 지수 펀드를 나눠 담아도 같은 기술 대기업에 노출될 수 있다며 나이와 위험 성향에 맞는 자산배분을 조언했다. CFRA는 미국 주식 45%, 해외 주식 15%, 채권 35%, 현금 5%의 포트폴리오를 제시했다.", "category": "운용·상품", "importance": 2, "source": "이데일리", "published": "2026-11-22", "url": "https://www.edaily.co.kr/News/Read?newsId=01846646645648344&mediaCodeNo=257"}, {"id": "b9f70ed469cf", "title": "“집 한 칸은 해주고 싶은데”…은퇴 앞둔 부모, 재산 언제 물려줘야 할까 [퇴직금 들고 나왔습니다]", "summary": "은퇴를 앞둔 5060세대가 자녀에게 재산을 증여할지 상속할지 고민하는 사례를 다룬 연재 기사다. 증여에 앞서 퇴직 시점부터 국민연금 수령 전까지 필요한 생활비를 먼저 계산하고, 연금저축이나 퇴직연금은 노후 생활비 재원으로 활용하라고 조언한다. 성인 자녀는 직계존속으로부터 10년간 합산 5000만원까지 증여재산공제를 받을 수 있으나, 사망 전 10년 이내 증여분은 상속세 계산에 다시 포함된다. 부동산 증여는 증여세 외에 취득세·보유세·양도소득세와 독립세대 인정 여부까지 따져야 한다고 설명한다.", "category": "가입자·사회", "importance": 1, "source": "매일경제", "published": "2026-11-22", "url": "https://www.mk.co.kr/article/12215367"}, {"id": "440ed00efc8f", "title": "[신간] “수십억 없어도 노후는 든든하게”…매달 1000만원 연금 받는 법", "summary": "현직 펀드매니저 박종연이 쓴 신간 ‘월 천 연금부자 이야기’(보다나은)가 출간됐다. 책은 여러 연금 제도를 활용해 70대에 매달 평균 1000만 원을 받도록 계획한 직장인 박 부장의 사례를 이야기 형식으로 풀어낸다. 공적·퇴직·개인연금의 차이와 ETF·채권·리츠를 활용한 위험 분산, 연금저축펀드·IRP·ISA 병행 활용과 절세 요령을 담았다. 20대부터 퇴직 이후 세대까지 나이에 따라 달라져야 할 투자 방식과 연금 수령 순서도 다룬다.", "category": "가입자·사회", "importance": 1, "source": "이투데이", "published": "2026-11-22", "url": "https://www.etoday.co.kr/news/view/2651316"}, {"id": "b7b0bf4623ce", "title": "NH투자증권, 연말까지 연금저축 100만원 이상 순입금 고객 330명에 경품", "summary": "NH투자증권이 N2 연금저축계좌에 100만원 이상을 순입금한 고객을 대상으로 12월 31일까지 경품 이벤트를 운영한다. 추첨 인원은 330명으로 1등 10명에게 마사지기 세트, 2등 20명에게 아웃백 모바일 상품권, 3등 300명에게 메가커피 아메리카노 2잔을 주며 경품은 내년 2월에 지급된다. 회사는 연금저축의 세액공제 대상 납입 한도가 연간 600만원, IRP와 합산하면 900만원이며 공제율은 13.2~16.5%라고 설명했다. 중도해지하거나 연금 외 방식으로 받으면 세액공제를 받은 원금과 수익에 기타소득세가 부과될 수 있다고 안내했다.", "category": "업계·경쟁사", "importance": 1, "source": "비즈월드", "published": "2026-11-22", "url": "http://www.bizwnews.com/news/articleView.html?idxno=152400"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-11-15 ~ 2026-11-21", "generated_at": "2026-11-22T19:46:15+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "df6d8c8ff511", "title": "증시 급락에 퇴직연금 수익률 급감…적립금 11조7천억원 감소", "summary": "올해 3분기 말 퇴직연금 적립금은 542조1214억원으로 6월 말 553조8779억원보다 11조7565억원(2.1%) 줄었으며, 분기 적립금 감소는 2020년 1분기 이후 처음이다. 유형별 감소액은 IRP 5조129억원, DC형 3조8374억원, DB형 2조9062억원으로 IRP와 DC형이 전체 감소액의 약 75%를 차지했다. 증권사 11곳의 DC형 원금비보장상품 연간 누적 수익률은 2분기 말 52.85%에서 14.46%로, IRP는 46.97%에서 14.19%로 떨어졌다. DB형 수익률은 11.35%에서 3.86%로 낮아졌다.", "category": "운용·상품", "importance": 4, "source": "광주매일신문", "published": "2026-11-16", "url": "http://www.kjdaily.com/article.php?aid=1794759721692238276", "related": [{"title": "[퇴직연금 긴급점검] 6년 반 만에 적립금 감소…9월말 기준 3개월만에 11.7조 줄어", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202611181327078600627"}]}, {"id": "f39e4c1aef15", "title": "금감원 \"퇴직연금 단기실적 경쟁안돼…변칙 고금리 등 엄정대응\"", "summary": "서재완 금융감독원 부원장보는 19일 4대 금융협회와 퇴직연금 사업자 담당 임원 간담회에서 연말 변칙적 고금리와 이벤트성 특별이익 제공 등 불건전 영업행위에 엄정 대응하겠다고 밝혔다. DB형 원리금보장상품의 연말 만기 집중을 틈탄 특정 가입자 고금리 제공, 고수익 상품을 대기업 위주로 제시해 영세기업 가입비율이 10%를 밑돈 사례 등이 지적됐다. 금감원은 최근 5년간 통합연금포털 공시오류가 302건 발생했다며 내부 검증 체계 강화를 주문했다. 불건전 영업행위 모니터링을 강화하고 공시 제도 개선을 추진할 계획이다.", "category": "제도·규제", "importance": 4, "source": "보험매일", "published": "2026-11-20", "url": "http://www.fins.co.kr/news/articleView.html?idxno=110641", "related": []}, {"id": "b45aff8da79f", "title": "키움증권, 퇴직연금 5개월 만에 2000억 돌파…영웅문 고객이 이끈 IRP 성장 [퇴직연금 542조 대격변 5-①]", "summary": "키움증권의 퇴직연금 적립금이 올해 6월 사업 개시 후 약 5개월 만인 11월 2000억원을 넘어섰다. 적립금은 6월 말 649억원에서 9월 말 1882억원으로 약 2.9배가 됐고, 같은 기간 증권업권 전체 적립금은 전 분기 대비 2.88% 줄었다. 9월 말 IRP 적립금은 약 1626억원으로 전체의 86%가량이며, IRP 적립금의 약 75%가 타사 이전 자금이고 7월 기준 IRP 가입자의 96%가 기존 키움증권 고객이었다. 키움증권은 영웅문S#에서 ETF 실시간 매매·적립식 자동매수와 통합연금개시 서비스를 제공한다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-20", "url": "https://www.etoday.co.kr/news/view/2650202", "related": []}, {"id": "68273cee30dc", "title": "표영대 키움증권 연금플랫폼본부장 \"증권업권 퇴직연금 적립금 5위 진입 목표\" [퇴직연금 542조 대격변 5-②]", "summary": "표영대 키움증권 연금플랫폼본부장은 중장기적으로 증권업권 퇴직연금 적립금 기준 5위 진입을 목표로 한다고 밝혔다. IRP로 출발한 사업을 DB·DC 기업 퇴직연금으로 넓히는 것이 다음 과제이며, 근로자가 영웅문S#에서 키움증권을 사업자로 회사에 요청하는 '퇴직연금 도입요청'을 비대면 영업 통로로 활용한다. 기업 비용 부담을 낮추기 위해 DB와 DC 모두 첫해 운용관리·자산관리 수수료 전액을 면제하고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-20", "url": "https://www.etoday.co.kr/news/view/2650211", "related": []}, {"id": "47078a2852d9", "title": "퇴직연금 ‘장기 성적표 1위’ 하나증권⋯AI·연금닥터의 맞춤 처방 [퇴직연금 542조 대격변 4-①]", "summary": "금융감독원 퇴직연금 공시에 따르면 3분기 말 하나증권의 DC형 원리금 비보장상품 수익률은 5년 연 8.03%, 7년 연 8.88%, 10년 연 7.21%로 세 구간 모두 증권업계 1위다. 하나증권의 DC형 적립금은 지난해 말 2805억원에서 3분기 말 3828억원으로, IRP 적립금은 6429억원에서 8926억원으로 늘어 합산 1조2754억원으로 38.1% 증가했다. 하나증권은 9월 차세대 MTS '하나증권V'를 출시하고 AI 기반 'AI 연금프로' 서비스를 운영하고 있다. 전국 영업점에는 연금 전문 PB인 '연금닥터'를 배치해 고액자산가와 은퇴 예정 고객에게 컨설팅을 제공한다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-19", "url": "https://www.etoday.co.kr/news/view/2649799", "related": []}, {"id": "41cb778f8d14", "title": "증권가 연말 稅테크...절세계좌 황금률은?", "summary": "연말정산을 앞두고 연금저축·IRP·ISA를 정해진 순서대로 채우는 '절세계좌 황금률'이 세후 수익을 가른다는 조언이 나왔다. 키움증권은 계좌별 세금 비교에서 연 수익 약 833만원까지는 해외 직접투자, 833만~2000만원은 일반계좌 ETF, 2000만원 초과는 연금저축이 유리하다고 분석했다. 상의민 키움증권 연금플랫폼본부 과장은 2030세대에는 ISA를 먼저 채우고, 50대 이상에는 중개형 ISA를 먼저 채운 뒤 연금저축을 과세이연 계좌로 쓰라고 권했다. 다만 건보공단이 연 1500만원 이하 사적연금(연금저축·IRP) 등 분리과세 소득에 건보료를 부과하는 방안을 국감 업무자료에 과제로 올려 절세 효과가 줄 수 있다는 관측도 제기된다.", "category": "가입자·사회", "importance": 4, "source": "주간한국", "published": "2026-11-19", "url": "https://weekly.hankooki.com/news/articleView.html?idxno=7193728", "related": []}, {"id": "e78fa29534f1", "title": "‘국민연금, 기금형 퇴직연금 진출’ 제동", "summary": "국민의힘 김위상 의원이 16일 국민연금 등 공적연금 관리·운용기관이 퇴직연금제도를 설정·운영할 수 없도록 하는 근로자퇴직급여 보장법 개정안을 대표 발의했다. 국민연금의 기금형 퇴직연금 참여를 막는 법안이 국회에서 발의된 것은 처음이다. 김 의원은 공적연금이 장기 기금 고갈 위험을 안고 있고 사회보장적 성격과 재정 운영 원리가 퇴직연금과 근본적으로 달라 두 제도를 엄격히 분리해야 한다고 밝혔다. 고용노동부는 지난달 퇴직연금 기능 강화 방안에서 국민연금공단 참여를 보류하고 참여 방식과 범위는 국회 논의에 맡긴 상태다.", "category": "제도·규제", "importance": 4, "source": "세계일보", "published": "2026-11-18", "url": "https://www.segye.com/newsView/20261117515456?OutUrl=naver", "related": []}, {"id": "059d4973c5c1", "title": "디폴트옵션 1위 NH투자증권…장기수익률 앞세워 연금자산 20조 돌파 [퇴직연금 542조 대격변 3-①]", "summary": "NH투자증권의 퇴직연금 적립금은 2026년 9월 말 약 11조8000억원으로 2022년 말 약 5조원에서 최근 3년간 연평균 약 25% 성장했고, 6월에는 연금저축을 합친 연금자산이 20조원을 넘었다. DC·IRP 적립금은 9월 말 기준 전년 말 대비 2조1000억원(34%) 늘어 증가액 기준 전체 사업자 중 8위다. 9월 말 원리금비보장형 최근 3년 연환산 수익률은 DC 16.3%, IRP 15.1%이고, IRP 10년 수익률은 전체 사업자 중 1위다. 디폴트옵션 중립투자형 2호는 최근 1년과 3년 누적 수익률 모두 증권업권 1위이며 적극투자형 2호는 3년 누적 71%를 기록했다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-18", "url": "https://www.etoday.co.kr/news/view/2649332", "related": []}, {"id": "9a0c71d9781b", "title": "금감원, 과당경쟁 경고 열흘 만에 DB손보 퇴직연금 들여다본다", "summary": "금융감독원이 퇴직연금 과당경쟁 자제를 요청한 지 열흘 만에 DB손해보험에 대한 퇴직연금 수시검사를 16일부터 2주간 진행하고 있다. 검사는 디폴트옵션, DC형 사용자 부담금, DB형 재정검증 결과 통보 등 관리업무 전반을 대상으로 한다. DB손보는 2024년 가입자 3명의 퇴직급여 2,520만원을 잘못된 계좌로 지급하고 계약이전 요청 47건을 기한 내 처리하지 않아 과태료 7,400만원을 받은 바 있다. 실물이전 제도 시행 후 2026년 6월 말까지 15조8,699억원이 다른 사업자로 , {"id": "0d55adcb5ae7", "title": "내 퇴직연금 10년 굴려도 연 2.6%…18.8% 국민연금에 맡기면 달라질까", "summary": "국회에는 국민연금공단 등 공적연금 운용기관의 퇴직연금 사업 참여를 허용하는 법안과 제한하는 법안이 함께 올라와 있으며, 16일 제한 내용을 담은 근로자퇴직급여 보장법 개정안이 발의됐다. 지난해 말 퇴직연금 적립금은 501조4000억원, 연 수익률은 6.47%였으나 10년 연환산 수익률은 2.64%에 그쳤고 디폴트옵션 적립금 53조3000억원의 85.4%가 안정형에 몰렸다. 국민연금기금의 지난해 수익률은 18.82%(잠정)였고, 김성주 이사장은 공단 참여 시 수수료를 기존의 3분의 1 수준으로 낮출 수 있다고 밝힌 바 있다. 금융권은 적립금이 공단으로 쏠릴 수 있다고 우려한다.", "category": "제도·규제", "importance": 3, "source": "세계일보", "published": "2026-11-20", "url": "https://www.segye.com/newsView/20261120501311?OutUrl=naver", "related": []}, {"id": "a350f9e0c1d6", "title": "개인투자용 국채 퇴직연금 청약액 한 달 새 21%↓…일반계좌는 15%↑", "summary": "재정경제부 발행 결과에 따르면 퇴직연금 계좌(DC·IRP)를 통한 개인투자용 국채 10년물·20년물 청약액은 9월 1433억원에서 10월 1137억원으로 20.7% 감소했다. 같은 기간 일반 전용계좌 청약액은 540억원에서 620억원으로 14.8% 늘었다. 10년물·20년물 전체 청약액에서 퇴직연금 계좌 비중은 72.6%에서 64.7%로 7.9%포인트 낮아졌다. 미래에셋증권 분석에서는 자사 청약 고객의 64.4%가 두 달 이상 반복 청약했다.", "category": "운용·상품", "importance": 3, "source": "이지경제", "published": "2026-11-20", "url": "https://www.ezyeconomy.com/news/articleView.html?idxno=242028", "related": []}, {"id": "348e8a741d11", "title": "발행어음·연금으로 판 넓힌 키움증권…엄주성, 연임 문턱 넘을까", "summary": "엄주성 키움증권 대표의 사내이사 임기가 내년 3월 28일 만료되면서 연임 여부에 관심이 쏠린다. 엄 대표는 영풍제지 미수금 사태 이후 위험관리 조직을 정비하고, 발행어음과 퇴직연금으로 주식 중개 중심의 사업 범위를 넓혔다. 올해 6월 시작한 퇴직연금 적립금은 6월 말 649억원에서 9월 말 1882억원으로 늘었고, 이 가운데 IRP가 1626억원으로 86.4%를 차지하며 IRP 적립금의 약 75%는 타 금융회사에서 이전해 온 자금이다. 반면 국내주식 리테일 점유율은 지난해 3분기 27%에서 올해 3분기 25%로 하락했고 전산장애로 온라인 거래 안정성도 도마에 올랐다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스웨이", "published": "2026-11-20", "url": "https://www.newsway.co.kr/news/view?ud=2026111915253277631", "related": []}, {"id": "89c5f6bb026b", "title": "퇴직금까지 합치면…퇴직급여 규모, 이르면 2039년 국민연금 기금 추월", "summary": "국회예산정책처 분석에 따르면 사내 퇴직금 추정액을 퇴직연금 적립금에 더하면 국내 퇴직급여 규모가 이르면 2039년 국민연금 기금을 넘어서며, 이는 퇴직연금 적립금만 비교한 2050년보다 11년 빠르다. 지난해 퇴직금 제도를 적용받는 18~59세 근로자는 459만명으로 추산됐고, 2024년 퇴직연금 도입률은 26.5%, 5인 미만 사업장은 10.6%였다. 정부는 근로자퇴직급여보장법 개정안이 연내 통과되면 2028년 100인 이상, {"title": "[퇴직연금 긴급점검] 6년 반 만에 적립금 감소…9월말 기준 3개월만에 11.7조 줄어", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202611181327078600627"}]}, {"id": "b7e8a161b6af", "title": "2028년부터 퇴직급여 사외적립 의무화… 체불 막는다", "summary": "근로자의 퇴직금 체불을 막기 위해 내후년부터 100인 이상 사업장을 대상으로 퇴직급여 사외 적립을 단계적으로 의무화하는 방안이 추진된다. 이형일 부총리 겸 재정경제부 장관과 배경훈 부총리 겸 과학기술정보통신부 장관은 28일 경제관계장관회의·과학기술관계장관회의 첫 연석회의에서 이 방안을 논의했으며, 기금형 퇴직연금의 구체적 도입 방안도 마련해 전문적인 자산 운용과 엄격한 수탁자 책임을 부과하기로 했다. 퇴직연금 사업자 평가 기준은 연금 성과 수익률 중심으로 개편하고, 디폴트옵션 적용 예정 통보 시점은 만기 후 4주에서 만기 전 2주로 앞당긴다. 구체적인 퇴직연금 기능 강화 방안은 29일 국회 기후에너지환경노동위원회 여당 위원과의 당정협의를 거쳐 발표된다.", "category": "제도·규제", "importance": 5, "source": "서울신문", "published": "2026-10-29", "url": "https://www.seoul.co.kr/news/economy/2026/10/29/20261029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "540조 퇴직연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936461/2"}, {"title": "퇴직연금, 전문가가 대신 굴린다…'기금형' 도입, 국민연금 참여는 미정", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6335473"}, {"title": "정부, 퇴직연금 기금형 활성화…IRP 위험자산 투자한도 상향 추진", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4441777"}, {"title": "\"퇴직금 못 받는 일 줄인다\", 사외적립 전 사업장 확대 추진", "source": "데일리환경", "url": "https://www.dailyt.co.kr/newsView/dlt202611040003"}, {"title": "기업 퇴직연금 모아 전문기관이 굴려… ‘쥐꼬리 수익’ 개선 기대", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936451/2"}, {"title": "국민연금, 기금형 퇴직연금 참여 미정···‘시장 개입 우려’에 국회로 공 넘긴 정부", "source": "경향신문", "url": "https://www.khan.co.kr/article/202610300600041"}, {"title": "[퇴직연금 개편] 퇴직연금도 국민연금처럼…정부, 장기 연금 수령 유도 방안 발표", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=620807"}, {"title": "퇴직연금 사외적립 2030년까지 전 사업장 의무화", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237470"}, {"title": "당정, ‘퇴직연금 강화·고용부 예산’ 살핀다…초광역특구법 논의 가능성", "source": "디지털타임스", "url": "https://www.dt.co.kr/article/12091950"}]}, {"id": "fd9e49abb205", "title": "한국투자증권, 퇴직연금 운용의 우위를 실증하다... 3년간 수익률 100% 돌파", "summary": "고용노동부의 9월 말 기준 공시에서 한국투자증권 디폴트옵션 적극투자형 BF1의 3년 누적 수익률이 100.97%로 전체 퇴직연금사업자 포트폴리오 가운데 가장 높았다. 이는 적극투자형 평균 57.58%를 43.39%포인트 웃돌며, 업권별 평균은 증권 61.45%, 은행 55.76%, 보험 55.03%였다. 핵심 전략은 한국투자신탁운용과 협업한 MySuper 알아서 성장형 펀드로 글로벌 우량주와 부동산·인프라·물가연동채권 등 대체자산에 분산투자한다. 3분기 말 DC·IRP 합산 적립금은 18조5160억원으로 지난해 말보다 5조7292억원(44.8%) 늘었다.", "category": "업계·경쟁사", "importance": 4, "source": "리버티코리아포스트", "published": "2026-11-05", "url": "http://www.lkp.news/news/articleView.html?idxno=85780", "related": [{"title": "한투증권, 디폴트옵션 3년 누적 수익률 100.97%…전 사업자 1위", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261104_0003853884"}, {"title": "퇴직연금 3년 새 '두 배' 불렸다…한국투자증권, 디폴트옵션 수익률 전체 1위 달성", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "5dd7e8508fc5", "title": "하나은행, 호남권 첫 시니어 특화 금융라운지 광주에 개점", "summary": "하나은행은 지난 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 금융공간인 '하나더넥스트 광주금융 라운지'를 개점했다. 라운지는 은퇴설계, 상속·증여, 유언대용신탁 상담과 건강관리·문화·주거 등 라이프케어 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산, 예상 지출을 분석하는 '평생소득설계' 상담을 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "38994a32152d", "title": "[DQN] 주식시장 약세에 삼성생명 적립금 규모 1위 재탈환…DC형 비보장 수익률 반토막 [2026년 3분기 퇴직연금 랭킹]", "summary": "금감원 통합연금포털 3분기 공시 분석 결과 삼성생명의 퇴직연금 적립금이 57조5486억원으로 2분기 1위였던 신한은행을 추월했다. 계열사 DB형 적립금이 7074억원 늘어난 반면 비계열사 DB형은 3586억원 감소했으며, 주식시장 하락으로 원리금보장형 선호가 커진 점도 영향을 미쳤다. 신한라이프 DC형 원리금비보장 수익률은 2분기 111.17%에서 3분기 59.71%로 떨어지는 등 DC·IRP 비보장형 수익률이 절반 가량 하락했다. IRP 원리금비보장 적립금은 94조6349억원에서 87조6398억원으로 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-11-08", "url": "https://www.fntimes.com/html/view.php?ud=2026110716081563428a55064dd1_18", "related": [{"title": "퇴직연금 판도 재역전…삼성생명 반년 만에 선두 탈환", "source": "아시아타임즈", "url": "https://www.asiatime.co.kr/article/20261020500369"}]}, {"id": "545a1b2bec51", "title": "기금형 연금 도입에…금융지주 계열사 합종연횡 채비", "summary": "기금형 퇴직연금 추진이 공식화되면서 주요 금융지주들이 은행을 중심으로 계열사를 동원한 수탁법인 컨소시엄 설립 준비에 돌입했다. 고용노동부는 오는 6일 주요 은행장들을 소집해 기금형 퇴직연금 간담회를 열며, 법 개정 과정에서 금융지주 자회사 공동출자를 허용하는 예외를 마련할 계획이다. NH농협금융은 퇴직연금 제도 개편 대응 TF를, KB금융과 우리금융은 계열사 워킹그룹을 운영하고 있으며 신한금융도 정식 TF를 발족할 예정이다. 5대 금융지주 DC·IRP 적립액은 174조1435억원으로 작년말 대비 15.5% 늘었고, 증권 계열사 비중은 11.2%에서 13.2%로 상승했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-11-03", "url": "https://www.mt.co.kr/finance/2026/11/03/2026110216011686926", "related": [{"title": "기금형 퇴직연금 도입 초읽기… 원팀 꾸리는 금융지주 계열사", "source": "머니투데이", "url": "https://www.mt.co.kr/finance/2026/11/04/2026110319393765961"}]}, {"id": "113078a9f394", "title": "퇴직연금 ‘100% 투자 가능’의 함정…원금까지 보장하진 않아", "summary": "금융감독원은 내년 1월부터 퇴직연금 매매화면과 상품검색 화면에 투자한도와 위험등급을 함께 표시하도록 개선한다고 27일 밝혔으며, 상품제안서와 적립금운용현황보고서에도 위험등급을 병기한다. 일부 사업자가 원금손실 가능성이 있는 상품도 '투자한도 100%'로만 안내해 가입자가 원리금보장형으로 오인할 수 있다는 판단에서다. 올해 상반기 말 퇴직연금 적립금 558조3000억원 가운데 실적배당형은 198조원이고, 이 중 ETF 투자 규모는 99조8000억원으로 50.4%를 차지했다. 일부 사업자는 전산개발 일정에 따라 내년 상반기 중 시행한다.", "category": "제도·규제", "importance": 4, "source": "메트로신문", "published": "2026-10-27", "url": "https://www.metroseoul.co.kr/article/20261027500104", "related": [{"title": "“퇴직연금 다 날릴 수도”…ETF 투자한도 100%의 함정 [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8699397&ref=A"}]}, {"id": "133e90c36463", "title": "“원리금 보장만” “위험자산 반 이상”…퇴직연금 가입자 돈 굴리기 양극화", "summary": "금융감독원에 따르면 퇴직연금 적립금은 2023년 말 382조원에서 올해 6월 말 558조원으로 늘었다. 가입자의 64.5%는 적립금 전액을 원리금 보장형에 두고 있고, 33.9%는 절반 이상을 위험자산에 투자했으며, 분산 투자로 균형을 맞춘 경우는 1.6%에 그쳤다. 실적배당형 비중은 2023년 12.8%에서 올해 6월 말 35.5%로 약 2.8배 늘었고 그중 50.4%가 ETF에 투자됐다. 금감원은 11월 3일 장기·분산 투자를 돕는 '퇴직연금 가이드북'을 발간했으며, 디폴트옵션도 대부분 원리금 보장형에 머물러 있다고 밝혔다.", "category": "운용·상품", "importance": 3, "source": "서울신문", "published": "2026-11-17", "url": "https://www.seoul.co.kr/news/economy/finance/2026/11/17/20261117031002", "related": [{"title": "같은 퇴직금, 20년 뒤엔 1억6천 차이…50대 여유 있다면 ‘보증형 보험’이 대안", "source": "경향신문", "url": "https://www.khan.co.kr/article/202611170600051"}, {"title": "김 과장·박 과장, 연금 똑같이 1000만 원씩 냈는데...20년 뒤 계좌 잔고 '충격'", "source": "파이낸셜뉴스", "url": "https://www.fnnews.com/news/202611161529480756"}, {"title": "퇴직연금 적립금 558조 넘겨…DC 전환 1년만 118% 증가", "source": "SBS Biz", "url": "https://biz.sbs.co.kr/article_hub/20000346629"}]}, {"id": "b1c24b848e68", "title": "줄어든 거래대금에 증권가는 ‘MTS’ 전쟁…AI·배당·연금으로 고객 자산 잡는다", "summary": "증시 조정으로 거래가 위축되자 증권사들이 MTS에 AI 투자정보, 배당 정보, 퇴직연금 ETF 적립식 매수 기능 등을 더하고 있다. 하나증권은 이달부터 DC·IRP 계좌에서 ETF·ETN·리츠를 정기 매수하는 서비스를 개시하며, 3분기 기준 DC·IRP 시장점유율 1위를 달성했다. 3분기 국내 주식시장 일평균 거래대금은 52조4000억원으로 전 분기 대비 41.7% 감소해 증권사 위탁수수료 수익이 크게 줄었다.", "category": "업계·경쟁사", "importance": 3, "source": "조선비즈", "published": "2026-11-09", "url": "https://biz.chosun.com/stock/stock_general/2026/11/09/FUNYZOZV2JH4FLZ7BJYY4STMYI/", "related": [{"title": "줄어든 증시 거래대금에 증권가는 ‘MTS 전쟁’", "source": "조선일보", "url": "https://www.chosun.com/economy/stock-finance/2026/11/10/IKPQK3UVDJG2HEUOQJK5EO4OFM/"}]}, {"id": "ea0a4daeeaf0", "title": "소득 여유 있는 가구가 연금도 먼저 받는다…취약가구와 수급 격차", "summary": "한국보건사회연구원 보고서에 따르면 정년 이후 공적연금 수급 전까지의 소득공백기에 경제적 여력이 있는 가구일수록 연금 수급률이 높았다. 정년 전 중위소득 100% 이상을 유지하거나 늘린 가구의 공적연금 조기 수급률은 26.5%, 소득이 절반 미만으로 줄어든 취약가구는 18.1%였다. 월평균 공적연금 수급액은 소득 유지 가구가 191만8000원, 취약가구가 52만7000원으로 3.6배 이상 차이가 났다. 보고서는 필요한 금액만큼 연금을 나눠 받는 '부분연금제' 도입과 건강보험료·기초연금 등과의 연계 구조 정비를 제언했다.", "category": "가입자·사회", "importance": 3, "source": "메디컬투데이", "published": "2026-11-10", "url": "https://www.mdtoday.co.kr/news/articleView.html?idxno=623884", "related": [{"title": "“노후 소득공백 버티려 연금 당겼는데”…취약층보다 여유 있는 가구가 더 받았다", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10929855?ref=naver"}]}, {"id": "52bb3ea27011", "title": "국민연금 10년 부은 평균소득자, 기초연금보다 덜 받는다…‘급여 역전’", "summary": "국민연금연구원 김형수 부연구위원의 보고서에 따르면 소득대체율 43%를 적용할 때 평균소득자가 최소가입기간 10년을 채운 월 연금액은 A값의 10.75%로, 올해 기초연금 기준연금액(A값의 약 10.95%)보다 낮다. 올해 A값 319만3511원을 넣으면 국민연금은 월 약 34만3300원으로 기준연금액 34만9700원보다 6400원가량 적다. 보고서는 국민연금 최소가입기간을 상향하거나 기초연금 기준연금액 수준을 조정하는 방향이 필요하다고 제시했다. 최소가입기간을 15년으로 높여도 59세 말 기준 미달 비율은 1.6%로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-04", "url": "https://www.segye.com/newsView/20261103517557", "related": [{"title": "국민연금 10년 부었는데 기초연금보다 적다…월 6400원 역전", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=500742"}]}, {"id": "f82595e9660f", "title": "\"1년 미만·초단기 근로자도 퇴직금\"…정부 실태조사 착수", "summary": "정부가 1년 미만 근속자와 주 15시간 미만 초단시간 근로자에게도 퇴직급여를 지급하는 방안을 검토한다. 29일 발표된 퇴직연금 기능강화 방안에 따라 한국노동연구원이 이들의 퇴직급여 운영 실태와 의무화에 따른 사용자 부담·노동시장 영향을 분석한다. 지난해 주 1~14시간 일한 취업자는 177만9000명으로 전체 취업자의 6.2%였고 관련 통계 작성 이후 가장 많았다. DC형 법정 최소 사용자 부담금이 연간 임금총액의 12분의 1인 만큼 영세 사업장의 채용 위축 우려도 제기된다.", "category": "제도·규제", "importance": 3, "source": "한국경제", "published": "2026-10-30", "url": "https://www.hankyung.com/article/202610294697i", "related": [{"title": "퇴직연금 의무화에도…1년 미만·초단시간 노동자 사각지대 남아", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261029010010231"}]}, {"id": "8e47b4aaf910", "title": "다음주 금융당국 일정", "summary": "금융위원회와 금융감독원의 11월 23일부터 27일까지 주간 일정이다. 25일(수) 12시 금감원은 환매중단펀드를 보유한 퇴직연금 계좌도 실물이전이 가능해진다는 내용을 발표한다. 같은 주에는 1~9월 보험회사 경영실적, 1~3분기 국내은행 영업실적, 보험업법 시행령 개정안 입법예고 등도 예정돼 있다.", "category": "제도·규제", "importance": 2, "source": "이데일리", "published": "2026-11-21", "url": "https://www.edaily.co.kr/News/Read?newsId=01259526645648016&mediaCodeNo=257", "related": [{"title": "다음주 금융당국 일정", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=01626886645616200&mediaCodeNo=257"}]}, {"id": "d3317e03935a", "title": "한투증권, 유튜브 '한국인의 연금'서 매주 화요일 시황 라이브", "summary": "한국투자증권이 퇴직연금 유튜브 채널 '한국인의 연금'에서 매주 화요일 오후 5시 정기 라이브 시황 세미나를 진행한다. 주식 시황뿐 아니라 DC·IRP와 개인연금 계좌에 맞춘 장기 자산배분 전략을 다루며, 위험자산 편입 한도 70% 기준의 포트폴리오 조정과 TDF·채권·배당형 자산 활용법을 설명한다. 실시간 채팅과 전문가 Q&A로 연금 제도, 절세, 수령·인출 전략 질문에 답하고 시청은 무료다. 최종진 연금혁신본부장은 연금 자산 성격에 맞는 객관적 시장 진단과 주기적 리밸런싱이 노후 자산의 성패를 결정한다고 말했다.", "category": "업계·경쟁사", "importance": 2, "source": "아시아경제", "published": "2026-11-17", "url": "https://view.asiae.co.kr/article/2026111709111366247", "related": [{"title": "한국투자증권, 퇴직연금 유튜브 '한국인의 연금'서 매주 화요일 라이브 시황 세미나 진행", "source": "한국경제", "url": "https://www.hankyung.com/article/202611185427O"}]}, {"id": "fa231637c697", "title": "KB자산운용, 美 초대형주·만기매칭형 회사채 ETF 동시 상장", "summary": "KB자산운용이 18일 RISE 미국초대형주TOP10 ETF와 RISE 27-11 회사채(AA-이상)액티브 ETF를 동시에 상장한다. 미국초대형주TOP10은 NYSE·나스닥 상장 시가총액 상위 10개 종목에 투자하며 총보수는 연 0.30%다. 27-11 회사채 ETF는 2027년 10~12월 만기 AA- 이상 회사채에 투자하는 만기매칭형으로 예상 만기수익률은 세전 연 4.13%, 총보수는 연 0.05%다. 회사채 ETF는 DC·IRP 계좌에서 적립금의 100%까지 편입할 수 있다.", "category": "운용·상품", "importance": 2, "source": "파이낸셜포스트", "published": "2026-11-18", "url": "https://www.financialpost.co.kr/news/articleView.html?idxno=301568", "related": [{"title": "KB운용, 美 초대형주 ETF·우량 회사채 ETF 동시 상장", "source": "글로벌이코노믹", "url": "https://www.g-enews.com/view.php?ud=202611170832545593153ddfb15a_1"}]}, {"id": "c2ef78aa9c37", "title": "삼성생명, 퇴직연금 부가서비스 앱 'SSUM 라운지' 개편", "summary": "삼성생명이 퇴직연금 가입자 전용 부가서비스 앱 'SSUM 라운지'를 전면 개편했다고 24일 밝혔다. 새로 마련된 '퇴직연금정보'에는 시장 지표를 보여주는 '투데이브리핑'과 '연금 첫걸음', '투자 인사이트', '투자 가이드북', '연금 클래스' 등 콘텐츠가 담겼다. '연금 클래스'는 매월 한 차례 온라인 세미나로 삼성생명 퇴직연금 전문가와 삼성자산운용이 제도·상품과 시장 전망을 소개한다. 서비스는 삼성생명 퇴직연금(DB·DC·IRP) 가입자라면 누구나 무료로 이용할 수 있다.", "category": "업계·경쟁사", "importance": 2, "source": "비즈월드", "published": "2026-10-25", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149782", "related": [{"title": "삼성생명, 퇴직연금 앱 ‘SSUM 라운지’ 개편…투자정보 강화", "source": "메가경제", "url": "https://www.megaeconomy.co.kr/news/newsview.php?ncode=1065569724632297"}]}, {"id": "79701632bbb8", "title": "하나금융, 3분기 누적 순익 3조6243억원…9490억원 자사주 매입·소각 '역대 최대'", "summary": "하나금융그룹의 올해 3분기 누적 연결당기순이익은 3조6243억원으로 전년 동기 대비 5.6% 증가했고, 누적 수수료이익은 2조1428억원으로 29.8% 늘었다. 하나은행의 3분기 누적 수수료이익은 8740억원으로 전년 동기 대비 11.5% 늘며 3분기 누적 기준 역대 최대치를 기록했다. 퇴직연금과 방카슈랑스 등 수수료 수익 확대와 외환 관련 이익 증가가 은행 실적을 뒷받침했다. 하나금융은 연간 자사주 매입·소각 규모를 역대 최대인 9490억원으로 확대하기로 했다.", "category": "업계·경쟁사", "importance": 2, "source": "메트로신문", "published": "2026-10-25", "url": "http://www.metroseoul.co.kr/article/20261023500216", "related": [{"title": "하나금융, 3분기 누적 순이익 3조6243억원…자사주 매입·소각 역대 최대", "source": "월요신문", "url": "https://www.wolyo.co.kr/news/articleView.html?idxno=319524"}]}, {"id": "b563037cbe03", "title": "보험산업 성장률 내년 3.5%로 ‘반토막’…수익·자본의 질도 경고등", "summary": "보험연구원이 22일 '2027년 보험산업 전망과 과제' 세미나에서 내년 보험산업 전체 수입·원수보험료 증가율을 3.5%로 전망했다. 올해 예상 증가율 8.0%보다 4.5%p 낮은 수준이며, 전체 보험료 규모는 올해 289조원에서 내년 299조원으로 늘어날 것으로 예상됐다. 생명보험 수입보험료 증가율은 올해 8.8%에서 내년 2.3%로 하락하고, 퇴직연금도 올해 급증에 따른 기저효과로 3.6% 줄어들 것으로 예상됐다. 퇴직연금을 제외하면 생명보험과 손해보험의 성장률은 각각 4.0%, 5.0%로 전망된다.", "category": "업계·경쟁사", "importance": 2, "source": "서울경제TV", "published": "2026-10-24", "url": "https://w c.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "38994a32152d", "title": "[DQN] 주식시장 약세에 삼성생명 적립금 규모 1위 재탈환…DC형 비보장 수익률 반토막 [2026년 3분기 퇴직연금 랭킹]", "summary": "금감원 통합연금포털 3분기 공시 분석 결과 삼성생명의 퇴직연금 적립금이 57조5486억원으로 2분기 1위였던 신한은행을 추월했다. 계열사 DB형 적립금이 7074억원 늘어난 반면 비계열사 DB형은 3586억원 감소했으며, 주식시장 하락으로 원리금보장형 선호가 커진 점도 영향을 미쳤다. 신한라이프 DC형 원리금비보장 수익률은 2분기 111.17%에서 3분기 59.71%로 떨어지는 등 DC·IRP 비보장형 수익률이 절반 가량 하락했다. IRP 원리금비보장 적립금은 94조6349억원에서 87조6398억원으로 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-11-08", "url": "https://www.fntimes.com/html/view.php?ud=2026110716081563428a55064dd1_18", "related": [{"title": "퇴직연금 판도 재역전…삼성생명 반년 만에 선두 탈환", "source": "아시아타임즈", "url": "https://www.asiatime.co.kr/article/20261020500369"}, {"title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "source": "세이프타임즈", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652"}, {"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "b7e8a161b6af", "title": "2028년부터 퇴직급여 사외적립 의무화… 체불 막는다", "summary": "근로자의 퇴직금 체불을 막기 위해 내후년부터 100인 이상 사업장을 대상으로 퇴직급여 사외 적립을 단계적으로 의무화하는 방안이 추진된다. 이형일 부총리 겸 재정경제부 장관과 배경훈 부총리 겸 과학기술정보통신부 장관은 28일 경제관계장관회의·과학기술관계장관회의 첫 연석회의에서 이 방안을 논의했으며, 기금형 퇴직연금의 구체적 도입 방안도 마련해 전문적인 자산 운용과 엄격한 수탁자 책임을 부과하기로 했다. 퇴직연금 사업자 평가 기준은 연금 성과 수익률 중심으로 개편하고, 디폴트옵션 적용 예정 통보 시점은 만기 후 4주에서 만기 전 2주로 앞당긴다. 구체적인 퇴직연금 기능 강화 방안은 29일 국회 기후에너지환경노동위원회 여당 위원과의 당정협의를 거쳐 발표된다.", "category": "제도·규제", "importance": 5, "source": "서울신문", "published": "2026-10-29", "url": "https://www.seoul.co.kr/news/economy/2026/10/29/20261029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "540조 퇴직연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936461/2"}, {"title": "퇴직연금, 전문가가 대신 굴린다…'기금형' 도입, 국민연금 참여는 미정", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6335473"}, {"title": "정부, 퇴직연금 기금형 활성화…IRP 위험자산 투자한도 상향 추진", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4441777"}, {"title": "\"퇴직금 못 받는 일 줄인다\", 사외적립 전 사업장 확대 추진", "source": "데일리환경", "url": "https://www.dailyt.co.kr/newsView/dlt202611040003"}, {"title": "기업 퇴직연금 모아 전문기관이 굴려… ‘쥐꼬리 수익’ 개선 기대", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936451/2"}, {"title": "국민연금, 기금형 퇴직연금 참여 미정···‘시장 개입 우려’에 국회로 공 넘긴 정부", "sou d": "2026-11-05", "url": "http://www.lkp.news/news/articleView.html?idxno=85780", "related": [{"title": "한투증권, 디폴트옵션 3년 누적 수익률 100.97%…전 사업자 1위", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261104_0003853884"}, {"title": "퇴직연금 3년 새 '두 배' 불렸다…한국투자증권, 디폴트옵션 수익률 전체 1위 달성", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 (function () {

    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로

  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '

  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
