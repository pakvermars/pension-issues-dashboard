  /* ── 팔레트 ───────────────────────────────────────────────

     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나.

     키움 두 색은 kiwoomam.com 로고의 구조를 그대로 옮긴 것이다.
     글자는 감청, 포인트 마크만 마젠타. 그래서 맨 위 줄은 감청이고
     마젠타는 슬로건 한 줄에만 쓴다. 둘을 같은 넓이로 쓰면 서로 죽는다. */
  :root {
    --ink: #101C33;
    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom-deep: #1A399E;
    --kiwoom-point: #EC008C;

    --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',
               'Malgun Gothic', system-ui, sans-serif;
    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {

      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 감청 원색은 어두운 종이에서 1.9:1까지 떨어져 줄이 보이지 않는다.
         마젠타도 한 단계 올려 짝을 맞춘다. 각각 6.2:1, 6.6:1. */
      --kiwoom-deep: #6E92F5;
      --kiwoom-point: #FF5FB4;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야
     구분선이 아니라 종이의 테두리로 읽힌다. */
  .topline { height: 4px; background: var(--kiwoom-deep); }

  /* 수집이 멈춰도 index.html은 그대로 남아 아무 일 없어 보인다. 그래서
     보는 사람의 시계와 비교해 묵은 정도를 화면에서 직접 말한다.
     2026-10-15에 엿새를 멈췄는데 아무도 몰랐던 것이 이 띠를 만든 이유다. */
  .stale {
    padding: 10px 20px;
    background: var(--hot);
    color: var(--paper);
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
  }

  .stale[hidden] { display: none; }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;
  }

  .slogan {
    margin: 0 0 0 auto;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom-point);
    white-space: nowrap;
  }

  .hero-date {
    font-family: var(--font-num);
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .search input {
    width: 230px;
    max-width: 44vw;
    padding: 4px 0;
    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */
  .group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;
  }

  .rail button {
    flex: 1 1 0;
    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .range {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  /* ── 분야 필터 ─────────────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
  }

  .filters button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */
  .notice {
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */
  .list { margin: 8px 0 0; }

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);
  }

  article[data-cat="2"] .badge { color: var(--cat-2); }
  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

  details summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

  <p class="footer" id="footer"></p>

연금에 적합하다고 판단될 경우가 거의 없을 것이라고 밝혔다. 퇴직연금협의회(PSCA)에 따르면 지난해 기준 ESG 펀드를 제공하는 401k 상품은 5%, 전체 401k 투자 자산 중 ESG 펀드 비중은 1% 수준이다. 모건스탠리에 따르면 올해 상반기 ESG 펀드 평균 수익률은 4.9%로 일반 펀드(4%)보다 높았다.", "category": "제도·규제", "importance": 2, "source": "매일경제", "published": "2026-11-25", "url": "https://www.mk.co.kr/article/12217649"}, {"id": "8e0dd7c67074", "title": "잠재성장률 3% 도전·양극화 해소…내년 '모두의 성장'에 방점", "summary": "이형일 부총리 겸 재정경제부 장관이 24일 국무회의에서 ‘2027년 경제정책방향 주요 골자안’을 보고했다. 정부는 민생 안정, 성장동력 확충, 글로벌 경쟁력 강화 등 3대 정책방향에 역량을 집중하고 다음달 일자리·주거·서민금융 등 3대 민생 프로젝트를 발표한다. 주요 과제에는 우리아이자립펀드 출시와 기금형 퇴직연금 활성화 검토, 장기투자 촉진 등이 포함됐다.", "category": "제도·규제", "importance": 2, "source": "머니투데이", "published": "2026-11-25", "url": "https://www.mt.co.kr/economy/2026/11/25/2026112411002763993"}, {"id": "7acccce1e1b9", "title": "[이코노 브리핑] 하나銀, 방산 수출망 생산적 금융 확대 외", "summary": "KB국민은행이 27일 기업형 퇴직연금(DB·표준형DC·기업형IRP) 수수료 체계를 개편해 표준형 DC 적립금 50억원 미만 구간 운용관리 수수료율을 연 0.14~0.19%에서 0.10%로 일괄 인하한다. DB형은 평균잔액 300억원 이상 500억원 미만 구간 수수료율을 연 0.22%에서 0.15%로 낮춘다. 케이뱅크는 1년 연 3.89%, 2년 연 3.70%, 3년 연 3.80%의 금리를 주는 DB 퇴직연금 전용 정기예금을 출시했다.", "category": "업계·경쟁사", "importance": 2, "source": "세계일보", "published": "2026-11-25", "url": "https://www.segye.com/newsView/20261124516145"}, {"id": "40a1abe495df", "title": "보험사 3분기 누적순익 10.4조…손보 ‘웃고’ 생보 ‘울고’", "summary": "금융감독원에 따르면 올해 1~9월 보험사 당기순이익은 10조4087억원으로 전년 동기 대비 7.8% 감소했다. 생보사 순이익은 19.5% 줄었고 손보사는 0.9% 늘었다. 같은 기간 수입보험료는 212조325억원으로 15.6% 증가했으며, 퇴직연금 수입보험료는 생보사에서 35.9%, 손보사에서 51.7% 늘었다.", "category": "업계·경쟁사", "importance": 2, "source": "디지털타임스", "published": "2026-11-25", "url": "https://www.dt.co.kr/article/12097066"}, {"id": "6058e05441e2", "title": "신한은행, 간판이 달라졌다…'자산관리 전문은행' 내건 이유", "summary": "신한은행이 올해부터 영업점 간판에 '자산관리 전문은행'이라는 문구를 도입하고 자산 형성과 은퇴 준비, 투자관리를 결합한 자산관리 서비스를 강화하고 있다. 신한금융그룹 3분기 팩트북에 따르면 신한은행의 3분기 누적 신탁계정 수수료는 2716억 원으로 지난해 같은 기간 1363억 원보다 99.3% 증가했다. 신탁계정 잔액은 77조500억 원에서 89조9670억 원으로 1년 새 12조9170억 원(16.8%) 늘었다. 신한은행은 퇴직연금과 은퇴 준비 분야에서 일대일 연금컨설팅을 강화하고 퇴직연금 투자상품과 자산배분 관련 서비스도 확충했다.", "category": "업계·경쟁사", "importance": 2, "source": "이코노미사이언스", "published": "2026-11-25", "url": "https://www.e-science.co.kr/news/articleView.html?idxno=140448"}, {"id": "c9f7d6e868e4", "title": "ETF 100조 증발에 '테마주 피로감'…채권 섞어 돌파구 찾는 운용사", "summary": "국내 ETF 시장 순자산은 지난 18일 기준 395조9644억원으로 6월 말 512조4080억원보다 116조원 이상 줄었고, 같은 기간 주식형은 약 28% 감소한 반면 채권형은 17% 이상 늘었다. 올해 하반기 새로 상장한 주식·채권 혼합형 ETF는 19일 기준 14종으로 상반기 11종을 넘어섰다. DC형 퇴직연금과 IRP는 위험자산 비중이 70%로 제한되지만 요건을 갖춘 채권혼합형 ETF는 100%까지 편입할 수 있어 퇴직연금 시장이 주요 수요처로 꼽힌다. 다만 삼성전자·SK하이닉스 채권혼합형 ETF 4종의 최대낙폭 중앙값이 24.9%에 달해 하락장 방어력에는 한계가 있다는 지적이다.", "category": "운용·상품", "importance": 2, "source": "인베스트조선", "published": "2026-11-25", "url": "https://www.investchosun.com/site/data/html_dir/2026/11/24/2026112480160.html"}, {"id": "c51bcc3cd8d0", "title": "‘노동 대가ㆍ노후 보장’ 함께잡는 퇴직연금[정책발언대]", "summary": "권창준 고용노동부 차관이 지난달 29일 발표된 ‘퇴직연금 기능 강화 방안’의 취지를 설명한 기고다. 지난해 임금체불액의 41.1%인 8229억원이 퇴직금이었다며, 근로자퇴직급여 보장법 개정을 전제로 2028년부터 사업장 규모에 따라 사외적립을 순차 의무화하고 내년 예산안에 122억원을 반영했다고 밝혔다. 기금형 퇴직연금 수탁법인에는 이해충돌 관리와 위험관리 책임을 지우고, 정부가 기금 성과를 종합 평가해 공개하겠다고 했다.", "category": "제도·규제", "importance": 1, "source": "이투데이", "published": "2026-11-25", "url": "https://www.etoday.co.kr/news/view/2652118"}, {"id": "3dcb2f99aa17", "title": "반쪽짜리 사외적립 의무화, '장부 속 퇴직금' 어쩌나", "summary": "장선필 연금연구소 대표가 퇴직급여 사외적립 의무화가 시행 이후 근속기간부터 적용돼 과거 퇴직금은 소급 적립되지 않는 점을 지적한 칼럼이다. 올해 상반기 임금체불액의 74.2%가 30인 미만 사업장에서 발생했고, 퇴직연금 도입률은 전체 사업장 26.5%, 5인 미만 사업장 10.6%에 그친다고 짚었다. 과거분을 5~10년에 걸쳐 분할 적립하는 사업장에 부담금 지원과 세제 혜택을 주고, 지원 대상을 푸른씨앗 가입 여부와 상관없이 넓혀야 한다고 제안했다.", "category": "제도·규제", "importance": 1, "source": "뉴스퀘스트", "published": "2026-11-25", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=305687"}, {"id": "0f3a731e3c65", "title": "[기고] 국민연금 고갈에 대한 청년층의 오해 풀기(3)", "summary": "장재혁 전 국민연금공단 기획이사가 국민연금 182조원 손실 주장이 특정 기간만 잘라낸 과장이라고 반박한 기고다. 국민연금은 지난해 말 대비 8월 말 현재 218조3000억원의 운용상 이익을 내 수익률 14.77%를 기록했고, 최근 3년 연평균 수익률은 16.05%다. 1988년 기금 설치 이후 2025년 말까지 연평균 수익률은 8.04%로 퇴직연금 수익률 2%대의 3배 이상이며, 올해 말 기금 적립금은 약 1650조원에 이를 전망이다.", "category": "가입자·사회", "importance": 1, "source": "뉴스핌", "published": "2026-11-25", "url": "https://www.newspim.com/news/view/20261124001233"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-11-18 ~ 2026-11-24", "generated_at": "2026-11-25T07:38:48+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "7b0e43c939f4", "title": "KB국민은행, 기업 퇴직연금 수수료 최대 0.20%p 인하", "summary": "KB국민은행이 27일부터 확정급여형(DB)과 표준형 확정기여형(DC), 기업형 개인형퇴직연금(IRP)의 수수료 체계를 개편해 수수료율을 최대 0.20%p 인하한다. 표준형 DC의 적립금 50억원 미만 구간 운용관리수수료율은 연 0.14~0.19%에서 연 0.10%로, DB형 500억원 이상 1000억원 미만 구간은 연 0.18%에서 0.07%로 낮춘다. 우대 대상에 신협·새마을금고 등 조합법인과 노인장기요양기관, 장애인활동지원기관, 아이돌봄서비스 제공기관을 추가하고 공공기관 대상 10% 할인 제도를 신설한다. DB형 집합투자증권(ETF 제외) 자산관리수수료 면제 기준도 전체 평균잔액의 70% 이상에서 50% 이상으로 완화한다.", "category": "업계·경쟁사", "importance": 4, "source": "프레스나인", "published": "2026-11-24", "url": "http://www.press9.kr/news/articleView.html?idxno=86883", "related": []}, {"id": "934ed8562ba9", "title": "키움證의 퇴직연금 “고객이 먼저 신청해요”", "summary": "키움증권이 올해 6월 퇴직연금 사업을 시작하며 선보인 ‘퇴직연금 도입요청’ 서비스에 680개 기업이 신청했다. 기업 담당자나 근로자가 MTS 영웅문S#으로 도입 상담을 요청하면 키움증권 담당자가 DB형·DC형·IRP 등 퇴직연금 전반을 안내하는 방식이다. 부산의 중소 물류업체가 임직원 신청을 계기로 사업자를 변경하는 등 영업망과 연고가 없는 지방 중소기업까지 고객으로 확보했다. 금감원 통합연금포털 기준 3분기 키움증권 퇴직연금 적립금은 DB형 150억 원, DC형 106억 원, IRP 1626억 원 등 총 1882억 원이다.", "category": "업계·경쟁사", "importance": 4, "source": "서울경제", "published": "2026-11-22", "url": "https://www.sedaily.com/article/20117431", "related": []}, {"id": "f39e4c1aef15", "title": "금감원 \"퇴직연금 단기실적 경쟁안돼…변칙 고금리 등 엄정대응\"", "summary": "서재완 금융감독원 부원장보는 19일 4대 금융협회와 퇴직연금 사업자 담당 임원 간담회에서 연말 변칙적 고금리와 이벤트성 특별이익 제공 등 불건전 영업행위에 엄정 대응하겠다고 밝혔다. DB형 원리금보장상품의 연말 만기 집중을 틈탄 특정 가입자 고금리 제공, 고수익 상품을 대기업 위주로 제시해 영세기업 가입비율이 10%를 밑돈 사례 등이 지적됐다. 금감원은 최근 5년간 통합연금포털 공시오류가 302건 발생했다며 내부 검증 체계 강화를 주문했다. 불건전 영업행위 모니터링을 강화하고 공시 제도 개선을 추진할 계획이다.", "category": "제도·규제", "importance": 4, "source": "보험매일", "published": "2026-11-20", "url": "http://www.fins.co.kr/news/articleView.html?idxno=110641", "related": []}, {"id": "b45aff8da79f", "title": "키움증권, 퇴직연금 5개월 만에 2000억 돌파…영웅문 고객이 이끈 IRP 성장 [퇴직연금 542조 대격변 5-①]", "summary": "키움증권의 퇴직연금 적립금이 올해 6월 사업 개시 후 약 5개월 만인 11월 2000억원을 넘어섰다. 적립금은 6월 말 649억원에서 9월 말 1882억원으로 약 2.9배가 됐고, 같은 기간 증권업권 전체 적립금은 전 분기 대비 2.88% 줄었다. 9월 말 IRP 적립금은 약 1626억원으로 전체의 86%가량이며, IRP 적립금의 약 75%가 타사 이전 자금이고 7월 기준 IRP 가입자의 96%가 기존 키움증권 고객이었다. 키움증권은 영웅문S#에서 ETF 실시간 매매·적립식 자동매수와 통합연금개시 서비스를 제공한다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-20", "url": "https://www.etoday.co.kr/news/view/2650202", "related": []}, {"id": "68273cee30dc", "title": "표영대 키움증권 연금플랫폼본부장 \"증권업권 퇴직연금 적립금 5위 진입 목표\" [퇴직연금 542조 대격변 5-②]", "summary": "표영대 키움증권 연금플랫폼본부장은 중장기적으로 증권업권 퇴직연금 적립금 기준 5위 진입을 목표로 한다고 밝혔다. IRP로 출발한 사업을 DB·DC 기업 퇴직연금으로 넓히는 것이 다음 과제이며, 근로자가 영웅문S#에서 키움증권을 사업자로 회사에 요청하는 '퇴직연금 도입요청'을 비대면 영업 통로로 활용한다. 기업 비용 부담을 낮추기 위해 DB와 DC 모두 첫해 운용관리·자산관리 수수료 전액을 면제하고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-20", "url": "https://www.etoday.co.kr/news/view/2650211", "related": []}, {"id": "47078a2852d9", "title": "퇴직연금 ‘장기 성적표 1위’ 하나증권⋯AI·연금닥터의 맞춤 처방 [퇴직연금 542조 대격변 4-①]", "summary": "금융감독원 퇴직연금 공시에 따르면 3분기 말 하나증권의 DC형 원리금 비보장상품 수익률은 5년 연 8.03%, 7년 연 8.88%, 10년 연 7.21%로 세 구간 모두 증권업계 1위다. 하나증권의 DC형 적립금은 지난해 말 2805억원에서 3분기 말 3828억원으로, IRP 적립금은 6429억원에서 8926억원으로 늘어 합산 1조2754억원으로 38.1% 증가했다. 하나증권은 9월 차세대 MTS '하나증권V'를 출시하고 AI 기반 'AI 연금프로' 서비스를 운영하고 있다. 전국 영업점에는 연금 전문 PB인 '연금닥터'를 배치해 고액자산가와 은퇴 예정 고객에게 컨설팅을 제공한다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-19", "url": "https://www.etoday.co.kr/news/view/2649799", "related": []}, {"id": "41cb778f8d14", "title": "증권가 연말 稅테크...절세계좌 황금률은?", "summary": "연말정산을 앞두고 연금저축·IRP·ISA를 정해진 순서대로 채우는 '절세계좌 황금률'이 세후 수익을 가른다는 조언이 나왔다. 키움증권은 계좌별 세금 비교에서 연 수익 약 833만원까지는 해외 직접투자, 833만~2000만원은 일반계좌 ETF, 2000만원 초과는 연금저축이 유리하다고 분석했다. 상의민 키움증권 연금플랫폼본부 과장은 2030세대에는 ISA를 먼저 채우고, 50대 이상에는 중개형 ISA를 먼저 채운 뒤 연금저축을 과세이연 계좌로 쓰라고 권했다. 다만 건보공단이 연 1500만원 이하 사적연금(연금저축·IRP) 등 분리과세 소득에 건보료를 부과하는 방안을 국감 업무자료에 과제로 올려 절세 효과가 줄 수 있다는 관측도 제기된다.", "category": "가입자·사회", "importance": 4, "source": "주간한국", "published": "2026-11-19", "url": "https://weekly.hankooki.com/news/articleView.html?idxno=7193728", "related": []}, {"id": "e78fa29534f1", "title": "‘국민연금, 기금형 퇴직연금 진출’ 제동", "summary": "국민의힘 김위상 의원이 16일 국민연금 등 공적연금 관리·운용기관이 퇴직연금제도를 설정·운영할 수 없도록 하는 근로자퇴직급여 보장법 개정안을 대표 발의했다. 국민연금의 기금형 퇴직연금 참여를 막는 법안이 국회에서 발의된 것은 처음이다. 김 의원은 공적연금이 장기 기금 고갈 위험을 안고 있고 사회보장적 성격과 재정 운영 원리가 퇴직연금과 근본적으로 달라 두 제도를 엄격히 분리해야 한다고 밝혔다. 고용노동부는 지난달 퇴직연금 기능 강화 방안에서 국민연금공단 참여를 보류하고 참여 방식과 범위는 국회 논의에 맡긴 상태다.", "category": "제도·규제", "importance": 4, "source": "세계일보", "published": "2026-11-18", "url": "https://www.segye.com/newsView/20261117515456?OutUrl=naver", "related": []}, {"id": "059d4973c5c1", "title": "디폴트옵션 1위 NH투자증권…장기수익률 앞세워 연금자산 20조 돌파 [퇴직연금 542조 대격변 3-①]", "summary": "NH투자증권의 퇴직연금 적립금은 2026년 9월 말 약 11조8000억원으로 2022년 말 약 5조원에서 최근 3년간 연평균 약 25% 성장했고, 6월에는 연금저축을 합친 연금자산이 20조원을 넘었다. DC·IRP 적립금은 9월 말 기준 전년 말 대비 2조1000억원(34%) 늘어 증가액 기준 전체 사업자 중 8위다. 9월 말 원리금비보장형 최근 3년 연환산 수익률은 DC 16.3%, IRP 15.1%이고, IRP 10년 수익률은 전체 사업자 중 1위다. 디폴트옵션 중립투자형 2호는 최근 1년과 3년 누적 수익률 모두 증권업권 1위이며 적극투자형 2호는 3년 누적 71%를 기록했다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-18", "url": "https://www.etoday.co.kr/news/view/2649332", "related": []}, {"id": "9a0c71d9781b", "title": "금감원, 과당경쟁 경고 열흘 만에 DB손보 퇴직연금 들여다본다", "summary": "금융감독원이 퇴직연금 과당경쟁 자제를 요청한 지 열흘 만에 DB손해보험에 대한 퇴직연금 수시검사를 16일부터 2주간 진행하고 있다. 검사는 디폴트옵션, DC형 사용자 부담금, DB형 재정검증 결과 통보 등 관리업무 전반을 대상으로 한다. DB손보는 2024년 가입자 3명의 퇴직급여 2,520만원을 잘못된 계좌로 지급하고 계약이전 요청 47건을 기한 내 처리하지 않아 과태료 7,400만원을 받은 바 있다. 실물이전 제도 시행 후 2026년 6월 말까지 15조8,699억원이 다른 사업자로 이동했고, 이 중 은행에서 증권사로 옮겨간 자금은 5조2,225억원(33%)이다.", "category": "제도·규제", "importance": 4, "source": "글로벌에픽", "published": "2026-11-18", "url": "https://www.globalepic.co.kr/view.php?ud=2026111808433519687cc35ccc5c_29", "related": []}, {"id": "b479ce15b6d3", "title": "반도체 폭락에도 퇴직연금은 '사자'···은행권, 223조원 사수 총력전", "summary": "3분기 말 5대 은행의 퇴직연금 적립금은 222조9427억원으로 2019년 집계 이후 처음 감소했고, 2024년 10월 실물이전 시행 이후 올해 6월 말까지 은행에서 증권사로 옮겨간 적립금은 5조2000억원이었다. 은행들은 자금 이탈을 막기 위해 ETF 매도 대금으로 같은 날 재투자할 수 있는 당일매매 서비스를 잇달아 도입하고 있다. 국민은행이 8월 20일 시중은행 최초로 도입했고 신한은행이 9월, 우리·하나은행이 이달 합류했으며 농협은행은 다음 달, IBK기업은행은 내년 1분기 시작할 예정이다. 국민은행은 시행 후 한 달간 증권사로 이동한 적립금이 지난해 12월 한 달보다 약 50% 줄었다고 밝혔으나, 은행은 여전히 실시간 거래가 안 되고 취급 상품도 약 300개로 증권사(약 900개)보다 적다.", "category": "업계·경쟁사", "importance": 3, "source": "스마트비즈", "published": "2026-11-23", "url": "https://www.smartbizn.com/news/articleView.html?idxno=160195", "related": [{"title": "은행 퇴직연금, '증권사 속도'로 바뀐다…ETF 당일매매 전산 개편 확산", "source": "전자신문", "url": "https://www.etnews.com/20261120000226"}]}, {"id": "1508f37d1a4c", "title": "같은 IRP인데… 가입방식 따라 10년 수수료 820만원 차이난다", "summary": "금융감독원이 '퇴직연금 가이드북'을 발간해 IRP 수수료 절감, 적립금 운용, 퇴직금 수령 방식에 따른 절세 사례를 소개했다. 2억6000만 원을 넣은 IRP 가입자가 대면으로 가입하면 10년간 수수료 820만 원을 냈지만 비대면 가입자는 수수료를 내지 않았다. 매년 1000만 원씩 20년간 납입한 두 사람의 최종 수령액은 운용 방식에 따라 4억2948만 원과 2억7220만 원으로 갈렸다. 퇴직금 5억 원을 일시금으로 받으면 실수령액이 4억5500만 원이지만 연금으로 받으면 수령액 합계가 6억4142만 원이 된다.", "category": "가입자·사회", "importance": 3, "source": "동아일보", "published": "2026-11-24", "url": "https://www.donga.com/news/Economy/article/all/20261123/135075673/2", "related": []}, {"id": "bedc5f67f1bc", "title": "부부가 함께 부은 연금, 사별하면 유족연금 70% 깎인다", "summary": "국회예산정책처에 따르면 본인 노령·장애연금과 유족연금 수급권이 겹친 사람이 2021년 12만3994명에서 지난해 20만8242명으로 67.9% 늘었다. 국민연금법 제56조에 따라 본인 연금을 고르면 유족연금의 30%만 더 받고, 유족연금을 고르면 본인 연금 지급이 전액 정지된다. 지난해 중복수급권자의 82%인 17만1547명은 본인 연금을, 18%인 3만6695명은 유족연금을 택했다. 예산정책처는 30% 수준이 낮다고 단정하기보다 선택 유형별 실제 급여수준을 분석할 필요가 있다고 지적했다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-24", "url": "https://www.segye.com/newsView/20261123510564", "related": []}, {"id": "483ad73d84f6", "title": "규제가 바꾼 TDF…국내 자산·AI 테마로 투자전략 다변화", "summary": "금융당국은 지난 4월 퇴직연금감독규정 시행세칙을 개정해 적격 TDF가 현금성 자산과 채무증권을 목표시점 이전 20% 이상, 이후 60% 이상 보유하도록 하고 특정 국가 주식·채권 투자를 각각 80% 이내로 제한했다. 지난해 말 TDF 순자산은 25조6000억원으로 95.3%가 연금 자금이었고, 미국 투자 비중은 평균 43.0%, 한국은 4.4%였다. 이후 KB자산운용 'KB 코리아포커스 적격TDF', 삼성자산운용 'KODEX 코리아TDF2065액티브 적격' 등 국내 자산 중심 상품이 나왔다. 한국투자신탁운용은 이달 글로벌 AI 밸류체인에 투자하는 적격 TDF를 출시했다.", "category": "운용·상품", "importance": 3, "source": "뉴스톱", "published": "2026-11-24", "url": "https://www.newstopkorea.com/ko-kr/articles/49253", "related": []}, {"id": "d5356e6325ea", "title": "\"물타기 자금마저 사라졌다\"…코스피 4700선 추락에 은행으로 몰리는 돈", "summary": "코스피가 23일 3.31% 하락한 4708.54에 마감한 가운데 5대 은행 정기예금 잔액은 19일 기준 1050조3092억원으로 10월 말보다 19조8212억원 늘었다. 5대 은행 퇴직연금 계좌의 ETF 순매수액은 6월 2조4365억원에서 7월 6024억원, 10월 2980억원으로 급감했고 이달 1~19일은 1564억원에 그쳤다. 같은 계좌의 ETF 매수액은 6월 6조7651억원에서 10월 1조6941억원으로 75% 줄었다. 은행권은 보유 상품을 대거 처분하기보다 신규 매수에 신중해진 흐름으로 풀이했다.", "category": "운용·상품", "importance": 3, "source": "뉴스1", "published": "2026-11-24", "url": "https://www.news1.kr/finance/bank/6363343", "related": []}, {"id": "6442c0b0d96c", "title": "송상은 KB증권 연금그룹장 “IRP 연 56% 성장…연금은 가입보다 관리가 중요”[퇴직연금 542조 대격변 7]", "summary": "송상은 KB증권 연금그룹장은 단기 자금 유치 경쟁보다 가입 이후 자산 관리가 퇴직연금 경쟁력을 좌우할 것이라고 밝혔다. KB증권의 최근 3년간 IRP 적립금 연평균 성장률은 2025년 말 기준 56%로 증권업계 평균 38%를 웃돌았다. 올해 2분기 원리금비보장형 1년 수익률은 DC 60.13%, IRP 52.98%였고 3년 수익률은 DC 24.47%, IRP 23.33%였다. KB증권은 연금본부를 연금그룹으로 격상하고 연금마스터 PB와 모바일 플랫폼을 연계한 관리 체계를 운영 중이다.", "category": "업계·경쟁사", "importance": 3, "source": "이투데이", "published": "2026-11-24", "url": "https://www.etoday.co.kr/news/view/2651897", "related": []}, {"id": "72835ff10ef7", "title": "키움증권, 퇴직연금 대상 DLB 3000억원 모집", "summary": "키움증권이 국고채 3개월 금리에 연계한 제95회 드림기타파생결합사채(DLB) 3000억원을 모집한다. 근로자퇴직급여보장법에 따른 퇴직연금 적립금으로만 청약할 수 있으며 청약은 30일 오후 1시부터 4시까지 진행된다. 만기일은 2027년 11월 30일이고, 만기 평가일 국고채 3개월 금리가 8% 이상이면 세전 연 4.401%, 미만이면 세전 연 4.40%를 지급한다. 위험등급은 5등급(낮은 위험)이지만 예금자보호 대상이 아니다.", "category": "업계·경쟁사", "importance": 3, "source": "비건뉴스", "published": "2026-11-24", "url": "https://www.vegannews.co.kr/news/article.html?no=410100", "related": []}, {"id": "ad508700aa15", "title": "[증권사 3Q 성적] ⑥'3→5위' 키움증권, 거래대금에 '출렁이는 실적'", "summary": "키움증권의 올해 3분기 연결 세전이익은 3088억원, 9월 말 누적 세전이익은 1조7600억원으로 상반기 3위에서 10대 증권사 중 5위로 내려왔다. 시장 거래대금이 줄면서 연결 수탁수수료가 2분기 5041억원에서 3분기 2879억원으로 42.9% 감소했고, 국고채 입찰 담합 과징금 838억원도 영업외비용으로 인식했다. 국내주식 리테일 점유율은 지난해 2분기 29.4%에서 올해 3분기 25%로 낮아졌다. 키움증권은 퇴직연금과 AI를 결합한 투자환경을 선보일 계획이라고 밝혔다.", "category": "업계·경쟁사", "importance": 3, "source": "FETV", "published": "2026-11-24", "url": "https://www.fetv.co.kr/news/articleView.html?idxno=314139", "related": []}, {"id": "29d29d316d35", "title": "'하닉은 되던데…' 절세혜택 못 받는 삼전 성과급, 받아도 삼성증권에만 넣어라?", "summary": "삼성전자 노사는 반도체(DS)부문 특별경영성과급을 세후 전액 자사주로 지급하기로 해, 성과급 일부를 퇴직연금 DC 계좌에 적립하는 방안은 합의안에 반영되지 않았다. SK하이닉스는 경영성과급 일부를 DC 계좌에 적립하도록 해 임직원 약 3만명 중 약 2만2000명이 신청했고 1조원이 넘는 성과급이 퇴직연금 계좌로 들어갔으며, DC 사업자 목록에는 10여 곳이 올랐다. 삼성전자 임직원이 삼성증권·생명·화재에 새로 납입한 DC 금액은 2022년 2312억원에서 지난해 1조6305억원으로 7배 늘었다. 삼성증권 측은 회사가 삼성 상품을 강제하는 구조는 아니라고 밝혔다.", "category": "법인·자금운용", "importance": 3, "source": "인베스트조선", "published": "2026-11-24", "url": "https://www.investchosun.com/site/data/html_dir/2026/11/23/2026112380135.html", "related": []}, {"id": "fd0438a8317b", "title": "내 연금·유족연금 겹친 20.8만명…3.7만명은 내 연금 '0원'", "summary": "국회예산정책처의 '2027년도 예산안 위원회별 분석 보고서'에 따르면 본인 노령·장애연금과 배우자 유족연금 수급권이 겹친 사람은 2021년 12만3천994명에서 2025년 20만8천242명으로 67.9% 늘었다. 국민연금법 제56조에 따라 본인 연금을 고르면 유족연금은 30%만 추가 지급되고, 유족연금을 고르면 본인 연금은 전액 지급 정지된다. 2025년 중복수급권자 중 82%인 17만1천547명은 본인 연금을, 18%인 3만6천695명은 유족연금을 택해 자기 연금을 한 푼도 받지 못했다. 공무원연금 등 직역연금은 유족연금의 50%를 병급하고, 부부가 서로 다른 공적연금에 가입했으면 감액 없이 전액을 받아 형평성 논란이 제기된다.", "category": "가입자·사회", "importance": 3, "source": "연합뉴스", "published": "2026-11-23", "url": "https://www.yna.co.kr/view/AKR20261122031500530", "related": []}]}, "monthly": {"period": "monthly", "key": "current", "label": "2026-10-25 ~ 2026-11-24", "generated_at": "2026-11-25T07:38:53+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "b7e8a161b6af", "title": "2028년부터 퇴직급여 사외적립 의무화… 체불 막는다", "summary": "근로자의 퇴직금 체불을 막기 위해 내후년부터 100인 이상 사업장을 대상으로 퇴직급여 사외 적립을 단계적으로 의무화하는 방안이 추진된다. 이형일 부총리 겸 재정경제부 장관과 배경훈 부총리 겸 과학기술정보통신부 장관은 28일 경제관계장관회의·과학기술관계장관회의 첫 연석회의에서 이 방안을 논의했으며, 기금형 퇴직연금의 구체적 도입 방안도 마련해 전문적인 자산 운용과 엄격한 수탁자 책임을 부과하기로 했다. 퇴직연금 사업자 평가 기준은 연금 성과 수익률 중심으로 개편하고, 디폴트옵션 적용 예정 통보 시점은 만기 후 4주에서 만기 전 2주로 앞당긴다. 구체적인 퇴직연금 기능 강화 방안은 29일 국회 기후에너지환경노동위원회 여당 위원과의 당정협의를 거쳐 발표된다.", "category": "제도·규제", "importance": 5, "source": "서울신문", "published": "2026-10-29", "url": "https://www.seoul.co.kr/news/economy/2026/10/29/20261029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "540조 퇴직연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936461/2"}, {"title": "퇴직연금, 전문가가 대신 굴린다…'기금형' 도입, 국민연금 참여는 미정", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6335473"}, {"title": "정부, 퇴직연금 기금형 활성화…IRP 위험자산 투자한도 상향 추진", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4441777"}, {"title": "\"퇴직금 못 받는 일 줄인다\", 사외적립 전 사업장 확대 추진", "source": "데일리환경", "url": "https://www.dailyt.co.kr/newsView/dlt202611040003"}, {"title": "기업 퇴직연금 모아 전문기관이 굴려… ‘쥐꼬리 수익’ 개선 기대", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936451/2"}, {"title": "국민연금, 기금형 퇴직연금 참여 미정···‘시장 개입 우려’에 국회로 공 넘긴 정부", "source": "경향신문", "url": "https://www.khan.co.kr/article/202610300600041"}, {"title": "[퇴직연금 개편] 퇴직연금도 국민연금처럼…정부, 장기 연금 수령 유도 방안 발표", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=620807"}, {"title": "퇴직연금 사외적립 2030년까지 전 사업장 의무화", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237470"}, {"title": "당정, ‘퇴직연금 강화·고용부 예산’ 살핀다…초광역특구법 논의 가능성", "source": "디지털타임스", "url": "https://www.dt.co.kr/article/12091950"}]}, {"id": "df6d8c8ff511", "title": "증시 급락에 퇴직연금 수익률 급감…적립금 11조7천억원 감소", "summary": "올해 3분기 말 퇴직연금 적립금은 542조1214억원으로 6월 말 553조8779억원보다 11조756 cle/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "5dd7e8508fc5", "title": "하나은행, 호남권 첫 시니어 특화 금융라운지 광주에 개점", "summary": "하나은행은 지난 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 금융공간인 '하나더넥스트 광주금융 라운지'를 개점했다. 라운지는 은퇴설계, 상속·증여, 유언대용신탁 상담과 건강관리·문화·주거 등 라이프케어 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산, 예상 지출을 분석하는 '평생소득설계' 상담을 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "38994a32152d", "title": "[DQN] 주식시장 약세에 삼성생명 적립금 규모 1위 재탈환…DC형 비보장 수익률 반토막 [2026년 3분기 퇴직연금 랭킹]", "summary": "금감원 통합연금포털 3분기 공시 분석 결과 삼성생명의 퇴직연금 적립금이 57조5486억원으로 2분기 1위였던 신한은행을 추월했다. 계열사 DB형 적립금이 7074억원 늘어난 반면 비계열사 DB형은 3586억원 감소했으며, 주식시장 하락으로 원리금보장형 선호가 커진 점도 영향을 미쳤다. 신한라이프 DC형 원리금비보장 수익률은 2분기 111.17%에서 3분기 59.71%로 떨어지는 등 DC·IRP 비보장형 수익률이 절반 가량 하락했다. IRP 원리금비보장 적립금은 94조6349억원에서 87조6398억원으로 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-11-08", "url": "https://www.fntimes.com/html/view.php?ud=2026110716081563428a55064dd1_18", "related": [{"title": "퇴직연금 판도 재역전…삼성생명 반년 만에 선두 탈환", "source": "아시아타임즈", "url": "https://www.asiatime.co.kr/article/20261020500369"}]}, {"id": "545a1b2bec51", "title": "기금형 연금 도입에…금융지주 계열사 합종연횡 채비", "summary": "기금형 퇴직연금 추진이 공식화되면서 주요 금융지주들이 은행을 중심으로 계열사를 동원한 수탁법인 컨소시엄 설립 준비에 돌입했다. 고용노동부는 오는 6일 주요 은행장들을 소집해 기금형 퇴직연금 간담회를 열며, 법 개정 과정에서 금융지주 자회사 공동출자를 허용하는 예외를 마련할 계획이다. NH농협금융은 퇴직연금 제도 개편 대응 TF를, KB금융과 우리금융은 계열사 워킹그룹을 운영하고 있으며 신한금융도 정식 TF를 발족할 예정이다. 5대 금융지주 DC·IRP 적립액은 174조1435억원으로 작년말 대비 15.5% 늘었고, 증권 계열사 비중은 11.2%에서 13.2%로 상승했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-11-03", "url": "https://www.mt.co.kr/finance/2026/11/03/2026110216011686926", "related": [{"title": "기금형 퇴직연금 도입 초읽기… 원팀 꾸리는 금융지주 계열사", "source": "머니투데이", "url": "https://www.mt.co.kr/finance/2026/11/04/2026110319393765961"}]}, {"id": "113078a9f394", "title": "퇴직연금 ‘100% 투자 가능’의 함정…원금까지 보장하진 않아", "summary": "금융감독원은 내년 1월부터 퇴직연금 매매화면과 상품검색 화면에 투자한도와 위험등급을 함께 표시하도록 개선한다고 27일 밝혔으며, 상품제안서와 적립금운용현황보고서에도 위험등급을 병기한다. 일부 사업자가 원금손실 가능성이 있는 상품도 '투자한도 100%'로만 안내해 가입자가 원리금보장형으로 오인할 수 있다는 판단에서다. 올해 상반기 말 퇴직연금 적립금 558조3000억원 가운데 실적배당형은 198조원이고, 이 중 ETF 투자 규모는 99조8000억원으로 50.4%를 차지했다. 일부 사업자는 전산개발 일정에 따라 내년 상반기 중 시행한다.", "category": "제도·규제", "importance": 4, "source": "메트로신문", "published": "2026-10-27", "url": "https://www.metroseoul.co.kr/article/20261027500104", "related": [{"title": "“퇴직연금 다 날릴 수도”…ETF 투자한도 100%의 함정 [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8699397&ref=A"}]}, {"id": "133e90c36463", "title": "“원리금 보장만” “위험자산 반 이상”…퇴직연금 가입자 돈 굴리기 양극화", "summary": "금융감독원에 따르면 퇴직연금 적립금은 2023년 말 382조원에서 올해 6월 말 558조원으로 늘었다. 가입자의 64.5%는 적립금 전액을 원리금 보장형에 두고 있고, 33.9%는 절반 이상을 위험자산에 투자했으며, 분산 투자로 균형을 맞춘 경우는 1.6%에 그쳤다. 실적배당형 비중은 2023년 12.8%에서 올해 6월 말 35.5%로 약 2.8배 늘었고 그중 50.4%가 ETF에 투자됐다. 금감원은 11월 3일 장기·분산 투자를 돕는 '퇴직연금 가이드북'을 발간했으며, 디폴트옵션도 대부분 원리금 보장형에 머물러 있다고 밝혔다.", "category": "운용·상품", "importance": 3, "source": "서울신문", "published": "2026-11-17", "url": "https://www.seoul.co.kr/news/economy/finance/2026/11/17/20261117031002", "related": [{"title": "같은 퇴직금, 20년 뒤엔 1억6천 차이…50대 여유 있다면 ‘보증형 보험’이 대안", "source": "경향신문", "url": "https://www.khan.co.kr/article/202611170600051"}, {"title": "김 과장·박 과장, 연금 똑같이 1000만 원씩 냈는데...20년 뒤 계좌 잔고 '충격'", "source": "파이낸셜뉴스", "url": "https://www.fnnews.com/news/202611161529480756"}, {"title": "퇴직연금 적립금 558조 넘겨…DC 전환 1년만 118% 증가", "source": "SBS Biz", "url": "https://biz.sbs.co.kr/article_hub/20000346629"}]}, {"id": "b479ce15b6d3", "title": "반도체 폭락에도 퇴직연금은 '사자'···은행권, 223조원 사수 총력전", "summary": "3분기 말 5대 은행의 퇴직연금 적립금은 222조9427억원으로 2019년 집계 이후 처음 감소했고, 2024년 10월 실물이전 시행 이후 올해 6월 말까지 은행에서 증권사로 옮겨간 적립금은 5조2000억원이었다. 은행들은 자금 이탈을 막기 위해 ETF 매도 대금으로 같은 날 재투자할 수 있는 당일매매 서비스를 잇달아 도입하고 있다. 국민은행이 8월 20일 시중은행 최초로 도입했고 신한은행이 9월, 우리·하나은행이 이달 합류했으며 농협은행은 다음 달, IBK기업은행은 내년 1분기 시작할 예정이다. 국민은행은 시행 후 한 달간 증권사로 이동한 적립금이 지난해 12월 한 달보다 약 50% 줄었다고 밝혔으나, 은행은 여전히 실시간 거래가 안 되고 취급 상품도 약 300개로 증권사(약 900개)보다 적다.", "category": "업계·경쟁사", "importance": 3, "source": "스마트비즈", "published": "2026-11-23", "url": "https://www.smartbizn.com/news/articleView.html?idxno=160195", "related": [{"title": "은행 퇴직연금, '증권사 속도'로 바뀐다…ETF 당일매매 전산 개편 확산", "source": "전자신문", "url": "https://www.etnews.com/20261120000226"}]}, {"id": "b1c24b848e68", "title": "줄어든 거래대금에 증권가는 ‘MTS’ 전쟁…AI·배당·연금으로 고객 자산 잡는다", "summary": "증시 조정으로 거래가 위축되자 증권사들이 MTS에 AI 투자정보, 배당 정보, 퇴직연금 ETF 적립식 매수 기능 등을 더하고 있다. 하나증권은 이달부터 DC·IRP 계좌에서 ETF·ETN·리츠를 정기 매수하는 서비스를 개시하며, 3분기 기준 DC·IRP 시장점유율 1위를 달성했다. 3분기 국내 주식시장 일평균 거래대금은 52조4000억원으로 전 분기 대비 41.7% 감소해 증권사 위탁수수료 수익이 크게 줄었다.", "category": "업계·경쟁사", "importance": 3, "source": "조선비즈", "published": "2026-11-09", "url": "https://biz.chosun.com/stock/stock_general/2026/11/09/FUNYZOZV2JH4FLZ7BJYY4STMYI/", "related": [{"title": "줄어든 증시 거래대금에 증권가는 ‘MTS 전쟁’", "source": "조선일보", "url": "https://www.chosun.com/economy/stock-finance/2026/11/10/IKPQK3UVDJG2HEUOQJK5EO4OFM/"}]}, {"id": "ea0a4daeeaf0", "title": "소득 여유 있는 가구가 연금도 먼저 받는다…취약가구와 수급 격차", "summary": "한국보건사회연구원 보고서에 따르면 정년 이후 공적연금 수급 전까지의 소득공백기에 경제적 여력이 있는 가구일수록 연금 수급률이 높았다. 정년 전 중위소득 100% 이상을 유지하거나 늘린 가구의 공적연금 조기 수급률은 26.5%, 소득이 절반 미만으로 줄어든 취약가구는 18.1%였다. 월평균 공적연금 수급액은 소득 유지 가구가 191만8000원, 취약가구가 52만7000원으로 3.6배 이상 차이가 났다. 보고서는 필요한 금액만큼 연금을 나눠 받는 '부분연금제' 도입과 건강보험료·기초연금 등과의 연계 구조 정비를 제언했다.", "category": "가입자·사회", "importance": 3, "source": "메디컬투데이", "published": "2026-11-10", "url": "https://www.mdtoday.co.kr/news/articleView.html?idxno=623884", "related": [{"title": "“노후 소득공백 버티려 연금 당겼는데”…취약층보다 여유 있는 가구가 더 받았다", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10929855?ref=naver"}]}, {"id": "52bb3ea27011", "title": "국민연금 10년 부은 평균소득자, 기초연금보다 덜 받는다…‘급여 역전’", "summary": "국민연금연구원 김형수 부연구위원의 보고서에 따르면 소득대체율 43%를 적용할 때 평균소득자가 최소가입기간 10년을 채운 월 연금액은 A값의 10.75%로, 올해 기초연금 기준연금액(A값의 약 10.95%)보다 낮다. 올해 A값 319만3511원을 넣으면 국민연금은 월 약 34만3300원으로 기준연금액 34만9700원보다 6400원가량 적다. 보고서는 국민연금 최소가입기간을 상향하거나 기초연금 기준연금액 수준을 조정하는 방향이 필요하다고 제시했다. 최소가입기간을 15년으로 높여도 59세 말 기준 미달 비율은 1.6%로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-04", "url": "https://www.segye.com/newsView/20261103517557", "related": [{"title": "국민연금 10년 부었는데 기초연금보다 적다…월 6400원 역전", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=500742"}]}, {"id": "f82595e9660f", "title": "\"1년 미만·초단기 근로자도 퇴직금\"…정부 실태조사 착수", "summary": "정부가 1년 미만 근속자와 주 15시간 미만 초단시간 근로자에게도 퇴직급여를 지급하는 방안을 검토한다. 29일 발표된 퇴직연금 기능강화 방안에 따라 한국노동연구원이 이들의 퇴직급여 운영 실태와 의무화에 따른 사용자 부담·노동시장 영향을 분석한다. 지난해 주 1~14시간 일한 취업자는 177만9000명으로 전체 취업자의 6.2%였고 관련 통계 작성 이후 가장 많았다. DC형 법정 최소 사용자 부담금이 연간 임금총액의 12분의 1인 만큼 영세 사업장의 채용 위축 우려도 제기된다.", "category": "제도·규제", "importance": 3, "source": "한국경제", "published": "2026-10-30", "url": "https://www.hankyung.com/article/202610294697i", "related": [{"title": "퇴직연금 의무화에도…1년 미만·초단시간 노동자 사각지대 남아", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261029010010231"}]}, {"id": "d3317e03935a", "title": "한투증권, 유튜브 '한국인의 연금'서 매주 화요일 시황 라이브", "summary": "한국투자증권이 퇴직연금 유튜브 채널 '한국인의 연금'에서 매주 화요일 오후 5시 정기 라이브 시황 세미나를 진행한다. 주식 시황뿐 아니라 DC·IRP와 개인연금 계좌에 맞춘 장기 자산배분 전략을 다루며, 위험자산 편입 한도 70% 기준의 포트폴리오 조정과 TDF·채권·배당형 자산 활용법을 설명한다. 실시간 채팅과 전문가 Q&A로 연금 제도, 절세, 수령·인출 전략 질문에 답하고 시청은 무료다. 최종진 연금혁신본부장은 연금 자산 성격에 맞는 객관적 시장 진단과 주기적 리밸런싱이 노후 자산의 성패를 결정한다고 말했다.", "category": "업계·경쟁사", "importance": 2, "source": "아시아경제", "published": "2026-11-17", "url": "https://view.asiae.co.kr/article/2026111709111366247", "related": [{"title": "한국투자증권, 퇴직연금 유튜브 '한국인의 연금'서 매주 화요일 라이브 시황 세미나 진행", "source": "한국경제", "url": "https://www.hankyung.com/article/202611185427O"}]}, {"id": "fa231637c697", "title": "KB자산운용, 美 초대형주·만기매칭형 회사채 ETF 동시 상장", "summary": "KB자산운용이 18일 RISE 미국초대형주TOP10 ETF와 RISE 27-11 회사채(AA-이상)액티브 ETF를 동시에 상장한다. 미국초대형주TOP10은 NYSE·나스닥 상장 시가총액 상위 10개 종목에 투자하며 총보수는 연 0.30%다. 27-11 회사채 ETF는 2027년 10~12월 만기 AA- 이상 회사채에 투자하는 만기매칭형으로 예상 만기수익률은 세전 연 4.13%, 총보수는 연 0.05%다. 회사채 ETF는 DC·IRP 계좌에서 적립금의 100%까지 편입할 수 있다.", "category": "운용·상품", "importance": 2, "source": "파이낸셜포스트", "published": "2026-11-18", "url": "https://www.financialpost.co.kr/news/articleView.html?idxno=301568", "related": [{"title": "KB운용, 美 초대형주 ETF·우량 회사채 ETF 동시 상장", "source": "글로벌이코노믹", "url": "https://www.g-enews.com/view.php?ud=202611170832545593153ddfb15a_1"}]}, {"id": "05ec7d4ac99b", "title": "NH농협은행, 퇴직연금 고객 세미나…운용 전략 공유", "summary": "NH농협은행이 지난 22일 서울 여의도 콘래드 호텔에서 퇴직연금 고객을 초청해 '업위고(UP WE GO) 퇴직연금 끌어올려 세미나 2026'을 개최했다. 수익률 세션에서는 안정형·투자형 퇴직연금 운용 전략을 소개했고, 성상현 전무가 자산 운용 전략과 대응 방안을 강연했다. 2015년 시작한 이 세미나는 올해 11년째로, 퇴직연금 전문 강의를 통한 금융교육과 함께 기업 및 농협은행 담당자가 의견을 나누는 자리로 운영된다. 강태영 NH농협은행장은 전사적인 사후관리를 강화하고 있으며 고객 의견을 향후 퇴직연금 관리에 적극 반영하겠다고 밝혔다.", "category": "업계·경쟁사", "importance": 1, "source": "화이트페이퍼", "published": "2026-10-26", "url": "http://www.whitepaper.co.kr/news/articleView.html?idxno=268084", "related": [{"title": "NH농협은행, 퇴직연금 고객 세미나 개최…운용 전략·노후 설계 공유", "source": "더퍼블릭", "url": "https://www.thepublic.kr/news/articleView.html?idxno=323571"}]}, {"id": "7b0e43c939f4", "title": "KB국민은행, 기업 퇴직연금 수수료 최대 0.20%p 인하", "summary": "KB국민은행이 27일부터 확정급여형(DB)과 표준형 확정기여형(DC), 기업형 개인형퇴직연금(IRP)의 수수료 체계를 개편해 수수료율을 최대 0.20%p 인하한다. 표준형 DC의 적립금 50억원 미만 구간 운용관리수수료율은 연 0.14~0.19%에서 연 0.10%로, DB형 500억원 이상 1000억원 미만 구간은 연 0.18%에서 0.07%로 낮춘다. 우대 대상에 신협·새마을금고 등 조합법인과 노인장기요양기관, 장애인활동지원기관,  수익률 반토막 [2026년 3분기 퇴직연금 랭킹]", "summary": "금감원 통합연금포털 3분기 공시 분석 결과 삼성생명의 퇴직연금 적립금이 57조5486억원으로 2분기 1위였던 신한은행을 추월했다. 계열사 DB형 적립금이 7074억원 늘어난 반면 비계열사 DB형은 3586억원 감소했으며, 주식시장 하락으로 원리금보장형 선호가 커진 점도 영향을 미쳤다. 신한라이프 DC형 원리금비보장 수익률은 2분기 111.17%에서 3분기 59.71%로 떨어지는 등 DC·IRP 비보장형 수익률이 절반 가량 하락했다. IRP 원리금비보장 적립금은 94조6349억원에서 87조6398억원으로 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-11-08", "url": "https://www.fntimes.com/html/view.php?ud=2026110716081563428a55064dd1_18", "related": [{"title": "퇴직연금 판도 재역전…삼성생명 반년 만에 선두 탈환", "source": "아시아타임즈", "url": "https://www.asiatime.co.kr/article/20261020500369"}, {"title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "source": "세이프타임즈", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652"}, {"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "b7e8a161b6af", "title": "2028년부터 퇴직급여 사외적립 의무화… 체불 막는다", "summary": "근로자의 퇴직금 체불을 막기 위해 내후년부터 100인 이상 사업장을 대상으로 퇴직급여 사외 적립을 단계적으로 의무화하는 방안이 추진된다. 이형일 부총리 겸 재정경제부 장관과 배경훈 부총리 겸 과학기술정보통신부 장관은 28일 경제관계장관회의·과학기술관계장관회의 첫 연석회의에서 이 방안을 논의했으며, 기금형 퇴직연금의 구체적 도입 방안도 마련해 전문적인 자산 운용과 엄격한 수탁자 책임을 부과하기로 했다. 퇴직연금 사업자 평가 기준은 연금 성과 수익률 중심으로 개편하고, 디폴트옵션 적용 예정 통보 시점은 만기 후 4주에서 만기 전 2주로 앞당긴다. 구체적인 퇴직연금 기능 강화 방안은 29일 국회 기후에너지환경노동위원회 여당 위원과의 당정협의를 거쳐 발표된다.", "category": "제도·규제", "importance": 5, "source": "서울신문", "published": "2026-10-29", "url": "https://www.seoul.co.kr/news/economy/2026/10/29/20261029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "540조 퇴직연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936461/2"}, {"title": "퇴직연금, 전문가가 대신 굴린다…'기금형' 도입, 국민연금 참여는 미정", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6335473"}, {"title": "정부, 퇴직연금 기금형 활성화…IRP 위험자산 투자한도 상향 추진", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4441777"}, {"title": "\"퇴직금 못 받는 일 줄인다\", 사외적립 전 사업장 확대 추진", "source": "데일리환경", "url": "https://www.dailyt.co.kr/newsView/dlt202611040003"}, {"title": "기업 퇴직연금 모아 전문기관이 굴려… ‘쥐꼬리 수익’ 개선 기대", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936451/2"}, {"title": "국민연금, 기금형 퇴직연금 참여 미정···‘시장 개입 우려’에 국회로 공 넘긴 정부", "source": "경향신문", "url": "https://www.khan.co.kr/article/202610300600041"}, {"title": "[퇴직연금 개편] 퇴직연금도 국민연금처럼…정부, 장기 연금 수령 유도 방안 발표", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=620807"}, {"title": "퇴직연금 사외적립 2030년까지 전 사업장 의무화", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237470"}, {"title": "당정, ‘퇴직연금 강화·고용부 예산’ 살핀다…초광역특구법 논의 가능성", "source": "디지털타임스", "url": "https://www.dt.co.kr/article/12091950"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "fd9e49abb205", "title": "한국투자증권, 퇴직연금 운용의 우위를 실증하다... 3년간 수익률 100% 돌파", "summary": "고용노동부의 9월 말 기준 공시에서 한국투자증권 디폴트옵션 적극투자형 BF1의 3년 누적 수익률이 100.97%로 전체 퇴직연금사업자 포트폴리오 가운데 가장 높았다. 이는 적극투자형 평균 57.58%를 43.39%포인트 웃돌며, 업권별 평균은 증권 61.45%, 은행 55.76%, 보험 55.03%였다. 핵심 전략은 한국투자신탁운용과 협업한 MySuper 알아서 성장형 펀드로 글로벌 우량주와 부동산·인프라·물가연동채권 등 대체자산에 분산투자한다. 3분기 말 DC·IRP 합산 적립금은 18조5160억원으로 지난해 말보다 5조7292억원(44.8%) 늘었다.", "category": "업계·경쟁사", "importance": 4, "source": "리버티코리아포스트", "published": "2026-11-05", "url": "http://www.lkp.news/news/articleView.html?idxno=85780", "related": [{"title": "한투증권, 디폴트옵션 3년 누적 수익률 100.97%…전 사업자 1위", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261104_0003853884"}, {"title": "퇴직연금 3년 새 '두 배' 불렸다…한국투자증권, 디폴트옵션 수익률 전체 1위 달성", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "5dd7e8508fc5", "title": "하나은행, 호남권 첫 시니어 특화 금융라운지 광주에 개점", "summary": "하나은행은 지난 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 금융공간인 '하나더넥스트 광주금융 라운지'를 개점했다. 라운지는 은퇴설계, 상속·증여, 유언대용신탁 상담과 건강관리·문화·주거 등 라이프케어 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산, 예상 지출을 분석하는 '평생소득설계' 상담을 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로
     그보다 넉넉히 잡아야 매일 아침 헛경보가 뜨지 않는다. */
  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
         + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

  function buildStaleNotice() {
    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
