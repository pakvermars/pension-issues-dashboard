     키움 두 색은 kiwoomam.com 로고의 구조를 그대로 옮긴 것이다.

  :root {

    --surface: #F6F7F9;
    --rule: #C9CEDA;

    --hot: #B23A2E;
    --cat-1: #2A3F66;

    --cat-3: #14657C;

    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {

      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 감청 원색은 어두운 종이에서 1.9:1까지 떨어져 줄이 보이지 않는다.
         마젠타도 한 단계 올려 짝을 맞춘다. 각각 6.2:1, 6.6:1. */
      --kiwoom-deep: #6E92F5;
      --kiwoom-point: #FF5FB4;
    }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야
     구분선이 아니라 종이의 테두리로 읽힌다. */

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .masthead {

    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {

    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);

  }

    letter-spacing: -0.01em;
    color: var(--kiwoom-point);
    white-space: nowrap;
  }

    font-family: var(--font-num);

    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .search input {
    width: 230px;

    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */
  .group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {

    color: var(--ink-soft);

    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);

    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);

  .filters button {

    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {

    font-weight: 600;
    border-bottom-color: var(--accent);

    background: var(--surface);

    font-size: 0.83rem;
    color: var(--ink-soft);

    padding: 26px 0;
    border-bottom: 1px solid var(--rule);

    color: var(--ink-soft);

    padding-top: 2px;

  .head {

    flex-wrap: wrap;
    margin-bottom: 4px;

    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);

  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;

    list-style: none;

  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

상무지점 부장은 은퇴가 임박하면 자산 증식 전략에서 벗어나 원금을 지키며 매월 정기 수입을 만드는 현금흐름 창출 전략으로 전환해야 한다고 제언했다. 퇴직금과 연금을 합쳐 8억원을 모은 58세 사례에 4·4·2 자산배분을 추천했다. 40%인 3억2000만원은 S&P500 추종 커버드콜과 글로벌 배당성장 상품으로 채워 연 6~8% 수준의 분배금을 받고, 또 40%는 국공채·단기채권·우량 회사채 등 안전자산으로 구성한다. 남은 20%인 1억6000만원은 CMA, MMF, 단기 정기예금 같은 현금성 자산으로 남겨 두라고 설명했다.", "category": "운용·상품", "importance": 2, "source": "동아일보", "published": "2026-10-06", "url": "https://www.donga.com/news/Economy/article/all/20261005/134787959/2"}, {"id": "10323546126f", "title": "\"쓸 줄을 몰라요\"…40억 쌓아두고 지갑 닫은 미국 은퇴자들", "summary": "뱅가드 조사에서 보유 자산 100만 달러(약 13억4900만원) 이하 은퇴자 중 40%가 세법상 의무 최소 인출 시점까지 퇴직 계좌에서 한 푼도 인출하지 않았다. 시카고의 75세 남성은 매달 약 8000달러(약 1079만원)의 연금을 받으면서도 100만 달러가 넘는 은퇴 자산에 손을 대지 않았다. 플로리다의 79세 남성은 약 3000만 달러(약 404억7000만원)를 보유했지만 연간 지출은 40만~50만 달러에 그쳤다. 자산 감소 불안, 의료비 부담, 30~40년간 굳어진 저축 습관이 겹쳐 은퇴 후 소비로의 전환을 막고 있다.", "category": "가입자·사회", "importance": 2, "source": "글로벌이코노믹", "published": "2026-10-06", "url": "https://www.g-enews.com/view.php?ud=202610051853019338fbbec65dfb_1"}, {"id": "cb7f71b5fbc2", "title": "배형근號 현대차증권, 차세대 시스템·조직개편 날개 달고 비상 준비", "summary": "현대차증권은 10월 중 차세대 원장 시스템 전환을 마치고 HTS·MTS·홈페이지 등 대고객 채널을 전면 개편한다. 2025년 3월 유상증자로 조달한 1620억원 가운데 1000억원을 차세대 시스템과 대고객 채널 개발에 배정했다. 2025년 12월 개시한 퇴직연금 IRP 로보어드바이저 일임 서비스를 마이데이터 사업과 연계하고 디지털 창구를 열어 수수료 기반 수익 구조를 정착시키고 있다고 설명했다. 올해 상반기 당기순이익은 593억원으로 전년 대비 48.3% 증가했다.", "category": "업계·경쟁사", "importance": 2, "source": "이투데이", "published": "2026-10-06", "url": "https://www.etoday.co.kr/news/view/2632153"}, {"id": "4789f9849b42", "title": "키움증권, 브로커리지 넘어 WM 플랫폼 공략…발행어음 승부수 [빅7 증권사 성장 방정식 (7)]", "summary": "키움증권의 2026년 상반기 순영업수익은 1조7155억원으로 업계 6위이며, 2분기에는 9830억원을 기록해 분기 기준 역대 최고 수준에 올랐다. 위탁매매 수수료가 전체 수익의 51.1%를 차지해 사업 다각화가 과제로 꼽힌다. 2025년 11월 단기금융업무 인가를 받은 발행어음 잔고는 2026년 2분기 1조8160억원까지 늘었다. 회사 관계자는 고객 중심의 플랫폼 서비스 개편에 힘쓰고 있으며 퇴직연금과 AI를 결합한 선진 투자 환경을 선보이겠다고 밝혔다.", "category": "업계·경쟁사", "importance": 2, "source": "한국금융신문", "published": "2026-10-06", "url": "https://www.fntimes.com/html/view.php?ud=202610031545463417179ad43907_18"}, {"id": "c97883e4f1f7", "title": "\"월 300만원 노후 소득 만든다\"…국민연금 추후 납부 제도 관심", "summary": "김용택 연금닥터 상담센터 대표는 국민연금에 퇴직금과 연금저축·개인형퇴직연금(IRP)을 더하면 은퇴 후 월 300만원 수준의 노후 소득을 마련할 수 있다고 설명했다. 경력 단절이나 휴직으로 국민연금을 내지 않은 기간은 추후 납부로 가입 기간을 늘릴 수 있고, 국민연금은 가입 기간이 길수록 수령액이 비례해 늘어나는 구조라고 밝혔다. 소득이 없는 전업주부나 무직자는 임의가입을, 만 60세 이후에는 임의계속가입을 활용해 최소 가입 기간 10년을 채우거나 수령액을 높일 수 있다. 1965년생부터 1970년생 세대는 과거 납부 이력을 조회해 추납 가능 여부를 즉시 확인하는 것이 바람직하다고 권고했다.", "category": "가입자·사회", "importance": 2, "source": "뉴시스", "published": "2026-10-06", "url": "https://www.newsis.com/view/NISX20261005_0003814493"}, {"id": "be3f8d8a658b", "title": "\"흔들리는 시장에서 ‘투자의 등대’가 될 겁니다\"", "summary": "조대현 하나증권 WM그룹장은 올 상반기 증시 호조로 증권사 자산관리 부문이 전반적으로 좋은 성과를 냈지만 시장 변동성이 커진 하반기에 진짜 실력이 드러날 것이라고 진단했다. 그는 브로커리지 중심 영업에서 벗어나 패밀리오피스, 연금, 디지털, 리테일 법인, 외국인 국내 투자, 디지털자산을 새로운 성장 축으로 키우고 있다고 밝혔다. 특히 연금은 단순한 적립금 경쟁이 아니라 손님과 20~30년 함께할 수 있는 가장 긴 자산관리 사업이라고 말했다. 하나증권은 지난해 말 패밀리오피스본부를 신설해 개인 금융자산 중심이던 관리 범위를 기업과 가족으로 넓혔고, AI 서비스도 주식 편중과 손익, 채권 만기, 현금성 자산, 연금을 분석해 손님이 묻기 전에 위험과 기회를 알려주는 자산관리 툴로 발전시킬 계획이다.", "category": "업계·경쟁사", "importance": 2, "source": "한경머니", "published": "2026-10-06", "url": "https://magazine.hankyung.com/money/article/202609169025c"}, {"id": "17458e603e7e", "title": "[김병철 칼럼㉕] 모으라고 만든 IRP, 왜 퇴직할 때 다시 쪼개지는가?", "summary": "김병철 한국퇴직연금개발원 대표는 퇴직 시 다른 금융기관에 퇴직금 수령용 IRP를 따로 개설하는 실무 관행을 문제로 지적했다. 현행법은 퇴직급여를 근로자가 지정한 IRP 계정으로 지급하도록 해 기존 IRP를 지정할 수 있고, 한 금융기관에 IRP를 하나만 개설할 수 있는 원칙도 계좌를 모으는 방향의 신호라고 설명했다. 그럼에도 돈의 출처와 세금 기록을 구분하기 편하고 퇴직급여만 인출하기 쉽다는 이유로 별도 계좌를 만드는 관행이 굳어져, 모으라고 만든 IRP가 다시 쪼개진다고 했다. 새로 만든 계좌는 필요하면 꺼내 쓰는 목돈처럼 인식돼 해지 유인이 커진다며, 계약형 퇴직연금사업자가 선택의 순서를 바꿔야 한다고 밝혔다.", "category": "가입자·사회", "importance": 2, "source": "글로벌에픽", "published": "2026-10-06", "url": "http://www.globalepic.co.kr/view.php?ud=2026100608105539017cc35ccc5c_29"}, {"id": "4c438bc5065f", "title": "성과평가: \"숫자는 거짓말을 하지 않는다, 사람이 시킬 뿐\"[김병철의 퇴직연금개혁 시나리오]", "summary": "김병철 한국퇴직연금개발원 대표는 수익률 숫자가 맥락 없이 제시되면 왜곡될 수 있다며, 은행 금리 2% 시대에 10% 수익률을 냈더라도 시장이 30% 올랐다면 실패라고 설명했다. 1990년대 미국에서 운용사가 수익률이 좋은 계좌만 골라 보여주는 체리피킹이 문제가 되자 1999년 국제투자성과기준(GIPS)이 도입돼 같은 전략 계좌를 묶는 컴포지트, 일관된 기간 표시, 비용·계산방식·벤치마크 공개를 의무화했다고 소개했다. 한국은 퇴직연금 수익률을 공시하지만 벤치마크 개념이 약하고, 원리금보장 상품과 실적배당 상품을 섞어 공시해 비교가 불명확하며 단순평균과 가중평균 수익률의 차이도 크다고 지적했다. 그는 투명한 성과평가 체계가 신뢰를 만들고 그 신뢰가 한국형 기금 제도 성공의 핵심이라고 밝혔다.", "category": "제도·규제", "importance": 2, "source": "이데일리", "published": "2026-10-06", "url": "https://www.edaily.co.kr/News/Read?newsId=02686326645610296&mediaCodeNo=257"}, {"id": "6aff74f2c02b", "title": "신한투자증권, 연금고객관리팀 신설…맞춤형 연금관리 강화", "summary": "신한투자증권이 가입부터 수령까지 생애주기를 아우르는 전담 조직 연금고객관리팀을 신설해 가동에 들어갔다. 신규 DC·IRP 가입 고객에게 계좌 개설 후 3일 이내에 제도와 계좌 활용법을 안내하는 웰컴콜을 운영하고, 사내 우수 연금PB인 연금스타와 고객을 1대1로 매칭한다. 퇴직소득세 절세 시뮬레이션과 연금 수령 계획을 지원하는 신한 Premier 연금컨설팅은 출범 이후 약 200건을 수행했고, 법인 CEO·고위 임원 대상 C-Level 컨설팅도 병행한다. 지난 8월에는 영업점 방문 없이 신청할 수 있는 모바일 상담 신청 서비스를 도입했다.", "category": "업계·경쟁사", "importance": 2, "source": "이투데이", "published": "2026-10-06", "url": "https://www.etoday.co.kr/news/view/2632658"}, {"id": "8886365e07f8", "title": "국민연금, 삼성전자 팔고 하이닉스 1.6조 매수", "summary": "국민연금이 7월 이후 SK하이닉스를 1조5988억원 순매수하고 SK스퀘어 1조3531억원, 삼성전자 7937억원을 순매도했다. SK이노베이션 3535억원, 삼성SDI 3305억원, S-Oil 2635억원, DB손해보험 2546억원도 순매수 상위에 올랐다. 기금 규모는 6월 말 1865조5760억원에서 7월 말 1684조1730억원으로 181조4030억원(9.7%) 줄었다. 같은 기간 국내주식 평가액은 543조2040억원에서 418조5580억원으로 124조6460억원 감소했다.", "category": "운용·상품", "importance": 2, "source": "메디컬투데이", "published": "2026-10-06", "url": "https://www.mdtoday.co.kr/news/articleView.html?idxno=617415"}, {"id": "1dc025d81208", "title": "\"월급 모아 집부터 사야지\" 했는데…전문가가 말린 이유 [인터뷰+]", "summary": "NH투자증권 김진웅 부장은 20·30대가 저축을 모두 주택자금에 몰아넣는 것이 최선은 아니라고 조언했다. 안정적인 소득기반, 소비 후 꾸준히 남기는 저축률, 금융자산과 연금으로 장기간 축적하는 구조를 순서대로 갖춰야 한다고 말했다. 한국은행 보고서에서 순자산과 소득이 모두 하위 20%인 가구 가운데 20·30대 비중은 2020년 7.9%에서 2025년 15.2%로 늘었다. 재무구조가 안정적인 가구의 금융자산 중앙값은 1억1230만원으로 전체 가구 6312만원을 웃돌았고, 권장 최소 저축여력은 처분가능소득의 10% 이상으로 제시됐다.", "category": "가입자·사회", "importance": 2, "source": "한국경제", "published": "2026-10-06", "url": "https://www.hankyung.com/article/2026100298566"}, {"id": "f06600b2cefe", "title": "하나은행, \"12억 넘는 집 있어도 현금은 부족\"…고가주택 은퇴자에 '평생연금'", "summary": "하나은행은 공시가격 12억원을 초과하는 주택 보유자를 대상으로 민간 역모기지 '하나더넥스트 내집연금'을 공급하고 있다. 가입 대상은 부부 중 연소자가 만 55세 이상이고 해당 주택을 2년 이상 보유한 경우이며, 대출 한도는 주택가격의 50% 범위에서 최대 15억원이다. 금리는 10년물 국고채 직전월 1개월 평균금리에 1.3%포인트를 더한 고정금리이고, 부부가 모두 사망할 때까지 지급하는 종신·비소구 구조다. 출시 약 1년 만에 260여명이 약 3300억원 규모로 가입했고 평균 가입 연령은 76세, 최고령 가입자는 92세다.", "category": "업계·경쟁사", "importance": 2, "source": "이코노미사이언스", "published": "2026-10-06", "url": "https://www.e-science.co.kr/news/articleView.html?idxno=136578"}, {"id": "c7653b5ddb4d", "title": "가족 챙기는 40~60대 남성 늘었지만 '자리'에 대한 불안감 여전", "summary": "국가데이터처 사회조사에서 40~64세 중장년층 가운데 노후를 준비하고 있거나 이미 준비했다는 응답은 2015년 75.8%에서 2025년 81.9%로 늘었다. 주된 노후 준비 수단은 국민연금이 61.0%로 가장 많았고 예금·적금 14.7%, 사적연금 5.4%는 감소 추세를 보였다. 일을 우선시한다는 비중은 같은 기간 54.1%에서 35.0%로 낮아지고 가정생활을 우선시한다는 비중은 10.4%에서 17.4%로 높아졌다. 실직이나 이직에 불안을 느낀다는 응답은 55.8%였다.", "category": "가입자·사회", "importance": 2, "source": "세계일보", "published": "2026-10-06", "url": "https://www.segye.com/newsView/20261006505431"}, {"id": "c9e62616ceb1", "title": "연말정산 앞두고 연금저축 IRP 한도 챙기기", "summary": "연말정산 시즌을 앞두고 연금저축과 개인형 퇴직연금(IRP) 납입액을 다시 점검하는 직장인이 늘고 있다. 연금저축은 연간 600만 원까지 세액공제 대상이 되고, IRP를 함께 운용하면 두 상품을 합쳐 연 900만 원까지 공제 한도가 늘어난다. 총급여 5500만 원 이하 근로자는 납입액의 16.5%, 5500만 원 초과 근로자는 13.2%를 공제받아 한도 900만 원을 채우면 각각 최대 148만 5000원과 118만 8000원을 돌려받는다. 한도에 미달한 경우 12월 말까지 추가 납입이 가능하다.", "category": "가입자·사회", "importance": 2, "source": "공감신문", "published": "2026-10-06", "url": "https://www.gokorea.kr/news/articleView.html?idxno=880522"}, {"id": "3ea0df4341ed", "title": "[고현곤 칼럼] 공론화 뒤에 숨은 이재명 정부", "summary": "고현곤 중앙일보 주필은 정부가 공론화를 시간 끌기와 책임 회피 수단으로 쓰고 있다고 비판했다. 연금 개혁을 공론화가 발목을 잡은 사례로 들며, 2018년 보건복지부가 보험료 인상과 지급시기 연기를 골자로 마련한 국민연금 개편안이 문재인 당시 대통령의 반려로 공론화로 넘어갔다고 지적했다. 이후 정부가 뒤로 빠진 채 노동계와 재계, 전문가가 임기 내내 다투다 합의하지 못해 미래 세대의 부담을 키웠다고 평가했다. 원전과 주 52시간제도 공론화와 사회적 대화로 해결할 시기를 지났으므로 대통령이 결단해야 한다고 주장했다.", "category": "제도·규제", "importance": 1, "source": "중앙일보", "published": "2026-10-06", "url": "https://www.joongang.co.kr/article/25467322"}, {"id": "aed4899245b5", "title": "李정부 초과세수, 주거·일자리·서민금융 활용…재정 안전판 논란도", "summary": "이형일 부총리 겸 재정경제부 장관은 5일 오후 5시 하준경 청와대 정책실장 등과 경제현안간담회를 열고 주거·일자리·서민금융 3대 핵심 사회정책 추진방안을 논의했다. 지난달 27일 열린 첫 경제현안간담회에서는 전기차 산업 정책 방향과 퇴직연금 제도 개선방안이 논의됐다. 정부는 올해 88조원대 초과세수를 바탕으로 162조3000억원 규모 미래대응기금 설립을 추진하고 있고, 이 가운데 45조4000억원을 내년에 쓰는 법 제정안이 국회에 제출됐다. 국회 재정경제기획위원회 전문위원은 세수 결손이 발생했을 때 기금에서 일반회계로 얼마를 이전할지에 대한 기준이 미흡하다고 지적했다.", "category": "제도·규제", "importance": 1, "source": "뉴스후플러스", "published": "2026-10-06", "url": "https://www.newswhoplus.com/news/articleView.html?idxno=70977"}, {"id": "a78d574d09de", "title": "[전격시사] 이광재 더불어민주당 의원 - “AI 특수 소수에 집중 큰 문제…국부펀드 조성해 생애 전 주기 복지 자금 마련해야”", "summary": "이광재 더불어민주당 의원은 KBS 1라디오 전격시사 인터뷰에서 AI 특수로 얻은 부가 소수에게 집중되는 것이 전 세계적인 문제라고 말했다. 그는 AI 특수로 늘어난 세수를 활용해 국부펀드를 조성하고, 신생아 1인당 종잣돈을 지급한 뒤 펀드로 금액을 키워 주택자금과 간병비 등 생애 전 주기 복지 비용으로 쓰도록 해야 한다고 제안했다. 대만에 이어 미국도 같은 문제를 해결하기 위해 “트럼프 계좌”를 열었다고 언급했다. 또 선진국형 물가연동제 세법을 도입해 가처분소득을 넓히고 중산층을 보호해야 한다고 주장했다.", "category": "제도·규제", "importance": 1, "source": "KBS", "published": "2026-10-06", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8678390"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-09-29 ~ 2026-10-05", "generated_at": "2026-10-06T16:37:32+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title" 인업", "summary": "변제호 금융위원회 자본시장국장은 28일 '코리아 프리미엄 윅스 2026' 개막식 주제발표에서 아동기부터 노후까지 생애 전 단계를 잇는 장기 투자 기반 구축 방안을 제시했다. 금융위는 2027년 하반기 출시를 목표로 부모와 국가가 자녀 성인기까지 함께 납입하는 19년 장기 투자 모델 '우리아이자립펀드'를 도입하고, 이어 생산적 금융 ISA를 신설하며 퇴직연금도 보다 생산적인 분야에서 운용될 수 있도록 제도를 개편할 계획이다. 변 국장은 \"우리아이자립펀드와 ISA, 퇴직연금과 국민연금으로 이어지는 생애 전 단계의 장기 투자 라인업을 완성하게 됐다\"고 밝혔다. 생산적 금융 ISA는 2027년 말까지 도입을 추진하며 5년 합산 납입한도를 기존 1억원에서 2억원으로 확대한다.", "category": "제도·규제", "importance": 4, "source": "중기이코노미", "published": "2026-09-29", "url": "https://www.junggi.co.kr/news/articleView.html?idxno=37917", "related": []}, {"id": "ee6cf0e31b06", "title": "“부유한 노인도 받는다”…기초연금 ‘하위 70%’ 기준 개편 추진", "summary": "정부가 기초연금 수급 대상을 현행 노인 소득 하위 70% 방식에서 기준중위소득과 연계하는 방식으로 개편할 계획이다. 내년에는 소득 하위 30%의 기준연금액을 월 35만원에서 38만원으로 올리고 차등 지급을 적용한다. 다만 이 조치의 노인빈곤율 개선 효과는 0.3%포인트에 그친다. 정부는 저소득 노인의 급여 인상에 집중하기 위해 장기적으로 수급 구조를 개편할 방침이다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-03", "url": "https://www.segye.com/newsView/20261002510945?OutUrl=naver", "related": [{"title": "이재명 정부, 기초연금 개혁 회피해선 안 된다", "source": "시사IN", "url": "https://www.sisain.co.kr/news/articleView.html?idxno=58534"}, {"title": "기초연금 '소득 하위 70%' 기준 바꾼다…중위소득 연계 재추진", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6308073"}]}, {"id": "83b8b035dfc8", "title": "7월 폭락장, 국민연금도 못 피했다…국민 노후자금 10% 증발에 '부글부글'", "summary": "국민연금 적립금이 6월 1866조원에서 7월 1684조원으로 한 달 만에 9.7% 줄어 181조4030억원의 손실이 났다. 국내주식 평가액은 543조2040억원에서 418조5580억원으로 22.9% 감소했고, 국내주식 누적 수익률은 107.37%에서 60.11%로 축소됐다. 같은 기간 코스피 지수가 8470선에서 6590선으로 22.2% 급락한 영향이다. 연초 이후 국민연금 수익률도 6월 27.22%에서 7월 14.84%로 내려앉았다.", "category": "운용·상품", "importance": 3, "source": "뉴시스", "published": "2026-10-04", "url": "https://www.newsis.com/view/NISX20261002_0003813049", "related": [{"title": "역대급 폭락에 국민연금도 울상...'롤러코스피' 리스크", "source": "YTN", "url": "https://www.ytn.co.kr/_ln/0103_202610040524028320"}]}, {"id": "65997f6263af", "title": "연금통장에 금리·현금 얹는다⋯은행권 '은퇴고객' 쟁탈전", "summary": "은행권이 연금 수령 고객을 끌어오기 위해 금리와 현금 혜택을 내걸고 있다. KB국민은행은 기본금리 연 0.1%에 최고 연 3.1%를 주는 'KB골든라이프연금통장'을 내놓고 'KB골든라이프연금예금'을 5000억원 한도로 재판매하며, 12개월 기준 연 3.50~3.70% 금리를 적용한다. 하나은행은 모바일 앱에 '공적연금 라운지' 전용 멤버십 서비스를 열고 신규 고객에게 최대 5만원 캐시백과 보험 무료 가입을 제공한다. Sh수협은행은 12월 31일까지 '4대 연금 환승' 이벤트로 최대 5만원 캐시백을 주고, 'Sh골든데이 연금통장'에 최고 연 3.2% 금리를 적용한다.", "category": "업계·경쟁사", "importance": 3, "source": "아이뉴스24", "published": "2026-10-04", "url": "http://www.inews24.com/view/2011611", "related": [{"title": "“최고 연 3.7%에 현금 5만원”⋯시중은행, 공적연금 유치전 후끈", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=148274"}]}, {"id": "3222e4df0aa6", "title": "[연금개혁] '골든타임' 놓치면 무용지물…국고 GDP 1% 지금 투입 땐 31년 연장, 고갈 후엔 1년뿐", "summary": "국회예산정책처 분석에 따르면 현행 제도가 유지될 경우 국민연금 기금은 2069년에 소진된다. 정부가 지금부터 매년 GDP의 1%를 투입하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥난 2069년부터 투입하면 1년만 연장된다. 기금 수익률을 2%포인트 높이면 2120년까지 흑자를 유지할 수 있다.", "category": "제도·규제", "importance": 3, "source": "CBC뉴스", "published": "2026-10-01", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=611066", "related": [{"title": "\"국민연금 수익률 2%p 높이면 2120년까지 기금 고갈 없어\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260929100600530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}]}, {"id": "b27545f630cf", "title": "퇴직연금 ETF 상품 108종 추가… 284종 라인업", "summary": "KB국민은행이 '2026 한국산업의 고객만족도(KCSI)' 퇴직연금(IRP) 부문에서 종합점수 84.2점으로 조사 대상 금융사 중 1위에 올랐다. 업계 평균 82.1점보다 2.1점, 2위 83.0점보다 1.2점 높은 점수다. 지난해 말 176종이던 퇴직연금 ETF 상품에 국내외 주식형·채권형·배당형·테마형 등 108종을 추가해 8월 기준 284종의 라인업을 갖췄고, 시중은행 최초로 'ETF 당일 매수·매도 시스템'을 신설했다. 금융감독원 통합연금포털 공시 기준 2026년 2분기 말 KB국민은행의 개인형 IRP 비원리금보장상품 1년 수익률은 52.96%를 기록했다.", "category": "업계·경쟁사", "importance": 3, "source": "동아일보", "published": "2026-09-30", "url": "https://www.donga.com/news/Economy/article/all/20260929/134750216/2", "related": [{"title": "KB국민은행, \"퇴직금 어디 맡길까\"…고객만족도 1위 비결은", "source": "매일경제", "url": "https://www.mk.co.kr/article/12163801"}]}, {"id": "00377454cb04", "title": "1억 넣으면 매달 167만원?…'월배당 ETF' 숫자의 함정", "summary": "국민연금연구원 제10차 국민노후보장패널조사에서 부부 기준 최소 노후 생활비는 월 217만원, 적정 노후 생활비는 월 297만원으로 조사됐다. 국민연금 수급자의 평균 수령액은 월 60만원 수준으로 부부가 함께 받아도 합산 120만~140만원에 그친다. 코스콤 ETF체크 기준 TIGER 배당커버드콜액티브의 연간 분배율은 20.88%, PLUS 고배당주위클리커버드콜은 24.13%로 시중은행 예금 금리의 4~7배 수준이다. 다만 기초지수가 20% 하락하면 분배율을 유지하더라도 주당 분배금이 줄어 원금과 분배금이 동시에 감소하는 위험이 있다.", "category": "운용·상품", "importance": 3, "source": "이코노미스트", "published": "2026-10-05", "url": "https://economist.co.kr/article/view/ecn202609290049", "related": []}, {"id": "99b7786d66ca", "title": "채권 믿다 발등 찍힌 글로벌 연기금, 금고에 금 5% 채워 방어선 쳤다", "summary": "세계금위원회가 2026년 10월 발표한 보고서에서 네덜란드·미국·영국·호주 연기금이 2020년부터 금 편입을 시작해 5년 이상 비중을 유지하고 있다고 밝혔다. 네덜란드 연기금 펜시온펀즈 피디엔은 운용자산 77억 유로 가운데 5%를 금에 배분했고, 미국 버지니아주 페어팩스 카운티 퇴직연금은 62억 달러 규모 자산의 약 3%를 금 선물로 채웠다. 영국 나우 펜션스 마스터 트러스트는 106억 달러 중 약 2%, 호주 엔지에스 슈퍼는 약 3%를 금에 배분했다. 국민연금은 기금 적립금의 80% 안팎을 국내외 주식과 채권에 집중 배치해 두고 있어 대체 자산 완충재가 부족하다는 지적이 제기된다.", "category": "법인·자금운용", "importance": 3, "source": "글로벌이코노믹", "published": "2026-10-05", "url": "https://www.g-enews.com/view.php?ud=202610041819317672fbbec65dfb_1", "related": []}, {"id": "cdc582858a12", "title": "당신도 노인 된다…韓고령자, OECD 상대빈곤율 '최고'", "summary": "국가데이터처가 1일 발표한 '2026 고령자 통계'에서 66세 이상 은퇴 연령층의 상대적 빈곤율은 2024년 기준 37.7%로 2.1%포인트 하락했지만, 2023년 기준 39.8%로 OECD 회원국 가운데 여전히 가장 높았다. 가구주가 65세 이상인 고령자 가구의 지난해 순자산액은 4억9279만원으로 2685만원 늘었다. 본인이나 배우자가 직접 생활비를 마련하는 고령자는 74.7%로 지난 2179500008?input=1195m", "related": []}, {"id": "93d1cd0d36bc", "title": "기초연금 '반쪽' 개편·국립대병원 첫 등판…복지부 국감 쟁점은", "summary": "국회 보건복지위원회는 7일과 8일 보건복지부와 질병관리청을 대상으로 국정감사를 실시하고, 14일 국민연금공단, 16일 국민건강보험공단과 건강보험심사평가원 국감을 거쳐 27일 종합감사로 마무리한다. 복지부가 지난달 내년도 예산안과 함께 내놓은 기초연금 개편안은 소득을 세 구간으로 나눠 소득 하위 30% 이하에 월 3만원을 더 주는 하후 차등 지급 방식인데, 수급 대상 기준을 손대는 상박이 빠져 반쪽짜리라는 지적을 받고 있다. 정은경 복지부 장관은 지난달 29일 연금개혁특별위원회에서 사회적 합의와 논의 시간이 부족해 기초연금 선정기준 개편까지 담기엔 한계가 있었다고 답했다. 국민연금 기금 고갈 전망에 따른 재정 안정성과 미래 세대 부담, 리밸런싱 유예 조치도 쟁점으로 거론된다.", "category": "제도·규제", "importance": 3, "source": "뉴시스", "published": "2026-10-04", "url": "https://www.newsis.com/view/NISX20261003_0003813472", "related": []}]}, "monthly": {"period": "monthly", "key": "current", "label": "2026-09-06 ~ 2026-10-05", "generated_at": "2026-10-06T16:37:36+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": [{"title": "퇴직연금 문 열린 개인용 국채…첫 선택은 10년물에 쏠렸다", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436449"}, {"title": "개인 퇴직연금 계좌 통해 장기국채 투자 길 열렸다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712685/2"}, {"title": "개인 국채투자, '퇴직연금서 투자'에 흥행…9월 청약서 초과 수요", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260917099600008"}, {"title": "\"1억 넣어두면 20년 뒤 2.6억\"…연금개미들 외면한 이유", "source": "한국경제", "url": "https://www.hankyung.com/article/202609168563i"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 확정 수익 60%\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/14/2  "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "1fc91cd9d139", "title": "리스크 관리·노후수입 한번에…주목받는 보증형 실적 배당보험", "summary": "미래에셋생명의 개인형 퇴직연금(IRP) 보증형 실적배당보험이 출시 후 717억원을 모집했다고 전했다. 이 상품은 IRP를 통해서만 가입할 수 있는 거치형으로, 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 연금 개시가 가능하다. 이미 만 55세를 넘긴 가입자는 가입과 동시에 연금을 받을 수 있고, 적립금이 소진될 때까지 20년 이상 연금을 수령할 수 있다. 적립금은 미래에셋생명의 일임형 자산배분펀드 MVP펀드를 통해 글로벌 자산에 분산투자된다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645584384&mediaCodeNo=257", "related": [{"title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024"}, {"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "3222e4df0aa6", "title": "[연금개혁] '골든타임' 놓치면 무용지물…국고 GDP 1% 지금 투입 땐 31년 연장, 고갈 후엔 1년뿐", "summary": "국회예산정책처 분석에 따르면 현행 제도가 유지될 경우 국민연금 기금은 2069년에 소진된다. 정부가 지금부터 매년 GDP의 1%를 투입하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥난 2069년부터 투입하면 1년만 연장된다. 기금 수익률을 2%포인트 높이면 2120년까지 흑자를 유지할 수 있다.", "category": "제도·규제", "importance": 3, "source": "CBC뉴스", "published": "2026-10-01", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=611066", "related": [{"title": "\"국민연금 수익률 2%p 높이면 2120년까지 기금 고갈 없어\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260929100600530?input=1195m"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": "2026-09-20", "url": "http://www.smarttimes.co.kr/news/articleView.html?idxno=49113", "related": [{"title": "잦은 이직에 끊기는 퇴직자산…사회복지인 전용 퇴직연금 논의 본격화", "source": "라이브뉴스", "url": "https://www.livesnews.com/news/article.html?no=64332"}]}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발생했으나 회수된 금액은 없다.", "category": "법인·자금운용", "importance": 3, "source": "시장경제신문", "published": "2026-09-16", "url": "https://www.meconomynews.com/news/articleView.html?idxno=201626", "related": [{"title": "홈플러스, 9개월간 임금체불 3871억…퇴직금도 미지급", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1690418/"}]}, {"id": "dd4beb88ba61", "title": "“4조 8천억 몰렸다”…S&P500으로 노후 준비? 이렇게 하세요 [잇슈 머니]", "summary": "국내에 상장된 S&P500 지수 상품 하나에 올해 들어 9월 28일까지 개인 자금 4조8611억원이 들어와 국내 ETF 가운데 1위를 기록했다. 연금저축과 개인형퇴직연금(IRP)은 둘을 합쳐 연 900만원까지 세액공제를 받고, 총급여 5500만원 이하 근로자는 공제율 16.5%가 적용돼 900만원을 넣으면 최 금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "1fc91cd9d139", "title": "리스크 관리·노후수입 한번에…주목받는 보증형 실적 배당보험", "summary": "미래에셋생명의 개인형 퇴직연금(IRP) 보증형 실적배당보험이 출시 후 717억원을 모집했다고 전했다. 이 상품은 IRP를 통해서만 가입할 수 있는 거치형으로, 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 연금 개시가 가능하다. 이미 만 55세를 넘긴 가입자는 가입과 동시에 연금을 받을 수 있고, 적립금이 소진될 때까지 20년 이상 연금을 수령할 수 있다. 적립금은 미래에셋생명의 일임형 자산배분펀드 MVP펀드를 통해 글로벌 자산에 분산투자된다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645584384&mediaCodeNo=257", "related": [{"title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024"}, {"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "3222e4df0aa6", "title": "[연금개혁] '골든타임' 놓치면 무용지물…국고 GDP 1% 지금 투입 땐 31년 연장, 고갈 후엔 1년뿐", "summary": "국회예산정책처 분석에 따르면 현행 제도가 유지될 경우 국민연금 기금은 2069년에 소진된다. 정부가 지금부터 매년 GDP의 1%를 투입하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥난 2069 "https://www.news2day.co.kr/article/20261005500012"}]}, {"id": "393d12b4dd32", "title": "퇴직연금 가입 대상 611만명 미가입...\"기금형 도입해 사각지대 줄여야\"", "summary": "국회 토론회에서 퇴직연금 가입 대상 1308만명 가운데 611만명이 미가입 상태이고, 전체 사업장 164만개 중 도입 사업장은 44만개(26.5%)에 그친다는 점이 지적됐다. 이재진 전국사무금융서비스노동조합 위원장은 계약형 구조 때문에 사각지대가 방치돼 왔다고 말했다. 기금형 퇴직연금을 금융기관형·연합형·공공형으로 나누는 방안이 논의되는 가운데 오건호 내가만드는복지국가 공동대표와 오종헌 국민연금지부 위원장은 국민연금공단의 참여 가능성과 전국적 인프라 활용을 제시했다. 남성욱 고용노동부 퇴직연금복지과장은 제도개편 대책을 곧 발표할 예정이라고 밝혔다.", "category": "제도·규제", "importance": 5, "source": "월요신문", "published": "2026-10-02", "url": "https://www.wolyo.co.kr/news/articleView.html?idxno=318567", "related": [{"title": "611만명 퇴직연금 사각지대 \"푸른씨앗 키워 포괄하자\"", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237050"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "93a3950c099e", "title": "\"반도체만 믿다간 큰일\" 직장인들 돌변하더니…'대이동' [김연지의 연금빌드업]", "summary": "미래에셋증권 집계로 올해 3분기 확정기여(DC)형·개인형퇴직연금(IRP) 계좌에서 순매수액이 가장 많았던 ETF는 'TIGER 미국S&P500'이었고 'TIGER 미국나스닥100'과 'KODEX 미국나스닥100', 'KODEX 미국S&P500'이 뒤를 이어 순매수 상위 1~4위가 모두 미국 대표지수 추종 상품으로 채워졌다. 2분기 순매수 1·2위는 'RISE 삼성전자SK하이닉스채권혼합50'과 'KODEX 삼성전자SK하이닉스채권혼합50'이었고 'SOL AI반도체TOP2플러스'와 'KODEX AI반도체TOP2플러스'가 3·4위에 올라 반도체 상품이 최상위권을 차지했다. 코스피는 3분기 첫 거래일인 7월 1일 8303.41에서 9월 30일 6838.04로 17.6% 하락했고, 3분기 일평균 거래대금은 34조6620억원으로 2분기 55조9269억원보다 38.0% 줄었다. 미국 대표지수 외에 'TIGER 미국배당다우존스'가 순매수 6위, 'TIGER TDF2045 적격'이 7위, 'KODEX 머니마켓액티브'가 8위, 'TIGER 배당커버드콜액티브'가 10위에 새로 진입했다.", "category": "운용·상품", "importance": 4, "source": "한국경제", "published": "2026-10-04", "url": "https://www.hankyung.com/article/2026100204986", "related": []}, {"id": "12a423aa5284", "title": "550조 퇴직연금, DC·IRP 시장 확대… 개인 자금 증권사 머니무브", "summary": "국내 퇴직연금 적립금이 550조원을 넘어선 가운데 보험업계의 성장세가 둔화된 것으로 나타났다. 2024년 10월 실물이전 서비스 시행 이후 올해 6월까지 약 15조8699억원이 이전되는 과정에서 보험업권은 1799억원이 순유출됐고 증권업권으로는 4조1513억원이 유입됐다. 보험업계 시장점유율은 지난해 말 21.1%에서 올해 상반기 19.4%로 내려가 처음으로 20%를 밑돌았다. 시장 구조가 확정급여형(DB)에서 확정기여형(DC)과 개인형퇴직연금(IRP) 중심으로 이동하고 있다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌이코노믹", "published": "2026-10-01", "url": "https://www.g-enews.com/view.php?ud=202609301417579233a6e8311f64_1", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
