<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퇴직연금 주요 이슈</title>
<style>
  /* ── 팔레트 ───────────────────────────────────────────────
     잉크 네이비 위에 차가운 석재 종이. 강조색은 적립·성장을 뜻하는
     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나. */
  :root {
    --ink: #101C33;
    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom: #D6341F;

    --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',
               'Malgun Gothic', system-ui, sans-serif;
    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #DCE2EC;
      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 어두운 바탕에서는 다홍이 탁해 보여 한 단계 밝게 쓴다. */
      --kiwoom: #FF7A63;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;
  }

  .slogan {
    margin: 0 0 0 auto;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom);
    white-space: nowrap;
  }

  .hero-date {
    font-family: var(--font-num);
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 오른쪽으로 갈수록 구간이 넓어지는 축 자체가
     탭 역할을 한다. 시야를 넓힌다는 사실을 폭으로 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;
  }

  .rail button {
    flex: 1 1 0;
    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:nth-child(1) { flex-grow: 1; }
  .rail button:nth-child(2) { flex-grow: 1.7; }
  .rail button:nth-child(3) { flex-grow: 2.6; }
  .rail button:nth-child(4) { flex-grow: 3.7; }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .range {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  /* ── 분야 필터 ─────────────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
  }

  .filters button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */
  .notice {
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */
  .list { margin: 8px 0 0; }

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);
  }

  article[data-cat="2"] .badge { color: var(--cat-2); }
  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

  details summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

를 전수 조사했다. NH투자증권이 비교 대상의 32개를 차지했으나 2년 평균 수익률은 36.92%로 대신증권 56.82%, KB증권 44.61%, 신한투자증권 43.71%보다 낮았다. 삼성증권과 비교하면 평균 최대손실폭(MDD)은 NH투자증권 -25.02%, 삼성증권 -25.89%로 0.87%포인트 차이에 그쳤지만 2년 평균 수익률은 삼성증권 80.13%에 43.21%포인트 뒤졌다. 'NH_DNA 퇴직연금_Quazire_P'는 최근 1년 수익률 -12.72%, 2년 수익률 -3.77%를 기록했다.", "category": "운용·상품", "importance": 3, "source": "그린포스트코리아", "published": "2026-09-16", "url": "https://www.greenpostkorea.co.kr/news/articleView.html?idxno=307463"}, {"id": "741ee51a2658", "title": "[신진영 칼럼] 국민연금 2,000조원 시대, 운용 원칙부터 바로 세워야", "summary": "신진영 연세대 경영대학 교수가 국민연금 기금운용위원회의 국내주식 목표비중 상향 결정을 짚었다. 기금위는 지난 5월 28일 2026년 국내주식 목표비중을 14.9%에서 20.8%로 조정하기로 의결했고, 6월 말 국내주식 평가액은 543.2조원으로 전체 기금의 29.1%였다. 같은 시점 기금 적립금은 1865.6조원, 국내주식 연초 이후 수익률은 107.37%, 전체 기금 수익률은 27.22%였다. 신 교수는 보유비중이 목표를 크게 넘어섰을 때 리밸런싱으로 비중을 낮추는 대신 목표비중 자체를 올린 것이 문제의 핵심이라며 장기간 유지할 수 있는 일관된 자산배분 원칙이 필요하다고 지적했다.", "category": "법인·자금운용", "importance": 3, "source": "아주경제", "published": "2026-09-16", "url": "https://www.ajunews.com/view/20260914141838275"}, {"id": "6e15a9465141", "title": "[흔들리는 국채 공식④] 퇴직연금에 국채 담을까…개인투자자의 새 셈법", "summary": "이달부터 확정기여형(DC)과 개인형퇴직연금(IRP) 계좌에서 개인투자용 국채 10년물과 20년물에 직접 투자할 수 있게 됐고, 적립금 운용을 개인이 결정하지 않는 확정급여형(DB)은 대상에서 제외된다. 이달 개인투자용 국채 발행 규모는 총 2300억원으로 퇴직연금 편입 수요를 반영해 전월보다 800억원 늘었으며, 이 중 10년물이 1100억원, 20년물이 650억원이다. 10년물은 표면금리 연 4.415%에 가산금리 0.35%, 20년물은 표면금리 연 4.570%에 가산금리 0.35%가 적용되며 만기 보유 시 세전 만기 수익률은 각각 약 59.3%와 약 161.3%다. 개인투자용 국채는 DC·IRP의 위험자산 투자한도 70%에 포함되지 않아 나머지 30%를 채우는 선택지가 되지만, 매입 1년 후 중도환매 시 가산금리와 복리 혜택이 사라지고 표면금리 기준 단리 이자만 지급된다.", "category": "운용·상품", "importance": 3, "source": "연합인포맥스", "published": "2026-09-16", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4435180"}, {"id": "ef329f0736d9", "title": "[필드뒷얘기] 퇴직연금 국채로 고객 묶는 증권사", "summary": "증권사들이 퇴직연금 전용 개인투자용 국채 판매에 나서는 이유가 판매 수수료가 아니라 고객 유지 효과에 있다고 대한금융신문이 전했다. 현재 한국투자증권, 미래에셋증권, NH투자증권, KB증권, 삼성증권 등 5개사가 이 상품을 취급한다. 20년물은 표면금리 4.920%로, 1억원을 투자해 만기까지 보유하면 약 2억6133만원을 받는다. 보유자는 타사로 실물이전을 신청할 수 없고 중도환매하면 가산금리와 연복리 혜택을 잃으며 환매 신청은 발행 1년 후부터 월간 한도 내에서만 가능해, 증권사는 최장 20년간 고객 자산을 묶어둘 수 있다.", "category": "업계·경쟁사", "importance": 3, "source": "대한금융신문", "published": "2026-09-16", "url": "https://www.kbanker.co.kr/news/articleView.html?idxno=225952"}, {"id": "034a5ea2ac70", "title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "summary": "전국삼성전자노동조합이 경영성과급을 현금 대신 확정기여형(DC) 퇴직연금이나 IRP 계좌로 적립할 수 있는 선택권 제도의 도입을 요구했다. 연간 총급여 2억원인 직원이 성과급 1억원을 현금으로 받으면 약 4100만원의 추가 세금이 발생하지만, 경영성과급을 DC로 적립하면 그해 근로소득에 포함되지 않는다. SK하이닉스는 올해부터 초과이익분배금 일부를 경영성과급 DC 계좌에 적립하도록 했고 약 3만명이 참여해 약 1조원이 이동했다. 다만 현행 세법상 근로자가 매년 적립률을 자유롭게 바꿀 수는 없다.", "category": "법인·자금운용", "importance": 3, "source": "비즈한국", "published": "2026-09-16", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발생했으나 회수된 금액은 없다.", "category": "법인·자금운용", "importance": 3, "source": "시장경제신문", "published": "2026-09-16", "url": "https://www.meconomynews.com/news/articleView.html?idxno=201626"}, {"id": "5e29bf9dea40", "title": "[신한자산운용 TDF 약진] 디폴트옵션 훈풍…'톱3' 진입 정조준", "summary": "고용노동부 자료 기준 지난해 말 디폴트옵션 적립금은 53조3000억원으로 전체 DC·IRP 적립금의 19.56%를 차지했고 지정 가입자는 734만명이다. 원리금보장 중심의 안정형 비중은 지난해 말 85.4%에서 올해 6월 말 82.5%로 3%포인트 가까이 내렸다. 올해 디폴트옵션 상품의 1년 수익률은 초저위험형이 평균 2.6%, 적극투자형이 14.9%로 격차가 12%포인트를 넘는다. 신한자산운용의 신한마음편한적격TDF와 신한빠른대응적격TDF 합산 수탁고는 이달 7일 2조원을 넘어섰고, 14개 이상의 디폴트옵션 포트폴리오에 편입돼 업계 4위에서 톱3 진입을 노리고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "더벨", "published": "2026-09-16", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609140845593220105020"}, {"id": "ab894d0c4867", "title": "[금융 HOT 뉴스] KB자산운용, 골드 특별자산 펀드 눈길", "summary": "KB자산운용이 골드 특별자산 펀드의 운용 구조를 파생상품 중심에서 국내외 금 ETF 활용 방식으로 바꿨다. 파생상품 위험평가액을 40% 이하로 낮춰 퇴직연금 적격 요건을 충족했고 운용보수는 기존 대비 약 40% 인하했다. 비교지수는 LBMA Gold PM Price로 변경했고 환매대금은 4영업일 내에 지급한다. 현재 국민은행과 신한투자증권의 퇴직연금 계좌에서 매매할 수 있다.", "category": "운용·상품", "importance": 2, "source": "비즈월드", "published": "2026-09-16", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146330"}, {"id": "8f23422ab9c5", "title": "반도체 호황에 정부 곳간 넘쳐도... 2027년 예산안의 참담한 실상", "summary": "2027년 예산안에서 국세수입이 390조원에서 584조원으로 약 50% 늘었지만 복지지출 증가율은 9.4%로 총지출 증가율 12.8%에 못 미쳤다. 공적연금 지출은 6조4000억원 늘었는데 국민연금 급여가 5조원, 공무원연금이 1조3000억원을 차지했다. 필자는 이 증가가 고령화와 물가에 따라 자동으로 발생하는 것이지 정책적 선택이 아니라고 지적했다. 기초연금은 소득에 따라 세 구간으로 나누는 방식으로 바뀌었으나 기초연금과 생계급여를 함께 받는 최빈곤 노인은 실질 소득 증가가 거의 없다고 짚었다.", "category": "가입자·사회", "importance": 2, "source": "오마이뉴스", "published": "2026-09-16", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003267428"}, {"id": "18b7f1c42697", "title": "'1대1 맞춤 컨설팅' 늘리는 하나은행…퇴직연금 락인 승부수", "summary": "하나은행이 지난 15일 하나금융그룹 명동사옥에서 퇴직연금 손님을 대상으로 맞춤형 연금자산관리 세미나를 열었다고 16일 밝혔다. 시황과 상품 정보만 전달하던 일방향 세미나에서 벗어나 연금 전문가가 직접 참여하는 1대1 맞춤 상담부스를 전면에 배치했다. 프로그램은 퇴직연금 활용 절세 전략, 국민연금 구조 이해, 개인별 맞춤형 연금 상품 운용, 국내외 시장 전망 및 투자 전략으로 구성됐다. 하나은행은 '연금 더드림 라운지'와 '찾아가는 연금 컨설턴트' 등 전문 인력 중심 채널을 계속 확장할 방침이다.", "category": "업계·경쟁사", "importance": 2, "source": "글로벌에픽", "published": "2026-09-16", "url": "http://www.globalepic.co.kr/view.php?ud=2026091608520419827cc35ccc5c_29"}, {"id": "35ea1d0ee628", "title": "전진숙 의원, '19세 이후 5년'... 복수국적자 기초연금 문턱 높였다", "summary": "전진숙 더불어민주당 의원이 대표발의한 기초연금법 일부개정법률안의 복수국적자 국내 거주기간 요건 신설안이 지난 15일 국회 보건복지위원회 법안심사소위원회를 통과했다. 소위는 병합 심사를 거쳐 국내 거주기간 기준을 '19세 이후 5년 이상'으로 조정해 대안 의결했다. 복수국적을 유지한 채 기초연금을 받는 인원은 2021년 3616명에서 2025년 8176명으로 늘었고 지급액도 118억원에서 314억원으로 증가했다. 전 의원은 기초연금이 노후소득 보장 역할을 수행할 수 있도록 입법 개혁을 이어가겠다고 밝혔다.", "category": "제도·규제", "importance": 2, "source": "뉴스워커", "published": "2026-09-16", "url": "https://www.newsworker.co.kr/news/articleView.html?idxno=504520"}, {"id": "81d649ae07bd", "title": "[국민연금 노후설계⑫] \"은퇴 후, 편하게 안부 물을 사람이 있나요?\"", "summary": "국민연금공단 노후준비서비스팀 홍지희 상담사와의 인터뷰로 은퇴 후 대인관계 준비를 다뤘다. 혼자 사는 것과 사회적 고립을 구분해야 하며 은퇴 후에는 대화 방식도 달라져야 한다고 했다. 중앙노후준비지원센터는 기본 9개 문항과 선택 문항 1개로 대인관계를 진단한다. 부부 사이에도 적절한 거리감을 유지하라고 조언했다.", "category": "가입자·사회", "importance": 1, "source": "브라보마이라이프", "published": "2026-09-16", "url": "https://bravo.etoday.co.kr/view/atc_view/20029"}]}, "weekly": {"period": "weekly", "key": "2026-W38", "label": "2026-W38 (2026-09-14 ~ 2026-09-20)", "generated_at": "2026-09-16T13:38:56+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "26bad6a1c84a", "title": "이형일 \"500조 규모 퇴직연금, 수익률 저조…법안 준비 중\"", "summary": "이형일 부총리 겸 재정경제부 장관 후보자가 9월 15일 국회 재정경제기획위원회 인사청문회에서 퇴직연금 제도 개선과 관련해 노사정이 합의한 사항을 바탕으로 법안을 준비하고 있다고 밝혔다. 이 후보자는 퇴직연금 적립금이 500조원까지 올라갔는데 수익률이 저조하다며 노후소득 보장 기능이 제대로 작동하고 있느냐는 논의가 많다고 말했다. 노사정은 지난 2월 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화에 합의했고, 정부는 이를 바탕으로 연내 근로자퇴직급여보장법 개정을 추진하고 있다. 이광재 의원이 미국 401(k)를 거론하며 국가적 시스템이 필요하다고 지적한 데 대한 답변이다.", "category": "제도·규제", "importance": 5, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/economy/trend/6290971", "related": []}, {"id": "8977649855f9", "title": "표류하는 기금형 퇴직연금…간담회 또 연기", "summary": "고용노동부와 금융감독원이 공동 주재하는 퇴직연금사업자 간담회가 9월 2일에서 10월 2일로 재차 연기됐다. 한 달 새 두 번째 순연으로, 간담회는 10월 2일 오후 2시부터 3시 30분까지 서울 로얄호텔에서 김영훈 고용노동부 장관과 이찬진 금융감독원장이 함께 주재한다. 국민연금공단의 기금형 퇴직연금 참여 여부, 수탁법인 인가 대상을 5~8개로 제한하는 방안을 둘러싼 독점 우려, 손해배상 책임 강화 방침이 쟁점으로 남아 있다. 연내 근로자퇴직급여보장법 개정안 통과 목표의 재조정이 불가피하다는 관측이 나온다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-09-14", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": []}, {"id": "ffde5c86587a", "title": "'공시 넘어 사후관리'…디폴트옵션 3년, 최초 평가 시동", "summary": "고용노동부가 올해 디폴트옵션 승인 상품에 대한 첫 정기 평가를 실시한다. 2023년 7월 본격 시행된 디폴트옵션은 올해 3월 기준 41개 금융기관이 324개 상품을 승인받아 운용 중이며, 최초 승인 이후 3년이 지난 상품이 평가 대상으로 장기 성과 수익률과 위험 관리 등을 본다. 고용노동부는 첫 평가인 만큼 성과 저조 사유를 파악하고 개선 방안을 마련하는 데 핵심 의의를 두되, 문제가 지속되는 상품에는 불이익을 부여할 계획이다. 5월에 선정한 정책연구용역은 내년 2월까지 진행된다.", "category": "제도·규제", "importance": 5, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140567806179ad43907_18", "related": []}, {"id": "f47b64e3cece", "title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 확정 수익 60%\"", "summary": "이번 달부터 개인형(IRP)과 확정기여형(DC) 퇴직연금 계좌에서 10년물·20년물 개인투자용 국채를 매입할 수 있게 됐다. 10년물 금리는 현재 4.765%로 만기까지 보유하면 수익률이 59.3%, 20년물은 161.3%에 달한다. 국채 전용계좌로 투자하면 이자 수익의 15.4%를 세금으로 내지만 퇴직연금에서는 만기 전까지 과세가 되지 않고 55세 이후 연금으로 받으면 3.5~5.5%의 연금소득세만 내며, 연말정산 때 연금저축과 합쳐 최대 148만 5000원을 세액공제받을 수 있다. 청약 수요가 발행 한도를 넘기면 1인당 300만 원까지 일괄 배정되고 남은 물량은 청약액에 비례해 배분되며, 신청은 화요일까지 시중은행 3곳과 증권사 5곳에서 받는다.", "category": "운용·상품", "importance": 4, "source": "TV조선", "published": "2026-09-14", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/14/2026091490036.html", "related": [{"title": "[흔들리는 국채 공식④] 퇴직연금에 국채 담을까…개인투자자의 새 셈법", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4435180"}, {"title": "[필드뒷얘기] 퇴직연금 국채로 고객 묶는 증권사", "source": "대한금융신문", "url": "https://www.kbanker.co.kr/news/articleView.html?idxno=225952"}, {"title": "퇴직연금 계좌로 국채 투자하면 포인트 제공", "source": "서울신문", "url": "https://www.seoul.co.kr/news/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장 no=54796", "related": [{"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "3e7b688f1601", "title": "[기획] \"주식 옮기면 현금 드려요\"…증권사 '자산뺏기' 소리없는 전쟁", "summary": "증권사들이 국내주식을 옮겨오는 고객에게 현금과 주식쿠폰을 주는 경쟁을 벌이고 있다. 다올투자증권이 최대 1500만원, 한국투자증권이 421만원, KB증권이 400만원을 내걸었으나 입고액·거래실적·잔고 유지기간 조건에 따라 실수령액은 크게 달라진다. 다올에서 1억원을 입고하고 3개월간 조건을 유지하면 총 15만원을 받는다. 퇴직연금 실물이전 제도가 시행된 2024년 10월 말부터 올해 6월 말까지 증권사에서 다른 증권사로 이동한 적립금은 2조6061억원에 달했다.", "category": "업계·경쟁사", "importance": 3, "source": "오늘경제", "published": "2026-09-16", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813204", "related": []}, {"id": "cfbe257f3637", "title": "\"수익률 60%\"라더니… NH투자증권 'AI 퇴직연금', 일부는 2년간 손실", "summary": "그린포스트코리아가 코스콤 로보어드바이저 테스트베드에 공시된 적극투자형 퇴직연금 상품 가운데 최근 2년 수익률이 산출되는 42개를 전수 조사했다. NH투자증권이 비교 대상의 32개를 차지했으나 2년 평균 수익률은 36.92%로 대신증권 56.82%, KB증권 44.61%, 신한투자증권 43.71%보다 낮았다. 삼성증권과 비교하면 평균 최대손실폭(MDD)은 NH투자증권 -25.02%, 삼성증권 -25.89%로 0.87%포인트 차이에 그쳤지만 2년 평균 수익률은 삼성증권 80.13%에 43.21%포인트 뒤졌다. 'NH_DNA 퇴직연금_Quazire_P'는 최근 1년 수익률 -12.72%, 2년 수익률 -3.77%를 기록했다.", "category": "운용·상품", "importance": 3, "source": "그린포스트코리아", "published": "2026-09-16", "url": "https://www.greenpostkorea.co.kr/news/articleView.html?idxno=307463", "related": []}, {"id": "741ee51a2658", "title": "[신진영 칼럼] 국민연금 2,000조원 시대, 운용 원칙부터 바로 세워야", "summary": "신진영 연세대 경영대학 교수가 국민연금 기금운용위원회의 국내주식 목표비중 상향 결정을 짚었다. 기금위는 지난 5월 28일 2026년 국내주식 목표비중을 14.9%에서 20.8%로 조정하기로 의결했고, 6월 말 국내주식 평가액은 543.2조원으로 전체 기금의 29.1%였다. 같은 시점 기금 적립금은 1865.6조원, 국내주식 연초 이후 수익률은 107.37%, 전체 기금 수익률은 27.22%였다. 신 교수는 보유비중이 목표를 크게 넘어섰을 때 리밸런싱으로 비중을 낮추는 대신 목표비중 자체를 올린 것이 문제의 핵심이라며 장기간 유지할 수 있는 일관된 자산배분 원칙이 필요하다고 지적했다.", "category": "법인·자금운용", "importance": 3, "source": "아주경제", "published": "2026-09-16", "url": "https://www.ajunews.com/view/20260914141838275", "related": []}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발생했으나 회수된 금액은 없다.", "category": "법인·자금운용", "importance": 3, "source": "시장경제신문", "published": "2026-09-16", "url": "https://www.meconomynews.com/news/articleView.html?idxno=201626", "related": []}, {"id": "5e29bf9dea40", "title": "[신한자산운용 TDF 약진] 디폴트옵션 훈풍…'톱3' 진입 정조준", "summary": "고용노동부 자료 기준 지난해 말 디폴트옵션 적립금은 53조3000억원으로 전체 DC·IRP 적립금의 19.56%를 차지했고 지정 가입자는 734만명이다. 원리금보장 중심의 안정형 비중은 지난해 말 85.4%에서 올해 6월 말 82.5%로 3%포인트 가까이 내렸다. 올해 디폴트옵션 상품의 1년 수익률은 초저위험형이 평균 2.6%, 적극투자형이 14.9%로 격차가 12%포인트를 넘는다. 신한자산운용의 신한마음편한적격TDF와 신한빠른대응적격TDF 합산 수탁고는 이달 7일 2조원을 넘어섰고, 14개 이상의 디폴트옵션 포트폴리오에 편입돼 업계 4위에서 톱3 진입을 노리고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "더벨", "published": "2026-09-16", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609140845593220105020", "related": []}, {"id": "704cabe4ab05", "title": "수익률 경쟁: \"호주의 실험, 시장이 연금을 키우다\"[김병철의 퇴직연금 개혁 시나리오]15", "summary": "호주는 1983년 강제 적립률을 도입해 1992년 법제화했고, 적립률은 3%에서 출발해 2025년 7월 12%까지 단계적으로 올랐다. 호주 퇴직연금 시장은 은행·보험사가 운영하는 영리 기금, 노조와 고용주 협회가 함께 운영하는 산업 기금, 개별 기업이 운영하는 기업 기금으로 나뉘며 기업 기금의 점유율은 2% 미만이다. 산업 기금이 높은 수익률로 시장을 주도하자 영리 기금은 수수료를 낮추고 서비스를 혁신하며 대응했다. 성과 테스트(YFYS)는 미달 기금이 가입자에게 통지하도록 하고 2년 연속 실패하면 신규 가입을 막는데, 한국은 수익률이 아니라 기업과의 영업 관계로 경쟁한다는 점이 문제로 지적됐다.", "category": "제도·규제", "importance": 3, "source": "이데일리", "published": "2026-09-15", "url": "https://www.edaily.co.kr/News/Read?newsId=02115606645580448&mediaCodeNo=257", "related": []}, {"id": "c25d124f4f43", "title": "[민주영의 마켓 나우] 퇴직연금, '은퇴 후 디폴트옵션'이 필요하다", "summary": "민주영 신영증권 연금사업부 상무는 국내 퇴직연금에 적립 단계의 디폴트옵션은 있지만 은퇴 이후에는 디폴트옵션이 없다고 지적했다. 퇴직급여를 개인형 퇴직연금(IRP)으로 받는 순간부터 자산 배분과 인출액, 국민연금 수령 전 소득 공백까지 개인이 모두 결정해야 한다. 그는 단기 생활비는 현금성 자산, 중기 자금은 채권, 장기 자금은 주식에 나눠 두고 순차적으로 생활비 계정으로 옮기는 방식으로 운용과 인출을 하나의 시스템으로 설계하자고 제안했다. 호주는 사업자에게 은퇴소득 지원 전략을 의무화한 은퇴소득계약(RIC)을 도입했고, 미국도 401(k) 자산을 평생소득으로 전환하는 방안을 주요 과제로 다루고 있다.", "category": "가입자·사회", "importance": 3, "source": "중앙일보", "published": "2026-09-15", "url": "https://www.joongang.co.kr/article/25461808", "related": []}, {"id": "570ffdd57037", "title": "미래에셋증권, 공기업 대상 퇴직연금 세미나 성료", "summary": "미래에셋증권이 3주간 세 차례에 걸쳐 공기업 대상 퇴직연금 세미나를 열어 전국 84개 기관에서 약 250명이 참여했으며 마지막 일정은 9월 11일이었다. 세미나는 퇴직연금 의무화와 기금화, 머니무브 등 시장 변화에 대비하는 내용으로 공기업의 재무·비계량 분야와 총 인건비, 경영 현안을 다뤘다. 미래에셋증권의 2026년 2분기 퇴직연금 적립금은 9조5799억원 늘어 퇴직연금 사업자 42개 가운데 증가액이 가장 컸다. 이 증가분은 전체 퇴직연금 적립금 증가분의 약 21%에 해당한다.", "category": "법인·자금운용", "importance": 3, "source": "비즈월드", "published": "2026-09-15", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146199", "related": []}]}, "monthly": {"period": "monthly", "key": "2026-09", "label": "2026년 9월", "generated_at": "2026-09-16T13:38:57+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": [{"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 확정 수익 60%\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/14/2026091490036.html"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 60% 확정 수익\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/13/2026091390109.html"}, {"title": "“20년 묻어두면 수익률 161%”…퇴직연금 국채, 증권사 유치전 불붙었다", "source": "디지털데일리", "url": "https://www.ddaily.co.kr/page/view/2026091010295983047"}, {"title": "“예금 이자론 성 안 차”…은행 퇴직연금, 국채 품고 반격할까", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1688375/"}, {"title": "[흔들리는 국채 공식④] 퇴직연금에 국채 담을까…개인투자자의 새 셈법", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4435180"}, {"title": "[필드뒷얘기] 퇴직연금 국채로 고객 묶는 증권사", "source": "대한금융신문", "url": "https://www.kbanker.co.kr/news/articleView.html?idxno=225952"}, {"title": "\"월급 끊겨도 매달 400만원 들어옵니다\"…은퇴 앞둔 직장인이 알아야 할 자산", "source": "매일경제", "url": "https://www.mk.co.kr/article/12151487"}, {"title": "개인투자용 국채 품은 퇴직연금 계좌···증권사, 연금자금 유치전", "source": "서울파이낸스", "url": "https://www.seoulfn.com/news/articleView.html?idxno=637698"}, {"title": "퇴직연금 계좌로 국채 투자하면 포인트 제공", "source": "서울신문", "url": "https://www.seoul.co.kr/news/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}, {"title": "[금상소] IRP·DC에 들어온 개인투자용 국채…10년·20년물 뭐가 나을까", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2624549"}]}, {"id": "8977649855f9", "title": "표류하는 기금형 퇴직연금…간담회 또 연기", "summary": "고용노동부와 금융감독원이 공동 주재하는 퇴직연금사업자 간담회가 9월 2일에서 10월 2일로 재차 연기됐다. 한 달 새 두 번째 순연으로, 간담회는 10월 2일 오후 2시부터 3시 30분까지 서울 로얄호텔에서 김영훈 고용노동부 장관과 이찬진 금융감독원장이 함께 주재한다. 국민연금공단의 기금형 퇴직연금 참여 여부, 수탁법인 인가 대상을 5~8개로 제한하는 방안을 둘러싼 독점 우려, 손해배상 책임 강화 방침이 쟁점으로 남아 있다. 연내 근로자퇴직급여보장법 개정안 통과 목표의 재조정이 불가피하다는 관측이 나온다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-09-14", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": [{"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 r/news/view/2624549"}]}, {"id": "8977649855f9", "title": "표류하는 기금형 퇴직연금…간담회 또 연기", "summary": "고용노동부와 금융감독원이 공동 주재하는 퇴직연금사업자 간담회가 9월 2일에서 10월 2일로 재차 연기됐다. 한 달 새 두 번째 순연으로, 간담회는 10월 2일 오후 2시부터 3시 30분까지 서울 로얄호텔에서 김영훈 고용노동부 장관과 이찬진 금융감독원장이 함께 주재한다. 국민연금공단의 기금형 퇴직연금 참여 여부, 수탁법인 인가 대상을 5~8개로 제한하는 방안을 둘러싼 독점 우려, 손해배상 책임 강화 방침이 쟁점으로 남아 있다. 연내 근로자퇴직급여보장법 개정안 통과 목표의 재조정이 불가피하다는 관측이 나온다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-09-14", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": [{"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "f8e6de7fbf89", "title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "summary": "정부가 2026년 9월 1일 발표한 기초연금 개편안은 수급 대상인 소득 하위 70%를 셋으로 나눠 하위 30%는 월 38만원, 30~45%는 35만9000원으로 올리고 45~70%는 35만원으로 묶는 내용이다. 필자인 남찬섭 동아대 교수는 충분한 사회적 논의 없이 발표됐고 기초연금을 노인 70%의 빈곤 예방 장치가 아니라 빈곤 구제 수단으로 다뤘다고 비판했다. '하후상박'을 내세웠지만 실제로 인상 혜택을 보는 수급자는 약 40%에 그치고 하위 7%는 기초생활보장 급여가 깎여 상쇄된다고 지적했다. 대안으로는 모든 노인에게 지급하고 과세하는 노인 기본소득을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "슬로우뉴스", "published": "2026-09-15", "url": "https://slownews.kr/166386", "related": [{"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}]}, {"id": "a5e7a7fba12f", "title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "summary": "NH농협은행이 퇴직연금 계좌에 개인투자용국채를 도입하고 ETF 라인업을 확대한다고 밝혔다. 7월에 22종을 내놓은 데 이어 10월에 36개를 추가한다. 전문가 포트폴리오 서비스의 2026년 상반기 수익률은 공격투자형 기준 40.11%를 기록했다. 금융감독원 통합연금포털 기준 원리금비보장형 수익률에서 3분기 연속 5대 시중은행 중 1위에 올랐다.", "category": "업계·경쟁사", "importance": 3, "source": "퍼블릭타임스", "published": "2026-09-16", "url": "https://www.public25.com/news/articleView.html?idxno=54796", "related": [{"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "ab894d0c4867", "title": "[금융 HOT 뉴스] KB자산운용, 골드 특별자산 펀드 눈길", "summary": "KB자산운용이 골드 특별자산 펀드의 운용 구조를 파생상품 중심에서 국내외 금 ETF 활용 방식으로 바꿨다. 파생상품 위험평가액을 40% 이하로 낮춰 퇴직연금 적격 요건을 충족했고 운용보수는 기존 대비 약 40% 인하했다. 비교지수는 LBMA Gold PM Price로 변경했고 환매대금은 4영업일 내에 지급한다. 현재 국민은행과 신한투자증권의 퇴직연금 계좌에서 매매할 수 있다.", "category": "운용·상품", "importance": 2, "source": "비즈월드", "published": "2026-09-16", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146330", "related": [{"title": "KB자산운용, 18년 된 금 펀드 손질…퇴직연금서도 투자", "source": "AP신문", "url": "https://www.apnews.kr/news/articleView.html?idxno=3051270"}]}, {"id": "26bad6a1c84a", "title": "이형일 \"500조 규모 퇴직연금, 수익률 저조…법안 준비 중\"", "summary": "이형일 부총리 겸 재정경제부 장관 후보자가 9월 15일 국회 재정경제기획위원회 인사청문회에서 퇴직연금 제도 개선과 관련해 노사정이 합의한 사항을 바탕으로 법안을 준비하고 있다고 밝혔다. 이 후보자는 퇴직연금 적립금이 500조원까지 올라갔는데 수익률이 저조하다며 노후소득 보장 기능이 제대로 작동하고 있느냐는 논의가 많다고 말했다. 노사정은 지난 2월 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화에 합의했고, 정부는 이를 바탕으로 연내 근로자퇴직급여보장법 개정을 추진하고 있다. 이광재 의원이 미국 401(k)를 거론하며 국가적 시스템이 필요하다고 지적한 데 대한 답변이다.", "category": "제도·규제", "importance": 5, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/economy/trend/6290971", "related": []}, {"id": "ffde5c86587a", "title": "'공시 넘어 사후관리'…디폴트옵션 3년, 최초 평가 시동", "summary": "고용노동부가 올해 디폴트옵션 승인 상품에 대한 첫 정기 평가를 실시한다. 2023년 7월 본격 시행된 디폴트옵션은 올해 3월 기준 41개 금융기관이 324개 상품을 승인받아 운용 중이며, 최초 승인 이후 3년이 지난 상품이 평가 대상으로 장기 성과 수익률과 위험 관리 등을 본다. 고용노동부는 첫 평가인 만큼 성과 저조 사유를 파악하고 개선 방안을 마련하는 데 핵심 의의를 두되, 문제가 지속되는 상품에는 불이익을 부여할 계획이다. 5월에 선정한 정책연구용역은 내년 2월까지 진행된다.", "category": "제도·규제", "importance": 5, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140567806179ad43907_18", "related": []}, {"id": "69dd458f15f4", "title": "퇴직연금 550조 커졌는데…보험사 점유율 20% 무너졌다", "summary": "퇴직연금 시장이 553조원대로 커지는 사이 보험업계 점유율이 20% 아래로 떨어졌다. 상반기 증권사는 4조1000억원 순유입을 기록한 반면 보험사는 1799억원 순유출을 냈다. 실물이전 확대로 가입자가 금융사를 옮기기 쉬워지면서 사업자 간 경쟁이 격화된 결과다. DB형에 집중된 포트폴리오가 약점으로 지목되자 삼성·한화·교보생명 등이 DC형·IRP 강화와 ETF 상품 확대로 대응하고 있다.", "category": "업계·경쟁사", "importance": 5, "source": "뉴데일리", "published": "2026-09-10", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/10/2026091000173.html", "related": []}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후 ": "노사정과 전문가가 참여한 정책 토론회에서 기금형 퇴직연금 도입 방향이 논의됐다. 전문가들은 운용 주체의 책임을 결과가 아닌 과정, 즉 의사결정 절차의 적정성으로 전환해야 한다고 주장했다. 경영계는 중소기업 부담을 이유로 사외적립 의무화의 단계적 시행을 요구했다. 한국노총과 한국경영자총협회, 고용노동부, 한국투자증권 관계자가 참석했다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-04-08", "url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=04598566645414152", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  function render() {
    var doc = DATA.periods[currentPeriod];

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      button.setAttribute('aria-selected', String(PERIODS[index].key === currentPeriod));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    listEl.textContent = '';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
