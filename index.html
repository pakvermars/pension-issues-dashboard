  body {

    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야

  .topline { height: 4px; background: var(--kiwoom-deep); }

  .masthead {

    font-weight: 700;

  }

  }

터치’로 승부” [퇴직연금 542조 대격변 4-②]", "summary": "김승균 하나증권 연금사업단장은 인터뷰에서 외형 확대보다 고객 노후자산을 안정적으로 불리는 데 집중해 왔다고 밝혔다. 하나증권은 3분기 기준 DC형 원리금비보장상품의 5년·7년·10년 수익률에서 모두 증권업계 1위를 기록했다. 김 단장은 퇴직연금 시장의 중심축이 DB형에서 DC형·IRP로, 저축에서 투자로, 적립에서 인출로 이동하고 있으며 계약형 제도도 기금형으로 변화하는 흐름에 주목한다고 말했다. 전체 퇴직연금에서 DC형·IRP 적립금은 2020년 말 100조원에서 올해 3분기 321조원으로 늘었다.", "category": "업계·경쟁사", "importance": 3, "source": "이투데이", "published": "2026-11-19", "url": "https://www.etoday.co.kr/news/view/2649924"}, {"id": "d28bb68de197", "title": "日전문가가 짚은 퇴직연금 개혁 방향…“과감히 대수술하고 단순화해야”", "summary": "오에 카요 일본 확정거출연금교육협회 이사는 복잡한 절차와 규칙이 연금 확산을 가로막고 있다며 제도를 과감히 손보고 단순화해야 한다고 말했다. 그는 중소기업 근로자의 가입을 늘리고 적립금을 은퇴 후 안정적 생활비로 연결하는 데 제도 개선의 초점을 맞춰야 한다고 강조했다. 일본은 다음 달부터 iDeCo 가입 가능 연령을 65세 미만에서 70세 미만으로 넓히고, 기업연금이 없는 회사원의 월 납입 한도를 2만3000엔에서 6만2000엔으로 올린다. 오에 이사는 한국이 사업주에게 퇴직연금제도 도입 책임을 부여한 점을 눈여겨봤다고 밝혔다.", "category": "제도·규제", "importance": 3, "source": "서울경제", "published": "2026-11-19", "url": "https://www.sedaily.com/article/20116017"}, {"id": "037710a93e1c", "title": "[퇴직연금 긴급점검] 6년 반 만에 적립금 감소…9월말 기준 3개월만에 11.7조 줄어", "summary": "금융감독원에 따르면 올해 3분기 말 전체 퇴직연금 적립금은 542조1214억원으로 6월 말 대비 11조7565억원(2.1%) 줄었다. 분기 기준 감소세로 돌아선 것은 2020년 1분기 이후 처음이다. 주요 증권사 11곳의 DC형 원리금비보장 누적 수익률은 석 달 만에 52.85%에서 14.46%로 급감했다. 실물이전 누적액은 15조9000억원에 달하며 증권사는 MTS 개편과 PB 조직 강화에, 은행권은 수수료 할인율 상향에 나서고 있다.", "category": "운용·상품", "importance": 3, "source": "대한경제", "published": "2026-11-19", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202611181327078600627"}, {"id": "bbc3464e1c1d", "title": "[퇴직연금 긴급점검] 증시 급락에 DC형 전환가입자 울상…석 달 새 수익률 38%p 뚝", "summary": "올해 1~7월 DB형에서 DC형으로 전환한 가입자는 34만156명으로 전년 동기 대비 118.1% 늘었고, 6~7월에만 14만9710명이 전환했다. 코스피가 6월 22일 고점 대비 45.48% 급락하면서 3분기 DC형 원리금비보장 평균 수익률은 전 분기 55.47%에서 19.97%로 축소됐다. 증권사 11곳의 DC형 원리금비보장 누적 수익률은 52.85%에서 14.46%로 38.39%p 내렸고, 한국투자증권 13.59%, 미래에셋증권 13.88%, 삼성증권 14.72% 등 대형 증권사가 10%대로 내려앉았다. DB형 수익률은 11.35%에서 3.86%로 7.49%p 내리는 데 그쳤다.", "category": "운용·상품", "importance": 3, "source": "대한경제", "published": "2026-11-19", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202611181333322330630"}, {"id": "f90cfa9541cf", "title": "[퇴직연금 긴급점검] 은행·보험 ‘장기 안정자산 목적’ vs 증권 ‘적극 투자 운용’", "summary": "금감원 연금종합포털에 따르면 3분기 말 업권별 퇴직연금 적립금 비중은 은행 50.8%(275조4860억원), 증권 29.6%(160조2935억원), 보험 19.6%(106조3419억원)다. 전년 동기 대비 증권은 3.5%p 늘었고 은행과 보험은 각각 1.6%p, 1.9%p 줄었다. DC형 원리금비보장 수익률 평균은 증권이 17.60%에서 14.47%로 떨어진 반면 은행은 17.16%, 보험은 19.57%로 올랐다. 증권은 연금 전문 PB와 AI 투자자문으로, 은행은 4대 시중은행 모두 ETF 당일매매 서비스 도입으로 고객 유치전을 벌이고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "대한경제", "published": "2026-11-19", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202611181534369070671"}, {"id": "e3c686ccb925", "title": "500조원 쌓인 퇴직연금…여전히 노후자금보다 퇴직 목돈", "summary": "국회입법조사처에 따르면 지난해 말 퇴직연금 적립금은 잠정 501조원으로 전년보다 약 70조원(16.1%) 증가했다. 전체 수령계좌에서 일시금 비중은 83.5%에 달했고, 연금 수령을 선택한 경우에도 약 82%가 수령 기간을 10년 이하로 설정했다. 2024년 퇴직급여 중도 활용액 약 18조원 가운데 55세 이전 IRP 해지액이 15조원으로 83.3%를 차지했다. 지난해 연간 수익률은 6.47%였으나 10년 평균 수익률은 2.31%에 그쳤고, 5인 미만 사업장 가입률은 11.9%에 불과했다.", "category": "가입자·사회", "importance": 3, "source": "데일리안", "published": "2026-11-19", "url": "https://www.dailian.co.kr/news/view/1716905/?sc=Naver"}, {"id": "e4ba21adbf7c", "title": "“2030 직장인, 세계 성장주에 과감히 투자해 퇴직연금 불려야”", "summary": "정효영 미래에셋증권 연금지원본부장은 운용 기간이 30~40년 남은 2030세대는 DC형을 선택해 직접 퇴직금을 키우는 편이 낫다고 조언했다. 젊은 층은 위험자산 한도를 70%로 두고 나스닥100·S&P500 같은 미국 성장 지수를 핵심 축으로, 한국·중국 지수를 5~10% 위성 자산으로 섞을 것을 권했다. 4050세대는 시퀀스 리스크 관리를 위해 은퇴 시점에 맞춰 인컴형 자산 비중을 70~80%까지 단계적으로 높여야 한다고 말했다. 미래에셋증권의 로보어드바이저 가입 인원은 14만 명, 규모는 8조2000억 원이다.", "category": "운용·상품", "importance": 2, "source": "동아일보", "published": "2026-11-19", "url": "https://www.donga.com/news/Economy/article/all/20261118/135049846/2"}, {"id": "32e8c1999ca2", "title": "미래에셋생명 1만명 정보 유출…고팍스도 2천명", "summary": "금융감독원이 한창민 의원실에 제출한 자료에 따르면 미래에셋생명 해킹 사고로 인한 개인신용정보 유출 인원은 1만418명으로 당초 알려진 6800명보다 늘었다. 현장 점검에서 추가 유출이 확인됐으며, 유출 정보에는 이름·주민등록번호·연락처와 일부 계좌 및 퇴직연금 관련 정보가 포함됐다. 가상자산거래소 고팍스 운영사 스트리미의 유출 규모도 9명에서 2009명으로 확대됐다.", "category": "업계·경쟁사", "importance": 2, "source": "연합뉴스TV", "published": "2026-11-19", "url": "http://www.yonhapnewstv.co.kr/news/MYH20261119053516PMm"}, {"id": "9508837264f2", "title": "국민연금에 떨어진 숙제…“기금 감소기 韓주식 매각 충격 대비책 짜라”", "summary": "국민연금공단의 '2025년도 공공기관 경영실적 평가보고서'에서 평가단은 기금 소진 국면에 대비한 국내주식 매각 충격 대응체계 로드맵을 정비하라고 주문했다. 평가단은 재무예산관리에 'A0'를 줬으며, 지난해 기금운용 수익률은 18.97%였다. 평가단은 대응 수단별 발동 조건, 시행 일정, 시나리오별 갱신 주기를 포함한 단계별 이행 로드맵과 사전 모의점검 체계를 갖추라고 지적했다. 국민연금 기금운용위원회는 올해 1월 국내 주식 리밸런싱을 한시 유예했고 5월에는 국내 주식 목표 비중을 20.8%로 높였다.", "category": "가입자·사회", "importance": 2, "source": "조선비즈", "published": "2026-11-19", "url": "https://biz.chosun.com/stock/stock_general/2026/11/19/3NYA7YZGHVGUDNHS7WDS3U5Y7U/"}, {"id": "4f32c435619f", "title": "[퇴직연금 긴급점검] 기금형 도입 임박…투자자가 놓치지 말아야 할 것들", "summary": "정부의 ‘퇴직연금 기능강화 방안’에 따라 사외적립 의무화가 법 개정을 전제로 2028년 1월 100인 이상 사업장부터 시행될 예정이다. 기금형 퇴직연금은 DC형과 IRP를 대상으로 수탁법인이 자산을 통합 운용하는 구조로 설계됐다. 정부는 IRP 위험자산 한도(70%) 확대와 IMA·발행어음의 DC·IRP 편입, 디폴트옵션 대기시간 단축도 추진한다. 업계 관계자는 DB에서 DC로 전환할 때 1억원이라면 10차례 정도로 나눠 넣는 분할매수를 권장했다.", "category": "제도·규제", "importance": 2, "source": "대한경제", "published": "2026-11-19", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202611181600009990677"}, {"id": "1055202c00df", "title": "순익 1조에 발행어음까지···삼성證 박종문 첫 연임 도전에 쏠린 눈", "summary": "내년 3월 20일 임기가 끝나는 박종문 삼성증권 대표가 첫 연임 시험대에 오른다. 삼성증권의 올해 3분기 누적 순이익은 1조2919억원으로 지난해 연간 실적을 28.3% 웃돌았다. 퇴직연금 적립금 기준으로는 2024년 말 증권업계 4위에서 지난해 말 2위로 올라섰고 올해 3분기 말에도 27조원대로 같은 순위를 유지했다. 발행어음 인가 심사가 고액자산가 거점점포 제재로 한때 중단됐던 만큼 내부통제 강화가 과제로 꼽힌다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스웨이", "published": "2026-11-19", "url": "https://www.newsway.co.kr/news/view?ud=2026111814343053593"}, {"id": "501f18b24db0", "title": "퇴직연금 500조 시대…‘종합 연금 플랫폼’ 구축에 박차", "summary": "한국투자증권이 모바일 앱 연금 서비스를 개편해 적립부터 운용, 수령까지의 과정을 간소화하고 ‘총 연금자산 실시간 평가’ 기능을 도입했다. 회사 분석에 따르면 신규 DC형 가입자 평균 연령은 2015년 40세에서 2025년 36세로 낮아졌고, 연금 수령 비율은 11%에서 85%로 늘었다. 올해 2분기 디폴트옵션 공시에서 ‘디폴트옵션 적극투자형 BF1’은 3년 누적 수익률 123.34%로 퇴직연금 사업자 포트폴리오 중 1위를 기록했다. 올 상반기 한국투자증권으로 유입된 퇴직연금자산은 5조6600억원으로 같은 기간 증권업계 전체 순유입액의 16.9% 수준이다.", "category": "업계·경쟁사", "importance": 2, "source": "한경머니", "published": "2026-11-19", "url": "https://magazine.hankyung.com/money/article/202610142397c"}, {"id": "76bdd857f529", "title": "[기획] 삼성자산운용, 운용보수 늘며 실적 급증", "summary": "금융투자협회 집계에 따르면 삼성자산운용의 올해 1~9월 별도기준 누적 영업이익은 2500억원으로 지난해 같은 기간 957억원보다 161.4% 증가해 미래에셋자산운용(3181억원)에 이어 업계 2위를 기록했다. 3분기 누적 투자신탁위탁자보수는 3752억원, 자산관리수수료는 628억원으로 ETF 중심의 운용보수 증가가 실적을 이끌었다. 삼성자산운용은 ETF 외에 연기금·공공기관·기업 자금을 맡는 OCIO 사업을 운영하며 중소기업퇴직연금기금 운용에도 참여하고 있다. 회사 측은 이 같은 기관 자금 운용 경험이 퇴직연금 등 장기 운용자금 시장에서 사업 기반을 확보하는 데 기여하고 있다고 밝혔다.", "category": "업계·경쟁사", "importance": 2, "source": "한국금융경제신문", "published": "2026-11-19", "url": "https://www.kfenews.co.kr/news/articleView.html?idxno=668355"}, {"id": "7de2ba0f1b3d", "title": "[고금리 시대, 자산관리 전략을 묻다④] 남미선 하나은행 부장 \"기업 오너, 법인·개인 자산관리 구분해야\"", "summary": "남미선 하나은행 Club1한남PB센터 부장은 고금리 장기화로 중소·중견기업 오너들이 안정형·유동성 자산 비중을 높이는 추세라고 밝혔다. 법인 여유자금은 사용 시점에 따라 단기 예금·채권이나 MMDA·MMF·초단기채 펀드로 나눠 운용하고, 차입금리가 재투자 기대수익률을 넘으면 부채 상환을 우선하라고 제시했다. 대표 개인의 노후자금 마련에는 임원 퇴직금과 퇴직연금 활용을 검토할 수 있으며, 정관을 정비해 임원 퇴직급여 한도를 조정하고 누락된 퇴직연금(DC)을 적립하는 방식을 추천했다. 은퇴 후 금융자산 30억원을 가정해 안정형 채권 40%, 수익형 채권 30%, 해외 주식 20%, 달러 자산 및 금 10%의 포트폴리오를 제안했다.", "category": "법인·자금운용", "importance": 2, "source": "뉴스투데이", "published": "2026-11-19", "url": "https://www.news2day.co.kr/article/20261117500285"}, {"id": "2655b321e2fd", "title": "매년 2500만원 주식 팔아 생활비로…16억 모은 30대의 은퇴 전략", "summary": "30대에 순자산 16억원으로 조기 은퇴한 투자자 '배당머니'는 고배당주 대신 미국 대표지수 ETF로 자산을 불린 뒤 필요한 만큼 주식을 파는 '자가배당' 전략을 쓴다. 일반 계좌는 주식 80%, 현금성 자산 20%로 구성돼 있으며 연간 배당 약 800만원에 매년 1월 2500만원 안팎을 매도해 약 3800만원의 현금흐름을 만든다. 그는 미국 은퇴자들이 퇴직연금 계좌에 매월 자동매도 기능을 설정해 생활한다며 자가배당의 장점을 강조했다.", "category": "가입자·사회", "importance": 1, "source": "머니투데이", "published": "2026-11-19", "url": "https://www.mt.co.kr/stock/2026/11/19/2026111814184573548"}, {"id": "d3a01df61dc7", "title": "[2026 ETF 어워즈] [베스트 연금 ETF하우스] 국내연금 ETF는 KB…채권혼합 시장 선두질주", "summary": "딜사이트는 17일 'ETF 리그테이블 어 ", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-18", "url": "https://www.etoday.co.kr/news/view/2649332", "related": []}, {"id": "9a0c71d9781b", "title": "금감원, 과당경쟁 경고 열흘 만에 DB손보 퇴직연금 들여다본다", "summary": "금융감독원이 퇴직연금 과당경쟁 자제를 요청한 지 열흘 만에 DB손해보험에 대한 퇴직연금 수시검사를 16일부터 2주간 진행하고 있다. 검사는 디폴트옵션, DC형 사용자 부담금, DB형 재정검증 결과 통보 등 관리업무 전반을 대상으로 한다. DB손보는 2024년 가입자 3명의 퇴직급여 2,520만원을 잘못된 계좌로 지급하고 계약이전 요청 47건을 기한 내 처리하지 않아 과태료 7,400만원을 받은 바 있다. 실물이전 제도 시행 후 2026년 6월 말까지 15조8,699억원이 다른 사업자로 이동했고, 이 중 은행에서 증권사로 옮겨간 자금은 5조2,225억원(33%)이다.", "category": "제도·규제", "importance": 4, "source": "글로벌에픽", "published": "2026-11-18", "url": "https://www.globalepic.co.kr/view.php?ud=2026111808433519687cc35ccc5c_29", "related": []}, {"id": "96986c106e5f", "title": "‘투자하는 연금’ 이끄는 미래에셋證…적립금 압도적 1위·ETF 25조원 [퇴직연금 542조 대격변 2-①]", "summary": "미래에셋증권의 올해 3분기 말 퇴직연금 적립금은 49조9034억원으로 증권업계 1위이며 2위 회사의 약 1.8배 규모다. DC형 23조3696억원과 IRP형 21조3498억원이 성장을 이끌었고, DB형 적립금은 5조1840억원으로 13% 줄었다. DC·IRP 계좌의 ETF 잔고는 9월 말 24조6700억원으로 2023년 말보다 6.3배 늘었고, 원리금비보장상품 비중은 DC형 76.6%, IRP형 76.2%다. 적립금 1조원 이상 증권사 기준 10년 연환산 수익률은 DC형 6.11%, IRP형 5.90%로 1위이며, 올해 1~10월 타 금융기관에서 이전된 적립금은 2조8000억원이다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-17", "url": "https://www.etoday.co.kr/news/view/2648643", "related": []}, {"id": "8a6ff2b99e7c", "title": "노사정, 퇴직연금 기능강화 입법 협력…영세사업장 연착륙 지원", "summary": "고용노동부는 16일 퇴직연금 노사정TF 간담회를 열어 퇴직연금 기능강화 방안의 입법 추진 과정에서 고려할 사항을 논의했다. 기능강화 방안은 퇴직급여 사외적립을 2028년 100인 이상, 2029년 10~99인, 2030년 10인 미만 사업장 순으로 의무화하고 기금형 퇴직연금을 활성화하는 것이 핵심이다. 참석자들은 영세 사업장의 어려움을 살피고 기금형이 유형별 장점을 살려 균형 있게 발전하도록 지원해야 한다고 밝혔다. 노사정은 대부분의 과제가 법률 개정을 수반하는 만큼 근로자퇴직급여보장법 개정까지 협력하기로 했다.", "category": "제도·규제", "importance": 4, "source": "연합뉴스", "published": "2026-11-16", "url": "https://www.yna.co.kr/view/AKR20261113167000530", "related": []}, {"id": "8cdc5764c17b", "title": "'체불 방지'서 '기금형·자동연금'으로…20년 대수술 속 증권사 파이 30% 육박", "summary": "금융감독원 통합연금포털에 따르면 올해 3분기 말 전체 퇴직연금 적립금은 542조1214억원이다. 지난해 3분기 대비 전체 적립금이 17.99% 늘어나는 동안 증권업권은 119조7275억원에서 160조2935억원으로 33.88% 급증해 은행권 순증액 34조4442억원을 추월했다. 같은 기간 은행 점유율은 52.46%에서 50.82%로 낮아졌다. 정부는 지난달 29일 발표한 기능강화 방안에서 IRP 위험자산 투자 한도를 70%보다 단계적으로 높이고 IMA와 발행어음의 DC·IRP 편입을 허용하기로 했다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-16", "url": "https://www.etoday.co.kr/news/view/2647920", "related": []}, {"id": "df6d8c8ff511", "title": "증시 급락에 퇴직연금 수익률 급감…적립금 11조7천억원 감소", "summary": "올해 3분기 말 퇴직연금 적립금은 542조1214억원으로 6월 말 553조8779억원보다 11조7565억원(2.1%) 줄었으며, 분기 적립금 감소는 2020년 1분기 이후 처음이다. 유형별 감소액은 IRP 5조129억원, DC형 3조8374억원, DB형 2조9062억원으로 IRP와 DC형이 전체 감소액의 약 75%를 차지했다. 증권사 11곳의 DC형 원금비보장상품 연간 누적 수익률은 2분기 말 52.85%에서 14.46%로, IRP는 46.97%에서 14.19%로 떨어졌다. DB형 수익률은 11.35%에서 3.86%로 낮아졌다.", "category": "운용·상품", "importance": 4, "source": "광주매일신문", "published": "2026-11-16", "url": "http://www.kjdaily.com/article.php?aid=1794759721692238276", "related": []}, {"id": "133e90c36463", "title": "“원리금 보장만” “위험자산 반 이상”…퇴직연금 가입자 돈 굴리기 양극화", "summary": "금융감독원에 따르면 퇴직연금 적립금은 2023년 말 382조원에서 올해 6월 말 558조원으로 늘었다. 가입자의 64.5%는 적립금 전액을 원리금 보장형에 두고 있고, 33.9%는 절반 이상을 위험자산에 투자했으며, 분산 투자로 균형을 맞춘 경우는 1.6%에 그쳤다. 실적배당형 비중은 2023년 12.8%에서 올해 6월 말 35.5%로 약 2.8배 늘었고 그중 50.4%가 ETF에 투자됐다. 금감원은 11월 3일 장기·분산 투자를 돕는 '퇴직연금 가이드북'을 발간했으며, 디폴트옵션도 대부분 원리금 보장형에 머물러 있다고 밝혔다.", "category": "운용·상품", "importance": 3, "source": "서울신문", "published": "2026-11-17", "url": "https://www.seoul.co.kr/news/economy/finance/2026/11/17/20261117031002", "related": [{"title": "같은 퇴직금, 20년 뒤엔 1억6천 차이…50대 여유 있다면 ‘보증형 보험’이 대안", "source": "경향신문", "url": "https://www.khan.co.kr/article/202611170600051"}, {"title": "김 과장·박 과장, 연금 똑같이 1000만 원씩 냈는데...20년 뒤 계좌 잔고 '충격'", "source": "파이낸셜뉴스", "url": "https://www.fnnews.com/news/202611161529480756"}, {"title": "퇴직연금 적립금 558조 넘겨…DC 전환 1년만 118% 증가", "source": "SBS Biz", "url": "https://biz.sbs.co.kr/article_hub/20000346629"}]}, {"id": "f28f27169b38", "title": "정환 연금자산관리본부장 \"퇴직연금 승부처는 지속적인 맞춤형 자산관리\" [퇴직연금 542조 대격변 3-②]", "summary": "정환 NH투자증권 연금자산관리본부장은 퇴직연금 경쟁의 최종 승자는 일시적 적립금 규모가 아니라 지속적인 맞춤형 자산관리로 갈린다고 밝혔다. 일회성 상품 권유에서 벗어나 데이터와 오프라인 전문 인력을 결합해 생애주기 전반의 포트폴리오를 점검하는 체제로 전환하겠다는 구상이다. 연금자산관리센터에서 연금 상담 인력과 PB가 1대1 진단을 제공하고 카카오톡 친구톡으로 연금 정보를 제공한다. 연말 점검 수칙으로 흩어진 연금계좌 파악, 방치된 상품과 현금성 자금 점검, 연금저축·IRP 합산 연 900만원 세액공제 한도 확인을 제시했다.", "category": "업계·경쟁사", "importance": 3, "source": "이투데이", "published": "2026-11-18", "url": "https://www.etoday.co.kr/news/view/2649323", "related": []}, {"id": "452cd7d32d66", "title": "미래에셋생명 해킹 피해 1만명 넘어…금융권 한달새 개인정보 47만건 유출", "summary": "지난달 24일 해킹 사고를 당한 미래에셋생명의 개인신용정보 유출 인원이 당초 약 6800명에서 5일 기준 1만418명으로 53.2% 늘었다. 금융당국 현장 점검에서 추가 피해가 확인됐으며, 이름·주민등록번호·CI와 함께 퇴직소득원천징수영수증, 지급명세서, 퇴직연금 현황 등도 유출된 것으로 확인됐다. 유출 규모가 1만명을 넘어 신용정보법상 72시간 내 금융당국 신고와 정보주체 통지 의무가 생겼고, 미래에셋생명은 신고 절차를 진행했다. 금융당국 집계로 최근 한 달간 금융권 37개사에서 약 47만3000건이 유출됐고 자금 탈취 피해는 약 10억원이다.", "category": "업계·경쟁사", "importance": 3, "source": "포쓰저널", "published": "2026-11-18", "url": "http://www.4th.kr/news/articleView.html?idxno=2122080", "related": []}, {"id": "ec53e7ac8727", "title": "[모닝 리포트] 연말 퇴직연금 금리 경쟁 심화…여전채·회사채 매수 확대 전망", "summary": "한국투자증권은 연말 퇴직연금 금리 경쟁이 심화되면서 은행보다 높은 금리를 제시하는 보험사와 증권사로 자금이 유입될 것으로 전망했다. 이달 퇴직연금 전용 1년 만기 상품 금리는 은행 정기예금 3.7%, 보험사 GIC 3.9%, 증권사 ELB 4.2%로 집계됐다. 지난해 말 DB형 적립금의 91.9%가 원리금보장형으로 운용됐고, 은행 예적금은 9.7% 감소한 반면 보험상품과 ELB는 각각 12.4%, 10.1% 증가했다. ELB 발행잔액의 60~70%가 12월 만기를 앞두고 있어 조달금리가 연 4% 초중반까지 오르고, 증권사 채권 매수 수요는 잔존만기 2~3년 우량 여전채·회사채에 집중될 것으로 예상됐다.", "category": "운용·상품", "importance": 3, "source": "뉴스핌", "published": "2026-11-18", "url": "https://www.newspim.com/news/view/20261118000060", "related": []}, {"id": "49057346ce71", "title": "퇴직연금 500조 돌파에도 노후 보장은 ‘제자리’… “기금형·사외적립 입법 시급”", "summary": "국회입법조사처는 17일 발간한 보고서 ‘퇴직연금 500조의 역설, 여전히 연금이 되지 못하는 이유’에서 2025년 말 적립금이 잠정 501조원으로 늘었지만 10년 평균 수익률은 2.31%에 그치고 수령 계좌의 83.5%가 일시금을 택했다고 진단했다. 2024년 기준 도입률은 26.5%로, 300인 이상 사업장은 92.1%인 반면 5인 미만 사업장은 10.6%에 불과했다. 정부는 이달 중 근로자퇴직급여 보장법 개정안을 발의해 12월 본회의 통과를 추진하며, 기금형을 DC형과 IRP에 도입하고 2028년 100인 이상부터 2030년 10인 미만까지 사외적립을 단계적으로 의무화할 방침이다. 입법조사처는 수탁법인의 책임과 지배구조, 사외적립 시행 이전 근속기간에 대한 경과규정, 중소기업 지원책을 법률에 명확히 해야 한다고 제언했다.", "category": "제도·규제", "importance": 3, "source": "글로벌에픽", "published": "2026-11-18", "url": "https://www.globalepic.co.kr/view.php?ud=2026111808341098397cc35ccc5c_29", "related": []}, {"id": "1cf86aec3110", "title": "미래에셋자산운용, 디폴트옵션 펀드 시장 1위…TDF·채권혼합형 두각", "summary": "미래에셋자산운용의 디폴트옵션 전용 펀드(O클래스) 설정액은 지난달 30일 기준 1조3756억원으로 업계 1위를 기록했으며, 연초 이후 825억원 증가해 2위 운용사의 약 2.5배 수준이다. 국내 디폴트옵션 전용 펀드 시장 설정액은 지난해 말 3조7009억원에서 4조6911억원으로 26.8% 증가했다. 미래에셋전략배분적격TDF 시리즈는 디폴트옵션 전용 펀드 설정액 상위 5개 가운데 3개를 차지했다. 채권혼합형 미래에셋밸런스알파플러스 O클래스는 연초 이후 수익률 10.31%, 최근 1년 수익률 12.84%로 동종 15개 펀드 중 두 기간 모두 1위를 기록했다.", "category": "업계·경쟁사", "importance": 3, "source": "아주경제", "published": "2026-11-18", "url": "https://www.ajunews.com/view/20261118090645108", "related": []}, {"id": "df12701ef326", "title": "정효영 연금지원본부장 “가입자 92% 수익…AI가 먼저 노후자산 챙기는 시대 연다” [퇴직연금 542조 대격변 2-②]", "summary": "미래에셋증권 정효영 연금지원본부장은 인터뷰에서 올해 3분기 말 기준 플러스 수익을 낸 가입자 비중이 92.1%라고 밝혔다. 고객의 투자 상황을 AI로 먼저 분석해 맞춤 해법을 제시하는 '에이전틱 WM'을 강조하고, 매월 자산배분위원회를 열어 모델포트폴리오와 로보어드바이저 추천을 제공한다고 설명했다. 연금 고객의 70%는 다이렉트 고객이며, 영업점 상품은 분기별 상품선정위원회에서 참석 위원 3분의 2 이상 동의로 편입·편출을 결정한다. 기금형 퇴직연금 도입에 대비해 그룹 차원의 기금형 수탁법인 출범을 검토 중이라고 밝혔다.", "category": "업계·경쟁사", "importance": 3, "source": "이투데이", "published": "2026-11-17", "url": "https://www.etoday.co.kr/news/view/2648751", "related": []}, {"id": "b4cf553e16a6", "title": "내 퇴직연금 '원리금 보장형'인데 손실 났다고? 이유는", "summary": "지난해 말 기준 퇴직연금 적립금의 75.4%인 378조1000억원이 원리금보장형이며, 전문가들은 금리만 보지 말고 만기·중도해지 조건과 예금자보호 여부를 함께 따지라고 조언했다. 개인투자용 국채는 만기 보유 시 표면금리에 가산금리 0.350%를 더해 연복리로 적용되지만, 발행 1년 뒤 중도 환매하면 가산금리와 연복리 효과가 사라져 단리만 적용된다. 정기예금과 GIC는 디폴트옵션 도입 후 자동 재연장이 막혀 만기 확인이 필요하고, ELB는 중도 상환 시 원금 손실이 생길 수 있다. DC·IRP의 예금보호 대상 적립금은 금융기관별 1인당 최대 1억원까지 보호되지만 ELB와 RP는 예금자보호 대상이 아니다.", "category": "운용·상품", "importance": 3, "source": "아시아경제", "published": "2026-11-17", "url": "https://view.asiae.co.kr/article/2026111616000798476", "related": []}, {"id": "e5a2f2f3a3d1", "title": "미래에셋·우리은행 잇단 전산 사고… 600조 퇴직연금 시장의 드러난 '뇌관'", "summary": "미래에셋생명은 10월 26일 해킹으로 고객 개인정보가 유출됐고 조사 과정에서 퇴직연금 거래정보도 빠져나간 것으로 드러나 피해 규모는 약 6800명으로 파악됐다. 11월 4~5일에는 미래에셋증권이 외부 공격을 받아 고객 3800여명의 계좌번호와 임직원 3만5255명의 개인정보가 유출됐다. 11월 9일에는 우리은행이 퇴직연금 차세대 시스템을 가동한 직후 WON뱅킹에서 비대면 가입과 상품 매수 등 일부 업무가 처리되지 않는 전산장애를 겪었다. 필자는 추가 본인확인, 시스템 개편 시 공통 보상 기준, 사업자별 보안·전산 정보 공시, 집중 위험에 대한 감독 강화를 제안했다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스퀘스트", "published": "2026-11-17", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=305159", "related": []}, {"id": "9eb108c523c4", "title": "[핫이슈] 하나증권, 퇴직연금 RA 일임서비스 추진…내년 상반기 출시 목표", "summary": "하나증권이 내년 상반기 출시를 목표로 퇴직연금 로보어드바이저(RA) 일임서비스 시스템을 개발하고 있으며, 혁신금융서비스로 지정된 디셈버앤컴퍼니와 제휴했다. 하나증권의 3분기 말 개인형IRP 적립금은 8925억원으로 전년 동기 대비 52.54% 늘어 증권사 중 네 번째로 높은 증가율을 기록했다. 코스콤 테스트베드 기준 상용화된 퇴직연금 RA 알고리즘 고객은 10월 말 1만9765명, 가입금액은 823억6000만원으로 전년 동기보다 각각 103.9%, 154.4% 증가했다. 삼성·한투·NH·KB·미래에셋·신한 등이 이미 서비스를 내놓았고 키움증권은 9월 혁신금융서비스로 지정받았다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스워치", "published": "2026-11-17", "url": "http://www.newswatch.kr/news/articleView.html?idxno=81821", "related": []}, {"id": "4ee6e999f551", "title": "경남은행, 퇴직연금 수익률 은행권 상위권…디폴트옵션 1위", "summary": "BNK경남은행의 2026년 3분기 퇴직연금 DB형 원리금비보장 상품 직전 1년 수익률이 22.49%로 은행권 11개 사업자 중 2위를 기록했다. 디폴트옵션 적극투자형 포트폴리오의 최근 6개월 수익률은 16.71%로 은행권 1위에 올랐다. 2025년 4분기 1위 이후 2026년 상반기 내내 2위권을 유지했다. 최근 KB자산운용·키움자산운용과 협업해 경남·부산·울산에서 DB형 가입 기업 약 70곳을 대상으로 자산관리 세미나를 열었다.", "category": "업계·경쟁사", "importance": 3, "source": "한스경제", "published": "2026-11-17", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=883716", "related": []}, {"id": "93880a83f27a", "title": "[Epic Why] 은행-보험사 퇴직연금 유치전략 왜 다른가", "summary": "하나은행이 지난 12일 퇴직연금 ETF 당일매매를 시작하면서 국민·신한·우리·하나 4대 시중은행이 모두 ETF를 당일 매도·재매수할 수 있는 환경을 갖췄다. 금융감독원 통합연금포털 기준 3분기 말 은행권 퇴직연금 적립금은 275조4860억원으로 전체 542조1214억원의 50.8%를 차지해 1년 전보다 1.7%포인트 낮아졌고, 같은 기간 증권업권 점유율은 26.1%에서 29.6%로 높아졌다. 적립금 10 ://www.newsis.com/view/NISX20261104_0003853884"}, {"title": "퇴직연금 3년 새 '두 배' 불렸다…한국투자증권, 디폴트옵션 수익률 전체 1위 달성", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "5dd7e8508fc5", "title": "하나은행, 호남권 첫 시니어 특화 금융라운지 광주에 개점", "summary": "하나은행은 지난 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 금융공간인 '하나더넥스트 광주금융 라운지'를 개점했다. 라운지는 은퇴설계, 상속·증여, 유언대용신탁 상담과 건강관리·문화·주거 등 라이프케어 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산, 예상 지출을 분석하는 '평생소득설계' 상담을 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "545a1b2bec51", "title": "기금형 연금 도입에…금융지주 계열사 합종연횡 채비", "summary": "기금형 퇴직연금 추진이 공식화되면서 주요 금융지주들이 은행을 중심으로 계열사를 동원한 수탁법인 컨소시엄 설립 준비에 돌입했다. 고용노동부는 오는 6일 주요 은행장들을 소집해 기금형 퇴직연금 간담회를 열며, 법 개정 과정에서 금융지주 자회사 공동출자를 허용하는 예외를 마련할 계획이다. NH농협금융은 퇴직연금 제도 개편 대응 TF를, KB금융과 우리금융은 계열사 워킹그룹을 운영하고 있으며 신한금융도 정식 TF를 발족할 예정이다. 5대 금융지주 DC·IRP 적립액은 174조1435억원으로 작년말 대비 15.5% 늘었고, 증권 계열사 비중은 11.2%에서 13.2%로 상승했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-11-03", "url": "https://www.mt.co.kr/finance/2026/11/03/2026110216011686926", "related": [{"title": "기금형 퇴직연금 도입 초읽기… 원팀 꾸리는 금융지주 계열사", "source": "머니투데이", "url": "https://www.mt.co.kr/finance/2026/11/04/2026110319393765961"}]}, {"id": "113078a9f394", "title": "퇴직연금 ‘100% 투자 가능’의 함정…원금까지 보장하진 않아", "summary": "금융감독원은 내년 1월부터 퇴직연금 매매화면과 상품검색 화면에 투자한도와 위험등급을 함께 표시하도록 개선한다고 27일 밝혔으며, 상품제안서와 적립금운용현황보고서에도 위험등급을 병기한다. 일부 사업자가 원금손실 가능성이 있는 상품도 '투자한도 100%'로만 안내해 가입자가 원리금보장형으로 오인할 수 있다는 판단에서다. 올해 상반기 말 퇴직연금 적립금 558조3000억원 가운데 실적배당형은 198조원이고, 이 중 ETF 투자 규모는 99조8000억원으로 50.4%를 차지했다. 일부 사업자는 전산개발 일정에 따라 내년 상반기 중 시행한다.", "category": "제도·규제", "importance": 4, "source": "메트로신문", "published": "2026-10-27", "url": "https://www.metroseoul.co.kr/article/20261027500104", "related": [{"title": "“퇴직연금 다 날릴 수도”…ETF 투자한도 100%의 함정 [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8699397&ref=A"}]}, {"id": "0369d6c3118c", "title": "퇴직연금 223조원 쌓인 5대은행…국민·하나 2위 각축전", "summary": "5대 시중은행의 3분기 말 퇴직연금 적립금은 222조9427억원으로 집계됐다. 신한은행이 57조2252억원으로 1위이고 KB국민은행 52조2226억원, 하나은행 52조1554억원, 우리은행 33조243억원, NH농협은행 28조3152억원 순이다. KB국민은행과 하나은행의 격차는 672억원으로, 2분기 말 3152억원에서 크게 좁혀져 지난해 말 725억원 수준으로 돌아왔다. 올해 누적 증가액은 하나은행 3조7741억원, KB국민은행 3조7688억원으로 53억원 차이다.", "category": "업계·경쟁사", "importance": 4, "source": "이데일리", "published": "2026-10-19", "url": "https://www.edaily.co.kr/News/Read?newsId=03496486645614560&mediaCodeNo=257", "related": [{"title": "퇴직연금 2위 경쟁 격화…하나은행·국민은행 적립금 격차 672억원", "source": "CEO스코어데일리", "url": "https://www.ceoscoredaily.com/page/view/2026102015471625110"}]}, {"id": "133e90c36463", "title": "“원리금 보장만” “위험자산 반 이상”…퇴직연금 가입자 돈 굴리기 양극화", "summary": "금융감독원에 따르면 퇴직연금 적립금은 2023년 말 382조원에서 올해 6월 말 558조원으로 늘었다. 가입자의 64.5%는 적립금 전액을 원리금 보장형에 두고 있고, 33.9%는 절반 이상을 위험자산에 투자했으며, 분산 투자로 균형을 맞춘 경우는 1.6%에 그쳤다. 실적배당형 비중은 2023년 12.8%에서 올해 6월 말 35.5%로 약 2.8배 늘었고 그중 50.4%가 ETF에 투자됐다. 금감원은 11월 3일 장기·분산 투자를 돕는 '퇴직연금 가이드북'을 발간했으며, 디폴트옵션도 대부분 원리금 보장형에 머물러 있다고 밝혔다.", "category": "운용·상품", "importance": 3, "source": "서울신문", "published": "2026-11-17", "url": "https://www.seoul.co.kr/news/economy/finance/2026/11/17/20261117031002", "related": [{"title": "같은 퇴직금, 20년 뒤엔 1억6천 차이…50대 여유 있다면 ‘보증형 보험’이 대안", "source": "경향신문", "url": "https://www.khan.co.kr/article/202611170600051"}, {"title": "김 과장·박 과장, 연금 똑같이 1000만 원씩 냈는데...20년 뒤 계좌 잔고 '충격'", "source": "파이낸셜뉴스", "url": "https://www.fnnews.com/news/202611161529480756"}, {"title": "퇴직연금 적립금 558조 넘겨…DC 전환 1년만 118% 증가", "source": "SBS Biz", "url": "https://biz.sbs.co.kr/article_hub/20000346629"}]}, {"id": "b1c24b848e68", "title": "줄어든 거래대금에 증권가는 ‘MTS’ 전쟁…AI·배당·연금으로 고객 자산 잡는다", "summary": "증시 조정으로 거래가 위축되자 증권사들이 MTS에 AI 투자정보, 배당 정보, 퇴직연금 ETF 적립식 매수 기능 등을 더하고 있다. 하나증권은 이달부터 DC·IRP 계좌에서 ETF·ETN·리츠를 정기 매수하는 서비스를 개시하며, 3분기 기준 DC·IRP 시장점유율 1위를 달성했다. 3분기 국내 주식시장 일평균 거래대금은 52조4000억원으로 전 분기 대비 41.7% 감소해 증권사 위탁수수료 수익이 크게 줄었다.", "category": "업계·경쟁사", "importance": 3, "source": "조선비즈", "published": "2026-11-09", "url": "https://biz.chosun.com/stock/stock_general/2026/11/09/FUNYZOZV2JH4FLZ7BJYY4STMYI/", "related": [{"title": "줄어든 증시 거래대금에 증권가는 ‘MTS 전쟁’", "source": "조선일보", "url": "https://www.chosun.com/economy/stock-finance/2026/11/10/IKPQK3UVDJG2HEUOQJK5EO4OFM/"}]}, {"id": "ea0a4daeeaf0", "title": "소득 여유 있는 가구가 연금도 먼저 받는다…취약가구와 수급 격차", "summary": "한국보건사회연구원 보고서에 따르면 정년 이후 공적연금 수급 전까지의 소득공백기에 경제적 여력이 있는 가구일수록 연금 수급률이 높았다. 정년 전 중위소득 100% 이상을 유지하거나 늘린 가구의 공적연금 조기 수급률은 26.5%, 소득이 절반 미만으로 줄어든 취약가구는 18.1%였다. 월평균 공적연금 수급액은 소득 유지 가구가 191만8000원, 취약가구가 52만7000원으로 3.6배 이상 차이가 났다. 보고서는 필요한 금액만큼 연금을 나눠 받는 '부분연금제' 도입과 건강보험료·기초연금 등과의 연계 구조 정비를 제언했다.", "category": "가입자·사회", "importance": 3, "source": "메디컬투데이", "published": "2026-11-10", "url": "https://www.mdtoday.co.kr/news/articleView.html?idxno=623884", "related": [{"title": "“노후 소득공백 버티려 연금 당겼는데”…취약층보다 여유 있는 가구가 더 받았다", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10929855?ref=naver"}]}, {"id": "52bb3ea27011", "title": "국민연금 10년 부은 평균소득자, 기초연금보다 덜 받는다…‘급여 역전’", "summary": "국민연금연구원 김형수 부연구위원의 보고서에 따르면 소득대체율 43%를 적용할 때 평균소득자가 최소가입기간 10년을 채운 월 연금액은 A값의 10.75%로, 올해 기초연금 기준연금액(A값의 약 10.95%)보다 낮다. 올해 A값 319만3511원을 넣으면 국민연금은 월 약 34만3300원으로 기준연금액 34만9700원보다 6400원가량 적다. 보고서는 국민연금 최소가입기간을 상향하거나 금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "38994a32152d", "title": "[DQN] 주식시장 약세에 삼성생명 적립금 규모 1위 재탈환…DC형 비보장 수익률 반토막 [2026년 3분기 퇴직연금 랭킹]", "summary": "금감원 통합연금포털 3분기 공시 분석 결과 삼성생명의 퇴직연금 적립금이 57조5486억원으로 2분기 1위였던 신한은행을 추월했다. 계열사 DB형 적립금이 7074억원 늘어난 반면 비계열사 DB형은 3586억원 감소했으며, 주식시장 하락으로 원리금보장형 선호가 커진 점도 영향을 미쳤다. 신한라이프 DC형 원리금비보장 수익률은 2분기 111.17%에서 3분기 59.71%로 떨어지는 등 DC·IRP 비보장형 수익률이 절반 가량 하락했다. IRP 원리금비보장 적립금은 94조6349억원에서 87조6398억원으로 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-11-08", "url": "https://www.fntimes.com/html/view.php?ud=2026110716081563428a55064dd1_18", "related": [{"title": "퇴직연금 판도 재역전…삼성생명 반년 만에 선두 탈환", "source": "아시아타임즈", "url": "https://www.asiatime.co.kr/article/20261020500369"}, {"title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "source": "세이프타임즈", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652"}, {"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "b7e8a161b6af", "title": "2028년부터 퇴직급여 사외적립 의무화… 체불 막는다", "summary": "근로자의 퇴직금 체불을 막기 위해 내후년부터 100인 이상 사업장을 대상으로 퇴직급여 사외 적립을 단계적으로 의무화하는 방안이 추진된다. 이형일 부총리 겸 재정경제부 장관과 배경훈 부총리 겸 과학기술정보통신부 장관은 28일 경제관계장관회의·과학기술관계장관회의 첫 연석회의에서 이 방안을 논의했으며, 기금형 퇴직연금의 구체적 도입 방안도 마련해 전문적인 자산 운용과 엄격한 수탁자 책임을 부과하기로 했다. 퇴직연금 사업자 평가 기준은 연금 성과 수익률 중심으로 개편하고, 디폴트옵션 적용 예정 통보 시점은 만기 후 4주에서 만기 전 2주로 앞당긴다. 구체적인 퇴직연금 기능 강화 방안은 29일 국회 기후에너지환경노동위원회 여당 위원과의 당정협의를 거쳐 발표된다.", "category": "제도·규제", "importance": 5, "source": "서울신문", "published": "2026-10-29", "url": "https://www.seoul.co.kr/news/economy/2026/10/29/20261029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "540조 퇴직연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936461/2"}, {"title": "퇴직연금, 전문가가 대신 굴린다…'기금형' 도입, 국민연금 참여는 미정", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6335473"}, {"title": "정부, 퇴직연금 기금형 활성화…IRP 위험자산 투자한도 상향 추진", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4441777"}, {"title": "\"퇴직금 못 받는 일 줄인다\", 사외적립 전 사업장 확대 추진", "source": "데일리환경", "url": "https://www.dailyt.co.kr/newsView/dlt202611040003"}, {"title": "기업 퇴직연금 모아 전문기관이 굴려… ‘쥐꼬리 수익’ 개선 기대", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936451/2"}, {"title": "국민연금, 기금형 퇴직연금 참여 미정···‘시장 개입 우려’에 국회로 공 넘긴 정부", "source": "경향신문", "url": "https://www.khan.co.kr/article/202610300600041"}, {"title": "[퇴직연금 개편] 퇴직연금도 국민연금처럼…정부, 장기 연금 수령 유도 방안 발표", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=620807"}, {"title": "퇴직연금 사외적립 2030년까지 전 사업장 의무화", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237470"}, {"title": "당정, ‘퇴직연금 강화·고용부 예산’ 살핀다…초광역특구법 논의 가능성", "source": "디지털타임스", "url": "https://www.dt.co.kr/article/12091950"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "fd9e49abb205", "title": "한국투자증권, 퇴직연금 운용의 우위를 실증하다... 3년간 수익률 100% 돌파", "summary": "고용노동부의 9월 말 기준 공시에서 한국투자증권 디폴트옵션 적극투자형 BF1의 3년 누적 수익률이 100.97%로 전체 퇴직연금사업자 포트폴리오 가운데 가장 높았다. 이는 적극투자형 평균 57.58%를 43.39%포인트 웃돌며, 업권별 평균은 증권 61.45%, 은행 55.76%, 보험 55.03%였다. 핵심 전략은 한국투자신탁운용과 협업한 MySuper 알아서 성장형 펀드로 글로벌 우량주와 부동산·인프라·물가연동채권 등 대체자산에 분산투자한다. 3분기 말 DC·IRP 합산 적립금은 18조5160억원으로 지난해 말보다 5조7292억원(44.8%) 늘었다.", "category": "업계·경쟁사", "importance": 4, "source": "리버티코리아포스트", "published": "2026-11-05", "url": "http://www.lkp.news/news/articleView.html?idxno=85780", "related": [{"title": "한투증권, 디폴트옵션 3년 누적 수익률 100.97%…전 사업자 1위", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261104_0003853884"}, {"title": "퇴직연금 3년 새 '두 배' 불렸다…한국투자증권, 디폴트옵션 수익률 전체 1위 달성", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 3만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "5dd7e8508fc5", "title": "하나은행, 호남권 첫 시니어 특화 금융라운지 광주에 개점", "summary": "하나은행은 지난 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 금융공간인 '하나더넥스트 광주금융 라운지'를 개점했다. 라운지는 은퇴설계, 상속·증여, 유언대용신탁 상담과 건강관리·문화·주거 등 라이프케어 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산, 예상 지출을 분석하는 '평생소득설계' 상담을 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에     var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로
     그보다 넉넉히 잡아야 매일 아침 헛경보가 뜨지 않는다. */
  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
         + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

  function buildStaleNotice() {
    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
