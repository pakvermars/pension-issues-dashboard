  /* ── 팔레트 ───────────────────────────────────────────────

     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나.

     키움 두 색은 kiwoomam.com 로고의 구조를 그대로 옮긴 것이다.
     글자는 감청, 포인트 마크만 마젠타. 그래서 맨 위 줄은 감청이고
     마젠타는 슬로건 한 줄에만 쓴다. 둘을 같은 넓이로 쓰면 서로 죽는다. */
  :root {

    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom-deep: #1A399E;
    --kiwoom-point: #EC008C;

    --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',
               'Malgun Gothic', system-ui, sans-serif;
    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {

      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 감청 원색은 어두운 종이에서 1.9:1까지 떨어져 줄이 보이지 않는다.
         마젠타도 한 단계 올려 짝을 맞춘다. 각각 6.2:1, 6.6:1. */
      --kiwoom-deep: #6E92F5;
      --kiwoom-point: #FF5FB4;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야
     구분선이 아니라 종이의 테두리로 읽힌다. */
  .topline { height: 4px; background: var(--kiwoom-deep); }

  /* 수집이 멈춰도 index.html은 그대로 남아 아무 일 없어 보인다. 그래서
     보는 사람의 시계와 비교해 묵은 정도를 화면에서 직접 말한다.
     2026-10-15에 엿새를 멈췄는데 아무도 몰랐던 것이 이 띠를 만든 이유다. */
  .stale {
    padding: 10px 20px;
    background: var(--hot);
    color: var(--paper);
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
  }

  .stale[hidden] { display: none; }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;
  }

  .slogan {
    margin: 0 0 0 auto;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom-point);
    white-space: nowrap;
  }

  .hero-date {
    font-family: var(--font-num);
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .search input {
    width: 230px;
    max-width: 44vw;
    padding: 4px 0;
    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */
  .group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;
  }

  .rail button {
    flex: 1 1 0;
    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .range {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  /* ── 분야 필터 ─────────────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
  }

  .filters button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */
  .notice {
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */
  .list { margin: 8px 0 0; }

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);

  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

  details summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

포털 비교공시 기준 적립금 1조원 이상 증권사 가운데 원리금비보장형 최근 1년 수익률이 DC형 17.22%, IRP 15.43%로 모두 1위였다고 밝혔다. IRP 원리금비보장형 3년 연 환산 수익률은 16.03%로 증권사 중 1위, DC형은 15.93%로 2위였다. 회사는 2024년 4월부터 IRP 운용·자산관리 수수료를 조건 없이 0%로 적용하고 있다. 올해 연금 고객관리팀을 신설해 전담 직원 17명을 두고 9월 말까지 연금 세무 컨설팅 380회를 제공했다.", "category": "업계·경쟁사", "importance": 3, "source": "동아일보", "published": "2026-11-26", "url": "https://www.donga.com/news/Economy/article/all/20261125/135083298/2"}, {"id": "f816627dc2c9", "title": "거래대금 65% 줄어도 성장판 넓힌다…증권사, 연금·WM·기업금융으로 체질 개선", "summary": "국내 증시 일평균 거래대금이 5월 65조7822억원에서 이달 24일까지 23조2605억원으로 64.6% 줄자 증권사들이 퇴직연금·WM·기업금융으로 수익 기반을 넓히고 있다. 한국투자증권의 8월 말 IRP 계좌는 56만7463개로 작년 말보다 9만4727개 늘었고, 하나증권의 9월 말 DC·IRP 적립금은 작년 말보다 각각 36.5%, 38.8% 증가했다. 6월 퇴직연금 사업을 시작한 키움증권은 약 5개월 만에 적립금 2000억원을 넘었고 9월 말 IRP 적립금의 약 75%가 타 금융사 이전 자금이다. 신한투자증권은 연금고객관리팀 17명을 두고 IRP 수수료 전액 면제를 시행하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "이투데이", "published": "2026-11-26", "url": "https://www.etoday.co.kr/news/view/2652877"}, {"id": "ba2a9bfbd61a", "title": "국민연금 68세로 늦춘다?…장관까지 나서 해명", "summary": "9월 말 국회 국민연금 구조개혁 토론회에서 한 교수가 수급 개시 연령을 2046년까지 68세로 올리는 방안을 제시한 뒤 SNS에서 연금 수급이 68세로 늦춰진다는 콘텐츠가 확산됐다. 정은경 복지부 장관은 SNS에서 사실이 아니며 수급개시연령 조정을 검토하고 있지 않다고 밝혔다. 현재 수급 개시 연령은 63세로 2028년 64세, 2033년 65세로 오르도록 돼 있다. 국회 연금개혁특위는 구조개혁 합의안을 내지 못한 채 올해 말 활동 종료를 앞두고 있다.", "category": "가입자·사회", "importance": 3, "source": "SBS", "published": "2026-11-26", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008863894"}, {"id": "058f4d4a721b", "title": "사별하면 유족연금 70% 깎이는데…연금공단은 지급률 상향엔 ‘신중’ 왜?", "summary": "국민연금공단은 본인 연금을 고를 때 얹어 주는 유족연금 비율을 30%에서 50%로 높이는 방안에 대해 심도 있는 검토와 사회적 합의가 먼저라는 입장을 국회에 냈다. 본인 연금과 유족연금 수급권이 겹친 사람은 2021년 12만3994명에서 지난해 20만8242명으로 67.9% 늘었다. 지난해 이들 중 82%는 본인 연금을, 18%는 유족연금을 택했다. 공단은 지급률 상향 시 재정 영향 분석 자료가 없으며 내년 국민연금연구원을 통해 재정추계 연구를 할 계획이다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-26", "url": "https://www.segye.com/newsView/20261125516561"}, {"id": "6569397ec8ba", "title": "[비바100] 500조 퇴직연금, 금리만 쫓다 낭패…'만기 분산·보호 한도' 따져라", "summary": "NH투자증권 100세시대연구소 THE100리포트 137호에 따르면 지난해 말 퇴직연금 적립금은 501조4000억원이며 이 가운데 원리금보장형이 378조1000억원으로 75.4%를 차지했다. DB형은 적립금의 91.9%를 원리금보장형으로 운용하는 반면 DC형과 IRP는 각각 67.0%, 55.7%였다. 원리금보장형은 보험상품 38.0%, 은행·우체국 예·적금 33.7%, ELB 9.8%, 저축은행 예·적금 5.4%로 구성됐다. 기사는 ELB와 RP가 예금자보호 대상이 아니라는 점 등 상품별 지급주체와 중도해지 조건이 달라 만기 분산과 안전장치를 따져야 한다고 전했다.", "category": "운용·상품", "importance": 3, "source": "브릿지경제", "published": "2026-11-26", "url": "https://www.viva100.com/article/20261123500403"}, {"id": "7b36dbe9dc09", "title": "\"환매중단펀드도 갈아탄다\"…실물이전 확대에 '사각지대' 계좌도 움직인다", "summary": "금융감독원에 따르면 환매중단펀드를 판매한 퇴직연금 사업자 간에는 해당 펀드를 포함한 계좌의 실물이전이 내년 1월18일부터 가능해진다. 2024년 10월 실물이전 시행 이후 올해 6월 말까지 은행에서 증권사로 이동한 적립금은 5조2225억원으로 증권사에서 은행으로 넘어온 1조2984억원의 4배 수준이다. 최근 집계에서 실물이전 누적 금액은 18조4000억원(30만1000건)이며 전체 이동 자금의 34.4%가 은행에서 증권사로 빠져나갔다. 시중은행들은 비대면 IRP 수수료 면제, ETF·TDF 라인업 확충, 로보어드바이저 일임 서비스 도입 등으로 고객 이탈 방어에 나서고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "매일일보", "published": "2026-11-26", "url": "https://www.m-i.kr/news/articleView.html?idxno=2023677"}, {"id": "1b6cfe73b31f", "title": "대통령 겨눈 국힘 “연금 손실 220조, 증시부양 특검해야”", "summary": "증시 급락 속에 국민의힘은 국민연금 평가 손실이 220조원에 달할 것이라며 ‘이재명 버블 진상규명 특검’ 도입을 주장했다. 야권은 기금운용위원회가 1월 국내주식 리밸런싱을 6월 말로 유예하고 목표 비중을 14.4%에서 14.9%로, 지방선거 엿새 전 20.8%로 올린 결정을 문제 삼았다. 지난 23일 증시 급락 때 연기금은 1580억원을 순매도했다. 여권은 합리적 판단이라고 반박했고 공단은 기금위 전문가 판단에 따른 조치라고 밝혔다.", "category": "가입자·사회", "importance": 2, "source": "중앙일보", "published": "2026-11-26", "url": "https://www.joongang.co.kr/article/25482014"}, {"id": "f14b38e802a5", "title": "138조 날아간 ETF… 개미 돈은 '피난중'", "summary": "국내 상장 ETF 순자산총액은 24일 기준 394조7656억원으로 6월 22일 고점 532조9748억원보다 138조2092억원(25.9%) 줄었다. 감소액 상위 10개는 모두 국내 주식형 ETF였고, 순자산 증가 상위 10개 중 절반은 머니마켓액티브 ETF였다. 운용업계는 퇴직연금 등 장기투자 수단으로 ETF 활용이 늘고 있어 시장 성장세가 꺾인 것은 아니라고 본다. 6월 22일 이후 개인투자자는 ETF를 28조2207억원 순매수했다.", "category": "운용·상품", "importance": 2, "source": "머니투데이", "published": "2026-11-26", "url": "https://www.mt.co.kr/stock/2026/11/26/2026112519575937496"}, {"id": "9b3a6f1eed67", "title": "(단독)신한은행 ‘변종 꺾기’…대출 고객에 ‘땡겨요’ 음식 주문 요구", "summary": "직장인 익명 커뮤니티에 신한은행에서 신용대출을 신청한 고객이 상담 과정에서 IRP 계좌와 별도 입출금 계좌를 개설한 뒤 배달 앱 ‘땡겨요’ 음식 주문까지 요구받았다는 글이 올라왔다. 대출 고객이 권유를 거절하기 어렵다는 점에서 금융상품 끼워팔기(꺾기)와 유사하다는 지적이 나온다. 자영업자 커뮤니티에도 은행 관계자로 추정되는 이들이 가게를 찾아 앱 설치와 주문을 요청했다는 글이 있었다. 신한투자증권 내부에서도 미성년자 대상 가입 유치 등 플랫폼 실적 영업에 대한 문제 제기가 나왔다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스토마토", "published": "2026-11-26", "url": "http://www.newstomato.com/ReadNews.aspx?no=1321808"}, {"id": "20bdea8b0149", "title": "\"재고용은 정년연장 대안 아니다\"…양대노총, 65세 정년연장 입법 압박", "summary": "한국노총과 민주노총은 25일 국회 앞에서 공동 기자회견을 열고 65세 법정 정년연장의 연내 입법을 촉구했다. 27일 민주당 정년연장특위 소위원회를 앞두고 특위에 입법안 마련을, 국회에 연내 통과를 요구했다. 노동계는 정년퇴직과 국민연금 수급 사이의 소득 공백을 줄이려면 선별적 재고용이 아닌 법정 정년 상향이 필요하다는 입장이다. 노동부는 국회 심사 일정을 고려하면 연내에는 법안 발의가 현실적이라고 봤다.", "category": "가입자·사회", "importance": 2, "source": "뉴스1", "published": "2026-11-26", "url": "https://www.news1.kr/economy/employment-labor/6366059"}, {"id": "48445feec1e5", "title": "자본시장연구원 “ETF 512조 시대…패시브 쏠림 해소 시급”", "summary": "자본시장연구원은 25일 발간한 ‘ETF 시대 자산운용시장의 과제’ 보고서에서 국내 ETF 순자산총액이 2015년 말 22조 원에서 올해 6월 말 512조 원으로 급증했다고 밝혔다. 공모 주식형펀드 326조 원 중 ETF 비중은 80.1%에 달한 반면 액티브 운용 비중은 2007년 97.3%에서 18.5%로 떨어졌다. 테마형 ETF에서는 반도체·AI 테마가 순자산 기준 64.7%를 차지해 대형주 편중 우려가 제기됐다. 보고서는 개선 과제 중 하나로 퇴직연금 DC 계좌의 미국식 디폴트옵션 전환과 TDF 등 자산배분형 펀드 중심의 장기 자산배분 기능 재정립을 제시했다.", "category": "운용·상품", "importance": 2, "source": "글로벌이코노믹", "published": "2026-11-26", "url": "https://www.g-enews.com/view.php?ud=202611260940213314923c501012_1"}, {"id": "cdeba06eab2a", "title": "정년연장 D-1…노동계 \"연내 입법\", 경영계 \"재고용\" 팽팽", "summary": "더불어민주당 정년연장특별위원회가 27일 소위원회를 열고 60세 법정 정년의 65세 연장 속도와 고용 방식, 임금체계 개편을 다시 논의한다. 한국노총과 민주노총은 25일 국회 앞 기자회견에서 퇴직 후 재고용이 아닌 법정 정년 연장의 연내 입법을 요구했다. 중소기업중앙회 조사에서는 중소기업 501곳 중 83.2%가 퇴직 후 재고용을 원했고 정년 65세 연장을 고른 곳은 16.8%였다. 국민연금 수급 개시 연령이 2033년 65세로 늦춰지면서 퇴직 뒤 연금 수급까지 소득 공백이 최대 5년으로 벌어진다.", "category": "가입자·사회", "importance": 2, "source": "CBC뉴스", "published": "2026-11-26", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=630880"}, {"id": "0be94ffe9f2e", "title": "증권사, 연말 투자자 유치전…수요별 '맞춤 공략'", "summary": "증권사들이 연말을 맞아 MTS 이용, 채권·연금 자산 이전 등 투자 수요별로 차별화한 마케팅 경쟁에 나섰다. 한화투자증권은 12월31일까지 타사 채권을 비대면 계좌로 옮기면 순입고 금액에 따라 최대 50만원을 지급한다. 삼성증권은 내년 1월31일까지 IRP 계좌에 100만원 이상 입금하거나 연금저축계좌에 200만원 이상 순입금하면 각각 최대 3만원 상당의 모바일 상품권을 준다. 타사 연금저축을 1000만원 이상 이전하면 금액에 따라 최대 60만원 상당의 상품권을 추가로 지급한다.", "category": "업계·경쟁사", "importance": 2, "source": "신아일보", "published": "2026-11-26", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5088068"}, {"id": "6442b8c600f4", "title": "정년 65세에 재고용 의무까지… 與 속도전에 기업 '채용 부담' 비상, 임금체계는 빠졌다", "summary": "민주당 정년연장특별위원회는 27일 소위원회에서 현행 60세 법정 정년을 2029년 61세로 높인 뒤 2년마다 1세씩 올려 2037년 65세에 도달하는 입법안을 논의한다. 입법안에는 2028년부터 2036년까지 정년퇴직자가 희망하면 기업이 1년간 재고용하도록 하는 내용도 담겼으며, 퇴직과 국민연금 수급 사이의 소득 공백을 줄이려는 취지다. 경영계는 정년연장과 재고용 의무화가 겹치면 인건비 부담으로 신규 채용이 줄 수 있다고 우려한다. 300인 이상 사업체의 호봉제 도입률은 57.6%로, 임금체계 개편 없이 정년이 늘면 부담이 커질 수 있다는 지적이 나온다.", "category": "가입자·사회", "importance": 2, "source": "뉴데일리", "published": "2026-11-26", "url": "https://biz.newdaily.co.kr/site/data/html/2026/11/26/2026112650095.html"}, {"id": "4764a2cc4da0", "title": "[로터리] 퇴직연금 펀드를 잘 고르려면", "summary": "금융투자협회 연금상품공시 기준 퇴직연금 TDF 설정액은 지난해 말 12조6500억원에서 올해 9월 말 16조5009억원으로 늘었다. 필자는 1년 수익률 순위만 보고 갈아타기보다 변동성과 샤프지수를 함께 봐야 한다고 썼다. 같은 목표 시점의 TDF를 2~3년 이상 수익률, 변동성, 최대 낙폭으로 비교하고 운용보고서의 하락장 대응 설명을 확인하라고 권했다.", "category": "운용·상품", "importance": 1, "source": "서울경제", "published": "2026-11-26", "url": "https://www.sedaily.com/article/20118795"}, {"id": "649e3b439d48", "title": "“시장 변동성 커질수록, 패닉 셀 아닌 주기적 리밸런싱해야”", "summary": "연재 ‘고수에게 듣는 퇴직연금 가이드’에서 박세현 신한투자증권 연금사업본부장은 변동성 장세에 퇴직연금 계좌의 ETF를 잦게 매매하지 말고 3개월마다 비중을 조정하라고 조언했다. 코스피는 25일 4,697.51로 지난달 30일보다 18% 하락했다. 박 본부장은 자산 배분이 어려운 가입자는 디폴트옵션을 활용할 수 있다고 했다. 20대는 퇴직금을 중도에 빼지 말고, 50대는 연금 인출 전략을 중시하라고 당부했다.", "category": "운용·상품", "importance": 1, "source": "동아일보", "published": "2026-11-26", "url": "https://www.donga.com/news/Economy/article/all/20261125/135090397/2"}, {"id": "2ac0d16e1bd8", "title": "[반퇴시대 재산리모델링] 순자산 23억 2주택자…\"작은 집 팔고 한강벨트 노려라\"", "summary": "서울에 아파트 두 채를 보유한 38세 직장인 가족의 재무 상담 사례로, 순자산은 23억2500만원, 월수입은 1140만원이다. 상담진은 소형 아파트를 팔아 1주택자로 전환한 뒤 한강벨트 갈아타기를 검토하라고 조언했다. 배우자는 IRP에 월 75만원을 넣어 연 900만원 세액공제 한도를 채우고, 본인은 ISA에 월 165만원을 넣으라고 제안했다.", "category": "가입자·사회", "importance": 1, "source": "중앙일보", "published": "2026-11-26", "url": "https://www.joongang.co.kr/article/25481987"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-11-19 ~ 2026-11-25", "generated_at": "2026-11-26T12:46:05+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "e349bf3a7d98", "title": "한투증권, 디폴트옵션 3년 누적수익률 100.97%… 전체 1위", "summary": "25일 고용노동부가 발표한 2026년 3분기 디폴트옵션 현황에서 한국투자증권의 '디폴트옵션 적극투자형 BF1'이 3년 누적 수익률 100.97%로 전체 퇴직연금사업자 포트폴리오 중 가장 높았다. 전체 적극투자형 평균 수익률은 57.58%였고 업권별로는 증권 61.45%, 은행 55.76%, 보험 55.03%였다. 한국투자증권의 3분기 말 DC형·IRP 적립금 합산액은 18조5160억원으로 지난해 말 12조7868억원보다 44.8% 늘어 전체 사업자 중 가장 높은 증가율을 기록했다. 회사는 업계 최초로 연금 계좌의 현금성 자산 잔고 변동까지 실시간으로 보여주는 '총 연금자산 실시간 평가' 기능도 도입했다.", "category": "업계·경쟁사", "importance": 4, "source": "아시아경제", "published": "2026-11-25", "url": "https://view.asiae.co.kr/article/2026112408305607557", "related": []}, {"id": "7b0e43c939f4", "title": "KB국민은행, 기업 퇴직연금 수수료 최대 0.20%p 인하", "summary": "KB국민은행이 27일부터 확정급여형(DB)과 표준형 확정기여형(DC), 기업형 개인형퇴직연금(IRP)의 수수료 체계를 개편해 수수료율을 최대 0.20%p 인하한다. 표준형 DC의 적립금 50억원 미만 구간 운용관리수수료율은 연 0.14~0.19%에서 연 0.10%로, DB형 500억원 이상 1000억원 미만 구간은 연 0.18%에서 0.07%로 낮춘다. 우대 대상에 신협·새마을금고 등 조합법인과 노인장기요양기관, 장애인활동지원기관, 아이돌봄서비스 제공기관을 추가하고 공공기관 대상 10% 할인 제도를 신설한다. DB형 집합투자증권(ETF 제외) 자산관리수수료 면제 기준도 전체 평균잔액의 70% 이상에서 50% 이상으로 완화한다.", "category": "업계·경쟁사", "importance": 4, "source": "프레스나인", "published": "2026-11-24", "url": "http://www.press9.kr/news/articleView.html?idxno=86883", "related": []}, {"id": "934ed8562ba9", "title": "키움證의 퇴직연금 “고객이 먼저 신청해요”", "summary": "키움증권이 올해 6월 퇴직연금 사업을 시작하며 선보인 ‘퇴직연금 도입요청’ 서비스에 680개 기업이 신청했다. 기업 담당자나 근로자가 MTS 영웅문S#으로 도입 상담을 요청하면 키움증권 담당자가 DB형·DC형·IRP 등 퇴직연금 전반을 안내하는 방식이다. 부산의 중소 물류업체가 임직원 신청을 계기로 사업자를 변경하는 등 영업망과 연고가 없는 지방 중소기업까지 고객으로 확보했다. 금감원 통합연금포털 기준 3분기 키움증권 퇴직연금 적립금은 DB형 150억 원, DC형 106억 원, IRP 1626억 원 등 총 1882억 원이다.", "category": "업계·경쟁사", "importance": 4, "source": "서울경제", "published": "2026-11-22", "url": "https://www.sedaily.com/article/20117431", "related": []}, {"id": "f39e4c1aef15", "title": "금감원 \"퇴직연금 단기실적 경쟁안돼…변칙 고금리 등 엄정대응\"", "summary": "서재완 금융감독원 부원장보는 19일 4대 금융협회와 퇴직연금 사업자 담당 임원 간담회에서 연말 변칙적 고금리와 이벤트성 특별이익 제공 등 불건전 영업행위에 엄정 대응하겠다고 밝혔다. DB형 원리금보장상품의 연말 만기 집중을 틈탄 특정 가입자 고금리 제공, 고수익 상품을 대기업 위주로 제시해 영세기업 가입비율이 10%를 밑돈 사례 등이 지적됐다. 금감원은 최근 5년간 통합연금포털 공시오류가 302건 발생했다며 내부 검증 체계 강화를 주문했다. 불건전 영업행위 모니터링을 강화하고 공시 제도 개선을 추진할 계획이다.", "category": "제도·규제", "importance": 4, "source": "보험매일", "published": "2026-11-20", "url": "http://www.fins.co.kr/news/articleView.html?idxno=110641", "related": []}, {"id": "b45aff8da79f", "title": "키움증권, 퇴직연금 5개월 만에 2000억 돌파…영웅문 고객이 이끈 IRP 성장 [퇴직연금 542조 대격변 5-①]", "summary": "키움증권의 퇴직연금 적립금이 올해 6월 사업 개시 후 약 5개월 만인 11월 2000억원을 넘어섰다. 적립금은 6월 말 649억원에서 9월 말 1882억원으로 약 2.9배가 됐고, 같은 기간 증권업권 전체 적립금은 전 분기 대비 2.88% 줄었다. 9월 말 IRP 적립금은 약 1626억원으로 전체의 86%가량이며, IRP 적립금의 약 75%가 타사 이전 자금이고 7월 기준 IRP 가입자의 96%가 기존 키움증권 고객이었다. 키움증권은 영웅문S#에서 ETF 실시간 매매·적립식 자동매수와 통합연금개시 서비스를 제공한다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-20", "url": "https://www.etoday.co.kr/news/view/2650202", "related": []}, {"id": "68273cee30dc", "title": "표영대 키움증권 연금플랫폼본부장 \"증권업권 퇴직연금 적립금 5위 진입 목표\" [퇴직연금 542조 대격변 5-②]", "summary": "표영대 키움증권 연금플랫폼본부장은 중장기적으로 증권업권 퇴직연금 적립금 기준 5위 진입을 목표로 한다고 밝혔다. IRP로 출발한 사업을 DB·DC 기업 퇴직연금으로 넓히는 것이 다음 과제이며, 근로자가 영웅문S#에서 키움증권을 사업자로 회사에 요청하는 '퇴직연금 도입요청'을 비대면 영업 통로로 활용한다. 기업 비용 부담을 낮추기 위해 DB와 DC 모두 첫해 운용관리·자산관리 수수료 전액을 면제하고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-20", "url": "https://www.etoday.co.kr/news/view/2650211", "related": []}, {"id": "47078a2852d9", "title": "퇴직연금 ‘장기 성적표 1위’ 하나증권⋯AI·연금닥터의 맞춤 처방 [퇴직연금 542조 대격변 4-①]", "summary": "금융감독원 퇴직연금 공시에 따르면 3분기 말 하나증권의 DC형 원리금 비보장상품 수익률은 5년 연 8.03%, 7년 연 8.88%, 10년 연 7.21%로 세 구간 모두 증권업계 1위다. 하나증권의 DC형 적립금은 지난해 말 2805억원에서 3분기 말 3828억원으로, IRP 적립금은 6429억원에서 8926억원으로 늘어 합산 1조2754억원으로 38.1% 증가했다. 하나증권은 9월 차세대 MTS '하나증권V'를 출시하고 AI 기반 'AI 연금프로' 서비스를 운영하고 있다. 전국 영업점에는 연금 전문 PB인 '연금닥터'를 배치해 고액자산가와 은퇴 예정 고객에게 컨설팅을 제공한다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-19", "url": "https://www.etoday.co.kr/news/view/2649799", "related": []}, {"id": "41cb778f8d14", "title": "증권가 연말 稅테크...절세계좌 황금률은?", "summary": "연말정산을 앞두고 연금저축·IRP·ISA를 정해진 순서대로 채우는 '절세계좌 황금률'이 세후 수익을 가른다는 조언이 나왔다. 키움증권은 계좌별 세금 비교에서 연 수익 약 833만원까지는 해외 직접투자, 833만~2000만원은 일반계좌 ETF, 2000만원 초과는 연금저축이 유리하다고 분석했다. 상의민 키움증권 연금플랫폼본부 과장은 2030세대에는 ISA를 먼저 채우고, 50대 이상에는 중개형 ISA를 먼저 채운 뒤 연금저축을 과세이연 계좌로 쓰라고 권했다. 다만 건보공단이 연 1500만원 이하 사적연금(연금저축·IRP) 등 분리과세 소득에 건보료를 부과하는 방안을 국감 업무자료에 과제로 올려 절세 효과가 줄 수 있다는 관측도 제기된다.", "category": "가입자·사회", "importance": 4, "source": "주간한국", "published": "2026-11-19", "url": "https://weekly.hankooki.com/news/articleView.html?idxno=7193728", "related": []}, {"id": "bedc5f67f1bc", "title": "부부가 함께 부은 연금, 사별하면 유족연금 70% 깎인다", "summary": "국회예산정책처에 따르면 본인 노령·장애연금과 유족연금 수급권이 겹친 사람이 2021년 12만3994명에서 지난해 20만8242명으로 67.9% 늘었다. 국민연금법 제56조에 따라 본인 연금을 고르면 유족연금의 30%만 더 받고, 유족연금을 고르면 본인 연금 지급이 전액 정지된다. 지난해 중복수급권자의 82%인 17만1547명은 본인 연금을, 18%인 3만6695명은 유족연금을 택했다. 예산정책처는 30% 수준이 낮다고 단정하기보다 선택 유형별 실제 급여수준을 분석할 필요가 있다고 지적했다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-24", "url": "https://www.segye.com/newsView/20261123510564", "related": [{"title": "내 연금·유족연금 겹친 20.8만명…3.7만명은 내 연금 '0원'", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20261122031500530"}, {"title": "“부부가 평생 꼬박꼬박 냈는데 0원”…배우자 떠나자 연금 ‘뚝’, 중복지급 상향은", "source": "매일경제", "url": "https://www.mk.co.kr/article/12217731"}]}, {"id": "b479ce15b6d3", "title": "반도체 폭락에도 퇴직연금은 '사자'···은행권, 223조원 사수 총력전", "summary": "3분기 말 5대 은행의 퇴직연금 적립금은 222조9427억원으로 2019년 집계 이후 처음 감소했고, 2024년 10월 실물이전 시행 이후 올해 6월 말까지 은행에서 증권사로 옮겨간 적립금은 5조2000억원이었다. 은행들은 자금 이탈을 막기 위해 ETF 매도 대금으로 같은 날 재투자할 수 있는 당일매매 서비스를 잇달아 도입하고 있다. 국민은행이 8월 20일 시중은행 최초로 도입했고 신한은행이 9월, 우리·하나은행이 이달 합류했으며 농협은행은 다음 달, IBK기업은행은 내년 1분기 시작할 예정이다. 국민은행은 시행 후 한 달간 증권사로 이동한 적립금이 지난해 12월 한 달보다 약 50% 줄었다고 밝혔으나, 은행은 여전히 실시간 거래가 안 되고 취급 상품도 약 300개로 증권사(약 900개)보다 적다.", "category": "업계·경쟁사", "importance": 3, "source": "스마트비즈", "published": "2026-11-23", "url": "https://www.smartbizn.com/news/articleView.html?idxno=160195", "related": [{"title": "은행 퇴직연금, '증권사 속도'로 바뀐다…ETF 당일매매 전산 개편 확산", "source": "전자신문", "url": "https://www.etnews.com/20261120000226"}]}, {"id": "675f8ee312b4", "title": "수익은 높이고 세부담은 덜고…똑똑한 연말정산 ‘주목’", "summary": "NH농협은행이 올해 3분기 퇴직연금 DB형과 IRP의 원리금비보장상품 1년 운용수익률에서 적립금 상위 10개사 가운데 1위를 기록했다. 금융감독원 통합연금포털 공시에 따르면 농협은행의 DB형과 IRP 수익률은 각각 14.89%, 21.1%였고, 종합(가중평균) 수익률은 19.3%로 상위 10개사 중 가장 높았다. 농협은행은 5대 은행 기준 6분기 연속 종합수익률 1위를 유지하고 있으며, 퇴직연금 ETF 상품 88종을 신규 출시했다. 연금저축과 IRP를 합산하면 최대 900만원까지 납입액의 13.2∼16.5% 세액공제를 받을 수 있다.", "category": "업계·경쟁사", "importance": 3, "source": "농민신문", "published": "2026-11-25", "url": "https://www.nongmin.com/article/20261123500583", "related": []}, {"id": "f80c8db9c57d", "title": "\"연금 개시할 때 상품 싹 팔아야 했던 불편 없앴다\"… 한화생명, 굴리면서 타 먹는 'IRP 분할연금' 출시", "summary": "한화생명이 만 55세 이상 IRP 가입 고객이 기존 상품 운용을 이어가면서 연금을 받을 수 있는 분할연금 ‘라이프핏 연금’을 출시했다. 수령 방식은 금액확정형과 기간확정형 중 선택할 수 있고, 연간 수령액은 분할연금 전환 금액의 5분의 1 이내로 최소 5년에 걸쳐 수령한다. 분할연금 이용 중 종신연금으로 전환할 수도 있다. 한화생명은 이달 2일부터 개인형 IRP 실적배당형 상품의 운용관리·자산관리 수수료도 면제했다.", "category": "업계·경쟁사", "importance": 3, "source": "한국목재신문", "published": "2026-11-25", "url": "https://www.woodkorea.co.kr/news/articleView.html?idxno=92792", "related": []}, {"id": "7598972d23f0", "title": "'국민연금 수급개시연령 68세로 상향' 관련 정은경 보건복지부 장관 직접 해명", "summary": "정은경 보건복지부 장관이 24일 페이스북에 국민연금 수급개시연령을 68세로 연장한다는 내용은 사실이 아니라는 글을 올렸다. 정 장관은 정부가 현재 수급개시연령 조정을 검토하고 있지 않다고 밝혔다. 현행법상 노령연금 수급개시연령은 bc", "title": "부부가 함께 부은 연금, 사별하면 유족연금 70% 깎인다", "summary": "국회예산정책처에 따르면 본인 노령·장애연금과 유족연금 수급권이 겹친 사람이 2021년 12만3994명에서 지난해 20만8242명으로 67.9% 늘었다. 국민연금법 제56조에 따라 본인 연금을 고르면 유족연금의 30%만 더 받고, 유족연금을 고르면 본인 연금 지급이 전액 정지된다. 지난해 중복수급권자의 82%인 17만1547명은 본인 연금을, 18%인 3만6695명은 유족연금을 택했다. 예산정책처는 30% 수준이 낮다고 단정하기보다 선택 유형별 실제 급여수준을 분석할 필요가 있다고 지적했다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-24", "url": "https://www.segye.com/newsView/20261123510564", "related": [{"title": "내 연금·유족연금 겹친 20.8만명…3.7만명은 내 연금 '0원'", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20261122031500530"}, {"title": "“부부가 평생 꼬박꼬박 냈는데 0원”…배우자 떠나자 연금 ‘뚝’, 중복지급 상향은", "source": "매일경제", "url": "https://www.mk.co.kr/article/12217731"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "5dd7e8508fc5", "title": "하나은행, 호남권 첫 시니어 특화 금융라운지 광주에 개점", "summary": "하나은행은 지난 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 금융공간인 '하나더넥스트 광주금융 라운지'를 개점했다. 라운지는 은퇴설계, 상속·증여, 유언대용신탁 상담과 건강관리·문화·주거 등 라이프케어 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산, 예상 지출을 분석하는 '평생소득설계' 상담을 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "545a1b2bec51", "title": "기금형 연금 도입에…금융지주 계열사 합종연횡 채비", "summary": "기금형 퇴직연금 추진이 공식화되면서 주요 금융지주들이 은행을 중심으로 계열사를 동원한 수탁법인 컨소시엄 설립 준비에 돌입했다. 고용노동부는 오는 6일 주요 은행장들을 소집해 기금형 퇴직연금 간담회를 열며, 법 개정 과정에서 금융지주 자회사 공동출자를 허용하는 예외를 마련할 계획이다. NH농협금융은 퇴직연금 제도 개편 대응 TF를, KB금융과 우리금융은 계열사 워킹그룹을 운영하고 있으며 신한금융도 정식 TF를 발족할 예정이다. 5대 금융지주 DC·IRP 적립액은 174조1435억원으로 작년말 대비 15.5% 늘었고, 증권 계열사 비중은 11.2%에서 13.2%로 상승했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-11-03", "url": "https://www.mt.co.kr/finance/2026/11/03/2026110216011686926", "related": [{"title": "기금형 퇴직연금 도입 초읽기… 원팀 꾸리는 금융지주 계열사", "source": "머니투데이", "url": "https://www.mt.co.kr/finance/2026/11/04/2026110319393765961"}]}, {"id": "113078a9f394", "title": "퇴직연금 ‘100% 투자 가능’의 함정…원금까지 보장하진 않아", "summary": "금융감독원은 내년 1월부터 퇴직연금 매매화면과 상품검색 화면에 투자한도와 위험등급을 함께 표시하도록 개선한다고 27일 밝혔으며, 상품제안서와 적립금운용현황보고서에도 위험등급을 병기한다. 일부 사업자가 원금손실 가능성이 있는 상품도 '투자한도 100%'로만 안내해 가입자가 원리금보장형으로 오인할 수 있다는 판단에서다. 올해 상반기 말 퇴직연금 적립금 558조3000억원 가운데 실적배당형은 198조원이고, 이 중 ETF 투자 규모는 99조8000억원으로 50.4%를 차지했다. 일부 사업자는 전산개발 일정에 따라 내년 상반기 중 시행한다.", "category": "제도·규제", "importance": 4, "source": "메트로신문", "published": "2026-10-27", "url": "https://www.metroseoul.co.kr/article/20261027500104", "related": [{"title": "“퇴직연금 다 날릴 수도”…ETF 투자한도 100%의 함정 [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8699397&ref=A"}]}, {"id": "133e90c36463", "title": "“원리금 보장만” “위험자산 반 이상”…퇴직연금 가입자 돈 굴리기 양극화", "summary": "금융감독원에 따르면 퇴직연금 적립금은 2023년 말 382조원에서 올해 6월 말 558조원으로 늘었다. 가입자의 64.5%는 적립금 전액을 원리금 보장형에 두고 있고, 33.9%는 절반 이상을 위험자산에 투자했으며, 분산 투자로 균형을 맞춘 경우는 1.6%에 그쳤다. 실적배당형 비중은 2023년 12.8%에서 올해 6월 말 35.5%로 약 2.8배 늘었고 그중 50.4%가 ETF에 투자됐다. 금감원은 11월 3일 장기·분산 투자를 돕는 '퇴직연금 가이드북'을 발간했으며, 디폴트옵션도 대부분 원리금 보장형에 머물러 있다고 밝혔다.", "category": "운용·상품", "importance": 3, "source": "서울신문", "published": "2026-11-17", "url": "https://www.seoul.co.kr/news/economy/finance/2026/11/17/20261117031002", "related": [{"title": "같은 퇴직금, 20년 뒤엔 1억6천 차이…50대 여유 있다면 ‘보증형 보험’이 대안", "source": "경향신문", "url": "https://www.khan.co.kr/article/202611170600051"}, {"title": "김 과장·박 과장, 연금 똑같이 1000만 원씩 냈는데...20년 뒤 계좌 잔고 '충격'", "source": "파이낸셜뉴스", "url": "https://www.fnnews.com/news/202611161529480756"}, {"title": "퇴직연금 적립금 558조 넘겨…DC 전환 1년만 118% 증가", "source": "SBS Biz", "url": "https://biz.sbs.co.kr/article_hub/20000346629"}]}, {"id": "b479ce15b6d3", "title": "반도체 폭락에도 퇴직연금은 '사자'···은행권, 223조원 사수 총력전", "summary": "3분기 말 5대 은행의 퇴직연금 적립금은 222조9427억원으로 2019년 집계 이후 처음 감소했고, 2024년 10월 실물이전 시행 이후 올해 6월 말까지 은행에서 증권사로 옮겨간 적립금은 5조2000억원이었다. 은행들은 자금 이탈을 막기 위해 ETF 매도 대금으로 같은 날 재투자할 수 있는 당일매매 서비스를 잇달아 도입하고 있다. 국민은행이 8월 20일 시중은행 최초로 도입했고 신한은행이 9월, 우리·하나은행이 이달 합류했으며 농협은행은 다음 달, IBK기업은행은 내년 1분기 시작할 예정이다. 국민은행은 시행 후 한 달간 증권사로 이동한 적립금이 지난해 12월 한 달보다 약 50% 줄었다고 밝혔으나, 은행은 여전히 실시간 거래가 안 되고 취급 상품도 약 300개로 증권사(약 900개)보다 적다.", "category": "업계·경쟁사", "importance": 3, "source": "스마트비즈", "published": "2026-11-23", "url": "https://www.smartbizn.com/news/articleView.html?idxno=160195", "related": [{"title": "은행 퇴직연금, '증권사 속도'로 바뀐다…ETF 당일매매 전산 개편 확산", "source": "전자신문", "url": "https://www.etnews.com/20261120000226"}]}, {"id": "b1c24b848e68", "title": "줄어든 거래대금에 증권가는 ‘MTS’ 전쟁…AI·배당·연금으로 고객 자산 잡는다", "summary": "증시 조정으로 거래가 위축되자 증권사들이 MTS에 AI 투자정보, 배당 정보, 퇴직연금 ETF 적립식 매수 기능 등을 더하고 있다. 하나증권은 이달부터 DC·IRP 계좌에서 ETF·ETN·리츠를 정기 매수하는 서비스를 개시하며, 3분기 기준 DC·IRP 시장점유율 1위를 달성했다. 3분기 국내 주식시장 일평균 거래대금은 52조4000억원으로 전 분기 대비 41.7% 감소해 증권사 위탁수수료 수익이 크게 줄었다.", "category": "업계·경쟁사", "importance": 3, "source": "조선비즈", "published": "2026-11-09", "url": "https://biz.chosun.com/stock/stock_general/2026/11/09/FUNYZOZV2JH4FLZ7BJYY4STMYI/", "related": [{"title": "줄어든 증시 거래대금에 증권가는 ‘MTS 전쟁’", "source": "조선일보", "url": "https://www.chosun.com/economy/stock-finance/2026/11/10/IKPQK3UVDJG2HEUOQJK5EO4OFM/"}]}, {"id": "ea0a4daeeaf0", "title": "소득 여유 있는 가구가 연금도 먼저 받는다…취약가구와 수급 격차", "summary": "한국보건사회연구원 보고서에 따르면 정년 이후 공적연금 수급 전까지의 소득공백기에 경제적 여력이 있는 가구일수록 연금 수급률이 높았다. 정년 전 중위소득 100% 이상을 유지하거나 늘린 가구의 공적연금 조기 수급률은 26.5%, 소득이 절반 미만으로 줄어든 취약가구는 18.1%였다. 월평균 공적연금 수급액은 소득 유지 가구가 191만8000원, 취약가구가 52만7000원으로 3.6배 이상 차이가 났다. 보고서는 필요한 금액만큼 연금을 나눠 받는 '부분연금제' 도입과 건강보험료·기초연금 등과의 연계 구조 정비를 제언했다.", "category": "가입자·사회", "importance": 3, "source": "메디컬투데이", "published": "2026-11-10", "url": "https://www.mdtoday.co.kr/news/articleView.html?idxno=623884", "related": [{"title": "“노후 소득공백 버티려 연금 당겼는데”…취약층보다 여유 있는 가구가 더 받았다", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10929855?ref=naver"}]}, {"id": "52bb3ea27011", "title": "국민연금 10년 부은 평균소득자, 기초연금보다 덜 받는다…‘급여 역전’", "summary": "국민연금연구원 김형수 부연구위원의 보고서에 따르면 소득대체율 43%를 적용할 때 평균소득자가 최소가입기간 10년을 채운 월 연금액은 A값의 10.75%로, 올해 기초연금 기준연금액(A값의 약 10.95%)보다 낮다. 올해 A값 319만3511원을 넣으면 국민연금은 월 약 34만3300원으로 기준연금액 34만9700원보다 6400원가량 적다. 보고서는 국민연금 최소가입기간을 상향하거나 기초연금 기준연금액 수준을 조정하는 방향이 필요하다고 제시했다. 최소가입기간을 15년으로 높여도 59세 말 기준 미달 비율은 1.6%로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-04", "url": "https://www.segye.com/newsView/20261103517557", "related": [{"title": "국민연금 10년 부었는데 기초연금보다 적다…월 6400원 역전", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=500742"}]}, {"id": "f82595e9660f", "title": "\"1년 미만·초단기 근로자도 퇴직금\"…정부 실태조사 착수", "summary": "정부가 1년 미만 근속자와 주 15시간 미만 초단시간 근로자에게도 퇴직급여를 지급하는 방안을 검토한다. 29일 발표된 퇴직연금 기능강화 방안에 따라 한국노동연구원이 이들의 퇴직급여 운영 실태와 의무화에 따른 사용자 부담·노동시장 영향을 분석한다. 지난해 주 1~14시간 일한 취업자는 177만9000명으로 전체 취업자의 6.2%였고 관련 통계 작성 이후 가장 많았다. DC형 법정 최소 사용자 부담금이 연간 임금총액의 12분의 1인 만큼 영세 사업장의 채용 위축 우려도 제기된다.", "category": "제도·규제", "importance": 3, "source": "한국경제", "published": "2026-10-30", "url": "https://www.hankyung.com/article/202610294697i", "related": [{"title": "퇴직연금 의무화에도…1년 미만·초단시간 노동자 사각지대 남아", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261029010010231"}]}, {"id": "d3317e03935a", "title": "한투증권, 유튜브 '한국인의 연금'서 매주 화요일 시황 라이브", "summary": "한국투자증권이 퇴직연금 유튜브 채널 '한국인의 연금'에서 매주 화요일 오후 5시 정기 라이브 시황 세미나를 진행한다. 주식 시황뿐 아니라 DC·IRP와 개인연금 계좌에 맞춘 장기 자산배분 전략을 다루며, 위험자산 편입 한도 70% 기준의 포트폴리오 조정과 TDF·채권·배당형 자산 활용법을 설명한다. 실시간 채팅과 전문가 Q&A로 연금 제도, 절세, 수령·인출 전략 질문에 답하고 시청은 무료다. 최종진 연금혁신본부장은 연금 자산 성격에 맞는 객관적 시장 진단과 주기적 리밸런싱이 노후 자산의 성패를 결정한다고 말했다.", "category": "업계·경쟁사", "importance": 2, "source": "아시아경제", "published": "2026-11-17", "url": "https://view.asiae.co.kr/article/2026111709111366247", "related": [{"title": "한국투자증권, 퇴직연금 유튜브 '한국인의 연금'서 매주 화요일 라이브 시황 세미나 진행", "source": "한국경제", "url": "https://www.hankyung.com/article/202611185427O"}]}, {"id": "fa231637c697", "title": "KB자산운용, 美 초대형주·만기매칭형 회사채 ETF 동시 상장", "summary": "KB자산운용이 18일 RISE 미국초대형주TOP10 ETF와 RISE 27-11 회사채(AA-이상)액티브 ETF를 동시에 상장한다. 미국초대형주TOP10은 NYSE·나스닥 상장 시가총액 상위 10개 종목에 투자하며 총보수는 연 0.30%다. 27-11 회사채 ETF는 2027년 10~12월 만기 AA- 이상 회사채에 투자하는 만기매칭형으로 예상 만기수익률은 세전 연 4.13%, 총보수는 연 0.05%다. 회사채 ETF는 DC·IRP 계좌에서 적립금의 100%까지 편입할 수 있다.", "category": "운용·상품", "importance": 2, "source": "파이낸셜포스트", "published": "2026-11-18", "url": "https://www.financialpost.co.kr/news/articleView.html?idxno=301568", "related": [{"title": "KB운용, 美 초대형주 ETF·우량 회사채 ETF 동시 상장", "source": "글로벌이코노믹", "url": "https://www.g-enews.com/view.php?ud=202611170832545593153ddfb15a_1"}]}, {"id": "7b0e43c939f4", "title": "KB국민은행, 기업 퇴직연금 수수료 최대 0.20%p 인하", "summary": "KB국민은행이 27일부터 확정급여형(DB)과 표준형 확정기여형(DC), 기업형 개인형퇴직연금(IRP)의 수수료 체계를 개편해 수수료율을 최대 0.20%p 인하한다. 표준형 DC의 적립금 50억원 미만 구간 운용관리수수료율은 연 0.14~0.19%에서 연 0.10%로, DB형 500억원 이상 1000억원 미만 구간은 연 0.18%에서 0.07%로 낮춘다. 우대 대상에 신협·새마을금고 등 조합법인과 노인장기요양기관, 장애인활동지원기관, 아이돌봄서비스 제공기관을 추가하고 공공기관 대상 10% 할인 제도를 신설한다. DB형 집합투자증권(ETF 제외) 자산관리수수료 면제 기준도 전체 평균잔액의 70% 이상에서 50% 이상으로 완화한다.", "category": "업계·경쟁사", "importance": 4, "source": "프레스나인", "published": "2026-11-24", "url": "http://www.press9.kr/news/articleView.html?idxno=86883", "related": []}, {"id": "934ed8562ba9", "title": "키움證의 퇴직연금 “고객이 먼저 신청해요”", "summary": "키움증권이 올해 6월 퇴직연금 사업을 시작하며 선보인 ‘퇴직연금 도입요청’ 서비스에 680개 기업이 신청했다. 기업 담당자나 근로자가 MTS 영웅문S#으로 도입 상담을 요청하면 키움증권 담당자가 DB형·DC형·IRP 등 퇴직연금 전반을 안내하는 방식이다. 부산의 중소 물류업체가 임직원 신청을 계기로 사업자를 변경하는 등 영업망과 연고가 없는 지방 중소기업까지 고객으로 확보했다. 금감원 통합연금포털 기준 3분기 키움증권 퇴직연금 적립금은 DB형 150억 원, DC형 106억 원, IRP 1626억 원 등 총 1882억 원이다.", "category": "업계·경쟁사", "importance": 4, "source": "서울경제", "published": "2026-11-22", "url": "https://www.sedaily.com/article/20117431", "related": []}, {"id": "f39e4c1aef15", "title": "금감원 \"퇴직연금 단기실적 경쟁안돼…변칙 고금리 등 엄정대응\"", "summary": "서재완 금융감독원 부원장보는 19일 4대 금융협회와 퇴직연금 사업자 담당 임원 간담회에서 연말 변칙적 고금리와 이벤트성 특별이익 제공 등 불건전 영업행위에 엄정 대응하겠다고 밝혔다. DB형 원리금보장상품의 연말 만기 집중을 틈탄 특정 가입자 고금리 제공, 고수익 상품을 대기업 위주로 제시해 영세기업 가입비율이 10%를 밑돈 사례 등이 지적됐다. 금감원은 최근 5년간 통합연금포털 공시오류가 302건 발생했다며 내부 검증 체계 강화를 주문했다. 불건전 영업행위 모니터링을 강화하고 공시 제도 개선을 추진할 계획이다.", "category": "제도·규제", "importance": 4, "source": "보험매일", "published": "2026-11-20", "url": "http://www.fins.co.kr/news/articleView.html?idxno=110641", "related": []}, {"id": "b45aff8da79f", "title": "키움증권, 퇴직연금 5개월 만에 2000억 돌파…영웅문 고객이 이끈 IRP 성장 [퇴직연금 542조 대격변 5-①]", "summary": "키움증권의 퇴직연금 적립금이 올해 6월 사업 개시 후 약 5개월 만인 11월 2000억원을 넘어섰다. 적립금은 6월 말 649억원에서 9월 말 1882억원으로 약 2.9배가 됐고, 같은 기간 증권업권 전체 적립금은 전 분기 대비 2.88% 줄었다. 9월 말 IRP 적립금은 약 1626억원으로 전체의 86%가량이며, IRP 적립금의 약 75%가 타사 이전 자금이고 7월 기준 IRP 가입자의 96%가 기존 키움증권 고객이었다. 키움증권은 영웅문S#에서 ETF 실시간 매매·적립식 자동매수와 통합연금개시 서비스를 제공한다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-20", "url": "https://www.etoday.co.kr/news/view/2650202", "related": []}]}, "yearly": {"period": "yearly", "key": "current", "label": "2025-11-26 ~ 2026-11-25", "generated_at": "2026-11-26T12:46:55+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 금 1위 탈환, 계열사 자금 '의존'했나", "source": "세이프타임즈", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652"}, {"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "b7e8a161b6af", "title": "2028년부터 퇴직급여 사외적립 의무화… 체불 막는다", "summary": "근로자의 퇴직금 체불을 막기 위해 내후년부터 100인 이상 사업장을 대상으로 퇴직급여 사외 적립을 단계적으로 의무화하는 방안이 추진된다. 이형일 부총리 겸 재정경제부 장관과 배경훈 부총리 겸 과학기술정보통신부 장관은 28일 경제관계장관회의·과학기술관계장관회의 첫 연석회의에서 이 방안을 논의했으며, 기금형 퇴직연금의 구체적 도입 방안도 마련해 전문적인 자산 운용과 엄격한 수탁자 책임을 부과하기로 했다. 퇴직연금 사업자 평가 기준은 연금 성과 수익률 중심으로 개편하고, 디폴트옵션 적용 예정 통보 시점은 만기 후 4주에서 만기 전 2주로 앞당긴다. 구체적인 퇴직연금 기능 강화 방안은 29일 국회 기후에너지환경노동위원회 여당 위원과의 당정협의를 거쳐 발표된다.", "category": "제도·규제", "importance": 5, "source": "서울신문", "published": "2026-10-29", "url": "https://www.seoul.co.kr/news/economy/2026/10/29/20261029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "540조 퇴직연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936461/2"}, {"title": "퇴직연금, 전문가가 대신 굴린다…'기금형' 도입, 국민연금 참여는 미정", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6335473"}, {"title": "정부, 퇴직연금 기금형 활성화…IRP 위험자산 투자한도 상향 추진", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4441777"}, {"title": "\"퇴직금 못 받는 일 줄인다\", 사외적립 전 사업장 확대 추진", "source": "데일리환경", "url": "https://www.dailyt.co.kr/newsView/dlt202611040003"}, {"title": "기업 퇴직연금 모아 전문기관이 굴려… ‘쥐꼬리 수익’ 개선 기대", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936451/2"}, {"title": "국민연금, 기금형 퇴직연금 참여 미정···‘시장 개입 우려’에 국회로 공 넘긴 정부", "source": "경향신문", "url": "https://www.khan.co.kr/article/202610300600041"}, {"title": "[퇴직연금 개편] 퇴직연금도 국민연금처럼…정부, 장기 연금 수령 유도 방안 발표", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=620807"}, {"title": "퇴직연금 사외적립 2030년까지 전 사업장 의무화", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237470"}, {"title": "당정, ‘퇴직연금 강화·고용부 예산’ 살핀다…초광역특구법 논의 가능성", "source": "디지털타임스", "url": "https://www.dt.co.kr/article/12091950"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "bedc5f67f1bc", "title": "부부가 함께 부은 연금, 사별하면 유족연금 70% 깎인다", "summary": "국회예산정책처에 따르면 본인 노령·장애연금과 유족연금 수급권이 겹친 사람이 2021년 12만3994명에서 지난해 20만8242명으로 67.9% 늘었다. 국민연금법 제56조에 따라 본인 연금을 고르면 유족연금의 30%만 더 받고, 유족연금을 고르면 본인 연금 지급이 전액 정지된다. 지난해 중복수급권자의 82%인 17만1547명은 본인 연금을, 18%인 3만6695명은 유족연금을 택했다. 예산정책처는 30% 수준이 낮다고 단정하기보다 선택 유형별 실제 급여수준을 분석할 필요가 있다고 지적했다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-24", "url": "https://www.segye.com/newsView/20261123510564", "related": [{"title": "내 연금·유족연금 겹친 20.8만명…3.7만명은 내 연금 '0원'", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20261122031500530"}, {"title": "“부부가 평생 꼬박꼬박 냈는데 0원”…배우자 떠나자 연금 ‘뚝’, 중복지급 상향은", "source": "매일경제", "url": "https://www.mk.co.kr/article/12217731"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "5dd7e8508fc5", "title": "하나은행, 호남권 첫 시니어 특화 금융라운지 광주에 개점", "summary": "하나은행은 지난 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 금융공간인 '하나더넥스트 광주금융 라운지'를 개점했다. 라운지는 은퇴설계, 상속·증여, 유언대용신탁 상담과 건강관리·문화·주거 등 라이프케어 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산, 예상 지출을 분석하는 '평생소득설계' 상담을 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}]}}}</script>

  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로
     그보다 넉넉히 잡아야 매일 아침 헛경보가 뜨지 않는다. */
  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
         + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

  function buildStaleNotice() {
    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
