 제3∼6호에 대한 헌법소원 사건에서 4(합헌)대 4(위헌) 의견으로 합헌 결정했으며, 위헌 결정에 필요한 6인 이상 찬성에 미치지 못했다. 해당 부칙은 1996∼2009년 임용 공무원의 연금 지급개시 연령을 2024∼2026년 퇴직자 62세, 2027∼2029년 63세, 2030∼2032년 64세, 2033년 이후 65세로 단계적으로 높여 60세 정년퇴직 이후 최대 5년의 소득 공백이 생길 수 있다. 헌재는 지급개시 시기가 늦춰질 가능성을 전혀 예상할 수 없었다고 보기 어렵고 조기퇴직연금으로 소득 공백 없이 수령할 길도 있다며 \"연금 재정의 안정 도모와 연금제도의 기본원리에 충실한 합리화는 긴급하고도 중대한 공익\"이라고 밝혔다. 위헌 의견을 낸 재판관들은 조기퇴직연금을 받으면 최대 25% 감액된 연금을 받게 돼 불이익이 지나치게 크다며 정년을 연장해 지급개시 연령과 일치시키는 방안을 제시했다.", "category": "제도·규제", "importance": 3, "source": "연합뉴스", "published": "2026-10-27", "url": "https://www.yna.co.kr/view/AKR20261026169000004"}, {"id": "7be31de4009a", "title": "10명 중 6명 연금수익률, 겨우 물가상승률 수준[연금자산 양극화]②", "summary": "아시아경제가 통합연금포털에서 업권별 1위 사업자 3사를 분석한 결과 합산 적립금 164조5772억원 중 59.4%(92조8630억원)가 원리금 보장형이었고, 원리금 보장 비율은 삼성생명 77.9%, 신한은행 67.3%, 미래에셋증권 28.9% 순이었다. DC형 10년 수익률은 원리금 보장형과 비보장형이 신한은행 2.21%·6.21%, 미래에셋증권 2.35%·6.11%, 삼성생명 2.64%·6.16%로 차이가 났다. 고용노동부 퇴직연금 투자백서에 따르면 수익률 상위 10%는 적립금의 84%를 실적배당형에 투자해 지난해 19.5%의 수익을 냈고, 하위 10%는 적립금 74%를 원리금 보장형에 두며 0.5%에 그쳤다. 올해 2분기 기준 디폴트옵션 적립금의 82.5%(46조1028억원)가 원리금 보장형에 쏠려 있어 디폴트옵션 제도를 개선해야 한다는 의견이 나온다.", "category": "운용·상품", "importance": 3, "source": "아시아경제", "published": "2026-10-27", "url": "https://view.asiae.co.kr/article/2026102316012488065"}, {"id": "b5f7dcf4b1df", "title": "\"퇴직금 불리려면 해외로\" 돈 줄줄 빠져나간다...'국장'에 묶어두려면", "summary": "지난 15일 코스피가 외국인 대규모 순매도 속에 7.57% 급락하는 등 국내 증시의 취약성이 드러나면서 장기 투자자금 유입을 위한 추가 대책이 필요하다는 의견이 금융투자업계에서 나온다. 부동산 장기특별공제처럼 주식 장기투자를 유도할 수 있도록 퇴직연금 세제 혜택을 재정비해야 한다는 목소리다. 일반 주식계좌에서는 국내 주식형 펀드 매매차익이 비과세되지만 연금계좌에서는 연금 수령 시 3.3~5.5%의 세금이 붙어 퇴직연금 계좌로 국내 주식형 펀드에 투자하면 오히려 손해를 보는 구조다. 자본시장연구원 연구진은 퇴직연금 등 개인의 장기투자 자금을 토대로 국내 장기 기관투자자 기반을 확충해야 한다고 제안했다.", "category": "제도·규제", "importance": 3, "source": "머니투데이", "published": "2026-10-27", "url": "https://www.mt.co.kr/stock/2026/10/27/2026102618584570673"}, {"id": "94d39c690524", "title": "하나증권, 퇴직연금 DC 수익률 증권업 1위 外", "summary": "금융감독원 통합연금포털 공시에 따르면 3분기말 기준 하나증권의 DC 원리금비보장형 장기 수익률은 5년 연 8.03%, 7년 연 8.88%, 10년 연 7.21%로 증권사 가운데 가장 높았다. 단기 수익률도 DC 1년 연 18.72%, 3년 연 16.32%였고 IRP 1년 수익률은 연 18.50%로 증권업 상위 10개사 중 1위를 차지했다. 하나증권의 퇴직연금 적립금은 올해 들어 DC 36.5%, IRP 38.8% 증가했다. 하나증권은 영업점 '연금닥터' 1:1 컨설팅과 비대면 '연금자산관리센터', MTS 'AI연금프로' 서비스로 자산관리 체계를 운영하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "리얼캐스트", "published": "2026-10-27", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31892"}, {"id": "dfd1feeeed0f", "title": "中企 퇴직연금 '푸른씨앗' 사업주 미납 총 92억원", "summary": "박정 더불어민주당 의원실이 근로복지공단에서 받은 자료에 따르면 중소기업퇴직연금기금(푸른씨앗)은 올해 8월 말 기준 가입자 20만1천875명, 적립금 1조9천203억원으로 집계됐다. 2022~2025년분 사업주 부담금 미납액은 총 92억800만원이며, 미납 사업장은 1천726개소, 해당 가입자는 4천489명이었다. 푸른씨앗은 법정기금이 아니어서 미납 사실을 파악해도 강제징수 권한이 없고, 올해 퇴직급여를 받은 가입자 중 988명이 총 9천500만원의 원금 손실을 봤다. 박 의원은 법정기금화를 통한 징수 권한 확보와 단기자금 855억원을 활용한 퇴직급여 선지급 방안을 검토해야 한다고 강조했다.", "category": "제도·규제", "importance": 3, "source": "SBS Biz", "published": "2026-10-27", "url": "https://biz.sbs.co.kr/article_hub/20000342265"}, {"id": "3007ee35546d", "title": "‘직접 굴리는 퇴직금’의 명암…DC형 몰린 직장인들, 하락장에 수익률 급락", "summary": "금융감독원 통합연금포털에 따르면 9월 말 퇴직연금 사업자 43곳의 적립금은 542조1214억원으로 6월 말보다 11조7565억원(2.12%) 줄었으며, 분기 말 적립금이 감소한 것은 2020년 1분기 이후 처음이다. 원리금 비보장형 상품 적립금이 약 12조5000억원(6.3%) 줄었고, DC형 투자상품의 최근 1년 수익률은 6월 말 53.33%에서 9월 말 15.90%로, IRP는 48.25%에서 15.97%로 낮아졌다. 유형별 감소액은 IRP 5조129억원, DC형 3조8374억원, DB형 2조9062억원으로 IRP와 DC형이 전체 감소액의 75.3%를 차지했다. 올해 1~7월 DB형에서 DC형으로 전환한 근로자는 34만156명으로 118.1% 늘었고, 4~6월 전환 가입자의 7~8월 수익률은 미래에셋증권 -10.7%, 한국투자증권 -10.2%였다.", "category": "운용·상품", "importance": 3, "source": "조선일보", "published": "2026-10-27", "url": "https://www.chosun.com/economy/market_trend/2026/10/27/6WOJTMLZR5D7NC72V343LCN5QI/"}, {"id": "a977205347fd", "title": "하나은행, '하나 MP구독서비스' 투자범위에 ETF까지 확대… 퇴직연금 자산관리 강화", "summary": "하나은행이 퇴직연금 가입자 대상 비대면 자산관리 서비스 '하나 MP(Model Portfolio) 구독서비스'의 투자 대상을 기존 펀드 중심에서 ETF까지 확대했다. 지난해 은행권 최초로 출시된 이 서비스는 퇴직연금 전문가가 투자성향에 맞춘 포트폴리오와 시장 동향 정보를 카카오톡으로 주기적으로 제공한다. 가입자는 별도 비용 없이 카카오톡에서 연금자산 현황을 확인하고 클릭 한 번으로 포트폴리오 매수와 리밸런싱을 진행할 수 있다. 하나은행은 2026년 3분기 누적 기준 은행권 퇴직연금 적립금 증가 1위를 달성했다고 밝혔다.", "category": "업계·경쟁사", "importance": 2, "source": "라이브뉴스", "published": "2026-10-27", "url": "https://www.livesnews.com/news/article.html?no=65348"}, {"id": "a592e106c55d", "title": "회생 넉 달째 임금체불 대성재단 이사장 법정으로", "summary": "대성재단 이사장 홍모씨가 뉴대성병원 노동자 76명의 임금·연차유급휴가 미사용수당·퇴직금 미지급 혐의로 기소돼 다음달 첫 형사재판을 앞두고 있고, 노동자 14명의 임금·퇴직금 미지급 사건도 지난 20일 근로자퇴직급여 보장법 위반 등 혐의로 송치됐다. 뉴대성병원과 서울호흡안심병원의 임금·퇴직금 등 체불액은 총 78억9천700만원이며 재단이 직접 청산한 금액은 1억7천900만원에 그쳤다. 재단은 6월 30일 회생절차에 들어갔지만 넉 달이 다 되도록 체불을 해결하지 못하고 있다. 위탁계약이 해지된 부천시립노인전문병원에서는 올해 1~7월분 퇴직연금 부담금과 7월분 4대 보험료 등이 여전히 지급되지 않았다.", "category": "가입자·사회", "importance": 2, "source": "매일노동뉴스", "published": "2026-10-27", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237410"}, {"id": "7632ed47b80c", "title": "강성묵 체제 하나증권, 실적 반등 넘어 수익 다변화 과제", "summary": "하나증권의 올해 1~3분기 누적 영업이익은 3664억원으로 전년 동기 대비 98.9% 늘었고, 누적 순이익은 2834억원으로 67.1% 증가했다. 하나증권은 발행어음 잔고를 올해 2조원까지 늘리고 그룹 '원(One) IB' 협업으로 기업금융을 강화한다는 계획이다. 퇴직연금은 장기 고객 확보 전략의 한 축으로, 3분기 말 DC형 원리금 비보장 상품 수익률이 5년 연 8.03%, 7년 연 8.8%, 10년 연 7.21%로 증권업계 1위라고 회사는 밝혔다.", "category": "업계·경쟁사", "importance": 2, "source": "이지경제", "published": "2026-10-27", "url": "https://www.ezyeconomy.com/news/articleView.html?idxno=241219"}, {"id": "2a3cef8a6ada", "title": "[핀테크핫이슈] 금융권 3분기 성적표 공개...증시 전망 '시계제로'", "summary": "금융지주·은행·증권사의 3분기 실적을 정리한 주간 묶음 기사로, 우리금융 3분기 누적 순이익은 2조6581억원, 하나금융은 3조6243억원이었다. 퇴직연금 부문에서는 하나은행 적립금이 3분기 말 52조원을 넘어 지난해 말보다 3조7741억원 늘며 은행권 최대 증가액을 기록했고, IRP와 DC 적립금 증가가 성장세를 이끌었다. 우리은행은 3분기 DC 원리금비보장형 수익률 18.4%로 적립금 상위 10개 사업자 중 1위, IRP 수익률은 18.3%로 3위였다. 한국은행은 기준금리를 연 3.00%로 동결했다.", "category": "업계·경쟁사", "importance": 2, "source": "디지털투데이", "published": "2026-10-27", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=709983"}, {"id": "a296026a1b4a", "title": "미래에셋생명, IRP 보증형실적배당보험 자금 확대… 은퇴 자산관리 강화", "summary": "미래에셋생명의 퇴직연금 상품 '보증형실적배당보험'은 출시 이후 2026년 8월 말 기준 누적 모집액 717억원을 넘어섰다. 이 상품은 IRP 계좌로 가입하는 거치형 상품으로, 만 50세부터 적립금을 일시 예치하고 만 55세부터 원하는 시점에 연금 수령을 시작할 수 있다. 운용에는 일임형 자산배분펀드인 'MVP펀드'를 활용한다. 연금 수령 시작 후 20년이 지나도 적립금이 남아 있으면 잔액이 소진될 때까지 연금 지급이 이어질 수 있다.", "category": "업계·경쟁사", "importance": 2, "source": "글로벌이코노믹", "published": "2026-10-27", "url": "https://www.g-enews.com/view.php?ud=202610260917505669e207547429_1"}, {"id": "7e2e8ab3de83", "title": "\"자식 물려주느니 내가 쓴다\"…유산 대신 해외여행 다니는 은퇴 부모들", "summary": "미국 경제지 포천은 영국 퇴직연금 전문기업 스탠더드라이프 보고서를 인용해 영국인 부모 7명 중 1명이 유산을 남기기보다 은퇴 후 자신의 삶을 즐기는 데 돈을 쓰겠다고 답했다고 보도했다. 영국여행업협회 조사에서 65세 이상 응답자의 82%가 최근 1년간 휴가를 다녀왔다고 답했다. 65세 이상 부부의 여행 1건당 평균 경비는 9960달러로 50세 미만 부부의 약 1.5배였다. 국내에서도 보건복지부 '2023년 노인실태조사'에서 재산을 본인과 배우자를 위해 쓰겠다는 65세 이상 비율이 24.2%로 2020년보다 6.8%포인트 올랐다.", "category": "가입자·사회", "importance": 2, "source": "파이낸셜뉴스", "published": "2026-10-27", "url": "https://www.fnnews.com/news/202610270658443643"}, {"id": "735a16fac7ad", "title": "삼성액티브운용, 대형주·단기채 담은 ETF 상장", "summary": "삼성액티브자산운용이 국내 시가총액 상위 5개 종목을 중심으로 최대 10개 종목에 투자하고 국내 우량 단기채권을 결합한 'KoAct 코리아TOP5플러스채권혼합50액티브' ETF를 27일 신규 상장했다. 채권 부문의 평균 듀레이션은 약 1년 수준으로 관리해 금리 변동에 따른 가격 민감도를 낮춘다. 이 ETF는 퇴직연금 DC와 IRP에서 안전자산으로 분류돼 연금계좌와 ISA에서 투자할 수 있다. 회사는 퇴직연금의 안전자산 편입 요건을 충족하면서 주식 투자 비중을 높이는 수단으로 활용할 수 있다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스포스트", "published": "2026-10-27", "url": "https://www.newspost.kr/news/articleView.html?idxno=226725"}, {"id": "e0bbd962e84b", "title": "\"내 연금까지 건드린다고?\" 시민들 반응 심상치 않더니…개편 움직임에 대규모 시위 나선 스페인", "summary": "지난 24일 스페인 마드리드에서 연금 수급자와 노동조합, 시민 등 약 2만5000명(당국 추산)이 공적 연금 보장을 요구하는 시위를 벌였다. 시위대는 물가 상승률에 연동한 연금 인상 유지, 최저연금액의 최저임금 수준 인상, 남녀 간 연금 격차 해소, 공적 연금 민영화 방지 등을 요구했다. 스페인의 국가 연금 수급 인구는 약 680만명이며 9월 기준 1인당 월평균 연금 수급액은 1576유로다. 다음 달 29일 총선을 앞두고 집권 사회당은 물가연동 인상 유지를, 국민당 일각은 개혁 필요성을 주장하고 있다.", "category": "가입자·사회", "importance": 2, "source": "아시아경제", "published": "2026-10-27", "url": "https://view.asiae.co.kr/article/2026102708420159135"}, {"id": "06cd7bf131bc", "title": "[애널리스트의 마켓뷰]퇴직급여, IRP로 굴리면 세금 줄이고 나눠내는 효과", "summary": "이승진 키움증권 연금전략팀장은 특별한 사용 계획이 없다면 퇴직급여를 IRP에서 운용하며 연금으로 나눠 받는 방법을 먼저 고려해야 한다고 조언했다. 연금으로 받으면 수령 연차 10년 이하는 퇴직소득세의 70%, 10년 초과 20년 이하는 60%, 20년 초과는 50%만 내 세금을 30~50% 줄일 수 있고, 실제 찾은 금액에 해당하는 세금만 그때그때 내면 된다. 퇴직급여는 세전 금액으로 IRP에 입금되고 IRP 안의 이자·배당·운용수익은 인출 전까지 과세되지 않아 더 많은 자금으로 운용할 수 있다. 퇴직급여를 재원으로 받는 연금은 다른 종합소득과 합산되지 않고 분리과세되며 현재 사적연금 소득은 건강보험료 산정 소득에도 포함되지 않는다.", "category": "가입자·사회", "importance": 1, "source": "동아일보", "published": "2026-10-27", "url": "https://www.donga.com/news/Economy/article/all/20261026/134911393/2"}, {"id": "a42143ab7951", "title": "55조 '슈퍼리치'부터 MZ 'AI 연금'까지…삼성증권의 압도적 '투트랙' 독주 [SS포커스]", "summary": "삼성증권은 금융자산 1000억 원 이상 고객 대상 패밀리오피스 서비스 신청 가문이 200가문, 관리 자산이 55조 원을 돌파했고 기관투자자급 외부위탁운용관리(OCIO) 운용 규모는 9000억 원을 넘어섰다. 지분 매각으로 현금을 확보한 '엑시트 오너' 고객은 3년 전 대비 3배 이상 늘었다. 삼성증권의 '다이렉트 IRP'는 운용 및 자산관리 수수료를 전면 무료화해 최대 900만 원의 세액공제 혜택을 노리는 2030 직장인 고객이 대거 유입됐다. MTS 'mPOP'은 고객 금융 데이터를 실시간 분석해 맞춤형 자산배분과 로보어드바이저 컨설팅을 제공하며 TDF, 타깃형 ETF, AI·퀀트 기반 'ETPrism' 등을 비대면으로 운용할 수 있게 했다.", "category": "업계·경쟁사", "importance": 1, "source": "스포츠서울", "published": "2026-10-27", "url": "https://www.sportsseoul.com/news/read/1643655"}, {"id": "19b771abd0fe", "title": "[카드뉴스] 출산크레딧 2026년 출생·입양 자녀부터 첫째도 12개월… 노령연금 받을 때 가입기간에 더해져요", "summary": "국민연금 출산크레딧은 자녀를 낳거나 입양하면 국민연금 가입기간을 추가로 인정해 주는 제도로, 2025년 연금개혁으로 기준이 바뀌었다. 2026년 1월 1일 이후 출생·입양한 자녀부터 첫째·둘째는 1명당 각 12개월, 셋째부터는 1명당 18개월이 인정되고 기존 50개월 상한은 폐지됐다. 추가 기간은 노령연금 수급권을 얻을 때 가입기간에 더해지며 따로 신청하지 않는다. 2025년 12월 31일까지 출생·입양한 자녀는 종전 기준(둘째부터 인정, 상한 50개월)이 적용될 수 있다.", "category": "가입자·사회", "importance": 1, "source": "베이비뉴스", "published": "2026-10-27", "url": "https://www.ibabynews.com/news/articleView.html?idxno=156224"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-10-20 ~ 2026-10-26", "generated_at": "2026-10-27T19:38:55+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "829c3e49cc3f", "title": "흔들린 증시에 퇴직연금 적립금 6년여 만에 감소", "summary": "3분기 말 퇴직연금 적립금이 542조1214억원으로 전 분기보다 2.1% 줄었다. 코로나19 초기인 2020년 1분기 이후 6년여 만의 감소다. 업권별로는 증권 160조2935억원(2.9% 감소), 은행 275조4860억원(2.1% 감소), 보험 106조3419억원(0.9% 감소)이다. 실적배당형이 185조2078억원으로 6.3% 줄어든 반면 원리금보장형은 356조9051억원으로 0.2% 늘었다.", "category": "운용·상품", "importance": 5, "source": "머니투데이", "published": "2026-10-20", "url": "https://www.mt.co.kr/stock/2026/10/21/2026102016164749417", "related": [{"title": "3분기 퇴직연금 적립금 542조… 증시 조정 속 보험·은행 동반 감소", "source": "한국보험신문", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=93459"}, {"title": "\"노후자금 넣었는데\"…퇴직연금 12조 줄자 직장인들 '울상'", "source": "한국경제", "url": "https://www.hankyung.com/article/2026102167161"}, {"title": "5대 은행 퇴직연금 5조원 증발…7년 만에 첫 감소세", "source": "컨슈머타임스", "url": "https://www.cstimes.com/news/articleView.html?idxno=724898"}, {"title": "증시 시름에… 퇴직연금도 휘청", "source": "머니투데이", "url": "https://www.mt.co.kr/stock/2026/10/21/2026102019471522048"}, {"title": "증시 '휘청'에…5대銀 퇴직연금 적립금 7년 만에 첫 감소", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4440263"}]}, {"id": "536a738a394f", "title": "기금형 퇴직연금, 국민연금에 문 열어주나", "summary": "국민연금의 퇴직연금 시장 참여를 두고 여당·국민연금공단과 금융권이 맞서고 있다. 이용우 더불어민주당 의원은 10월 2일 공적연금기관이 기금 운용을 두고 경쟁하도록 하는 근로자퇴직급여보장법 개정안을 발의하면서 초기 3년 10%, 5년간 30% 이상 진출을 금지하는 상한을 뒀다. 김성주 국민연금공단 이사장은 법 개정으로 참여가 가능해지면 낮은 수수료를 실현할 수 있다고 했고, 금융감독원은 운용 손실 책임과 관치 가능성을 우려했다. 고용부는 7월까지 세부안을 확정할 예정이었으나 미뤄졌고 CEO 간담회도 9월 초부터 세 차례 연기됐으며, 6월 말 기준 퇴직연금 시장 규모는 553조8949억원이다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-10-20", "url": "https://www.globalepic.co.kr/view.php?ud=2026102009352813337cc35ccc5c_29", "related": []}, {"id": "4bbbd1457f44", "title": "퇴직연금 판도 재역전…삼성생명 반년 만에 선두 탈환", "summary": "금융감독원 퇴직연금 비교공시에 따르면 3분기말 삼성생명의 퇴직연금 적립금은 57조5486억원으로 전분기보다 1523억원 늘어, 1조6636억원 줄어든 신한은행(57조2252억원)을 3234억원 차이로 앞서 1·2분기에 내준 선두 자리를 되찾았다. 삼성생명은 DB형 적립금 43조9970억원 중 원리금보장형이 35조원 수준이어서 증시 하락기에 적립금을 방어했고, 계열사 DB형 7074억원·DC형 461억원 증가도 영향을 미쳤다. 반면 국민은행 1조2587억원, 하나은행 1조107억원, 미래에셋증권 2조1176억원 등 주요 사업자의 적립금은 일제히 줄었다. 기사는 3분기 코스피가 19% 넘게 하락하며 실적배당형 상품 평가액이 감소한 영향으로 분석했다.", "category": "업계·경쟁사", "importance": 4, "source": "아시아타임즈", "published": "2026-10-25", "url": "https://www.asiatime.co.kr/article/20261020500369", "related": [{"title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "source": "세이프타임즈", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652"}, {"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "671db33cd634", "title": "하나증권, DC 장기 수익률 ‘트리플 1위’…수익률·적립금 동반 성장", "summary": "하나증권은 올해 3분기 말 기준 확정기여형(DC) 퇴직연금 원리금비보장형 상품의 5·7·10년 수익률이 증권사 가운데 가장 높았다고 밝혔다. 금융감독원 통합연금포털 공시에 따르면 수익률은 5년 연 8.03%, 7년 연 8.88%, 10년 연 7.21%였고, 1년 수익률은 연 18.72%, 3년은 연 16.32%였다. 개인형퇴직연금(IRP) 1년 수익률도 연 18.50%로 증권업 상위 10개사 중 1위를 차지했다. 올해 들어 하나증권의 DC 적립금은 36.5%, IRP 적립금은 38.8% 증가했다.", "category": "업계·경쟁사", "importance": 4, "source": "한경머니", "published": "2026-10-26", "url": "https://magazine.hankyung.com/money/article/202610264624c", "related": []}, {"id": "e63418b95bc2", "title": "퇴직연금 첫 분기 1882억 확보한 키움증권, IRP 쏠림 해소 과제 남겨", "summary": "키움증권의 3분기 퇴직연금 적립금은 1882억원으로 전 분기(649억원)보다 190% 증가했다. 적립금 확대는 IRP가 주도해 IRP 적립금이 1626억원, 전체 적립금 중 비중이 86.4%에 달했다. DB와 DC 적립금은 각각 150억원, 106억원으로 합산 256억원(13.6%)에 그쳤다. 연말 적립금 목표 5000억원 대비 3분기 말 달성률은 37.6%로, 목표를 달성하려면 4분기에 3118억원을 추가로 확보해야 한다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-10-23", "url": "https://www.ceoscoredaily.com/page/view/2026102215213434763", "related": []}, {"id": "dd6d3c9783e7", "title": "[퇴직연금 개편]與 기금형 퇴직연금 입법 속도…‘운용주체’ 쟁점", "summary": "이용우 더불어민주당 의원이 국민연금공단 등 공적연금관리기관의 퇴직연금 운용 참여를 허용하는 근로자퇴직급여 보장법 개정안을 대표발의했다. 개정안은 기금형을 금융기관개방형, 연합형, 공공기관개방형, 중소기업퇴직연금기금 등 4가지 유형으로 분류했다. 한정애 의원안은 노사가 참여하는 비영리 수탁법인을 중심으로 적립금 3000억원 이상 또는 가입자 3만명 이상 사업장 등에 기금형을 허용하는 모델이다. 안도걸 의원안은 민간 전문운용사 간 경쟁에 방점을 찍고 30인 이하 사업장 중심의 기금형을 전체 사업장으로 확대하며 가입자가 2년 단위로 기금을 옮길 수 있도록 했다.", "category": "제도·규제", "importance": 4, "source": "대한경제", "published": "2026-10-23", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610221712341290810", "related": []}, {"id": "b4cc17311e1b", "title": "[포커스] 신한銀, 투자형 퇴직연금 2.6배 성장…연금 우선순위 '자산관리'로", "summary": "금융감독원 통합연금포털 공시에 따르면 신한은행의 원리금비보장 퇴직연금 적립금은 2024년 말 7조 1462억 원에서 올해 3분기 말 18조 6740억 원으로 161.3% 증가했다. 전체 적립금 대비 투자형 비중은 15.6%에서 32.6%로 확대돼 5대 은행 중 가장 높았고, 하나은행 31.6%, KB국민은행 30.8%, 우리은행 28.4%, NH농협은행 19.9%가 뒤를 이었다. 투자형 적립금의 95.3%는 DC형과 개인형 IRP에 집중됐다. 다만 3분기 전체 적립금은 2분기 말 58조 8888억 원에서 57조 2252억 원으로 1조 6636억 원 줄었으며, 신한은행은 9월 퇴직연금 ETF 당일매매 서비스를 도입하는 등 운용 서비스를 강화하고 있다.", "category": "업계·경쟁사", "importance": 4, "source": "오늘경제", "published": "2026-10-22", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=816680", "related": []}, {"id": "6ad89726ed11", "title": "[단독]수익률 8%라던 중기 퇴직연금, 원금손실 1년간 급증", "summary": "이종배 의원실이 근로복지공단에서 받은 자료에 따르면 중소기업퇴직연금기금(푸른씨앗)에서 납입 원금보다 적게 받은 근로자는 지난해 177명에서 올해 8월까지 988명으로 늘었고 손실액은 600만원에서 9500만원으로 증가했다. 공단은 지난해 기금 운용수익률 8.67%를 기록했지만, 자산의 70% 내외를 채권 중심으로 운용해 올해 채권금리 상승과 환율 하락으로 손실이 발생했다고 설명했다. 노동부의 첫 종합평가에서는 전체 퇴직급여 지급 건수 중 7450건(12%)이 지급기한을 초과한 것으로 나타났다. 푸른씨앗 가입자는 올해 8월 말 20만1875명, 누적 적립금은 1조9203억원이다.", "category": "법인·자금운용", "importance": 4, "source": "뉴시스", "published": "2026-10-22", "url": "https://www.newsis.com/view/NISX20261021_0003834796", "related": []}, {"id": "dc3b72343c0f", "title": "퇴직연금 부문별 1위 갈렸다…하나은행, 전체 증가액·DB형 적립 '톱'", "summary": "9월 말 하나은행의 퇴직연금 적립금은 52조1554억원으로 작년 말보다 3조7741억원(7.8%) 늘어 주요 6개 은행 가운데 증가액이 가장 컸다. 하나은행의 DB 적립금은 18조2417억원으로 6개 은행 중 가장 많았고, DC·IRP 증가액 4조3927억원이 DB 감소액 6186억원을 상쇄했다. 전체 적립금은 신한은행이 57조2252억원으로 1위, 국민은행이 52조2226억원으로 2위였으며 하나은행은 672억원 차이로 뒤를 이었다. IRP 적립금은 신한은행이 22조8540억원으로 가장 컸고, DC 적립금은 국민은행이 17조1151억원으로 신한은행보다 4301억원 많았다.", "category": "업계·경쟁사", "importance": 4, "source": "블로터", "published": "2026-10-22", "url": "https://www.bloter.net/news/articleView.html?idxno=676368", "related": []}, {"id": "c993f9732198", "title": "[투데이 Pick] 퇴직연금 1위 내준 신한은행…국민·하나·우리·기업도 초접전", "summary": "3분기 말 삼성생명의 퇴직연금 적립금은 57조5486억원으로 신한은행(57조2252억원)을 3234억원 앞서 전체 사업자 1위에 올랐다. 국민은행(52조2226억원)과 하나은행(52조1554억원)의 격차는 2분기 말 3152억원에서 672억원으로, 우리은행(33조243억원)과 기업은행(32조9898억원)의 격차는 5813억원에서 345억원으로 줄었다. 올해 누적으로는 하나은행이 3조7741억원, 국민은행이 3조7688억원 늘어 주요 은행 모두 지난해 말보다 적립금이 증가했다. IRP에서는 신한은행이 22조8540억원으로 1위를 유지했으나 국민은행(22조6099억원)과의 격차가 2441억원으로 좁혀졌다.", "category": "업계·경쟁사", "importance": 4, "source": "뉴스투데이", "published": "2026-10-21", "url": "https://www.news2day.co.kr/article/20261020500333", "related": []}, {"id": "6006be01159b", "title": "내 퇴직연금, 국민연금이 굴릴까…기금형 도입에 갈리는 운용 방식", "summary": "당정은 국정감사 이후 정부안과 여당 의원 법안을 통합해 기금형 퇴직연금 입법 논의를 본격화할 예정이나 운용 주체와 적용 범위는 아직 확정되지 않았다. 한정애 의원안은 적립금 3000억원 이상 또는 가입자 3만명 이상 사업장에 노사 공동 수탁법인을, 안도걸 의원안은 민간 전문운용사 간 경쟁을, 박홍배·안호영 의원안은 퇴직연금공단 설립을 담았다. 이용우 의원안은 국민연금공단 등 공적연금기관이 사업자로 참여하도록 하되 시장점유율을 시행 후 3년까지 10%, 4년째 20%, 5년째 30%로 제한했다. 공공기관 개방형 기금의 도입·운영 비용은 국가가 부담하도록 했다.", "category": "제도·규제", "importance": 4, "source": "데일리팝", "published": "2026-10-21", "url": "http://www.dailypop.kr/news/articleView.html?idxno=103463", "related": []}, {"id": "11d18d6258e3", "title": "주식·채권 동반 급락에… ‘알아서 굴려준다’던 TDF의 배신", "summary": "에프엔가이드에 따르면 설정액 10억원 이상 TDF의 최근 3개월 수익률은 -7.07%, 6개월 수익률은 -2.88%로 국내 혼합형 펀드(-5.01%, -2.00%)보다 부진했다. 최근 5년 수익률도 TDF는 28.07%로 국내 주식형 펀드(86.70%)와 혼합형 펀드(29.70%)에 못 미쳤다. 주식과 채권 가격이 동반 하락하면서 채권이 주식 하락을 방어하는 기능이 작동하지 않은 탓이다. TDF 순자산은 2020년 말 5조원 수준에서 10월 20일 기준 32조7000억원으로 늘었고 올해 증가분만 7조2000억원이 넘는다.", "category": "운용·상품", "importance": 4, "source": "조선비즈", "published": "2026-10-21", "url": "https://biz.chosun.com/stock/stock_general/2026/10/21/IQNNSP3Z2NHLJFSXM7CGVI2PDQ/", "related": []}, {"id": "b4b11f82c66f", "title": "[단독]'2兆 규모' 中企퇴직연기금…운용기관 차등배분 2년째 0%대", "summary": "2022년 도입된 공적 기금형 퇴직연금인 중소기업퇴직연금기금(푸른씨앗) 적립금이 지난달 기준 1조9524억원으로, 이달 2조원을 넘길 전망이다. 김위상 의원실이 받은 근로복지공단 자료에 따르면 올해 2분기부터 내년 1분기까지 전담운용기관별 자금 배분 비율은 삼성자산운용 50.72%, 미래에셋증권 49.28%다. 공단은 실적 평가에 따라 배분을 차등화해 경쟁 효과를 높이겠다고 했지만 차등 폭은 작년 0.52%에 이어 올해도 1% 미만에 그쳤다. 내년에는 가입 대상이 50인 미만에서 100인 미만 사업장으로 확대된다.", "category": "법인·자금운용", "importance": 4, "source": "아시아경제", "published": "2026-10-21", "url": "https://www.asiae.co.kr/article/2026102110102108016", "related": []}, {"id": "006abacaa5b3", "title": "증시 폭락에 4.7조 날린 연금…삼성·한투·키움은 DC형 선방", "summary": "증권사 15곳의 3분기 퇴직연금 적립금이 4조7533억원, 2.9% 줄었다. 증시 하락으로 펀드와 ETF 평가액이 떨어진 영향이다. DC형은 삼성증권이 11조5556억원으로 2519억원(2.2%), 한국투자증권이 8조387억원으로 918억원(1.2%) 늘며 버텼고, 모바일 연금자산 관리 편의성과 수수료 부담 완화가 배경으로 꼽혔다. 6월 퇴직연금 사업에 진출한 키움증권은 DC형이 106억원으로 늘었고 IRP에서 977억원, 150.5% 증가했다.", "category": "업계·경쟁사", "importance": 4, "source": "파이낸셜투데이", "published": "2026-10-20", "url": "http://www.ftoday.co.kr/news/articleView.html?idxno=367677", "related": []}, {"id": "2c21c94f9f58", "title": "NH투자증권, 퇴직연금 장기 수익률 앞세워 IMA까지 확대…연금·투자 사업 강화", "summary": "NH투자증권은 금융감독원이 공시한 2026년 3분기 퇴직연금 수익률 비교에서 DB 원리금보장형 5년 수익률 3.88%, 7년 3.36%로 전체 퇴직연금사업자 중 각각 1위를 기록했다고 밝혔다. IRP 원리금보장형은 3년 수익률 3.90%로 전체 1위, 5년 3.51%·7년 2.99%·10년 2.70%로 각각 전체 2위였다. IRP 원리금비보장형 수익률은 5년 7.16%, 7년 8.19%, 10년 5.90%였다. 회사는 10월 26일부터 29일까지 총 1200억원 규모, 만기 2년 3개월의 'N2 IMA1 중기형 4호'를 모집한다.", "category": "업계·경쟁사", "importance": 3, "source": "데일리팝", "published": "2026-10-24", "url": "http://www.dailypop.kr/news/articleView.html?idxno=103717", "related": [{"title": "신한투자증권, Npay 간편주문 챌린지…NH투자증권, 퇴직연금 장기수익률 최상위", "source": "뉴스티앤티", "url": "https://www.newstnt.com/news/articleView.html?idxno=724706"}]}, {"id": "04e27515ed12", "title": "'420배 차이' 노후대비 연금 시장도 양극화 극심[연금자산 양극화]①", "summary": "국내 연금자산 시장이 2300조원을 넘고 퇴직연금 시장이 500조원을 돌파했지만 소득·사업장 규모·고용 형태에 따라 가입부터 수령까지 격차가 누적되는 연금자산 양극화가 심화되고 있다. 보험연구원에 따르면 연 근로소득 2000만원 이하 근로자의 연금저축 가입률은 0.1%인 반면 8000만원 초과 근로자는 42.0%로 420배 차이가 났다. 국가데이터처 '2024년 퇴직연금통계'에서 300인 이상 대기업 근로자의 퇴직연금 가입률은 70.6%, 5인 미만 영세사업장은 11.9%였다. NH투자증권 100세시대연구소 보고서에서는 상용근로자 가구의 평균 순자산이 4억9915만원으로 임시·일용근로자 가구(2억3550만원)의 2배 이상이었다.", "category": "가입자·사회", "importance": 3, "source": "아시아경제", "published": "2026-10-26", "url": "https://view.asiae.co.kr/article/2026102315211444862", "related": []}, {"id": "cbb65cadb972", "title": "“퇴직금 불리려다 날벼락”…DC형 갈아탄 직장인 수익률 '-10%'", "summary": "박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 전년 동기 대비 181.2% 증가했다. 전환 직후 하락장을 맞아 미래에셋증권과 한국투자증권의 해당 가입자들은 7~8월 단순 기간수익률이 각각 -10.7%, -10.2%를 기록했고, 같은 기간 코스피는 18.1% 하락했다. 기사는 TDF·대표 지수형 ETF를 핵심 자산으로, 섹터형 ETF를 위성 자산으로 두는 핵심·위성 전략과 디폴트옵션·일임형 로보어드바이저 활용을 소개했다. DC형 전환 전에는 회사 퇴직연금 규약과 전환 조건을 확인하고 기존 제도 유지 시 예상 퇴직급여와 비교할 필요가 있다고 전했다.", "category": "운용·상품", "importance": 3, "source": "이코노미스트", "published": "2026-10-26", "url": "https://economist.co.kr/article/view/ecn202610200050", "related": []}, {"id": "9f01dea0efad", "title": "[핫이슈] '시한폭탄' 된 세계 연금…55개국 중 43곳 출산율 '유지선' 붕괴", "summary": "머서와 CFA협회가 발표한 '2026 글로벌 연금지수' 보고서에서 조사 대상 55개국 중 43개국의 합계출산율이 인구 대체 수준인 2.1명에 미치지 못했다. 한국은 종합 점수 56.4점으로 C등급을 받아 55개국 중 45위에 그쳤고, 적정성 지수는 43.0점으로 51위였다. 보고서는 한국에 노인 빈곤층 지원 확대, 퇴직연금의 일시금 수령 제한 및 종신 연금화 의무화, 국민연금 적립 보험료율의 조속한 인상을 권고했다. 종합 1위는 85.8점으로 A등급을 받은 네덜란드였다.", "category": "가입자·사회", "importance": 3, "source": "더투데이", "published": "2026-10-26", "url": "https://www.the-today.com/news/articleView.html?idxno=92403", "related": []}, {"id": "7acdac72cca8", "title": "증시 급락에 퇴직연금·국민연금 '초토화'…노후자금 수익률 비상", "summary": "26일 금융감독원 통합연금포털에 따르면 올해 3분기 말 43개 퇴직연금 사업자의 적립금은 542조1214억원으로 전 분기 대비 11조7565억원(2.12%) 감소했다. 1 //www.yna.co.kr/view/AKR20261012029400530", "related": [{"title": "공공기관 5곳 중 1곳, 퇴직연금 적립금 법정 기준 못 채웠다", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10912175?ref=naver"}]}, {"id": "0369d6c3118c", "title": "퇴직연금 223조원 쌓인 5대은행…국민·하나 2위 각축전", "summary": "5대 시중은행의 3분기 말 퇴직연금 적립금은 222조9427억원으로 집계됐다. 신한은행이 57조2252억원으로 1위이고 KB국민은행 52조2226억원, 하나은행 52조1554억원, 우리은행 33조243억원, NH농협은행 28조3152억원 순이다. KB국민은행과 하나은행의 격차는 672억원으로, 2분기 말 3152억원에서 크게 좁혀져 지난해 말 725억원 수준으로 돌아왔다. 올해 누적 증가액은 하나은행 3조7741억원, KB국민은행 3조7688억원으로 53억원 차이다.", "category": "업계·경쟁사", "importance": 4, "source": "이데일리", "published": "2026-10-19", "url": "https://www.edaily.co.kr/News/Read?newsId=03496486645614560&mediaCodeNo=257", "related": [{"title": "퇴직연금 2위 경쟁 격화…하나은행·국민은행 적립금 격차 672억원", "source": "CEO스코어데일리", "url": "https://www.ceoscoredaily.com/page/view/2026102015471625110"}]}, {"id": "6c986a5b1bb4", "title": "한국투자증권, 기업 대상 ‘퇴직연금 아카데미’ 개최…제도 변화 대응 전략 제시", "summary": "한국투자증권은 지난 8일 서울 여의도 TP타워에서 기업 인사·재무 담당자 등 퇴직연금 실무자를 대상으로 ‘퇴직연금 아카데미’를 개최했다. 행사는 근로자퇴직급여 보장법 개정 추진에 맞춰 기금형 퇴직연금 도입과 퇴직급여 사외적립 의무화 등 현안을 중심으로 3개 세션으로 진행됐다. 기금형 도입에 따른 운용 효율성 제고 방안과 사외적립 의무화 대비 실무 가이드라인, 정년연장·임금피크제 운영 전략, 전담 RM 활용 방안 등이 소개됐다. 김도현 개인고객그룹장은 기업들이 제도 변화에 선제적으로 대응할 수 있도록 맞춤형 컨설팅과 실무 지원을 강화하겠다고 말했다.", "category": "법인·자금운용", "importance": 3, "source": "비즈월드", "published": "2026-10-13", "url": "http://www.bizwnews.com/news/articleView.html?idxno=148655", "related": [{"title": "한국투자증권, 퇴직연금 500조 기업시장 공략…인사·재무 담당자 접점 확대", "source": "토요경제", "url": "https://sateconomy.co.kr/news/view/1065574639722076"}, {"title": "한국투자증권, 기업 실무진 대상 '퇴직연금 아카데미' 개최", "source": "뉴스드림", "url": "http://www.newsdream.kr/news/articleView.html?idxno=119732"}, {"title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "source": "아시아경제", "url": "https://view.asiae.co.kr/article/2026101209461462366"}, {"title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "source": "머니투데이", "url": "https://www.mt.co.kr/stock/2026/10/12/2026101210195750915"}]}, {"id": "7ef94cfb1aa4", "title": "[경제 트렌드] 증권사, 퇴직연금 규모 급증...한국투자증권, 연금 적립·운용·수령까지 은퇴 준비 전 과정 밀착 지원", "summary": "퇴직연금 적립금은 지난 8월 기준 550조원을 웃돌았고 실적배당형 비중은 35%를 기록했으며, 증권사 퇴직연금 규모는 2025년 말 141조6797억원으로 전 금융권 적립금의 29.3%를 차지했다. 증권사 적립금 순위는 미래에셋증권, 삼성증권, 한국투자증권, 현대차증권, NH투자증권 순이다. 한국투자증권은 연금 MTS를 개편해 '나의 총 연금자산'과 개인화 맞춤 알림 기능을 도입했고, 신규 DC 가입자 평균 연령이 2015년 40세에서 2025년 36세로 낮아졌다고 밝혔다. 신한투자증권은 올해 연금고객관리팀을 신설해 신규 DC·IRP 가입 고객 대상 웰컴콜과 연금PB 1대1 매칭, 'Premier 연금컨설팅'을 운영하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "시사캐스트", "published": "2026-10-08", "url": "http://www.sisacast.kr/news/articleView.html?idxno=100731", "related": [{"title": "한국투자증권, 연금 MTS 개편…“적립·운용·수령까지 밀착 지원”", "source": "더퍼블릭", "url": "https://www.thepublic.kr/news/articleView.html?idxno=321335"}, {"title": "한국투자증권, 연금 MTS 개편 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31774"}]}, {"id": "ee6cf0e31b06", "title": "“부유한 노인도 받는다”…기초연금 ‘하위 70%’ 기준 개편 추진", "summary": "정부가 기초연금 수급 대상을 현행 노인 소득 하위 70% 방식에서 기준중위소득과 연계하는 방식으로 개편할 계획이다. 내년에는 소득 하위 30%의 기준연금액을 월 35만원에서 38만원으로 올리고 차등 지급을 적용한다. 다만 이 조치의 노인빈곤율 개선 효과는 0.3%포인트에 그친다. 정부는 저소득 노인의 급여 인상에 집중하기 위해 장기적으로 수급 구조를 개편할 방침이다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-03", "url": "https://www.segye.com/newsView/20261002510945?OutUrl=naver", "related": [{"title": "이재명 정부, 기초연금 개혁 회피해선 안 된다", "source": "시사IN", "url": "https://www.sisain.co.kr/news/articleView.html?idxno=58534"}, {"title": "기초연금 '소득 하위 70%' 기준 바꾼다…중위소득 연계 재추진", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6308073"}]}, {"id": "6da1ff9b2cf1", "title": "'2164억 체불' 대유위니아…3년 연속 퇴직연금 적립 미달", "summary": "대유위니아 계열 가전 3사(위니아·위니아전자·위니아전자MF)가 2022년부터 2024년까지 3년 연속 DB형 퇴직연금 법정 최소적립금을 채우지 못한 것으로 김주영 의원이 고용노동부에서 받은 자료에서 나타났다. 위니아전자의 최소적립금 대비 실제 적립 비율은 2022년 5.86%, 2023년 5.88%, 2024년 5.68%였고 위니아전자MF는 같은 기간 14.11%에서 9.45%로 떨어졌다. 2022년부터 지난달 3일까지 3사의 전체 체불액은 2164억원이며 이 중 체불 퇴직금은 858억원이다. 고용노동부가 이들 계열사에 관련 과태료를 부과한 사례는 없었다.", "category": "법인·자금운용", "importance": 3, "source": "뉴시스", "published": "2026-10-10", "url": "https://www.newsis.com/view/NISX20261010_0003820502", "related": [{"title": "대유위니아 가전 3사, 퇴직연금 법정 적립금 3년 연속 미달", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5070068"}]}, {"id": "fcba047b4874", "title": "머니무브 주춤, 더 치열해진 증권사 퇴직연금 경쟁", "summary": "올해 2분기말 기준 퇴직연금 시장은 553조8949억원이며 증권사 비중은 지난해말 26.47%에서 2분기 29.8%로 늘었다. 증권업종 적립금 165조원 중 미래에셋증권이 52조원(31.5%)을 차지하고 삼성증권 28조원, 한국투자증권 26조원이 뒤를 잇는다. 3분기 증시 조정으로 4~6월 DB형에서 DC형으로 전환한 증권사 가입자의 7월·8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 한국투자증권의 MTS 연금서비스 전면개편, 신한투자증권의 연금고객관리팀 신설, NH투자증권의 법인고객 관리시스템(CIS) 구축 등 증권사들이 타사 고객 유치 경쟁에 나서고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "비즈워치", "published": "2026-10-09", "url": "https://news.bizwatch.co.kr/article/market/2026/10/08/0005", "related": [{"title": "퇴직연금 165조 잡은 증권사…다음 승부처는 '고객관리'", "source": "뉴스웨이", "url": "https://www.newsway.co.kr/news/view?ud=2026100713530728574"}]}, {"id": "c4dab2068ab2", "title": "복지부 국감 개막⋯기초연금 '반쪽 개편'·국민연금 손실 추궁 [국감]", "summary": "국회 보건복지위원회가 7일 보건복지부와 질병관리청을 시작으로 이틀간 국정감사에 들어갔다. 핵심 쟁점은 연금제도 개편안으로, 복지부가 추진해 온 저소득층 노인 중심 '하후상박' 기초연금 개편이 사회적 논의 부족을 이유로 1년짜리 단기 계획에 그친 점이 '반쪽 개편'이라는 지적을 받을 전망이다. 국민연금은 기금 재정 안정성과 함께 자산배분 리밸런싱 한시 유예, 국내 주식 목표 비중 상향(14.9%→20.8%)에 따른 증시 급락 손실 문제가 검증대에 오른다. 복지위 국감은 14일 국민연금공단, 16일 국민건강보험공단·건강보험심사평가원을 거쳐 27일 종합감사로 마무리된다.", "category": "제도·규제", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2633071", "related": [{"title": "기초연금 '반쪽' 개편·국립대병원 첫 등판…복지부 국감 쟁점은", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261003_0003813472"}]}, {"id": "3222e4df0aa6", "title": "[연금개혁] '골든타임' 놓치면 무용지물…국고 GDP 1% 지금 투입 땐 31년 연장, 고갈 후엔 1년뿐", "summary": "국회예산정책처 분석에 따르면 현행 제도가 유지될 경우 국민연금 기금은 2069년에 소진된다. 정부가 지금부터 매년 GDP의 1%를 투입하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥난 2069년부터 투입하면 1년만 연장된다. 기금 수익률을 2%포인트 높이면 2120년까지 흑자를 유지할 수 있다.", "category": "제도·규제", "importance": 3, "source": "CBC뉴스", "published": "2026-10-01", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=611066", "related": [{"title": "\"국민연금 수익률 2%p 높이면 2120년까지 기금 고갈 없어\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260929100600530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}]}, {"id": "dd4beb88ba61", "title": "“4조 8천억 몰렸다”…S&P500으로 노후 준비? 이렇게 하세요 [잇슈 머니]", "summary": "국내에 상장된 S&P500 지수 상품 하나에 올해 들어 9월 28일까지 개인 자금 4조8611억원이 들어와 국내 ETF 가운데 1위를 기록했다. 연금저축과 개인형퇴직연금(IRP)은 둘을 합쳐 연 900만원까지 세액공제를 받고, 총급여 5500만원 이하 근로자는 공제율 16.5%가 적용돼 900만원을 넣으면 최대 148만5000원을 돌려받는다. 운용수익에는 세금을 바로 떼지 않고 55세 이후 연금으로 받을 때 3.3~5.5%의 연금소득세만 내지만, 연금 수령액이 연 1500만원을 넘으면 종합과세와 16.5% 분리과세 가운데 하나를 골라야 한다. 원·달러 환율이 7월 1일 장중 1550.85원에서 10월 2일 1350.6원으로 내려오면서 같은 S&P500 지수를 따르는 국내 상장 ETF의 최근 석 달 수익률은 환헤지형 2.19% 상승, 환노출형 6.23% 하락으로 갈렸다.", "category": "운용·상품", "importance": 2, "source": "KBS", "published": "2026-10-05", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8677562&ref=A", "related": [{"title": "한국증시 뛰었는데…개인 4.9조는 美 S&P500 ETF로", "source": "매일일보", "url": "https://www.m-i.kr/news/articleView.html?idxno=2002553"}, {"title": "개미 자금 4.9조 몰렸다…미래에셋 S&P500 ETF 1위·삼성 고배당도 성장세", "source": "더구루", "url": "https://www.theguru.co.kr/news/article.html?no=107765"}]}]}, "yearly": {"period": "yearly", "key": "current", "label": "2025-10-27 ~ 2026-10-26", "ge icleView.html?idxno=4440263"}]}, {"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "so 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로
     그보다 넉넉히 잡아야 매일 아침 헛경보가 뜨지 않는다. */
  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
         + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

  function buildStaleNotice() {
    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
