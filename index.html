     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나. */
  :root {

    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;

    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;

    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {

      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;

      --kiwoom: #FF7A63;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;

  }

  .masthead {

    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {

    letter-spacing: 0.22em;
    color: var(--ink-soft);

    font-weight: 700;

    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .search input {
    width: 230px;
    max-width: 44vw;
    padding: 4px 0;
    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */
  .group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);

    margin: 36px 0 0;

  .rail button {

    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);

    padding-top: 9px;

    padding: 14px 0 0;

    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;

  .filters button[aria-pressed="true"] {

    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;

  .list { margin: 8px 0 0; }

  article {
    display: grid;

    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);

    font-weight: 600;
    letter-spacing: 0.02em;

  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

  details summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;

    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

ished": "2026-09-27", "url": "https://www.mt.co.kr/living/2026/09/27/2026092622024336056"}, {"id": "63640bef7522", "title": "[개인국채 시대] 삼성·한투·KB·NH證 합류…경쟁 본격화", "summary": "개인투자용 국채가 퇴직연금 투자 대상으로 편입되면서 삼성증권·한국투자증권·KB증권·NH투자증권이 새로 판매에 나서, 2024년 도입 이후 미래에셋증권이 맡아온 단독 판매 구도가 깨졌다고 전했다. 이달부터 확정기여형(DC)과 개인형퇴직연금(IRP) 계좌에서도 10년물과 20년물 국채를 매입할 수 있게 됐고, 판매 금융회사는 신한·하나·NH농협은행 3곳과 미래에셋·삼성·한국투자·KB·NH투자증권 5곳이다. 정부는 판매 준비가 즉시 가능한 퇴직연금사업자를 중심으로 판매를 시작한 뒤 취급 금융기관을 점차 확대할 계획이다. 삼성증권은 연말까지 DC·IRP 계좌 청약 고객 500명에게 네이버페이 포인트를, 한국투자증권은 타사 DC·IRP 자산을 이전하는 고객에게 3만원 상당 모바일 상품권을 주는 이벤트를 열었고, 업계에서는 금리와 상품 조건이 같은 만큼 청약 편의성과 판매 채널이 경쟁 우위를 가를 것으로 전망했다.", "category": "업계·경쟁사", "importance": 3, "source": "딜사이트경제TV", "published": "2026-09-27", "url": "https://news.dealsitetv.com/articles/176341"}, {"id": "7dbbd9af01e2", "title": "[단독]국민연금, '갑질 논란' 부동산투자실 감사 곧 마무리…징계위 연다", "summary": "국민연금공단이 안 모 전 부동산투자실장에 대한 감사를 마무리하고 수일 내 징계위원회를 연다. 안 전 실장은 거액의 출자 권한을 이용해 외부 위탁운용사 인사에 개입하고 관계자에게 부당한 영향력을 행사했다는 의혹을 받고 있으며, 국민연금은 출입 금지 조치를 내렸다. 4조원대 자산인 서울 역삼 센터필드에서 위탁운용사 교체를 무리하게 시도했고, 2520억원을 투자한 서울 중구 더익스체인지서울에서는 채용 청탁 의혹이 제기됐다. 시민단체는 부동산투자실 문제를 구조적인 내부통제 실패로 보고 개선을 요구했다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01744966645584384&mediaCodeNo=257"}, {"id": "3cc6c51d988b", "title": "국민연금, '첫 보험료' 청년 소통 강화", "summary": "국민연금공단이 2026년 사업운영계획을 수정·보완해 중점 추진 과제를 기존 41개에서 45개로 확대했다. 신설한 과제는 청년 세대와 양방향 소통 활성화, 전북 금융생태계 조성 지원, 인공지능·데이터 활용 촉진을 위한 조직·인력 역량 강화다. 내년 1월 시행하는 청년 생애 첫 연금보험료 지원 제도는 18세(2009년 출생부터)가 되는 청년부터 순차 적용하며, 생애 첫 1개월분 연금보험료 약 4만2000원을 국가가 지원하거나 가입 기간을 추가로 산입해준다. 공단은 노령연금 자동지급 서비스와 찾아가는 연금배달서비스도 신규 사업에 반영하고 기금운용 내부통제 실효성을 강화한다.", "category": "가입자·사회", "importance": 3, "source": "브릿지경제", "published": "2026-09-27", "url": "https://www.viva100.com/article/20260927500327"}, {"id": "e1a04d48a784", "title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "summary": "윤영석 국회 연금개혁특별위원회 위원장이 28일 오후 2시 국회 의원회관 제1소회의실에서 '지속가능하고 공정한 연금제도를 위한 구조개혁' 정책토론회를 연다. 오기형·안상훈 연금개혁특위 여야 간사가 공동 주최하며, 2025년 국민연금 모수조정 이후 남아 있는 구조개혁 과제를 논의한다. 국민연금뿐 아니라 기초연금·퇴직연금·개인연금을 포괄하는 다층 노후소득보장체계와 국민연금 재정안정화, 국가재정의 역할을 정부 관계부처와 전문가가 함께 다룬다. 좌장은 구인회 서울대 교수가 맡고 양재진 연세대 교수와 김학주 동국대 교수가 주제발표에 나서며, 윤 위원장은 토론회에서 나온 의견을 연금개혁특위의 구조개혁 입법과 정책과제에 반영하겠다고 밝혔다.", "category": "제도·규제", "importance": 3, "source": "경남도민신문", "published": "2026-09-27", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}, {"id": "fe27a9c1f72c", "title": "[한국경제 아킬레스건](4) 초고령사회 진입 : 급증하는 사회적 부양비의 무게", "summary": "권의종·이왕로 박사는 한국이 65세 이상 고령층 비율 20%를 넘는 초고령사회로 수직 직행했으며, 그 속도가 유럽이나 일본과 비교해도 압도적으로 빠르다고 지적했다. 생산연령인구(15~64세) 100명이 부양해야 하는 고령 인구를 뜻하는 노년부양비가 직각에 가까운 기울기로 치솟아, 일할 사람 한두 명이 노인 한 명의 연금·의료·돌봄 비용을 책임지는 구조로 급변했다고 진단했다. 건강보험료, 국민연금 보험료, 노인장기요양보험료, 소득세율 인상이 근로자의 실질 처분가능소득을 갉아먹으며 세대 간 갈등을 키운다고 봤다. 필자들은 정년 조정을 포함한 노동시장 개혁과 사회적 부양 체계를 공공·민간이 분담하는 구조조정이 불가피하다고 주장했다.", "category": "가입자·사회", "importance": 2, "source": "금융소비자뉴스", "published": "2026-09-27", "url": "http://www.newsfc.co.kr/news/articleView.html?idxno=81359"}, {"id": "6be185e1029a", "title": "50세, 연금 시작해도 된다…죽을 때까지 월 200만원 받는 법", "summary": "박동호 당연투자자문 대표는 현실적인 은퇴 자금 목표를 1인당 3억원, 여유로운 수준은 5억원으로 제시했다. 국민연금공단 2023년 기준 적정 노후 생활비는 부부 월 300만원, 개인 월 200만원이며, 은퇴 부부가 6억~7억원으로 연 6% 배당 포트폴리오를 짜면 원금을 건드리지 않고 생활이 가능하다고 설명했다. 50세부터 5년간 월 150만원, 이후 5년간 월 75만원을 연금저축계좌에 납입하고 60세 이후 연 5% 수익률로 운용하면 65세에 2억600만원이 모인다는 3단계 전략을 내놨다. 연금저축계좌는 KODEX·KOSEF 미국달러선물 같은 선물형 달러 ETF를 제약 없이 담을 수 있지만 IRP(개인형 퇴직연금)는 파생상품 ETF 투자가 불가능해 채권형이나 합성형 달러 ETF를 써야 한다고 덧붙였다.", "category": "가입자·사회", "importance": 2, "source": "중앙일보 (유료)", "published": "2026-09-27", "url": "https://www.joongang.co.kr/article/25464916"}, {"id": "0efaa0e8bbd4", "title": "증시 변동성에 주목받는 파킹 ETF···KOFR·CD금리·머니마켓 3色", "summary": "증시 변동성이 커지면서 단기 자금을 잠시 맡겨두는 파킹형 ETF에 자금이 몰리고 있다고 전했다. 국내 파킹형 ETF는 KOFR금리·CD금리·머니마켓 세 유형으로 나뉘며, KOFR금리 ETF는 듀레이션이 하루 수준이어서 가격 위험이 가장 작고 기대수익률도 가장 낮다고 설명했다. CD금리 ETF는 91일물과 1년물이 있어 만기가 길수록 기간 프리미엄을 기대할 수 있고, 머니마켓 ETF는 CP·전자단기사채·단기채권·CD·RP를 함께 담아 기대수익률이 가장 높은 대신 시가평가로 가격이 움직인다고 짚었다. 상당수 파킹형 ETF는 연금저축에서 매수할 수 있고 IRP·DC형 퇴직연금에서는 안전자산으로 분류돼 적립금의 100%까지 투자할 수 있다고 덧붙였다.", "category": "운용·상품", "importance": 2, "source": "시사저널이코노미", "published": "2026-09-27", "url": "https://www.sisajournal-e.com/news/articleView.html?idxno=423895"}, {"id": "71bc2c4b7700", "title": "10억 주택 맡기면 월 330만원씩 통장에 꽂힌다…무슨 연금이길래?", "summary": "집은 있지만 현금이 부족한 고령층이 살던 집을 담보로 맡기고 계속 거주하면서 매달 연금을 받는 주택연금 제도를 정리했다. 올해 3월 이후 신규 신청자의 월 지급금은 평균 3.13% 올라, 10억원짜리 일반주택을 맡긴 72세 가입자가 종신지급·정액형에 가입하면 월 334만5370원을 받는다. 초기보증료율은 주택가격의 1.5%에서 1%로 낮아졌고, 매년 대출잔액에 붙는 연보증료율은 0.75%에서 0.95%로 높아졌다. 가입 요건은 부부 중 한 명이 55세 이상이고 부부 보유 주택 공시가격 합계가 12억원 이하인 경우이며, 올해 6월부터는 질병 치료나 요양시설 입소 같은 불가피한 사유가 있으면 승인을 받아 실거주하지 않고도 주택연금을 유지할 수 있다.", "category": "가입자·사회", "importance": 2, "source": "SBS Biz", "published": "2026-09-27", "url": "https://biz.sbs.co.kr/article/20000336810"}, {"id": "8fcc40b2776f", "title": "추석 용돈·떡값으로 ETF 사볼까…운용사 추천 상품", "summary": "자산운용사들이 추석에 받은 용돈과 상여금을 굴릴 ETF를 성장형·배당형·혼합형으로 나눠 추천했다고 전했다. 성장형으로는 순자산 20조원을 넘긴 TIGER 미국S&P500과 1년 수익률 124.40%·3년 수익률 468.42%를 낸 ACE 글로벌반도체TOP4 Plus가, 배당형으로는 순자산 2조3939억원에 올해 수익률 20.8%를 기록한 PLUS 고배당주가 꼽혔다. 혼합형 가운데 금 50%와 국고채 3년물 50%로 구성된 PLUS 금채권혼합은 퇴직연금 계좌에서 편입 한도 제한 없이 담을 수 있고, 순자산 4조원대인 RISE 삼성전자SK하이닉스채권혼합50은 퇴직연금 계좌에서 100% 투자가 가능하다고 설명했다. 다만 AI·반도체 ETF는 산업 집중도가 높고 배당·커버드콜 상품의 분배금은 시장 상황에 따라 변한다며 투자 기간과 목적에 따라 나눠 담을 필요가 있다고 짚었다.", "category": "운용·상품", "importance": 2, "source": "이투데이", "published": "2026-09-27", "url": "https://www.etoday.co.kr/news/view/2629088"}, {"id": "1c1ffa8cb0ad", "title": "목돈 급해도 퇴직금 중간정산은 제한", "summary": "2026년 9월 18일 시행된 근로자퇴직급여 보장법과 시행령이 정한 퇴직금 중간정산 허용 사유를 정리했다. 무주택 근로자의 본인 명의 주택 구입과 주거 목적 전세금·임차보증금 부담, 6개월 이상 요양이 필요한 본인·배우자·부양가족의 의료비를 연간 임금총액의 12.5%를 넘게 부담하는 경우가 해당한다. 신청일로부터 거꾸로 5년 이내에 파산선고나 개인회생절차개시 결정을 받은 경우, 정년 연장·보장과 함께 임금을 줄이는 제도를 시행하는 경우, 근로자 합의로 소정근로시간을 하루 1시간 또는 주 5시간 이상 줄여 3개월 이상 계속 근무한 경우도 사유로 들었다. 법정 사유를 충족해도 단체협약·취업규칙·근로계약에 정한 내용이나 당사자 간 합의가 있어야 지급되며, 중간정산을 하면 계속근로기간은 그 시점부터 새로 계산된다고 설명했다.", "category": "제도·규제", "importance": 2, "source": "비건뉴스", "published": "2026-09-27", "url": "https://www.vegannews.co.kr/news/article.html?no=388255"}, {"id": "1fc91cd9d139", "title": "리스크 관리·노후수입 한번에…주목받는 보증형 실적 배당보험", "summary": "미래에셋생명의 개인형 퇴직연금(IRP) 보증형 실적배당보험이 출시 후 717억원을 모집했다고 전했다. 이 상품은 IRP를 통해서만 가입할 수 있는 거치형으로, 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 연금 개시가 가능하다. 이미 만 55세를 넘긴 가입자는 가입과 동시에 연금을 받을 수 있고, 적립금이 소진될 때까지 20년 이상 연금을 수령할 수 있다. 적립금은 미래에셋생명의 일임형 자산배분펀드 MVP펀드를 통해 글로벌 자산에 분산투자된다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645584384&mediaCodeNo=257"}, {"id": "3a11db3489ea", "title": "\"장사 안돼서 내보내는 줄 알았는데\"…올해 희망퇴직 '인력 재편' 신호탄", "summary": "올해 유통·이커머스 업계의 희망퇴직이 실적 악화에 따른 비용 절감을 넘어 사업 구조를 바꾸는 과정의 인력 재편 수단으로 쓰이고 있다. 홈플러스는 지난 5월 홈플러스 익스프레스 선임급 이상 약 800명을 대상으로 희망퇴직을 실시하며 근속 20년 이상에 기본급 12개월분, 10~19년 10개월분, 4~9년 8개월분을 지급했다. 11번가는 7월 근속 2년 이상 정규직에게 최대 10개월 치 급여와 재취업 지원을 제공했고, 롯데백화점은 이달 21일부터 근속 20년 이상 직원을 대상으로 기준임금 40개월분과 재취업 지원금 2000만원을 걸고 신청을 받고 있다. 롯데백화점은 희망퇴직과 동시에 신규 채용을 이어가며 이를 인력 구조 선순환을 위한 조치라고 설명했다.", "category": "가입자·사회", "importance": 2, "source": "뉴스1", "published": "2026-09-27", "url": "https://www.news1.kr/industry/distribution/6300499"}, {"id": "b4639a330a66", "title": "\"35년 삼성맨인데 인턴입니다\"…62세에 다시 출근한 이유", "summary": "삼성그룹에서 35년간 근무한 최성식(62)씨가 2024년 8월 스킨케어 스타트업 폴리페놀팩토리의 최고재무책임자로 합류했다. 그는 명함 직함을 '인턴 CFO'로 적고 20~30대 연구원들과 함께 일한다. 최씨는 삼성생명 펀드매니저를 거쳐 삼성자산운용 홍콩·베이징 사무소장을 지낸 뒤 퇴직했다. 그는 과거의 성공 방식에 매달리면 경험이 오히려 부담이 된다며 나이가 아니라 익숙한 것에 대한 집착에서 늙기 시작한다고 말했다.", "category": "가입자·사회", "importance": 2, "source": "한국경제", "published": "2026-09-27", "url": "https://www.hankyung.com/article/202609234199i"}, {"id": "5175f20b9769", "title": "\"아프기 전 미리미리\"…병원 대신 금융센터로 향하는 시니어들[금융, 시니어를 품다]①", "summary": "금융지주들이 자산관리와 요양·주거를 함께 다루는 시니어 특화 사업을 넓히고 있다. KB금융은 2012년 시니어 브랜드 'KB골든라이프'를 내놓은 뒤 KB골든라이프케어를 통해 서초·위례·은평·광교·강동에서 요양시설을 운영하고, 신한금융은 신한라이프케어로 요양·시니어 주거 사업을 확대하고 있다. 하나은행은 자산관리와 상속·증여, 신탁, 연금에 시니어 주거 상담까지 제공하고, 우리은행은 세무·부동산·신탁·연금에 건강·여가·일자리 콘텐츠를 함께 내놓았다. 65세 이상 인구는 2025년 1051만명에서 2030년 1298만명으로 늘고, 고령층 보유 자산은 2022년 2871조원에서 2030년 6433조원에 이를 것으로 전망된다.", "category": "가입자·사회", "importance": 2, "source": "아시아경제", "published": "2026-09-27", "url": "https://view.asiae.co.kr/article/2026091516014094111"}, {"id": "1c3d358ab6e2", "title": "美 65세 이상 빈곤층 1000만명, 7년 새 두 배로", "summary": "2026년 기준 미국의 65세 이상 빈곤층이 약 1000만명으로 2019년 510만명 대비 두 배 가까이 늘었다고 전했다. 2019년 이후 5년간 고령층 빈곤율은 약 45% 올라 전 연령대에서 가장 가파른 상승세를 보였고, 65세 이상 여성의 빈곤율은 17%에 달했다. 빈곤선은 1인 가구 세입자 기준 연 약 1만9000달러(약 2500만원)이며, 저소득 노인 가운데 직장 내 퇴직연금 제도에 가입할 수 있는 비율은 25%에 그쳤다. 미국 성인의 약 절반은 은퇴 자금으로 10만 달러 미만을 보유하고 약 20%는 은퇴 자금이 전혀 없으며, 저임금 노동자가 65세에 은퇴할 때 받는 연금은 연 약 1만5000달러로 연방 빈곤선에 미치지 못한다고 짚었다.", "category": "가입자·사회", "importance": 2, "source": "여성경제신문", "published": "2026-09-27", "url": "https://www.womaneconomy.co.kr/news/articleView.html?idxno=259114"}, {"id": "079c118e8578", "title": "퇴직 뒤 건강보험료 임의계속 전 비교할 금액", "summary": "퇴직 후 임의계속가입을 신청할지 결정할 때는 지역가입자 보험료와 임의계속보험료를 직접 비교해야 한다고 짚었다. 임의계속가입은 지역가입자 첫 보험료 고지서 납부기한에서 2개월 이내에 신청해야 하고, 퇴직일 다음 날부터 최대 36개월간 적용된다. 임의계속보험료는 퇴직 전 최근 12개월 보수월액 평균에 해당 연도 보험료율을 적용한 뒤 보수월액보험료의 50%를 경감해 산정한다. 두 보험료의 산정 기준이 다르므로 재직 중 급여명세서의 본인 부담액이 임의계속보험료와 같다고 가정할 수 없다고 설명했다.", "category": "가입자·사회", "importance": 1, "source": "비건뉴스", "published": "2026-09-27", "url": "https://www.vegannews.co.kr/news/article.html?no=388246"}, {"id": "21b63ff51d1f", "title": "[AI 자산관리·②보험사] 보험설계 9분→1분…보험사 AI, 보장 넘어 연금까지", "summary": "보험사들이 AI를 보험 본연의 업무에 적용하는 것을 넘어 연금 등 장기 자산관리로 범위를 넓히고 있다. 삼성생명은 AI 음성봇 9개로 월 18만 건, AI 챗봇 25개로 월 29만 건을 처리하고 AI OCR로 일평균 47만 장의 서류를 인식한다. 한화생명은 가입 설계 시간을 평균 9분 이상에서 1분 이내로 단축했다. 삼성생명의 연금 분석 서비스 '연금LAB'은 고객의 연령과 노후 대비 성향 등을 반영해 맞춤형 연금상품을 추천하고 국민연금·퇴직연금·개인연금 예상 수령액을 한눈에 보여준다.", "category": "업계·경쟁사", "importance": 1, "source": "메가경제", "published": "2026-09-27", "url": "https://www.megaeconomy.co.kr/news/newsview.php?ncode=1065600470185559"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-09-20 ~ 2026-09-26", "generated_at": "2026-09-27T19:45:55+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": []}, {"id": "5e67ec767c57", "title": "퇴직연금 문 열린 개인용 국채…첫 선택은 10년물에 쏠렸다", "summary": "재정경제부에 따르면 9월 9~15일 진행된 개인투자용 국채 청약에 총 2585억원이 접수돼 발행 예정액 2300억원을 웃돌았다. 이달부터 퇴직연금 계좌를 통한 투자가 허용되면서 청약액이 지난 5월 이후 처음으로 2000억원대로 올라섰다. 9월 청약액 가운데 연금계좌 청약액은 1433억원으로 절반을 넘었고 실제 배정액은 1271억원이다. 연금계좌 청약 대상인 10년물과 20년물 중 10년물에 1168억원이 몰려 전체의 74.1%를 차지했고, 10년물 발행한도는 1100억원에서 1356억원으로 늘었다.", "category": "운용·상품", "importance": 4, "source": "연합인포맥스", "published": "2026-09-25", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436449", "related": [{"title": "개인 퇴직연금 계좌 통해 장기국채 투자 길 열렸다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712685/2"}, {"title": "[개인국채 시대] 미래에셋 선구안 빛났다…선점효과 기대", "source": "딜사이트경제TV", "url": "https://news.dealsitetv.com/articles/176340"}, {"title": "[개인국채 시대] 퇴직연금 '입성', 장기물 수요↑", "source": "딜사이트경제TV", "url": "https://news.dealsitetv.com/articles/176339"}, {"title": "삼전닉스 '몰빵' 대신 '개인투자용 국채' 사볼까", "source": "경향신문", "url": "https://www.khan.co.kr/article/202609240600021"}, {"title": "\"원리금보장이라고 다 같은 예금 아닙니다\"…퇴직연금, 국채 갈아타기 전 따져볼 것은", "source": "경인방송", "url": "https://news.ifm.kr/news/articleView.html?idxno=479849"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "8a77650694b5", "title": "퇴직연금 '수익률 경쟁' 실종…상위 10개사 점유율은 75%", "summary": "자본시장연구원 보고서를 인용해 국내 퇴직연금 시장에서 사업자 간 수익률 경쟁이 제대로 작동하지 않는다고 보도했다. 지난해 말 적립금 501조4000억원 시장에서 상위 3개사 점유율은 31.3%, 상위 5개사는 48.5%, 상위 10개사는 74.8%였고, 시장집중도를 나타내는 HHI는 2011년 632.8에서 지난해 664.8로 큰 변화가 없었다. 보고서는 장기 운용성과와 시장점유율 사이에 뚜렷한 관계가 나타나지 않았다고 지적했다. 2025년 수익률은 DC형 8.47%, IRP 9.44%, 전체 평균 6.47%였으나 가입자의 67.7%는 평균 이하 수익률에 머물렀다.", "category": "업계·경쟁사", "importance": 4, "source": "EBN", "published": "2026-09-23", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1725356", "related": []}, {"id": "59195bdecf60", "title": "공언만 앞선 노동정책…9월 대책 밀리고 연말 과제만 6개", "summary": "고용노동부가 9월까지 마련하겠다고 밝힌 야간노동자 건강보호 방안의 발표 시점을 연내로 미뤘다. 5인 미만 사업장 근로기준법 적용 확대를 논의할 사회적 대화도 22일까지 논의기구와 참여 주체, 첫 회의 일정이 공개되지 않았다. 퇴직급여 사외적립·기금형 퇴직연금 활성화 방안은 K-노동복지회의소 설립 방안, 일하는 사람 기본법 입법 등과 함께 12월에 몰린 최소 6개 과제에 포함돼 있다. 노동부 내부에서는 9월 과제부터 정부안 마련과 노사 조율이 늦어지면서 연말 대책도 차례로 밀릴 가능성을 배제하기 어렵다는 말이 나온다.", "category": "제도·규제", "importance": 4, "source": "헤럴드경제", "published": "2026-09-23", "url": "https://biz.heraldcorp.com/article/10882794", "related": []}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}]}, {"id": "853028981d69", "title": "“믿고 맡길 환경 안 되면 증시로 ‘머니무브’ 없어… 장기 투자할 수 있도록 대안 제대로 만들어야”", "summary": "홍춘욱 프리즘투자자문 대표는 21일 서울 여의도에서 열린 ‘2026 국민금융포럼’ 주제발표에서 투자자가 믿고 맡길 수 있는 환경이 조성되지 않으면 부동산에서 증시로의 머니무브는 없다고 말했다. 그는 국민연금이 증시 급등으로 국내주식 보유비중이 목표를 웃돌았는데도 올해 6월 말까지 리밸런싱을 유예하고 목표비중을 14.9%에서 20.8%로 높인 것을 ‘무너진 외양간’의 사례로 지목했다. 6월 말 기준 1866조원대 기금을 운용하는 국민연금에 정책적 자율권과 독립성을 보장해야 한다고 강조했다. 장기투자를 유도할 방안으로는 3년 이상 주식 보유자에 대한 배당소득세 분리과세와 인센티브를 제시했다.", "category": "운용·상품", "importance": 3, "source": "국민일보", "published": "2026-09-22", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000014162", "related": [{"title": "“자산 50%는 ‘코어자산’으로 두고 유동성 비중 20%는 지켜라”", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000014262"}]}, {"id": "e8a6030d9b80", "title": "국민연금 추납 2년새 2.8배…보험료율 9.5% 오르기 전 '막차'", "summary": "국민연금 추후납부 신청이 지난해 24만4329건으로 2023년 8만7644건 대비 2.8배 늘었다. 올해 상반기에만 10만6838건이 접수됐다. 연금개혁으로 보험료율이 해마다 0.5%포인트씩 올라 13%까지 인상되는데, 추납보험료는 신청 시점의 보험료율이 적용되기 때문에 인상 전 신청이 몰리고 있다. 국회입법조사처는 최대 허용 기간인 108~119개월 구간에 신청이 집중돼 형평성 문제가 있다고 지적했다.", "category": "가입자·사회", "importance": 3, "source": "매일신문", "published": "2026-09-20", "url": "https://www.imaeil.com/page/view/2026092007310108169", "related": [{"title": "\"한달 내고 평생 따박따박\"...'중국인 국민연금 추납'이 불러온 나비효과", "source": "한국경제TV", "url": "http://www.wowtv.co.kr/NewsCenter/News/Read?articleId=A202609200033&t=NN"}]}, {"id": "ffa2d67f4b53", "title": "기초연금 1인 84만원 내야…13년새 부담액 4배 급증", "summary": "2027년 생산가능인구(15~64세) 1인이 기초연금 재원으로 부담할 세금이 84만4000원으로 집계됐다. 제도가 도입된 2014년의 18만2000원과 비교하면 360% 늘어난 금액이다. 2027년 기초연금 총지출은 29조7000억원으로, 국비 25조6000억원과 지방비 4조1000억원으로 구성된다. 1986년생이 40~44세 5년간 부담하는 금액은 약 434만9000원, 2026년생이 같은 나이대에 부담할 금액은 1230만6000원으로 추산됐다.", "category": "가입자·사회", "importance": 3, "source": "한국경제", "published": "2026-09-20", "url": "https://www.hankyung.com/article/2026092063311", "related": [{"title": "[단독] 나는 435만원, 우리 애는 1230만원…미래세대 '폭탄' 온다", "source": "한국경제", "url": "https://www.hankyung.com/article/2026092063181"}]}, {"id": "f2491164d33c", "title": "일해서 돈 벌고 있으면 기초연금 못 받나요? 헷갈리는 연금제도 세대별 Q&A", "summary": "내년부터 65살 이상 노인 하위 70%가 받는 기초연금이 소득에 따라 차등 지급돼, 소득 하위 0~30%는 올해보다 3만원 늘어난 38만원을 받고 하위 30~45%는 35만9천원, 하위 45~70%는 현행과 같은 35만원을 받는다. 부부 감액 비율은 소득 하위 45% 이하 부부에 한해 20%에서 10%로 낮아져 하위 30% 부부는 올해 약 56만원에서 내년 68만4천원으로 최대 12만4천원이 늘어난다. 기초연금은 근로소득 유무가 아니라 소득인정액 기준으로 판단하며, 올해는 단독가구 월 247만원·부부가구 월 395만2천원 이하면 받을 수 있다. 국민연금 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%가 된다.", "category": "가입자·사회", "importance": 3, "source": "한겨레", "published": "2026-09-26", "url": "https://www.hani.co.kr/arti/society/rights/1279489.html", "related": []}, {"id": "d02c349ce769", "title": "'기초연금의 역설'… 연금 올려도 형편 나은 노인만 소비 늘렸다", "summary": "손혜림 서울시립대 교수와 조민수 플로리다주립대 박사과정이 한국개발연구원(KDI)에 게재한 연구에서, 2014년 기초연금을 최대 월 9만9100원에서 20만원으로 올린 뒤 형편이 나은 노인만 소비를 유의하게 늘린 것으로 나타났다. 이들은 전일제로 일할 가능성이 6.8%포인트 낮아지고 주당 근로시간도 약 4.1시간 줄었으나, 중위소득 60% 미만 저소득층에서는 소비 증가나 전일제 근로 감소가 확인되지 않았다. 2023년 기준 66세 이상 은퇴연령층의 상대적 빈곤율은 39.8%였고, 65세 이상 고령자의 연금 수급률은 90.9%였지만 월평균 수급액은 69만5000원에 그쳤다. 올해 5월 기준 고령층 취업자는 1012만5000명으로 처음 1000만명을 넘었고, 계속 일하려는 이유로는 '생활비에 보탬'이 53.4%로 가장 많았다.", "category": "가입자·사회", "importance": 3, "source": "뉴시스", "published": "2026-09-26", "url": "https://www.newsis.com/view/NISX20260923_0003802319", "related": []}, {"id": "80c9e54f2f45", "title": "자동항법의 진화: “생애주기 운용이라는 발명”[김병철의 퇴직연금 개혁 시나리오]", "summary": "1990년대 미국에서 401(k)가 확산되자 가입자가 초기 설정 이후 수십 년간 포트폴리오를 바꾸지 않는 문제가 드러났고, 이를 보완하려 1990년대 중반 은퇴가 가까워질수록 위험자산 비중을 줄이는 TDF가 등장했다고 설명한다. 호주식 기금형과 미국식 상품형 TDF는 방식이 다르지만 장기 은퇴소득을 높이면서 은퇴 임박 시점의 손실 위험을 줄이는 목표를 공유한다고 짚는다. 한국의 문제는 TDF가 없는 것이 아니라 가입자가 계좌 전체를 맡기지 않고 일부만 나눠 담는 습관이라고 지적한다. 이렇게 쪼개어 투자하면 TDF가 설계한 글라이드 패스 공식이 무너진다고 본다.", "category": "운용·상품", "importance": 3, "source": "이데일리", "published": "2026-09-26", "url": "https://www.edaily.co.kr/News/Read?newsId=01781046645584056&mediaCodeNo=257", "related": []}, {"id": "53dd24a728e6", "title": "[만나보니] [신한자산운용] 천기훈 ETF컨설팅팀장 \"연금 ETF, '왜'보다 '어떻게'가 중요\"", "summary": "천기훈 신한자산운용 ETF컨설팅팀장은 연금계좌가 ETF 시장의 중요한 투자 창구 중 하나가 됐고, 투자자의 질문이 '왜 연금계좌에서 ETF에 투자해야 하나'에서 '나에게 어떤 ETF가 맞느냐'로 옮겨갔다고 밝혔다. 2019년 연금계좌에서 ETF에 투자하는 금액은 5000억원 수준이었으나 현재는 연금저축과 퇴직연금을 합쳐 100조원 시대가 됐다고 말했다. 자산형성기인 2030세대는 배당형보다 S&P500 같은 자본수익 추구형 ETF로 연금자산 규모를 키우고, 은퇴 시점이 가까워지면 배당이나 커버드콜을 활용해 현금흐름을 확보하는 전략으로 전환할 수 있다고 조언했다. 신한자산운용은 ISA·연금저축·퇴직연금에서 SOL ETF만으로 포트폴리오를 구성할 수 있는 라인업을 갖췄다고 설명하며, 지난 18일 'SOL 글로벌DRAM반도체플러스 ETF'가 효력발생됐다고 밝혔다.", "category": "업계·경쟁사", "importance": 3, "source": "딜사이트경제TV", "published": "2026-09-26", "url": "https://news.dealsitetv.com/articles/176295", "related": []}, {"id": "db33f8626c83", "title": "“회사에 맡겼다가 후회합니다”…내 퇴직연금 직접 굴리면 [이병희의 연금술사]", "summary": "2026년 6월 말 기준 전체 퇴직연금 적립금은 553조9000억원이며 이 가운데 64%가 원리금 보장 상품에 머물러 있다. 원리금 보장상품의 10년 평균 수익률은 연 2.64%에 그친다. 기사는 임금 상승이 정체된 직장인이나 이직이 잦은 근로자에게는 확정기여형(DC)으로 적립금을 직접 운용하는 선택지가 있다고 설명한다. DC형에서는 위험자산에 최대 70%까지 투자할 수 있고 최소 30%는 안전자산으로 채워야 한다.", "category": "운용·상품", "importance": 3, "source": "이코노미스트", "published": "2026-09-25", "url": "https://economist.co.kr/article/view/ecn202609230024", "related": []}, {"id": "fee8001d52ad", "title": "[뱅커스토리] 조윤환 NH농협은행 부장 \"퇴직연금, 수익률 다음은 '연금'\"", "summary": "조윤환 NH농협은행 연금사업부장은 뉴스핌 인터뷰에서 은행·증권·보험 등 47개 퇴직연금 사업자가 경쟁하는 가운데 시장의 승부처가 단기 수익률을 넘어 안정적인 연금 수령으로 옮겨갈 것이라고 말했다. 올해 1분기 연금포털공시 기준 농협은행의 원리금비보장상품 운용 수익률은 DB 16.32%, DC 24.92%, IRP 24.82%였다. 원리금비보장상품 전체 가중평균 수익률은 지난해 2분기부터 올해 1분기까지 4분기 연속 주요 은행 1위를 유지했다. 농협은행은 영업점 직원 300여 명을 대상으로 자산관리 역량 교육을 진행하고 개인형 IRP 수익률 경진대회도 운영하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스핌", "published": "2026-09-25", "url": "https://www.newspim.com/news/view/20260923000536", "related": []}, {"id": "d16260c780e2", "title": "[전문가 칼럼] 2026년 하반기 달라지는 노동관계법령 점검", "summary": "2026년 하반기 시행되는 노동관계법령 개정 사항으로 퇴직급여 체불 처벌이 9월 18일부터 5년 이하 징역 또는 5천만원 이하 벌금으로 상향됐다. 도산 사업장 체불근로자에게 지급하는 대지급금 범위는 8월 20일부터 최종 3개월분에서 최종 6개월분으로 확대됐다. 임금 체불 처벌도 10월 8일부터 5년 이하 징역 또는 5천만원 이하 벌금으로 강화된다. 이 밖에 단기 육아휴직 신설, 배우자 출산전후휴가 확대, 배우자 유산·사산휴가 5일 신설, 4시간 근무 시 휴게시간 면제 신청 제도(12월 10일) 등이 함께 시행된다.", "category": "제도·규제", "importance": 3, "source": "조세금융신문", "published": "2026-09-25", "url": "https://www.tfmedia.co.kr/news/article.html?no=207409", "related": []}, {"id": "9d993719715a", "title": "추석 전 임금 체불 105억, 2년 연속 2조원…내달부터 처벌 수위 더 높아진다", "summary": "고용노동부가 추석 전 집중 지도·점검을 통해 체불액 105억4000만원을 적발했다. 이달 18일부터 퇴직급여 미지급에 대한 형사처벌이 기존 3년 이하 징역 또는 3000만원 이하 벌금에서 5년 이하 징역 또는 5000만원 이하 벌금으로 상향됐고, 다음 달 8일부터는 일반 임금체불에도 같은 법정형이 적용된다. 올해 7월까지 누적 체불액은 1조814억원, 피해 노동자는 12만8048명으로 집계됐다. 상반기 체불액의 74.2%는 30인 미만 사업장에서 발생했다.", "category": "제도·규제", "importance": 3, "source": "뉴스1", "published": "2026-09-24", "url": "https://www.news1.kr/economy/employment-labor/6300736", "related": []}, {"id": "1ae063536da8", "title": "수탁자보고서 공개 의무화… 운용사 양과 질 모두 개선 [경제 레이더]", "summary": "10년 만에 개정된 스튜어드십 코드로 자산운용사의 수탁자책임활동 보고서 공개가 의무화되면서 보고서의 내용과 분량이 개선됐다. KB자산운용은 보고서 분량을 기존 17페이지에서 48페이지로 약 3배 늘렸고, NH아문디자산운용은 올해 7월 금융감독원 의결권 행사 모범사례로 선정됐다. 삼성자산운용과 한국투자신탁운용은 보고서 수정을 이유로 아직 외부에 공개하지 않았고, 미래에셋자산운용은 지난 6월 공개했으나 예년 대비 내용과 분량에 큰 변화가 없었다. 국민연금공단이 위탁운용사의 수탁자책임활동을 평가해 운용사 선정과 자금 배정·회수에 반영하기로 한 조치가 개선의 동력으로 작용했다.", "category": "법인·자금운용", "importance": 3, "source": "세계일보", "published": "2026-09-24", "url": "https://www.segye.com/newsView/20260923510904", "related": []}, {"id": "4fe8d9751f94", "title": "기초연금 반쪽개편·지역의사제 첫 선발…정책 실효성 점검 [미리보는 국감-보건복지]", "summary": "올해 보건복지위원회 국정감사에서 기초연금 개편안의 실효성이 쟁점으로 다뤄진다. 기초연금 예산은 올해 23조1000억원에서 내년 25조7000억원으로 11% 늘어나며, 소득 하위 30% 부부가구 수급액은 월 56만원에서 월 68만4000원으로 최대 12만4000원 오른다. 하위 30~45% 부부가구는 최대 8만6000원을 더 받고, 부부감액률은 현행 20%에서 10%로 낮아지며, 직역연금 수급자 중 저소득층 11만명이 새로 지원 대상에 포함된다. 당초 검토된 하후상박 구조 가운데 저소득층 지원만 반영돼 반쪽개편에 그쳤다는 지적이 나온다.", "category": "가입자·사회", "importance": 3, "source": "데일리안", "published": "2026-09-24", "url": "https://www.dailian.co.kr/news/view/1694286/?sc=Naver", "related": []}, {"id": "baadcd0bca6c", "title": "新리딩뱅크 경쟁, 본업은 기본…비이자 포트폴리오 강화 화두로", "summary": "은행권의 리딩뱅크 경쟁이 순이익과 대출 규모를 넘어 기업금융·자산관리(WM)·퇴직연금·외환·자본시장에서 안정적 수익원을 확보하는 포트폴리오 대결로 확장되고 있다. KB국민은행은 예대사업 경쟁력 강화와 함께 WM·CIB·자본시장 사업모델 고도화를 추진하고, 신한은행은 자산관리와 외환·신탁·퇴직연금을 결합한 종합 솔루션 제공을 전략으로 제시했다. 하나은행은 외환·무역금융 강점에 PB·퇴직연금·신탁을 결합해 상반기 연결기준 이자부문 이익 4조4645억원, 수수료부문 3982억원, 신탁부문 2160억원을 기록했다. 우리은행은 기업금융을 중심으로 자산관리·연금·트레이딩을 강화해 비이자수익 기반을 넓히고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "시사오늘", "published": "2026-09-24", "url": "https://www.sisaon.co.kr/news/articleView.html?idxno=204700", "related": []}]}, "monthly": {"period": "monthly", "key": "current", "label": "2026-08-27 ~ 2026-09-26", "generated_at": "2026-09-27T19:45:57+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": [{"title": "퇴직연금 문 열린 개인용 국채…첫 선택은 10년물에 쏠 , {"id": "8bb193e0ea59", "title": "“정부 기초연금개편안, 겉으로는 하후상박 실제는 재정 절감안”", "summary": "정부가 노인 하위 70%를 세 집단으로 나눠 차등 지급하는 하후상박 방식을 내놨다. 하위 30%에 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원(동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": [{"title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "source": "슬로우뉴스", "url": "https://slownews.kr/166386"}, {"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "aea0c5c117f7", "title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "summary": "미래에셋생명은 22일 퇴직연금 보증형 실적배당보험이 출시 이후 지난달 말까지 717억원의 모집 성과를 기록했다고 밝혔다. 이 상품은 개인형퇴직연금(IRP) 계좌를 통해서만 가입할 수 있는 거치형 상품으로, 만 50세부터 적립금을 일시에 예치해 가입할 수 있다. 만 55세부터는 원하는 시점에 연금을 개시할 수 있고, 만 55세를 넘긴 가입자는 가입과 동시에 연금 수령도 가능하다. 일임형 자산배분펀드와 연계해 보장된 인출 구조와 글로벌 분산투자를 함께 추구하는 구조다.", "category": "업계·경쟁사", "importance": 2, "source": "연합인포맥스", "published": "2026-09-22", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024", "related": [{"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": '하후상박' 대신 노인 기본소득을!", "source": "슬로우뉴스", "url": "https://slownews.kr/166386"}, {"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "aea0c5c117f7", "title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "summary": "미래에셋생명은 22일 퇴직연금 보증형 실적배당보험이 출시 이후 지난달 말까지 717억원의 모집 성과를 기록했다고 밝혔다. 이 상품은 개인형퇴직연금(IRP) 계좌를 통해서만 가입할 수 있는 거치형 상품으로, 만 50세부터 적립금을 일시에 예치해 가입할 수 있다. 만 55세부터는 원하는 시점에 연금을 개시할 수 있고, 만 55세를 넘긴 가입자는 가입과 동시에 연금 수령도 가능하다. 일임형 자산배분펀드와 연계해 보장된 인출 구조와 글로벌 분산투자를 함께 추구하는 구조다.", "category": "업계·경쟁사", "importance": 2, "source": "연합인포맥스", "published": "2026-09-22", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024", "related": [{"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}, {"id": "354ed5723a15", "title": "삼성자산운용·미래에셋증권, 푸른씨앗 OCIO 수성", "summary": "국내 최초 기금형 퇴직연금인 푸른씨앗(중소기업퇴직연금기금) 자금을 굴릴 OCIO 전담운용기관에 삼성자산운용과 미래에셋증권이 재선정됐다. 삼성자산운용이 종합평점 92.915점, 미래에셋증권이 90.761점으로 우선협상대상자에 올랐다. 2022년 9월 첫 사업자 선정 이후 4년 만의 재선정이다. 2기 운용 기간은 2026년 9월 1일부터 2030년 8월 31일까지다.", "category": "법인·자금운용", "importance": 4, "source": "한국금융신문", "published": "2026-06-09", "url": "https://www.fntimes.com/html/view.php?ud=202606091842068772179ad43907_18", "related": []}, {"id": "5895ec3e71a7", "title": "20년 만에 퇴직연금 제도 대대적 개편…모든 사업장 의무화 추진", "summary": "정부가 2월 노사정 공동선언을 바탕으로 퇴직연금 제도를 대폭 개편한다. 7월까지 구체적 방안을 확정한 뒤 연내 관련 법 개정을 추진하고, 모든 사업장에 퇴직연금을 단계적으로 의무화할 방침이다. 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화가 핵심 축이다. 1년 미만 근로자 등 사각지대 해소도 함께 추진된다.", "category": "제도·규제", "importance": 4, "source": "대한민국 정책브리핑", "published": "2026-03-11", "url": "https://www.korea.kr/news/policyNewsView.do?newsId=148960665", "related": []}, {"id": "6e2fe502ecb5", "title": "미래에셋증권, 퇴직연금 로보Wrap 출시…AI가 자산배분·매매 맡는다", "summary": "미래에셋증권이 IRP 계좌용 로보어드바이저 일임 서비스 퇴직연금 로보Wrap을 출시했다. 알고리즘이 글로벌 자산배분 포트폴리오를 구성하고 시장 상황에 맞춰 리밸런싱과 매매까지 수행한다. 7월 말 기준 누적 가입 계좌는 14만좌, 누적 가입금액은 8조3000억원이다.", "category": "운용·상품", "importance": 3, "source": "뉴스핌", "published": "2026-08-05", "url": "https://www.newspim.com/news/view/20260805001063", "related": []}, {"id": "676b0ae84927", "title": "신한 적립액 54조 독주…국민·하나, IRP 중심 2위 경쟁", "summary": "2026년 1분기 퇴직연금 랭킹에서 신한이 적립액 54조원으로 선두를 지켰다. 국민은행과 하나은행이 IRP를 중심으로 2위 자리를 놓고 다투고 있다. 은행권 IRP 적립금은 83조7000억원으로 전체 시장의 31.7%를 차지했다.", "category": "업계·경쟁사", "importance": 3, "source": "한국금융신문", "published": "2026-04-21", "url": "https://www.fntimes.com/html/view.php?ud=2026042117435794185e6e69892f_18", "related": []}, {"id": "ecca1d1f70f8", "title": "기금형 퇴직연금은 결과 아닌 과정 책임으로…사외적립의무는 속도조절 요구", "summary": "노사정과 전문가가 참여한 정책 토론회에서 기금형 퇴직연금 도입 방향이 논의됐다. 전문가들은 운용 주체의 책임을 결과가 아닌 과정, 즉 의사결정 절차의 적정성으로 전환해야 한다고 주장했다. 경영계는 중소기업 부담을 이유로 사외적립 의무화의 단계적 시행을 요구했다. 한국노총과 한국경영자총협회, 고용노동부, 한국투자증권 관계자가 참석했다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-04-08", "url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=04598566645414152", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
