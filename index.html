리딩 증권사'…2분기 순이익 1.9조", "summary": "미래에셋증권이 2026년 2분기 순이익 1조9052억원을 기록해 신한은행(1조3015억원), KB국민은행(1조1240억원) 등 5대 시중은행을 모두 앞섰다. 영업이익은 2조4899억원으로 397.5% 늘었고, 세전이익 2조5287억원 가운데 1조6242억원은 스페이스X 평가이익에서 나왔다. 퇴직연금 적립금은 6월 말 80조원에 이르렀고 연간 증가율은 60%를 넘어 시장 평균의 약 2.5배였다. 개인형 퇴직연금에 로보WRAP 서비스를 도입하는 등 연금 자산관리 서비스를 넓혔다.", "category": "업계·경쟁사", "importance": 4, "source": "스포츠서울", "published": "2026-09-15", "url": "https://www.sportsseoul.com/news/read/1634922", "related": []}, {"id": "37880c4dd1e3", "title": "'퇴직연금 인기상품' 채권혼합ETF...미국 금리 상승에 수익률 '흔들'", "summary": "퇴직연금 수요를 타고 성장한 채권혼합형 ETF의 수익률이 금리 상승과 증시 조정으로 흔들리고 있다. 최근 1개월간 'ACE 미국S&P500미국채혼합50액티브'는 6.03%, 'KODEX 200미국채혼합50'은 5.8%, 'TIGER 미국나스닥100채권혼합50'은 4.59% 하락해 각각 기초지수보다 낙폭이 컸다. 타깃데이트펀드(TDF) ETF를 제외한 채권혼합형 ETF는 9월 11일 기준 66개이며 순자산총액은 18조5501억원으로 연초 6조8926억원에서 12조원 가까이 늘었다. 확정기여형(DC)·개인형퇴직연금(IRP)의 위험자산 투자 한도가 70%로 제한돼, 주식 편입 비중 50% 이하인 적격 혼합형 상품이 안전자산으로 분류되면서 자금이 몰렸다.", "category": "운용·상품", "importance": 4, "source": "헤럴드경제", "published": "2026-09-15", "url": "https://biz.heraldcorp.com/article/10873869", "related": []}, {"id": "07602bd7cfce", "title": "[시론] 기금형 제도 도입 이후, 이제 풀어야 할 퇴직연금의 과제", "summary": "박준범 성균관대 겸임교수는 기금형 퇴직연금 도입보다 연금화 부진 해소가 더 시급하다고 지적했다. 계좌 기준 연금 수령 비율은 16.5%에 그치고 평균 근속연수가 7.1년이어서 퇴직급여가 축적되지 않으며, 2022~2024년 3년간 IRP 이전금액 63.8조 원 대비 해지금액이 43.4조 원으로 해지율이 68.1%에 달한다고 밝혔다. 2024년 중도인출의 81.9%는 주택 관련 사유였고, 5인 미만 사업장의 퇴직연금 도입률은 10%대에 머물러 있다. 기금형 도입을 넘어 연금화를 중심으로 제도 개혁을 진행해야 한다고 주장했다.", "category": "제도·규제", "importance": 4, "source": "한국보험신문", "published": "2026-09-14", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=92713", "related": []}, {"id": "e38f37f63d51", "title": "'주식·金 연금까지' 카카오뱅크, 종합금융플랫폼 도약", "summary": "카카오뱅크가 비은행 포트폴리오를 넓히며 퇴직연금 시장 진출을 준비하고 있다. 지난해부터 관련 인력을 채용해 왔고 삼정KPMG의 컨설팅을 마무리했다. 퇴직연금 적립금은 지난해 말 501조 4000억 원으로 500조 원을 처음 넘어섰고 올해 2분기 말 기준 553조 8779억 원에 이른다. 카카오뱅크의 2026년 상반기 당기순이익은 3280억 원으로 전년 동기 대비 24.4% 늘었으며, 주식투자·자동차금융 비교·금 거래 서비스를 차례로 내놓은 데 이어 내년 상반기 캐피탈 사업을 본격화할 계획이다.", "category": "업계·경쟁사", "importance": 4, "source": "한스경제", "published": "2026-09-14", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=864386", "related": []}, {"id": "a5e7a7fba12f", "title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "summary": "NH농협은행이 퇴직연금 계좌에 개인투자용국채를 도입하고 ETF 라인업을 확대한다고 밝혔다. 7월에 22종을 내놓은 데 이어 10월에 36개를 추가한다. 전문가 포트폴리오 서비스의 2026년 상반기 수익률은 공격투자형 기준 40.11%를 기록했다. 금융감독원 통합연금포털 기준 원리금비보장형 수익률에서 3분기 연속 5대 시중은행 중 1위에 올랐다.", "category": "업계·경쟁사", "importance": 3, "source": "퍼블릭타임스", "published": "2026-09-16", "url": "https://www.public25.com/news/articleView.html?idxno=54796", "related": [{"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "f8e6de7fbf89", "title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "summary": "정부가 2026년 9월 1일 발표한 기초연금 개편안은 수급 대상인 소득 하위 70%를 셋으로 나눠 하위 30%는 월 38만원, 30~45%는 35만9000원으로 올리고 45~70%는 35만원으로 묶는 내용이다. 필자인 남찬섭 동아대 교수는 충분한 사회적 논의 없이 발표됐고 기초연금을 노인 70%의 빈곤 예방 장치가 아니라 빈곤 구제 수단으로 다뤘다고 비판했다. '하후상박'을 내세웠지만 실제로 인상 혜택을 보는 수급자는 약 40%에 그치고 하위 7%는 기초생활보장 급여가 깎여 상쇄된다고 지적했다. 대안으로는 모든 노인에게 지급하고 과세하는 노인 기본소득을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "슬로우뉴스", "published": "2026-09-15", "url": "https://slownews.kr/166386", "related": [{"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}]}, {"id": "ed223b9a6214", "title": "배형근號 1300억 '디지털 대전환'…현대차증권 어디까지 왔나", "summary": "현대차증권이 2007년 구축한 시스템을 전면 교체하는 차세대 시스템 구축사업을 진행률 89% 수준까지 진행했고 10월 오픈을 목표로 하고 있다. 전체 구축비 가운데 퇴직연금 시스템 재구축에 83억3000만원이 배정됐다. 현대차증권의 퇴직연금 적립금은 2025년 말 기준 약 19조2000억원으로 전년 대비 1조7000억원 늘었다. 고객 구성은 확정급여형(DB) 89%, 확정기여형(DC) 2%, 개인형(IRP) 9%로, 회사는 DC 온라인 가입시스템 구축과 DC ETF 매매시스템 고도화를 추진한다.", "category": "업계·경쟁사", "importance": 3, "source": "쿠키뉴스", "published": "2026-09-17", "url": "https://www.kukinews.com/article/view/kuk202609160211", "related": []}, {"id": "ac2588065982", "title": "똑같이 퇴직금 받았는데, 세금 5165만원 vs 3555만원.. 무슨 차이?", "summary": "안명희 우리은행 연금사업부 과장은 만 55세 미만 퇴직자는 퇴직금 300만원 미만 등 예외를 빼면 IRP 계좌로 퇴직금을 받아야 과세 이연과 현물 이전 혜택을 누릴 수 있다고 설명했다. 55세에 퇴직금 5억원을 받고 운용 수익 1000만원이 발생한 사례에서 일시금 인출 시 퇴직소득세 5000만원과 기타소득세 165만원을 합쳐 5165만원을 내지만, 연금으로 수령하면 퇴직소득세가 30% 감면돼 3500만원, 운용 수익에는 3.3~5.5% 연금소득세가 적용돼 55만원으로 총 3555만원이 된다. 2026년부터 연금 수령 10년 차까지는 퇴직소득세 30%, 11~20년 차는 40%, 21년 차 이상은 50%까지 감면율이 올라간다. 안 과장은 당장 목돈이 필요 없더라도 최소 금액으로 연금을 일찍 개시해 수령 연차를 쌓아두라고 조언했다.", "category": "가입자·사회", "importance": 3, "source": "조선일보", "published": "2026-09-17", "url": "https://www.chosun.com/economy/money/2026/09/17/OK3HMIJKRZG4LJCFPWYXVJP43I/", "related": []}, {"id": "3e7b688f1601", "title": "[기획] \"주식 옮기면 현금 드려요\"…증권사 '자산뺏기' 소리없는 전쟁", "summary": "증권사들이 국내주식을 옮겨오는 고객에게 현금과 주식쿠폰을 주는 경쟁을 벌이고 있다. 다올투자증권이 최대 1500만원, 한국투자증권이 421만원, KB증권이 400만원을 내걸었으나 입고액·거래실적·잔고 유지기간 조건에 따라 실수령액은 크게 달라진다. 다올에서 1억원을 입고하고 3개월간 조건을 유지하면 총 15만원을 받는다. 퇴직연금 실물이전 제도가 시행된 2024년 10월 말부터 올해 6월 말까지 증권사에서 다른 증권사로 이동한 적립금은 2조6061억원에 달했다.", "category": "업계·경쟁사", "importance": 3, "source": "오늘경제", "published": "2026-09-16", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813204", "related": []}, {"id": "cfbe257f3637", "title": "\"수익률 60%\"라더니… NH투자증권 'AI 퇴직연금', 일부는 2년간 손실", "summary": "그린포스트코리아가 코스콤 로보어드바이저 테스트베드에 공시된 적극투자형 퇴직연금 상품 가운데 최근 2년 수익률이 산출되는 42개를 전수 조사했다. NH투자증권이 비교 대상의 32개를 차지했으나 2년 평균 수익률은 36.92%로 대신증권 56.82%, KB증권 44.61%, 신한투자증권 43.71%보다 낮았다. 삼성증권과 비교하면 평균 최대손실폭(MDD)은 NH투자증권 -25.02%, 삼성증권 -25.89%로 0.87%포인트 차이에 그쳤지만 2년 평균 수익률은 삼성증권 80.13%에 43.21%포인트 뒤졌다. 'NH_DNA 퇴직연금_Quazire_P'는 최근 1년 수익률 -12.72%, 2년 수익률 -3.77%를 기록했다.", "category": "운용·상품", "importance": 3, "source": "그린포스트코리아", "published": "2026-09-16", "url": "https://www.greenpostkorea.co.kr/news/articleView.html?idxno=307463", "related": []}, {"id": "741ee51a2658", "title": "[신진영 칼럼] 국민연금 2,000조원 시대, 운용 원칙부터 바로 세워야", "summary": "신진영 연세대 경영대학 교수가 국민연금 기금운용위원회의 국내주식 목표비중 상향 결정을 짚었다. 기금위는 지난 5월 28일 2026년 국내주식 목표비중을 14.9%에서 20.8%로 조정하기로 의결했고, 6월 말 국내주식 평가액은 543.2조원으로 전체 기금의 29.1%였다. 같은 시점 기금 적립금은 1865.6조원, 국내주식 연초 이후 수익률은 107.37%, 전체 기금 수익률은 27.22%였다. 신 교수는 보유비중이 목표를 크게 넘어섰을 때 리밸런싱으로 비중을 낮추는 대신 목표비중 자체를 올린 것이 문제의 핵심이라며 장기간 유지할 수 있는 일관된 자산배분 원칙이 필요하다고 지적했다.", "category": "법인·자금운용", "importance": 3, "source": "아주경제", "published": "2026-09-16", "url": "https://www.ajunews.com/view/20260914141838275", "related": []}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발생했으나 회수된 금액은 없다.", "category": "법인·자금운용", "importance": 3, "source": "시장경제신문", "published": "2026-09-16", "url": "https://www.meconomynews.com/news/articleView.html?idxno=201626", "related": []}, {"id": "5e29bf9dea40", "title": "[신한자산운용 TDF 약진] 디폴트옵션 훈풍…'톱3' 진입 정조준", "summary": "고용노동부 자료 기준 지난해 말 디폴트옵션 적립금은 53조3000억원으로 전체 DC·IRP 적립금의 19.56%를 차지했고 지정 가입자는 734만명이다. 원리금보장 중심의 안정형 비중은 지난해 말 85.4%에서 올해 6월 말 82.5%로 3%포인트 가까이 내렸다. 올해 디폴트옵션 상품의 1년 수익률은 초저위험형이 평균 2.6%, 적극투자형이 14.9%로 격차가 12%포인트를 넘는다. 신한자산운용의 신한마음편한적격TDF와 신한빠른대응적격TDF 합산 수탁고는 이달 7일 2조원을 넘어섰고, 14개 이상의 디폴트옵션 포트폴리오에 편입돼 업계 4위에서 톱3 진입을 노리고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "더벨", "published": "2026-09-16", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609140845593220105020", "related": []}, {"id": "55b89ccee6b0", "title": "[퇴직연금 Radar] 한국증권, 신규 사업장으로 CJ ENM 확보", "summary": "한국투자증권이 CJ ENM과 자회사 5곳의 신규 퇴직연금 사업자로 선정됐다. CJ ENM의 지난해 말 기준 정규직 근로자는 3047명, 1인 평균급여액은 8400만원, 사외적립자산은 1891억원이다. 티빙과 스튜디오드래곤, CJ메조미디어 등 자회사에서도 신규 사업자로 이름을 올렸다. 2024년 10월 실물이전 시행 이후 한국증권 DC형 계좌 순유입액은 지난해 2616억원으로, 미래에셋증권 2949억원보다 약 300억원 적고 삼성증권 1056억원보다 약 1550억원 많다.", "category": "법인·자금운용", "importance": 3, "source": "더벨", "published": "2026-09-16", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609140832207740104466", "related": []}]}, "monthly": {"period": "monthly", "key": "2026-09", "label": "2026년 9월", "generated_at": "2026-09-17T07:38:01+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": [{"title": "\"1억 넣어두면 20년 뒤 2.6억\"…연금개미들 외면한 이유", "source": "한국경제", "url": "https://www.hankyung.com/article/202609168563i"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 확정 수익 60%\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/14/2026091490036.html"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 60% 확정 수익\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/13/2026091390109.html"}, {"title": "“20년 묻어두면 수익률 161%”…퇴직연금 국채, 증권사 유치전 불붙었다", "source": "디지털데일리", "url": "https://www.ddaily.co.kr/page/view/2026091010295983047"}, {"title": "“예금 이자론 성 안 차”…은행 퇴직연금, 국채 품고 반격할까", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1688375/"}, {"title": "[흔들리는 국채 공식④] 퇴직연금에 국채 담을까…개인투자자의 새 셈법", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4435180"}, {"title": "[필드뒷얘기] 퇴직연금 국채로 고객 묶는 증권사", "source": "대한금융신문", "url": "https://www.kbanker.co.kr/news/articleView.html?idxno=225952"}, {"title": "\"월급 끊겨도 매달 400만원 들어옵니다\"…은퇴 앞둔 직장인이 알아야 할 자산", "source": "매일경제", "url": "https://www.mk.co.kr/article/12151487"}, {"title": "개인투자용 국채 품은 퇴직연금 계좌···증권사, 연금자금 유치전", "source": "서울파이낸스", "url": "https://www.seoulfn.com/news/articleView.html?idxno=637698"}, {"title": "퇴직연금 계좌로 국채 투자하면 포인트 제공", "source": "서울신문", "url": "https://www.seoul.co.kr/news/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}, {"title": "[금상소] IRP·DC에 들어온 개인투자용 국채…10년·20년물 뭐가 나을까", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2624549"}]}, {"id": "8977649855f9", "title": "표류하는 기금형 퇴직연금…간담회 또 연기", "summary": "고용노동부와 금융감독원이 공동 주재하는 퇴직연금사업자 간담회가 9월 2일에서 10월 2일로 재차 연기됐다. 한 달 새 두 번째 순연으로, 간담회는 10월 2일 오후 2시부터 3시 30분까지 서울 로얄호텔에서 김영훈 고용노동부 장관과 이찬진 금융감독원장이 함께 주재한다. 국민연금공단의 기금형 퇴직연금 참여 여부, 수탁법인 인가 대상을 5~8개로 제한하는 방안을 둘러싼 독점 우려, 손해배상 책임 강화 방침이 쟁점으로 남아 있다. 연내 근로자퇴직급여보장법 개정안 통과 목표의 재조정이 불가피하다는 관측이 나온다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-09-14", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": [{"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "a5e7a7fba12f", "title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "summary": "NH농협은행이 퇴직연금 계좌에 개인투자용국채를 도입하고 ETF 라인업을 확대한다고 밝혔다. 7월에 22종을 내놓은 데 이어 10월에 36개를 추가한다. 전문가 포트폴리오 서비스의 2026년 상반기 수익률은 공격투자형 기준 40.11%를 기록했다. 금융감독원 통합연금포털 기준 원리금비보장형 수익률에서 3분기 연속 5대 시중은행 중 1위에 올랐다.", "category": "업계·경쟁사", "importance": 3, "source": "퍼블릭타임스", "published": "2026-09-16", "url": "https://www.public25.com/news/articleView.html?idxno=54796", "related": [{"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "f8e6de7fbf89", "title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "summary": "정부가 2026년 9월 1일 발표한 기초연금 개편안은 수급 대상인 소득 하위 70%를 셋으로 나눠 하위 30%는 월 38만원, 30~45%는 35만9000원으로 올리고 45~70%는 35만원으로 묶는 내용이다. 필자인 남찬섭 동아대 교수는 충분한 사회적 논의 없이 발표됐고 기초연금을 노인 70%의 빈곤 예방 장치가 아니라 빈곤 구제 수단으로 다뤘다고 비판했다. '하후상박'을 내세웠지만 실제로 인상 혜택을 보는 수급자는 약 40%에 그치고 하위 7%는 기초생활보장 급여가 깎여 상쇄된다고 지적했다. 대안으로는 모든 노인에게 지급하고 과세하는 노인 기본소득을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "슬로우뉴스", "published": "2026-09-15", "url": "https://slownews.kr/166386", "related": [{"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}]}, {"id": "ab894d0c4867", "title": "[금융 HOT 뉴스] KB자산운용, 골드 특별자산 펀드 눈길", "summary": "KB자산운용이 골드 특별자산 펀드의 운용 구조를 파생상품 중심에서 국내외 금 ETF 활용 방식으로 바꿨다. 파생상품 위험평가액을 40% 이하로 낮춰 퇴직연금 적격 요건을 충족했고 운용보수는 기존 대비 약 40% 인하했다. 비교지수는 LBMA Gold PM Price로 변경했고 환매대금은 4영업일 내에 지급한다. 현재 국민은행과 신한투자증권의 퇴직연금 계좌에서 매매할 수 있다.", "category": "운용·상품", "importance": 2, "source": "비즈월드", "published": "2026-09-16", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146330", "related": [{"title": "KB자산운용, 18년 된 금 펀드 손질…퇴직연금서도 투자", "source": "AP신문", "url": "https://www.apnews.kr/news/articleView.html?idxno=3051270"}]}, {"id": "26bad6a1c84a", "title": "이형일 \"500조 규모 퇴직연금, 수익률 저조…법안 준비 중\"", "summary": "이형일 부총리 겸 재정경제부 장관 후보자가 9월 15일 국회 재정경제기획위원회 인사청문회에서 퇴직연금 제도 개선과 관련해 노사정이 합의한 사항을 바탕으로 법안을 준비하고 있다고 밝혔다. 이 후보자는 퇴직연금 적립금이 500조원까지 올라갔는데 수익률이 저조하다며 노후소득 보장 기능이 제대로 작동하고 있느냐는 논의가 많다고 말했다. 노사정은 지난 2월 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화에 합의했고, 정부는 이를 바탕으로 연내 근로자퇴직급여보장법 개정을 추진하고 있다. 이광재 의원이 미국 401(k)를 거론하며 국가적 시스템이 필요하다고 지적한 데 대한 답변이다.", "category": "제도·규제", "importance": 5, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/economy/trend/6290971", "related": []}, {"id": "ffde5c86587a", "title": "'공시 넘어 사후관리'…디폴트옵션 3년, 최초 평가 시동", "summary": "고용노동부가 올해 디폴트옵션 승인 상품에 대한 첫 정기 평가를 실시한다. 2023년 7월 본격 시행된 디폴트옵션은 올해 3월 기준 41개 금융기관이 324개 상품을 승인받아 운용 중이며, 최초 승인 이후 3년이 지난 상품이 평가 대상으로 장기 성과 수익률과 위험 관리 등을 본다. 고용노동부는 첫 평가인 만큼 성과 저조 사유를 파악하고 개선 방안을 마련하는 데 핵심 의의를 두되, 문제가 지속되는 상품에는 불이익을 부여할 계획이다. 5월에 선정한 정책연구용역은 내년 2월까지 진행된다.", "category": "제도·규제", "importance": 5, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140567806179ad43907_18", "related": []}, {"id": "69dd458f15f4", "title": "퇴직연금 550조 커졌는데…보험사 점유율 20% 무너졌다", "summary": "퇴직연금 시장이 553조원대로 커지는 사이 보험업계 점유율이 20% 아래로 떨어졌다. 상반기 증권사는 4조1000억원 순유입을 기록한 반면 보험사는 1799억원 순유출을 냈다. 실물이전 확대로 가입자가 금융사를 옮기기 쉬워지면서 사업자 간 경쟁이 격화된 결과다. DB형에 집중된 포트폴리오가 약점으로 지목되자 삼성·한화·교보생명 등이 DC형·IRP 강화와 ETF 상품 확대로 대응하고 있다.", "category": "업계·경쟁사", "importance": 5, "source": "뉴데일리", "published": "2026-09-10", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/10/2026091000173.html", "related": []}, {"id": "de4a8500263d", "title": "수익률 32%에도 돈이 안 온다…디폴트옵션의 역설", "summary": "디폴트옵션 시행 3년 차 데이터에서 적극투자형 1년 수익률이 32.66%를 기록했으나 자금의 82.5%는 여전히 안정형에 머물러 있다. 은행권은 고객 자금 대부분을 안정형에 두는 반면 증권사 고객은 위험자산에 투자해 업권별로 뚜렷이 갈렸다. 제도의 병목은 상품 품질이 아니라 자금이 좋은 상품에 도달하는 경로에 있다는 지적이다.", "category": "운용·상품", "importance": 5, "source": "한경머니", "published": "2026-09-10", "url": "https://magazine.hankyung.com/money/article/202608199155c", "related": []}, {"id": "937d44176934", "title": "퇴직연금 6.9조 이동…은행서 증권사로 자금 쏠림, 국채로 2차 경쟁", "summary": "올해 상반기 퇴직연금 실물이전 규모가 약 6조9000억원으로 전년 동기 약 3조2000억원의 2.2배에 달해 2024년 제도 시행 이후 반기 기준 최대를 기록했다. 업권별로는 증권사가 4조1513억원 순유입, 은행이 3조9714억원 순유출, 보험이 1799억원 순유출이었고, 증권사 적립금은 2분기 말 165조468억원으로 1분기 대비 16.5% 늘어 은행권 증가율 6.6%를 크게 앞섰다. 실물이전 규모는 가입자가 직접 상품을 고르는 IRP에서 6조8000억원으로 가장 컸다. 9월부터 개인투자용 국채가 DC·IRP 계좌에 편입되면서 증권사는 안정형 상품까지 더해 고객 확보에 나서고, 은행권은 ETF 거래 편의성 개선으로 맞서고 있다.", "category": "운용·상품", "importance": 5, "source": "더트래커", "published": "2026-09-10", "url": "https://thetracker.co.kr/View.aspx?No=4221950", "related": []}, {"id": "6dd0fa0960d5", "title": "퇴직연금 디폴트옵션 첫 순유출…2분기 1조4000억 감소", "summary": "디폴트옵션 운용자금이 2023년 제도 도입 후 처음으로 순유출을 기록해 2분기에 약 1조4000억원이 줄었다. 안정형에서만 1조4891억원이 빠져나갔고, 증시 호황으로 위험자산 투자가 늘면서 자금이 대거 이동했다. 평가액 기준 적립액 증가는 117억원에 그쳐 시장 전체 증가분 45조2000억원에 비하면 미미한 수준이다.", "category": "운용·상품", "importance": 5, "source": "한국경제", "published": "2026-09-08", "url": "https://www.hankyung.com/article/202609081009i", "related": []}, {"id": "362d60df2f63", "title": "퇴직연금도 자산배분 시대…NH투자증권, DB 적립금 컨설팅 강화", "summary": "NH투자증권이 연금자산관리본부 산하 DB적립금 운용 협의체를 통해 기업별 맞춤형 IPS(적립금운용계획서) 컨설팅을 확대한다. DB형은 적립금 수익률이 임금상승률에 못 미치면 기업이 추가 적립을 부담해야 해 자산배분 전략의 필요성이 커지고 있다. 전담 계리사와 자산배분·포트폴리오 전문가로 구성된 협의체가 부채 분석부터 리밸런싱까지 5단계로 지원한다. 고객사 한국선급은 IPS 개정 후 DB 적립금 1년 수익률이 5월 말 기준 20%를 넘어 고용노동부·금융감독원 모범사례로 선정됐다.", "category": "법인·자금운용", "importance": 5, "source": "매일경제", "published": "2026-09-08", "url": "https://www.mk.co.kr/news/stock/12147172", "related": []}, {"id": "f7cf0468c30c", "title": "정부, 올 하반기 퇴직연금 디폴트옵션 손질", "summary": "고용노동부가 올해 하반기 기금형 퇴직연금 도입과 함께 디폴트옵션(사전지정운용제도)도 개편하겠다고 밝혔다. 대기기간과 디폴트옵션 상품 평가체계를 명확히 하고, 현재 제도가 적용되지 않는 자금까지 적용 범위를 넓히는 것이 핵심이다. 현재 디폴트옵션 자금의 82.5%가 안정형에 쏠려 있는 점도 개선 대상으로 지목됐다. 정부는 퇴직연금 의무화와 사외적립 의무화를 함께 추진하며 올 하반기를 퇴직연금 대격변기로 보고 있다.", "category": "제도·규제", "importance": 5, "source": "파이낸셜뉴스", "published": "2026-09-07", "url": "https://www.fnnews.com/news/202609071643275392", "related": []}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": []}, {"id": "507cff298ac3", "title": "미래에셋증권, 5대 시중은행 압도한 '리딩 증권사'…2분기 순이익 1.9조", "summary": "미래에셋증권이 2026년 2분기 순이익 1조9052억원을 기록해 신한은행(1조3015억원), KB국민은행(1조1240억원) 등 5대 시중은행을 모두 앞섰다. 영업이익은 2조4899억원으로 397.5% 늘었고, 세전이익 2조5287억원 가운데 1조6242억원은 스페이스X 평가이익에서 나왔다. 퇴직연금 적립금은 6월 말 80조원에 이르렀고 연간 증가율은 60%를 넘어 시장 평균의 약 2.5배였다. 개인형 퇴직연금에 로보WRAP 서비스를 도입하는 등 연금 자산관리 서비스를 넓혔다.", "category": "업계·경쟁사", "importance": 4, "source": "스포츠서울", "published": "2026-09-15", "url": "https://www.sportsseoul.com/news/read/1634922", "related": []}, {"id": "37880c4dd1e3", "title": "'퇴직연금 인기상품' 채권혼합ETF...미국 금리 상승에 수익률 '흔들'", "summary": "퇴직연금 수요를 타고 성장한 채권혼합형 ETF의 수익률이 금리 상승과 증시 조정으로 흔들리고 있다. 최근 1개월간 'ACE 미국S&P500미국채혼합50액티브'는 6.03%, 'KODEX 200미국채혼합50'은 5.8%, 'TIGER 미국나스닥100채권혼합50'은 4.59% 하락해 각각 기초지수보다 낙폭이 컸다. 타깃데이트펀드(TDF) ETF를 제외한 채권혼합형 ETF는 9월 11일 기준 66개이며 순자산총액은 18조5501억원으로 연초 6조8926억원에서 12조원 가까이 늘었다. 확정기여형(DC)·개인형퇴직연금(IRP)의 위험자산 투자 한도가 70%로 제한돼, 주식 편입 비중 50% 이하인 적격 혼합형 상품이 안전자산으로 분류되면서 자금이 몰렸다.", "category": "운용·상품", "importance": 4, "source": "헤럴드경제", "published": "2026-09-15", "url": "https://biz.heraldcorp.com/article/10873869", "related": []}, {"id": "07602bd7cfce", "title": "[시론] 기금형 제도 도입 이후, 이제 풀어야 할 퇴직연금의 과제", "summary": "박준범 성균관대 겸임교수는 기금형 퇴직연금 도입보다 연금화 부진 해소가 더 시급하다고 지적했다. 계좌 기준 연금 수령 비율은 16.5%에 그치고 평균 근속연수가 7.1년이어서 퇴직급여가 축적되지 않으며, 2022~2024년 3년간 IRP 이전금액 63.8조 원 대비 해지금액이 43.4조 원으로 해지율이 68.1%에 달한다고 밝혔다. 2024년 중도인출의 81.9%는 주택 관련 사유였고, 5인 미만 사업장의 퇴직연금 도입률은 10%대에 머물러 있다. 기금형 도입을 넘어 연금화를 중심으로 제도 개혁을 진행해야 한다고 주장했다.", "category": "제도·규제", "importance": 4, "source": "한국보험신문", "published": "2026-09-14", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=92713", "related": []}]}, "yearly": {"period": "yearly", "key": "2026", "label": "2026년", "generated_at": "2026-09-17T07:38:01+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": 855f9", "title": "표류하는 기금형 퇴직연금…간담회 또 연기", "summary": "고용노동부와 금융감독원이 공동 주재하는 퇴직연금사업자 간담회가 9월 2일에서 10월 2일로 재차 연기됐다. 한 달 새 두 번째 순연으로, 간담회는 10월 2일 오후 2시부터 3시 30분까지 서울 로얄호텔에서 김영훈 고용노동부 장관과 이찬진 금융감독원장이 함께 주재한다. 국민연금공단의 기금형 퇴직연금 참여 여부, 수탁법인 인가 대상을 5~8개로 제한하는 방안을 둘러싼 독점 우려, 손해배상 책임 강화 방침이 쟁점으로 남아 있다. 연내 근로자퇴직급여보장법 개정안 통과 목표의 재조정이 불가피하다는 관측이 나온다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-09-14", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": [{"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "a5e7a7fba12f", "title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "summary": "NH농협은행이 퇴직연금 계좌에 개인투자용국채를 도입하고 ETF 라인업을 확대한다고 밝혔다. 7월에 22종을 내놓은 데 이어 10월에 36개를 추가한다. 전문가 포트폴리오 서비스의 2026년 상반기 수익률은 공격투자형 기준 40.11%를 기록했다. 금융감독원 통합연금포털 기준 원리금비보장형 수익률에서 3분기 연속 5대 시중은행 중 1위에 올랐다.", "category": "업계·경쟁사", "importance": 3, "source": "퍼블릭타임스", "published": "2026-09-16", "url": "https://www.public25.com/news/articleView.html?idxno=54796", "related": [{"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "f8e6de7fbf89", "title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "summary": "정부가 2026년 9월 1일 발표한 기초연금 개편안은 수급 대상인 소득 하위 70%를 셋으로 나눠 하위 30%는 월 38만원, 30~45%는 35만9000원으로 올리고 45~70%는 35만원으로 묶는 내용이다. 필자인 남찬섭 동아대 교수는 충분한 사회적 논의 없이 발표됐고 기초연금을 노인 70%의 빈곤 예방 장치가 아니라 빈곤 구제 수단으로 다뤘다고 비판했다. '하후상박'을 내세웠지만 실제로 인상 혜택을 보는 수급자는 약 40%에 그치고 하위 7%는 기초생활보장 급여가 깎여 상쇄된다고 지적했다. 대안으로는 모든 노인에게 지급하고 과세하는 노인 기본소득을 제안했다.", "category": "가입자·사회", "importance": 3, "source": " ?ud=202609122140567806179ad43907_18", "related": []}, {"id": "69dd458f15f4", "title": "퇴직연금 550조 커졌는데…보험사 점유율 20% 무너졌다", "summary": "퇴직연금 시장이 553조원대로 커지는 사이 보험업계 점유율이 20% 아래로 떨어졌다. 상반기 증권사는 4조1000억원 순유입을 기록한 반면 보험사는 1799억원 순유출을 냈다. 실물이전 확대로 가입자가 금융사를 옮기기 쉬워지면서 사업자 간 경쟁이 격화된 결과다. DB형에 집중된 포트폴리오가 약점으로 지목되자 삼성·한화·교보생명 등이 DC형·IRP 강화와 ETF 상품 확대로 대응하고 있다.", "category": "업계·경쟁사", "importance": 5, "source": "뉴데일리", "published": "2026-09-10", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/10/2026091000173.html", "related": []}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 18", "related": []}, {"id": "ecca1d1f70f8", "title": "기금형 퇴직연금은 결과 아닌 과정 책임으로…사외적립의무는 속도조절 요구", "summary": "노사정과 전문가가 참여한 정책 토론회에서 기금형 퇴직연금 도입 방향이 논의됐다. 전문가들은 운용 주체의 책임을 결과가 아닌 과정, 즉 의사결정 절차의 적정성으로 전환해야 한다고 주장했다. 경영계는 중소기업 부담을 이유로 사외적립 의무화의 단계적 시행을 요구했다. 한국노총과 한국경영자총협회, 고용노동부, 한국투자증권 관계자가 참석했다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-04-08", "url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=04598566645414152", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  function render() {
    var doc = DATA.periods[currentPeriod];

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      button.setAttribute('aria-selected', String(PERIODS[index].key === currentPeriod));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    listEl.textContent = '';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
