  /* ── 팔레트 ───────────────────────────────────────────────

     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나.

     키움 두 색은 kiwoomam.com 로고의 구조를 그대로 옮긴 것이다.
     글자는 감청, 포인트 마크만 마젠타. 그래서 맨 위 줄은 감청이고
     마젠타는 슬로건 한 줄에만 쓴다. 둘을 같은 넓이로 쓰면 서로 죽는다. */
  :root {
    --ink: #101C33;
    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom-deep: #1A399E;
    --kiwoom-point: #EC008C;

    --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',
               'Malgun Gothic', system-ui, sans-serif;
    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #DCE2EC;
      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 감청 원색은 어두운 종이에서 1.9:1까지 떨어져 줄이 보이지 않는다.
         마젠타도 한 단계 올려 짝을 맞춘다. 각각 6.2:1, 6.6:1. */
      --kiwoom-deep: #6E92F5;
      --kiwoom-point: #FF5FB4;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야
     구분선이 아니라 종이의 테두리로 읽힌다. */
  .topline { height: 4px; background: var(--kiwoom-deep); }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;
  }

  .slogan {
    margin: 0 0 0 auto;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom-point);
    white-space: nowrap;
  }

  .hero-date {
    font-family: var(--font-num);
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .search input {
    width: 230px;
    max-width: 44vw;
    padding: 4px 0;
    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */
  .group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;
  }

  .rail button {
    flex: 1 1 0;
    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .range {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  /* ── 분야 필터 ─────────────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
  }

  .filters button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */
  .notice {
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */
  .list { margin: 8px 0 0; }

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);
  }

  article[data-cat="2"] .badge { color: var(--cat-2); }
  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

  details summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

지 은퇴 준비 전 과정 밀착 지원", "summary": "퇴직연금 적립금은 지난 8월 기준 550조원을 웃돌았고 실적배당형 비중은 35%를 기록했으며, 증권사 퇴직연금 규모는 2025년 말 141조6797억원으로 전 금융권 적립금의 29.3%를 차지했다. 증권사 적립금 순위는 미래에셋증권, 삼성증권, 한국투자증권, 현대차증권, NH투자증권 순이다. 한국투자증권은 연금 MTS를 개편해 '나의 총 연금자산'과 개인화 맞춤 알림 기능을 도입했고, 신규 DC 가입자 평균 연령이 2015년 40세에서 2025년 36세로 낮아졌다고 밝혔다. 신한투자증권은 올해 연금고객관리팀을 신설해 신규 DC·IRP 가입 고객 대상 웰컴콜과 연금PB 1대1 매칭, 'Premier 연금컨설팅'을 운영하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "시사캐스트", "published": "2026-10-08", "url": "http://www.sisacast.kr/news/articleView.html?idxno=100731"}, {"id": "07a9e437bd0c", "title": "내년 1분기 기초연금 물가인상분 소급 지급…李대통령 “양극화 완화에 필요”", "summary": "정부가 내년 1분기 기초연금에 반영하지 않기로 했던 물가인상분을 소득 하위 45% 노인에게 4월 개편 시 소급 지급하기로 했다. 당초 예산안은 내년 1~3월 기준연금액을 올해와 같은 월 34만 9700원으로 묶어, 하위 45% 516만 8000명이 석 달간 2만 7270원을 덜 받는 구조였다. 이재명 대통령도 정은경 복지부 장관의 게시물을 공유하며 저소득층 추가 지원은 양극화 완화를 위해 필요한 조치라고 밝혔다. 내년 4월부터 하위 30%는 월 최대 38만 원, 30~45%는 월 35만 8790원을 받고 45~70%는 월 34만 9700원으로 동결된다.", "category": "가입자·사회", "importance": 3, "source": "서울경제", "published": "2026-10-08", "url": "https://www.sedaily.com/article/20099327"}, {"id": "dffb22a243d1", "title": "국민연금 크레딧 '사전 지원'하면 수십조 아낀다? \"재정 안정·미래 세대 부담 줄이는 방안 모색해야\"", "summary": "국민연금 크레딧은 출산·군 복무 시점이 아니라 노령연금 수령 시점에 가입 기간을 합산하는 사후 지원 방식이라 시간이 갈수록 지출이 불어난다. 국민연금연구원은 사유 발생 시점에 보험료를 대납하는 사전 지원으로 바꾸면 2093년까지 약 87조8000억원의 크레딧 지출을 줄일 수 있다고 분석한 바 있다. 지난 6월 기준 출산 크레딧 누적 수급자 1만2052명 중 여성은 385명(3.2%)에 그쳤다. 보건복지부는 사전 지원 전환을 검토 중이나 기획예산처는 단기 지출 급증을 이유로 신중한 입장이다.", "category": "가입자·사회", "importance": 3, "source": "아시아경제", "published": "2026-10-08", "url": "https://view.asiae.co.kr/article/2026100809461398787"}, {"id": "34a6a3ea355f", "title": "\"ETF 좋다고 난리인데, 내 퇴직연금은 왜 그 모양\"…수익률 2%대 갇힌 이유", "summary": "퇴직연금 내 ETF 투자 규모가 50조원에 다가섰지만 대다수 가입자의 수익률은 2%대에 머물러 있다는 지적이 나왔다. 민주영 신영증권 상무는 원리금 보장 상품에 치우친 투자 성향과 금융회사·제도의 자산배분 유도 부족을 원인으로 꼽았다. 민 상무는 적정 목표수익률을 연 복리 6~7%로 제시하고, 40대 기준 핵심 자산 70%·위성 자산 30%의 코어·위성 전략을 제안했다. 1억원을 20년간 3%대로 운용하면 1억8000만원, 6%로 운용하면 3억2000만원 정도가 된다고 설명했다.", "category": "운용·상품", "importance": 2, "source": "뉴시스", "published": "2026-10-08", "url": "https://www.newsis.com/view/NISX20261007_0003816617"}, {"id": "3c66b3231d80", "title": "당신은 ‘진짜 중산층’입니까⋯소득보다 중요한 노후 대비 여력", "summary": "NH투자증권 100세시대연구소가 지난해 가계금융복지조사 마이크로데이터를 분석한 결과 소득 기준 중산층은 전체 가구의 52.9%였지만 소비·저축 조건까지 충족한 가구는 39.9%였다. 자산·부채·노후준비까지 따진 ‘진짜 중산층’은 24.6%에 그쳤고, 노후준비 기준을 엄격하게 적용하면 14.9%까지 떨어졌다. 진짜 중산층 비율은 50대 31.2%에서 정점을 찍은 뒤 60대 25.3%, 70세 이상 10.5%로 낮아졌다. 연구소는 은퇴 후에는 국민연금과 퇴직연금, 개인연금, 금융자산 등이 근로소득의 역할을 대신해야 한다고 짚었다.", "category": "가입자·사회", "importance": 2, "source": "브릿지경제", "published": "2026-10-08", "url": "https://www.viva100.com/article/20261006501084"}, {"id": "84b87fe450a3", "title": "[2026 금융대상] 한국투자증권, 디폴트옵션 수익률 1위…‘투자형 연금’ 선도", "summary": "고용노동부의 올해 2분기 퇴직연금 디폴트옵션 공시에서 한국투자증권 적극투자형 BF1의 3년 누적 수익률은 123.34%로 전체 퇴직연금 사업자 상품 가운데 가장 높았다. 올해 상반기 새로 유입된 퇴직연금 자산은 5조6600억원으로 지난해 연간 유입액 4조9300억원을 반년 만에 넘어섰다. 지난 5월 IRP와 개인연금 적립금이 각각 10조원을 돌파했고, IRP 계좌 수는 지난해 말 47만2736개에서 올해 8월 말 56만7463개로 늘었다. 한국투자증권은 이 성과로 아시아투데이 금융대상 증권부문 대상을 받았다.", "category": "업계·경쟁사", "importance": 2, "source": "아시아투데이", "published": "2026-10-08", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261007010002300"}, {"id": "a07f2ceaa12a", "title": "[2026 금융대상] 신한투자증권, 퇴직연금 수익률 선두…연금 경쟁력 강화", "summary": "올해 1분기 말 금융감독원 퇴직연금 비교공시 기준 신한투자증권의 DC 원리금 비보장 상품 1년 수익률은 27.17%로 증권업계 1위를 기록했다. IRP 원리금 비보장 상품의 3년·5년 수익률도 각각 13.82%, 6.92%로 업계 1위에 올랐다. 신한투자증권은 2024년 4월부터 IRP 운용·자산관리 수수료를 조건 없이 전액 면제하고 있으며 중소기업에는 10%의 수수료 할인을 적용한다. 올해 신설한 연금고객관리팀은 전담 인력 17명이 미운용 자금이나 원리금 보장상품 만기 도래 시점마다 고객에게 직접 안내한다.", "category": "업계·경쟁사", "importance": 2, "source": "아시아투데이", "published": "2026-10-08", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261007010001966"}, {"id": "b50d518eb4fd", "title": "약가인하 충격파…제약사들, 채용 줄이고 임금체계도 손질", "summary": "지난 8월 시행된 약가제도 개편으로 특허 만료 의약품과 제네릭의 상한금액 산정률이 53.55%에서 45%로 낮아지면서 제약사들이 인건비 관리에 나서고 있다. 제약사들은 신규 채용을 줄이고 자연감소 인력을 충원하지 않는 한편 성과평가와 인센티브 지급 기준을 강화하고 있다. 업계에 따르면 일부 제약사에서는 기존 확정급여형(DB) 퇴직연금을 확정기여형(DC)으로 전환하도록 직원들에게 유도하는 움직임도 나타나고 있다. 기사는 회사별 임금체계와 퇴직연금 운용 방식이 달라 DB형에서 DC형으로의 전환을 약가 인하에 따른 직접적인 비용 절감으로 단정하기는 어렵다고 덧붙였다.", "category": "법인·자금운용", "importance": 2, "source": "데일리팜", "published": "2026-10-08", "url": "https://www.dailypharm.com/user/news/343155"}, {"id": "c5040e41ae65", "title": "'20년 묻어두면 2.6배'…개인투자용 국채에 2.4조 몰렸다", "summary": "올해 1~9월 단독 판매대행사인 미래에셋증권을 통해 접수된 개인투자용 국채 청약금액은 약 2조4000억원으로 전체 모집 규모 1조6400억원을 웃돌았다. 10월 발행 규모는 2300억원이며 10년물 발행액을 1500억원으로 400억원 늘렸다. 지난달부터 확정기여형(DC) 퇴직연금과 개인형퇴직연금(IRP)을 통해 10년물과 20년물에 투자할 수 있게 됐다. 퇴직연금 계좌에서는 운용 과정에서 과세가 이연되고 연금으로 받을 경우 연금소득세가 적용된다.", "category": "운용·상품", "importance": 2, "source": "테크M", "published": "2026-10-08", "url": "https://www.techm.kr/news/articleView.html?idxno=155929"}, {"id": "d6cdd9e1b9c6", "title": "기초연금, 무엇을 위한 ‘하후상박’인가?", "summary": "정부가 9월 1일 발표한 2027년 기초연금 개편안은 소득 하위 30%는 월 38만 원, 30~45%는 35만9천 원, 45~70%는 35만 원으로 급여를 차등화한다. 필자는 45~70% 구간 노인 290만 명의 급여가 동결돼 물가 상승에 따라 실질 급여가 줄고, 생계급여 수급 노인은 인상분만큼 생계급여가 깎인다고 지적했다. 부부 감액 완화(20%→10%)가 하위 45%까지만 적용돼 구간 경계에서 형평성 문제가 생긴다고 밝혔다. 기초연금을 정액 급여·물가 연동의 노후 기초소득보장 제도로 유지하고 빈곤 노인은 별도 보충급여로 지원해야 한다고 제언했다.", "category": "가입자·사회", "importance": 2, "source": "노동과희망", "published": "2026-10-08", "url": "http://news.inochong.org/detail.php?number=6623&thread=22r06"}, {"id": "5576dbb4a457", "title": "[미래에셋 인사 전망]① 세대교체 3년… ETF·연금·디지털자산 키운 전문경영인 체제", "summary": "미래에셋그룹은 최근 3년간 10월 하순부터 11월 둘째 주 사이에 정기 인사를 시작했으며, 올해는 10월 8일까지 새 정기 임원인사가 나오지 않았다. 미래에셋증권 연금자산은 6월 80조원을 넘어섰고 퇴직연금과 개인연금에 이어 종합투자계좌까지 자산관리 영역을 넓혔다. 허선호 대표는 WM과 연금 등 자산관리 사업을, 김미섭 대표는 글로벌·IB를 맡는 각자대표 체제가 3년째 이어지고 있다. 미래에셋자산운용 최창훈·이준용 부회장의 임기는 11월 23일 끝난다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스클레임", "published": "2026-10-08", "url": "https://www.newsclaim.co.kr/news/articleView.html?idxno=3077756"}, {"id": "ba666e5e775c", "title": "미래에셋증권, 개인투자용 국채 10년물 확대..퇴직연금 청약 두 달째", "summary": "미래에셋증권이 8일부터 15일까지 5영업일간 개인투자용 국채 10월 청약을 실시하며, 총 발행 규모는 9월과 같은 2300억원이다. 10년물은 1100억원에서 1500억원으로 늘었고 5년물과 20년물은 각각 300억원, 450억원으로 200억원씩 줄었다. 확정기여형(DC)·개인형퇴직연금(IRP) 계좌에서는 9월부터 10년물과 20년물 투자가 가능해졌으며 이번 청약에서도 이어진다. 9월에는 2585억원의 청약이 접수돼 청약률 112%를 기록했고, 올해 9월까지 누적 청약 금액은 약 2조4000억원이다.", "category": "운용·상품", "importance": 2, "source": "포쓰저널", "published": "2026-10-08", "url": "http://www.4th.kr/news/articleView.html?idxno=2119412"}, {"id": "c07657b8f041", "title": "박홍근 “과감한 개혁으로 구조적 위기 극복…노동·교육·연금 개혁 실행방안 마련”", "summary": "박홍근 기획예산처 장관이 8일 기획처 출범 후 처음 열린 국회 재정경제기획위원회 국정감사 인사말에서 과감한 개혁으로 구조적 위기를 극복하겠다고 밝혔다. 박 장관은 인구구조 변화에 따른 경제·사회적 부담 증가 등 구조적 위기가 근본적인 대응을 요구한다고 말했다. 노동·교육·연금 등 개혁이 필요한 과제를 폭넓게 살피고 관계부처와 함께 구체적인 실행 방안을 마련하겠다고 했다. 충분한 사회적 논의로 공감대를 넓히되 다음 세대를 위해 필요한 개혁은 책임 있게 추진하겠다고 말했다.", "category": "제도·규제", "importance": 2, "source": "헤럴드경제", "published": "2026-10-08", "url": "https://biz.heraldcorp.com/article/10896758"}, {"id": "d6e6d936997f", "title": "노후 준비하는 고령자 64.4%로 늘었는데…삶 만족은 33.7%로 뒷걸음", "summary": "국가데이터처의 '2026 고령자 통계'에 따르면 노후를 준비하고 있다는 고령자는 64.4%로 2015년(46.9%)보다 17.5%p 늘었지만, 삶에 만족한다는 고령자는 33.7%로 1년 전보다 1.8%p 줄었다. 생활비 마련 방법은 근로·사업소득이 48.2%, 연금·퇴직금이 38.3%였고, 노후 준비 수단으로는 국민연금이 53.2%로 가장 많았다. 65세 이상 고령자의 연금 수급률은 91.2%(2024년 기준), 월평균 수급액은 73만7000원이었다. 66세 이상 상대적 빈곤율은 2024년 37.7%로 전년보다 2.1%p 낮아졌으나 한국의 은퇴연령층 빈곤율은 여전히 OECD 회원국 중 가장 높다.", "category": "가입자·사회", "importance": 2, "source": "데일리팝", "published": "2026-10-08", "url": "http://www.dailypop.kr/news/articleView.html?idxno=103158"}, {"id": "6d12db758fae", "title": "[2026 금융대상] 교보생명, 50년 퇴직연금 노하우…고객 노후자산 '든든'", "summary": "교보생명은 1976년 국내 최초로 '종업원퇴직적립보험'을 개발했고 2002년 퇴직연금 전담팀 운영, 2005년 한국형 퇴직연금시스템 독자 개발 등으로 사업 역량을 강화해왔다. 올해 1분기 퇴직연금 적립금 상위 15개 사업자 가운데 원리금비보장 상품의 장단기 수익률 1위를 기록했고 2분기에도 업계 최고 수준을 유지했다. 교보생명 내부 분석 결과 로보어드바이저 서비스를 구독한 고객의 직전 1년 수익률이 미구독 고객보다 10%포인트 이상 높았다. 계리사·회계사·노무사 등 10년 이상 경력의 전문가 그룹이 기업별 맞춤형 컨설팅도 제공한다.", "category": "업계·경쟁사", "importance": 1, "source": "아시아투데이", "published": "2026-10-08", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261007010001926"}, {"id": "2f0f12e42494", "title": "더 할 수 있는데…초라한 노후", "summary": "정년이 지난 60세 이상 고령층이 생활비 마련과 건강 유지, 연금 수급 전 소득 공백 등을 이유로 구직에 나서고 있지만 나이 때문에 일자리를 구하기 어렵다는 현장 목소리를 담았다. 정년퇴직 후 연금 수급 개시 연령을 충족하지 못한 이들은 소득 공백기에 부딪히고, 국민연금 수령액이 적어 연금과 별개의 소득이 필요한 것으로 나타났다. 국가데이터처의 '2026년 5월 경제활동인구조사 고령층 부가조사 결과'에 따르면 지난 1년간 구직 활동을 한 고령층(55~79세)은 19.8%(336만명)였고, 고령층 취업자 수는 1012만명으로 통계 작성 이후 처음 1000만명을 넘었다. 고령층의 69.2%(1178만명)가 앞으로도 일하기를 원했고 평균 73.6세까지 일하고 싶어했으며, 가장 오래 일한 직장을 그만둘 당시 나이는 평균 53세였다.", "category": "가입자·사회", "importance": 1, "source": "일요시사", "published": "2026-10-08", "url": "https://www.ilyosisa.co.kr/news/article.html?no=258148"}, {"id": "dcc9c44e7246", "title": "\"월배당 200만원 받는다는데?\"…커버드콜 ETF의 두 얼굴 [영상PICK]", "summary": "은퇴 후 생활비 마련을 위해 고배당주와 월배당 ETF에 투자하는 사람이 늘고 있으며, 일부 커버드콜 ETF는 연 15~24% 수준의 분배율을 내세운다. 국민연금연구원에 따르면 서울 거주 부부의 적정 노후 생활비는 월 337만원이지만 국민연금 평균 수령액은 60만원대다. 연간 금융소득이 2000만원을 넘으면 금융소득종합과세 대상이 되고, 지역가입자는 금융소득이 연 1000만원을 넘으면 건강보험료 산정에 반영될 수 있다. 기사는 연금저축·IRP·ISA 같은 절세 계좌를 활용하고 원금 손실 가능성을 함께 따져야 한다고 짚었다.", "category": "가입자·사회", "importance": 1, "source": "메트로신문", "published": "2026-10-08", "url": "https://www.metroseoul.co.kr/article/20261008500060"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-10-01 ~ 2026-10-07", "generated_at": "2026-10-08T14:46:07+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "393d12b4dd32", "title": "퇴직연금 가입 대상 611만명 미가입...\"기금형 도입해 사각지대 줄여야\"", "summary": "국회 토론회에서 퇴직연금 가입 대상 1308만명 가운데 611만명이 미가입 상태이고, 전체 사업장 164만개 중 도입 사업장은 44만개(26.5%)에 그친다는 점이 지적됐다. 이재진 전국사무금융서비스노동조합 위원장은 계약형 구조 때문에 사각지대가 방치돼 왔다고 말했다. 기금형 퇴직연금을 금융기관형·연합형·공공형으로 나누는 방안이 논의되는 가운데 오건호 내가만드는복지국가 공동대표와 오종헌 국민연금지부 위원장은 국민연금공단의 참여 가능성과 전국적 인프라 활용을 제시했다. 남성욱 고용노동부 퇴직연금복지과장은 제도개편 대책을 곧 발표할 예정이라고 밝혔다.", "category": "제도·규제", "importance": 5, "source": "월요신문", "published": "2026-10-02", "url": "https://www.wolyo.co.kr/news/articleView.html?idxno=318567", "related": [{"title": "611만명 퇴직연금 사각지대 \"푸른씨앗 키워 포괄하자\"", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237050"}]}, {"id": "f14fcbcde9b5", "title": "550조 퇴직연금 판 흔든다…국민연금 참여 '기금형 퇴직연금' 법안 발의", "summary": "더불어민주당 이용우 의원이 공동발의 12인과 함께 10월 2일 근로자퇴직급여 보장법 일부개정법률안을 발의했다. 개정안은 국민연금공단 등 공적연금관리기관이 기금형 퇴직연금 사업에 참여할 수 있도록 하고, 시장점유율 상한을 3년차 10%, 4년차 20%, 5년차 30%로 두었다. 2025년 말 퇴직연금 적립금은 501조4000억원이고 2024년 수익률은 4.77%로 같은 해 국민연금 수익률 15.0%를 밑돌았으며, 수수료는 2018년 8956억원에서 2025년 1조7748억원으로 98% 늘었다. 중소기업퇴직연금기금 가입 대상은 현재 100명 미만에서 2028년까지 300명 이하로 확대되고, 법안은 공포 후 1년이 지나 본격 시행된다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-10-07", "url": "http://www.globalepic.co.kr/view.php?ud=2026100708100769037cc35ccc5c_29", "related": []}, {"id": "e2715a68b129", "title": "[BS모닝] '퇴직연금 500조' 은행 과점 속 수익률 2%대…\"기금형 도입·디폴트 개편 시급\"", "summary": "자본시장연구원이 6일 발표한 '초고령사회 다층노후소득을 위한 퇴직연금제도 개편' 보고서에 따르면 2025년 말 국내 퇴직연금 적립금은 501조4000억 원으로 최근 5년간 2배 가까이 늘었고 업권별 점유율은 은행 52.0%, 증권 26.2%였다. 적립금의 75.4%가 원리금보장상품에 묶여 있고 DB형은 그 비중이 91.9%에 달해 10년 연평균 수익률이 2.64%에 그쳤으며, 디폴트옵션 적립금 53.3조 원도 85.4%가 안정형에 편중돼 연간 수익률이 3.69%였다. 남재우 선임연구위원은 근로자 중심의 독립 수탁법인이 운용하는 기금형 퇴직연금 도입이 필수적이며 비영리 연합형·금융기관 개방형·공공형 3개 유형을 제도 목적에 맞게 설계해야 한다고 제언했고, 국민연금공단의 퇴직연금 위탁운용 참여는 민간 시장 구축 부작용을 이유로 엄격히 배제해야 한다고 밝혔다. 계약형에 대해서는 DB형의 적립금운용계획서(IPS) 실질화와 일임형 OCIO 허용, DC형의 100% 원리금보장형 적격상품 배제와 옵트아웃 방식 전면 개편을 주문하며, 운용체계 개편과 중도 누수 차단이 병행되면 13% 수준인 소득대체율을 20~30%대로 끌어올릴 수 있다고 했다.", "category": "제도·규제", "importance": 4, "source": "세계비즈", "published": "2026-10-07", "url": "http://www.segyebiz.com/newsView/20261006519590", "related": []}, {"id": "08de4b3168d0", "title": "\"안전하다더니 줄줄이 마이너스\"…퇴직 코앞인데 '날벼락'", "summary": "퇴직연금 분석업체 글라이드리서치 집계로 지난달 국내 TDF 197개 가운데 185개가 보수 차감 전 기준 손실을 냈다. 빈티지별 평균 손실률은 TDF2035가 1.10%로 가장 높고 TDF2060이 0.80%로 가장 낮아 차이가 0.30%포인트에 불과했으며, 은퇴가 가장 가까운 TDF2025도 -0.97%로 장기 빈티지보다 손실을 줄이지 못했다. 성과를 가른 것은 환헤지 여부로, 같은 상품의 환헤지형과 환노출형 19쌍을 비교한 결과 환헤지형 수익률이 평균 0.61%포인트 높았다. 미국 10년 만기 국채 금리가 8월 말 연 4.75%에서 지난달 말 연 5.29%로 뛴 영향이며, 연초 이후 누적으로는 197개 중 187개가 여전히 수익을 내고 있다.", "category": "운용·상품", "importance": 4, "source": "한국경제", "published": "2026-10-07", "url": "https://www.hankyung.com/article/2026100663321", "related": []}, {"id": "93a3950c099e", "title": "\"반도체만 믿다간 큰일\" 직장인들 돌변하더니…'대이동' [김연지의 연금빌드업]", "summary": "미래에셋증권 집계로 올해 3분기 확정기여(DC)형·개인형퇴직연금(IRP) 계좌에서 순매수액이 가장 많았던 ETF는 'TIGER 미국S&P500'이었고 'TIGER 미국나스닥100'과 'KODEX 미국나스닥100', 'KODEX 미국S&P500'이 뒤를 이어 순매수 상위 1~4위가 모두 미국 대표지수 추종 상품으로 채워졌다. 2분기 순매수 1·2위는 'RISE 삼성전자SK하이닉스채권혼합50'과 'KODEX 삼성전자SK하이닉스채권혼합50'이었고 'SOL AI반도체TOP2플러스'와 'KODEX AI반도체TOP2플러스'가 3·4위에 올라 반도체 상품이 최상위권을 차지했다. 코스피는 3분기 첫 거래일인 7월 1일 8303.41에서 9월 30일 6838.04로 17.6% 하락했고, 3분기 일평균 거래대금은 34조6620억원으로 2분기 55조9269억원보다 38.0% 줄었다. 미국 대표지수 외에 'TIGER 미국배당다우존스'가 순매수 6위, 'TIGER TDF2045 적격'이 7위, 'KODEX 머니마켓액티브'가 8위, 'TIGER 배당커버드콜액티브'가 10위에 새로 진입했다.", "category": "운용·상품", "importance": 4, "source": "한국경제", "published": "2026-10-04", "url": "https://www.hankyung.com/article/2026100204986", "related": []}, {"id": "12a423aa5284", "title": "550조 퇴직연금, DC·IRP 시장 확대… 개인 자금 증권사 머니무브", "summary": "국내 퇴직연금 적립금이 550조원을 넘어선 가운데 보험업계의 성장세가 둔화된 것으로 나타났다. 2024년 10월 실물이전 서비스 시행 이후 올해 6월까지 약 15조8699억원이 이전되는 과정에서 보험업권은 1799억원이 순유출됐고 증권업권으로는 4조1513억원이 유입됐다. 보험업계 시장점유율은 지난해 말 21.1%에서 올해 상반기 19.4%로 내려가 처음으로 20%를 밑돌았다. 시장 구조가 확정급여형(DB)에서 확정기여형(DC)과 개인형퇴직연금(IRP) 중심으로 이동하고 있다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌이코노믹", "published": "2026-10-01", "url": "https://www.g-enews.com/view.php?ud=202609301417579233a6e8311f64_1", "related": []}, {"id": "ee6cf0e31b06", "title": "“부유한 노인도 받는다”…기초연금 ‘하위 70%’ 기준 개편 추진", "summary": "정부가 기초연금 수급 대상을 현행 노인 소득 하위 70% 방식에서 기준중위소득과 연계하는 방식으로 개편할 계획이다. 내년에는 소득 하위 30%의 기준연금액을 월 35만원에서 38만원으로 올리고 차등 지급을 적용한다. 다만 이 조치의 노인빈곤율 개선 효과는 0.3%포인트에 그친다. 정부는 저소득 노인의 급여 인상에 집중하기 위해 장기적으로 수급 구조를 개편할 방침이다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-03", "url": "https://www.segye.com/newsView/20261002510945?OutUrl=naver", "related": [{"title": "이재명 정부, 기초연금 개혁 회피해선 안 된다", "source": "시사IN", "url": "https://www.sisain.co.kr/news/articleView.html?idxno=58534"}, {"title": "기초연금 '소득 하위 70%' 기준 바꾼다…중위소득 연계 재추진", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6308073"}]}, {"id": "c4dab2068ab2", "title": "복지부 국감 개막⋯기초연금 '반쪽 개편'·국민연금 손실 추궁 [국감]", "summary": "국회 보건복지위원회가 7일 보건복지부와 질병관리청을 시작으로 이틀간 국정감사에 들어갔다. 핵심 쟁점은 연금제도 개편안으로, 복지부가 추진해 온 저소득층 노인 중심 '하후상박' 기초연금 개편이 사회적 논의 부족을 이유로 1년짜리 단기 계획에 그친 점이 '반쪽 개편'이라는 지적을 받을 전망이다. 국민연금은 기금 재정 안정성과 함께 자산배분 리밸런싱 한시 유예, 국내 주식 목표 비중 상향(14.9%→20.8%)에 따른 증시 급락 손실 문제가 검증대에 오른다. 복지위 국감은 14일 국민연금공단, 16일 국민건강보험공단·건강보험심사평가원을 거쳐 27일 종합감사로 마무리된다.", "category": "제도·규제", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2633071", "related": [{"title": "기초연금 '반쪽' 개편·국립대병원 첫 등판…복지부 국감 쟁점은", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261003_0003813472"}]}, {"id": "10d60d62502c", "title": "한국투자증권, 연금 MTS 개편…“적립·운용·수령까지 밀착 지원”", "summary": "한국투자증권이 10월 6일 연금 모바일트레이딩시스템(MTS) 개편 설명회를 열었다. 복잡한 연금 절차를 단순화하고 개인화 기능을 강화해 단순 자산 조회를 넘어 가입자가 실제로 조치할 항목을 안내하는 방식으로 바꿨다. 회사는 퇴직연금 의무화 논의가 본격화되고 가입자 평균 연령이 낮아지는 변화에 맞춰 적립뿐 아니라 운용과 수령 설계까지 지원하는 ‘평생 연금 파트너’ 체계를 갖추고, 개인 고객에게는 자산관리 컨설팅을, 법인 고객에게는 IB·기업 솔루션을 연결하겠다고 밝혔다. 최종진 연금혁신본부장은 “연금에는 은퇴가 없다는 기조로 은퇴 준비를 더 쉽고 믿을 수 있게 만드는 플랫폼으로 고도화하겠다”고 말했다.", "category": "업계·경쟁사", "importance": 3, "source": "더퍼블릭", "published": "2026-10-07", "url": "https://www.thepublic.kr/news/articleView.html?idxno=321335", "related": [{"title": "한국투자증권, 연금 MTS 개편 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31774"}]}, {"id": "83b8b035dfc8", "title": "7월 폭락장, 국민연금도 못 피했다…국민 노후자금 10% 증발에 '부글부글'", "summary": "국민연금 적립금이 6월 1866조원에서 7월 1684조원으로 한 달 만에 9.7% 줄어 181조4030억원의 손실이 났다. 국내주식 평가액은 543조2040억원에서 418조5580억원으로 22.9% 감소했고, 국내주식 누적 수익률은 107.37%에서 60.11%로 축소됐다. 같은 기간 코스피 지수가 8470선에서 6590선으로 22.2% 급락한 영향이다. 연초 이후 국민연금 수익률도 6월 27.22%에서 7월 14.84%로 내려앉았다.", "category": "운용·상품", "importance": 3, "source": "뉴시스", "published": "2026-10-04", "url": "https://www.newsis.com/view/NISX20261002_0003813049", "related": [{"title": "역대급 폭락에 국민연금도 울상...'롤러코스피' 리스크", "source": "YTN", "url": "https://www.ytn.co.kr/_ln/0103_202610040524028320"}]}, {"id": "65997f6263af", "title": "연금통장에 금리·현금 얹는다⋯은행권 '은퇴고객' 쟁탈전", "summary": "은행권이 연금 수령 고객을 끌어오기 위해 금리와 현금 혜택을 내걸고 있다. KB국민은행은 기본금리 연 0.1%에 최고 연 3.1%를 주는 'KB골든라이프연금통장'을 내놓고 'KB골든라이프연금예금'을 5000억원 한도로 재판매하며, 12개월 기준 연 3.50~3.70% 금리를 적용한다. 하나은행은 모바일 앱에 '공적연금 라운지' 전용 멤버십 서비스를 열고 신규 고객에게 최대 5만원 캐시백과 보험 무료 가입을 제공한다. Sh수협은행은 12월 31일까지 '4대 연금 환승' 이벤트로 최대 5만원 캐시백을 주고, 'Sh골든데이 연금통장'에 최고 연 3.2% 금리를 적용한다.", "category": "업계·경쟁사", "importance": 3, "source": "아이뉴스24", "published": "2026-10-04", "url": "http://www.inews24.com/view/2011611", "related": [{"title": "“최고 연 3.7%에 현금 5만원”⋯시중은행, 공적연금 유치전 후끈", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=148274"}]}, {"id": "7af9d30a6229", "title": "퇴직연금 1000억 돌파한 키움증권…표영대 본부장 \"AI PB로 차별화\"[SS인터뷰]", "summary": "지난 6월 퇴직연금 사업을 시작한 키움증권은 첫 달 IRP 적립금 649억 원을 확보한 뒤 7월 24일 전체 적립금 1000억 원을 넘어섰다. 표영대 연금플랫폼본부장은 개인 IRP를 시작으로 기업형 DC·DB까지 영역을 넓혀 2035년 퇴직연금 시장점유율 10%, 적립금 기준 업계 톱5 진입을 목표로 제시했다. 키움증권은 MTS '영웅문S#'에서 ETF 실시간 거래와 적립식 투자, 자동감시주문을 제공하고 원리금보장상품과 실적배당상품의 96% 이상을 상품군으로 갖춰 실물이전 수요를 노린다. 오프라인 지점이 없는 한계는 로보어드바이저 도입과 가칭 'AI PB' 개발로 보완할 계획이다.", "category": "업계·경쟁사", "importance": 3, "source": "스포츠서울", "published": "2026-10-07", "url": "https://www.sportsseoul.com/news/read/1639392", "related": []}, {"id": "f732754d6138", "title": "테마 쪼개고 채권 섞고…ETF 신상품 설계 다변화 [ETF 지형도 변화]②", "summary": "한국거래소 신규 상장 ETF를 집계한 결과 올해 상반기 상장 99개 중 주식·채권 혼합형은 11개(11.1%)였으나, 3분기(9월 22일까지)에는 41개 중 11개로 비중이 26.8%까지 높아졌다. 주식 편입 비중이 50% 미만인 채권혼합형은 적립금의 100%까지 투자할 수 있는 '투자위험을 낮춘 상품'에 속해 퇴직연금 계좌에서 쓰임새가 크다. 금융위원회는 2023년 11월 퇴직연금감독규정을 개정해 이들 상품의 주식 편입 한도를 40% 이내에서 50% 미만으로 높였고, DC형·IRP 투자자는 위험자산 한도 70%를 주식형 ETF로 채운 뒤 나머지 30%를 채권혼합형에 배분할 수 있다. 한수진 삼성증권 선임연구원은 퇴직연금계좌를 통한 ETF 투자금액이 3년 연속 100%대 증가율을 보이고 있다고 분석했다.", "category": "운용·상품", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2632913", "related": []}, {"id": "00377454cb04", "title": "1억 넣으면 매달 167만원?…'월배당 ETF' 숫자의 함정", "summary": "국민연금연구원 제10차 국민노후보장패널조사에서 부부 기준 최소 노후 생활비는 월 217만원, 적정 노후 생활비는 월 297만원으로 조사됐다. 국민연금 수급자의 평균 수령액은 월 60만원 수준으로 부부가 함께 받아도 합산 120만~140만원에 그친다. 코스콤 ETF체크 기준 TIGER 배당커버드콜액티브의 연간 분배율은 20.88%, PLUS 고배당주위클리커버드콜은 24.13%로 시중은행 예금 금리의 4~7배 수준이다. 다만 기초지수가 20% 하락하면 분배율을 유지하더라도 주당 분배금이 줄어 원금과 분배금이 동시에 감소하는 위험이 있다.", "category": "운용·상품", "importance": 3, "source": "이코노미스트", "published": "2026-10-05", "url": "https://economist.co.kr/article/view/ecn202609290049", "related": []}, {"id": "99b7786d66ca", "title": "채권 믿다 발등 찍힌 글로벌 연기금, 금고에 금 5% 채워 방어선 쳤다", "summary": "세계금위원회가 2026년 10월 발표한 보고서에서 네덜란드·미국·영국·호주 연기금이 2020년부터 금 편입을 시작해 5년 이상 비중을 유지하고 있다고 밝혔다. 네덜란드 연기금 펜시온펀즈 피디엔은 운용자산 77억 유로 가운데 5%를 금에 배분했고, 미국 버지니아주 페어팩스 카운티 퇴직연금은 62억 달러 규모 자산의 약 3%를 금 선물로 채웠다. 영국 나우 펜션스 마스터 트러스트는 106억 달러 중 약 2%, 호주 엔지에스 슈퍼는 약 3%를 금에 배분했다. 국민연금은 기금 적립금의 80% 안팎을 국내외 주식과 채권에 집중 배치해 두고 있어 대체 자산 완충재가 부족하다는 지적이 제기된다.", "category": "법인·자금운용", "importance": 3, "source": "글로벌이코노믹", "published": "2026-10-05", "url": "https://www.g-enews.com/view.php?ud=202610041819317672fbbec65dfb_1", "related": []}, {"id": "cdc582858a12", "title": "당신도 노인 된다…韓고령자, OECD 상대빈곤율 '최고'", "summary": "국가데이터처가 1일 발표한 '2026 고령자 통계'에서 66세 이상 은퇴 연령층의 상대적 빈곤율은 2024년 기준 37.7%로 2.1%포인트 하락했지만, 2023년 기준 39.8%로 OECD 회원국 가운데 여전히 가장 높았다. 가구주가 65세 이상인 고령자 가구의 지난해 순자산액은 4억9279만원으로 2685만원 늘었다. 본인이나 배우자가 직접 생활비를 마련하는 고령자는 74.7%로 지난 10년간 16.2%포인트 늘었고, 자녀·친척 지원은 13.1%로 15.5%포인트 줄었다. 노후를 준비하는 고령자는 64.4%였고 준비 방법은 국민연금 53.2%, 예·적금 20.1%, 직역연금 10.2% 순이었다.", "category": "가입자·사회", "importance": 3, "source": "SBS Biz", "published": "2026-10-05", "url": "https://biz.sbs.co.kr/article_hub/20000338144?division=NAVER", "related": []}, {"id": "a7033061751d", "title": "디폴트옵션, 투자형 상품이 '기본' 원리금 보장은 '선택' 돼야", "summary": "삼성증권 안윤철 연금본부장은 이데일리 '퇴직연금 리더를 만나다' 인터뷰에서 원리금보장 상품에 쏠린 현행 디폴트옵션이 제도 도입 취지를 훼손했다고 평가했다. 그는 투자형 상품을 기본 디폴트로 두고 가입자의 선택으로 원리금보장 상품을 편입하게 하는 방식이 맞다고 제안했다. 손실 회피 성향의 가입자가 있을 수 있으므로 원리금보장은 선택지로 남겨두되 기본값은 바꿔야 한다는 취지다. 상품 정보 제공과 가입 절차 간소화, 글로벌 분산투자와 정기 적립식 투자, 연금 수령 단계의 세제 혜택 강화와 인센티브 확대도 함께 제시했다.", "category": "업계·경쟁사", "importance": 3, "source": "이데일리", "published": "2026-10-05", "url": "https://www.edaily.co.kr/News/Read?newsId=02017206645609968&mediaCodeNo=257", "related": []}, {"id": "84cb4f70a69c", "title": "고령화에 연금 가입 늘린다는 인도… 현실은 “생활비도 빠듯”", "summary": "인도 정부가 고령화에 대비해 국민연금제도(NPS) 가입을 독려하며 전국 설명회를 100회 넘게 열고 13개 언어로 광고를 내보내고 있다. 은퇴 시 인출할 수 있는 적립금 비율도 기존 60%에서 80%로 높이고, 현재 약 2300만명인 가입자를 5년 안에 2억5000만명으로 늘리겠다는 목표를 세웠다. 그러나 퇴직연금 계좌를 이용할 수 있는 사람은 전체의 30%에 못 미치고, 노동자 10명 중 9명은 농업·일용직·플랫폼 노동 등 비공식 부문에 종사해 사업장이 납입액을 보태주는 혜택을 받기 어렵다. 지난해 마시·CFA협회 글로벌 연금지수에서 인도는 평가 대상 52개국 중 최하위권에 머물렀다.", "category": "가입자·사회", "importance": 3, "source": "조선비즈", "published": "2026-10-04", "url": "https://biz.chosun.com/international/international_general/2026/10/04/Q5S6GXKIGZGIROBKEJETWMJPSM/", "related": []}, {"id": "6c 91cd9d139", "title": "리스크 관리·노후수입 한번에…주목받는 보증형 실적 배당보험", "summary": "미래에셋생명의 개인형 퇴직연금(IRP) 보증형 실적배당보험이 출시 후 717억원을 모집했다고 전했다. 이 상품은 IRP를 통해서만 가입할 수 있는 거치형으로, 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 연금 개시가 가능하다. 이미 만 55세를 넘긴 가입자는 가입과 동시에 연금을 받을 수 있고, 적립금이 소진될 때까지 20년 이상 연금을 수령할 수 있다. 적립금은 미래에셋생명의 일임형 자산배분펀드 MVP펀드를 통해 글로벌 자산에 분산투자된다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645584384&mediaCodeNo=257", "related": [{"title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024"}, {"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "c4dab2068ab2", "title": "복지부 국감 개막⋯기초연금 '반쪽 개편'·국민연금 손실 추궁 [국감]", "summary": "국회 보건복지위원회가 7일 보건복지부와 질병관리청을 시작으로 이틀간 국정감사에 들어갔다. 핵심 쟁점은 연금제도 개편안으로, 복지부가 추진해 온 저소득층 노인 중심 '하후상박' 기초연금 개편이 사회적 논의 부족을 이유로 1년짜리 단기 계획에 그친 점이 '반쪽 개편'이라는 지적을 받을 전망이다. 국민연금은 기금 재정 안정성과 함께 자산배분 리밸런싱 한시 유예, 국내 주식 목표 비중 상향(14.9%→20.8%)에 따른 증시 급락 손실 문제가 검증대에 오른다. 복지위 국감은 14일 국민연금공단, 16일 국민건강보험공단·건강보험심사평가원을 거쳐 27일 종합감사로 마무리된다.", "category": "제도·규제", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2633071", "related": [{"title": "기초연금 '반쪽' 개편·국립대병원 첫 등판…복지부 국감 쟁점은", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261003_0003813472"}]}, {"id": "3222e4df0aa6", "title": "[연금개혁] '골든타임' 놓치면 무용지물…국고 GDP 1% 지금 투입 땐 31년 연장, 고갈 후엔 1년뿐", "summary": "국회예산정책처 분석에 따르면 현행 제도가 유지될 경우 국민연금 기금은 2069년에 소진된다. 정부가 지금부터 매년 GDP의 1%를 투입하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥난 2069년부터 투입하면 1년만 연장된다. 기금 수익률을 2%포인트 높이면 2120년까지 흑자를 유지할 수 있다.", "category": "제도·규제", "importance": 3, "source": "CBC뉴스", "published": "2026-10-01", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=611066", "related": [{"title": "\"국민연금 수익률 2%p 높이면 2120년까지 기금 고갈 없어\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260929100600530?input=1195m"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최 1", "url": "https://www.news1.kr/economy/trend/6308073"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "1fc91cd9d139", "title": "리스크 관리·노후수입 한번에…주목받는 보증형 실적 배당보험", "summary": "미래에셋생명의 개인형 퇴직연금(IRP) 보증형 실적배당보험이 출시 후 717억원을 모집했다고 전했다. 이 상품은 IRP를 통해서만 가입할 수 있는 거치형으로, 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 연금 개시가 가능하다. 이미 만 55세를 넘긴 가입자는 가입과 동시에 연금을 받을 수 있고, 적립금이 소진될 때까지 20년 이상 연금을 수령할 수 있다. 적립금은 미래에셋생명의 일임형 자산배분펀드 MVP펀드를 통해 글로벌 자산에 분산투자된다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645584384&mediaCodeNo=257", "related": [{"title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024"}, {"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "c4dab2068ab2", "title": "복지부 국감 개막⋯기초연금 '반쪽 개편'·국민연금 손실 추궁 [국감]", "summary": "국회 보건복지위원회가 7일 보건복지부와 질병관리청을 시작으로 이틀간 국정감사에 들어갔다. 핵심 쟁점은 연금제도 개편안으로, 복지부가 추진해 온 저소득층 노인 중심 '하후상박' 기초연금 개편이 사회적 논의 부족을 이유로 1년짜리 단기 계획에 그친 점이 '반쪽 개편'이라는 지적을 받을 전망이다. 국민연금은 기금 재정 안정성과 함께 자산배분 리밸런싱 한시 유예, 국내 주식 목표 비중 상향(14.9%→20.8%)에 따른 증시 급락 손실 문제가 검증대에 오른다. 복지위 국감은 14일 국민연금공단, 16일 국민건강보험공단·건강보험심사평가원을 거쳐 27일 종합감사로 마무리된다.", "category": "제도·규제", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2633071", "related": [{"title": "기초연금 '반쪽' 개편·국립대병원 첫 등판…복지부 국감 쟁점은", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261003_0003813472"}]}, {"id": "3222e4df0aa6", "title": "[연금개혁] '골든타임' 놓치면 무용지물…국고 GDP 1% 지금 투입 땐 31년 연장, 고갈 후엔 1년뿐", "summary": "국회예산정책처 분석에 따르면 현행 제도가 유지될 경우 국민연금 기금은 2069년에 소진된다. 정부가 지금부터 매년 GDP의 1%를 투입하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥난 2069년부터 투입하면 1년만 연장된다. 기금 수익률을 2%포인트 높이면 2120년까지 흑자를 유지할 수 있다.", "category": "제도·규제", "importance": 3, "source": "CBC뉴스", "published": "2026-10-01", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=611066", "related": [{"title": "\"국민연금 수익률 2%p 높이면 2120년까지 기금 고갈 없어\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260929100600530?input=1195m"}]}, {"id": "dd4beb88ba61", "title": "“4조 8천억 몰렸다”…S&P500으로 노후 준비? 이렇게 하세요 [잇슈 머니]", "summary": "국내에 상장된 S&P500 지수 상품 하나에 올해 들어 9월 28일까지 개인 자금 4조8611억원이 들어와 국내 ETF 가운데 1위를 기록했다. 연금저축과 개인형퇴직연금(IRP)은 둘을 합쳐 연 900만원까지 세액공제를 받고, 총급여 5500만원 이하 근로자는 공제율 16.5%가 적용돼 900만원을 넣으면 최대 148만5000원을 돌려받는다. 운용수익에는 세금을 바로 떼지 않고 55세 이후 연금으로 받을 때 3.3~5.5%의 연금소득세만 내지만, 연금 수령액이 연 1500만원을 넘으면 종합과세와 16.5% 분리과세 가운데 하나를 골라야 한다. 원·달러 환율이 7월 1일 장중 1550.85원에서 10월 2일 1350.6원으로 내려오면서 같은 S&P500 지수를 따르는 국내 상장 ETF의 최근 석 달 수익률은 환헤지형 2.19% 상승, 환노출형 6.23% 하락으로 갈렸다.", "category": "운용·상품", "importance": 2, "source": "KBS", "published": "2026-10-05", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8677562&ref=A", "related": [{"title": "한국증시 뛰었는데…개인 4.9조는 美 S&P500 ETF로", "source": "매일일보", "url": "https://www.m-i.kr/news/articleView.html?idxno=2002553"}, {"title": "개미 자금 4.9조 몰렸다…미래에셋 S&P500 ETF 1위·삼성 고배당도 성장세", "source": "더구루", "url": "https://www.theguru.co.kr/news/article.html?no=107765"}]}, {"id": "d86212c7d0db", "title": "신한투자증권, 연금고객관리팀 신설…생애주기별 관리 체계 구축", "summary": "신한투자증권이 퇴직연금 시장 성장에 맞춰 연금고객관리팀을 신설하고 고객 생애주기별 연금관리 체계를 구축했다. 신규 DC·IRP 가입 고객에게 계좌 개설 후 3일 이내 제도를 안내하는 웰컴콜, 우수 연금PB와 고객을 1대1로 매칭하는 연금스타, 퇴직소득세 절세 전략 시뮬레이션과 연금 수령 계획을 담은 신한 Premier 연금컨설팅을 운영한다. 법인 CEO와 고위 임원을 대상으로 한 C-Level 컨설팅과 8월 도입한 모바일 상담도 함께 제공한다. 연금고객관리팀은 신설 이후 신한 Premier 연금컨설팅을 약 200건 제공했다.", "category": "업계·경쟁사", "importance": 2, "source": "더퍼블릭", "published": "2026-10-07", "url": "https://www.thepublic.kr/news/articleView.html?idxno=321337", "related": [{"title": "신한투자증권, 연금고객관리팀 신설…맞춤형 연금관리 강화", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2632658"}]}, {"id": "8886365e07f8", "title": "국민연금, 삼성전자 팔고 하이닉스 1.6조 매수", "summary": "국민연금이 7월 이후 SK하이닉스를 가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
