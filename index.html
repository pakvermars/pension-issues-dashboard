<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퇴직연금 주요 이슈</title>
<style>
  /* ── 팔레트 ───────────────────────────────────────────────
     잉크 네이비 위에 차가운 석재 종이. 강조색은 적립·성장을 뜻하는
     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나. */
  :root {
    --ink: #101C33;
    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom: #D6341F;

    --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',
               'Malgun Gothic', system-ui, sans-serif;
    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #DCE2EC;
      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 어두운 바탕에서는 다홍이 탁해 보여 한 단계 밝게 쓴다. */
      --kiwoom: #FF7A63;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;
  }

  .slogan {
    margin: 0 0 0 auto;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom);
    white-space: nowrap;
  }

  .hero-date {
    font-family: var(--font-num);
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .search input {
    width: 230px;
    max-width: 44vw;
    padding: 4px 0;
    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */
  .group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;
  }

  .rail button {
    flex: 1 1 0;
    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .range {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  /* ── 분야 필터 ─────────────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
  }

  .filters button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */
  .notice {
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */
  .list { margin: 8px 0 0; }

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);
  }

  article[data-cat="2"] .badge { color: var(--cat-2); }
  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

  details summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

html/view.jsp?idxno=202609271311596880436"}, {"id": "c9e4554d890c", "title": "\"절세하려면 퇴직금은 무조건 IRP 계좌로 수령해야\"", "summary": "안명희 우리은행 연금사업부 과장은 퇴직금을 IRP 계좌로 받으면 세금을 떼지 않은 원금 전체가 입금돼 과세 이연에 따른 복리 효과를 볼 수 있다고 설명했다. 55세에 퇴직금 5억원과 운용수익 1000만원이 발생한 경우 일시금으로 인출하면 퇴직소득세 5000만원과 기타소득세 165만원을 합쳐 5165만원을 내지만, 연금으로 받으면 퇴직소득세가 30% 감면돼 3500만원, 운용수익은 3.3~5.5% 저율과세로 55만원만 부담해 총 3555만원으로 줄어든다. 올해부터 연금 수령 10년차까지는 퇴직소득세 30%, 11~20년차는 40%, 21년차 이상은 50%까지 감면율이 올라간다. 확정기여형(DC) 가입자는 정기예금이나 장기 보유 ETF를 매도하지 않고 그대로 옮기는 현물이전 제도를 활용할 수 있다.", "category": "가입자·사회", "importance": 3, "source": "조선일보", "published": "2026-09-28", "url": "https://www.chosun.com/economy/money/2026/09/28/I7WBO2GJAJCAJP2JFJZSI3D6SQ/"}, {"id": "85d1a1d40530", "title": "삼성증권, '슈퍼리치' 1만명 시대 선도…발행어음 IB 확장 [빅7 증권사]", "summary": "삼성증권의 퇴직연금 적립금은 2026년 6월 말 28조1000억원으로 1년 전보다 63% 늘어 은행·증권·보험을 포함한 국내 퇴직연금 사업자 가운데 9위에 올랐다. 삼성증권의 2026년 상반기 영업수익은 1조8930억원으로 업계 4위였고, 2분기 영업수익은 1조394억원으로 '1조 클럽'에 진입했다. 금융자산 30억원 이상 고객이 1만명을 넘어 업계 처음으로 이 기록을 세웠고, 1억원 이상 고객은 6월 말 57만2000명으로 늘었다. 삼성증권은 2026년 9월 국내 8번째 발행어음 사업자로 인가를 받아 기업금융 확장에 나섰다.", "category": "업계·경쟁사", "importance": 3, "source": "한국금융신문", "published": "2026-09-28", "url": "https://www.fntimes.com/html/view.php?ud=202609231724432862dd55077bc2_18"}, {"id": "0018a7ccadf9", "title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "summary": "기금형 퇴직연금 도입을 담은 근로자퇴직급여보장법 개정안 논의가 늦어지면서 8월 초 나오기로 했던 세부안이 아직 공개되지 않았고, 금융사 CEO 간담회도 두 차례 연기됐다. 국민연금공단 이사장은 공단이 퇴직연금 운용에 참여하면 기존 대비 수수료는 3분의 1, 수익률은 3배 이상을 기대할 수 있다고 주장했다. 칼럼은 국민연금 기금 1866조원이 퇴직연금 시장 550조원의 3배가 넘는 규모여서 민간 금융사와 공정한 경쟁이 되기 어렵고, 공적 연금 기관의 본분에서도 벗어난다고 지적했다. 그러면서 주도권을 고용노동부가 되찾고 민간 금융사가 수수료를 낮추고 수익률을 높이는 방향으로 개혁이 이뤄져야 한다고 주장했다.", "category": "제도·규제", "importance": 3, "source": "글로벌에픽", "published": "2026-09-28", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"id": "2aa629e1d57f", "title": "[한국경제 아킬레스건](5) 국민연금 고갈론 : 청년 세대의 불신과 연금개혁", "summary": "기금이 소진되면 국민연금은 적립방식에서 현재 근로세대의 보험료로 수급자를 부양하는 부과방식으로 전환해야 한다고 기사는 지적했다. 이 경우 청년과 미래 세대는 소득의 20~30% 이상을 보험료로 부담해야 할 수 있다는 추계가 제시됐다. 한국의 노인빈곤율은 OECD 최고 수준이며, 기금 소진 시점은 현재 인구구조에서 수십 년 내로 전망된다. 소득보장 강화와 재정안정 요구가 맞서는 가운데 선거를 의식한 정치권의 판단이 겹쳐 연금개혁 논의는 계속 지체되고 있다.", "category": "가입자·사회", "importance": 2, "source": "금융소비자뉴스", "published": "2026-09-28", "url": "http://www.newsfc.co.kr/news/articleView.html?idxno=81360"}, {"id": "9daa1efa3e20", "title": "'1000조 금융그룹' 미래에셋의 Next Step", "summary": "미래에셋그룹의 운용자산은 2026년 5월 기준 약 1조4000억달러로, 2022년 말 4426억달러에서 3년여 만에 두 배 넘게 늘었다. 미래에셋증권의 고객자산 784조원 가운데 연금자산은 80조8000억원이다. 그룹은 6개국에서 775개 ETF를 운용하며 순자산 389조원을 관리하고 있고, ETF가 퇴직연금 플랫폼의 판매 채널로 작동해 상품 출시 이후에도 장기 고객 관계를 유지하는 역할을 한다고 기사는 설명했다. 미래에셋은 국내 TIGER, 미국 Global X, 인도 법인을 하나의 생태계로 묶는 '미래에셋 3.0'을 추진하고 있다.", "category": "업계·경쟁사", "importance": 2, "source": "포춘코리아", "published": "2026-09-28", "url": "https://www.fortunekorea.co.kr/news/articleView.html?idxno=54170"}, {"id": "537fe966e011", "title": "[닻 올린 이형일號③] 잠재성장률 3% 도전…'적극 재정'이 구조개혁으로 이어질까", "summary": "이형일 부총리 겸 재정경제부 장관은 27일 취임 후 첫 경제현안간담회를 열고 전기차 산업 정책방향과 퇴직연금 제도개선 방안을 첫 안건으로 올렸다. 회의에는 기후에너지환경부·고용노동부·기획예산처 장관과 산업통상부 차관, 금융위원장, 청와대 경제성장수석이 참석했고, 정부는 이날 논의를 토대로 추가 부처 협의와 각계 의견 수렴을 거쳐 구체적인 방침을 확정할 예정이다. 기사는 전기차가 미래 성장동력, 퇴직연금이 노후소득과 장기자금 운용체계라는 서로 다른 과제를 안고 있지만 제도개선과 부처 간 조율이 필요하다는 공통점이 있다고 설명했다. 한국은행이 잠재성장률을 2% 안팎으로 추정하는 가운데 정부는 이를 3%대로 높이겠다는 목표를 내걸고 내년 총지출을 올해보다 12.8% 늘린 820조9000억원으로 편성했다.", "category": "제도·규제", "importance": 2, "source": "뉴시안", "published": "2026-09-28", "url": "http://www.newsian.co.kr/news/articleView.html?idxno=96052"}, {"id": "5291e5b5c55d", "title": "변액펀드에 AI 입혔더니…누적수익률 61.8% 찍었다", "summary": "보험사의 AI 활용 영역이 고객 상담과 보험금 심사를 넘어 자산운용으로 넓어지고 있다. 미래에셋생명 'ETF AI MVP(적극)'의 누적수익률은 9월 15일 기준 61.8%, 'ETF AI MVP(중립)'는 29.5%였고, 이 펀드는 미래에셋자산운용 AI 모델이 매월 말 향후 25영업일의 시장 흐름을 예측해 주식과 채권 비중을 결정하는 구조다. iM라이프는 지난 7월 iFA와 함께 AI 기반 펀드관리 서비스를 적용한 '오토파일럿 변액연금보험'을 출시했다. 교보생명은 퇴직연금 DC·IRP 가입자를 대상으로 AI 알고리즘과 빅데이터를 활용한 로보어드바이저 서비스를 운영하며 고객별 자산배분 포트폴리오와 리밸런싱 정보를 제공하고 있다.", "category": "운용·상품", "importance": 2, "source": "투데이신문", "published": "2026-09-28", "url": "https://www.ntoday.co.kr/news/articleView.html?idxno=129582"}, {"id": "c7600ffad7f4", "title": "[소성민 칼럼] '생산적 금융'이라는 위험한 착각", "summary": "칼럼은 정부가 무엇이 생산적 금융인지 미리 정해 자금 배분에 개입하는 방식을 비판했다. 정부는 올해 가계대출 증가율을 1.5% 이내로 관리하는 한편 150조원 규모 국민성장펀드를 조성해 AI·반도체·바이오·로봇·이차전지 등 첨단전략산업에 자금을 공급하기로 했고, 이 가운데 75조원은 첨단전략산업기금, 나머지는 금융회사와 연기금·국민 등 민간자금으로 채운다. 생산적 금융 실적을 금융회사 KPI에 반영할수록 대출 판단이 상환능력보다 정부 인정 여부에 기울어 관치금융으로 변할 위험이 있다고 지적했다. 국민연금에 대해서는 지난 5월 국내주식 목표비중을 14.9%에서 20.8%로 높인 결정에 별도의 운용 논리가 있다면서도, 산업정책이나 증시 부양이 연금의 투자 판단에 앞서면 본래 목적과 충돌할 수 있다고 밝혔다.", "category": "제도·규제", "importance": 2, "source": "더밸류뉴스", "published": "2026-09-28", "url": "http://www.thevaluenews.co.kr/news/view.php?idx=201878"}, {"id": "7180a98bb1d0", "title": "[HOT 금융 트렌드] 삼성증권, '주식모으기' 출시 2주년 현황 분석 발표", "summary": "삼성증권은 적립식 투자 서비스 '주식모으기' 출시 2주년을 맞아 이용 현황을 분석한 결과를 28일 밝혔다. 가입 기간이 6개월 이상인 고객 중 91%가 서비스를 지속 이용 중이고, 서비스를 경험한 고객의 67%는 2건 이상을 복수로 운용하고 있다. 전체 모으기 주문금액의 약 3분의 2와 이용 계좌수의 약 70%가 중개형 ISA·개인연금·퇴직연금 등 절세계좌에 집중됐다. 연금계좌에서는 지수 추종과 배당·금 상품 선호가 뚜렷했고, 법인도 주식·ETF·금현물을 활용한 정기 자금운용 수단으로 도입을 늘리고 있다.", "category": "업계·경쟁사", "importance": 2, "source": "비즈월드", "published": "2026-09-28", "url": "http://www.bizwnews.com/news/articleView.html?idxno=147173"}, {"id": "a9fde4aa3d5f", "title": "삼성생명, 배타적사용권 5건 확보…제3보험 경쟁력↑", "summary": "데이터뉴스가 생명보험협회의 배타적사용권 신청사항 및 심의결과를 분석한 결과 생명보험사들은 올해 들어 20건의 배타적사용권을 획득했다. 9월 22일 기준 삼성생명이 5건으로 가장 많았고, 그 가운데 퇴직연금 ETF 오토마타(주식형)펀드가 포함됐다. 나머지 4건은 응급실내원 특약, 가족계약납입면제 할인, 삼성 암치료플러스종신보험, 통합표적치매치료보장특약이다. 교보생명이 4건, 흥국생명이 3건, 한화생명·DB생명·AIA생명이 각각 2건, 신한라이프와 라이나생명이 각각 1건을 확보했다.", "category": "업계·경쟁사", "importance": 2, "source": "데이터뉴스", "published": "2026-09-28", "url": "http://www.datanews.co.kr/news/article.html?no=146632"}, {"id": "8a36b03fe54c", "title": "국채금리 급등…저금리 시대의 청구서가 날아온다", "summary": "미국·일본·유럽 주요 선진국의 국채 금리가 일제히 수십 년 만의 최고 수준으로 치솟아 저금리 시절에 쌓인 부채가 이자 부담으로 돌아오고 있다. 일본의 10년 만기 국채 금리는 이달 3%를 돌파해 1996년 이후 30년 만에 가장 높은 수준이 됐고, 미국 10년물은 5%를 넘나들며 2007년 이후 19년 만의 최고치를 기록했다. 기사는 퇴직연금과 보험, 국민연금 등 장기 자금의 운용 성과도 채권과 주식 가격 변동에 따라 출렁인다며 개인의 노후자금이 이 흐름 위에 놓여 있다고 설명했다. IMF가 지난 7월 내놓은 전망에서 올해 실질 경제성장률은 미국 2.3%, 일본 0.6%, 독일 0.7%, 프랑스 0.6%로 제시돼 성장률이 금리를 밑도는 상태가 이어질 수 있다는 우려가 제기됐다.", "category": "운용·상품", "importance": 2, "source": "이로운넷", "published": "2026-09-28", "url": "https://www.eroun.net/news/articleView.html?idxno=91011"}, {"id": "78e207f214e0", "title": "3분기 감익 우려에도 증권주 주목…신사업 성장동력 기대", "summary": "윤유동 NH투자증권 연구원은 28일 보고서에서 증권업종 투자의견을 '긍정적'으로 유지하고 최선호주로 삼성증권을 꼽았다. 금리 상승과 거래대금 감소로 3분기 브로커리지·트레이딩 실적은 부진할 것으로 봤지만, 이달 23일까지 3분기 일평균 거래대금은 76조3000억원으로 전년도 평균 31조7000억원을 크게 웃돌았다. 이호진 스터닝밸류리서치 연구원은 키움증권이 지난해 말 발행어음 사업에 이어 올해 6월 퇴직연금 서비스를 출시하며 브로커리지 중심 사업구조에서 벗어나는 신규 사업을 빠르게 확대하고 있다고 분석했다. 전배승 LS증권 연구원은 주요 대형사의 평균 PBR이 0.9배를 하회하고 올해 예상 배당수익률이 7%에 달해 밸류에이션 매력도가 크게 상승했다고 평가했다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스웨이", "published": "2026-09-28", "url": "https://www.newsway.co.kr/news/view?ud=2026092808490126223"}, {"id": "f6bca0ace58f", "title": "하나펀드서비스, 공무원연금기금 일반사무관리사 수성", "summary": "하나펀드서비스가 공무원연금공단이 주관한 공무원연금기금 일반사무관리회사 경쟁입찰에서 지난 14일 우선협상대상자로 최종 선정됐다고 28일 밝혔다. 이번 입찰에는 국내 4대 금융지주 계열 사무관리 기업들이 모두 참여해 경쟁했다. 하나펀드서비스는 이번 연장 계약으로 2031년 9월까지 5년간 해당 기금의 펀드 순자산가치(NAV) 산출과 컴플라이언스 점검, 공시 및 보고 지원 등 일반사무관리 전 영역을 전담한다. 자체 개발한 사무관리시스템(HINTs)의 성능과 위험 관리 체계가 입찰 심사에서 긍정적으로 작용했다고 회사는 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스락", "published": "2026-09-28", "url": "http://www.newslock.co.kr/news/articleView.html?idxno=136974"}, {"id": "d9febe78667b", "title": "신한은행, 유언대용신탁 잔고 1.5조 돌파 이벤트...그 의미는?", "summary": "신한은행은 유언대용신탁 누적 잔고 1조5000억원 돌파를 기념해 9월 28일부터 11월 30일까지 디지털 스토리텔링 기업 스웬과 고객 감사 이벤트를 진행한다고 28일 밝혔다. 신한 SOL메이트 유언대용신탁 신규 고객 선착순 600명과 기존 일반계약 고객 전원에게 얼라이브 스토리 기록 이용권을 제공한다. 신한은행은 올해 누적 판매액도 1조원을 넘어 지난해 대비 3배 이상 증가했다고 설명했다. 은행권 관계자는 앞으로 금융권의 특화 경쟁이 노후생활 걱정을 덜어주는 퇴직연금과 고령 자산가 맞춤형 관리에 집중되고 있다고 말했다.", "category": "업계·경쟁사", "importance": 2, "source": "초이스경제", "published": "2026-09-28", "url": "http://www.choicenews.co.kr/news/articleView.html?idxno=171730"}, {"id": "617b5bb3b090", "title": "NH투자증권, 프리미엄 개인금고 서비스 실시", "summary": "NH투자증권이 지난 18일 볼트1932와 제휴해 퇴직연금 고객을 대상으로 개인금고 서비스를 제공한다고 밝혔다. 대상 고객은 금고를 2개월간 무료로 이용할 수 있고 대여료를 10% 할인받는다. NH투자증권은 이번 제휴로 퇴직연금 운용·자산관리를 넘어 고객이 직접 체감할 수 있는 제휴서비스 영역까지 넓히게 됐다고 설명했다.", "category": "업계·경쟁사", "importance": 1, "source": "비즈월드", "published": "2026-09-28", "url": "http://www.bizwnews.com/news/articleView.html?idxno=147186"}, {"id": "1209173ae6a2", "title": "미래 박현주 '금융의 새 판' VS 한투 김남구 '아시아 1등'…개척형·축적형 경영 스타일", "summary": "한국금융신문이 AI 툴을 활용해 박현주 미래에셋금융그룹 회장과 김남구 한국투자금융지주 회장의 경영 스타일을 비교했다. 박 회장은 '개척형'으로 분류돼 글로벌·금융의 새로운 판·디지털자산이 키워드로 꼽혔고, 2018년 미국 ETF 운용사 글로벌엑스를 인수한 데 이어 퇴직연금처럼 장기간 인프라 구축이 필요한 사업에도 일찌감치 투자했다고 기사는 설명했다. 미래에셋그룹의 고객자산은 2026년 6월 기준 1512조원을 넘어섰다. 김 회장은 '축적형'으로 자본효율성·아시아 1등·보험이 키워드로 제시됐고, 한국투자증권은 2025년 영업이익과 당기순이익 동시 '2조 클럽'을 업계 최초로 달성했으며 한국금융지주는 2026년 8월 KDB생명 인수 우선협상대상자로 선정됐다.", "category": "업계·경쟁사", "importance": 1, "source": "한국금융신문", "published": "2026-09-28", "url": "https://www.fntimes.com/html/view.php?ud=202609232115072996179ad43907_18"}, {"id": "b53f90e565c4", "title": "'AI로 펀드 자동 점검' 농협은행 'NH펀드케어' 출시", "summary": "NH농협은행이 인공지능이 고객 펀드를 자동 점검하고 관리 방법을 안내하는 펀드관리 서비스 'NH펀드케어'를 29일 출시한다고 28일 밝혔다. 소규모 펀드, 수익률 하회, 운용역 변경, 자동이체 실패, 장기 미거래, 평가손실 발생 등 6가지 항목을 점검한다. 영업점에서 신규 가입한 펀드와 연금저축·개인종합자산관리계좌(ISA)·개인형퇴직연금(IRP) 등 세제 혜택이 적용되는 펀드는 점검 대상에서 제외된다. 점검 결과는 NH올원뱅크에서 제공하며, 관리가 필요한 펀드가 있으면 카카오톡 알림으로도 안내한다.", "category": "업계·경쟁사", "importance": 1, "source": "연합뉴스", "published": "2026-09-28", "url": "https://www.yna.co.kr/view/AKR20260928059500002?input=1195m"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-09-21 ~ 2026-09-27", "generated_at": "2026-09-28T16:16:37+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 금형 퇴직연금 활성화 방안은 K-노동복지회의소 설립 방안, 일하는 사람 기본법 입법 등과 함께 12월에 몰린 최소 6개 과제에 포함돼 있다. 노동부 내부에서는 9월 과제부터 정부안 마련과 노사 조율이 늦어지면서 연말 대책도 차례로 밀릴 가능성을 배제하기 어렵다는 말이 나온다.", "category": "제도·규제", "importance": 4, "source": "헤럴드경제", "published": "2026-09-23", "url": "https://biz.heraldcorp.com/article/10882794", "related": []}, {"id": "853028981d69", "title": "“믿고 맡길 환경 안 되면 증시로 ‘머니무브’ 없어… 장기 투자할 수 있도록 대안 제대로 만들어야”", "summary": "홍춘욱 프리즘투자자문 대표는 21일 서울 여의도에서 열린 ‘2026 국민금융포럼’ 주제발표에서 투자자가 믿고 맡길 수 있는 환경이 조성되지 않으면 부동산에서 증시로의 머니무브는 없다고 말했다. 그는 국민연금이 증시 급등으로 국내주식 보유비중이 목표를 웃돌았는데도 올해 6월 말까지 리밸런싱을 유예하고 목표비중을 14.9%에서 20.8%로 높인 것을 ‘무너진 외양간’의 사례로 지목했다. 6월 말 기준 1866조원대 기금을 운용하는 국민연금에 정책적 자율권과 독립성을 보장해야 한다고 강조했다. 장기투자를 유도할 방안으로는 3년 이상 주식 보유자에 대한 배당소득세 분리과세와 인센티브를 제시했다.", "category": "운용·상품", "importance": 3, "source": "국민일보", "published": "2026-09-22", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000014162", "related": [{"title": "“자산 50%는 ‘코어자산’으로 두고 유동성 비중 20%는 지켜라”", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000014262"}]}, {"id": "0185991f029d", "title": "국민연금 1점에 움직이는 운용사들…'전주 거점' 경쟁 본격화", "summary": "국민연금 기금운용본부가 있는 전주로 자산운용사들이 잇따라 사무소를 열고 있다고 전했다. 국민연금이 올해 6월부터 위탁운용사를 선정할 때 전주에 거점을 둔 운용사에 1점의 가점을 주기로 한 것이 계기다. 상반기 기준 국민연금의 위탁운용 규모는 972조4000억원이며, 가점 반영 대상은 국내주식·국내채권에서 국내인프라와 사모투자 위탁운용사 선정까지 넓어졌다. KB·한화·신한·삼성·미래에셋 등 15개가 넘는 운용사가 전주 사무소를 냈지만 운용역과 리서치 핵심 인력은 여전히 서울에 몰려 있어 서울 본사 인력이 정기적으로 순환 근무하는 방식으로 운영되는 곳이 많다고 짚었다.", "category": "업계·경쟁사", "importance": 3, "source": "메트로신문", "published": "2026-09-27", "url": "http://www.metroseoul.co.kr/article/20260927500001", "related": []}, {"id": "3e62e20494f9", "title": "65세로 정년연장? 퇴직은 53세…'백발성성' 인턴은 한국서 가능할까", "summary": "정년을 65세로 올리는 논의가 진행되지만 실제 평균 퇴직 연령은 52.9세이고 근로자가 일하고 싶어하는 나이는 73.4세라고 전했다. 퇴직 사유는 사업 부진·조업 중단이 24.9%, 건강 악화가 22.1%, 가족 돌봄이 15.2%였고 정년퇴직은 13.2%에 그쳐, 정년 이전에 회사를 떠나는 경우가 대부분이라고 짚었다. 정년제를 적용받지 않는 근로자 148만명 가운데 62만8000명(42%)이 정년제 밖에 있으며, 고령자 계속고용장려금은 분기 90만원(비수도권 120만원)을 최대 3년간 지원하지만 지원 사업장은 2022년 3028곳에서 2025년 2271곳으로 25% 줄었다고 보도했다. 일본은 65세까지 고용확보 조치를 99.9%의 기업이 시행하고 있다며, 정년 숫자만 올려서는 실제 고용기간을 늘리기 어렵고 퇴직 후 재고용을 강화하는 방안이 필요하다고 지적했다.", "category": "가입자·사회", "importance": 3, "source": "머니투데이", "published": "2026-09-27", "url": "https://www.mt.co.kr/living/2026/09/27/2026092622024336056", "related": []}, {"id": "7dbbd9af01e2", "title": "[단독]국민연금, '갑질 논란' 부동산투자실 감사 곧 마무리…징계위 연다", "summary": "국민연금공단이 안 모 전 부동산투자실장에 대한 감사를 마무리하고 수일 내 징계위원회를 연다. 안 전 실장은 거액의 출자 권한을 이용해 외부 위탁운용사 인사에 개입하고 관계자에게 부당한 영향력을 행사했다는 의혹을 받고 있으며, 국민연금은 출입 금지 조치를 내렸다. 4조원대 자산인 서울 역삼 센터필드에서 위탁운용사 교체를 무리하게 시도했고, 2520억원을 투자한 서울 중구 더익스체인지서울에서는 채용 청탁 의혹이 제기됐다. 시민단체는 부동산투자실 문제를 구조적인 내부통제 실패로 보고 개선을 요구했다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01744966645584384&mediaCodeNo=257", "related": []}, {"id": "3cc6c51d988b", "title": "국민연금, '첫 보험료' 청년 소통 강화", "summary": "국민연금공단이 2026년 사업운영계획을 수정·보완해 중점 추진 과제를 기존 41개에서 45개로 확대했다. 신설한 과제는 청년 세대와 양방향 소통 활성화, 전북 금융생태계 조성 지원, 인공지능·데이터 활용 촉진을 위한 조직·인력 역량 강화다. 내년 1월 시행하는 청년 생애 첫 연금보험료 지원 제도는 18세(2009년 출생부터)가 되는 청년부터 순차 적용하며, 생애 첫 1개월분 연금보험료 약 4만2000원을 국가가 지원하거나 가입 기간을 추가로 산입해준다. 공단은 노령연금 자동지급 서비스와 찾아가는 연금배달서비스도 신규 사업에 반영하고 기금운용 내부통제 실효성을 강화한다.", "category": "가입자·사회", "importance": 3, "source": "브릿지경제", "published": "2026-09-27", "url": "https://www.viva100.com/article/20260927500327", "related": []}, {"id": "e1a04d48a784", "title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "summary": "윤영석 국회 연금개혁특별위원회 위원장이 28일 오후 2시 국회 의원회관 제1소회의실에서 '지속가능하고 공정한 연금제도를 위한 구조개혁' 정책토론회를 연다. 오기형·안상훈 연금개혁특위 여야 간사가 공동 주최하며, 2025년 국민연금 모수조정 이후 남아 있는 구조개혁 과제를 논의한다. 국민연금뿐 아니라 기초연금·퇴직연금·개인연금을 포괄하는 다층 노후소득보장체계와 국민연금 재정안정화, 국가재정의 역할을 정부 관계부처와 전문가가 함께 다룬다. 좌장은 구인회 서울대 교수가 맡고 양재진 연세대 교수와 김학주 동국대 교수가 주제발표에 나서며, 윤 위원장은 토론회에서 나온 의견을 연금개혁특위의 구조개혁 입법과 정책과제에 반영하겠다고 밝혔다.", "category": "제도·규제", "importance": 3, "source": "경남도민신문", "published": "2026-09-27", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747", "related": []}, {"id": "f2491164d33c", "title": "일해서 돈 벌고 있으면 기초연금 못 받나요? 헷갈리는 연금제도 세대별 Q&A", "summary": "내년부터 65살 이상 노인 하위 70%가 받는 기초연금이 소득에 따라 차등 지급돼, 소득 하위 0~30%는 올해보다 3만원 늘어난 38만원을 받고 하위 30~45%는 35만9천원, 하위 45~70%는 현행과 같은 35만원을 받는다. 부부 감액 비율은 소득 하위 45% 이하 부부에 한해 20%에서 10%로 낮아져 하위 30% 부부는 올해 약 56만원에서 내년 68만4천원으로 최대 12만4천원이 늘어난다. 기초연금은 근로소득 유무가 아니라 소득인정액 기준으로 판단하며, 올해는 단독가구 월 247만원·부부가구 월 395만2천원 이하면 받을 수 있다. 국민연금 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%가 된다.", "category": "가입자·사회", "importance": 3, "source": "한겨레", "published": "2026-09-26", "url": "https://www.hani.co.kr/arti/society/rights/1279489.html", "related": []}, {"id": "d02c349ce769", "title": "'기초연금의 역설'… 연금 올려도 형편 나은 노인만 소비 늘렸다", "summary": "손혜림 서울시립대 교수와 조민수 플로리다주립대 박사과정이 한국개발연구원(KDI)에 게재한 연구에서, 2014년 기초연금을 최대 월 9만9100원에서 20만원으로 올린 뒤 형편이 나은 노인만 소비를 유의하게 늘린 것으로 나타났다. 이들은 전일제로 일할 가능성이 6.8%포인트 낮아지고 주당 근로시간도 약 4.1시간 줄었으나, 중위소득 60% 미만 저소득층에서는 소비 증가나 전일제 근로 감소가 확인되지 않았다. 2023년 기준 66세 이상 은퇴연령층의 상대적 빈곤율은 39.8%였고, 65세 이상 고령자의 연금 수급률은 90.9%였지만 월평균 수급액은 69만5000원에 그쳤다. 올해 5월 기준 고령층 취업자는 1012만5000명으로 처음 1000만명을 넘었고, 계속 일하려는 이유로는 '생활비에 보탬'이 53.4%로 가장 많았다.", "category": "가입자·사회", "importance": 3, "source": "뉴시스", "published": "2026-09-26", "url": "https://www.newsis.com/view/NISX20260923_0003802319", "related": []}, {"id": "80c9e54f2f45", "title": "자동항법의 진화: “생애주기 운용이라는 발명”[김병철의 퇴직연금 개혁 시나리오]", "summary": "1990년대 미국에서 401(k)가 확산되자 가입자가 초기 설정 이후 수십 년간 포트폴리오를 바꾸지 않는 문제가 드러났고, 이를 보완하려 1990년대 중반 은퇴가 가까워질수록 위험자산 비중을 줄이는 TDF가 등장했다고 설명한다. 호주식 기금형과 미국식 상품형 TDF는 방식이 다르지만 장기 은퇴소득을 높이면서 은퇴 임박 시점의 손실 위험을 줄이는 목표를 공유한다고 짚는다. 한국의 문제는 TDF가 없는 것이 아니라 가입자가 계좌 전체를 맡기지 않고 일부만 나눠 담는 습관이라고 지적한다. 이렇게 쪼개어 투자하면 TDF가 설계한 글라이드 패스 공식이 무너진다고 본다.", "category": "운용·상품", "importance": 3, "source": "이데일리", "published": "2026-09-26", "url": "https://www.edaily.co.kr/News/Read?newsId=01781046645584056&mediaCodeNo=257", "related": []}, {"id": "53dd24a728e6", "title": "[만나보니] [신한자산운용] 천기훈 ETF컨설팅팀장 \"연금 ETF, '왜'보다 '어떻게'가 중요\"", "summary": "천기훈 신한자산운용 ETF컨설팅팀장은 연금계좌가 ETF 시장의 중요한 투자 창구 중 하나가 됐고, 투자자의 질문이 '왜 연금계좌에서 ETF에 투자해야 하나'에서 '나에게 어떤 ETF가 맞느냐'로 옮겨갔다고 밝혔다. 2019년 연금계좌에서 ETF에 투자하는 금액은 5000억원 수준이었으나 현재는 연금저축과 퇴직연금을 합쳐 100조원 시대가 됐다고 말했다. 자산형성기인 2030세대는 배당형보다 S&P500 같은 자본수익 추구형 ETF로 연금자산 규모를 키우고, 은퇴 시점이 가까워지면 배당이나 커버드콜을 활용해 현금흐름을 확보하는 전략으로 전환할 수 있다고 조언했다. 신한자산운용은 ISA·연금저축·퇴직연금에서 SOL ETF만으로 포트폴리오를 구성할 수 있는 라인업을 갖췄다고 설명하며, 지난 18일 'SOL 글로벌DRAM반도체플러스 ETF'가 효력발생됐다고 밝혔다.", "category": "업계·경쟁사", "importance": 3, "source": "딜사이트경제TV", "published": "2026-09-26", "url": "https://news.dealsitetv.com/articles/176295", "related": []}, {"id": "db33f8626c83", "title": "“회사에 맡겼다가 후회합니다”…내 퇴직연금 직접 굴리면 [이병희의 연금술사]", "summary": "2026년 6월 말 기준 전체 퇴직연금 적립금은 553조9000억원이며 이 가운데 64%가 원리금 보장 상품에 머물러 있다. 원리금 보장상품의 10년 평균 수익률은 연 2.64%에 그친다. 기사는 임금 상승이 정체된 직장인이나 이직이 잦은 근로자에게는 확정기여형(DC)으로 적립금을 직접 운용하는 선택지가 있다고 설명한다. DC형에서는 위험자산에 최대 70%까지 투자할 수 있고 최소 30%는 안전자산으로 채워야 한다.", "category": "운용·상품", "importance": 3, "source": "이코노미스트", "published": "2026-09-25", "url": "https://economist.co.kr/article/view/ecn202609230024", "related": []}, {"id": "fee8001d52ad", "title": "[뱅커스토리] 조윤환 NH농협은행 부장 \"퇴직연금, 수익률 다음은 '연금'\"", "summary": "조윤환 NH농협은행 연금사업부장은 뉴스핌 인터뷰에서 은행·증권·보험 등 47개 퇴직연금 사업자가 경쟁하는 가운데 시장의 승부처가 단기 수익률을 넘어 안정적인 연금 수령으로 옮겨갈 것이라고 말했다. 올해 1분기 연금포털공시 기준 농협은행의 원리금비보장상품 운용 수익률은 DB 16.32%, DC 24.92%, IRP 24.82%였다. 원리금비보장상품 전체 가중평균 수익률은 지난해 2분기부터 올해 1분기까지 4분기 연속 주요 은행 1위를 유지했다. 농협은행은 영업점 직원 300여 명을 대상으로 자산관리 역량 교육을 진행하고 개인형 IRP 수익률 경진대회도 운영하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스핌", "published": "2026-09-25", "url": "https://www.newspim.com/news/view/20260923000536", "related": []}, {"id": "d16260c780e2", "title": "[전문가 칼럼] 2026년 하반기 달라지는 노동관계법령 점검", "summary": "2026년 하반기 시행되는 노동관계법령 개정 사항으로 퇴직급여 체불 처벌이 9월 18일부터 5년 이하 징역 또는 5천만원 이하 벌금으로 상향됐다. 도산 사업장 체불근로자에게 지급하는 대지급금 범위는 8월 20일부터 최종 3개월분에서 최종 6개월분으로 확대됐다. 임금 체불 처벌도 10월 8일부터 5년 이하 징역 또는 5천만원 이하 벌금으로 강화된다. 이 밖에 단기 육아휴직 신설, 배우자 출산전후휴가 확대, 배우자 유산·사산휴가 5일 신설, 4시간 근무 시 휴게시간 면제 신청 제도(12월 10일 ublished": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": "2026-09-20", "url": "http://www.smarttimes.co.kr/news/articleView.html?idxno=49113", "related": [{"title": "잦은 이직에 끊기는 퇴직자산…사회복지인 전용 퇴직연금 논의 본격화", "source": "라이브뉴스", "url": "https://www.livesnews.com/news/article.html?no=64332"}]}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발생했으나 회수된 금액은 없다.", "category": "법인·자금운용", "importance": 3, "source": "시장경제신문", "published": "2026-09-16", "url": "https://www.meconomynews.com/news/articleView.html?idxno=201626", "related": [{"title": "홈플러스, 9개월간 임금체불 3871억…퇴직금도 미지급", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1690418/"}]}, {"id": "f22427d51808", "title": "NH농협은행, 2026년 제2차 투자상품 완전판매 대토론회 개최", "summary": "NH농협은행은 17일 서울 중구 본사에서 2026년 제2차 투자상품 완전판매 대토론회를 열었다. 투자상품 미스터리쇼핑 만점자와 영업본부 완전판매 TOP리더 등 약 40명이 참석해 펀드·방카슈랑스·신탁·퇴직연금 부문의 상담 준비, 상품 설명, 적합성·적정성 원칙 준수 사례를 공유했다. NH농협은행은 토론회 내용을 영상으로 제작해 영업점 교육자료로 활용할 계획이다. 박현동 투자상품부문 부행장은 완전판매가 절차 준수에 그치지 않고 고객 입장에서 충분히 설명하고 신뢰를 쌓는 과정이라고 강조했다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스퀘스트", "published": "2026-09-17", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=301184", "related": [{"title": "농협은행, 투자상품 완전판매 대토론회 개최…미스터리쇼핑 만점자 우수사례 공유", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146703"}]}, {"id": "ab894d0c4867", "title": "[금융 HOT 뉴스] KB자산운용, 골드 특별자산 펀드 눈길", "summary": "KB자산운용이 골드 특별자산 펀드의 운용 구조를 파생상품 중심에서 국내외 금 ETF 활용 방식으로 바꿨다. 파생상품 위험평가액을 40% 이하로 낮춰 퇴직연금 적격 요건을 충족했고 운용보수는 기존 대비 약 40% 인하했다. 비교지수는 LBMA Gold PM Price로 변경했고 환매대금은 4영업일 내에 지급한다. 현재 국민은행과 신한투자증권의 퇴직연금 계좌에서 매매할 수 있다.", "category": "운용·상품", "importance": 2, "source": "비즈월드", "published": "2026-09-16", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146330", "related": [{"title": "KB자산운용, 18년 된 금 펀드 손질…퇴직연금서도 투자", "source": "AP신문", "url": "https://www.apnews.kr/news/articleView.html?idxno=3051270"}]}, {"id": "26bad6a1c84a", "title": "이형일 \"500조 규모 퇴직연금, 수익률 저조…법안 준비 중\"", "summary": "이형일 부총리 겸 재정경제부 장관 후보자가 9월 15일 국회 재정경제기획위원회 인사청문회에서 퇴직연금 제도 개선과 .2배에 달해 2024년 제도 시행 이후 반기 기준 최대를 기록했다. 업권별로는 증권사가 4조1513억원 순유입, 은행이 3조9714억원 순유출, 보험이 1799억원 순유출이었고, 증권사 적립금은 2분기 말 165조468억원으로 1분기 대비 16.5% 늘어 은행권 증가율 6.6%를 크게 앞섰다. 실물이전 규모는 가입자가 직접 상품을 고르는 IRP에서 6조8000억원으로 가장 컸다. 9월부터 개인투자용 국채가 DC·IRP 계좌에 편입되면서 증권사는 안정형 상품까지 더해 고객 확보에 나서고, 은행권은 ETF 거래 편의성 개선으로 맞서고 있다.", "category": "운용·상품", "importance": 5, "source": "더트래커", "published": "2026-09-10", "url": "https://thetracker.co.kr/View.aspx?No=4221950", "related": []}]}, "yearly": {"period": "yearly", "key": "current", "label": "2025-09-28 ~ 2026-09-27", "generated_at": "2026-09-28T16:16:41+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": [{"title": "퇴직연금 문 열린 개인용 국채…첫 선택은 10년물에 쏠렸다", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436449"}, {"title": "개인 퇴직연금 계좌 통해 장기국채 투자 길 열렸다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712685/2"}, {"title": "개인 국채투자, '퇴직연금서 투자'에 흥행…9월 청약서 초과 수요", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260917099600008"}, {"title": "\"1억 넣어두면 20년 뒤 2.6억\"…연금개미들 외면한 이유", "source": "한국경제", "url": "https://www.hankyung.com/article/202609168563i"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 확정 수익 60%\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/14/2026091490036.html"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 60% 확정 수익\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/13/2026091390109.html"}, {"title": "“20년 묻어두면 .co.kr/news/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}, {"title": "[금상소] IRP·DC에 들어온 개인투자용 국채…10년·20년물 뭐가 나을까", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2624549"}]}, {"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "8bb193e0ea59", "title": "“정부 기초연금개편안, 겉으로는 하후상박 실제는 재정 절감안”", "summary": "정부가 노인 하위 70%를 세 집단으로 나눠 차등 지급하는 하후상박 방식을 내놨다. 하위 30%에 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원(동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": [{"title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "source": "슬로우뉴스", "url": "https://slownews.kr/166386"}, {"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "1fc91cd9d139", "title": "리스크 관리·노후수입 한번에…주목받는 보증형 실적 배당보험", "summary": "미래에셋생명의 개인형 퇴직연금(IRP) 보증형 실적배당보험이 출시 후 717억원을 모집했다고 전했다. 이 상품은 IRP를 통해서만 가입할 수 있는 거치형으로, 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 연금 개시가 가능하다. 이미 만 55세를 넘긴 가입자는 가입과 동시에 연금을 받을 수 있고, 적립금이 소진될 때까지 20년 이상 연금을 수령할 수 있다. 적립금은 미래에셋생명의 일임형 자산배분펀드 MVP펀드를 통해 글로벌 자산에 분산투자된다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645584384&mediaCodeNo=257", "related": [{"title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024"}, {"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}, {"id": "354ed5723a15", "title": "삼성자산운용·미래에셋증권, 푸른씨앗 OCIO 수성", "summary": "국내 최초 기금형 퇴직연금인 푸른씨앗(중소기업퇴직연금기금) 자금을 굴릴 OCIO 전담운용기관에 삼성자산운용과 미래에셋증권이 재선정됐다. 삼성자산운용이 종합평점 92.915점, 미래에셋증권이 90.761점으로 우선협상대상자에 올랐다. 2022년 9월 첫 사업자 선정 이후 4년 만의 재선정이다. 2기 운용 기간은 2026년 9월 1일부터 2030년 8월 31일까지다.", "category": "법인·자금운용", "importance": 4, "source": "한국금융신문", "published": "2026-06-09", "url": "https://www.fntimes.com/html/view.php?ud=202606091842068772179ad43907_18", "related": []}, {"id": "5895ec3e71a7", "title": "20년 만에 퇴직연금 제도 대대적 개편…모든 사업장 의무화 추진", "summary": "정부가 2월 노사정 공동선언을 바탕으로 퇴직연금 제도를 대폭 개편한다. 7월까지 구체적 방안을 확정한 뒤 연내 관련 법 개정을 추진하고, 모든 사업장에 퇴직연금을 단계적으로 의무화할 방침이다. 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화가 핵심 축이다. 1년 미만 근로자 등 사각지대 해소도 함께 추진된다.", "category": "제도·규제", "importance": 4, "source": "대한민국 정책브리핑", "published": "2026-03-11", "url": "https://www.korea.kr/news/policyNewsView.do?newsId=148960665", "related": []}, {"id": "6e2fe502ecb5", "title": "미래에셋증권, 퇴직연금 로보Wrap 출시…AI가 자산배분·매매 맡는다", "summary": "미래에셋증권이 IRP 계좌용 로보어드바이저 일임 서비스 퇴직연금 로보Wrap을 출시했다. 알고리즘이 글로벌 자산배분 포트폴리오를 구성하고 시장 상황에 맞춰 리밸런싱과 매매까지 수행한다. 7월 말 기준 누적 가입 계좌는 14만좌, 누적 가입금액은 8조3000억원이다.", "category": "운용·상품", "importance": 3, "source": "뉴스핌", "published": "2026-08-05", "url": "https://www.newspim.com/news/view/20260805001063", "related": []}, {"id": "676b0ae84927", "title": "신한 적립액 54조 독주…국민·하나, IRP 중심 2위 경쟁", "summary": "2026년 1분기 퇴직연금 랭킹에서 신한이 적립액 54조원으로 선두를 지켰다. 국민은행과 하나은행이 IRP를 중심으로 2위 자리를 놓고 다투고 있다. 은행권 IRP 적립금은 83조7000억원으로 전체 시장의 31.7%를 차지했다.", "category": "업계·경쟁사", "importance": 3, "source": "한국금융신문", "published": "2026-04-21", "url": "https://www.fntimes.com/html/view.php?ud=2026042117435794185e6e69892f_18", "related": []}, {"id": "ecca1d1f70f8", "title": "기금형 퇴직연금은 결과 아닌 과정 책임으로…사외적립의무는 속도조절 요구", "summary": "노사정과 전문가가 참여한 정책 토론회에서 기금형 퇴직연금 도입 방향이 논의됐다. 전문가들은 운용 주체의 책임을 결과가 아닌 과정, 즉 의사결정 절차의 적정성으로 전환해야 한다고 주장했다. 경영계는 중소기업 부담을 이유로 사외적립 의무화의 단계적 시행을 요구했다. 한국노총과 한국경영자총협회, 고용노동부, 한국투자증권 관계자가 참석했다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-04-08", "url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=04598566645414152", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
