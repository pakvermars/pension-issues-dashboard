<html lang="ko">
<head>

<title>퇴직연금 주요 이슈</title>
<style>
  /* ── 팔레트 ───────────────────────────────────────────────
     잉크 네이비 위에 차가운 석재 종이. 강조색은 적립·성장을 뜻하는
     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나.

     키움 두 색은 kiwoomam.com 로고의 구조를 그대로 옮긴 것이다.
     글자는 감청, 포인트 마크만 마젠타. 그래서 맨 위 줄은 감청이고
     마젠타는 슬로건 한 줄에만 쓴다. 둘을 같은 넓이로 쓰면 서로 죽는다. */
  :root {
    --ink: #101C33;
    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom-deep: #1A399E;
    --kiwoom-point: #EC008C;

    --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',
               'Malgun Gothic', system-ui, sans-serif;
    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #DCE2EC;
      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 감청 원색은 어두운 종이에서 1.9:1까지 떨어져 줄이 보이지 않는다.
         마젠타도 한 단계 올려 짝을 맞춘다. 각각 6.2:1, 6.6:1. */
      --kiwoom-deep: #6E92F5;
      --kiwoom-point: #FF5FB4;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야
     구분선이 아니라 종이의 테두리로 읽힌다. */
  .topline { height: 4px; background: var(--kiwoom-deep); }

  /* 수집이 멈춰도 index.html은 그대로 남아 아무 일 없어 보인다. 그래서
     보는 사람의 시계와 비교해 묵은 정도를 화면에서 직접 말한다.
     2026-10-15에 엿새를 멈췄는데 아무도 몰랐던 것이 이 띠를 만든 이유다. */
  .stale {
    padding: 10px 20px;
    background: var(--hot);
    color: var(--paper);
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
  }

  .stale[hidden] { display: none; }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;
  }

  .slogan {
    margin: 0 0 0 auto;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom-point);
    white-space: nowrap;
  }

  .hero-date {
    font-family: var(--font-num);
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .search input {
    width: 230px;
    max-width: 44vw;
    padding: 4px 0;
    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */
  .group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;
  }

  .rail button {
    flex: 1 1 0;
    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .range {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  /* ── 분야 필터 ─────────────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
  }

  .filters button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */
  .notice {
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */
  .list { margin: 8px 0 0; }

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);
  }

  article[data-cat="2"] .badge { color: var(--cat-2); }
  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

  details summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="topline"></div>
<div class="stale" id="stale" hidden></div>

  <div class="masthead">

    </div>

  <div class="filters" id="filters" aria-label="분야 선택"></div>

  <main class="list" id="list"></main>

  <p class="footer" id="footer"></p>

주가 전략을 조율하고 농협은행 연금사업부, NH투자증권 OCIO·연금자산관리 조직, NH-Amundi자산운용 연금 부문이 실무를 맡는다. 외부 컨설팅을 통해 수탁법인 설립에 필요한 지배구조와 자산운용 방식, 내부 운영체계를 구체화할 예정이다. 기존 계약형 사업에서는 디폴트옵션과 운용상품 경쟁력을 강화하고 수익률 관리체계를 정비한다.", "category": "법인·자금운용", "importance": 3, "source": "헤럴드경제", "published": "2026-11-16", "url": "https://biz.heraldcorp.com/article/10938068"}, {"id": "4baafd9a3a6d", "title": "'수익률·성장률 1위' 한국투자증권으로 몰리는 연금 개미들", "summary": "금융감독원 통합연금포털 공시에 따르면 올해 3분기 말 한국투자증권 DC형과 IRP 합산 적립금은 18조5160억원으로 지난해 말 대비 44.8% 늘어 전체 사업자 중 가장 높은 성장률을 기록했다. IRP 적립금은 1년 새 6조4891억원에서 10조4773억원으로 61.5% 증가했다. DB형 원리금비보장 적립금은 1조3862억원으로 증권업계 1위, 비계열사 DB 적립금은 7조3513억원으로 증권사 중 1위였다. DC·IRP 원리금비보장 적립금은 1년 새 6조8556억원에서 13조4025억원으로 95.5% 늘었다.", "category": "업계·경쟁사", "importance": 3, "source": "이투데이", "published": "2026-11-16", "url": "https://www.etoday.co.kr/news/view/2647976"}, {"id": "4383f5066c4f", "title": "\"고객 자산, 키움에 머무르도록 만들 겁니다\" [WM 리더] 김정범 키움증권 자산관리부문장", "summary": "김정범 키움증권 자산관리부문장은 금융 상품 전 분야에서 톱5 이상의 실적을 거둔다는 목표를 제시했다. 그가 자산관리 영역을 맡은 이후 키움증권의 금융 상품 잔고는 3조 원에서 13조 원으로 늘었다. 김 부문장은 ISA·연금저축·IRP 등 세제 혜택 계좌 수요가 빠르게 늘고 있다고 진단했다. 자산관리 앱을 새로 만드는 '자산관리 퀀텀점프', 'AI PB', VIP 전담 프로세스 등 3대 프로젝트를 추진한다고 밝혔다.", "category": "업계·경쟁사", "importance": 3, "source": "한경머니", "published": "2026-11-16", "url": "https://magazine.hankyung.com/money/article/202610189154c"}, {"id": "f0dde8a51247", "title": "최종진 한투證 본부장 \"가입자 이익 최우선이 연금 시장 승자...AI로 99% 복제율 구현, 계열사 우대는 제로\"", "summary": "최종진 한국투자증권 연금혁신본부장은 퇴직연금 시장의 최종 승자는 '가입자 이익 최우선' 원칙을 지키는 사업자라고 말했다. 한국투자증권은 자체 구축한 'AI 복제율 엔진'으로 자산배분 모델포트폴리오(MP)를 실제 펀드·ETF 조합으로 구현하며, 복제율 99%가 나오는 조합을 쓰고 계열사 상품을 인위적으로 끼워 넣지 않는다고 설명했다. 구축 중인 'AI 자산배분' 엔진은 수익률보다 리스크 관리에 초점을 뒀다고 밝혔다. 최 본부장은 퇴직연금 운용 주체가 기업에서 개인으로 옮겨가는 머니무브를 증권업계의 성장 기회로 진단했다.", "category": "업계·경쟁사", "importance": 3, "source": "이투데이", "published": "2026-11-16", "url": "https://www.etoday.co.kr/news/view/2648156"}, {"id": "92e9e1007a0e", "title": "[500조 연금 새 판]①KB금융 '기금형' 솔루션…수탁법인 차별화는", "summary": "KB금융그룹이 정부가 추진하는 기금형 퇴직연금에 대응해 워킹그룹을 구성하고 은행·증권·자산운용 계열사 역량을 결합하는 방안을 검토하고 있다. 3분기 말 국민은행의 DC·IRP 적립금 합계는 39조7250억원으로 신한은행(39조5390억원)을 앞선다. KB증권은 주택도시기금 전담운용기관 우선협상대상자로, KB자산운용은 국민건강보험공단 대체투자 OCIO를 맡고 있으며 국민은행은 2020년부터 임직원 DB에 OCIO 거버넌스를 도입했다. 정부안에서 금융기관 개방형 수탁법인은 최소자본금 120억원을 갖춰야 하고 적립금의 0.25% 수준을 운영위험준비금으로 적립하는 방안도 추진된다.", "category": "법인·자금운용", "importance": 3, "source": "블로터", "published": "2026-11-16", "url": "https://www.bloter.net/news/articleView.html?idxno=678683"}, {"id": "daeb8986f068", "title": "퇴직연금 적립금 558조 넘겨…DC 전환 1년만 118% 증가", "summary": "금감원에 따르면 퇴직연금 적립금은 2023년 말 382조4천억원에서 지난해 말 501조4천억원으로 늘었고 올해 6월 말 558조원을 넘어섰다. DB형에서 DC형으로 전환한 가입자는 올해 1~7월 34만156명으로 전년 같은 기간 15만5947명보다 118.1% 급증했다. 6월 말 기준 가입자의 64.5%는 적립금 전부를 원리금 보장형에 두고 33.9%는 절반 이상을 위험자산에 투자해 투자 방식이 양극화돼 있다. 금감원은 업권 협회들과 함께 지난 3일 퇴직연금 가이드북을 발간했으며 공개 1주일 만에 8만9천건이 배포됐다.", "category": "운용·상품", "importance": 3, "source": "SBS Biz", "published": "2026-11-16", "url": "https://biz.sbs.co.kr/article_hub/20000346629"}, {"id": "a31df79be734", "title": "\"퇴직연금 '안정-수익' 두 토끼 잡으려면… TDF-ETF 혼합전략 필요\"", "summary": "최종진 한국투자증권 연금혁신본부장은 은퇴 이후 매달 필요한 생활비부터 추산해 퇴직연금 전략을 짜야 한다고 말했다. 그는 연금 계좌에 적립금을 쌓아 절세 혜택을 받는 것이 은퇴 준비의 출발이며 디폴트옵션과 TDF를 핵심 개념으로 소개했다. 고용노동부에 따르면 9월 말 기준 한국투자증권 '디폴트옵션 적극투자형BF1'의 최근 3년 누적 수익률은 100.97%로 전체 적극투자형 평균 57.58%를 웃돌았다. 한국투자증권의 DC·IRP 적립금은 18조5160억 원으로 지난해 말보다 44.8% 늘었다.", "category": "운용·상품", "importance": 2, "source": "동아일보", "published": "2026-11-16", "url": "https://www.donga.com/news/Economy/article/all/20261115/135027652/2"}, {"id": "b1cf7ba0955b", "title": "[청년-인터뷰] '얼마를 만들기보단 어떻게 쓸지가 중요'…김동익 100세시대연구소장의 노후 해법", "summary": "김동익 NH투자증권 100세시대연구소장은 노후 준비의 중심이 얼마를 모을지에서 모은 자산으로 얼마나 오래 안정적인 소득을 만들지로 이동하고 있다고 말했다. 그는 국민연금으로 기본생활비를 마련하고 퇴직연금과 개인연금으로 부족분을 보완하는 구조를 제시했다. 기금형 퇴직연금에는 수탁자 책임과 수수료 공시를, 디폴트옵션에는 수익률·위험 수준의 정기 안내를 강조했다. 퇴직 후 국민연금 수령까지 4년이 남고 매달 150만원이 부족하면 7200만원이 필요하다는 계산도 제시했다.", "category": "가입자·사회", "importance": 2, "source": "청년일보", "published": "2026-11-16", "url": "https://www.youthdaily.co.kr/news/article.html?no=229823"}, {"id": "255a5627db96", "title": "\"장수는 리스크 아닌 기회\"…보험사 시니어 시장 패권 겨냥", "summary": "보험연구원 김상동 연구위원은 장수리스크의 본질이 동일 계층 내 개인 간 사망시점 표준편차가 9~10년에 달하는 데 있다고 분석했다. 국민연금 수급액 중위값은 49.7만 원으로 최소 노후생활비 139.2만 원의 36% 수준이며, 퇴직연금은 건수 기준 83.5%가 일시금으로 수령되고 있다. 한국의 순소득대체율은 39%로 OECD 평균 63%를 크게 밑돈다. 한국의 경상의료비는 2000년 GDP 대비 3.7%에서 2024년 8.7%로 높아졌다.", "category": "가입자·사회", "importance": 2, "source": "EBN", "published": "2026-11-16", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1731759"}, {"id": "bb525890fb35", "title": "보험료보다 지급액 많은 생보사…투자 재원 찾아 연금·일시납 확대", "summary": "국내 22개 생보사의 올해 상반기 지급보험금은 66조4956억원으로 수입보험료 65조2045억원보다 1조2910억원 많았다. 해지·만기 환급금이 41조4973억원에서 55조4062억원으로 33.5% 늘어 지급보험금 증가분의 97%를 차지했다. 교보생명은 퇴직연금과 변액보험 해약환급금 증가를 원인으로 들었다. 생보사들은 운용 자금을 새로 확보하기 위해 연금보험과 일시납 상품 판매를 늘리고 있다.", "category": "업계·경쟁사", "importance": 2, "source": "라온신문", "published": "2026-11-16", "url": "https://www.raonnews.com/news/article.html?no=62787"}, {"id": "27c7a787688b", "title": "[사설] 국회 연금특위 빈손 종료할 듯, 개혁 의지 말뿐인가", "summary": "국회 연금개혁특별위원회가 다음 달 31일 활동 기한 종료를 앞두고 여야 합의 단일 개혁안을 내놓기 어려운 상태라고 사설은 전했다. 결과보고서는 제시된 개혁안과 쟁점을 병렬 기재하는 수준에 그칠 가능성이 높다. 연금특위는 수급 개시 연령 조정, 자동조정장치 도입, 기초연금 수급 기준 조정 등을 논의할 목적으로 지난해 3월 출범했다. 사설은 전국 단위 선거가 없는 내년이 연금 개혁의 골든 타임이라며 특위를 재구성해야 한다고 주장했다.", "category": "제도·규제", "importance": 2, "source": "이데일리", "published": "2026-11-16", "url": "https://www.edaily.co.kr/News/Read?newsId=01121766645646376&mediaCodeNo=257"}, {"id": "c33c67513c42", "title": "증권사 연말 이용자 유치전 '활발'…계좌·자산 이전 혜택 경쟁", "summary": "증권사들이 연말을 맞아 ISA와 연금계좌 등 절세형 상품을 중심으로 신규 계좌 개설과 타사 자산 이전에 혜택을 주는 이벤트를 잇따라 열고 있다. 한화투자증권은 12월31일까지 연금상담센터 소속 비대면 연금저축·IRP 계좌를 개설하고 상담을 마치면 5000원, 타사 연금자산을 100만원 이상 이전하면 1만원을 추가로 지급한다. 하나증권은 신규 계좌 개설 시 매수쿠폰 3만원과 주식 1주를, 삼성증권은 중개형 ISA 이전 순입금 규모에 따라 최대 40만원 상당의 상품권을 준다. 업계에서는 단기 유치보다 혜택 종료 후 자산 유지 여부가 중요하다고 보고 있다.", "category": "업계·경쟁사", "importance": 2, "source": "신아일보", "published": "2026-11-16", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5083670"}, {"id": "23a4fbb30ec7", "title": "연말 재테크 전략은…은행권 PB들 \"유동성 확보하고 자산 분산\"", "summary": "주요 시중은행 자산관리 전문가들은 연말 자산관리의 핵심으로 유동성 확보와 자산별 분산투자를 꼽았다. 예금은 3∼6개월 단기 위주로 만기를 나누고, 채권은 금리 정점을 염두에 두고 단계적으로 매수하라는 조언이 나왔다. 4050 자산 축적기에는 은퇴 시점에 맞춘 TDF로 위험자산 비중을 조절하고 연금저축·IRP의 세제 혜택을 활용하라고 권했다. 60대 이상 은퇴자에게는 생활비와 의료비에 대비해 2∼3년치 자금을 현금성 자산으로 확보하라고 제안했다.", "category": "가입자·사회", "importance": 2, "source": "연합뉴스", "published": "2026-11-16", "url": "https://www.yna.co.kr/view/AKR20261115036000002"}, {"id": "376e8159a4a9", "title": "한투운용, 미국 대표지수 채권혼합형 ETF 2종 올해 자금유입액 1조원 돌파", "summary": "한국투자신탁운용의 ACE 미국S&P500미국채혼합50액티브와 ACE 미국나스닥100미국채혼합50액티브 ETF 2종의 연초 이후 합산 자금유입액이 13일 기준 1조39억원으로 집계됐다. S&P500 상품에 5492억원, 나스닥100 상품에 4547억원이 유입됐으며 순자산액은 각각 1조2396억원, 9208억원으로 연초 대비 69.4%, 81.1% 늘었다. 두 상품은 미국 대표지수와 채권에 절반씩 투자하며 DC형 퇴직연금과 IRP 계좌에서 적립금의 최대 100%까지 투자할 수 있다. 회사는 연말 연금계좌 납입 수요와 증시 변동성 확대에 따른 자산배분 필요성에 주목하고 있다고 밝혔다.", "category": "운용·상품", "importance": 2, "source": "매일일보", "published": "2026-11-16", "url": "https://www.m-i.kr/news/articleView.html?idxno=2018779"}, {"id": "48455e6c2940", "title": "한화투자증권, 연금상담에 자산 이전 연계…연금 고객 확보 강화", "summary": "한화투자증권은 12월 31일까지 연금상담센터 오픈 이벤트를 진행한다. 비대면 연금저축 또는 IRP 계좌를 신규 개설하고 전화 상담을 마치면 네이버페이 5000원을, 타사 연금자산을 100만원 이상 이전하면 1만원을 추가로 지급한다. 한화투자증권은 지난 8월 비대면 연금 전문 상담 조직을 신설했다. 회사의 연금자산은 올해 1월 2조원을 돌파했다.", "category": "업계·경쟁사", "importance": 1, "source": "토요경제", "published": "2026-11-16", "url": "https://sateconomy.co.kr/news/view/1065572960302535"}, {"id": "3db70155d06d", "title": "[자산관리와 절세] 국민연금 개혁, 더 내는 만큼 더 받을 수 있을까?", "summary": "국민연금 보험료율은 2026년 9.5%, 2027년 10%로 오른 뒤 매년 0.5%포인트씩 인상돼 2033년 13%에 도달한다. 기준소득월액 400만원 직장인의 본인 부담은 올해 월 19만원에서 내년 20만원으로 늘어난다. 명목 소득대체율 43%는 가입기간 40년을 전제로 하며, 2024년 1~3월 신규 노령연금 수급자의 평균 가입기간은 237개월이었다. 2027년부터 군복무 크레딧과 둘째 자녀 출산 크레딧이 확대된다.", "category": "가입자·사회", "importance": 1, "source": "뷰어스", "published": "2026-11-16", "url": "https://theviewers.co.kr/View.aspx?No=4313730"}, {"id": "ba5f35b1978f", "title": "[thebell note] 나이를 지운 기금형 퇴직연금", "summary": "최근 발표된 기금형 퇴직연금 활성화 방안에는 수탁법인마다 운용 포트폴리오를 하나만 두는 단일 포트폴리오 원칙이 담겼다. 필자는 이 설계가 20대 신규 가입자와 은퇴 임박자를 같은 전략으로 운용하게 해 가입자별 위험 노출을 조정할 수 없다고 지적한다. 같은 생애주기·위험 수준끼리 비교하면 평가가 가능하고, 영국·호주처럼 공적 상담기관을 두면 가입자 선택을 도울 수 있다고 제시한다. 처음부터 생애주기를 담아야 제도가 자리 잡는다고 주장한다.", "category": "제도·규제", "importance": 1, "source": "더벨", "published": "2026-11-16", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202611102059260640105267"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-11-09 ~ 2026-11-15", "generated_at": "2026-11-16T12:01:37+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "9a6fe06cc427", "title": "[심층분석] 550조 퇴직연금 잡아라…영토전쟁 ‘후끈’", "summary": "고용노동부가 기금형 퇴직연금 수탁법인(기금운용법인) 인가를 소수로 제한하겠다는 방침을 밝히면서 은행·증권·보험 대형 금융사들이 3분기 말 기준 542조원대인 퇴직연금 시장을 겨냥한 인가 경쟁에 나서고 있다. 금융권은 금융기관 개방형·연합형·공공기관 개방형 세 유형을 합쳐 10곳 이내, 금융기관 개방형은 5~8곳 안팎에 그칠 것으로 보고 있어 대형 금융사도 탈락할 수 있다는 관측이 나온다. 금융기관 개방형은 최소자본금 120억원을 갖추고 예비인가와 본인가를 거쳐야 하며, 단독 인가가 어려운 중형사 가운데는 공동 출자를 구상하는 곳도 있다. 전체 적립금의 50.8%(275조4천860억원)를 차지하는 은행권도 인가에서 밀리면 기금형으로 옮겨가는 DC·IRP 자금을 지켜보는 처지가 될 수 있다는 우려가 나온다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-11-10", "url": "https://www.globalepic.co.kr/view.php?ud=2026111008473577727cc35ccc5c_29", "related": []}, {"id": "2fe6ca10b844", "title": "‘퇴직연금 수익률 우위’ 증권사, 시장 절반 장악한 은행에 도전장", "summary": "금융감독원에 따르면 9월 말 기준 금융권 전체 퇴직연금 적립금은 542조1000억 원으로 작년 12월 말(501조4000억 원) 대비 8.1% 늘었다. 은행권 적립금은 275조5000억 원으로 전체의 50.8%, 증권업계는 29.6%(160조3000억 원)를 차지했다. 지난해 증권사의 퇴직연금 연간 수익률은 9.79%로 은행(5.70%)보다 4.09%포인트 높았고, 증권사 비대면 IRP는 수수료가 대부분 면제된다. 은행들은 장기계약 수수료 할인율 확대(우리은행 최대 25%, 신한은행 최대 20%)와 KB국민은행의 당일 ETF 재매수 서비스 등으로 대응하고 있다.", "category": "업계·경쟁사", "importance": 4, "source": "동아일보", "published": "2026-11-09", "url": "https://www.donga.com/news/Economy/article/all/20261109/134988547/2", "related": []}, {"id": "b1c24b848e68", "title": "줄어든 거래대금에 증권가는 ‘MTS’ 전쟁…AI·배당·연금으로 고객 자산 잡는다", "summary": "증시 조정으로 거래가 위축되자 증권사들이 MTS에 AI 투자정보, 배당 정보, 퇴직연금 ETF 적립식 매수 기능 등을 더하고 있다. 하나증권은 이달부터 DC·IRP 계좌에서 ETF·ETN·리츠를 정기 매수하는 서비스를 개시하며, 3분기 기준 DC·IRP 시장점유율 1위를 달성했다. 3분기 국내 주식시장 일평균 거래대금은 52조4000억원으로 전 분기 대비 41.7% 감소해 증권사 위탁수수료 수익이 크게 줄었다.", "category": "업계·경쟁사", "importance": 3, "source": "조선비즈", "published": "2026-11-09", "url": "https://biz.chosun.com/stock/stock_general/2026/11/09/FUNYZOZV2JH4FLZ7BJYY4STMYI/", "related": [{"title": "줄어든 증시 거래대금에 증권가는 ‘MTS 전쟁’", "source": "조선일보", "url": "https://www.chosun.com/economy/stock-finance/2026/11/10/IKPQK3UVDJG2HEUOQJK5EO4OFM/"}]}, {"id": "ea0a4daeeaf0", "title": "소득 여유 있는 가구가 연금도 먼저 받는다…취약가구와 수급 격차", "summary": "한국보건사회연구원 보고서에 따르면 정년 이후 공적연금 수급 전까지의 소득공백기에 경제적 여력이 있는 가구일수록 연금 수급률이 높았다. 정년 전 중위소득 100% 이상을 유지하거나 늘린 가구의 공적연금 조기 수급률은 26.5%, 소득이 절반 미만으로 줄어든 취약가구는 18.1%였다. 월평균 공적연금 수급액은 소득 유지 가구가 191만8000원, 취약가구가 52만7000원으로 3.6배 이상 차이가 났다. 보고서는 필요한 금액만큼 연금을 나눠 받는 '부분연금제' 도입과 건강보험료·기초연금 등과의 연계 구조 정비를 제언했다.", "category": "가입자·사회", "importance": 3, "source": "메디컬투데이", "published": "2026-11-10", "url": "https://www.mdtoday.co.kr/news/articleView.html?idxno=623884", "related": [{"title": "“노후 소득공백 버티려 연금 당겼는데”…취약층보다 여유 있는 가구가 더 받았다", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10929855?ref=naver"}]}, {"id": "e7b81ee6967d", "title": "靑, 직장인 생활비 절감 ‘월급방위대 TF’ 가동", "summary": "청와대가 직장인 생활비 절감 정책을 추진할 ‘월급방위대’ 태스크포스(TF)를 가동한다. 임광현 대통령 비서실장은 9일 수석보좌관 회의에서 직장인의 실질적 가처분소득을 늘려야 한다며 ‘퇴직연금 기능 강화 방안’ 관련 법안의 조속한 통과를 강조했다. 정부는 지난달 29일 2028년 100인 이상 사업장부터 2030년까지 모든 사업장에 퇴직급여 사외적립을 단계적으로 의무화하고 기금형 퇴직연금을 민간 금융기관까지 확대하는 방안을 발표했다. 임 실장은 이 방안으로 퇴직금 체불을 예방하고 수익률도 상대적으로 높아질 수 있다고 말했다.", "category": "제도·규제", "importance": 3, "source": "세계일보", "published": "2026-11-10", "url": "https://www.segye.com/newsView/20261109518462", "related": []}, {"id": "3f6658cc6538", "title": "퇴직급여 사외적립 단계적 의무화 추진, 영세 사업장 지원 구체화", "summary": "고용노동부와 금융감독원은 11월 6일 근로복지공단과 주요 은행·보험·증권사가 참석한 퇴직연금사업자 간담회를 열어 지난달 29일 발표한 퇴직연금 기능강화 방안을 공유했다. 정부는 관련 법 개정안의 올해 국회 통과를 전제로 2028년 100인 이상, 2029년 10∼99인, 2030년 10인 미만 사업장으로 퇴직급여 사외적립 의무를 확대할 계획이다. 2027년도 예산안에는 자율 도입 사업장 적립금 매칭지원 60억원과 경영자금 융자비용 보전 62억원이 신규 편성됐고, DC·IRP에 적용되는 기금형 퇴직연금은 수탁법인 인가체계와 가입자 이익 우선 의무를 법률에 담는다. 사업자들은 영세 사업장 지원 민관 협력체계와 기금형 인가 준비기간을 건의했으며, 노동부는 11월 중 법 개정안 발의를 추진한다.", "category": "제도·규제", "importance": 3, "source": "데일리환경", "published": "2026-11-10", "url": "https://www.dailyt.co.kr/newsView/dlt202611100003", "related": []}, {"id": "68b0982c4949", "title": "연말정산 앞두고 연금 고객 잡아라..은행권, 절세·투자 마케팅 강화", "summary": "연말정산 시즌을 앞두고 주요 시중은행들이 IRP 세액공제 혜택을 앞세운 신규 가입·추가 납입 이벤트와 ETF·TDF 투자 유도, 맞춤형 연금 컨설팅으로 연금 고객 확보에 나서고 있다. 신한은행은 DC·IRP 가입자 대상 퇴직연금 ETF 투자 이벤트를 진행하고 ETF 라인업을 300개로 늘렸으며, 사업장을 방문하는 1대1 맞춤형 연금컨설팅을 CEO·임원 퇴직금 관리와 경영성과급 DC형 적립 자문까지 넓혔다. 하나은행은 은행권 최초로 하나 MP 구독서비스에 ETF 포트폴리오를 추가했고, 우리은행은 연말까지 DC·IRP 신규 가입과 추가 납입 고객에게 배달의민족 쿠폰을 주는 이벤트와 비대면 IRP 수수료 평생 면제를 운영한다. KB국민은행은 광고를 통한 브랜드 홍보에, NH농협은행은 고객 세미나와 기업 실무자 안내 책자 발간에 무게를 두고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "한국정경신문", "published": "2026-11-10", "url": "https://kpenews.com/View.aspx?No=4304847", "related": []}, {"id": "de799a1425f9", "title": "수익률 높인다는 기금형 퇴직연금…'계열사 금고' 되나", "summary": "정부의 퇴직연금 개편안은 회사가 직원 대표 동의를 받아 특정 기금을 기본 상품으로 정할 수 있게 했지만, 같은 그룹 금융사 기금으로 퇴직금이 몰리는 것을 점검할 장치는 없다. 금융감독원 통합연금포털에 따르면 9월 말 삼성생명이 관리하는 퇴직연금 57조5486억원 중 54.5%가 삼성 계열사 자금이었고, 현대차증권은 75.9%가 현대차그룹 계열사 자금이었다. 정부 방안의 안전장치는 계열사 투자 한도 등 자금이 기금에 들어온 뒤에만 작동하며, 계열 기금 선정 절차나 계열사 자금 비중 공개 규정은 없다. 이찬진 금감원장은 6일 간담회에서 기금 선정 절차를 투명하게 해 달라고 당부했고, 고용노동부는 이달 중 근퇴법 개정안을 국회에 낼 계획이다.", "category": "제도·규제", "importance": 3, "source": "동행미디어 시대", "published": "2026-11-09", "url": "https://www.sidae.com/article/2026110717112654333", "related": []}, {"id": "feebf7a7cafe", "title": "판 커지는 542조 퇴직연금 시장… 수익률 평균 5.4배差", "summary": "이르면 2028년 상반기부터 기금형 퇴직연금이 시행되며 542조 원 규모 퇴직연금의 수익률 경쟁이 본격화된다. 금융감독원에 따르면 지난해 말 퇴직연금 운용사 43곳의 실적배당형 수익률은 연 16.8%, 원리금 보장형은 연 3.1%로 격차가 5.4배였다. 2030년부터는 회사들이 퇴직금을 의무적으로 사외 금융기관에 적립하게 돼 금융사 간 수익 경쟁이 더 격화할 것으로 예상된다.", "category": "운용·상품", "importance": 3, "source": "동아일보", "published": "2026-11-09", "url": "https://www.donga.com/news/Economy/article/all/20261109/134988530/2", "related": []}, {"id": "68bd48d9b2f8", "title": "20년 모은 퇴직금 2억, 예적금 굴리면 2.7억-ETF 등 분산땐 4.3억", "summary": "금융감독원 추산에 따르면 2006년부터 20년간 연 1000만 원씩 IRP에 적립했을 때 국민연금 자산배분대로 운용하면 4억2948만 원, 전액 예·적금에 두면 2억7220만 원으로 1억5728만 원 차이가 났다. 지난해 퇴직연금 수익률 상위 10%는 적립금의 약 84%를 실적배당형에 투자해 연 19.5%를, 하위 10%는 원리금 보장형 비중이 약 74%로 연 0.5%를 기록했다. 지난해 퇴직연금 수익률은 연 6.5%로 제도 도입 이후 가장 높았으며, 기금 운용기관의 위험관리 역량 검증이 필요하다는 지적이 나왔다.", "category": "운용·상품", "importance": 3, "source": "동아일보", "published": "2026-11-09", "url": "https://www.donga.com/news/Economy/article/all/20261109/134988549/2", "related": []}, {"id": "b1995457e69d", "title": "[연중기획-새로운 리스크, 새로운 규제 ⑨-2] 퇴직연금 기금형 키우고 계약형 손질… 금융권 채비", "summary": "정부의 퇴직연금 기능강화 방안은 퇴직급여 사외적립을 2030년까지 단계적으로 의무화하고 기금형을 금융기관 개방형·연합형·공공기관 개방형으로 활성화하는 내용이다. 금융기관 개방형 수탁법인에는 최소 자본금 120억원과 충실·주의의무, 적립금 0.25% 수준의 운영위험준비금이 요구된다. 계약형은 70%인 IRP 위험자산 한도를 단계적으로 완화하고 DC·IRP에 IMA와 발행어음 투자를 허용하며, 성과가 낮은 디폴트옵션 상품은 정리한다. 한화금융 4개사는 기금형에 대비해 운용 전문성과 내부통제를 강화하는 공동 대응 전략을 마련했다.", "category": "제도·규제", "importance": 3, "source": "한국보험신문", "published": "2026-11-09", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=93689", "related": []}, {"id": "fddb70fbc9b9", "title": "중소병원, 인건비도 버거운데 '퇴직금까지' 부담 가중", "summary": "정부가 2030년까지 모든 사업장의 퇴직급여 사외적립을 의무화하기로 하면서 노동집약적인 병원들의 자금 부담이 클 것이라는 분석이 나왔다. 근퇴법 개정안이 올해 국회를 통과하면 2028년 100인 이상, 2029년 10~99인, 2030년 10인 미만 사업장 순으로 적용된다. 시행 이전 근속기간은 소급 적립하지 않고 시행 시점 이후 근로기간부터 의무가 적용된다. 그동안 퇴직금 제도를 유지해 온 의료기관은 매년 퇴직급여 상당액을 외부로 이전해야 해 운영자금 운용에 영향을 받게 된다.", "category": "법인·자금운용", "importance": 3, "source": "데일리메디", "published": "2026-11-09", "url": "https://www.dailymedi.com/news/news_view.php?wr_id=942345", "related": []}, {"id": "f7a55a54b41e", "title": "'안전하다'는 믿음의 배신, 채권형 ETF 절반은 위험자산", "summary": "한국거래소에 따르면 6월 30일부터 이달 6일까지 코스피가 40.3% 내리는 동안 국내 주식형 ETF 447개 중 180개가 이보다 더 떨어졌다. 채권혼합형 ETF는 지난해 말 24개에서 43개로 늘었고, 이 중 채권혼합50의 순자산 비중은 5.7%에서 62.3%로 뛰었다. 삼성전자·SK하이닉스를 합쳐 48.6~50.4% 담은 채권혼합 ETF 4종의 같은 기간 수익률은 평균 -28.3%였다. 하나금융연구소는 DC·IRP의 위험자산 70% 한도 규제를 채권혼합형 ETF 증가의 한 이유로 꼽았다.", "category": "운용·상품", "importance": 3, "source": "동행미디어 시대", "published": "2026-11-09", "url": "https://www.sidae.com/article/2026110812562858774", "related": []}, {"id": "3accff1b91f0", "title": "기초연금 ‘하후상박’의 역설…10년 뒤 빈곤율 역전 우려", "summary": "정부가 내년 4월부터 소득 하위 30% 노인에게 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원을 지급하는 기초연금 차등 개편을 추진하고 있다. 6일 토론회에서 주수정 중앙대 박사후연구원은 2035년 기준 개편안 적용 시 노인빈곤율이 38.89%로 현행 유지(38.52%)보다 0.37%포인트 높아진다고 분석했다. 하위 45~70% 구간 동결이 역전의 주된 원인으로 꼽혔고, 재산이 적은 노인이 더 적게 받는 형평성 문제도 지적됐다.", "category": "가입자·사회", "importance": 3, "source": "국민일보", "published": "2026-11-09", "url": "https://www.kmib.co.kr/article/20261108500984", "related": []}, {"id": "ff202c03ff29", "title": "기금형 퇴직연금 시대…보험사, 적립금 넘어 새 먹거리 찾는다", "summary": "정부가 지난달 29일 기금형 퇴직연금 도입과 퇴직급여 사외적립 의무화를 담은 '퇴직연금 기능강화 방안'을 발표하면서 100조원대 적립금을 보유한 보험업계도 대응이 과제로 떠올랐다. 보험사는 DB형과 원리금보장형에 강점이 있고 DC·IRP 비중이 작아 DC·IRP 대상인 기금형 도입이 기존 적립금에 미치는 직접 영향은 제한적일 것으로 분석된다. 다만 기금이 안정형 자산을 채권 등으로 직접 운용하면 보험상품 활용 유인이 크지 않아 원리금보장 상품 공급만으로는 새 수익원 확보에 한계가 있을 수 있다. 이에 보험업계는 수탁법인 직접 설립, 운용관리(RK)·상품 공급·은퇴 컨설팅, 연금 지급 단계의 연금상품 활용 등에서 기회를 찾고 있으며 한화금융 계열사들이 대비에 나섰다.", "category": "업계·경쟁사", "importance": 3, "source": "데일리안", "published": "2026-11-09", "url": "https://www.dailian.co.kr/news/view/1711884/?sc=Naver", "related": []}, {"id": "969390b56fd1", "title": "증권가 인사·조직개편 시즌 돌입…미래에셋, 연금·WM에 힘 싣기", "summary": "미래에셋그룹은 미래에셋증권과 미래에셋자산운용 등 주요 계열사의 조직개편과 임원 인사를 발표했으며 전체 승진자의 30%가 WM과 연금 영업 현장 리더로 채워졌다. 연금 부문에서는 이정원 연금RM1부문 대표, 정진성 연금법인솔루션부문 대표, 박상준 연금혁신부문 대표가 신규 선임돼 조직을 세분화했다. 미래에셋증권의 퇴직연금 적립금은 3분기 기준 49조9034억원으로 증권업계 1위이며, 개인연금을 포함한 전체 연금 자산은 80조원을 넘어섰다. 한국투자증권과 KB증권도 MTS에서 연금 자산 조회·관리 기능을 개편하는 등 증권사들이 연금 사업 체계를 고도화하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "CEO스코어데일리", "published": "2026-11-09", "url": "https://www.ceoscoredaily.com/page/view/2026110614125409904", "related": []}, {"id": "0682b5e7e71e", "title": "반도체 호황 끝나면 한국도 안심 못 해…빨라진 기초연금 30조원 시대, 佛 닮아가나", "summary": "프랑스에서 국가채무 위기로 교육예산 등이 삭감되면서 대규모 시위가 50일 넘게 이어지고 있다. 프랑스 정부부채는 올해 2분기 기준 GDP의 119%로 사상 최고치를 기록했고, 지출 대부분은 연금을 비롯한 사회복지에서 비롯된다. 마크롱 정부의 연금 수급 개시 연령 상향 개혁은 반대에 막혀 2028년 1월까지 유예됐다. 기사는 한국의 GDP 대비 사회복지지출 비율이 15.3%로 프랑스의 절반 수준이지만 고령화 속도가 OECD 회원국 중 가장 빨라 연금 부담이 급증하고 있다고 전했다.", "category": "가입자·사회", "importance": 2, "source": "한국일보", "published": "2026-11-10", "url": "https://www.hankookilbo.com/news/article/A2026110618000004556", "related": []}, {"id": "6473653ae9a6", "title": "삼성자산운용, 미국 나스닥100·단기국채 혼합 ETF 10일 상장", "summary": "삼성자산운용의 ‘KODEX 미국나스닥100미국채혼합50’ ETF가 10일 유가증권시장에 신규 상장된다. 자산의 절반은 잔존만기 1~3개월 미국 단기국채에, 나머지 50%는 나스닥100지수에 투자하며 비중을 매일 50대50으로 조정한다. 분배금은 매월 15일을 기준일로 지급한다. 주식 비중이 50% 미만인 채권혼합형이라 퇴직연금 위험자산 투자한도 70%의 적용을 받지 않아 DC·IRP 계좌에서 투자금의 최대 100%까지 편입할 수 있다.", "category": "운용·상품", "importance": 2, "source": "광주매일신문", "published": "2026-11-10", "url": "http://www.kjdaily.com/article.php?aid=1794239336691634276", "related": []}, {"id": "0c8ee94d8c78", "title": "비트코인 ETF, 규제 풀리면 곧바로 나올 수 있을까", "summary": "국내 가상자산 ETF 도입 논의와 출시 가능성을 다룬 기사다. 가상자산 ETF는 그동안 접근이 어려웠던 제도권 자금에 새로운 투자 경로를 제공할 수 있다고 기사는 전했다. 퇴직연금과 연금저축 계좌는 일반 증권 계좌보다 엄격한 투자 기준이 적용돼 가상자산 직접 보유와 해외 상장 ETF 투자가 제한된다. 국내 가상자산 ETF가 출시되더라도 연금 계좌 편입에는 별도 제도 정비가 필요하다.", "category": "운용·상품", "importance": 2, "source": "한경머니", "published": "2026-11-10", "url": "https://magazine.hankyung.com/money/article/202610126760c", "related": []}, {"id": "05af3ee67b3a", "title": "[BS모닝] 계속되는 증시 변동성에 ‘채권혼합형 ETF’ 부상", "summary": "증시 변동성이 확대되면서 주식과 채권을 함께 담는 채권혼합형 ETF로 투자자 관심이 쏠리고 있다. 한국거래소에 따르면 국내혼합형 ETF 순자산총액은 15조4650억원으로 전체 시장 내 비중이 6월 말 3.25%에서 3.53%로 0.28%포인트 상승했다. 개인형퇴직연금(IRP) 위험자산 한도 완화와 투자 대상 확대 논의가 이어지면서 혼합형 ETF 수요도 늘고 있다. 주식 비중이 50% 미만인 채권혼합형 ETF는 퇴직연금(DC·IRP) 계좌에서 위험자산 투자한도(70%)를 적용받지 않아 100%까지 투자할 수 있다.", "category": "운용·상품", "importance": 2, "source": "세계비즈", "published": "2026-11-10", "url": "http://www.segyebiz.com/newsView/20261110502136", "related": []}]}, "monthly": {"period": "monthly", "key": "current", "label": "2026-10-16 ~ 2026-11-15", "generated_at": "2026-11-16T12:01:42+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "829c3e49cc3f", "title": "흔들린 증시에 퇴직연금 적립금 6년여 만에 감소", "summary": "3분기 말 퇴직연금 적립금이 542조1214억원으로 전 분기보다 2.1% 줄었다. 코로나19 초기인 2020년 1분기 이후 6년여 만의 감소다. 업권별로는 증권 160조2935억원(2.9% 감소), 은행 275조4860억원(2.1% 감소), 보험 106조3419억원(0.9% 감소)이다. 실적배당형이 185조2078억원으로 6.3% 줄어든 반면 원리금보장형은 356조9051억원으로 0.2% 늘었다.", "category": "운용·상품", "importance": 5, "source": "머니투데이", "published": "2026-10-20", "url": "https://www.mt.co.kr/stock/2026/10/21/2026102016164749417", "related": [{"title": "3분기 퇴직연금 적립금 542조… 증시 조정 속 보험·은행 동반 감소", "source": "한국보험신문", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=93459"}, {"title": "\"노후자금 넣었는데\"…퇴직연금 12조 줄자 직장인들 '울상'", "source": "한국경제", "url": "https://www.hankyung.com/article/2026102167161"}, {"title": "5대 은행 퇴직연금 5조원 증발…7년 만에 첫 감소세", "source": "컨슈머타임스", "url": "https://www.cstimes.com/news/articleView.html?idxno=724898"}, {"title": "증시 시름에… 퇴직연금도 휘청", "source": "머니투데이", "url": "https://www.mt.co.kr/stock/2026/10/21/2026102019471522048"}, {"title": "증시 '휘청'에…5대銀 퇴직연금 적립금 7년 만에 첫 감소", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4440263"}]}, {"id": "38994a32152d", "title": "[DQN] 주식시장 약세에 삼성생명 적립금 규모 1위 재탈환…DC형 비보장 수익률 반토막 [2026년 3분기 퇴직연금 랭킹]", "summary": "금감원 통합연금포털 3분기 공시 분석 결과 삼성생명의 퇴직연금 적립금이 57조5486억원으로 2분기 1위였던 신한은행을 추월했다. 계열사 DB형 적립금이 7074억원 늘어난 반면 비계열사 DB형은 3586억원 감소했으며, 주식시장 하락으로 원리금보장형 선호가 커진 점도 영향을 미쳤다. 신한라이프 DC형 원리금비보장 수익률은 2분기 111.17%에서 3분기 59.71%로 떨어지는 등 DC·IRP 비보장형 수익률이 절반 가량 하락했다. IRP 원리금비보장 적립금은 94조6349억원에서 87조6398억원으로 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-11-08", "url": "https://www.fntimes.com/html/view.php?ud=2026110716081563428a55064dd1_18", "related": [{"title": "퇴직연금 판도 재역전…삼성생명 반년 만에 선두 탈환", "source": "아시아타임즈", "url": "https://www.asiatime.co.kr/article/20261020500369"}, {"title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "source": "세이프타임즈", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652"}, {"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "b7e8a161b6af", "title": "2028년부터 퇴직급여 사외적립 의무화… 체불 막는다", "summary": "근로자의 퇴직금 체불을 막기 위해 내후년부터 100인 이상 사업장을 대상으로 퇴직급여 사외 적립을 단계적으로 의무화하는 방안이 추진된다. 이형일 부총리 겸 재정경제부 장관과 배경훈 부총리 겸 과학기술정보통신부 장관은 28일 경제관계장관회의·과학기술관계장관회의 첫 연석회의에서 이 방안을 논의했으며, 기금형 퇴직연금의 구체적 도입 방안도 마련해 전문적인 자산 운용과 엄격한 수탁자 책임을 부과하기로 했다. 퇴직연금 사업자 평가 기준은 연금 성과 수익률 중심으로 개편하고, 디폴트옵션 적용 예정 통보 시점은 만기 후 4주에서 만기 전 2주로 앞당긴다. 구체적인 퇴직연금 기능 강화 방안은 29일 국회 기후에너지환경노동위원회 여당 위원과의 당정협의를 거쳐 발표된다.", "category": "제도·규제", "importance": 5, "source": "서울신문", "published": "2026-10-29", "url": "https://www.seoul.co.kr/news/economy/2026/10/29/20261029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "540조 퇴직연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936461/2"}, {"title": "퇴직연금, 전문가가 대신 굴린다…'기금형' 도입, 국민연금 참여는 미정", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6335473"}, {"title": "정부, 퇴직연금 기금형 활성화…IRP 위험자산 투자한도 상향 추진", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4441777"}, {"title": "\"퇴직금 못 받는 일 줄인다\", 사외적립 전 사업장 확대 추진", "source": "데일리환경", "url": "https://www.dailyt.co.kr/newsView/dlt202611040003"}, {"title": "기업 퇴직연금 모아 전문기관이 굴려… ‘쥐꼬리 수익’ 개선 기대", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936451/2"}, {"title": "국민연금, 기금형 퇴직연금 참여 미정···‘시장 개입 우려’에 국회로 공 넘긴 정부", "source": "경향신문", "url": "https://www.khan.co.kr/article/202610300600041"}, {"title": "[퇴직연금 개편] 퇴직연금도 국민연금처럼…정부, 장기 연금 수령 유도 방안 발표", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=620807"}, {"title": "퇴직연금 사외적립 2030년까지 전 사업장 의무화", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237470"}, {"title": "당정, ‘퇴직연금 강화·고용부 예산’ 살핀다…초광역특구법 논의 가능성", "source": "디지털타임스", "url": "https://www.dt.co.kr/article/12091950"}]}, {"id": "fd9e49abb205", "title": "한국투자증권, 퇴직연금 운용의 우위를 실증하다... 3년간 수익률 100% 돌파", "summary": "고용노동부의 9월 말 기준 공시에서 한국투자증권 디폴트옵션 적극투자형 BF1의 3년 누적 수익률이 100.97%로 전체 퇴직연금사업자 포트폴리오 가운데 가장 높았다. 이는 적극투자형 평균 57.58%를 43.39%포인트 웃돌며, 업권별 평균은 증권 61.45%, 은행 55.76%, 보험 55.03%였다. 핵심 전략은 한국투자신탁운용과 협업한 MySuper 알아서 성장형 펀드로 글로벌 우량주와 부동산·인프라·물가연동채권 등 대체자산에 분산투자한다. 3분기 말 DC·IRP 합산 적립금은 18조5160억원으로 지난해 말보다 5조7292억원(44.8%) 늘었다.", "category": "업계·경쟁사", "importance": 4, "source": "리버티코리아포스트", "published": "2026-11-05", "url": "http://www.lkp.news/news/articleView.html?idxno=85780", "related": [{"title": "한투증권, 디폴트옵션 3년 누적 수익률 100.97%…전 사업자 1위", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261104_0003853884"}, {"title": "퇴직연금 3년 새 '두 배' 불렸다…한국투자증권, 디폴트옵션 수익률 전체 1위 달성", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "5dd7e8508fc5", "title": "하나은행, 호남권 첫 시니어 특화 금융라운지 광주에 개점", "summary": "하나은행은 지난 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 금융공간인 '하나더넥스트 광주금융 라운지'를 개점했다. 라운지는 은퇴설계, 상속·증여, 유언대용신탁 상담과 건강관리·문화·주거 등 라이프케어 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산, 예상 지출을 분석하는 '평생소득설계' 상담을 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "545a1b2bec51", "title": "기금형 연금 도입에…금융지주 계열사 합종연횡 채비", "summary": "기금형 퇴직연금 추진이 공식화되면서 주요 금융지주들이 은행을 중심으로 계열사를 동원한 수탁법인 컨소시엄 설립 준비에 돌입했다. 고용노동부는 오는 6일 주요 은행장들을 소집해 기금형 퇴직연금 간담회를 열며, 법 개정 과정에서 금융지주 자회사 공동출자를 허용하는 예외를 마련할 계획이다. NH농협금융은 퇴직연금 제도 개편 대응 TF를, KB금융과 우리금융은 계열사 워킹그룹을 운영하고 있으며 신한금융도 정식 TF를 발족할 예정이다. 5대 금융지주 DC·IRP 적립액은 174조1435억원으로 작년말 대비 15.5% 늘었고, 증권 계열사 비중은 11.2%에서 13.2%로 상승했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-11-03", "url": "https://www.mt.co.kr/finance/2026/11/03/2026110216011686926", "related": [{"title": "기금형 퇴직연금 도입 초읽기… 원팀 꾸리는 금융지주 계열사", "source": "머니투데이", "url": "https://www.mt.co.kr/finance/2026/11/04/2026110319393765961"}]}, {"id": "113078a9f394", "title": "퇴직연금 ‘100% 투자 가능’의 함정…원금까지 보장하진 않아", "summary": "금융감독원은 내년 1월부터 퇴직연금 매매화면과 상품검색 화면에 투자한도와 위험등급을 함께 표시하도록 개선한다고 27일 밝혔으며, 상품제안서와 적립금운용현황보고서에도 위험등급을 병기한다. 일부 사업자가 원금손실 가능성이 있는 상품도 '투자한도 100%'로만 안내해 가입자가 원리금보장형으로 오인할 수 있다는 판단에서다. 올해 상반기 말 퇴직연금 적립금 558조3000억원 가운데 실적배당형은 198조원이고, 이 중 ETF 투자 규모는 99조8000억원으로 50.4%를 차지했다. 일부 사업자는 전산개발 일정에 따라 내년 상반기 중 시행한다.", "category": "제도·규제", "importance": 4, "source": "메트로신문", "published": "2026-10-27", "url": "https://www.metroseoul.co.kr/article/20261027500104", "related": [{"title": "“퇴직연금 다 날릴 수도”…ETF 투자한도 100%의 함정 [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8699397&ref=A"}]}, {"id": "0369d6c3118c", "title": "퇴직연금 223조원 쌓인 5대은행…국민·하나 2위 각축전", "summary": "5대 시중은행의 3분기 말 퇴직연금 적립금은 222조9427억원으로 집계됐다. 신한은행이 57조2252억원으로 1위이고 KB국민은행 52조2226억원, 하나은행 52조1554억원, 우리은행 33조243억원, NH농협은행 28조3152억원 순이다. KB국민은행과 하나은행의 격차는 672억원으로, 2분기 말 3152억원에서 크게 좁혀져 지난해 말 725억원 수준으로 돌아왔다. 올해 누적 증가액은 하나은행 3조7741억원, KB국민은행 3조7688억원으로 53억원 차이다.", "category": "업계·경쟁사", "importance": 4, "source": "이데일리", "published": "2026-10-19", "url": "https://www.edaily.co.kr/News/Read?newsId=03496486645614560&mediaCodeNo=257", "related": [{"title": "퇴직연금 2위 경쟁 격화…하나은행·국민은행 적립금 격차 672억원", "source": "CEO스코어데일리", "url": "https://www.ceoscoredaily.com/page/view/2026102015471625110"}]}, {"id": "b1c24b848e68", "title": "줄어든 거래대금에 증권가는 ‘MTS’ 전쟁…AI·배당·연금으로 고객 자산 잡는다", "summary": "증시 조정으로 거래가 위축되자 증권사들이 MTS에 AI 투자정보, 배당 정보, 퇴직연금 ETF 적립식 매수 기능 등을 더하고 있다. 하나증권은 이달부터 DC·IRP 계좌에서 ETF·ETN·리츠를 정기 매수하는 서비스를 개시하며, 3분기 기준 DC·IRP 시장점유율 1위를 달성했다. 3분기 국내 주식시장 일평균 거래대금은 52조4000억원으로 전 분기 대비 41.7% 감소해 증권사 위탁수수료 수익이 크게 줄었다.", "category": "업계·경쟁사", "importance": 3, "source": "조선비즈", "published": "2026-11-09", "url": "https://biz.chosun.com/stock/stock_general/2026/11/09/FUNYZOZV2JH4FLZ7BJYY4STMYI/", "related": [{"title": "줄어든 증시 거래대금에 증권가는 ‘MTS 전쟁’", "source": "조선일보", "url": "https://www.chosun.com/economy/stock-finance/2026/11/10/IKPQK3UVDJG2HEUOQJK5EO4OFM/"}]}, {"id": "ea0a4daeeaf0", "title": "소득 여유 있는 가구가 연금도 먼저 받는다…취약가구와 수급 격차", "summary": "한국보건사회연구원 보고서에 따르면 정년 이후 공적연금 수급 전까지의 소득공백기에 경제적 여력이 있는 가구일수록 연금 수급률이 높았다. 정년 전 중위소득 100% 이상을 유지하거나 늘린 가구의 공적연금 조기 수급률은 26.5%, 소득이 절반 미만으로 줄어든 취약가구는 18.1%였다. 월평균 공적연금 수급액은 소득 유지 가구가 191만8000원, 취약가구가 52만7000원으로 3.6배 이상 차이가 났다. 보고서는 필요한 금액만큼 연금을 나눠 받는 '부분연금제' 도입과 건강보험료·기초연금 등과의 연계 구조 정비를 제언했다.", "category": "가입자·사회", "importance": 3, "source": "메디컬투데이", "published": "2026-11-10", "url": "https://www.mdtoday.co.kr/news/articleView.html?idxno=623884", "related": [{"title": "“노후 소득공백 버티려 연금 당겼는데”…취약층보다 여유 있는 가구가 더 받았다", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10929855?ref=naver"}]}, {"id": "52bb3ea27011", "title": "국민연금 10년 부은 평균소득자, 기초연금보다 덜 받는다…‘급여 역전’", "summary": "국민연금연구원 김형수 부연구위원의 보고서에 따르면 소득대체율 43%를 적용할 때 평균소득자가 최소가입기간 10년을 채운 월 연금액은 A값의 10.75%로, 올해 기초연금 기준연금액(A값의 약 10.95%)보다 낮다. 올해 A값 319만3511원을 넣으면 국민연금은 월 약 34만3300원으로 기준연금액 34만9700원보다 6400원가량 적다. 보고서는 국민연금 최소가입기간을 상향하거나 기초연금 기준연금액 수준을 조정하는 방향이 필요하다고 제시했다. 최소가입기간을 15년으로 높여도 59세 말 기준 미달 비율은 1.6%로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-04", "url": "https://www.segye.com/newsView/20261103517557", "related": [{"title": "국민연금 10년 부었는데 기초연금보다 적다…월 6400원 역전", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=500742"}]}, {"id": "f82595e9660f", "title": "\"1년 미만·초단기 근로자도 퇴직금\"…정부 실태조사 착수", "summary": "정부가 1년 미만 근속자와 주 15시간 미만 초단시간 근로자에게도 퇴직급여를 지급하는 방안을 검토한다. 29일 발표된 퇴직연금 기능강화 방안에 따라 한국노동연구원이 이들의 퇴직급여 운영 실태와 의무화에 따른 사용자 부담·노동시장 영향을 분석한다. 지난해 주 1~14시간 일한 취업자는 177만9000명으로 전체 취업자의 6.2%였고 관련 통계 작성 이후 가장 많았다. DC형 법정 최소 사용자 부담금이 연간 임금총액의 12분의 1인 만큼 영세 사업장의 채용 위축 우려도 제기된다.", "category": "제도·규제", "importance": 3, "source": "한국경제", "published": "2026-10-30", "url": "https://www.hankyung.com/article/202610294697i", "related": [{"title": "퇴직연금 의무화에도…1년 미만·초단시간 노동자 사각지대 남아", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261029010010231"}]}, {"id": "c2ef78aa9c37", "title": "삼성생명, 퇴직연금 부가서비스 앱 'SSUM 라운지' 개편", "summary": "삼성생명이 퇴직연금 가입자 전용 부가서비스 앱 'SSUM 라운지'를 전면 개편했다고 24일 밝혔다. 새로 마련된 '퇴직연금정보'에는 시장 지표를 보여주는 '투데이브리핑'과 '연금 첫걸음', '투자 인사이트', '투자 가이드북', '연금 클래스' 등 콘텐츠가 담겼다. '연금 클래스'는 매월 한 차례 온라인 세미나로 삼성생명 퇴직연금 전문가와 삼성자산운용이 제도·상품과 시장 전망을 소개한다. 서비스는 삼성생명 퇴직연금(DB·DC·IRP) 가입자라면 누구나 무료로 이용할 수 있다.", "category": "업계·경쟁사", "importance": 2, "source": "비즈월드", "published": "2026-10-25", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149782", "related": [{"title": "삼성생명, 퇴직연금 앱 ‘SSUM 라운지’ 개편…투자정보 강화", "source": "메가경제", "url": "https://www.megaeconomy.co.kr/news/newsview.php?ncode=1065569724632297"}]}, {"id": "79701632bbb8", "title": "하나금융, 3분기 누적 순익 3조6243억원…9490억원 자사주 매입·소각 '역대 최대'", "summary": "하나금융그룹의 올해 3분기 누적 연결당기순이익은 3조6243억원으로 전년 동기 대비 5.6% 증가했고, 누적 수수료이익은 2조1428억원으로 29.8% 늘었다. 하나은행의 3분기 누적 수수료이익은 8740억원으로 전년 동기 대비 11.5% 늘며 3분기 누적 기준 역대 최대치를 기록했다. 퇴직연금과 방카슈랑 s/article/192689", "related": [{"title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "38994a32152d", "title": "[DQN] 주식시장 약세에 삼성생명 적립금 규모 1위 재탈환…DC형 비보장 수익률 반토막 [2026년 3분기 퇴직연금 랭킹]", "summary": "금감원 통합연금포털 3분기 공시 분석 결과 삼성생명의 퇴직연금 적립금이 57조5486억원으로 2분기 1위였던 신한은행을 추월했다. 계열사 DB형 적립금이 7074억원 늘어난 반면 비계열사 DB형은 3586억원 감소했으며, 주식시장 하락으로 원리금보장형 선호가 커진 점도 영향을 미쳤다. 신한라이프 DC형 원리금비보장 수익률은 2분기 111.17%에서 3분기 59.71%로 떨어지는 등 DC·IRP 비보장형 수익률이 절반 가량 하락했다. IRP 원리금비보장 적립금은 94조6349억원에서 87조6398억원으로 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-11-08", "url": "https://www.fntimes.com/html/view.php?ud=2026110716081563428a55064dd1_18", "related": [{"title": "퇴직연금 판도 재역전…삼성생명 반년 만에 선두 탈환", "source": "아시아타임즈", "url": "https://www.asiatime.co.kr/article/20261020500369"}, {"title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "source": "세이프타임즈", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652"}, {"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "b7e8a161b6af", "title": "2028년부터 퇴직급여 사외적립 의무화… 체불 막는다", "summary": "근로자의 퇴직금 체불을 막기 위해 내후년부터 100인 이상 사업장을 대상으로 퇴직급여 사외 적립을 단계적으로 의무화하는 방안이 추진된다. 이형일 부총리 겸 재정경제부 장관과 배경훈 부총리 겸 과학기술정보통신부 장관은 28일 경제관계장관회의·과학기술관계장관회의 첫 연석회의에서 이 방안을 논의했으며, 기금형 퇴직연금의 구체적 도입 방안도 마련해 전문적인 자산 운용과 엄격한 수탁자 책임을 부과하기로 했다. 퇴직연금 사업자 평가 기준은 연금 성과 수익률 중심으로 개편하고, 디폴트옵션 적용 예정 통보 시점은 만기 후 4주에서 만기 전 2주로 앞당긴다. 구체적인 퇴직연금 기능 강화 방안은 29일 국회 기후에너지환경노동위원회 여당 위원과의 당정협의를 거쳐 발표된다.", "category": "제도·규제", "importance": 5, "source": "서울신문", "published": "2026-10-29", "url": "https://www.seoul.co.kr/news/economy/2026/10/29/20261029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "540조 퇴직연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936461/2"}, {"title": "퇴직연금, 전문가가 대신 굴린다…'기금형' 도입, 국민연금 참여는 미정", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6335473"}, {"title": "정부, 퇴직연금 기금형 활성화…IRP 위험자산 투자한도 상향 추진", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4441777"}, {"title": "\"퇴직금 못 받는 일 줄인다\", 사외적립 전 사업장 확대 추진", "source": "데일리환경", "url": "https://www.dailyt.co.kr/newsView/dlt202611040003"}, {"title": "기업 퇴직연금 모아 전문기관이 굴려… ‘쥐꼬리 수익’ 개선 기대", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936451/2"}, {"title": "국민연금, 기금형 퇴직연금 참여 미정···‘시장 개입 우려’에 국회로 공 넘긴 정부", "source": "경향신문", "url": "https://www.khan.co.kr/article/202610300600041"}, {"title": "[퇴직연금 개편] 퇴직연금도 국민연금처럼…정부, 장기 연금 수령 유도 방안 발표", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=620807"}, {"title": "퇴직연금 사외적립 2030년까지 전 사업장 의무화", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237470"}, {"title": "당정, ‘퇴직연금 강화·고용부 예산’ 살핀다…초광역특구법 논의 가능성", "source": "디지털타임스", "url": "https://www.dt.co.kr/article/12091950"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "fd9e49abb205", "title": "한국투자증권, 퇴직연금 운용의 우위를 실증하다... 3년간 수익률 100% 돌파", "summary": "고용노동부의 9월 말 기준 공시에서 한국투자증권 디폴트옵션 적극투자형 BF1의 3년 누적 수익률이 100.97%로 전체 퇴직연금사업자 포트폴리오 가운데 가장 높았다. 이는 적극투자형 평균 57.58%를 43.39%포인트 웃돌며, 업권별 평균은 증권 61.45%, 은행 55.76%, 보험 55.03%였다. 핵심 전략은 한국투자신탁운용과 협업한 MySuper 알아서 성장형 펀드로 글로벌 우량주와 부동산·인프라·물가연동채권 등 대체자산에 분산투자한다. 3분기 말 DC·IRP 합산 적립금은 18조5160억원으로 지난해 말보다 5조7292억원(44.8%) 늘었다.", "category": "업계·경쟁사", "importance": 4, "source": "리버티코리아포스트", "published": "2026-11-05", "url": "http://www.lkp.news/news/articleView.html?idxno=85780", "related": [{"title": "한투증권, 디폴트옵션 3년 누적 수익률 100.97%…전 사업자 1위", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261104_0003853884"}, {"title": "퇴직연금 3년 새 '두 배' 불렸다…한국투자증권, 디폴트옵션 수익률 전체 1위 달성", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "5dd7e8508fc5", "title": "하나은행, 호남권 첫 시니어 특화 금융라운지 광주에 개점", "summary": "하나은행은 지난 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 금융공간인 '하나더넥스트 광주금융 라운지'를 개점했다. 라운지는 은퇴설계, 상속·증여, 유언대용신탁 상담과 건강관리·문화·주거 등 라이프케어 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산, 예상 지출을 분석하는 '평생소득설계' 상담을 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "545a1b2bec51", "title": "기금형 연금 도입에…금융지주 계열사 합종연횡 채비", "summary": "기금형 퇴직연금 추진이 공식화되면서 주요 금융지주들이 은행을 중심으로 계열사를 동원한 수탁법인 컨소시엄 설립 준비에 돌입했다. 고용노동부는 오는 6일 주요 은행장들을 소집해 기금형 퇴직연금 간담회를 열며, 법 개정 과정에서 금융지주 자회사 공동출자를 허용하는 예외를 마련할 계획이다. NH농협금융은 퇴직연금 제도 개편 대응 TF를, KB금융과 우리금융은 계열사 워킹그룹을 운영하고 있으며 신한금융도 정식 TF를 발족할 예정이다. 5대 금융지주 DC·IRP 적립액은 174조1435억원으로 작년말 대비 15.5% 늘었고, 증권 계열사 비중은 11.2%에서 13.2%로 상승했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-11-03", "url": "https://www.mt.co.kr/finance/2026/11/03/2026110216011686926", "related": [{"title": "기금형 퇴직연금 도입 초읽기… 원팀 꾸리는 금융지주 계열사", "source": "머니투데이", "url": "https://www.mt.co.kr/finance/2026/11/04/2026110319393765961"}]}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로
     그보다 넉넉히 잡아야 매일 아침 헛경보가 뜨지 않는다. */
  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
         + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

  function buildStaleNotice() {
    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
