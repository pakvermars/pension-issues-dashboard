상공인 \"탁상행정…고용 위축 우려\"", "summary": "소상공인연합회가 전 사업장 퇴직연금 사외적립 의무화에 대해 \"현장 실태를 도외시한 전형적인 탁상행정\"이라며 반대 논평을 냈다. 정부는 2028년 100인 이상, 2029년 10~99인, 2030년 10인 미만 사업장까지 퇴직급여 사외적립을 단계적으로 의무화한다는 구상이다. 연합회는 매월 또는 분기마다 현금을 내는 방식이 영세 사업주의 현금 유출 압박을 키우고 주 15시간 미만 '쪼개기 알바'를 늘려 고용 위축으로 이어질 것이라고 우려했다. 정부는 사외적립 의무화 등을 담은 근로자퇴직급여 보장법 개정안의 연내 국회 통과를 추진할 계획이다.", "category": "제도·규제", "importance": 3, "source": "SBS Biz", "published": "2026-11-02", "url": "https://biz.sbs.co.kr/article_hub/20000343521?division=NAVER"}, {"id": "285067ee223b", "title": "[연금 승부⑦] 은행서 증권사로 5.2조 이동…IRP 규제 완화 추진에 연금 쟁탈전", "summary": "금융감독원 퇴직연금 실물이전 현황에 따르면 2024년 10월 31일 제도 시행 이후 올해 6월 말까지 금융회사 간 이전된 적립금은 15조8699억원, 24만8030건으로 집계됐다. 이 가운데 은행에서 증권사로 옮겨간 적립금은 5조2225억원으로 증권사에서 은행으로 간 1조2984억원의 약 4배이며, 업권별로는 증권업권에 4조1513억원이 순유입되고 은행에서 3조9714억원이 순유출됐다. 유형별 이전액은 IRP 6조7695억원, DC형 4조8192억원, DB형 4조2812억원으로 DC·IRP가 약 73%를 차지했다. 2025년 DC·IRP 실물이전 순유입액은 한국투자증권이 6726억원으로 미래에셋증권 5718억원보다 많았다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스웍스", "published": "2026-11-02", "url": "https://www.newsworks.co.kr/news/articleView.html?idxno=901434"}, {"id": "e23e526abdd9", "title": "'퇴직연금 기금형 시대'…증권사, 수탁법인 설립 경쟁 나서나", "summary": "정부가 '퇴직연금 기능강화 방안'에서 금융회사가 단독 또는 컨소시엄 형태로 수탁법인을 설립하는 금융기관 개방형 기금을 허용하면서 증권사와 자산운용사의 연금시장 경쟁이 새 국면을 맞을 전망이다. 증권사의 연금 고객 기반과 자산운용사의 운용 전문성을 결합한 컨소시엄도 가능한 사업 모델로 거론된다. 다만 수탁법인은 예비인가와 본인가의 2단계 인가와 최소자본금 요건을 거쳐야 하고, 손해배상책임과 운영위험준비금 적립 등 강화된 수탁자책임이 부과된다. 기금형은 계약형과 병행되는 선택형 제도여서 기존 적립금이 자동으로 이동하지는 않는다.", "category": "업계·경쟁사", "importance": 3, "source": "비즈월드", "published": "2026-11-02", "url": "http://www.bizwnews.com/news/articleView.html?idxno=150437"}, {"id": "3e332b776f04", "title": "퇴직급여 사외적립 의무화… 2030년 모든 사업장 적용", "summary": "고용노동부는 10월 29일 관계부처 합동으로 '퇴직연금 기능강화 방안'을 발표하고 퇴직급여 사외적립을 2028년 1월 100인 이상, 2029년 10~99인, 2030년 10인 미만 사업장 순으로 의무화하기로 했다. 의무화 이전 근속기간에는 소급 적용하지 않는다. 30인 미만 중소기업이 조기 도입하면 최저임금 130% 미만 근로자에 대한 사용자 부담금의 10%를 지원하고, 내년도 정부안에 조기 도입 재정지원 60억원과 경영자금 융자지원 62억원을 반영했다. 일시금 수령 의사를 밝히지 않으면 연금으로 지급하는 옵트아웃 방식 도입도 검토한다.", "category": "제도·규제", "importance": 2, "source": "한국보험신문", "published": "2026-11-02", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=93580"}, {"id": "1f97a95adab2", "title": "DB형 퇴직연금 229조...원리금보장 92%이유, IPS 공시로 묻는다", "summary": "정부가 10월 29일 발표한 퇴직연금 기능강화 방안에는 적립금 규모에 따라 단계적으로 DB형 적립금운용계획서(IPS)와 운용현황, 기간별 수익률을 공시하는 내용이 담겼다. 2025년 말 DB형 적립금은 228조9000억원으로 전체의 45.7%이며, 이 중 91.9%가 원리금보장형으로 운용되고 지난해 수익률은 3.5%였다. 필자는 일본이 분산투자를 하지 않는 경우 그 이유를 운용 기본방침에 명시하도록 한 사례를 들어 공시 항목에 목표수익률 산정 근거 등을 담아야 한다고 제언했다. 법 개정안은 11월 중 마련될 예정이다.", "category": "법인·자금운용", "importance": 2, "source": "뉴스퀘스트", "published": "2026-11-02", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=303845"}, {"id": "46c003ca6629", "title": "“주식만 믿었다간 벼락거지 못면한다”…한달새 50조 몰린 이 상품", "summary": "5대 은행의 예·적금 외 수신은 10월 29일 기준 575조5000억원으로 9월 말보다 50조5000억원(9.6%) 늘어 2022년 집계 이후 월간 최대 증가 폭을 기록했다. 예·적금 외 수신에는 특정금전신탁, MMT, 퇴직연금, 펀드, ELD 등이 포함된다. 연말을 앞두고 기업의 해당 연도 적립분 납입과 개인의 IRP 추가 납입으로 퇴직연금 수요도 증가했다. 같은 기간 예·적금 잔액은 1734조6000억원으로 4조7000억원(0.3%) 늘어나는 데 그쳤다.", "category": "운용·상품", "importance": 2, "source": "매일경제", "published": "2026-11-02", "url": "https://www.mk.co.kr/article/12193047"}, {"id": "0f1ff0b5a9d0", "title": "[ETF 시장 동향] 코스피 하락 틈타 안전자산으로 쏠린 눈…하반기 국내 흐름은?", "summary": "에프앤가이드에 따르면 10월 28일 기준 국내주식형 ETF 순자산은 180조6323억원으로 전체 ETF의 41.20%를 차지해 6월 말 48.49%에서 낮아졌다. 국내채권형 ETF 비중은 6월 말 12.01%에서 15.88%로, 국내혼합형은 3.25%에서 3.53%로 높아졌고 해외주식형은 30.40%로 올해 처음 30%를 넘었다. 주식 비중 50% 이하 국내혼합형 ETF는 퇴직연금에서 안전자산으로 분류돼 위험자산 70% 한도를 지키면서 주식 비중을 높이는 수단으로 쓰인다. 정부는 IRP 위험자산 투자 한도를 단계적으로 확대할 계획이다.", "category": "운용·상품", "importance": 2, "source": "CBC뉴스", "published": "2026-11-02", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=621920"}, {"id": "bbfe7c976150", "title": "\"2030 분노할 연금, 정치인은 관심 없다\"…90년생 김용태의 직격", "summary": "국민의힘 김용태 의원은 인터뷰에서 연금개혁·기후변화 대응·재정준칙 확립을 세대 간 정의의 과제로 꼽았다. 김 의원은 지난해 모수개혁에 이어 이제 구조개혁이 중요하다며 이재명 정부가 아직 방향을 정하지 못했다고 비판했다. 국회예산정책처에 따르면 국민연금은 2050년 적자로 돌아서고 2069년 기금이 바닥난다.", "category": "가입자·사회", "importance": 2, "source": "동행미디어 시대", "published": "2026-11-02", "url": "https://www.sidae.com/article/2026102914540227384"}, {"id": "80ca9c479ac9", "title": "“내 노후자금으로 임대주택을?”…국민연금이 ‘쌈짓돈’인가", "summary": "정부·여당이 8월 국민연금 기금의 1%(약 18조원)를 공공임대주택에 투자하는 구상을 내놓았고, 논의 과정에서 정부 측은 연 4%대, 국민연금 측은 최소 7%의 수익률을 거론한 것으로 알려졌다. 기사는 3%포인트 차이를 18조원에 적용하면 한 해 예상 손실이 5400억원에 이른다고 지적했다. 국민연금법 제102조는 공공부문 투자를 허용하지만 기금의 장기 재정 안정을 해치지 않는 범위로 조건을 두고 있다. 정부가 내세운 기금 소진 15년 연장은 운용수익률을 5.5%로 1%포인트 높여야 가능하며, 종전 4.5%를 유지하면 소진 시점은 2064년으로 8년 늦춰지는 데 그친다.", "category": "가입자·사회", "importance": 2, "source": "신동아", "published": "2026-11-02", "url": "https://shindonga.donga.com/3/all/13/6438184/1"}, {"id": "7164693ab431", "title": "[IR 분석] KB증권, 실적 둔화에 다변화 모색…'평가대' 오른 이홍구 대표", "summary": "KB증권의 올해 3분기 누적 당기순이익은 1조675억원으로 전년 동기 대비 114.9% 증가했지만 3분기 영업이익은 3791억원으로 직전 분기보다 36.7% 감소했다. WM 영업수익은 2분기 6378억원에서 3분기 3502억원으로 줄었다. 나상록 KB금융 CFO는 수수료이익 공백을 CIB, 트레이딩 손익 회복, 퇴직연금 사업 경쟁력 강화 등으로 메워야 한다고 밝혔다. 이재근 회장 선임으로 세대교체론이 거론되는 가운데 임기가 올해 말까지인 이홍구 대표의 재신임 여부가 주목된다.", "category": "업계·경쟁사", "importance": 2, "source": "FETV", "published": "2026-11-02", "url": "https://www.fetv.co.kr/news/articleView.html?idxno=312818"}, {"id": "fb9a53b790cc", "title": "“수출하는 나라인데 배당만 하면 어떡하나” [개척자, 박현주의 관점③]", "summary": "박현주 미래에셋그룹 회장은 10월 27일 경희대·한경비즈니스 인사이트 포럼 강연에서 한국 증시의 큰 변동성이 퇴직연금(DC형) 등 연금 발달이 미흡한 탓이라고 진단했다. 미국 등 선진국은 연금 등 기관투자자 비중이 40~50%에 달하지만 한국은 15~20% 수준에 불과하다고 지적했다. 기업들이 직원 퇴직연금까지 전부 원금보장형으로 묶어 둔다며 주식형·투자형으로 운용했다면 근로자 수익률이 몇 배는 더 났을 것이라고 말했다. 자산배분 기회를 활용할 줄 아는 CFO가 시급하다고 덧붙였다.", "category": "업계·경쟁사", "importance": 2, "source": "한경비즈니스", "published": "2026-11-02", "url": "https://magazine.hankyung.com/business/article/202610306977b"}, {"id": "a4d2e414cb4e", "title": "국내주식 ETF 비중 41%로 하락…채권·해외주식 비중 확대", "summary": "에프앤가이드에 따르면 10월 28일 기준 국내주식형 ETF 순자산은 180조6천323억원으로 전체 438조3천776억원의 41.20%를 차지해 6월 말 48.49%에서 낮아졌다. 국내채권형 비중은 6월 말 12.01%에서 15.88%로 올랐고, 해외주식형은 30.40%로 올해 처음 30%를 넘었다. 주식 비중 50% 이하인 국내혼합형 ETF는 퇴직연금 계좌에서 안전자산으로 분류되며 비중이 3.53%로 높아졌다. 정부가 IRP 위험자산 투자 한도를 단계적으로 확대하기로 하면서 관련 ETF 시장에도 변화가 예상된다.", "category": "운용·상품", "importance": 2, "source": "광주매일신문", "published": "2026-11-02", "url": "http://www.kjdaily.com/article.php?aid=1793545705690772276"}, {"id": "5994738de16c", "title": "\"삼전닉스서만 131조 줄었다\"…안철수, 국민연금 리밸런싱 정조준", "summary": "안철수 국민의힘 의원이 국민연금의 국내 주식 리밸런싱 유예 결정의 경위와 책임을 밝히라고 요구했다. 안 의원은 최근 석 달 반 동안 국민연금 보유 상장사 287곳의 주식 평가액이 약 182조원 줄었고 삼성전자와 SK하이닉스에서만 약 131조원이 감소했다고 주장했다. 국민연금이 올해 1월 리밸런싱을 유예하고 이후 국내 주식 목표 비중을 높인 판단을 검증해야 한다며 기금운용 회의록의 비공개 국회 제출도 촉구했다. 그는 기금 운용의 독립성과 책임성 강화와 연금개혁 논의를 서둘러야 한다고 밝혔다.", "category": "가입자·사회", "importance": 2, "source": "한국경제", "published": "2026-11-02", "url": "https://www.hankyung.com/article/202611028991H"}, {"id": "b94bb519911b", "title": "[박근종 칼럼] 국민연금 수급자 800만 시대, '넓고 얕은' 기초연금 미봉책 아닌 근본적인 개혁 필요", "summary": "올해 1~7월 국민연금 수급자 806만2142명 가운데 66.0%인 519만3269명이 월 60만원을 받지 못했다. 가입 기간 20년 이상 수급자의 월평균 수령액은 117만4499원, 10~19년은 45만1860원이었다. 필자는 소득 하위 70%인 779만명에게 지급되는 '넓고 얕은' 기초연금으로는 노인 소득 격차를 좁힐 수 없다며 근본적 개혁을 주장했다.", "category": "가입자·사회", "importance": 1, "source": "더쎈뉴스", "published": "2026-11-02", "url": "https://www.mhns.co.kr/news/articleView.html?idxno=766983"}, {"id": "5d6f3adb7b1e", "title": "[궁금한 건설세무 Q&A] (29) 퇴직금 계산과 퇴직연금, DB형과 DC형 중 무엇이 유리할까?", "summary": "퇴직금은 1년 이상 근로자에게 재직 1년당 30일 이상의 평균임금을 지급하며 퇴사 후 14일 이내에 지급해야 한다. DC형은 매년 퇴직급여의 100%를 금융기관에 예치하고 운용 위험을 근로자가 지며, DB형은 퇴직금추계액의 60% 이상을 예치하고 급여 상승에 따른 부담을 회사가 진다. 필자는 DC형이 누진적 부담을 상쇄하고 세무신고 의무가 금융기관에 있어 기업들이 대체로 선호한다고 설명했다.", "category": "법인·자금운용", "importance": 1, "source": "기계설비신문", "published": "2026-11-02", "url": "https://www.kmecnews.co.kr/news/articleView.html?idxno=52574"}, {"id": "e7fd1fdfdb4f", "title": "[알쓸다정] 내 퇴직연금에도 '발행어음'과 'IMA'가 들어온다고?", "summary": "금융위원회가 퇴직연금 기능강화 방안을 내놓으면서 종합투자계좌(IMA)와 발행어음이 DC·IRP 가입자의 새 투자처로 추진되고 있다. 발행어음은 자기자본 4조원 이상 초대형 IB 증권사가 자기자본의 최대 200%까지 발행하는 단기 어음이고, IMA는 자기자본 8조원 이상 종합금융투자사업자가 최대 300%까지 모아 운용하며 원금을 증권사가 책임지는 구조다. 현재 70%인 IRP 위험자산 투자 한도를 단계적으로 완화하는 방안도 함께 검토되고 있다. 기사는 이들 상품이 예금처럼 원금이 무조건 보장되지 않으므로 만기, 중도해지 조건, 증권사 신용등급을 따져봐야 한다고 설명한다.", "category": "운용·상품", "importance": 1, "source": "공감신문", "published": "2026-11-02", "url": "https://www.gokorea.kr/news/articleView.html?idxno=883650"}, {"id": "81bdf845d189", "title": "내 퇴직금, 어떻게 달라지나…기금형 퇴직연금이 뭐죠?[금알못]", "summary": "정부는 2028년 100인 이상 사업장을 시작으로 2029년 10~99인, 2030년 10인 미만 사업장까지 퇴직급여 사외적립을 단계적으로 의무화하는 '퇴직연금 기능강화 방안'을 공개했다. 외부 적립은 의무화 시행 이후 발생하는 근속기간부터 적용되며, 지난해 전체 임금체불액 가운데 퇴직금 체불액은 41.1%(8229억원)였다. 기금형 퇴직연금은 DC형과 IRP에 적용되며 금융기관 개방형, 연합형, 공공기관 개방형 세 유형으로 나뉜다. 정부는 이달 중 근로자퇴직급여보장법 개정안을 마련해 연내 국회 통과를 추진할 계획이다.", "category": "제도·규제", "importance": 1, "source": "뉴시스", "published": "2026-11-02", "url": "https://www.newsis.com/view/NISX20261030_0003848952"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-10-26 ~ 2026-11-01", "generated_at": "2026-11-02T14:31:19+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "b7e8a161b6af", "title": "2028년부터 퇴직급여 사외적립 의무화… 체불 막는다", "summary": "근로자의 퇴직금 체불을 막기 위해 내후년부터 100인 이상 사업장을 대상으로 퇴직급여 사외 적립을 단계적으로 의무화하는 방안이 추진된다. 이형일 부총리 겸 재정경제부 장관과 배경훈 부총리 겸 과학기술정보통신부 장관은 28일 경제관계장관회의·과학기술관계장관회의 첫 연석회의에서 이 방안을 논의했으며, 기금형 퇴직연금의 구체적 도입 방안도 마련해 전문적인 자산 운용과 엄격한 수탁자 책임을 부과하기로 했다. 퇴직연금 사업자 평가 기준은 연금 성과 수익률 중심으로 개편하고, 디폴트옵션 적용 예정 통보 시점은 만기 후 4주에서 만기 전 2주로 앞당긴다. 구체적인 퇴직연금 기능 강화 방안은 29일 국회 기후에너지환경노동위원회 여당 위원과의 당정협의를 거쳐 발표된다.", "category": "제도·규제", "importance": 5, "source": "서울신문", "published": "2026-10-29", "url": "https://www.seoul.co.kr/news/economy/2026/10/29/20261029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "540조 퇴직연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936461/2"}, {"title": "퇴직연금, 전문가가 대신 굴린다…'기금형' 도입, 국민연금 참여는 미정", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6335473"}, {"title": "정부, 퇴직연금 기금형 활성화…IRP 위험자산 투자한도 상향 추진", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4441777"}, {"title": "기업 퇴직연금 모아 전문기관이 굴려… ‘쥐꼬리 수익’ 개선 기대", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936451/2"}, {"title": "국민연금, 기금형 퇴직연금 참여 미정···‘시장 개입 우려’에 국회로 공 넘긴 정부", "source": "경향신문", "url": "https://www.khan.co.kr/article/202610300600041"}, {"title": "[퇴직연금 개편] 퇴직연금도 국민연금처럼…정부, 장기 연금 수령 유도 방안 발표", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=620807"}, {"title": "퇴직연금 사외적립 2030년까지 전 사업장 의무화", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237470"}, {"title": "당정, ‘퇴직연금 강화·고용부 예산’ 살핀다…초광역특구법 논의 가능성", "source": "디지털타임스", "url": "https://www.dt.co.kr/article/12091950"}]}, {"id": "113078a9f394", "title": "퇴직연금 ‘100% 투자 가능’의 함정…원금까지 보장하진 않아", "summary": "금융감독원은 내년 1월부터 퇴직연금 매매화면과 상품검색 화면에 투자한도와 위험등급을 함께 표시하도록 개선한다고 27일 밝혔으며, 상품제안서와 적립금운용현황보고서에도 위험등급을 병기한다. 일부 사업자가 원금손실 가능성이 있는 상품도 '투자한도 100%'로만 안내해 가입자가 원리금보장형으로 오인할 수 있다는 판단에서다. 올해 상반기 말 퇴직연금 적립금 558조3000억원 가운데 실적배당형은 198조원이고, 이 중 ETF 투자 규모는 99조8000억원으로 50.4%를 차지했다. 일부 사업자는 전산개발 일정에 따라 내년 상반기 중 시행한다.", "category": "제도·규제", "importance": 4, "source": "메트로신문", "published": "2026-10-27", "url": "https://www.metroseoul.co.kr/article/20261027500104", "related": [{"title": "“퇴직연금 다 날릴 수도”…ETF 투자한도 100%의 함정 [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8699397&ref=A"}]}, {"id": "98d2dff428ae", "title": "퇴직연금 의무화 부담론에 정부 \"기존 퇴직금 소급 적립 안 해\"", "summary": "정부는 30일 퇴직급여 사외적립 의무화와 관련해 의무화 이전 계속근로기간에 발생한 퇴직급여는 소급해 사외적립하도록 하지 않는다고 밝혔다. 퇴직연금 도입 의무는 2028년 100인 이상, 2029년 10~99인, 2030년 10인 미만 사업장 순으로 단계 적용한다. 2027년 예산안에는 조기 도입 사업장 적립금 매칭 지원 60억원과 경영자금 융자 비용 보전 62억원 등 122억원이 신규 편성됐다. 지난해 말 기준 퇴직금 체불액은 8229억원으로 전체 임금체불의 41.1%를 차지했다.", "category": "제도·규제", "importance": 4, "source": "아시아경제", "published": "2026-10-31", "url": "https://view.asiae.co.kr/article/2026103109010051414", "related": []}, {"id": "2bd719c10d42", "title": "삼성생명 퇴직연금 3.1조 싹쓸이하며 홀로 '독주'…대형 보험사 10곳 중 7곳은↓", "summary": "올해 9월 말 보험업권 퇴직연금 적립액은 106조3419억 원으로 작년 말 대비 1.5% 늘었지만 상위 10개사 중 삼성생명·DB손해보험·흥국생명 3곳만 순증했다. 삼성생명은 57조5486억 원으로 5.7% 늘며 3분기 신한은행을 제치고 금융권 적립액 1위를 재탈환했다. 교보생명(-1%), 삼성화재(-1.5%), KB손해보험(-7.7%) 등은 감소했다. 같은 기간 은행업권은 5.7%, 증권업권은 21.9% 늘어 보험업권 비중은 21.1%에서 19.6%로 1.5%포인트 하락했다.", "category": "업계·경쟁사", "importance": 4, "source": "소비자가 만드는 신문", "published": "2026-10-30", "url": "http://www.consumernews.co.kr/news/articleView.html?idxno=766991", "related": []}, {"id": "08fa4f3a2d9e", "title": "하나은행, 은행 퇴직연금 판도 흔든다…KB와 격차 대폭 줄어", "summary": "데이터뉴스가 금감원 통합연금포털 공시를 분석한 결과 3분기 기준 4대 시중은행 퇴직연금 적립금은 194조6275억 원으로 전년 동기 대비 16.2% 증가했다. 순위는 신한은행 57조2252억 원, 국민은행 52조2226억 원, 하나은행 52조1554억 원, 우리은행 33조243억 원 순이다. 하나은행은 전년 대비 18.2% 늘어 국민은행과의 격차를 지난해 1조1960억 원에서 672억 원으로 좁혔다. 하나은행 개인형IRP 적립액은 19조3617억 원으로 28.1% 증가했다.", "category": "업계·경쟁사", "importance": 4, "source": "데이터뉴스", "published": "2026-10-30", "url": "http://www.datanews.co.kr/news/article.html?no=147193", "related": []}, {"id": "57ee5c3c325d", "title": "[연금 승부③] '160조' 증권사 퇴직연금 미래에셋 독주 속 추격전", "summary": "금융감독원 퇴직연금 비교공시에 따르면 올해 3분기 말 증권사 퇴직연금 적립금(DB·DC·IRP)은 160조2935억원으로 전년 동기보다 33.9% 늘었지만 2분기 말(165조468억원)보다는 2.9% 줄었다. 미래에셋증권은 적립금 49조9034억원으로 5개 분기 연속 1위를 지켰다. 삼성증권(27조6694억원)과 한국투자증권(25조8873억원)의 격차는 지난해 2272억원에서 1조7821억원으로 벌어졌고, 현대차증권(18조9431억원)이 4위를 유지했다. 원리금비보장상품 수익률은 DC형 1년 유안타증권 21.86%, IRP 1년 iM증권 20.28%, DB형 1년 미래에셋증권 14.42% 등 유형과 기간에 따라 상위 사업자가 갈렸다.", "category": "업계·경쟁사", "importance": 4, "source": "뉴스웍스", "published": "2026-10-29", "url": "https://www.newsworks.co.kr/news/articleView.html?idxno=901002", "related": []}, {"id": "8736f7f36a18", "title": "'DC형 퇴직연금' 수익률 53%대서 15%대로", "summary": "금융감독원 통합연금포털에 따르면 9월 말 퇴직연금 사업자 43곳의 적립금은 542조1214억원으로 6월 말 553조8779억원보다 11조7565억원(2.12%) 줄었으며, 분기 말 적립금이 전 분기보다 감소한 것은 2020년 1분기 이후 6년여 만이다. DC형 퇴직연금 최근 1년 평균 수익률은 6월 말 53.33%에서 9월 말 15.90%로, IRP 투자 수익률은 48.25%에서 15.97%로, DB형 수익률은 6.68%에서 1.36%로 낮아졌다. 적립금 감소액은 IRP 5조129억원, DC형 3조8374억원, DB형 2조9062억원이었고 IRP와 DC형 감소액 합계 8조8503억원은 전체 감소액의 75.3%에 달했다. 올해 1~7월 DB형에서 DC형으로 전환한 근로자는 34만156명으로 전년 같은 기간보다 118.1% 늘었고, 미래에셋증권에서 4~6월 DC형으로 바꾼 가입자들의 7~8월 수익률은 -10.7%였다.", "category": "운용·상품", "importance": 4, "source": "조선일보", "published": "2026-10-28", "url": "https://www.chosun.com/economy/market_trend/2026/10/28/QAYJIBWJOJGJLMRW7O2IFSWVWQ/", "related": []}, {"id": "23f60715d3da", "title": "퇴직연금 수익률 경쟁…DB형은 미래에셋증권, DC·IRP는 하나증권 ‘두각’", "summary": "올해 3분기 말 15개 증권사의 퇴직연금 적립금은 160조2935억원으로 직전 분기 165조468억원보다 4조7533억원(2.88%) 줄었고, 금융권 전체에서 증권사가 차지하는 비중은 29.80%에서 29.57%로 낮아졌다. 유형별로는 개인 IRP가 2조9143억원(4.44%), DB가 1조2560억원(2.86%), DC가 5830억원(1.05%) 감소했다. 적립금 1조원 이상 증권사 10곳 중 원리금비보장 DB 최근 1년 수익률은 미래에셋증권이 14.42%로 가장 높았고 KB증권 9.86%, 한국투자증권 5.39% 순이었다. 원리금비보장 DC와 개인 IRP 최근 1년 수익률은 하나증권이 각각 18.72%, 18.50%로 가장 높았으며, 하나증권은 DC 원리금비보장형 5년·7년·10년 연평균 수익률에서도 증권업 1위를 기록했다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-10-28", "url": "https://www.ceoscoredaily.com/page/view/2026102715070654047", "related": []}, {"id": "d970457f49c6", "title": "[연금 승부①] 퇴직연금 절반 지킨 은행…증권사는 DC·IRP로 추격", "summary": "금융감독원 퇴직연금 비교공시에 따르면 올해 3분기 말 전체 퇴직연금 적립금은 542조1214억원으로 지난해 말보다 45조3193억원(9.1%) 늘었다. 은행권 적립금은 약 275조원이지만 점유율은 50.8%로 1.6%포인트 낮아졌고, 증권업권은 21.9% 늘어 약 160조원, 점유율은 26.5%에서 29.6%로 높아졌다. 증권업권 증가액 약 28조8000억원은 전체 증가액의 63.5%를 차지했으며, DC 적립금은 약 55조원으로 지난해 말보다 43.4% 증가했다. 보험업권 점유율은 21.1%에서 19.6%로 낮아졌고, 전체 적립금은 직전 분기보다 2.1% 감소했다.", "category": "업계·경쟁사", "importance": 4, "source": "뉴스웍스", "published": "2026-10-27", "url": "https://www.newsworks.co.kr/news/articleView.html?idxno=900812", "related": []}, {"id": "f4030639ff20", "title": "[단독] 세 차례 미뤄진 퇴직연금 CEO 간담회 내달 6일 개최", "summary": "세 차례 일정이 미뤄진 고용노동부·금융감독원의 퇴직연금사업자 CEO 간담회가 11월 6일 오후 4시 40분부터 서울 로얄호텔에서 열린다. 계획안은 간담회 목적으로 기금형 제도 도입안 설명과 의견 수렴, 노동자 수급권 보호를 위한 금융기관 책무 당부를 꼽았다. 고용부는 당초 9월 초 간담회를 추진했으나 관계부처 간 정부안 조율이 길어지며 일정을 거듭 미뤘다. 고용부는 국회 종합감사를 마친 뒤 이번 주 중 '퇴직연금 기능강화 방안'을 발표하고 일주일여 뒤 금융권 CEO들과 마주 앉는다.", "category": "제도·규제", "importance": 4, "source": "글로벌에픽", "published": "2026-10-27", "url": "https://www.globalepic.co.kr/view.php?ud=2026102708511668447cc35ccc5c_29", "related": []}, {"id": "b486e9feffda", "title": "3분기 퇴직연금 적립금 542조… 증시 조정 속 보험·은행 동반 감소", "summary": "금융감독원 통합연금포털 공시에 따르면 올해 3분기 전체 퇴직연금 적립금은 542조1214억원으로 전분기보다 11조7565억원(2.1%) 줄어 2020년 1분기 이후 6년여 만에 감소세로 돌아섰다. 원리금보장형은 356조9051억원으로 7272억원(0.2%) 늘었지만 원리금비보장형은 185조2078억원으로 12조4834억원(6.3%) 감소했고, 제도별로는 IRP 5조129억원(3.0%), DC 3조8374억원(2.3%), DB 2조9062억원(1.3%)이 각각 줄었다. 보험권 적립금은 106조3419억원으로 0.9% 감소에 그친 반면 은행권은 275조4860억원으로 2.1% 줄었고 감소액의 77.2%가 DC·IRP에서 나왔다. 삼성생명은 전체 적립금 57조5486억원으로 신한은행(57조2252억원)을 3234억원 차로 앞서며 전체 사업자 1위를 탈환했다.", "category": "운용·상품", "importance": 4, "source": "한국보험신문", "published": "2026-10-26", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=93459", "related": []}, {"id": "671db33cd634", "title": "하나증권, DC 장기 수익률 ‘트리플 1위’…수익률·적립금 동반 성장", "summary": "하나증권은 올해 3분기 말 기준 확정기여형(DC) 퇴직연금 원리금비보장형 상품의 5·7·10년 수익률이 증권사 가운데 가장 높았다고 밝혔다. 금융감독원 통합연금포털 공시에 따르면 수익률은 5년 연 8.03%, 7년 연 8.88%, 10년 연 7.21%였고, 1년 수익률은 연 18.72%, 3년은 연 16.32%였다. 개인형퇴직연금(IRP) 1년 수익률도 연 18.50%로 증권업 상위 10개사 중 1위를 차지했다. 올해 들어 하나증권의 DC 적립금은 36.5%, IRP 적립금은 38.8% 증가했다.", "category": "업계·경쟁사", "importance": 4, "source": "한경머니", "published": "2026-10-26", "url": "https://magazine.hankyung.com/money/article/202610264624c", "related": []}, {"id": "f82595e9660f", "title": "\"1년 미만·초단기 근로자도 퇴직금\"…정부 실태조사 착수", "summary": "정부가 1년 미만 근속자와 주 15시간 미만 초단시간 근로자에게도 퇴직급여를 지급하는 방안을 검토한다. 29일 발표된 퇴직연금 기능강화 방안에 따라 한국노동연구원이 이들의 퇴직급여 운영 실태와 의무화에 따른 사용자 부담·노동시장 영향을 분석한다. 지난해 주 1~14시간 일한 취업자는 177만9000명으로 전체 취업자의 6.2%였고 관련 통계 작성 이후 가장 많았다. DC형 법정 최소 사용자 부담금이 연간 임금총액의 12분의 1인 만큼 영세 사업장의 채용 위축 우려도 제기된다.", "category": "제도·규제", "importance": 3, "source": "한국경제", "published": "2026-10-30", "url": "https://www.hankyung.com/article/202610294697i", "related": [{"title": "퇴직연금 의무화에도…1년 미만·초단시간 노동자 사각지대 남아", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261029010010231"}]}, {"id": "564cfb9a0ef2", "title": "DB? DC? 기금형?…내 퇴직연금, 뭘 골라야 하나[Q&A]", "summary": "2030년까지 모든 사업장에 퇴직연금이 의무화되면서 DB·DC·기금형 중 선택 기준을 문답으로 정리했다. 노동부는 임금이 꾸준히 오르는 직장은 DB, 성과급 중심인 곳은 DC가 유리하다고 설명했으며, 지난해 말 적립금은 DB 228조 9천억원, DC와 IRP 합산 272조 5천억원이었다. 의무화 시 적립 의무는 시행 시점 이후 근속분부터 생기고 그 이전 기간은 퇴직할 때 퇴직금으로 주면 된다. 기금형은 DC와 IRP 가입자만 대상이며 수탁법인은 금융기관 개방형(최소자본금 120억원), 연합형, 공공기관 개방형의 세 유형으로 나뉜다.", "category": "제도·규제", "importance": 3, "source": "노컷뉴스", "published": "2026-11-01", "url": "https://www.nocutnews.co.kr/news/6600082", "related": []}, {"id": "76467e1d4a21", "title": "누군 50만원 받는데 나는 15만원?…연금 종류가 갈랐다 [숫자 뒤의 진실]", "summary": "배우자의 유족연금 산정액이 똑같이 월 50만원이어도 부부가 가입한 공적연금 종류에 따라 추가 수령액이 15만원, 25만원, 50만원으로 달라진다. 부부 모두 국민연금이면 유족연금의 30%, 모두 공무원연금이면 50%가 더해지고, 국민연금과 공무원연금 교차 가입 부부는 감액 없이 전액을 받는다. 국민연금 부부와 교차 가입 부부의 차이는 월 35만원, 연간 420만원이다. 국민연금연구원 분석에 따르면 2007년 이후 유족연금을 받다 노령연금 수급 연령에 도달한 집단의 노령연금 선택 비율은 90%를 웃돌았다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-01", "url": "https://www.segye.com/newsView/20261101500862", "related": []}, {"id": "b2af402206a0", "title": "퇴직연금 판 키우는 정부, 증권사엔 반쪽짜리 기회?", "summary": "정부가 지난달 29일 사외적립 의무화, 기금형 퇴직연금 도입, 위험자산 투자 한도 완화를 담은 퇴직연금 기능 강화 방안을 발표하면서 증권업계의 기대와 우려가 교차하고 있다. 퇴직연금 적립금은 지난해 말 501조4000억원이지만 수익률은 6.47%로 국민연금(18.82%)보다 낮고 적립금의 75.4%가 원리금보장형에 몰려 있다. 업계는 기금형이 경쟁을 촉진할 기회라고 보면서도, 금융기관 개방형에 대형 금융지주가 계열사 시너지로 진출하고 국민연금이 공공기관 개방형으로 참여할 경우 증권사의 수혜가 제한될 수 있다고 우려한다. 손해배상 책임 등 수탁자책임 강화로 방어적 운용에 치중할 가능성도 부담 요인으로 꼽힌다.", "category": "업계·경쟁사", "importance": 3, "source": "데일리안", "published": "2026-11-01", "url": "https://www.dailian.co.kr/news/view/1708932/", "related": []}, {"id": "8cd7414d2278", "title": "'퇴직금 체불' 8천억에 연금 의무화…영세기업·사각지대 보완은 '과제'", "summary": "정부의 퇴직연금 기능강화 방안에 따라 2028년 100인 이상, 2029년 10~99인, 2030년 10인 미만 사업장까지 퇴직급여 사외적립이 단계적으로 의무화된다. 지난해 퇴직금 체불액은 8229억원으로 전체 임금체불액의 41.1%를 차지했고, 사업장 퇴직연금 도입률은 26.5%, 5인 미만 사업장은 10.6%에 그친다. 한국노동연구원 조사에서 미도입 사업장의 52.5%가 의무화에 부담을 느낀다고 답했으며, 정부는 30인 미만 조기 도입 재정지원과 50인 미만 융자비용 지원을 내놨다. 국민연금공단의 기금 운용 참여 여부는 결론을 내지 못했고, 1년 미만·초단시간 노동자는 여전히 퇴직급여 적용 대상에서 빠져 있다.", "category": "제도·규제", "importance": 3, "source": "뉴시스", "published": "2026-11-01", "url": "https://www.newsis.com/view/NISX20261031_0003849379", "related": []}, {"id": "2f57fb8bfc31", "title": "[연금 승부⑥] 똑같은 3000만원 맡겨도 수수료 제각각…'0원'의 비밀", "summary": "금융감독원 퇴직연금 비교공시 기준 국민·신한·하나·우리은행의 IRP 연간 합계 수수료율은 가입자부담금 3000만원 기준 모두 0.28%였고 농협은행은 0.27%였다. 퇴직급여를 IRP에 넣으면 4대 은행의 대면 합계 수수료율은 연 0.45%로 높아지며, 비대면 가입 시 국민은행은 0.20%, 신한·하나은행은 0.35%를 적용하고 우리은행은 수수료를 면제한다. 미래에셋·한국투자·삼성증권은 비대면 계좌 가입자부담금 등에 수수료를 면제하고, 삼성생명은 올해 8월 1일부터 IRP 운용·자산관리수수료를 전면 면제했다. 반면 삼성화재는 대면 원리금보장형에 연 0.50%를 적용해 적립금 3000만원 기준 15만원의 수수료를 부담하게 된다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스웍스", "published": "2026-11-01", "url": "https://www.newsworks.co.kr/news/articleView.html?idxno=901459", "related": []}, {"id": "f297234381b7", "title": "정부, 2030 퇴직연금 의무화 시동…영세기업 부담·낮은 수익률 등 과제 산적", "summary": "정부가 2030년까지 전 사업장 퇴직연금 의무화와 기금형 퇴직연금 도입을 핵심으로 한 제도 개편에 착수한다. 퇴직연금 미도입 사업장의 90% 이상이 10인 미만 영세 소기업이며, 근속 1년 미만·주 15시간 미만 근로자는 의무화 대상에서 제외돼 사각지대가 남아 있다. 퇴직연금 자산의 약 75% 이상이 원리금 보장형에 묶여 있고 가입자의 80% 이상이 퇴직 시 일시금으로 수령하고 있어, 전문가들은 옵트아웃 방식의 연금 수령 유도를 제안한다. 기금형 체계에서는 수탁법인의 대리인 리스크를 통제하기 위한 인허가 기준과 수탁자 책임 명문화가 선행돼야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 3, "source": "헤럴드경제", "published": "2026-11-01", "url": "https://biz.heraldcorp.com/article/10920945", "related": []}, {"id": "6cdd5a295a3f", "title": "퇴직연금에 IMA·발행어음 편입 추진…증권사 연금시장 확대 기대", "summary": "정부가 지난달 29일 발표한 퇴직연금 기능강화 방안에서 DC·IRP 투자대상에 종합투자계좌(IMA)와 발행어음을 추가하고 현재 70%인 IRP 위험자산 투자 한도를 단계적으로 완화하기로 했다. 구체적인 완화 폭과 시행 시기는 향후 제도 정비 과정에서 결정된다. 금융회사가 단독 또는 컨소시엄으로 별도 수탁법인을 세우는 금융기관 개방형 기금도 도입돼 DC와 IRP에 적용되며, 증권사의 역할이 상품 공급에서 적립금 운용으로 넓어질 전망이다. 정부는 수탁법인에 가입자 이익 우선 의무와 손해배상책임, 운영위험준비금 적립 제도를 마련할 방침이다.", "category": "업계·경쟁사", urce": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "b7e8a161b6af", "title": "2028년부터 퇴직급여 사외적립 의무화… 체불 막는다", "summary": "근로자의 퇴직금 체불을 막기 위해 내후년부터 100인 이상 사업장을 대상으로 퇴직급여 사외 적립을 단계적으로 의무화하는 방안이 추진된다. 이형일 부총리 겸 재정경제부 장관과 배경훈 부총리 겸 과학기술정보통신부 장관은 28일 경제관계장관회의·과학기술관계장관회의 첫 연석회의에서 이 방안을 논의했으며, 기금형 퇴직연금의 구체적 도입 방안도 마련해 전문적인 자산 운용과 엄격한 수탁자 책임을 부과하기로 했다. 퇴직연금 사업자 평가 기준은 연금 성과 수익률 중심으로 개편하고, 디폴트옵션 적용 예정 통보 시점은 만기 후 4주에서 만기 전 2주로 앞당긴다. 구체적인 퇴직연금 기능 강화 방안은 29일 국회 기후에너지환경노동위원회 여당 위원과의 당정협의를 거쳐 발표된다.", "category": "제도·규제", "importance": 5, "source": "서울신문", "published": "2026-10-29", "url": "https://www.seoul.co.kr/news/economy/2026/10/29/20261029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "540조 퇴직연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936461/2"}, {"title": "퇴직연금, 전문가가 대신 굴린다…'기금형' 도입, 국민연금 참여는 미정", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6335473"}, {"title": "정부, 퇴직연금 기금형 활성화…IRP 위험자산 투자한도 상향 추진", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4441777"}, {"title": "기업 퇴직연금 모아 전문기관이 굴려… ‘쥐꼬리 수익’ 개선 기대", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936451/2"}, {"title": "국민연금, 기금형 퇴직연금 참여 미정···‘시장 개입 우려’에 국회로 공 넘긴 정부", "source": "경향신문", "url": "https://www.khan.co.kr/article/202610300600041"}, {"title": "[퇴직연금 개편] 퇴직연금도 국민연금처럼…정부, 장기 연금 수령 유도 방안 발표", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=620807"}, {"title": "퇴직연금 사외적립 2030년까지 전 사업장 의무화", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237470"}, {"title": "당정, ‘퇴직연금 강화·고용부 예산’ 살핀다…초광역특구법 논의 가능성", "source": "디지털타임스", "url": "https://www.dt.co.kr/article/12091950"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "f14fcbcde9b5", "title": "550조 퇴직연금 판 흔든다…국민연금 참여 '기금형 퇴직연금' 법안 발의", "summary": "더불어민주당 이용우 의원이 공동발의 12인과 함께 10월 2일 근로자퇴직급여 보장법 일부개정법률안을 발의했다. 개정안은 국민연금공단 등 공적연금관리기관이 기금형 퇴직연금 사업에 참여할 수 있도록 하고, 시장점유율 상한을 3년차 10%, 4년차 20%, 5년차 30%로 두었다. 2025년 말 퇴직연금 적립금은 501조4000억원이고 2024년 수익률은 4.77%로 같은 해 국민연금 수익률 15.0%를 밑돌았으며, 수수료는 2018년 8956억원에서 2025년 1조7748억원으로 98% 늘었다. 중소기업퇴직연금기금 가입 대상은 현재 100명 미만에서 2028년까지 300명 이하로 확대되고, 법안은 공포 후 1년이 지나 본격 시행된다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-10-07", "url": "http://www.globalepic.co.kr/view.php?ud=2026100708100769037cc35ccc5c_29", "related": [{"title": "'기금형 퇴직연금' 정기국회 논의 본격화 할 듯", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237123"}, {"title": "\"저조한 수익률, 높은 수수료\" 구조인 현행 계약형 퇴직연금 보완하는 기금형 퇴직연금 병행도입 필요", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=493587"}]}, {"id": "113078a9f394", "title": "퇴직연금 ‘100% 투자 가능’의 함정…원금까지 보장하진 않아", "summary": "금융감독원은 내년 1월부터 퇴직연금 매매화면과 상품검색 화면에 투자한도와 위험등급을 함께 표시하도록 개선한다고 27일 밝혔으며, 상품제안서와 적립금운용현황보고서에도 위험등급을 병기한다. 일부 사업자가 원금손실 가능성이 있는 상품도 '투자한도 100%'로만 안내해 가입자가 원리금보장형으로 오인할 수 있다는 판단에서다. 올해 상반기 말 퇴직연금 적립금 558조3000억원 가운데 실적배당형은 198조원이고, 이 중 ETF 투자 규모는 99조8000억원으로 50.4%를 차지했다. 일부 사업자는 전산개발 일정에 따라 내년 상반기 중 시행한다.", "category": "제도·규제", "importance": 4, "source": "메트로신문", "published": "2026-10-27", "url": "https://www.metroseoul.co.kr/article/20261027500104", "related": [{"title": "“퇴직연금 다 날릴 수도”…ETF 투자한도 100%의 함정 [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8699397&ref=A"}]}, {"id": "ad939b3f2b2a", "title": "공공기관 5곳 중 1곳, 퇴직연금 법정 기준 미달…최저 39%", "summary": "올해 8월 기준 DB형 퇴직연금을 도입한 공공기관 214곳 중 46곳(21.5%)의 적립률이 법정 최저 기준인 100%에 미달했다. 태권도진흥재단이 39.17%로 가장 낮았고 분당서울대병원 43.61%, 한국교통안전공단 46.35%, 한국도로교통공단 49.57%로 법정 기준의 절반에도 못 미쳤다. 근로자퇴직급여 보장법상 적립률이 95% 미만이면 사업주는 다음 회계연도까지 부족분의 3분의 1 이상을 메워야 하며, 이를 방치하면 최대 1천만원의 과태료가 부과될 수 있다. 김위상 의원은 공공기관이 체계적인 적립 계획을 조속히 마련해야 한다고 강조했다.", "category": "법인·자금운용", "importance": 4, "source": "연합뉴스", "published": "2026-10-12", "url": "https://www.yna.co.kr/view/AKR20261012029400530", "related": [{"title": "공공기관 5곳 중 1곳, 퇴직연금 적립금 법정 기준 못 채웠다", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10912175?ref=naver"}]}, {"id": "0369d6c3118c", "title": "퇴직연금 223조원 쌓인 5대은행…국민·하나 2위 각축전", "summary": "5대 시중은행의 3분기 말 퇴직연금 적립금은 222조9427억원으로 집계됐다. 신한은행이 57조2252억원으로 1위이고 KB국민은행 52조2226억원, 하나은행 52조1554억원, 우리은행 33조243억원, NH농협은행 28조3152억원 순이다. KB국민은행과 하나은행의 격차는 672억원으로, 2분기 말 3152억원에서 크게 좁혀져 지난해 말 725억원 수준으로 돌아왔다. 올해 누적 증가액은 하나은행 3조7741억원, KB국민은행 3조7688억원으로 53억원 차이다.", "category": "업계·경쟁사", "importance": 4, "source": "이데일리", "published": "2026-10-19", "url": "https://www.edaily.co.kr/News/Read?newsId=03496486645614560&mediaCodeNo=257", "related": [{"title": "퇴직연금 2위 경쟁 격화…하나은행·국민은행 적립금 격차 672억원", "source": "CEO스코어데일리", "url": "https://www.ceoscoredaily.com/page/view/2026102015471625110"}]}, {"id": "6c986a5b1bb4", "title": "한국투자증권, 기업 대상 ‘퇴직연금 아카데미’ 개최…제도 변화 대응 전략 제시", "summary": "한국투자증권은 지난 8일 서울 여의도 TP타워에서 기업 인사·재무 담당자 등 퇴직연금 실무자를 대상으로 ‘퇴직연금 아카데미’를 개최했다. 행사는 근로자퇴직급여 보장법 개정 추진에 맞춰 기금형 ·경쟁사", "importance": 4, "source": "아시아타임즈", "published": "2026-10-25", "url": "https://www.asiatime.co.kr/article/20261020500369", "related": [{"title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "source": "세이프타임즈", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652"}, {"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로
     그보다 넉넉히 잡아야 매일 아침 헛경보가 뜨지 않는다. */
  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
         + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

  function buildStaleNotice() {
    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
