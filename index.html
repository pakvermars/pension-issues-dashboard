후, 이제 풀어야 할 퇴직연금의 과제", "summary": "박준범 성균관대 겸임교수는 기금형 퇴직연금 도입보다 연금화 부진 해소가 더 시급하다고 지적했다. 계좌 기준 연금 수령 비율은 16.5%에 그치고 평균 근속연수가 7.1년이어서 퇴직급여가 축적되지 않으며, 2022~2024년 3년간 IRP 이전금액 63.8조 원 대비 해지금액이 43.4조 원으로 해지율이 68.1%에 달한다고 밝혔다. 2024년 중도인출의 81.9%는 주택 관련 사유였고, 5인 미만 사업장의 퇴직연금 도입률은 10%대에 머물러 있다. 기금형 도입을 넘어 연금화를 중심으로 제도 개혁을 진행해야 한다고 주장했다.", "category": "제도·규제", "importance": 4, "source": "한국보험신문", "published": "2026-09-14", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=92713"}, {"id": "e38f37f63d51", "title": "'주식·金 연금까지' 카카오뱅크, 종합금융플랫폼 도약", "summary": "카카오뱅크가 비은행 포트폴리오를 넓히며 퇴직연금 시장 진출을 준비하고 있다. 지난해부터 관련 인력을 채용해 왔고 삼정KPMG의 컨설팅을 마무리했다. 퇴직연금 적립금은 지난해 말 501조 4000억 원으로 500조 원을 처음 넘어섰고 올해 2분기 말 기준 553조 8779억 원에 이른다. 카카오뱅크의 2026년 상반기 당기순이익은 3280억 원으로 전년 동기 대비 24.4% 늘었으며, 주식투자·자동차금융 비교·금 거래 서비스를 차례로 내놓은 데 이어 내년 상반기 캐피탈 사업을 본격화할 계획이다.", "category": "업계·경쟁사", "importance": 4, "source": "한스경제", "published": "2026-09-14", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=864386"}, {"id": "4bb670783fd6", "title": "TDF 등 포트폴리오 백화점…상품 제조 유효성 관건", "summary": "디폴트옵션 상품이 TDF와 BF 등을 섞어 포트폴리오를 구성하면서 위험 수준을 맞추는 데만 초점을 둔 구성의 수익성이 의문이라는 지적이 나왔다. 2026년 2분기 공시 기준 최고 수익률은 적극투자형 BF 포트폴리오의 123% 수준이다. TDF2030과 TDF2050을 함께 담을 경우 중복자산 여부, 상관관계, 리밸런싱 기준 등을 검증해야 한다는 점이 과제로 꼽힌다. 남재우 자본시장연구원 선임연구위원은 포트폴리오 형식의 상품 구성에서 일부 비효율성이 지적된다며 단일 TDF나 BF 활용을 권고했다.", "category": "운용·상품", "importance": 3, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140525292179ad43907_18"}, {"id": "876b401f1169", "title": "ETF·연금 존재감 높인 KB운용…김영성, 비은행 성장동력 확대 과제 [새 사령탑 이재근號 KB금융]", "summary": "KB자산운용은 올해 상반기 별도 기준 영업이익 1059억 원, 당기순이익 783억 원으로 전년 동기 대비 각각 7.4%, 5.2% 증가했으며 9월 9일 기준 AUM은 210조 4981억 원으로 업계 3위다. 약 450조 원 규모 국내 ETF 시장에서 KB자산운용의 ETF 순자산은 35조 원대로 삼성·미래에셋에 이어 3위권을 형성하고 있다. 연금 시장에서는 TDF를 중심으로 올해 들어 3800억 원 이상이 순유입돼 7월 기준 전체 TDF 수탁고가 2조 5000억 원을 넘어섰다. 연말 임기가 만료되는 김영성 대표의 재신임 또는 교체 가능성에 관심이 모이고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=2026091315524667370f4390e77d_18"}, {"id": "56f1b68c9de7", "title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "summary": "윤석명 한국보건사회연구원 명예연구위원은 보건복지부의 기초연금 개편안이 지급 대상 70%를 그대로 둔 채 하위 30% 저소득 노인에게 월 3만 원을 더 주는 안에 그쳤다고 비판했다. 이 개편으로 내년 한 해 2조 5000억 원, 순증액 기준 6000억 원의 세금이 추가로 들어간다고 밝혔다. 국민연금 평균액이 월 73만 원이고 그중 절반이 50만 원 이하인 상황에서 기초연금의 '하후'만 대폭 늘리면 국민연금 성실 가입자와의 형평성 문제가 생긴다고 지적했다. 지급 대상을 줄이고 현금 외에 생필품·주택·의료 바우처 같은 현물 급여로 이원화해야 한다고 제안했다.", "category": "가입자·사회", "importance": 3, "source": "중앙일보", "published": "2026-09-14", "url": "https://www.joongang.co.kr/article/25461512"}, {"id": "c81365298c5d", "title": "파병 압박 직면에도 중국군사기업 투자…명단 필터링 없었다", "summary": "국민연금이 투자 대상의 중국군사기업(CMC) 지정 여부를 걸러내는 스크리닝 절차를 사실상 갖추지 않은 것으로 파악됐다. 보건복지부와 국민연금은 김용태 국민의힘 의원실에 기존 제재 위험 점검이 미 재무부 소관 금융제재 대상 기업 중심으로 이뤄진다고 보고했다. 국민연금은 블랙록에 위탁한 해외주식 계정으로 중국 광통신 장비업체 중지이노라이트의 코너스톤 투자 계약에 참여했는데, 미국 전쟁부는 계약 42일 전 이 회사를 CMC로 지정한 상태였다. 김 의원은 국민연금 투자심의 과정에 지정학적 위험을 공식적으로 다루는 사전 검토 절차가 필요하다고 지적했다.", "category": "가입자·사회", "importance": 3, "source": "머니투데이", "published": "2026-09-14", "url": "https://www.mt.co.kr/stock/2026/09/14/2026091115150236380"}, {"id": "17b98a6119d9", "title": "수령 기간이 은퇴 세금 좌우…개정 세법 100% 활용법", "summary": "개정 세법으로 연금 수령 21년 차 이후에는 퇴직소득세의 50%만 원천징수하는 감면 구간이 신설됐다. 특별한 자금 수요가 없다면 퇴직금을 일시금보다 연금으로 받는 편이 세금 측면에서 유리하다. 만 55세 이후 비교적 이른 시기에 연금 수령을 개시하되 21년 차까지 충분한 잔액을 남겨두는 설계가 필요하다. 연금수령연차별로 인정되는 금액 한도가 있어 초과분은 연금외수령으로 분류돼 감면 혜택을 받을 수 없으며, 사적연금은 건강보험료 부과 대상에 포함되지 않는다.", "category": "가입자·사회", "importance": 3, "source": "한경머니", "published": "2026-09-14", "url": "https://magazine.hankyung.com/money/article/202608141103c"}, {"id": "4dd1aae1b1aa", "title": "[ETF 포커스] \"퇴직연금에 달러 없다고요?…늙어서 생고생합니다\"", "summary": "김동명 미래에셋자산운용 채권운용본부장은 원화 인플레이션이 달러 인플레이션의 영향을 받는다는 점을 들어 퇴직연금에 달러 자산을 담아야 한다고 밝혔다. 단순히 달러를 보유하는 것보다 미국 주식이나 미국 채권에 투자하는 방식을 권했다. 법인형 미국달러 MMF 운용자산은 지난해 하반기 약 2조원에서 최근 약 8조원으로 늘었고, 7월 중순 이후에만 40% 이상 증가했다. 구체적 상품으로는 삼성전자 25%, SK하이닉스 25%, 미국 단기국채 50%로 구성된 TIGER 삼성전자SK하이닉스미국채혼합50을 제시했다.", "category": "운용·상품", "importance": 3, "source": "딜사이트", "published": "2026-09-14", "url": "https://dealsite.co.kr/articles/167943"}, {"id": "4d8d02fa8016", "title": "다가오는 2차 정년 연장 시대, 우리 회사 임금피크제는 안전한가?", "summary": "2단계 정년연장 논의가 진행되면서 임금피크제를 적용받는 고령 근로자의 퇴직급여 산정이 쟁점으로 떠올랐다. 대법원은 2022년 5월 임금피크제가 유효할 수 있으나 임금 감액이 합리적 범위 안에 있어야 한다고 판시했다. 임금피크제로 기본급이 깎이면 퇴직금 수령액이 함께 줄고, 확정급여형(DB)에서 확정기여형(DC)으로 전환할 때 추가 손실이 생길 수 있다는 점이 지적됐다. 기업은 임금 감액 기준을 명확히 하고 퇴직 관련 규정을 다시 점검할 필요가 있다고 짚었다.", "category": "제도·규제", "importance": 3, "source": "월간노동법률", "published": "2026-09-14", "url": "http://www.worklaw.co.kr/view/view.asp?accessSite=Naver&accessMethod=Search&accessMenu=News&in_cate=106&in_cate2=0&gopage=1&bi_pidx=39523"}, {"id": "8d0fe6970c96", "title": "퇴직연금 계좌로 국채 투자하면 포인트 제공", "summary": "삼성증권이 퇴직연금(IRP·DC) 계좌 보유자를 대상으로 '퇴직연금 개인투자용 국채 이벤트'를 12월 31일까지 진행한다. 퇴직연금 계좌에서 개인투자용 국채를 청약해 배정을 끝낸 고객 가운데 500명을 추첨해 1만 원 상당의 포인트 쿠폰을 준다. 개인투자용 국채는 정부가 발행하고 국가가 원리금 지급을 보장하며 만기까지 보유하면 표면금리에 가산금리를 더한 이율에 연복리가 적용된다. 퇴직연금은 위험자산 투자 한도가 적립금의 70%로 제한돼 나머지 자금을 안전자산으로 운용해야 하는데, 개인투자용 국채가 투자 대상에 포함되면서 안전자산 선택의 폭이 넓어졌다.", "category": "업계·경쟁사", "importance": 2, "source": "서울신문", "published": "2026-09-14", "url": "https://www.seoul.co.kr/news/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}, {"id": "41f6251cb26a", "title": "국민연금 1,400조 원, 방치된 리더십과 제도의 허점이 불러온 위기", "summary": "국민연금 기금운용본부가 약 1400조 원의 자산을 관리하고 있으나 본부장 장기 공석에 따른 리더십 부재와 운용 투명성 문제가 제기되고 있다. 자산 운용의 방향성 결여와 내부 통제 시스템 부족, 투명한 인선 과정 부재와 권한 남용 우려가 주요 문제로 지적됐다. 단기 체류 외국인이 제도를 악용해 노령연금을 수령한 사례도 함께 거론됐다. 기사는 일본 공적연금과 노르웨이 국부펀드처럼 명확한 지배구조 확립, 감사 기능의 독립성 강화, 제도 형평성 정비가 필요하다고 촉구했다.", "category": "가입자·사회", "importance": 2, "source": "공감신문", "published": "2026-09-14", "url": "https://www.gokorea.kr/news/articleView.html?idxno=878226"}, {"id": "32476c4e52ab", "title": "일본 IFA, 자산형성과 함께 은퇴 이후 리스크 관리 과제", "summary": "지난 8월 19일 도쿄에서 '일본 IFA 포럼 2026'이 열려 IFA와 보험대리점, 재무설계사 약 300명이 참석했다. 일본에서는 자산운용 활성화 정책이 확대되면서 IFA의 역할이 자산형성을 넘어 은퇴 후 자산활용과 사업승계로 넓어지고 있다. 일본 가계 금융자산은 약 2400조 엔이지만 투자자산 비중은 여전히 낮다. 기업형 DC를 도입한 사업장은 약 6만 곳으로 후생연금보험 적용 사업장 약 291만 곳에 견줘 극히 저조한 상태다.", "category": "가입자·사회", "importance": 2, "source": "한국보험신문", "published": "2026-09-14", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=92688"}, {"id": "4fae7e628d13", "title": "\"퇴사할게요\" 외치던 직원 붙잡은 이것…美 기업들 속속 되살린다는데", "summary": "IBM과 JBS푸즈, 노스웰헬스 등 미국 기업들이 2008년 금융위기 이후 동결했던 기업연금을 인력 확보를 위해 되살리고 있다. 미국 민간부문 기업연금 가입률은 1988년 약 30%에서 2024년 10% 아래로 떨어진 상태다. 회사가 매년 임금의 일정 비율을 적립하고 일정 수익률을 보장하는 캐시 밸런스 연금을 운영하는 고용주는 2001년 1477곳에서 2023년 약 2만6000곳으로 늘었다. 미국 100대 기업연금의 자산 대비 부채 비율은 2012년 77%에서 현재 112%로 개선됐다.", "category": "법인·자금운용", "importance": 2, "source": "아시아경제", "published": "2026-09-14", "url": "https://view.asiae.co.kr/article/2026091410010134401"}, {"id": "07dff08799da", "title": "삼성증권, WM 성장에 발행어음까지…올해 순이익 67%↑ 전망", "summary": "현대차증권은 삼성증권의 올해 순이익이 전년 대비 67.1% 늘어난 1조7000억원에 이를 것으로 전망했다. 투자의견은 매수, 목표주가는 14만6000원을 제시했다. 랩어카운트와 퇴직연금이 빠르게 성장하면서 경상수익원이 확대되고 있고, 이것이 실적 안정성과 주주환원을 뒷받침할 것으로 평가했다. 전체 WM 손익은 전년 대비 136.7% 증가할 것으로 내다봤다.", "category": "업계·경쟁사", "importance": 2, "source": "프라임경제", "published": "2026-09-14", "url": "http://www.newsprime.co.kr/news/article.html?no=747517"}, {"id": "982776ab1eb5", "title": "삼성생명에 떨어진 2.5조 '배당잭팟'…돈 어디로 갈까", "summary": "삼성전자가 올해 약 30조원의 현금배당을 계획하면서 지분 8.51%를 가진 삼성생명이 약 2조5500억원의 배당수익을 거둘 것으로 예상된다. 삼성생명은 1986년부터 쌓인 11조3000억원의 유배당보험 결손을 먼저 보전해야 해 배당수익 일부가 여기에 우선 쓰인다고 밝혔다. 남은 재원은 2028년까지 총주주환원율 50% 목표를 위한 주주환원이나 글로벌 M&A에 투입될 수 있다. 인수 후보로는 보험과 퇴직연금, 자산운용을 함께 영위하는 미국 프린시플파이낸셜그룹(PFG) 지분 15% 확보 방안이 거론된다.", "category": "업계·경쟁사", "importance": 2, "source": "딜사이트", "published": "2026-09-14", "url": "https://dealsite.co.kr/articles/168832"}, {"id": "1a6f6f174864", "title": "\"양종희 깜짝 교체에...\" KB증권·운용 CEO 인선도 '촉각' [fn마켓워치]", "summary": "양종희 KB금융지주 회장의 연임이 불발되면서 KB증권과 KB자산운용 등 금융투자 계열사의 CEO 인사에 변수가 생겼다. 이재근 KB금융 부문장이 차기 회장으로 결정돼 11월 새 체제가 출범한 뒤 연말에 계열사 인사가 이뤄질 예정이다. 증권과 운용을 따로 떼어 보기보다 그룹의 자산관리와 자본시장 전략 안에서 재배치할 가능성이 거론된다. WM과 퇴직연금, ETF 등 자산관리 사업을 어떻게 연결하느냐가 인선의 변수로 꼽힌다.", "category": "업계·경쟁사", "importance": 2, "source": "파이낸셜뉴스", "published": "2026-09-14", "url": "https://www.fnnews.com/news/202609140913040724"}, {"id": "7247f22b0206", "title": "미국 노인들은 왜 배당주를 모을까 ②", "summary": "미국 은퇴자들은 사회보장연금과 은퇴계좌에 배당 같은 투자소득을 더해 노후 현금흐름을 만든다. 투자 기간이 길면 당장의 높은 배당보다 배당이 꾸준히 늘어날 수 있는지를 보고, 은퇴 이후에는 높은 수익률보다 안정적으로 오래 현금흐름을 만들 수 있는지가 중요해진다. 한미 조세조약 요건을 충족하는 한국 거주 개인 투자자의 미국 배당에는 미국에서 통상 15%의 원천징수가 적용되며, 국내에서도 외국납부세액을 고려하는 제도가 있어 양국 세율을 단순히 더해 계산하는 것은 정확하지 않다. 기사는 국민연금과 퇴직연금을 기본으로 개인연금과 예금 이자, 배당 등 여러 소득원을 더해 생활비를 만드는 구조가 필요하다고 정리했다.", "category": "가입자·사회", "importance": 1, "source": "여성조선", "published": "2026-09-14", "url": "http://woman.chosun.com/news/articleView.html?idxno=126542"}]}, "weekly": {"period": "weekly", "key": "2026-W38", "label": "2026-W38 (2026-09-14 ~ 2026-09-20)", "generated_at": "2026-09-14T19:37:20+09:00", "item_count": 19, "shortfall_note": "이 기간에 모인 이슈는 19건입니다.", "items": [{"id": "8977649855f9", "title": "표류하는 기금형 퇴직연금…간담회 또 연기", "summary": "고용노동부와 금융감독원이 공동 주재하는 퇴직연금사업자 간담회가 9월 2일에서 10월 2일로 재차 연기됐다. 한 달 새 두 번째 순연으로, 간담회는 10월 2일 오후 2시부터 3시 30분까지 서울 로얄호텔에서 김영훈 고용노동부 장관과 이찬진 금융감독원장이 함께 주재한다. 국민연금공단의 기금형 퇴직연금 참여 여부, 수탁법인 인가 대상을 5~8개로 제한하는 방안을 둘러싼 독점 우려, 손해배상 책임 강화 방침이 쟁점으로 남아 있다. 연내 근로자퇴직급여보장법 개정안 통과 목표의 재조정이 불가피하다는 관측이 나온다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-09-14", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": []}, {"id": "ffde5c86587a", "title": "'공시 넘어 사후관리'…디폴트옵션 3년, 최초 평가 시동", "summary": "고용노동부가 올해 디폴트옵션 승인 상품에 대한 첫 정기 평가를 실시한다. 2023년 7월 본격 시행된 디폴트옵션은 올해 3월 기준 41개 금융기관이 324개 상품을 승인받아 운용 중이며, 최초 승인 이후 3년이 지난 상품이 평가 대상으로 장기 성과 수익률과 위험 관리 등을 본다. 고용노동부는 첫 평가인 만큼 성과 저조 사유를 파악하고 개선 방안을 마련하는 데 핵심 의의를 두되, 문제가 지속되는 상품에는 불이익을 부여할 계획이다. 5월에 선정한 정책연구용역은 내년 2월까지 진행된다.", "category": "제도·규제", "importance": 5, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140567806179ad43907_18", "related": []}, {"id": "f47b64e3cece", "title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 확정 수익 60%\"", "summary": "이번 달부터 개인형(IRP)과 확정기여형(DC) 퇴직연금 계좌에서 10년물·20년물 개인투자용 국채를 매입할 수 있게 됐다. 10년물 금리는 현재 4.765%로 만기까지 보유하면 수익률이 59.3%, 20년물은 161.3%에 달한다. 국채 전용계좌로 투자하면 이자 수익의 15.4%를 세금으로 내지만 퇴직연금에서는 만기 전까지 과세가 되지 않고 55세 이후 연금으로 받으면 3.5~5.5%의 연금소득세만 내며, 연말정산 때 연금저축과 합쳐 최대 148만 5000원을 세액공제받을 수 있다. 청약 수요가 발행 한도를 넘기면 1인당 300만 원까지 일괄 배정되고 남은 물량은 청약액에 비례해 배분되며, 신청은 화요일까지 시중은행 3곳과 증권사 5곳에서 받는다.", "category": "운용·상품", "importance": 4, "source": "TV조선", "published": "2026-09-14", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/14/2026091490036.html", "related": [{"title": "퇴직연금 계좌로 국채 투자하면 포인트 제공", "source": "서울신문", "url": "https://www.seoul.co.kr/news/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}]}, {"id": "07602bd7cfce", "title": "[시론] 기금형 제도 도입 이후, 이제 풀어야 할 퇴직연금의 과제", "summary": "박준범 성균관대 겸임교수는 기금형 퇴직연금 도입보다 연금화 부진 해소가 더 시급하다고 지적했다. 계좌 기준 연금 수령 비율은 16.5%에 그치고 평균 근속연수가 7.1년이어서 퇴직급여가 축적되지 않으며, 2022~2024년 3년간 IRP 이전금액 63.8조 원 대비 해지금액이 43.4조 원으로 해지율이 68.1%에 달한다고 밝혔다. 2024년 중도인출의 81.9%는 주택 관련 사유였고, 5인 미만 사업장의 퇴직연금 도입률은 10%대에 머물러 있다. 기금형 도입을 넘어 연금화를 중심으로 제도 개혁을 진행해야 한다고 주장했다.", "category": "제도·규제", "importance": 4, "source": "한국보험신문", "published": "2026-09-14", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=92713", "related": []}, {"id": "e38f37f63d51", "title": "'주식·金 연금까지' 카카오뱅크, 종합금융플랫폼 도약", "summary": "카카오뱅크가 비은행 포트폴리오를 넓히며 퇴직연금 시장 진출을 준비하고 있다. 지난해부터 관련 인력을 채용해 왔고 삼정KPMG의 컨설팅을 마무리했다. 퇴직연금 적립금은 지난해 말 501조 4000억 원으로 500조 원을 처음 넘어섰고 올해 2분기 말 기준 553조 8779억 원에 이른다. 카카오뱅크의 2026년 상반기 당기순이익은 3280억 원으로 전년 동기 대비 24.4% 늘었으며, 주식투자·자동차금융 비교·금 거래 서비스를 차례로 내놓은 데 이어 내년 상반기 캐피탈 사업을 본격화할 계획이다.", "category": "업계·경쟁사", "importance": 4, "source": "한스경제", "published": "2026-09-14", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=864386", "related": []}, {"id": "4bb670783fd6", "title": "TDF 등 포트폴리오 백화점…상품 제조 유효성 관건", "summary": "디폴트옵션 상품이 TDF와 BF 등을 섞어 포트폴리오를 구성하면서 위험 수준을 맞추는 데만 초점을 둔 구성의 수익성이 의문이라는 지적이 나왔다. 2026년 2분기 공시 기준 최고 수익률은 적극투자형 BF 포트폴리오의 123% 수준이다. TDF2030과 TDF2050을 함께 담을 경우 중복자산 여부, 상관관계, 리밸런싱 기준 등을 검증해야 한다는 점이 과제로 꼽힌다. 남재우 자본시장연구원 선임연구위원은 포트폴리오 형식의 상품 구성에서 일부 비효율성이 지적된다며 단일 TDF나 BF 활용을 권고했다.", "category": "운용·상품", "importance": 3, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140525292179ad43907_18", "related": []}, {"id": "876b401f1169", "title": "ETF·연금 존재감 높인 KB운용…김영성, 비은행 성장동력 확대 과제 [새 사령탑 이재근號 KB금융]", "summary": "KB자산운용은 올해 상반기 별도 기준 영업이익 1059억 원, 당기순이익 783억 원으로 전년 동기 대비 각각 7.4%, 5.2% 증가했으며 9월 9일 기준 AUM은 210조 4981억 원으로 업계 3위다. 약 450조 원 규모 국내 ETF 시장에서 KB자산운용의 ETF 순자산은 35조 원대로 삼성·미래에셋에 이어 3위권을 형성하고 있다. 연금 시장에서는 TDF를 중심으로 올해 들어 3800억 원 이상이 순유입돼 7월 기준 전체 TDF 수탁고가 2조 5000억 원을 넘어섰다. 연말 임기가 만료되는 김영성 대표의 재신임 또는 교체 가능성에 관심이 모이고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=2026091315524667370f4390e77d_18", "related": []}, {"id": "56f1b68c9de7", "title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "summary": "윤석명 한국보건사회연구원 명예연구위원은 보건복지부의 기초연금 개편안이 지급 대상 70%를 그대로 둔 채 하위 30% 저소득 노인에게 월 3만 원을 더 주는 안에 그쳤다고 비판했다. 이 개편으로 내년 한 해 2조 5000억 원, 순증액 기준 6000억 원의 세금이 추가로 들어간다고 밝혔다. 국민연금 평균액이 월 73만 원이고 그중 절반이 50만 원 이하인 상황에서 기초연금의 '하후'만 대폭 늘리면 국민연금 성실 가입자와의 형평성 문제가 생긴다고 지적했다. 지급 대상을 줄이고 현금 외에 생필품·주택·의료 바우처 같은 현물 급여로 이원화해야 한다고 제안했다.", "category": "가입자·사회", "importance": 3, "source": "중앙일보", "published": "2026-09-14", "url": "https://www.joongang.co.kr/article/25461512", "related": []}, {"id": "c81365298c5d", "title": "파병 압박 직면에도 중국군사기업 투자…명단 필터링 없었다", "summary": "국민연금이 투자 대상의 중국군사기업(CMC) 지정 여부를 걸러내는 스크리닝 절차를 사실상 갖추지 않은 것으로 파악됐다. 보건복지부와 국민연금은 김용태 국민의힘 의원실에 기존 제재 위험 점검이 미 재무부 소관 금융제재 대상 기업 중심으로 이뤄진다고 보고했다. 국민연금은 블랙록에 위탁한 해외주식 계정으로 중국 광통신 장비업체 중지이노라이트의 코너스톤 투자 계약에 참여했는데, 미국 전쟁부는 계약 42일 전 이 회사를 CMC로 지정한 상태였다. 김 의원은 국민연금 투자심의 과정에 지정학적 위험을 공식적으로 다루는 사전 검토 절차가 필요하다고 지적했다.", "category": "가입자·사회", "importance": 3, "source": "머니투데이", "published": "2026-09-14", "url": "https://www.mt.co.kr/stock/2026/09/14/2026091115150236380", "related": []}, {"id": "17b98a6119d9", "title": "수령 기간이 은퇴 세금 좌우…개정 세법 100% 활용법", "summary": "개정 세법으로 연금 수령 21년 차 이후에는 퇴직소득세의 50%만 원천징수하는 감면 구간이 신설됐다. 특별한 자금 수요가 없다면 퇴직금을 일시금보다 연금으로 받는 편이 세금 측면에서 유리하다. 만 55세 이후 비교적 이른 시기에 연금 수령을 개시하되 21년 차까지 충분한 잔액을 남겨두는 설계가 필요하다. 연금수령연차별로 인정되는 금액 한도가 있어 초과분은 연금외수령으로 분류돼 감면 혜택을 받을 수 없으며, 사적연금은 건강보험료 부과 대상에 포함되지 않는다.", "category": "가입자·사회", "importance": 3, "source": "한경머니", "published": "2026-09-14", "url": "https://magazine.hankyung.com/money/article/202608141103c", "related": []}, {"id": "4dd1aae1b1aa", "title": "[ETF 포커스] \"퇴직연금에 달러 없다고요?…늙어서 생고생합니다\"", "summary": "김동명 미래에셋자산운용 채권운용본부장은 원화 인플레이션이 달러 인플레이션의 영향을 받는다는 점을 들어 퇴직연금에 달러 자산을 담아야 한다고 밝혔다. 단순히 달러를 보유하는 것보다 미국 주식이나 미국 채권에 투자하는 방식을 권했다. 법인형 미국달러 MMF 운용자산은 지난해 하반기 약 2조원에서 최근 약 8조원으로 늘었고, 7월 중순 이후에만 40% 이상 증가했다. 구체적 상품으로는 삼성전자 25%, SK하이닉스 25%, 미국 단기국채 50%로 구성된 TIGER 삼성전자SK하이닉스미국채혼합50을 제시했다.", "category": "운용·상품", "importance": 3, "source": "딜사이트", "published": "2026-09-14", "url": "https://dealsite.co.kr/articles/167943", "related": []}, {"id": "4d8d02fa8016", "title": "다가오는 2차 정년 연장 시대, 우리 회사 임금피크제는 안전한가?", "summary": "2단계 정년연장 논의가 진행되면서 임금피크제를 적용받는 고령 근로자의 퇴직급여 산정이 쟁점으로 떠올랐다. 대법원은 2022년 5월 임금피크제가 유효할 수 있으나 임금 감액이 합리적 범위 안에 있어야 한다고 판시했다. 임금피크제로 기본급이 깎이면 퇴직금 수령액이 함께 줄고, 확정급여형(DB)에서 확정기여형(DC)으로 전환할 때 추가 손실이 생길 수 있다는 점이 지적됐다. 기업은 임금 감액 기준을 명확히 하고 퇴직 관련 규정을 다시 점검할 필요가 있다고 짚었다.", "category": "제도·규제", "importance": 3, "source": "월간노동법률", "published": "2026-09-14", "url": "http://www.worklaw.co.kr/view/view.asp?accessSite=Naver&accessMethod=Search&accessMenu=News&in_cate=106&in_cate2=0&gopage=1&bi_pidx=39523", "related": []}, {"id": "41f6251cb26a", "title": "국민연금 1,400조 원, 방치된 리더십과 제도의 허점이 불러온 위기", "summary": "국민연금 기금운용본부가 약 1400조 원의 자산을 관리하고 있으나 본부장 장기 공석 , "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "ffde5c86587a", "title": "'공시 넘어 사후관리'…디폴트옵션 3년, 최초 평가 시동", "summary": "고용노동부가 올해 디폴트옵션 승인 상품에 대한 첫 정기 평가를 실시한다. 2023년 7월 본격 시행된 디폴트옵션은 올해 3월 기준 41개 금융기관이 324개 상품을 승인받아 운용 중이며, 최초 승인 이후 3년이 지난 상품이 평가 대상으로 장기 성과 수익률과 위험 관리 등을 본다. 고용노동부는 첫 평가인 만큼 성과 저조 사유를 파악하고 개선 방안을 마련하는 데 핵심 의의를 두되, 문제가 지속되는 상품에는 불이익을 부여할 계획이다. 5월에 선정한 정책연구용역은 내년 2월까지 진행된다.", "category": "제도·규제", "importance": 5, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140567806179ad43907_18", "related": []}, {"id": "69dd458f15f4", "title": "퇴직연금 550조 커졌는데…보험사 점유율 20% 무너졌다", "summary": "퇴직연금 시장이 553조원대로 커지는 사이 보험업계 점유율이 20% 아래로 떨어졌다. 상반기 증권사는 4조1000억원 순유입을 기록한 반면 보험사는 1799억원 순유출을 냈다. 실물이전 확대로 가입자가 금융사를 옮기기 쉬워지면서 사업자 간 경쟁이 격화된 결과다. DB형에 집중된 포트폴리오가 약점으로 지목되자 삼성·한화·교보생명 등이 DC형·IRP 강화와 ETF 상품 확대로 대응하고 있다.", "category": "업계·경쟁사", "importance": 5, "source": "뉴데일리", "published": "2026-09-10", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/10/2026091000173.html", "related": []}, {"id": "de4a8500263d", "title": "수익률 32%에도 돈이 안 온다…디폴트옵션의 역설", "summary": "디폴트옵션 시행 3년 차 데이터에서 적극투자형 1년 수익률이 32.66%를 기록했으나 자금의 82.5%는 여전히 안정형에 머물러 있다. 은행권은 고객 자금 대부분을 안정형에 두는 반면 증권사 고객은 위험자산에 투자해 업권별로 뚜렷이 갈렸다. 제도의 병목은 상품 품질이 아니라 자금이 좋은 상품에 도달하는 경로에 있다는 지적이다.", "category": "운용·상품", "importance": 5, "source": "한경머니", "published": "2026-09-10", "url": "https://magazine.hankyung.com/money/article/202608199155c", "related": []}, {"id": "937d44176934", "title": "퇴직연금 6.9조 이동…은행서 증권사로 자금 쏠림, 국채로 2차 경쟁", "summary": "올해 상반기 퇴직연금 실물이전 규모가 약 6조9000억원으로 전년 동기 약 3조2000억원의 2.2배에 달해 2024년 제도 시행 이후 반기 기준 최대를 기록했다. 업권별로는 증권사가 4조1513억원 순유입, 은행이 3조9714억원 순유출, 보험이 1799억원 순유출이었고, 증권사 적립금은 2분기 말 165조468억원으로 1분기 대비 16.5% 늘어 은행권 증가율 6.6%를 크게 앞섰다. 실물이전 규모는 가입자가 직접 상품을 고르는 IRP에서 6조8000억원으로 가장 컸다. 9월부터 개인투자용 국채가 DC·IRP 계좌에 편입되면서 증권사는 안정형 상품까지 더해 고객 확보에 나서고, 은행권은 ETF 거래 편의성 개선으로 맞서고 있다.", "category": "운용·상품", "importance": 5, "source": "더트래커", "published": "2026-09-10", "url": "https://thetracker.co.kr/View.aspx?No=4221950", "related": []}, {"id": "6dd0fa0960d5", "title": "퇴직연금 디폴트옵션 첫 순유출…2분기 1조4000억 감소", "summary": "디폴트옵션 운용자금이 2023년 제도 도입 후 처음으로 순유출을 기록해 2분기에 약 1조4000억원이 줄었다. 안정형에서만 1조4891억원이 빠져나갔고, 증시 호황으로 위험자산 투자가 늘면서 자금이 대거 이동했다. 평가액 기준 적립액 증가는 117억원에 그쳐 시장 전체 증가분 45조2000억원에 비하면 미미한 수준이다.", "category": "운용·상품", "importance": 5, "source": "한국경제", "published": "2026-09-08", "url": "https://www.hankyung.com/article/202609081009i", "related": []}, {"id": "362d60df2f63", "title": "퇴직연금도 자산배분 시대…NH투자증권, DB 적립금 컨설팅 강화", "summary": "NH투자증권이 연금자산관리본부 산하 DB적립금 운용 협의체를 통해 기업별 맞춤형 IPS(적립금운용계획서) 컨설팅을 확대한다. DB형은 적립금 수익률이 임금상승률에 못 미치면 기업이 추가 적립을 부담해야 해 자산배분 전략의 필요성이 커지고 있다. 전담 계리사와 자산배분·포트폴리오 전문가로 구성된 협의체가 부채 분석부터 리밸런싱까지 5단계로 지원한다. 고객사 한국선급은 IPS 개정 후 DB 적립금 1년 수익률이 5월 말 기준 20%를 넘어 고용노동부·금융감독원 모범사례로 선정됐다.", "category": "법인·자금운용", "importance": 5, "source": "매일경제", "published": "2026-09-08", "url": "https://www.mk.co.kr/news/stock/12147172", "related": []}, {"id": "f7cf0468c30c", "title": "정부, 올 하반기 퇴직연금 디폴트옵션 손질", "summary": "고용노동부가 올해 하반기 기금형 퇴직연금 도입과 함께 디폴트옵션(사전지정운용제도)도 개편하겠다고 밝혔다. 대기기간과 디폴트옵션 상품 평가체계를 명확히 하고, 현재 제도가 적용되지 않는 자금까지 적용 범위를 넓히는 것이 핵심이다. 현재 디폴트옵션 자금의 82.5%가 안정형에 쏠려 있는 점도 개선 대상으로 지목됐다. 정부는 퇴직연금 의무화와 사외적립 의무화를 함께 추진하며 올 하반기를 퇴직연금 대격변기로 보고 있다.", "category": "제도·규제", "importance": 5, "source": "파이낸셜뉴스", "published": "2026-09-07", "url": "https://www.fnnews.com/news/202609071643275392", "related": []}, {"id": "07602bd7cfce", "title": "[시론] 기금형 제도 도입 이후, 이제 풀어야 할 퇴직연금의 과제", "summary": "박준범 성균관대 겸임교수는 기금형 퇴직연금 도입보다 연금화 부진 해소가 더 시급하다고 지적했다. 계좌 기준 연금 수령 비율은 16.5%에 그치고 평균 근속연수가 7.1년이어서 퇴직급여가 축적되지 않으며, 2022~2024년 3년간 IRP 이전금액 63.8조 원 대비 해지금액이 43.4조 원으로 해지율이 68.1%에 달한다고 밝혔다. 2024년 중도인출의 81.9%는 주택 관련 사유였고, 5인 미만 사업장의 퇴직연금 도입률은 10%대에 머물러 있다. 기금형 도입을 넘어 연금화를 중심으로 제도 개혁을 진행해야 한다고 주장했다.", "category": "제도·규제", "importance": 4, "source": "한국보험신문", "published": "2026-09-14", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=92713", "related": []}, {"id": "e38f37f63d51", "title": "'주식·金 연금까지' 카카오뱅크, 종합금융플랫폼 도약", "summary": "카카오뱅크가 비은행 포트폴리오를 넓히며 퇴직연금 시장 진출을 준비하고 있다. 지난해부터 관련 인력을 채용해 왔고 삼정KPMG의 컨설팅을 마무리했다. 퇴직연금 적립금은 지난해 말 501조 4000억 원으로 500조 원을 처음 넘어섰고 올해 2분기 말 기준 553조 8779억 원에 이른다. 카카오뱅크의 2026년 상반기 당기순이익은 3280억 원으로 전년 동기 대비 24.4% 늘었으며, 주식투자·자동차금융 비교·금 거래 서비스를 차례로 내놓은 데 이어 내년 상반기 캐피탈 사업을 본격화할 계획이다.", "category": "업계·경쟁사", "importance": 4, "source": "한스경제", "published": "2026-09-14", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=864386", "related": []}, {"id": "9b969dc48569", "title": "500조 퇴직연금 '장투' 이어지도록… 구조 바꾸고 혜택 늘려야 [시험대 오른 자본시장]", "summary": "퇴직연금 적립금은 2020년 말 255조5000억원에서 지난해 말 501조4000억원으로 5년 만에 2배로 늘었다. 그러나 최근 10년 평균 수익률은 2.64%로 국민연금의 7.93%에 크게 못 미치는데, 원리금보장상품 비중이 75.4%에 달하기 때문이다. 전문가들은 타깃데이트펀드 자동배분 도입 등 제도 개편과 연금계좌의 국내 투자 세제혜택을 검토해야 한다고 지적했다. 일본처럼 ISA를 단기 절세상품이 아닌 생애주기형 자산관리 플랫폼으로 전환할 필요가 있다는 제언도 나왔다.", "category": "운용·상품", "importance": 4, "source": "파이낸셜뉴스", "published": "2026-09-13", "url": "https://www.fnnews.com/news/202609131811420430", "related": []}, {"id": "99fcd85edc4b", "title": "[내 퇴직연금 뜯어보니 ③] '선택과 책임은 노동자, 결정은 회사' 구조 바꾸려면?", "summary": "고용노동부가 내년 퇴직연금사업자 평가제도를 전면 개편한다. 정성평가 비중을 줄이고 수익률 등 정량평가를 강화해 전체 사업자의 순위를 공개하는 방안을 추진하며, 교육·정보제공 의무도 주기적으로 점검한다. 지난해 퇴직연금 수익률은 6.47%로 제도 도입 이후 최고치였지만, 적립금의 84%를 실적배당형에 넣은 상위 10%는 평균 19.5%, 원리금보장형에 74%를 둔 하위 10%는 0.5%에 그쳤다. 지난해 유형별 수익률은 DC형 8.47%, IRP 9.44%, DB형 3.53%였다.", "category": "제도·규제", "importance": 4, "source": "매일노동뉴스", "published": "2026-09-11", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236734", "related": []}, {"id": "d08069641dee", "title": "디폴트옵션 안정형 85% '쏠림'…위험회피 연금 가입자들 [디폴트옵션 작동 구조 (상)]", "summary": "2025년 말 기준 디폴트옵션 투자유형 가운데 안정형 적립금이 45조5000억원으로 전체 53조3000억원의 85.4%를 차지했다. 안정형을 지정한 가입자수도 583만명으로 전체 734만명의 79.4%에 달했다. 반대편인 적극투자형은 적립금 1조4000억원으로 전체의 2.6%, 가입자 39만명으로 5.3%에 그쳤다. 안정투자형 적립금은 3조9000억원(7.3%), 중립투자형은 2조5000억원이었다.", "category": "운용·상품", "importance": 4, "source": "한국금융신문", "published": "2026-09-11", "url": "https://www.fntimes.com/html/view.php?ud=202609102100372851179ad43907_18", "related": []}, {"id": "7280de2d77b4", "title": "국채 이어 IMA까지…퇴직연금 확대에 증권사 희비 엇갈릴까", "summary": "이달부터 확정기여형(DC)과 개인형퇴직연금(IRP) 계좌에서 개인투자용 국채 10년물과 20년물에 직접 투자할 수 있게 됐고 첫 청약은 지난 9일 시작됐다. 고용노동부와 금융감독원은 지난 3월 발행어음과 종합투자계좌(IMA)의 퇴직연금 투자 허용을 금융위원회에 건의할 예정이라고 밝혔다. 자본시장연구원에 따르면 2025년 말 기준 전체 퇴직연금 시장에서 증권업 점유율은 26.2%, IRP에서는 35.5%다. IMA는 자기자본 8조원 이상 종합금융투자사업자로 취급이 제한돼 현재 미래에셋증권·한국투자증권·NH투자증권 3개사만 가능한 만큼, 허용될 경우 증권사 간 상품 라인업 격차가 벌어질 수 있다는 우려가 나온다.", "category": "제도·규제", "importance": 4, "source": "뉴스웨이", "published": "2026-09-11", "url": "https://www.newsway.co.kr/news/view?ud=2026091114253182016", "related": []}, {"id": "f9a40df55bf5", "title": "무늬만 디폴트옵션, 수익률 2.6%…원금보장에 묶인 500조 퇴직연금", "summary": "501조원대로 불어난 퇴직연금 적립금 가운데 75%가 원리금보장상품에 집중돼 있다. 10년 평균 수익률은 2.64%에 그쳤다. 2023년 도입한 디폴트옵션도 85%가 안정형에 쏠려 제 역할을 못 하고 있다. 자본시장연구원은 옵트아웃 방식 도입과 기금형 퇴직연금 제도 개편을 제안했다.", "category": "운용·상품", "importance": 4, "source": "한국경제", "published": "2026-09-04", "url": "https://www.hankyung.com/article/202609044729i", "related": []}, {"id": "68d755a82ff5", "title": "500조 쌓였는데 노후 월급은 글쎄…몸집 두 배에도 지갑은 불안", "summary": "퇴직연금 적립금은 2020년 말 255조5000억원에서 2025년 말 501조4000억원으로 96.2% 늘었다. 그러나 전체 적립금의 75.4%가 여전히 원리금보장상품에 머물러 있다. 퇴직연금을 연금 형태로 받는 비율은 2023년 기준 10.4%에 불과하고 대부분 일시금으로 수령한다. 물가상승과 은퇴 후 장기 생활비를 감안하면 현행 저축 관행으로는 충분한 연금자산 축적이 어렵다는 지적이 나온다.", "category": "가입자·사회", "importance": 4, "source": "파이낸셜뉴스", "published": "2026-09-04", "url": "https://www.fnnews.com/news/202609041101420971", "related": []}, {"id": "f5ea3a852b40", "title": "퇴직연금, 저축 아닌 투자로 수익률 높여야…국민연금 참여는 반대", "summary": "자본시장연구원 남재우 선임연구위원이 초고령화 사회에서 퇴직연금 운용을 저축에서 투자로 전환해야 한다고 주장했다. 500조원 규모 퇴직연금이 원리금보장상품에 집중돼 노후를 보장하기엔 수익률이 낮다는 평가다. 기금형 제도로 전문적 자산배분을 하면 수익률을 7~8%로 높여 소득대체율 30%를 달성할 수 있다고 제언했다. 다만 기금형에 국민연금공단이 참여하는 데는 반대 입장을 냈다.", "category": "법인·자금운용", "importance": 4, "source": "머니투데이", "published": "2026-09-04", "url": "https://www.mt.co.kr/stock/2026/09/04/2026090416003220980", "related": []}]}, "yearly": {"period": "yearly", "key": "2026", "label": "2026년", "generated_at": "2026-09-14T19:37:21+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": [{"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 확정 수익 60%\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/14/2026091490036.html"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 60% 확정 수익\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/13/2026091390109.html"}, {"title": "“20년 묻어두면 수익률 161%”…퇴직연금 국채, 증권사 유치전 불붙었다", "source": "디지털데일리", "url": "https://www.ddaily.co.kr/page/view/2026091010295983047"}, {"title": "“예금 이자론 성 안 차”…은행 퇴직연금, 국채 품고 반격할까", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1688375/"}, {"title": "\"월급 끊겨도 매달 400만원 들어옵니다\"…은퇴 앞둔 직장인이 알아야 할 자산", "source": "매일경제", "url": "https://www.mk.co.kr/article/12151487"}, {"title": "개인투자용 국채 품은 퇴직연금 계좌···증권사, 연금자금 유치전", "source": "서울파이낸스", "url": "https://www.seoulfn.com/news/articleView.html?idxno=637698"}, {"title": "퇴직연금 계좌로 국채 투자하면 포인트 제공", "source": "서울신문", "url": "https://www.seoul.co.kr/news/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}, {"title": "[금상소] IRP·DC에 들어온 개인투자용 국채…10년·20년물 뭐가 나을까", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2624549"}]}, {"id": "8977649855f9", "title": "표류하는 기금형 퇴직연금…간담회 또 연기", "summary": "고용노동부와 금융감독원이 공동 주재하는 퇴직연금사업자 간담회가 9월 2일에서 10월 2일로 재차 연기됐다. 한 달 새 두 번째 순연으로, 간담회는 10월 2일 오후 2시부터 3시 30분까지 서울 로얄호텔에서 김영훈 고용노동부 장관과 이찬진 금융감독원장이 함께 주재한다. 국민연금공단의 기금형 퇴직연금 참여 여부, 수탁법인 인가 대상을 5~8개로 제한하는 방안을 둘러싼 독점 우려, 손해배상 책임 강화 방침이 쟁점으로 남아 있다. 연내 근로자퇴직급여보장법 개정안 통과 목표의 재조정이 불가피하다는 관측이 나온다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-09-14", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": [{"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "ffde5c86587a", "title": "'공시 넘어 사후관리'…디폴트옵션 3년, 최초 평가 시동", "summary": "고용노동부가 올해 디폴트옵션 승인 상품에 대한 첫 정기 평가를 실시한다. 2023년 7월 본격 시행된 디폴트옵션은 올해 3월 기준 41개 금융기관이 324개 상품을 승인받아 운용 중이며, 최초 승인 이후 3년이 지난 상품이 평가 대상으로 장기 성과 수익률과 위험 관리 등을 본다. 고용노동부는 첫 평가인 만큼 성과 저조 사유를 파악하고 개선 방안을 마련하는 데 핵심 의의를 두되, 문제가 지속되는 상품에는 불이익을 부여할 계획이다. 5월에 선정한 정책연구용역은 내년 2월까지 진행된다.", "category": "제도·규제", "importance": 5, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140567806179ad43907_18", "related": []}, {"id": "69dd458f15f4", "title": "퇴직연금 550조 커졌는데…보험사 점유율 20% 무너졌다", "summary": "퇴직연금 시장이 553조원대로 커지는 사이 보험업계 점유율이 20% 아래로 떨어졌다. 상반기 증권사는 4조1000억원 순유입을 기록한 반면 보험사는 1799억원 순유출을 냈다. 실물이전 확대로 가입자가 금융사를 옮기기 쉬워지면서 사업자 간 경쟁이 격화된 결과다. DB형에 집중된 포트폴리오가 약점으로 지목되자 삼성·한화·교보생명 등이 DC형·IRP 강화와 ETF 상품 확대로 대응하고 있다.", "category": "업계·경쟁사", "importance": 5, "source": "뉴데일리", "published": "2026-09-10", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/10/2026091000173.html", "related": []}, {"id": "de4a8500263d", "title": "수익률 32%에도 돈이 안 온다…디폴트옵션의 역설", "summary": "디폴트옵션 시행 3년 차 데이터에서 적극투자형 1년 수익률이 32.66%를 기록했으나 자금의 82.5%는 여전히 안정형에 머물러 있다. 은행권은 고객 자금 대부분을 안정형에 두는 반면 증권사 고객은 위험자산에 투자해 업권별로 뚜렷이 갈렸다. 제도의 병목은 상품 품질이 아니라 자금이 좋은 상품에 도달하는 경로에 있다는 지적이다.", "category": "운용·상품", "importance": 5, "source": "한경머니", "published": "2026-09-10", "url": "https://magazine.hankyung.com/money/article/202608199155c", "related": []}, {"id": "937d44176934", "title": "퇴직연금 6.9조 이동…은행서 증권사로 자금 쏠림, 국채로 2차 경쟁", "summary": "올해 상반기 퇴직연금 실물이전 규모가 약 6조9000억원으로 전년 동기 약 3조2000억원의 2.2배에 달해 2024년 제도 시행 이후 반기 기준 최대를 기록했다. 업권별로는 증권사가 4조1513억원 순유입, 은행이 3조9714억원 순유출, 보험이 1799억원 순유출이었고, 증권사 적립금은 2분기 말 165조468억원으로 1분기 대비 16.5% 늘어 은행권 증가율 6.6%를 크게 앞섰다. 실물이전 규모는 가입자가 직접 상품을 고르는 IRP에서 6조8000억원으로 가장 컸다. 9월부터 개인투자용 국채가 DC·IRP 계좌에 편입되면서 증권사는 안정형 상품까지 더해 고객 확보에 나서고, 은행권은 ETF 거래 편의성 개선으로 맞서고 있다.", "category": "운용·상품", "importance": 5, "source": "더트래커", "published": "2026-09-10", "url": "https://thetracker.co.kr/View.aspx?No=4221950", "related": []}, {"id": "6dd0fa0960d5", "title": "퇴직연금 디폴트옵션 첫 순유출…2분기 1조4000억 감소", "summary": "디폴트옵션 운용자금이 2023년 제도 도입 후 처음으로 순유출을 기록해 2분기에 약 1조4000억원이 줄었다. 안정형에서만 1조4891억원이 빠져나갔고, 증시 호황으로 위험자산 투자가 늘면서 자금이 대거 이동했다. 평가액 기준 적립액 증가는 117억원에 그쳐 시장 전체 증가분 45조2000억원에 비하면 미미한 수준이다.", "category": "운용·상품", "importance": 5, "source": "한국경제", "published": "2026-09-08", "url": "https://www.hankyung.com/article/202609081009i", "related": []}, {"id": "362d60df2f63", "title": "퇴직연금도 자산배분 시대…NH투자증권, DB 적립금 컨설팅 강화", "summary": "NH투자증권이 연금자산관리본부 산하 DB적립금 운용 협의체를 통해 기업별 맞춤형 IPS(적립금운용계획서) 컨설팅을 확대한다. DB형은 적립금 수익률이 임금상승률에 못 미치면 기업이 추가 적립을 부담해야 해 자산배분 전략의 필요성이 커지고 있다. 전담 계리사와 자산배분·포트폴리오 전문가로 구성된 협의체가 부채 분석부터 리밸런싱까지 5단계로 지원한다. 고객사 한국선급은 IPS 개정 후 DB 적립금 1년 수익률이 5월 말 기준 20%를 넘어 고용노동부·금융감독원 모범사례로 선정됐다.", "category": "법인·자금운용", "importance": 5, "source": "매일경제", "published": "2026-09-08", "url": "https://www.mk.co.kr/news/stock/12147172", "related": []}, {"id": "f7cf0468c30c", "title": "정부, 올 하반기 퇴직연금 디폴트옵션 손질", "summary": "고용노동부가 올해 하반기 기금형 퇴직연금 도입과 함께 디폴트옵션(사전지정운용제도)도 개편하겠다고 밝혔다. 대기기간과 디폴트옵션 상품 평가체계를 명확히 하고, 현재 제도가 적용되지 않는 자금까지 적용 범위를 넓히는 것이 핵심이다. 현재 디폴트옵션 자금의 82.5%가 안정형에 쏠려 있는 점도 개선 대상으로 지목됐다. 정부는 퇴직연금 의무화와 사외적립 의무화를 함께 추진하며 올 하반기를 퇴직연금 대격변기로 보고 있다.", "category": "제도·규제", "importance": 5, "source": "파이낸셜뉴스", "published": "2026-09-07", "url": "https://www.fnnews.com/news/202609071643275392", "related": []}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", " <script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  function render() {
    var doc = DATA.periods[currentPeriod];

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      button.setAttribute('aria-selected', String(PERIODS[index].key === currentPeriod));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    listEl.textContent = '';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
