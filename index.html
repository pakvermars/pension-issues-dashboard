  /* ── 팔레트 ───────────────────────────────────────────────

     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나.

     키움 두 색은 kiwoomam.com 로고의 구조를 그대로 옮긴 것이다.
     글자는 감청, 포인트 마크만 마젠타. 그래서 맨 위 줄은 감청이고
     마젠타는 슬로건 한 줄에만 쓴다. 둘을 같은 넓이로 쓰면 서로 죽는다. */
  :root {

    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom-deep: #1A399E;
    --kiwoom-point: #EC008C;

    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #DCE2EC;
      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 감청 원색은 어두운 종이에서 1.9:1까지 떨어져 줄이 보이지 않는다.
         마젠타도 한 단계 올려 짝을 맞춘다. 각각 6.2:1, 6.6:1. */
      --kiwoom-deep: #6E92F5;
      --kiwoom-point: #FF5FB4;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야
     구분선이 아니라 종이의 테두리로 읽힌다. */
  .topline { height: 4px; background: var(--kiwoom-deep); }

  /* 수집이 멈춰도 index.html은 그대로 남아 아무 일 없어 보인다. 그래서
     보는 사람의 시계와 비교해 묵은 정도를 화면에서 직접 말한다.
     2026-10-15에 엿새를 멈췄는데 아무도 몰랐던 것이 이 띠를 만든 이유다. */
  .stale {
    padding: 10px 20px;
    background: var(--hot);
    color: var(--paper);
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
  }

  .stale[hidden] { display: none; }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;
  }

  .slogan {
    margin: 0 0 0 auto;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom-point);
    white-space: nowrap;
  }

  .hero-date {
    font-family: var(--font-num);
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .search input {
    width: 230px;
    max-width: 44vw;
    padding: 4px 0;
    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */
  .group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;
  }

  .rail button {
    flex: 1 1 0;
    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .range {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  /* ── 분야 필터 ─────────────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
  }

  .filters button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */
  .notice {
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */
  .list { margin: 8px 0 0; }

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);

  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

조3000억 원(29.6%)이다. 금융투자 업계는 수익률 제고가 개편의 핵심인 만큼 증권사로 자금을 끌어들일 기회가 생길 것으로 보고 있다. 국민연금은 300인 초과 대기업·공공기관 대상 기금형 운용 참여를 희망한 것으로 알려졌으나 참여 여부는 확정되지 않았다.", "category": "업계·경쟁사", "importance": 3, "source": "동아일보", "published": "2026-10-30", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936444/2"}, {"id": "2cf227af423f", "title": "기업 퇴직연금 모아 전문기관이 굴려… ‘쥐꼬리 수익’ 개선 기대", "summary": "퇴직연금의 최근 10년간 연평균 운용 수익률은 2.78%에 그쳐 기금형 도입이 추진된다. 기금형은 DC형과 IRP를 대상으로 금융기관 개방형, 연합형, 공공기관 개방형 세 유형으로 운영되며 회사가 근로자대표 동의를 거쳐 도입하면 근로자가 수탁법인을 선택한다. 수탁법인은 인가위원회 심의와 고용노동부 장관 인가를 받아야 하며 금융기관 개방형은 최소 자본금 120억 원과 내부 통제 인력 7명을 갖춰야 한다. 자산을 직접 운용하려면 전문인력 5∼8명을 추가로 갖춰야 한다.", "category": "법인·자금운용", "importance": 3, "source": "동아일보", "published": "2026-10-30", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936451/2"}, {"id": "a926cb88702b", "title": "기금형 퇴직연금 정부안 정밀 해부...출발선은 공정한가", "summary": "정부안은 금융기관 개방형, 연합형, 공공기관 개방형 세 유형의 수탁법인을 허용하지만 진입 요건은 금융기관 개방형이 가장 무겁다. 푸른씨앗 가입 대상은 2027년 1월 100인, 2028년 1월 300인 이하 사업장으로 넓어지며, 100~299인 사업장 도입률은 이미 88.7%다. 수탁법인 인가와 제재 권한은 고용노동부가 갖는데 푸른씨앗 운영기관인 근로복지공단도 고용노동부 산하다. 적립금의 0.25%를 운영위험준비금으로 쌓아야 하지만 보전 대상 손실은 정해지지 않았다.", "category": "제도·규제", "importance": 3, "source": "뉴스퀘스트", "published": "2026-10-30", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=303779"}, {"id": "14ae04ce20fa", "title": "국민연금, 기금형 퇴직연금 참여 미정···‘시장 개입 우려’에 국회로 공 넘긴 정부", "summary": "고용노동부는 29일 퇴직연금 기능강화 방안을 발표하며 국민연금의 참여 방식과 범위에 이견이 있다며 국회 논의가 필요하다고 밝혔다. 지난해 국민연금 수익률은 18.82%로 퇴직연금 평균 6.47%의 3배 수준이며, 퇴직연금 적립금의 75.4%가 원리금보장 상품에 몰려 있다. 국민연금의 자금력이 공정 경쟁을 해치고 정부 개입 논란이 퇴직연금으로 번질 수 있다는 우려도 제기됐다. 정부는 11월 중 근로자퇴직급여보장법 개정안을 마련해 연내 국회 통과를 추진하며, 국민연금 참여에는 국민연금법 개정도 필요하다.", "category": "제도·규제", "importance": 3, "source": "경향신문", "published": "2026-10-30", "url": "https://www.khan.co.kr/article/202610300600041"}, {"id": "c2e96be3ff83", "title": "[퇴직연금 개편] 퇴직연금도 국민연금처럼…정부, 장기 연금 수령 유도 방안 발표", "summary": "2024년 퇴직연금 중도 해지는 15조원, 중도 인출은 3조원이었고 연금 수령 계좌 비중은 16.5%, 일시금 수령은 83.5%였다. 정부는 퇴직연금 담보 대출상품 도입, 연금 자동지급제도 검토, 연금·일시금 수령 시 비교 정보 의무 제공 등을 추진한다. 사업자 47개사는 자산운용 수익률, 장기 유지, 연금 수령 등 정량 지표로 평가받는다. 청년 퇴직연금 납입액에 소득수준과 무관하게 세액공제율 15%를 적용하는 방안도 검토된다.", "category": "가입자·사회", "importance": 3, "source": "CBC뉴스", "published": "2026-10-30", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=620807"}, {"id": "f82595e9660f", "title": "\"1년 미만·초단기 근로자도 퇴직금\"…정부 실태조사 착수", "summary": "정부가 1년 미만 근속자와 주 15시간 미만 초단시간 근로자에게도 퇴직급여를 지급하는 방안을 검토한다. 29일 발표된 퇴직연금 기능강화 방안에 따라 한국노동연구원이 이들의 퇴직급여 운영 실태와 의무화에 따른 사용자 부담·노동시장 영향을 분석한다. 지난해 주 1~14시간 일한 취업자는 177만9000명으로 전체 취업자의 6.2%였고 관련 통계 작성 이후 가장 많았다. DC형 법정 최소 사용자 부담금이 연간 임금총액의 12분의 1인 만큼 영세 사업장의 채용 위축 우려도 제기된다.", "category": "제도·규제", "importance": 3, "source": "한국경제", "published": "2026-10-30", "url": "https://www.hankyung.com/article/202610294697i"}, {"id": "d39364215ab3", "title": "“퇴직연금 다 날릴 수도”…ETF 투자한도 100%의 함정 [잇슈 머니]", "summary": "금융감독원이 퇴직연금 ETF의 '투자한도 100%' 표시를 원금 보장으로 오해하지 말라는 유의 사항을 안내했다. 2026년 상반기 말 퇴직연금 적립금 558조3천억원 중 ETF에 들어간 돈은 99조8천억원으로 2023년 말 9조원에서 11배로 늘었고, 실적배당형 상품 중 ETF 비중은 18.3%에서 50.4%로 높아졌다. 일부 사업자의 모바일·인터넷 매매 화면에는 위험등급 없이 투자한도만 표시돼 있었다. 2027년 1월부터는 ETF 매매·검색 화면에 투자한도와 위험등급이 함께 표시되고 적립금운용현황보고서에도 상품별 위험등급이 들어간다.", "category": "운용·상품", "importance": 3, "source": "KBS", "published": "2026-10-30", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8699397&ref=A"}, {"id": "be9fb148a8a8", "title": "IBK기업은행, 퇴직연금 소액·정기투자 서비스 출시…월 1만원부터 투자 가능", "summary": "IBK기업은행이 30일 퇴직연금 계좌의 현금성자산으로 펀드와 ETF를 자동 매수하는 '퇴직연금 자동모으기' 서비스를 출시했다. 월 1만원부터 투자할 수 있고, 은행권 최초로 매수 주기를 매일·매주·매월 중 선택할 수 있다. i-ONE Bank 개인 앱의 '연금Easy' 서비스와 MY연금 화면도 개편해 현금성자산 매수·매도와 상품 비교·검색 기능을 강화했다. 기업은행은 내년 상반기 중 퇴직연금 ETF 당일매매 시스템 도입을 검토하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "퍼블릭타임스", "published": "2026-10-30", "url": "https://www.public25.com/news/articleView.html?idxno=57496"}, {"id": "8bf635ca1515", "title": "퇴직연금 사외적립 2030년까지 전 사업장 의무화", "summary": "고용노동부·재정경제부·금융위원회·금융감독원은 29일 퇴직급여 사외적립을 2028년 100명 이상, 2029년 10~99명, 2030년 10명 미만 사업장으로 단계적으로 의무화하는 '퇴직연금 기능강화 방안'을 발표했다. 30명 미만 사업장이 조기 도입하면 최저임금 130% 미만 근로자 부담금의 10%를 지원하고, 내년 예산안에 122억원이 편성됐다. 의무 대상인데도 사외적립을 하지 않으면 중소기업퇴직연금기금 '푸른씨앗'에 자동 가입된다. 기금형 수탁법인은 인가위원회 심의를 거쳐 예비인가와 본인가 2단계로 노동부 장관 인가를 받아야 하며, 노동부는 11월 퇴직급여법 개정안을 마련해 연내 국회 의결을 추진한다.", "category": "제도·규제", "importance": 3, "source": "매일노동뉴스", "published": "2026-10-30", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237470"}, {"id": "c694c512aa4f", "title": "급전 쓰려 퇴직금 땡긴 김 대리…차라리 담보 대출 쉽게 한다", "summary": "정부는 퇴직연금 기능 강화 방안에서 중도인출을 줄이기 위해 퇴직연금 담보대출을 쉽게 받을 수 있도록 제도 개선을 추진한다. 지난해 연금계좌의 일시금 수령 비중은 83.5%로, 정부는 가입자가 일시금 수령 의사를 밝히지 않으면 연금으로 우선 지급하는 방식을 검토한다. 기금형 수탁법인이 가입자 이익 우선 의무를 어겨 손실이 나면 손해배상 책임을 질 수 있고 운영위험준비금 적립도 의무화된다. 지난해 말 DB형 사업장의 57.9%가 법정 최소적립금을 채우지 못해 정부는 정기감독을 늘릴 계획이다.", "category": "가입자·사회", "importance": 3, "source": "중앙일보", "published": "2026-10-30", "url": "https://www.joongang.co.kr/article/25474264"}, {"id": "02c50557c891", "title": "[잃어버린 투자본능①] 기관은 샀다는데…증시 버팀목은 왜 안 보이나", "summary": "9월 28일부터 10월 27일까지 유가증권시장에서 기관은 약 8천299억원을 순매수했지만 금융투자 부문이 약 1조7천700억원을 사들였고 나머지 기관은 약 9천400억원을 순매도했다. 투자신탁 5천336억원, 사모펀드 1조400억원, 연기금 2천774억원이 각각 순매도였으며 같은 기간 외국인은 27조원 넘게 순매도했다. 금융투자 순매수는 ETF 설정·유동성공급에 따른 매매가 반영된 것으로, 장기 투자자 기반은 취약하다는 분석이다. 증권업계에서는 대안으로 퇴직연금 기금화와 전문 운용체계 확대가 거론되며, 국내주식 투자 확대보다 수익률과 위험관리 능력을 높이는 데 초점을 맞춰야 한다는 견해도 있다.", "category": "운용·상품", "importance": 2, "source": "연합인포맥스", "published": "2026-10-30", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4442070"}, {"id": "7c920b46f36c", "title": "신한은행,퇴직연금 ETF 300개로 확대…연말 세액공제 시즌 맞아 고객 이벤트", "summary": "신한은행이 지난 23일 국내외 주식형·채권형·자산배분형 ETF 등을 추가해 퇴직연금 ETF 라인업을 300개로 확대했다. DC·IRP 고객을 대상으로 11월 27일까지 ETF 매수 고객 1000명을 추첨해 경품을 주는 이벤트를 진행한다. 9월 30일 기준 ETF 잔고가 없던 고객은 100만원 이상, 잔고가 있던 고객은 500만원 이상 매수하면 추첨 대상이 된다. 지난 9월에는 ETF 매도대금 결제 전 다른 ETF를 당일 매수할 수 있는 서비스도 도입했다.", "category": "업계·경쟁사", "importance": 2, "source": "퍼블릭타임스", "published": "2026-10-30", "url": "https://www.public25.com/news/articleView.html?idxno=57501"}, {"id": "fd27961918ff", "title": "[3분기 실적분석] 증시따라 널뛰는 비이자이익…석달새 2.5조 증발", "summary": "KB·신한·하나·우리·NH농협 등 5대 금융지주의 올해 3분기 비이자이익은 총 3조6천915억원으로 전 분기(6조1천429억원) 대비 39.9%(2조4천514억원) 급감했다. 같은 기간 이자이익은 13조1천447억원에서 13조9천564억원으로 6.2% 늘어 비이자이익 비중이 31.8%에서 20.9%로 10.9%포인트 낮아졌다. 감소 폭은 하나금융(46.4%)과 신한금융(45.5%)이 컸다. 증시 거래 의존도가 낮은 퇴직연금·WM·IB·보험 손익 등으로 비이자 수익원을 확보하는 것이 과제로 떠오르고 있다.", "category": "업계·경쟁사", "importance": 2, "source": "연합인포맥스", "published": "2026-10-30", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4442099"}, {"id": "747e09442773", "title": "[시대데스크/황국상]청년의 분노를 막을 안전망", "summary": "올 7월 말 국민연금 기금은 1684조원으로 지난해 말 대비 15.50% 늘었다. 국민연금은 2048년 수지 적자로 돌아서고 2064년 기금이 소진될 전망이다. 일하는 나이의 인구 100명이 부양하는 노인은 올해 31.3명에서 2072년 104.2명에 이른다. 필자는 청년 세대의 노후 불안에 대응할 안전망이 필요하다고 지적했다.", "category": "가입자·사회", "importance": 1, "source": "동행미디어 시대", "published": "2026-10-30", "url": "https://www.sidae.com/article/2026102914424567912"}, {"id": "d48d8e0b4393", "title": "연금통장도 ‘족보’ 따져야…1500만원 세금 방어의 기술 [이병희의 연금술사]", "summary": "연금계좌 자산은 세액공제 받은 원금과 운용수익, 세액공제 받지 않은 원금, 퇴직금 원금 세 가지로 나뉘며 각각 과세 체계가 다르다. 연간 1500만원 수령 한도는 세액공제 받은 원금과 운용수익만으로 판단한다. 1500만원 이하이면 연령별로 5.5~3.3%의 저율로 분리과세되지만, 넘으면 수령액 전액에 대해 16.5% 분리과세와 종합과세 중 하나를 골라야 한다. 인출은 미공제 원금, 퇴직금 원금, 세액공제 받은 원금·수익 순서로 이뤄진다.", "category": "가입자·사회", "importance": 1, "source": "이코노미스트", "published": "2026-10-30", "url": "https://economist.co.kr/article/view/ecn202610290094"}, {"id": "5fcd87ca4c99", "title": "공무원·군인·사학연금 유족연금 중복 수급, 지급액 어떻게 달라지나…50% 감액 기준 주목", "summary": "공무원연금·사학연금·군인연금 등 직역연금 수급자가 배우자 사망으로 유족연금을 받게 되면 연금 종류에 따라 지급액이 달라진다. 공무원연금 수급자의 배우자가 사학연금이나 군인연금 수급자이면 본인의 퇴직급여에 배우자의 퇴직유족연금 50%를 더해 지급한다. 공무원연금법 제41조는 다른 법령에 따른 유족연금을 함께 받을 경우 유족연금액의 2분의 1을 감액하도록 규정하고 있다. 군인연금 수급자의 배우자가 별정우체국연금 수급자이면 퇴직급여와 퇴직유족연금을 함께 받는다.", "category": "가입자·사회", "importance": 1, "source": "CBC뉴스", "published": "2026-10-30", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=621158"}, {"id": "3c3c64a17492", "title": "미래에셋투자와연금센터, 연금투자자를 위한 절세 가이드 발간", "summary": "미래에셋투자와연금센터가 연금계좌 투자자를 위한 절세 가이드 '연금투자자들이 반드시 알아야 할 최소한의 세금상식'을 발간했다고 30일 밝혔다. 미래에셋증권 세무사들이 상담 현장의 실제 질문을 바탕으로 집필했다. 책자는 연금계좌 납입 시 절세혜택, 연금계좌 운용 및 인출, 퇴직연금의 세 파트로 구성되며 퇴직연금 파트에서는 경영성과급 수령, 중간정산 세액정산 등을 중심으로 직장인 퇴직금 절세 5계명을 정리했다. 센터 홈페이지 간행물 코너에서 e북으로도 볼 수 있다.", "category": "가입자·사회", "importance": 1, "source": "파이낸셜투데이", "published": "2026-10-30", "url": "http://www.ftoday.co.kr/news/articleView.html?idxno=368539"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-10-23 ~ 2026-10-29", "generated_at": "2026-10-30T15:01:09+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "b7e8a161b6af", "title": "2028년부터 퇴직급여 사외적립 의무화… 체불 막는다", "summary": "근로자의 퇴직금 체불을 막기 위해 내후년부터 100인 이상 사업장을 대상으로 퇴직급여 사외 적립을 단계적으로 의무화하는 방안이 추진된다. 이형일 부총리 겸 재정경제부 장관과 배경훈 부총리 겸 과학기술정보통신부 장관은 28일 경제관계장관회의·과학기술관계장관회의 첫 연석회의에서 이 방안을 논의했으며, 기금형 퇴직연금의 구체적 도입 방안도 마련해 전문적인 자산 운용과 엄격한 수탁자 책임을 부과하기로 했다. 퇴직연금 사업자 평가 기준은 연금 성과 수익률 중심으로 개편하고, 디폴트옵션 적용 예정 통보 시점은 만기 후 4주에서 만기 전 2주로 앞당긴다. 구체적인 퇴직연금 기능 강화 방안은 29일 국회 기후에너지환경노동위원회 여당 위원과의 당정협의를 거쳐 발표된다.", "category": "제도·규제", "importance": 5, "source": "서울신문", "published": "2026-10-29", "url": "https://www.seoul.co.kr/news/economy/2026/10/29/20261029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "퇴직연금, 전문가가 대신 굴린다…'기금형' 도입, 국민연금 참여는 미정", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6335473"}, {"title": "정부, 퇴직연금 기금형 활성화…IRP 위험자산 투자한도 상향 추진", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4441777"}, {"title": "당정, ‘퇴직연금 강화·고용부 예산’ 살핀다…초광역특구법 논의 가능성", "source": "디지털타임스", "url": "https://www.dt.co.kr/article/12091950"}]}, {"id": "57ee5c3c325d", "title": "[연금 승부③] '160조' 증권사 퇴직연금 미래에셋 독주 속 추격전", "summary": "금융감독원 퇴직연금 비교공시에 따르면 올해 3분기 말 증권사 퇴직연금 적립금(DB·DC·IRP)은 160조2935억원으로 전년 동기보다 33.9% 늘었지만 2분기 말(165조468억원)보다는 2.9% 줄었다. 미래에셋증권은 적립금 49조9034억원으로 5개 분기 연속 1위를 지켰다. 삼성증권(27조6694억원)과 한국투자증권(25조8873억원)의 격차는 지난해 2272억원에서 1조7821억원으로 벌어졌고, 현대차증권(18조9431억원)이 4위를 유지했다. 원리금비보장상품 수익률은 DC형 1년 유안타증권 21.86%, IRP 1년 iM증권 20.28%, DB형 1년 미래에셋증권 14.42% 등 유형과 기간에 따라 상위 사업자가 갈렸다.", "category": "업계·경쟁사", "importance": 4, "source": "뉴스웍스", "published": "2026-10-29", "url": "https://www.newsworks.co.kr/news/articleView.html?idxno=901002", "related": []}, {"id": "8736f7f36a18", "title": "'DC형 퇴직연금' 수익률 53%대서 15%대로", "summary": "금융감독원 통합연금포털에 따르면 9월 말 퇴직연금 사업자 43곳의 적립금은 542조1214억원으로 6월 말 553조8779억원보다 11조7565억원(2.12%) 줄었으며, 분기 말 적립금이 전 분기보다 감소한 것은 2020년 1분기 이후 6년여 만이다. DC형 퇴직연금 최근 1년 평균 수익률은 6월 말 53.33%에서 9월 말 15.90%로, IRP 투자 수익률은 48.25%에서 15.97%로, DB형 수익률은 6.68%에서 1.36%로 낮아졌다. 적립금 감소액은 IRP 5조129억원, DC형 3조8374억원, DB형 2조9062억원이었고 IRP와 DC형 감소액 합계 8조8503억원은 전체 감소액의 75.3%에 달했다. 올해 1~7월 DB형에서 DC형으로 전환한 근로자는 34만156명으로 전년 같은 기간보다 118.1% 늘었고, 미래에셋증권에서 4~6월 DC형으로 바꾼 가입자들의 7~8월 수익률은 -10.7%였다.", "category": "운용·상품", "importance": 4, "source": "조선일보", "published": "2026-10-28", "url": "https://www.chosun.com/economy/market_trend/2026/10/28/QAYJIBWJOJGJLMRW7O2IFSWVWQ/", "related": []}, {"id": "23f60715d3da", "title": "퇴직연금 수익률 경쟁…DB형은 미래에셋증권, DC·IRP는 하나증권 ‘두각’", "summary": "올해 3분기 말 15개 증권사의 퇴직연금 적립금은 160조2935억원으로 직전 분기 165조468억원보다 4조7533억원(2.88%) 줄었고, 금융권 전체에서 증권사가 차지하는 비중은 29.80%에서 29.57%로 낮아졌다. 유형별로는 개인 IRP가 2조9143억원(4.44%), DB가 1조2560억원(2.86%), DC가 5830억원(1.05%) 감소했다. 적립금 1조원 이상 증권사 10곳 중 원리금비보장 DB 최근 1년 수익률은 미래에셋증권이 14.42%로 가장 높았고 KB증권 9.86%, 한국투자증권 5.39% 순이었다. 원리금비보장 DC와 개인 IRP 최근 1년 수익률은 하나증권이 각각 18.72%, 18.50%로 가장 높았으며, 하나증권은 DC 원리금비보장형 5년·7년·10년 연평균 수익률에서도 증권업 1위를 기록했다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-10-28", "url": "https://www.ceoscoredaily.com/page/view/2026102715070654047", "related": []}, {"id": "d970457f49c6", "title": "[연금 승부①] 퇴직연금 절반 지킨 은행…증권사는 DC·IRP로 추격", "summary": "금융감독원 퇴직연금 비교공시에 따르면 올해 3분기 말 전체 퇴직연금 적립금은 542조12 용하는 근로자퇴직급여 보장법 개정안을 대표발의했다. 개정안은 기금형을 금융기관개방형, 연합형, 공공기관개방형, 중소기업퇴직연금기금 등 4가지 유형으로 분류했다. 한정애 의원안은 노사가 참여하는 비영리 수탁법인을 중심으로 적립금 3000억원 이상 또는 가입자 3만명 이상 사업장 등에 기금형을 허용하는 모델이다. 안도걸 의원안은 민간 전문운용사 간 경쟁에 방점을 찍고 30인 이하 사업장 중심의 기금형을 전체 사업장으로 확대하며 가입자가 2년 단위로 기금을 옮길 수 있도록 했다.", "category": "제도·규제", "importance": 4, "source": "대한경제", "published": "2026-10-23", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610221712341290810", "related": []}, {"id": "2c21c94f9f58", "title": "NH투자증권, 퇴직연금 장기 수익률 앞세워 IMA까지 확대…연금·투자 사업 강화", "summary": "NH투자증권은 금융감독원이 공시한 2026년 3분기 퇴직연금 수익률 비교에서 DB 원리금보장형 5년 수익률 3.88%, 7년 3.36%로 전체 퇴직연금사업자 중 각각 1위를 기록했다고 밝혔다. IRP 원리금보장형은 3년 수익률 3.90%로 전체 1위, 5년 3.51%·7년 2.99%·10년 2.70%로 각각 전체 2위였다. IRP 원리금비보장형 수익률은 5년 7.16%, 7년 8.19%, 10년 5.90%였다. 회사는 10월 26일부터 29일까지 총 1200억원 규모, 만기 2년 3개월의 'N2 IMA1 중기형 4호'를 모집한다.", "category": "업계·경쟁사", "importance": 3, "source": "데일리팝", "published": "2026-10-24", "url": "http://www.dailypop.kr/news/articleView.html?idxno=103717", "related": [{"title": "신한투자증권, Npay 간편주문 챌린지…NH투자증권, 퇴직연금 장기수익률 최상위", "source": "뉴스티앤티", "url": "https://www.newstnt.com/news/articleView.html?idxno=724706"}]}, {"id": "6eeffdeccf97", "title": "“기금형 퇴직연금, 증시부양 수단 안될 말”", "summary": "미국의 연금 전문가 앨리샤 머넬 보스턴칼리지 은퇴연구센터 선임고문은 28일 중앙일보와의 서면 인터뷰에서 한국의 기금형 퇴직연금 도입과 관련해 국내 주가를 떠받치거나 정부의 다른 정책 목표를 달성하라는 압력으로부터 연금 운용자를 보호하는 것이 가장 중요하다고 밝혔다. 그는 독립적인 연방기관이 감독하고 실제 자산운용은 민간 투자회사에 맡기는 미국 연방 저축기금(TSP)을 참고 사례로 제시했다. 머넬 고문은 증시 안정은 개혁의 부수적 효과라며 국내 주식에 지나치게 집중하면 근로자의 노후 자산도 국내 경제의 위험에 노출될 수 있다고 경고했다. 또 폭넓은 가입 대상과 적절한 디폴트 투자상품, 낮은 수수료, 수탁자 보호장치를 처음부터 갖춰야 한다고 덧붙였다.", "category": "제도·규제", "importance": 3, "source": "중앙일보", "published": "2026-10-29", "url": "https://www.joongang.co.kr/article/25473805", "related": []}, {"id": "c0cb2b790f79", "title": "증시 찬바람에 퇴직연금 4.7조 증발…미래에셋·한투·NH 등, 상품·영업 강화하며 유치 총력전", "summary": "금융감독원 통합연금포털에 따르면 증권사 퇴직연금 적립금은 2분기 말 165조488억 원에서 3분기 말 160조2958억 원으로 3개월 만에 4조7530억 원 줄었다. 미래에셋증권은 52조210억 원에서 49조9034억 원으로 2조1176억 원 감소했고 한국투자증권(-5172억 원), NH투자증권(-4623억 원), 삼성증권(-4226억 원), KB증권(-4039억 원), 신한투자증권(-3513억 원)도 적립액이 줄었다. 증권사들은 4분기 적립금 증가 시기를 앞두고 NH투자증권은 전문 상담거점과 전용상품 확대, 한국투자증권은 사업장을 찾아가는 영업에 나서고 있다. 미래에셋증권은 8월 IRP 고객 대상 ‘미래에셋 로보Wrap’을, 신한투자증권은 같은 달 ‘신한 SOL 로보연금’을 선보였다.", "category": "업계·경쟁사", "importance": 3, "source": "소비자가 만드는 신문", "published": "2026-10-29", "url": "http://www.consumernews.co.kr/news/articleView.html?idxno=766904", "related": []}, {"id": "d327c2b1e0fb", "title": "[예규·판례] 헌재 \"공무원 퇴직연금 지급 시기 60→65세 연기해도 합헌\"", "summary": "헌법재판소는 1996~2009년 임용 공무원의 퇴직연금 지급개시연령을 단계적으로 65세로 높인 공무원연금법 부칙 조항에 대해 재판관 4 대 4 의견으로 합헌 결정했다. 해당 조항은 지급개시연령을 2024~2026년 퇴직자 62세, 2027~2029년 63세, 2030~2032년 64세, 2033년 이후 65세로 정하고 있다. 다수 의견은 경과조치와 조기퇴직연금 제도가 있어 연금재정 안정이라는 공익이 신뢰이익보다 크다고 봤다. 반대 의견은 정년퇴직 이후 소득공백이 퇴직공무원에게 고스란히 남는다며 신뢰보호원칙 위반이라고 판단했다.", "category": "가입자·사회", "importance": 3, "source": "조세금융신문", "published": "2026-10-29", "url": "https://www.tfmedia.co.kr/news/article.html?no=208459", "related": []}, {"id": "a722d1ed42f7", "title": "내 퇴직금을 핵심 노후소득으로…연금수령 유도·수익률 제고", "summary": "정부가 29일 발표한 퇴직연금 기능 강화 방안에는 일시금 대신 연금 수령을 유도하는 장치가 담겼다. 지난해 퇴직급여를 연금으로 받은 계좌는 16.5%에 그치고 일시금 수령이 83.5%였으며, 2024년 중도 해지는 15조원, 중도 인출은 3조원이었다. 정부는 중도인출 대신 쓸 퇴직연금 담보대출 출시, 일시금을 따로 선택하지 않으면 연금으로 자동 지급하는 제도 도입을 검토하고 연금·일시금 비교정보 제공을 의무화한다. 계약형 사업자 47개사는 수익률·장기 유지·연금 수령 등 정량 지표로 평가하고, 청년 납입액에는 소득과 관계없이 세액공제율 15% 적용을 검토한다.", "category": "가입자·사회", "importance": 3, "source": "연합뉴스", "published": "2026-10-29", "url": "https://www.yna.co.kr/view/AKR20261028184700530", "related": []}, {"id": "cc168cc529f1", "title": "경총 \"퇴직연금 의무화, 中企 부담 고려해야…단계적 시행 필요\"", "summary": "한국경영자총협회는 29일 고용노동부가 발표한 '퇴직연금 기능강화 방안'에 대해 중소·영세기업의 부담을 고려한 단계적 시행과 정책적 지원이 필요하다는 입장을 밝혔다. 경총은 퇴직급여 사외적립 의무화가 사실상 모든 사업장에 퇴직연금 도입을 의무화하는 조치라고 지적했다. 기금형 퇴직연금은 운용 손익이 전적으로 가입자에게 귀속되므로 투자위험 관리와 가입자 보호 장치를 충분히 마련해야 한다고 촉구했다. 근로복지공단이 '푸른씨앗'을 이미 운영하는 상황에서 국민연금공단의 기금형 사업 참여는 공·사적연금의 역할 구분을 모호하게 하고 공정경쟁을 저해할 우려가 있다며 신중한 검토를 요구했다.", "category": "제도·규제", "importance": 3, "source": "이투데이", "published": "2026-10-29", "url": "https://www.etoday.co.kr/news/view/2641527", "related": []}, {"id": "15163dd0d437", "title": "퇴직연금 의무화에도…1년 미만·초단시간 노동자 사각지대 남아", "summary": "고용노동부의 '퇴직연금 기능강화 방안'에 따라 퇴직급여 사외적립은 2028년 100인 이상 사업장을 시작으로 2030년까지 모든 사업장에 단계적으로 의무화되지만, 1년 미만·초단시간 노동자의 적용 확대는 시행 시점과 방식이 확정되지 않았다. 현행 퇴직급여제도는 계속근로기간 1년 이상, 4주 평균 주 소정근로시간 15시간 이상인 노동자만 대상으로 한다. 경사노위에서는 지난 6월부터 근속요건을 3개월이나 6개월로 줄이거나 일한 기간에 비례해 산정하는 방안 등이 논의되고 있다. 노동부는 노사 합의가 이뤄지면 발표하겠다는 입장이다.", "category": "제도·규제", "importance": 3, "source": "아시아투데이", "published": "2026-10-29", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261029010010231", "related": []}, {"id": "7720e1af4631", "title": "퇴직연금 기금형 도입…운용업계 \"초대형 시장 열리지만 책임도 커져\"", "summary": "정부가 29일 발표한 '퇴직연금 기능강화 방안'으로 민간 금융회사가 단독 또는 컨소시엄 형태로 영리형 수탁법인을 세워 여러 사업장의 적립금을 운용할 수 있게 되고, 연합형 기금의 총괄 위탁운용사(OCIO)로 참여하는 길도 열린다. IRP의 70% 위험자산 투자 한도가 단계적으로 완화되고 대형 증권사의 IMA와 발행어음이 DC형·IRP 투자 대상에 허용된다. 반면 금융기관 개방형 수탁법인의 최소자본금은 120억원으로 정해졌고 적립금의 0.25% 수준을 운영위험준비금으로 의무 적립해야 한다. 업계는 손실 발생 시 수탁법인이 무과실을 입증해야 하는 손해배상 입증책임 전환을 가장 큰 부담으로 꼽으며 구체적인 면책 기준 마련을 요구했다.", "category": "법인·자금운용", "importance": 3, "source": "아시아경제", "published": "2026-10-29", "url": "https://www.asiae.co.kr/article/2026102909422286546", "related": []}]}, "monthly": {"period": "monthly", "key": "current", "label": "2026-09-30 ~ 2026-10-29", "generated_at": "2026-10-30T15:01:17+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "0dbdadec9016", "title": "[비바100] 퇴직연금에 담는 개인투자용 국채…금리보다 만기부터 따져라", "summary": "지난 9월부터 확정기여형(DC)·개인형퇴직연금(IRP) 계좌에서도 개인투자용 국채 10년물과 20년물을 청약할 수 있게 됐다. NH투자증권 100세시대연구소는 보고서에서 노후자금 사용 시점에 맞춰 만기를 분산하는 활용법을 제시했다. 2026년 9월 발행분 적용금리는 만기보유 시 10년물 연 4.765%, 20년물 연 4.920%이며, 100만원 투자 시 세전 수령액은 각각 약 159만3000원, 약 261만3000원이다. 퇴직연금에서 매입한 국채는 분리과세 대신 연금계좌 세제를 적용받고, 중도 환매 시 복리 혜택이 축소된다.", "category": "운용·상품", "importance": 3, "source": "브릿지경제", "published": "2026-10-15", "url": "https://www.viva100.com/article/20261013500585", "related": [{"title": "퇴직연금  봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "f14fcbcde9b5", "title": "550조 퇴직연금 판 흔든다…국민연금 참여 '기금형 퇴직연금' 법안 발의", "summary": "더불어민주당 이용우 의원이 공동발의 12인과 함께 10월 2일 근로자퇴직급여 보장법 일부개정법률안을 발의했다. 개정안은 국민연금공단 등 공적연금관리기관이 기금형 퇴직연금 사업에 참여할 수 있도록 하고, 시장점유율 상한을 3년차 10%, 4년차 20%, 5년차 30%로 두었다. 2025년 말 퇴직연금 적립금은 501조4000억원이고 2024년 수익률은 4.77%로 같은 해 국민연금 수익률 15.0%를 밑돌았으며, 수수료는 2018년 8956억원에서 2025년 1조7748억원으로 98% 늘었다. 중소기업퇴직연금기금 가입 대상은 현재 100명 미만에서 2028년까지 300명 이하로 확대되고, 법안은 공포 후 1년이 지나 본격 시행된다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-10-07", "url": "http://www.globalepic.co.kr/view.php?ud=2026100708100769037cc35ccc5c_29", "related": [{"title": "'기금형 퇴직연금' 정기국회 논의 본격화 할 듯", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237123"}, {"title": "\"저조한 수익률, 높은 수수료\" 구조인 현행 계약형 퇴직연금 보완하는 기금형 퇴직연금 병행도입 필요", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=493587"}]}, {"id": "ad939b3f2b2a", "title": "공공기관 5곳 중 1곳, 퇴직연금 법정 기준 미달…최저 39%", "summary": "올해 8월 기준 DB형 퇴직연금을 도입한 공공기관 214곳 중 46곳(21.5%)의 적립률이 법정 최저 기준인 100%에 미달했다. 태권도진흥재단이 39.17%로 가장 낮았고 분당서울대병원 43.61%, 한국교통안전공단 46.35%, 한국도로교통공단 49.57%로 법정 기준의 절반에도 못 미쳤다. 근로자퇴직급여 보장법상 적립률이 95% 미만이면 사업주는 다음 회계연도까지 부족분의 3분의 1 이상을 메워야 하며, 이를 방치하면 최대 1천만원의 과태료가 부과될 수 있다. 김위상 의원은 공공기관이 체계적인 적립 계획을 조속히 마련해야 한다고 강조했다.", "category": "법인·자금운용", "importance": 4, "source": "연합뉴스", "published": "2026-10-12", "url": "https://www.yna.co.kr/view/AKR20261012029400530", "related": [{"title": "공공기관 5곳 중 1곳, 퇴직연금 적립금 법정 기준 못 채웠다", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10912175?ref=naver"}]}, {"id": "0369d6c3118c", "title": "퇴직연금 223조원 쌓인 5대은행…국민·하나 2위 각축전", "summary": "5대 시중은행의 3분기 말 퇴직연금 적립금은 222조9427억원으로 집계됐다. 신한은행이 57조2252억원으로 1위이고 KB국민은행 52조2226억원, 하나 리팀을 신설해 신규 DC·IRP 가입 고객 대상 웰컴콜과 연금PB 1대1 매칭, 'Premier 연금컨설팅'을 운영하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "시사캐스트", "published": "2026-10-08", "url": "http://www.sisacast.kr/news/articleView.html?idxno=100731", "related": [{"title": "한국투자증권, 연금 MTS 개편…“적립·운용·수령까지 밀착 지원”", "source": "더퍼블릭", "url": "https://www.thepublic.kr/news/articleView.html?idxno=321335"}, {"title": "한국투자증권, 연금 MTS 개편 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31774"}]}, {"id": "ee6cf0e31b06", "title": "“부유한 노인도 받는다”…기초연금 ‘하위 70%’ 기준 개편 추진", "summary": "정부가 기초연금 수급 대상을 현행 노인 소득 하위 70% 방식에서 기준중위소득과 연계하는 방식으로 개편할 계획이다. 내년에는 소득 하위 30%의 기준연금액을 월 35만원에서 38만원으로 올리고 차등 지급을 적용한다. 다만 이 조치의 노인빈곤율 개선 효과는 0.3%포인트에 그친다. 정부는 저소득 노인의 급여 인상에 집중하기 위해 장기적으로 수급 구조를 개편할 방침이다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-03", "url": "https://www.segye.com/newsView/20261002510945?OutUrl=naver", "related": [{"title": "이재명 정부, 기초연금 개혁 회피해선 안 된다", "source": "시사IN", "url": "https://www.sisain.co.kr/news/articleView.html?idxno=58534"}, {"title": "기초연금 '소득 하위 70%' 기준 바꾼다…중위소득 연계 재추진", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6308073"}]}, {"id": "b14a9dff32a8", "title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "summary": "국회 토론회에서 국민연금 수급 개시 연령을 2046년까지 68세로 점진적으로 높이는 방안이 제안됐다. 현행법상 1969년생부터는 65세에 노령연금을 받기 시작하는데, 정년 60세 퇴직 후 68세 수급이 되면 소득 공백이 약 8년으로 늘어난다. 조기노령연금은 60세부터 신청할 수 있으나 1년 앞당길 때마다 연금액이 6%씩 줄어 최대 30% 감액된다. 보험료율은 2025년 9%에서 9.5%로 올랐고 매년 0.5%포인트씩 높아져 2033년 13%에 도달하며, 68세 수급안은 아직 정부안이나 국회 합의안이 아니다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-02", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver", "related": [{"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}]}, {"id": "6da1ff9b2cf1", "title": "'2164억 체불' 대유위니아…3년 연속 퇴직연금 적립 미달", "summary": "대유위니아 계열 가전 3사(위니아·위니아전자·위니아전자MF)가 2022년부터 2024년까지 3년 연속 DB형 퇴직연금 법정 최소적립금을 채우지 못한 것으로 김주영 의원이 고용노동부에서 받은 자료에서 나타났다. 위니아전자의 최소적립금 대비 실제 적립 비율은 2022년 5.86%, 2023년 5.88%, 2024년 5.68%였고 위니아전자MF는 같은 기간 14.11%에서 9.45%로 떨어졌다. 2022년부터 지난달 3일까지 3사의 전체 체불액은 2164억원이며 이 중 체불 퇴직금은 858억원이다. 고용노동부가 이들 계열사에 관련 과태료를 부과한 사례는 없었다.", "category": "법인·자금운용", "importance": 3, "source": "뉴시스", "published": "2026-10-10", "url": "https://www.newsis.com/view/NISX20261010_0003820502", "related": [{"title": "대유위니아 가전 3사, 퇴직연금 법정 적립금 3년 연속 미달", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5070068"}]}, {"id": "fcba047b4874", "title": "머니무브 주춤, 더 치열해진 증권사 퇴직연금 경쟁", "summary": "올해 2분기말 기준 퇴직연금 시장은 553조8949억원이며 증권사 비중은 지난해말 26.47%에서 2분기 29.8%로 늘었다. 증권업종 적립금 165조원 중 미래에셋증권이 52조원(31.5%)을 차지하고 삼성증권 28조원, 한국투자증권 26조원이 뒤를 잇는다. 3분기 증시 조정으로 4~6월 DB형에서 DC형으로 전환한 증권사 가입자의 7월·8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 한국투자증권의 MTS 연금서비스 전면개편, 신한투자증권의 연금고객관리팀 신설, NH투자증권의 법인고객 관리시스템(CIS) 구축 등 증권사들이 타사 고객 유치 경쟁에 나서고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "비즈워치", "published": "2026-10-09", "url": "https://news.bizwatch.co.kr/article/market/2026/10/08/0005", "related": [{"title": "퇴직연금 165조 잡은 증권사…다음 승부처는 '고객관리'", "source": "뉴스웨이", "url": "https://www.newsway.co.kr/news/view?ud=2026100713530728574"}]}, {"id": "c4dab2068ab2", "title": "복지부 국감 개막⋯기초연금 '반쪽 개편'·국민연금 손실 추궁 [국감]", "summary": "국회 보건복지위원회가 7일 보건복지부와 질병관리청을 시작으로 이틀간 국정감사에 들어갔다. 핵심 쟁점은 연금제도 개편안으로, 복지부가 추진해 온 저소득층 노인 중심 '하후상박' 기초연금 개편이 사회적 논의 부족을 이유로 1년짜리 단기 계획에 그친 점이 '반쪽 개편'이라는 지적을 받을 전망이다. 국민연금은 기금 재정 안정성과 함께 자산배분 리밸런싱 한시 유예, 국내 주식 목표 비중 상향(14.9%→20.8%)에 따른 증시 급락 손실 문제가 검증대에 오른다. 복지위 국감은 14일 국민연금공단, 16일 국민건강보험공단·건강보험심사평가원을 거쳐 27일 종합감사로 마무리된다.", "category": "제도·규제", "importance": 3, "source": "이투데이", "published": "2026-10-07", "url": "https://www.etoday.co.kr/news/view/2633071", "related": [{"title": "기초연금 '반쪽' 개편·국립대병원 첫 등판…복지부 국감 쟁점은", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261003_0003813472"}]}, {"id": "3222e4df0aa6", "title": "[연금개혁] '골든타임' 놓치면 무용지물…국고 GDP 1% 지금 투입 땐 31년 연장, 고갈 후엔 1년뿐", "summary": "국회예산정책처 분석에 따르면 현행 제도가 유지될 경우 국민연금 기금은 2069년에 소진된다. 정부가 지금부터 매년 GDP의 1%를 투입하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥난 2069년부터 투입하면 1년만 연장된다. 기금 수익률을 2%포인트 높이면 2120년까지 흑자를 유지할 수 있다.", "category": "제도·규제", "importance": 3, "source": "CBC뉴스", "published": "2026-10-01", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=611066", "related": [{"title": "\"국민연금 수익률 2%p 높이면 2120년까지 기금 고갈 없어\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260929100600530?input=1195m"}]}, {"id": "dd4beb88ba61", "title": "“4조 8천억 몰렸다”…S&P500으로 노후 준비? 이렇게 하세요 [잇슈 머니]", "summary": "국내에 상장된 S&P500 지수 상품 하나에 올해 들어 9월 28일까지 개인 자금 4조8611억원이 들어와 국내 ETF 가운데 1위를 기록했다. 연금저축과 개인형퇴직연금(IRP)은 둘을 합쳐 연 900만원까지 세액공제를 받고, 총급여 5500만원 이하 근로자는 공제율 16.5%가 적용돼 900만원을 넣으면 최대 148만5000원을 돌려받는다. 운용수익에는 세금을 바로 떼지 않고 55세 이후 연금으로 받을 때 3.3~5.5%의 연금소득세만 내지만, 연금 수령액이 연 1500만원을 넘으면 종합과세와 16.5% 분리과세 가운데 하나를 골라야 한다. 원·달러 환율이 7월 1일 장중 1550.85원에서 10월 2일 1350.6원으로 내려오면서 같은 S&P500 지수를 따르는 국내 상장 ETF의 최근 석 달 수익률은 환헤지형 2.19% 상승, 환노출형 6.23% 하락으로 갈렸다.", "category": "운용·상품", "importance": 2, "source": "KBS", "published": "2026-10-05", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8677562&ref=A", "related": [{"title": "한국증시 뛰었는데…개인 4.9조는 美 S&P500 ETF로", "source": "매일일보", "url": "https://www.m-i.kr/news/articleView.html?idxno=2002553"}, {"title": "개미 자금 4.9조 몰렸다…미래에셋 S&P500 ETF 1위·삼성 고배당도 성장세", "source": "더구루", "url": "https://www.theguru.co.kr/news/article.html?no=107765"}]}, {"id": "c2ef78aa9c37", "title": "삼성생명, 퇴직연금 부가서비스 앱 'SSUM 라운지' 개편", "summary": "삼성생명이 퇴직연금 가입자 전용 부가서비스 앱 'SSUM 라운지'를 전면 개편했다고 24일 밝혔다. 새로 마련된 '퇴직연금정보'에는 시장 지표를 보여주는 '투데이브리핑'과 '연금 첫걸음', '투자 인사이트', '투자 가이드북', '연금 클래스' 등 콘텐츠가 담겼다. '연금 클래스'는 매월 한 차례 온라인 세미나로 삼성생명 퇴직연금 전문가와 삼성자산운용이 제도·상품과 시장 전망을 소개한다. 서비스는 삼성생명 퇴직연금(DB·DC·IRP) 가입자라면 누 8세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "4bbbd1457f44", "title": "퇴직연금 판도 재역전…삼성생명 반년 만에 선두 탈환", "summary": "금융감독원 퇴직연금 비교공시에 따르면 3분기말 삼성생명의 퇴직연금 적립금은 57조5486억원으로 전분기보다 1523억원 늘어, 1조6636억원 줄어든 신한은행(57조2252억원)을 3234억원 차이로 앞서 1·2분기에 내준 선두 자리를 되찾았다. 삼성생명은 DB형 적립금 43조9970억원 중 원리금보장형이 35조원 수준이어서 증시 하락기에 적립금을 방어했고, 계열사 DB형 7074억원·DC형 461억원 증가도 영향을 미쳤다. 반면 국민은행 1조2587억원, 하나은행 1조107억원, 미래에셋증권 2조1176억원 등 주요 사업자의 적립금은 일제히 줄었다. 기사는 3분기 코스피가 19% 넘게 하락하며 실적배당형 상품 평가액이 감소한 영향으로 분석했다.", "category": "업계·경쟁사", "importance": 4, "source": "아시아타임즈", "published": "2026-10-25", "url": "https://www.asiatime.co.kr/article/20261020500369", "related": [{"title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "source": "세이프타임즈", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652"}, {"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로
     그보다 넉넉히 잡아야 매일 아침 헛경보가 뜨지 않는다. */
  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
         + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

  function buildStaleNotice() {
    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
