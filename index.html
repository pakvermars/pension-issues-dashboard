<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퇴직연금 주요 이슈</title>
<style>
  /* ── 팔레트 ───────────────────────────────────────────────
     잉크 네이비 위에 차가운 석재 종이. 강조색은 적립·성장을 뜻하는
     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나. */
  :root {
    --ink: #101C33;
    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom: #D6341F;

    --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',
               'Malgun Gothic', system-ui, sans-serif;
    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #DCE2EC;
      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 어두운 바탕에서는 다홍이 탁해 보여 한 단계 밝게 쓴다. */
      --kiwoom: #FF7A63;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;
  }

  .slogan {
    margin: 0 0 0 auto;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom);
    white-space: nowrap;
  }

  .hero-date {
    font-family: var(--font-num);
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 오른쪽으로 갈수록 구간이 넓어지는 축 자체가
     탭 역할을 한다. 시야를 넓힌다는 사실을 폭으로 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;
  }

  .rail button {
    flex: 1 1 0;
    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:nth-child(1) { flex-grow: 1; }
  .rail button:nth-child(2) { flex-grow: 1.7; }
  .rail button:nth-child(3) { flex-grow: 2.6; }
  .rail button:nth-child(4) { flex-grow: 3.7; }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .range {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  /* ── 분야 필터 ─────────────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
  }

  .filters button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */
  .notice {
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */
  .list { margin: 8px 0 0; }

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);
  }

  article[data-cat="2"] .badge { color: var(--cat-2); }
  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

  details summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

  <p class="range" id="meta"></p>

  <div class="filters" id="filters" aria-label="분야 선택"></div>

  <main class="list" id="list"></main>

  <p class="footer" id="footer"></p>

B證으로 이동…이어지는 연금 인력 유출, 왜?", "summary": "KB증권이 미래에셋증권 박광주 연금법인솔루션2본부장(상무)을 연금추진부로 영입한 데 이어 미래에셋증권 WM센터 출신 법인 연금 영업 인력을 RM으로 추가 영입했다. 앞서 한국투자증권은 지난해 말 미래에셋증권 연금본부장 출신 최종진 상무를 연금혁신본부장으로 영입했고, 퇴직연금 시장에 새로 진입한 키움증권도 미래에셋증권에서 약 15년간 연금 사업을 담당한 표영대 상무를 영입했다. 미래에셋증권의 퇴직연금 조직은 현재 5개 부문, 11개 본부에 인력 250여 명 규모로 2023년 2개 부문 수준에서 단기간에 팽창했으며, 업계에서는 내부 경쟁 강도와 인사 체계에 대한 불만이 이탈 배경으로 지목된다. 미래에셋증권은 업계 최대의 연금 전문 인력을 유지하며 관련 전문인력 충원도 계속하고 있다고 밝혔다.", "category": "업계·경쟁사", "importance": 3, "source": "인베스트조선 (유료)", "published": "2026-09-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/17/2026091780154.html"}, {"id": "7ce1eb77edaa", "title": "퇴직연금으로 국채 투자…첫 청약부터 흥행", "summary": "이번 달부터 퇴직연금 계좌로도 개인투자용 국채에 투자할 수 있게 됐다. 지난 9일부터 15일까지 진행된 청약에서 DC형과 IRP 등 퇴직연금 계좌를 통해 1천435억 원이 들어왔다. 일반 청약까지 합치면 9월 전체 발행 예정액인 2천300억 원을 넘어섰다. 퇴직연금으로 살 수 있는 개인투자용 국채는 10년물과 20년물이며, 만기까지 보유하면 표면금리에 가산금리를 더해 복리로 이자를 받지만 중도 환매하면 가산금리와 복리 혜택이 적용되지 않는다.", "category": "운용·상품", "importance": 3, "source": "SBS", "published": "2026-09-18", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008759230"}, {"id": "af8ed84aa045", "title": "'양질성장' 이끈 이호성 하나은행장, 고졸신화 이어지나", "summary": "12월 임기 만료를 앞둔 이호성 하나은행장의 성과를 짚었다. 하나은행의 6월 말 퇴직연금 적립금은 53조1661억원으로 지난해 같은 기간 42조7040억원보다 24.5% 늘었고, 올해 1분기에는 49조3037억원을 기록했다. 하나은행은 2023년부터 지난해까지 3년 연속 은행권 퇴직연금 적립금 증가액 1위를 기록했다. 지난해 당기순이익은 3조7475억원으로 전년 대비 11.7% 증가했고, 올해 상반기에는 반기 기준 역대 최대인 2조1211억원을 올렸다.", "category": "업계·경쟁사", "importance": 3, "source": "한스경제", "published": "2026-09-18", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=866159"}, {"id": "fcd676810220", "title": "[박영범의 이코노믹스] ‘노사정 합의’ 프레임 뒤에 숨지 말고 정부가 정책 주도를", "summary": "박영범 한성대 명예교수는 대기업 성과급 파동을 계기로 연공급 중심의 임금체계 전반을 직무·역량·성과 기준으로 개편해야 한다고 주장했다. 고용노동부 자료 기준 2024년 퇴직금·복리후생비를 포함한 1인당 총노동비용은 1000인 이상 초대기업 대비 500~999인 기업이 75.1%, 10~29인 기업이 58.5% 수준으로 격차가 2013년 이후 줄지 않았다. 정년연장은 국민연금 수급 연령과 퇴직연령의 괴리에 대응하는 핵심 정책 과제이나 임금체계 개편 논의와 맞물려 10여 년간 진전이 없다고 지적했다. 준비 없는 ‘동일노동 동일임금’ 법제화는 혼란을 부를 수 있어 직무급 확산이 선행돼야 한다고 밝혔다.", "category": "가입자·사회", "importance": 2, "source": "중앙일보", "published": "2026-09-18", "url": "https://www.joongang.co.kr/article/25462874"}, {"id": "c614a365e009", "title": "퇴직연금에 들어온 ‘개인투자용 국채’…롯데손해보험 매각, 어려운 이유 [머니카운터 방송 예고]", "summary": "경인방송 \u003c머니카운터>가 오는 20일 방송에서 DC형 퇴직연금과 IRP 계좌에 편입할 수 있게 된 개인투자용 국채와 원리금보장상품의 구조를 다룬다고 예고했다. 한국퇴직연금개발원 장선필 대표가 출연해 정기예금과 보험사 GIC, 증권사 ELB, 국채, 발행어음의 차이를 설명하며 증권사 ELB는 예금자보호 대상이 아니고 GIC와 정기예금은 중도해지 시 이자 감면 방식이 다르다는 점을 짚는다. 9월 발행 기준 개인투자용 국채는 10년물 표면금리 연 4.415%, 20년물 연 4.570%에 각각 0.35%포인트 가산금리가 적용돼 만기 보유 시 세전 총수익률이 10년물 약 59.28%, 20년물 약 161.8%에 이른다. 다만 발행 후 1년간 중도환매가 제한되고 이후 환매하면 가산금리와 연복리 혜택이 사라질 수 있어 은퇴 시점과 자금 사용 계획을 함께 따져야 한다고 전했다.", "category": "운용·상품", "importance": 2, "source": "경인방송", "published": "2026-09-18", "url": "https://news.ifm.kr/news/articleView.html?idxno=479676"}, {"id": "42ecf24dff3b", "title": "OASI 준비금 2032년 4분기 소진 전망…잭 루 “선택지 열어둬야”", "summary": "미국 사회보장제도 이사회가 6월 공개한 2026년 연례 보고서에서 퇴직·유족연금 기금인 OASI의 준비금이 2032년 4분기 소진될 것으로 전망됐고, 이후에는 예정 급여의 78%만 지급할 수 있는 것으로 추산됐다. 장애보험 기금 DI를 합친 통합 기금은 2034년 3분기 소진이 예상되며 이 경우 지급 가능 수준은 예정액의 83%다. 잭 루 컬럼비아대 교수 겸 전 재무장관은 CNBC 인터뷰에서 차기 대통령과 11월 상원 선거 후보들이 개혁과 관련해 선택지를 열어둬야 하며 고갈 시점에 가까워질수록 해법이 어려워진다고 말했다. 상원에서는 딕 더빈·빌 캐시디 의원 등이 7월 신탁기금의 재정 지속성을 최소 50년 확보하는 방안을 표결하도록 하는 PROMISE Act를 발의했다.", "category": "가입자·사회", "importance": 2, "source": "토큰포스트", "published": "2026-09-18", "url": "https://www.tokenpost.kr/news/policy/409935"}, {"id": "ba30bf9d261c", "title": "저성장 벽 넘는 보험사…‘M&A·해외 진출·자본 확충’ 새 활로", "summary": "국내 보험사들이 저성장 국면에서 인수합병과 해외 진출, 자본 확충으로 활로를 찾고 있다. 삼성생명은 미국 아이오와주에 본사를 둔 시가총액 약 32조원 규모의 퇴직연금 전문 금융회사 프린시플파이낸셜그룹(PFG) 지분 인수를 추진하고 있으며, 2분기 실적 발표 콘퍼런스콜에서 미국을 비롯한 선진 시장을 중심으로 M&A 기회를 모색하고 있다고 밝힌 바 있다. 삼성화재는 세 차례에 걸쳐 약 1조2000억원을 투자해 영국 보험사 캐노피우스 지분 40%와 이사회 의석을 확보했고, DB손해보험은 지난 5월 미국 특화 보험사 포테그라 지분 100%를 16억5000만 달러(약 2조3000억원)에 인수하는 계약을 마무리했다. 우리금융은 동양생명과 ABL생명 통합을 내년 하반기 목표로 추진하고 있으며, 보험업계는 내년부터 강화되는 기본자본 킥스(K-ICS) 규제에 대응해 자본 확충도 병행하고 있다.", "category": "업계·경쟁사", "importance": 2, "source": "주간한국", "published": "2026-09-18", "url": "https://weekly.hankooki.com/news/articleView.html?idxno=7183628"}, {"id": "935eb0d1c489", "title": "[THE Biz&CEO] 이재원 대표의 균형 경영… 푸본현대생명 미래 기반 다진다", "summary": "푸본현대생명이 올해 상반기 당기순이익 1586억 원을 기록하며 흑자 전환했고, 2분기 투자손익은 2071억 원 이익을 냈다. 상반기 신계약 CSM 효과는 703억 원으로 전년 동기 대비 37.3% 늘었다. 회사는 그간 퇴직연금 비중이 높았던 사업구조를 개선하기 위해 종신·정기·건강보험 등 보장성 상품 확대를 추진하고 있다. K-ICS 지급여력비율은 211.24%로 집계됐다.", "category": "업계·경쟁사", "importance": 2, "source": "THE Biz(더비즈)", "published": "2026-09-18", "url": "http://www.the-biz.co.kr/news/articleView.html?idxno=728003"}, {"id": "5e12f0eec29f", "title": "이혼 후 노후 자금 가르는 ‘연금분할’...수급 요건과 실무적 쟁점", "summary": "이혼 시 혼인 기간 동안 상대방이 쌓은 국민연금·공무원연금·사학연금·군인연금의 노령연금 수급권을 나누는 연금분할 제도의 요건과 실무 쟁점을 다뤘다. 연금분할을 청구하려면 혼인 기간이 5년 이상이어야 하고 상대방과 청구자 본인 모두 연금 수급 연령에 도달해야 한다. 분할 비율은 원칙적으로 혼인 기간 중 형성된 연금액의 50 대 50이며 당사자 합의로 달리 정할 수 있고, 각자 수급 연령에 도달해 직접 신청해 매월 받는 방법과 현재 가치를 평가해 일시금으로 다른 재산분할에 반영하는 방법이 있다. 로엘 법무법인 송개동 대표변호사는 공무원연금·사학연금·군인연금 등 직역연금은 퇴직 유무, 일시금 수령 여부, 별도 기여금 납부 내역에 따라 분할 대상 액수와 계산 방식이 한층 복잡해진다고 설명했다.", "category": "가입자·사회", "importance": 2, "source": "로이슈", "published": "2026-09-18", "url": "http://www.lawissue.co.kr/view.php?ud=202609171139202229aeda69934_12"}, {"id": "297772f87fca", "title": "\"은퇴 설계부터 라이프케어까지\"…하나은행, 충청권 첫 시니어 전용 '하나더넥스트 대전 라운지' 오픈", "summary": "하나은행이 지난 17일 대전 대흥동에 충청권 첫 시니어 전문 자산관리 채널인 '하나더넥스트 대전 라운지'를 열었다. 이 라운지는 국민연금·퇴직연금·개인연금·주택연금을 종합 분석하는 '평생소득설계' 맞춤형 상담 체계를 상시 가동한다. 은퇴설계와 상속·증여, 유언대용신탁, 투자전략 등 자산관리 솔루션에 건강관리·주거·문화·여가 등 비금융 라이프케어 프로그램을 함께 제공한다. 하나은행은 하반기 중 주엽, 부평대로, 광주, 야탑, 서면 등으로 거점을 확대할 예정이다.", "category": "업계·경쟁사", "importance": 2, "source": "더페어", "published": "2026-09-18", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88454"}, {"id": "9c0883866fdb", "title": "윤단비 의원, 부천시립노인병원 위탁·재정 통제 재검토 촉구", "summary": "부천시의회 윤단비 의원은 부천시립노인전문병원과 노인전문요양원에서 30차례에 걸쳐 33억3804만원이 시설 밖으로 이체됐고 이 가운데 6억1494만원이 감사 당시까지 회수되지 않았다고 지적했다. 이전 수탁기관인 대성재단은 4대 보험료·제세공과금 체납과 퇴직연금 미적립 문제를 남긴 채 회생절차에 들어갔다. 윤 의원은 내년 계약서에 임금·4대 보험료·퇴직연금·거래처 대금의 정기 확인을 명시할 것을 제안했다. 위탁 구조와 재정 통제 장치를 재검토해야 한다는 취지다.", "category": "법인·자금운용", "importance": 2, "source": "매일일보", "published": "2026-09-18", "url": "https://www.m-i.kr/news/articleView.html?idxno=1415686"}, {"id": "b0811719b752", "title": "미래에셋 TIGER에 쌓이는 '긴 돈'… 시장이 변해도 선택은 같았다", "summary": "미래에셋자산운용의 TIGER 미국S&P500 ETF와 TIGER 미국나스닥100 ETF에 올해 하반기 개인투자자 순매수 2조1465억원이 유입됐다. 두 상품의 합산 순자산은 31조8688억원으로, TIGER 미국S&P500이 20조3922억원, TIGER 미국나스닥100이 11조4766억원이다. TIGER 미국S&P500의 명목 총보수는 연 0.0068%다. 미래에셋 관계자는 연금저축과 퇴직연금을 활용한 적립식 투자가 가능해 장기 투자 수요가 꾸준히 유입되는 것으로 보고 있다고 밝혔으며, DC·IRP에서는 위험자산 합산 70% 한도가 적용된다.", "category": "운용·상품", "importance": 2, "source": "리버티코리아포스트", "published": "2026-09-18", "url": "http://www.lkp.news/news/articleView.html?idxno=84171"}, {"id": "419fe5f6f3e9", "title": "[기고] 연금개혁의 빈칸, 퇴직 후 5년을 메워야 한다", "summary": "강상희 제주특별자치도행정동우회 사무국장은 정년 퇴직과 연금 수급 개시 사이의 소득 공백을 연금개혁이 남긴 빈칸으로 지적했다. 공무원연금 지급 개시 연령은 2026년 62세에서 2027~2029년 63세, 2030~2032년 64세, 2033년 이후 65세로 올라가고, 국민연금은 1965~1968년생이 64세, 1969년생 이후는 65세부터 받는다. 이에 따라 퇴직자는 약 2년에서 최대 5년의 급여 단절을 겪는다. 필자는 노동시장이 제한적이고 재취업 기회가 적은 제주에서는 이 공백의 충격이 더 크다고 밝혔다.", "category": "가입자·사회", "importance": 2, "source": "제주의소리", "published": "2026-09-18", "url": "https://www.jejusori.net/news/articleView.html?idxno=506657"}, {"id": "a95dc9544ffe", "title": "[박곰희 칼럼] 세법에 없는 연금계좌, ISA", "summary": "ISA는 법적으로 연금계좌가 아니지만 노후 자금을 모으는 중간 거점 역할을 한다. 계좌 안에서 생긴 이익과 손실을 합산해 순이익에만 과세하며, 일반형은 순이익 200만원까지, 총급여 5000만원 이하 서민형은 400만원까지 비과세한다. 비과세 한도를 넘는 금액은 15.4%가 아닌 9.9%로 분리과세된다. 만기 자금을 연금계좌로 옮기면 이전금액의 10%, 최대 300만원까지 추가 세액공제를 받는다.", "category": "가입자·사회", "importance": 2, "source": "여성경제신문", "published": "2026-09-18", "url": "https://www.womaneconomy.co.kr/news/articleView.html?idxno=258769"}, {"id": "95bdd3307701", "title": "농협은행, 투자상품 완전판매 대토론회 개최…미스터리쇼핑 만점자 우수사례 공유", "summary": "NH농협은행이 17일 서울 중구 본사에서 ‘2026년 제2차 투자상품 완전판매 대토론회’를 열고 미스터리쇼핑 만점자와 영업본부 완전판매 TOP리더 등 40여 명이 참석했다. 지난 3월 제1차 대토론회에 이어 마련된 자리로, 4월부터 6월까지 실시한 자체 미스터리쇼핑에서 만점을 받은 직원들이 고객 상담 준비와 상품 설명, 적합성·적정성 원칙 준수, 판매절차 이행 등 현장 사례를 발표했다. 미스터리쇼핑은 펀드와 방카슈랑스, 신탁, 퇴직연금 등 상품별로 평가가 이뤄졌다. 박현동 투자상품부문 부행장은 완전판매는 정해진 절차를 준수하는 것을 넘어 고객의 입장에서 충분히 설명하고 신뢰를 쌓아가는 과정이라고 밝혔으며, 농협은행은 토론회 내용을 영상으로 제작해 영업점 교육자료로 활용할 계획이다.", "category": "업계·경쟁사", "importance": 1, "source": "비즈월드", "published": "2026-09-18", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146703"}, {"id": "e20d91d79092", "title": "KB자산운용 ‘RISE 코리아밸류업위클리고정커버드콜 ETF’ 순자산 3000억 돌파", "summary": "KB자산운용의 'RISE 코리아밸류업위클리고정커버드콜 ETF' 순자산이 3000억원을 돌파했다. 지난해 9월 상장 이후 매월 분배금을 지급해 최근 1년 주당 분배금은 4200원, 분배율은 24.69%이며 7~9월 월 분배율은 각각 3.22%, 3.21%, 3.08%다. 이 상품은 코리아 밸류업 지수 100개 구성 종목에 투자하면서 매주 두 차례 코스피200 콜옵션을 보유 자산의 30% 비중으로 고정 매도하는 커버드콜 전략을 쓴다. 보수는 연 0.30%이며 개인연금과 퇴직연금 계좌에서도 투자할 수 있다.", "category": "운용·상품", "importance": 1, "source": "헤럴드경제", "published": "2026-09-18", "url": "https://biz.heraldcorp.com/article/10877911"}, {"id": "8596a34bae73", "title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "summary": "미래에셋생명이 업계 최초로 퇴직연금 '보증형실적배당보험'을 내놓고 안정성과 수익성을 함께 추구하는 상품으로 내세우고 있다. 2026년 8월 말 기준 모집액은 717억원이다. 개인형퇴직연금(IRP) 계좌 전용 상품으로 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 원하는 시점에 연금을 개시할 수 있다. 적립금은 MVP펀드를 통해 글로벌 분산투자되며, 20년이 지난 뒤에도 적립금이 남아 있으면 소진될 때까지 연금 지급이 이어진다.", "category": "업계·경쟁사", "importance": 1, "source": "오늘경제", "published": "2026-09-18", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, "weekly": {"period": "weekly", "key": "2026-W38", "label": "2026-W38 (2026-09-14 ~ 2026-09-20)", "generated_at": "2026-09-18T10:37:28+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "26bad6a1c84a", "title": "이형일 \"500조 규모 퇴직연금, 수익률 저조…법안 준비 중\"", "summary": "이형일 부총리 겸 재정경제부 장관 후보자가 9월 15일 국회 재정경제기획위원회 인사청문회에서 퇴직연금 제도 개선과 관련해 노사정이 합의한 사항을 바탕으로 법안을 준비하고 있다고 밝혔다. 이 후보자는 퇴직연금 적립금이 500조원까지 올라갔는데 수익률이 저조하다며 노후소득 보장 기능이 제대로 작동하고 있느냐는 논의가 많다고 말했다. 노사정은 지난 2월 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화에 합의했고, 정부는 이를 바탕으로 연내 근로자퇴직급여보장법 개정을 추진하고 있다. 이광재 의원이 미국 401(k)를 거론하며 국가적 시스템이 필요하다고 지적한 데 대한 답변이다.", "category": "제도·규제", "importance": 5, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/economy/trend/6290971", "related": []}, {"id": "8977649855f9", "title": "표류하는 기금형 퇴직연금…간담회 또 연기", "summary": "고용노동부와 금융감독원이 공동 주재하는 퇴직연금사업자 간담회가 9월 2일에서 10월 2일로 재차 연기됐다. 한 달 새 두 번째 순연으로, 간담회는 10월 2일 오후 2시부터 3시 30분까지 서울 로얄호텔에서 김영훈 고용노동부 장관과 이찬진 금융감독원장이 함께 주재한다. 국민연금공단의 기금형 퇴직연금 참여 여부, 수탁법인 인가 대상을 5~8개로 제한하는 방안을 둘러싼 독점 우려, 손해배상 책임 강화 방침이 쟁점으로 남아 있다. 연내 근로자퇴직급여보장법 개정안 통과 목표의 재조정이 불가피하다는 관측이 나온다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-09-14", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": []}, {"id": "ffde5c86587a", "title": "'공시 넘어 사후관리'…디폴트옵션 3년, 최초 평가 시동", "summary": "고용노동부가 올해 디폴트옵션 승인 상품에 대한 첫 정기 평가를 실시한다. 2023년 7월 본격 시행된 디폴트옵션은 올해 3월 기준 41개 금융기관이 324개 상품을 승인받아 운용 중이며, 최초 승인 이후 3년이 지난 상품이 평가 대상으로 장기 성과 수익률과 위험 관리 등을 본다. 고용노동부는 첫 평가인 만큼 성과 저조 사유를 파악하고 개선 방안을 마련하는 데 핵심 의의를 두되, 문제가 지속되는 상품에는 불이익을 부여할 계획이다. 5월에 선정한 정책연구용역은 내년 2월까지 진행된다.", "category": "제도·규제", "importance": 5, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140567806179ad43907_18", "related": []}, {"id": "504d525f7a1e", "title": "개인 국채투자, '퇴직연금서 투자'에 흥행…9월 청약서 초과 수요", "summary": "이달 개인투자용 국채 청약에서 확정기여형(DC) 퇴직연금과 개인형퇴직연금(IRP) 계좌를 통한 청약액이 1천435억원으로 집계됐다. 퇴직연금 청약에 일반투자 창구 청약까지 더해지면서 9월 전체 청약액은 재정경제부가 공고한 모집예정액 2천300억원을 넘어섰고, 지난 5월 이후 처음으로 2천억원을 돌파했다. 청약은 9월 9일부터 15일까지 신한은행·하나은행·NH농협은행 등 3개 은행과 미래에셋증권·삼성증권·한국투자증권·KB증권·NH투자증권 등 5개 증권사를 통해 이뤄졌으며, 대상 채권은 10년물과 20년물이다. 10년물 표면금리는 연 4.415%, 20년물은 연 4.57%이고 두 상품 모두 연 0.35%포인트의 가산금리가 적용된다.", "category": "운용·상품", "importance": 4, "source": "연합뉴스", "published": "2026-09-17", "url": "https://www.yna.co.kr/view/AKR20260917099600008", "related": [{"title": "\"1억 넣어두면 20년 뒤 2.6억\"…연금개미들 외면한 이유", "source": "한국경제", "url": "https://www.hankyung.com/article/202609168563i"}, {"title": "[돈이 보이는 경제] 퇴직연금으로 국채 산다…\"10년 만기 때 확정 수익 60%\"", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/14/2026091490036.html"}, {"title": "퇴직연금으로 산 개인투자용 국채, 10년 뒤 수익률은?", "source": "브라보마이라이프", "url": "https://bravo.etoday.co.kr/view/atc_view/20072"}, {"title": "퇴직연금으로 국채 투자…첫 청약부터 흥행", "source": "SBS", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008759230"}, {"title": "[흔들리는 국채 공식④] 퇴직연금에 국채 담을까…개인투자자의 새 셈법", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4435180"}, {"title": "[필드뒷얘기] 퇴직연금 국채로 고객 묶는 증권사", "source": "대한금융신문", "url": "https://www.kbanker.co.kr/news/articleView.html?idxno=225952"}, {"title": "퇴직연금 계좌로 국채 투자하면 포인트 제공", "source": "서울신문", "url": "https://www.seoul.co.kr/news/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "f9f26933154f", "title": "[이슈체크] 퇴직연금까지 개선 요구…흥국생명, 반복된 감독지적 뒤 '사후관리' 시험대", "summary": "금융감독원 연금감독실은 지난달 31일 흥국생명에 퇴직연금 운영과 관련한 개선 요구 5건을 통보했다. 현물이전 안내가 미흡해 가입자가 제도를 충분히 인지하지 못한 채 불필요하게 매도하거나 운용하지 못할 수 있다는 점, 보너스보험 중도해지이율과 이율보증형2 보험의 금리보증 비용을 산정하면서 시장금리 변동 등 객관적 자료를 충분히 반영하지 않은 점이 지적됐다. 디폴트옵션 성과수수료는 계약일 기준으로 할인 대상을 정해 장기 보유자도 제외되는 구조라는 점, 연금전환특약의 차순위 보험수익자 지정 절차와 배우자 계좌 승계 안내가 부족하다는 점도 함께 지적됐다. 부담금 미납 시 벌칙과 지연이자 관련 안내가 누락된 점도 개선 요구에 포함됐다.", "category": "제도·규제", "importance": 4, "source": "더퍼블릭", "published": "2026-09-18", "url": "https://www.thepublic.kr/news/articleView.html?idxno=318506", "related": []}, {"id": "a6e5af30d59e", "title": "[단독] 5인 미만 사업장 퇴직연금 도입률 10%에 그쳐", "summary": "퇴직연금 미도입 사업장이 121만218곳으로 집계됐고, 이 가운데 30인 미만 사업장이 119만1811곳으로 98.5%를 차지했다. 사업장 규모별 도입률은 5인 미만 10.6%, 5~9인 32.7%, 10~29인 57.3%, 30~49인 74.2%, 50~99인 82.2%, 100인 이상 89.6%로 나타났다. 전체 도입률은 26.5%로 5년째 26%대에 머물렀고, 업종별로는 숙박·음식점업의 93.8%, 부동산업의 89.7%, 농림어업의 89.0%가 퇴직연금을 도입하지 않았다. 가입 대상 근로자 1308만5000명 가운데 697만2000명(53.3%)이 퇴직연금에 가입했다.", "category": "제도·규제", "importance": 4, "source": "한국경제", "published": "2026-09-17", "url": "https://www.hankyung.com/article/202609169177i", "related": []}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": []}, {"id": "507cff298ac3", "title": "미래에셋증권, 5대 시중은행 압도한 '리딩 증권사'…2분기 순이익 1.9조", "summary": "미래에셋증권이 2026년 2분기 순이익 1조9052억원을 기록해 신한은행(1조3015억원), KB국민은행(1조1240억원) 등 5대 시중은행을 모두 앞섰다. 영업이익은 2조4899억원으로 397.5% 늘었고, 세전이익 2조5287억원 가운데 1조6242억원은 스페이스X 평가이익에서 나왔다. 퇴직연금 적립금은 6월 말 80조원에 이르렀고 연간 증가율은 60%를 넘어 시장 평균의 약 2.5배였다. 개인형 퇴직연금에 로보WRAP 서비스를 도입하는 등 연금 자산관리 서비스를 넓혔다.", "category": "업계·경쟁사", "importance": 4, "source": "스포츠서울", "published": "2026-09-15", "url": "https://www.sportsseoul.com/news/read/1634922", "related": []}, {"id": "37880c4dd1e3", "title": "'퇴직연금 인기상품' 채권혼합ETF...미국 금리 상승에 수익률 '흔들'", "summary": "퇴직연금 수요를 타고 성장한 채권혼합형 ETF의 수익률이 금리 상승과 증시 조정으로 흔들리고 있다. 최근 1개월간 'ACE 미국S&P500미국채혼합50액티브'는 6.03%, 'KODEX 200미국채혼합50'은 5.8%, 'TIGER 미국나스닥100채권혼합50'은 4.59% 하락해 각각 기초지수보다 낙폭이 컸다. 타깃데이트펀드(TDF) ETF를 제외한 채권혼합형 ETF는 9월 11일 기준 66개이며 순자산총액은 18조5501억원으로 연초 6조8926억원에서 12조원 가까이 늘었다. 확정기여형(DC)·개인형퇴직연금(IRP)의 위험자산 투자 한도가 70%로 제한돼, 주식 편입 비중 50% 이하인 적격 혼합형 상품이 안전자산으로 분류되면서 자금이 몰렸다.", "category": "운용·상품", "importance": 4, "source": "헤럴드경제", "published": "2026-09-15", "url": "https://biz.heraldcorp.com/article/10873869", "related": []}, {"id": "07602bd7cfce", "title": "[시론] 기금형 제도 도입 이후, 이제 풀어야 할 퇴직연금의 과제", "summary": "박준범 성균관대 겸임교수는 기금형 퇴직연금 도입보다 연금화 부진 해소가 더 시급하다고 지적했다. 계좌 기준 연금 수령 비율은 16.5%에 그치고 평균 근속연수가 7.1년이어서 퇴직급여가 축적되지 않으며, 2022~2024년 3년간 IRP 이전금액 63.8조 원 대비 해지금액이 43.4조 원으로 해지율이 68.1%에 달한다고 밝혔다. 2024년 중도인출의 81.9%는 주택 관련 사유였고, 5인 미만 사업장의 퇴직연금 도입률은 10%대에 머물러 있다. 기금형 도입을 넘어 연금화를 중심으로 제도 개혁을 진행해야 한다고 주장했다.", "category": "제도·규제", "importance": 4, "source": "한국보험신문", "published": "2026-09-14", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=92713", "related": []}, {"id": "e38f37f63d51", "title": "'주식·金 연금까지' 카카오뱅크, 종합금융플랫폼 도약", "summary": "카카오뱅크가 비은행 포트폴리오를 넓히며 퇴직연금 시장 진출을 준비하고 있다. 지난해부터 관련 인력을 채용해 왔고 삼정KPMG의 컨설팅을 마무리했다. 퇴직연금 적립금은 지난해 말 501조 4000억 원으로 500조 원을 처음 넘어섰고 올해 2분기 말 기준 553조 8779억 원에 이른다. 카카오뱅크의 2026년 상반기 당기순이익은 3280억 원으로 전년 동기 대비 24.4% 늘었으며, 주식투자·자동차금융 비교·금 거래 서비스를 차례로 내놓은 데 이어 내년 상반기 캐피탈 사업을 본격화할 계획이다.", "category": "업계·경쟁사", "importance": 4, "source": "한스경제", "published": "2026-09-14", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=864386", "related": []}, {"id": "a5e7a7fba12f", "title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "summary": "NH농협은행이 퇴직연금 계좌에 개인투자용국채를 도입하고 ETF 라인업을 확대한다고 밝혔다. 7월에 22종을 내놓은 데 이어 10월에 36개를 추가한다. 전문가 포트폴리오 서비스의 2026년 상반기 수익률은 공격투자형 기준 40.11%를 기록했다. 금융감독원 통합연금포털 기준 원리금비보장형 수익률에서 3분기 연속 5대 시중은행 중 1위에 올랐다.", "category": "업계·경쟁사", "importance": 3, "source": "퍼블릭타임스", "published": "2026-09-16", "url": "https://www.public25.com/news/articleView.html?idxno=54796", "related": [{"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에 75/"}, {"title": "퇴직연금으로 산 개인투자용 국채, 10년 뒤 수익률은?", "source": "브라보마이라이프", "url": "https://bravo.etoday.co.kr/view/atc_view/20072"}, {"title": "퇴직연금으로 국채 투자…첫 청약부터 흥행", "source": "SBS", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008759230"}, {"title": "[흔들리는 국채 공식④] 퇴직연금에 국채 담을까…개인투자자의 새 셈법", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4435180"}, {"title": "[필드뒷얘기] 퇴직연금 국채로 고객 묶는 증권사", "source": "대한금융신문", "url": "https://www.kbanker.co.kr/news/articleView.html?idxno=225952"}, {"title": "\"월급 끊겨도 매달 400만원 들어옵니다\"…은퇴 앞둔 직장인이 알아야 할 자산", "source": "매일경제", "url": "https://www.mk.co.kr/article/12151487"}, {"title": "개인투자용 국채 품은 퇴직연금 계좌···증권사, 연금자금 유치전", "source": "서울파이낸스", "url": "https://www.seoulfn.com/news/articleView.html?idxno=637698"}, {"title": "퇴직연금 계좌로 국채 투자하면 포인트 제공", "source": "서울신문", "url": "https://www.seoul.co.kr/news/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}, {"title": "[금상소] IRP·DC에 들어온 개인투자용 국채…10년·20년물 뭐가 나을까", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2624549"}]}, {"id": "8977649855f9", "title": "표류하는 기금형 퇴직연금…간담회 또 연기", "summary": "고용노동부와 금융감독원이 공동 주재하는 퇴직연금사업자 간담회가 9월 2일에서 10월 2일로 재차 연기됐다. 한 달 새 두 번째 순연으로, 간담회는 10월 2일 오후 2시부터 3시 30분까지 서울 로얄호텔에서 김영훈 고용노동부 장관과 이찬진 금융감독원장이 함께 주재한다. 국민연금공단의 기금형 퇴직연금 참여 여부, 수탁법인 인가 대상을 5~8개로 제한하는 방안을 둘러싼 독점 우려, 손해배상 책임 강화 방침이 쟁점으로 남아 있다. 연내 근로자퇴직급여보장법 개정안 통과 목표의 재조정이 불가피하다는 관측이 나온다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-09-14", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29", "related": [{"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "a5e7a7fba12f", "title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "summary": "NH농협은행이 퇴직연금 계좌에 개인투자용국채를 도입하고 ETF 라인업을 확대한다고 밝혔다. 7월에 22종을 내놓은 데 이어 10월에 36개를 추가한다. 전문가 포트폴리오 서비스의 2026년 상반기 수익률은 공격투자형 기준 40.11%를 기록했다. 금융감독원 통합연금포털 기준 원리금비보장형 수익률에서 3분기 연속 5대 시중은행 중 1위에 올랐다.", "category": "업계·경쟁사", "importance": 3, "source": "퍼블릭타임스", "published": "2026-09-16", "url": "https://www.public25.com/news/articleView.html?idxno=54796", "related": [{"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "f8e6de7fbf89", "title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "summary": "정부가 2026년 9월 1일 발표한 기초연금 개편안은 수급 대상인 소득 하위 70%를 셋으로 나눠 하위 30%는 월 38만원, 30~45%는 35만9000원으로 올리고 45~70%는 35만원으로 묶는 내용이다. 필자인 남찬섭 동아대 교수는 충분한 사회적 논의 없이 발표됐고 기초연금을 노인 70%의 빈곤 예방 장치가 아니라 빈곤 구제 수단으로 다뤘다고 비판했다. '하후상박'을 내세웠지만 실제로 인상 혜택을 보는 수급자는 약 40%에 그치고 하위 7%는 기초생활보장 급여가 깎여 상쇄된다고 지적했다. 대안으로는 모든 노인에게 지급하고 과세하는 노인 기본소득을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "슬로우뉴스", "published": "2026-09-15", "url": "https://slownews.kr/166386", "related": [{"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}]}, {"id": "ab894d0c4867", "title": "[금융 HOT 뉴스] KB자산운용, 골드 특별자산 펀드 눈길", "summary": "KB자산운용이 골드 특별자산 펀드의 운용 구조를 파생상품 중심에서 국내외 금 ETF 활용 방식으로 바꿨다. 파생상품 위험평가액을 40% 이하로 낮춰 퇴직연금 적격 요건을 충족했고 운용보수는 기존 대비 약 40% 인하했다. 비교지수는 LBMA Gold PM Price로 변경했고 환매대금은 4영업일 내에 지급한다. 현재 국민은행과 신한투자증권의 퇴직연금 계좌에서 매매할 수 있다.", "category": "운용·상품", "importance": 2, "source": "비즈월드", "published": "2026-09-16", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146330", "related": [{"title": "KB자산운용, 18년 된 금 펀드 손질…퇴직연금서도 투자", "source": "AP신문", "url": "https://www.apnews.kr/news/articleView.html?idxno=3051270"}]}, {"id": "26bad6a1c84a", "title": "이형일 \"500조 규모 퇴직연금, 수익률 저조…법안 준비 중\"", "summary": "이형일 부총리 겸 재정경제부 장관 후보자가 9월 15일 국회 재정경제기획위원회 인사청문회에서 퇴직연금 제도 개선과 관련해 노사정이 합의한 사항을 바탕으로 법안을 준비하고 있다고 밝혔다. 이 후보자는 퇴직연금 적립금이 500조원까지 올라갔는데 수익률이 저조하다며 노후소득 보장 기능이 제대로 작동하고 있느냐는 논의가 많다고 말했다. 노사정은 지난 2월 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화에 합의했고, 정부는 이를 바탕으로 연내 근로자퇴직급여보장법 개정을 추진하고 있다. 이광재 의원이 미국 401(k)를 거론하며 국가적 시스템이 필요하다고 지적한 데 대한 답변이다.", "category": "제도·규제", "importance": 5, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/economy/trend/6290971", "related": []}, {"id": "ffde5c86587a", "title": "'공시 넘어 사후관리'…디폴트옵션 3년, 최초 평가 시동", "summary": "고용노동부가 올해 디폴트옵션 승인 상품에 대한 첫 정기 평가를 실시한다. 2023년 7월 본격 시행된 디폴트옵션은 올해 3월 기준 41개 금융기관이 324개 상품을 승인받아 운용 중이며, 최초 승인 이후 3년이 지난 상품이 평가 대상으로 장기 성과 수익률과 위험 관리 등을 본다. 고용노동부는 첫 평가인 만큼 성과 저조 사유를 파악하고 개선 방안을 마련하는 데 핵심 의의를 두되, 문제가 지속되는 상품에는 불이익을 부여할 계획이다. 5월에 선정한 정책연구용역은 내년 2월까지 진행된다.", "category": "제도·규제", "importance": 5, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140567806179ad43907_18", "related": []}, {"id": "69dd458f15f4", "title": "퇴직연금 550조 커졌는데…보험사 점유율 20% 무너졌다", "summary": "퇴직연금 시장이 553조원대로 커지는 사이 보험업계 점유율이 20% 아래로 떨어졌다. 상반기 증권사는 4조1000억원 순유입을 기록한 반면 보험사는 1799억원 순유출을 냈다. 실물이전 확대로 가입자가 금융사를 옮기기 쉬워지면서 사업자 간 경쟁이 격화된 결과다. DB형에 집중된 포트폴리오가 약점으로 지목되자 삼성·한화·교보생명 등이 DC형·IRP 강화와 ETF 상품 확대로 대응하고 있다.", "category": "업계·경쟁사", "importance": 5, "source": "뉴데일리", "published": "2026-09-10", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/10/2026091000173.html", "related": []}, {"id": "de4a8500263d", "title": "수익률 32%에도 돈이 안 온다…디폴트옵션의 역설", "summary": "디폴트옵션 시행 3년 차 데이터에서 적극투자형 1년 수익률이 32.66%를 기록했으나 자금의 82.5%는 여전히 안정형에 머물러 있다. 은행권은 고객 자금 대부분을 안정형에 두는 반면 증권사 고객은 위험자산에 투자해 업권별로 뚜렷이 갈렸다. 제도의 병목은 상품 품질이 아니라 자금이 좋은 상품에 도달하는 경로에 있다는 지적이다.", "category": "운용·상품", "importance": 5, "source": "한경머니", "published": "2026-09-10", "url": "https://magazine.hankyung.com/money/article/202608199155c", "related": []}, {"id": "937d44176934", "title": "퇴직연금 6.9조 이동…은행서 증권사로 자금 쏠림, 국채로 2차 경쟁", "summary": "올해 상반기 퇴직연금 실물이전 규모가 약 6조9000억원으로 전년 동기 약 3조2000억원의 2.2배에 달해 2024년 제도 시행 이후 반기 기준 최대를 기록했다. 업권별로는 증권사가 4조1513억원 순유입, 은행이 3조9714억원 순유출, 보험이 1799억원 순유출이었고, 증권사 적립금은 2분기 말 165조468억원으로 1분기 대비 16.5% 늘어 은행권 증가율 6.6%를 크게 앞섰다. 실물이전 규모는 가입자가 직접 상품을 고르는 IRP에서 6조8000억원으로 가장 컸다. 9월부터 개인투자용 국채가 DC·IRP 계좌에 편입되면서 증권사는 안정형 상품까지 더해 고객 확보에 나서고, 은행권은 ETF 거래 편의성 개선으로 맞서고 있다.", "category": "운용·상품", "importance": 5, "source": "더트래커", "published": "2026-09-10", "url": "https://thetracker.co.kr/View.aspx?No=4221950", "related": []}, {"id": "6dd0fa0960d5", "title": "퇴직연금 디폴트옵션 첫 순유출…2분기 1조4000억 감소", "summary": "디폴트옵션 운용자금이 2023년 제도 도입 후 처음으로 순유출을 기록해 2분기에 약 1조4000억원이 줄었다. 안정형에서만 1조4891억원이 빠져나갔고, 증시 호황으로 위험자산 투자가 늘면서 자금이 대거 이동했다. 평가액 기준 적립액 증가는 117억원에 그쳐 시장 전체 증가분 45조2000억원에 비하면 미미한 수준이다.", "category": "운용·상품", "importance": 5, "source": "한국경제", "published": "2026-09-08", "url": "https://www.hankyung.com/article/202609081009i", "related": []}, {"id": "362d60df2f63", "title": "퇴직연금도 자산배분 시대…NH투자증권, DB 적립금 컨설팅 강화", "summary": "NH투자증권이 연금자산관리본부 산하 DB적립금 운용 협의체를 통해 기업별 맞춤형 IPS(적립금운용계획서) 컨설팅을 확대한다. DB형은 적립금 수익률이 임금상승률에 못 미치면 기업이 추가 적립을 부담해야 해 자산배분 전략의 필요성이 커지고 있다. 전담 계리사와 자산배분·포트폴리오 전문가로 구성된 협의체가 부채 분석부터 리밸런싱까지 5단계로 지원한다. 고객사 한국선급은 IPS 개정 후 DB 적립금 1년 수익률이 5월 말 기준 20%를 넘어 고용노동부·금융감독원 모범사례로 선정됐다.", "category": "법인·자금운용", "importance": 5, "source": "매일경제", "published": "2026-09-08", "url": "https://www.mk.co.kr/news/stock/12147172", "related": []}, {"id": "f7cf0468c30c", "title": "정부, 올 하반기 퇴직연금 디폴트옵션 손질", "summary": "고용노동부가 올해 하반기 기금형 퇴직연금 도입과 함께 디폴트옵션(사전지정운용제도)도 개편하겠다고 밝혔다. 대기기간과 디폴트옵션 상품 평가체계를 명확히 하고, 현재 제도가 적용되지 않는 자금까지 적용 범위를 넓히는 것이 핵심이다. 현재 디폴트옵션 자금의 82.5%가 안정형에 쏠려 있는 점도 개선 대상으로 지목됐다. 정부는 퇴직연금 의무화와 사외적립 의무화를 함께 추진하며 올 하반기를 퇴직연금 대격변기로 보고 있다.", "category": "제도·규제", "importance": 5, "source": "파이낸셜뉴스", "published": "2026-09-07", "url": "https://www.fnnews.com/news/202609071643275392", "related": []}, {"id": "f9f26933154f", "title": "[이슈체크] 퇴직연금까지 개선 요구…흥국생명, 반복된 감독지적 뒤 '사후관리' 시험대", "summary": "금융감독원 연금감독실은 지난달 31일 흥국생명에 퇴직연금 운영과 관련한 개선 요구 5건을 통보했다. 현물이전 안내가 미흡해 가입자가 제도를 충분히 인지하지 못한 채 불필요하게 매도하거나 운용하지 못할 수 있다는 점, 보너스보험 중도해지이율과 이율보증형2 보험의 금리보증 비용을 산정하면서 시장금리 변동 등 객관적 자료를 충분히 반영하지 않은 점이 지적됐다. 디폴트옵션 성과수수료는 계약일 기준으로 할인 대상을 정해 장기 보유자도 제외되는 구조라는 점, 연금전환특약의 차순위 보험수익자 지정 절차와 배우자 계좌 승계 안내가 부족하다는 점도 함께 지적됐다. 부담금 미납 시 벌칙과 지연이자 관련 안내가 누락된 점도 개선 요구에 포함됐다.", "category": "제도·규제", "importance": 4, "source": "더퍼블릭", "published": "2026-09-18", "url": "https://www.thepublic.kr/news/articleView.html?idxno=318506", "related": []}, {"id": "a6e5af30d59e", "title": "[단독] 5인 미만 사업장 퇴직연금 도입률 10%에 그쳐", "summary": "퇴직연금 미도입 사업장이 121만218곳으로 집계됐고, 이 가운데 30인 미만 사업장이 119만1811곳으로 98.5%를 차지했다. 사업장 규모별 도입률은 5인 미만 10.6%, 5~9인 32.7%, 10~29인 57.3%, 30~49인 74.2%, 50~99인 82.2%, 100인 이상 89.6%로 나타났다. 전체 도입률은 26.5%로 5년째 26%대에 머물렀고, 업종별로는 숙박·음식점업의 93.8%, 부동산업의 89.7%, 농림어업의 89.0%가 퇴직연금을 도입하지 않았다. 가입 대상 근로자 1308만5000명 가운데 697만2000명(53.3%)이 퇴직연금에 가입했다.", "category": "제도·규제", "importance": 4, "source": "한국경제", "published": "2026-09-17", "url": "https://www.hankyung.com/article/202609169177i", "related": []}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": []}, {"id": "507cff298ac3", "title": "미래에셋증권, 5대 시중은행 압도한 '리딩 증권사'…2분기 순이익 1.9조", "summary": "미래에셋증권이 2026년 2분기 순이익 1조9052억원을 기록해 신한은행(1조3015억원), KB국민은행(1조1240억원) <script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  function render() {
    var doc = DATA.periods[currentPeriod];

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      button.setAttribute('aria-selected', String(PERIODS[index].key === currentPeriod));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    listEl.textContent = '';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
