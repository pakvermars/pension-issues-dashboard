  body {

    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야

  .topline { height: 4px; background: var(--kiwoom-deep); }

  /* 수집이 멈춰도 index.html은 그대로 남아 아무 일 없어 보인다. 그래서
     보는 사람의 시계와 비교해 묵은 정도를 화면에서 직접 말한다.

  .masthead {

    gap: 12px 20px;

    margin: 0 0 14px;

  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {

    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;

    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;

  }

  .search input::placeholder { color: var(--rule); }

  .range .clear {

    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);

    cursor: pointer;

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */

    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {

    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;

    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;

  .filters button[aria-pressed="true"] {

    border-bottom-color: var(--accent);

    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;

    padding: 26px 0;
    border-bottom: 1px solid var(--rule);

    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;

    .rank { font-size: 1.25rem; }

    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

새 개인정보 47만건 유출", "summary": "지난달 24일 해킹 사고를 당한 미래에셋생명의 개인신용정보 유출 인원이 당초 약 6800명에서 5일 기준 1만418명으로 53.2% 늘었다. 금융당국 현장 점검에서 추가 피해가 확인됐으며, 이름·주민등록번호·CI와 함께 퇴직소득원천징수영수증, 지급명세서, 퇴직연금 현황 등도 유출된 것으로 확인됐다. 유출 규모가 1만명을 넘어 신용정보법상 72시간 내 금융당국 신고와 정보주체 통지 의무가 생겼고, 미래에셋생명은 신고 절차를 진행했다. 금융당국 집계로 최근 한 달간 금융권 37개사에서 약 47만3000건이 유출됐고 자금 탈취 피해는 약 10억원이다.", "category": "업계·경쟁사", "importance": 3, "source": "포쓰저널", "published": "2026-11-18", "url": "http://www.4th.kr/news/articleView.html?idxno=2122080"}, {"id": "ea71d6cdf3e1", "title": "[손안의 투자 전쟁①] 거래 넘어 자산관리로…증권·운용사 플랫폼 경쟁", "summary": "증권사들이 주문 중심 MTS를 AI 투자정보, 포트폴리오 관리, 연금 서비스를 갖춘 종합투자 플랫폼으로 바꾸고 있다. 미래에셋증권은 지난달 M-STOCK을 MAPS로 개편해 주식·연금·ETF 정보를 담았고, 메리츠증권 모음은 출시 약 2개월 만에 설치 고객 35만명을 확보했다. 하나증권은 DC·IRP 계좌에서 ETF·ETN·리츠를 정기 매수하는 ETF 모으기를 시작했다. 한국투자신탁운용은 지난달 타사 상품까지 비교하는 자체 플랫폼 투자플러스를 내놓았고, 삼성자산운용 포트래빗에서는 연금저축·IRP 포트폴리오를 확인할 수 있다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스투데이", "published": "2026-11-18", "url": "https://www.news2day.co.kr/article/20261118500006"}, {"id": "fa231637c697", "title": "KB자산운용, 美 초대형주·만기매칭형 회사채 ETF 동시 상장", "summary": "KB자산운용이 18일 RISE 미국초대형주TOP10 ETF와 RISE 27-11 회사채(AA-이상)액티브 ETF를 동시에 상장한다. 미국초대형주TOP10은 NYSE·나스닥 상장 시가총액 상위 10개 종목에 투자하며 총보수는 연 0.30%다. 27-11 회사채 ETF는 2027년 10~12월 만기 AA- 이상 회사채에 투자하는 만기매칭형으로 예상 만기수익률은 세전 연 4.13%, 총보수는 연 0.05%다. 회사채 ETF는 DC·IRP 계좌에서 적립금의 100%까지 편입할 수 있다.", "category": "운용·상품", "importance": 2, "source": "파이낸셜포스트", "published": "2026-11-18", "url": "https://www.financialpost.co.kr/news/articleView.html?idxno=301568"}, {"id": "7306d207e490", "title": "미래에셋 액티브 커버드콜 ETF 순자산 4조원 돌파…LSEG와 AI 협력, 퇴직연금 제도 대응 강화", "summary": "미래에셋자산운용의 액티브 커버드콜 ETF 4종 합산 순자산이 4조917억원으로 국내 시장 점유율 52%를 기록했다. 미래에셋증권은 11일 기업 인사·퇴직연금 담당자 약 100명을 대상으로 2026년 퇴직연금 트렌드와 이슈 세미나를 열었으며, 2028년부터 단계적으로 추진되는 퇴직급여 사외적립 의무화를 배경으로 삼았다. 미래에셋투자와연금센터는 세액공제, 과세이연, 퇴직연금 중간정산과 경영성과급 절세 방안을 담은 안내서를 발간했다. 미래에셋증권은 런던증권거래소그룹과 AI 자산관리 서비스 고도화 업무협약도 맺었다.", "category": "업계·경쟁사", "importance": 2, "source": "웹이코노미", "published": "2026-11-18", "url": "https://www.webeconomy.co.kr/news/articleView.html?idxno=2378436"}, {"id": "2cced28ff71d", "title": "“퇴직금 9000만원” 그 50대, 6년만에 5억 모은 ‘독한 연금술’", "summary": "은퇴 직전 투자자들이 늦었다는 조급함에 시작을 포기하거나 몰빵 투자에 나서는 경향을 짚으며, 50세에 연금 준비를 시작해도 늦지 않다고 설명한다. 개인연금 수령 가능 연령 55세는 20여년 전 기준이며 지금은 90세까지를 염두에 두고 연금을 설계해야 한다고 본다. 55세에 계좌를 열어도 수령을 늦추면 납입과 운용 시간을 벌 수 있고, 수령 중에도 남은 돈은 계좌 안에서 계속 운용된다. 은퇴를 3년 앞둔 57세 직장인이 연금계좌 납입 한도 1800만원을 채우는 사례를 소개한다.", "category": "가입자·사회", "importance": 2, "source": "중앙일보 (유료)", "published": "2026-11-18", "url": "https://www.joongang.co.kr/article/25479638"}, {"id": "11950612bc0e", "title": "\"저출생보다 개혁 지체 무섭다, 연금·건보 바꿔야\"", "summary": "조동철 전 KDI 원장은 저출생보다 인구 증가를 전제로 설계된 제도를 바꾸지 못하는 것이 더 큰 문제라며 국민연금과 건강보험을 대표 사례로 꼽았다. 출생아 감소와 기대수명 증가에 맞춰 제도를 재설계하고 법정 노인 연령도 높일 필요가 있다고 말했다. 기존 제도를 바꾸면 반발이 불가피하므로 개혁이 왜 필요한지 설명하고 설득해야 한다고 강조했다. 고령층에는 직접적인 경제적 지원이 필요하지만 성과에 따른 보상은 유지해야 한다고 덧붙였다.", "category": "가입자·사회", "importance": 2, "source": "동행미디어 시대", "published": "2026-11-18", "url": "https://www.sidae.com/article/2026110508121952826"}, {"id": "fd4929de1efa", "title": "퇴직과 연금사이, 퇴직연금이 있다", "summary": "장선필 연금연구소 대표는 1966년생이 60세 퇴직 후 64세 국민연금 수급까지 최대 4년, 1969년생부터는 5년의 소득 공백을 겪는다고 짚었다. 2025년 퇴직연금 신규 수급 계좌의 83.5%가 일시금을 택했고 연금 수령 계좌 평균 수령액은 1억4891만원으로 일시금 계좌 평균 1833만원의 8배 이상이다. 퇴직금 1억5000만원을 4년간 전액 수령하면 초기 월 321만원, 24년 균등 수령이면 월 73만원, 절반을 4년간 받고 나머지를 20년간 받으면 초기 월 166만원·이후 월 43만원으로 추산했다. IRP 적립금을 국민연금 수급 전 집중 지급하는 브릿지분과 이후 장기 지급하는 보충분으로 나누는 브릿지연금특례를 제안했다.", "category": "가입자·사회", "importance": 1, "source": "뉴스퀘스트", "published": "2026-11-18", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=305262"}, {"id": "604197bb4659", "title": "정년퇴직 후 연금소득 공백을 초래한 공무원연금법 부칙을 합헌이라 본 결정", "summary": "권두섭 변호사가 공무원 퇴직연금 지급개시연령을 단계적으로 65세까지 올린 공무원연금법 부칙에 대한 헌법재판소 합헌 결정을 평석했다. 1996~2007년 임용된 지방공무원들은 정년 60세에 퇴직해도 연금을 바로 받지 못해 2~5년의 소득 공백을 겪는다. 재판관 4인이 합헌, 4인이 위헌 의견을 냈으나 위헌 정족수 6인에 못 미쳐 합헌으로 결정됐다. 위헌 의견은 소득 공백에 대한 보호장치가 없고 조기퇴직연금을 받으면 최대 25% 감액된다는 점을 들었으며, 필자는 2015년 개혁 당시 전제된 정년연장이 10년이 지나도록 이행되지 않았다고 비판했다.", "category": "가입자·사회", "importance": 1, "source": "매일노동뉴스", "published": "2026-11-18", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237800"}, {"id": "6392dcdec547", "title": "[열린송현] 100세 시대, 낡은 보험 세제부터 손질해야", "summary": "허연 중앙대 명예교수는 국민연금 순소득대체율이 30%대 후반으로 OECD 평균 63%에 크게 못 미친다고 지적했다. 정부가 연금저축과 IRP의 세액공제 한도를 꾸준히 올려 왔지만 낼 세금이 없는 저소득층에게는 실효성이 낮다고 봤다. 수령 단계 비과세를 제공하는 저축성보험을 사실상 유일한 사적 안전망으로 평가하며, 당국이 일시납 비과세 한도를 2억원에서 1억원으로 줄이고 월 적립식은 150만원 상한에 묶어둔 점을 비판했다. 만기 일시금 수령 방식에 한해 누적 물가상승률을 반영해 한도를 점진적으로 현실화하자고 제안했다.", "category": "가입자·사회", "importance": 1, "source": "서울경제", "published": "2026-11-18", "url": "https://www.sedaily.com/article/20115405?ref=naver"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-11-11 ~ 2026-11-17", "generated_at": "2026-11-18T07:05:15+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "96986c106e5f", "title": "‘투자하는 연금’ 이끄는 미래에셋證…적립금 압도적 1위·ETF 25조원 [퇴직연금 542조 대격변 2-①]", "summary": "미래에셋증권의 올해 3분기 말 퇴직연금 적립금은 49조9034억원으로 증권업계 1위이며 2위 회사의 약 1.8배 규모다. DC형 23조3696억원과 IRP형 21조3498억원이 성장을 이끌었고, DB형 적립금은 5조1840억원으로 13% 줄었다. DC·IRP 계좌의 ETF 잔고는 9월 말 24조6700억원으로 2023년 말보다 6.3배 늘었고, 원리금비보장상품 비중은 DC형 76.6%, IRP형 76.2%다. 적립금 1조원 이상 증권사 기준 10년 연환산 수익률은 DC형 6.11%, IRP형 5.90%로 1위이며, 올해 1~10월 타 금융기관에서 이전된 적립금은 2조8000억원이다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-17", "url": "https://www.etoday.co.kr/news/view/2648643", "related": []}, {"id": "8a6ff2b99e7c", "title": "노사정, 퇴직연금 기능강화 입법 협력…영세사업장 연착륙 지원", "summary": "고용노동부는 16일 퇴직연금 노사정TF 간담회를 열어 퇴직연금 기능강화 방안의 입법 추진 과정에서 고려할 사항을 논의했다. 기능강화 방안은 퇴직급여 사외적립을 2028년 100인 이상, 2029년 10~99인, 2030년 10인 미만 사업장 순으로 의무화하고 기금형 퇴직연금을 활성화하는 것이 핵심이다. 참석자들은 영세 사업장의 어려움을 살피고 기금형이 유형별 장점을 살려 균형 있게 발전하도록 지원해야 한다고 밝혔다. 노사정은 대부분의 과제가 법률 개정을 수반하는 만큼 근로자퇴직급여보장법 개정까지 협력하기로 했다.", "category": "제도·규제", "importance": 4, "source": "연합뉴스", "published": "2026-11-16", "url": "https://www.yna.co.kr/view/AKR20261113167000530", "related": []}, {"id": "8cdc5764c17b", "title": "'체불 방지'서 '기금형·자동연금'으로…20년 대수술 속 증권사 파이 30% 육박", "summary": "금융감독원 통합연금포털에 따르면 올해 3분기 말 전체 퇴직연금 적립금은 542조1214억원이다. 지난해 3분기 대비 전체 적립금이 17.99% 늘어나는 동안 증권업권은 119조7275억원에서 160조2935억원으로 33.88% 급증해 은행권 순증액 34조4442억원을 추월했다. 같은 기간 은행 점유율은 52.46%에서 50.82%로 낮아졌다. 정부는 지난달 29일 발표한 기능강화 방안에서 IRP 위험자산 투자 한도를 70%보다 단계적으로 높이고 IMA와 발행어음의 DC·IRP 편입을 허용하기로 했다.", "category": "업계·경쟁사", "importance": 4, "source": "이투데이", "published": "2026-11-16", "url": "https://www.etoday.co.kr/news/view/2647920", "related": []}, {"id": "df6d8c8ff511", "title": "증시 급락에 퇴직연금 수익률 급감…적립금 11조7천억원 감소", "summary": "올해 3분기 말 퇴직연금 적립금은 542조1214억원으로 6월 말 553조8779억원보다 11조7565억원(2.1%) 줄었으며, 분기 적립금 감소는 2020년 1분기 이후 처음이다. 유형별 감소액은 IRP 5조129억원, DC형 3조8374억원, DB형 2조9062억원으로 IRP와 DC형이 전체 감소액의 약 75%를 차지했다. 증권사 11곳의 DC형 원금비보장상품 연간 누적 수익률은 2분기 말 52.85%에서 14.46%로, IRP는 46.97%에서 14.19%로 떨어졌다. DB형 수익률은 11.35%에서 3.86%로 낮아졌다.", "category": "운용·상품", "importance": 4, "source": "광주매일신문", "published": "2026-11-16", "url": "http://www.kjdaily.com/article.php?aid=1794759721692238276", "related": []}, {"id": "133e90c36463", "title": "“원리금 보장만” “위험자산 반 이상”…퇴직연금 가입자 돈 굴리기 양극화", "summary": "금융감독원에 따르면 퇴직연금 적립금은 2023년 말 382조원에서 올해 6월 말 558조원으로 늘었다. 가입자의 64.5%는 적립금 전액을 원리금 보장형에 두고 있고, 33.9%는 절반 이상을 위험자산에 투자했으며, 분산 투자로 균형을 맞춘 경우는 1.6%에 그쳤다. 실적배당형 비중은 2023년 12.8%에서 올해 6월 말 35.5%로 약 2.8배 늘었고 그중 50.4%가 ETF에 투자됐다. 금감원은 11월 3일 장기·분산 투자를 돕는 '퇴직연금 가이드북'을 발간했으며, 디폴트옵션도 대부분 원리금 보장형에 머물러 있다고 밝혔다.", "category": "운용·상품", "importance": 3, "source": "서울신문", "published": "2026-11-17", "url": "https://www.seoul.co.kr/news/economy/finance/2026/11/17/20261117031002", "related": [{"title": "같은 퇴직금, 20년 뒤엔 1억6천 차이…50대 여유 있다면 ‘보증형 보험’이 대안", "source": "경향신문", "url": "https://www.khan.co.kr/article/202611170600051"}, {"title": "김 과장·박 과장, 연금 똑같이 1000만 원씩 냈는데...20년 뒤 계좌 잔고 '충격'", "source": "파이낸셜뉴스", "url": "https://www.fnnews.com/news/202611161529480756"}, {"title": "퇴직연금 적립금 558조 넘겨…DC 전환 1년만 118% 증가", "source": "SBS Biz", "url": "https://biz.sbs.co.kr/article_hub/20000346629"}]}, {"id": "df12701ef326", "title": "정효영 연금지원본부장 “가입자 92% 수익…AI가 먼저 노후자산 챙기는 시대 연다” [퇴직연금 542조 대격변 2-②]", "summary": "미래에셋증권 정효영 연금지원본부장은 인터뷰에서 올해 3분기 말 기준 플러스 수익을 낸 가입자 비중이 92.1%라고 밝혔다. 고객의 투자 상황을 AI로 먼저 분석해 맞춤 해법을 제시하는 '에이전틱 WM'을 강조하고, 매월 자산배분위원회를 열어 모델포트폴리오와 로보어드바이저 추천을 제공한다고 설명했다. 연금 고객의 70%는 다이렉트 고객이며, 영업점 상품은 분기별 상품선정위원회에서 참석 위원 3분의 2 이상 동의로 편입·편출을 결정한다. 기금형 퇴직연금 도입에 대비해 그룹 차원의 기금형 수탁법인 출범을 검토 중이라고 밝혔다.", "category": "업계·경쟁사", "importance": 3, "source": "이투데이", "published": "2026-11-17", "url": "https://www.etoday.co.kr/news/view/2648751", "related": []}, {"id": "b4cf553e16a6", "title": "내 퇴직연금 '원리금 보장형'인데 손실 났다고? 이유는", "summary": "지난해 말 기준 퇴직연금 적립금의 75.4%인 378조1000억원이 원리금보장형이며, 전문가들은 금리만 보지 말고 만기·중도해지 조건과 예금자보호 여부를 함께 따지라고 조언했다. 개인투자용 국채는 만기 보유 시 표면금리에 가산금리 0.350%를 더해 연복리로 적용되지만, 발행 1년 뒤 중도 환매하면 가산금리와 연복리 효과가 사라져 단리만 적용된다. 정기예금과 GIC는 디폴트옵션 도입 후 자동 재연장이 막혀 만기 확인이 필요하고, ELB는 중도 상환 시 원금 손실이 생길 수 있다. DC·IRP의 예금보호 대상 적립금은 금융기관별 1인당 최대 1억원까지 보호되지만 ELB와 RP는 예금자보호 대상이 아니다.", "category": "운용·상품", "importance": 3, "source": "아시아경제", "published": "2026-11-17", "url": "https://view.asiae.co.kr/article/2026111616000798476", "related": []}, {"id": "e5a2f2f3a3d1", "title": "미래에셋·우리은행 잇단 전산 사고… 600조 퇴직연금 시장의 드러난 '뇌관'", "summary": "미래에셋생명은 10월 26일 해킹으로 고객 개인정보가 유출됐고 조사 과정에서 퇴직연금 거래정보도 빠져나간 것으로 드러나 피해 규모는 약 6800명으로 파악됐다. 11월 4~5일에는 미래에셋증권이 외부 공격을 받아 고객 3800여명의 계좌번호와 임직원 3만5255명의 개인정보가 유출됐다. 11월 9일에는 우리은행이 퇴직연금 차세대 시스템을 가동한 직후 WON뱅킹에서 비대면 가입과 상품 매수 등 일부 업무가 처리되지 않는 전산장애를 겪었다. 필자는 추가 본인확인, 시스템 개편 시 공통 보상 기준, 사업자별 보안·전산 정보 공시, 집중 위험에 대한 감독 강화를 제안했다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스퀘스트", "published": "2026-11-17", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=305159", "related": []}, {"id": "9eb108c523c4", "title": "[핫이슈] 하나증권, 퇴직연금 RA 일임서비스 추진…내년 상반기 출시 목표", "summary": "하나증권이 내년 상반기 출시를 목표로 퇴직연금 로보어드바이저(RA) 일임서비스 시스템을 개발하고 있으며, 혁신금융서비스로 지정된 디셈버앤컴퍼니와 제휴했다. 하나증권의 3분기 말 개인형IRP 적립금은 8925억원으로 전년 동기 대비 52.54% 늘어 증권사 중 네 번째로 높은 증가율을 기록했다. 코스콤 테스트베드 기준 상용화된 퇴직연금 RA 알고리즘 고객은 10월 말 1만9765명, 가입금액은 823억6000만원으로 전년 동기보다 각각 103.9%, 154.4% 증가했다. 삼성·한투·NH·KB·미래에셋·신한 등이 이미 서비스를 내놓았고 키움증권은 9월 혁신금융서비스로 지정받았다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스워치", "published": "2026-11-17", "url": "http://www.newswatch.kr/news/articleView.html?idxno=81821", "related": []}, {"id": "4ee6e999f551", "title": "경남은행, 퇴직연금 수익률 은행권 상위권…디폴트옵션 1위", "summary": "BNK경남은행의 2026년 3분기 퇴직연금 DB형 원리금비보장 상품 직전 1년 수익률이 22.49%로 은행권 11개 사업자 중 2위를 기록했다. 디폴트옵션 적극투자형 포트폴리오의 최근 6개월 수익률은 16.71%로 은행권 1위에 올랐다. 2025년 4분기 1위 이후 2026년 상반기 내내 2위권을 유지했다. 최근 KB자산운용·키움자산운용과 협업해 경남·부산·울산에서 DB형 가입 기업 약 70곳을 대상으로 자산관리 세미나를 열었다.", "category": "업계·경쟁사", "importance": 3, "source": "한스경제", "published": "2026-11-17", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=883716", "related": []}, {"id": "93880a83f27a", "title": "[Epic Why] 은행-보험사 퇴직연금 유치전략 왜 다른가", "summary": "하나은행이 지난 12일 퇴직연금 ETF 당일매매를 시작하면서 국민·신한·우리·하나 4대 시중은행이 모두 ETF를 당일 매도·재매수할 수 있는 환경을 갖췄다. 금융감독원 통합연금포털 기준 3분기 말 은행권 퇴직연금 적립금은 275조4860억원으로 전체 542조1214억원의 50.8%를 차지해 1년 전보다 1.7%포인트 낮아졌고, 같은 기간 증권업권 점유율은 26.1%에서 29.6%로 높아졌다. 적립금 106조원을 보유한 보험업계는 당일매매보다 수수료 완화와 장기 자산관리에 무게를 두며, 삼성생명은 8월 1일부터 IRP 운용관리·자산관리 수수료를 전액 면제하고 한화생명도 이달부터 IRP 운용관리 수수료를 낮췄다. 증권업계는 은행이 ETF 라인업을 개별 등록해야 하고 주문을 20~30분씩 모아 체결하는 구조라 실시간 매매와의 격차가 남는다고 본다.", "category": "업계·경쟁사", "importance": 3, "source": "글로벌에픽", "published": "2026-11-17", "url": "https://www.globalepic.co.kr/view.php?ud=2026111709004124347cc35ccc5c_29", "related": []}, {"id": "2c2c8a4e3fd0", "title": "NH농협금융, 기금형 퇴직연금 시장 진출 준비…계열사 공동 TF 가동", "summary": "NH농협금융지주는 지난 13일 기금형 퇴직연금 도입 대응 설명회를 열고 주요 계열사가 참여하는 상설 TF를 가동한다고 16일 밝혔다. 지주가 전략을 조율하고 농협은행 연금사업부, NH투자증권 OCIO·연금자산관리 조직, NH-Amundi자산운용 연금 부문이 실무를 맡는다. 외부 컨설팅을 통해 수탁법인 설립에 필요한 지배구조와 자산운용 방식, 내부 운영체계를 구체화할 예정이다. 기존 계약형 사업에서는 디폴트옵션과 운용상품 경쟁력을 강화하고 수익률 관리체계를 정비한다.", "category": "법인·자금운용", "importance": 3, "source": "헤럴드경제", "published": "2026-11-16", "url": "https://biz.heraldcorp.com/article/10938068", "related": []}, {"id": "4baafd9a3a6d", "title": "'수익률·성장률 1위' 한국투자증권으로 몰리는 연금 개미들", "summary": "금융감독원 통합연금포털 공시에 따르면 올해 3분기 말 한국투자증권 DC형과 IRP 합산 적립금은 18조5160억원으로 지난해 말 대비 44.8% 늘어 전체 사업자 중 가장 높은 성장률을 기록했다. IRP 적립금은 1년 새 6조4891억원에서 10조4773억원으로 61.5% 증가했다. DB형 원리금비보장 적립금은 1조3862억원으로 증권업계 1위, 비계열사 DB 적립금은 7조3513억원으로 증권사 중 1위였다. DC·IRP 원리금비보장 적립금은 1년 새 6조8556억원에서 13조4025억원으로 95.5% 늘었다.", "category": "업계·경쟁사", "importance": 3, "source": "이투데이", "published": "2026-11-16", "url": "https://www.etoday.co.kr/news/view/2647976", "related": []}, {"id": "4383f5066c4f", "title": "\"고객 자산, 키움에 머무르도록 만들 겁니다\" [WM 리더] 김정범 키움증권 자산관리부문장", "summary": "김정범 키움증권 자산관리부문장은 금융 상품 전 분야에서 톱5 이상의 실적을 거둔다는 목표를 제시했다. 그가 자산관리 영역을 맡은 이후 키움증권의 금융 상품 잔고는 3조 원에서 13조 원으로 늘었다. 김 부문장은 ISA·연금저축·IRP 등 세제 혜택 계좌 수요가 빠르게 늘고 있다고 진단했다. 자산관리 앱을 새로 만드는 '자산관리 퀀텀점프', 'AI PB', VIP 전담 프로세스 등 3대 프로젝트를 추진한다고 밝혔다.", "category": "업계·경쟁사", "importance": 3, "source": "한경머니", "published": "2026-11-16", "url": "https://magazine.hankyung.com/money/article/202610189154c", "related": []}, {"id": "f0dde8a51247", "title": "최종진 한투證 본부장 \"가입자 이익 최우선이 연금 시장 승자...AI로 99% 복제율 구현, 계열사 우대는 제로\"", "summary": "최종진 한국투자증권 연금혁신본부장은 퇴직연금 시장의 최종 승자는 '가입자 이익 최우선' 원칙을 지키는 사업자라고 말했다. 한국투자증권은 자체 구축한 'AI 복제율 엔진'으로 자산배분 모델포트폴리오(MP)를 실제 펀드·ETF 조합으로 구현하며, 복제율 99%가 나오는 조합을 쓰고 계열사 상품을 인위적으로 끼워 넣지 않는다고 설명했다. 구축 중인 'AI 자산배분' 엔진은 수익률보다 리스크 관리에 초점을 뒀다고 밝혔다. 최 본부장은 퇴직연금 운용 주체가 기업에서 개인으로 옮겨가는 머니무브를 증권업계의 성장 기회로 진단했다.", "category": "업계·경쟁사", "importance": 3, "source": "이투데이", "published": "2026-11-16", "url": "https://www.etoday.co.kr/news/view/2648156", "related": []}, {"id": "92e9e1007a0e", "title": "[500조 연금 새 판]①KB금융 '기금형' 솔루션…수탁법인 차별화는", "summary": "KB금융그룹이 정부가 추진하는 기금형 퇴직연금에 대응해 워킹그룹을 구성하고 은행·증권·자산운용 계열사 역량을 결합하는 방안을 검토하고 있다. 3분기 말 국민은행의 DC·IRP 적립금 합계는 39조7250억원으로 신한은행(39조5390억원)을 앞선다. KB증권은 주택도시기금 전담운용기관 우선협상대상자로, KB자산운용은 국민건강보험공단 대체투자 OCIO를 맡고 있으며 국민은행은 2020년부터 임직원 DB에 OCIO 거버넌스를 도입했다. 정부안에서 금융기관 개방형 수탁법인은 최소자본금 120억원을 갖춰야 하고 적립금의 0.25% 수준을 운영위험준비금으로 적립하는 방안도 추진된다.", "category": "법인·자금운용", "importance": 3, "source": "블로터", "published": "2026-11-16", "url": "https://www.bloter.net/news/articleView.html?idxno=678683", "related": []}, {"id": "031306ef96cc", "title": "퇴직연금 합의는 노동입법의 교본[청계광장/이정식]", "summary": "이정식 전 고용노동부 장관은 칼럼에서 정부가 2월 노사정 공동선언에 따른 퇴직연금 개혁 방안을 발표했고, 법 개정 시 2028년 100인 이상, 2029년 10~99인, 2030년 10인 미만 사업장 순으로 사외적립을 의무화할 계획이라고 짚었다. 정부가 내년 예산안에 122억원을 편성해 노사 접점을 만들었다고 평가했다. 정년연장과 주52시간제 예외 같은 쟁점에도 단계적 시행과 재정지원을 함께 설계하고, 노동 법안에 '집행영향평가'를 도입할 것을 제안했다. 합의의 성패는 서명이 아닌 이행에 달렸다고 강조했다.", "category": "제도·규제", "importance": 2, "source": "머니투데이", "published": "2026-11-17", "url": "https://www.mt.co.kr/opinion/2026/11/17/2026111614063933803", "related": []}, {"title": "[핀테크핫이슈] 금융지주 지배구조 개편 본격화…해킹 당한 금융보안원", "summary": "디지털투데이가 지난주 은행·핀테크 업계 소식을 묶어 정리한 주간 기사다. 금융지주 지배구조 개편과 금융보안원 해킹 사고가 머리기사로 다뤄졌다. 퇴직연금 관련으로는 하나은행이 퇴직연금 계좌에서 ETF를 매도한 뒤 당일 재투자가 가능한 서비스를 도입했다는 소식이 실렸다. 그밖에 KB국민은행의 1000만원 이하 상속예금 모바일 지급 신청, 신한은행의 B2B 카드결제 연계 대출 뱅크플러스 출시 등 서비스 소식이 이어졌다.", "category": "업계·경쟁사", "importance": 2, "source": "디지털투데이", "published": "2026-11-17", "url": "https://www.digitaltoday.co.kr/news/articleView.html?idxno=715826", "id": "3cb06c5d6cd5", "related": []}, {"id": "8e03ed4022af", "title": "[경제일보] 하나증권, '하나증권V' 앞세워 고객 접점 확대…자산관리·연금·디지털 강화", "summary": "하나증권이 신규 MTS 하나증권V를 장기 자산관리 플랫폼으로 확대하며 퇴직연금·ISA·발행어음 상품을 잇달아 선보였다. 이달 초 DC·IRP 계좌에서 ETF·ETN·리츠를 매일·매주·매월 단위로 자동 매수하는 퇴직연금 ETF 모으기 서비스를 시작했다. 토스뱅크 목돈 굴리기를 통해 월 10만~200만원 적립식 발행어음도 출시했다. 올해 3분기 누적 순이익은 2800억원대로 전년 동기 대비 60% 이상 증가했다.", "category": "업계·경쟁사", "importance": 2, "source": "아주경제", "published": "2026-11-17", "url": "https://www.ajunews.com/view/20261116084013079", "related": []}, {"id": "403174a8d000", "title": "KB운용, 美 초대형주 ETF·우량 회사채 ETF 동시 상장", "summary": "KB자산운용이 17일 RISE 미국초대형주TOP10 ETF와 RISE 27-11 회사채(AA-이상)액티브 ETF를 동시 상장했다. 초대형주 ETF는 뉴욕증권거래소와 나스닥 상장 종목 중 시가총액 상위 10개에 투자하며 총보수는 연 0.30%, .co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "5dd7e8508fc5", "title": "하나은행, 호남권 첫 시니어 특화 금융라운지 광주에 개점", "summary": "하나은행은 지난 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 금융공간인 '하나더넥스트 광주금융 라운지'를 개점했다. 라운지는 은퇴설계, 상속·증여, 유언대용신탁 상담과 건강관리·문화·주거 등 라이프케어 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산, 예상 지출을 분석하는 '평생소득설계' 상담을 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "545a1b2bec51", "title": "기금형 연금 도입에…금융지주 계열사 합종연횡 채비", "summary": "기금형 퇴직연금 추진이 공식화되면서 주요 금융지주들이 은행을 중심으로 계열사를 동원한 수탁법인 컨소시엄 설립 준비에 돌입했다. 고용노동부는 오는 6일 주요 은행장들을 소집해 기금형 퇴직연금 간담회를 열며, 법 개정 과정에서 금융지주 자회사 공동출자를 허용하는 예외를 마련할 계획이다. NH농협금융은 퇴직연금 제도 개편 대응 TF를, KB금융과 우리금융은 계열사 워킹그룹을 운영하고 있으며 신한금융도 정식 TF를 발족할 예정이다. 5대 금융지주 DC·IRP 적립액은 174조1435억원으로 작년말 대비 15.5% 늘었고, 증권 계열사 비중은 11.2%에서 13.2%로 상승했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-11-03", "url": "https://www.mt.co.kr/finance/2026/11/03/2026110216011686926", "related": [{"title": "기금형 퇴직연금 도입 초읽기… 원팀 꾸리는 금융지주 계열사", "source": "머니투데이", "url": "https://www.mt.co.kr/finance/2026/11/04/2026110319393765961"}]}, {"id": "113078a9f394", "title": "퇴직연금 ‘100% 투자 가능’의 함정…원금까지 보장하진 않아", "summary": "금융감독원은 내년 1월부터 퇴직연금 매매화면과 상품검색 화면에 투자한도와 위험등급을 함께 표시하도록 개선한다고 27일 밝혔으며, 상품제안서와 적립금운용현황보고서에도 위험등급을 병기한다. 일부 사업자가 원금손실 가능성이 있는 상품도 '투자한도 100%'로만 안내해 가입자가 원리금보장형으로 오인할 수 있다는 판단에서다. 올해 상반기 말 퇴직연금 적립금 558조3000억원 가운데 실적배당형은 198조원이고, 이 중 ETF 투자 규모는 99조8000억원으로 50.4%를 차지했다. 일부 사업자는 전산개발 일정에 따라 내년 상반기 중 시행한다.", "category": "제도·규제", "importance": 4, "source": "메트로신문", "published": "2026-10-27", "url": "https://www.metroseoul.co.kr/article/20261027500104", "related": [{"title": "“퇴직연금 다 날릴 수도”…ETF 투자한도 100%의 함정 [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8699397&ref=A"}]}, {"id": "0369d6c3118c", "title": "퇴직연금 223조원 쌓인 5대은행…국민·하나 2위 각축전", "summary": "5대 시중은행의 3분기 말 퇴직연금 적립금은 222조9427억원으로 집계됐다. 신한은행이 57조2252억원으로 1위이고 KB국민은행 52조2226억원, 하나은행 52조1554억원, 우리은행 33조243억원, NH농협은행 28조3152억원 순이다. KB국민은행과 하나은행의 격차는 672억원으로, 2분기 말 3152억원에서 크게 좁혀져 지난해 말 725억원 수준으로 돌아왔다. 올해 누적 증가액은 하나은행 3조7741억원, KB국민은행 3조7688억원으로 53억원 차이다.", "category": "업계·경쟁사", "importance": 4, "source": "이데일리", "published": "2026-10-19", "url": "https://www.edaily.co.kr/News/Read?newsId=03496486645614560&mediaCodeNo=257", "related": [{"title": "퇴직연금 2위 경쟁 격화…하나은행·국민은행 적립금 격차 672억원", "source": "CEO스코어데일리", "url": "https://www.ceoscoredaily.com/page/view/2026102015471625110"}]}, {"id": "133e90c36463", "title": "“원리금 보장만” “위험자산 반 이상”…퇴직연금 가입자 돈 굴리기 양극화", "summary": "금융감독원에 따르면 퇴직연금 적립금은 2023년 말 382조원에서 올해 6월 말 558조원으로 늘었다. 가입자의 64.5%는 적립금 전액을 원리금 보장형에 두고 있고, 33.9%는 절반 이상을 위험자산에 투자했으며, 분산 투자로 균형을 맞춘 경우는 1.6%에 그쳤다. 실적배당형 비중은 2023년 12.8%에서 올해 6월 말 35.5%로 약 2.8배 늘었고 그중 50.4%가 ETF에 투자됐다. 금감원은 11월 3일 장기·분산 투자를 돕는 '퇴직연금 가이드북'을 발간했으며, 디폴트옵션도 대부분 원리금 보장형에 머물러 있다고 밝혔다.", "category": "운용·상품", "importance": 3, "source": "서울신문", "published": "2026-11-17", "url": "https://www.seoul.co.kr/news/economy/finance/2026/11/17/20261117031002", "related": [{"title": "같은 퇴직금, 20년 뒤엔 1억6천 차이…50대 여유 있다면 ‘보증형 보험’이 대안", "source": "경향신문", "url": "https://www.khan.co.kr/article/202611170600051"}, {"title": "김 과장·박 과장, 연금 똑같이 1000만 원씩 냈는데...20년 뒤 계좌 잔고 '충격'", "source": "파이낸셜뉴스", "url": "https://www.fnnews.com/news/202611161529480756"}, {"title": "퇴직연금 적립금 558조 넘겨…DC 전환 1년만 118% 증가", "source": "SBS Biz", "url": "https://biz.sbs.co.kr/article_hub/20000346629"}]}, {"id": "b1c24b848e68", "title": "줄어든 거래대금에 증권가는 ‘MTS’ 전쟁…AI·배당·연금으로 고객 자산 잡는다", "summary": "증시 조정으로 거래가 위축되자 증권사들이 MTS에 AI 투자정보, 배당 정보, 퇴직연금 ETF 적립식 매수 기능 등을 더하고 있다. 하나증권은 이달부터 DC·IRP 계좌에서 ETF·ETN·리츠를 정기 매수하는 서비스를 구원이 이들의 퇴직급여 운영 실태와 의무화에 따른 사용자 부담·노동시장 영향을 분석한다. 지난해 주 1~14시간 일한 취업자는 177만9000명으로 전체 취업자의 6.2%였고 관련 통계 작성 이후 가장 많았다. DC형 법정 최소 사용자 부담금이 연간 임금총액의 12분의 1인 만큼 영세 사업장의 채용 위축 우려도 제기된다.", "category": "제도·규제", "importance": 3, "source": "한국경제", "published": "2026-10-30", "url": "https://www.hankyung.com/article/202610294697i", "related": [{"title": "퇴직연금 의무화에도…1년 미만·초단시간 노동자 사각지대 남아", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261029010010231"}]}, {"id": "c2ef78aa9c37", "title": "삼성생명, 퇴직연금 부가서비스 앱 'SSUM 라운지' 개편", "summary": "삼성생명이 퇴직연금 가입자 전용 부가서비스 앱 'SSUM 라운지'를 전면 개편했다고 24일 밝혔다. 새로 마련된 '퇴직연금정보'에는 시장 지표를 보여주는 '투데이브리핑'과 '연금 첫걸음', '투자 인사이트', '투자 가이드북', '연금 클래스' 등 콘텐츠가 담겼다. '연금 클래스'는 매월 한 차례 온라인 세미나로 삼성생명 퇴직연금 전문가와 삼성자산운용이 제도·상품과 시장 전망을 소개한다. 서비스는 삼성생명 퇴직연금(DB·DC·IRP) 가입자라면 누구나 무료로 이용할 수 있다.", "category": "업계·경쟁사", "importance": 2, "source": "비즈월드", "published": "2026-10-25", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149782", "related": [{"title": "삼성생명, 퇴직연금 앱 ‘SSUM 라운지’ 개편…투자정보 강화", "source": "메가경제", "url": "https://www.megaeconomy.co.kr/news/newsview.php?ncode=1065569724632297"}]}, {"id": "79701632bbb8", "title": "하나금융, 3분기 누적 순익 3조6243억원…9490억원 자사주 매입·소각 '역대 최대'", "summary": "하나금융그룹의 올해 3분기 누적 연결당기순이익은 3조6243억원으로 전년 동기 대비 5.6% 증가했고, 누적 수수료이익은 2조1428억원으로 29.8% 늘었다. 하나은행의 3분기 누적 수수료이익은 8740억원으로 전년 동기 대비 11.5% 늘며 3분기 누적 기준 역대 최대치를 기록했다. 퇴직연금과 방카슈랑스 등 수수료 수익 확대와 외환 관련 이익 증가가 은행 실적을 뒷받침했다. 하나금융은 연간 자사주 매입·소각 규모를 역대 최대인 9490억원으로 확대하기로 했다.", "category": "업계·경쟁사", "importance": 2, "source": "메트로신문", "published": "2026-10-25", "url": "http://www.metroseoul.co.kr/article/20261023500216", "related": [{"title": "하나금융, 3분기 누적 순이익 3조6243억원…자사주 매입·소각 역대 최대", "source": "월요신문", "url": "https://www.wolyo.co.kr/news/articleView.html?idxno=319524"}]}, {"id": "b563037cbe03", "title": "보험산업 성장률 내년 3.5%로 ‘반토막’…수익·자본의 질도 경고등", "summary": "보험연구원이 22일 '2027년 보험산업 전망과 과제' 세미나에서 내년 보험산업 전체 수입·원수보험료 증가율을 3.5%로 전망했다. 올해 예상 증가율 8.0%보다 4.5%p 낮은 수준이며, 전체 cleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "60세 은퇴 뒤 연금까지 8년 기다리나…국민연금 68세 수급안 따져보니", "source": "세계일보", "url": "https://www.segye.com/newsView/20261002501170?OutUrl=naver"}, {"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "38994a32152d", "title": "[DQN] 주식시장 약세에 삼성생명 적립금 규모 1위 재탈환…DC형 비보장 수익률 반토막 [2026년 3분기 퇴직연금 랭킹]", "summary": "금감원 통합연금포털 3분기 공시 분석 결과 삼성생명의 퇴직연금 적립금이 57조5486억원으로 2분기 1위였던 신한은행을 추월했다. 계열사 DB형 적립금이 7074억원 늘어난 반면 비계열사 DB형은 3586억원 감소했으며, 주식시장 하락으로 원리금보장형 선호가 커진 점도 영향을 미쳤다. 신한라이프 DC형 원리금비보장 수익률은 2분기 111.17%에서 3분기 59.71%로 떨어지는 등 DC·IRP 비보장형 수익률이 절반 가량 하락했다. IRP 원리금비보장 적립금은 94조6349억원에서 87조6398억원으로 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-11-08", "url": "https://www.fntimes.com/html/view.php?ud=2026110716081563428a55064dd1_18", "related": [{"title": "퇴직연금 판도 재역전…삼성생명 반년 만에 선두 탈환", "source": "아시아타임즈", "url": "https://www.asiatime.co.kr/article/20261020500369"}, {"title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "source": "세이프타임즈", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652"}, {"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "b7e8a161b6af", "title": "2028년부터 퇴직급여 사외적립 의무화… 체불 막는다", "summary": "근로자의 퇴직금 체불을 막기 위해 내후년부터 100인 이상 사업장을 대상으로 퇴직급여 사외 적립을 단계적으로 의무화하는 방안이 추진된다. 이형일 부총리 겸 재정경제부 장관과 배경훈 부총리 겸 과학기술정보통신부 장관은 28일 경제관계장관회의·과학기술관계장관회의 첫 연석회의에서 이 방안을 논의했으며, 기금형 퇴직연금의 구체적 도입 방안도 마련해 전문적인 자산 운용과 엄격한 수탁자 책임을 부과하기로 했다. 퇴직연금 사업자 평가 기준은 연금 성과 수익률 중심으로 개편하고, 디폴트옵션 적용 예정 통보 시점은 만기 후 4주에서 만기 전 2주로 앞당긴다. 구체적인 퇴직연금 기능 강화 방안은 29일 국회 기후에너지환경노동위원회 여당 위원과의 당정협의를 거쳐 발표된다.", "category": "제도·규제", "importance": 5, "source": "서울신문", "published": "2026-10-29", "url": "https://www.seoul.co.kr/news/economy/2026/10/29/20261029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "540조 퇴직연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936461/2"}, {"title": "퇴직연금, 전문가가 대신 굴린다…'기금형' 도입, 국민연금 참여는 미정", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6335473"}, {"title": "정부, 퇴직연금 기금형 활성화…IRP 위험자산 투자한도 상향 추진", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4441777"}, {"title": "\"퇴직금 못 받는 일 줄인다\", 사외적립 전 사업장 확대 추진", "source": "데일리환경", "url": "https://www.dailyt.co.kr/newsView/dlt202611040003"}, {"title": "기업 퇴직연금 모아 전문기관이 굴려… ‘쥐꼬리 수익’ 개선 기대", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936451/2"}, {"title": "국민연금, 기금형 퇴직연금 참여 미정···‘시장 개입 우려’에 국회로 공 넘긴 정부", "source": "경향신문", "url": "https://www.khan.co.kr/article/202610300600041"}, {"title": "[퇴직연금 개편] 퇴직연금도 국민연금처럼…정부, 장기 연금 수령 유도 방안 발표", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=620807"}, {"title": "퇴직연금 사외적립 2030년까지 전 사업장 의무화", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237470"}, {"title": "당정, ‘퇴직연금 강화·고용부 예산’ 살핀다…초광역특구법 논의 가능성", "source": "디지털타임스", "url": "https://www.dt.co.kr/article/12091950"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "fd9e49abb205", "title": "한국투자증권, 퇴직연금 운용의 우위를 실증하다... 3년간 수익률 100% 돌파", "summary": "고용노동부의 9월 말 기준 공시에서 한국투자증권 디폴트옵션 적극투자형 BF1의 3년 누적 수익률이 100.97%로 전체 퇴직연금사업자 포트폴리오 가운데 가장 높았다. 이는 적극투자형 평균 57.58%를 43.39%포인트 웃돌며, 업권별 평균은 증권 61.45%, 은행 55.76%, 보험 55.03%였다. 핵심 전략은 한국투자신탁운용과 협업한 MySuper 알아서 성장형 펀드로 글로벌 우량주와 부동산·인프라·물가연동채권 등 대체자산에 분산투자한다. 3분기 말 DC·IRP 합산 적립금은 18조5160억원으로 지난해 말보다 5조7292억원(44.8%) 늘었다.", "category": "업계·경쟁사", "importance": 4, "source": "리버티코리아포스트", "published": "2026-11-05", "url": "http://www.lkp.news/news/articleView.html?idxno=85780", "related": [{"title": "한투증권, 디폴트옵션 3년 누적 수익률 100.97%…전 사업자 1위", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261104_0003853884"}, {"title": "퇴직연금 3년 새 '두 배' 불렸다…한국투자증권, 디폴트옵션 수익률 전체 1위 달성", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금  "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "5dd7e8508fc5", "title": "하나은행, 호남권 첫 시니어 특화 금융라운지 광주에 개점", "summary": "하나은행은 지난 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 금융공간인 '하나더넥스트 광주금융 라운지'를 개점했다. 라운지는 은퇴설계, 상속·증여, 유언대용신탁 상담과 건강관리·문화·주거 등 라이프케어 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산, 예상 지출을 분석하는 '평생소득설계' 상담을 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 맞춤 상담을 받을 수 있다.", "category": "가입자·사회", "importance": 1, "source": "더퍼블릭", "published": "2026-11-08", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325510", "related": [{"title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"title": "하나은행, 광주에 호남권 첫 시니어 특화 금융 라운지 개설", "source": "공감신문", "url": "https://www.gokorea.kr/news/articleView.html?idxno=884384"}]}, {"id": "dc538f26b3c8", "title": "\"불장에 직접 굴리자\" 퇴직연금 DC전환 급증…하락장에 직격탄", "summary": "국민의힘 박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 지난해 같은 기간 5만3242명보다 181.2% 늘었다. 1~7월 누적 전환자는 34만156명으로 전년 동기 대비 118.1% 증가했고 이 가운데 44.0%가 6~7월 두 달에 몰렸다. 미래에셋증권과 한국투자증권에서 올해 4~6월 전환한 가입자의 7~8월 단순 기간수익률은 각각 -10.7%, -10.2%로 집계됐다. 고용노동부 행정해석상 DC형으로 옮긴 적립금을 다시 DB형으로 되돌리는 것은 허용되지 않아 숙려 절차 등 가입자 보호장치를 보완해야 한다는 지적이 나온다.", "category": "제도·규제", "importance": 5, "source": "연합뉴스", "published": "2026-10-05", "url": "https://www.yna.co.kr/view/AKR20261002151300008?input=1195m", "related": [{"title": "[퇴직연금] 불장 환상에 바꿨다 하락장 낭패…구제책 없는 노후자금 쏠림에 경종", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=612450"}, {"title": "퇴직연금 경계경보...DS로 바꿨다가 손실 봐도 DB로 복귀 못해", "source": "뉴스투데이", "url": "https://www.news2day.co.kr/article/20261005500012"}, {"title": "\"퇴직이 눈앞인데 계좌 보고 피눈물\"…밤잠 설치는 직장인들, 대체 무슨 일", "source": "매일경제", "url": "https://www.mk.co.kr/article/12168943"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로
     그보다 넉넉히 잡아야 매일 아침 헛경보가 뜨지 않는다. */
  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
         + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

  function buildStaleNotice() {
    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
