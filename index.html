<html lang="ko">
<head>

<title>퇴직연금 주요 이슈</title>
<style>
  /* ── 팔레트 ───────────────────────────────────────────────
     잉크 네이비 위에 차가운 석재 종이. 강조색은 적립·성장을 뜻하는
     깊은 소나무색 하나, 그리고 '오늘'에만 쓰는 벽돌색 하나.

     키움 두 색은 kiwoomam.com 로고의 구조를 그대로 옮긴 것이다.
     글자는 감청, 포인트 마크만 마젠타. 그래서 맨 위 줄은 감청이고
     마젠타는 슬로건 한 줄에만 쓴다. 둘을 같은 넓이로 쓰면 서로 죽는다. */
  :root {
    --ink: #101C33;
    --ink-soft: #4A5670;
    --paper: #E7EAEF;
    --surface: #F6F7F9;
    --rule: #C9CEDA;
    --accent: #1F5C4E;
    --hot: #B23A2E;
    --cat-1: #2A3F66;
    --cat-2: #1F5C4E;
    --cat-3: #14657C;
    --cat-4: #7A3B5C;
    --cat-5: #8A5A2B;
    --kiwoom-deep: #1A399E;
    --kiwoom-point: #EC008C;

    --font-ui: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo',
               'Malgun Gothic', system-ui, sans-serif;
    /* 숫자와 로마자에만 쓰는 올드스타일 세리프. 한글은 섞지 않는다. */
    --font-num: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-mono: Consolas, 'SF Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #DCE2EC;
      --ink-soft: #8C97AC;
      --paper: #0E141F;
      --surface: #151D2B;
      --rule: #2A3547;
      --accent: #63AD97;
      --hot: #E0705E;
      --cat-1: #7E9BD4;
      --cat-2: #63AD97;
      --cat-3: #6BB8CE;
      --cat-4: #D28FB0;
      --cat-5: #C79A63;
      /* 감청 원색은 어두운 종이에서 1.9:1까지 떨어져 줄이 보이지 않는다.
         마젠타도 한 단계 올려 짝을 맞춘다. 각각 6.2:1, 6.6:1. */
      --kiwoom-deep: #6E92F5;
      --kiwoom-point: #FF5FB4;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 페이지의 가장자리. 본문 폭에 갇히지 않고 화면 끝까지 지나가야
     구분선이 아니라 종이의 테두리로 읽힌다. */
  .topline { height: 4px; background: var(--kiwoom-deep); }

  .page { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

  a { color: inherit; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── 머리말: 이 화면의 주인공은 날짜다 ───────────────────── */
  .masthead {
    display: flex;
    align-items: baseline;
    gap: 12px 20px;
    flex-wrap: wrap;
    margin: 0 0 14px;
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
    margin: 0;
  }

  .slogan {
    margin: 0 0 0 auto;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--kiwoom-point);
    white-space: nowrap;
  }

  .hero-date {
    font-family: var(--font-num);
    font-size: clamp(3.4rem, 13vw, 5rem);
    line-height: 0.86;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin: 0;
    font-variant-numeric: oldstyle-nums;
  }

  .hero-sub {
    margin: 12px 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .hero-sub .dot { color: var(--rule); padding: 0 6px; }

  /* ── 검색 ──────────────────────────────────────────────
     큰 날짜의 무게를 오른쪽에서 받아 준다. 밑줄 하나로만 입력칸임을 말한다. */
  .hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .search {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
  }

  .search-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  .search input {
    width: 230px;
    max-width: 44vw;
    padding: 4px 0;
    border: 0;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.18s;
  }

  .search input::placeholder { color: var(--rule); }
  .search input:focus { border-bottom-color: var(--accent); }

  .range .clear {
    margin-left: 14px;
    padding: 0;
    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);
    font: inherit;
    cursor: pointer;
  }

  .range .clear:hover { border-bottom-color: var(--accent); }

  /* 검색 결과를 기간별로 나누는 머리. 어느 기간에서 걸렸는지가 정보다. */
  .group {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 34px 0 2px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .list .group:first-child { margin-top: 6px; }

  .group .group-range {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);
  }

  /* ── 서명 요소: 기간 축 ────────────────────────────────────
     일 ⊂ 주 ⊂ 월 ⊂ 연. 네 칸을 똑같은 폭으로 나눠 축을 만든다.
     어디까지 거슬러 보는지는 탭 아래 기간 표기와 상단 날짜 구간이 말한다. */
  .rail {
    display: flex;
    align-items: stretch;
    gap: 3px;
    margin: 36px 0 0;
  }

  .rail button {
    flex: 1 1 0;
    display: block;
    padding: 12px 4px 0;
    border: 0;
    border-top: 3px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.18s, color 0.18s;
  }

  .rail button:hover { color: var(--ink); border-top-color: var(--ink-soft); }

  .rail button[aria-selected="true"] {
    border-top-color: var(--accent);
    border-top-width: 6px;
    padding-top: 9px;
    color: var(--ink);
  }

  .rail .name { display: block; font-size: 0.95rem; font-weight: 600; }

  .rail .span {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  .range {
    margin: 14px 0 0;
    font-family: var(--font-mono);
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  /* ── 분야 필터 ─────────────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin: 28px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--rule);
  }

  .filters button {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 0.83rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }

  .filters button:hover { color: var(--ink); }

  .filters button[aria-pressed="true"] {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 안내문 ───────────────────────────────────────────── */
  .notice {
    margin: 28px 0 0;
    padding: 14px 16px;
    background: var(--surface);
    border-left: 3px solid var(--accent);
    font-size: 0.83rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── 이슈 카드 ────────────────────────────────────────── */
  .list { margin: 8px 0 0; }

  article {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 0 16px;
    padding: 26px 0;
    border-bottom: 1px solid var(--rule);
  }

  .rank {
    grid-row: 1 / span 4;
    font-family: var(--font-num);
    font-size: 2rem;
    line-height: 1.1;
    color: var(--ink-soft);
    opacity: 0.6;
    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cat-1);
  }

  article[data-cat="2"] .badge { color: var(--cat-2); }
  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

  .when {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .when[data-fresh="true"] { color: var(--hot); font-weight: 700; }

  article h2 {
    margin: 0;
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .summary { margin: 10px 0 0; font-size: 0.92rem; color: var(--ink-soft); }

  .source {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .source a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .source a:hover { border-bottom-color: var(--accent); }

  details { margin: 12px 0 0; font-size: 0.82rem; }

  details summary {
    cursor: pointer;
    color: var(--ink-soft);
    list-style: none;
  }

  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '+ '; font-family: var(--font-mono); }
  details[open] summary::before { content: '− '; }

  details ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-soft); }
  details li { margin-bottom: 4px; }
  details a { color: var(--ink); }

  .footer {
    margin: 32px 0 0;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  @media (max-width: 520px) {
    .page { padding: 28px 16px 60px; }
    article { grid-template-columns: 30px 1fr; gap: 0 12px; }
    .rank { font-size: 1.25rem; }
    .rail .span { display: none; }
    .search { width: 100%; padding-bottom: 0; }
    .search input { flex: 1; width: auto; max-width: none; }
    .group .group-range { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<div class="topline"></div>

  <main class="list" id="list"></main>

  <p class="footer" id="footer"></p>

 퇴직연금·개인연금 계좌를 통한 자금 유입을 꼽았다. 8월 말 기준 RISE ETF 순자산은 약 35조원, 시장점유율은 7.78%로 업계 3위이며, 지난해 말 21조원·7.09%에서 8개월 만에 순자산이 약 14조원 늘었다. 성장을 이끈 'RISE 삼성전자SK하이닉스채권혼합50 ETF'는 상장 36영업일 만에 순자산 1조원, 4개월 만에 4조원을 넘었고, 채권을 재간접이 아닌 직접 편입해 총보수를 연 0.01% 수준으로 낮췄다. 퇴직연금 계좌의 위험자산 70% 한도와 별도로 편입할 수 있는 채권혼합형 수요를 두고 이 실장은 단기 유행이 아니라 퇴직연금 시장 확대와 맞물린 구조적 변화라고 말했다.", "category": "업계·경쟁사", "importance": 3, "source": "딜사이트경제TV", "published": "2026-10-01", "url": "https://news.dealsitetv.com/articles/176473"}, {"id": "77b44b768219", "title": "월 30만원의 힘…100세에도 연금 1억7000만원 남기려면", "summary": "김성일 업라이즈 투자자문 대표는 월 30만원을 5% 수익률로 모아 60세부터 월 100만원을 인출하는 경우를 비교했다. 일반계좌는 91세에 자금이 소진되지만 개인연금 계좌는 100세까지 인출해도 1억7000만원이 남는다. 연금계좌는 연간 납입액 중 최대 900만원까지 세액공제를 받을 수 있고 총급여 5500만원 이하 근로자는 납입액의 16.5%인 최대 148만5000원을 돌려받는다. 연금 수령 시에는 일반 금융소득세 15.4% 대신 3.3~5.5% 저율과세가 적용된다.", "category": "가입자·사회", "importance": 2, "source": "데일리안", "published": "2026-10-01", "url": "https://www.dailian.co.kr/news/view/1696465/?sc=Naver"}, {"id": "2beb0bc0e9b4", "title": "英 버넘, 연금 ‘눈덩이 인상’ 손본다…개혁 승부수", "summary": "영국 앤디 버넘 총리가 2011년부터 시행된 연금 '트리플 락' 제도를 개편하겠다고 발표했다. 트리플 락은 물가상승률, 임금상승률, 2.5% 가운데 가장 높은 비율로 매년 연금을 자동 인상해 왔다. 개혁안은 인상 기준을 물가상승률 또는 2.5%로 제한하는 내용이며 2030년부터 시행해 2040년까지 연간 150억 파운드를 절감한다는 계획이다. 여론조사에서는 53%가 트리플 락 유지를 지지해 반대 여론이 우세하다.", "category": "제도·규제", "importance": 2, "source": "서울경제", "published": "2026-10-01", "url": "https://www.sedaily.com/article/20096693?ref=naver"}, {"id": "f3863e5f53aa", "title": "금리 발작 올라탄 개미들…증시 등지고 '고금리 채권'으로", "summary": "9월 개인의 국내 채권 순매수액은 4조225억원으로 월별 기준 올해 최고치를 기록했다. 28일 기준 국고채 3년물 금리는 4.119%, 5년물은 4.345%로 연중 최고 수준이다. 미 국채 10년물은 5.293%로 2007년 이후, 30년물은 5.621%로 2002년 6월 이후 가장 높다. 금융투자업계 관계자는 정부가 개인투자용 국채 활성화 방안을 시행하면서 '퇴직연금형 개인투자용 국채'를 도입한 것도 긍정적으로 작용했다고 설명했다.", "category": "운용·상품", "importance": 2, "source": "뉴시스", "published": "2026-10-01", "url": "https://www.newsis.com/view/NISX20260930_0003809637"}, {"id": "1fb836711ac6", "title": "[반퇴시대 재산리모델링] 재건축 아파트 가진 부부, 은퇴할 땐 집 줄여 ‘연금 공백’ 대비", "summary": "월급 합계 1200만원인 47세 맞벌이 부부의 자산 46억원 가운데 금융자산은 전체의 10% 남짓이고 나머지는 부동산에 묶여 있다. 재건축 입주 분담금 4억8000만원과 담보대출로 전환되는 이주비 대출 3억8000만원, 연간 약 1500만원의 보유세가 부담으로 지적됐다. 전문가들은 주택청약 통장의 2300만원으로 단기 채무를 정리해 월 저축·투자액을 80만원에서 110만원으로 늘리고 이를 연금저축과 IRP에 배분하라고 조언했다. 아내가 65세가 되면 월 400만원대 연금 수령이 예상되지만 은퇴 시점과 지급 시기가 달라 약 8년의 소득 공백이 생기므로 퇴직금 3억원과 IRP로 이 기간을 메워야 한다.", "category": "가입자·사회", "importance": 2, "source": "중앙일보", "published": "2026-10-01", "url": "https://www.joongang.co.kr/article/25466159"}, {"id": "b08ab811bb5c", "title": "기업 예금금리 4% 돌파...대출금리 더 뛴다", "summary": "우리은행의 1년 만기 기업 예금금리가 4.09%로 올라 4%를 넘어섰고 NH농협은행은 3.81%, 신한은행은 3.73%를 적용하고 있다. 이는 8월 말 대비 0.44%포인트 상승한 수준이다. 은행권은 기업 고객과 한 번 거래를 맺으면 여신·퇴직연금·외환 등 부대 거래를 유치할 수 있어 더 높은 금리를 제시한다고 설명했다. 같은 기간 은행권 주택담보대출 가중평균금리는 4.66%로 3년 9개월 만에 최고치를 기록했고 5대 은행 가계대출 평균금리는 4.90%로 집계됐다.", "category": "법인·자금운용", "importance": 2, "source": "서울경제", "published": "2026-10-01", "url": "https://www.sedaily.com/article/20096850?ref=naver"}, {"id": "8900114896cb", "title": "NH투자증권, THE100리포트 134호 발간 外", "summary": "NH투자증권이 개인투자용 국채를 노후 대비에 활용하는 방법을 다룬 THE100리포트 134호를 발간했다. 개인투자용 국채는 2026년 9월 3일 기준 누적 발행액이 3조2400억원을 넘어섰다. 이번 달부터는 퇴직연금 DC형과 IRP 계좌에서도 개인투자용 국채를 담을 수 있게 됐다. 리포트는 장기 고정금리가 적용돼 재투자 위험을 줄이고 이자에 대한 과세가 이연되는 복리 효과를 얻을 수 있다는 점을 장점으로 들었다.", "category": "운용·상품", "importance": 2, "source": "리얼캐스트", "published": "2026-10-01", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31742"}, {"id": "9b43c0c5bce4", "title": "'우리아이자립펀드' 내년 하반기 출시…정부 지원 연 최대 120만원", "summary": "정부가 내년 하반기 출시를 목표로 '우리아이자립펀드'를 도입하며 내년 예산안에 1465억원을 반영했다. 기준 중위소득 50% 이하 가구는 부모가 연 80만원을 납입하면 정부가 연 120만원을 지원하고, 50~100% 구간은 부모 납입 50만원에 정부가 최대 100만원을 매칭하며, 100~150% 구간은 부모 100만원에 정부가 100만원을 1대1로 매칭한다. 연간 납입한도는 200만원이고 최대 19년간 투자하면 연 6% 수익률 가정 시 원금 3800만원이 약 7000만원으로 늘어난다. 정부는 이자·배당소득 전액 비과세를 추진하고, 투자대상을 구체화할 때 주식형 펀드에 최대 70%까지 투자할 수 있는 퇴직연금 사례를 참고하겠다고 밝혔다.", "category": "제도·규제", "importance": 2, "source": "뉴스핌", "published": "2026-10-01", "url": "https://www.newspim.com/news/view/20260930001144"}, {"id": "a7fbb586803f", "title": "'암살자(들)' 논란 기업으로 번져...버거킹·키움증권·미래에셋까지 [앵커리포트]", "summary": "영화 '암살자(들)'의 역사 왜곡 논란이 주연배우 유해진을 광고모델로 쓴 기업들로 번졌다. 버거킹과 키움증권은 유해진이 등장하는 광고 영상에 모델 교체를 요구하는 비판 댓글이 쏟아지자 댓글 기능을 제한했다. 이종배 전 국민의힘 서울시의원은 미래에셋증권이 한국토지주택공사와 국토안전관리원 임직원을 대상으로 영화 단체관람 행사를 지원한 것이 청탁금지법 위반이나 뇌물죄에 해당할 가능성이 있다며 경찰에 고발했다. 미래에셋증권은 해당 행사가 업계 퇴직연금 마케팅의 일환이라고 설명하면서 고객 행사가 오해를 사지 않도록 운영기준을 다시 점검할 예정이라고 밝혔다.", "category": "업계·경쟁사", "importance": 2, "source": "YTN", "published": "2026-10-01", "url": "https://www.ytn.co.kr/_ln/0103_202610010829147027"}, {"id": "e62538ec749d", "title": "한투운용, 'ACE 연금투자 가이드북' 발간", "summary": "한국투자신탁운용이 연금 투자 실전 지침을 담은 ACE 연금투자 가이드북을 개정 발간했다. 올해 판은 연말정산 세액공제를 받기 위한 연금계좌 활용법과 투자전략별 포트폴리오 소개에 초점을 맞췄고, 소득 구간별 최대 세액공제액과 점검 항목을 함께 실었다. 포트폴리오는 월배당, 코어+위성, 성장 세 가지로 나눠 투자 기간과 변동성 감내 수준에 따라 고를 수 있게 구성했다. 안명훈 한국투자신탁운용 디지털ETF마케팅본부장은 4분기에 연금계좌 납입이 늘어나는 시기라며 대기 자금을 투자까지 연결해야 연금계좌 활용이 완성된다고 설명했다.", "category": "운용·상품", "importance": 2, "source": "아시아경제", "published": "2026-10-01", "url": "https://view.asiae.co.kr/article/2026100108510656005"}, {"id": "9f48cec4e902", "title": "HD현대중공업·HD현대미포, 단협·취업규칙 하나로…통합 요인 노동조건 '일원화'", "summary": "HD현대중공업과 옛 HD현대미포의 단체협약·취업규칙이 HD현대중공업 기준으로 일원화된다. 노사 의견일치안에는 퇴직연금제도 변경과 관련해 노사 협의와 관련 절차가 마무리된 뒤 DC(확정기여)형 납입을 선택한 직원을 대상으로 정해진 비율을 DC 계좌에 납입하는 방안이 담겼다. 업무상 부상·질병으로 휴직한 뒤 복직하지 못하고 퇴직할 경우 해당 휴직기간을 근속연수에 포함하고, 25년 이상 근속자가 퇴직하면 공조금을 100만원으로 늘린다. 이 안은 10월 2일 오전 7시부터 낮 12시까지 진행되는 조합원 찬반투표를 거쳐 확정된다.", "category": "법인·자금운용", "importance": 2, "source": "메가경제", "published": "2026-10-01", "url": "https://www.megaeconomy.co.kr/news/newsview.php?ncode=1065572057271298"}, {"id": "fdc69e2e6d2b", "title": "[증권 & Now] 삼성증권, 프로야구 직관에 치킨 더한 '연금 가입했닭' 캠페인 등", "summary": "삼성증권은 9월 29일 잠실야구장에서 '삼성증권 연금 가입했닭' 이벤트를 열고 사전 신청자 100명에게 치킨과 응원도구를 제공했으며, 9월 29일부터 10월 7일까지 현장 응모를 받는다. 대신증권은 12월 31일까지 연금저축·개인형퇴직연금(IRP) 고객을 대상으로 연금저축 최대 100만원, IRP 최대 3만원의 상품권을 지급하고 타사 연금 이전 시 입금액의 1.5배로 인정한다. 한화투자증권은 10월 15일까지 2차 국민성장펀드 전용저축계좌 이벤트를 진행해 최대 20만원을 현금 지급한다.", "category": "업계·경쟁사", "importance": 1, "source": "EBN", "published": "2026-10-01", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1726268"}, {"id": "081115526434", "title": "[주간 파이낸셜] 인생의 2막, 소득의 흐름 중요", "summary": "은퇴 후 삶의 질을 결정하는 것은 자산의 총량이 아니라 매월 예측 가능하게 들어오는 현금 흐름이라는 점을 짚었다. 국민연금을 바탕으로 퇴직연금과 개인연금, 절세 혜택이 있는 금융자산을 차례로 연결해 현금 흐름을 만들 것을 권고했다. 다층 연금 구조를 갖추면 시장 변동성에 흔들리지 않는 노후를 준비할 수 있다고 설명했다.", "category": "가입자·사회", "importance": 1, "source": "대전일보", "published": "2026-10-01", "url": "https://www.daejonilbo.com/news/articleView.html?idxno=2304377"}, {"id": "8c7ff25d260f", "title": "대신증권, 연금자산 이전·납입 이벤트…12월 31일까지", "summary": "대신증권이 연금저축과 개인형퇴직연금(IRP) 고객을 대상으로 12월 31일까지 이전·납입 이벤트를 진행한다. 연금저축은 순입금액에 따라 1만원에서 100만원까지, IRP는 1만원에서 3만원까지 상품권을 준다. 타사 연금 이전과 타사 ISA 만기전환 순입금액은 1.5배로 인정한다. 이벤트 신청 후 해당 순입금액 잔고를 12월 31일까지 유지해야 하며 경품은 2027년 1월에 지급된다.", "category": "업계·경쟁사", "importance": 1, "source": "비즈월드", "published": "2026-10-01", "url": "http://www.bizwnews.com/news/articleView.html?idxno=147683"}, {"id": "e19ba9942b1c", "title": "[장욱희의 중장년 취업에세이] 100세 시대, 나는 몇 살까지 일해야 할까?", "summary": "통계청 2025년 고령층 부가조사에서 55~79세 가운데 69.4%가 계속 일하고 싶다고 답했고 희망 근로연령은 평균 73.4세로 나타났다. 주된 일자리에서 퇴직하는 평균 연령은 52.9세다. 필자는 중장년 재취업 상담에서 부동산과 금융자산, 대출과 함께 국민연금·퇴직연금에서 예상되는 소득을 먼저 확인하도록 한다고 설명한다. 통계청 2024년 가계금융복지조사에서 은퇴 후 월평균 최소생활비 예상액은 240만 원이며, 월 100만 원의 소득은 10년이면 1억 2000만 원에 해당한다고 짚는다.", "category": "가입자·사회", "importance": 1, "source": "뉴스핌", "published": "2026-10-01", "url": "https://www.newspim.com/news/view/20261001000056"}, {"id": "b8b353458eca", "title": "KB증권, 연금자산 맞춤 관리 강화..IRP·연금저축 혜택 확대", "summary": "KB증권이 12월 31일까지 개인형퇴직연금(IRP)과 연금저축 고객을 대상으로 '2026 연금 순입금(이전) 이벤트 시즌4'를 진행한다. IRP 순입금 실적을 산정할 때 타사 연금 이전 금액과 채권 매수 거래 금액을 각각 2배로 인정하며, IRP 혜택은 합산 최대 3만원 상당이다. 연금저축은 순입금액에 따라 최대 150만원 상당의 백화점 상품권을 지급한다. 신규·휴면 고객에게는 순입금 조건 충족 시 3만원 상당의 ETF 매수 쿠폰을 제공한다.", "category": "업계·경쟁사", "importance": 1, "source": "한국정경신문", "published": "2026-10-01", "url": "https://kpenews.com/View.aspx?No=4248004"}, {"id": "36bed79b6199", "title": "포장재재활용업계 금융지원 나선다", "summary": "한국포장재재활용사업공제조합(KPRC)이 우리은행과 회원사 금융·비금융 지원 확대를 위한 협약을 체결했다. 금융 지원으로는 시설·정책자금 전용 대출 확대와 금리 우대, 해외 투자 서비스, 법인카드 이용한도 확대가 포함된다. 비금융 지원에는 기업승계·세무·회계 컨설팅과 CEO 네트워크 형성, 퇴직연금 등 자산관리 종합 솔루션이 들어간다. 우리은행은 강남·광화문·판교·대전·전남광주·울산 등 BIZ프라임센터 14개 거점의 전문인력을 회원사 전담으로 지정한다.", "category": "법인·자금운용", "importance": 1, "source": "의학신문", "published": "2026-10-01", "url": "https://www.bosa.co.kr/news/articleView.html?idxno=3013111"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-09-24 ~ 2026-09-30", "generated_at": "2026-10-01T15:45:36+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "ca4b29701d4c", "title": "새 경제팀 첫 테이블에 '전기차·퇴직연금'…이형일, 경제현안간담회 신설", "summary": "이형일 부총리 겸 재정경제부 장관이 27일 취임 후 첫 경제현안간담회를 열고 전기차 산업 정책방향과 퇴직연금 제도개선 방안을 논의했다. 간담회에는 기후에너지환경부·고용노동부·기획예산처 장관과 산업통상부 차관, 금융위원장, 청와대 경제성장수석이 참석했다. 퇴직연금이 첫 안건에 오른 것은 근로자의 노후소득 보장이라는 노동정책 측면과 자본시장에 투입될 장기자금이라는 금융정책 측면을 함께 갖고 있기 때문이다. 정부는 이날 구체적인 개편 방향은 공개하지 않았고, 수익률과 운용방식, 가입자 선택권, 금융회사의 운용 경쟁을 어떻게 개선할지가 향후 쟁점으로 남았다.", "category": "제도·규제", "importance": 5, "source": "지이코노미", "published": "2026-09-28", "url": "https://www.geconomy.co.kr/news/article.html?no=323945", "related": [{"title": "[닻 올린 이형일號③] 잠재성장률 3% 도전…'적극 재정'이 구조개혁으로 이어질까", "source": "뉴시안", "url": "http://www.newsian.co.kr/news/articleView.html?idxno=96052"}]}, {"id": "5e67ec767c57", "title": "퇴직연금 문 열린 개인용 국채…첫 선택은 10년물에 쏠렸다", "summary": "재정경제부에 따르면 9월 9~15일 진행된 개인투자용 국채 청약에 총 2585억원이 접수돼 발행 예정액 2300억원을 웃돌았다. 이달부터 퇴직연금 계좌를 통한 투자가 허용되면서 청약액이 지난 5월 이후 처음으로 2000억원대로 올라섰다. 9월 청약액 가운데 연금계좌 청약액은 1433억원으로 절반을 넘었고 실제 배정액은 1271억원이다. 연금계좌 청약 대상인 10년물과 20년물 중 10년물에 1168억원이 몰려 전체의 74.1%를 차지했고, 10년물 발행한도는 1100억원에서 1356억원으로 늘었다.", "category": "운용·상품", "importance": 4, "source": "연합인포맥스", "published": "2026-09-25", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436449", "related": [{"title": "[개인국채 시대] 삼성·한투·KB·NH證 합류…경쟁 본격화", "source": "딜사이트경제TV", "url": "h  신규 가입자 수령액을 평균 약 3% 올리고 초기 보증료를 주택가격의 1.5%에서 1.0%로 내린 것이 영향을 미쳤다. 주택연금 지급액이 가계대출 총량 규제에 포함돼 은행이 다른 대출을 내줄 여력이 줄어든다는 우려가 은행권에서 나온다. 한민수 더불어민주당 의원은 금융당국이 주택연금 특성에 맞춰 총량 규제 인센티브나 예외 조치를 신속히 마련해야 한다고 밝혔다.", "category": "제도·규제", "importance": 4, "source": "매일경제", "published": "2026-09-27", "url": "https://www.mk.co.kr/article/12161819", "related": []}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "b27545f630cf", "title": "퇴직연금 ETF 상품 108종 추가… 284종 라인업", "summary": "KB국민은행이 '2026 한국산업의 고객만족도(KCSI)' 퇴직연금(IRP) 부문에서 종합점수 84.2점으로 조사 대상 금융사 중 1위에 올랐다. 업계 평균 82.1점보다 2.1점, 2위 83.0점보다 1.2점 높은 점수다. 지난해 말 176종이던 퇴직연금 ETF 상품에 국내외 주식형·채권형·배당형·테마형 등 108종을 추가해 8월 기준 284종의 라인업을 갖췄고, 시중은행 최초로 'ETF 당일 매수·매도 시스템'을 신설했다. 금융감독원 통합연금포털 공시 기준 2026년 2분기 말 KB국민은행의 개인형 IRP 비원리금보장상품 1년 수익률은 52.96%를 기록했다.", "category": "업계·경쟁사", "importance": 3, "source": "동아일보", "published": "2026-09-30", "url": "https://www.donga.com/news/Economy/article/all/20260929/134750216/2", "related": [{"title": "KB국민은행, \"퇴직금 어디 맡길까\"…고객만족도 1위 비결은", "source": "매일경제", "url": "https://www.mk.co.kr/article/12163801"}]}, {"id": "c2efafa724c1", "title": "퇴직연금 담기 전… '예상수익' '손실위험' 따져보셨나요", "summary": "지난달 말 퇴직연금 적립금은 501조4000억원으로 집계됐고 DC형과 IRP를 통한 투자상품 운용이 빠르게 늘고 있다. 이달부터 개인투자용 국채 10년물과 20년물을 DC형·IRP에서 매수할 수 있게 됐지만, 중도환매하면 가산금리와 복리 등 장기보유 혜택을 받을 수 없다. 커버드콜 ETF는 주가 하락 시 원금손실이 발생할 수 있는데 KB자산운용 'RISE 200위클리커버드콜'은 투자위험등급 2등급(높은 위험)으로 적립금의 70%까지 투자할 수 있다. 금융감독원은 커버드콜을 소비자 오인 소지가 있는 펀드로 분류했고 30일부터 새로 출시되는 10개 펀드 유형에 표준안을 적용했다.", "category": "운용·상품", "importance": 3, "source": "머니투데이", "published": "2026-09-30", "url": "https://www.mt.co.kr/stock/2026/09/30/2026092919515034618", "related": []}, {"id": "18921eb37f40", "title": "\"국민연금 수익률 2%p 높이면 2120년까지 기금 고갈 없어\"", "summary": "국회 보건복지위원회 남인순 의원실이 국회예산정책처에 의뢰한 '국민연금 시나리오별 재정 전망'에 따르면, 현행 제도를 유지하면 재정수지는 2050년 적자로 전환되고 2069년 적립기금이 소진된다. 기간 평균 기금운용수익률을 1%포인트 높이면 소진 시점이 2082년으로 13년 늦춰지고, 2%포인트 높이면 전망 기간인 2120년까지 흑자를 유지해 기금 소진이 발생하지 않았다. 2026년부터 매년 GDP의 1%를 국고로 지원하면 소진 시점이 2100년으로 31년 미뤄지지만, 기금이 바닥나는 2069년에 투입하면 연장 효과는 1년에 그쳤다. 기준선 전망은 보험료율 13%와 소득대체율 43%, 평균 운용수익률 4.6% 안팎을 전제로 산출됐다.", "category": "가입자·사회", "importance": 3, "source": "연합뉴스", "published": "2026-09-30", "url": "https://www.yna.co.kr/view/AKR20260929100600530?input=1195m", "related": []}, {"id": "dcb8b5fba512", "title": "국민연금 수익률 14.84%…주식·채권 성과 엇갈려 [fn마켓워치]", "summary": "국민연금 기금운용본부 공시에 따르면 7월 말 기준 연초 대비 기금운용 수익률은 14.84%로 27.22%에서 낮아졌다. 기금 규모는 6월 말 1866조원에서 한 달 새 1684조원으로 약 10% 감소했다. 자산군별로는 국내주식 60.11%, 해외주식 10.72%, 국내채권 -3.36%, 해외채권 0.72%, 대체투자 4.09%다. 기금운용본부는 국내채권이 금리 상승에 따른 평가 가치 하락으로 수익률이 내려갔다고 설명했다.", "category": "가입자·사회", "importance": 3, "source": "파이낸셜뉴스", "published": "2026-09-30", "url": "https://www.fnnews.com/news/202609291813518550", "related": []}, {"id": "f26a8d44d00a", "title": "기초연금 하후상박 개편안, 여야 “상박은 어디 있나” 한목소리 지적", "summary": "정부가 국회 연금개혁특위에 보고한 기초연금 개편안은 소득하위 30%에 월 3만원을 더 주고 30~45%는 물가상승률만큼 올리며 45% 초과 계층은 동결하는 내용이다. 여야 의원들은 빈곤율이 0.3%포인트, 빈곤갭이 1.57% 낮아지는 데 그친다며 효과가 미흡하다고 지적했다. 하후상박을 내세웠는데 상위 계층을 깎는 상박이 빠져 있고 수급 대상 70% 안에 형편이 나은 노인도 포함된다는 비판이 나왔다. 정부는 저소득 부부가구의 감액률은 완화하되 수급률 70%는 유지한다는 입장을 밝혔다.", "category": "제도·규제", "importance": 3, "source": "세계일보", "published": "2026-09-30", "url": "https://www.segye.com/newsView/20260930503511?OutUrl=naver", "related": []}, {"id": "102d216548d8", "title": "세금의 마법: \"시간을 버티게 만드는 제도\"[김병철의 퇴직연금 개혁 시나리오]", "summary": "김병철 필자는 연금세제의 본질을 과세 이연(Tax Deferral)으로 규정하고, 1950년대 미국의 높은 초과 소득세율 아래 등장한 지연보상 개념이 현대 연금제도의 기초가 됐다고 설명했다. 고소득 재직기에는 세금을 미루고 은퇴 후 낮은 세율 시점에 연금으로 인출하면 세후 수익이 달라진다는 것이 제도의 작동 원리다. 필자는 국내 제도가 세액공제 방식이 복잡하고 중도인출 제약의 신호가 약해 혜택의 체감도가 낮으며, 재직기간을 추적하는 방식이 직업 이동이 많은 시대에 맞지 않는다고 지적했다. 회사 기준이 아닌 연금 계좌 내 보유 기간을 중심으로 세제를 재설계해야 장기 보유 유인이 강해진다고 제안했다.", "category": "제도·규제", "importance": 3, "source": "이데일리", "published": "2026-09-29", "url": "https://www.edaily.co.kr/News/Read?newsId=02177926645585040&mediaCodeNo=257", "related": []}, {"id": "05a79ad7212c", "title": "거래대금 줄자 증권사, MTS 고도화…종합 투자·자산관리 플랫폼으로", "summary": "증권사들이 모바일트레이딩시스템(MTS)을 잇달아 개편해 AI 투자정보와 연금·ETF·디지털자산까지 담는 종합 투자·자산관리 플랫폼으로 확장하고 있다. 한국투자증권은 연금 관련 서비스를 한곳에 모은 '연금 홈'을 신설하고 퇴직연금 계좌에서 종목과 주기를 설정해 자동 매수하는 'ETF 모으기' 기능을 강화했으며, 미래에셋증권은 다음 달 1일부터 MTS 명칭을 'M-STOCK'에서 'MAPS'로 변경한다. 배경은 거래대금 둔화로, 임희연 신한투자증권 연구원 분석에 따르면 ETF를 포함한 일평균 거래대금은 7월 100조원에서 8월 67조원, 9월 56조원으로 줄었다. 김성훈 현대차증권 연구원은 증권업의 중장기 성장동력으로 가계 금융자산의 증권업권 유입과 자산관리(WM), 퇴직연금 등 장기 고객자산 확대를 제시했다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스핌", "published": "2026-09-29", "url": "https://www.newspim.com/news/view/20260928000838", "related": []}, {"id": "1cdc3db5736a", "title": "전주 피했더니 다시 전주行?…KIC 이전론에 술렁이는 연기금 운용역들", "summary": "한국투자공사(KIC) 이전론이 다시 불거지면서 연기금 운용역들이 술렁이고 있다. 기사는 과거 국민연금 기금운용본부의 전주 이전을 전후해 일부 운용인력이 서울에 남기 위해 KIC나 민간 금융회사로 자리를 옮겼다고 설명했다. 국민연금 운용인력 퇴직은 2014년 9명, 2015년 10명에서 2016년 30명, 2017년 27명으로 늘었고, 2018년에는 운용인력 정원 대비 43명이 부족하다는 지적이 나왔다. 이전 직전인 2017년 초에는 해당 연도에만 20명 안팎이 추가로 기금운용본부를 떠날 것이라는 전망이 나온 바 있다.", "category": "법인·자금운용", "importance": 3, "source": "인베스트조선 (유료)", "published": "2026-09-29", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/28/2026092880177.html", "related": []}, {"id": "f6ade94069c4", "title": "[창간특집] 실적 좋아도 안심 못한다…5대 금융 CEO 54명 '연말 시험대'", "summary": "KB·신한·하나·우리·NH농협 5대 금융그룹의 계열사 CEO 54명이 올해 말 임기 종료를 앞두고 있으며, 5대 은행장은 모두 12월 31일 임기를 마친다. 평가 기준은 순이익 단독 평가에서 벗어나 자본효율성과 사업 다각화, 내부통제까지 함께 보는 방식으로 넓어졌다. 하나은행은 중소·대기업 대출을 고르게 확대하는 기업금융 전략과 함께 퇴직연금 적립금도 48조원을 넘어서며 은행권 1위를 유지하고 있다. 신한은행은 상반기 순이익 2조4585억원으로 5대 은행 중 가장 많았고, 우리은행은 기업대출이 189조2000억원으로 늘었지만 순이익은 1조3730억원으로 전년 동기보다 11.9% 줄었다.", "category": "업계·경쟁사", "importance": 3, "source": "이지경제", "published": "2026-09-29", "url": "https://www.ezyeconomy.com/news/articleView.html?idxno=240218", "related": []}, {"id": "41e5598c4ada", "title": "[국민을 향하는 보건복지] 18세 청년 생애 첫 연금보험료, 국가가 내준다", "summary": "국민연금공단은 2027년 1월 1일부터 '청년 생애 첫 연금보험료 지원' 제도를 시행한다. 지원 대상은 시행일 이후 18세가 되는 2009년생부터이며, 신청하면 국가가 생애 첫 1개월분 보험료를 대신 납부한다. 지원 금액은 기준소득월액 하한액에 해당하는 보험료 전액으로 2027년 상반기 기준 4만1000원이다. 신청은 18세 도래 3개월 전부터 27세 생일 전까지 가능해 2027년 초 18세가 되는 청년은 오는 10월부터 미리 신청할 수 있다.", "category": "가입자·사회", "importance": 3, "source": "중앙일보", "published": "2026-09-29", "url": "https://www.joongang.co.kr/article/25465476", "related": []}, {"id": "c9e4554d890c", "title": "\"절세하려면 퇴직금은 무조건 IRP 계좌로 수령해야\"", "summary": "안명희 우리은행 연금사업부 과장은 퇴직금을 IRP 계좌로 받으면 세금을 떼지 않은 원금 전체가 입금돼 과세 이연에 따른 복리 효과를 볼 수 있다고 설명했다. 55세에 퇴직금 5억원과 운용수익 1000만원이 발생한 경우 일시금으로 인출하면 퇴직소득세 5000만원과 기타소득세 165만원을 합쳐 5165만원을 내지만, 연금으로 받으면 퇴직소득세가 30% 감면돼 3500만원, 운용수익은 3.3~5.5% 저율과세로 55만원만 부담해 총 3555만원으로 줄어든다. 올해부터 연금 수령 10년차까지는 퇴직소득세 30%, 11~20년차는 40%, 21년차 이상은 50%까지 감면율이 올라간다. 확정기여형(DC) 가입자는 정기예금이나 장기 보유 ETF를 매도하지 않고 그대로 옮기는 현물이전 제도를 활용할 수 있다.", "category": "가입자·사회", "importance": 3, "source": "조선일보", "published": "2026-09-28", "url": "https://www.chosun.com/economy/money/2026/09/28/I7WBO2GJAJCAJP2JFJZSI3D6SQ/", "related": []}, {"id": "85d1a1d40530", "title": "삼성증권, '슈퍼리치' 1만명 시대 선도…발행어음 IB 확장 [빅7 증권사]", "summary": "삼성증권의 퇴직연금 적립금은 2026년 6월 말 28조1000억원으로 1년 전보다 63% 늘어 은행·증권·보험을 포함한 국내 퇴직연금 사업자 가운데 9위에 올랐다. 삼성증권의 2026년 상반기 영업수익은 1조8930억원으로 업계 4위였고, 2분기 영업수익은 1조394억원으로 '1조 클럽'에 진입했다. 금융자산 30억원 이상 고객이 1만명을 넘어 업계 처음으로 이 기록을 세웠고, 1억원 이상 고객은 6월 말 57만2000명으로 늘 , "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "1fc91cd9d139", "title": "리스크 관리·노후수입 한번에…주목받는 보증형 실적 배당보험", "summary": "미래에셋생명의 개인형 퇴직연금(IRP) 보증형 실적배당보험이 출시 후 717억원을 모집했다고 전했다. 이 상품은 IRP를 통해서만 가입할 수 있는 거치형으로, 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 연금 개시가 가능하다. 이미 만 55세를 넘긴 가입자는 가입과 동시에 연금을 받을 수 있고, 적립금이 소진될 때까지 20년 이상 연금을 수령할 수 있다. 적립금은 미래에셋생명의 일임형 자산배분펀드 MVP펀드를 통해 글로벌 자산에 분산투자된다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645584384&mediaCodeNo=257", "related": [{"title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024"}, {"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": "2026-09-20", "url": "http://www.smarttimes.co.kr/news/articleView.html?idxno=49113", "related": [{"title": "잦은 이직에 끊기는 퇴직자산…사회복지인 전용 퇴직연금 논의 본격화", "source": "라이브뉴스", "url": "https://www.livesnews.com/news/article.html?no=64332"}]}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발생했으나 회수된 금액은 없다.", "category": "법인·자금운용", "importance": 3, "source": "시장경제신문", "published": "2026-09-16", "url": "https://www.meconomynews.com/news/articleView.html?idxno=201626", "related": [{"title": "홈플러스, 9개월간 임금체불 3871억…퇴직금도 미지급", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1690418/"}]}, {"id": "f22427d51808", "title": "NH농협은행, 2026년 제2차 투자상품 완전판매 대토론회 개최", "summary": "NH농협은행은 17일 서울 중구 본사에서 2026년 제2차 투자상품 완전판매 대토론회를 열었다. 투자상품 미스터리쇼핑 만점자와 영업본부 완전판매 TOP리더 등 약 40명이 참석해 펀드·방카슈랑스·신탁·퇴직연금 부문의 상담 준비, 상품 설명, 적합성·적정성 원칙 준수 사례를 공유했다. NH농협은행은 토론회 내용을 영상으로 제작해 영업점 교육자료로 활용할 계획이다. 박현동 투자상품부문 부행장은 완전판매가 절차 준수에 그치지 않고 고객 입장에서 충분히 설명하고 신뢰를 쌓는 과정이라고 강조했다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스퀘스트", "published": "2026-09-17", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=301184", "related": [{"title": "농협은행, 투자상품 완전판매 대토론회 개최…미스터리쇼핑 만점자 우수사례 공유", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146703"}]}, {"id": "ab894d0c4867", "title": "[금융 HOT 뉴스] KB자산운용, 골드 특별자산 펀드 눈길", "summary": "KB자산운용이 골드 특별자산 펀드의 운용 구조를 파생상품 중심에서 국내외 금 ETF 활용 방식으로 바꿨다. 파생상품 위험평가액을 40% 이하로 낮춰 퇴직연금 적격 요건을 충족했고 운용보수는 기존 대비 약 40% 인하했다. 비교지수는 LBMA Gold PM Price로 변경했고 환매대금은 4영업일 내에 지급한다. 현재 국민은행과 신한투자증권의 퇴직연금 계좌에서 매매할 수 있다.", "category": "운용·상품", "importance": 2, "source": "비즈월드", "published": "2026-09-16", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146330", "related": [{"title": "KB자산운용, 18년 된 금 펀드 손질…퇴직연금서도 투자", "source": "AP신문", "url": "https://www.apnews.kr/news/articleView.html?idxno=3051270"}]}, {"id": "ca4b29701d4c", "title": "새 경제팀 첫 테이블에 '전기차·퇴직연금'…이형일, 경제현안간담회 신설", "summary": "이형일 부총리 겸 재정경제부 장관이 27일 취임 후 첫 경제현안간담회를 열고 전기차 산업 정책방향과 퇴직연금 제도개선 방안을 논의했다. 간담회에는 기후에너지환경부·고용노동부·기획예산처 장관과 산업통상부 차관, 금융위원장, 청와대 경제성장수석이 참석했다. 퇴직연금이 첫 안건에 오른 것은 근로자의 노후소득 보장이라는 노동정책 측면과 자본시장에 투입될 장기자금이라는 금융정책 측면을 함께 갖고 있기 때문이다. 정부는 이날 구체적인 개편 방향은 공개하지 않았고, 수익률과 운용방식, 가입자 선택권, 금융회사의 운용 경쟁을 어떻게 개선할지가 향후 쟁점으로 남았다.", "category": "제도·규제", "importance": 5, "source": "지이코노미", "published": "2026-09-28", "url": "https://www.geconomy.co.kr/news/article. /www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "8bb193e0ea59", "title": "“정부 기초연금개편안, 겉으로는 하후상박 실제는 재정 절감안”", "summary": "정부가 노인 하위 70%를 세 집단으로 나눠 차등 지급하는 하후상박 방식을 내놨다. 하위 30%에 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원(동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": [{"title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "source": "슬로우뉴스", "url": "https://slownews.kr/166386"}, {"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "1fc91cd9d139", "title": "리스크 관리·노후수입 한번에…주목받는 보증형 실적 배당보험", "summary": "미래에셋생명의 개인형 퇴직연금(IRP) 보증형 실적배당보험이 출시 후 717억원을 모집했다고 전했다. 이 상품은 IRP를 통해서만 가입할 수 있는 거치형으로, 만 50세부터 적립금을 일시에 예치할 수 있고 만 55세부터 연금 개시가 가능하다. 이미 만 55세를 넘긴 가입자는 가입과 동시에 연금을 받을 수 있고, 적립금이 소진될 때까지 20년 이상 연금을 수령할 수 있다. 적립금은 미래에셋생명의 일임형 자산배분펀드 MVP펀드를 통해 글로벌 자산에 분산투자된다고 설명했다.", "category": "업계·경쟁사", "importance": 2, "source": "이데일리", "published": "2026-09-27", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645584384&mediaCodeNo=257", "related": [{"title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024"}, {"title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "source": "신아일보", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132"}, {"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중소기업으로 퇴직연금 제도를 확대 시행하는 방안이 제안됐다.", "category": "제도·규제", "importance": 4, "source": "KNN", "published": "2026-09-29", "url": "https://news.knn.co.kr/news/article/192689", "related": [{"title": "“국민연금 65세→68세로 늦추자?”…개혁 또 나오는 이유는? [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674198&ref=A"}, {"title": "“국민연금 넘어 기초·퇴직연금까지”", "source": "양산신문", "url": "http://www.yangsanilbo.com/news/articleView.html?idxno=127699"}, {"title": "[사설] 미래세대 부담 줄일 연금 구조개혁, 더는 미룰 수 없다", "source": "서울경제", "url": "https://www.sedaily.com/article/20095714"}, {"title": "윤영석 의원 '연금제도 구조개혁' 정책토론회 개최", "source": "경남도민신문", "url": "http://www.gndomin.com/news/articleView.html?idxno=490747"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}, {"id": "354ed5723a15", "title": "삼성자산운용·미래에셋증권, 푸른씨앗 OCIO 수성", "summary": "국내 최초 기금형 퇴직연금인 푸른씨앗(중소기업퇴직연금기금) 자금을 굴릴 OCIO 전담운용기관에 삼성자산운용과 미래에셋증권이 재선정됐다. 삼성자산운용이 종합평점 92.915점, 미래에셋증권이 90.761점으로 우선협상대상자에 올랐다. 2022년 9월 첫 사업자 선정 이후 4년 만의 재선정이다. 2기 운용 기간은 2026년 9월 1일부터 2030년 8월 31일까지다.", "category": "법인·자금운용", "importance": 4, "source": "한국금융신문", "published": "2026-06-09", "url": "https://www.fntimes.com/html/view.php?ud=202606091842068772179ad43907_18", "related": []}, {"id": "5895ec3e71a7", "title": "20년 만에 퇴직연금 제도 대대적 개편…모든 사업장 의무화 추진", "summary": "정부가 2월 노사정 공동선언을 바탕으로 퇴직연금 제도를 대폭 개편한다. 7월까지 구체적 방안을 확정한 뒤 연내 관련 법 개정을 추진하고, 모든 사업장에 퇴직연금을 단계적으로 의무화할 방침이다. 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화가 핵심 축이다. 1년 미만 근로자 등 사각지대 해소도 함께 추진된다.", "category": "제도·규제", "importance": 4, "source": "대한민국 정책브리핑", "published": "2026-03-11", "url": "https://www.korea.kr/news/policyNewsView.do?newsId=148960665", "related": []}, {"id": "6e2fe502ecb5", "title": "미래에셋증권, 퇴직연금 로보Wrap 출시…AI가 자산배분·매매 맡는다", "summary": "미래에셋증권이 IRP 계좌용 로보어드바이저 일임 서비스 퇴직연금 로보Wrap을 출시했다. 알고리즘이 글로벌 자산배분 포트폴리오를 구성하고 시장 상황에 맞춰 리밸런싱과 매매까지 수행한다. 7월 말 기준 누적 가입 계좌는 14만좌, 누적 가입금액은 8조3000억원이다.", "category": "운용·상품", "importance": 3, "source": "뉴스핌", "published": "2026-08-05", "url": "https://www.newspim.com/news/view/20260805001063", "related": []}, {"id": "676b0ae84927", "title": "신한 적립액 54조 독주…국민·하나, IRP 중심 2위 경쟁", "summary": "2026년 1분기 퇴직연금 랭킹에서 신한이 적립액 54조원으로 선두를 지켰다. 국민은행과 하나은행이 IRP를 중심으로 2위 자리를 놓고 다투고 있다. 은행권 IRP 적립금은 83조7000억원으로 전체 시장의 31.7%를 차지했다.", "category": "업계·경쟁사", "importance": 3, "source": "한국금융신문", "published": "2026-04-21", "url": "https://www.fntimes.com/html/view.php?ud=2026042117435794185e6e69892f_18", "related": []}, {"id": "ecca1d1f70f8", "title": "기금형 퇴직연금은 결과 아닌 과정 책임으로…사외적립의무는 속도조절 요구", "summary": "노사정과 전문가가 참여한 정책 토론회에서 기금형 퇴직연금 도입 방향이 논의됐다. 전문가들은 운용 주체의 책임을 결과가 아닌 과정, 즉 의사결정 절차의 적정성으로 전환해야 한다고 주장했다. 경영계는 중소기업 부담을 이유로 사외적립 의무화의 단계적 시행을 요구했다. 한국노총과 한국경영자총협회, 고용노동부, 한국투자증권 관계자가 참석했다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-04-08", "url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=04598566645414152", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
