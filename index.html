    color: var(--ink-soft);

    font-variant-numeric: oldstyle-nums;
    text-align: right;
    padding-top: 2px;

    flex-wrap: wrap;

  article[data-cat="3"] .badge { color: var(--cat-3); }
  article[data-cat="4"] .badge { color: var(--cat-4); }
  article[data-cat="5"] .badge { color: var(--cat-5); }

    letter-spacing: 0.02em;

    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.01em;

  details a { color: var(--ink); }

수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": []}, {"id": "6dd0fa0960d5", "title": "퇴직연금 디폴트옵션 첫 순유출…2분기 1조4000억 감소", "summary": "디폴트옵션 운용자금이 2023년 제도 도입 후 처음으로 순유출을 기록해 2분기에 약 1조4000억원이 줄었다. 안정형에서만 1조4891억원이 빠져나갔고, 증시 호황으로 위험자산 투자가 늘면서 자금이 대거 이동했다. 평가액 기준 적립액 증가는 117억원에 그쳐 시장 전체 증가분 45조2000억원에 비하면 미미한 수준이다.", "category": "운용·상품", "importance": 5, "source": "한국경제", "published": "2026-09-08", "url": "https://www.hankyung.com/article/202609081009i", "related": []}, {"id": "362d60df2f63", "title": "퇴직연금도 자산배분 시대…NH투자증권, DB 적립금 컨설팅 강화", "summary": "NH투자증권이 연금자산관리본부 산하 DB적립금 운용 협의체를 통해 기업별 맞춤형 IPS(적립금운용계획서) 컨설팅을 확대한다. DB형은 적립금 수익률이 임금상승률에 못 미치면 기업이 추가 적립을 부담해야 해 자산배분 전략의 필요성이 커지고 있다. 전담 계리사와 자산배분·포트폴리오 전문가로 구성된 협의체가 부채 분석부터 리밸런싱까지 5단계로 지원한다. 고객사 한국선급은 IPS 개정 후 DB 적립금 1년 수익률이 5월 말 기준 20%를 넘어 고용노동부·금융감독원 모범사례로 선정됐다.", "category": "법인·자금운용", "importance": 5, "source": "매일경제", "published": "2026-09-08", "url": "https://www.mk.co.kr/news/stock/12147172", "related": []}, {"id": "f7cf0468c30c", "title": "정부, 올 하반기 퇴직연금 디폴트옵션 손질", "summary": "고용노동부가 올해 하반기 기금형 퇴직연금 도입과 함께 디폴트옵션(사전지정운용제도)도 개편하겠다고 밝혔다. 대기기간과 디폴트옵션 상품 평가체계를 명확히 하고, 현재 제도가 적용되지 않는 자금까지 적용 범위를 넓히는 것이 핵심이다. 현재 디폴트옵션 자금의 82.5%가 안정형에 쏠려 있는 점도 개선 대상으로 지목됐다. 정부는 퇴직연금 의무화와 사외적립 의무화를 함께 추진하며 올 하반기를 퇴직연금 대격변기로 보고 있다.", "category": "제도·규제", "importance": 5, "source": "파이낸셜뉴스", "published": "2026-09-07", "url": "https://www.fnnews.com/news/202609071643275392", "related": []}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "기금형, 퇴직연금 시장 기폭제…국민연금 참여엔 '갑론을박'", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=04454246645578808&mediaCodeNo=257"}]}, {"id": "99fcd85edc4b", "title": "[내 퇴직연금 뜯어보니 ③] '선택과 책임은 노동자, 결정은 회사' 구조 바꾸려면?", "summary": "고용노동부가 내년 퇴직연금사업자 평가제도를 전면 개편한다. 정성평가 비중을 줄이고 수익률 등 정량평가를 강화해 전체 사업자의 순위를 공개하는 방안을 추진하며, 교육·정보제공 의무도 주기적으로 점검한다. 지난해 퇴직연금 수익률은 6.47%로 제도 도입 이후 최고치였지만, 적립금의 84%를 실적배당형에 넣은 상위 10%는 평균 19.5%, 원리금보장형에 74%를 둔 하위 10%는 0.5%에 그쳤다. 지난해 유형별 수익률은 DC형 8.47%, IRP 9.44%, DB형 3.53%였다.", "category": "제도·규제", "importance": 4, "source": "매일노동뉴스", "published": "2026-09-11", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236734", "related": []}, {"id": "d08069641dee", "title": "디폴트옵션 안정형 85% '쏠림'…위험회피 연금 가입자들 [디폴트옵션 작동 구조 (상)]", "summary": "2025년 말 기준 디폴트옵션 투자유형 가운데 안정형 적립금이 45조5000억원으로 전체 53조3000억원의 85.4%를 차지했다. 안정형을 지정한 가입자수도 583만명으로 전체 734만명의 79.4%에 달했다. 반대편인 적극투자형은 적립금 1조4000억원으로 전체의 2.6%, 가입자 39만명으로 5.3%에 그쳤다. 안정투자형 적립금은 3조9000억원(7.3%), 중립투자형은 2조5000억원이었다.", "category": "운용·상품", "importance": 4, "source": "한국금융신문", "published": "2026-09-11", "url": "https://www.fntimes.com/html/view.php?ud=202609102100372851179ad43907_18", "related": []}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": []}, {"id": "ea311d54a299", "title": "“20년 묻어두면 수익률 161%”…퇴직연금 국채, 증권사 유치전 불붙었다", "summary": "9월 9일 퇴직연금 계좌의 개인투자용 국채 매입이 열리면서 증권사들이 고객 유치전에 나섰다. 20년물은 누적 수익률 161%, 10년물은 59%로 적용금리는 각각 연 4.92%, 4.765%다. 다만 국채는 자유롭게 매매할 수 없고 중도환매는 1년 이후에만, 그것도 정부가 정한 한도 안에서만 가능하다. 중도에 빼면 복리 혜택이 사라지므로 수익률 숫자보다 은퇴 시점과 유동성 필요를 먼저 봐야 한다는 조언이 나온다.", "category": "업계·경쟁사", "importance": 4, "source": "디지털데일리", "published": "2026-09-10", "url": "https://www.ddaily.co.kr/page/view/2026091010295983047", "related": []}, {"id": "90423d9e8cc8", "title": "“예금 이자론 성 안 차”…은행 퇴직연금, 국채 품고 반격할까", "summary": "상반기 말 증권사 퇴직연금 적립금이 전 분기 대비 16.5% 급증한 반면 은행권은 6.6%에 그쳤다. 은행들은 이달부터 개인투자용 국채를 새 카드로 내세웠는데 10년물 연 4.77% 수준으로 정기예금 금리보다 훨씬 높다. 다만 중도해지하면 복리 혜택이 사라진다는 한계가 있다. 전문가들은 적립식 투자가 유리하다고 조언한다.", "category": "업계·경쟁사", "importance": 4, "source": "데일리안", "published": "2026-09-10", "url": "https://www.dailian.co.kr/news/view/1688375/", "related": []}, {"id": "868631f1c398", "title": "이찬진 금감원장, 영국 FCA와 기금형 퇴직연금 감독체계 논의", "summary": "이찬진 금융감독원장이 런던 방문 중 영국 금융행위감독청(FCA) 부청장과 만나 기금형 퇴직연금 도입에 대비한 감독체계를 놓고 의견을 교환했다. 양국 당국은 연금 성과평가와 가입자 보호 체계에 대한 감독 경험을 계속 공유하기로 했다. 구체적인 감독 방안이나 일정은 공개되지 않았다.", "category": "제도·규제", "importance": 4, "source": "뉴스핌", "published": "2026-09-10", "url": "https://www.newspim.com/news/view/20260910000409", "related": []}, {"id": "8bb193e0ea59", "title": "“정부 기초연금개편안, 겉으로는 하후상박 실제는 재정 절감안”", "summary": "정부가 노인 하위 70%를 세 집단으로 나눠 차등 지급하는 하후상박 방식을 내놨다. 하위 30%에 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원(동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": []}, {"id": "90c48aab5817", "title": "배광수 NH투자증권 대표, 210조 DB연금 승부…퇴직연금 '혁신'", "summary": "NH투자증권이 OCIO(외부위탁운용관리) 사업에서 쌓은 자산배분 역량을 DB형 퇴직연금에 적용하고 있다. 전체 퇴직연금 적립금 501조4000억원 가운데 DB형은 228조9000억원으로 45.7%를 차지하지만 이 중 91.9%가 원리금보장형에 머물러 있다. 2025년 DB형 연간 수익률은 3.5%로 DC형 8.5%, IRP 9.4%에 못 미쳤고, 최근 5년 누적 수익률 15.9%는 같은 기간 임금상승률 18.9%를 밑돌았다. 한국선급은 NH투자증권과 포트폴리오를 재편해 올해 5월 말 기준 DB 적립금 1년 수익률이 20%를 넘어섰다.", "category": "법인·자금운용", "importance": 4, "source": "인사이트코리아", "published": "2026-09-10", "url": "https://www.insightkorea.co.kr/news/articleView.html?idxno=254326", "related": []}, {"id": "90897e3827bc", "title": "[퇴직연금 캡티브 시험대] 삼성생명 21년 1위 마감…신한은행, 연금 세 축 고른 성장", "summary": "올해 1분기 말 퇴직연금 1위 사업자가 삼성생명에서 신한은행으로 바뀌며 2005년 제도 도입 이후 21년 만에 선두가 교체됐다. 삼성생명은 1977년 종업원퇴직적립보험과 2009년 삼성전자의 단독 사업자 선정에 힘입어 2008년 초 시장의 31%를 차지했으나, 2019년 3분기부터 2026년 2분기까지 잔고가 24조8000억원에서 57조4000억원으로 늘어나는 동안 점유율은 12.72%까지 내려갔다. 신한은행은 DB·DC·IRP에 적립금이 고르게 분포하고 IRP는 23조원으로 업계 최대다. 시장 주도권이 DB형에서 DC형으로 옮겨가면서 ETF 실시간 거래가 가능한 증권업권이 부상하고 보험업권은 역성장이 뚜렷하다는 평가가 나온다.", "category": "업계·경쟁사", "importance": 4, "source": "더벨", "published": "2026-09-10", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081016506960103569", "related": []}]}, "monthly": {"period": "monthly", "key": "2026-09", "label": "2026년 9월", "generated_at": "2026-09-11T07:40:45+09:00", "item_count": 18, "shortfall_note": "이 기간에 모인 이슈는 18건입니다.", "items": [{"id": "989838fe6c31", "title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "summary": "550조원 규모 퇴직연금 시장을 바꿀 기금형 퇴직연금 가이드라인 발표가 계속 미뤄지고 있다. 오는 15일 열릴 예정이던 주요 퇴직연금 사업자 CEO 간담회는 추석 이후로 연기됐다. 국민연금은 \"수수료는 3분의 1, 수익률은 3배\"를 앞세워 공공기관 기금 수탁과 민간 연합형 기금의 OCIO 진출을 추진하고 있으나, 최상위 발주처가 민간 경쟁에 직접 뛰는 이해상충을 두고 업계 반발이 거세다. 당국은 신설 수탁법인이 기존 사업자의 계약형 인프라를 위탁할 수 있도록 가닥을 잡았고, 10곳 안팎의 사전인가제 도입 가능성이 거론된다.", "category": "제도·규제", "importance": 5, "source": "인베스트조선", "published": "2026-09-11", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html", "related": [{"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "69dd458f15f4", "title": "퇴직연금 550조 커졌는데…보험사 점유율 20% 무너졌다", "summary": "퇴직연금 시장이 553조원대로 커지는 사이 보험업계 점유율이 20% 아래로 떨어졌다. 상반기 증권사는 4조1000억원 순유입을 기록한 반면 보험사는 1799억원 순유출을 냈다. 실물이전 확대로 가입자가 금융사를 옮기기 쉬워지면서 사업자 간 경쟁이 격화된 결과다. DB형에 집중된 포트폴리오가 약점으로 지목되자 삼성·한화·교보생명 등이 DC형·IRP 강화와 ETF 상품 확대로 대응하고 있다.", "category": "업계·경쟁사", "importance": 5, "source": "뉴데일리", "published": "2026-09-10", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/10/2026091000173.html", "related": []}, {"id": "de4a8500263d", "title": "수익률 32%에도 돈이 안 온다…디폴트옵션의 역설", "summary": "디폴트옵션 시행 3년 차 데이터에서 적극투자형 1년 수익률이 32.66%를 기록했으나 자금의 82.5%는 여전히 안정형에 머물러 있다. 은행권은 고객 자금 대부분을 안정형에 두는 반면 증권사 고객은 위험자산에 투자해 업권별로 뚜렷이 갈렸다. 제도의 병목은 상품 품질이 아니라 자금이 좋은 상품에 도달하는 경로에 있다는 지적이다.", "category": "운용·상품", "importance": 5, "source": "한경머니", "published": "2026-09-10", "url": "https://magazine.hankyung.com/money/article/202608199155c", "related": []}, {"id": "937d44176934", "title": "퇴직연금 6.9조 이동…은행서 증권사로 자금 쏠림, 국채로 2차 경쟁", "summary": "올해 상반기 퇴직연금 실물이전 규모가 약 6조9000억원으로 전년 동기 약 3조2000억원의 2.2배에 달해 2024년 제도 시행 이후 반기 기준 최대를 기록했다. 업권별로는 증권사가 4조1513억원 순유입, 은행이 3조9714억원 순유출, 보험이 1799억원 순유출이었고, 증권사 적립금은 2분기 말 165조468억원으로 1분기 대비 16.5% 늘어 은행권 증가율 6.6%를 크게 앞섰다. 실물이전 규모는 가입자가 직접 상품을 고르는 IRP에서 6조8000억원으로 가장 컸다. 9월부터 개인투자용 국채가 DC·IRP 계좌에 편입되면서 증권사는 안정형 상품까지 더해 고객 확보에 나서고, 은행권은 ETF 거래 편의성 개선으로 맞서고 있다.", "category": "운용·상품", "importance": 5, "source": "더트래커", "published": "2026-09-10", "url": "https://thetracker.co.kr/View.aspx?No=4221950", "related": []}, {"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": []}, {"id": "6dd0fa0960d5", "title": "퇴직연금 디폴트옵션 첫 순유출…2분기 1조4000억 감소", "summary": "디폴트옵션 운용자금이 2023년 제도 도입 후 처음으로 순유출을 기록해 2분기에 약 1조4000억원이 줄었다. 안정형에서만 1조4891억원이 빠져나갔고, 증시 호황으로 위험자산 투자가 늘면서 자금이 대거 이동했다. 평가액 기준 적립액 증가는 117억원에 그쳐 시장 전체 증가분 45조2000억원에 비하면 미미한 수준이다.", "category": "운용·상품", "importance": 5, "source": "한국경제", "published": "2026-09-08", "url": "https://www.hankyung.com/article/202609081009i", "related": []}, {"id": "362d60df2f63", "title": "퇴직연금도 자산배분 시대…NH투자증권, DB 적립금 컨설팅 강화", "summary": "NH투자증권이 연금자산관리본부 산하 DB적립금 운용 협의체를 통해 기업별 맞춤형 IPS(적립금운용계획서) 컨설팅을 확대한다. DB형은 적립금 수익률이 임금상승률에 못 미치면 기업이 추가 적립을 부담해야 해 자산배분 전략의 필요성이 커지고 있다. 전담 계리사와 자산배분·포트폴리오 전문가로 구성된 협의체가 부채 분석부터 리밸런싱까지 5단계로 지원한다. 고객사 한국선급은 IPS 개정 후 DB 적립금 1년 수익률이 5월 말 기준 20%를 넘어 고용노동부·금융감독원 모범사례로 선정됐다.", "category": "법인·자금운용", "importance": 5, "source": "매일경제", "published": "2026-09-08", "url": "https://www.mk.co.kr/news/stock/12147172", "related": []}, {"id": "f7cf0468c30c", "title": "정부, 올 하반기 퇴직연금 디폴트옵션 손질", "summary": "고용노동부가 올해 하반기 기금형 퇴직연금 도입과 함께 디폴트옵션(사전지정운용제도)도 개편하겠다고 밝혔다. 대기기간과 디폴트옵션 상품 평가체계를 명확히 하고, 현재 제도가 적용되지 않는 자금까지 적용 범위를 넓히는 것이 핵심이다. 현재 디폴트옵션 자금의 82.5%가 안정형에 쏠려 있는 점도 개선 대상으로 지목됐다. 정부는 퇴직연금 의무화와 사외적립 의무화를 함께 추진하며 올 하반기를 퇴직연금 대격변기로 보고 있다.", "category": "제도·규제", "importance": 5, "source": "파이낸셜뉴스", "published": "2026-09-07", "url": "https://www.fnnews.com/news/202609071643275392", "related": []}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "기금형, 퇴직연금 시장 기폭제…국민연금 참여엔 '갑론을박'", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=04454246645578808&mediaCodeNo=257"}]}, {"id": "99fcd85edc4b", "title": "[내 퇴직연금 뜯어보니 ③] '선택과 책임은 노동자, 결정은 회사' 구조 바꾸려면?", "summary": "고용노동부가 내년 퇴직연금사업자 평가제도를 전면 개편한다. 정성평가 비중을 줄이고 수익률 등 정량평가를 강화해 전체 사업자의 순위를 공개하는 방안을 추진하며, 교육·정보제공 의무도 주기적으로 점검한다. 지난해 퇴직연금 수익률은 6.47%로 제도 도입 이후 최고치였지만, 적립금의 84%를 실적배당형에 넣은 상위 10%는 평균 19.5%, 원리금보장형에 74%를 둔 하위 10%는 0.5%에 그쳤다. 지난해 유형별 수익률은 DC형 8.47%, IRP 9.44%, DB형 3.53%였다.", "category": "제도·규제", "importance": 4, "source": "매일노동뉴스", "published": "2026-09-11", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236734", "related": []}, {"id": "d08069641dee", "title": "디폴트옵션 안정형 85% '쏠림'…위험회피 연금 가입자들 [디폴트옵션 작동 구조 (상)]", "summary": "2025년 말 기준 디폴트옵션 투자유형 가운데 안정형 적립금이 45조5000억원으로 전체 53조3000억원의 85.4%를 차지했다. 안정형을 지정한 가입자수도 583만명으로 전체 734만명의 79.4%에 달했다. 반대편인 적극투자형은 적립금 1조4000억원으로 전체의 2.6%, 가입자 39만명으로 5.3%에 그쳤다. 안정투자형 적립금은 3조9000억원(7.3%), 중립투자형은 2조5000억원이었다.", "category": "운용·상품", "importance": 4, "source": "한국금융신문", "published": "2026-09-11", "url": "https://www.fntimes.com/html/view.php?ud=202609102100372851179ad43907_18", "related": []}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": []}, {"id": "ea311d54a299", "title": "“20년 묻어두면 수익률 161%”…퇴직연금 국채, 증권사 유치전 불붙었다", "summary": "9월 9일 퇴직연금 계좌의 개인투자용 국채 매입이 열리면서 증권사들이 고객 유치전에 나섰다. 20년물은 누적 수익률 161%, 10년물은 59%로 적용금리는 각각 연 4.92%, 4.765%다. 다만 국채는 자유롭게 매매할 수 없고 중도환매는 1년 이후에만, 그것도 정부가 정한 한도 안에서만 가능하다. 중도에 빼면 복리 혜택이 사라지므로 수익률 숫자보다 은퇴 시점과 유동성 필요를 먼저 봐야 한다는 조언이 나온다.", "category": "업계·경쟁사", "importance": 4, "source": "디지털데일리", "published": "2026-09-10", "url": "https://www.ddaily.co.kr/page/view/2026091010295983047", "related": []}, {"id": "90423d9e8cc8", "title": "“예금 이자론 성 안 차”…은행 퇴직연금, 국채 품고 반격할까", "summary": "상반기 말 증권사 퇴직연금 적립금이 전 분기 대비 16.5% 급증한 반면 은행권은 6.6%에 그쳤다. 은행들은 이달부터 개인투자용 국채를 새 카드로 내세웠는데 10년물 연 4.77% 수준으로 정기예금 금리보다 훨씬 높다. 다만 중도해지하면 복리 혜택이 사라진다는 한계가 있다. 전문가들은 적립식 투자가 유리하다고 조언한다.", "category": "업계·경쟁사", "importance": 4, "source": "데일리안", "published": "2026-09-10", "url": "https://www.dailian.co.kr/news/view/1688375/", "related": []}, {"id": "868631f1c398", "title": "이찬진 금감원장, 영국 FCA와 기금형 퇴직연금 감독체계 논의", "summary": "이찬진 금융감독원장이 런던 방문 중 영국 금융행위감독청(FCA) 부청장과 만나 기금형 퇴직연금 도입에 대비한 감독체계를 놓고 의견을 교환했다. 양국 당국은 연금 성과평가와 가입자 보호 체계에 대한 감독 경험을 계속 공유하기로 했다. 구체적인 감독 방안이나 일정은 공개되지 않았다.", "category": "제도·규제", "importance": 4, "source": "뉴스핌", "published": "2026-09-10", "url": "https://www.newspim.com/news/view/20260910000409", "related": []}, {"id": "8bb193e0ea59", "title": "“정부 기초연금개편안, 겉으로는 하후상박 실제는 재정 절감안”", "summary": "정부가 노인 하위 70%를 세 집단으로 나눠 차등 지급하는 하후상박 방식을 내놨다. 하위 30%에 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원(동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": []}, {"id": "90c48aab5817", "title": "배광수 NH투자증권 대표, 210조 DB연금 승부…퇴직연금 '혁신'", "summary": "NH투자증권이 OCIO(외부위탁운용관리) 사업에서 쌓은 자산배분 역량을 DB형 퇴직연금에 적용하고 있다. 전체 퇴직연금 적립금 501조4000억원 가운데 DB형은 228조9000억원으로 45.7%를 차지하지만 이 중 91.9%가 원리금보장형에 머물러 있다. 2025년 DB형 연간 수익률은 3.5%로 DC형 8.5%, IRP 9.4%에 못 미쳤고, 최근 5년 누적 수익률 15.9%는 같은 기간 임금상승률 18.9%를 밑돌았다. 한국선급은 NH투자증권과 포트폴리오를 재편해 올해 5월 말 기준 DB 적립금 1년 수익률이 20%를 넘어섰다.", "category": "법인·자금운용", "importance": 4, "source": "인사이트코리아", "published": "2026-09-10", "url": "https://www.insightkorea.co.kr/news/articleView.html?idxno=254326", "related": []}, {"id": "90897e3827bc", "title": "[퇴직연금 캡티브 시험대] 삼성생명 21년 1위 마감…신한은행, 연금 세 축 고른 성장", "summary": "올해 1분기 말 퇴직연금 1위 사업자가 삼성생명에서 신한은행으로 바뀌며 2005년 제도 도입 이후 21년 만에 선두가 교체됐다. 삼성생명은 1977년 종업원퇴직적립보험과 2009년 삼성전자의 단독 사업자 선정에 힘입어 2008년 초 시장의 31%를 차지했으나, 2019년 3분기부터 2026년 2분기까지 잔고가 24조8000억원에서 57조4000억원으로 늘어나는 동안 점유율은 12.72%까지 내려갔다. 신한은행은 DB·DC·IRP에 적립금이 고르게 분포하고 IRP는 23조원으로 업계 최대다. 시장 주도권이 DB형에서 DC형으로 옮겨가면서 ETF 실시간 거래가 가능한 증권업권이 부상하고 보험업권은 역성장이 뚜렷하다는 평가가 나온다.", "category": "업계·경쟁사", "importance": 4, "source": "더벨", "published": "2026-09-10", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081016506960103569", "related": []}]}, "yearly": {"period": "yearly", "key": "2026", "label": "2026년", "generated_at": "2026-09-11T07:40:45+09:00", "item_count": 18, "shortfall_note": "이 기간에 모인 이슈는 18건입니다.", "items": [{"id": "989838fe6c31", "title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "summary": "550조원 규모 퇴직연금 시장을 바꿀 기금형 퇴직연금 가이드라인 발표가 계속 미뤄지고 있다. 오는 15일 열릴 예정이던 주요 퇴직연금 사업자 CEO 간담회는 추석 이후로 연기됐다. 국민연금은 \"수수료는 3분의 1, 수익률은 3배\"를 앞세워 공공기관 기금 수탁과 민간 연합형 기금의 OCIO 진출을 추진하고 있으나, 최상위 발주처가 민간 경쟁에 직접 뛰는 이해상충을 두고 업계 반발이 거세다. 당국은 신설 수탁법인이 기존 사업자의 계약형 인프라를 위탁할 수 있도록 가닥을 잡았고, 10곳 안팎의 사전인가제 도입 가능성이 거론된다.", "category": "제도·규제", "importance": 5, "source": "인베스트조선", "published": "2026-09-11", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html", "related": [{"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "69dd458f15f4", "title": "퇴직연금 550조 커졌는데…보험사 점유율 20% 무너졌다", "summary": "퇴직연금 시장이 553조원대로 커지는 사이 보험업계 점유율이 20% 아래로 떨어졌다. 상반기 증권사는 4조1000억원 순유입을 기록한 반면 보험사는 1799억원 순유출을 냈다. 실물이전 확대로 가입자가 금융사를 옮기기 쉬워지면서 사업자 간 경쟁이 격화된 결과다. DB형에 집중된 포트폴리오가 약점으로 지목되자 삼성·한화·교보생명 등이 DC형·IRP 강화와 ETF 상품 확대로 대응하고 있다.", "category": "업계·경쟁사", "importance": 5, "source": "뉴데일리", "published": "2026-09-10", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/10/2026091000173.html", "related": []}, {"id": "de4a8500263d", "title": "수익률 32%에도 돈이 안 온다…디폴트옵션의 역설", "summary": "디폴트옵션 시행 3년 차 데이터에서 적극투자형 1년 수익률이 32.66%를 기록했으나 자금의 82.5%는 여전히 안정형에 머물러 있다. 은행권은 고객 자금 대부분을 안정형에 두는 반면 증권사 고객은 위험자산에 투자해 업권별로 뚜렷이 갈렸다. 제도의 병목은 상품 품질이 아니라 자금이 좋은 상품에 도달하는 경로에 있다는 지적이다.", "category": "운용·상품", "importance": 5, "source": "한경머니", "published": "2026-09-10", "url": "https://magazine.hankyung.com/money/article/202608199155c", "related": []}, {"id": "937d44176934", "title": "퇴직연금 6.9조 이동…은행서 증권사로 자금 쏠림, 국채로 2차 경쟁", "summary": "올해 상반기 퇴직연금 실물이전 규모가 약 6조9000억원으로 전년 동기 약 3조2000억원의 2.2배에 달해 2024년 제도 시행 이후 반기 기준 최대를 기록했다. 업권별로는 증권사가 4조1513억원 순유입, 은행이 3조9714억원 순유출, 보험이 1799억원 순유출이었고, 증권사 적립금은 2분기 말 165조468억원으로 1분기 대비 16.5% 늘어 은행권 증가율 6.6%를 크게 앞섰다. 실물이전 규모는 가입자가 직접 상품을 고르는 IRP에서 6조8000억원으로 가장 컸다. 9월부터 개인투자용 국채가 DC·IRP 계좌에 편입되면서 증권사는 안정형 상품까지 더해 고객 확보에 나서고, 은행권은 ETF 거래 편의성 개선으로 맞서고 있다.", "category": "운용·상품", "importance": 5, "source": "더트래커", "published": "2026-09-10", "url": "https://thetracker.co.kr/View.aspx?No=4221950", "related": []}, {"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", "category": "업계·경쟁사", "importance": 5, "source": "파이낸셜투데이", "published": "2026-09-09", "url": "https://www.ftoday.co.kr/news/articleView.html?idxno=365111", "related": []}, {"id": "6dd0fa0960d5", "title": "퇴직연금 디폴트옵션 첫 순유출…2분기 1조4000억 감소", "summary": "디폴트옵션 운용자금이 2023년 제도 도입 후 처음으로 순유출을 기록해 2분기에 약 1조4000억원이 줄었다. 안정형에서만 1조4891억원이 빠져나갔고, 증시 호황으로 위험자산 투자가 늘면서 자금이 대거 이동했다. 평가액 기준 적립액 증가는 117억원에 그쳐 시장 전체 증가분 45조2000억원에 비하면 미미한 수준이다.", "category": "운용·상품", "importance": 5, "source": "한국경제", "published": "2026-09-08", "url": "https://www.hankyung.com/article/202609081009i", "related": []}, {"id": "362d60df2f63", "title": "퇴직연금도 자산배분 시대…NH투자증권, DB 적립금 컨설팅 강화", "summary": "NH투자증권이 연금자산관리본부 산하 DB적립금 운용 협의체를 통해 기업별 맞춤형 IPS(적립금운용계획서) 컨설팅을 확대한다. DB형은 적립금 수익률이 임금상승률에 못 미치면 기업이 추가 적립을 부담해야 해 자산배분 전략의 필요성이 커지고 있다. 전담 계리사와 자산배분·포트폴리오 전문가로 구성된 협의체가 부채 분석부터 리밸런싱까지 5단계로 지원한다. 고객사 한국선급은 IPS 개정 후 DB 적립금 1년 수익률이 5월 말 기준 20%를 넘어 고용노동부·금융감독원 모범사례로 선정됐다.", "category": "법인·자금운용", "importance": 5, "source": "매일경제", "published": "2026-09-08", "url": "https://www.mk.co.kr/news/stock/12147172", "related": []}, {"id": "f7cf0468c30c", "title": "정부, 올 하반기 퇴직연금 디폴트옵션 손질", "summary": "고용노동부가 올해 하반기 기금형 퇴직연금 도입과 함께 디폴트옵션(사전지정운용제도)도 개편하겠다고 밝혔다. 대기기간과 디폴트옵션 상품 평가체계를 명확히 하고, 현재 제도가 적용되지 않는 자금까지 적용 범위를 넓히는 것이 핵심이다. 현재 디폴트옵션 자금의 82.5%가 안정형에 쏠려 있는 점도 개선 대상으로 지목됐다. 정부는 퇴직연금 의무화와 사외적립 의무화를 함께 추진하며 올 하반기를 퇴직연금 대격변기로 보고 있다.", "category": "제도·규제", "importance": 5, "source": "파이낸셜뉴스", "published": "2026-09-07", "url": "https://www.fnnews.com/news/202609071643275392", "related": []}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "기금형, 퇴직연금 시장 기폭제…국민연금 참여엔 '갑론을박'", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=04454246645578808&mediaCodeNo=257"}]}, {"id": "99fcd85edc4b", "title": "[내 퇴직연금 뜯어보니 ③] '선택과 책임은 노동자, 결정은 회사' 구조 바꾸려면?", "summary": "고용노동부가 내년 퇴직연금사업자 평가제도를 전면 개편한다. 정성평가 비중을 줄이고 수익률 등 정량평가를 강화해 전체 사업자의 순위를 공개하는 방안을 추진하며, 교육·정보제공 의무도 주기적으로 점검한다. 지난해 퇴직연금 수익률은 6.47%로 제도 도입 이후 최고치였지만, 적립금의 84%를 실적배당형에 넣은 상위 10%는 평균 19.5%, 원리금보장형에 74%를 둔 하위 10%는 0.5%에 그쳤다. 지난해 유형별 수익률은 DC형 8.47%, IRP 9.44%, DB형 3.53%였다.", "category": "제도·규제", "importance": 4, "source": "매일노동뉴스", "published": "2026-09-11", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236734", "related": []}, {"id": "d08069641dee", "title": "디폴트옵션 안정형 85% '쏠림'…위험회피 연금 가입자들 [디폴트옵션 작동 구조 (상)]", "summary": "2025년 말 기준 디폴트옵션 투자유형 가운데 안정형 적립금이 45조5000억원으로 전체 53조3000억원의 85.4%를 차지했다. 안정형을 지정한 가입자수도 583만명으로 전체 734만명의 79.4%에 달했다. 반대편인 적극투자형은 적립금 1조4000억원으로 전체의 2.6%, 가입자 39만명으로 5.3%에 그쳤다. 안정투자형 적립금은 3조9000억원(7.3%), 중립투자형은 2조5000억원이었다.", "category": "운용·상품", "importance": 4, "source": "한국금융신문", "published": "2026-09-11", "url": "https://www.fntimes.com/html/view.php?ud=202609102100372851179ad43907_18", "related": []}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": []}, {"id": "ea311d54a299", "title": "“20년 묻어두면 수익률 161%”…퇴직연금 국채, 증권사 유치전 불붙었다", "summary": "9월 9일 퇴직연금 계좌의 개인투자용 국채 매입이 열리면서 증권사들이 고객 유치전에 나섰다. 20년물은 누적 수익률 161%, 10년물은 59%로 적용금리는 각각 연 4.92%, 4.765%다. 다만 국채는 자유롭게 매매할 수 없고 중도환매는 1년 이후에만, 그것도 정부가 정한 한도 안에서만 가능하다. 중도에 빼면 복리 혜택이 사라지므로 수익률 숫자보다 은퇴 시점과 유동성 필요를 먼저 봐야 한다는 조언이 나온다.", "category": "업계·경쟁사", "importance": 4, "source": "디지털데일리", "published": "2026-09-10", "url": "https://www.ddaily.co.kr/page/view/2026091010295983047", "related": []}, {"id": "90423d9e8cc8", "title": "“예금 이자론 성 안 차”…은행 퇴직연금, 국채 품고 반격할까", "summary": "상반기 말 증권사 퇴직연금 적립금이 전 분기 대비 16.5% 급증한 반면 은행권은 6.6%에 그쳤다. 은행들은 이달부터 개인투자용 국채를 새 카드로 내세웠는데 10년물 연 4.77% 수준으로 정기예금 금리보다 훨씬 높다. 다만 중도해지하면 복리 혜택이 사라진다는 한계가 있다. 전문가들은 적립식 투자가 유리하다고 조언한다.", "category": "업계·경쟁사", "importance": 4, "source": "데일리안", "published": "2026-09-10", "url": "https://www.dailian.co.kr/news/view/1688375/", "related": []}, {"id": "868631f1c398", "title": "이찬진 금감원장, 영국 FCA와 기금형 퇴직연금 감독체계 논의", "summary": "이찬진 금융감독원장이 런던 방문 중 영국 금융행위감독청(FCA) 부청장과 만나 기금형 퇴직연금 도입에 대비한 감독체계를 놓고 의견을 교환했다. 양국 당국은 연금 성과평가와 가입자 보호 체계에 대한 감독 경험을 계속 공유하기로 했다. 구체적인 감독 방안이나 일정은 공개되지 않았다.", "category": "제도·규제", "importance": 4, "source": "뉴스핌", "published": "2026-09-10", "url": "https://www.newspim.com/news/view/20260910000409", "related": []}, {"id": "8bb193e0ea59", "title": "“정부 기초연금개편안, 겉으로는 하후상박 실제는 재정 절감안”", "summary": "정부가 노인 하위 70%를 세 집단으로 나눠 차등 지급하는 하후상박 방식을 내놨다. 하위 30%에 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원(동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": []}, {"id": "90c48aab5817", "title": "배광수 NH투자증권 대표, 210조 DB연금 승부…퇴직연금 '혁신'", "summary": "NH투자증권이 OCIO(외부위탁운용관리) 사업에서 쌓은 자산배분 역량을 DB형 퇴직연금에 적용하고 있다. 전체 퇴직연금 적립금 501조4000억원 가운데 DB형은 228조9000억원으로 45.7%를 차지하지만 이 중 91.9%가 원리금보장형에 머물러 있다. 2025년 DB형 연간 수익률은 3.5%로 DC형 8.5%, IRP 9.4%에 못 미쳤고, 최근 5년 누적 수익률 15.9%는 같은 기간 임금상승률 18.9%를 밑돌았다. 한국선급은 NH투자증권과 포트폴리오를 재편해 올해 5월 말 기준 DB 적립금 1년 수익률이 20%를 넘어섰다.", "category": "법인·자금운용", "importance": 4, "source": "인사이트코리아", "published": "2026-09-10", "url": "https://www.insightkorea.co.kr/news/articleView.html?idxno=254326", "related": []}]}}}</script>

    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  function render() {
    var doc = DATA.periods[currentPeriod];

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      button.setAttribute('aria-selected', String(PERIODS[index].key === currentPeriod));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    listEl.textContent = '';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
