    gap: 10px;

  }

    * { transition: none !important; }
  }

xno=424848"}, {"id": "6d83beb45d09", "title": "기초연금 '하후상박', 10년 뒤엔 노인빈곤율 되레 높인다", "summary": "6일 토론회에서 발표된 연구에 따르면 정부의 기초연금 하후상박 개편안은 2024년 기준 노인빈곤율을 35.41%로 현행(35.87%)보다 낮추지만, 2035년에는 38.89%로 현행 유지(38.52%)보다 높아진다. 소득 하위 45~70% 구간 연금액이 35만원에 묶이면 10년간 실질 가치가 19.6% 떨어지고, 2035년 수급자의 37.1%가 현행보다 월평균 4만6000원 적게 받는 것으로 추계됐다. 대안인 보충적 소득보장은 2035년 노인빈곤율을 33.32%로 낮춰 효과가 가장 컸다. 정부 개편안은 기초연금법 개정이 필요하며 보건복지부는 연내 입법, 내년 4월 시행을 목표로 한다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-07", "url": "https://www.segye.com/newsView/20261106513947"}, {"id": "02ab3206642f", "title": "관세쇼크 땐 폭풍매수 국민연금, 블루쓰나미 땐 힘 못쓴 까닭", "summary": "6일 유가증권시장에서 외국인이 2626억원을 순매도하는 동안 국민연금이 포함된 연기금은 290억원 순매수에 그쳤다. 직전 5거래일에도 외국인이 9조3690억원을 파는 동안 연기금 순매수는 1조4110억원이었다. 국민연금의 국내 주식 비중은 2024년 말 11.5%에서 올해 5월 말 29.4%까지 높아졌고, 기금운용위원회는 1월 리밸런싱을 한시 유예한 데 이어 5월 국내 주식 목표 비중을 14.9%에서 20.8%로 올렸다. 이 때문에 하락장에서 추가 매수 여력이 줄었다는 지적이 나온다.", "category": "가입자·사회", "importance": 3, "source": "중앙일보", "published": "2026-11-07", "url": "https://www.joongang.co.kr/article/25476555"}, {"id": "ac1522bcd529", "title": "[CEO 리뷰⑦] 엄주성 키움증권 대표, 리테일 넘어 자산관리 확장", "summary": "엄주성 키움증권 대표가 리테일 중심 사업구조를 자산관리(WM)와 기업금융(IB)으로 넓히며 발행어음과 퇴직연금 등 새 수익원 확보에 나섰다. 키움증권의 올해 3분기 누적 연결 영업이익은 1조8163억원, 당기순이익은 1조3965억원으로 전년 동기 대비 각각 59.0%, 60.9% 늘었다. 반면 3분기 연결 순이익은 2386억원으로 전 분기보다 65.0% 줄었고 위탁매매 수수료 수익도 2869억원으로 42.9% 감소했다. 엄 대표는 신년사에서 AI 기반 자산관리 고도화와 발행어음·퇴직연금 경쟁력 확보를 강조했으며, 3분기 말 발행어음 잔고는 2조2000억원이다.", "category": "업계·경쟁사", "importance": 3, "source": "프레스나인", "published": "2026-11-07", "url": "http://www.press9.kr/news/articleView.html?idxno=85764"}, {"id": "a149e5d3f04a", "title": "증시 급락에 커진 걱정…은퇴 앞둔 내 연금 괜찮을까", "summary": "코스피가 6일 6.02% 내린 5059.69에 마감하는 등 이틀 연속 급락한 가운데, 퇴직연금 인출 직후 하락장을 만나면 노후자금이 더 빨리 소진될 수 있다는 분석이 나왔다. NH투자증권 100세시대연구소에 따르면 지난해 말 IRP 적립금의 44.3%, DC형의 33.0%가 실적배당형 상품에 들어 있어 1년 새 각각 10.8%포인트, 9.7%포인트 높아졌다. 삼성증권은 1억원에서 매년 500만원씩 인출할 때 첫해 수익률이 마이너스 35%에서 출발하면 7년째 자금이 바닥나지만 역순이면 15년 뒤에도 약 4200만원이 남는다고 분석했다. 생활비 1~3년치를 현금이나 단기채로 보유하고 하락한 자산은 팔지 않는 인출 원칙이 제시됐다.", "category": "운용·상품", "importance": 3, "source": "뉴스웨이", "published": "2026-11-07", "url": "https://www.newsway.co.kr/news/view?ud=2026110617095870929"}, {"id": "8bb6d6de4bc1", "title": "미 401(k) 가상자산 편입 규정안, 백악관 심사 단계 진입", "summary": "가상자산을 포함한 대체자산을 미국 401(k) 퇴직연금에 편입할 수 있게 하는 규정안이 백악관에 도착했다. 더블록(The Block)의 보도를 인용한 속보다. 규정안의 구체적인 내용은 기사에 담기지 않았다.", "category": "제도·규제", "importance": 2, "source": "토큰포스트", "published": "2026-11-07", "url": "https://www.tokenpost.kr/news/breaking/434234"}, {"id": "12742de29856", "title": "대기업 다니던 50대 김 부장, 이제 9급 공무원입니다", "summary": "고용 불안과 공무원연금의 안정성 때문에 9급 공무원 시험에 도전하는 50대가 늘고 있다. 올해 서울시 9급 공채 50대 합격자는 56명(2.2%)으로 지난해 30명(1.9%)보다 많았고, 국가직 9급 공채 50대 합격자도 31명(0.8%)으로 늘었다. 2009년 공무원연금법 개정으로 퇴직 연금 지급 개시 연령이 65세로 올라 퇴직과 연금 수령 사이 소득 공백이 최대 5년이 됐으며, 이에 대한 헌법소원은 지난달 22일 4대 4로 의견이 갈렸다.", "category": "가입자·사회", "importance": 2, "source": "조선일보", "published": "2026-11-07", "url": "https://www.chosun.com/national/weekend/2026/11/07/KM5SFHV2Y5CARLAAK26CH2YCSM/"}, {"id": "9489226c79cf", "title": "미래에셋증권도 해킹…고객 계좌번호·임직원 3만5천명 정보 유출", "summary": "미래에셋증권이 4일 모바일웹 휴대폰 인증 로그인 서비스에서 외부 접근을 확인해 고객 계좌번호가 유출됐으며, 유출 고객 수는 공개되지 않았다. 5일에는 사내 그룹웨어가 공격받아 퇴직자와 외주직원을 포함한 임직원 약 3만5255명의 개인정보가 유출됐다. 이로써 사이버 공격이 확인된 미래에셋그룹 계열사는 네 곳으로 늘었고, 앞서 미래에셋생명 사고에서는 퇴직연금 거래 관련 정보도 유출됐다. 미래에셋증권은 접근통제와 이상행위 탐지 체계를 강화하겠다고 밝혔다.", "category": "업계·경쟁사", "importance": 2, "source": "연합인포맥스", "published": "2026-11-07", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4443581"}, {"id": "be38a13740a2", "title": "‘증시 급락 쇼크’ 野 한목소리 비판…“李정부, 억지 주가 부양의 대가”", "summary": "코스피가 6일 장중 5000선 아래로 내려앉는 등 전일 대비 6% 급락하자 야권 인사들이 일제히 이재명 정부의 경제·증시 정책을 비판했다. 임이자 국민의힘 정책위의장은 억지 주가 부양과 일시적 반도체 호황에 기댄 9000피는 허상이었다고 말했다. 유승민 전 의원은 국민연금을 날려버린 책임자들에게 법적 책임을 물어야 한다고 했다. 한동훈 무소속 의원은 국민연금의 국내 주식 투자 확대를 문제 삼으며 국민 노후를 담보로 투기판을 벌인 대가를 보고 있다고 밝혔다.", "category": "가입자·사회", "importance": 2, "source": "헤럴드경제", "published": "2026-11-07", "url": "https://biz.heraldcorp.com/article/10928749"}, {"id": "16c1e45bae05", "title": "[뉴욕증시 대폭락] \"내 401k 어쩔거야\"…트럼프가 증시 폭락하자 민주당 저격한 사연", "summary": "미국 뉴욕증시 3대 지수가 하루 만에 폭락하자 트럼프 대통령이 책임을 민주당에 돌렸다. CNN은 데이터센터 건설 유예와 세제 혜택 폐지를 공약한 민주당 지나 히노호사 후보의 텍사스 주지사 당선을 하락 원인 중 하나로 꼽았다. 트럼프 대통령은 5일(현지시간) 트루스소셜에 \"여러분의 '401k'(미국인 퇴직연금)도 떨어졌다\"며 공화당이 아닌 민주당 탓이라고 주장했다.", "category": "가입자·사회", "importance": 2, "source": "CBC뉴스", "published": "2026-11-07", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=624002"}, {"id": "441c545c0a64", "title": "[피플H] \"반도체 200개 담을 필요 없다\"…엔비디아에 집중하라는 이유", "summary": "하나자산운용은 최근 채권혼합형 ETF 6종의 분배 주기를 월 단위로 전환해 기존 3종을 포함한 월분배 상품을 모두 9종으로 늘렸다. 채권혼합형 ETF는 주식과 채권을 함께 담아 하락 위험을 분산하고, 퇴직연금 계좌에서 100% 투자할 수 있는 상품도 있어 주식형 ETF 한도에 묶인 연금 투자자에게 활용도가 높다. 김승현 1QETF솔루션본부장은 채권혼합형 ETF를 월분배와 퇴직연금 투자 두 측면에서 주목할 상품으로 꼽았다. 그는 분배율만 좇거나 배당락 직전에 매수하는 방식은 실익이 크지 않다고 지적했다.", "category": "운용·상품", "importance": 2, "source": "한스경제", "published": "2026-11-07", "url": "http://www.hansbiz.co.kr/news/articleView.html?idxno=880800"}, {"id": "c38d5b15fc17", "title": "[단독] 평택·안성·오산 임금체불 매년 수백억원…근로자 생계 ‘빨간불’", "summary": "고용노동부 평택지청에 따르면 평택·안성·오산 지역 임금체불 신고금액은 2021년 378억여원에서 2024년 736억여원으로 94.7% 늘었고, 지난해에도 621억여원을 기록했다. 올해는 9월까지 390억여원이며, 체불 관련 근로자는 2021년 6천863명에서 2024년 1만684명으로 늘었다. 노동계는 기업이 폐업·도산하면 임금과 퇴직금을 지급할 능력이 없어진다며 수시 점검으로 퇴직연금 등 근로자 몫의 비용이 준비돼 있는지 확인해야 한다고 지적했다. 평택지청은 체불 사업장 전수조사 등 엄격한 관리감독을 펼치겠다고 밝혔다.", "category": "가입자·사회", "importance": 2, "source": "경기일보", "published": "2026-11-07", "url": "https://www.kyeonggi.com/article/20261105580419"}, {"id": "c762fd2bd3f0", "title": "경기도 중장년 지원·정책 축소 우려… “개편 철회해야”", "summary": "경기도의원과 중장년네트워크컴투게더 등은 6일 경기도의회에서 기자회견을 열고 중장년 지원 사무를 규정한 '경기도 행정기구 및 정원 조례' 제24조 삭제를 담은 조직개편안의 철회를 요구했다. 참가자들은 경기도 인구 약 1377만 명 가운데 50세 이상이 약 596만 명으로 43.3%를 차지한다며 정책 축소는 고령화 대응 방향과 맞지 않는다고 주장했다. 9월 추경 심의 과정에서 베이비부머기획과 소관 예산 약 30억 원의 감액안이 제시됐고, 여기에는 라이트잡 예산 12억1600만 원과 사회공헌활동 예산 3억4000만 원이 포함됐다. 참가자들은 퇴직 이후 연금 수급 전까지 소득 공백을 겪는 중장년에게 일자리·교육·생애전환 프로그램이 중요한 지원 수단이라며 사업 지속과 예산 확보를 촉구했다.", "category": "가입자·사회", "importance": 2, "source": "브라보마이라이프", "published": "2026-11-07", "url": "https://bravo.etoday.co.kr/view/atc_view/20443"}, {"id": "bfeb7fda0d72", "title": "평생 남편 뒷바라지했는데…이혼하면 빈손?[양친소]", "summary": "50년 넘게 폭언과 통제를 견딘 70대 어머니의 황혼이혼 사연에 변호사가 답하는 법률 상담 연재다. 재산이 남편 명의여도 가사노동과 자녀 양육, 가게 일을 도운 기여가 인정되면 재산분할을 받을 수 있다고 설명했다. 퇴직금과 국민연금도 일정 요건을 충족하면 나눠 받을 수 있으나 나누는 방식이 서로 다르다고 했다.", "category": "가입자·사회", "importance": 1, "source": "이데일리", "published": "2026-11-07", "url": "https://www.edaily.co.kr/News/Read?newsId=01744966645643424&mediaCodeNo=257"}, {"id": "7f9b291758c7", "title": "반드시 챙겨야 할 은퇴자 연말 절세법 ‘1000만 원 룰’", "summary": "윤세정 DB자산운용 채권운용3팀장이 은퇴자의 연말 절세법을 짚은 기고다. 금융소득종합과세와 건강보험료는 모두 1월 1일부터 12월 31일까지 실제로 받은 이자·배당소득을 기준으로 따진다. 금융소득이 2000만 원을 넘으면 피부양자 자격을 잃고, 1000만 원을 넘으면 전액이 소득에 반영돼 은퇴자에게는 세금보다 건보료가 진짜 경계선이라고 설명한다. 개인투자용 국채는 9월부터 DC형 퇴직연금이나 IRP로 매입할 수 있다.", "category": "가입자·사회", "importance": 1, "source": "신동아", "published": "2026-11-07", "url": "https://shindonga.donga.com/3/all/13/6444739/1"}, {"id": "c054cff5b9d7", "title": "하나은행, 호남권 첫 시니어 특화 '광주금융 라운지' 개설", "summary": "하나은행이 5일 광주금융센터지점 2층에 호남권 최초 시니어 특화 채널인 '하나더넥스트 광주금융 라운지'를 열었다. 라운지는 은퇴설계와 상속·증여, 유언대용신탁 상담과 함께 건강관리·문화·주거 등 비금융 서비스를 제공한다. 국민연금·퇴직연금·개인연금·주택연금 등 '4층 연금'과 보유자산을 종합 분석하는 '평생소득설계' 상담도 상시 운영한다. 하나은행 거래 여부와 관계없이 누구나 무료로 1대1 상담을 받을 수 있다.", "category": "업계·경쟁사", "importance": 1, "source": "퍼블릭타임스", "published": "2026-11-07", "url": "https://www.public25.com/news/articleView.html?idxno=58054"}, {"id": "a1606e9811da", "title": "조각난 퍼즐 맞추기: \"세계가 우리에게 던진 3가지 질문\" [김병철의 퇴직연금 개혁 시나리오]30", "summary": "김병철 한국퇴직연금개발원 대표가 연재 칼럼에서 해외 퇴직연금 제도 비교(Part 2)를 '어떻게 불릴 것인가, 어떻게 태울 것인가, 어떻게 쓸 것인가'라는 세 가지 질문으로 정리했다. 수익률은 상품 목록이 아니라 성과 측정·위임·평가가 이어지는 거버넌스 구조에서 나오며, 기금형뿐 아니라 계약형도 상품선정과 성과평가의 책임을 드러내면 거버넌스를 가질 수 있다고 썼다. 가입은 영국 자동가입·미국 QDIA·호주 스테이플링처럼 기본값을 바꿔 먼저 태워야 하고, 인출 단계에서는 목돈을 평생소득으로 바꾸는 설계가 필요하다고 밝혔다. 세 질문은 결국 가입자 이익을 지키는 수탁자 책임 주체를 세우는 문제로 모인다고 정리했다.", "category": "제도·규제", "importance": 1, "source": "이데일리", "published": "2026-11-07", "url": "https://www.edaily.co.kr/News/Read?newsId=02184486645643424&mediaCodeNo=257"}, {"id": "13e0d63f86aa", "title": "[짠富테크] 연금저축·IRP 900만원 넣으면…세금 최대 148만5000원 줄인다", "summary": "연금저축과 IRP를 합한 세액공제 한도는 연간 900만원이며, 연금저축 600만원에 IRP 300만원을 더하는 방식이 대표적이다. 16.5% 세액공제를 적용하면 최대 148만5000원, 13.2%를 적용하면 최대 118만8000원의 세금 부담을 줄일 수 있다. IRP는 법정 사유가 아니면 중도인출이 제한되고 위험자산 투자한도가 적립금의 70%이며, 정부는 이 한도를 단계적으로 완화하는 방안을 추진하기로 했다. ISA 만기자금을 60일 안에 연금계좌로 옮기면 이전금액의 10%, 최대 300만원까지 세액공제 한도가 추가된다.", "category": "가입자·사회", "importance": 1, "source": "뉴스웍스", "published": "2026-11-07", "url": "https://www.newsworks.co.kr/news/articleView.html?idxno=902176"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-10-31 ~ 2026-11-06", "generated_at": "2026-11-07T18:31:04+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "fd9e49abb205", "title": "한국투자증권, 퇴직연금 운용의 우위를 실증하다... 3년간 수익률 100% 돌파", "summary": "고용노동부의 9월 말 기준 공시에서 한국투자증권 디폴트옵션 적극투자형 BF1의 3년 누적 수익률이 100.97%로 전체 퇴직연금사업자 포트폴리오 가운데 가장 높았다. 이는 적극투자형 평균 57.58%를 43.39%포인트 웃돌며, 업권별 평균은 증권 61.45%, 은행 55.76%, 보험 55.03%였다. 핵심 전략은 한국투자신탁운용과 협업한 MySuper 알아서 성장형 펀드로 글로벌 우량주와 부동산·인프라·물가연동채권 등 대체자산에 분산투자한다. 3분기 말 DC·IRP 합산 적립금은 18조5160억원으로 지난해 말보다 5조7292억원(44.8%) 늘었다.", "category": "업계·경쟁사", "importance": 4, "source": "리버티코리아포스트", "published": "2026-11-05", "url": "http://www.lkp.news/news/articleView.html?idxno=85780", "related": [{"title": "한투증권, 디폴트옵션 3년 누적 수익률 100.97%…전 사업자 1위", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261104_0003853884"}, {"title": "퇴직연금 3년 새 '두 배' 불렸다…한국투자증권, 디폴트옵션 수익률 전체 1위 달성", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "545a1b2bec51", "title": "기금형 연금 도입에…금융지주 계열사 합종연횡 채비", "summary": "기금형 퇴직연금 추진이 공식화되면서 주요 금융지주들이 은행을 중심으로 계열사를 동원한 수탁법인 컨소시엄 설립 준비에 돌입했다. 고용노동부는 오는 6일 주요 은행장들을 소집해 기금형 퇴직연금 간담회를 열며, 법 개정 과정에서 금융지주 자회사 공동출자를 허용하는 예외를 마련할 계획이다. NH농협금융은 퇴직연금 제도 개편 대응 TF를, KB금융과 우리금융은 계열사 워킹그룹을 운영하고 있으며 신한금융도 정식 TF를 발족할 예정이다. 5대 금융지주 DC·IRP 적립액은 174조1435억원으로 작년말 대비 15.5% 늘었고, 증권 계열사 비중은 11.2%에서 13.2%로 상승했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-11-03", "url": "https://www.mt.co.kr/finance/2026/11/03/2026110216011686926", "related": [{"title": "기금형 퇴직연금 도입 초읽기… 원팀 꾸리는 금융지주 계열사", "source": "머니투데이", "url": "https://www.mt.co.kr/finance/2026/11/04/2026110319393765961"}]}, {"id": "76a2423a270f", "title": "[N2 포커스] 키움증권, 리테일서 다진 신뢰로 승부…발행어음·연금·IB 성장 가속", "summary": "키움증권 퇴직연금 사업은 지난 6월 출범 후 약 5개월 만에 적립금 2000억원을 돌파했다. 개인형퇴직연금(IRP) 적립금의 약 75%는 다른 금융회사에서 이전한 자금이다. 키움증권은 ETF 중심의 운용 편의성을 경쟁력으로 내세우고, 전문상담 인력과 세무·노무·계리 전문가로 구성된 연금컨설팅 조직을 운영하고 있다. 3분기 말 고객계좌 수는 1820만개, 발행어음 잔액은 2조2000억원이다.", "category": "업계·경쟁사", "importance": 4, "source": "뉴스투데이", "published": "2026-11-05", "url": "https://www.news2day.co.kr/article/20261105500004", "related": []}, {"id": "38d9da68ee5b", "title": "신한, '은행→증권' 퇴직연금 소개 1년새 2.3배···비결은 협업", "summary": "신한은행이 신한투자증권에 소개한 퇴직연금 규모가 올해 상반기 488억6,000만 원으로 전년 동기(209억9,000만 원)보다 2.3배 늘었고, 개인 고객 소개 건수도 69건에서 180건으로 늘었다. 2024년 10월 실물이전제도 시행 이후 올 6월 말까지 옮겨간 퇴직연금 15조9,000억 원 중 5조2,000억 원이 은행에서 증권사로 이동했다. 신한은행은 3분기 말 IRP 적립금 22조8,540억 원으로 1위이고, 신한투자증권의 퇴직연금 적립금은 8조3,317억 원으로 전년 동기보다 31.8% 늘었다. 신한은행은 외부 연금 자금 유치와 은행·증권 간 고객 소개를 영업점 평가에 반영했고, 신한투자증권은 6월 퇴직연금 이·수관 전담팀을 신설했다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌E", "published": "2026-11-05", "url": "https://www.globale.co.kr/news/articleView.html?idxno=41428", "related": []}, {"id": "426d2945e793", "title": "디폴트옵션 성과평가 강화 앞두고…삼성·NH 수익률, 미래에셋 적립금 선두", "summary": "고용노동부의 2026년 3분기 디폴트옵션 비교공시에서 증권사 15곳 116개 상품을 분석한 결과, 최근 1년 수익률은 적극투자형에서 삼성증권(23.12%), 중립투자형에서 NH투자증권(13.82%)이 가장 높았다. 안정투자형은 iM·우리·유안타증권이 17.74%로 공동 선두였고, 3년 누적 기준으로는 한국투자증권 적극투자형BF1이 100.97%로 전체 사업자 1위였다. 증권사 디폴트옵션 적립금 3조6319억원 가운데 미래에셋(1조2798억원)·삼성(8584억원)·한국투자(6183억원) 3사가 75.9%를 차지했다. 정부는 10월 29일 퇴직연금 기능강화 방안에서 디폴트옵션을 수익률·위험조정성과 중심으로 재편하고 성과평가에 따른 가입중지·퇴출 불이익을 검토하겠다고 밝혔다.", "category": "업계·경쟁사", "importance": 4, "source": "더밸류뉴스", "published": "2026-11-05", "url": "http://www.thevaluenews.co.kr/news/view.php?idx=202994", "related": []}, {"id": "98d2dff428ae", "title": "퇴직연금 의무화 부담론에 정부 \"기존 퇴직금 소급 적립 안 해\"", "summary": "정부는 30일 퇴직급여 사외적립 의무화와 관련해 의무화 이전 계속근로기간에 발생한 퇴직급여는 소급해 사외적립하도록 하지 않는다고 밝혔다. 퇴직연금 도입 의무는 2028년 100인 이상, 2029년 10~99인, 2030년 10인 미만 사업장 순으로 단계 적용한다. 2027년 예산안에는 조기 도입 사업장 적립금 매칭 지원 60억원과 경영자금 융자 비용 보전 62억원 등 122억원이 신규 편성됐다. 지난해 말 기준 퇴직금 체불액은 8229억원으로 전체 임금체불의 41.1%를 차지했다.", "category": "제도·규제", "importance": 4, "source": "아시아경제", "published": "2026-10-31", "url": "https://view.asiae.co.kr/article/2026103109010051414", "related": []}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "52bb3ea27011", "title": "국민연금 10년 부은 평균소득자, 기초연금보다 덜 받는다…‘급여 역전’", "summary": "국민연금연구원 김형수 부연구위원의 보고서에 따르면 소득대체율 43%를 적용할 때 평균소득자가 최소가입기간 10년을 채운 월 연금액은 A값의 10.75%로, 올해 기초연금 기준연금액(A값의 약 10.95%)보다 낮다. 올해 A값 319만3511원을 넣으면 국민연금은 월 약 34만3300원으로 기준연금액 34만9700원보다 6400원가량 적다. 보고서는 국민연금 최소가입기간을 상향하거나 기초연금 기준연금액 수준을 조정하는 방향이 필요하다고 제시했다. 최소가입기간을 15년으로 높여도 59세 말 기준 미달 비율은 1.6%로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-11-04", "url": "https://www.segye.com/newsView/20261103517557", "related": [{"title": "국민연금 10년 부었는데 기초연금보다 적다…월 6400원 역전", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=500742"}]}, {"id": "36e305fb0614", "title": "\"노후자금인데 어쩌라고\"…수익률 1등 믿었다가 '날벼락'", "summary": "퇴직연금 상품으로 주목받은 반도체 채권혼합형 ETF가 10월 급락장에서 손실을 냈다. 한국퇴직연금데이터(글라이드리서치)에 따르면 한화자산운용의 'PLUS SK하이닉스샌디스크채권혼합50'은 10월 한 달간 7.40% 손실로, 한 달 전 위험자산 한도 비적용 ETF 225개 중 수익률 1위에서 꼴찌로 내려앉았다. 감독규정상 채권 비중 50% 이상 ETF는 위험자산에서 제외돼, 주식형 70%에 채권혼합형 30%를 더하면 계좌 내 주식 비중이 85%까지 올라간다. 국내 주식 패시브 ETF 평균 수익률이 12.69% 손실을 기록한 가운데 남은 30%를 순수 채권형 ETF로 채운 투자자는 수익을 냈다.", "category": "운용·상품", "importance": 3, "source": "한국경제", "published": "2026-11-06", "url": "https://www.hankyung.com/article/2026110591271", "related": []}, {"id": "cbdad95ef7a7", "title": "같이 은퇴하는 데 옆자리 부장은 왜 훨씬 많이 받을까?", "summary": "에프앤가이드에 따르면 설정액 10억원 이상 TDF 711개 중 697개(98.0%)가 최근 1개월 마이너스 수익률을 기록했다. 같은 2050 빈티지에서도 'BNK든든한적격TDF2050'은 0.65% 오른 반면 'KB코리아포커스적격TDF2050'은 14.71% 하락해 격차가 15.36%포인트에 달했다. 한국퇴직연금데이터 분석에서 동일 빈티지 내 상·하위 격차는 2025 빈티지 2.26%포인트에서 2050 빈티지 10.47%포인트로 상위 빈티지일수록 컸다. 지난달 환헤지 TDF가 환노출 상품을 평균 0.75%포인트 앞섰다.", "category": "운용·상품", "importance": 3, "source": "아시아경제", "published": "2026-11-06", "url": "https://view.asiae.co.kr/article/2026110516203088950", "related": []}, {"id": "a83440f5abff", "title": "“예금으로 노후 준비가 됩니까”...은퇴 한참 남은 2030도 이 펀드로 몰린다", "summary": "에프앤가이드에 따르면 3일 기준 국내 TDF 공모펀드(ETF 포함) 설정액은 19조6881억원으로 연초 이후 4조1710억원 늘었다. 상품 수는 239개로 늘었고, 연초 이후 설정액 증가 상위 10개 TDF 가운데 8개가 2050년 이후를 목표로 한 고빈티지 상품이었다. 설정액이 가장 많이 늘어난 상품은 마이다스기본적격TDF2050(2107억원)이다. 전체 TDF의 연초 이후 평균 수익률은 3.19%, 3년 누적 평균 수익률은 42.65%로 집계됐다.", "category": "운용·상품", "importance": 3, "source": "매일경제", "published": "2026-11-06", "url": "https://www.mk.co.kr/article/12199679", "related": []}, {"id": "8c2aaf9ae10b", "title": "자동투자부터 맞춤 상담까지…은행권 퇴직연금 경쟁 '속도'", "summary": "기업은행은 지난달 30일 퇴직연금 계좌의 대기자금으로 펀드·ETF를 정기 자동매수하는 '퇴직연금 자동모으기'를 출시했다. 하나은행은 'MP 구독서비스'에 지난달 말 ETF 포트폴리오를 추가했고, 신한은행은 이달 WM 전문가와 세무사가 방문하는 '찾아가는 1대1 맞춤형 연금컨설팅'을 시작했다. 금감원 통합연금포털 기준 9월 말 은행권 DC형의 원리금비보장형 비중은 32.6%로 지난해 말(22.0%)보다 10.6%포인트 올랐다. 같은 기간 IRP의 원리금비보장형 비중도 35.0%에서 44.5%로 높아졌다.", "category": "업계·경쟁사", "importance": 3, "source": "뉴스드림", "published": "2026-11-06", "url": "http://www.newsdream.kr/news/articleView.html?idxno=121579", "related": []}, {"id": "62c1b51eca30", "title": "연봉 7억인데 일 안하는 은행연합회장, 차라리 정치인에게?", "summary": "지난달 29일 발표된 정부의 '퇴직연금 기능강화안'에 증권업계 숙원인 발행어음·IMA의 퇴직연금 투자 허용이 전격 반영됐다. 반면 은행권이 요구해 온 퇴직연금 계좌의 ETF 실시간 거래는 반영되지 않았고, 금융위는 2021년 7월 이를 불허한 바 있다. 은행들은 퇴직연금 예금 수요마저 증권사에 뺏길 것을 우려하며 은행연합회의 대응을 비판하고 있다. 그 사이 퇴직연금 ETF 시장은 9조원 규모에서 100조원대로 성장했다.", "category": "업계·경쟁사", "importance": 3, "source": "인베스트조선 (유료)", "published": "2026-11-06", "url": "https://www.investchosun.com/site/data/html_dir/2026/11/06/2026110680001.html", "related": []}, {"id": "6aef7ff7e570", "title": "[K증권名家] 신한투자증권···묵묵히 쌓아온 협업, 예견된 성적표", "summary": "올해 상반기 신한투자증권이 신한은행에서 소개받은 퇴직연금 실적은 488억 원으로 작년 동기 210억 원의 두 배를 넘겼고, 적립금은 8조6,000억 원을 넘겼다. 신한금융은 2002년 국내 최초 금융네트워크계좌(FNA)를 만들어 은행 영업망을 증권 고객 확보에 활용해 왔고, 올해부터 소개실적을 핵심성과지표(KPI)에 반영했다. 올해 1분기 DC형 원리금비보장 상품의 1년 수익률은 27.17%로 1위를 기록했고, IRP 원리금비보장 상품도 3년·5년 연평균 수익률이 2분기 연속 1위에 올랐다. 중립투자형 디폴트옵션(2호)은 올해 1분기 3년 누적수익률 1위를 달성했다.", "category": "업계·경쟁사", "importance": 3, "source": "글로벌E", "published": "2026-11-06", "url": "https://www.globale.co.kr/news/articleView.html?idxno=41458", "related": []}, {"id": "128fcf314ecf", "title": "현대차증권, 퇴직연금 ALM 시스템 구축…“중소·중견기업 컨설팅 확대”", "summary": "현대차증권이 확정급여형(DB) 퇴직연금 가입 기업을 위한 ALM(자산부채연계관리) 시스템을 도입했다. 시스템은 퇴직부채 증감효과 분석, 미래 인구 분포 예측, 유동성 분석, 적립부족 예측 등 4가지 기능으로 구성된다. 고용노동부가 DB형 사업장의 적립부족 해소 의무 이행 관리를 강화하면서 미래 적립비율을 예측해 선제 대응을 돕는다는 취지다. 분석 시간이 대폭 단축돼 그동안 대기업 중심이던 서비스를 중소·중견기업까지 넓힐 방침이다.", "category": "법인·자금운용", "importance": 3, "source": "더퍼블릭", "published": "2026-11-06", "url": "https://www.thepublic.kr/news/articleView.html?idxno=325360", "related": []}, {"id": "d54093331a24", "title": "“노후자금까지 주식에 넣었는데”...코스피 급락하자 다시 예금으로", "summary": "매일경제가 금융감독원 퇴직연금사업자 비교공시를 분석한 결과, 3분기 DC·IRP 적립금 중 원리금비보장 상품 비중이 50.7%로 2분기보다 2.3%포인트 낮아져 11분기 만에 처음 감소했다. 3분기 DC·IRP 적립금 320조8444억원 가운데 원리금비보장 상품은 162조5641억원으로 석 달 새 11조9895억원 줄었고, 원리금보장 상품은 3조1392억원 늘었다. 적립금이 있는 사업자 41곳 중 38곳에서 비보장 비중이 낮아졌으며, 업권별 감소폭은 은행 2.4%포인트, 증권사 2.1%포인트, 보험사 1.8%포인트였다. 원리금비보장 상품의 최근 1년 평균 수익률은 2분기 50.63%에서 3분기 15.95%로 급락해 원리금보장 상품(2.61%)과의 격차가 13.34%포인트로 좁혀졌다.", "category": "운용·상품", "importance": 3, "source": "매일경제", "published": "2026-11-06", "url": "https://www.mk.co.kr/article/12200227", "related": []}, {"id": "b1bea1beaf5d", "title": "보험업계, 퇴직연금 제도 개편 앞두고 분주…운용역량 강화 속도", "summary": "정부가 지난달 29일 기금형 퇴직연금 도입과 퇴직급여 사외적립 의무화 등을 담은 '퇴직연금 기능강화 방안'을 발표하면서 보험업계가 운용역량 강화에 나서고 있다. 한화생명·한화손해보험·한화투자증권·한화자산운용은 지난달 30일 '퇴직연금 2030+ 비전 선포식'을 열고 기금형 퇴직연금 모델 방향과 WTW와의 협업 사례를 공유했다. 교보생명은 교보악사자산운용 잔여 지분 50%를 인수해 교보자산운용으로 사명을 바꾸고 ETF와 퇴직연금 상품을 핵심 사업으로 육성할 계획이다. 삼성생명은 DC·IRP 전담 영업부를 신설하고 지난 8월부터 모든 IRP 계좌의 운용관리·자산관리 수수료를 면제하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "민주신문", "published": "2026-11-06", "url": "http://www.iminju.net/news/articleView.html?idxno=171864", "related": []}, {"id": "0e0bd49c559e", "title": "경쟁자는 싫다?… 금융권·국민연금 550조 퇴직연금 쟁탈전", "summary": "정부는 지난달 29일 '퇴직연금 기능 강화 방안'에서 세 가지 기금형 모델을 제시했지만 국민연금의 참여 방식과 범위는 확정하지 않고 국회 입법 과정에서 추가 논의하기로 했다. 은행·증권·보험업계는 국민연금 진입이 공정경쟁을 훼손한다며 반발하고 있고, 4개 협회는 2024년 10월에도 반대 의견서를 낸 바 있다. 9월 말 퇴직연금 적립금은 약 542조원으로 은행권이 275조5000억원(50.8%)을 차지한다. 정부는 이달 중 근로자퇴직급여보장법 개정안을 마련해 연내 국회 통과를 추진할 방침이다.", "category": "제도·규제", "importance": 3, "source": "국민일보", "published": "2026-11-05", "url": "https://www.kmib.co.kr/article/20261104502348", "related": []}, {"id": "a5b9188a93db", "title": "'노사정 합의' 했다지만… 퇴직연금 개편, 가입자 의견은 어디로", "summary": "정부의 퇴직연금 기능강화 방안은 계약형과 기금형을 병행하는 것이 골자이며, DC와 IRP에 기금형을 적용하고 한 사업장에서 두 방식을 함께 운영할 수 있게 했다. 정부는 노사정 TF가 2월 6일 발표한 공동선언을 개편의 정당성으로 내세우지만, 의견수렴은 금융업권과 사업장 중심이었다는 지적이 나온다. 기금형의 수익과 손실은 가입자에게 귀속되므로 수탁법인의 전문성·독립성·내부통제를 엄격히 검증해야 한다는 주장이 제기된다. 성주호 경희대 교수는 전문성을 갖춘 10곳 안팎의 기관을 선별하고 인가 기준을 엄격하게 해야 한다고 말했다.", "category": "제도·규제", "importance": 3, "source": "국민일보", "published": "2026-11-05", "url": "https://www.kmib.co.kr/article/20261104502346", "related": []}, {"id": "cb77d219044e", "title": "“1등보다 꾸준한 상위권”…기관 EMP 10년 내공으로 TDF 판 흔든다", "summary": "하나자산운용이 2024년 9월 출시한 '하나더넥스트TDF'는 설정 2주년인 올해 9월 말에도 6개 빈티지 모두 동일 유형 수익률 1~3위를 유지했다. 김태우 대표는 TDF 수탁고가 4000억 원 규모로 커졌고 라인업을 OCIO와 기금형 자산배분 펀드로 넓혔으며, 하나은행·하나증권 디폴트옵션에 TDF와 OCIO 등 4개 상품이 편입됐다고 밝혔다. 경쟁력의 바탕은 ETF로 분산투자하는 EMP 운용 역량으로, 해외주식형 EMP 수탁고는 약 1조5000억 원에서 약 3조7000억 원으로 늘었다. 공적기금·공제회·보험사 등 12개 기관 자금을 운용하며 올해에만 1조 원 이상이 새로 유입됐다.", "category": "업계·경쟁사", "importance": 3, "source": "한경머니", "published": "2026-11-05", "url": "https://magazine.hankyung.com/money/article/202610191811c", "related": []}]}, "monthly": {"period": "monthly", "key": "current", "label": "2026-10-07 ~ 2026-11-06", "generated_at": "2026-11-07T18:31:12+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "829c3e49cc3f", "title": "흔들린 증시에 퇴직연금 적립금 6년여 만에 감소", "summary": "3분기 말 퇴직연금 적립금이 542조1214억원으로 전 분기보다 2.1% 줄었다. 코로나19 초기인 2020년 1분기 이후 6년여 만의 감소다. 업권별로는 증권 160조2935억원(2.9% 감소), 은행 275조4860억원(2.1% 감소), 보험 106조3419억원(0.9% 감소)이다. 실적배당형이 185조2078억원으로 6.3% 줄어든 반면 원리금보장형은 356조9051억원으로 0.2% 늘었다.", "category": "운용·상품", "importance": 5, "source": "머니투데이", "published": "2026-10-20", "url": "https://www.mt.co.kr/stock/2026/10/21/2026102016164749417", "related": [{"title": "3분기 퇴직연금 적립금 542조… 증시 조정 속 보험·은행 동반 감소", "source": "한국보험신문", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=93459"}, {"title": "\"노후자금 넣었는데\"…퇴직연금 12조 줄자 직장인들 '울상'", "source": "한국경제", "url": "https://www.hankyung.com/article/2026102167161"}, {"title": "5대 은행 퇴직연금 5조원 증발…7년 만에 첫 감소세", "source": "컨슈머타임스", "url": "https://www.cstimes.com/news/articleView.html?idxno=724898"}, {"title": "증시 시름에… 퇴직연금도 휘청", "source": "머니투데이", "url": "https://www.mt.co.kr/stock/2026/10/21/2026102019471522048"}, {"title": "증시 '휘청'에…5대銀 퇴직연금 적립금 7년 만에 첫 감소", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4440263"}]}, {"id": "0dbdadec9016", "title": "[비바100] 퇴직연금에 담는 개인투자용 국채…금리보다 만기부터 따져라", "summary": "지난 9월부터 확정기여형(DC)·개인형퇴직연금(IRP) 계좌에서도 개인투자용 국채 10년물과 20년물을 청약할 수 있게 됐다. NH투자증권 100세시대연구소는 보고서에서 노후자금 사용 시점에 맞춰 만기를 분산하는 활용법을 제시했다. 2026년 9월 발행분 적용금리는 만기보유 시 10년물 연 4.765%, 20년물 연 4.920%이며, 100만원 투자 시 세전 수령액은 각각 약 159만3000원, 약 261만3000원이다. 퇴직연금에서 매입한 국채는 분리과세 대신 연금계좌 세제를 적용받고, 중도 환매 시 복리 혜택이 축소된다.", "category": "운용·상품", "importance": 3, "source": "브릿지경제", "published": "2026-10-15", "url": "https://www.viva100.com/article/20261013500585", "related": [{"title": "퇴직연금 들어온 개인투자용 국채…금리보다 먼저 볼 '만기'", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2633616"}, {"title": "1000만원 넣으면 10년 뒤 1597만원…국채 사볼까", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311873"}, {"title": "'20년 묻어두면 2.6배'…개인투자용 국채에 2.4조 몰렸다", "source": "테크M", "url": "https://www.techm.kr/news/articleView.html?idxno=155929"}, {"title": "미래에셋증권, 개인투자용 국채 10년물 확대..퇴직연금 청약 두 달째", "source": "포쓰저널", "url": "http://www.4th.kr/news/articleView.html?idxno=2119412"}]}, {"id": "b7e8a161b6af", "title": "2028년부터 퇴직급여 사외적립 의무화… 체불 막는다", "summary": "근로자의 퇴직금 체불을 막기 위해 내후년부터 100인 이상 사업장을 대상으로 퇴직급여 사외 적립을 단계적으로 의무화하는 방안이 추진된다. 이형일 부총리 겸 재정경제부 장관과 배경훈 부총리 겸 과학기술정보통신부 장관은 28일 경제관계장관회의·과학기술관계장관회의 첫 연석회의에서 이 방안을 논의했으며, 기금형 퇴직연금의 구체적 도입 방안도 마련해 전문적인 자산 운용과 엄격한 수탁자 책임을 부과하기로 했다. 퇴직연금 사업자 평가 기준은 연금 성과 수익률 중심으로 개편하고, 디폴트옵션 적용 예정 통보 시점은 만기 후 4주에서 만기 전 2주로 앞당긴다. 구체적인 퇴직연금 기능 강화 방안은 29일 국회 기후에너지환경노동위원회 여당 위원과의 당정협의를 거쳐 발표된다.", "category": "제도·규제", "importance": 5, "source": "서울신문", "published": "2026-10-29", "url": "https://www.seoul.co.kr/news/economy/2026/10/29/20261029031004", "related": [{"title": "당정 \"2030년 전 사업장 퇴직금 사외적립 의무화…120억 재정지원\"", "source": "이데일리", "url": "https://www.edaily.co.kr/News/Read?newsId=03250486645617840&mediaCodeNo=257"}, {"title": "540조 퇴직연금 대수술… ‘기금형’ 전면 도입한다", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936461/2"}, {"ti 독원 퇴직연금 비교공시에 따르면 3분기말 삼성생명의 퇴직연금 적립금은 57조5486억원으로 전분기보다 1523억원 늘어, 1조6636억원 줄어든 신한은행(57조2252억원)을 3234억원 차이로 앞서 1·2분기에 내준 선두 자리를 되찾았다. 삼성생명은 DB형 적립금 43조9970억원 중 원리금보장형이 35조원 수준이어서 증시 하락기에 적립금을 방어했고, 계열사 DB형 7074억원·DC형 461억원 증가도 영향을 미쳤다. 반면 국민은행 1조2587억원, 하나은행 1조107억원, 미래에셋증권 2조1176억원 등 주요 사업자의 적립금은 일제히 줄었다. 기사는 3분기 코스피가 19% 넘게 하락하며 실적배당형 상품 평가액이 감소한 영향으로 분석했다.", "category": "업계·경쟁사", "importance": 4, "source": "아시아타임즈", "published": "2026-10-25", "url": "https://www.asiatime.co.kr/article/20261020500369", "related": [{"title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "source": "세이프타임즈", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652"}, {"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "f14fcbcde9b5", "title": "550조 퇴직연금 판 흔든다…국민연금 참여 '기금형 퇴직연금' 법안 발의", "summary": "더불어민주당 이용우 의원이 공동발의 12인과 함께 10월 2일 근로자퇴직급여 보장법 일부개정법률안을 발의했다. 개정안은 국민연금공단 등 공적연금관리기관이 기금형 퇴직연금 사업에 참여할 수 있도록 하고, 시장점유율 상한을 3년차 10%, 4년차 20%, 5년차 30%로 두었다. 2025년 말 퇴직연금 적립금은 501조4000억원이고 2024년 수익률은 4.77%로 같은 해 국민연금 수익률 15.0%를 밑돌았으며, 수수료는 2018년 8956억원에서 2025년 1조7748억원으로 98% 늘었다. 중소기업퇴직연금기금 가입 대상은 현재 100명 미만에서 2028년까지 300명 이하로 확대되고, 법안은 공포 후 1년이 지나 본격 시행된다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-10-07", "url": "http://www.globalepic.co.kr/view.php?ud=2026100708100769037cc35ccc5c_29", "related": [{"title": "'기금형 퇴직연금' 정기국회 논의 본격화 할 듯", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237123"}, {"title": "\"저조한 수익률, 높은 수수료\" 구조인 현행 계약형 퇴직연금 보완하는 기금형 퇴직연금 병행도입 필요", "source": "핀포인트뉴스", "url": "https://www.pinpointnews.co.kr/news/articleView.html?idxno=493587"}]}, {"id": "545a1b2bec51", "title": "기금형 연금 도입에…금융지주 계열사 합종연횡 채비", "summary": "기금형 퇴직연금 추진이 공식화되면서 주요 금융지주들이 은행을 중심으로 계열사를 동원한 수탁법인 컨소시엄 설립 준비에 돌입했다. 고용노동부는 오는 6일 주요 은행장들을 소집해 기금형 퇴직연금 간담회를 열며, 법 개정 과정에서 금융지주 자회사 공동출자를 허용하는 예외를 마련할 계획이다. NH농협금융은 퇴직연금 제도 개편 대응 TF를, KB금융과 우리금융은 계열사 워킹그룹을 운영하고 있으며 신한금융도 정식 TF를 발족할 예정이다. 5대 금융지주 DC·IRP 적립액은 174조1435억원으로 작년말 대비 15.5% 늘었고, 증권 계열사 비중은 11.2%에서 13.2%로 상승했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-11-03", "url": "https://www.mt.co.kr/finance/2026/11/03/2026110216011686926", "related": [{"title": "기금형 퇴직연금 도입 초읽기… 원팀 꾸리는 금융지주 계열사", "source": "머니투데이", "url": "https://www.mt.co.kr/finance/2026/11/04/2026110319393765961"}]}, {"id": "113078a9f394", "title": "퇴직연금 ‘100% 투자 가능’의 함정…원금까지 보장하진 않아", "summary": "금융감독원은 내년 1월부터 퇴직연금 매매화면과 상품검색 화면에 투자한도와 위험등급을 함께 표시하도록 개선한다고 27일 밝혔으며, 상품제안서와 적립금운용현황보고서에도 위험등급을 병기한다. 일부 사업자가 원금손실 가능성이 있는 상품도 '투자한도 100%'로만 안내해 가입자가 원리금보장형으로 오인할 수 있다는 판단에서다. 올해 상반기 말 퇴직연금 적립금 558조3000억원 가운데 실적배당형은 198조원이고, 이 중 ETF 투자 규모는 99조8000억원으로 50.4%를 차지했다. 일부 사업자는 전산개발 일정에 따라 내년 상반기 중 시행한다.", "category": "제도·규제", "importance": 4, "source": "메트로신문", "published": "2026-10-27", "url": "https://www.metroseoul.co.kr/article/20261027500104", "related": [{"title": "“퇴직연금 다 날릴 수도”…ETF 투자한도 100%의 함정 [잇슈 머니]", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8699397&ref=A"}]}, {"id": "ad939b3f2b2a", "title": "공공기관 5곳 중 1곳, 퇴직연금 법정 기준 미달…최저 39%", "summary": "올해 8월 기준 DB형 퇴직연금을 도입한 공공기관 214곳 중 46곳(21.5%)의 적립률이 법정 최저 기준인 100%에 미달했다. 태권도진흥재단이 39.17%로 가장 낮았고 분당서울대병원 43.61%, 한국교통안전공단 46.35%, 한국도로교통공단 49.57%로 법정 기준의 절반에도 못 미쳤다. 근로자퇴직급여 보장법상 적립률이 95% 미만이면 사업주는 다음 회계연도까지 부족분의 3분의 1 이상을 메워야 하며, 이를 방치하면 최대 1천만원의 과태료가 부과될 수 있다. 김위상 의원은 공공기관이 체계적인 적립 계획을 조속히 마련해야 한다고 강조했다.", "category": "법인·자금운용", "importance": 4, "source": "연합뉴스", "published": "2026-10-12", "url": "https://www.yna.co.kr/view/AKR20261012029400530", "related": [{"title": "공공기관 5곳 중 1곳, 퇴직연금 적립금 법정 기준 못 채웠다", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10912175?ref=naver"}]}, {"id": "0369d6c3118c", "title": "퇴직연금 223조원 쌓인 5대은행…국민·하나 2위 각축전", "summary": "5대 시중은행의 3분기 말 퇴직연금 적립금은 222조9427억원으로 집계됐다. 신한은행이 57조2252억원으로 1위이고 KB국민은행 52조2226억원, 하나은행 52조1554억원, 우리은행 33조243억원, NH농협은행 28조3152억원 순이다. KB국민은행과 하나은행의 격차는 672억원으로, 2분기 말 3152억원에서 크게 좁혀져 지난해 말 725억원 수준으로 돌아왔다. 올해 누적 증가액은 하나은행 3조7741억원, KB국민은행 3조7688억원으로 53억원 차이다.", "category": "업계·경쟁사", "importance": 4, "source": "이데일리", "published": "2026-10-19", "url": "https://www.edaily.co.kr/News/Read?newsId=03496486645614560&mediaCodeNo=257", "related": [{"title": "퇴직연금 2위 경쟁 격화…하나은행·국민은행 적립금 격차 672억원", "source": "CEO스코어데일리", "url": "https://www.ceoscoredaily.com/page/view/2026102015471625110"}]}, {"id": "6c986a5b1bb4", "title": "한국투자증권, 기업 대상 ‘퇴직연금 아카데미’ 개최…제도 변화 대응 전략 제시", "summary": "한국투자증권은 지난 8일 서울 여의도 TP타워에서 기업 인사·재무 담당자 등 퇴직연금 실무자를 대상으로 ‘퇴직연금 아카데미’를 개최했다. 행사는 근로 7", "related": [{"title": "3분기 퇴직연금 적립금 542조… 증시 조정 속 보험·은행 동반 감소", "source": "한국보험신문", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=93459"}, {"title": "\"노후자금 넣었는데\"…퇴직연금 12조 줄자 직장인들 '울상'", "source": "한국경제", "url": "https://www.hankyung.com/article/2026102167161"}, {"title": "5대 은행 퇴직연금 5조원 증발…7년 만에 첫 감소세", "source": "컨슈머타임스", "url": "https://www.cstimes.com/news/articleView.html?idxno=724898"}, {"title": "증시 시름에… 퇴직연금도 휘청", "source": "머니투데이", "url": "https://www.mt.co.kr/stock/2026/10/21/2026102019471522048"}, {"title": "증시 '휘청'에…5대銀 퇴직연금 적립금 7년 만에 첫 감소", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4440263"}]}, {"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "268f8567f095", "title": "연금제도 개혁 정책 토론회 개최", "summary": "국회 연금개혁특별위원회 위원장인 국민의힘 윤영석 의원이 주최한 연금제도 개혁 정책 토론회가 28일 열렸다. 토론회에서는 기금 운용을 정치와 분리할 필요가 있다는 지적과 함께 공적연금에 초과세수 등 재정을 투입할 수 있도록 법을 개정해야 한다는 의견이 제기됐다. 퇴직연금과 관련해서는 일시금 수령을 제한하는 방안과 중 leView.html?idxno=4441777"}, {"title": "\"퇴직금 못 받는 일 줄인다\", 사외적립 전 사업장 확대 추진", "source": "데일리환경", "url": "https://www.dailyt.co.kr/newsView/dlt202611040003"}, {"title": "기업 퇴직연금 모아 전문기관이 굴려… ‘쥐꼬리 수익’ 개선 기대", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20261030/134936451/2"}, {"title": "국민연금, 기금형 퇴직연금 참여 미정···‘시장 개입 우려’에 국회로 공 넘긴 정부", "source": "경향신문", "url": "https://www.khan.co.kr/article/202610300600041"}, {"title": "[퇴직연금 개편] 퇴직연금도 국민연금처럼…정부, 장기 연금 수령 유도 방안 발표", "source": "CBC뉴스", "url": "https://www.cbci.co.kr/news/articleView.html?idxno=620807"}, {"title": "퇴직연금 사외적립 2030년까지 전 사업장 의무화", "source": "매일노동뉴스", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237470"}, {"title": "당정, ‘퇴직연금 강화·고용부 예산’ 살핀다…초광역특구법 논의 가능성", "source": "디지털타임스", "url": "https://www.dt.co.kr/article/12091950"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "fd9e49abb205", "title": "한국투자증권, 퇴직연금 운용의 우위를 실증하다... 3년간 수익률 100% 돌파", "summary": "고용노동부의 9월 말 기준 공시에서 한국투자증권 디폴트옵션 적극투자형 BF1의 3년 누적 수익률이 100.97%로 전체 퇴직연금사업자 포트폴리오 가운데 가장 높았다. 이는 적극투자형 평균 57.58%를 43.39%포인트 웃돌며, 업권별 평균은 증권 61.45%, 은행 55.76%, 보험 55.03%였다. 핵심 전략은 한국투자신탁운용과 협업한 MySuper 알아서 성장형 펀드로 글로벌 우량주와 부동산·인프라·물가연동채권 등 대체자산에 분산투자한다. 3분기 말 DC·IRP 합산 적립금은 18조5160억원으로 지난해 말보다 5조7292억원(44.8%) 늘었다.", "category": "업계·경쟁사", "importance": 4, "source": "리버티코리아포스트", "published": "2026-11-05", "url": "http://www.lkp.news/news/articleView.html?idxno=85780", "related": [{"title": "한투증권, 디폴트옵션 3년 누적 수익률 100.97%…전 사업자 1위", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261104_0003853884"}, {"title": "퇴직연금 3년 새 '두 배' 불렸다…한국투자증권, 디폴트옵션 수익률 전체 1위 달성", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2644559"}]}, {"id": "4bbbd1457f44", "title": "퇴직연금 판도 재역전…삼성생명 반년 만에 선두 탈환", "summary": "금융감독원 퇴직연금 비교공시에 따르면 3분기말 삼성생명의 퇴직연금 적립금은 57조5486억원으로 전분기보다 1523억원 늘어, 1조6636억원 줄어든 신한은행(57조2252억원)을 3234억원 차이로 앞서 1·2분기에 내준 선두 자리를 되찾았다. 삼성생명은 DB형 적립금 43조9970억원 중 원리금보장형이 35조원 수준이어서 증시 하락기에 적립금을 방어했고, 계열사 DB형 7074억원·DC형 461억원 증가도 영향을 미쳤다. 반면 국민은행 1조2587억원, 하나은행 1조107억원, 미래에셋증권 2조1176억원 등 주요 사업자의 적립금은 일제히 줄었다. 기사는 3분기 코스피가 19% 넘게 하락하며 실적배당형 상품 평가액이 감소한 영향으로 분석했다.", "category": "업계·경쟁사", "importance": 4, "source": "아시아타임즈", "published": "2026-10-25", "url": "https://www.asiatime.co.kr/article/20261020500369", "related": [{"title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "source": "세이프타임즈", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652"}, {"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "[CP's View] 국민연금, 퇴직연금에 숟가락 얹지 말라", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=202609280851293527cc35ccc5c_29"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "d5a1a79697b6", "title": "사적 연금에 세금 깎아준다더니 건보료 매기나 [이병희의 연금술사]", "summary": "국민건강보험공단이 4일 국회 보건복지위원회 국정감사 자료에서 '미부과(분리과세) 소득에 대한 보험료 부과 추진'을 공식 보고했다. 금융소득·연금소득처럼 분리과세되던 소득에도 건강보험료를 매기는 방안이지만 구체적인 부과 대상과 적용 시기, 소득 기준은 아직 확정되지 않았다. 사적연금은 연간 수령액 1500만원 이하면 나이에 따라 3.3~5.5%만 과세되는데, 건보료가 붙으면 세제 혜택을 사실상 깎는 것 아니냐는 우려가 나온다.", "category": "제도·규제", "importance": 3, "source": "이코노미스트", "published": "2026-11-06", "url": "https://economist.co.kr/article/view/ecn202611050022", "related": [{"title": "1500만원 이하 연금소득에도 건보료 검토…일용소득에도", "source": "TV조선", "url": "https://news.tvchosun.com/site/data/html_dir/2026/11/05/2026110590025.html"}, {"title": "일용근로·사적연금에도 건보료 매기나…분리과세 소득 부과 검토", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10924712?ref=naver"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "545a1b2bec51", "title": "기금형 연금 도입에…금융지주 계열사 합종연횡 채비", "summary": "기금형 퇴직연금 추진이 공식화되면서 주요 금융지주들이 은행을 중심으로 계열사를 동원한 수탁법인 컨소시엄 설립 준비에 돌입했다. 고용노동부는 오는 6일 주요 은행장들을 소집해 기금형 퇴직연금 간담회를 열며, 법 개정 과정에서 금융지주 자회사 공동출자를 허용하는 예외를 마련할 계획이다. NH농협금융은 퇴직연금 제도 개편 대응 TF를, KB금융과 우리금융은 계열사 워킹그룹을 운영하고 있으며 신한금융도 정식 TF를 발족할 예정이다. 5대 금융지주 DC·IRP 적립액은 174조1435억원으로 작년말 대비 15.5% 늘었고, 증권 계열사 비중은 11.2%에서 13.2%로 상승했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-11-03", "url": "https://www.mt.co.kr/finance/2026/11/03/2026110216011686926", "related": [{"title": "기금형 퇴직연금 도입 초읽기… 원팀 꾸리는 금융지주 계열사", "source": "머니투데이", "url": "https://www.mt.co.kr/finance/2026/11/04/2026110319393765961"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로
     그보다 넉넉히 잡아야 매일 아침 헛경보가 뜨지 않는다. */
  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
         + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

  function buildStaleNotice() {
    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
