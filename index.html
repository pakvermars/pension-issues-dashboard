om/news/Economy/article/all/20260921/134712683/2"}, {"id": "c19b8c4da0dd", "title": "\"은퇴 임박한 55세 전후, 현금흐름 만들어야\"[머니 컨설팅]", "summary": "표영대 키움증권 연금플랫폼본부장은 동아일보 인터뷰에서 퇴직연금 운용의 원칙으로 장기·적립식·분산 투자를 제시하고, 일시적인 시장 변동성에 흔들려 상품을 샀다 팔았다 해서는 안 된다고 말했다. 그는 2030세대는 위험자산 한도 70% 안에서 투자성 자산 비중을 높이고, 은퇴가 임박한 55세 전후부터는 배당형·인컴형 상품으로 리밸런싱해 현금 흐름을 만들어야 한다고 조언했다. 디폴트옵션은 사업자별 라인업이 7, 8개에 달해 선택이 어렵다는 지적이 많았으나 최근 3, 4개로 단순화하는 제도 개선이 추진되고 있다고 덧붙였다. 표 본부장은 확정기여형(DC) 가입자가 원하는 사업자를 직접 선택할 수 있도록 선택권을 넓힐 필요가 있다고 지적했다.", "category": "업계·경쟁사", "importance": 3, "source": "동아일보", "published": "2026-09-22", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712523/2"}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595"}, {"id": "454602bdfe7e", "title": "[Invest]\"고액자산가 60%는 기업에\"…'법인 개척'으로 WM-IB 선순환 추구", "summary": "이재열 NH투자증권 WM사업부 대표는 브로커리지 수익성의 한계가 뚜렷해졌다며 기업금융(IB)과 연계한 법인 개척을 돌파구로 제시했다. 10억원 이상 고액자산가가 WM 전체 성과의 60% 이상을 견인하는데 이들이 가장 밀집한 거점이 기업이라는 판단이다. 이 대표는 법인을 개척해야 운용자금과 퇴직연금은 물론 그 뒤에 있는 오너 일가의 개인 자산까지 흡수할 수 있다고 말했다. 반도체·AI, 방산, 조선, 자동차 등 수출 수혜 업종의 우량 1차 협력사와 중견·중소 외감기업을 중심으로 잠재 고객을 확보한다는 전략이다.", "category": "법인·자금운용", "importance": 3, "source": "인베스트조선 (유료)", "published": "2026-09-22", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/21/2026092180117.html"}, {"id": "61618425d12c", "title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "summary": "리얼캐스트가 전한 금융권 단신 가운데 신한은행이 퇴직연금 ETF 당일매매 서비스를 시행한다는 내용이 담겼다. 확정기여형(DC)·개인형퇴직연금(IRP) 고객은 보유 ETF를 매도한 당일 그 대금으로 다른 ETF를 매수할 수 있고, 매도 체결 결과는 최소 2분 최대 10분 내 계좌 잔고에 반영된다. 매도와 매수를 한 흐름으로 잇는 '이어 거래하기' 기능을 은행권 최초로 적용했고, 예금·펀드·TDF와 ETF 간 복합매매도 제공한다. 신한은행의 2026년 2분기 말 퇴직연금 적립금은 58조8888억원으로 전체 사업자 가운데 1위다.", "category": "업계·경쟁사", "importance": 3, "source": "리얼캐스트", "published": "2026-09-22", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"id": "853028981d69", "title": "“믿고 맡길 환경 안 되면 증시로 ‘머니무브’ 없어… 장기 투자할 수 있도록 대안 제대로 만들어야”", "summary": "홍춘욱 프리즘투자자문 대표는 21일 서울 여의도에서 열린 ‘2026 국민금융포럼’ 주제발표에서 투자자가 믿고 맡길 수 있는 환경이 조성되지 않으면 부동산에서 증시로의 머니무브는 없다고 말했다. 그는 국민연금이 증시 급등으로 국내주식 보유비중이 목표를 웃돌았는데도 올해 6월 말까지 리밸런싱을 유예하고 목표비중을 14.9%에서 20.8%로 높인 것을 ‘무너진 외양간’의 사례로 지목했다. 6월 말 기준 1866조원대 기금을 운용하는 국민연금에 정책적 자율권과 독립성을 보장해야 한다고 강조했다. 장기투자를 유도할 방안으로는 3년 이상 주식 보유자에 대한 배당소득세 분리과세와 인센티브를 제시했다.", "category": "운용·상품", "importance": 3, "source": "국민일보", "published": "2026-09-22", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000014162"}, {"id": "3c8f60e0f35c", "title": "“자산 50%는 ‘코어자산’으로 두고 유동성 비중 20%는 지켜라”", "summary": "서유석 금융투자협회 고문은 21일 ‘2026 국민금융포럼’ 주제발표에서 개인투자자 가운데 돈을 버는 사람은 전체의 10%가 되지 않고 20%는 본전, 나머지는 손실을 본다고 말했다. 그는 손실 원인으로 잦은 거래, 행동편향, 정보 비대칭, 자산 단위를 종목으로 보는 착각을 꼽았다. 대안으로 연평균 수익률 8%인 국민연금처럼 투자하라며 전체 자산의 50%를 코어자산으로 두고 주식 55%, 채권 30%, 금·리츠 등 대체자산 15%로 나누라고 조언했다. 나머지 50%는 현금이나 단기채권 ETF로 유지하되 어떤 상승장에서도 유동성 비중 20%는 지켜야 한다고 말했다.", "category": "운용·상품", "importance": 3, "source": "국민일보", "published": "2026-09-22", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000014262"}, {"id": "2972b1f7e66a", "title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "summary": "단일종목 레버리지 ETF 16종이 2026년 5월 27일 상장된 뒤 9월 15일 기준 삼성전자 상품은 -51.91%, SK하이닉스 상품은 -62.34%의 손실을 기록했다. 상장 첫 달 개인투자자 순매수액은 11조3000억원이었다. 2026년 1월 13일 김용범 당시 정책실장이 주재한 비공개 간담회에서 금융투자협회는 국내 퇴직연금 적립금 469조원 가운데 국내 주식 투자 비중이 1.6%에 그친다며 G22 국가 평균 15.4%를 적용하면 64조7000억원이 추가로 들어올 수 있다고 건의했다. 정무위원회는 사태 원인 규명을 위해 증권사·운용사 최고경영자의 국정감사 증인 요청 여부를 검토하고 있다.", "category": "제도·규제", "importance": 3, "source": "딜사이트", "published": "2026-09-22", "url": "https://dealsite.co.kr/articles/169156"}, {"id": "f85624daf3fa", "title": "빈곤층 10명 중 3명 75세 이상…고령화·불안정 노동에 1인가구까지", "summary": "한국보건사회연구원이 21일 발간한 '빈곤 구조의 변화와 정책적 시사점'에 따르면 중위소득 50% 이하 빈곤층에서 65세 이상 고령층 비중은 2016년 35.4%에서 2024년 47.6%로 확대됐고, 75세 이상 후기고령층 비중은 19.7%에서 29.0%로 높아졌다. 같은 기간 75세 이상 후기고령층의 임시·일용근로 비중은 4.7%에서 15.6%로 3배 이상 늘었다. 빈곤층 내 1인가구 비중도 20.5%에서 36.9%로 상승했다. 연구원은 빈곤 노인과 후기고령층을 대상으로 기초연금 급여 수준과 수급 대상의 적절성을 재검토하고 노인일자리 급여를 현실화해야 한다고 제언했다.", "category": "가입자·사회", "importance": 2, "source": "보험매일", "published": "2026-09-22", "url": "http://www.fins.co.kr/news/articleView.html?idxno=110043"}, {"id": "1e999f76d859", "title": "\"부양은 함께, 일은 균형 있게\"…중장년 10년 새 이렇게 달라졌다[Pick코노미]", "summary": "국가데이터처가 21일 사회조사를 활용해 40∼64세 중장년층의 인식 변화를 분석한 결과를 발표했다. 노후를 준비하고 있거나 이미 준비됐다는 응답은 2015년 75.8%에서 2025년 81.9%로 높아졌고, 주된 준비 방법으로 국민연금을 꼽은 비율은 51.7%에서 61.0%로 상승했다. 노후 생활을 위해 필요한 사회의 역할로는 소득 지원이 34.4%로 가장 높았고 의료·요양보호 서비스 30.3%, 노후 취업 지원 25.6%가 뒤를 이었다. 취업자 가운데 실직·이직 불안을 느낀다는 비율은 61.0%에서 55.8%로 낮아졌으나 여전히 절반을 웃돌았다.", "category": "가입자·사회", "importance": 2, "source": "서울경제", "published": "2026-09-22", "url": "https://www.sedaily.com/article/20093715"}, {"id": "f0c33bb2a284", "title": "금융사가 만들어가는 '더 잘사는 대한민국'", "summary": "우리은행이 DC·IRP 가입자를 대상으로 삼성생명 이율보증형보험(GIC) 판매를 개시하며 총 10종의 GIC 라인업을 갖췄다. 이율보증형보험은 보험사가 일정 기간 약정 이율을 보증하는 상품으로, 가입 조건에 따라 정기예금보다 높은 금리가 제시되는 경우도 있다. 우리은행은 2026년 2분기 기준 퇴직연금 공시수익률에서 투자상품 부문 DC제도 1위, IRP제도 2위를 기록했다. 같은 기사에서 NH농협은행은 연금 수급권자를 위한 입출식통장 'NH올원더풀행복동행통장'으로 최고 연 3.1% 금리를 제공한다고 소개됐다.", "category": "업계·경쟁사", "importance": 2, "source": "주간조선", "published": "2026-09-22", "url": "http://weekly.chosun.com/news/articleView.html?idxno=55399"}, {"id": "296b91acf8ab", "title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "summary": "신한은행은 퇴직연금 상장지수펀드(ETF) 당일 매매 서비스를 시행한다고 21일 밝혔다. 이에 따라 신한은행의 확정기여(DC)형 퇴직연금과 개인형퇴직연금(IRP) 고객은 보유 중인 ETF를 매도한 뒤 매도 대금 결제를 기다리지 않고 같은 날 다른 ETF를 매수할 수 있게 됐다. 다만 시스템상 ETF 매도 결과가 반영되는 데는 2~10분가량이 소요된다. 같은 단신에는 KB국민카드의 포인트리 지역화폐 전환 확대, KB증권의 투자 성과 확인 서비스 출시 소식도 함께 실렸다.", "category": "업계·경쟁사", "importance": 2, "source": "동아일보", "published": "2026-09-22", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"id": "95b3a786e92d", "title": "75조 굴리는데 책임자가 없다…국민연금 부동산실장, 두 달째 공석", "summary": "국민연금기금운용본부의 부동산투자실장이 지난 7월 15일 대기발령 조치를 받은 뒤 두 달 넘게 자리가 비어 있고, 부동산투자실은 인프라투자실장 대행 체제로 운영되고 있다. 내부 감사의 쟁점은 평가 가치 4조원 규모 오피스 빌딩 센터필드의 운용사를 이지스자산운용에서 코람코자산운용으로 교체하려던 과정에서 수익성 외에 관계자들의 이해관계가 고려됐는지다. 운용사 교체 계획은 지난 7월 3일 대체투자위원회가 안건을 부결해 무산됐다. 국민연금은 다음달 보건복지부 국정감사 전에 내부 감사를 마무리할 방침이다.", "category": "법인·자금운용", "importance": 2, "source": "매일경제", "published": "2026-09-22", "url": "https://www.mk.co.kr/article/12158815"}, {"id": "ea7dee684ff3", "title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "summary": "세계일보가 금융권 단신을 묶어 전하며 신한은행의 퇴직연금 ETF 당일 매매 시행을 머리 기사로 올렸다. 신한금융지주 자회사최고경영자후보추천위원회는 21일 올해 말 임기가 만료되는 자회사 대표 12명의 후보 추천과 관련해 공정성·투명성 강화 방안을 논의했고, 은행 임원후보추천위원회에 후보군 추천 권한을 부여하기로 했다. KB국민은행은 SAP코리아와 ERP 임베디드금융 생태계 공동 조성을 위한 업무협약을 체결해 기업 고객이 ERP 화면에서 금융 업무를 처리할 수 있도록 했다. 우리금융그룹은 2036년까지 10년간 30억원을 투입해 매년 60명의 스포츠 유망주를 지원하는 우리드림브릿지 계획을 발표했다.", "category": "업계·경쟁사", "importance": 2, "source": "세계일보", "published": "2026-09-22", "url": "https://www.segye.com/newsView/20260921516039"}, {"id": "043d37d0072f", "title": "주식·채권·대체투자 모두 AI로…분산투자 착시[마켓프리즘]", "summary": "골드만삭스 추정으로 반도체 기업과 하이퍼스케일러가 S&P500 시가총액의 약 40%를 차지해 지수를 사면 AI를 사는 구조가 됐다. 아폴로 집계로 올해 미국 투자등급 회사채 순발행의 49%가 AI 관련이고, 상반기 미국 벤처투자 4127억달러 가운데 3559억달러인 86%가 AI로 갔다. 뱅가드에 따르면 미국 확정기여형 퇴직연금(401k) 가입자의 69%가 타깃데이트펀드처럼 운용사가 알아서 배분해 주는 상품에 돈을 맡겨, 주식에서는 AI 대형주를 채권에서는 하이퍼스케일러 회사채를 함께 담게 된다. 아폴로의 토르스텐 슬록 수석이코노미스트는 새로운 60/40은 AI 대 비AI라고 말했다.", "category": "운용·상품", "importance": 2, "source": "조세일보", "published": "2026-09-22", "url": "http://www.joseilbo.com/news/news_read.php?uid=576166&class=18&grp="}, {"id": "a46b1c777a45", "title": "신한자산운용 'SOL 초단기채권액티브' ETF, 순자산 1조 돌파", "summary": "신한자산운용의 SOL 초단기채권액티브 ETF 순자산이 1조원을 넘어섰다. 이 상품은 최근 3개월 기준 연환산 수익률 3.54%를 기록해 KOFR와 CD 91일물 금리 3.1~3.2% 수준을 웃돌았다. 안전자산으로 분류돼 퇴직연금 DC·IRP 계좌에서 적립금의 100%까지 투자할 수 있고 ISA에서도 활용된다. 최근 1주간 단기자금형 ETF 순유입 상위 10종목에는 1조4000억원이 들어왔다.", "category": "운용·상품", "importance": 2, "source": "이투데이", "published": "2026-09-22", "url": "https://www.etoday.co.kr/news/view/2628312"}, {"id": "aea0c5c117f7", "title": "은퇴자금 방어력 높이자…미래에셋생명, 보증형 실적배당보험 인기", "summary": "미래에셋생명은 22일 퇴직연금 보증형 실적배당보험이 출시 이후 지난달 말까지 717억원의 모집 성과를 기록했다고 밝혔다. 이 상품은 개인형퇴직연금(IRP) 계좌를 통해서만 가입할 수 있는 거치형 상품으로, 만 50세부터 적립금을 일시에 예치해 가입할 수 있다. 만 55세부터는 원하는 시점에 연금을 개시할 수 있고, 만 55세를 넘긴 가입자는 가입과 동시에 연금 수령도 가능하다. 일임형 자산배분펀드와 연계해 보장된 인출 구조와 글로벌 분산투자를 함께 추구하는 구조다.", "category": "업계·경쟁사", "importance": 2, "source": "연합인포맥스", "published": "2026-09-22", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4436024"}, {"id": "0aa1ea477493", "title": "교보생명, ISMS-P 인증 범위 확대…퇴직연금·신탁·펀드·여신까지", "summary": "교보생명이 정보보호 및 개인정보보호 관리체계(ISMS-P) 인증 범위를 보험 업무에서 퇴직연금·신탁·펀드·여신 등 고객정보가 활용되는 주요 금융업무로 확대했다고 21일 밝혔다. 금융서비스 전반에 걸쳐 ISMS-P 인증을 획득한 것은 국내 금융사 중 처음이다. ISMS-P는 과학기술정보통신부와 개인정보보호위원회가 공동 운영하는 통합 인증제도로 총 101개 기준을 평가하며 인증 유효기간은 3년이다. 교보생명은 AI 서비스 도입·활용 과정의 보안 위험을 점검하기 위한 AI 보안 위험평가 기준과 가이드라인도 마련했다.", "category": "업계·경쟁사", "importance": 1, "source": "이코노미톡뉴스", "published": "2026-09-22", "url": "http://www.economytalk.kr/news/articleView.html?idxno=424267"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-09-15 ~ 2026-09-21", "generated_at": "2026-09-22T13:15:29+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": []}, {"id": "26bad6a1c84a", "title": "이형일 \"500조 규모 퇴직연금, 수익률 저조…법안 준비 중\"", "summary": "이형일 부총리 겸 재정경제부 장관 후보자가 9월 15일 국회 재정경제기획위원회 인사청문회에서 퇴직연금 제도 개선과 관련해 노사정이 합의한 사항을 바탕으로 법안을 준비하고 있다고 밝혔다. 이 후보자는 퇴직연금 적립금이 500조원까지 올라갔는데 수익률이 저조하다며 노후소득 보장 기능이 제대로 작동하고 있느냐는 논의가 많다고 말했다. 노사정은 지난 2월 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화에 합의했고, 정부는 이를 바탕으로 연내 근로자퇴직급여보장법 개정을 추진하고 있다. 이광재 의원이 미국 401(k)를 거론하며 국가적 시스템이 필요하다고 지적한 데 대한 답변이다.", "category": "제도·규제", "importance": 5, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/economy/trend/6290971", "related": []}, {"id": "504d525f7a1e", "title": "개인 국채투자, '퇴직연금서 투자'에 흥행…9월 청약서 초과 수요", "summary": "이달 개인투자용 국채 청약에서 확정기여형(DC) 퇴직연금과 개인형퇴직연금(IRP) 계좌를 통한 청약액이 1천435억원으로 집계됐다. 퇴직연금 청약에 일반투자 창구 청약까지 더해지면서 9월 전체 청약액은 재정경제부가 공고한 모집예정액 2천300억원을 넘어섰고, 지난 5월 이후 처음으로 2천억원을 돌파했다. 청약은 9월 9일부터 15일까지 신한은행·하나은행·NH농협은행 등 3개 은행과 미래에셋증권·삼성증권·한국투자증권·KB증권·NH투자증권 등 5개 증권사를 통해 이뤄졌으며, 대상 채권은 10년물과 20년물이다. 10년물 표면금리는 연 4.415%, 20년물은 연 4.57%이고 두 상품 모두 연 0.35%포인트의 가산금리가 적용된다.", "category": "운용·상품", "importance": 4, "source": "연합뉴스", "published": "2026-09-17", "url": "https://www.yna.co.kr/view/AKR20260917099600008", "related": [{"title": "\"1억 넣어두면 20년 뒤 2.6억\"…연금개미들 외면한 이유", "source": "한국경제", "url": "https://www.hankyung.com/article/202609168563i"}, {"title": "\"원리금보장이라고 다 같은 예금 아닙니다\"…퇴직연금, 국채 갈아타기 전 따져볼 것은", "source": "경인방송", "url": "https://news.ifm.kr/news/articleView.html?idxno=479849"}, {"title": "퇴직연금, 주식이 엔진이면 채권은 닻", "source": "중앙SUNDAY", "url": "https://www.joongang.co.kr/article/25463197"}, {"title": "퇴직연금으로 산 개인투자용 국채, 10년 뒤 수익률은?", "source": "브라보마이라이프", "url": "https://bravo.etoday.co.kr/view/atc_view/20072"}, {"title": "퇴직연금으로 국채 투자…첫 청약부터 흥행", "source": "SBS", "url": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008759230"}, {"title": "[흔들리는 국채 공식④] 퇴직연금에 국채 담을까…개인투자자의 새 셈법", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4435180"}, {"title": "[필드뒷얘기] 퇴직연금 국채로 고객 묶는 증권사", "source": "대한금융신문", "url": "https://www.kbanker.co.kr/news/articleView.html?idxno=225952"}, {"title": "퇴직연금에 들어온 ‘개인투자용 국채’…롯데손해보험 매각, 어려운 이유 [머니카운터 방송 예고]", "source": "경인방송", "url": "https://news.ifm.kr/news/articleView.html?idxno=479676"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": []}, {"id": "f9f26933154f", "title": "[이슈체크] 퇴직연금까지 개선 요구…흥국생명, 반복된 감독지적 뒤 '사후관리' 시험대", "summary": "금융감독원 연금감독실은 지난달 31일 흥국생명에 퇴직연금 운영과 관련한 개선 요구 5건을 통보했다. 현물이전 안내가 미흡해 가입자가 제도를 충분히 인지하지 못한 채 불필요하게 매도하거나 운용하지 못할 수 있다는 점, 보너스보험 중도해지이율과 이율보증형2 보험의 금리보증 비용을 산정하면서 시장금리 변동 등 객관적 자료를 충분히 반영하지 않은 점이 지적됐다. 디폴트옵션 성과수수료는 계약일 기준으로 할인 대상을 정해 장기 보유자도 제외되는 구조라는 점, 연금전환특약의 차순위 보험수익자 지정 절차와 배우자 계좌 승계 안내가 부족하다는 점도 함께 지적됐다. 부담금 미납 시 벌칙과 지연이자 관련 안내가 누락된 점도 개선 요구에 포함됐다.", "category": "제도·규제", "importance": 4, "source": "더퍼블릭", "published": "2026-09-18", "url": "https://www.thepublic.kr/news/articleView.html?idxno=318506", "related": []}, {"id": "a6e5af30d59e", "title": "[단독] 5인 미만 사업장 퇴직연금 도입률 10%에 그쳐", "summary": "퇴직연금 미도입 사업장이 121만218곳으로 집계됐고, 이 가운데 30인 미만 사업장이 119만1811곳으로 98.5%를 차지했다. 사업장 규모별 도입률은 5인 미만 10.6%, 5~9인 32.7%, 10~29인 57.3%, 30~49인 74.2%, 50~99인 82.2%, 100인 이상 89.6%로 나타났다. 전체 도입률은 26.5%로 5년째 26%대에 머물렀고, 업종별로는 숙박·음식점업의 93.8%, 부동산업의 89.7%, 농림어업의 89.0%가 퇴직연금을 도입하지 않았다. 가입 대상 근로자 1308만5000명 가운데 697만2000명(53.3%)이 퇴직연금에 가입했다.", "category": "제도·규제", "importance": 4, "source": "한국경제", "published": "2026-09-17", "url": "https://www.hankyung.com/article/202609169177i", "related": []}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": []}, {"id": "507cff298ac3", "title": "미래에셋증권, 5대 시중은행 압도한 '리딩 증권사'…2분기 순이익 1.9조", "summary": "미래에셋증권이 2026년 2분기 순이익 1조9052억원을 기록해 신한은행(1조3015억원), KB국민은행(1조1240억원) 등 5대 시중은행을 모두 앞섰다. 영업이익은 2조4899억원으로 397.5% 늘었고, 세전이익 2조5287억원 가운데 1조6242억원은 스페이스X 평가이익에서 나왔다. 퇴직연금 적립금은 6월 말 80조원에 이르렀고 연간 증가율은 60%를 넘어 시장 평균의 약 2.5배였다. 개인형 퇴직연금에 로보WRAP 서비스를 도입하는 등 연금 자산관리 서비스를 넓혔다.", "category": "업계·경쟁사", "importance": 4, "source": "스포츠서울", "published": "2026-09-15", "url": "https://www.sportsseoul.com/news/read/1634922", "related": []}, {"id": "37880c4dd1e3", "title": "'퇴직연금 인기상품' 채권혼합ETF...미국 금리 상승에 수익률 '흔들'", "summary": "퇴직연금 수요를 타고 성장한 채권혼합형 ETF의 수익률이 금리 상승과 증시 조정으로 흔들리고 있다. 최근 1개월간 'ACE 미국S&P500미국채혼합50액티브'는 6.03%, 'KODEX 200미국채혼합50'은 5.8%, 'TIGER 미국나스닥100채권혼합50'은 4.59% 하락해 각각 기초지수보다 낙폭이 컸다. 타깃데이트펀드(TDF) ETF를 제외한 채권혼합형 ETF는 9월 11일 기준 66개이며 순자산총액은 18조5501억원으로 연초 6조8926억원에서 12조원 가까이 늘었다. 확정기여형(DC)·개인형퇴직연금(IRP)의 위험자산 투자 한도가 70%로 제한돼, 주식 편입 비중 50% 이하인 적격 혼합형 상품이 안전자산으로 분류되면서 자금이 몰렸다.", "category": "운용·상품", "importance": 4, "source": "헤럴드경제", "published": "2026-09-15", "url": "https://biz.heraldcorp.com/article/10873869", "related": []}, {"id": "4811f65ec7cf", "title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "summary": "한국보건사회연구원은 노후소득보장제도의 분절성과 비효율성 탓에 노인빈곤 문제가 해소되지 않고 있다고 지적했다. 2024년 노인빈곤율은 35.9%이며, 빈곤 노인의 약 80%는 생계급여 대상이 아니다. 연구진은 기초연금 지급 범위를 좁히는 대신 지급액을 높이는 하후상박형 개편과 사회서비스형 노인일자리 확대를 제안했다. 중위소득 40~50% 구간 노인은 기초연금과 일자리를 조합하면 빈곤선을 벗어날 수 있다고 분석했다.", "category": "가입자·사회", "importance": 3, "source": "이투데이", "published": "2026-09-20", "url": "https://www.etoday.co.kr/news/view/2627301", "related": [{"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": "2026-09-20", "url": "http://www.smarttimes.co.kr/news/articleView.html?idxno=49113", "related": [{"title": "잦은 이직에 끊기는 퇴직자산…사회복지인 전용 퇴직연금 논의 본격화", "source": "라이브뉴스", "url": "https://www.livesnews.com/news/article.html?no=64332"}]}, {"id": "e8a6030d9b80", "title": "국민연금 추납 2년새 2.8배…보험료율 9.5% 오르기 전 '막차'", "summary": "국민연금 추후납부 신청이 지난해 24만4329건으로 2023년 8만7644건 대비 2.8배 늘었다. 올해 상반기에만 10만6838건이 접수됐다. 연금개혁으로 보험료율이 해마다 0.5%포인트씩 올라 13%까지 인상되는데, 추납보험료는 신청 시점의 보험료율이 적용되기 때문에 인상 전 신청이 몰리고 있다. 국회입법조사처는 최대 허용 기간인 108~119개월 구간에 신청이 집중돼 형평성 문제가 있다고 지적했다.", "category": "가입자·사회", "importance": 3, "source": "매일신문", "published": "2026-09-20", "url": "https://www.imaeil.com/page/view/2026092007310108169", "related": [{"title": "\"한달 내고 평생 따박따박\"...'중국인 국민연금 추납'이 불러온 나비효과", "source": "한국경제TV", "url": "http://www.wowtv.co.kr/NewsCenter/News/Read?articleId=A202609200033&t=NN"}]}, {"id": "ffa2d67f4b53", "title": "기초연금 1인 84만원 내야…13년새 부담액 4배 급증", "summary": "2027년 생산가능인구(15~64세) 1인이 기초연금 재원으로 부담할 세금이 84만4000원으로 집계됐다. 제도가 도입된 2014년의 18만2000원과 비교하면 360% 늘어난 금액이다. 2027년 기초연금 총지출은 29조7000억원으로, 국비 25조6000억원과 지방비 4조1000억원으로 구성된다. 1986년생이 40~44세 5년간 부담하는 금액은 약 434만9000원, 2026년생이 같은 나이대에 부담할 금액은 1230만6000원으로 추산됐다.", "category": "가입자·사회", "importance": 3, "source": "한국경제", "published": "2026-09-20", "url": "https://www.hankyung.com/article/2026092063311", "related": [{"title": "[단독] 나는 435만원, 우리 애는 1230만원…미래세대 '폭탄' 온다", "source": "한국경제", "url": "https://www.hankyung.com/article/2026092063181"}]}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발생했으나 회수된 금액은 없다.", "category": "법인·자금운용", "importance": 3, "source": "시장경제신문", "published": "2026-09-16", "url": "https://www.meconomynews.com/news/articleView.html?idxno=201626", "related": [{"title": "홈플러스, 9개월간 임금체불 3871억…퇴직금도 미지급", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1690418/"}]}, {"id": "f8e6de7fbf89", "title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "summary": "정부가 2026년 9월 1일 발표한 기초연금 개편안은 수급 대상인 소득 하위 70%를 셋으로 나눠 하위 30%는 월 38만원, 30~45%는 35만9000원으로 올리고 45~70%는 35만원으로 묶는 내용이다. 필자인 남찬섭 동아대 교수는 충분한 사회적 논의 없이 발표됐고 기초연금을 노인 70%의 빈곤 예방 장치가 아니라 빈곤 구제 수단으로 다뤘다고 비판했다. '하후상박'을 내세웠지만 실제로 인상 혜택을 보는 수급자는 약 40%에 그치고 하위 7%는 기초생활보장 급여가 깎여 상쇄된다고 지적했다. 대안으로는 모든 노인에게 지급하고 과세하는 노인 기본소득을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "슬로우뉴스", "published": "2026-09-15", "url": "https://slownews.kr/166386", "related": [{"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}]}, {"id": "4ef195012faf", "title": "증시 조정이 남긴 숙제[금융시장 돋보기]", "summary": "송홍선 자본시장연구원 선임연구위원은 최근 증시 조정이 지속적 시장개혁과 쏠림·변동성 관리라는 과제를 드러냈다고 진단했다. 쏠림 대책으로 대표 투자지수에 편입 한도(cap)를 두는 방안을 거론하며, 단일종목캡 24%와 종목합산캡을 운용하는 나스닥 100 사례를 들었다. 근본 대책으로는 장기투자 기관투자자 육성을 꼽으면서, 적립금 500조원의 퇴직연금과 준비금 1000조원의 보험회사가 무늬만 기관투자자에 머물러 있다고 지적했다. 기금형 퇴직연금을 제대로 도입하고 보험사의 자본규제·운용규제를 혁신해야 자본시장이 기관투자자 중심으로 도약할 수 있다고 제언했다.", "category": "운용·상품", "importance": 3, "source": "이데일리", "published": "2026-09-21", "url": "https://www.edaily.co.kr/News/Read?newsId=01416966645582416&mediaCodeNo=257", "related": []}, {"id": "427ba4ce9282", "title": "[김준영 칼럼] 퇴직금 산식을 둘러싼 사업주의 억울함, 사회적 합의가 필요한 때", "summary": "근로감독관이 사업장의 퇴직금 산정 내역을 점검하면서 1일 통상임금이 1일 평균임금보다 크면 차액을 지급하라는 시정지시를 내리는 사례가 늘고 있다. 근로기준법 제2조 제2항이 평균임금이 통상임금보다 적으면 통상임금을 평균임금으로 본다고 정하고 있어 감독관은 법대로 집행하지만, 기한 내 미지급 시 사용자는 형사 입건돼 검찰에 송치될 수 있다. 월 300만원 고정급 근로자의 경우 평균임금 기준 퇴직금은 300만원이지만 209시간으로 나눈 통상임금 기준으로는 약 344만원이 돼 약 44만원 차이가 난다. 대구지방법원은 2025년 8월 21일 선고한 2024나318050 판결에서 제2조 제2항을 하한 규정으로 보아 추가 퇴직금 청구를 받아들이지 않았고 이 판결은 확정됐으나, 대법원이 쟁점을 정리한 판례는 아직 없다.", "category": "제도·규제", "importance": 3, "source": "파이낸셜리뷰", "published": "2026-09-21", "url": "http://www.financialreview.co.kr/news/articleView.html?idxno=44982", "related": []}, {"id": "3795fb0c088c", "title": "퇴직연금 제도의 법적 구조와 실무상 쟁점", "summary": "법무법인 율사서재 김한나 변호사가 퇴직연금 제도의 법적 구조와 실무 쟁점을 정리했다. 퇴직금은 사용자가 산정해 직접 지급하는 반면 퇴직연금은 사외 금융기관에 적립한 재원을 퇴직연금사업자가 지급하는 구조여서, 퇴직금 법리를 그대로 적용할 수 없다고 설명했다. 대법원은 DC형에서 사용자가 납입한 부담금이 정당한 금액에 미치지 못한 경우 근로자가 평균임금 재산정이 아니라 정당 부담금액과 납입액의 차액 및 지연이자만 청구할 수 있다고 판시했다(2020다207444). 소멸시효는 고용노동부가 10년으로 해석한 사례가 있으나 판례는 3년을 전제로 판단해 왔고 기산점은 퇴직일이라고 정리했다.", "category": "제도·규제", "importance": 3, "source": "월간노동법률", "published": "2026-09-21", "url": "http://www.worklaw.co.kr/view/view.asp?accessSite=Naver&accessMethod=Search&accessMenu=News&in_cate=106&in_cate2=0&gopage=1&bi_pidx=39555", "related": []}]}, "monthly": {"period": "monthly", "key": "current", "label": "2026-08-22 ~ 2026-09-21", "generated_at": "2026-09-22T13:15:30+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "bb3d4f62df9a", "title": "연 4.9% 국채 빗장 뚫렸다…퇴직연금 553조 머니무브 사수", "summary": "9월 9일부터 IRP와 DC 가입자가 은행·증권사를 통해 개인투자용 국채를 직접 매입할 수 있게 됐다. 9월 발행분은 10년물 연 4.765%, 20년물 연 4.92% 수준이다. 증권사는 2분기 퇴직연금 점유율 29.8%로 전년 동기 26.5%에서 올라섰고, 은행은 50.8%를 유지하고 있다. 업계에서는 국채 상품 자체보다 시스템 편의성과 자산관리 컨설팅 역량이 승부를 가를 것으로 본다.", " ttps://www.seoulfn.com/news/articleView.html?idxno=637698"}, {"title": "퇴직연금에 들어온 ‘개인투자용 국채’…롯데손해보험 매각, 어려운 이유 [머니카운터 방송 예고]", "source": "경인방송", "url": "https://news.ifm.kr/news/articleView.html?idxno=479676"}, {"title": "퇴직연금 계좌로 국채 투자하면 포인트 제공", "source": "서울신문", "url": "https://www.seoul.co.kr/news/economy/finance/2026/09/14/20260914018002?wlog_tag3=naver"}, {"title": "[금상소] IRP·DC에 들어온 개인투자용 국채…10년·20년물 뭐가 나을까", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2624549"}]}, {"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "8bb193e0ea59", "title": "“정부 기초연금개편안, 겉으로는 하후상박 실제는 재정 절감안”", "summary": "정부가 노인 하위 70%를 세 집단으로 나눠 차등 지급하는 하후상박 방식을 내놨다. 하위 30%에 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원(동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": [{"title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "source": "슬로우뉴스", "url": "https://slownews.kr/166386"}, {"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "4811f65ec7cf", "title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "summary": "한국보건사회연구원은 노후소득보장제도의 분절성과 비효율성 탓에 노인빈곤 문제가 해소되지 않고 있다고 지적했다. 2024년 노인빈곤율은 35.9%이며, 빈곤 노인의 약 80%는 생계급여 대상이 아니다. 연구진은 기초연금 지급 범위를 좁히는 대신 지급액을 높이는 하후상박형 개편과 사회서비스형 노인일자리 확대를 제안했다. 중위소득 40~50% 구간 노인은 기초연금과 일자리를 조합하면 빈곤선을 벗어날 수 있다고 분석했다.", "category": "가입자·사회", "importance": 3, "source": "이투데이", "published": "2026-09-20", "url": "https://www.etoday.co.kr/news/view/2627301", "related": [{"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": "2026-09-20", "url": "http://www.smarttimes.co.kr/news/articleView.html?idxno=49113", "related": [{"title": "잦은 이직에 끊기는 퇴직자산…사회복지인 전용 퇴직연금 논의 본격화", "source": "라이브뉴스", "url": "https://www.livesnews.com/news/article.html?no=64332"}]}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발생했으나 회수된 금액은 없다.", "category": "법인·자금운용", "importance": 3, "source": "시장경제신문", "published": "2026-09-16", "url": "https://www.meconomynews.com/news/articleView.html?idxno=201626", "related": [{"title": "홈플러스, 9개월간 임금체불 3871억…퇴직금도 미지급", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1690418/"}]}, {"id": "8250641ede45", "title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "summary": "미래에셋생명이 개인형 IRP 계좌를 통해 가입하는 보증형실적배당보험을 운영하고 있다. 만 50세부터 적립금을 예치하고 만 55세 이후 연금 수령을 시작하는 구조이며, MVP펀드를 통해 글로벌 분산투자를 한다. 보험업계에서 처음 출시된 퇴직연금 보증형 실적배당보험으로, 가입자가 직접 투자 상품을 고르는 부담을 줄이도록 설계됐다. 8월 말 기준 모집액은 717억원을 넘어섰다.", "category": "운용·상품", "importance": 2, "source": "신아일보", "published": "2026-09-17", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132", "related": [{"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "f22427d51808", "title": "NH농협은행, 2026년 제2차 투자상품 완전판매 대토론회 개최", "summary": "NH농협은행은 17일 서울 중구 본사에서 2026년 제2차 투자상품 완전판매 대토론회를 열었다. 투자상품 미스터리쇼핑 만점자와 영업본부 완전판매 TOP리더 등 약 40명이 참석해 펀드·방카슈랑스·신탁·퇴직연금 부문의 상담 준비, 상품 설명, 적합성·적정성 원칙 준수 사례를 공유했다. NH농협은행은 토론회 내용을 영상으로 제작해 영업점 교육자료로 활용할 계획이다. 박현동 투자상품부문 부행장은 완전판매가 절차 준수에 그치지 않고 고객 입장에서 충분히 설명하고 신뢰를 쌓는 과정이라고 강조했다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스퀘스트", "published": "2026-09-17", "url": "https://www.newsquest.co.kr/news/articleView.html?idxno=301184", "related": [{"title": "농협은행, 투자상품 완전판매 대토론회 개최…미스터리쇼핑 만점자 우수사례 공유", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146703"}]}, {"id": "ab894d0c4867", "title": "[금융 HOT 뉴스] KB자산운용, 골드 특별자산 펀드 눈길", "summary": "KB자산운용이 골드 특별자산 펀드의 운용 구조를 파생상품 중심에서 국내외 금 ETF 활용 방식으로 바꿨다. 파생상품 위험평가액을 40% 이하로 낮춰 퇴직연금 적격 요건을 충족했고 운용보수는 기존 대비 약 40% 인하했다. 비교지수는 LBMA Gold PM Price로 변경했고 환매대금은 4영업일 내에 지급한다. 현재 국민은행과 신한투자증권의 퇴직연금 계좌에서 매매할 수 있다.", "category": "운용·상품", "importance": 2, "source": "비즈월드", "published": "2026-09-16", "url": "http://www.bizwnews.com/news/articleView.html?idxno=146330", "related": [{"title": "KB자산운용, 18년 된 금 펀드 손질…퇴직연금서도 투자", "source": "AP신문", "url": "https://www.apnews.kr/news/articleView.html?idxno=3051270"}]}, {"id": "26bad6a1c84a", "title": "이형일 \"500조 규모 퇴직연금, 수익률 저조…법안 준비 중\"", "summary": "이형일 부총리 겸 재정경제부 장관 후보자가 9월 15일 국회 재정경제기획위원회 인사청문회에서 퇴직연금 제도 개선과 관련해 노사정이 합의한 사항을 바탕으로 법안을 준비하고 있다고 밝혔다. 이 후보자는 퇴직연금 적립금이 500조원까지 올라갔는데 수익률이 저조하다며 노후소득 보장 기능이 제대로 작동하고 있느냐는 논의가 많다고 말했다. 노사정은 지난 2월 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화에 합의했고, 정부는 이를 바탕으로 연내 근로자퇴직급여보장법 개정을 추진하고 있다. 이광재 의원이 미국 401(k)를 거론하며 국가적 시스템이 필요하다고 지적한 데 대한 답변이다.", "category": "제도·규제", "importance": 5, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/economy/trend/6290971", "related": []}, {"id": "ffde5c86587a", "title": "'공시 넘어 사후관리'…디폴트옵션 3년, 최초 평가 시동", "summary": "고용노동부가 올해 디폴트옵션 승인 상품에 대한 첫 정기 평가를 실시한다. 2023년 7월 본격 시행된 디폴트옵션은 올해 3월 기준 41개 금융기관이 324개 상품을 승인받아 운용 중이며, 최초 승인 이후 3년이 지난 상품이 평가 대상으로 장기 성과 수익률과 위험 관리 등을 본다. 고용노동부는 첫 평가인 만큼 성과 저조 사유를 파악하고 개선 방안을 마련하는 데 핵심 의의를 두되, 문제가 지속되는 상품에는 불이익을 부여할 계획이다. 5월에 선정한 정책연구용역은 내년 2월까지 진행된다.", "category": "제도·규제", "importance": 5, "source": "한국금융신문", "published": "2026-09-14", "url": "https://www.fntimes.com/html/view.php?ud=202609122140567806179ad43907_18", "related": []}, {"id": "69dd458f15f4", "title": "퇴직연금 550조 커졌는데…보험사 점유율 20% 무너졌다", "summary": "퇴직연금 시장이 553조원대로 커지는 사이 보험업계 점유율이 20% 아래로 떨어졌다. 상반기 증권사는 4조1000억원 순유입을 기록한 반면 보험사는 1799억원 순유출을 냈다. 실물이전 확대로 가입자가 금융사를 옮기기 쉬워지면서 사업자 간 경쟁이 격화된 결과다. DB형에 집중된 포트폴리오가 약점으로 지목되자 삼성·한화·교보생명 등이 DC형·IRP 강화와 ETF 상품 확대로 대응하고 있다.", "category": "업계·경쟁사", "importance": 5, "source": "뉴데일리", "published": "2026-09-10", "url": "https://biz.newdaily.co.kr/site/data/html/2026/09/10/2026091000173.html", "related": []}, {"id": "de4a8500263d", "title": "수익률 32%에도 돈이 안 온다…디폴트옵션의 역설", "summary": "디폴트옵션 시행 3년 차 데이터에서 적극투자형 1년 수익률이 32.66%를 기록했으나 자금의 82.5%는 여전히 안정형에 머물러 있다. 은행권은 고객 자금 대부분을 안정형에 두는 반면 증권사 고객은 위험자산에 투자해 업권별로 뚜렷이 갈렸다. 제도의 병목은 상품 품질이 아니라 자금이 좋은 상품에 도달하는 경로에 있다는 지적이다.", "category": "운용·상품", "importance": 5, "source": "한경머니", "published": "2026-09-10", "url": "https://magazine.hankyung.com/money/article/202608199155c", "related": []}, {"id": "937d44176934", "title": "퇴직연금 6.9조 이동…은행서 증권사로 자금 쏠림, 국채로 2차 경쟁", "summary": "올해 상반기 퇴직연금 실물이전 규모가 약 6조9000억원으로 전년 동기 약 3조2000억원의 2.2배에 달해 2024년 제도 시행 이후 반기 기준 최대를 기록했다. 업권별로는 증권사가 4조1513억원 순유입, 은행이 3조9714억원 순유출, 보험이 1799억원 순유출이었고, 증권사 적립금은 2분기 말 165조468억원으로 1분기 대비 16.5% 늘어 은행권 증가율 6.6%를 크게 앞섰다. 실물이전 규모는 가입자가 직접 상품을 고르는 IRP에서 6조8000억원으로 가장 컸다. 9월부터 개인투자용 국채가 DC·IRP 계좌에 편입되면서 증권사는 안정형 상품까지 더해 고객 확보에 나서고, 은행권은 0년물 뭐가 나을까", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2624549"}]}, {"id": "ebc5d7f86d92", "title": "기금형 퇴직연금 가이드라인이 늦어지는 까닭은", "summary": "기금형 퇴직연금 가이드라인 발표가 지연되면서 금융사 CEO 간담회 일정도 9월 2일에서 15일로, 다시 추석 이후로 밀렸다. 지연 이유는 퇴직연금 수탁기관의 성격과 관리·감독 주체, 기존 확정기여형(DC) 적립금의 기금형 이전 방식을 둘러싼 이견이 정리되지 않았기 때문이다. 지난 2월 노사정 합의로 금융기관 개방형·공공기관 개방형·연합형 세 유형을 두기로 했으나, 민간 금융기관은 금융기관 개방형에, 노동계는 노사 동수 이사회를 구성할 수 있는 연합형에, 국민연금공단은 300명 이상 공기업을 대상으로 한 공공기관 개방형에 각각 집중하고 있다. 합의문상 수탁법인 이사회의 절반은 독립이사여야 하고 독립이사의 30% 이상은 기금 가입자가 추천한 인사여야 한다.", "category": "제도·규제", "importance": 5, "source": "매일노동뉴스", "published": "2026-09-21", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=236871", "related": [{"title": "표류하는 기금형 퇴직연금…간담회 또 연기", "source": "글로벌에픽", "url": "http://www.globalepic.co.kr/view.php?ud=2026091408374115157cc35ccc5c_29"}, {"title": "기금형 퇴직연금 도입 '연기 또 연기'…당정 신중론·업계 반발에 '장고'", "source": "인베스트조선", "url": "https://www.investchosun.com/site/data/html_dir/2026/09/10/2026091080075.html"}, {"title": "[퇴직연금 Radar] 기금형 사장단 간담회 또 연기…협의 '공회전'", "source": "더벨", "url": "https://www.thebell.co.kr/free/content/ArticleView.asp?key=202609081504121440101838"}]}, {"id": "8bb193e0ea59", "title": "“정부 기초연금개편안, 겉으로는 하후상박 실제는 재정 절감안”", "summary": "정부가 노인 하위 70%를 세 집단으로 나눠 차등 지급하는 하후상박 방식을 내놨다. 하위 30%에 월 38만원, 30~45%에 35만9000원, 45~70%에 35만원(동결)을 지급한다. 필자는 기초연금이 빈곤대책이 아니라 연금제도의 기초선 역할을 위해 도입된 제도라며 빈곤대책과 혼동된 정책이라고 비판했다. 실제로는 전체 노인의 70%가 아니라 약 40%만 인상되므로 지출 절감이 핵심이라는 평가다.", "category": "가입자·사회", "importance": 4, "source": "오마이뉴스", "published": "2026-09-10", "url": "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265852", "related": [{"title": "기초연금 개혁, 기만적 '하후상박' 대신 노인 기본소득을!", "source": "슬로우뉴스", "url": "https://slownews.kr/166386"}, {"title": "빈곤 노인에게 고작 3만원 더? 李 정부 기초연금 개편안 왜 후퇴했나 [기초연금 개편의 맹점②]", "source": "더스쿠프", "url": "https://www.thescoop.co.kr/news/articleView.html?idxno=311603"}, {"title": "[리셋 코리아] 정치적 득실 따지지 말고 기초연금 개혁해야", "source": "중앙일보", "url": "https://www.joongang.co.kr/article/25461512"}, {"title": "[충남시론] 개혁 발표 중단된 기초연금제도 허점 많다", "source": "충남일보", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=909274"}]}, {"id": "c9301e64a757", "title": "증권사로 향하는 퇴직연금…농협은행, ETF 늘려 '수성' 나선다", "summary": "금융감독원 통합연금포털 기준 올 6월 말 퇴직연금 적립금 전체 규모는 553조8779억원으로, 이 가운데 5대 은행이 228조1662억원(41.2%), 증권사가 165조468억원(29.8%)을 차지했다. 5대 은행 비중은 최근 3년 중 가장 낮고 증권사 비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "230cdb384f9b", "title": "전삼노, 경영성과급 DC형 퇴직연금-개인형 IRP 선택제 도입 요구", "summary": "전국삼성전자노동조합이 15일 입장문을 내고 경영성과급의 DC형 퇴직연금·개인형 IRP 계좌 편입 선택제를 즉각 도입하라고 촉구했다. 전삼노는 이 제도가 회사의 추가 재원 투입이 거의 필요 없으며 SK하이닉스와 LG전자 등 주요 대기업은 노사 합의로 수년 전부터 운영해 왔다고 밝혔다. 초과이익성과급(OPI) 지급 시 예상 소득세를 투명하게 공지하고 현금 수령과 연금 편입 중 직원이 직접 고르게 할 것을 제안했다. 삼성전자는 그간 경영성과급을 세후 자사주나 현금으로 지급해 왔다.", "category": "법인·자금운용", "importance": 4, "source": "뉴스1", "published": "2026-09-15", "url": "https://www.news1.kr/industry/general-industry/6291233", "related": [{"title": "삼성전자 성과급 '절세' 요구…전삼노가 꺼낸 '성과급 퇴직연금' 뭐길래", "source": "비즈한국", "url": "https://bizhankook.com/articles/samsung-performance-bonus-pension-plan.html"}]}, {"id": "569c2853f262", "title": "\"국민연금도 참여땐 민간경쟁 촉진\" vs \"노후자금 한 바구니 안돼\"", "summary": "정부가 기금형 퇴직연금 제도를 추진하는 가운데 국민연금공단이 운용 주체로 참여하는 방안을 두고 금융권에서 찬반이 갈리고 있다. 국민연금은 공공기관의 개방형 기금 운용에 우선 참여하고, 요청이 있으면 민간기업 기금 운용도 맡겠다는 방침이다. 국민연금의 10년 평균 수익률은 연 7.93%로 퇴직연금의 연 2.64%보다 3배 수준이며, 지난해 수익률은 국민연금 18.8%, 퇴직연금 전체 평균 6.47%였다. 6월 말 기준 퇴직연금 적립금은 553조9000억원이고 이 가운데 64%가 원리금 보장 상품에 담겨 있다.", "category": "법인·자금운용", "importance": 4, "source": "동아일보", "published": "2026-09-11", "url": "https://www.donga.com/news/Economy/article/all/20260910/134646204/2", "related": [{"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "1d9eac5cfd02", "title": "[오늘의 시니어 트렌드] 기초연금 수급률 4년 연속 하락, 부부감액 2조4000억", "summary": "기초연금 수급자가 처음 700만 명을 넘었으나 전체 노인 중 수급률은 65.3%로 4년 연속 하락했다. 부부가 함께 받을 때 각각 20%를 깎는 부부감액 조항이 연 2조4000억원 규모의 급여를 줄이면서 위장 황혼이혼을 유도한다는 지적이 나온다. 베이비부머의 대규모 수급 진입으로 지출은 2030년 30조원, 2045년 71조원까지 늘어날 전망이다. 제도 개편의 시급성이 강조되고 있다.", "category": "가입자·사회", "importance": 4, "source": "캐어유 뉴스", "published": "2026-09-10", "url": "https://www.careyounews.org/news/articleView.html?idxno=11450", "related": [{"title": "기초연금 수급 대상자보다 노인인구 증가 속도 더 빨라…수급률 4년 연속 하락", "source": "헤럴드경제", "url": "https://biz.heraldcorp.com/article/10867434"}]}, {"id": "4811f65ec7cf", "title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "summary": "한국보건사회연구원은 노후소득보장제도의 분절성과 비효율성 탓에 노인빈곤 문제가 해소되지 않고 있다고 지적했다. 2024년 노인빈곤율은 35.9%이며, 빈곤 노인의 약 80%는 생계급여 대상이 아니다. 연구진은 기초연금 지급 범위를 좁히는 대신 지급액을 높이는 하후상박형 개편과 사회서비스형 노인일자리 확대를 제안했다. 중위소득 40~50% 구간 노인은 기초연금과 일자리를 조합하면 빈곤선을 벗어날 수 있다고 분석했다.", "category": "가입자·사회", "importance": 3, "source": "이투데이", "published": "2026-09-20", "url": "https://www.etoday.co.kr/news/view/2627301", "related": [{"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0494e807fbe0", "title": "한국사회복지협의회, '사회복지인 맞춤형 퇴직연금 제도 도입 정책토론회' 개최", "summary": "한국사회복지협의회와 한국사회복지사협회, 한국사회복지공제회는 18일 국회 의원회관에서 사회복지인 맞춤형 퇴직연금 제도 도입을 주제로 정책토론회를 열었다. 세 기관은 이날 사회복지인 퇴직연금 도입 추진 협력을 위한 업무협약을 체결했다. 토론회에서는 약 60만 명의 사회복지 종사자가 잦은 이직과 낮은 임금, 소규모 사업장 중심의 고용 구조 탓에 안정적인 노후 자산을 마련하기 어렵다는 문제가 제기됐다. 해법으로 직역형 퇴직연금 도입과 연합형 기금 설립을 통해 이직해도 적립금이 끊기지 않는 체계를 갖추자는 방안이 제시됐다.", "category": "제도·규제", "importance": 3, "source": "스마트타임스", "published": "2026-09-20", "url": "http://www.smarttimes.co.kr/news/articleView.html?idxno=49113", "related": [{"title": "잦은 이직에 끊기는 퇴직자산…사회복지인 전용 퇴직연금 논의 본격화", "source": "라이브뉴스", "url": "https://www.livesnews.com/news/article.html?no=64332"}]}, {"id": "71c5fa04804f", "title": "홈플러스, 체불액 664억원 남아... 퇴직연금 적립도 기준 미달", "summary": "홈플러스의 누적 임금체불액은 3871억원으로 이 가운데 3207억원이 지급되고 664억원이 남았다. 미지급액 중 513억원은 7~8월 임금으로 7월에 근로자 9874명의 263억원, 8월에 9016명의 250억원이 밀렸고, 퇴사자 퇴직급여 129억원과 연차휴가 미사용수당 22억원이 포함됐다. 확정급여형(DB) 퇴직연금 적립비율은 79.9%로 필요액 대비 932억8000만원이 부족하고, 확정기여형(DC) 적립비율은 85.94%로 321억3000만원이 모자란다. 올해 처음으로 정부 대지급금 5300만원이 발생했으나 회수된 금액은 없다.", "category": "법인·자금운용", "importance": 3, "source": "시장경제신문", "published": "2026-09-16", "url": "https://www.meconomynews.com/news/articleView.html?idxno=201626", "related": [{"title": "홈플러스, 9개월간 임금체불 3871억…퇴직금도 미지급", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1690418/"}]}, {"id": "8250641ede45", "title": "미래에셋생명, 개인형 IRP 보증형실적배당보험 운영", "summary": "미래에셋생명이 개인형 IRP 계좌를 통해 가입하는 보증형실적배당보험을 운영하고 있다. 만 50세부터 적립금을 예치하고 만 55세 이후 연금 수령을 시작하는 구조이며, MVP펀드를 통해 글로벌 분산투자를 한다. 보험업계에서 처음 출시된 퇴직연금 보증형 실적배당보험으로, 가입자가 직접 투자 상품을 고르는 부담을 줄이도록 설계됐다. 8월 말 기준 모집액은 717억원을 넘어섰다.", "category": "운용·상품", "importance": 2, "source": "신아일보", "published": "2026-09-17", "url": "https://www.shinailbo.co.kr/news/articleView.html?idxno=5063132", "related": [{"title": "[이슈] 은퇴자금 지키면서 굴린다...미래에셋생명 '보증형실적배당보험' 주목", "source": "오늘경제", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=813516"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}, {"id": "354ed5723a15", "title": "삼성자산운용·미래에셋증권, 푸른씨앗 OCIO 수성", "summary": "국내 최초 기금형 퇴직연금인 푸른씨앗(중소기업퇴직연금기금) 자금을 굴릴 OCIO 전담운용기관에 삼성자산운용과 미래에셋증권이 재선정됐다. 삼성자산운용이 종합평점 92.915점, 미래에셋증권이 90.761점으로 우선협상대상자에 올랐다. 2022년 9월 첫 사업자 선정 이후 4년 만의 재선정이다. 2기 운용 기간은 2026년 9월 1일부터 2030년 8월 31일까지다.", "category": "법인·자금운용", "importance": 4, "source": "한국금융신문", "published": "2026-06-09", "url": "https://www.fntimes.com/html/view.php?ud=202606091842068772179ad43907_18", "related": []}, {"id": "5895ec3e71a7", "title": "20년 만에 퇴직연금 제도 대대적 개편…모든 사업장 의무화 추진", "summary": "정부가 2월 노사정 공동선언을 바탕으로 퇴직연금 제도를 대폭 개편한다. 7월까지 구체적 방안을 확정한 뒤 연내 관련 법 개정을 추진하고, 모든 사업장에 퇴직연금을 단계적으로 의무화할 방침이다. 기금형 퇴직연금 활성화와 퇴직급여 사외적립 의무화가 핵심 축이다. 1년 미만 근로자 등 사각지대 해소도 함께 추진된다.", "category": "제도·규제", "importance": 4, "source": "대한민국 정책브리핑", "published": "2026-03-11", "url": "https://www.korea.kr/news/policyNewsView.do?newsId=148960665", "related": []}, {"id": "6e2fe502ecb5", "title": "미래에셋증권, 퇴직연금 로보Wrap 출시…AI가 자산배분·매매 맡는다", "summary": "미래에셋증권이 IRP 계좌용 로보어드바이저 일임 서비스 퇴직연금 로보Wrap을 출시했다. 알고리즘이 글로벌 자산배분 포트폴리오를 구성하고 시장 상황에 맞춰 리밸런싱과 매매까지 수행한다. 7월 말 기준 누적 가입 계좌는 14만좌, 누적 가입금액은 8조3000억원이다.", "category": "운용·상품", "importance": 3, "source": "뉴스핌", "published": "2026-08-05", "url": "https://www.newspim.com/news/view/20260805001063", "related": []}, {"id": "676b0ae84927", "title": "신한 적립액 54조 독주…국민·하나, IRP 중심 2위 경쟁", "summary": "2026년 1분기 퇴직연금 랭킹에서 신한이 적립액 54조원으로 선두를 지켰다. 국민은행과 하나은행이 IRP를 중심으로 2위 자리를 놓고 다투고 있다. 은행권 IRP 적립금은 83조7000억원으로 전체 시장의 31.7%를 차지했다.", "category": "업계·경쟁사", "importance": 3, "source": "한국금융신문", "published": "2026-04-21", "url": "https://www.fntimes.com/html/view.php?ud=2026042117435794185e6e69892f_18", "related": []}, {"id": "ecca1d1f70f8", "title": "기금형 퇴직연금은 결과 아닌 과정 책임으로…사외적립의무는 속도조절 요구", "summary": "노사정과 전문가가 참여한 정책 토론회에서 기금형 퇴직연금 도입 방향이 논의됐다. 전문가들은 운용 주체의 책임을 결과가 아닌 과정, 즉 의사결정 절차의 적정성으로 전환해야 한다고 주장했다. 경영계는 중소기업 부담을 이유로 사외적립 의무화의 단계적 시행을 요구했다. 한국노총과 한국경영자총협회, 고용노동부, 한국투자증권 관계자가 참석했다.", "category": "법인·자금운용", "importance": 3, "source": "이데일리", "published": "2026-04-08", "url": "https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=04598566645414152", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    document.getElementById('footer').textContent = '화면 갱신 ' + DATA.built_at;
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
