    border: 0;
    border-bottom: 1px solid transparent;
    background: transparent;
    color: var(--accent);

    font-weight: 700;
    letter-spacing: 0.14em;

    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 0;

  /* ── 서명 요소: 기간 축 ────────────────────────────────────

  .rail {

    border-top-width: 6px;
    padding-top: 9px;

  details a { color: var(--ink); }

  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

"https://view.asiae.co.kr/article/2026102315211444862"}, {"id": "cbb65cadb972", "title": "“퇴직금 불리려다 날벼락”…DC형 갈아탄 직장인 수익률 '-10%'", "summary": "박성훈 의원이 금융감독원에서 받은 자료에 따르면 올해 6~7월 DB형에서 DC형으로 전환한 가입자는 14만9710명으로 전년 동기 대비 181.2% 증가했다. 전환 직후 하락장을 맞아 미래에셋증권과 한국투자증권의 해당 가입자들은 7~8월 단순 기간수익률이 각각 -10.7%, -10.2%를 기록했고, 같은 기간 코스피는 18.1% 하락했다. 기사는 TDF·대표 지수형 ETF를 핵심 자산으로, 섹터형 ETF를 위성 자산으로 두는 핵심·위성 전략과 디폴트옵션·일임형 로보어드바이저 활용을 소개했다. DC형 전환 전에는 회사 퇴직연금 규약과 전환 조건을 확인하고 기존 제도 유지 시 예상 퇴직급여와 비교할 필요가 있다고 전했다.", "category": "운용·상품", "importance": 3, "source": "이코노미스트", "published": "2026-10-26", "url": "https://economist.co.kr/article/view/ecn202610200050"}, {"id": "9f01dea0efad", "title": "[핫이슈] '시한폭탄' 된 세계 연금…55개국 중 43곳 출산율 '유지선' 붕괴", "summary": "머서와 CFA협회가 발표한 '2026 글로벌 연금지수' 보고서에서 조사 대상 55개국 중 43개국의 합계출산율이 인구 대체 수준인 2.1명에 미치지 못했다. 한국은 종합 점수 56.4점으로 C등급을 받아 55개국 중 45위에 그쳤고, 적정성 지수는 43.0점으로 51위였다. 보고서는 한국에 노인 빈곤층 지원 확대, 퇴직연금의 일시금 수령 제한 및 종신 연금화 의무화, 국민연금 적립 보험료율의 조속한 인상을 권고했다. 종합 1위는 85.8점으로 A등급을 받은 네덜란드였다.", "category": "가입자·사회", "importance": 3, "source": "더투데이", "published": "2026-10-26", "url": "https://www.the-today.com/news/articleView.html?idxno=92403"}, {"id": "7acdac72cca8", "title": "증시 급락에 퇴직연금·국민연금 '초토화'…노후자금 수익률 비상", "summary": "26일 금융감독원 통합연금포털에 따르면 올해 3분기 말 43개 퇴직연금 사업자의 적립금은 542조1214억원으로 전 분기 대비 11조7565억원(2.12%) 감소했다. 15개 증권사 적립금은 4조7533억원(2.88%) 줄었고, 이 중 IRP 적립금이 2조9143억원(4.44%) 감소해 증권업권 감소액의 약 61%를 차지했다. 실적배당형 적립금은 12조5142억원 줄어든 반면 원리금 보장형은 353조6832억원으로 소폭 늘었다. 주요 증권사의 IRP 원리금 비보장형 1년 수익률은 2분기 말 40~50%대에서 3분기 말 10%대로 떨어졌고, 국민연금의 국내 주식 평가액도 약 100일 만에 182조원 넘게 줄었다.", "category": "운용·상품", "importance": 3, "source": "더팩트", "published": "2026-10-26", "url": "https://news.tf.co.kr/read/economy/2380606.htm"}, {"id": "763ff6de322e", "title": "[김원섭 고려대 노동대학원장 겸 노동문제연구소장] “대학에 노동하는 사람 관점 없어져, 노동이 미래 담론 투자할 때”", "summary": "한국연금학회장을 지낸 김원섭 고려대 노동대학원장은 매일노동뉴스 인터뷰에서 은퇴 후 소득의 최소 50%를 계속 받는 것이 글로벌 스탠더드지만 한국은 전혀 그렇지 않으며 노인빈곤율이 이를 보여준다고 말했다. 그는 지금 연금제도는 정상적이지 않고 너무 부족하다며 글로벌 스탠더드에 맞게 정상화해야 한다고 주장했다. 기초연금을 아래는 올리고 윗부분은 내리는 현 정부의 조정 방식에 대해서는 아래와 위를 다 올려야 한다고 밝혔다. 국민연금과 기초연금으로는 턱없이 부족하다며 기존 사회보험체계에 보편수당을 결합한 복지형태도 제안했다.", "category": "가입자·사회", "importance": 2, "source": "매일노동뉴스", "published": "2026-10-26", "url": "https://www.labortoday.co.kr/news/articleView.html?idxno=237385"}, {"id": "9f8b0cce889a", "title": "[인터뷰]\"시장을 계속 이기는 전략은 없다\"...김상율 미래에셋자산운용 본부장 \"장기·저비용 투자가 답\"", "summary": "김상율 미래에셋자산운용 글로벌ETF운용본부장은 우량 자산을 낮은 비용으로 장기간 보유하는 전략이 장기 수익률을 높이는 데 유리하다고 밝혔다. 그는 S&P500을 포트폴리오의 '미드필더', 나스닥100을 '성장 엔진'에 비유하고 2011년 초부터 올해까지 누적수익률이 각각 약 510%, 약 1230%라고 설명했다. 대표지수를 코어로 두고 AI·반도체 등 테마형 ETF는 전체의 20~30% 이내 위성으로 활용하며, 은퇴가 가까워질수록 포트폴리오를 보수적으로 바꿔야 한다고 조언했다. 연금·ISA를 겨냥한 장기 코어상품을 강화하겠다는 계획도 밝혔다.", "category": "운용·상품", "importance": 2, "source": "청년일보", "published": "2026-10-26", "url": "https://www.youthdaily.co.kr/news/article.html?no=228731"}, {"id": "f6dc492afd41", "title": "\"카톡으로 펀드부터 ETF까지\"…하나은행, '하나 MP구독서비스' 고도화", "summary": "하나은행은 퇴직연금 가입 고객의 이용 편의를 높이고자 은행권 최초로 '하나 MP구독서비스'에 ETF 포트폴리오를 새로 추가했다고 26일 밝혔다. 하나 MP구독서비스는 연금 전문가들이 가입자의 투자 성향에 맞춘 포트폴리오와 시장 정보를 카카오톡 메시지로 정기 제공하는 서비스다. 이번 개편으로 가입자들은 펀드 중심 구성을 넘어 ETF까지 투자 범위를 넓혀 상품 추천부터 매수, 리밸런싱까지 원스톱으로 처리할 수 있게 됐다. 하나은행은 퇴직연금사업자 평가에서 3년 연속 우수사업자로 지정됐으며 올해 3분기 누적 기준 은행권 퇴직연금 적립금 증가율 1위를 기록했다.", "category": "업계·경쟁사", "importance": 2, "source": "더페어", "published": "2026-10-26", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=91803"}, {"id": "b6e71bbb6045", "title": "'연금저축' 중간에 꺼내면, 세액공제 받은 납입금에 16.5% 기타소득세 부과", "summary": "금융감독원이 연금저축 분쟁민원 사례를 토대로 가입자 유의사항을 정리해 내놨으며, 올해 2분기 기준 연금저축 적립금은 200조원을 넘어섰다. 연금저축을 중도에 해지하거나 일부를 빼면 세액공제를 받은 납입금과 운용수익에 16.5%의 기타소득세가 매겨지고, 부득이한 인출로 인정되면 3.3~5.5%의 연금소득세가 적용될 수 있다. 부득이한 인출은 사유가 확인된 날부터 6개월 안에 입증 자료를 금융회사에 내야 인정받는다. 가입설계서의 예상 연금은 확정액이 아니며, 금융회사나 상품을 바꾸려면 해지 대신 계좌이체 제도를 이용해야 기타소득세를 피할 수 있다.", "category": "가입자·사회", "importance": 2, "source": "데일리팝", "published": "2026-10-26", "url": "http://www.dailypop.kr/news/articleView.html?idxno=103650"}, {"id": "63b014684673", "title": "커버드콜 ETF 개인자금 올해 4조원 몰렸다", "summary": "삼성자산운용은 KODEX 코스피200 커버드콜 ETF 2종의 올해 개인 투자자 누적 순매수액이 총 4조원을 넘어섰다고 밝혔다. KODEX 200타겟위클리커버드콜이 3조92억원, KODEX 200커버드콜액티브가 1조1천305억원의 순매수를 기록했다. 삼성자산운용의 전체 커버드콜 ETF 순자산은 12조원 규모로 국내 시장 점유율은 약 45%이다. 금융투자업계는 퇴직연금 계좌에 커버드콜 ETF를 편입하는 중장년층 투자자도 늘고 있다고 설명했다.", "category": "운용·상품", "importance": 2, "source": "공감신문", "published": "2026-10-26", "url": "https://www.gokorea.kr/news/articleView.html?idxno=882682"}, {"id": "c519f856b553", "title": "미래에셋생명, 개인형IRP '보증형실적배당보험' 모집액 717억원 돌파", "summary": "미래에셋생명은 개인형퇴직연금(IRP) 전용 상품인 '보증형실적배당보험'의 모집액이 올해 8월 말 기준 717억원을 돌파했다고 밝혔다. 이 상품은 IRP 계좌로만 가입할 수 있는 거치형 상품으로, 만 50세부터 적립금을 일시에 예치해 가입하고 만 55세부터 연금을 개시할 수 있다. 자산 운용에는 일임형 자산배분펀드인 'MVP펀드'를 활용한다. 투자 성과에 따라 20년이 지난 뒤에도 적립금이 남아 있으면 소진될 때까지 연금 지급이 이어진다.", "category": "업계·경쟁사", "importance": 2, "source": "뉴스1", "published": "2026-10-26", "url": "https://www.news1.kr/finance/insurance-card/6331672"}, {"id": "53cab69490bb", "title": "[RMI보험경영연구소의 보험이슈 톡톡] 퇴직연금의 미래, 장기성과와 보험사의 역할", "summary": "최경진 교수는 2025년 말 퇴직연금 적립금 501조4000억원 가운데 증권업권은 131조5000억원으로 26.5% 늘었지만 보험업권은 104조6000억원으로 7.5% 증가해 시장 증가율 16.1%의 절반에도 못 미쳤다고 짚었다. 최근 성과를 좇는 자금 이동은 증시 조정기에 집중위험을 드러낼 수 있어 장기 위험조정수익률과 최대손실폭, 은퇴 시점을 함께 관리해야 한다고 주장했다. 기금형 퇴직연금의 국민연금공단 참여는 추가성·공공성·시장중립성·책임성 원칙 아래 검토돼야 한다고 제시했다. 보험사는 실적배당형 상품과 TDF·자동 리밸런싱을 강화하고 이율보증형 보험(GIC), DB형 ALM 컨설팅, 종신연금 등 수급 단계 역할을 넓혀야 한다고 제언했다.", "category": "업계·경쟁사", "importance": 1, "source": "한국보험신문", "published": "2026-10-26", "url": "https://www.insnews.co.kr/news/articleView.html?idxno=93452"}, {"id": "74263d0193ae", "title": "[목멱칼럼]기초연금, 그때는 맞고 지금은 틀리다", "summary": "정부가 최근 내놓은 기초연금 개편안은 소득 하위 70% 지급 원칙을 유지하되 하위 30%에 월 38만원, 30~45%에 35만9000원을 지급하고 45~70%는 35만원으로 동결하는 구조다. 저소득 부부가구 감액률을 20%에서 10%로 낮추고 저소득 직역연금 수급자에게도 기초연금을 지급하는 방안이 담겼다. 필자는 국민연금액이 기준연금액(2026년 34만9700원)의 150%인 52만4550원을 넘으면 기초연금이 최대 절반까지 깎이는 국민연금 연계감액이 성실한 장기가입자에게 불이익을 준다고 지적했다. 2014년 도입 당시에는 합리적이었던 연계감액을 이번 개편에서 함께 손봐야 한다고 주장했다.", "category": "가입자·사회", "importance": 1, "source": "이데일리", "published": "2026-10-26", "url": "https://www.edaily.co.kr/News/Read?newsId=01410406645616856&mediaCodeNo=257"}, {"id": "5e1da87a01fc", "title": "[머니 멘토링] \"소득 1000만원 맞벌이 딩크, 통장 따로 쓰다 5년 뒤 자산 격차\"", "summary": "원정현 신한 프리미어 PWM 강남센터 PB팀장은 세후 월소득 1000만원인 30대 맞벌이 딩크 부부 사례를 들어 용돈만 떼고 남은 소득을 먼저 합쳐 관리해야 한다고 조언했다. 투자는 S&P500·나스닥·코스피 지수 추종 ETF를 3~6개월 단위로 분할 매수하라고 권했다. 노후 준비로는 개인형퇴직연금(IRP)이 연간 1800만원 납입 한도 중 900만원까지 세액공제를 받을 수 있고 운용 기간 과세가 이연된다며 세제 혜택 상품과 연금의 선점을 꼽았다. 보험은 종신보험보다 실손·암 보험 등 필수 보장을 갖춘 뒤 변액연금보험이나 확정 금리 연금 상품을 활용하라고 덧붙였다.", "category": "가입자·사회", "importance": 1, "source": "THE Biz(더비즈)", "published": "2026-10-26", "url": "http://www.the-biz.co.kr/news/articleView.html?idxno=729702"}, {"id": "aa9686c72591", "title": "보내기만 하는 퇴직연금 교육, 이제는 바꿔야 한다!", "summary": "박준범 한국은퇴연금아카데미 대표는 DC형으로 도입될 기금형 퇴직연금이 최종 마무리 단계에 접어든 가운데 가입자교육이 반드시 짚어야 할 과제라고 밝혔다. 2023~2024년 가입자교육 실적은 평균 110.6%였지만 교육 방법은 서면교육 64.1%, 이메일교육 43.5%, 대면교육 3.0%로 형식적 교육에 그쳤다고 지적했다. 기금형에서는 서면·이메일 발송만으로 교육 의무를 이행한 것으로 인정하는 관행을 바꾸고, 학습형 온라인 교육과 이해도·행동 변화 중심의 성과 평가를 도입해야 한다고 제언했다. 수탁자의 교육 책임을 명확히 하는 동시에 사용자의 협조 의무도 제도적으로 강화해야 한다고 덧붙였다.", "category": "제도·규제", "importance": 1, "source": "글로벌에픽", "published": "2026-10-26", "url": "https://www.globalepic.co.kr/view.php?ud=2026102608123928007cc35ccc5c_29"}, {"id": "f12bfedaf7f6", "title": "[사설]국민언금 '1인 1연금' 체계로의 점차 전환", "summary": "지난해 국민연금 모수개혁으로 기금 고갈 시점은 늦췄지만 노후 소득 불평등 해소에는 역부족이라는 분석이 나왔고, 전문가들은 개인연금·퇴직연금을 연계한 노후소득보장 체계 구축을 강조하고 있다. 올해 6월 기준 노령연금 수급자 평균 수령액은 월 67만9331원으로 1인 가구 기준 중위소득의 28%에 불과하고, 신규 수급자의 평균 가입 기간은 20년 안팎으로 EU 평균 36.3년의 절반 수준이다. 국민연금공단은 무소득 배우자 등 667만명을 가입 대상에 포함하는 '1인 1연금' 체계로의 전환을 추진했다. 사설은 외벌이 시대에 설계된 '1가구 1연금' 제도가 시대에 맞지 않아 개선이 시급하다고 주장한다.", "category": "가입자·사회", "importance": 1, "source": "충남일보", "published": "2026-10-26", "url": "http://www.chungnamilbo.co.kr/news/articleView.html?idxno=916715"}, {"id": "f6d8f46806b1", "title": "\"연말정산 혜택 잡자\"…우리투자증권, IRP 단계별 리워드 행사 진행", "summary": "우리투자증권이 개인형퇴직연금(IRP) 고객을 대상으로 '스텝-업 이벤트'를 12월 31일까지 진행한다. 이벤트 기간 내 IRP 계좌를 처음 개설하면 상품권 1만원권을, 해당 계좌에서 ETF를 30만원 이상 최초 매수하면 1만원권을 추가로 지급한다. 두 달 연속 20만원 이상 입금하거나 순입금액 기준을 채우면 최대 3만원 상당의 상품권을 주며, 경품은 1인당 연간 3만원 한도 내에서 제공된다. 우리투자증권은 IRP 자산·운용관리 수수료 전액 면제와 저보수 S클래스 펀드 공급을 바탕으로 연금 운용 경쟁력을 높여가고 있다고 밝혔다.", "category": "업계·경쟁사", "importance": 1, "source": "더페어", "published": "2026-10-26", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=91820"}, {"id": "05ec7d4ac99b", "title": "NH농협은행, 퇴직연금 고객 세미나…운용 전략 공유", "summary": "NH농협은행이 지난 22일 서울 여의도 콘래드 호텔에서 퇴직연금 고객을 초청해 '업위고(UP WE GO) 퇴직연금 끌어올려 세미나 2026'을 개최했다. 수익률 세션에서는 안정형·투자형 퇴직연금 운용 전략을 소개했고, 성상현 전무가 자산 운용 전략과 대응 방안을 강연했다. 2015년 시작한 이 세미나는 올해 11년째로, 퇴직연금 전문 강의를 통한 금융교육과 함께 기업 및 농협은행 담당자가 의견을 나누는 자리로 운영된다. 강태영 NH농협은행장은 전사적인 사후관리를 강화하고 있으며 고객 의견을 향후 퇴직연금 관리에 적극 반영하겠다고 밝혔다.", "category": "업계·경쟁사", "importance": 1, "source": "화이트페이퍼", "published": "2026-10-26", "url": "http://www.whitepaper.co.kr/news/articleView.html?idxno=268084"}, {"id": "b6ee9bcda75a", "title": "KB증권, 기업 담당자 100여명 초청 '퇴직연금 세미나' 개최", "summary": "KB증권은 지난 22일 서울 여의도 본사에서 기업 퇴직연금 담당자 100여 명을 대상으로 '퇴직연금 세미나'를 개최했다고 밝혔다. 세미나에서는 2027년 경제 전망과 퇴직연금 의무화·기금형 퇴직연금 등 제도 이슈가 다뤄졌다. KB자산운용은 '퇴직연금 시장 변화와 DB 적립금 운용'을, KB증권은 '연금 절세와 DC 상품 운용 방안'을 주제로 실무 강연을 했다.", "category": "법인·자금운용", "importance": 1, "source": "비즈월드", "published": "2026-10-26", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149789"}]}, "weekly": {"period": "weekly", "key": "current", "label": "2026-10-19 ~ 2026-10-25", "generated_at": "2026-10-26T16:37:22+09:00", "item_count": 20, "shortfall_note": null, "items": [{"id": "829c3e49cc3f", "title": "흔들린 증시에 퇴직연금 적립금 6년여 만에 감소", "summary": "3분기 말 퇴직연금 적립금이 542조1214억원으로 전 분기보다 2.1% 줄었다. 코로나19 초기인 2020년 1분기 이후 6년여 만의 감소다. 업권별로는 증권 160조2935억원(2.9% 감소), 은행 275조4860억원(2.1% 감소), 보험 106조3419억원(0.9% 감소)이다. 실적배당형이 185조2078억원으로 6.3% 줄어든 반면 원리금보장형은 356조9051억원으로 0.2% 늘었다.", "category": "운용·상품", "importance": 5, "source": "머니투데이", "published": "2026-10-20", "url": "https://www.mt.co.kr/stock/2026/10/21/2026102016164749417", "related": [{"title": "\"노후자금 넣었는데\"…퇴직연금 12조 줄자 직장인들 '울상'", "source": "한국경제", "url": "https://www.hankyung.com/article/2026102167161"}, {"title": "5대 은행 퇴직연금 5조원 증발…7년 만에 첫 감소세", "source": "컨슈머타임스", "url": "https://www.cstimes.com/news/articleView.html?idxno=724898"}, {"title": "증시 시름에… 퇴직연금도 휘청", "source": "머니투데이", "url": "https://www.mt.co.kr/stock/2026/10/21/2026102019471522048"}, {"title": "증시 '휘청'에…5대銀 퇴직연금 적립금 7년 만에 첫 감소", "source": "연합인포맥스", "url": "https://news.einfomax.co.kr/news/articleView.html?idxno=4440263"}]}, {"id": "536a738a394f", "title": "기금형 퇴직연금, 국민연금에 문 열어주나", "summary": "국민연금의 퇴직연금 시장 참여를 두고 여당·국민연금공단과 금융권이 맞서고 있다. 이용우 더불어민주당 의원은 10월 2일 공적연금기관이 기금 운용을 두고 경쟁하도록 하는 근로자퇴직급여보장법 개정안을 발의하면서 초기 3년 10%, 5년간 30% 이상 진출을 금지하는 상한을 뒀다. 김성주 국민연금공단 이사장은 법 개정으로 참여가 가능해지면 낮은 수수료를 실현할 수 있다고 했고, 금융감독원은 운용 손실 책임과 관치 가능성을 우려했다. 고용부는 7월까지 세부안을 확정할 예정이었으나 미뤄졌고 CEO 간담회도 9월 초부터 세 차례 연기됐으며, 6월 말 기준 퇴직연금 시장 규모는 553조8949억원이다.", "category": "제도·규제", "importance": 5, "source": "글로벌에픽", "published": "2026-10-20", "url": "https://www.globalepic.co.kr/view.php?ud=2026102009352813337cc35ccc5c_29", "related": []}, {"id": "4bbbd1457f44", "title": "퇴직연금 판도 재역전…삼성생명 반년 만에 선두 탈환", "summary": "금융감독원 퇴직연금 비교공시에 따르면 3분기말 삼성생명의 퇴직연금 적립금은 57조5486억원으로 전분기보다 1523억원 늘어, 1조6636억원 줄어든 신한은행(57조2252억원)을 3234억원 차이로 앞서 1·2분기에 내준 선두 자리를 되찾았다. 삼성생명은 DB형 적립금 43조9970억원 중 원리금보장형이 35조원 수준이어서 증시 하락기에 적립금을 방어했고, 계열사 DB형 7074억원·DC형 461억원 증가도 영향을 미쳤다. 반면 국민은행 1조2587억원, 하나은행 1조107억원, 미래에셋증권 2조1176억원 등 주요 사업자의 적립금은 일제히 줄었다. 기사는 3분기 코스피가 19% 넘게 하락하며 실적배당형 상품 평가액이 감소한 영향으로 분석했다.", "category": "업계·경쟁사", "importance": 4, "source": "아시아타임즈", "published": "2026-10-25", "url": "https://www.asiatime.co.kr/article/20261020500369", "related": [{"title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "source": "세이프타임즈", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652"}, {"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", "importance": 4, "source": "머니투데이", "published": "2026-10-19", "url": "https://www.mt.co.kr/stock/2026/10/19/2026101916592725470", "related": [{"title": "퇴직연금 DC·IRP '성장률 1위 사업자'는 어디?", "source": "데일리안", "url": "https://www.dailian.co.kr/news/view/1705565/"}, {"title": "한국투자증권, DC·IRP 적립금 44.8% 증가…성장률 1위", "source": "비즈월드", "url": "http://www.bizwnews.com/news/articleView.html?idxno=149340"}]}, {"id": "c6c10dce8c44", "title": "[DQN] 증권사 퇴직연금 적립금 한 분기만에 5조 '털썩'…DC/IRP 수익률 톱3 iM·하나·유안타", "summary": "3분기 국내 증시 조정 여파로 증권사 퇴직연금 적립금이 한 분기 만에 5조원 가깝게 줄었다. 금융감독원 통합연금포털 비교공시에 따르면 증권사 DC 원리금비보장 1년 수익률은 유안타증권(21.86%), iM증권(20.86%), 하나증권(18.72%) 순이었고, IRP는 iM증권(20.28%), 하나증권(18.5%), 유안타증권(17.73%) 순이었다. 증권사 1년 수익률 밴드는 DC 11~21%대, IRP 10~20%대로 2분기(DC 34~66%대, IRP 37~54%대)보다 크게 낮아졌다. 전체 퇴직연금 적립금은 9월 말 542조1214억원으로 6월 말보다 11조7500억원가량 줄었다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-10-22", "url": "https://www.fntimes.com/html/view.php?ud=202610221053493259179ad43907_18", "related": [{"title": "증권사 퇴직연금 석 달 새 5조 '썰물'…연말 반등 요인 주목", "source": "아시아투데이", "url": "https://www.asiatoday.co.kr/kn/view.php?key=20261019010006167"}, {"title": "증시 급락에 꺾인 연금 랠리…증권사 퇴직연금 5조 ‘증발’", "source": "대한경제", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610201546120600359"}]}, {"id": "0369d6c3118c", "title": "퇴직연금 223조원 쌓인 5대은행…국민·하나 2위 각축전", "summary": "5대 시중은행의 3분기 말 퇴직연금 적립금은 222조9427억원으로 집계됐다. 신한은행이 57조2252억원으로 1위이고 KB국민은행 52조2226억원, 하나은행 52조1554억원, 우리은행 33조243억원, NH농협은행 28조3152억원 순이다. KB국민은행과 하나은행의 격차는 672억원으로, 2분기 말 3152억원에서 크게 좁혀져 지난해 말 725억원 수준으로 돌아왔다. 올해 누적 증가액은 하나은행 3조7741억원, KB국민은행 3조7688억원으로 53억원 차이다.", "category": "업계·경쟁사", "importance": 4, "source": "이데일리", "published": "2026-10-19", "url": "https://www.edaily.co.kr/News/Read?newsId=03496486645614560&mediaCodeNo=257", "related": [{"title": "퇴직연금 2위 경쟁 격화…하나은행·국민은행 적립금 격차 672억원", "source": "CEO스코어데일리", "url": "https://www.ceoscoredaily.com/page/view/2026102015471625110"}]}, {"id": "e63418b95bc2", "title": "퇴직연금 첫 분기 1882억 확보한 키움증권, IRP 쏠림 해소 과제 남겨", "summary": "키움증권의 3분기 퇴직연금 적립금은 1882억원으로 전 분기(649억원)보다 190% 증가했다. 적립금 확대는 IRP가 주도해 IRP 적립금이 1626억원, 전체 적립금 중 비중이 86.4%에 달했다. DB와 DC 적립금은 각각 150억원, 106억원으로 합산 256억원(13.6%)에 그쳤다. 연말 적립금 목표 5000억원 대비 3분기 말 달성률은 37.6%로, 목표를 달성하려면 4분기에 3118억원을 추가로 확보해야 한다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-10-23", "url": "https://www.ceoscoredaily.com/page/view/2026102215213434763", "related": []}, {"id": "dd6d3c9783e7", "title": "[퇴직연금 개편]與 기금형 퇴직연금 입법 속도…‘운용주체’ 쟁점", "summary": "이용우 더불어민주당 의원이 국민연금공단 등 공적연금관리기관의 퇴직연금 운용 참여를 허용하는 근로자퇴직급여 보장법 개정안을 대표발의했다. 개정안은 기금형을 금융기관개방형, 연합형, 공공기관개방형, 중소기업퇴직연금기금 등 4가지 유형으로 분류했다. 한정애 의원안은 노사가 참여하는 비영리 수탁법인을 중심으로 적립금 3000억원 이상 또는 가입자 3만명 이상 사업장 등에 기금형을 허용하는 모델이다. 안도걸 의원안은 민간 전문운용사 간 경쟁에 방점을 찍고 30인 이하 사업장 중심의 기금형을 전체 사업장으로 확대하며 가입자가 2년 단위로 기금을 옮길 수 있도록 했다.", "category": "제도·규제", "importance": 4, "source": "대한경제", "published": "2026-10-23", "url": "https://www.dnews.co.kr/uhtml/view.jsp?idxno=202610221712341290810", "related": []}, {"id": "b4cc17311e1b", "title": "[포커스] 신한銀, 투자형 퇴직연금 2.6배 성장…연금 우선순위 '자산관리'로", "summary": "금융감독원 통합연금포털 공시에 따르면 신한은행의 원리금비보장 퇴직연금 적립금은 2024년 말 7조 1462억 원에서 올해 3분기 말 18조 6740억 원으로 161.3% 증가했다. 전체 적립금 대비 투자형 비중은 15.6%에서 32.6%로 확대돼 5대 은행 중 가장 높았고, 하나은행 31.6%, KB국민은행 30.8%, 우리은행 28.4%, NH농협은행 19.9%가 뒤를 이었다. 투자형 적립금의 95.3%는 DC형과 개인형 IRP에 집중됐다. 다만 3분기 전체 적립금은 2분기 말 58조 8888억 원에서 57조 2252억 원으로 1조 6636억 원 줄었으며, 신한은행은 9월 퇴직연금 ETF 당일매매 서비스를 도입하는 등 운용 서비스를 강화하고 있다.", "category": "업계·경쟁사", "importance": 4, "source": "오늘경제", "published": "2026-10-22", "url": "https://www.startuptoday.co.kr/news/articleView.html?idxno=816680", "related": []}, {"id": "6ad89726ed11", "title": "[단독]수익률 8%라던 중기 퇴직연금, 원금손실 1년간 급증", "summary": "이종배 의원실이 근로복지공단에서 받은 자료에 따르면 중소기업퇴직연금기금(푸른씨앗)에서 납입 원금보다 적게 받은 근로자는 지난해 177명에서 올해 8월까지 988명으로 늘었고 손실액은 600만원에서 9500만원으로 증가했다. 공단은 지난해 기금 운용수익률 8.67%를 기록했지만, 자산의 70% 내외를 채권 중심으로 운용해 올해 채권금리 상승과 환율 하락으로 손실이 발생했다고 설명했다. 노동부의 첫 종합평가에서는 전체 퇴직급여 지급 건수 중 7450건(12%)이 지급기한을 초과한 것으로 나타났다. 푸른씨앗 가입자는 올해 8월 말 20만1875명, 누적 적립금은 1조9203억원이다.", "category": "법인·자금운용", "importance": 4, "source": "뉴시스", "published": "2026-10-22", "url": "https://www.newsis.com/view/NISX20261021_0003834796", "related": []}, {"id": "dc3b72343c0f", "title": "퇴직연금 부문별 1위 갈렸다…하나은행, 전체 증가액·DB형 적립 '톱'", "summary": "9월 말 하나은행의 퇴직연금 적립금은 52조1554억원으로 작년 말보다 3조7741억원(7.8%) 늘어 주요 6개 은행 가운데 증가액이 가장 컸다. 하나은행의 DB 적립금은 18조2417억원으로 6개 은행 중 가장 많았고, DC·IRP 증가액 4조3927억원이 DB 감소액 6186억원을 상쇄했다. 전체 적립금은 신한은행이 57조2252억원으로 1위, 국민은행이 52조2226억원으로 2위였으며 하나은행은 672억원 차이로 뒤를 이었다. IRP 적립금은 신한은행이 22조8540억원으로 가장 컸고, DC 적립금은 국민은행이 17조1151억원으로 신한은행보다 4301억원 많았다.", "category": "업계·경쟁사", "importance": 4, "source": "블로터", "published": "2026-10-22", "url": "https://www.bloter.net/news/articleView.html?idxno=676368", "related": []}, {"id": "c993f9732198", "title": "[투데이 Pick] 퇴직연금 1위 내준 신한은행…국민·하나·우리·기업도 초접전", "summary": "3분기 말 삼성생명의 퇴직연금 적립금은 57조5486억원으로 신한은행(57조2252억원)을 3234억원 앞서 전체 사업자 1위에 올랐다. 국민은행(52조2226억원)과 하나은행(52조1554억원)의 격차는 2분기 말 3152억원에서 672억원으로, 우리은행(33조243억원)과 기업은행(32조9898억원)의 격차는 5813억원에서 345억원으로 줄었다. 올해 누적으로는 하나은행이 3조7741억원, 국민은행이 3조7688억원 늘어 주요 은행 모두 지난해 말보다 적립금이 증가했다. IRP에서는 신한은행이 22조8540억원으로 1위를 유지했으나 국민은행(22조6099억원)과의 격차가 2441억원으로 좁혀졌다.", "category": "업계·경쟁사", "importance": 4, "source": "뉴스투데이", "published": "2026-10-21", "url": "https://www.news2day.co.kr/article/20261020500333", "related": []}, {"id": "6006be01159b", "title": "내 퇴직연금, 국민연금이 굴릴까…기금형 도입에 갈리는 운용 방식", "summary": "당정은 국정감사 이후 정부안과 여당 의원 법안을 통합해 기금형 퇴직연금 입법 논의를 본격화할 예정이나 운용 주체와 적용 범위는 아직 확정되지 않았다. 한정애 의원안은 적립금 3000억원 이상 또는 가입자 3만명 이상 사업장에 노사 공동 수탁법인을, 안도걸 의원안은 민간 전문운용사 간 경쟁을, 박홍배·안호영 의원안은 퇴직연금공단 설립을 담았다. 이용우 의원안은 국민연금공단 등 공적연금기관이 사업자로 참여하도록 하되 시장점유율을 시행 후 3년까지 10%, 4년째 20%, 5년째 30%로 제한했다. 공공기관 개방형 기금의 도입·운영 비용은 국가가 부담하도록 했다.", "category": "제도·규제", "importance": 4, "source": "데일리팝", "published": "2026-10-21", "url": "http://www.dailypop.kr/news/articleView.html?idxno=103463", "related": []}, {"id": "11d18d6258e3", "title": "주식·채권 동반 급락에… ‘알아서 굴려준다’던 TDF의 배신", "summary": "에프엔가이드에 따르면 설정액 10억원 이상 TDF의 최근 3개월 수익률은 -7.07%, 6개월 수익률은 -2.88%로 국내 혼합형 펀드(-5.01%, -2.00%)보다 부진했다. 최근 5년 수익률도 TDF는 28.07%로 국내 주식형 펀드(86.70%)와 혼합형 펀드(29.70%)에 못 미쳤다. 주식과 채권 가격이 동반 하락하면서 채권이 주식 하락을 방어하는 기능이 작동하지 않은 탓이다. TDF 순자산은 2020년 말 5조원 수준에서 10월 20일 기준 32조7000억원으로 늘었고 올해 증가분만 7조2000억원이 넘는다.", "category": "운용·상품", "importance": 4, "source": "조선비즈", "published": "2026-10-21", "url": "https://biz.chosun.com/stock/stock_general/2026/10/21/IQNNSP3Z2NHLJFSXM7CGVI2PDQ/", "related": []}, {"id": "b4b11f82c66f", "title": "[단독]'2兆 규모' 中企퇴직연기금…운용기관 차등배분 2년째 0%대", "summary": "2022년 도입된 공적 기금형 퇴직연금인 중소기업퇴직연금기금(푸른씨앗) 적립금이 지난달 기준 1조9524억원으로, 이달 2조원을 넘길 전망이다. 김위상 의원실이 받은 근로복지공단 자료에 따르면 올해 2분기부터 내년 1분기까지 전담운용기관별 자금 배분 비율은 삼성자산운용 50.72%, 미래에셋증권 49.28%다. 공단은 실적 평가에 따라 배분을 차등화해 경쟁 효과를 높이겠다고 했지만 차등 폭은 작년 0.52%에 이어 올해도 1% 미만에 그쳤다. 내년에는 가입 대상이 50인 미만에서 100인 미만 사업장으로 확대된다.", "category": "법인·자금운용", "importance": 4, "source": "아시아경제", "published": "2026-10-21", "url": "https://www.asiae.co.kr/article/2026102110102108016", "related": []}, {"id": "006abacaa5b3", "title": "증시 폭락에 4.7조 날린 연금…삼성·한투·키움은 DC형 선방", "summary": "증권사 15곳의 3분기 퇴직연금 적립금이 4조7533억원, 2.9% 줄었다. 증시 하락으로 펀드와 ETF 평가액이 떨어진 영향이다. DC형은 삼성증권이 11조5556억원으로 2519억원(2.2%), 한국투자증권이 8조387억원으로 918억원(1.2%) 늘며 버텼고, 모바일 연금자산 관리 편의성과 수수료 부담 완화가 배경으로 꼽혔다. 6월 퇴직연금 사업에 진출한 키움증권은 DC형이 106억원으로 늘었고 IRP에서 977억원, 150.5% 증가했다.", "category": "업계·경쟁사", "importance": 4, "source": "파이낸셜투데이", "published": "2026-10-20", "url": "http://www.ftoday.co.kr/news/articleView.html?idxno=367677", "related": []}, {"id": "71aabe035e66", "tit /10912175?ref=naver"}]}, {"id": "0369d6c3118c", "title": "퇴직연금 223조원 쌓인 5대은행…국민·하나 2위 각축전", "summary": "5대 시중은행의 3분기 말 퇴직연금 적립금은 222조9427억원으로 집계됐다. 신한은행이 57조2252억원으로 1위이고 KB국민은행 52조2226억원, 하나은행 52조1554억원, 우리은행 33조243억원, NH농협은행 28조3152억원 순이다. KB국민은행과 하나은행의 격차는 672억원으로, 2분기 말 3152억원에서 크게 좁혀져 지난해 말 725억원 수준으로 돌아왔다. 올해 누적 증가액은 하나은행 3조7741억원, KB국민은행 3조7688억원으로 53억원 차이다.", "category": "업계·경쟁사", "importance": 4, "source": "이데일리", "published": "2026-10-19", "url": "https://www.edaily.co.kr/News/Read?newsId=03496486645614560&mediaCodeNo=257", "related": [{"title": "퇴직연금 2위 경쟁 격화…하나은행·국민은행 적립금 격차 672억원", "source": "CEO스코어데일리", "url": "https://www.ceoscoredaily.com/page/view/2026102015471625110"}]}, {"id": "6c986a5b1bb4", "title": "한국투자증권, 기업 대상 ‘퇴직연금 아카데미’ 개최…제도 변화 대응 전략 제시", "summary": "한국투자증권은 지난 8일 서울 여의도 TP타워에서 기업 인사·재무 담당자 등 퇴직연금 실무자를 대상으로 ‘퇴직연금 아카데미’를 개최했다. 행사는 근로자퇴직급여 보장법 개정 추진에 맞춰 기금형 퇴직연금 도입과 퇴직급여 사외적립 의무화 등 현안을 중심으로 3개 세션으로 진행됐다. 기금형 도입에 따른 운용 효율성 제고 방안과 사외적립 의무화 대비 실무 가이드라인, 정년연장·임금피크제 운영 전략, 전담 RM 활용 방안 등이 소개됐다. 김도현 개인고객그룹장은 기업들이 제도 변화에 선제적으로 대응할 수 있도록 맞춤형 컨설팅과 실무 지원을 강화하겠다고 말했다.", "category": "법인·자금운용", "importance": 3, "source": "비즈월드", "published": "2026-10-13", "url": "http://www.bizwnews.com/news/articleView.html?idxno=148655", "related": [{"title": "한국투자증권, 퇴직연금 500조 기업시장 공략…인사·재무 담당자 접점 확대", "source": "토요경제", "url": "https://sateconomy.co.kr/news/view/1065574639722076"}, {"title": "한국투자증권, 기업 실무진 대상 '퇴직연금 아카데미' 개최", "source": "뉴스드림", "url": "http://www.newsdream.kr/news/articleView.html?idxno=119732"}, {"title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "source": "아시아경제", "url": "https://view.asiae.co.kr/article/2026101209461462366"}, {"title": "한국투자증권, 기업 대상 '퇴직연금 아카데미' 개최", "source": "머니투데이", "url": "https://www.mt.co.kr/stock/2026/10/12/2026101210195750915"}]}, {"id": "7ef94cfb1aa4", "title": "[경제 트렌드] 증권사, 퇴직연금 규모 급증...한국투자증권, 연금 적립·운용·수령까지 은퇴 준비 전 과정 밀착 지원", "summary": "퇴직연금 적립금은 지난 8월 기준 550조원을 웃돌았고 실적배당형 비중은 35%를 기록했으며, 증권사 퇴직연금 규모는 2025년 말 141조6797억원으로 전 금융권 적립금의 29.3%를 차지했다. 증권사 적립금 순위는 미래에셋증권, 삼성증권, 한국투자증권, 현대차증권, NH투자증권 순이다. 한국투자증권은 연금 MTS를 개편해 '나의 총 연금자산'과 개인화 맞춤 알림 기능을 도입했고, 신규 DC 가입자 평균 연령이 2015년 40세에서 2025년 36세로 낮아졌다고 밝혔다. 신한투자증권은 올해 연금고객관리팀을 신설해 신규 DC·IRP 가입 고객 대상 웰컴콜과 연금PB 1대1 매칭, 'Premier 연금컨설팅'을 운영하고 있다.", "category": "업계·경쟁사", "importance": 3, "source": "시사캐스트", "published": "2026-10-08", "url": "http://www.sisacast.kr/news/articleView.html?idxno=100731", "related": [{"title": "한국투자증권, 연금 MTS 개편…“적립·운용·수령까지 밀착 지원”", "source": "더퍼블릭", "url": "https://www.thepublic.kr/news/articleView.html?idxno=321335"}, {"title": "한국투자증권, 연금 MTS 개편 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31774"}]}, {"id": "ee6cf0e31b06", "title": "“부유한 노인도 받는다”…기초연금 ‘하위 70%’ 기준 개편 추진", "summary": "정부가 기초연금 수급 대상을 현행 노인 소득 하위 70% 방식에서 기준중위소득과 연계하는 방식으로 개편할 계획이다. 내년에는 소득 하위 30%의 기준연금액을 월 35만원에서 38만원으로 올리고 차등 지급을 적용한다. 다만 이 조치의 노인빈곤율 개선 효과는 0.3%포인트에 그친다. 정부는 저소득 노인의 급여 인상에 집중하기 위해 장기적으로 수급 구조를 개편할 방침이다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-03", "url": "https://www.segye.com/newsView/20261002510945?OutUrl=naver", "related": [{"title": "이재명 정부, 기초연금 개혁 회피해선 안 된다", "source": "시사IN", "url": "https://www.sisain.co.kr/news/articleView.html?idxno=58534"}, {"title": "기초연금 '소득 하위 70%' 기준 바꾼다…중위소득 연계 재추진", "source": "뉴스1", "url": "https://www.news1.kr/economy/trend/6308073"}]}, {"id": "6da1ff9b2cf1", "title": "'2164억 체불' 대유위니아…3년 연속 퇴직연금 적립 미달", "summary": "대유위니아 계열 가전 3사(위니아·위니아전자·위니아전자MF)가 2022년부터 2024년까지 3년 연속 DB형 퇴직연금 법정 최소적립금을 채우지 못한 것으로 김주영 의원이 고용노동부에서 받은 자료에서 나타났다. 위니아전자의 최소적립금 대비 실제 적립 비율은 2022년 5.86%, 2023년 5.88%, 2024년 5.68%였고 위니아전자MF는 같은 기간 14.11%에서 9.45%로 떨어졌다. 2022년부터 지난달 3일까지 3사의 전체 체불액은 2164억원이며 이 중 체불 퇴직금은 858억원이다. 고용노동부가 이들 계열사에 관련 과태료를 부과한 사례는 없었다.", "category": "법인·자금운용", "importance": 3, "source": "뉴시스", "published": "2026-10-10", "url": "https://www.newsis.com/view/NISX20261010_0003820502", "related": [{"title": "대유위니아 가전 3사, 퇴직연금 법정 적립금 3년 연속 미달",  비중은 가장 높은 수치로, IRP 적립금이 166조3580억원까지 늘며 자금 이동을 이끌었다. NH농협은행은 지난 7월 퇴직연금 ETF 22개 상품을 출시한 데 이어 오는 10월 36개 상품을 추가로 선보일 예정이며 타임폴리오자산운용 ETF도 새로 제공한다. 하나은행은 지난 5월 퇴직연금 비대면 ETF 거래 서비스를 개편했고 국민은행은 지난달부터 ETF 매도 당일 재매수가 가능하도록 시스템을 바꿨다.", "category": "업계·경쟁사", "importance": 4, "source": "CEO스코어데일리", "published": "2026-09-19", "url": "https://www.ceoscoredaily.com/page/view/2026091616220543814", "related": [{"title": "NH농협은행, 퇴직연금 운용 선택지 넓힌다", "source": "퍼블릭타임스", "url": "https://www.public25.com/news/articleView.html?idxno=54796"}, {"title": "[맥락읽기] 퇴직연금 상품 늘리는 농협은행…'상품 공급'에서 '운용 지원'으로", "source": "데일리팝", "url": "http://www.dailypop.kr/news/articleView.html?idxno=102605"}, {"title": "\"보수적 운용 벗고 수익률 띄운다\"…NH농협은행, 퇴직연금 체계 대개편", "source": "더페어", "url": "https://www.thefairnews.co.kr/news/articleView.html?idxno=88073"}]}, {"id": "4bbbd1457f44", "title": "퇴직연금 판도 재역전…삼성생명 반년 만에 선두 탈환", "summary": "금융감독원 퇴직연금 비교공시에 따르면 3분기말 삼성생명의 퇴직연금 적립금은 57조5486억원으로 전분기보다 1523억원 늘어, 1조6636억원 줄어든 신한은행(57조2252억원)을 3234억원 차이로 앞서 1·2분기에 내준 선두 자리를 되찾았다. 삼성생명은 DB형 적립금 43조9970억원 중 원리금보장형이 35조원 수준이어서 증시 하락기에 적립금을 방어했고, 계열사 DB형 7074억원·DC형 461억원 증가도 영향을 미쳤다. 반면 국민은행 1조2587억원, 하나은행 1조107억원, 미래에셋증권 2조1176억원 등 주요 사업자의 적립금은 일제히 줄었다. 기사는 3분기 코스피가 19% 넘게 하락하며 실적배당형 상품 평가액이 감소한 영향으로 분석했다.", "category": "업계·경쟁사", "importance": 4, "source": "아시아타임즈", "published": "2026-10-25", "url": "https://www.asiatime.co.kr/article/20261020500369", "related": [{"title": "삼성생명 퇴직연금 1위 탈환, 계열사 자금 '의존'했나", "source": "세이프타임즈", "url": "https://www.safetimes.co.kr/news/articleView.html?idxno=246652"}, {"title": "삼성생명, 퇴직연금 1위 되찾았다…\"증시 하락기 DB형이 버팀목\"", "source": "글로벌에픽", "url": "https://www.globalepic.co.kr/view.php?ud=2026102108361868587cc35ccc5c_29"}]}, {"id": "e2120a500d3a", "title": "한국투자증권, 퇴직연금 DC·IRP 적립금 44.8%↑… 성장률 1위", "summary": "한국투자증권의 3분기 말 퇴직연금 DC·IRP 적립금이 18조5160억원으로 집계됐다. 지난해 말보다 5조7292억원, 44.8% 늘어 전체 퇴직연금 사업자 가운데 증가율 1위다. 회사는 연금 가입자들이 실질적인 자산관리 역량과 검증된 수익률을 갖춘 금융사로 자금을 옮기는 흐름이 뚜렷해지고 있다고 설명했다.", "category": "업계·경쟁사", 9"}, {"title": "국민연금이 퇴직연금 운용하면 정말 수익률 오를까", "source": "EBN", "url": "https://www.ebn.co.kr/news/articleView.html?idxno=1723772"}]}, {"id": "f7dd52881b24", "title": "833만원 내고 1억 넘게 받았다…국민연금 13배 격차의 비밀", "summary": "국민의힘 최보윤 의원이 국민연금공단에서 받은 자료에 따르면 납부액 1000만원 이하이면서 누적 수령액이 1억원을 넘은 수급자는 1만9972명으로, 평균 833만원을 내고 1억1190만원을 받아 13.4배에 달했다. 격차는 제도 도입 초기의 3% 보험료율과 70% 명목소득대체율, 5년 가입 특례 등에서 비롯됐다. 2025년 연금개혁으로 보험료율은 올해 9.5%로 올랐고 매년 0.5%포인트씩 인상돼 2033년 13%에 도달하며, 명목소득대체율은 43%로 상향됐다. 국회예산정책처 전망에 따르면 현행 제도 유지 시 적립기금은 2069년 소진될 것으로 추정됐다.", "category": "가입자·사회", "importance": 3, "source": "세계일보", "published": "2026-10-14", "url": "https://www.segye.com/newsView/20261014502283", "related": [{"title": "[단독]833만원 내고 1억 넘게 수령…국민연금 '10배 수급자' 2만명", "source": "뉴시스", "url": "https://www.newsis.com/view/NISX20261012_0003822478"}, {"title": "[이슈 직썰] 국민연금 833만원 내고 1억 탔다…초기 세대 '13배 환급'의 그늘", "source": "직썰", "url": "https://www.ziksir.com/news/articleView.html?idxno=149415"}, {"title": "국민연금 ‘10배 장사’ 2만명 육박… 833만원 내고 1억 넘게 수령", "source": "국민일보", "url": "https://www.kmib.co.kr/article/view.asp?arcid=9000022005&cp=nv"}]}, {"id": "062a5792727f", "title": "[사설] 미래 세대에 부담 떠넘기는 기초연금, 개혁 미뤄서는 안 된다", "summary": "보건복지부가 지난 7월 청와대 업무보고에서 하후상박 원칙 아래 기초연금 지급 기준을 변경하는 개편안을 만들고 있다고 밝혔으나 정부 차원에서는 무산되고 공이 국회로 넘어갔다. 복지부는 8월 26일과 27일 두 차례 기초연금 개편안 사업설명회를 잡았다가 이유를 밝히지 않고 돌연 취소했다. 현재 기초연금은 65세 이상 노인 중 소득 하위 70%에게 소득 수준과 무관하게 월 34만여 원이 지급되며, 중위소득의 96.3%에 해당하는 노인도 받고 있다. 한국보건사회연구원 연구진은 보건복지포럼 2026년 9월호를 통해 한정된 재원을 빈곤 정도가 심한 노인에게 집중하는 하후상박 방식의 개편을 제안했다.", "category": "가입자·사회", "importance": 3, "source": "디지털데일리", "published": "2026-09-22", "url": "https://www.ddaily.co.kr/page/view/2026092116281535595", "related": [{"title": "\"노인빈곤, 하후상박 기초연금 개편-노인일자리 연계로 대응해야\"", "source": "이투데이", "url": "https://www.etoday.co.kr/news/view/2627301"}, {"title": "국책硏도 기초연금 하후상박 개편 제안…더 미룰 수 없는 과제 [사설]", "source": "매일경제", "url": "https://www.mk.co.kr/article/12157544"}, {"title": "노인 3명 중 1명 빈곤…\"기초연금 하후상박·일자리 연계해야\"", "source": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20260918117300530?input=1195m"}]}, {"id": "0c92afa1e3be", "title": "70대 200만 명이 일하는 나라 [과로노인]②", "summary": "국가데이터처에 따르면 지난해 70세 이상 취업자는 216만2000명으로 1년 전보다 9.2% 늘어 별도 집계를 시작한 2018년 이후 처음으로 200만 명을 넘었다. 남성이 111만3000명, 여성이 104만9000명으로 여성 취업자가 100만 명을 넘은 것도 처음이다. 70세 이상 남성 취업자의 52.5%가 농림어업과 보건·사회복지서비스업, 시설관리업에 종사했고, 여성은 10명 중 7명이 보건·사회복지서비스업과 농림어업, 공공행정에서 일했다. 강모열 가톨릭대 교수는 고령 노동자가 같은 일을 해도 신체 능력의 80~90%까지 써야 하는 상황이 생긴다고 말했다.", "category": "가입자·사회", "importance": 3, "source": "KBS", "published": "2026-09-29", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8673299", "related": [{"title": "“국민연금? 우린 못 받아요”…연금도 비껴간 70~80대 [과로노인]③", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8674164&ref=A"}, {"title": "77세 노인이 하루 400km 운전하는 이유는? [과로노인]①", "source": "KBS", "url": "https://news.kbs.co.kr/news/pc/view/view.do?ncd=8670831"}]}, {"id": "ab421415ed6d", "title": "\"ETF 교체매매 10분 만에 끝\"…신한은행, 퇴직연금 '당일 재투자' 길 텄다", "summary": "신한은행은 확정기여형(DC)과 개인형퇴직연금(IRP) 가입자를 대상으로 보유 ETF를 매도한 당일 그 매도대금으로 다른 ETF를 매수할 수 있는 '퇴직연금 ETF 당일매매 서비스'를 시행한다고 21일 밝혔다. 매도 체결 정보가 최소 2분에서 최대 10분 이내에 잔고로 연동돼 당일 교체 매매가 가능해졌다. 은행권 최초로 매도 체결 직후 화면 이동 없이 매수 단계로 넘어가는 '이어 거래하기'를 도입했고, ETF와 예금·원리금보장형 상품·공모펀드·TDF 간 교체가 가능한 복합매매 기능도 함께 지원한다. 신한은행의 퇴직연금 적립금은 올해 2분기 말 기준 58조8888억원으로 전체 사업자 중 1위다.", "category": "업계·경쟁사", "importance": 4, "source": "글로벌에픽", "published": "2026-09-21", "url": "http://www.globalepic.co.kr/view.php?ud=2026092110245357287cc35ccc5c_29", "related": [{"title": "NH농협은행, 'NH전남광주통합특별시 동행예금' 2차 특판 출시 外", "source": "리얼캐스트", "url": "https://www.rcast.co.kr/news/articleView.html?idxno=31669"}, {"title": "[단신]KB국민카드, 포인트리 지역화폐 전환 확대 外", "source": "동아일보", "url": "https://www.donga.com/news/Economy/article/all/20260921/134712493/2"}, {"title": "[이코노 브리핑] 신한銀, 퇴직연금 ETF 당일 매매 시행 외", "source": "세계일보", "url": "https://www.segye.com/newsView/20260921516039"}]}, {"id": "e222d9863df8", "title": "[단독] 증권업계 '장기투자 상품' 제안했는데 결과는 '삼전닉스 레버리지'…野 \"김용범 제안 가능성\"", "summary": "국민의힘 박대출 의원실이 확보한 금융투자협회 자료에 따르면 금융투자업계 임원들은 지난 1월 13일 김용범 당시 청와대 정책실장이 연 자본시장 비공개 간담회에 서면 제안서를 제출했다. 한국투자증권과 삼성자산운용, 삼성증권은 퇴직연금 자금 활성화를, 한국투자신탁운용은 퇴직연금 주식투자 비과세를, 금융투자협회는 퇴직연금 자금 활성화와 디폴트옵션 개선을 각각 담았다. 제안서에는 단일종목 레버리지 ETF 도입에 관한 내용이 없었으나 간담회 이후 해당 상품 16종이 출시됐다. 박 의원은 김용범 전 정책실장이 먼저 제안했을 가능성이 있다며 추진 경위를 밝혀야 한다고 지적했다.", "category": "제도·규제", "importance": 4, "source": "TV조선", "published": "2026-09-16", "url": "https://news.tvchosun.com/site/data/html_dir/2026/09/16/2026091690084.html", "related": [{"title": "[단종레 국부유출 백서] 김용범 주재한 1월 13일 간담회에 주목…국정감사 필요", "source": "딜사이트", "url": "https://dealsite.co.kr/articles/169156"}]}, {"id": "bc72fd92b712", "title": "퇴직연금 DC→타사 IRP 실물이전 허용 추진…내년 시행 목표", "summary": "금융감독원이 확정기여형(DC) 퇴직연금에서 다른 금융회사의 IRP로 보유 상품을 그대로 옮기는 실물이전 서비스를 확대하기로 했다. 환매중단펀드도 이전 대상에 포함하는 방안을 함께 추진한다. 9월까지 개선안을 확정하고 10월부터 전산 개발에 착수한다. 2027년까지 시스템 개발을 마치는 것이 목표다.", "category": "제도·규제", "importance": 5, "source": "뉴스핌", "published": "2026-08-24", "url": "https://www.newspim.com/news/view/20260824000157", "related": []}, {"id": "051366fec671", "title": "퇴직연금 기금화 동상이몽…자리 찾는 국민연금에 우려하는 증권업계", "summary": "퇴직연금 기금화를 앞두고 국민연금공단의 참여 범위를 둘러싼 갈등이 심화되고 있다. 국민연금은 공적 연기금 운용 경험으로 수익률을 높이겠다는 입장이지만, 증권사들은 민간 기금 간 경쟁을 촉진하려던 제도 취지가 퇴색될 수 있다고 우려한다. 국민연금의 역할이 중소기업 대상에서 공공기관, 나아가 OCIO 시장으로 확대되는 흐름이 핵심 쟁점이다. 기금형의 성패는 국민연금과 민간 금융회사의 역할 구분과 경쟁 조건을 명확히 하는 데 달렸다는 분석이다.", "category": "법인·자금운용", "importance": 4, "source": "인베스트조선", "published": "2026-08-04", "url": "https://www.investchosun.com/site/data/html_dir/2026/08/04/2026080480061.html", "related": []}, {"id": "4452b9f663e6", "title": "NH투자증권, DC·IRP 중장기 수익률 업계 1위…증권 적립금 점유율 30% 시대", "summary": "NH투자증권이 2분기 기준 DC·IRP 실적배당형 5년 수익률에서 증권업 최고 성과를 기록했다. IRP 10년 수익률은 10.35%로 은행·보험을 포함한 전체 연금사업자 중 1위다. 증권사 퇴직연금 적립금은 164조원대로 늘어 점유율 29.7%에 도달했다. 연금계좌에서 ETF를 활용하려는 수요 증가가 배경으로 꼽힌다.", "category": "업계·경쟁사", "importance": 4, "source": "한국금융신문", "published": "2026-07-23", "url": "https://v.daum.net/v/qVbU62KpCv", "related": []}, {"id": "cb2b6b3e9b24", "title": "기금형 퇴직연금, 7월 말 밑그림 나온다…연내 입법도 속도낼 듯", "summary": "퇴직연금 기금화 논의가 7월 말 제도 설계안 마련을 목표로 속도를 내고 있다. 실무작업반이 매주 회의를 열어 도입 과정에서 제기될 쟁점을 조율 중이다. 2월 노사정 태스크포스가 퇴직급여 사외적립 의무화와 기금형 활성화에 합의한 데 따른 후속 작업이다. 정부는 연내 입법까지 밀어붙일 계획이다.", "category": "제도·규제", "importance": 4, "source": "인베스트조선", "published": "2026-06-18", "url": "https://www.investchosun.com/site/data/html_dir/2026/06/18/2026061880144.html", "related": []}]}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);

  var PERIODS = [
    { key: 'daily', name: '일간', span: '1일' },
    { key: 'weekly', name: '주간', span: '1주' },
    { key: 'monthly', name: '월간', span: '1개월' },
    { key: 'yearly', name: '연간', span: '1년' }
  ];
  var CATEGORIES = ['제도·규제', '업계·경쟁사', '운용·상품', '법인·자금운용', '가입자·사회'];
  var WEEKDAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var currentPeriod = 'daily';
  var currentCategory = null;

  var tabsEl = document.getElementById('tabs');
  var filtersEl = document.getElementById('filters');
  var listEl = document.getElementById('list');
  var metaEl = document.getElementById('meta');
  var searchEl = document.getElementById('q');

  var query = '';

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function parseDay(iso) {
    var parts = String(iso).split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
  }

  /** 기준일은 일간 문서의 날짜다. 없으면 화면을 만든 날. */
  function referenceDay() {
    var daily = DATA.periods.daily;
    if (daily && /^\d{4}-\d{2}-\d{2}$/.test(daily.key)) return parseDay(daily.key);
    return parseDay(DATA.built_at.slice(0, 10));
  }

  var TODAY = referenceDay();

  /** 기준일로부터 며칠 전인지를 사람 말로. 일주일이 넘으면 날짜로. */
  function relativeDay(published) {
    var days = Math.round((TODAY - parseDay(published)) / 86400000);
    if (days <= 0) return { text: '오늘', fresh: true };
    if (days === 1) return { text: '어제', fresh: true };
    if (days < 7) return { text: days + '일 전', fresh: false };
    var d = parseDay(published);
    return { text: (d.getMonth() + 1) + '월 ' + d.getDate() + '일', fresh: false };
  }

  /* 게이트는 07:00~20:00만 돈다. 밤사이 11시간은 정상적으로 묵으므로
     그보다 넉넉히 잡아야 매일 아침 헛경보가 뜨지 않는다. */
  var STALE_HOURS = 14;

  function agoText(hours) {
    if (hours < 1) return '방금';
    if (hours < 24) return Math.floor(hours) + '시간 전';
    return Math.floor(hours / 24) + '일 전';
  }

  function stampText(d) {
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
         + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** 마지막 갱신이 얼마나 묵었는지. 읽을 수 없으면 null. */
  function builtAge() {
    var built = new Date(DATA.built_at);
    if (isNaN(built.getTime())) return null;
    return { at: built, hours: (Date.now() - built.getTime()) / 3600000 };
  }

  function buildStaleNotice() {
    var age = builtAge();
    var el = document.getElementById('stale');
    // 읽을 수 없는 값으로 헛경보를 내지 않는다.
    if (age === null || age.hours <= STALE_HOURS) {
      el.hidden = true;
      return;
    }
    el.textContent = '갱신이 멈춘 것 같습니다. 마지막 갱신 '
      + stampText(age.at) + ' (' + agoText(age.hours) + ')';
    el.hidden = false;
  }

  function buildHero() {
    var d = TODAY;
    var pad = function (n) { return n < 10 ? '0' + n : String(n); };
    document.getElementById('hero-date').textContent =
      pad(d.getMonth() + 1) + '.' + pad(d.getDate());
    document.getElementById('hero-sub').innerHTML = '';
    document.getElementById('hero-sub').append(
      WEEKDAYS[d.getDay()],
      Object.assign(document.createElement('span'), { className: 'dot', textContent: '·' }),
      d.getFullYear() + '년 기준'
    );
    var age = builtAge();
    document.getElementById('footer').textContent = age === null
      ? '화면 갱신 ' + DATA.built_at
      : '화면 갱신 ' + stampText(age.at) + ' · ' + agoText(age.hours);
  }

  function buildTabs() {
    PERIODS.forEach(function (period) {
      var button = el('button');
      button.setAttribute('aria-selected', String(period.key === currentPeriod));
      button.appendChild(el('span', 'name', period.name));
      button.appendChild(el('span', 'span', period.span));
      button.addEventListener('click', function () {
        currentPeriod = period.key;
        render();
      });
      tabsEl.appendChild(button);
    });
  }

  function buildFilters() {
    [null].concat(CATEGORIES).forEach(function (category) {
      var button = el('button', null, category === null ? '전체' : category);
      button.setAttribute('aria-pressed', String(category === currentCategory));
      button.addEventListener('click', function () {
        currentCategory = category;
        render();
      });
      filtersEl.appendChild(button);
    });
  }

  function articleNode(item, rank) {
    var node = el('article');
    node.setAttribute('data-cat', String(CATEGORIES.indexOf(item.category) + 1));

    node.appendChild(el('div', 'rank', String(rank)));

    var head = el('div', 'head');
    head.appendChild(el('span', 'badge', item.category));
    var when = relativeDay(item.published);
    var whenEl = el('span', 'when', when.text);
    whenEl.setAttribute('data-fresh', String(when.fresh));
    head.appendChild(whenEl);
    node.appendChild(head);

    node.appendChild(el('h2', null, item.title));
    node.appendChild(el('p', 'summary', item.summary));

    var source = el('div', 'source');
    source.appendChild(el('span', null, item.source));
    var link = el('a', null, '원문 보기 →');
    link.href = item.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    source.appendChild(link);
    node.appendChild(source);

    var related = item.related || [];
    if (related.length > 0) {
      var details = el('details');
      details.appendChild(el('summary', null, '관련 기사 ' + related.length + '건'));
      var list = el('ul');
      related.forEach(function (rel) {
        var li = el('li');
        var relLink = el('a', null, rel.title);
        relLink.href = rel.url;
        relLink.target = '_blank';
        relLink.rel = 'noopener noreferrer';
        li.appendChild(relLink);
        li.append(' — ' + rel.source);
        list.appendChild(li);
      });
      details.appendChild(list);
      node.appendChild(details);
    }
    return node;
  }

  /** 접혀 있는 관련 기사까지 훑는다. 묶여서 숨은 기사를 '없다'고 하면 안 된다. */
  function matches(item, needle) {
    var hay = [item.title, item.summary, item.source];
    (item.related || []).forEach(function (rel) { hay.push(rel.title, rel.source); });
    return hay.some(function (text) {
      return String(text).toLowerCase().indexOf(needle) !== -1;
    });
  }

  function clearSearch() {
    query = '';
    searchEl.value = '';
    render();
  }

  /** 검색 모드: 네 기간을 모두 훑어 기간별로 묶어 보여준다. */
  function renderSearch() {
    var needle = query.toLowerCase();
    var total = 0;

    PERIODS.forEach(function (period) {
      var doc = DATA.periods[period.key];
      if (!doc) return;

      var hits = [];
      doc.items.forEach(function (item, index) {
        var inCategory = currentCategory === null || item.category === currentCategory;
        if (inCategory && matches(item, needle)) hits.push({ item: item, rank: index + 1 });
      });
      if (hits.length === 0) return;

      total += hits.length;
      var head = el('h2', 'group', period.name);
      head.appendChild(el('span', 'group-range', doc.label));
      listEl.appendChild(head);
      hits.forEach(function (hit) {
        listEl.appendChild(articleNode(hit.item, hit.rank));
      });
    });

    metaEl.textContent = '검색 “' + query + '”   ·   ' + total + '건';
    var clear = el('button', 'clear', '검색 끄기 ✕');
    clear.type = 'button';
    clear.addEventListener('click', clearSearch);
    metaEl.appendChild(clear);

    if (total === 0) {
      listEl.appendChild(el('p', 'notice', '“' + query + '”에 해당하는 이슈가 없습니다.'));
    }
  }

  function render() {
    var doc = DATA.periods[currentPeriod];
    var searching = query !== '';

    Array.prototype.forEach.call(tabsEl.children, function (button, index) {
      var on = !searching && PERIODS[index].key === currentPeriod;
      button.setAttribute('aria-selected', String(on));
    });
    Array.prototype.forEach.call(filtersEl.children, function (button, index) {
      var category = index === 0 ? null : CATEGORIES[index - 1];
      button.setAttribute('aria-pressed', String(category === currentCategory));
    });

    metaEl.textContent = '';
    listEl.textContent = '';

    if (searching) {
      renderSearch();
      return;
    }

    var items = doc.items.filter(function (item) {
      return currentCategory === null || item.category === currentCategory;
    });

    metaEl.textContent = doc.label + '   ·   ' + items.length + '건';

    if (doc.shortfall_note) {
      listEl.appendChild(el('p', 'notice', doc.shortfall_note));
    }

    if (items.length === 0) {
      listEl.appendChild(el('p', 'notice', '이 조건에 해당하는 이슈가 없습니다.'));
      return;
    }

    items.forEach(function (item, index) {
      listEl.appendChild(articleNode(item, index + 1));
    });
  }

  searchEl.addEventListener('input', function () {
    query = searchEl.value.trim();
    render();
  });

  searchEl.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') clearSearch();
  });

  buildStaleNotice();
  buildHero();
  buildTabs();
  buildFilters();
  render();
})();
</script>
</body>
</html>
